- id: P1883.N1.1.1
  kind: note
  de: '"Diesem Gedanken", sage ich in der Vorrede zur englischen Übersetzung, "der nach meiner Ansicht berufen ist, für die Geschichtswissenschaft denselben Fortschritt zu begründen, den Darwins Theorie für die Naturwissenschaft begründet hat - diesem Gedanken hatten wir beide uns schon mehrere Jahre vor 1845 allmählich genähert.'
  en: '"This proposition," I wrote in the preface to the English translation, "which, in my opinion, is destined to do for history what Darwin''s theory has done for biology, we both of us, had been gradually approaching for some years before 1845.'
  modern: ''
  modern_status: empty
  notes: ''
  note_edition: Anmerkung von Engels zur deutschen Ausgabe von 1890
- id: P1883.N1.1.2
  kind: note
  de: Wieweit ich selbständig mich in dieser Richtung voranbewegt, zeigt meine 'Lage der arbeitenden Klasse in England'.
  en: How far I had independently progressed towards it is best shown by my Conditions of the Working Class in England.
  modern: ''
  modern_status: empty
  notes: ''
  note_edition: Anmerkung von Engels zur deutschen Ausgabe von 1890
- id: P1883.N1.1.3
  kind: note
  de: Als ich aber im Frühjahr 1845 Marx in Brüssel wiedertraf, hatte er ihn fertig ausgearbeitet und legte ihn mir vor in fast ebenso klaren Worten wie die, worin ich ihn oben zusammengefaßt."
  en: But when I again met Marx at Brussels, in spring 1845, he had it already worked out and put it before me in terms almost as clear as those in which I have stated it here."
  modern: ''
  modern_status: empty
  notes: ''
  note_edition: Anmerkung von Engels zur deutschen Ausgabe von 1890
