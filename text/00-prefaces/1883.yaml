- id: P1883.1.1
  kind: p
  de: Das Vorwort zur gegenwärtigen Ausgabe muß ich leider allein unterschreiben.
  en: The preface to the present edition I must, alas, sign alone.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '3'
- id: P1883.1.2
  kind: p
  de: Marx, der Mann, dem die gesamte Arbeiterklasse Europas und Amerikas mehr verdankt als irgendeinem andern - Marx ruht auf dem Friedhof zu Highgate, und über sein Grab wächst bereits das erste Gras.
  en: Marx, the man to whom the whole working class of Europe and America owes more than to any one else - rests at Highgate Cemetery and over his grave the first grass is already growing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '3'
- id: P1883.1.3
  kind: p
  de: Seit seinem Tode kann von einer Umarbeitung oder Ergänzung des "Manifestes" erst recht keine Rede mehr sein.
  en: Since his death [March 14, 1883], there can be even less thought of revising or supplementing the Manifesto.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '3'
- id: P1883.1.4
  kind: p
  de: Für um so nötiger halte ich es, hier nochmals das Folgende ausdrücklich festzustellen.
  en: 'But I consider it all the more necessary again to state the following expressly:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '3'
- id: P1883.2.1
  kind: p
  de: 'Der durchgehende Grundgedanke des "Manifestes": daß die ökonomische Produktion und die aus ihr mit Notwendigkeit folgende gesellschaftliche Gliederung einer jeden Geschichtsepoche die Grundlage bildet für die politische und intellektuelle Geschichte dieser Epoche; daß demgemäß (seit Auflösung des uralten Gemeinbesitzes an Grund und Boden) die ganze Geschichte eine Geschichte von Klassenkämpfen gewesen ist, Kämpfen zwischen ausgebeuteten und ausbeutenden, beherrschten und herrschenden Klassen auf verschiedenen Stufen der gesellschaftlichen Entwicklung; daß dieser Kampf aber jetzt eine Stufe erreicht hat, wo die ausgebeutete und unterdrückte Klasse (das Proletariat) sich nicht mehr von der sie ausbeutenden und unterdrückenden Klasse (der Bourgeoisie) befreien kann, ohne zugleich die ganze Gesellschaft für immer von Ausbeutung, Unterdrückung und Klassenkämpfen zu befreien - dieser Grundgedanke gehört einzig und ausschließlich Marx an.'
  en: The basic thought running through the Manifesto - that economic production, and the structure of society of every historical epoch necessarily arising therefrom, constitute the foundation for the political and intellectual history of that epoch; that consequently (ever since the dissolution of the primaeval communal ownership of land) all history has been a history of class struggles, of struggles between exploited and exploiting, between dominated and dominating classes at various stages of social evolution; that this struggle, however, has now reached a stage where the exploited and oppressed class (the proletariat) can no longer emancipate itself from the class which exploits and oppresses it (the bourgeoisie), without at the same time forever freeing the whole of society from exploitation, oppression, class struggles - this basic thought belongs solely and exclusively to Marx.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - P1883.N1
  mew_page: '3'
- id: P1883.3.1
  kind: p
  de: Ich habe das schon oft ausgesprochen; es ist aber gerade jetzt nötig, daß es auch vor dem "Manifest" selbst steht.
  en: I have already stated this many times; but precisely now is it necessary that it also stand in front of the Manifesto itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '4'
