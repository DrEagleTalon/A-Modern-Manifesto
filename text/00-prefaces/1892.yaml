verses:
- id: P1892.0.1
  kind: heading
  de: Vorwort [zur zweiten polnischen Ausgabe von 1892]
  en: Preface to The 1892 Polish Edition
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.1.1
  kind: p
  de: Die Tatsache, daß eine neue polnische Ausgabe des "Kommunistischen Manifests" notwendig geworden, gibt zu verschiedenen Betrachtungen Anlaß.
  en: The fact that a new Polish edition of the Communist Manifesto has become necessary gives rise to various thoughts.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: P1892.2.1
  kind: p
  de: Zuerst ist bemerkenswert, daß das "Manifest" neuerdings gewissermaßen zu einem Gradmesser geworden ist für die Entwicklung der großen Industrie auf dem europäischen Kontinent.
  en: First of all, it is noteworthy that of late the Manifesto has become an index, as it were, of the development of large-scale industry on the European continent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: P1892.2.2
  kind: p
  de: In dem Maß, wie in einem Lande die große Industrie sich ausdehnt, in dem Maß wächst auch unter den Arbeitern desselben Landes das Verlangen nach Aufklärung über ihre Stellung als Arbeiterklasse gegenüber den besitzenden Klassen, breitet sich unter ihnen die sozialistische Bewegung aus und steigt die Nachfrage nach dem "Manifest".
  en: In proportion as large-scale industry expands in a given country, the demand grows among the workers of that country for enlightenment regarding their position as the working class in relation to the possessing classes, the socialist movement spreads among them and the demand for the Manifesto increases.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: P1892.2.3
  kind: p
  de: So daß nicht nur der Stand der Arbeiterbewegung, sondern auch der Entwicklungsgrad der großen Industrie in jedem Land mit ziemlicher Genauigkeit abgemessen werden kann an der Zahl der in der Landessprache verbreiteten Exemplare des "Manifests".
  en: Thus, not only the state of the labour movement but also the degree of development of large-scale industry can be measured with fair accuracy in every country by the number of copies of the Manifesto circulated in the language of that country.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: P1892.3.1
  kind: p
  de: Hiernach bezeichnet die neue polnische Ausgabe einen entschiednen Fortschritt der polnischen Industrie.
  en: Accordingly, the new Polish edition indicates a decided progress of Polish industry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: P1892.3.2
  kind: p
  de: Und daß dieser Fortschritt, seit der vor zehn Jahren erschienenen letzten Ausgabe, in Wirklichkeit stattgefunden hat, darüber kann kein Zweifel sein.
  en: And there can be no doubt whatever that this progress since the previous edition published ten years ago has actually taken place.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: P1892.3.3
  kind: p
  de: Russisch-Polen, Kongreß-Polen, ist der große Industriebezirk des russischen Reichs geworden.
  en: Russian Poland, Congress Poland, has become the big industrial region of the Russian Empire.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: P1892.3.4
  kind: p
  de: Während die russische Großindustrie sporadisch zerstreut ist - ein Stück am Finnischen Meerbusen, ein Stück im Zentrum (Moskau und Wladimir), ein drittes am Schwarzen und Asowschen Meer, noch andre anderswo zersprengt -, ist die polnische auf verhältnismäßig kleinem Raum zusammengedrängt und genießt die aus dieser Konzentration entspringenden Vorteile und Nachteile.
  en: Whereas Russian large-scale industry is scattered sporadically - a part round the Gulf of Finland, another in the centre (Moscow and Vladimir), a third along the coasts of the Black and Azov seas, and still others elsewhere - Polish industry has been packed into a relatively small area and enjoys both the advantages and disadvantages arising from such concentration.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: P1892.3.5
  kind: p
  de: Die Vorteile erkannten die konkurrierenden russischen Fabrikanten an, als sie Schutzzölle gegen Polen verlangten, trotz ihres sehnlichen Wunsches, die Polen in Russen zu verwandeln.
  en: The competing Russian manufacturers acknowledged the advantages when they demanded protective tariffs against Poland, in spit of their ardent desire to transform the Poles into Russians.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: P1892.3.6
  kind: p
  de: Die Nachteile - für die polnischen Fabrikanten und für die russische Regierung - zeigen sich in der rapiden Verbreitung sozialistischer Ideen unter den polnischen Arbeitern und in der steigenden Nachfrage nach dem "Manifest".
  en: The disadvantages - for the Polish manufacturers and the Russian government - are manifest in the rapid spread of socialist ideas among the Polish workers and in the growing demand for the Manifesto.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 282-283
- id: P1892.4.1
  kind: p
  de: Die rasche Entwicklung der polnischen Industrie, die der russischen über den Kopf gewachsen, ist aber ihrerseits ein neuer Beweis für die unverwüstliche Lebenskraft des polnischen Volks und eine neue Garantie seiner bevorstehenden nationalen Wiederherstellung.
  en: But the rapid development of Polish industry, outstripping that of Russia, is in its turn a new proof of the inexhaustible vitality of the Polish people and a new guarantee of its impending national restoration.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
- id: P1892.4.2
  kind: p
  de: Die Wiederherstellung eines unabhängigen starken Polens ist aber eine Sache, die nicht nur die Polen, sondern die uns alle angeht.
  en: And the restoration of an independent and strong Poland is a matter which concerns not only the Poles but all of us.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
- id: P1892.4.3
  kind: p
  de: Ein aufrichtiges internationales Zusammenwirken der europäischen Nationen ist nur möglich, wenn jede dieser Nationen im eignen Hause vollkommen autonom ist.
  en: A sincere international collaboration of the European nations is possible only if each of these nations is fully autonomous in its own house.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
- id: P1892.4.4
  kind: p
  de: Die Revolution von 1848, die, unter proletarischer Fahne, proletarische Kämpfer schließlich nur die Arbeit der Bourgeoisie tun ließ, setzte auch durch ihre Testamentsvollstrecker Louis Bonaparte und Bismarck die Unabhängigkeit Italiens, Deutschlands, Ungarns durch; aber Polen, das seit 1792 mehr für die Revolution getan als alle diese drei zusammen, Polen überließ man sich selbst, als es 1863 vor der zehnfachen russischen Übermacht erlag.
  en: The Revolution of 1848, which under the banner of the proletariat, after all, merely let the proletarian fighters do the work of the bourgeoisie, also secured the independence of Italy, Germany and Hungary through its testamentary executors, Louis Bonaparte and Bismarck; but Poland, which since 1792 had done more for the Revolution than all these three together, was left to its own resources when it succumbed in 1863 to a tenfold greater Russian force.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
- id: P1892.4.5
  kind: p
  de: Die Unabhängigkeit Polens hat der Adel weder erhalten noch wiedererkämpfen gekonnt; der Bourgeoisie ist sie heute zum mindesten gleichgültig.
  en: The nobility could neither maintain nor regain Polish independence; today, to the bourgeoisie, this independence is, to say the last, immaterial.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
- id: P1892.4.6
  kind: p
  de: Und doch ist sie eine Notwendigkeit für das harmonische Zusammenwirken der europäischen Nationen.
  en: Nevertheless, it is a necessity for the harmonious collaboration of the European nations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
- id: P1892.4.7
  kind: p
  de: Sie kann erkämpft werden nur vom jungen polnischen Proletariat, und in dessen Händen ist sie gut aufgehoben.
  en: It can be gained only by the young Polish proletariat, and in its hands it is secure.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
- id: P1892.4.8
  kind: p
  de: Denn die Arbeiter des ganzen übrigen Europas haben die Unabhängigkeit Polens ebenso nötig wie die polnischen Arbeiter selbst.
  en: For the workers of all the rest of Europe need the independence of Poland just as much as the Polish workers themselves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
