verses:
- id: P1882.0.1
  kind: heading
  de: Vorrede [zur zweiten russischen Ausgabe von 1882]
  en: Preface to The 1882 Russian Edition
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.1.1
  kind: p
  de: Die erste russische Ausgabe des "Manifestes der Kommunistischen Partei", übersetzt von Bakunin, erschien anfangs der sechziger Jahre in der Druckerei des "Kolokol".
  en: The first Russian edition of the Manifesto of the Communist Party, translated by Bakunin, was published early in the 'sixties by the printing office of the Kolokol [a reference to the Free Russian Printing House].
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: P1882.1.2
  kind: p
  de: Der Westen konnte damals in ihr (der russischen Ausgabe des "Manifests") nur ein literarisches Kuriosum sehn.
  en: Then the West could see in it (the Russian edition of the Manifesto) only a literary curiosity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: P1882.1.3
  kind: p
  de: Solche Auffassung wäre heute unmöglich.
  en: Such a view would be impossible today.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: P1882.2.1
  kind: p
  de: 'Welch beschränktes Gebiet damals (Dezember 1847) die proletarische Bewegung noch einnahm, zeigt am klarsten das Schlußkapitel des "Manifests": Stellung der Kommunisten zu den verschiedenen Oppositionsparteien in den verschiedenen Ländern.'
  en: 'What a limited field the proletarian movement occupied at that time (December 1847) is most clearly shown by the last section: the position of the Communists in relation to the various opposition parties in various countries.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: P1882.2.2
  kind: p
  de: Hier fehlen nämlich grad - Rußland und die Vereinigten Staaten.
  en: Precisely Russia and the United States are missing here.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: P1882.2.3
  kind: p
  de: Es war die Zeit, wo Rußland die letzte große Reserve der europäischen Gesamtreaktion bildete; wo die Vereinigten Staaten die proletarische Überkraft Europas durch Einwanderung absorbierten.
  en: It was the time when Russia constituted the last great reserve of all European reaction, when the United States absorbed the surplus proletarian forces of Europe through immigration.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: P1882.2.4
  kind: p
  de: Beide Länder versorgten Europa mit Rohprodukten und waren zugleich Absatzmärkte seiner Industrieerzeugnisse.
  en: Both countries provided Europe with raw materials and were at the same time markets for the sale of its industrial products.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: P1882.2.5
  kind: p
  de: Beide Länder waren damals also, in dieser oder jener Weise, Säulen der bestehenden europäischen Ordnung.
  en: Both were, therefore, in one way of another, pillars of the existing European system.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: P1882.3.1
  kind: p
  de: Wie ganz anders heute!
  en: How very different today.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: P1882.3.2
  kind: p
  de: Grade die europäische Einwanderung befähigte Nordamerika zu einer riesigen Ackerbauproduktion, deren Konkurrenz das europäische Grundeigentum - großes wie kleines - in seinen Grundfesten erschüttert.
  en: Precisely European immigration fitted North American for a gigantic agricultural production, whose competition is shaking the very foundations of European landed property - large and small.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: P1882.3.3
  kind: p
  de: Sie erlaubte zudem den Vereinigten Staaten, ihre ungeheuren industriellen Hülfsquellen mit einer Energie und auf einer Stufenleiter auszubeuten, die das bisherige industrielle Monopol Westeuropas und namentlich Englands binnen kurzem brechen muß.
  en: At the same time, it enabled the United States to exploit its tremendous industrial resources with an energy and on a scale that must shortly break the industrial monopoly of Western Europe, and especially of England, existing up to now.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: P1882.3.4
  kind: p
  de: Beide Umstände wirken revolutionär auf Amerika selbst zurück.
  en: Both circumstances react in a revolutionary manner upon America itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: P1882.3.5
  kind: p
  de: Das kleinere und mittlere Grundeigentum der Farmers, die Basis der ganzen politischen Verfassung, erliegt nach und nach der Konkurrenz der Riesenfarms; in den Industriebezirken entwickelt sich gleichzeitig zum ersten Mal ein massenhaftes Proletariat und eine fabelhafte Konzentration der Kapitalien.
  en: Step by step, the small and middle land ownership of the farmers, the basis of the whole political constitution, is succumbing to the competition of giant farms; at the same time, a mass industrial proletariat and a fabulous concentration of capital funds are developing for the first time in the industrial regions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 295-296
- id: P1882.4.1
  kind: p
  de: Und nun Rußland!
  en: And now Russia!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '296'
- id: P1882.4.2
  kind: p
  de: Während der Revolution von 1848/49 fanden nicht nur die europäischen Fürsten, auch die europäischen Bourgeois in der russischen Einmischung die einzige Rettung vor dem eben erst erwachenden Proletariat.
  en: During the Revolution of 1848-9, not only the European princes, but the European bourgeois as well, found their only salvation from the proletariat just beginning to awaken in Russian intervention.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '296'
- id: P1882.4.3
  kind: p
  de: Der Zar wurde als Chef der europäischen Reaktion proklamiert.
  en: The Tsar was proclaimed the chief of European reaction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '296'
- id: P1882.4.4
  kind: p
  de: Heute ist er Kriegsgefangner der Revolution in Gatschina, und Rußland bildet die Vorhut der revolutionären Aktion in Europa.
  en: Today, he is a prisoner of war of the revolution in Gatchina, and Russia forms the vanguard of revolutionary action in Europe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '296'
- id: P1882.5.1
  kind: p
  de: Das "Kommunistische Manifest" hatte zur Aufgabe, die unvermeidlich bevorstehende Auflösung des modernen bürgerlichen Eigentums zu proklamieren.
  en: The Communist Manifesto had, as its object, the proclamation of the inevitable impending dissolution of modern bourgeois property.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '296'
- id: P1882.5.2
  kind: p
  de: In Rußland aber finden wir, gegenüber rasch aufblühendem kapitalistischen Schwindel und sich eben erst entwickelndem bürgerlichen Grundeigentum, die größere Hälfte des Bodens im Gemeinbesitz der Bauern.
  en: But in Russia we find, face-to-face with the rapidly flowering capitalist swindle and bourgeois property, just beginning to develop, more than half the land owned in common by the peasants.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '296'
- id: P1882.5.3
  kind: p
  de: 'Es fragt sich nun: Kann die russische Obschtschina, eine wenn auch stark untergrabene Form des uralten Gemeinbesitzes am Boden, unmittelbar in die höhere des kommunistischen Gemeinbesitzes übergehn?'
  en: 'Now the question is: can the Russian obshchina, though greatly undermined, yet a form of primeval common ownership of land, pass directly to the higher form of Communist common ownership?'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '296'
- id: P1882.5.4
  kind: p
  de: Oder muß sie umgekehrt vorher denselben Auflösungsprozeß durchlaufen, der die geschichtliche Entwicklung des Westens ausmacht?
  en: Or, on the contrary, must it first pass through the same process of dissolution such as constitutes the historical evolution of the West?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '296'
- id: P1882.6.1
  kind: p
  de: 'Die einzige Antwort hierauf, die heutzutage möglich, ist die: Wird die russische Revolution das Signal einer proletarischen Revolution im Westen, so daß beide einander ergänzen, so kann das jetzige russische Gemeineigentum am Boden zum Ausgangspunkt einer kommunistischen Entwicklung dienen.'
  en: 'The only answer to that possible today is this: If the Russian Revolution becomes the signal for a proletarian revolution in the West, so that both complement each other, the present Russian common ownership of land may serve as the starting point for a communist development.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '296'
