verses:
- id: P1888.0.1
  kind: heading
  de: Vorrede [zur englischen Ausgabe von 1888]
  en: Preface to The 1888 English Edition
  modern: ''
  modern_status: empty
  notes: ''
- id: P1888.1.1
  kind: p
  de: Das "Manifest" wurde als Plattform des Bundes der Kommunisten veröffentlicht, einer anfangs ausschließlich deutschen, später internationalen Arbeiterassoziation, die unter den politischen Verhältnissen des europäischen Kontinents vor 1848 unvermeidlich eine Geheimorganisation war.
  en: The Manifesto was published as the platform of the Communist League, a working men's association, first exclusively German, later on international, and under the political conditions of the Continent before 1848, unavoidably a secret society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: P1888.1.2
  kind: p
  de: Auf dem Kongreß des Bundes, der im November 1847 in London stattfand, wurden Marx und Engels beauftragt, die Veröffentlichung eines vollständigen theoretischen und praktischen Parteiprogramms in die Wege zu leiten.
  en: At a Congress of the League, held in November 1847, Marx and Engels were commissioned to prepare a complete theoretical and practical party programme.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: P1888.1.3
  kind: p
  de: In deutscher Sprache abgefaßt, wurde das Manuskript im Januar 1848, wenige Wochen vor der französischen Revolution vom 24. Februar, nach London zum Druck geschickt. Eine französische Übersetzung wurde kurz vor der Juni-Insurrektion von 1848 in Paris herausgebracht.
  en: Drawn up in German, in January 1848, the manuscript was sent to the printer in London a few weeks before the French Revolution of February 24. A French translation was brought out in Paris shortly before the insurrection of June 1848.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
  align: '1:2'
  review: true
  review_reason: 1 en sentence(s) matched to 2 de sentence(s)
- id: P1888.1.4
  kind: p
  de: Die erste englische Übersetzung, von Miss Helen Macfarlane besorgt, erschien 1850 in George Julian Harneys "Red Republican" in London.
  en: The first English translation, by Miss Helen Macfarlane, appeared in George Julian Harney's Red Republican, London, 1850.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: P1888.1.5
  kind: p
  de: Auch eine dänische und eine polnische Ausgabe wurden veröffentlicht.
  en: A Danish and a Polish edition had also been published.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: P1888.2.1
  kind: p
  de: Die Niederschlagung der Pariser Juni-Insurrektion von 1848 - dieser ersten großen Schlacht zwischen Proletariat und Bourgeoisie - drängte die sozialen und politischen Bestrebungen der Arbeiterklasse Europas zeitweilig wieder in den Hintergrund.
  en: The defeat of the Parisian insurrection of June 1848 - the first great battle between proletariat and bourgeoisie - drove again into the background, for a time, the social and political aspirations of the European working class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: P1888.2.2
  kind: p
  de: Seitdem spielte sich der Kampf um die Vormachtstellung wieder, wie in der Zeit vor der Februarrevolution, allein zwischen verschiedenen Gruppen der besitzenden Klasse ab; die Arbeiterklasse wurde beschränkt auf einen Kampf um politische Ellbogenfreiheit und auf die Position eines äußersten linken Flügels der radikalen Bourgeoisie.
  en: Thenceforth, the struggle for supremacy was, again, as it had been before the Revolution of February, solely between different sections of the propertied class; the working class was reduced to a fight for political elbow-room, and to the position of extreme wing of the middle-class Radicals.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: P1888.2.3
  kind: p
  de: Wo selbständige proletarische Bewegungen fortfuhren, Lebenszeichen von sich zu geben, wurden sie erbarmungslos niedergeschlagen.
  en: Wherever independent proletarian movements continued to show signs of life, they were ruthlessly hunted down.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: P1888.2.4
  kind: p
  de: So spürte die preußische Polizei die Zentralbehörde des Bundes der Kommunisten auf, die damals ihren Sitz in Köln hatte.
  en: Thus the Prussian police hunted out the Central Board of the Communist League, then located in Cologne.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: P1888.2.5
  kind: p
  de: Die Mitglieder wurden verhaftet und nach achtzehnmonatiger Haft im Oktober 1852 vor Gericht gestellt.
  en: The members were arrested and, after eighteen months' imprisonment, they were tried in October 1852.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 352-353
- id: P1888.2.6
  kind: p
  de: Dieser berühmte "Kölner Kommunistenprozeß" dauerte vom 4. Oktober bis 12. November; sieben von den Gefangenen wurdet zu Festungshaft für die Dauer von drei bis sechs Jahren verurteilt.
  en: This celebrated "Cologne Communist Trial" lasted from October 4 till November 12; seven of the prisoners were sentenced to terms of imprisonment in a fortress, varying from three to six years.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: P1888.2.7
  kind: p
  de: Sofort nach dem Urteilsspruch wurde der Bund durch die noch verbliebenen Mitglieder formell aufgelöst.
  en: Immediately after the sentence, the League was formally dissolved by the remaining members.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: P1888.2.8
  kind: p
  de: Was das "Manifest" anbelangt, so schien es von da an verdammt zu sein, der Vergessenheit anheimzufallen.
  en: As to the Manifesto, it seemed henceforth doomed to oblivion.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: P1888.3.1
  kind: p
  de: Als die europäische Arbeiterklasse wieder genügend Kraft zu einem neuen Angriff auf die herrschende Klasse gesammelt hatte, entstand die Internationale Arbeiterassoziation.
  en: When the European workers had recovered sufficient strength for another attack on the ruling classes, the International Working Men's Association sprang up.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: P1888.3.2
  kind: p
  de: Aber diese Assoziation, die ausdrücklich zu dem Zwecke gegründet wurde, das gesamte kampfgewillte Proletariat Europas und Amerikas zu einer einzigen Körperschaft zusammenzuschweißen, konnte die im "Manifest" niedergelegten Grundsätze nicht sofort proklamieren.
  en: But this association, formed with the express aim of welding into one body the whole militant proletariat of Europe and America, could not at once proclaim the principles laid down in the Manifesto.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: P1888.3.3
  kind: p
  de: Die Internationale mußte ein Programm haben, breit genug, um für die englischen Trade-Unions, für die französischen, belgischen, italienischen und spanischen Anhänger Proudhons und für die Lassalleaner in Deutschland annehmbar zu sein.
  en: The International was bound to have a programme broad enough to be acceptable to the English trade unions, to the followers of Proudhon in France, Belgium, Italy, and Spain, and to the Lassalleans in Germany.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - P1888.N1
  mew_page: '353'
- id: P1888.4.1
  kind: p
  de: Marx, der dieses Programm zur Zufriedenheit aller Parteien abfaßte, hatte volles Vertrauen zur intellektuellen Entwicklung der Arbeiterklasse, einer Entwicklung, wie sie aus der vereinigten Aktion und der gemeinschaftlichen Diskussion notwendig hervorgehn mußte.
  en: Marx, who drew up this programme to the satisfaction of all parties, entirely trusted to the intellectual development of the working class, which was sure to result from combined action and mutual discussion.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: P1888.4.2
  kind: p
  de: Die Ereignisse und Wechselfälle im Kampf gegen das Kapital, die Niederlagen noch mehr als die Siege, konnten nicht verfehlen, den Menschen die Unzulänglichkeit ihrer diversen Lieblings-Quacksalbereien zum Bewußtsein zu bringen und den Weg zu vollkommener Einsicht in die wirklichen Voraussetzungen der Emanzipation der Arbeiterklasse zu bahnen.
  en: The very events and vicissitudes in the struggle against capital, the defeats even more than the victories, could not help bringing home to men's minds the insufficiency of their various favorite nostrums, and preparing the way for a more complete insight into the true conditions for working-class emancipation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: P1888.4.3
  kind: p
  de: Und Marx hatte recht.
  en: And Marx was right.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: P1888.4.4
  kind: p
  de: Als im Jahre 1874 die Internationale zerfiel, ließ sie die Arbeiter schon in einem ganz anderen Zustand zurück, als sie sie bei ihrer Gründung im Jahre 1864 vorgefunden hatte.
  en: The International, on its breaking in 1874, left the workers quite different men from what it found them in 1864.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: P1888.4.5
  kind: p
  de: 'Der Proudhonismus in Frankreich, der Lassalleanismus in Deutschland waren am Absterben, und auch die konservativen englischen Trade-Unions näherten sich, obgleich sie in ihrer Mehrheit die Verbindung mit der Internationale schon längst gelöst hatten, allmählich dem Punkt, wo ihr Präsident [Bevan] im vergangenen Jahre in Swansea in ihrem Namen erklären konnte: "Der kontinentale Sozialismus hat seine Schrecken für uns verloren."'
  en: 'Proudhonism in France, Lassalleanism in Germany, were dying out, and even the conservative English trade unions, though most of them had long since severed their connection with the International, were gradually advancing towards that point at which, last year at Swansea, their president [W. Bevan] could say in their name: "Continental socialism has lost its terror for us."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 353-354
- id: P1888.4.6
  kind: p
  de: 'In der Tat: Die Grundsätze des "Manifestes" hatten unter den Arbeitern aller Länder erhebliche Fortschritte gemacht.'
  en: In fact, the principles of the Manifesto had made considerable headway among the working men of all countries.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: P1888.5.1
  kind: p
  de: Auf diese Weise trat das "Manifest" selbst wieder in den Vordergrund.
  en: The Manifesto itself came thus to the front again.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: P1888.5.2
  kind: p
  de: Der deutsche Text war seit 1850 in der Schweiz, in England und in Amerika mehrmals neu gedruckt worden.
  en: Since 1850, the German text had been reprinted several times in Switzerland, England, and America.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: P1888.5.3
  kind: p
  de: Im Jahre 1872 wurde es ins Englische übersetzt, und zwar in New York, wo die Übersetzung in "Woodhull & Claflin's Weekly" veröffentlicht wurde.
  en: In 1872, it was translated into English in New York, where the translation was published in Woorhull and Claflin's Weekly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: P1888.5.4
  kind: p
  de: Auf Grund dieser englischen Fassung wurde in "Le Socialiste " in New York auch eine französische angefertigt.
  en: From this English version, a French one was made in Le Socialiste of New York.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: P1888.5.5
  kind: p
  de: Seitdem sind in Amerika noch mindestens zwei englische Übersetzungen, mehr oder minder entstellt, herausgebracht worden, von denen eine in England nachgedruckt wurde.
  en: Since then, at least two more English translations, more or less mutilated, have been brought out in America, and one of them has been reprinted in England.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: P1888.5.6
  kind: p
  de: Die von Bakunin besorgte erste russische Übersetzung wurde etwa um das Jahr 1863 in der Druckerei von Herzens "Kolokol" in Genf herausgegeben, eine zweite, gleichfalls in Genf, von der heldenhaften Vera Sassulitsch, 1882.
  en: The first Russian translation, made by Bakunin, was published at Herzen's Kolokol office in Geneva, about 1863; a second one, by the heroic Vera Zasulich, also in Geneva, in 1882.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: P1888.5.7
  kind: p
  de: Eine neue dänische Ausgabe findet sich in der "Socialdemokratisk Bibliotek", Kopenhagen 1885; eine neue französische Übersetzung in "Le Socialiste", Paris 1886.
  en: A new Danish edition is to be found in Socialdemokratisk Bibliothek, Copenhagen, 1885; a fresh French translation in Le Socialiste, Paris, 1886.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: P1888.5.8
  kind: p
  de: Nach dieser letzteren wurde eine spanische Übersetzung vorbereitet und 1886 in Madrid veröffentlicht.
  en: From this latter, a Spanish version was prepared and published in Madrid, 1886.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: P1888.5.9
  kind: p
  de: Die Zahl der deutschen Nachdrucke läßt sich nicht genau angeben, im ganzen waren es mindestens zwölf.
  en: The German reprints are not to be counted; there have been twelve altogether at the least.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: P1888.5.10
  kind: p
  de: Eine Übertragung ins Armenische, die vor einigen Monaten in Konstantinopel herauskommen sollte, erblickte nicht das Licht der Welt, weil, wie man mir mitteilte, der Verleger nicht den Mut hatte, ein Buch herauszubringen, auf dem der Name Marx stand, während der Übersetzer es ablehnte, es als sein eigenes Werk zu bezeichnen.
  en: An Armenian translation, which was to be published in Constantinople some months ago, did not see the light, I am told, because the publisher was afraid of bringing out a book with the name of Marx on it, while the translator declined to call it his own production.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: P1888.5.11
  kind: p
  de: Von weiteren Übersetzungen in andere Sprachen habe ich zwar gehört, sie aber nicht zu Gesicht bekommen.
  en: Of further translations into other languages I have heard but had not seen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: P1888.5.12
  kind: p
  de: So spiegelt die Geschichte des "Manifestes" in hohem Maße die Geschichte der modernen Arbeiterbewegung wider; gegenwärtig ist es zweifellos das weitest verbreitete, internationalste Werk der ganzen sozialistischen Literatur, ein gemeinsames Programm, das von Millionen Arbeitern von Sibirien bis Kalifornien anerkannt wird.
  en: Thus the history of the Manifesto reflects the history of the modern working-class movement; at present, it is doubtless the most wide spread, the most international production of all socialist literature, the common platform acknowledged by millions of working men from Siberia to California.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: P1888.6.1
  kind: p
  de: Und doch hätten wir es, als es geschrieben wurde, nicht ein sozialistisches Manifest nennen können.
  en: Yet, when it was written, we could not have called it a socialist manifesto.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: P1888.6.2
  kind: p
  de: 'Unter Sozialisten verstand man 1847 einerseits die Anhänger der verschiedenen utopischen Systeme: die Owenisten in England, die Fourieristen in Frankreich, die beide bereits zu bloßen, allmählich aussterbenden Sekten zusammengeschrumpft waren; andererseits die mannigfaltigsten sozialen Quacksalber, die mit allerhand Flickwerk, ohne jede Gefahr für Kapital und Profit die gesellschaftlichen Mißstände aller Art zu beseitigen versprachen - in beiden Fällen Leute, die außerhalb der Arbeiterbewegung standen und eher Unterstützung bei den "gebildeten" Klassen suchten.'
  en: 'By Socialists, in 1847, were understood, on the one hand the adherents of the various Utopian systems: Owenites in England, Fourierists in France, both of them already reduced to the position of mere sects, and gradually dying out; on the other hand, the most multifarious social quacks who, by all manner of tinkering, professed to redress, without any danger to capital and profit, all sorts of social grievances, in both cases men outside the working-class movement, and looking rather to the "educated" classes for support.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 354-357
- id: P1888.6.3
  kind: p
  de: Derjenige Teil der Arbeiterklasse, der sich von der Unzulänglichkeit bloßer politischer Umwälzungen überzeugt hatte und die Notwendigkeit einer totalen Umgestaltung der Gesellschaft forderte, dieser Teil nannte sich damals kommunistisch.
  en: Whatever portion of the working class had become convinced of the insufficiency of mere political revolutions, and had proclaimed the necessity of total social change, called itself Communist.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: P1888.6.4
  kind: p
  de: Es war eine noch rohe, unbehauene, rein instinktive Art Kommunismus; aber er traf den Kardinalpunkt und war in der Arbeiterklasse mächtig genug, um den utopischen Kommunismus zu erzeugen, in Frankreich den von Cabet, in Deutschland den von Weitling.
  en: It was a crude, rough-hewn, purely instinctive sort of communism; still, it touched the cardinal point and was powerful enough amongst the working class to produce the Utopian communism of Cabet in France, and of Weitling in Germany.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: P1888.6.5
  kind: p
  de: So war denn 1847 Sozialismus eine Bewegung der Mittelklasse, Kommunismus eine Bewegung der Arbeiterklasse.
  en: Thus, in 1847, socialism was a middle-class movement, communism a working-class movement.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: P1888.6.6
  kind: p
  de: Der Sozialismus war, auf dem Kontinent wenigstens, "salonfähig"; der Kommunismus war das gerade Gegenteil.
  en: Socialism was, on the Continent at least, "respectable"; communism was the very opposite.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: P1888.6.7
  kind: p
  de: Und da wir von allem Anfang an der Meinung waren, daß "die Emanzipation der Arbeiterklasse das Werk der Arbeiterklasse selbst sein muß", so konnte kein Zweifel darüber bestehen, welchen der beiden Namen wir wählen mußten.
  en: And as our notion, from the very beginning, was that "the emancipation of the workers must be the act of the working class itself," there could be no doubt as to which of the two names we must take.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: P1888.6.8
  kind: p
  de: Ja noch mehr, auch seitdem ist es uns nie in den Sinn gekommen, uns von ihm loszusagen.
  en: Moreover, we have, ever since, been far from repudiating it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: P1888.7.1
  kind: p
  de: Obgleich das "Manifest" unser beider gemeinsame Arbeit war, so halte ich mich doch für verpflichtet festzustellen, daß der Grundgedanke, der seinen Kern bildet, Marx angehört.
  en: The Manifesto being our joint production, I consider myself bound to state that the fundamental proposition which forms the nucleus belongs to Marx.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: P1888.7.2
  kind: p
  de: 'Dieser Gedanke besteht darin: daß in jeder geschichtlichen Epoche die vorherrschende wirtschaftliche Produktions- und Austauschweise und die aus ihr mit Notwendigkeit folgende gesellschaftliche Gliederung die Grundlage bildet, auf der die politische und die intellektuelle Geschichte dieser Epoche sich aufbaut und aus der allein sie erklärt werden kann; daß demgemäß die ganze Geschichte der Menschheit (seit Aufhebung der primitiven Gentilordnung mit ihrem Gemeinbesitz an Grund und Boden) eine Geschichte von Klassenkämpfen gewesen ist. Kämpfen zwischen ausbeutenden und ausgebeuteten, herrschenden und unterdrückten Klassen; daß die Geschichte dieser Klassenkämpfe eine Entwicklungsreihe darstellt, in der gegenwärtig eine Stufe erreicht ist, wo die ausgebeutete und unterdrückte Klasse - das Proletariat - ihre Befreiung vom Joch der ausbeutenden und herrschenden Klasse - der Bourgeoisie - nicht erreichen kann, ohne zugleich die ganze Gesellschaft ein für allemal von aller Ausbeutung und Unterdrückung, von allen Klassenunterschieden und Klassenkämpfen zu befreien.'
  en: 'That proposition is: That in every historical epoch, the prevailing mode of economic production and exchange, and the social organization necessarily following from it, form the basis upon which it is built up, and from that which alone can be explained the political and intellectual history of that epoch; that consequently the whole history of mankind (since the dissolution of primitive tribal society, holding land in common ownership) has been a history of class struggles, contests between exploiting and exploited, ruling and oppressed classes; That the history of these class struggles forms a series of evolutions in which, nowadays, a stage has been reached where the exploited and oppressed class - the proletariat - cannot attain its emancipation from the sway of the exploiting and ruling class - the bourgeoisie - without, at the same time, and once and for all, emancipating society at large from all exploitation, oppression, class distinction, and class struggles.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
  align: '1:2'
  review: true
  review_reason: 1 en sentence(s) matched to 2 de sentence(s)
- id: P1888.8.1
  kind: p
  de: Diesem Gedanken, der nach meiner Ansicht berufen ist, für die Geschichtswissenschaft denselben Fortschritt zu begründen, den Darwins Theorie für die Naturwissenschaft begründet hat - diesem Gedanken hatten wir beide uns schon mehrere Jahre vor 1845 allmählich genähert.
  en: This proposition, which, in my opinion, is destined to do for history what Darwin's theory has done for biology, we both of us, had been gradually approaching for some years before 1845.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: P1888.8.2
  kind: p
  de: Wieweit ich selbständig mich in dieser Richtung voranbewegt, zeigt am besten meine "Lage der arbeitenden Klasse in England".
  en: How far I had independently progressed towards it is best shown by my "Conditions of the Working Class in England."
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - P1888.N2
  mew_page: 357-358
- id: P1888.8.3
  kind: p
  de: Als ich aber im Frühjahr 1845 Marx in Brüssel wiedertraf, hatte er ihn fertig ausgearbeitet und legte ihn mir vor in fast ebenso klaren Worten wie die, worin ich ihn oben zusammengefaßt.
  en: But when I again met Marx at Brussels, in spring 1845, he had it already worked out and put it before me in terms almost as clear as those in which I have stated it here.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: P1888.9.1
  kind: p
  de: 'Aus unserem gemeinsamen Vorwort zur deutschen Ausgabe von 1872 zitiere ich das Folgende:'
  en: 'From our joint preface to the German edition of 1872, I quote the following:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: P1888.10.1
  kind: p
  de: '"Wie sehr sich auch die Verhältnisse in den letzten fünfundzwanzig Jahren geändert haben, die in diesem ''Manifest'' entwickelten allgemeinen Grundsätze behalten im ganzen und großen auch heute noch ihre volle Richtigkeit.'
  en: '"However much that state of things may have altered during the last twenty-five years, the general principles laid down in the Manifesto are, on the whole, as correct today as ever.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: P1888.10.2
  kind: p
  de: Einzelnes wäre hier und da zu bessern.
  en: Here and there, some detail might be improved.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: P1888.10.3
  kind: p
  de: Die praktische Anwendung dieser Grundsätze, erklärt das 'Manifest' selbst, wird überall und jederzeit von den geschichtlich vorliegenden Umständen abhängen, und wird deshalb durchaus kein besonderes Gewicht auf die am Ende von Abschnitt II vorgeschlagenen revolutionären Maßregeln gelegt. Dieser Passus würde heute in vieler Beziehung anders lauten.
  en: The practical application of the principles will depend, as the Manifesto itself states, everywhere and at all times, on the historical conditions for the time being existing, and, for that reason, no special stress is laid on the revolutionary measures proposed at the end of Section II. That passage would, in many respects, be very differently worded today.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
  align: '1:2'
  review: true
  review_reason: 1 en sentence(s) matched to 2 de sentence(s)
- id: P1888.10.4
  kind: p
  de: Gegenüber der immensen Fortentwicklung der großen Industrie seit 1848 und der sie begleitenden verbesserten und gewachsenen Organisation der Arbeiterklasse, gegenüber den praktischen Erfahrungen, zuerst der Februarrevolution und noch weit mehr der Pariser Kommune, wo das Proletariat zum erstenmal zwei Monate lang die politische Gewalt innehatte, ist heute dies Programm stellenweise veraltet.
  en: In view of the gigantic strides of Modern Industry since 1848, and of the accompanying improved and extended organization of the working class, in view of the practical experience gained, first in the February Revolution, and then, still more, in the Paris Commune, where the proletariat for the first time held political power for two whole months, this programme has in some details been antiquated.
  modern: ''
  modern_status: empty
  notes: ''
  de_variants:
  - ref: T1
    editions: '1872'
    reading: 'in den letzten fünfundzwanzig Jahren und der mit ihr fortschreitenden Parteiorganisation (statt: seit 1848 und der sie begleitenden verbesserten und gewachsenen Organisation)'
    base_text: der Arbeiterklasse, gegenüber den praktischen …
  mew_page: '358'
- id: P1888.10.5
  kind: p
  de: Namentlich hat die Kommune den Beweis geliefert, daß 'die Arbeiterklasse nicht die fertige Staatsmaschine einfach in Besitz nehmen und sie für ihre eignen Zwecke in Bewegung setzen kann'.
  en: One thing especially was proved by the Commune, viz., that "the working class cannot simply lay hold of ready-made state machinery, and wield it for its own purposes."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: P1888.10.6
  kind: p
  de: (Siehe ' The Civil War in France. Address of the General Council of the International Working-Men's Association', London, Truelove, 1871, p. 15, wo dies weiterentwickelt ist.)
  en: '(See The Civil War in France: Address of the General Council of the International Working Men''s Association 1871, where this point is further developed.)'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: P1888.10.7
  kind: p
  de: Ferner ist selbstredend, daß die Kritik der sozialistischen Literatur für heute lückenhaft ist, weil sie nur bis 1847 reicht; ebenso daß die Bemerkungen über die Stellung der Kommunisten zu den verschiedenen Oppositionsparteien (Abschnitt IV), wenn in den Grundzügen auch heute noch richtig, doch in ihrer Ausführung heute schon deswegen veraltet sind, weil die politische Lage sich total umgestaltet und die geschichtliche Entwicklung die meisten der dort aufgezählten Parteien aus der Welt geschafft hat.
  en: Further, it is self-evident that the criticism of socialist literature is deficient in relation to the present time, because it comes down only to 1847; also that the remarks on the relation of the Communists to the various opposition parties (Section IV), although, in principle still correct, yet in practice are antiquated, because the political situation has been entirely changed, and the progress of history has swept from off the Earth the greater portion of the political parties there enumerated.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 358-359
- id: P1888.11.1
  kind: p
  de: Indes, das 'Manifest' ist ein geschichtliches Dokument, an dem zu ändern wir uns nicht mehr das Recht zuschreiben."
  en: '"But then, the Manifesto has become a historical document which we have no longer any right to alter."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
