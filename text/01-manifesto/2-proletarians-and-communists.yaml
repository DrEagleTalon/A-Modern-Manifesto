  de: '"Aber", wird man sagen, "religiöse, moralische, philosophische, politische, rechtliche Ideen usw. modifizieren sich allerdings im Lauf der geschichtlichen Entwicklung.'
  en: '"Undoubtedly," it will be said, "religious, moral, philosophical, and juridical ideas have been modified in the course of historical development.'
