  kind: p
  de: An die Stelle der alten bürgerlichen Gesellschaft mit ihren Klassen und Klassengegensätzen tritt eine Assoziation, worin die freie Entwicklung eines jeden die Bedingung für die freie Entwicklung aller ist.
  en: In place of the old bourgeois society, with its classes and class antagonisms, we shall have an association, in which the free development of each is the condition for the free development of all.
  modern: In place of the old bourgeois society, with its classes and class antagonisms, we will have an association in which the free development of each is the condition for the free development of all.
  modern_status: seed
  notes: One online copy of MEW drops 'die Bedingung für' from this sentence; see SOURCES.md.
  mew_page: '482'
