name: publish

# After a change lands on main: rebuild dist/, commit it if anything changed, and publish
# the reader to GitHub Pages. Contributors never need to run build.py themselves.
#
# One-time setup in the repository settings:
#   Settings > Pages > Build and deployment > Source: GitHub Actions
#   Settings > Actions > General > Workflow permissions: Read and write

on:
  push:
    branches: [main]
    paths:
      - "works/**"
      - "adaptations/**"
      - "scripts/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate
        run: python scripts/validate.py
      - name: Build
        run: python scripts/build.py
      - name: Commit rebuilt dist/
        run: |
          git config user.name "library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist/ already up to date"
          else
            git commit -m "Rebuild dist/ from verse files"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
