name: validate

# Every pull request: check the verse files and adaptations, and make sure the build still runs.
# The rebuilt dist/ is uploaded as an artifact for reviewers; it is committed to main by publish.yml after merge.

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate works and adaptations
        run: python scripts/validate.py
      - name: Build reader, CSV, workbooks and tables
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist-preview
          path: dist/
