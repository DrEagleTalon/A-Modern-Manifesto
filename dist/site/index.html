<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>The Communist Manifesto, verse by verse</title>
<style>
  :root {
    --paper: #f7f3ec; --ink: #1d1b19; --muted: #6b645c; --rule: #ddd5c8;
    --accent: #a4161a; --accent-soft: #f3dcdc; --flag: #9a6b00; --flag-soft: #fbf0d4;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #171513; --ink: #ece6dc; --muted: #a39a8f; --rule: #3a342e;
            --accent: #ff6b6b; --accent-soft: #3a1f1f; --flag: #e3b341; --flag-soft: #33290f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); line-height: 1.55; }
  header { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
  .bar { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .brand { font-family: var(--sans); font-weight: 700; letter-spacing: .02em; margin-right: auto; font-size: 15px; }
  .brand span { color: var(--accent); }
  select { max-width: 280px; }
  select, input[type=search] { font: 14px var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; }
  input[type=search] { width: 180px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; font-family: var(--sans); font-size: 13px; }
  .chip { border: 1px solid var(--rule); border-radius: 999px; padding: 3px 10px; cursor: pointer; user-select: none; }
  .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  main { max-width: 1280px; margin: 0 auto; padding: 8px 16px 80px; }
  .sechead { padding: 22px 0 10px; border-bottom: 2px solid var(--ink); margin-bottom: 6px; }
  .sechead h1 { font-size: 26px; margin: 0; font-weight: 600; }
  .sechead .de { font-style: italic; color: var(--muted); margin-top: 2px; }
  .sechead .src { font: 12px/1.45 var(--sans); color: var(--muted); margin-top: 10px; }
  .sechead .warn { color: var(--flag); }
  .cols { display: grid; grid-template-columns: 92px repeat(var(--n), minmax(0, 1fr)); gap: 0 22px; }
  .colhead { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 0 6px; position: sticky; top: var(--hh, 52px); background: var(--paper); z-index: 2; }
  .group { display: contents; }
  .cell { padding: 9px 0; border-top: 1px solid var(--rule); }
  .vid { font: 12px var(--sans); color: var(--muted); }
  .vid a { color: inherit; text-decoration: none; display: block; padding-top: 2px; scroll-margin-top: calc(var(--hh, 52px) + 40px); }
  .vid a:hover { color: var(--accent); }
  .lines .ln { display: block; }
  .lines .ln + .ln { margin-top: 6px; }
  .lines .ln .sub { font: 10px var(--sans); color: var(--muted); margin-right: 4px; vertical-align: 2px; }
  .heading { font-weight: 700; font-size: 1.08em; }
  .signature { font-style: italic; color: var(--muted); }
  .note { font-size: .95em; }
  .empty { color: var(--muted); font-style: italic; font-size: .9em; }
  .tag { font: 10px var(--sans); border-radius: 4px; padding: 1px 5px; margin-left: 4px; vertical-align: 2px; white-space: nowrap; }
  .t-seed { background: var(--rule); color: var(--muted); }
  .t-draft { background: var(--flag-soft); color: var(--flag); }
  .t-reviewed, .t-settled { background: var(--accent-soft); color: var(--accent); }
  .fn { font: 11px var(--sans); color: var(--accent); text-decoration: none; margin-left: 3px; vertical-align: 3px; }
  .flag { color: var(--flag); cursor: help; font-family: var(--sans); font-size: 12px; margin-left: 4px; }
  .extra { font: 12px/1.45 var(--sans); color: var(--muted); margin-top: 6px; }
  .extra b { color: var(--ink); font-weight: 600; }
  .lbl { display: none; }
  .vid a.cur { background: var(--accent-soft); color: var(--accent); border-radius: 3px; outline: none; }
  #results { font: 14px var(--sans); }
  #results a { display: block; padding: 8px 0; border-top: 1px solid var(--rule); color: var(--ink); text-decoration: none; }
  #results a b { color: var(--accent); margin-right: 8px; }
  footer { font: 12px var(--sans); color: var(--muted); max-width: 1280px; margin: 0 auto; padding: 0 16px 40px; }
  @media (max-width: 760px) {
    .vid a { scroll-margin-top: calc(var(--hh, 52px) + 8px); }
    .cols { display: block; }
    .colhead { display: none; }
    .group { display: block; border-top: 1px solid var(--ink); padding: 10px 0 4px; }
    .cell { border: 0; padding: 4px 0 8px; }
    .lbl { display: block; font: 600 10px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 1px; }
    input[type=search] { width: 100%; order: 9; }
    .sechead h1 { font-size: 22px; }
  }
</style>

<script>
const DATA = [{"section": "P1872", "title_de": "Vorwort [zur deutschen Ausgabe von 1872]", "title_en": "Preface to The 1872 German Edition", "source_de": "MEW 18, S. 95-96 (Dietz, Berlin) via mlwerke.de", "source_en": "Marxists Internet Archive transcription; English is a later translation (Progress Publishers, Moscow 1969), licence unverified", "original_language": "de", "anchor": "de", "verses": [{"id": "P1872.0.1", "kind": "heading", "de": "Vorwort [zur deutschen Ausgabe von 1872]", "en": "Preface to The 1872 German Edition", "modern": "", "modern_status": "empty", "notes": ""}, {"id": "P1872.1.1", "kind": "p", "de": "Der Bund der Kommunisten, eine internationale Arbeiterverbindung, die unter den damaligen Verhältnissen selbstredend nur eine geheime sein konnte, beauftragte auf dem in London im November 1847 abgehaltenen Kongresse die Unterzeichneten mit der Abfassung eines für die Öffentlichkeit bestimmten, ausführlichen theoretischen und praktischen Parteiprogramms.", "en": "The Communist League, an international association of workers, which could of course be only a secret one, under conditions obtaining at the time, commissioned us, the undersigned, at the Congress held in London in November 1847, to write for publication a detailed theoretical and practical programme for the Party.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "95"}, {"id": "P1872.1.2", "kind": "p", "de": "So entstand das nachfolgende \"Manifest\", dessen Manuskript wenige Wochen vor der Februarrevolution nach London zum Druck wanderte.", "en": "Such was the origin of the following Manifesto, the manuscript of which travelled to London to be printed a few weeks before the February [French] Revolution [in 1848].", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "95"}, {"id": "P1872.1.3", "kind": "p", "de": "Zuerst deutsch veröffentlicht, ist es in dieser Sprache in Deutschland, England und Amerika in mindestens zwölf verschiedenen Ausgaben abgedruckt worden.", "en": "First published in German, it has been republished in that language in at least twelve different editions in Germany, England, and America.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "95"}, {"id": "P1872.1.4", "kind": "p", "de": "Englisch erschien es zuerst 1850 in London im \"Red Republican\", übersetzt von Miß Helen Macfarlane, und 1871 in wenigstens drei verschiedenen Übersetzungen in Amerika.", "en": "It was published in English for the first time in 1850 in the Red Republican, London, translated by Miss Helen Macfarlane, and in 1871 in at least three different translations in America.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "95"}, {"id": "P1872.1.5", "kind": "p", "de": "Französisch zuerst in Paris kurz vor der Juni-Insurrektion 1848, neuerdings in \"Le Socialiste\" von New York.", "en": "The French version first appeared in Paris shortly before the June insurrection of 1848, and recently in Le Socialiste of New York.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "95"}, {"id": "P1872.1.6", "kind": "p", "de": "Eine neue Übersetzung wird vorbereitet.", "en": "A new translation is in the course of preparation.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "95"}, {"id": "P1872.1.7", "kind": "p", "de": "Polnisch in London kurz nach seiner ersten deutschen Herausgabe.", "en": "A Polish version appeared in London shortly after it was first published in Germany.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "95"}, {"id": "P1872.1.8", "kind": "p", "de": "Russisch in Genf in den sechziger Jahren.", "en": "A Russian translation was published in Geneva in the sixties.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "95"}, {"id": "P1872.1.9", "kind": "p", "de": "Ins Dänische wurde es ebenfalls bald nach seinem Erscheinen übersetzt.", "en": "Into Danish, too, it was translated shortly after its appearance.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "95"}, {"id": "P1872.2.1", "kind": "p", "de": "Wie sehr sich auch die Verhältnisse in den letzten fünfundzwanzig Jahren geändert haben, die in diesem \"Manifest\" entwickelten allgemeinen Grundsätze behalten im ganzen und großen auch heute noch ihre volle Richtigkeit.", "en": "However much that state of things may have altered during the last twenty-five years, the general principles laid down in the Manifesto are, on the whole, as correct today as ever.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "95"}, {"id": "P1872.2.2", "kind": "p", "de": "Einzelnes wäre hier und da zu bessern.", "en": "Here and there, some detail might be improved.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "95"}, {"id": "P1872.2.3", "kind": "p", "de": "Die praktische Anwendung dieser Grundsätze, erklärt das \"Manifest\" selbst, wird überall und jederzeit von den geschichtlich vorliegenden Umständen abhängen, und wird deshalb durchaus kein besonderes Gewicht auf die am Ende von Abschnitt II vorgeschlagenen revolutionären Maßregeln gelegt.", "en": "The practical application of the principles will depend, as the Manifesto itself states, everywhere and at all times, on the historical conditions for the time being existing, and, for that reason, no special stress is laid on the revolutionary measures proposed at the end of Section II. That passage would, in many respects, be very differently worded today.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "95", "review": true, "review_reason": "2 de sentence(s) matched to 1 en sentence(s)"}, {"id": "P1872.2.4", "kind": "p", "de": "Dieser Passus würde heute in vieler Beziehung anders lauten.", "en": "", "joined_to": "P1872.2.3", "modern": "", "modern_status": "joined", "notes": "'This passage' is the end of Section II, the ten measures (II.67.1 to II.79.1).", "mew_page": "95"}, {"id": "P1872.2.5", "kind": "p", "de": "Gegenüber der immensen Fortentwicklung der großen Industrie in den letzten fünfundzwanzig Jahren und der mit ihr fortschreitenden Parteiorganisation der Arbeiterklasse, gegenüber den praktischen Erfahrungen, zuerst der Februarrevolution und noch weit mehr der Pariser Kommune, wo das Proletariat zum erstenmal zwei Monate lang die politische Gewalt innehatte, ist heute dies Programm stellenweise veraltet.", "en": "In view of the gigantic strides of Modern Industry since 1848, and of the accompanying improved and extended organization of the working class, in view of the practical experience gained, first in the February Revolution, and then, still more, in the Paris Commune, where the proletariat for the first time held political power for two whole months, this programme has in some details been antiquated.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "95-96"}, {"id": "P1872.2.6", "kind": "p", "de": "Namentlich hat die Kommune den Beweis geliefert, daß \"die Arbeiterklasse nicht die fertige Staatsmaschine einfach in Besitz nehmen und sie für ihre eigenen Zwecke in Bewegung setzen kann\".", "en": "One thing especially was proved by the Commune, viz., that \"the working class cannot simply lay hold of the ready-made state machinery, and wield it for its own purposes.\"", "modern": "", "modern_status": "empty", "notes": "Cross-reference II.66.1.", "mew_page": "96"}, {"id": "P1872.2.7", "kind": "p", "de": "(Siehe \"Der Bürgerkrieg in Frankreich. Adresse des Generalraths der Internationalen Arbeiter-Association\", deutsche Ausgabe, S. 19, wo dies weiter entwickelt ist.)", "en": "(See The Civil War in France: Address of the General Council of the International Working Men's Association, 1871, where this point is further developed.)", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "96"}, {"id": "P1872.2.8", "kind": "p", "de": "Ferner ist selbstredend, daß die Kritik der sozialistischen Literatur für heute lückenhaft ist, weil sie nur bis 1847 reicht; ebenso daß die Bemerkungen über die Stellung der Kommunisten zu den verschiedenen Oppositionsparteien (Abschnitt IV), wenn in den Grundzügen auch heute noch richtig, doch in ihrer Ausführung heute schon deswegen veraltet sind, weil die politische Lage sich total umgestaltet und die geschichtliche Entwicklung die meisten der dort aufgezählten Parteien aus der Welt geschafft hat.", "en": "Further, it is self-evident that the criticism of socialist literature is deficient in relation to the present time, because it comes down only to 1847; also that the remarks on the relation of the Communists to the various opposition parties (Section IV), although, in principle still correct, yet in practice are antiquated, because the political situation has been entirely changed, and the progress of history has swept from off the earth the greater portion of the political parties there enumerated.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "96"}, {"id": "P1872.3.1", "kind": "p", "de": "Indes, das \"Manifest\" ist ein geschichtliches Dokument, an dem zu ändern wir uns nicht mehr das Recht zuschreiben.", "en": "But then, the Manifesto has become a historical document which we have no longer any right to alter.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "96"}, {"id": "P1872.3.2", "kind": "p", "de": "Eine spätere Ausgabe erscheint vielleicht begleitet von einer den Abstand von 1847 bis jetzt überbrückenden Einleitung; der vorliegende Abdruck kam uns zu unerwartet, um uns Zeit dafür zu lassen.", "en": "A subsequent edition may perhaps appear with an introduction bridging the gap from 1847 to the present day; but this reprint was too unexpected to leave us time for that.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "96"}, {"id": "P1872.4.1", "kind": "signature", "de": "London, 24. Juni 1872", "en": "Karl Marx & Frederick Engels June 24, 1872, London", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "96", "review": true, "review_reason": "2 de sentence(s) matched to 2 en sentence(s)"}, {"id": "P1872.5.1", "kind": "signature", "de": "Karl Marx Friedrich Engels", "en": "", "joined_to": "P1872.4.1", "modern": "", "modern_status": "joined", "notes": "", "mew_page": "96"}]}, {"section": "P1882", "title_de": "Vorrede [zur zweiten russischen Ausgabe von 1882]", "title_en": "Preface to The 1882 Russian Edition", "source_de": "MEW 19, S. 295-296 (Dietz, Berlin) via mlwerke.de", "source_en": "Marxists Internet Archive transcription; English is a later translation (Progress Publishers, Moscow 1969), licence unverified", "original_language": "de", "anchor": "de", "verses": [{"id": "P1882.0.1", "kind": "heading", "de": "Vorrede [zur zweiten russischen Ausgabe von 1882]", "en": "Preface to The 1882 Russian Edition", "modern": "", "modern_status": "empty", "notes": ""}, {"id": "P1882.1.1", "kind": "p", "de": "Die erste russische Ausgabe des \"Manifestes der Kommunistischen Partei\", übersetzt von Bakunin, erschien anfangs der sechziger Jahre in der Druckerei des \"Kolokol\".", "en": "The first Russian edition of the Manifesto of the Communist Party, translated by Bakunin, was published early in the 'sixties by the printing office of the Kolokol [a reference to the Free Russian Printing House].", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "295"}, {"id": "P1882.1.2", "kind": "p", "de": "Der Westen konnte damals in ihr (der russischen Ausgabe des \"Manifests\") nur ein literarisches Kuriosum sehn.", "en": "Then the West could see in it (the Russian edition of the Manifesto) only a literary curiosity.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "295"}, {"id": "P1882.1.3", "kind": "p", "de": "Solche Auffassung wäre heute unmöglich.", "en": "Such a view would be impossible today.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "295"}, {"id": "P1882.2.1", "kind": "p", "de": "Welch beschränktes Gebiet damals (Dezember 1847) die proletarische Bewegung noch einnahm, zeigt am klarsten das Schlußkapitel des \"Manifests\": Stellung der Kommunisten zu den verschiedenen Oppositionsparteien in den verschiedenen Ländern.", "en": "What a limited field the proletarian movement occupied at that time (December 1847) is most clearly shown by the last section: the position of the Communists in relation to the various opposition parties in various countries.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "295"}, {"id": "P1882.2.2", "kind": "p", "de": "Hier fehlen nämlich grad - Rußland und die Vereinigten Staaten.", "en": "Precisely Russia and the United States are missing here.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "295"}, {"id": "P1882.2.3", "kind": "p", "de": "Es war die Zeit, wo Rußland die letzte große Reserve der europäischen Gesamtreaktion bildete; wo die Vereinigten Staaten die proletarische Überkraft Europas durch Einwanderung absorbierten.", "en": "It was the time when Russia constituted the last great reserve of all European reaction, when the United States absorbed the surplus proletarian forces of Europe through immigration.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "295"}, {"id": "P1882.2.4", "kind": "p", "de": "Beide Länder versorgten Europa mit Rohprodukten und waren zugleich Absatzmärkte seiner Industrieerzeugnisse.", "en": "Both countries provided Europe with raw materials and were at the same time markets for the sale of its industrial products.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "295"}, {"id": "P1882.2.5", "kind": "p", "de": "Beide Länder waren damals also, in dieser oder jener Weise, Säulen der bestehenden europäischen Ordnung.", "en": "Both were, therefore, in one way of another, pillars of the existing European system.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "295"}, {"id": "P1882.3.1", "kind": "p", "de": "Wie ganz anders heute!", "en": "How very different today.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "295"}, {"id": "P1882.3.2", "kind": "p", "de": "Grade die europäische Einwanderung befähigte Nordamerika zu einer riesigen Ackerbauproduktion, deren Konkurrenz das europäische Grundeigentum - großes wie kleines - in seinen Grundfesten erschüttert.", "en": "Precisely European immigration fitted North American for a gigantic agricultural production, whose competition is shaking the very foundations of European landed property - large and small.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "295"}, {"id": "P1882.3.3", "kind": "p", "de": "Sie erlaubte zudem den Vereinigten Staaten, ihre ungeheuren industriellen Hülfsquellen mit einer Energie und auf einer Stufenleiter auszubeuten, die das bisherige industrielle Monopol Westeuropas und namentlich Englands binnen kurzem brechen muß.", "en": "At the same time, it enabled the United States to exploit its tremendous industrial resources with an energy and on a scale that must shortly break the industrial monopoly of Western Europe, and especially of England, existing up to now.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "295"}, {"id": "P1882.3.4", "kind": "p", "de": "Beide Umstände wirken revolutionär auf Amerika selbst zurück.", "en": "Both circumstances react in a revolutionary manner upon America itself.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "295"}, {"id": "P1882.3.5", "kind": "p", "de": "Das kleinere und mittlere Grundeigentum der Farmers, die Basis der ganzen politischen Verfassung, erliegt nach und nach der Konkurrenz der Riesenfarms; in den Industriebezirken entwickelt sich gleichzeitig zum ersten Mal ein massenhaftes Proletariat und eine fabelhafte Konzentration der Kapitalien.", "en": "Step by step, the small and middle land ownership of the farmers, the basis of the whole political constitution, is succumbing to the competition of giant farms; at the same time, a mass industrial proletariat and a fabulous concentration of capital funds are developing for the first time in the industrial regions.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "295-296"}, {"id": "P1882.4.1", "kind": "p", "de": "Und nun Rußland!", "en": "And now Russia!", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "296"}, {"id": "P1882.4.2", "kind": "p", "de": "Während der Revolution von 1848/49 fanden nicht nur die europäischen Fürsten, auch die europäischen Bourgeois in der russischen Einmischung die einzige Rettung vor dem eben erst erwachenden Proletariat.", "en": "During the Revolution of 1848-9, not only the European princes, but the European bourgeois as well, found their only salvation from the proletariat just beginning to awaken in Russian intervention.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "296"}, {"id": "P1882.4.3", "kind": "p", "de": "Der Zar wurde als Chef der europäischen Reaktion proklamiert.", "en": "The Tsar was proclaimed the chief of European reaction.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "296"}, {"id": "P1882.4.4", "kind": "p", "de": "Heute ist er Kriegsgefangner der Revolution in Gatschina, und Rußland bildet die Vorhut der revolutionären Aktion in Europa.", "en": "Today, he is a prisoner of war of the revolution in Gatchina, and Russia forms the vanguard of revolutionary action in Europe.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "296"}, {"id": "P1882.5.1", "kind": "p", "de": "Das \"Kommunistische Manifest\" hatte zur Aufgabe, die unvermeidlich bevorstehende Auflösung des modernen bürgerlichen Eigentums zu proklamieren.", "en": "The Communist Manifesto had, as its object, the proclamation of the inevitable impending dissolution of modern bourgeois property.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "296"}, {"id": "P1882.5.2", "kind": "p", "de": "In Rußland aber finden wir, gegenüber rasch aufblühendem kapitalistischen Schwindel und sich eben erst entwickelndem bürgerlichen Grundeigentum, die größere Hälfte des Bodens im Gemeinbesitz der Bauern.", "en": "But in Russia we find, face-to-face with the rapidly flowering capitalist swindle and bourgeois property, just beginning to develop, more than half the land owned in common by the peasants.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "296"}, {"id": "P1882.5.3", "kind": "p", "de": "Es fragt sich nun: Kann die russische Obschtschina, eine wenn auch stark untergrabene Form des uralten Gemeinbesitzes am Boden, unmittelbar in die höhere des kommunistischen Gemeinbesitzes übergehn?", "en": "Now the question is: can the Russian obshchina, though greatly undermined, yet a form of primeval common ownership of land, pass directly to the higher form of Communist common ownership?", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "296"}, {"id": "P1882.5.4", "kind": "p", "de": "Oder muß sie umgekehrt vorher denselben Auflösungsprozeß durchlaufen, der die geschichtliche Entwicklung des Westens ausmacht?", "en": "Or, on the contrary, must it first pass through the same process of dissolution such as constitutes the historical evolution of the West?", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "296"}, {"id": "P1882.6.1", "kind": "p", "de": "Die einzige Antwort hierauf, die heutzutage möglich, ist die: Wird die russische Revolution das Signal einer proletarischen Revolution im Westen, so daß beide einander ergänzen, so kann das jetzige russische Gemeineigentum am Boden zum Ausgangspunkt einer kommunistischen Entwicklung dienen.", "en": "The only answer to that possible today is this: If the Russian Revolution becomes the signal for a proletarian revolution in the West, so that both complement each other, the present Russian common ownership of land may serve as the starting point for a communist development.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "296"}, {"id": "P1882.7.1", "kind": "signature", "de": "Karl Marx - F. Engels", "en": "Karl Marx & Frederick Engels", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "296"}, {"id": "P1882.8.1", "kind": "signature", "de": "London, 21. Januar 1882", "en": "January 21, 1882, London", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "296"}]}, {"section": "P1883", "title_de": "Vorwort [zur deutschen Ausgabe von 1883]", "title_en": "Preface to The 1883 German Edition", "source_de": "MEW 21, S. 3-4 (Dietz, Berlin) via mlwerke.de", "source_en": "Marxists Internet Archive transcription; English is a later translation (Progress Publishers, Moscow 1969), licence unverified", "original_language": "de", "anchor": "de", "verses": [{"id": "P1883.0.1", "kind": "heading", "de": "Vorwort [zur deutschen Ausgabe von 1883]", "en": "Preface to The 1883 German Edition", "modern": "", "modern_status": "empty", "notes": ""}, {"id": "P1883.1.1", "kind": "p", "de": "Das Vorwort zur gegenwärtigen Ausgabe muß ich leider allein unterschreiben.", "en": "The preface to the present edition I must, alas, sign alone.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "3"}, {"id": "P1883.1.2", "kind": "p", "de": "Marx, der Mann, dem die gesamte Arbeiterklasse Europas und Amerikas mehr verdankt als irgendeinem andern - Marx ruht auf dem Friedhof zu Highgate, und über sein Grab wächst bereits das erste Gras.", "en": "Marx, the man to whom the whole working class of Europe and America owes more than to any one else - rests at Highgate Cemetery and over his grave the first grass is already growing.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "3"}, {"id": "P1883.1.3", "kind": "p", "de": "Seit seinem Tode kann von einer Umarbeitung oder Ergänzung des \"Manifestes\" erst recht keine Rede mehr sein.", "en": "Since his death [March 14, 1883], there can be even less thought of revising or supplementing the Manifesto.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "3"}, {"id": "P1883.1.4", "kind": "p", "de": "Für um so nötiger halte ich es, hier nochmals das Folgende ausdrücklich festzustellen.", "en": "But I consider it all the more necessary again to state the following expressly:", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "3"}, {"id": "P1883.2.1", "kind": "p", "de": "Der durchgehende Grundgedanke des \"Manifestes\": daß die ökonomische Produktion und die aus ihr mit Notwendigkeit folgende gesellschaftliche Gliederung einer jeden Geschichtsepoche die Grundlage bildet für die politische und intellektuelle Geschichte dieser Epoche; daß demgemäß (seit Auflösung des uralten Gemeinbesitzes an Grund und Boden) die ganze Geschichte eine Geschichte von Klassenkämpfen gewesen ist, Kämpfen zwischen ausgebeuteten und ausbeutenden, beherrschten und herrschenden Klassen auf verschiedenen Stufen der gesellschaftlichen Entwicklung; daß dieser Kampf aber jetzt eine Stufe erreicht hat, wo die ausgebeutete und unterdrückte Klasse (das Proletariat) sich nicht mehr von der sie ausbeutenden und unterdrückenden Klasse (der Bourgeoisie) befreien kann, ohne zugleich die ganze Gesellschaft für immer von Ausbeutung, Unterdrückung und Klassenkämpfen zu befreien - dieser Grundgedanke gehört einzig und ausschließlich Marx an.", "en": "The basic thought running through the Manifesto - that economic production, and the structure of society of every historical epoch necessarily arising therefrom, constitute the foundation for the political and intellectual history of that epoch; that consequently (ever since the dissolution of the primaeval communal ownership of land) all history has been a history of class struggles, of struggles between exploited and exploiting, between dominated and dominating classes at various stages of social evolution; that this struggle, however, has now reached a stage where the exploited and oppressed class (the proletariat) can no longer emancipate itself from the class which exploits and oppresses it (the bourgeoisie), without at the same time forever freeing the whole of society from exploitation, oppression, class struggles - this basic thought belongs solely and exclusively to Marx.", "modern": "", "modern_status": "empty", "notes": "", "footnotes": ["P1883.N1"], "mew_page": "3"}, {"id": "P1883.3.1", "kind": "p", "de": "Ich habe das schon oft ausgesprochen; es ist aber gerade jetzt nötig, daß es auch vor dem \"Manifest\" selbst steht.", "en": "I have already stated this many times; but precisely now is it necessary that it also stand in front of the Manifesto itself.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "4"}, {"id": "P1883.4.1", "kind": "signature", "de": "London, 28. Juni 1883", "en": "Frederick Engels June 28, 1883, London", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "4", "review": true, "review_reason": "2 de sentence(s) matched to 2 en sentence(s)"}, {"id": "P1883.5.1", "kind": "signature", "de": "F. Engels", "en": "", "joined_to": "P1883.4.1", "modern": "", "modern_status": "joined", "notes": "", "mew_page": "4"}, {"id": "P1883.N1.1.1", "kind": "note", "de": "\"Diesem Gedanken\", sage ich in der Vorrede zur englischen Übersetzung, \"der nach meiner Ansicht berufen ist, für die Geschichtswissenschaft denselben Fortschritt zu begründen, den Darwins Theorie für die Naturwissenschaft begründet hat - diesem Gedanken hatten wir beide uns schon mehrere Jahre vor 1845 allmählich genähert.", "en": "\"This proposition,\" I wrote in the preface to the English translation, \"which, in my opinion, is destined to do for history what Darwin's theory has done for biology, we both of us, had been gradually approaching for some years before 1845.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur deutschen Ausgabe von 1890"}, {"id": "P1883.N1.1.2", "kind": "note", "de": "Wieweit ich selbständig mich in dieser Richtung voranbewegt, zeigt meine 'Lage der arbeitenden Klasse in England'.", "en": "How far I had independently progressed towards it is best shown by my Conditions of the Working Class in England.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur deutschen Ausgabe von 1890"}, {"id": "P1883.N1.1.3", "kind": "note", "de": "Als ich aber im Frühjahr 1845 Marx in Brüssel wiedertraf, hatte er ihn fertig ausgearbeitet und legte ihn mir vor in fast ebenso klaren Worten wie die, worin ich ihn oben zusammengefaßt.\"", "en": "But when I again met Marx at Brussels, in spring 1845, he had it already worked out and put it before me in terms almost as clear as those in which I have stated it here.\"", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur deutschen Ausgabe von 1890"}]}, {"section": "P1888", "title_de": "Vorrede [zur englischen Ausgabe von 1888]", "title_en": "Preface to The 1888 English Edition", "source_de": "MEW 21, S. 352-359 (Dietz, Berlin) via mlwerke.de; German is MEW's editorial translation, NOT an original", "source_en": "Marxists Internet Archive transcription of Engels's own English", "original_language": "en", "anchor": "en", "verses": [{"id": "P1888.0.1", "kind": "heading", "de": "Vorrede [zur englischen Ausgabe von 1888]", "en": "Preface to The 1888 English Edition", "modern": "", "modern_status": "empty", "notes": ""}, {"id": "P1888.1.1", "kind": "p", "de": "Das \"Manifest\" wurde als Plattform des Bundes der Kommunisten veröffentlicht, einer anfangs ausschließlich deutschen, später internationalen Arbeiterassoziation, die unter den politischen Verhältnissen des europäischen Kontinents vor 1848 unvermeidlich eine Geheimorganisation war.", "en": "The Manifesto was published as the platform of the Communist League, a working men's association, first exclusively German, later on international, and under the political conditions of the Continent before 1848, unavoidably a secret society.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "352"}, {"id": "P1888.1.2", "kind": "p", "de": "Auf dem Kongreß des Bundes, der im November 1847 in London stattfand, wurden Marx und Engels beauftragt, die Veröffentlichung eines vollständigen theoretischen und praktischen Parteiprogramms in die Wege zu leiten.", "en": "At a Congress of the League, held in November 1847, Marx and Engels were commissioned to prepare a complete theoretical and practical party programme.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "352"}, {"id": "P1888.1.3", "kind": "p", "de": "In deutscher Sprache abgefaßt, wurde das Manuskript im Januar 1848, wenige Wochen vor der französischen Revolution vom 24. Februar, nach London zum Druck geschickt. Eine französische Übersetzung wurde kurz vor der Juni-Insurrektion von 1848 in Paris herausgebracht.", "en": "Drawn up in German, in January 1848, the manuscript was sent to the printer in London a few weeks before the French Revolution of February 24. A French translation was brought out in Paris shortly before the insurrection of June 1848.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "352", "review": true, "review_reason": "1 en sentence(s) matched to 2 de sentence(s)"}, {"id": "P1888.1.4", "kind": "p", "de": "Die erste englische Übersetzung, von Miss Helen Macfarlane besorgt, erschien 1850 in George Julian Harneys \"Red Republican\" in London.", "en": "The first English translation, by Miss Helen Macfarlane, appeared in George Julian Harney's Red Republican, London, 1850.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "352"}, {"id": "P1888.1.5", "kind": "p", "de": "Auch eine dänische und eine polnische Ausgabe wurden veröffentlicht.", "en": "A Danish and a Polish edition had also been published.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "352"}, {"id": "P1888.2.1", "kind": "p", "de": "Die Niederschlagung der Pariser Juni-Insurrektion von 1848 - dieser ersten großen Schlacht zwischen Proletariat und Bourgeoisie - drängte die sozialen und politischen Bestrebungen der Arbeiterklasse Europas zeitweilig wieder in den Hintergrund.", "en": "The defeat of the Parisian insurrection of June 1848 - the first great battle between proletariat and bourgeoisie - drove again into the background, for a time, the social and political aspirations of the European working class.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "352"}, {"id": "P1888.2.2", "kind": "p", "de": "Seitdem spielte sich der Kampf um die Vormachtstellung wieder, wie in der Zeit vor der Februarrevolution, allein zwischen verschiedenen Gruppen der besitzenden Klasse ab; die Arbeiterklasse wurde beschränkt auf einen Kampf um politische Ellbogenfreiheit und auf die Position eines äußersten linken Flügels der radikalen Bourgeoisie.", "en": "Thenceforth, the struggle for supremacy was, again, as it had been before the Revolution of February, solely between different sections of the propertied class; the working class was reduced to a fight for political elbow-room, and to the position of extreme wing of the middle-class Radicals.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "352"}, {"id": "P1888.2.3", "kind": "p", "de": "Wo selbständige proletarische Bewegungen fortfuhren, Lebenszeichen von sich zu geben, wurden sie erbarmungslos niedergeschlagen.", "en": "Wherever independent proletarian movements continued to show signs of life, they were ruthlessly hunted down.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "352"}, {"id": "P1888.2.4", "kind": "p", "de": "So spürte die preußische Polizei die Zentralbehörde des Bundes der Kommunisten auf, die damals ihren Sitz in Köln hatte.", "en": "Thus the Prussian police hunted out the Central Board of the Communist League, then located in Cologne.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "352"}, {"id": "P1888.2.5", "kind": "p", "de": "Die Mitglieder wurden verhaftet und nach achtzehnmonatiger Haft im Oktober 1852 vor Gericht gestellt.", "en": "The members were arrested and, after eighteen months' imprisonment, they were tried in October 1852.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "352-353"}, {"id": "P1888.2.6", "kind": "p", "de": "Dieser berühmte \"Kölner Kommunistenprozeß\" dauerte vom 4. Oktober bis 12. November; sieben von den Gefangenen wurdet zu Festungshaft für die Dauer von drei bis sechs Jahren verurteilt.", "en": "This celebrated \"Cologne Communist Trial\" lasted from October 4 till November 12; seven of the prisoners were sentenced to terms of imprisonment in a fortress, varying from three to six years.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "353"}, {"id": "P1888.2.7", "kind": "p", "de": "Sofort nach dem Urteilsspruch wurde der Bund durch die noch verbliebenen Mitglieder formell aufgelöst.", "en": "Immediately after the sentence, the League was formally dissolved by the remaining members.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "353"}, {"id": "P1888.2.8", "kind": "p", "de": "Was das \"Manifest\" anbelangt, so schien es von da an verdammt zu sein, der Vergessenheit anheimzufallen.", "en": "As to the Manifesto, it seemed henceforth doomed to oblivion.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "353"}, {"id": "P1888.3.1", "kind": "p", "de": "Als die europäische Arbeiterklasse wieder genügend Kraft zu einem neuen Angriff auf die herrschende Klasse gesammelt hatte, entstand die Internationale Arbeiterassoziation.", "en": "When the European workers had recovered sufficient strength for another attack on the ruling classes, the International Working Men's Association sprang up.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "353"}, {"id": "P1888.3.2", "kind": "p", "de": "Aber diese Assoziation, die ausdrücklich zu dem Zwecke gegründet wurde, das gesamte kampfgewillte Proletariat Europas und Amerikas zu einer einzigen Körperschaft zusammenzuschweißen, konnte die im \"Manifest\" niedergelegten Grundsätze nicht sofort proklamieren.", "en": "But this association, formed with the express aim of welding into one body the whole militant proletariat of Europe and America, could not at once proclaim the principles laid down in the Manifesto.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "353"}, {"id": "P1888.3.3", "kind": "p", "de": "Die Internationale mußte ein Programm haben, breit genug, um für die englischen Trade-Unions, für die französischen, belgischen, italienischen und spanischen Anhänger Proudhons und für die Lassalleaner in Deutschland annehmbar zu sein.", "en": "The International was bound to have a programme broad enough to be acceptable to the English trade unions, to the followers of Proudhon in France, Belgium, Italy, and Spain, and to the Lassalleans in Germany.", "modern": "", "modern_status": "empty", "notes": "", "footnotes": ["P1888.N1"], "mew_page": "353"}, {"id": "P1888.4.1", "kind": "p", "de": "Marx, der dieses Programm zur Zufriedenheit aller Parteien abfaßte, hatte volles Vertrauen zur intellektuellen Entwicklung der Arbeiterklasse, einer Entwicklung, wie sie aus der vereinigten Aktion und der gemeinschaftlichen Diskussion notwendig hervorgehn mußte.", "en": "Marx, who drew up this programme to the satisfaction of all parties, entirely trusted to the intellectual development of the working class, which was sure to result from combined action and mutual discussion.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "353"}, {"id": "P1888.4.2", "kind": "p", "de": "Die Ereignisse und Wechselfälle im Kampf gegen das Kapital, die Niederlagen noch mehr als die Siege, konnten nicht verfehlen, den Menschen die Unzulänglichkeit ihrer diversen Lieblings-Quacksalbereien zum Bewußtsein zu bringen und den Weg zu vollkommener Einsicht in die wirklichen Voraussetzungen der Emanzipation der Arbeiterklasse zu bahnen.", "en": "The very events and vicissitudes in the struggle against capital, the defeats even more than the victories, could not help bringing home to men's minds the insufficiency of their various favorite nostrums, and preparing the way for a more complete insight into the true conditions for working-class emancipation.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "353"}, {"id": "P1888.4.3", "kind": "p", "de": "Und Marx hatte recht.", "en": "And Marx was right.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "353"}, {"id": "P1888.4.4", "kind": "p", "de": "Als im Jahre 1874 die Internationale zerfiel, ließ sie die Arbeiter schon in einem ganz anderen Zustand zurück, als sie sie bei ihrer Gründung im Jahre 1864 vorgefunden hatte.", "en": "The International, on its breaking in 1874, left the workers quite different men from what it found them in 1864.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "353"}, {"id": "P1888.4.5", "kind": "p", "de": "Der Proudhonismus in Frankreich, der Lassalleanismus in Deutschland waren am Absterben, und auch die konservativen englischen Trade-Unions näherten sich, obgleich sie in ihrer Mehrheit die Verbindung mit der Internationale schon längst gelöst hatten, allmählich dem Punkt, wo ihr Präsident [Bevan] im vergangenen Jahre in Swansea in ihrem Namen erklären konnte: \"Der kontinentale Sozialismus hat seine Schrecken für uns verloren.\"", "en": "Proudhonism in France, Lassalleanism in Germany, were dying out, and even the conservative English trade unions, though most of them had long since severed their connection with the International, were gradually advancing towards that point at which, last year at Swansea, their president [W. Bevan] could say in their name: \"Continental socialism has lost its terror for us.\"", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "353-354"}, {"id": "P1888.4.6", "kind": "p", "de": "In der Tat: Die Grundsätze des \"Manifestes\" hatten unter den Arbeitern aller Länder erhebliche Fortschritte gemacht.", "en": "In fact, the principles of the Manifesto had made considerable headway among the working men of all countries.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "354"}, {"id": "P1888.5.1", "kind": "p", "de": "Auf diese Weise trat das \"Manifest\" selbst wieder in den Vordergrund.", "en": "The Manifesto itself came thus to the front again.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "354"}, {"id": "P1888.5.2", "kind": "p", "de": "Der deutsche Text war seit 1850 in der Schweiz, in England und in Amerika mehrmals neu gedruckt worden.", "en": "Since 1850, the German text had been reprinted several times in Switzerland, England, and America.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "354"}, {"id": "P1888.5.3", "kind": "p", "de": "Im Jahre 1872 wurde es ins Englische übersetzt, und zwar in New York, wo die Übersetzung in \"Woodhull & Claflin's Weekly\" veröffentlicht wurde.", "en": "In 1872, it was translated into English in New York, where the translation was published in Woorhull and Claflin's Weekly.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "354"}, {"id": "P1888.5.4", "kind": "p", "de": "Auf Grund dieser englischen Fassung wurde in \"Le Socialiste \" in New York auch eine französische angefertigt.", "en": "From this English version, a French one was made in Le Socialiste of New York.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "354"}, {"id": "P1888.5.5", "kind": "p", "de": "Seitdem sind in Amerika noch mindestens zwei englische Übersetzungen, mehr oder minder entstellt, herausgebracht worden, von denen eine in England nachgedruckt wurde.", "en": "Since then, at least two more English translations, more or less mutilated, have been brought out in America, and one of them has been reprinted in England.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "354"}, {"id": "P1888.5.6", "kind": "p", "de": "Die von Bakunin besorgte erste russische Übersetzung wurde etwa um das Jahr 1863 in der Druckerei von Herzens \"Kolokol\" in Genf herausgegeben, eine zweite, gleichfalls in Genf, von der heldenhaften Vera Sassulitsch, 1882.", "en": "The first Russian translation, made by Bakunin, was published at Herzen's Kolokol office in Geneva, about 1863; a second one, by the heroic Vera Zasulich, also in Geneva, in 1882.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "354"}, {"id": "P1888.5.7", "kind": "p", "de": "Eine neue dänische Ausgabe findet sich in der \"Socialdemokratisk Bibliotek\", Kopenhagen 1885; eine neue französische Übersetzung in \"Le Socialiste\", Paris 1886.", "en": "A new Danish edition is to be found in Socialdemokratisk Bibliothek, Copenhagen, 1885; a fresh French translation in Le Socialiste, Paris, 1886.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "354"}, {"id": "P1888.5.8", "kind": "p", "de": "Nach dieser letzteren wurde eine spanische Übersetzung vorbereitet und 1886 in Madrid veröffentlicht.", "en": "From this latter, a Spanish version was prepared and published in Madrid, 1886.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "354"}, {"id": "P1888.5.9", "kind": "p", "de": "Die Zahl der deutschen Nachdrucke läßt sich nicht genau angeben, im ganzen waren es mindestens zwölf.", "en": "The German reprints are not to be counted; there have been twelve altogether at the least.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "354"}, {"id": "P1888.5.10", "kind": "p", "de": "Eine Übertragung ins Armenische, die vor einigen Monaten in Konstantinopel herauskommen sollte, erblickte nicht das Licht der Welt, weil, wie man mir mitteilte, der Verleger nicht den Mut hatte, ein Buch herauszubringen, auf dem der Name Marx stand, während der Übersetzer es ablehnte, es als sein eigenes Werk zu bezeichnen.", "en": "An Armenian translation, which was to be published in Constantinople some months ago, did not see the light, I am told, because the publisher was afraid of bringing out a book with the name of Marx on it, while the translator declined to call it his own production.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "354"}, {"id": "P1888.5.11", "kind": "p", "de": "Von weiteren Übersetzungen in andere Sprachen habe ich zwar gehört, sie aber nicht zu Gesicht bekommen.", "en": "Of further translations into other languages I have heard but had not seen.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "354"}, {"id": "P1888.5.12", "kind": "p", "de": "So spiegelt die Geschichte des \"Manifestes\" in hohem Maße die Geschichte der modernen Arbeiterbewegung wider; gegenwärtig ist es zweifellos das weitest verbreitete, internationalste Werk der ganzen sozialistischen Literatur, ein gemeinsames Programm, das von Millionen Arbeitern von Sibirien bis Kalifornien anerkannt wird.", "en": "Thus the history of the Manifesto reflects the history of the modern working-class movement; at present, it is doubtless the most wide spread, the most international production of all socialist literature, the common platform acknowledged by millions of working men from Siberia to California.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "354"}, {"id": "P1888.6.1", "kind": "p", "de": "Und doch hätten wir es, als es geschrieben wurde, nicht ein sozialistisches Manifest nennen können.", "en": "Yet, when it was written, we could not have called it a socialist manifesto.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "354"}, {"id": "P1888.6.2", "kind": "p", "de": "Unter Sozialisten verstand man 1847 einerseits die Anhänger der verschiedenen utopischen Systeme: die Owenisten in England, die Fourieristen in Frankreich, die beide bereits zu bloßen, allmählich aussterbenden Sekten zusammengeschrumpft waren; andererseits die mannigfaltigsten sozialen Quacksalber, die mit allerhand Flickwerk, ohne jede Gefahr für Kapital und Profit die gesellschaftlichen Mißstände aller Art zu beseitigen versprachen - in beiden Fällen Leute, die außerhalb der Arbeiterbewegung standen und eher Unterstützung bei den \"gebildeten\" Klassen suchten.", "en": "By Socialists, in 1847, were understood, on the one hand the adherents of the various Utopian systems: Owenites in England, Fourierists in France, both of them already reduced to the position of mere sects, and gradually dying out; on the other hand, the most multifarious social quacks who, by all manner of tinkering, professed to redress, without any danger to capital and profit, all sorts of social grievances, in both cases men outside the working-class movement, and looking rather to the \"educated\" classes for support.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "354-357"}, {"id": "P1888.6.3", "kind": "p", "de": "Derjenige Teil der Arbeiterklasse, der sich von der Unzulänglichkeit bloßer politischer Umwälzungen überzeugt hatte und die Notwendigkeit einer totalen Umgestaltung der Gesellschaft forderte, dieser Teil nannte sich damals kommunistisch.", "en": "Whatever portion of the working class had become convinced of the insufficiency of mere political revolutions, and had proclaimed the necessity of total social change, called itself Communist.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "357"}, {"id": "P1888.6.4", "kind": "p", "de": "Es war eine noch rohe, unbehauene, rein instinktive Art Kommunismus; aber er traf den Kardinalpunkt und war in der Arbeiterklasse mächtig genug, um den utopischen Kommunismus zu erzeugen, in Frankreich den von Cabet, in Deutschland den von Weitling.", "en": "It was a crude, rough-hewn, purely instinctive sort of communism; still, it touched the cardinal point and was powerful enough amongst the working class to produce the Utopian communism of Cabet in France, and of Weitling in Germany.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "357"}, {"id": "P1888.6.5", "kind": "p", "de": "So war denn 1847 Sozialismus eine Bewegung der Mittelklasse, Kommunismus eine Bewegung der Arbeiterklasse.", "en": "Thus, in 1847, socialism was a middle-class movement, communism a working-class movement.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "357"}, {"id": "P1888.6.6", "kind": "p", "de": "Der Sozialismus war, auf dem Kontinent wenigstens, \"salonfähig\"; der Kommunismus war das gerade Gegenteil.", "en": "Socialism was, on the Continent at least, \"respectable\"; communism was the very opposite.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "357"}, {"id": "P1888.6.7", "kind": "p", "de": "Und da wir von allem Anfang an der Meinung waren, daß \"die Emanzipation der Arbeiterklasse das Werk der Arbeiterklasse selbst sein muß\", so konnte kein Zweifel darüber bestehen, welchen der beiden Namen wir wählen mußten.", "en": "And as our notion, from the very beginning, was that \"the emancipation of the workers must be the act of the working class itself,\" there could be no doubt as to which of the two names we must take.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "357"}, {"id": "P1888.6.8", "kind": "p", "de": "Ja noch mehr, auch seitdem ist es uns nie in den Sinn gekommen, uns von ihm loszusagen.", "en": "Moreover, we have, ever since, been far from repudiating it.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "357"}, {"id": "P1888.7.1", "kind": "p", "de": "Obgleich das \"Manifest\" unser beider gemeinsame Arbeit war, so halte ich mich doch für verpflichtet festzustellen, daß der Grundgedanke, der seinen Kern bildet, Marx angehört.", "en": "The Manifesto being our joint production, I consider myself bound to state that the fundamental proposition which forms the nucleus belongs to Marx.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "357"}, {"id": "P1888.7.2", "kind": "p", "de": "Dieser Gedanke besteht darin: daß in jeder geschichtlichen Epoche die vorherrschende wirtschaftliche Produktions- und Austauschweise und die aus ihr mit Notwendigkeit folgende gesellschaftliche Gliederung die Grundlage bildet, auf der die politische und die intellektuelle Geschichte dieser Epoche sich aufbaut und aus der allein sie erklärt werden kann; daß demgemäß die ganze Geschichte der Menschheit (seit Aufhebung der primitiven Gentilordnung mit ihrem Gemeinbesitz an Grund und Boden) eine Geschichte von Klassenkämpfen gewesen ist. Kämpfen zwischen ausbeutenden und ausgebeuteten, herrschenden und unterdrückten Klassen; daß die Geschichte dieser Klassenkämpfe eine Entwicklungsreihe darstellt, in der gegenwärtig eine Stufe erreicht ist, wo die ausgebeutete und unterdrückte Klasse - das Proletariat - ihre Befreiung vom Joch der ausbeutenden und herrschenden Klasse - der Bourgeoisie - nicht erreichen kann, ohne zugleich die ganze Gesellschaft ein für allemal von aller Ausbeutung und Unterdrückung, von allen Klassenunterschieden und Klassenkämpfen zu befreien.", "en": "That proposition is: That in every historical epoch, the prevailing mode of economic production and exchange, and the social organization necessarily following from it, form the basis upon which it is built up, and from that which alone can be explained the political and intellectual history of that epoch; that consequently the whole history of mankind (since the dissolution of primitive tribal society, holding land in common ownership) has been a history of class struggles, contests between exploiting and exploited, ruling and oppressed classes; That the history of these class struggles forms a series of evolutions in which, nowadays, a stage has been reached where the exploited and oppressed class - the proletariat - cannot attain its emancipation from the sway of the exploiting and ruling class - the bourgeoisie - without, at the same time, and once and for all, emancipating society at large from all exploitation, oppression, class distinction, and class struggles.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "357", "review": true, "review_reason": "1 en sentence(s) matched to 2 de sentence(s)"}, {"id": "P1888.8.1", "kind": "p", "de": "Diesem Gedanken, der nach meiner Ansicht berufen ist, für die Geschichtswissenschaft denselben Fortschritt zu begründen, den Darwins Theorie für die Naturwissenschaft begründet hat - diesem Gedanken hatten wir beide uns schon mehrere Jahre vor 1845 allmählich genähert.", "en": "This proposition, which, in my opinion, is destined to do for history what Darwin's theory has done for biology, we both of us, had been gradually approaching for some years before 1845.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "357"}, {"id": "P1888.8.2", "kind": "p", "de": "Wieweit ich selbständig mich in dieser Richtung voranbewegt, zeigt am besten meine \"Lage der arbeitenden Klasse in England\".", "en": "How far I had independently progressed towards it is best shown by my \"Conditions of the Working Class in England.\"", "modern": "", "modern_status": "empty", "notes": "", "footnotes": ["P1888.N2"], "mew_page": "357-358"}, {"id": "P1888.8.3", "kind": "p", "de": "Als ich aber im Frühjahr 1845 Marx in Brüssel wiedertraf, hatte er ihn fertig ausgearbeitet und legte ihn mir vor in fast ebenso klaren Worten wie die, worin ich ihn oben zusammengefaßt.", "en": "But when I again met Marx at Brussels, in spring 1845, he had it already worked out and put it before me in terms almost as clear as those in which I have stated it here.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "358"}, {"id": "P1888.9.1", "kind": "p", "de": "Aus unserem gemeinsamen Vorwort zur deutschen Ausgabe von 1872 zitiere ich das Folgende:", "en": "From our joint preface to the German edition of 1872, I quote the following:", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "358"}, {"id": "P1888.10.1", "kind": "p", "de": "\"Wie sehr sich auch die Verhältnisse in den letzten fünfundzwanzig Jahren geändert haben, die in diesem 'Manifest' entwickelten allgemeinen Grundsätze behalten im ganzen und großen auch heute noch ihre volle Richtigkeit.", "en": "\"However much that state of things may have altered during the last twenty-five years, the general principles laid down in the Manifesto are, on the whole, as correct today as ever.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "358"}, {"id": "P1888.10.2", "kind": "p", "de": "Einzelnes wäre hier und da zu bessern.", "en": "Here and there, some detail might be improved.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "358"}, {"id": "P1888.10.3", "kind": "p", "de": "Die praktische Anwendung dieser Grundsätze, erklärt das 'Manifest' selbst, wird überall und jederzeit von den geschichtlich vorliegenden Umständen abhängen, und wird deshalb durchaus kein besonderes Gewicht auf die am Ende von Abschnitt II vorgeschlagenen revolutionären Maßregeln gelegt. Dieser Passus würde heute in vieler Beziehung anders lauten.", "en": "The practical application of the principles will depend, as the Manifesto itself states, everywhere and at all times, on the historical conditions for the time being existing, and, for that reason, no special stress is laid on the revolutionary measures proposed at the end of Section II. That passage would, in many respects, be very differently worded today.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "358", "review": true, "review_reason": "1 en sentence(s) matched to 2 de sentence(s)"}, {"id": "P1888.10.4", "kind": "p", "de": "Gegenüber der immensen Fortentwicklung der großen Industrie seit 1848 und der sie begleitenden verbesserten und gewachsenen Organisation der Arbeiterklasse, gegenüber den praktischen Erfahrungen, zuerst der Februarrevolution und noch weit mehr der Pariser Kommune, wo das Proletariat zum erstenmal zwei Monate lang die politische Gewalt innehatte, ist heute dies Programm stellenweise veraltet.", "en": "In view of the gigantic strides of Modern Industry since 1848, and of the accompanying improved and extended organization of the working class, in view of the practical experience gained, first in the February Revolution, and then, still more, in the Paris Commune, where the proletariat for the first time held political power for two whole months, this programme has in some details been antiquated.", "modern": "", "modern_status": "empty", "notes": "", "de_variants": [{"ref": "T1", "editions": "1872", "reading": "in den letzten fünfundzwanzig Jahren und der mit ihr fortschreitenden Parteiorganisation (statt: seit 1848 und der sie begleitenden verbesserten und gewachsenen Organisation)", "base_text": "der Arbeiterklasse, gegenüber den praktischen …"}], "mew_page": "358"}, {"id": "P1888.10.5", "kind": "p", "de": "Namentlich hat die Kommune den Beweis geliefert, daß 'die Arbeiterklasse nicht die fertige Staatsmaschine einfach in Besitz nehmen und sie für ihre eignen Zwecke in Bewegung setzen kann'.", "en": "One thing especially was proved by the Commune, viz., that \"the working class cannot simply lay hold of ready-made state machinery, and wield it for its own purposes.\"", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "358"}, {"id": "P1888.10.6", "kind": "p", "de": "(Siehe ' The Civil War in France. Address of the General Council of the International Working-Men's Association', London, Truelove, 1871, p. 15, wo dies weiterentwickelt ist.)", "en": "(See The Civil War in France: Address of the General Council of the International Working Men's Association 1871, where this point is further developed.)", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "358"}, {"id": "P1888.10.7", "kind": "p", "de": "Ferner ist selbstredend, daß die Kritik der sozialistischen Literatur für heute lückenhaft ist, weil sie nur bis 1847 reicht; ebenso daß die Bemerkungen über die Stellung der Kommunisten zu den verschiedenen Oppositionsparteien (Abschnitt IV), wenn in den Grundzügen auch heute noch richtig, doch in ihrer Ausführung heute schon deswegen veraltet sind, weil die politische Lage sich total umgestaltet und die geschichtliche Entwicklung die meisten der dort aufgezählten Parteien aus der Welt geschafft hat.", "en": "Further, it is self-evident that the criticism of socialist literature is deficient in relation to the present time, because it comes down only to 1847; also that the remarks on the relation of the Communists to the various opposition parties (Section IV), although, in principle still correct, yet in practice are antiquated, because the political situation has been entirely changed, and the progress of history has swept from off the Earth the greater portion of the political parties there enumerated.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "358-359"}, {"id": "P1888.11.1", "kind": "p", "de": "Indes, das 'Manifest' ist ein geschichtliches Dokument, an dem zu ändern wir uns nicht mehr das Recht zuschreiben.\"", "en": "\"But then, the Manifesto has become a historical document which we have no longer any right to alter.\"", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "359"}, {"id": "P1888.12.1", "kind": "p", "de": "Die vorliegende Übersetzung stammt von Herrn Samuel Moore, dem Übersetzer des größten Teils von Marx' \"Kapital\".", "en": "The present translation is by Mr Samuel Moore, the translator of the greater portion of Marx's \"Capital.\"", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "359"}, {"id": "P1888.12.2", "kind": "p", "de": "Wir haben sie gemeinsam durchgesehen, und ich habe ein paar Fußnoten zur Erklärung geschichtlicher Anspielungen hinzugefügt.", "en": "We have revised it in common, and I have added a few notes explanatory of historical allusions.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "359"}, {"id": "P1888.13.1", "kind": "signature", "de": "London, 30. Januar 1888 Friedrich Engels", "en": "Frederick Engels", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "359", "review": true, "review_reason": "2 en sentence(s) matched to 2 de sentence(s)"}, {"id": "P1888.14.1", "kind": "signature", "de": "", "en": "January 30, 1888, London", "joined_to": "P1888.13.1", "modern": "", "modern_status": "joined", "notes": "", "mew_page": "359"}, {"id": "P1888.N1.1.1", "kind": "note", "de": "Lassalle persönlich bekannte sich uns gegenüber stets als Schüler von Marx und stand als solcher auf dem Boden des \"Manifestes\".", "en": "Lassalle personally, to us, always acknowledged himself to be a disciple of Marx, and, as such, stood on the ground of the Manifesto.", "modern": "", "modern_status": "empty", "notes": ""}, {"id": "P1888.N1.1.2", "kind": "note", "de": "Jedoch ging er in seiner öffentlichen Agitation in den Jahren 1862-1864 über die Forderung nach Produktivgenossenschaften mit Staatskredit nicht hinaus.", "en": "But in his first public agitation, 1862-1864, he did not go beyond demanding co-operative workshops supported by state credit.", "modern": "", "modern_status": "empty", "notes": ""}, {"id": "P1888.N2.1.1", "kind": "note", "de": "", "en": "\"The Condition of the Working Class in England in 1844.\"", "modern": "", "modern_status": "empty", "notes": "", "en_note": "Engels's English bibliographic note (MEW prints it in English); no German text"}, {"id": "P1888.N2.1.2", "kind": "note", "de": "", "en": "By Frederick Engels.", "modern": "", "modern_status": "empty", "notes": "", "en_note": "Engels's English bibliographic note (MEW prints it in English); no German text"}, {"id": "P1888.N2.1.3", "kind": "note", "de": "", "en": "Translated by Florence K. Wischnewetzky, New York, Lovell - London, W. Reeves, 1888.", "modern": "", "modern_status": "empty", "notes": "", "en_note": "Engels's English bibliographic note (MEW prints it in English); no German text"}]}, {"section": "P1890", "title_de": "Vorwort [zur vierten deutschen Ausgabe von 1890]", "title_en": "Preface to The 1890 German Edition", "source_de": "MEW 22, S. 52-59 (Dietz, Berlin) via mlwerke.de", "source_en": "Marxists Internet Archive transcription; English is a later translation (Progress Publishers, Moscow 1969), licence unverified", "original_language": "de", "anchor": "de", "verses": [{"id": "P1890.0.1", "kind": "heading", "de": "Vorwort [zur vierten deutschen Ausgabe von 1890]", "en": "Preface to The 1890 German Edition", "modern": "", "modern_status": "empty", "notes": ""}, {"id": "P1890.1.1", "kind": "p", "de": "Seit Vorstehendes geschrieben, ist wieder eine neue deutsche Auflage des \"Manifestes\" nötig geworden, und es hat sich auch allerlei mit dem \"Manifest\" zugetragen, das hier zu erwähnen ist.", "en": "Since [the first German preface of 1883] was written, a new German edition of the Manifesto has again become necessary, and much has also happened to the Manifesto which should be recorded here.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "52"}, {"id": "P1890.2.1", "kind": "p", "de": "Eine zweite russische Übersetzung - von Vera Sassulitsch - erschien 1882 in Genf; die Vorrede dazu wurde von Marx und mir verfaßt.", "en": "A second Russian translation - by Vera Zasulich - appeared in Geneva in 1882; the preface to that edition was written by Marx and myself.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "52"}, {"id": "P1890.2.2", "kind": "p", "de": "Leider ist mir das deutsche Originalmanuskript abhanden gekommen, ich muß also aus dem Russischen zurückübersetzen, wodurch die Arbeit keineswegs gewinnt.", "en": "Unfortunately, the original German manuscript has gone astray; I must therefore retranslate from the Russian which will in no way improve the text.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "52"}, {"id": "P1890.2.3", "kind": "p", "de": "Sie lautet:", "en": "It reads:", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "52"}, {"id": "P1890.3.1", "kind": "p", "de": "\"Die erste russische Ausgabe des 'Manifests der Kommunistischen Partei', in Bakunins Übersetzung, erschien anfangs der sechziger Jahre in der Druckerei des 'Kolokol'.", "en": "The first Russian edition of the Manifesto of the Communist Party, translated by Bakunin, was published early in the 'sixties by the printing office of the Kolokol [a reference to the Free Russian Printing House].", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "52", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.3.2", "kind": "p", "de": "Damals hatte eine russische Ausgabe dieser Schrift für den Westen höchstens die Bedeutung eines literarischen Kuriosums.", "en": "Then the West could see in it (the Russian edition of the Manifesto) only a literary curiosity.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "52", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.3.3", "kind": "p", "de": "Heute ist eine solche Auffassung nicht mehr möglich.", "en": "Such a view would be impossible today.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "52", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.3.4", "kind": "p", "de": "Einen wie beschränkten Umfang das Verbreitungsgebiet der proletarischen Bewegung hatte zur Zeit der ersten Veröffentlichung des 'Manifests' (Januar 1848), zeigt am besten das letzte Kapitel: 'Stellung der Kommunisten zu den verschiedenen oppositionellen Parteien'.", "en": "What a limited field the proletarian movement occupied at that time (December 1847) is most clearly shown by the last section: the position of the Communists in relation to the various opposition parties in various countries.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "52", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.3.5", "kind": "p", "de": "Hier fehlen vor allen Rußland und die Vereinigten Staaten.", "en": "Precisely Russia and the United States are missing here.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "52", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.3.6", "kind": "p", "de": "Es war die Zeit, wo Rußland die letzte große Reserve der europäischen Reaktion bildete und wo die Auswanderung nach den Vereinigten Staaten die überschüssigen Kräfte des europäischen Proletariats absorbierte.", "en": "It was the time when Russia constituted the last great reserve of all European reaction, when the United States absorbed the surplus proletarian forces of Europe through immigration.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "52", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.3.7", "kind": "p", "de": "Beide Länder versorgten Europa mit Rohstoff und dienten gleichzeitig als Märkte für den Absatz seiner Industrieprodukte.", "en": "Both countries provided Europe with raw materials and were at the same time markets for the sale of its industrial products.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "52", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.3.8", "kind": "p", "de": "Beide erschienen also, in dieser oder jener Weise, als Stützen der europäischen gesellschaftlichen Ordnung.", "en": "Both were, therefore, in one way of another, pillars of the existing European system.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "52", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.4.1", "kind": "p", "de": "Wie hat sich das alles heute geändert!", "en": "How very different today.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "52", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.4.2", "kind": "p", "de": "Grade die europäische Auswanderung hat die kolossale Entwicklung des nordamerikanischen Ackerbaus ermöglicht, die durch ihre Konkurrenz das große wie das kleine Grundeigentum in Europa in seinen Grundfesten erschüttert.", "en": "Precisely European immigration fitted North American for a gigantic agricultural production, whose competition is shaking the very foundations of European landed property - large and small.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "52-55", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.4.3", "kind": "p", "de": "Sie hat zugleich den Vereinigten Staaten die Möglichkeit gegeben, an die Ausbeutung ihrer reichhaltigen industriellen Hülfsquellen zu gehn, und zwar mit solcher Energie und auf solchem Maßstab, daß dies in kurzer Zeit dem industriellen Monopol des europäischen Westens ein Ende machen muß.", "en": "At the same time, it enabled the United States to exploit its tremendous industrial resources with an energy and on a scale that must shortly break the industrial monopoly of Western Europe, and especially of England, existing up to now.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "55", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.4.4", "kind": "p", "de": "Und diese beiden Umstände wirken auch auf Amerika in revolutionärer Richtung zurück.", "en": "Both circumstances react in a revolutionary manner upon America itself.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "55", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.4.5", "kind": "p", "de": "Das kleine und mittlere Grundeigentum der selbstarbeitenden Farmer, die Grundlage der ganzen politischen Ordnung Amerikas, erliegt mehr und mehr der Konkurrenz der Riesenfarmen, während gleichzeitig in den Industriebezirken sich zum erstenmal ein zahlreiches Proletariat bildet neben einer fabelhaften Konzentration der Kapitale.", "en": "Step by step, the small and middle land ownership of the farmers, the basis of the whole political constitution, is succumbing to the competition of giant farms; at the same time, a mass industrial proletariat and a fabulous concentration of capital funds are developing for the first time in the industrial regions.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "55", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.5.1", "kind": "p", "de": "Gehn wir nach Rußland.", "en": "And now Russia!", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "55", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.5.2", "kind": "p", "de": "Zur Zeit der Revolution von 1848/49 sahen nicht nur die europäischen Monarchen, sondern auch die europäischen Bourgeois in der russischen Intervention die einzige Rettung vor dem damals eben erst seine Kräfte gewahr werdenden Proletariat.", "en": "During the Revolution of 1848-9, not only the European princes, but the European bourgeois as well, found their only salvation from the proletariat just beginning to awaken in Russian intervention.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "55", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.5.3", "kind": "p", "de": "Sie proklamierten den Zaren zum Haupt der europäischen Reaktion.", "en": "The Tsar was proclaimed the chief of European reaction.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "55", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.5.4", "kind": "p", "de": "Heute sitzt er in Gatschina als Kriegsgefangner der Revolution, und Rußland bildet die Vorhut der revolutionären Bewegung Europas.", "en": "Today, he is a prisoner of war of the revolution in Gatchina, and Russia forms the vanguard of revolutionary action in Europe.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "55", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.6.1", "kind": "p", "de": "Die Aufgabe des 'Kommunistischen Manifests' war die Proklamation des unvermeidlich bevorstehenden Untergangs des heutigen bürgerlichen Eigentums.", "en": "The Communist Manifesto had, as its object, the proclamation of the inevitable impending dissolution of modern bourgeois property.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "55", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.6.2", "kind": "p", "de": "In Rußland aber finden wir, neben der sich mit Fieberhast entwickelnden kapitalistischen Ordnung und dem sich eben erst bildenden bürgerlichen Grundeigentum, die größere Hälfte des Bodens im Gemeineigentum der Bauern.", "en": "But in Russia we find, face-to-face with the rapidly flowering capitalist swindle and bourgeois property, just beginning to develop, more than half the land owned in common by the peasants.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "55", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.7.1", "kind": "p", "de": "Es fragt sich nun: Kann die russische Bauerngemeinde, diese allerdings schon sehr zersetzte Form des urwüchsigen Gemeineigentums am Boden, unmittelbar übergehn in eine höhere kommunistische Form des Grundeigentums, oder muß sie vorher denselben Auflösungsprozeß durchmachen, der sich in der historischen Entwicklung des Westens darstellt?", "en": "Now the question is: can the Russian obshchina, though greatly undermined, yet a form of primeval common ownership of land, pass directly to the higher form of Communist common ownership? Or, on the contrary, must it first pass through the same process of dissolution such as constitutes the historical evolution of the West?", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "55", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)", "review": true, "review_reason": "1 de sentence(s) matched to 2 en sentence(s)"}, {"id": "P1890.8.1", "kind": "p", "de": "Die einzige heute mögliche Antwort auf diese Frage ist die folgende.", "en": "The only answer to that possible today is this: If the Russian Revolution becomes the signal for a proletarian revolution in the West, so that both complement each other, the present Russian common ownership of land may serve as the starting point for a communist development.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "55", "en_note": "E
