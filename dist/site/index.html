 teils aus demokratischen Sozialisten im französischen Sinn, teils aus radikalen Bourgeois.", "en": "In Switzerland, they support the Radicals, without losing sight of the fact that this party consists of antagonistic elements, partly of Democratic Socialists, in the French sense, partly of radical bourgeois.", "modern": "In Switzerland they support the Radicals, without losing sight of the fact that this party contains antagonistic elements - partly Democratic Socialists in the French sense, partly radical bourgeois.", "modern_status": "seed", "notes": "", "mew_page": "492"}, {"id": "IV.4.1", "kind": "p", "de": "Unter den Polen unterstützen die Kommunisten die Partei, welche eine agrarische Revolution zur Bedingung der nationalen Befreiung macht, dieselbe Partei, welche die Krakauer Insurrektion von 1846 ins Leben rief.", "en": "In Poland, they support the party that insists on an agrarian revolution as the prime condition for national emancipation, that party which fomented the insurrection of Cracow in 1846.", "modern": "In Poland they support the party that insists on an agrarian revolution as the first condition of national emancipation - the party that stirred up the Cracow insurrection of 1846.", "modern_status": "seed", "notes": "", "mew_page": "492"}, {"id": "IV.5.1", "kind": "p", "de": "In Deutschland kämpft die Kommunistische Partei, sobald die Bourgeoisie revolutionär auftritt, gemeinsam mit der Bourgeoisie gegen die absolute Monarchie, das feudale Grundeigentum und die Kleinbürgerei.", "en": "In Germany, they fight with the bourgeoisie whenever it acts in a revolutionary way, against the absolute monarchy, the feudal squirearchy, and the petty bourgeoisie.", "modern": "In Germany they fight alongside the bourgeoisie whenever it acts in a revolutionary way, against absolute monarchy, the feudal landed gentry, and the petty bourgeoisie.", "modern_status": "seed", "notes": "", "mew_page": "492"}, {"id": "IV.6.1", "kind": "p", "de": "Sie unterläßt aber keinen Augenblick, bei den Arbeitern ein möglichst klares Bewußtsein über den feindlichen Gegensatz zwischen Bourgeoisie und Proletariat herauszuarbeiten, damit die deutschen Arbeiter sogleich die gesellschaftlichen und politischen Bedingungen, welche die Bourgeoisie mit ihrer Herrschaft herbeiführen muß, als ebenso viele Waffen gegen die Bourgeoisie kehren können, damit, nach dem Sturz der reaktionären Klassen in Deutschland, sofort der Kampf gegen die Bourgeoisie selbst beginnt.", "en": "But they never cease, for a single instant, to instil into the working class the clearest possible recognition of the hostile antagonism between bourgeoisie and proletariat, in order that the German workers may straightway use, as so many weapons against the bourgeoisie, the social and political conditions that the bourgeoisie must necessarily introduce along with its supremacy, and in order that, after the fall of the reactionary classes in Germany, the fight against the bourgeoisie itself may immediately begin.", "modern": "But they never stop, for a single moment, working to instill into the working class the clearest possible recognition of the hostile antagonism between bourgeoisie and proletariat. They do this so that the German workers can immediately turn against the bourgeoisie, as so many weapons, the social and political conditions that the bourgeoisie must inevitably introduce along with its rule - and so that, after the fall of the reactionary classes in Germany, the fight against the bourgeoisie itself can immediately begin.", "modern_status": "seed", "notes": "", "de_variants": [{"ref": "T73", "editions": "1848", "reading": "von", "base_text": "Bourgeoisie und Proletariat herauszuarbeiten, damit …"}], "mew_page": "492-493"}, {"id": "IV.7.1", "kind": "p", "de": "Auf Deutschland richten die Kommunisten ihre Hauptaufmerksamkeit, weil Deutschland am Vorabend einer bürgerlichen Revolution steht und weil es diese Umwälzung unter fortgeschrittneren Bedingungen der europäischen Zivilisation überhaupt und mit einem viel weiter entwickelten Proletariat vollbringt als England im 17. und Frankreich im 18. Jahrhundert, die deutsche bürgerliche Revolution also nur das unmittelbare Vorspiel einer proletarischen Revolution sein kann.", "en": "The Communists turn their attention chiefly to Germany, because that country is on the eve of a bourgeois revolution that is bound to be carried out under more advanced conditions of European civilisation and with a much more developed proletariat than that of England was in the seventeenth, and France in the eighteenth century, and because the bourgeois revolution in Germany will be but the prelude to an immediately following proletarian revolution.", "modern": "The communists focus chiefly on Germany, because that country is on the eve of a bourgeois revolution that is bound to be carried out under more advanced conditions of European civilization, and with a much more developed proletariat, than either the English revolution of the seventeenth century or the French revolution of the eighteenth. The bourgeois revolution in Germany will therefore be only the prelude to a proletarian revolution that immediately follows.", "modern_status": "seed", "notes": "", "mew_page": "493"}, {"id": "IV.8.1", "kind": "p", "de": "Mit einem Wort, die Kommunisten unterstützen überall jede revolutionäre Bewegung gegen die bestehenden gesellschaftlichen und politischen Zustände.", "en": "In short, the Communists everywhere support every revolutionary movement against the existing social and political order of things.", "modern": "In short, the communists everywhere support every revolutionary movement against the existing social and political order of things.", "modern_status": "seed", "notes": "", "mew_page": "493"}, {"id": "IV.9.1", "kind": "p", "de": "In allen diesen Bewegungen heben sie die Eigentumsfrage, welche mehr oder minder entwickelte Form sie auch angenommen haben möge, als die Grundfrage der Bewegung hervor.", "en": "In all these movements, they bring to the front, as the leading question in each, the property question, no matter what its degree of development at the time.", "modern": "In all these movements they bring to the front, as the leading question in each, the property question - no matter what degree of development it has reached at the time.", "modern_status": "seed", "notes": "", "mew_page": "493"}, {"id": "IV.10.1", "kind": "p", "de": "Die Kommunisten arbeiten endlich überall an der Verbindung und Verständigung der demokratischen Parteien aller Länder.", "en": "Finally, they labour everywhere for the union and agreement of the democratic parties of all countries.", "modern": "Finally, they work everywhere for the union and agreement of the democratic parties of all countries.", "modern_status": "seed", "notes": "", "mew_page": "493"}, {"id": "IV.11.1", "kind": "p", "de": "Die Kommunisten verschmähen es, ihre Ansichten und Absichten zu verheimlichen.", "en": "The Communists disdain to conceal their views and aims.", "modern": "The communists refuse to hide their views and aims.", "modern_status": "seed", "notes": "", "mew_page": "493"}, {"id": "IV.11.2", "kind": "p", "de": "Sie erklären es offen, daß ihre Zwecke nur erreicht werden können durch den gewaltsamen Umsturz aller bisherigen Gesellschaftsordnung.", "en": "They openly declare that their ends can be attained only by the forcible overthrow of all existing social conditions.", "modern": "They openly declare that their ends can only be reached by the forcible overthrow of all existing social conditions.", "modern_status": "seed", "notes": "", "mew_page": "493"}, {"id": "IV.11.3", "kind": "p", "de": "Mögen die herrschenden Klassen vor einer kommunistischen Revolution zittern.", "en": "Let the ruling classes tremble at a Communistic revolution.", "modern": "Let the ruling classes tremble at a communist revolution.", "modern_status": "seed", "notes": "", "mew_page": "493"}, {"id": "IV.11.4", "kind": "p", "de": "Die Proletarier haben nichts in ihr zu verlieren als ihre Ketten.", "en": "The proletarians have nothing to lose but their chains.", "modern": "The proletarians have nothing to lose but their chains.", "modern_status": "seed", "notes": "", "mew_page": "493"}, {"id": "IV.11.5", "kind": "p", "de": "Sie haben eine Welt zu gewinnen.", "en": "They have a world to win.", "modern": "They have a world to win.", "modern_status": "seed", "notes": "", "mew_page": "493"}, {"id": "IV.12.1", "kind": "p", "de": "Proletarier aller Länder, vereinigt euch!", "en": "Working Men of All Countries, Unite!", "modern": "WORKERS OF ALL COUNTRIES, UNITE!", "modern_status": "seed", "notes": "'Workers of the world, unite!' is the popular form and is in neither edition. See glossary.", "mew_page": "493"}]}, {"section": "N", "title_de": "Anmerkungen von Engels", "title_en": "Notes by Engels", "source_de": "MEW 4 footnotes. Notes marked 'zur englischen Ausgabe von 1888' are MEW's German translation of Engels's English", "source_en": "Marxists Internet Archive. 1890 notes in English are later translations", "original_language": "en (1888 notes) / de (1890 notes)", "anchor": "de", "verses": [{"id": "N1.1.1", "kind": "note", "de": "Unter Bourgeoisie wird die Klasse der modernen Kapitalisten verstanden, die Besitzer der gesellschaftlichen Produktionsmittel sind und Lohnarbeit ausnutzen.", "en": "By bourgeoisie is meant the class of modern capitalists, owners of the means of social production and employers of wage labour.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur englischen Ausgabe von 1888"}, {"id": "N1.1.2", "kind": "note", "de": "Unter Proletariat die Klasse der modernen Lohnarbeiter, die, da sie keine eigenen Produktionsmittel besitzen, darauf angewiesen sind, ihre Arbeitskraft zu verkaufen, um leben zu können.", "en": "By proletariat, the class of modern wage labourers who, having no means of production of their own, are reduced to selling their labour power in order to live.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur englischen Ausgabe von 1888"}, {"id": "N2.1.1", "kind": "note", "de": "Das heißt, genau gesprochen, die schriftlich überlieferte Geschichte.", "en": "That is, all written history.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur englischen Ausgabe von 1888"}, {"id": "N2.1.2", "kind": "note", "de": "1847 war die Vorgeschichte der Gesellschaft, die gesellschaftliche Organisation, die aller niedergeschriebenen Geschichte vorausging, noch so gut wie unbekannt.", "en": "In 1847, the pre-history of society, the social organisation existing previous to recorded history, all but unknown.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur englischen Ausgabe von 1888"}, {"id": "N2.1.3", "kind": "note", "de": "Seitdem hat Haxthausen das Gemeineigentum am Boden in Rußland entdeckt, Maurer hat es nachgewiesen als die gesellschaftliche Grundlage, wovon alle deutschen Stämme geschichtlich ausgingen, und allmählich fand man, daß Dorfgemeinden mit gemeinsamem Bodenbesitz die Urform der Gesellschaft waren von Indien bis Irland.", "en": "Since then, August von Haxthausen (1792-1866) discovered common ownership of land in Russia, Georg Ludwig von Maurer proved it to be the social foundation from which all Teutonic races started in history, and, by and by, village communities were found to be, or to have been, the primitive form of society everywhere from India to Ireland.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur englischen Ausgabe von 1888"}, {"id": "N2.1.4", "kind": "note", "de": "Schließlich wurde die innere Organisation dieser urwüchsigen kommunistischen Gesellschaft in ihrer typischen Form bloßgelegt durch Morgans krönende Entdeckung der wahren Natur der Gens und ihrer Stellung im Stamm.", "en": "The inner organisation of this primitive communistic society was laid bare, in its typical form, by Lewis Henry Morgan's (1818-1861) crowning discovery of the true nature of the gens and its relation to the tribe.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur englischen Ausgabe von 1888"}, {"id": "N2.1.5", "kind": "note", "de": "Mit der Auflösung dieser ursprünglichen Gemeinwesen beginnt die Spaltung der Gesellschaft in besondre und schließlich einander entgegengesetzte Klassen.", "en": "With the dissolution of the primeval communities, society begins to be differentiated into separate and finally antagonistic classes.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur englischen Ausgabe von 1888"}, {"id": "N2.1.6", "kind": "note", "de": "Ich habe versucht, diesen Auflösungsprozeß in \"Der Ursprung der Familie, des Privateigenthums und des Staates\" zu verfolgen; 2. Auflage, Stuttgart 1886.", "en": "I have attempted to retrace this dissolution in The Origin of the Family, Private Property, and the State, second edition, Stuttgart, 1886.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur englischen Ausgabe von 1888"}, {"id": "N3.1.1", "kind": "note", "de": "\"Kommune\" nannten sich die in Frankreich entstehenden Städte, sogar bevor sie ihren feudalen Herrn und Meistern lokale Selbstverwaltung und politische Rechte als \"Dritter Stand\" abzuringen vermochten.", "en": "\"Commune\" was the name taken in France by the nascent towns even before they had conquered from their feudal lords and masters local self-government and political rights as the \"Third Estate.\"", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur englischen Ausgabe von 1888"}, {"id": "N3.1.2", "kind": "note", "de": "Allgemein gesprochen haben wir hier als typisches Land für die ökonomische Entwicklung der Bourgeoisie England, für ihre politische Entwicklung Frankreich angeführt.", "en": "Generally speaking, for the economical development of the bourgeoisie, England is here taken as the typical country, for its political development, France.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur englischen Ausgabe von 1888"}, {"id": "N3.2.1", "kind": "note", "de": "So nannten die Städtebürger Italiens und Frankreichs ihr städtisches Gemeinwesen, nachdem sie die ersten Selbstverwaltungsrechte ihren Feudalherren abgekauft oder abgezwungen hatten.", "en": "This was the name given their urban communities by the townsmen of Italy and France, after they had purchased or conquered their initial rights of self-government from their feudal lords.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur deutschen Ausgabe von 1890"}, {"id": "N4.1.1", "kind": "note", "de": "Gemeint ist nicht die englische Restaurationszeit 1660-1689, sondern die französische Restaurationszeit 1814-1830.", "en": "Not the English Restoration (1660-1689), but the French Restoration (1814-1830).", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur englischen Ausgabe von 1888"}, {"id": "N5.1.1", "kind": "note", "de": "Dies bezieht sich hauptsächlich auf Deutschland, wo der Landadel und das Junkertum einen großen Teil ihrer Güter auf eigene Rechnung durch ihre Verwalter bewirtschaften lassen und daneben noch Großproduzenten von Rübenzucker und Kartoffelschnaps sind.", "en": "This applies chiefly to Germany, where the landed aristocracy and squirearchy have large portions of their estates cultivated for their own account by stewards, and are, moreover, extensive beetroot-sugar manufacturers and distillers of potato spirits.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur englischen Ausgabe 1888"}, {"id": "N5.1.2", "kind": "note", "de": "Die reicheren englischen Aristokraten sind noch nicht so weit heruntergekommen; aber auch sie wissen, wie man das Sinken der Rente wettmachen kann durch die Hergabe ihres Namens an mehr oder weniger zweifelhafte Gründer von Aktiengesellschaften.", "en": "The wealthier British aristocracy are, as yet, rather above that; but they, too, know how to make up for declining rents by lending their names to floaters or more or less shady joint-stock companies.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur englischen Ausgabe 1888"}, {"id": "N6.1.1", "kind": "note", "de": "Der Revolutionssturm von 1848 hat diese gesamte schäbige Richtung weggefegt und ihren Trägern die Lust benommen, noch weiter in Sozialismus zu machen.", "en": "The revolutionary storm of 1848 swept away this whole shabby tendency and cured its protagonists of the desire to dabble in socialism.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur deutschen Ausgabe von 1890"}, {"id": "N6.1.2", "kind": "note", "de": "Hauptvertreter und klassischer Typus dieser Richtung ist Herr Karl Grün.", "en": "The chief representative and classical type of this tendency is Mr Karl Gruen.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur deutschen Ausgabe von 1890"}, {"id": "N7.1.1", "kind": "note", "de": "Phalanstere war die Bezeichnung für die von Charles Fourier geplanten sozialistischen Kolonien; Ikarien nannte Cabet seine Utopie und später seine kommunistische Kolonie in Amerika.", "en": "Phalanstéres were Socialist colonies on the plan of Charles Fourier; Icaria was the name given by Cabet to his Utopia and, later on, to his American Communist colony.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur englischen Ausgabe von 1888"}, {"id": "N7.2.1", "kind": "note", "de": "Home-Kolonien (Kolonien im Inland) nennt Owen seine kommunistischen Mustergesellschaften.", "en": "\"Home Colonies\" were what Owen called his Communist model societies.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur deutschen Ausgabe von 1890"}, {"id": "N7.2.2", "kind": "note", "de": "Phalanstere war der Name der von Fourier geplanten gesellschaftlichen Paläste.", "en": "Phalanstéres was the name of the public palaces planned by Fourier.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur deutschen Ausgabe von 1890"}, {"id": "N7.2.3", "kind": "note", "de": "Ikarien hieß das utopische Phantasieland, dessen kommunistische Einrichtung Cabet schilderte.", "en": "Icaria was the name given to the Utopian land of fancy, whose Communist institutions Cabet portrayed.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur deutschen Ausgabe von 1890"}, {"id": "N8.1.1", "kind": "note", "de": "Die Partei, die damals im Parlament von Ledru-Rollin, in der Literatur von Louis Blanc und in der Tagespresse von der \"Réforme\" vertreten wurde.", "en": "The party then represented in Parliament by Ledru-Rollin, in literature by Louis Blanc, in the daily press by the Réforme.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur englischen Ausgabe von 1888"}, {"id": "N8.1.2", "kind": "note", "de": "Der Name \"Sozialdemokratie\" bedeutete bei diesen ihren Erfindern eine Sektion der demokratischen oder republikanischen Partei mit mehr oder weniger sozialistischer Färbung.", "en": "The name of Social-Democracy signifies, with these its inventors, a section of the Democratic or Republican Party more or less tinged with socialism.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur englischen Ausgabe von 1888"}, {"id": "N8.2.1", "kind": "note", "de": "Die damals sich sozialistisch-demokratisch nennende Partei in Frankreich war die durch Ledru-Rollin politisch und durch Louis Blanc literarisch vertretene; sie war also himmelweit verschieden von der heutigen deutschen Sozialdemokratie.", "en": "", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Anmerkung von Engels zur deutschen Ausgabe von 1890", "en_note": "No English text of this note in the source used", "review": true, "review_reason": "1 de sentence(s) matched to 0 en sentence(s)"}, {"id": "E1.1.1", "kind": "note", "de": "", "en": "Guild-master, that is, a full member of a guild, a master within, not a head of a guild.", "modern": "", "modern_status": "empty", "notes": "", "note_edition": "Engels, 1888 English Edition", "en_note": "English-only note: Engels explains the English word 'guild-master'; the German text needs no note (Zunftbürger)"}]}];

}

function fnLinks(v) {

  }).join("");
}

function cellFor(col, g, s) {

    return `<div class="cell lines">${lbl}${lines}</div>`;
  }
  if (col.key === "en") {
    const t = head.en ? `<span class="${head.kind}">${esc(head.en)}</span>` : `<span class="empty">no English text in source</span>`;
    const note = head.en_note ? `<div class="extra">${esc(head.en_note)}</div>` : "";
    return `<div class="cell">${lbl}${t}${note}</div>`;
  }
  if (col.key === "modern") {
    const st = head.modern_status;
    const t = head.modern ? `<span class="${head.kind}">${esc(head.modern)}</span><span class="tag t-${st}">${st}</span>` : `<span class="empty">not drafted yet</span>`;
    const rd = (head.readings || []).map(r => `<div class="extra"><b>${esc(r.tradition)}:</b> ${esc(r.rendering)}</div>`).join("");
    return `<div class="cell">${lbl}${t}${rd}</div>`;
  }
  const bits = [];
  g.forEach(v => { if (v.notes) bits.push(esc(v.notes)); if (v.note_edition) bits.push(`<i>${esc(v.note_edition)}</i>`); if (v.mew_page) bits.push(`MEW p. ${esc(String(v.mew_page))}`); });
  return `<div class="cell extra">${lbl}${bits.join("<br>")}</div>`;
}

function render(si, focusId) {
  sel.value = si;
  const s = DATA[si];
  const cols = COLS.filter(c => c.on);
  const warn = s.original_language !== "de" && s.original_language !== "de (1888 notes) / de (1890 notes)"
    ? `<div class="src warn">Original language: ${esc(s.original_language)}. Verse boundaries follow the ${s.anchor === "en" ? "English" : "German"} column.</div>` : "";
  let h = `<div class="sechead"><h1>${esc(s.title_en)}</h1><div class="de">${esc(s.title_de)}</div>
    <div class="src">German: ${esc(s.source_de)}<br>English: ${esc(s.source_en)}</div>${warn}</div>`;
  h += `<div class="cols" style="--n:${cols.length}"><div class="colhead">Verse</div>${cols.map(c => `<div class="colhead">${colLabel(c, s)}</div>`).join("")}`;
  groups(s.verses).forEach(g => {
    const head = g[0];
    const flag = g.some(v => v.review) ? `<span class="flag" title="${esc(g.map(v => v.review_reason).filter(Boolean).join("; "))}">⚑</span>` : "";
    const ids = g.map(v => `<a id="${esc(v.id)}" href="#${hid(v.id)}">${esc(v.id)}</a>`).join("");
    h += `<div class="group"><div class="cell vid">${ids}${flag}</div>${cols.map(c => cellFor(c, g, s)).join("")}</div>`;
  });
  h += `</div>`;
  $("#main").innerHTML = h;
  document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + "px");
  const first = s.verses[0].id;
  const cur = focusId && document.getElementById(focusId); if (cur) cur.classList.add("cur");
  if (focusId && focusId !== first) { if (cur) cur.scrollIntoView({block: "start"}); }
  else window.scrollTo(0, 0);
}

function route() {
  const id = decodeURIComponent(location.hash.slice(1)).replace(/-/g, ".");
  if (id && id in byId) render(byId[id], id); else render(+sel.value || 0, null);
}
window.addEventListener("hashchange", route);

$("#q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (q.length < 3) { route(); return; }
  const hits = [];
  DATA.forEach(s => s.verses.forEach(v => {
    const t = [v.de, v.en, v.modern].join("  ");
    const i = t.toLowerCase().indexOf(q);
    if (i >= 0) hits.push(`<a href="#${hid(v.id)}"><b>${esc(v.id)}</b>${esc(t.slice(Math.max(0, i - 50), i + 90))}</a>`);
  }));
  $("#main").innerHTML = `<div class="sechead"><h1>${hits.length} match${hits.length === 1 ? "" : "es"}</h1></div><div id="results">${hits.slice(0, 300).join("")}</div>`;
});
route();
</script>
</body>
</html>
