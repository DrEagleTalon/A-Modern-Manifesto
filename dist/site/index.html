nglish supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)", "review": true, "review_reason": "2 de sentence(s) matched to 1 en sentence(s)"}, {"id": "P1890.8.2", "kind": "p", "de": "Wenn die russische Revolution das Signal zu einer Arbeiterrevolution im Westen wird, so daß beide einander ergänzen, dann kann das heutige russische Gemeineigentum zum Ausgangspunkt einer kommunistischen Entwicklung dienen.", "en": "", "joined_to": "P1890.8.1", "modern": "", "modern_status": "joined", "notes": "", "mew_page": "55", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.9.1", "kind": "signature", "de": "London, 21. Januar 1882.\"", "en": "January 21, 1882, London", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "55", "en_note": "English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)"}, {"id": "P1890.10.1", "kind": "p", "de": "Eine neue polnische Übersetzung erschien um dieselbe Zeit in Genf: \"Manifest komunistyczny\".", "en": "At about the same date, a new Polish version appeared in Geneva: Manifest Kommunistyczny.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "55"}, {"id": "P1890.11.1", "kind": "p", "de": "Ferner ist eine neue dänische Übersetzung erschienen in \"Socialdemokratisk Bibliotek\", København 1885.", "en": "Furthermore, a new Danish translation has appeared in the Socialdemokratisk Bibliothek, Copenhagen, 1885.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "55"}, {"id": "P1890.11.2", "kind": "p", "de": "Sie ist leider nicht ganz vollständig; einige wesentliche Stellen, die dem Übersetzer Schwierigkeit gemacht zu haben scheinen, sind ausgelassen und auch sonst hier und da Spuren von Flüchtigkeit zu bemerken, die um so unangenehmer auffallen, als man der Arbeit ansieht, daß der Übersetzer bei etwas mehr Sorgfalt Vorzügliches hätte leisten können.", "en": "Unfortunately, it is not quite complete; certain essential passages, which seem to have presented difficulties to the translator, have been omitted, and, in addition, there are signs of carelessness here and there, which are all the more unpleasantly conspicuous since the translation indicates that had the translator taken a little more pains, he would have done an excellent piece of work.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "55-56"}, {"id": "P1890.12.1", "kind": "p", "de": "1886 erschien eine neue französische Übersetzung in \"Le Socialiste\", Paris; es ist die beste bisher erschienene.", "en": "A new French version appeared in 1886, in Le Socialiste of Paris; it is the best published to date.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "56"}, {"id": "P1890.13.1", "kind": "p", "de": "Nach ihr wurde im selben Jahr eine spanische Übertragung zuerst im Madrider \"El Socialista\" und dann als Broschüre veröffentlicht: \"Manifiesto del Partido Comunista\" por Carlos Marx y F. Engels, Madrid, Administración de \"El Socialista\", Hernán Cortés 8.", "en": "From this latter, a Spanish version was published the same year in El Socialista of Madrid, and then reissued in pamphlet form: Manifesto del Partido Communista por Carlos Marx y F. Engels, Madrid, Administracion de El Socialista, Hernan Cortes 8.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "56"}, {"id": "P1890.14.1", "kind": "p", "de": "Als Kuriosum erwähne ich noch, daß 1887 das Manuskript einer armenischen Übersetzung einem konstantinopolitanischen Verleger angeboten wurde; der gute Mann hatte jedoch nicht den Mut, etwas zu drucken, worauf der Name Marx stand, und meinte, der Übersetzer solle sich lieber selbst als Verfasser nennen, was dieser jedoch ablehnte.", "en": "As a matter of curiosity, I may mention that in 1887 the manuscript of an Armenian translation was offered to a publisher in Constantinople. But the good man did not have the courage to publish something bearing the name of Marx and suggested that the translator set down his own name as author, which the latter however declined.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "56", "review": true, "review_reason": "1 de sentence(s) matched to 2 en sentence(s)"}, {"id": "P1890.15.1", "kind": "p", "de": "Nachdem bald die eine, bald die andre der mehr oder minder unrichtigen amerikanischen Übersetzungen mehrfach in England wieder abgedruckt worden, erschien endlich eine authentische Übersetzung im Jahre 1888.", "en": "After one, and then another, of the more or less inaccurate American translations had been repeatedly reprinted in England, an authentic version at last appeared in 1888.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "56"}, {"id": "P1890.15.2", "kind": "p", "de": "Sie ist von meinem Freund Samuel Moore und vor dem Druck von uns beiden nochmals zusammen durchgesehn.", "en": "This was my friend Samuel Moore, and we went through it together once more before it went to press.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "56"}, {"id": "P1890.15.3", "kind": "p", "de": "Der Titel ist: \"Manifesto of the Communist Party\", by Karl Marx and Frederick Engels.", "en": "It is entitled: Manifesto of the Communist Party, by Karl Marx and Frederick Engels.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "56"}, {"id": "P1890.15.4", "kind": "p", "de": "Authorized English Translation, edited and annotated by Frederick Engels, 1888, London, William Reeves, 185 Fleet St. E.C. Einige der Anmerkungen dieser Ausgabe habe ich in die gegenwärtige herübergenommen.", "en": "Authorized English translation, edited and annotated by Frederick Engels, 1888, London, William Reeves, 185 Fleet Street, E.C. I have added some of the notes of that edition to the present one.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "56"}, {"id": "P1890.16.1", "kind": "p", "de": "Das \"Manifest\" hat einen eignen Lebenslauf gehabt.", "en": "The Manifesto has had a history of its own.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "56"}, {"id": "P1890.16.2", "kind": "p", "de": "Im Augenblick seines Erscheinens von der damals noch wenig zahlreichen Vorhut des wissenschaftlichen Sozialismus enthusiastisch begrüßt (wie die in der ersten Vorrede angeführten Übersetzungen beweisen), wurde es bald in den Hintergrund gedrängt durch die mit der Niederlage der Pariser Arbeiter im Juni 1848 beginnende Reaktion und schließlich \"von Rechts wegen\" in Acht und Bann erklärt durch die Verurteilung der Kölner Kommunisten, November 1852.", "en": "Greeted with enthusiasm, at the time of its appearance, by the not at all numerous vanguard of scientific socialism (as is proved by the translations mentioned in the first place), it was soon forced into the background by the reaction that began with the defeat of the Paris workers in June 1848, and was finally excommunicated \"by law\" in the conviction of the Cologne Communists in November 1852.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "56"}, {"id": "P1890.16.3", "kind": "p", "de": "Mit dem Verschwinden der von der Februarrevolution datierenden Arbeiterbewegung von der öffentlichen Bühne trat auch das \"Manifest\" in den Hintergrund.", "en": "With the disappearance from the public scene of the workers' movement that had begun with the February Revolution, the Manifesto too passed into the background.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "56"}, {"id": "P1890.17.1", "kind": "p", "de": "Als die europäische Arbeiterklasse sich wieder hinreichend gestärkt hatte zu einem neuen Anlauf gegen die Macht der herrschenden Klassen, entstand die Internationale Arbeiter-Assoziation.", "en": "When the European workers had again gathered sufficient strength for a new onslaught upon the power of the ruling classes, the International Working Men's Association came into being.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "56-57"}, {"id": "P1890.17.2", "kind": "p", "de": "Sie hatte zum Zweck, die gesamte streitbare Arbeiterschaft Europas und Amerikas zu einem großen Heereskörper zu verschmelzen.", "en": "Its aim was to weld together into one huge army the whole militant working class of Europe and America.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "57"}, {"id": "P1890.17.3", "kind": "p", "de": "Sie konnte daher nicht ausgehn von den im \"Manifest\" niedergelegten Grundsätzen.", "en": "Therefore it could not set out from the principles laid down in the Manifesto.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "57"}, {"id": "P1890.17.4", "kind": "p", "de": "Sie mußte ein Programm haben, das den englischen Trades Unions, den französischen, belgischen, italienischen und spanischen Proudhonisten und den deutschen Lassalleanern die Tür nicht verschloß.", "en": "It was bound to have a programme which would not shut the door on the English trade unions, the French, Belgian, Italian, and Spanish Proudhonists, and the German Lassalleans.", "modern": "", "modern_status": "empty", "notes": "", "footnotes": ["P1890.N1"], "mew_page": "57"}, {"id": "P1890.17.5", "kind": "p", "de": "Dies Programm - die Erwägungsgründe zu den Statuten der Internationale - wurde von Marx mit einer selbst von Bakunin und den Anarchisten anerkannten Meisterschaft entworfen.", "en": "This programme - the considerations underlying the Statutes of the International - was drawn up by Marx with a master hand acknowledged even by the Bakunin and the anarchists.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "57"}, {"id": "P1890.17.6", "kind": "p", "de": "Für den schließlichen Sieg der im \"Manifest\" aufgestellten Sätze verließ sich Marx einzig und allein auf die intellektuelle Entwicklung der Arbeiterklasse, wie die aus der vereinigten Aktion und der Diskussion notwendig hervorgehn mußte.", "en": "For the ultimate final triumph of the ideas set forth in the Manifesto, Marx relied solely upon the intellectual development of the working class, as it necessarily has to ensue from united action and discussion.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "57"}, {"id": "P1890.17.7", "kind": "p", "de": "Die Ereignisse und Wechselfälle im Kampf gegen das Kapital, die Niederlagen noch mehr als die Erfolge, konnten nicht umhin, den Kämpfenden die Unzulänglichkeit ihrer bisherigen Allerweltsheilmittel klarzulegen und ihre Köpfe empfänglicher zu machen für eine gründliche Einsicht in die wahren Bedingungen der Arbeiteremanzipation.", "en": "The events and vicissitudes in the struggle against capital, the defeats even more than the successes, could not but demonstrate to the fighters the inadequacy of their former universal panaceas, and make their minds more receptive to a thorough understanding of the true conditions for working-class emancipation.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "57"}, {"id": "P1890.17.8", "kind": "p", "de": "Und Marx hatte recht.", "en": "And Marx was right.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "57"}, {"id": "P1890.17.9", "kind": "p", "de": "Die Arbeiterklasse von 1874, bei der Auflösung der Internationale, war eine ganz andre, als die von 1864, bei ihrer Gründung, gewesen war.", "en": "The working class of 1874, at the dissolution of the International, was altogether different from that of 1864, at its foundation.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "57"}, {"id": "P1890.17.10", "kind": "p", "de": "Der Proudhonismus in den romanischen Ländern, der spezifische Lassalleanismus in Deutschland waren am Aussterben, und selbst die damaligen stockkonservativen englischen Trades Unions gingen allmählich dem Punkt entgegen, wo 1887 der Präsident ihres Kongresses in Swansea in ihrem Namen sagen konnte: \"Der kontinentale Sozialismus hat seine Schrecken für uns verloren.\"", "en": "Proudhonism in the Latin countries, and the specific Lassalleanism in Germany, were dying out; and even the ten arch-conservative English trade unions were gradually approaching the point where, in 1887, the chairman of their Swansea Congress could say in their name: \"Continental socialism has lost its terror for us.\"", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "57"}, {"id": "P1890.17.11", "kind": "p", "de": "Der kontinentale Sozialismus, der war aber schon 1887 fast nur noch die Theorie, die im \"Manifest\" verkündet wird.", "en": "Yet by 1887 continental socialism was almost exclusively the theory heralded in the Manifesto.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "57"}, {"id": "P1890.17.12", "kind": "p", "de": "Und so spiegelt die Geschichte des \"Manifests\" bis zu einem gewissen Grade die Geschichte der modernen Arbeiterbewegung seit 1848 wider.", "en": "Thus, to a certain extent, the history of the Manifesto reflects the history of the modern working-class movement since 1848.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "57"}, {"id": "P1890.17.13", "kind": "p", "de": "Gegenwärtig ist es unzweifelhaft das weitest verbreitete, das internationalste Produkt der gesamten sozialistischen Literatur, das gemeinsame Programm vieler Millionen von Arbeitern aller Länder von Sibirien bis Kalifornien.", "en": "At present, it is doubtless the most widely circulated, the most international product of all socialist literature, the common programme of many millions of workers of all countries from Siberia to California.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "57"}, {"id": "P1890.18.1", "kind": "p", "de": "Und doch, als es erschien, hätten wir es nicht ein sozialistisches Manifest nennen dürfen.", "en": "Nevertheless, when it appeared, we could not have called it a socialist manifesto.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58"}, {"id": "P1890.18.2", "kind": "p", "de": "Unter Sozialisten verstand man 1847 zweierlei Art von Leuten.", "en": "In 1847, two kinds of people were considered socialists.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58"}, {"id": "P1890.18.3", "kind": "p", "de": "Einerseits die Anhänger der verschiedenen utopistischen Systeme, speziell die Owenisten in England und die Fourieristen in Frankreich, die beide schon damals zu bloßen, allmählich aussterbenden Sekten zusammengeschrumpft waren.", "en": "On the one hand were the adherents of the various utopian systems, notably the Owenites in England and the Fourierists in France, both of whom, at that date, had already dwindled to mere sects gradually dying out.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58"}, {"id": "P1890.18.4", "kind": "p", "de": "Andrerseits die mannigfaltigsten sozialen Quacksalber, die mit ihren verschiedenen Allerweltheilmitteln und mit jeder Art von Flickarbeit die gesellschaftlichen Mißstände beseitigen wollten, ohne dem Kapital und dem Profit im geringsten wehe zu tun.", "en": "On the other, the manifold types of social quacks who wanted to eliminate social abuses through their various universal panaceas and all kinds of patch-work, without hurting capital and profit in the least.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58"}, {"id": "P1890.18.5", "kind": "p", "de": "In beiden Fällen: Leute, die außerhalb der Arbeiterbewegung standen und die vielmehr Unterstützung suchten bei den \"gebildeten\" Klassen.", "en": "In both cases, people who stood outside the labor movement and who looked for support rather to the \"educated\" classes.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58"}, {"id": "P1890.18.6", "kind": "p", "de": "Derjenige Teil der Arbeiter dagegen, der, von der Unzulänglichkeit bloßer politischer Umwälzungen überzeugt, eine gründliche Umgestaltung der Gesellschaft forderte, der Teil nannte sich damals kommunistisch.", "en": "The section of the working class, however, which demanded a radical reconstruction of society, convinced that mere political revolutions were not enough, then called itself Communist.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58"}, {"id": "P1890.18.7", "kind": "p", "de": "Es war ein nur im Rauhen gearbeiteter, nur instinktiver, manchmal etwas roher Kommunismus; aber er war mächtig genug, um zwei Systeme des utopischen Kommunismus zu erzeugen, in Frankreich den \"ikarischen\" Cabets, in Deutschland den von Weitling.", "en": "It was still a rough-hewn, only instinctive and frequently somewhat crude communism. Yet, it was powerful enough to bring into being two systems of utopian communism - in France, the \"Icarian\" communists of Cabet, and in Germany that of Weitling.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58", "review": true, "review_reason": "1 de sentence(s) matched to 2 en sentence(s)"}, {"id": "P1890.18.8", "kind": "p", "de": "Sozialismus bedeutete 1847 eine Bourgeoisbewegung, Kommunismus eine Arbeiterbewegung.", "en": "Socialism in 1847 signified a bourgeois movement, communism a working-class movement.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58"}, {"id": "P1890.18.9", "kind": "p", "de": "Der Sozialismus war, auf dem Kontinent wenigstens, salonfähig, der Kommunismus war das grade Gegenteil.", "en": "Socialism was, on the Continent at least, quite respectable, whereas communism was the very opposite.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58"}, {"id": "P1890.18.10", "kind": "p", "de": "Und da wir schon damals sehr entschieden der Ansicht waren, daß \"die Emanzipation der Arbeiter das Werk der Arbeiterklasse selbst sein muß\", so konnten wir keinen Augenblick im Zweifel sein, welchen der beiden Namen zu wählen.", "en": "And since we were very decidedly of the opinion as early as then that \"the emancipation of the workers must be the task of the working class itself,\" [from the General Rules of the International] we could have no hesitation as to which of the two names we should choose.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58"}, {"id": "P1890.18.11", "kind": "p", "de": "Auch seitdem ist es uns nie eingefallen, ihn zurückzuweisen.", "en": "Nor has it ever occurred to us to repudiate it.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58"}, {"id": "P1890.19.1", "kind": "p", "de": "\"Proletarier aller Länder, vereinigt euch!\"", "en": "\"Working men of all countries, unite!\"", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58"}, {"id": "P1890.19.2", "kind": "p", "de": "Nur wenige Stimmen antworteten, als wir diese Worte in die Weit hinausriefen, vor nunmehr 42 Jahren, am Vorabend der ersten Pariser Revolution, worin das Proletariat mit eignen Ansprüchen hervortrat.", "en": "But few voices responded when we proclaimed these words to the world 42 years ago, on the eve of the first Paris Revolution in which the proletariat came out with the demands of its own.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58"}, {"id": "P1890.19.3", "kind": "p", "de": "Aber am 28. September 1864 vereinigten sich Proletarier der meisten westeuropäischen Länder zur Internationalen Arbeiter-Assoziation glorreichen Angedenkens.", "en": "On September 28, 1864, however, the proletarians of most of the Western European countries joined hands in the International Working Men's Association of glorious memory.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58"}, {"id": "P1890.19.4", "kind": "p", "de": "Die Internationale selbst lebte allerdings nur neun Jahre.", "en": "True, the International itself lived only nine years.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58"}, {"id": "P1890.19.5", "kind": "p", "de": "Aber daß der von ihr gegründete ewige Bund der Proletarier aller Länder noch lebt, und kräftiger lebt als je. dafür gibt es keinen bessern Zeugen als grade den heutigen Tag.", "en": "But that the eternal union of the proletarians of all countries created by it is still alive and lives stronger than ever, there is no better witness than this day.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58"}, {"id": "P1890.19.6", "kind": "p", "de": "Denn heute, wo ich diese Zeilen schreibe, hält das europäische und amerikanische Proletariat Heerschau über seine zum erstenmal mobil gemachten Streitkräfte, mobil gemacht als ein Heer, unter einer Fahne und für ein nächstes Ziel: den schon vom Genfer Kongreß der Internationale 1866 und wiederum vom Pariser Arbeiterkongreß 1889 proklamierten, gesetzlich festzustellenden, achtstündigen Normalarbeitstag.", "en": "Because today, as I write these lines, the European and American proletariat is reviewing its fighting forces, mobilized for the first time, mobilized as one army, under one flag, for one immediate aim: the standard eight-hour working day to be established by legal enactment, as proclaimed by the Geneva Congress of the International in 1866, and again by the Paris Workers' Congress of 1889.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58"}, {"id": "P1890.19.7", "kind": "p", "de": "Und das Schauspiel des heutigen Tages wird den Kapitalisten und Grundherren aller Länder die Augen darüber öffnen, daß heute die Proletarier aller Länder in der Tat vereinigt sind.", "en": "And today's spectacle will open the eyes of the capitalists and landlords of all countries to the fact that today the proletarians of all countries are united indeed.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "58-59"}, {"id": "P1890.20.1", "kind": "p", "de": "Stände nur Marx noch neben mir, dies mit eignen Augen zu sehn!", "en": "If only Marx were still by my side to see this with his own eyes!", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "59"}, {"id": "P1890.21.1", "kind": "signature", "de": "London, am 1. Mai 1890", "en": "Frederick Engels May 1, 1890, London", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "59", "review": true, "review_reason": "2 de sentence(s) matched to 2 en sentence(s)"}, {"id": "P1890.22.1", "kind": "signature", "de": "F. Engels", "en": "", "joined_to": "P1890.21.1", "modern": "", "modern_status": "joined", "notes": "", "mew_page": "59"}, {"id": "P1890.N1.1.1", "kind": "note", "de": "Lassalle bekannte sich persönlich, uns gegenüber, stets als \"Schüler\" von Marx und stand als solcher selbstredend auf dem Boden des \"Manifests\".", "en": "", "modern": "", "modern_status": "empty", "notes": "", "review": true, "review_reason": "1 de sentence(s) matched to 0 en sentence(s)"}, {"id": "P1890.N1.1.2", "kind": "note", "de": "Anders mit denjenigen seiner Anhänger, die nicht über seine Forderung von Produktivgenossenschaften mit Staatskredit hinausgingen und die ganze Arbeiterklasse einteilten in Staatshülfler und Selbsthülfler.", "en": "", "modern": "", "modern_status": "empty", "notes": "", "review": true, "review_reason": "1 de sentence(s) matched to 0 en sentence(s)"}]}, {"section": "P1892", "title_de": "Vorwort [zur zweiten polnischen Ausgabe von 1892]", "title_en": "Preface to The 1892 Polish Edition", "source_de": "MEW 22, S. 282-283 (Dietz, Berlin) via mlwerke.de", "source_en": "Marxists Internet Archive transcription; English is a later translation (Progress Publishers, Moscow 1969), licence unverified", "original_language": "de", "anchor": "de", "verses": [{"id": "P1892.0.1", "kind": "heading", "de": "Vorwort [zur zweiten polnischen Ausgabe von 1892]", "en": "Preface to The 1892 Polish Edition", "modern": "", "modern_status": "empty", "notes": ""}, {"id": "P1892.1.1", "kind": "p", "de": "Die Tatsache, daß eine neue polnische Ausgabe des \"Kommunistischen Manifests\" notwendig geworden, gibt zu verschiedenen Betrachtungen Anlaß.", "en": "The fact that a new Polish edition of the Communist Manifesto has become necessary gives rise to various thoughts.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "282"}, {"id": "P1892.2.1", "kind": "p", "de": "Zuerst ist bemerkenswert, daß das \"Manifest\" neuerdings gewissermaßen zu einem Gradmesser geworden ist für die Entwicklung der großen Industrie auf dem europäischen Kontinent.", "en": "First of all, it is noteworthy that of late the Manifesto has become an index, as it were, of the development of large-scale industry on the European continent.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "282"}, {"id": "P1892.2.2", "kind": "p", "de": "In dem Maß, wie in einem Lande die große Industrie sich ausdehnt, in dem Maß wächst auch unter den Arbeitern desselben Landes das Verlangen nach Aufklärung über ihre Stellung als Arbeiterklasse gegenüber den besitzenden Klassen, breitet sich unter ihnen die sozialistische Bewegung aus und steigt die Nachfrage nach dem \"Manifest\".", "en": "In proportion as large-scale industry expands in a given country, the demand grows among the workers of that country for enlightenment regarding their position as the working class in relation to the possessing classes, the socialist movement spreads among them and the demand for the Manifesto increases.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "282"}, {"id": "P1892.2.3", "kind": "p", "de": "So daß nicht nur der Stand der Arbeiterbewegung, sondern auch der Entwicklungsgrad der großen Industrie in jedem Land mit ziemlicher Genauigkeit abgemessen werden kann an der Zahl der in der Landessprache verbreiteten Exemplare des \"Manifests\".", "en": "Thus, not only the state of the labour movement but also the degree of development of large-scale industry can be measured with fair accuracy in every country by the number of copies of the Manifesto circulated in the language of that country.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "282"}, {"id": "P1892.3.1", "kind": "p", "de": "Hiernach bezeichnet die neue polnische Ausgabe einen entschiednen Fortschritt der polnischen Industrie.", "en": "Accordingly, the new Polish edition indicates a decided progress of Polish industry.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "282"}, {"id": "P1892.3.2", "kind": "p", "de": "Und daß dieser Fortschritt, seit der vor zehn Jahren erschienenen letzten Ausgabe, in Wirklichkeit stattgefunden hat, darüber kann kein Zweifel sein.", "en": "And there can be no doubt whatever that this progress since the previous edition published ten years ago has actually taken place.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "282"}, {"id": "P1892.3.3", "kind": "p", "de": "Russisch-Polen, Kongreß-Polen, ist der große Industriebezirk des russischen Reichs geworden.", "en": "Russian Poland, Congress Poland, has become the big industrial region of the Russian Empire.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "282"}, {"id": "P1892.3.4", "kind": "p", "de": "Während die russische Großindustrie sporadisch zerstreut ist - ein Stück am Finnischen Meerbusen, ein Stück im Zentrum (Moskau und Wladimir), ein drittes am Schwarzen und Asowschen Meer, noch andre anderswo zersprengt -, ist die polnische auf verhältnismäßig kleinem Raum zusammengedrängt und genießt die aus dieser Konzentration entspringenden Vorteile und Nachteile.", "en": "Whereas Russian large-scale industry is scattered sporadically - a part round the Gulf of Finland, another in the centre (Moscow and Vladimir), a third along the coasts of the Black and Azov seas, and still others elsewhere - Polish industry has been packed into a relatively small area and enjoys both the advantages and disadvantages arising from such concentration.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "282"}, {"id": "P1892.3.5", "kind": "p", "de": "Die Vorteile erkannten die konkurrierenden russischen Fabrikanten an, als sie Schutzzölle gegen Polen verlangten, trotz ihres sehnlichen Wunsches, die Polen in Russen zu verwandeln.", "en": "The competing Russian manufacturers acknowledged the advantages when they demanded protective tariffs against Poland, in spit of their ardent desire to transform the Poles into Russians.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "282"}, {"id": "P1892.3.6", "kind": "p", "de": "Die Nachteile - für die polnischen Fabrikanten und für die russische Regierung - zeigen sich in der rapiden Verbreitung sozialistischer Ideen unter den polnischen Arbeitern und in der steigenden Nachfrage nach dem \"Manifest\".", "en": "The disadvantages - for the Polish manufacturers and the Russian government - are manifest in the rapid spread of socialist ideas among the Polish workers and in the growing demand for the Manifesto.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "282-283"}, {"id": "P1892.4.1", "kind": "p", "de": "Die rasche Entwicklung der polnischen Industrie, die der russischen über den Kopf gewachsen, ist aber ihrerseits ein neuer Beweis für die unverwüstliche Lebenskraft des polnischen Volks und eine neue Garantie seiner bevorstehenden nationalen Wiederherstellung.", "en": "But the rapid development of Polish industry, outstripping that of Russia, is in its turn a new proof of the inexhaustible vitality of the Polish people and a new guarantee of its impending national restoration.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "283"}, {"id": "P1892.4.2", "kind": "p", "de": "Die Wiederherstellung eines unabhängigen starken Polens ist aber eine Sache, die nicht nur die Polen, sondern die uns alle angeht.", "en": "And the restoration of an independent and strong Poland is a matter which concerns not only the Poles but all of us.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "283"}, {"id": "P1892.4.3", "kind": "p", "de": "Ein aufrichtiges internationales Zusammenwirken der europäischen Nationen ist nur möglich, wenn jede dieser Nationen im eignen Hause vollkommen autonom ist.", "en": "A sincere international collaboration of the European nations is possible only if each of these nations is fully autonomous in its own house.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "283"}, {"id": "P1892.4.4", "kind": "p", "de": "Die Revolution von 1848, die, unter proletarischer Fahne, proletarische Kämpfer schließlich nur die Arbeit der Bourgeoisie tun ließ, setzte auch durch ihre Testamentsvollstrecker Louis Bonaparte und Bismarck die Unabhängigkeit Italiens, Deutschlands, Ungarns durch; aber Polen, das seit 1792 mehr für die Revolution getan als alle diese drei zusammen, Polen überließ man sich selbst, als es 1863 vor der zehnfachen russischen Übermacht erlag.", "en": "The Revolution of 1848, which under the banner of the proletariat, after all, merely let the proletarian fighters do the work of the bourgeoisie, also secured the independence of Italy, Germany and Hungary through its testamentary executors, Louis Bonaparte and Bismarck; but Poland, which since 1792 had done more for the Revolution than all these three together, was left to its own resources when it succumbed in 1863 to a tenfold greater Russian force.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "283"}, {"id": "P1892.4.5", "kind": "p", "de": "Die Unabhängigkeit Polens hat der Adel weder erhalten noch wiedererkämpfen gekonnt; der Bourgeoisie ist sie heute zum mindesten gleichgültig.", "en": "The nobility could neither maintain nor regain Polish independence; today, to the bourgeoisie, this independence is, to say the last, immaterial.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "283"}, {"id": "P1892.4.6", "kind": "p", "de": "Und doch ist sie eine Notwendigkeit für das harmonische Zusammenwirken der europäischen Nationen.", "en": "Nevertheless, it is a necessity for the harmonious collaboration of the European nations.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "283"}, {"id": "P1892.4.7", "kind": "p", "de": "Sie kann erkämpft werden nur vom jungen polnischen Proletariat, und in dessen Händen ist sie gut aufgehoben.", "en": "It can be gained only by the young Polish proletariat, and in its hands it is secure.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "283"}, {"id": "P1892.4.8", "kind": "p", "de": "Denn die Arbeiter des ganzen übrigen Europas haben die Unabhängigkeit Polens ebenso nötig wie die polnischen Arbeiter selbst.", "en": "For the workers of all the rest of Europe need the independence of Poland just as much as the Polish workers themselves.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "283"}, {"id": "P1892.5.1", "kind": "signature", "de": "London, 10. Februar 1892", "en": "F. Engels London, February 10, 1892", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "283", "review": true, "review_reason": "2 de sentence(s) matched to 2 en sentence(s)"}, {"id": "P1892.6.1", "kind": "signature", "de": "F. Engels", "en": "", "joined_to": "P1892.5.1", "modern": "", "modern_status": "joined", "notes": "", "mew_page": "283"}]}, {"section": "P1893", "title_de": "An den italienischen Leser [Vorwort zur italienischen Ausgabe von 1893]", "title_en": "Preface to The 1893 Italian Edition", "source_de": "MEW 22, S. 365-366 (Dietz, Berlin) via mlwerke.de; German is MEW's editorial translation, NOT an original", "source_en": "Marxists Internet Archive transcription; English is a later translation (Progress Publishers, Moscow 1969), licence unverified", "original_language": "fr", "anchor": "de", "verses": [{"id": "P1893.0.1", "kind": "heading", "de": "An den italienischen Leser [Vorwort zur italienischen Ausgabe von 1893]", "en": "Preface to The 1893 Italian Edition", "modern": "", "modern_status": "empty", "notes": ""}, {"id": "P1893.1.1", "kind": "p", "de": "Die Veröffentlichung des \"Manifests der Kommunistischen Partei\" fiel fast auf den Tag genau mit dem 18. März 1848 zusammen, mit den Revolutionen von Mailand und Berlin, wo sich im Zentrum des europäischen Kontinents einerseits und des Mittelländischen Meeres andrerseits zwei Nationen erhoben, die bis dahin durch territoriale Zerstückelung und inneren Hader geschwächt und daher unter Fremdherrschaft geraten waren.", "en": "Publication of the Manifesto of the Communist Party coincided, one may say, with March 18, 1848, the day of the revolution in Milan and Berlin, which were armed uprisings of the two nations situated in the centre, the one, of the continent of Europe, the other, of the Mediterranean; two nations until then enfeebled by division and internal strife, and thus fallen under foreign domination.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "365"}, {"id": "P1893.1.2", "kind": "p", "de": "Während Italien dem Kaiser von Österreich [Ferdinand I.] unterworfen war, hatte Deutschland, wenn auch nicht so unmittelbar, das nicht minder schwere Joch des Zaren aller Reußen [Nikolaus I.] zu tragen.", "en": "While Italy was subject to the Emperor of Austria, Germany underwent the yoke, not less effective though more indirect, of the Tsar of all the Russias.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "365"}, {"id": "P1893.1.3", "kind": "p", "de": "Die Auswirkungen des 18. März 1848 befreiten Italien und Deutschland von dieser Schmach; wenn beide großen Nationen in der Zeit von 1848 bis 1871 wiederhergestellt und gewissermaßen sich selbst wiedergegeben wurden, so geschah dies, wie Karl Marx sagte, deshalb, weil dieselben Leute, die die Revolution von 1848 niederwarfen, dann wider Willen zu ihren Testamentsvollstreckern wurden.", "en": "The consequences of March 18, 1848, freed both Italy and Germany from this disgrace; if from 1848 to 1871 these two great nations were reconstituted and somehow again put on their own, it was as Karl Marx used to say, because the men who suppressed the Revolution of 1848 were, nevertheless, its testamentary executors in spite of themselves.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "365"}, {"id": "P1893.2.1", "kind": "p", "de": "Die Revolution war damals überall das Werk der Arbeiterklasse; die Arbeiterklasse war es, die die Barrikaden errichtete und ihr Leben in die Schanze schlug.", "en": "Everywhere that revolution was the work of the working class; it was the latter that built the barricades and paid with its lifeblood.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "365"}, {"id": "P1893.2.2", "kind": "p", "de": "Nur die Arbeiter von Paris hatten, als sie die Regierung stürzten, die ausgesprochene Absicht, das Bourgeoisregime zu stürzen.", "en": "Only the Paris workers, in overthrowing the government, had the very definite intention of overthrowing the bourgeois regime.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "365"}, {"id": "P1893.2.3", "kind": "p", "de": "Doch so sehr sie sich auch des unvermeidlichen Antagonismus bewußt waren, der zwischen ihrer eigenen Klasse und der Bourgeoisie bestand, hatte weder der wirtschaftliche Fortschritt des Landes noch die geistige Entwicklung der französischen Arbeitermassen jenen Grad erreicht, der eine Umgestaltung der Gesellschaft ermöglicht hätte.", "en": "But conscious though they were of the fatal antagonism existing between their own class and the bourgeoisie, still, neither the economic progress of the country nor the intellectual development of the mass of French workers had as yet reached the stage which would have made a social reconstruction possible.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "365"}, {"id": "P1893.2.4", "kind": "p", "de": "Die Früchte der Revolution wurden daher letzten Endes von der Kapitalistenklasse eingeheimst.", "en": "In the final analysis, therefore, the fruits of the revolution were reaped by the capitalist class.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "365"}, {"id": "P1893.2.5", "kind": "p", "de": "In den anderen Ländern, in Italien, Deutschland, Österreich, Ungarn, taten die Arbeiter von Anfang an nichts anderes, als die Bourgeoisie an die Macht zu bringen.", "en": "In the other countries, in Italy, in Germany, in Austria, the workers, from the very outset, did nothing but raise the bourgeoisie to power.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "365"}, {"id": "P1893.2.6", "kind": "p", "de": "Aber in keinem Lande ist die Herrschaft der Bourgeoisie ohne nationale Unabhängigkeit möglich.", "en": "But in any country the rule of the bourgeoisie is impossible without national independence.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "365-366"}, {"id": "P1893.2.7", "kind": "p", "de": "Die Revolution von 1848 mußte somit die Einheit und Unabhängigkeit derjenigen Nationen nach sich ziehen, denen es bis dahin daran gebrach: Italien, Deutschland, Ungarn; Polen wird zu seiner Zeit nachfolgen.", "en": "Therefore, the Revolution of 1848 had to bring in its train the unity and autonomy of the nations that had lacked them up to then: Italy, Germany, Hungary. Poland will follow in turn.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "366", "review": true, "review_reason": "1 de sentence(s) matched to 2 en sentence(s)"}, {"id": "P1893.3.1", "kind": "p", "de": "Wenn also die Revolution von 1848 keine sozialistische Revolution war, so ebnete sie dieser doch den Weg, bereitete für sie den Boden vor.", "en": "Thus, if the Revolution of 1848 was not a socialist revolution, it paved the way, prepared the ground for the latter.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "366"}, {"id": "P1893.3.2", "kind": "p", "de": "Mit der Entwicklung der großen Industrie in allen Ländern hat das Bourgeoisregime in den letzten 45 Jahren allenthalben ein zahlreiches, festgefügtes und starkes Proletariat hervorgebracht, hat es, um einen Ausdruck des \"Manifests\" zu gebrauchen, seine eignen Totengräber produziert.", "en": "Through the impetus given to large-scaled industry in all countries, the bourgeois regime during the last forty-five years has everywhere created a numerous, concentrated and powerful proletariat. It has thus raised, to use the language of the Manifesto, its own grave-diggers.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "366", "review": true, "review_reason": "1 de sentence(s) matched to 2 en sentence(s)"}, {"id": "P1893.3.3", "kind": "p", "de": "Ohne Wiederherstellung der Unabhängigkeit und Einheit jeder europäischen Nation hätte sich weder die internationale Vereinigung des Proletariats noch ein ruhiges, verständiges Zusammenwirken dieser Nationen zur Erreichung gemeinsamer Ziele vollziehen können.", "en": "Without restoring autonomy and unity to each nation, it will be impossible to achieve the international union of the proletariat, or the peaceful and intelligent co-operation of these nations toward common aims.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "366"}, {"id": "P1893.3.4", "kind": "p", "de": "Man stelle sich einmal ein gemeinsames internationales Vorgehen der italienischen, ungarischen, deutschen, polnischen, russischen Arbeiter unter den politischen Verhältnissen der Zeit vor 1848 vor!", "en": "Just imagine joint international action by the Italian, Hungarian, German, Polish and Russian workers under the political conditions preceding 1848!", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "366"}, {"id": "P1893.4.1", "kind": "p", "de": "Die Schlachten von 1848 waren also nicht vergebens, nicht vergebens auch die 45 Jahre, die uns von jener revolutionären Etappe trennen.", "en": "The battles fought in 1848 were thus not fought in vain. Nor have the forty-five years separating us from that revolutionary epoch passed to no purpose.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "366", "review": true, "review_reason": "1 de sentence(s) matched to 2 en sentence(s)"}, {"id": "P1893.4.2", "kind": "p", "de": "Die Früchte kommen zur Reife, und ich wünschte nur, daß die Veröffentlichung dieser italienischen Übersetzung des \"Manifests\" ein gutes Vorzeichen für den Sieg des italienischen Proletariats werde, so wie die Veröffentlichung des Originals es für die internationale Revolution war.", "en": "The fruits are ripening, and all I wish is that the publication of this Italian translation may augur as well for the victory of the Italian proletariat as the publication of the original did for the international revolution.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "366"}, {"id": "P1893.5.1", "kind": "p", "de": "Das \"Manifest\" läßt der revolutionären Rolle, die der Kapitalismus in der Vergangenheit gespielt hat, volle Gerechtigkeit widerfahren.", "en": "The Manifesto does full justice to the revolutionary part played by capitalism in the past.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "366"}, {"id": "P1893.5.2", "kind": "p", "de": "Die erste kapitalistische Nation war Italien.", "en": "The first capitalist nation was Italy.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "366"}, {"id": "P1893.5.3", "kind": "p", "de": "Der Ausgang des feudalen Mittelalters und der Anbruch des modernen kapitalistischen Zeitalters sind durch eine große Gestalt gekennzeichnet - durch den Italiener Dante, der zugleich der letzte Dichter des Mittelalters und der erste Dichter der Neuzeit war.", "en": "The close of the feudal Middle Ages, and the opening of the modern capitalist era are marked by a colossal figured: an Italian, Dante, both the last poet of the Middle Ages and the first poet of modern times.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "366"}, {"id": "P1893.5.4", "kind": "p", "de": "Heute bricht, wie um 1300, ein neues geschichtliches Zeitalter an.", "en": "Today, as in 1300, a new historical era is approaching.", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "366"}, {"id": "P1893.5.5", "kind": "p", "de": "Wird uns Italien den neuen Dante schenken, der die Geburtsstunde des proletarischen Zeitalters verkündet?", "en": "Will Italy give us the new Dante, who will mark the hour of birth of this new, proletarian era?", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "366"}, {"id": "P1893.6.1", "kind": "signature", "de": "London, 1. Februar 1893", "en": "Frederick Engels London, February 1, 1893", "modern": "", "modern_status": "empty", "notes": "", "mew_page": "366", "review": true, "review_reason": "2 de sentence(s) matched to 2 en sentence(s)"}, {"id": "P1893.7.1", "kind": "signature", "de": "Friedrich Engels", "en": "", "joined_to": "P1893.6.1", "modern": "", "modern_status": "joined", "notes": "", "mew_page": "366"}]}, {"section": "0", "title_de": "Manifest der Kommunistischen Partei", "title_en": "Manifesto of the Communist Party", "source_de": "MEW 4, S. 459-493 (Dietz, Berlin), text of the 1890 German edition, the last edited by Engels, via mlwerke.de; 1848/1872/1883/1888 variants from MEW's apparatus", "source_en": "Samuel Moore and Friedrich Engels, English edition of 1888; Marxists Internet Archive transcription proofed against the 1888 edition by Andy Blunden (2004), CC BY-SA", "original_language": "de", "anchor": "de", "verses": [{"id": "0.0.1", "kind": "heading", "de": "Manifest der Kommunistischen Partei", "en": "Manifesto of the Communist Party", "modern": "Manifesto of the Communist Party", "modern_status": "seed", "notes": ""}, {"id": "0.1.1", "kind": "p", "de": "Ein Gespenst geht um in Europa - das Gespenst des Kommunismus.", "en": "A spectre is haunting Europe - the spectre of communism.", "modern": "A ghost is haunting Europe - the ghost of communism.", "modern_status": "seed", "notes": "", "mew_page": "461"}, {"id": "0.1.2", "kind": "p", "de": "Alle Mächte des alten Europa haben sich zu einer heiligen Hetzjagd gegen dies Gespenst verbündet, der Papst und der Zar, Metternich und Guizot, französische Radikale und deutsche Polizisten.", "en": "All the powers of old Europe have entered into a holy alliance to exorcise this spectre: Pope and Tsar, Metternich and Guizot, French Radicals and German police-spies.", "modern": "Every major power in old Europe has joined forces to try to crush it: pope and tsar, kings and ministers, reformers and police alike.", "modern_status": "seed", "notes": "German Hetzjagd is a hunt (a chase with hounds). Moore's 'holy alliance' alludes to the Holy Alliance of 1815 and is not in the German. See glossary: heilige Hetzjagd.", "mew_page": "461"}, {"id": "0.2.1", "kind": "p", "de": "Wo ist die Oppositionspartei, die nicht von ihren regierenden Gegnern als kommunistisch verschrien worden wäre, wo die Oppositionspartei, die den fortgeschritteneren Oppositionsleuten sowohl wie ihren reaktionären Gegnern den brandmarkenden Vorwurf des Kommunismus nicht zurückgeschleudert hätte?", "en": "Where is the party in opposition that has not been decried as communistic by its opponents in power? Where is the opposition that has not hurled back the branding reproach of communism, against the more advanced opposition parties, as well as against its reactionary adversaries?", "modern": "Where is the opposition that hasn't been labeled \"communist\" by those in power? And where is the opposition that hasn't thrown that same accusation at others more radical than itself?", "modern_status": "seed", "notes": "", "mew_page": "461", "review": true, "review_reason": "1 de sentence(s) matched to 2 en sentence(s)"}, {"id": "0.3.1", "kind": "p", "de": "Zweierlei geht aus dieser Tatsache hervor.", "en": "Two things result from this fact:", "modern": "Two things are clear from this:", "modern_status": "seed", "notes": "", "mew_page": "461"}, {"id": "0.4.1", "kind": "p", "de": "Der Kommunismus wird bereits von allen europäischen Mächten als eine Macht anerkannt.", "en": "I. Communism is already acknowledged by all European powers to be itself a power.", "modern": "First, communism is already recognized by all major powers as a real force.", "modern_status": "seed", "notes": "", "mew_page": "461"}, {"id": "0.5.1", "kind": "p", "de": "Es ist hohe Zeit, daß die Kommunisten ihre Anschauungsweise, ihre Zwecke, ihre Tendenzen vor der ganzen Welt offen darlegen und dem Märchen vom Gespenst des Kommunismus ein Manifest der Partei selbst entgegenstellen.", "en": "II. It is high time that Communists should openly, in the face of the whole world, publish their views, their aims, their tendencies, and meet this nursery tale of the Spectre of Communism with a manifesto of the party itself.", "modern": "Second, it is time for communists to stop hiding. They must openly state what they believe, what they want, and what direction they are moving in - and answer the myths and fears about communism with a clear declaration of their own.", "modern_status": "seed", "notes": "", "de_variants": [{"ref": "T1", "editions": "1848", "reading": "den", "base_text": "Märchen vom Gespenst des Kommunismus …"}], "mew_page": "461"}, {"id": "0.6.1", "kind": "p", "de": "Zu diesem Zweck haben sich Kommunisten der verschiedensten Nationalität in London versammelt und das folgende Manifest entworfen, das in englischer, französischer, deutscher, italienischer, flämischer und dänischer Sprache veröffentlicht wird.", "en": "To this end, Communists of various nationalities have assembled in London and sketched the following manifesto, to be published in the English, French, German, Italian, Flemish and Danish languages.", "modern": "With that purpose, communists from different countries have come together and written this manifesto, to be shared across languages and nations.", "modern_status": "seed", "notes": "", "mew_page": "461"}]}, {"section": "I", "title_de": "Bourgeois und Proletarier", "title_en": "Bourgeois and Proletarians", "source_de": "MEW 4, S. 459-493 (Dietz, Berlin), text of the 1890 German edition, the last edited by Engels, via mlwerke.de; 1848/1872/1883/1888 variants from MEW's apparatus", "source_en": "Samuel Moore and Friedrich Engels, English edition of 1888; Marxists Internet Archive transcription proofed against the 1888 edition by Andy Blunden (2004), CC BY-SA", "original_language": "de", "anchor": "de", "verses": [{"id": "I.0.1", "kind": "heading", "de": "I. Bourgeois und Proletarier", "en": "I. Bourgeois and Proletarians", "modern": "I. Bourgeois and Proletarians", "modern_status": "seed", "notes": "", "footnotes": ["N1"], "mew_page": "461"}, {"id": "I.1.1", "kind": "p", "de": "Die Geschichte aller bisherigen Gesellschaft ist die Geschichte von Klassenkämpfen.", "en": "The history of all hitherto existing society is the history of class struggles.", "modern": "The history of every society up to this point is the history of class struggle.", "modern_status": "seed", "notes": "Engels's note N2 (1888) limits this to written history.", "footnotes": ["N2"], "mew_page": "462"}, {"id": "I.2.1", "kind": "p", "de": "Freier und Sklave, Patrizier und Plebejer, Baron und Leibeigener, Zunftbürger und Gesell, kurz, Unterdrücker und Unterdrückte standen in stetem Gegensatz zueinander, führten einen ununterbrochenen, bald versteckten, bald offenen Kampf, einen Kampf, der jedesmal mit einer revolutionären Umgestaltung der ganzen Gesellschaft endete oder mit dem gemeinsamen Untergang der kämpfenden Klassen.", "en": "Freeman and slave, patrician and plebeian, lord and serf, guild-master and journeyman, in a word, oppressor and oppressed, stood in constant opposition to one another, carried on an uninterrupted, now hidden, now open fight, a fight that each time ended, either in a revolutionary reconstitution of society at large, or in the common ruin of the contending classes.", "modern": "Free people and slaves, nobles and commoners, lords and serfs, guild masters and journeymen - in short, oppressors and oppressed - have always stood against each other. Their conflict has been constant, sometimes hidden and sometimes open, and it has ended either in the revolutionary remaking of society or in the shared ruin of the classes in conflict.", "modern_status": "seed", "notes": "", "footnotes": ["E1"], "mew_page": "462"}, {"id": "I.3.1", "kind": "p", "de": "In den früheren Epochen der Geschichte finden wir fast überall eine vollständige Gliederung der Gesellschaft in verschiedene Stände, eine mannigfaltige Abstufung der gesellschaftlichen Stellungen.", "en": "In the earlier epochs of history, we find almost everywhere a complicated arrangement of society into various orders, a manifold gradation of social rank.", "modern": "In earlier periods of history, society was divided into many ranks and layers.", "modern_status": "seed", "notes": "", "mew_page": "462"}, {"id": "I.3.2", "kind": "p", "de": "Im alten Rom haben wir Patrizier, Ritter, Plebejer, Sklaven; im Mittelalter Feudalherren, Vasallen, Zunftbürger, Gesellen, Leibeigene, und noch dazu in fast jeder dieser Klassen besondere Abstufungen.", "en": "In ancient Rome we have patricians, knights, plebeians, slaves; in the Middle Ages, feudal lords, vassals, guild-masters, journeymen, apprentices, serfs; in almost all of these classes, again, subordinate gradations.", "modern": "Ancient Rome had patricians, knights, plebeians, and slaves. The Middle Ages had feudal lords, vassals, guild masters, journeymen, apprentices, and serfs. And within nearly all of these groups, there were still further divisions.", "modern_status": "seed", "notes": "", "mew_page": "462-463"}, {"id": "I.4.1", "kind": "p", "de": "Die aus dem Untergang der feudalen Gesellschaft hervorgegangene moderne bürgerliche Gesellschaft hat die Klassengegensätze nicht aufgehoben.", "en": "The modern bourgeois society that has sprouted from the ruins of feudal society has not done away with class antagonisms.", "modern": "Modern bourgeois society, which grew out of the ruins of feudal society, has not done away with class conflict.", "modern_status": "seed", "notes": "", "mew_page": "463"}, {"id": "I.4.2", "kind": "p", "de": "Sie hat nur neue Klassen, neue Bedingungen der Unterdrückung, neue Gestaltungen des Kampfes an die Stelle der alten gesetzt.", "en": "It has but established new classes, new conditions of oppression, new forms of struggle in place of the old ones.", "modern": "It has only created new classes, new forms of oppression, and new forms of struggle in place of the old ones.", "modern_status": "seed", "notes": "", "mew_page": "463"}, {"id": "I.5.1", "kind": "p", "de": "Unsere Epoche, die Epoche der Bourgeoisie, zeichnet sich jedoch dadurch aus, daß sie die Klassengegensätze vereinfacht hat.", "en": "Our epoch, the epoch of the bourgeoisie, possesses, however, this distinct feature: it has simplified class antagonisms.", "modern": "But our time - the age of the bourgeoisie - has one distinctive feature: it has simplified class conflict.", "modern_status": "seed", "notes": "", "mew_page": "463"}, {"id": "I.5.2", "kind": "p", "de": "Die ganze Gesellschaft spaltet sich mehr und mehr in zwei große feindliche Lager, in zwei große, einander direkt gegenüberstehende Klassen: Bourgeoisie und Proletariat.", "en": "Society as a whole is more and more splitting up into two great hostile camps, into two great classes directly facing each other - Bourgeoisie and Proletariat.", "modern": "More and more, society is splitting into two hostile camps, into two great classes directly facing each other: the bourgeoisie and the proletariat.", "modern_status": "seed", "notes": "", "mew_page": "463"}, {"id": "I.6.1", "kind": "p", "de": "Aus den Leibeigenen des Mittelalters gingen die Pfahlbürger der ersten Städte hervor; aus dieser Pfahlbürgerschaft entwickelten sich die ersten Elemente der Bourgeoisie.", "en": "From the serfs of the Middle Ages sprang the chartered burghers of the earliest towns. From these burgesses the first elements of the bourgeoisie were developed.", "modern": "From the serfs of the Middle Ages came the chartered townspeople of the first cities. From these townspeople, the first elements of the bourgeoisie developed.", "modern_status": "seed", "notes": "", "mew_page": "463", "review": true, "review_reason": "1 de sentence(s) matched to 2 en sentence(s)"}, {"id": "I.7.1", "kind": "p", "de": "Die Entdeckung Amerikas, die Umschiffung Afrikas schufen der aufkommenden Bourgeoisie ein neues Terrain.", "en": "The discovery of America, the rounding of the Cape, opened up fresh ground for the rising bourgeoisie.", "modern": "The discovery of the Americas and the rounding of the Cape of Good Hope opened new territory for the rising bourgeoisie.", "modern_status": "seed", "notes": "", "mew_page": "463"}, {"id": "I.7.2", "kind": "p", "de": "Der ostindische und chinesische Markt, die Kolonisierung von Amerika, der Austausch mit den Kolonien, die Vermehrung der Tauschmittel und der Waren überhaupt gaben dem Handel, der Schiffahrt, der Industrie einen nie gekannten Aufschwung und damit dem revolutionären Element in der zerfallenden feudalen Gesellschaft eine rasche Entwicklung.", "en": "The East-Indian and Chinese markets, the colonisation of America, trade with the colonies, the increase in the means of exchange and in commodities generally, gave to commerce, to navigation, to industry, an impulse never before known, and thereby, to the revolutionary element in the tottering feudal society, a rapid development.", "modern": "The markets of the East Indies and China, the colonization of the Americas, trade with those colonies, and the growth of currency and goods in circulation gave commerce, shipping, and industry a push nothing in history had matched. This accelerated the revolutionary forces already eating away at feudalism.", "modern_status": "seed", "notes": "", "mew_page": "463"}, {"id": "I.8.1", "kind": "p", "de": "Die bisherige feudale oder zünftige Betriebsweise der Industrie reichte nicht mehr aus für den mit neuen Märkten anwachsenden Bedarf.", "en": "The feudal system of industry, in which industrial production was monopolised by closed guilds, now no longer sufficed for the growing wants of the new markets.", "modern": "The old feudal system of production, where industry was locked down by closed guilds, could no longer keep up with the demands of the new markets.", "modern_status": "seed", "notes": "", "de_variants": [{"ref": "T2", "editions": "1848, 1872, 1883", "reading": "den neuen", "base_text": "Märkten anwachsenden Bedarf. …"}], "mew_page": "463"}, {"id": "I.8.2", "kind": "p", "de": "Die Manufaktur trat an ihre Stelle.", "en": "The manufacturing system took its place.", "modern": "The manufacturing system took its place.", "modern_status": "seed", "notes": "", "mew_page": "463"}, {"id": "I.8.3", "kind": "p", "de": "Die Zunftmeister wurden verdrängt durch den industriellen Mittelstand; die Teilung der Arbeit zwischen den verschiedenen Korporationen verschwand vor der Teilung der Arbeit in der einzelnen Werkstatt selbst.", "en": "The guild-masters were pushed on one side by the manufacturing middle class; division of labour between the different corporate guilds vanished in the face of division of labour in each single workshop.", "modern": "The guild masters were shoved aside by the manufacturing middle class. The old division of labor between competing guilds collapsed, replaced by the division of labor inside a single workshop.", "modern_status": "seed", "notes": "", "mew_page": "463"}, {"id": "I.9.1", "kind": "p", "de": "Aber immer wuchsen die Märkte, immer stieg der Bedarf.", "en": "Meantime the markets kept ever growing, the demand ever rising.", "modern": "Markets kept growing. Demand kept rising.", "modern_status": "seed", "notes": "", "mew_page": "463"}, {"id": "I.9.2", "kind": "p", "de": "Auch die Manufaktur reichte nicht mehr aus.", "en": "Even manufacturer no longer sufficed.", "modern": "Even manufacturing was not enough.", "modern_status": "seed", "notes": "", "mew_page": "463"}, {"id": "I.9.3", "kind": "p", "de": "Da revolutionierte der Dampf und die Maschinerie die industrielle Produktion.", "en": "Thereupon, steam and machinery revolutionised industrial production.", "modern": "Then steam and machinery revolutionized production.", "modern_status": "seed", "notes": "", "mew_page": "463"}, {"id": "I.9.4", "kind": "p", "de": "An die Stelle der Manufaktur trat die moderne große Industrie, an die Stelle des industriellen Mittelstandes traten die industriellen Millionäre, die Chefs ganzer industrieller Armeen, die modernen Bourgeois.", "en": "The place of manufacture was taken by the giant, Modern Industry; the place of the industrial middle class by industrial millionaires, the leaders of the whole industrial armies, the modern bourgeois.", "modern": "Modern Industry replaced manufacturing, and the industrial middle class was replaced by industrial millionaires - the commanders of whole industrial armies - the modern bourgeoisie.", "modern_status": "seed", "notes": "", "mew_page": "463"}, {"id": "I.10.1", "kind": "p", "de": "Die große Industrie hat den Weltmarkt hergestellt, den die Entdeckung Amerikas vorbereitete.", "en": "Modern industry has established the world market, for which the discovery of America paved the way.", "modern": "Modern industry built the world market that the discovery of the Americas first opened up.", "modern_status": "seed", "notes": "", "mew_page": "463"}, {"id": "I.10.2", "kind": "p", "de": "Der Weltmarkt hat dem Handel, der Schiffahrt, den Landkommunikationen eine unermeßliche Entwicklung gegeben.", "en": "This market has given an immense development to commerce, to navigation, to communication by land.", "modern": "This world market hugely expanded commerce, shipping, and long-distance communication.", "modern_status": "seed", "notes": "", "mew_page": "463"}, {"id": "I.10.3", "kind": "p", "de": "Diese hat wieder auf die Ausdehnung der Industrie zurückgewirkt, und in demselben Maße, worin Industrie, Handel, Schiffahrt, Eisenbahnen sich ausdehnten, in demselben Maße entwickelte sich die Bourgeoisie, vermehrte sie ihre Kapitalien, drängte sie alle vom Mittelalter her überlieferten Klassen in den Hintergrund.", "en": "This development has, in its turn, reacted on the extension of industry; and in proportion as industry, commerce, navigation, railways extended, in the same proportion the bourgeoisie developed, increased its capital, and pushed into the background every class handed down from the Middle Ages.", "modern": "That expansion in turn fed back into industry. As industry, commerce, shipping, and railroads grew, the bourgeoisie grew with them, piling up capital and pushing every older class from the Middle Ages into the background.", "modern_status": "seed", "notes": "", "mew_page": "463-464"}, {"id": "I.11.1", "kind": "p", "de": "Wir sehen also, wie die moderne Bourgeoisie selbst das Produkt eines langen Entwicklungsganges, einer Reihe von Umwälzungen in der Produktions- und Verkehrsweise ist.", "en": "We see, therefore, how the modern bourgeoisie is itself the product of a long course of development, of a series of revolutions in the modes of production and of exchange.", "modern": "So the modern bourgeoisie is itself the product of a long process - a series of revolutions in how things are produced and exchanged.", "modern_status": "seed", "notes": "", "mew_page": "464"}, {"id": "I.12.1", "kind": "p", "de": "Jede dieser Entwicklungsstufen der Bourgeoisie war begleitet von einem entsprechenden politischen Fortschritt.", "en": "Each step in the development of the bourgeoisie was accompanied by a corresponding political advance of that class.", "modern": "Each step in the bourgeoisie's rise brought a matching rise in its political power. It started as an oppressed class under the feudal nobility.", "modern_status": "seed", "notes": "", "de_variants": [{"ref": "T3", "editions": "1888", "reading": "eingefügt: dieser Klasse", "base_text": ". …"}], "mew_page": "464"}, {"id": "I.12.2", "kind": "p", "de": "Unterdrückter Stand unter der Herrschaft der Feudalherren, bewaffnete und sich selbst verwaltende Assoziation in der Kommune, hier unabhängige städtische Republik, dort dritter steuerpflichtiger Stand der Monarchie, dann zur Zeit der Manufaktur Gegengewicht gegen den Adel in der ständischen oder in der absoluten Monarchie, Hauptgrundlage der großen Monarchien überhaupt, erkämpfte sie sich endlich seit der Herstellung der großen Industrie und des Weltmarktes im modernen Repräsentativstaat die ausschließliche politische Herrschaft.", "en": "An oppressed class under the sway of the feudal nobility, an armed and self-governing association in the medieval commune: here independent urban republic (as in Italy and Germany); there taxable \"third estate\" of the monarchy (as in France); afterwards, in the period of manufacturing proper, serving either the semi-feudal or the absolute monarchy as a counterpoise against the nobility, and, in fact, cornerstone of the great monarchies in general, the bourgeoisie has at last, since the establishment of Modern Industry and of the world market, conquered for itself, in the modern representative State, exclusive political sway.", "modern": "In the medieval communes it became an armed, self-governing association - sometimes an independent urban republic, as in Italy and Germany, sometimes a taxable \"third estate\" under a monarchy, as in France. Later, during the age of manufacturing, it served either semi-feudal or absolute monarchs as a counterweight to the old nobility, and became the cornerstone of those great monarchies. Finally, once Modern Industry and the world market were in place, the bourgeoisie seized exclusive political power in the modern representative state.", "modern_status": "seed", "notes": "", "footnotes": ["N3"], "de_variants": [{"ref": "T4", "editions": "1848, 1872", "reading": "Assoziationen", "base_text": "in der Kommune, hier unabhängige …"}, {"ref": "T5", "editions": "1888", "reading": "eingefügt: (wie in Italien und Deutschland)", "base_text": ", dort dritter steuerpflichtiger Stand …"}, {"ref": "T6", "editions": "1888", "reading": "eingefügt: (wie in Frankreich)", "base_text": ", dann zur Zeit der …"}, {"ref": "T7", "editions": "1848", "reading": "eingefügt: und", "base_text": ", Hauptgrundlage der großen Monarchien …"}], "mew_page": "464"}, {"id": "I.12.3", "kind": "p", "de": "Die moderne Staatsgewalt ist nur ein Ausschuß, der die gemeinschaftlichen Geschäfte der ganzen Bourgeoisklasse verwaltet.", "en": "The executive of the modern state is but a committee for managing the common affairs of the whole bourgeoisie.", "modern": "The executive of the modern state is nothing more than a committee for managing the shared business of the entire bourgeois class.", "modern_status": "seed", "notes": "Staatsgewalt is state power. Moore has 'the executive of the modern state'. See glossary: Staatsgewalt.", "mew_page": "464"}, {"id": "I.13.1", "kind": "p", "de": "Die Bourgeoisie hat in der Geschichte eine höchst revolutionäre Rolle gespielt.", "en": "The bourgeoisie, historically, has played a most revolutionary part.", "modern": "Historically, the bourgeoisie has played a deeply revolutionary role.", "modern_status": "seed", "notes": "", "mew_page": "464"}, {"id": "I.14.1", "kind": "p", "de": "Die Bourgeoisie, wo sie zur Herrschaft gekommen, hat alle feudalen, patriarchalischen, idyllischen Verhältnisse zerstört.", "en": "The bourgeoisie, wherever it has got the upper hand, has put an end to all feudal, patriarchal, idyllic relations.", "modern": "Wherever it has come to power, the bourgeoisie has destroyed every feudal, patriarchal, and idealized relationship.", "modern_status": "seed", "notes": "", "mew_page": "464"}, {"id": "I.14.2", "kind": "p", "de": "Sie hat die buntscheckigen Feudalbande, die den Menschen an seinen natürlichen Vorgesetzten knüpften, unbarmherzig zerrissen und kein anderes Band zwischen Mensch und Mensch übriggelassen als das nackte Interesse, als die gefühllose \"bare Zahlung\".", "en": "It has pitilessly torn asunder the motley feudal ties that bound man to his \"natural superiors\", and has left remaining no other nexus between man and man than naked self-interest, than callous \"cash payment\".", "modern": "It has ripped apart the tangled feudal ties that bound people to their so-called \"natural superiors.\" It has left no other connection between one person and another than bare self-interest and cold cash payment.", "modern_status": "seed", "notes": "", "mew_page": "464"}, {"id": "I.14.3", "kind": "p", "de": "Sie hat die heiligen Schauer der frommen Schwärmerei, der ritterlichen Begeisterung, der spießbürgerlichen Wehmut in dem eiskalten Wasser egoistischer Berechnung ertränkt.", "en": "It has drowned the most heavenly ecstasies of religious fervour, of chivalrous enthusiasm, of philistine sentimentalism, in the icy water of egotistical calculation.", "modern": "It has drowned the most sacred ecstasies of religious devotion, chivalric honor, and middle-class sentiment in the icy water of selfish calculation.", "modern_status": "seed", "notes": "", "mew_page": "464-465"}, {"id": "I.14.4", "kind": "p", "de": "Sie hat die persönliche Würde in den Tauschwert aufgelöst und an die Stelle der zahllosen verbrieften und wohlerworbenen Freiheiten die eine gewissenlose Handelsfreiheit gesetzt.", "en": "It has resolved personal worth into exchange value, and in place of the numberless indefeasible chartered freedoms, has set up that single, unconscionable freedom - Free Trade.", "modern": "It has turned personal worth into exchange value. In place of countless chartered freedoms that people had fought for, it has set up one freedom: free trade.", "modern_status": "seed", "notes": "", "mew_page": "465"}, {"id": "I.14.5", "kind": "p", "de": "Sie hat, mit einem Wort, an die Stelle der mit religiösen und politischen Illusionen verhüllten Ausbeutung die offene, unverschämte, direkte, dürre Ausbeutung gesetzt.", "en": "In one word, for exploitation, veiled by religious and political illusions, it has substituted naked, shameless, direct, brutal exploitation.", "modern": "In short, it has replaced exploitation hidden behind religious and political illusions with exploitation that is open, shameless, direct, and brutal.", "modern_status": "seed", "notes": "", "mew_page": "465"}, {"id": "I.15.1", "kind": "p", "de": "Die Bourgeoisie hat alle bisher ehrwürdigen und mit frommer Scheu betrachteten Tätigkeiten ihres Heiligenscheins entkleidet.", "en": "The bourgeoisie has stripped of its halo every occupation hitherto honoured and looked up to with reverent awe.", "modern": "The bourgeoisie has stripped the halo off every profession that was once respected and admired.", "modern_status": "seed", "notes": "", "mew_page": "465"}, {"id": "I.15.2", "kind": "p", "de": "Sie hat den Arzt, den Juristen, den Pfaffen, den Poeten, den Mann der Wissenschaft in ihre bezahlten Lohnarbeiter verwandelt.", "en": "It has converted the physician, the lawyer, the priest, the poet, the man of science, into its paid wage labourers.", "modern": "It has turned the doctor, the lawyer, the priest, the poet, and the scientist into its paid wage laborers.", "modern_status": "seed", "notes": "", "mew_page": "465"}, {"id": "I.16.1", "kind": "p", "de": "Die Bourgeoisie hat dem Familienverhältnis seinen rührend-sentimentalen Schleier abgerissen und es auf ein reines Geldverhältnis zurückgeführt.", "en": "The bourgeoisie has torn away from the family its sentimental veil, and has reduced the family relation to a mere money relation.", "modern": "The bourgeoisie has torn away the sentimental veil over the family and reduced the family bond to a pure money bond.", "modern_status": "seed", "notes": "", "mew_page": "465"}, {"id": "I.17.1", "kind": "p", "de": "Die Bourgeoisie hat enthüllt, wie die brutale Kraftäußerung, die die Reaktion so sehr am Mittelalter bewundert, in der trägsten Bärenhäuterei ihre passende Ergänzung fand.", "en": "The bourgeoisie has disclosed how it came to pass that the brutal display of vigour in the Middle Ages, which reactionaries so much admire, found its fitting complement in the most slothful indolence.", "modern": "The bourgeoisie has shown how the raw strength that reactionaries admire so much in the Middle Ages actually went hand in hand with laziness and stagnation.", "modern_status": "seed", "notes": "", "mew_page": "465"}, {"id": "I.17.2", "kind": "p", "de": "Erst sie hat bewiesen, was die Tätigkeit der Menschen zustande bringen kann.", "en": "It has been the first to show what man's activity can bring about.", "modern": "It has been the first to prove what human effort can accomplish.", "modern_status": "seed", "notes": "", "mew_page": "465"}, {"id": "I.17.3", "kind": "p", "de": "Sie hat ganz andere Wunderwerke vollbracht als ägyptische Pyramiden, römische Wasserleitungen und gotische Kathedralen, sie hat ganz andere Züge ausgeführt als Völkerwanderungen und Kreuzzüge.", "en": "It has accomplished wonders far surpassing Egyptian pyramids, Roman aqueducts, and Gothic cathedrals; it has conducted expeditions that put in the shade all former Exoduses of nations and crusades.", "modern": "It has built wonders that dwarf the Egyptian pyramids, Roman aqueducts, and Gothic cathedrals. It has led expeditions that make every earlier migration or crusade look small.", "modern_status": "seed", "notes": "", "mew_page": "465"}, {"id": "I.18.1", "kind": "p", "de": "Die Bourgeoisie kann nicht existieren, ohne die Produktionsinstrumente, also die Produktionsverhältnisse, also sämtliche gesellschaftlichen Verhältnisse fortwährend zu revolutionieren.", "en": "The bourgeoisie cannot exist without constantly revolutionising the instruments of production, and thereby the relations of production, and with them the whole relations of society.", "modern": "The bourgeoisie cannot exist without constantly revolutionizing the tools of production, and along with them the relationships of production and all of society.", "modern_status": "seed", "notes": "", "mew_page": "465"}, {"id": "I.18.2", "kind": "p", "de": "Unveränderte Beibehaltung der alten Produktionsweise war dagegen die erste Existenzbedingung aller früheren industriellen Klassen.", "en": "Conservation of the old modes of production in unaltered form, was, on the contrary, the first condition of existence for all earlier industrial classes.", "modern": "Every earlier industrial class needed the opposite - to preserve the old methods unchanged.", "modern_status": "seed", "notes": "", "mew_page": "465"}, {"id": "I.18.3", "kind": "p", "de": "Die fortwährende Umwälzung der Produktion, die ununterbrochene Erschütterung aller gesellschaftlichen Zustände, die ewige Unsicherheit und Bewegung zeichnet die Bourgeoisepoche vor allen anderen aus.", "en": "Constant revolutionising of production, uninterrupted disturbance of all social conditions, everlasting uncertainty and agitation distinguish the bourgeois epoch from all earlier ones.", "modern": "But constant revolution in production, uninterrupted disturbance of every social condition, and permanent uncertainty and upheaval are what set the bourgeois age apart from every earlier one.", "modern_status": "seed", "notes": "", "de_variants": [{"ref": "T8", "editions": "1848, 1872, 1883", "reading": "früheren", "base_text": "aus. …"}], "mew_page": "465"}, {"id": "I.18.4", "kind": "p", "de": "Alle festen eingerosteten Verhältnisse mit ihrem Gefolge von altehrwürdigen Vorstellungen und Anschauungen werden aufgelöst, alle neugebildeten veralten, ehe sie verknöchern können.", "en": "All fixed, fast-frozen relations, with their train of ancient and venerable prejudices and opinions, are swept away, all new-formed ones become antiquated before they can ossify.", "modern": "All fixed, frozen relationships, with their ancient and respected prejudices and opinions, are swept away. All new relationships grow outdated before they can harden.", "modern_status": "seed", "notes": "", "mew_page": "465"}, {"id": "I.18.5", "kind": "p", "de": "Alles Ständische und Stehende verdampft, alles Heilige wird entweiht, und die Menschen sind endlich gezwungen, ihre Lebensstellung, ihre gegenseitigen Beziehungen mit nüchternen Augen anzusehen.", "en": "All that is solid melts into air, all that is holy is profaned, and man is at last compelled to face with sober senses his real conditions of life, and his relations with his kind.", "modern": "Everything solid melts into air. Everything sacred is made profane. And at last, people are forced to face, with clear eyes, the real conditions of their lives and their actual relationships with each other.", "modern_status": "seed", "notes": "Free rendering in 1888. Literally: everything belonging to the estates and everything standing evaporates. See glossary: Stand.", "mew_page": "465"}, {"id": "I.19.1", "kind": "p", "de": "Das Bedürfnis nach einem stets ausgedehnteren Absatz für ihre Produkte jagt die Bourgeoisie über die ganze Erdkugel.", "en": "The need of a constantly expanding market for its products chases the bourgeoisie over the entire surface of the globe.", "modern": "The need for an ever-expanding market chases the bourgeoisie across the whole surface of the globe.", "modern_status": "seed", "notes": "", "mew_page": "465"}, {"id": "I.19.2", "kind": "p", "de": "Überall muß sie sich einnisten, überall anbauen, überall Verbindungen herstellen.", "en": "It must nestle everywhere, settle everywhere, establish connexions everywhere.", "modern": "It has to put down roots everywhere, settle everywhere, build connections everywhere.", "modern_status": "seed", "notes": "", "mew_page": "465"}, {"id": "I.20.1", "kind": "p", "de": "Die Bourgeoisie hat durch ihre Exploitation des Weltmarkts die Produktion und Konsumption aller Länder kosmopolitisch gestaltet.", "en": "The bourgeoisie has through its exploitation of the world market given a cosmopolitan character to production and consumption in every country.", "modern": "Through its exploitation of the world market, the bourgeoisie has given a global character to production and consumption in every country.", "modern_status": "seed", "notes": "", "de_variants": [{"ref": "T9", "editions": "1848", "reading": "die", "base_text": "Exploitation des Weltmarkts die Produktion …"}], "mew_page": "466"}, {"id": "I.20.2", "kind": "p", "de": "Sie hat zum großen Bedauern der Reaktionäre den nationalen Boden der Industrie unter den Füßen weggezogen.", "en": "To the great chagrin of Reactionists, it has drawn from under the feet of industry the national ground on which it stood.", "modern": "To the horror of reactionaries, it has pulled the national ground right out from under industry's feet.", "modern_status": "seed", "notes": "", "mew_page": "466"}, {"id": "I.20.3", "kind": "p", "de": "Die uralten nationalen Industrien sind vernichtet worden und werden noch täglich vernichtet.", "en": "All old-established national industries have been destroyed or are daily being destroyed.", "modern": "Old national industries have been destroyed, or are being destroyed daily.", "modern_status": "seed", "notes": "", "mew_page": "466"}, {"id": "I.20.4", "kind": "p", "de": "Sie werden verdrängt durch neue Industrien, deren Einführung eine Lebensfrage für alle zivilisierten Nationen wird, durch Industrien, die nicht mehr einheimische Rohstoffe, sondern den entlegensten Zonen angehörige Rohstoffe verarbeiten und deren Fabrikate nicht nur im Lande selbst, sondern in allen Weltteilen zugleich verbraucht werden.", "en": "They are dislodged by new industries, whose introduction becomes a life and death question for all civilised nations, by industries that no longer work up indigenous
