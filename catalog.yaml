# The library's work list. One entry per planned work, in queue order (`priority`, lowest first).
# scripts/build.py turns this into the "Works" table in README.md; scripts/validate.py checks it.
#
# stage: planned     on the list, sources not yet located
#        sourced     raw files found and listed under `sources` (URLs below), not yet versified
#        versified   verse files and lock exist in works/<id>/; alignment checks may still be open
#        ready       SOURCES.md, glossary and cruxes written; open for the modern rewrite
#        translating modern draft under way (some verses draft or reviewed)
#        released    modern draft reviewed and released
# tier:  A original and an English translation both public domain
#        B original public domain; historical English needs checking or does not exist
#        C still under copyright: commentary and adaptations only
#
# Sources use raw.githubusercontent.com mirrors so automated runs can fetch them:
#   mlwerke: https://raw.githubusercontent.com/wertform/mlwerke.de/HEAD/me/<file>      (MEW, German)
#   mia:     https://raw.githubusercontent.com/MARX-EBOOKS/marx-ebooks.github.io/HEAD/<path>  (Marxists Internet Archive)
#   gutenberg: https://raw.githubusercontent.com/GITenberg/<repo>/master/<n>.txt      (Project Gutenberg)

