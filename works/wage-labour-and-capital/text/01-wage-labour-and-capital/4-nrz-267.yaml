section: IV
title_original: Lohnarbeit und Kapital, Neue Rheinische Zeitung Nr. 267, 8. April 1849
title_en: Instalment IV (NRZ No. 267, 8 April 1849)
author: Karl Marx
date: 1849-04
original_language: de
anchor_language: de
source_original: 'MEW 6, S. 397-423 (Dietz, Berlin) via mlwerke.de: text of Engels''s 1891 edition; 1849 newspaper readings attached as variants'
source_en: Harriet E. Lothrop, Wage-Labor and Capital, New York Labor News Co., 1902 (public domain), in the Marxists Internet Archive edition (proofed by Alek Blain, 2006; CC BY-SA), which modernises some wording and currency
verses:
- id: IV.0.1
  kind: heading
  original: '[IV] Neue Rheinische Zeitung Nr. 267, 8. April 1849'
  en: '[IV] Neue Rheinische Zeitung No. 267, 8 April 1849'
  modern: ''
  modern_status: empty
  notes: ''
  en_note: 'Editorial heading: the newspaper instalment. Not printed in the 1891 pamphlet.'
- id: IV.1.1
  kind: p
  original: 'Wächst das Kapital, so wächst die Masse der Lohnarbeit, so wächst die Anzahl der Lohnarbeiter, mit einem Wort: Die Herrschaft des Kapitals dehnt sich über eine größere Masse von Individuen aus.'
  en: If capital grows, the mass of wage-labour grows, the number of wage-workers increases; in a word, the sway of capital extends over a greater mass of individuals.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T62
    editions: 1849 (NRZ)
    reading: 'vorangestellt: * Köln, 7. April'
    base_text: ‸ Wächst das Kapital, so …
  mew_page: '411'
- id: IV.1.2
  kind: p
  original: 'Und unterstellen wir den günstigsten Fall: Wenn das produktive Kapital wächst, wächst die Nachfrage nach Arbeit.'
  en: 'Let us suppose the most favorable case: if productive capital grows, the demand for labour grows.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: IV.1.3
  kind: p
  original: Es steigt also der Preis der Arbeit, der Arbeitslohn.
  en: It therefore increases the price of labour-power, wages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: IV.2.1
  kind: p
  original: Ein Haus mag groß oder klein sein, solange die es umgebenden Häuser ebenfalls klein sind, befriedigt es alle gesellschaftlichen Ansprüche an eine Wohnung.
  en: A house may be large or small; as long as the neighboring houses are likewise small, it satisfies all social requirement for a residence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: IV.2.2
  kind: p
  original: Erhebt sich aber neben dem kleinen Haus ein Palast, und das kleine Haus schrumpft zur Hütte zusammen.
  en: But let there arise next to the little house a palace, and the little house shrinks to a hut.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: IV.2.3
  kind: p
  original: Das kleine Haus beweist nun, daß sein Inhaber keine oder nur die geringsten Ansprüche zu machen hat; und es mag im Laufe der Zivilisation in die Höhe schießen noch so sehr, wenn der benachbarte Palast in gleichem oder gar in höherem Maße in die Höhe schießt, wird der Bewohner des verhältnismäßig kleinen Hauses sich immer unbehaglicher, unbefriedigter, gedrückter in seinen vier Pfählen finden.
  en: The little house now makes it clear that its inmate has no social position at all to maintain, or but a very insignificant one; and however high it may shoot up in the course of civilization, if the neighboring palace rises in equal or even in greater measure, the occupant of the relatively little house will always find himself more uncomfortable, more dissatisfied, more cramped within his four walls.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: IV.3.1
  kind: p
  original: Ein merkliches Zunehmen des Arbeitslohns setzt ein rasches Wachsen des produktiven Kapitals voraus.
  en: An appreciable rise in wages presupposes a rapid growth of productive capital.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T63
    editions: 1849 (NRZ)
    reading: Wachstum
    base_text: … setzt ein rasches Wachsen ‸ des produktiven Kapitals voraus. …
  mew_page: '412'
- id: IV.3.2
  kind: p
  original: Das rasche Wachsen des produktiven Kapitals ruft ebenso rasches Wachstum des Reichtums, des Luxus, der gesellschaftlichen Bedürfnisse und der gesellschaftlichen Genüsse hervor.
  en: Rapid growth of productive capital calls forth just as rapid a growth of wealth, of luxury, of social needs and social pleasures.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: IV.3.3
  kind: p
  original: Obgleich also die Genüsse des Arbeiters gestiegen sind, ist die gesellschaftliche Befriedigung, die sie gewähren, gefallen im Vergleich mit den vermehrten Genüssen des Kapitalisten, die dem Arbeiter unzugänglich sind, im Vergleich mit dem Entwicklungsstand der Gesellschaft überhaupt.
  en: Therefore, although the pleasures of the labourer have increased, the social gratification which they afford has fallen in comparison with the increased pleasures of the capitalist, which are inaccessible to the worker, in comparison with the stage of development of society in general.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: IV.3.4
  kind: p
  original: Unsre Bedürfnisse und Genüsse entspringen aus der Gesellschaft; wir messen sie daher an der Gesellschaft; wir messen sie nicht an den Gegenständen ihrer Befriedigung.
  en: Our wants and pleasures have their origin in society; we therefore measure them in relation to society; we do not measure them in relation to the objects which serve for their gratification.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: IV.3.5
  kind: p
  original: Weil sie gesellschaftlicher Natur sind, sind sie relativer Natur.
  en: Since they are of a social nature, they are of a relative nature.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: IV.4.1
  kind: p
  original: Der Arbeitslohn wird überhaupt nicht nur bestimmt durch die Masse von Waren, die ich für ihn austauschen kann.
  en: But wages are not at all determined merely by the sum of commodities for which they may be exchanged.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T64
    editions: 1849 (NRZ)
    reading: eintauschen
    base_text: … ich für ihn austauschen ‸ kann. …
  mew_page: '412'
- id: IV.4.2
  kind: p
  original: Er enthält verschiedne Beziehungen.
  en: Other factors enter into the problem.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: IV.5.1
  kind: p
  original: Was die Arbeiter zunächst für ihre Arbeitskraft erhalten, ist eine bestimmte Summe Geldes.
  en: What the workers directly receive for their labour-power is a certain sum of money.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T65
    editions: 1849 (NRZ)
    reading: Arbeit
    base_text: … zunächst für ihre Arbeitskraft ‸ erhalten, ist eine bestimmte …
  mew_page: '412'
- id: IV.5.2
  kind: p
  original: Ist der Arbeitslohn nur durch diesen Geldpreis bestimmt?
  en: Are wages determined merely by this money price?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: IV.6.1
  kind: p
  original: Im 16. Jahrhundert vermehrte sich das in Europa zirkulierende Gold und Silber infolge der Entdeckung von reicheren und leichter zu bearbeitenden Bergwerken in Amerika.
  en: In the 16th century, the gold and silver circulation in Europe increased in consequence of the discovery of richer and more easily worked mines in America.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T66
    editions: 1849 (NRZ)
    reading: 'fehlt: reicheren und leichter zu bearbeitenden Bergwerke in'
    base_text: … zu bearbeitenden Bergwerken in ‸ Amerika. …
  mew_page: '412'
- id: IV.6.2
  kind: p
  original: Der Wert des Goldes und Silbers fiel daher im Verhältnis zu den übrigen Waren.
  en: The value of gold and silver, therefore, fell in relation to other commodities.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: IV.6.3
  kind: p
  original: Die Arbeiter erhielten nach wie vor dieselbe Masse gemünzten Silbers für ihre Arbeitskraft.
  en: The workers received the same amount of coined silver for their labour-power as before.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T65
    editions: 1849 (NRZ)
    reading: Arbeit
    base_text: … Silbers für ihre Arbeitskraft ‸ . …
  mew_page: '412'
- id: IV.6.4
  kind: p
  original: Der Geldpreis ihrer Arbeit blieb derselbe, und dennoch war ihr Arbeitslohn gefallen, denn im Austausch für dieselbe Quantität Silber erhielten sie eine geringre Summe andrer Waren zurück.
  en: The money price of their work remained the same, and yet their wages had fallen, for in exchange for the same amount of silver they obtained a smaller amount of other commodities.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: IV.6.5
  kind: p
  original: Es war dies einer der Umstände, die das Wachstum des Kapitals, das Aufkommen der Bourgeoisie im 16.
  en: This was one of the circumstances which furthered the growth of capital, the rise of the bourgeoisie, in the 18th century.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T67
    editions: '1891'
    reading: 'Druckfehler: 18.'
    base_text: … der Bourgeoisie im 16. ‸  …
  mew_page: '412'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: IV.6.6
  kind: p
  original: Jahrhundert förderten.
  en: ''
  joined_to: IV.6.5
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '412'
- id: IV.7.1
  kind: p
  original: Nehmen wir einen andern Fall.
  en: Let us take another case.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: IV.7.2
  kind: p
  original: Im Winter 1847 waren infolge einer Mißernte die unentbehrlichsten Lebensmittel, Getreide, Fleisch, Butter, Käse usw., bedeutend im Preise gestiegen.
  en: In the winter of 1847, in consequence of bad harvest, the most indispensable means of subsistence - grains, meat, butter, cheese, etc. - rose greatly in price.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: IV.7.3
  kind: p
  original: Gesetzt, die Arbeiter hätten nach wie vor dieselbe Summe Geldes für ihre Arbeitskraft empfangen.
  en: Let us suppose that the workers still received the same sum of money for their labour-power as before.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T65
    editions: 1849 (NRZ)
    reading: Arbeit
    base_text: … Geldes für ihre Arbeitskraft ‸ empfangen. …
  mew_page: '412'
- id: IV.7.4
  kind: p
  original: War ihr Arbeitslohn nicht gefallen?
  en: Did not their wages fall?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: IV.7.5
  kind: p
  original: Allerdings.
  en: To be sure.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: IV.7.6
  kind: p
  original: Für dasselbe Geld erhielten sie im Austausch weniger Brot, Fleisch usw. Ihr Arbeitslohn war gefallen, nicht weil sich der Wert des Silbers vermindert, sondern weil sich der Wert der Lebensmittel vermehrt hatte.
  en: For the same money they received in exchange less bread, meat, etc. Their wages fell, not because the value of silver was less, but because the value of the means of subsistence had increased.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: IV.8.1
  kind: p
  original: Gesetzt endlich, der Geldpreis der Arbeit bleibe derselbe, während alle Agrikultur- und Manufakturwaren infolge von Anwendung neuer Maschinen, günstiger Jahreszeit usw. im Preise gefallen wären.
  en: Finally, let us suppose that the money price of labour-power remained the same, while all agricultural and manufactured commodities had fallen in price because of the employment of new machines, of favorable seasons, etc. For the same money the workers could now buy more commodities of all kinds.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '413'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: IV.8.2
  kind: p
  original: Für dasselbe Geld können die Arbeiter nun mehr Waren aller Art kaufen.
  en: ''
  joined_to: IV.8.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '413'
- id: IV.8.3
  kind: p
  original: Ihr Arbeitslohn ist also gestiegen, eben weil der Geldwert desselben sich nicht verändert hat.
  en: Their wages have therefore risen, just because their money value has not changed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '413'
- id: IV.9.1
  kind: p
  original: Der Geldpreis der Arbeit, der nominelle Arbeitslohn, fällt also nicht zusammen mit dem reellen Arbeitslohn, d.h. mit der Summe von Waren, die wirklich im Austausch gegen den Arbeitslohn gegeben wird.
  en: The money price of labour-power, the nominal wages, do not therefore coincide with the actual or real wages - i.e., with the amount of commodities which are actually given in exchange for the wages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '413'
- id: IV.9.2
  kind: p
  original: Sprechen wir also vom Steigen oder Fallen des Arbeitslohns, so haben wir nicht nur den Geldpreis der Arbeit, den nominellen Arbeitslohn, im Auge zu halten.
  en: If then we speak of a rise or fall of wages, we have to keep in mind not only the money price of labour-power, the nominal wages, but also the real wages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '413'
- id: IV.10.1
  kind: p
  original: Aber weder der nominelle Arbeitslohn, d.h. die Geldsumme, wofür der Arbeiter sich an den Kapitalisten verkauft, noch der reelle Arbeitslohn, d.h. die Summe Waren, die er für dies Geld kaufen kann, erschöpfen die im Arbeitslohn enthaltnen Beziehungen.
  en: But neither the nominal wages - i.e., the amount of money for which the labourer sells himself to the capitalist - nor the real wages - i.e., the amount of commodities which he can buy for this money - exhausts the relations which are comprehended in the term wages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '413'
- id: IV.11.1
  kind: p
  original: Der Arbeitslohn ist vor allem noch bestimmt durch sein Verhältnis zum Gewinn, zum Profit des Kapitalisten - verhältnismäßiger, relativer Arbeitslohn.
  en: Wages are determined above all by their relations to the gain, the profit, of the capitalist. In other words, wages are a proportionate, relative quantity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '413'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IV.12.1
  kind: p
  original: Der reelle Arbeitslohn drückt den Preis der Arbeit im Verhältnis zum Preise der übrigen Waren aus, der relative Arbeitslohn dagegen den Anteil der unmittelbaren Arbeit an dem von ihr neu erzeugten Wert im Verhältnis des Anteils davon, der der aufgehäuften Arbeit, dem Kapital, zufällt.
  en: Real wages express the price of labour-power in relation to the price of commodities; relative wages, on the other hand, express the share of immediate labour in the value newly created by it, in relation to the share of it which falls to accumulated labour, to capital.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T68
    editions: 1849 (NRZ)
    reading: 'lautet der Absatz: Der reelle Arbeitslohn drückt den Preis der Arbeit im Verhältnis zum Preise der übrigen waren aus, der relative Arbeitslohn dagegen den Preis der unmittelbaren Arbeit im Verhältnis zum Preise der aufgehäuften Arbeit, den verhältnismäßigen Wert von Lohnarbeit und Kapital, den wechselseitigen Wert der Kapitalisten und Arbeiter.'
    base_text: … Arbeit, dem Kapital, zufällt. ‸  …
  mew_page: '413'
- id: IV.13.1
  kind: p
  original: 'Wir sagten oben, Seite 14 <Siehe S. 400>: "Der Arbeitslohn ist nicht ein Anteil des Arbeiters an der von ihm produzierten Ware.'
  en: 'We have said: "Wages are not a share of the worker in the commodities produced by him.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '413'
  en_note: 'Lothrop 1902, chapter 7: The General Law that Determines the Rise and Fall of Wages and Profits'
- id: IV.13.2
  kind: p
  original: Der Arbeitslohn ist der Teil schon vorhandner Waren, womit der Kapitalist eine bestimmte Summe produktiver Arbeitskraft an sich kauft."
  en: Wages are that part of already existing commodities with which the capitalist buys a certain amount of productive labor-power."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '413'
- id: IV.13.3
  kind: p
  original: Aber diesen Arbeitslohn muß der Kapitalist wieder ersetzen aus dem Preis, wozu er das vom Arbeiter erzeugte Produkt verkauft; er muß ihn so ersetzen, daß ihm dabei in der Regel noch ein Überschuß über seine ausgelegten Produktionskosten, ein Profit, übrigbleibt.
  en: But the capitalist must replace these wages out of the price for which he sells the product made by the worker; he must so replace it that, as a rule, there remains to him a surplus above the cost of production expended by him, that is, he must get a profit.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '413'
- id: IV.13.4
  kind: p
  original: 'Der Verkaufspreis der vom Arbeiter erzeugten Ware teilt sich für den Kapitalisten in drei Teile: erstens den Ersatz des Preises der von ihm vorgeschoßnen Rohstoffe nebst dem Ersatz des Verschleißes der ebenfalls von ihm vorgeschoßnen Werkzeuge, Maschinen und andren Arbeitsmittel; zweitens in den Ersatz des von ihm vorgeschoßnen Arbeitslohns und drittens in den Überschuß darüber, den Profit des Kapitalisten.'
  en: 'The selling price of the commodities produced by the worker is divided, from the point of view of the capitalist, into three parts: First, the replacement of the price of the raw materials advanced by him, in addition to the replacement of the wear and tear of the tools, machines, and other instruments of labor likewise advanced by him; Second, the replacement of the wages advanced; and Third, the surplus leftover - i.e., the profit of the capitalist.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 413-414
- id: IV.13.5
  kind: p
  original: Während der erste Teil nur früher vorhandne Werte ersetzt, ist es klar, daß sowohl der Ersatz des Arbeitslohns wie der Überschußprofit des Kapitalisten im ganzen und großen genommen werden aus dem durch die Arbeit des Arbeiters geschaffnen und den Rohstoffen zugesetzten Neuwert.
  en: While the first part merely replaces previously existing values, it is evident that the replacement of the wages and the surplus (the profit of capital) are as a whole taken out of the new value, which is produced by the labor of the worker and added to the raw materials.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '414'
- id: IV.13.6
  kind: p
  original: Und in diesem Sinn können wir sowohl Arbeitslohn wie Profit, um sie miteinander zu vergleichen, als Anteile am Produkt des Arbeiters auffassen.
  en: And in this sense we can view wages as well as profit, for the purpose of comparing them with each other, as shares in the product of the worker.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T69
    editions: 1849 (NRZ)
    reading: fehlt der ganze Absatz
    base_text: … Produkt des Arbeiters auffassen. ‸  …
  mew_page: '414'
- id: IV.14.1
  kind: p
  original: Der reelle Arbeitslohn mag derselbe bleiben, er mag selbst steigen, und der relative Arbeitslohn kann nichtsdestoweniger fallen.
  en: Real wages may remain the same, they may even rise, nevertheless the relative wages may fall.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '414'
- id: IV.14.2
  kind: p
  original: Unterstellen wir z. B., alle Lebensmittel seien im Preise um 2 / 3 gesunken, während der Taglohn nur um 1 / 3 sinke, also z.B. von 3 Mark auf 2 Mark.
  en: Let us suppose, for instance, that all means of subsistence have fallen 2/3rds in price, while the day's wages have fallen but 1/3rd - for example, from three to two shillings.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '414'
- id: IV.14.3
  kind: p
  original: Obgleich der Arbeiter mit diesen 2 Mark über eine größre Summe von Waren verfügt als früher mit 3 Mark, so hat dennoch sein Arbeitslohn im Verhältnis zum Gewinn des Kapitalisten abgenommen.
  en: Although the worker can now get a greater amount of commodities with these two shillings than he formerly did with three shillings, yet his wages have decreased in proportion to the gain of the capitalist.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '414'
- id: IV.14.4
  kind: p
  original: Der Profit des Kapitalisten (z.B. des Fabrikanten) hat sich um eine Mark vermehrt, d.h., für eine geringre Summe von Tauschwerten, die er dem Arbeiter zahlt, muß der Arbeiter eine größre Summe von Tauschwerten produzieren als früher.
  en: The profit of the capitalist - the manufacturer's for instance - has increased one shilling, which means that for a smaller amount of exchange values, which he pays to the worker, the latter must produce a greater amount of exchange values than before.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '414'
- id: IV.14.5
  kind: p
  original: Der Anteil des Kapitals im Verhältnis zum Anteil der Arbeit ist gestiegen.
  en: The share of capitals in proportion to the share of labour has risen.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T70
    editions: 1849 (NRZ)
    reading: Wert
    base_text: … Der Anteil ‸ des Kapitals im Verhältnis …
  - ref: T70
    editions: 1849 (NRZ)
    reading: Wert
    base_text: … im Verhältnis zum Anteil ‸ der Arbeit ist gestiegen. …
  mew_page: '414'
- id: IV.14.6
  kind: p
  original: Die Verteilung des gesellschaftlichen Reichtums zwischen Kapital und Arbeit ist noch ungleichmäßiger geworden.
  en: The distribution of social wealth between capital and labour has become still more unequal.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '414'
- id: IV.14.7
  kind: p
  original: Der Kapitalist kommandiert mit demselben Kapital eine größre Quantität Arbeit.
  en: The capitalist commands a greater amount of labour with the same capital.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '414'
- id: IV.14.8
  kind: p
  original: Die Macht der Kapitalistenklasse über die Arbeiterklasse ist gewachsen, die gesellschaftliche Stellung des Arbeiters hat sich verschlechtert, ist um eine Stufe tiefer unter die des Kapitalisten herabgedrückt.
  en: The power of the capitalist class over the working class has grown, the social position of the worker has become worse, has been forced down still another degree below that of the capitalist.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T71
    editions: 1849 (NRZ)
    reading: 'fehlt: des'
    base_text: … tiefer unter die des ‸ Kapitalisten herabgedrückt. …
  mew_page: '414'
- id: IV.15.1
  kind: p
  original: Welches ist nun das allgemeine Gesetz, das das Fallen und Steigen des Arbeitslohns und Profits in ihrer wechselseitigen Beziehung bestimmt?
  en: What, then, is the general law that determines the rise and fall of wages and profit in their reciprocal relation?
  modern: ''
  modern_status: empty
  notes: ''
  variants:
