  mew_page: '414'
- id: IV.16.2
  kind: p
  original: Der Anteil des Kapitals, der Profit, steigt in demselben Verhältnis, worin der Anteil der Arbeit, der Taglohn, fällt, und umgekehrt.
  en: The share of (profit) increases in the same proportion in which the share of labour (wages) falls, and vice versa.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T74
    editions: 1849 (NRZ)
    reading: Tauschwert
    base_text: … Der Anteil ‸ des Kapitals, der Profit, …
  - ref: T74
    editions: 1849 (NRZ)
    reading: Tauschwert
    base_text: … Verhältnis, worin der Anteil ‸ der Arbeit, der Taglohn, …
  mew_page: '414'
- id: IV.16.3
  kind: p
  original: Der Profit steigt in dem Maße, worin der Arbeitslohn fällt, er fällt in dem Maße, worin der Arbeitslohn steigt.
  en: Profit rises in the same degree in which wages fall; it falls in the same degree in which wages rise.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '414'
- id: IV.17.1
  kind: p
  original: Man wird vielleicht einwenden, daß der Kapitalist gewinnen kann durch vorteilhaften Austausch seiner Produkte mit andern Kapitalisten, durch Steigen der Nachfrage nach seiner Ware, sei es infolge der Eröffnung von neuen Märkten, sei es infolge augenblicklich vermehrter Bedürfnisse auf den alten Märkten usw.; daß der Profit des Kapitalisten sich also vermehren kann durch die Übervorteilung dritter Kapitalisten, unabhängig vom Steigen und Fallen des Arbeitslohns, des Tauschwerts der Arbeitskraft; oder der Profit des Kapitalisten könne auch steigen durch Verbesserung der Arbeitsinstrumente, neue Anwendung der Naturkräfte usw.
  en: It might perhaps be argued that the capitalist class can gain by an advantageous exchange of his products with other capitalists, by a rise in the demand for his commodities, whether in consequence of the opening up of new markets, or in consequence of temporarily increased demands in the old market, and so on; that the profit of the capitalist, therefore, may be multiplied by taking advantage of other capitalists, independently of the rise and fall of wages, of the exchange value of labour-power; or that the profit of the capitalist may also rise through improvements in the instruments of labour, new applications of the forces of nature, and so on.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T75
    editions: 1849 (NRZ)
    reading: Arbeit
    base_text: … des Tauschwerts der Arbeitskraft ‸ ; oder der Profit …
  mew_page: 414-415
- id: IV.18.1
  kind: p
  original: Zunächst wird man zugeben müssen, daß das Resultat dasselbe bleibt, obgleich es auf umgekehrtem Wege herbeigeführt ist.
  en: But in the first place it must be admitted that the result remains the same, although brought about in an opposite manner.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '415'
- id: IV.18.2
  kind: p
  original: Der Profit ist zwar nicht gestiegen, weil der Arbeitslohn gefallen ist, aber der Arbeitslohn ist gefallen, weil der Profit gestiegen ist.
  en: Profit, indeed, has not risen because wages have fallen, but wages have fallen because profit has risen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '415'
- id: IV.18.3
  kind: p
  original: Der Kapitalist hat mit derselben Summe von fremder Arbeit eine größre Summe von Tauschwerten erkauft, ohne deshalb die Arbeit höher bezahlt zu haben; d.h. also, die Arbeit wird niedriger bezahlt im Verhältnis zum Reinertrag, den sie dem Kapitalisten abwirft.
  en: With the same amount of another man's labour the capitalist has bought a larger amount of exchange values without having paid more for the labour on that account - i.e., the work is paid for less in proportion to the net gain which it yields to the capitalist.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T76
    editions: 1849 (NRZ)
    reading: 'fehlt: fremder'
    base_text: … derselben Summe von fremder ‸ Arbeit eine größre Summe …
  mew_page: '415'
- id: IV.19.1
  kind: p
  original: Zudem erinnern wir, daß trotz der Schwankungen der Warenpreise der Durchschnittspreis jeder Ware, das Verhältnis, worin sie sich gegen andre Waren austauscht, durch ihre Produktionskosten bestimmt ist.
  en: In the second place, it must be borne in mind that, despite the fluctuations in the prices of commodities, the average price of every commodity, the proportion in which it exchanges for other commodities, is determined by its cost of production.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '415'
- id: IV.19.2
  kind: p
  original: Die Übervorteilungen innerhalb der Kapitalistenklasse gleichen sich daher notwendig aus.
  en: The acts of overreaching and taking advantage of one another within the capitalist ranks necessarily equalize themselves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '415'
- id: IV.19.3
  kind: p
  original: Die Verbesserung der Maschinerie, die neue Anwendung von Naturkräften im Dienst der Produktion befähigen in einer gegebnen Arbeitszeit, mit derselben Summe von Arbeit und Kapital eine größre Masse von Produkten, keineswegs aber eine größre Masse von Tauschwerten zu schaffen.
  en: The improvements of machinery, the new applications of the forces of nature in the service of production, make it possible to produce in a given period of time, with the same amount of labour and capital, a larger amount of products, but in no wise a larger amount of exchange values.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '415'
- id: IV.19.4
  kind: p
  original: Wenn ich durch die Anwendung der Spinnmaschine noch einmal soviel Gespinst in einer Stunde liefern kann wie vor ihrer Erfindung, z.B. hundert Pfund statt fünfzig, so erhalte ich für diese hundert Pfund auf die Dauer nicht mehr Waren im Austausch zurück als früher für fünfzig, weil die Produktionskosten um die Hälfte gefallen sind oder weil ich mit denselben Kosten das doppelte Produkt liefern kann.
  en: If by the use of the spinning-machine I can furnish twice as much yarn in an hour as before its invention - for instance, 100 pounds instead of 50 pounds - in the long run I receive back, in exchange for this 100 pounds no more commodities than I did before for 50; because the cost of production has fallen by 1/2, or because I can furnish double the product at the same cost.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T77
    editions: 1849 (NRZ)
    reading: 'fehlt: auf die Dauer'
    base_text: … Pfund auf die Dauer ‸ nicht mehr Waren im …
  mew_page: '415'
- id: IV.20.1
  kind: p
  original: Endlich, in welchem Verhältnis auch immer die Kapitalistenklasse, die Bourgeoisie, sei es eines Landes, sei es des ganzen Weltmarkts, den Reinertrag der Produktion unter sich verteile, die Gesamtsumme dieses Reinertrags ist jedesmal nur die Summe, um welche die aufgehäufte Arbeit im großen und ganzen durch die unmittelbare Arbeit vermehrt worden ist.
  en: Finally, in whatsoever proportion the capitalist class, whether of one country or of the entire world-market, distribute the net revenue of production among themselves, the total amount of this net revenue always consists exclusively of the amount by which accumulated labour has been increased from the proceeds of direct labour.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T78
    editions: 1849 (NRZ)
    reading: welchen Verhältnissen
    base_text: … Endlich, in welchem Verhältnis ‸ auch immer die Kapitalistenklasse, …
  - ref: T79
    editions: 1849 (NRZ)
    reading: unmittelbare
    base_text: … um welche die aufgehäufte ‸ Arbeit im großen und …
  - ref: T80
    editions: 1849 (NRZ)
    reading: aufgehäufte
    base_text: … ganzen durch die unmittelbare ‸ Arbeit vermehrt worden ist. …
  mew_page: '415'
- id: IV.20.2
  kind: p
  original: Diese Gesamtsumme wächst also in dem Verhältnis, worin die Arbeit das Kapital vermehrt, d.h. in dem Verhältnis, worin der Profit gegen den Arbeitslohn steigt.
  en: This whole amount, therefore, grows in the same proportion in which labour augments capital - i.e., in the same proportion in which profit rises as compared with wages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '415'
- id: IV.21.1
  kind: p
  original: Wir sehen also, daß selbst, wenn wir innerhalb des Verhältnisses von Kapital und Lohnarbeit stehnbleiben, die Interessen des Kapitals und die Interessen der Lohnarbeit sich schnurstracks gegenüberstehn.
  en: We thus see that, even if we keep ourselves within the relation of capital and wage-labour, the interests of capitals and the interests of wage-labour are diametrically opposed to each other.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '415'
  en_note: 'Lothrop 1902, chapter 8: The Interests of Capital and Wage-Labour are diametrically opposed Effect of growth of productive Capital on Wages'
- id: IV.22.1
  kind: p
  original: Eine rasche Zunahme des Kapitals ist gleich einer raschen Zunahme des Profits.
  en: A rapid growth of capital is synonymous with a rapid growth of profits.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '416'
- id: IV.22.2
  kind: p
  original: Der Profit kann nur rasch zunehmen, wenn der Preis der Arbeit, wenn der relative Arbeitslohn ebenso rasch abnimmt.
  en: Profits can grow rapidly only when the price of labour - the relative wages - decrease just as rapidly.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T81
    editions: 1849 (NRZ)
    reading: Tauschwert
    base_text: … zunehmen, wenn der Preis ‸ der Arbeit, wenn der …
  mew_page: '416'
- id: IV.22.3
  kind: p
  original: Der relative Arbeitslohn kann fallen, obgleich der reelle Arbeitslohn gleichzeitig mit dem nominellen Arbeitslohn, mit dem Geldwert der Arbeit steigt, aber nur nicht in demselben Verhältnis steigt wie der Profit.
  en: Relative wages may fall, although real wages rise simultaneously with nominal wages, with the money value of labour, provided only that the real wage does not rise in the same proportion as the profit.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '416'
- id: IV.22.4
  kind: p
  original: Steigt z.B. in guten Geschäftszeiten der Arbeitslohn um 5 Prozent, der Profit dagegen um 30 Prozent, so hat der verhältnismäßige, der relative Arbeitslohn nicht zugenommen, sondern abgenommen.
  en: If, for instance, in good business years wages rise 5 per cent, while profits rise 30 per cent, the proportional, the relative wage has not increased, but decreased.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '416'
- id: IV.23.1
  kind: p
  original: Vermehrt sich also die Einnahme des Arbeiters mit dem raschen Wachstum des Kapitals, so vermehrt sich gleichzeitig die gesellschaftliche Kluft, die den Arbeiter vom Kapitalisten scheidet, so vermehrt sich gleichzeitig die Macht des Kapitals über die Arbeit, die Abhängigkeit der Arbeit vom Kapital.
  en: If, therefore, the income of the worker increased with the rapid growth of capital, there is at the same time a widening of the social chasm that divides the worker from the capitalist, and increase in the power of capital over labour, a greater dependence of labour upon capital.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '416'
- id: IV.24.1
  kind: p
  original: 'Der Arbeiter hat ein Interesse am raschen Wachstum des Kapitals, heißt nur: Je rascher der Arbeiter den fremden Reichtum vermehrt, desto fettere Brocken fallen für ihn ab, um desto mehr Arbeiter können beschäftigt und ins Leben gerufen, desto mehr kann die Masse der vom Kapital abhängigen Sklaven vermehrt werden.'
  en: 'To say that "the worker has an interest in the rapid growth of capital", means only this: that the more speedily the worker augments the wealth of the capitalist, the larger will be the crumbs which fall to him, the greater will be the number of workers than can be called into existence, the more can the mass of slaves dependent upon capital be increased.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '416'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: IV.25.1
  kind: p
  original: 'Wir haben also gesehen:'
