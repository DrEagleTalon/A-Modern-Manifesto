- id: IV.26.1
  kind: p
  original: Selbst die günstigste Situation für die Arbeiterklasse, möglichst rasches Wachstum des Kapitals, sosehr sie das materielle Leben des Arbeiters verbessern mag, hebt den Gegensatz zwischen seinen Interessen und den Bourgeoisinteressen, den Interessen des Kapitalisten, nicht auf.
  en: We have thus seen that even the most favorable situation for the working class, namely, the most rapid growth of capital, however much it may improve the material life of the worker, does not abolish the antagonism between his interests and the interests of the capitalist.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T82
    editions: 1849 (NRZ)
    reading: Wachsen
    base_text: … Arbeiterklasse, möglichst rasches Wachstum ‸ des Kapitals, sosehr sie …
  mew_page: '416'
- id: IV.26.2
  kind: p
  original: Profit und Arbeitslohn stehen nach wie vor im umgekehrten Verhältnis.
  en: Profit and wages remain as before, in inverse proportion.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T83
    editions: 1849 (NRZ)
    reading: in umgekehrten
    base_text: … wie vor im umgekehrten ‸ Verhältnis. …
  mew_page: '416'
- id: IV.27.1
  kind: p
  original: Ist das Kapital rasch anwachsend, so mag der Arbeitslohn steigen; unverhältnismäßig schneller steigt der Profit des Kapitals.
  en: If capital grows rapidly, wages may rise, but the profit of capital rises disproportionately faster.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '416'
- id: IV.27.2
  kind: p
  original: Die materielle Lage des Arbeiters hat sich verbessert, aber auf Kosten seiner gesellschaftlichen Lage.
  en: The material position of the worker has improved, but at the cost of his social position.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '416'
- id: IV.27.3
  kind: p
  original: Die gesellschaftliche Kluft, welche ihn vom Kapitalisten trennt, hat sich erweitert.
  en: The social chasm that separates him from the capitalist has widened.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '416'
- id: IV.28.1
  kind: p
  original: 'Endlich:'
  en: 'Finally, to say that "the most favorable condition for wage-labour is the fastest possible growth of productive capital", is the same as to say: the quicker the working class multiplies and augments the power inimical to it - the wealth of another which lords over that class - the more favorable will be the conditions under which it will be permitted to toil anew at the multiplication of bourgeois wealth, at the enlargement of the power of capital, content thus to forge for itself the golden chains by which the bourgeoisie drags it in its train.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '416'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: IV.29.1
  kind: p
  original: 'Günstigste Bedingung für die Lohnarbeit ist möglichst rasches Wachsturn des produktiven Kapitals, heißt nur: Je rascher die Arbeiterklasse die ihr feindliche Macht, den fremden, über sie gebietenden Reichtum vermehrt und vergrößert, unter desto günstigern Bedingungen wird ihr erlaubt, von neuem an der Vermehrung des bürgerlichen Reichtums, an der Vergrößerung der Macht des Kapitals zu arbeiten, zufrieden, sich selbst die goldnen Ketten zu schmieden, woran die Bourgeoisie sie hinter sich herschleift.'
  en: ''
  joined_to: IV.28.1
  modern: ''
  modern_status: joined
