- id: I.1.1
  kind: p
  original: Von verschiednen Seiten warf man uns vor, daß wir nicht die ökonomischen Verhältnisse dargestellt haben, welche die materielle Grundlage der jetzigen Klassenkämpfe und Nationalkämpfe bilden.
  en: From various quarters we have been reproached for neglecting to portray the economic conditions which form the material basis of the present struggles between classes and nations.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T1
    editions: 1849 (NRZ)
    reading: 'vorangestellt: * Köln, 4. April'
    base_text: ‸ Von verschiednen Seiten warf …
  mew_page: '397'
  en_note: 'Lothrop 1902, chapter 1: Preliminary'
- id: I.1.2
  kind: p
  original: Wir haben planmäßig diese Verhältnisse nur da berührt, wo sie sich in politischen Kollisionen unmittelbar aufdrängen.
  en: With set purpose we have hitherto touched upon these conditions only when they forced themselves upon the surface of the political conflicts.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T2
    editions: 1849 (NRZ)
    reading: aufdrangen
    base_text: … politischen Kollisionen unmittelbar aufdrängen ‸ . …
  mew_page: '397'
- id: I.2.1
  kind: p
  original: Es galt vor allem den Klassenkampf in der Tagesgeschichte zu verfolgen und an dem vorhandnen und täglich neu geschaffnen geschichtlichen Stoff empirisch nachzuweisen, daß mit der Unterjochung der Arbeiterklasse, welche Februar und März gemacht hatte, gleichzeitig ihre Gegner besiegt wurden - die Bourgeoisrepublikaner in Frankreich, die den feudalen Absolutismus bekämpfenden Bürger- und Bauernklassen auf dem gesamten europäischen Kontinent; daß der Sieg der "honetten Republik" in Frankreich gleichzeitig der Fall der Nationen war, die auf die Februarrevolution mit heroischen Unabhängigkeitskriegen geantwortet hatten; daß endlich Europa mit der Besiegung der revolutionären Arbeiter in seine alte Doppelsklaverei zurückfiel, in die englisch-russische Sklaverei.
  en: It was necessary, beyond everything else, to follow the development of the class struggle in the history of our own day, and to prove empirically, by the actual and daily newly created historical material, that with the subjugation of the working class, accomplished in the days of February and March, 1848, the opponents of that class - the bourgeois republicans in France, and the bourgeois and peasant classes who were fighting feudal absolutism throughout the whole continent of Europe - were simultaneously conquered; that the victory of the "moderate republic" in France sounded at the same time the fall of the nations which had responded to the February revolution with heroic wars of independence; and finally that, by the victory over the revolutionary workingmen, Europe fell back into its old double slavery, into the English-Russian slavery.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: I.2.2
  kind: p
  original: Der Junikampf zu Paris, der Fall Wiens, die Tragikomödie des Berliner November 1848, die verzweifelten Anstrengungen Polens, Italiens und Ungarns, Irlands Aushungerung - das waren die Hauptmomente, in denen sich der europäische Klassenkampf zwischen Bourgeoisie und Arbeiterklasse zusammenfaßte, an denen wir nachwiesen, daß jede revolutionäre Erhebung, mag ihr Ziel noch so fernliegend dem Klassenkampf scheinen, scheitern muß, bis die revolutionäre Arbeiterklasse siegt, daß jede soziale Reform eine Utopie bleibt, bis die proletarische Revolution und die feudalistische Kontrerevolution sich in einem Weltkrieg mit den Waffen messen.
  en: The June conflict in Paris, the fall of Vienna, the tragi-comedy in Berlin in November 1848, the desperate efforts of Poland, Italy, and Hungary, the starvation of Ireland into submission - these were the chief events in which the European class struggle between the bourgeoisie and the working class was summed up, and from which we proved that every revolutionary uprising, however remote from the class struggle its object might appear, must of necessity fail until the revolutionary working class shall have conquered; - that every social reform must remain a Utopia until the proletarian revolution and the feudalistic counter-revolution have been pitted against each other in a world-wide war.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T3
    editions: 1849 (NRZ)
    reading: 'fehlt: 1848'
    base_text: … des Berliner November 1848 ‸ , die verzweifelten Anstrengungen …
  mew_page: 397-398
- id: I.2.3
  kind: p
  original: In unsrer Darstellung, wie in der Wirklichkeit, waren Belgien und die Schweiz tragikomische karikaturmäßige Genrebilder in dem großen historischen Tableau, das eine der Musterstaat der bürgerlichen Monarchie, das andre der Musterstaat der bürgerlichen Republik, beides Staaten, die sich einbilden, ebenso unabhängig von dem Klassenkampf zu sein wie von der europäischen Revolution.
  en: In our presentation, as in reality, Belgium and Switzerland were tragicomic caricaturish genre pictures in the great historic tableau; the one the model State of the bourgeois monarchy, the other the model State of the bourgeois republic; both of them, States that flatter themselves to be just as free from the class struggle as from the European revolution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: I.3.1
  kind: p
  original: Jetzt, nachdem unsre Leser den Klassenkampf im Jahre 1848 in kolossalen politischen Formen sich entwickeln sahen, ist es an der Zeit, näher einzugehn auf die ökonomischen Verhältnisse selbst, worauf die Existenz der Bourgeoisie und ihre Klassenherrschaft ebenso sich gründet wie die Sklaverei der Arbeiter.
  en: But now, after our readers have seen the class struggle of the year 1848 develop into colossal political proportions, it is time to examine more closely the economic conditions themselves upon which is founded the existence of the capitalist class and its class rule, as well as the slavery of the workers.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T4
    editions: 1849 (NRZ)
    reading: 'fehlt: ebenso'
    base_text: … und ihre Klassenherrschaft ebenso ‸ sich gründet wie die …
  mew_page: '398'
- id: I.4.1
  kind: p
  original: 'Wir werden in drei großen Abteilungen darstellen: 1. das Verhältnis der Lohnarbeit zum Kapital, die Sklaverei des Arbeiters, die Herrschaft des Kapitalisten, 2. den unvermeidlichen Untergang der mittleren Bürgerklassen und des sogenannten Bürgerstandes unter dem jetzigen System, 3. die kommerzielle Unterjochung und Ausbeutung der Bourgeoisklassen der verschiednen europäischen Nationen durch den Despoten des Weltmarkts - England.'
  en: 'We shall present the subject in three great divisions: The Relation of Wage-labour to Capital, the Slavery of the Worker, the Rule of the Capitalist. The Inevitable Ruin of the Middle Classes and the so-called Commons under the present system. The Commercial Subjugation and Exploitation of the Bourgeois classes of the various European nations by the Despot of the World Market - England.'
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T5
    editions: 1849 (NRZ)
    reading: und des Bauernstandes
    base_text: … und des sogenannten Bürgerstandes ‸ unter dem jetzigen System, …
  mew_page: '398'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: I.5.1
  kind: p
  original: Wir werden möglichst einfach und populär darzustellen suchen und selbst die elementarischsten Begriffe der politischen Ökonomie nicht voraussetzen.
  en: We shall seek to portray this as simply and popularly as possible, and shall not presuppose a knowledge of even the most elementary notions of political economy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: I.5.2
  kind: p
  original: Wir wollen den Arbeitern verständlich sein.
  en: We wish to be understood by the workers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: I.5.3
  kind: p
  original: Und zudem herrscht in Deutschland die merkwürdigste Unwissenheit und Begriffsverwirrung über die einfachsten ökonomischen Verhältnisse, von den patentierten Verteidigern der bestehenden Zustände bis hinab zu den sozialistischen Wunderschäfern und den verkannten politischen Genies, an denen das zersplitterte Deutschland noch reicher ist als an Landesvätern.
  en: And, moreover, there prevails in Germany the most remarkable ignorance and confusion of ideas in regard to the simplest economic relations, from the patented defenders of existing conditions, down to the socialist wonder-workers and the unrecognized political geniuses, in which divided Germany is even richer than in duodecimo princelings.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: I.6.1
  kind: p
  original: 'Zunächst also zur ersten Frage:'
  en: We therefore proceed to the consideration of the first problem.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: I.7.1
  kind: heading
  original: Was ist der Arbeitslohn? Wie wird er bestimmt?
  en: What are Wages? How are they Determined?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: I.8.1
  kind: p
  original: 'Wenn man Arbeiter fragte: Wie hoch ist Ihr Arbeitslohn? so würden sie antworten, dieser: "Ich erhalte 1 Mark für den Arbeitstag von meinem Bourgeois", jener: "Ich erhalte 2 Mark" usw. Nach den verschiednen Arbeitszweigen, denen sie angehören, würden sie verschiedne Geldsummen angeben, die sie für die Herstellung einer bestimmten Arbeit, z.B. für das Weben einer Eile Leinwand oder für das Setzen eines Druckbogens, von ihrem jedesmaligen Bourgeois erhalten.'
  en: 'If several workmen were to be asked: "How much wages do you get?", one would reply, "I get two shillings a day", and so on. According to the different branches of industry in which they are employed, they would mention different sums of money that they receive from their respective employers for the completion of a certain task; for example, for weaving a yard of linen, or for setting a page of type.'
  modern: ''
  modern_status: empty
  notes: ''
  variants:
