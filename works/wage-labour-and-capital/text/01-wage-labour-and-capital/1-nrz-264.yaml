    editions: 1849 (NRZ)
    reading: 'hier und im folgenden: Franc'
    base_text: … "Ich erhalte 1 Mark ‸ für den Arbeitstag von …
  - ref: T7
    editions: 1849 (NRZ)
    reading: 'eingefügt: eine bestimmte Arbeitszeit oder für'
    base_text: … angeben, die sie für ‸ die Herstellung einer bestimmten …
  mew_page: '398'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: I.8.2
  kind: p
  original: 'Trotz der Verschiedenheit ihrer Angaben werden sie alle in dem Punkte übereinstimmen: Der Arbeitslohn ist die Summe Geldes, die der Kapitalist für eine bestimmte Arbeitszeit oder für eine bestimmte Arbeitslieferung zahlt.'
  en: 'Despite the variety of their statements, they would all agree upon one point: that wages are the amount of money which the capitalist pays for a certain period of work or for a certain amount of work.'
  modern: ''
  modern_status: empty
  notes: ''
