    base_text: … zusammenenzieht, immer weniger neue ‸ Märkte zur Exploitation übrigbleiben, …
  mew_page: '423'
- id: V.33.3
  kind: p
  original: Das Kapital lebt aber nicht nur von der Arbeit.
  en: But capital not only lives upon labour.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '423'
- id: V.33.4
  kind: p
  original: Ein zugleich vornehmer und barbarischer Herr, zieht es mit sich in die Gruft die Leichen seiner Sklaven, ganze Arbeiterhekatomben, die in den Krisen untergehn.
  en: Like a master, at once distinguished and barbarous, it drags with it into its grave the corpses of its slaves, whole hecatombs of workers, who perish in the crises.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '423'
- id: V.33.5
  kind: p
  original: 'Wir sehn also: Wächst das Kapital rasch, so wächst ungleich rascher die Konkurrenz unter den Arbeitern, d.h. desto mehr nehmen verhältnismäßig die Beschäftigungsmittel, die Lebensmittel für die Arbeiterklasse ab, und nichtsdestoweniger ist das rasche Wachsen des Kapitals die günstigste Bedingung für die Lohnarbeit.'
  en: We thus see that if capital grows rapidly, competition among the workers grows with even greater rapidity - i.e., the means of employment and subsistence for the working class decrease in proportion even more rapidly; but, this notwithstanding, the rapid growth of capital is the most favorable condition for wage-labour.
