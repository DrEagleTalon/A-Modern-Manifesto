  modern: ''
  modern_status: empty
  notes: ''
- id: III.N10.1.1
  kind: note
  original: It would be impossible to enter here into a discussion of the origin of the marriage restrictions.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.N10.1.2
  kind: note
  original: Let me only remark that a division into groups, similar to Morgan's Hawaian, exists among birds; the young broods live together separately from their parents.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.N10.1.3
  kind: note
  original: A like division might probably be traced among some mammals as well.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.N10.1.4
  kind: note
  original: As to the prohibition of relations between brothers and sisters, it is more likely to have arisen, not from speculations about the bad effects of consanguinity, which speculations really do not seem probable, but to avoid the too-easy precocity of like marriages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.N10.1.5
  kind: note
  original: Under close cohabitation it must have become of imperious necessity.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.N10.1.6
  kind: note
  original: I must also remark that in discussing the origin of new customs altogether, we must keep in mind that the savages, like us, have their "thinkers" and savants-wizards, doctors, prophets, etc.--whose knowledge and ideas are in advance upon those of the masses.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.N10.1.7
  kind: note
  original: United as they are in their secret unions (another almost universal feature) they are certainly capable of exercising a powerful influence, and of enforcing customs the utility of which may not yet be recognized by the majority of the tribe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
