  notes: ''
- id: VII.N35.1.3
  kind: note
  original: The above inquests have also given origin to an immense literature, in which the modern village-community question for the first time emerges from the domain of generalities and is put on the solid basis of reliable and sufficiently detailed facts.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N36.1.1
  kind: note
  original: The redemption had to be paid by annuities for forty-nine years.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N36.1.2
  kind: note
  original: As years went, and the greatest part of it was paid, it became easier and easier to redeem the smaller remaining part of it, and, as each allotment could be redeemed individually, advantage was taken of this disposition by traders, who bought land for half its value from the ruined peasants.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N36.1.3
  kind: note
  original: A law was consequently passed to put a stop to such sales.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N37.1.1
  kind: note
  original: Mr. V.V., in his Peasant Community, has grouped together all facts relative to this movement.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N37.1.2
  kind: note
  original: About the rapid agricultural development of South Russia and the spread of machinery English readers will find information in the Consular Reports (Odessa, Taganrog).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N38.1.1
  kind: note
  original: In some instances they proceeded with great caution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N38.1.2
  kind: note
  original: In one village they began by putting together all meadow land, but only a small portion of the fields (about five acres per soul) was rendered communal; the remainder continued to be owned individually.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N38.1.3
  kind: note
  original: Later on, in 1862-1864, the system was extended, but only in 1884 was communal possession introduced in full.--V.V.'s Peasant Community, pp. 1-14.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N39.1.1
  kind: note
  original: On the Mennonite village community see A. Klaus, Our Colonies (Nashi Kolonii), St. Petersburg, 1869.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N40.1.1
  kind: note
  original: Such communal cultures are known to exist in 159 villages out of 195 in the Ostrogozhsk district; in 150 out of 187 in Slavyanoserbsk; in 107 village communities in Alexandrovsk, 93 in Nikolayevsk, 35 in Elisabethgrad.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N40.1.2
  kind: note
  original: In a German colony the communal culture is made for repaying a communal debt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N40.1.3
  kind: note
  original: All join in the work, although the debt was contracted by 94 householders out of 155.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N41.1.1
  kind: note
  original: Lists of such works which came under the notice of the zemstvo statisticians will be found in V.V.'s Peasant Community, pp. 459-600.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N42.1.1
  kind: note
  original: In the government of Moscow the experiment was usually made on the field which was reserved for the above-mentioned communal culture.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N43.1.1
  kind: note
  original: Several instances of such and similar improvements were given in the Official Messenger, 1894, Nos. 256-258.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N43.1.2
  kind: note
  original: Associations between "horseless" peasants begin to appear also in South Russia.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N43.1.3
  kind: note
  original: Another extremely interesting fact is the sudden development in Southern West Siberia of very numerous co-operative creameries for making butter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N43.1.4
  kind: note
  original: Hundreds of them spread in Tobolsk and Tomsk, without any one knowing wherefrom the initiative of the movement came.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N43.1.5
  kind: note
  original: It came from the Danish co-operators, who used to export their own butter of higher quality, and to buy butter of a lower quality for their own use in Siberia.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N43.1.6
  kind: note
  original: After a several years' intercourse, they introduced creameries there.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.N43.1.7
  kind: note
  original: Now, a great export trade, carried on by a Union of the Creameries, has grown out of their endeavours and more than a thousand co-operative shops have been opened in the villages.
  en: ''
  modern: ''
  modern_status: empty
