- id: VII.N7.1.1
  kind: note
  original: After the triumph of the middle-class reaction the communal lands were declared (August 24, 1794) the States domains, and, together with the lands confiscated from the nobility, were put up for sale, and pilfered by the bandes noires of the small bourgeoisie.
