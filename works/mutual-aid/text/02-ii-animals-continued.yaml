  notes: ''
- id: II.N32.1.1
  kind: note
  original: One species of swallow is said to have caused the decrease of another swallow species in North America; the recent increase of the missel-thrush in Scotland has caused the decrease of the song-thrush; the brown rat has taken the place of the black rat in Europe; in Russia the small cockroach has everywhere driven before it its greater congener; and in Australia the imported hive-bee is rapidly exterminating the small stingless bee.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N32.1.2
  kind: note
  original: Two other cases, but relative to domesticated animals, are mentioned in the preceding paragraph.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N32.1.3
  kind: note
  original: 'While recalling these same facts, A.R. Wallace remarks in a footnote relative to the Scottish thrushes: "Prof. A. Newton, however, informs me that these species do not interfere in the way here stated" (Darwinism, p. 34).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N32.1.4
  kind: note
  original: As to the brown rat, it is known that, owing to its amphibian habits, it usually stays in the lower parts of human dwellings (low cellars, sewers, etc.), as also on the banks of canals and rivers; it also undertakes distant migrations in numberless bands.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N32.1.5
  kind: note
  original: The black rat, on the contrary, prefers staying in our dwellings themselves, under the floor, as well as in our stables and barns.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N32.1.6
  kind: note
  original: It thus is much more exposed to be exterminated by man; and we cannot maintain, with any approach to certainty, that the black rat is being either exterminated or starved out by the brown rat and not by man.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N33.1.1
  kind: note
  original: '"But it may be urged that when several closely-allied species inhabit the same territory, we surely ought to find at the present time many transitional forms....'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N33.1.2
  kind: note
  original: By my theory these allied species are descended from a common parent; and during the process of modification, each has become adapted to the conditions of life of its own region, and has supplanted and exterminated its original parent-form and all the transitional varieties between its past and present states" (Origin of Species, 6th ed. p. 134); also p. 137, 296 (all paragraph "On Extinction").
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N34.1.1
  kind: note
  original: According to Madame Marie Pavloff, who has made a special study of this subject, they migrated from Asia to Africa, stayed there some time, and returned next to Asia.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N34.1.2
  kind: note
  original: Whether this double migration be confirmed or not, the fact of a former extension of the ancestor of our horse over Asia, Africa, and America is settled beyond doubt.
  en: ''
  modern: ''
  modern_status: empty
