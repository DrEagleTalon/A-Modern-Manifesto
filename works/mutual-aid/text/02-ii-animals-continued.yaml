- id: II.N4.1.2
  kind: note
  original: Among the gulls (Larus argentatus), Polyakoff saw on a marsh in Northern Russia, that the nesting grounds of a very great number of these birds were always patrolled by one male, which warned the colony of the approach of danger.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N4.1.3
  kind: note
  original: All birds rose in such case and attacked the enemy with great vigour.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N4.1.4
  kind: note
  original: The females, which had five or six nests together on each knoll of the marsh, kept a certain order in leaving their nests in search of food.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N4.1.5
  kind: note
  original: The fledglings, which otherwise are extremely unprotected and easily become the prey of the rapacious birds, were never left alone ("Family Habits among the Aquatic Birds," in Proceedings of the Zool. Section of St. Petersburg Soc. of Nat., Dec. 17, 1874).
  en: ''
