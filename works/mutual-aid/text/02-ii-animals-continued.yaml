  notes: ''
- id: II.N18.1.1
  kind: note
  original: In connection with the horses it is worthy of notice that the quagga zebra, which never comes together with the dauw zebra, nevertheless lives on excellent terms, not only with ostriches, which are very good sentries, but also with gazelles, several species of antelopes, and gnus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N18.1.2
  kind: note
  original: We thus have a case of mutual dislike between the quagga and the dauw which cannot be explained by competition for food.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N18.1.3
  kind: note
  original: The fact that the quagga lives together with ruminants feeding on the same grass as itself excludes that hypothesis, and we must look for some incompatibility of character, as in the case of the hare and the rabbit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N18.1.4
  kind: note
  original: Cf., among others, Clive Phillips-Wolley's Big Game Shooting (Badminton Library), which contains excellent illustrations of various species living together in East Africa.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N19.1.1
  kind: note
  original: Our Tungus hunter, who was going to marry, and therefore was prompted by the desire of getting as many furs as he possibly could, was beating the hill-sides all day long on horseback in search of deer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N19.1.2
  kind: note
  original: His efforts were not rewarded by even so much as one fallow deer killed every day; and he was an excellent hunter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N20.1.1
  kind: note
  original: According to Samuel W. Baker, elephants combine in larger groups than the "compound family."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N20.1.2
  kind: note
  original: '"I have frequently observed," he wrote, "in the portion of Ceylon known as the Park Country, the tracks of elephants in great numbers which have evidently been considerable herds that have joined together in a general retreat from a ground which they considered insecure" (Wild Beasts and their Ways, vol. i. p. 102).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
