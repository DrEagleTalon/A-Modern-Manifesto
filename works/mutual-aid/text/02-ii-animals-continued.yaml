  notes: ''
- id: II.N24.1.1
  kind: note
  original: 'The more strange was it to read in the previously-mentioned article by Huxley the following paraphrase of a well-known sentence of Rousseau: "The first men who substituted mutual peace for that of mutual war--whatever the motive which impelled them to take that step--created society" (Nineteenth Century, Feb. 1888, p. 165).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N24.1.2
  kind: note
  original: Society has not been created by man; it is anterior to man.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N25.1.1
  kind: note
  original: Such monographs as the chapter on "Music and Dancing in Nature" which we have in Hudson's Naturalist on the La Plata, and Carl Gross' Play of Animals, have already thrown a considerable light upon an instinct which is absolutely universal in Nature.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N26.1.1
  kind: note
  original: Not only numerous species of birds possess the habit of assembling together--in many cases always at the same spot--to indulge in antics and dancing performances, but W.H. Hudson's experience is that nearly all mammals and birds ("probably there are really no exceptions") indulge frequently in more or less regular or set performances with or without sound, or composed of sound exclusively (p. 264).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N27.1.1
  kind: note
  original: For the choruses of monkeys, see Brehm.
