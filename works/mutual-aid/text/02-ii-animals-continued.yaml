- id: II.N7.1.1
  kind: note
  original: It has often been intimated that larger birds may occasionally transport some of the smaller birds when they cross together the Mediterranean, but the fact still remains doubtful.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N7.1.2
  kind: note
  original: On the other side, it is certain that some smaller birds join the bigger ones for migration.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N7.1.3
  kind: note
  original: The fact has been noticed several times, and it was recently confirmed by L. Buxbaum at Raunheim.
  en: ''
