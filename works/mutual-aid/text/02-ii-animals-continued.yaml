  notes: ''
- id: II.N29.1.1
  kind: note
  original: To quote but a few instances, a wounded badger was carried away by another badger suddenly appearing on the scene; rats have been seen feeding a blind couple (Seelenleben der Thiere, p. 64 seq.).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N29.1.2
  kind: note
  original: Brehm himself saw two crows feeding in a hollow tree a third crow which was wounded; its wound was several weeks old (Hausfreund, 1874, 715; Buchner's Liebe, 203).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N29.1.3
  kind: note
