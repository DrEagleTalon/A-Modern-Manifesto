- id: II.N15.1.1
  kind: note
  original: With regard to the viscacha it is very interesting to note that these highly-sociable little animals not only live peaceably together in each village, but that whole villages visit each other at nights.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N15.1.2
  kind: note
  original: Sociability is thus extended to the whole species--not only to a given society, or to a nation, as we saw it with the ants.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N15.1.3
  kind: note
  original: When the farmer destroys a viscacha-burrow, and buries the inhabitants under a heap of earth, other viscachas--we are told by Hudson--"come from a distance to dig out those that are buried alive" (l.c., p. 311).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N15.1.4
