  kind: note
  original: '"One of the most frequent modes in which Natural Selection acts is, by adapting some individuals of a species to a somewhat different mode of life, whereby they are able to seize unappropriated places in Nature" (Origin of Species, p. 145)--in other words, to avoid competition.'
