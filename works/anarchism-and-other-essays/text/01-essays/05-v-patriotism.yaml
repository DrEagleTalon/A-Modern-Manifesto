# Master file. Edit the `modern` and `notes` fields; see CONTRIBUTING.md.
# Verse ids are frozen. Never renumber; see VERSIFICATION.md.
section: V
title_original: 'Patriotism: A Menace to Liberty'
title_en: 'Patriotism: A Menace to Liberty'
author: Emma Goldman
date: '1910'
original_language: en
anchor_language: en
source_original: 'Emma Goldman, Anarchism and Other Essays, with a biographic sketch by Hippolyte Havel (New York: Mother Earth Publishing Association, 1910), public domain; Project Gutenberg ebook 2162'
source_en: 'None needed: the original is in English'
verses:
- id: V.0.1
  kind: heading
  original: 'Patriotism: A Menace to Liberty'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.1.1
  kind: p
  original: What is patriotism?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.1.2
  kind: p
  original: Is it love of one's birthplace, the place of childhood's recollections and hopes, dreams and aspirations?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.1.3
  kind: p
  original: Is it the place where, in childlike naivety, we would watch the fleeting clouds, and wonder why we, too, could not run so swiftly?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.1.4
  kind: p
  original: The place where we would count the milliard glittering stars, terror-stricken lest each one "an eye should be," piercing the very depths of our little souls?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.1.5
  kind: p
  original: Is it the place where we would listen to the music of the birds, and long to have wings to fly, even as they, to distant lands?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.1.6
  kind: p
  original: Or the place where we would sit at mother's knee, enraptured by wonderful tales of great deeds and conquests?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.1.7
  kind: p
  original: In short, is it love for the spot, every inch representing dear and precious recollections of a happy, joyous, and playful childhood?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.2.1
  kind: p
  original: If that were patriotism, few American men of today could be called upon to be patriotic, since the place of play has been turned into factory, mill, and mine, while deafening sounds of machinery have replaced the music of the birds.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.2.2
  kind: p
  original: Nor can we longer hear the tales of great deeds, for the stories our mothers tell today are but those of sorrow, tears, and grief.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.1
  kind: p
  original: What, then, is patriotism?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.2
  kind: p
  original: '"Patriotism, sir, is the last resort of scoundrels," said Dr. Johnson.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.3
  kind: p
  original: Leo Tolstoy, the greatest anti-patriot of our times, defines patriotism as the principle that will justify the training of wholesale murderers; a trade that requires better equipment for the exercise of man-killing than the making of such necessities of life as shoes, clothing, and houses; a trade that guarantees better returns and greater glory than that of the average workingman.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.4.1
  kind: p
  original: Gustave Herve, another great anti-patriot, justly calls patriotism a superstition--one far more injurious, brutal, and inhumane than religion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.4.2
  kind: p
  original: The superstition of religion originated in man's inability to explain natural phenomena.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.4.3
  kind: p
  original: That is, when primitive man heard thunder or saw the lightning, he could not account for either, and therefore concluded that back of them must be a force greater than himself.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.4.4
  kind: p
  original: Similarly he saw a supernatural force in the rain, and in the various other changes in nature.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.4.5
  kind: p
  original: Patriotism, on the other hand, is a superstition artificially created and maintained through a network of lies and falsehoods; a superstition that robs man of his self-respect and dignity, and increases his arrogance and conceit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.5.1
  kind: p
  original: Indeed, conceit, arrogance, and egotism are the essentials of patriotism.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.5.2
  kind: p
  original: Let me illustrate.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.5.3
  kind: p
  original: Patriotism assumes that our globe is divided into little spots, each one surrounded by an iron gate.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.5.4
  kind: p
  original: Those who have had the fortune of being born on some particular spot, consider themselves better, nobler, grander, more intelligent than the living beings inhabiting any other spot.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.5.5
  kind: p
  original: It is, therefore, the duty of everyone living on that chosen spot to fight, kill, and die in the attempt to impose his superiority upon all the others.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.6.1
  kind: p
  original: The inhabitants of the other spots reason in like manner, of course, with the result that, from early infancy, the mind of the child is poisoned with blood-curdling stories about the Germans, the French, the Italians, Russians, etc.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.6.2
  kind: p
  original: When the child has reached manhood, he is thoroughly saturated with the belief that he is chosen by the Lord himself to defend HIS country against the attack or invasion of any foreigner.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.6.3
  kind: p
  original: It is for that purpose that we are clamoring for a greater army and navy, more battleships and ammunition.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.6.4
  kind: p
  original: It is for that purpose that America has within a short time spent four hundred million dollars.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.6.5
  kind: p
  original: Just think of it--four hundred million dollars taken from the produce of the PEOPLE.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.6.6
  kind: p
  original: For surely it is not the rich who contribute to patriotism.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.6.7
  kind: p
  original: They are cosmopolitans, perfectly at home in every land.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.6.8
  kind: p
  original: We in America know well the truth of this.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.6.9
  kind: p
  original: Are not our rich Americans Frenchmen in France, Germans in Germany, or Englishmen in England?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.6.10
  kind: p
  original: And do they not squander with cosmopolitan grace fortunes coined by American factory children and cotton slaves?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.6.11
  kind: p
  original: Yes, theirs is the patriotism that will make it possible to send messages of condolence to a despot like the Russian Tsar, when any mishap befalls him, as President Roosevelt did in the name of HIS people, when Sergius was punished by the Russian revolutionists.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.7.1
  kind: p
  original: It is a patriotism that will assist the arch-murderer, Diaz, in destroying thousands of lives in Mexico, or that will even aid in arresting Mexican revolutionists on American soil and keep them incarcerated in American prisons, without the slightest cause or reason.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.8.1
  kind: p
  original: But, then, patriotism is not for those who represent wealth and power.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.8.2
  kind: p
  original: It is good enough for the people.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.8.3
  kind: p
  original: 'It reminds one of the historic wisdom of Frederic the Great, the bosom friend of Voltaire, who said: "Religion is a fraud, but it must be maintained for the masses."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.9.1
  kind: p
  original: That patriotism is rather a costly institution, no one will doubt after considering the following statistics.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.9.2
  kind: p
  original: The progressive increase of the expenditures for the leading armies and navies of the world during the last quarter of a century is a fact of such gravity as to startle every thoughtful student of economic problems.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.9.3
  kind: p
  original: It may be briefly indicated by dividing the time from 1881 to 1905 into five-year periods, and noting the disbursements of several great nations for army and navy purposes during the first and last of those periods.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.9.4
  kind: p
  original: From the first to the last of the periods noted the expenditures of Great Britain increased from $2,101,848,936 to $4,143,226,885, those of France from $3,324,500,000 to $3,455,109,900, those of Germany from $725,000,200 to $2,700,375,600, those of the United States from $1,275,500,750 to $2,650,900,450, those of Russia from $1,900,975,500 to $5,250,445,100, those of Italy from $1,600,975,750 to $1,755,500,100, and those of Japan from $182,900,500 to $700,925,475.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.10.1
  kind: p
  original: The military expenditures of each of the nations mentioned increased in each of the five-year periods under review.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.10.2
  kind: p
  original: During the entire interval from 1881 to 1905 Great Britain's outlay for her army increased fourfold, that of the United States was tripled, Russia's was doubled, that of Germany increased 35 per cent., that of France about 15 per cent., and that of Japan nearly 500 per cent.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.10.3
  kind: p
  original: 'If we compare the expenditures of these nations upon their armies with their total expenditures for all the twenty-five years ending with 1905, the proportion rose as follows:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.11.1
  kind: p
  original: In Great Britain from 20 per cent. to 37; in the United States from 15 to 23; in France from 16 to 18; in Italy from 12 to 15; in Japan from 12 to 14.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.11.2
  kind: p
  original: On the other hand, it is interesting to note that the proportion in Germany decreased from about 58 per cent. to 25, the decrease being due to the enormous increase in the imperial expenditures for other purposes, the fact being that the army expenditures for the period of 1901-5 were higher than for any five-year period preceding.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.11.3
  kind: p
  original: Statistics show that the countries in which army expenditures are greatest, in proportion to the total national revenues, are Great Britain, the United States, Japan, France, and Italy, in the order named.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.12.1
  kind: p
  original: The showing as to the cost of great navies is equally impressive.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.12.2
  kind: p
  original: 'During the twenty-five years ending with 1905 naval expenditures increased approximately as follows: Great Britain, 300 per cent.; France 60 per cent.; Germany 600 per cent.; the United States 525 per cent.; Russia 300 per cent.; Italy 250 per cent.; and Japan, 700 per cent.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.12.3
  kind: p
  original: With the exception of Great Britain, the United States spends more for naval purposes than any other nation, and this expenditure bears also a larger proportion to the entire national disbursements than that of any other power.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.12.4
  kind: p
  original: In the period 1881-5, the expenditure for the United States navy was $6.20 out of each $100 appropriated for all national purposes; the amount rose to $6.60 for the next five-year period, to $8.10 for the next, to $11.70 for the next, and to $16.40 for 1901-5.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.12.5
  kind: p
  original: It is morally certain that the outlay for the current period of five years will show a still further increase.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.13.1
  kind: p
  original: The rising cost of militarism may be still further illustrated by computing it as a per capita tax on population.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.13.2
  kind: p
  original: 'From the first to the last of the five-year periods taken as the basis for the comparisons here given, it has risen as follows: In Great Britain, from $18.47 to $52.50; in France, from $19.66 to $23.62; in Germany, from $10.17 to $15.51; in the United States, from $5.62 to $13.64; in Russia, from $6.14 to $8.37; in Italy, from $9.59 to $11.24, and in Japan from 86 cents to $3.11.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.14.1
  kind: p
  original: It is in connection with this rough estimate of cost per capita that the economic burden of militarism is most appreciable.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.14.2
  kind: p
  original: The irresistible conclusion from available data is that the increase of expenditure for army and navy purposes is rapidly surpassing the growth of population in each of the countries considered in the present calculation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.14.3
  kind: p
  original: In other words, a continuation of the increased demands of militarism threatens each of those nations with a progressive exhaustion both of men and resources.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.15.1
  kind: p
  original: The awful waste that patriotism necessitates ought to be sufficient to cure the man of even average intelligence from this disease.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.15.2
  kind: p
  original: Yet patriotism demands still more.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.15.3
  kind: p
  original: The people are urged to be patriotic and for that luxury they pay, not only by supporting their "defenders," but even by sacrificing their own children.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.15.4
  kind: p
  original: Patriotism requires allegiance to the flag, which means obedience and readiness to kill father, mother, brother, sister.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.16.1
  kind: p
  original: The usual contention is that we need a standing army to protect the country from foreign invasion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.16.2
  kind: p
  original: Every intelligent man and woman knows, however, that this is a myth maintained to frighten and coerce the foolish.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.16.3
  kind: p
  original: The governments of the world, knowing each other's interests, do not invade each other.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.16.4
  kind: p
  original: They have learned that they can gain much more by international arbitration of disputes than by war and conquest.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.16.5
  kind: p
  original: Indeed, as Carlyle said, "War is a quarrel between two thieves too cowardly to fight their own battle; therefore they take boys from one village and another village; stick them into uniforms, equip them with guns, and let them loose like wild beasts against each other."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.17.1
  kind: p
  original: It does not require much wisdom to trace every war back to a similar cause.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.17.2
  kind: p
  original: Let us take our own Spanish-American war, supposedly a great and patriotic event in the history of the United States.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.17.3
  kind: p
  original: How our hearts burned with indignation against the atrocious Spaniards!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.17.4
  kind: p
  original: True, our indignation did not flare up spontaneously.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.17.5
  kind: p
  original: It was nurtured by months of newspaper agitation, and long after Butcher Weyler had killed off many noble Cubans and outraged many Cuban women.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.17.6
  kind: p
  original: Still, in justice to the American Nation be it said, it did grow indignant and was willing to fight, and that it fought bravely.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.17.7
  kind: p
  original: But when the smoke was over, the dead buried, and the cost of the war came back to the people in an increase in the price of commodities and rent--that is, when we sobered up from our patriotic spree--it suddenly dawned on us that the cause of the Spanish-American war was the consideration of the price of sugar; or, to be more explicit, that the lives, blood, and money of the American people were used to protect the interests of American capitalists, which were threatened by the Spanish government.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.17.8
  kind: p
  original: That this is not an exaggeration, but is based on absolute facts and figures, is best proven by the attitude of the American government to Cuban labor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.17.9
  kind: p
  original: When Cuba was firmly in the clutches of the United States, the very soldiers sent to liberate Cuba were ordered to shoot Cuban workingmen during the great cigarmakers' strike, which took place shortly after the war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.18.1
  kind: p
  original: Nor do we stand alone in waging war for such causes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.18.2
  kind: p
  original: The curtain is beginning to be lifted on the motives of the terrible Russo-Japanese war, which cost so much blood and tears.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.18.3
  kind: p
  original: And we see again that back of the fierce Moloch of war stands the still fiercer god of Commercialism.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.18.4
  kind: p
  original: Kuropatkin, the Russian Minister of War during the Russo-Japanese struggle, has revealed the true secret behind the latter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.18.5
  kind: p
  original: The Tsar and his Grand Dukes, having invested money in Corean concessions, the war was forced for the sole purpose of speedily accumulating large fortunes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.19.1
  kind: p
  original: The contention that a standing army and navy is the best security of peace is about as logical as the claim that the most peaceful citizen is he who goes about heavily armed.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.19.2
  kind: p
  original: The experience of every-day life fully proves that the armed individual is invariably anxious to try his strength.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.19.3
  kind: p
  original: The same is historically true of governments.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.19.4
  kind: p
  original: Really peaceful countries do not waste life and energy in war preparations, with the result that peace is maintained.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.20.1
  kind: p
  original: However, the clamor for an increased army and navy is not due to any foreign danger.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.20.2
  kind: p
  original: It is owing to the dread of the growing discontent of the masses and of the international spirit among the workers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.20.3
  kind: p
  original: It is to meet the internal enemy that the Powers of various countries are preparing themselves; an enemy, who, once awakened to consciousness, will prove more dangerous than any foreign invader.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.21.1
  kind: p
  original: The powers that have for centuries been engaged in enslaving the masses have made a thorough study of their psychology.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.21.2
  kind: p
  original: They know that the people at large are like children whose despair, sorrow, and tears can be turned into joy with a little toy.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.21.3
  kind: p
  original: And the more gorgeously the toy is dressed, the louder the colors, the more it will appeal to the million-headed child.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.22.1
  kind: p
  original: An army and navy represents the people's toys.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.22.2
  kind: p
  original: To make them more attractive and acceptable, hundreds and thousands of dollars are being spent for the display of these toys.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.22.3
  kind: p
  original: That was the purpose of the American government in equipping a fleet and sending it along the Pacific coast, that every American citizen should be made to feel the pride and glory of the United States.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.22.4
  kind: p
  original: The city of San Francisco spent one hundred thousand dollars for the entertainment of the fleet; Los Angeles, sixty thousand; Seattle and Tacoma, about one hundred thousand.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.22.5
  kind: p
  original: To entertain the fleet, did I say?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.22.6
  kind: p
  original: To dine and wine a few superior officers, while the "brave boys" had to mutiny to get sufficient food.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.22.7
  kind: p
  original: Yes, two hundred and sixty thousand dollars were spent on fireworks, theatre parties, and revelries, at a time when men, women, and children through the breadth and length of the country were starving in the streets; when thousands of unemployed were ready to sell their labor at any price.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.23.1
  kind: p
  original: Two hundred and sixty thousand dollars!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.23.2
  kind: p
  original: What could not have been accomplished with such an enormous sum?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.23.3
  kind: p
  original: But instead of bread and shelter, the children of those cities were taken to see the fleet, that it may remain, as one of the newspapers said, "a lasting memory for the child."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.24.1
  kind: p
  original: A wonderful thing to remember, is it not?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.24.2
  kind: p
  original: The implements of civilized slaughter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.24.3
  kind: p
  original: If the mind of the child is to be poisoned with such memories, what hope is there for a true realization of human brotherhood?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.25.1
  kind: p
  original: We Americans claim to be a peace-loving people.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.25.2
  kind: p
  original: We hate bloodshed; we are opposed to violence.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.25.3
  kind: p
  original: Yet we go into spasms of joy over the possibility of projecting dynamite bombs from flying machines upon helpless citizens.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.25.4
  kind: p
  original: We are ready to hang, electrocute, or lynch anyone, who, from economic necessity, will risk his own life in the attempt upon that of some industrial magnate.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.25.5
  kind: p
  original: Yet our hearts swell with pride at the thought that America is becoming the most powerful nation on earth, and that it will eventually plant her iron foot on the necks of all other nations.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.26.1
  kind: p
  original: Such is the logic of patriotism.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.27.1
  kind: p
  original: Considering the evil results that patriotism is fraught with for the average man, it is as nothing compared with the insult and injury that patriotism heaps upon the soldier himself,--that poor, deluded victim of superstition and ignorance.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.27.2
  kind: p
  original: He, the savior of his country, the protector of his nation,--what has patriotism in store for him?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.27.3
  kind: p
  original: A life of slavish submission, vice, and perversion, during peace; a life of danger, exposure, and death, during war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.28.1
  kind: p
  original: While on a recent lecture tour in San Francisco, I visited the Presidio, the most beautiful spot overlooking the Bay and Golden Gate Park.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.28.2
  kind: p
  original: Its purpose should have been playgrounds for children, gardens and music for the recreation of the weary.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.28.3
  kind: p
  original: Instead it is made ugly, dull, and gray by barracks,--barracks wherein the rich would not allow their dogs to dwell.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.28.4
  kind: p
  original: In these miserable shanties soldiers are herded like cattle; here they waste their young days, polishing the boots and brass buttons of their superior officers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.28.5
  kind: p
  original: 'Here, too, I saw the distinction of classes: sturdy sons of a free Republic, drawn up in line like convicts, saluting every passing shrimp of a lieutenant.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.28.6
  kind: p
  original: American equality, degrading manhood and elevating the uniform!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.29.1
  kind: p
  original: Barrack life further tends to develop tendencies of sexual perversion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.29.2
  kind: p
  original: It is gradually producing along this line results similar to European military conditions.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.29.3
  kind: p
  original: Havelock Ellis, the noted writer on sex psychology, has made a thorough study of the subject.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.29.4
  kind: p
  original: 'I quote: "Some of the barracks are great centers of male prostitution....'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.29.5
  kind: p
  original: The number of soldiers who prostitute themselves is greater than we are willing to believe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.29.6
  kind: p
  original: It is no exaggeration to say that in certain regiments the presumption is in favor of the venality of the majority of the men....
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.29.7
  kind: p
  original: On summer evenings Hyde Park and the neighborhood of Albert Gate are full of guardsmen and others plying a lively trade, and with little disguise, in uniform or out....
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.29.8
  kind: p
  original: In most cases the proceeds form a comfortable addition to Tommy Atkins' pocket money."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.30.1
  kind: p
  original: To what extent this perversion has eaten its way into the army and navy can best be judged from the fact that special houses exist for this form of prostitution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.30.2
  kind: p
  original: The practice is not limited to England; it is universal.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.30.3
  kind: p
  original: '"Soldiers are no less sought after in France than in England or in Germany, and special houses for military prostitution exist both in Paris and the garrison towns."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.31.1
  kind: p
  original: Had Mr. Havelock Ellis included America in his investigation of sex perversion, he would have found that the same conditions prevail in our army and navy as in those of other countries.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.31.2
  kind: p
  original: The growth of the standing army inevitably adds to the spread of sex perversion; the barracks are the incubators.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.32.1
  kind: p
  original: Aside from the sexual effects of barrack life, it also tends to unfit the soldier for useful labor after leaving the army.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.32.2
  kind: p
  original: Men, skilled in a trade, seldom enter the army or navy, but even they, after a military experience, find themselves totally unfitted for their former occupations.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.32.3
  kind: p
  original: Having acquired habits of idleness and a taste for excitement and adventure, no peaceful pursuit can content them.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.32.4
  kind: p
  original: Released from the army, they can turn to no useful work.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.32.5
  kind: p
  original: But it is usually the social riff-raff, discharged prisoners and the like, whom either the struggle for life or their own inclination drives into the ranks.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.32.6
  kind: p
  original: These, their military term over, again turn to their former life of crime, more brutalized and degraded than before.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.32.7
  kind: p
  original: It is a well-known fact that in our prisons there is a goodly number of ex-soldiers; while on the other hand, the army and navy are to a great extent supplied with ex-convicts.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.33.1
  kind: p
  original: Of all the evil results, I have just described, none seems to me so detrimental to human integrity as the spirit patriotism has produced in the case of Private William Buwalda.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.33.2
  kind: p
  original: Because he foolishly believed that one can be a soldier and exercise his rights as a man at the same time, the military authorities punished him severely.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.33.3
  kind: p
  original: True, he had served his country fifteen years, during which time his record was unimpeachable.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.33.4
  kind: p
  original: According to Gen. Funston, who reduced Buwalda's sentence to three years, "the first duty of an officer or an enlisted man is unquestioned obedience and loyalty to the government, and it makes no difference whether he approves of that government or not."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.33.5
  kind: p
  original: Thus Funston stamps the true character of allegiance.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.33.6
  kind: p
  original: According to him, entrance into the army abrogates the principles of the Declaration of Independence.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.34.1
  kind: p
  original: What a strange development of patriotism that turns a thinking being into a loyal machine!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.35.1
  kind: p
  original: In justification of this most outrageous sentence of Buwalda, Gen. Funston tells the American people that the soldier's action was a "serious crime equal to treason."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.35.2
  kind: p
  original: Now, what did this "terrible crime" really consist of?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.35.3
  kind: p
  original: 'Simply in this: William Buwalda was one of fifteen hundred people who attended a public meeting in San Francisco; and, oh, horrors, he shook hands with the speaker, Emma Goldman.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.35.4
  kind: p
  original: A terrible crime, indeed, which the General calls "a great military offense, infinitely worse than desertion."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.36.1
  kind: p
  original: Can there be a greater indictment against patriotism than that it will thus brand a man a criminal, throw him into prison, and rob him of the results of fifteen years of faithful service?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.37.1
  kind: p
  original: Buwalda gave to his country the best years of his life and his very manhood.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.37.2
  kind: p
  original: But all that was as nothing.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.37.3
  kind: p
  original: Patriotism is inexorable and, like all insatiable monsters, demands all or nothing.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.37.4
  kind: p
  original: It does not admit that a soldier is also a human being, who has a right to his own feelings and opinions, his own inclinations and ideas.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.37.5
  kind: p
  original: No, patriotism can not admit of that.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.37.6
  kind: p
  original: That is the lesson which Buwalda was made to learn; made to learn at a rather costly, though not at a useless, price.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.37.7
  kind: p
  original: When he returned to freedom, he had lost his position in the army, but he regained his self-respect.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.37.8
  kind: p
  original: After all, that is worth three years of imprisonment.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.38.1
  kind: p
  original: A writer on the military conditions of America, in a recent article, commented on the power of the military man over the civilian in Germany.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.38.2
  kind: p
  original: He said, among other things, that if our Republic had no other meaning than to guarantee all citizens equal rights, it would have just cause for existence.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.38.3
  kind: p
  original: I am convinced that the writer was not in Colorado during the patriotic regime of General Bell.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.38.4
  kind: p
  original: He probably would have changed his mind had he seen how, in the name of patriotism and the Republic, men were thrown into bull-pens, dragged about, driven across the border, and subjected to all kinds of indignities.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.38.5
  kind: p
  original: Nor is that Colorado incident the only one in the growth of military power in the United States.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.38.6
  kind: p
  original: There is hardly a strike where troops and militia do not come to the rescue of those in power, and where they do not act as arrogantly and brutally as do the men wearing the Kaiser's uniform.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.38.7
  kind: p
  original: Then, too, we have the Dick military law.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.38.8
  kind: p
  original: Had the writer forgotten that?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.39.1
  kind: p
  original: A great misfortune with most of our writers is that they are absolutely ignorant on current events, or that, lacking honesty, they will not speak of these matters.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.39.2
  kind: p
  original: And so it has come to pass that the Dick military law was rushed through Congress with little discussion and still less publicity,--a law which gives the President the power to turn a peaceful citizen into a bloodthirsty man-killer, supposedly for the defense of the country, in reality for the protection of the interests of that particular party whose mouthpiece the President happens to be.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.40.1
  kind: p
  original: Our writer claims that militarism can never become such a power in America as abroad, since it is voluntary with us, while compulsory in the Old World.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.40.2
  kind: p
  original: Two very important facts, however, the gentleman forgets to consider.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.40.3
  kind: p
  original: First, that conscription has created in Europe a deep-seated hatred of militarism among all classes of society.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.40.4
  kind: p
  original: Thousands of young recruits enlist under protest and, once in the army, they will use every possible means to desert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.40.5
  kind: p
  original: Second, that it is the compulsory feature of militarism which has created a tremendous anti-militarist movement, feared by European Powers far more than anything else.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.40.6
  kind: p
  original: After all, the greatest bulwark of capitalism is militarism.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.40.7
  kind: p
  original: The very moment the latter is undermined, capitalism will totter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.40.8
  kind: p
  original: True, we have no conscription; that is, men are not usually forced to enlist in the army, but we have developed a far more exacting and rigid force--necessity.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.40.9
  kind: p
  original: Is it not a fact that during industrial depressions there is a tremendous increase in the number of enlistments?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.40.10
  kind: p
  original: The trade of militarism may not be either lucrative or honorable, but it is better than tramping the country in search of work, standing in the bread line, or sleeping in municipal lodging houses.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.40.11
  kind: p
  original: After all, it means thirteen dollars per month, three meals a day, and a place to sleep.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.40.12
  kind: p
  original: Yet even necessity is not sufficiently strong a factor to bring into the army an element of character and manhood.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.40.13
  kind: p
  original: No wonder our military authorities complain of the "poor material" enlisting in the army and navy.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.40.14
  kind: p
  original: This admission is a very encouraging sign.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.40.15
  kind: p
  original: It proves that there is still enough of the spirit of independence and love of liberty left in the average American to risk starvation rather than don the uniform.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.41.1
  kind: p
  original: Thinking men and women the world over are beginning to realize that patriotism is too narrow and limited a conception to meet the necessities of our time.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.41.2
  kind: p
  original: The centralization of power has brought into being an international feeling of solidarity among the oppressed nations of the world; a solidarity which represents a greater harmony of interests between the workingman of America and his brothers abroad than between the American miner and his exploiting compatriot; a solidarity which fears not foreign invasion, because it is bringing all the workers to the point when they will say to their masters, "Go and do your own killing.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.41.3
  kind: p
  original: We have done it long enough for you."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.42.1
  kind: p
  original: This solidarity is awakening the consciousness of even the soldiers, they, too, being flesh of the flesh of the great human family.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.42.2
  kind: p
  original: A solidarity that has proven infallible more than once during past struggles, and which has been the impetus inducing the Parisian soldiers, during the Commune of 1871, to refuse to obey when ordered to shoot their brothers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.42.3
  kind: p
  original: It has given courage to the men who mutinied on Russian warships during recent years.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.42.4
  kind: p
  original: It will eventually bring about the uprising of all the oppressed and downtrodden against their international exploiters.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.43.1
  kind: p
  original: The proletariat of Europe has realized the great force of that solidarity and has, as a result, inaugurated a war against patriotism and its bloody spectre, militarism.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.43.2
  kind: p
  original: Thousands of men fill the prisons of France, Germany, Russia, and the Scandinavian countries, because they dared to defy the ancient superstition.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.43.3
  kind: p
  original: Nor is the movement limited to the working class; it has embraced representatives in all stations of life, its chief exponents being men and women prominent in art, science, and letters.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.44.1
  kind: p
  original: America will have to follow suit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.44.2
  kind: p
  original: The spirit of militarism has already permeated all walks of life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.44.3
  kind: p
  original: Indeed, I am convinced that militarism is growing a greater danger here than anywhere else, because of the many bribes capitalism holds out to those whom it wishes to destroy.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.45.1
  kind: p
  original: The beginning has already been made in the schools.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.45.2
  kind: p
  original: Evidently the government holds to the Jesuitical conception, "Give me the child mind, and I will mould the man."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.45.3
  kind: p
  original: Children are trained in military tactics, the glory of military achievements extolled in the curriculum, and the youthful minds perverted to suit the government.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.45.4
  kind: p
  original: Further, the youth of the country is appealed to in glaring posters to join the army and navy.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.45.5
  kind: p
  original: '"A fine chance to see the world!" cries the governmental huckster.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.45.6
  kind: p
  original: Thus innocent boys are morally shanghaied into patriotism, and the military Moloch strides conquering through the Nation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.46.1
  kind: p
  original: The American workingman has suffered so much at the hands of the soldier, State, and Federal, that he is quite justified in his disgust with, and his opposition to, the uniformed parasite.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.46.2
  kind: p
  original: However, mere denunciation will not solve this great problem.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.46.3
  kind: p
  original: 'What we need is a propaganda of education for the soldier: anti-patriotic literature that will enlighten him as to the real horrors of his trade, and that will awaken his consciousness to his true relation to the man to whose labor he owes his very existence.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.47.1
  kind: p
  original: It is precisely this that the authorities fear most.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.47.2
  kind: p
  original: It is already high treason for a soldier to attend a radical meeting.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.47.3
  kind: p
  original: No doubt they will also stamp it high treason for a soldier to read a radical pamphlet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.47.4
  kind: p
  original: But then, has not authority from time immemorial stamped every step of progress as treasonable?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.47.5
  kind: p
  original: Those, however, who earnestly strive for social reconstruction can well afford to face all that; for it is probably even more important to carry the truth into the barracks than into the factory.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.47.6
  kind: p
  original: When we have undermined the patriotic lie, we shall have cleared the path for that great structure wherein all nationalities shall be united into a universal brotherhood,--a truly FREE SOCIETY.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
