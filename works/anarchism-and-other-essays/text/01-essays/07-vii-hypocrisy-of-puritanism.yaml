# Master file. Edit the `modern` and `notes` fields; see CONTRIBUTING.md.
# Verse ids are frozen. Never renumber; see VERSIFICATION.md.
section: VII
title_original: The Hypocrisy of Puritanism
title_en: The Hypocrisy of Puritanism
author: Emma Goldman
date: '1910'
original_language: en
anchor_language: en
source_original: 'Emma Goldman, Anarchism and Other Essays, with a biographic sketch by Hippolyte Havel (New York: Mother Earth Publishing Association, 1910), public domain; Project Gutenberg ebook 2162'
source_en: 'None needed: the original is in English'
verses:
- id: VII.0.1
  kind: heading
  original: The Hypocrisy of Puritanism
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.1.1
  kind: p
  original: 'Speaking of Puritanism in relation to American art, Mr. Gutzen Burglum said: "Puritanism has made us self-centered and hypocritical for so long, that sincerity and reverence for what is natural in our impulses have been fairly bred out of us, with the result that there can be neither truth nor individuality in our art."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.1
  kind: p
  original: Mr. Burglum might have added that Puritanism has made life itself impossible.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.2
  kind: p
  original: More than art, more than estheticism, life represents beauty in a thousand variations; it is, indeed, a gigantic panorama of eternal change.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.3
  kind: p
  original: Puritanism, on the other hand, rests on a fixed and immovable conception of life; it is based on the Calvinistic idea that life is a curse, imposed upon man by the wrath of God.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.4
  kind: p
  original: In order to redeem himself man must do constant penance, must repudiate every natural and healthy impulse, and turn his back on joy and beauty.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.1
  kind: p
  original: Puritanism celebrated its reign of terror in England during the sixteenth and seventeenth centuries, destroying and crushing every manifestation of art and culture.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.2
  kind: p
  original: It was the spirit of Puritanism which robbed Shelley of his children, because he would not bow to the dicta of religion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.3
  kind: p
  original: It was the same narrow spirit which alienated Byron from his native land, because that great genius rebelled against the monotony, dullness, and pettiness of his country.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.4
  kind: p
  original: 'It was Puritanism, too, that forced some of England''s freest women into the conventional lie of marriage: Mary Wollstonecraft and, later, George Eliot.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.5
  kind: p
  original: And recently Puritanism has demanded another toll--the life of Oscar Wilde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.6
  kind: p
  original: In fact, Puritanism has never ceased to be the most pernicious factor in the domain of John Bull, acting as censor of the artistic expression of his people, and stamping its approval only on the dullness of middle-class respectability.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.4.1
  kind: p
  original: It is therefore sheer British jingoism which points to America as the country of Puritanic provincialism.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.4.2
  kind: p
  original: It is quite true that our life is stunted by Puritanism, and that the latter is killing what is natural and healthy in our impulses.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.4.3
  kind: p
  original: But it is equally true that it is to England that we are indebted for transplanting this spirit on American soil.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.4.4
  kind: p
  original: It was bequeathed to us by the Pilgrim fathers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.4.5
  kind: p
  original: Fleeing from persecution and oppression, the Pilgrims of Mayflower fame established in the New World a reign of Puritanic tyranny and crime.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.4.6
  kind: p
  original: The history of New England, and especially of Massachusetts, is full of the horrors that have turned life into gloom, joy into despair, naturalness into disease, honesty and truth into hideous lies and hypocrisies.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.4.7
  kind: p
  original: The ducking-stool and whipping post, as well as numerous other devices of torture, were the favorite English methods for American purification.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.1
  kind: p
  original: Boston, the city of culture, has gone down in the annals of Puritanism as the "Bloody Town."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.2
  kind: p
  original: It rivaled Salem, even, in her cruel persecution of unauthorized religious opinions.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.3
  kind: p
  original: On the now famous Common a half-naked woman, with a baby in her arms, was publicly whipped for the crime of free speech; and on the same spot Mary Dyer, another Quaker woman, was hanged in 1659.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.4
  kind: p
  original: In fact, Boston has been the scene of more than one wanton crime committed by Puritanism.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.5
  kind: p
  original: Salem, in the summer of 1692, killed eighteen people for witchcraft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.6
  kind: p
  original: Nor was Massachusetts alone in driving out the devil by fire and brimstone.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.7
  kind: p
  original: 'As Canning justly said: "The Pilgrim fathers infested the New World to redress the balance of the Old."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.8
  kind: p
  original: The horrors of that period have found their most supreme expression in the American classic, THE SCARLET LETTER.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.1
  kind: p
  original: Puritanism no longer employs the thumbscrew and lash; but it still has a most pernicious hold on the minds and feelings of the American people.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.2
  kind: p
  original: Naught else can explain the power of a Comstock.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.3
  kind: p
  original: Like the Torquemadas of ante-bellum days, Anthony Comstock is the autocrat of American morals; he dictates the standards of good and evil, of purity and vice.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.4
  kind: p
  original: Like a thief in the night he sneaks into the private lives of the people, into their most intimate relations.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.5
  kind: p
  original: The system of espionage established by this man Comstock puts to shame the infamous Third Division of the Russian secret police.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.6
  kind: p
  original: Why does the public tolerate such an outrage on its liberties?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.7
  kind: p
  original: Simply because Comstock is but the loud expression of the Puritanism bred in the Anglo-Saxon blood, and from whose thraldom even liberals have not succeeded in fully emancipating themselves.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.8
  kind: p
  original: The visionless and leaden elements of the old Young Men's and Women's Christian Temperance Unions, Purity Leagues, American Sabbath Unions, and the Prohibition Party, with Anthony Comstock as their patron saint, are the grave diggers of American art and culture.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.1
  kind: p
  original: Europe can at least boast of a bold art and literature which delve deeply into the social and sexual problems of our time, exercising a severe critique of all our shams.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.2
  kind: p
  original: As with a surgeon's knife every Puritanic carcass is dissected, and the way thus cleared for man's liberation from the dead weights of the past.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.3
  kind: p
  original: But with Puritanism as the constant check upon American life, neither truth nor sincerity is possible.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.4
  kind: p
  original: Nothing but gloom and mediocrity to dictate human conduct, curtail natural expression, and stifle our best impulses.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.5
  kind: p
  original: Puritanism in this the twentieth century is as much the enemy of freedom and beauty as it was when it landed on Plymouth Rock.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.6
  kind: p
  original: It repudiates, as something vile and sinful, our deepest feelings; but being absolutely ignorant as to the real functions of human emotions, Puritanism is itself the creator of the most unspeakable vices.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.8.1
  kind: p
  original: The entire history of asceticism proves this to be only too true.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.8.2
  kind: p
  original: The Church, as well as Puritanism, has fought the flesh as something evil; it had to be subdued and hidden at all cost.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.8.3
  kind: p
  original: The result of this vicious attitude is only now beginning to be recognized by modern thinkers and educators.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.8.4
  kind: p
  original: They realize that "nakedness has a hygienic value as well as a spiritual significance, far beyond its influences in allaying the natural inquisitiveness of the young or acting as a preventative of morbid emotion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.8.5
  kind: p
  original: It is an inspiration to adults who have long outgrown any youthful curiosities.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.8.6
  kind: p
  original: The vision of the essential and eternal human form, the nearest thing to us in all the world, with its vigor and its beauty and its grace, is one of the prime tonics of life."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VII.N1
- id: VII.8.7
  kind: p
  original: But the spirit of purism has so perverted the human mind that it has lost the power to appreciate the beauty of nudity, forcing us to hide the natural form under the plea of chastity.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.8.8
  kind: p
  original: Yet chastity itself is but an artificial imposition upon nature, expressive of a false shame of the human form.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.8.9
  kind: p
  original: The modern idea of chastity, especially in reference to woman, its greatest victim, is but the sensuous exaggeration of our natural impulses.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.8.10
  kind: p
  original: '"Chastity varies with the amount of clothing," and hence Christians and purists forever hasten to cover the "heathen" with tatters, and thus convert him to goodness and chastity.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.1
  kind: p
  original: Puritanism, with its perversion of the significance and functions of the human body, especially in regard to woman, has condemned her to celibacy, or to the indiscriminate breeding of a diseased race, or to prostitution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.2
  kind: p
  original: The enormity of this crime against humanity is apparent when we consider the results.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.3
  kind: p
  original: Absolute sexual continence is imposed upon the unmarried woman, under pain of being considered immoral or fallen, with the result of producing neurasthenia, impotence, depression, and a great variety of nervous complaints involving diminished power of work, limited enjoyment of life, sleeplessness, and preoccupation with sexual desires and imaginings.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.4
  kind: p
  original: The arbitrary and pernicious dictum of total continence probably also explains the mental inequality of the sexes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.5
  kind: p
  original: Thus Freud believes that the intellectual inferiority of so many women is due to the inhibition of thought imposed upon them for the purpose of sexual repression.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.6
  kind: p
  original: Having thus suppressed the natural sex desires of the unmarried woman, Puritanism, on the other hand, blesses her married sister for incontinent fruitfulness in wedlock.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.7
  kind: p
  original: Indeed, not merely blesses her, but forces the woman, oversexed by previous repression, to bear children, irrespective of weakened physical condition or economic inability to rear a large family.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.8
  kind: p
  original: Prevention, even by scientifically determined safe methods, is absolutely prohibited; nay, the very mention of the subject is considered criminal.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.1
  kind: p
  original: Thanks to this Puritanic tyranny, the majority of women soon find themselves at the ebb of their physical resources.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.2
  kind: p
  original: Ill and worn, they are utterly unable to give their children even elementary care.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.3
  kind: p
  original: That, added to economic pressure, forces many women to risk utmost danger rather than continue to bring forth life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.4
  kind: p
  original: The custom of procuring abortions has reached such vast proportions in America as to be almost beyond belief.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.5
  kind: p
  original: According to recent investigations along this line, seventeen abortions are committed in every hundred pregnancies.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.6
  kind: p
  original: This fearful percentage represents only cases which come to the knowledge of physicians.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.7
  kind: p
  original: Considering the secrecy in which this practice is necessarily shrouded, and the consequent professional inefficiency and neglect, Puritanism continuously exacts thousands of victims to its own stupidity and hypocrisy.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.11.1
  kind: p
  original: Prostitution, although hounded, imprisoned, and chained, is nevertheless the greatest triumph of Puritanism.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.11.2
  kind: p
  original: It is its most cherished child, all hypocritical sanctimoniousness notwithstanding.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.11.3
  kind: p
  original: The prostitute is the fury of our century, sweeping across the "civilized" countries like a hurricane, and leaving a trail of disease and disaster.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.11.4
  kind: p
  original: The only remedy Puritanism offers for this ill-begotten child is greater repression and more merciless persecution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.11.5
  kind: p
  original: The latest outrage is represented by the Page Law, which imposes upon New York the terrible failure and crime of Europe; namely, registration and segregation of the unfortunate victims of Puritanism.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.11.6
  kind: p
  original: In equally stupid manner purism seeks to check the terrible scourge of its own creation--venereal diseases.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.11.7
  kind: p
  original: Most disheartening it is that this spirit of obtuse narrow-mindedness has poisoned even our so-called liberals, and has blinded them into joining the crusade against the very things born of the hypocrisy of Puritanism--prostitution and its results.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.11.8
  kind: p
  original: In wilful blindness Puritanism refuses to see that the true method of prevention is the one which makes it clear to all that "venereal diseases are not a mysterious or terrible thing, the penalty of the sin of the flesh, a sort of shameful evil branded by purist malediction, but an ordinary disease which may be treated and cured."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.11.9
  kind: p
  original: By its methods of obscurity, disguise, and concealment, Puritanism has furnished favorable conditions for the growth and spread of these diseases.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.11.10
  kind: p
  original: Its bigotry is again most strikingly demonstrated by the senseless attitude in regard to the great discovery of Prof. Ehrlich, hypocrisy veiling the important cure for syphilis with vague allusions to a remedy for "a certain poison."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.12.1
  kind: p
  original: The almost limitless capacity of Puritanism for evil is due to its intrenchment behind the State and the law.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.12.2
  kind: p
  original: Pretending to safeguard the people against "immorality," it has impregnated the machinery of government and added to its usurpation of moral guardianship the legal censorship of our views, feelings, and even of our conduct.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.13.1
  kind: p
  original: Art, literature, the drama, the privacy of the mails, in fact, our most intimate tastes, are at the mercy of this inexorable tyrant.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.13.2
  kind: p
  original: Anthony Comstock, or some other equally ignorant policeman, has been given power to desecrate genius, to soil and mutilate the sublimest creation of nature--the human form.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.13.3
  kind: p
  original: Books dealing with the most vital issues of our lives, and seeking to shed light upon dangerously obscured problems, are legally treated as criminal offenses, and their helpless authors thrown into prison or driven to destruction and death.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.14.1
  kind: p
  original: Not even in the domain of the Tsar is personal liberty daily outraged to the extent it is in America, the stronghold of the Puritanic eunuchs.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.14.2
  kind: p
  original: Here the only day of recreation left to the masses, Sunday, has been made hideous and utterly impossible.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.14.3
  kind: p
  original: All writers on primitive customs and ancient civilization agree that the Sabbath was a day of festivities, free from care and duties, a day of general rejoicing and merry-making.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.14.4
  kind: p
  original: In every European country this tradition continues to bring some relief from the humdrum and stupidity of our Christian era.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.14.5
  kind: p
  original: Everywhere concert halls, theaters, museums, and gardens are filled with men, women, and children, particularly workers with their families, full of life and joy, forgetful of the ordinary rules and conventions of their every-day existence.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.14.6
  kind: p
  original: It is on that day that the masses demonstrate what life might really mean in a sane society, with work stripped of its profit-making, soul-destroying purpose.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.15.1
  kind: p
  original: Puritanism has robbed the people even of that one day.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.15.2
  kind: p
  original: 'Naturally, only the workers are affected: our millionaires have their luxurious homes and elaborate clubs.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.15.3
  kind: p
  original: The poor, however, are condemned to the monotony and dullness of the American Sunday.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.15.4
  kind: p
  original: The sociability and fun of European outdoor life is here exchanged for the gloom of the church, the stuffy, germ-saturated country parlor, or the brutalizing atmosphere of the back-room saloon.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.15.5
  kind: p
  original: In Prohibition States the people lack even the latter, unless they can invest their meager earnings in quantities of adulterated liquor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.15.6
  kind: p
  original: As to Prohibition, every one knows what a farce it really is.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.15.7
  kind: p
  original: Like all other achievements of Puritanism it, too, has but driven the "devil" deeper into the human system.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.15.8
  kind: p
  original: Nowhere else does one meet so many drunkards as in our Prohibition towns.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.15.9
  kind: p
  original: But so long as one can use scented candy to abate the foul breath of hypocrisy, Puritanism is triumphant.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.15.10
  kind: p
  original: Ostensibly Prohibition is opposed to liquor for reasons of health and economy, but the very spirit of Prohibition being itself abnormal, it succeeds but in creating an abnormal life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.16.1
  kind: p
  original: Every stimulus which quickens the imagination and raises the spirits, is as necessary to our life as air.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.16.2
  kind: p
  original: It invigorates the body, and deepens our vision of human fellowship.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.16.3
  kind: p
  original: Without stimuli, in one form or another, creative work is impossible, nor indeed the spirit of kindliness and generosity.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.16.4
  kind: p
  original: The fact that some great geniuses have seen their reflection in the goblet too frequently, does not justify Puritanism in attempting to fetter the whole gamut of human emotions.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.16.5
  kind: p
  original: A Byron and a Poe have stirred humanity deeper than all the Puritans can ever hope to do.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.16.6
  kind: p
  original: The former have given to life meaning and color; the latter are turning red blood into water, beauty into ugliness, variety into uniformity and decay.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.16.7
  kind: p
  original: Puritanism, in whatever expression, is a poisonous germ.
