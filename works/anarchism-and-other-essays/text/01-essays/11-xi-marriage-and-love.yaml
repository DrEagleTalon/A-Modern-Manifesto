# Master file. Edit the `modern` and `notes` fields; see CONTRIBUTING.md.
# Verse ids are frozen. Never renumber; see VERSIFICATION.md.
section: XI
title_original: Marriage and Love
title_en: Marriage and Love
author: Emma Goldman
date: '1910'
original_language: en
anchor_language: en
source_original: 'Emma Goldman, Anarchism and Other Essays, with a biographic sketch by Hippolyte Havel (New York: Mother Earth Publishing Association, 1910), public domain; Project Gutenberg ebook 2162'
source_en: 'None needed: the original is in English'
verses:
- id: XI.0.1
  kind: heading
  original: Marriage and Love
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.1.1
  kind: p
  original: The popular notion about marriage and love is that they are synonymous, that they spring from the same motives, and cover the same human needs.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.1.2
  kind: p
  original: Like most popular notions this also rests not on actual facts, but on superstition.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.2.1
  kind: p
  original: Marriage and love have nothing in common; they are as far apart as the poles; are, in fact, antagonistic to each other.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.2.2
  kind: p
  original: No doubt some marriages have been the result of love.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.2.3
  kind: p
  original: Not, however, because love could assert itself only in marriage; much rather is it because few people can completely outgrow a convention.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.2.4
  kind: p
  original: There are today large numbers of men and women to whom marriage is naught but a farce, but who submit to it for the sake of public opinion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.2.5
  kind: p
  original: At any rate, while it is true that some marriages are based on love, and while it is equally true that in some cases love continues in married life, I maintain that it does so regardless of marriage, and not because of it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.3.1
  kind: p
  original: On the other hand, it is utterly false that love results from marriage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.3.2
  kind: p
  original: On rare occasions one does hear of a miraculous case of a married couple falling in love after marriage, but on close examination it will be found that it is a mere adjustment to the inevitable.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.3.3
  kind: p
  original: Certainly the growing-used to each other is far away from the spontaneity, the intensity, and beauty of love, without which the intimacy of marriage must prove degrading to both the woman and the man.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.4.1
  kind: p
  original: Marriage is primarily an economic arrangement, an insurance pact.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.4.2
  kind: p
  original: It differs from the ordinary life insurance agreement only in that it is more binding, more exacting.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.4.3
  kind: p
  original: Its returns are insignificantly small compared with the investments.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.4.4
  kind: p
  original: In taking out an insurance policy one pays for it in dollars and cents, always at liberty to discontinue payments.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.4.5
  kind: p
  original: If, however, woman's premium is her husband, she pays for it with her name, her privacy, her self-respect, her very life, "until death doth part."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.4.6
  kind: p
  original: Moreover, the marriage insurance condemns her to life-long dependency, to parasitism, to complete uselessness, individual as well as social.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.4.7
  kind: p
  original: Man, too, pays his toll, but as his sphere is wider, marriage does not limit him as much as woman.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.4.8
  kind: p
  original: He feels his chains more in an economic sense.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.5.1
  kind: p
  original: Thus Dante's motto over Inferno applies with equal force to marriage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.5.2
  kind: p
  original: '"Ye who enter here leave all hope behind."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.6.1
  kind: p
  original: That marriage is a failure none but the very stupid will deny.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.6.2
  kind: p
  original: One has but to glance over the statistics of divorce to realize how bitter a failure marriage really is.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.6.3
  kind: p
  original: 'Nor will the stereotyped Philistine argument that the laxity of divorce laws and the growing looseness of woman account for the fact that: first, every twelfth marriage ends in divorce; second, that since 1870 divorces have increased from 28 to 73 for every hundred thousand population; third, that adultery, since 1867, as ground for divorce, has increased 270.8 per cent.; fourth, that desertion increased 369.8 per cent.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.7.1
  kind: p
  original: Added to these startling figures is a vast amount of material, dramatic and literary, further elucidating this subject.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.7.2
  kind: p
  original: Robert Herrick, in TOGETHER; Pinero, in MID-CHANNEL; Eugene Walter, in PAID IN FULL, and scores of other writers are discussing the barrenness, the monotony, the sordidness, the inadequacy of marriage as a factor for harmony and understanding.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.8.1
  kind: p
  original: The thoughtful social student will not content himself with the popular superficial excuse for this phenomenon.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.8.2
  kind: p
  original: He will have to dig deeper into the very life of the sexes to know why marriage proves so disastrous.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.9.1
  kind: p
  original: Edward Carpenter says that behind every marriage stands the life-long environment of the two sexes; an environment so different from each other that man and woman must remain strangers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.9.2
  kind: p
  original: Separated by an insurmountable wall of superstition, custom, and habit, marriage has not the potentiality of developing knowledge of, and respect for, each other, without which every union is doomed to failure.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.10.1
  kind: p
  original: Henrik Ibsen, the hater of all social shams, was probably the first to realize this great truth.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.10.2
  kind: p
  original: Nora leaves her husband, not--as the stupid critic would have it--because she is tired of her responsibilities or feels the need of woman's rights, but because she has come to know that for eight years she had lived with a stranger and borne him children.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.10.3
  kind: p
  original: Can there be anything more humiliating, more degrading than a life-long proximity between two strangers?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.10.4
  kind: p
  original: No need for the woman to know anything of the man, save his income.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.10.5
  kind: p
  original: As to the knowledge of the woman--what is there to know except that she has a pleasing appearance?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.10.6
  kind: p
  original: We have not yet outgrown the theologic myth that woman has no soul, that she is a mere appendix to man, made out of his rib just for the convenience of the gentleman who was so strong that he was afraid of his own shadow.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.11.1
  kind: p
  original: Perchance the poor quality of the material whence woman comes is responsible for her inferiority.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.11.2
  kind: p
  original: At any rate, woman has no soul--what is there to know about her?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.11.3
  kind: p
  original: Besides, the less soul a woman has the greater her asset as a wife, the more readily will she absorb herself in her husband.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.11.4
  kind: p
  original: It is this slavish acquiescence to man's superiority that has kept the marriage institution seemingly intact for so long a period.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.11.5
  kind: p
  original: Now that woman is coming into her own, now that she is actually growing aware of herself as being outside of the master's grace, the sacred institution of marriage is gradually being undermined, and no amount of sentimental lamentation can stay it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.12.1
  kind: p
  original: From infancy, almost, the average girl is told that marriage is her ultimate goal; therefore her training and education must be directed towards that end.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.12.2
  kind: p
  original: Like the mute beast fattened for slaughter, she is prepared for that.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.12.3
  kind: p
  original: Yet, strange to say, she is allowed to know much less about her function as wife and mother than the ordinary artisan of his trade.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.12.4
  kind: p
  original: It is indecent and filthy for a respectable girl to know anything of the marital relation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.12.5
  kind: p
  original: Oh, for the inconsistency of respectability, that needs the marriage vow to turn something which is filthy into the purest and most sacred arrangement that none dare question or criticize.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.12.6
  kind: p
  original: Yet that is exactly the attitude of the average upholder of marriage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.12.7
  kind: p
  original: The prospective wife and mother is kept in complete ignorance of her only asset in the competitive field--sex.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.12.8
  kind: p
  original: Thus she enters into life-long relations with a man only to find herself shocked, repelled, outraged beyond measure by the most natural and healthy instinct, sex.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.12.9
  kind: p
  original: It is safe to say that a large percentage of the unhappiness, misery, distress, and physical suffering of matrimony is due to the criminal ignorance in sex matters that is being extolled as a great virtue.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.12.10
  kind: p
  original: Nor is it at all an exaggeration when I say that more than one home has been broken up because of this deplorable fact.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.13.1
  kind: p
  original: If, however, woman is free and big enough to learn the mystery of sex without the sanction of State or Church, she will stand condemned as utterly unfit to become the wife of a "good" man, his goodness consisting of an empty brain and plenty of money.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.13.2
  kind: p
  original: Can there be anything more outrageous than the idea that a healthy, grown woman, full of life and passion, must deny nature's demand, must subdue her most intense craving, undermine her health and break her spirit, must stunt her vision, abstain from the depth and glory of sex experience until a "good" man comes along to take her unto himself as a wife?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.13.3
  kind: p
  original: That is precisely what marriage means.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.13.4
  kind: p
  original: How can such an arrangement end except in failure?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.13.5
  kind: p
  original: This is one, though not the least important, factor of marriage, which differentiates it from love.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.14.1
  kind: p
  original: Ours is a practical age.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.14.2
  kind: p
  original: The time when Romeo and Juliet risked the wrath of their fathers for love, when Gretchen exposed herself to the gossip of her neighbors for love, is no more.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.14.3
  kind: p
  original: If, on rare occasions, young people allow themselves the luxury of romance, they are taken in care by the elders, drilled and pounded until they become "sensible."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.15.1
  kind: p
  original: The moral lesson instilled in the girl is not whether the man has aroused her love, but rather is it, "How much?"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.15.2
  kind: p
  original: 'The important and only God of practical American life: Can the man make a living? can he support a wife?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.15.3
  kind: p
  original: That is the only thing that justifies marriage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.15.4
  kind: p
  original: Gradually this saturates every thought of the girl; her dreams are not of moonlight and kisses, of laughter and tears; she dreams of shopping tours and bargain counters.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.15.5
  kind: p
  original: This soul poverty and sordidness are the elements inherent in the marriage institution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.15.6
  kind: p
  original: The State and Church approve of no other ideal, simply because it is the one that necessitates the State and Church control of men and women.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.16.1
  kind: p
  original: Doubtless there are people who continue to consider love above dollars and cents.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.16.2
  kind: p
  original: Particularly this is true of that class whom economic necessity has forced to become self-supporting.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.16.3
  kind: p
  original: The tremendous change in woman's position, wrought by that mighty factor, is indeed phenomenal when we reflect that it is but a short time since she has entered the industrial arena.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.16.4
  kind: p
  original: Six million women wage workers; six million women, who have equal right with men to be exploited, to be robbed, to go on strike; aye, to starve even.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.16.5
  kind: p
  original: Anything more, my lord?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.16.6
  kind: p
  original: Yes, six million wage workers in every walk of life, from the highest brain work to the mines and railroad tracks; yes, even detectives and policemen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.16.7
  kind: p
  original: Surely the emancipation is complete.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.17.1
  kind: p
  original: Yet with all that, but a very small number of the vast army of women wage workers look upon work as a permanent issue, in the same light as does man.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.17.2
  kind: p
  original: No matter how decrepit the latter, he has been taught to be independent, self-supporting.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.17.3
  kind: p
  original: Oh, I know that no one is really independent in our economic treadmill; still, the poorest specimen of a man hates to be a parasite; to be known as such, at any rate.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.18.1
  kind: p
  original: The woman considers her position as worker transitory, to be thrown aside for the first bidder.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.18.2
  kind: p
  original: That is why it is infinitely harder to organize women than men.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.18.3
  kind: p
  original: '"Why should I join a union?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.18.4
  kind: p
  original: I am going to get married, to have a home."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.18.5
  kind: p
  original: Has she not been taught from infancy to look upon that as her ultimate calling?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.18.6
  kind: p
  original: She learns soon enough that the home, though not so large a prison as the factory, has more solid doors and bars.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.18.7
  kind: p
  original: It has a keeper so faithful that naught can escape him.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.18.8
  kind: p
  original: The most tragic part, however, is that the home no longer frees her from wage slavery; it only increases her task.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.19.1
  kind: p
  original: According to the latest statistics submitted before a Committee "on labor and wages, and congestion of population," ten per cent. of the wage workers in New York City alone are married, yet they must continue to work at the most poorly paid labor in the world.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.19.2
  kind: p
  original: Add to this horrible aspect the drudgery of housework, and what remains of the protection and glory of the home?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.19.3
  kind: p
  original: As a matter of fact, even the middle-class girl in marriage can not speak of her home, since it is the man who creates her sphere.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.19.4
  kind: p
  original: It is not important whether the husband is a brute or a darling.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.19.5
  kind: p
  original: What I wish to prove is that marriage guarantees woman a home only by the grace of her husband.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.19.6
  kind: p
  original: There she moves about in HIS home, year after year, until her aspect of life and human affairs becomes as flat, narrow, and drab as her surroundings.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.19.7
  kind: p
  original: Small wonder if she becomes a nag, petty, quarrelsome, gossipy, unbearable, thus driving the man from the house.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.19.8
  kind: p
  original: She could not go, if she wanted to; there is no place to go.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.19.9
  kind: p
  original: Besides, a short period of married life, of complete surrender of all faculties, absolutely incapacitates the average woman for the outside world.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.19.10
  kind: p
  original: She becomes reckless in appearance, clumsy in her movements, dependent in her decisions, cowardly in her judgment, a weight and a bore, which most men grow to hate and despise.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.19.11
  kind: p
  original: Wonderfully inspiring atmosphere for the bearing of life, is it not?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.20.1
  kind: p
  original: But the child, how is it to be protected, if not for marriage?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.20.2
  kind: p
  original: After all, is not that the most important consideration?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.20.3
  kind: p
  original: The sham, the hypocrisy of it!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.20.4
  kind: p
  original: Marriage protecting the child, yet thousands of children destitute and homeless.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.20.5
  kind: p
  original: Marriage protecting the child, yet orphan asylums and reformatories overcrowded, the Society for the Prevention of Cruelty to Children keeping busy in rescuing the little victims from "loving" parents, to place them under more loving care, the Gerry Society.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.20.6
  kind: p
  original: Oh, the mockery of it!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.21.1
  kind: p
  original: Marriage may have the power to bring the horse to water, but has it ever made him drink?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.21.2
  kind: p
  original: The law will place the father under arrest, and put him in convict's clothes; but has that ever stilled the hunger of the child?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.21.3
  kind: p
  original: If the parent has no work, or if he hides his identity, what does marriage do then?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.21.4
  kind: p
  original: It invokes the law to bring the man to "justice," to put him safely behind closed doors; his labor, however, goes not to the child, but to the State.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.21.5
  kind: p
  original: The child receives but a blighted memory of his father's stripes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.22.1
  kind: p
  original: As to the protection of the woman,--therein lies the curse of marriage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.22.2
  kind: p
  original: Not that it really protects her, but the very idea is so revolting, such an outrage and insult on life, so degrading to human dignity, as to forever condemn this parasitic institution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.23.1
  kind: p
  original: It is like that other paternal arrangement--capitalism.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.23.2
  kind: p
  original: It robs man of his birthright, stunts his growth, poisons his body, keeps him in ignorance, in poverty, and dependence, and then institutes charities that thrive on the last vestige of man's self-respect.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.24.1
  kind: p
  original: The institution of marriage makes a parasite of woman, an absolute dependent.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.24.2
  kind: p
  original: It incapacitates her for life's struggle, annihilates her social consciousness, paralyzes her imagination, and then imposes its gracious protection, which is in reality a snare, a travesty on human character.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.25.1
  kind: p
  original: If motherhood is the highest fulfillment of woman's nature, what other protection does it need, save love and freedom?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.25.2
  kind: p
  original: Marriage but defiles, outrages, and corrupts her fulfillment.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.25.3
  kind: p
  original: Does it not say to woman, Only when you follow me shall you bring forth life?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.25.4
  kind: p
  original: Does it not condemn her to the block, does it not degrade and shame her if she refuses to buy her right to motherhood by selling herself?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.25.5
  kind: p
  original: Does not marriage only sanction motherhood, even though conceived in hatred, in compulsion?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.25.6
  kind: p
  original: Yet, if motherhood be of free choice, of love, of ecstasy, of defiant passion, does it not place a crown of thorns upon an innocent head and carve in letters of blood the hideous epithet, Bastard?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.25.7
  kind: p
  original: Were marriage to contain all the virtues claimed for it, its crimes against motherhood would exclude it forever from the realm of love.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.26.1
  kind: p
  original: Love, the strongest and deepest element in all life, the harbinger of hope, of joy, of ecstasy; love, the defier of all laws, of all conventions; love, the freest, the most powerful moulder of human destiny; how can such an all-compelling force be synonymous with that poor little State and Church-begotten weed, marriage?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.1
  kind: p
  original: Free love?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.2
  kind: p
  original: As if love is anything but free!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.3
  kind: p
  original: Man has bought brains, but all the millions in the world have failed to buy love.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.4
  kind: p
  original: Man has subdued bodies, but all the power on earth has been unable to subdue love.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.5
  kind: p
  original: Man has conquered whole nations, but all his armies could not conquer love.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.6
  kind: p
  original: Man has chained and fettered the spirit, but he has been utterly helpless before love.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.7
  kind: p
  original: High on a throne, with all the splendor and pomp his gold can command, man is yet poor and desolate, if love passes him by.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.8
  kind: p
  original: And if it stays, the poorest hovel is radiant with warmth, with life and color.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.9
  kind: p
  original: Thus love has the magic power to make of a beggar a king.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.10
  kind: p
  original: Yes, love is free; it can dwell in no other atmosphere.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.11
  kind: p
  original: In freedom it gives itself unreservedly, abundantly, completely.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.12
  kind: p
  original: All the laws on the statutes, all the courts in the universe, cannot tear it from the soil, once love has taken root.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.13
  kind: p
  original: If, however, the soil is sterile, how can marriage make it bear fruit?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.14
  kind: p
  original: It is like the last desperate struggle of fleeting life against death.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.28.1
  kind: p
  original: Love needs no protection; it is its own protection.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.28.2
  kind: p
  original: So long as love begets life no child is deserted, or hungry, or famished for the want of affection.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.28.3
  kind: p
  original: I know this to be true.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.28.4
  kind: p
  original: I know women who became mothers in freedom by the men they loved.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.28.5
  kind: p
  original: Few children in wedlock enjoy the care, the protection, the devotion free motherhood is capable of bestowing.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.29.1
  kind: p
  original: The defenders of authority dread the advent of a free motherhood, lest it will rob them of their prey.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.29.2
  kind: p
  original: Who would fight wars?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.29.3
  kind: p
  original: Who would create wealth?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.29.4
  kind: p
  original: Who would make the policeman, the jailer, if woman were to refuse the indiscriminate breeding of children?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.29.5
  kind: p
  original: The race, the race! shouts the king, the president, the capitalist, the priest.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.29.6
  kind: p
  original: The race must be preserved, though woman be degraded to a mere machine,--and the marriage institution is our only safety valve against the pernicious sex awakening of woman.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.29.7
  kind: p
  original: But in vain these frantic efforts to maintain a state of bondage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.29.8
  kind: p
  original: In vain, too, the edicts of the Church, the mad attacks of rulers, in vain even the arm of the law.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.29.9
  kind: p
  original: Woman no longer wants to be a party to the production of a race of sickly, feeble, decrepit, wretched human beings, who have neither the strength nor moral courage to throw off the yoke of poverty and slavery.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.29.10
  kind: p
  original: Instead she desires fewer and better children, begotten and reared in love and through free choice; not by compulsion, as marriage imposes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.29.11
  kind: p
  original: Our pseudo-moralists have yet to learn the deep sense of responsibility toward the child, that love in freedom has awakened in the breast of woman.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.29.12
  kind: p
  original: Rather would she forego forever the glory of motherhood than bring forth life in an atmosphere that breathes only destruction and death.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.29.13
  kind: p
  original: And if she does become a mother, it is to give to the child the deepest and best her being can yield.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.29.14
  kind: p
  original: To grow with the child is her motto; she knows that in that manner alone can she help build true manhood and womanhood.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.30.1
  kind: p
  original: Ibsen must have had a vision of a free mother, when, with a master stroke, he portrayed Mrs. Alving.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.30.2
  kind: p
  original: She was the ideal mother because she had outgrown marriage and all its horrors, because she had broken her chains, and set her spirit free to soar until it returned a personality, regenerated and strong.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.30.3
  kind: p
  original: Alas, it was too late to rescue her life's joy, her Oswald; but not too late to realize that love in freedom is the only condition of a beautiful life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.30.4
  kind: p
  original: Those who, like Mrs. Alving, have paid with blood and tears for their spiritual awakening, repudiate marriage as an imposition, a shallow, empty mockery.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.30.5
  kind: p
  original: They know, whether love last but one brief span of time or for eternity, it is the only creative, inspiring, elevating basis for a new race, a new world.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.31.1
  kind: p
  original: In our present pygmy state love is indeed a stranger to most people.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.31.2
  kind: p
  original: Misunderstood and shunned, it rarely takes root; or if it does, it soon withers and dies.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.31.3
  kind: p
  original: Its delicate fiber can not endure the stress and strain of the daily grind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.31.4
  kind: p
  original: Its soul is too complex to adjust itself to the slimy woof of our social fabric.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.31.5
  kind: p
  original: It weeps and moans and suffers with those who have need of it, yet lack the capacity to rise to love's summit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.32.1
  kind: p
  original: Some day, some day men and women will rise, they will reach the mountain peak, they will meet big and strong and free, ready to receive, to partake, and to bask in the golden rays of love.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.32.2
  kind: p
  original: What fancy, what imagination, what poetic genius can foresee even approximately the potentialities of such a force in the life of men and women.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.32.3
  kind: p
  original: If the world is ever to give birth to true companionship and oneness, not marriage, but love will be the parent.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
