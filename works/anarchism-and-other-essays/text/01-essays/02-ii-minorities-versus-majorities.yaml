section: II
title_original: Minorities Versus Majorities
title_en: Minorities Versus Majorities
author: Emma Goldman
date: '1910'
original_language: en
anchor_language: en
source_original: 'Emma Goldman, Anarchism and Other Essays, with a biographic sketch by Hippolyte Havel (New York: Mother Earth Publishing Association, 1910), public domain; Project Gutenberg ebook 2162'
source_en: 'None needed: the original is in English'
verses:
- id: II.0.1
  kind: heading
  original: Minorities Versus Majorities
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.1.1
  kind: p
  original: If I were to give a summary of the tendency of our times, I would say, Quantity.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.1.2
  kind: p
  original: The multitude, the mass spirit, dominates everywhere, destroying quality.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.1.3
  kind: p
  original: Our entire life--production, politics, and education--rests on quantity, on numbers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.1.4
  kind: p
  original: The worker who once took pride in the thoroughness and quality of his work, has been replaced by brainless, incompetent automatons, who turn out enormous quantities of things, valueless to themselves, and generally injurious to the rest of mankind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.1.5
  kind: p
  original: Thus quantity, instead of adding to life's comforts and peace, has merely increased man's burden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.1
  kind: p
  original: In politics, naught but quantity counts.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.2
  kind: p
  original: In proportion to its increase, however, principles, ideals, justice, and uprightness are completely swamped by the array of numbers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.3
  kind: p
  original: In the struggle for supremacy the various political parties outdo each other in trickery, deceit, cunning, and shady machinations, confident that the one who succeeds is sure to be hailed by the majority as the victor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.4
  kind: p
  original: That is the only god,--Success.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.5
  kind: p
  original: As to what expense, what terrible cost to character, is of no moment.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.6
  kind: p
  original: We have not far to go in search of proof to verify this sad fact.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.3.1
  kind: p
  original: Never before did the corruption, the complete rottenness of our government stand so thoroughly exposed; never before were the American people brought face to face with the Judas nature of that political body, which has claimed for years to be absolutely beyond reproach, as the mainstay of our institutions, the true protector of the rights and liberties of the people.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.1
  kind: p
  original: Yet when the crimes of that party became so brazen that even the blind could see them, it needed but to muster up its minions, and its supremacy was assured.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.2
  kind: p
  original: Thus the very victims, duped, betrayed, outraged a hundred times, decided, not against, but in favor of the victor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.3
  kind: p
  original: Bewildered, the few asked how could the majority betray the traditions of American liberty?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.4
  kind: p
  original: Where was its judgment, its reasoning capacity?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.5
  kind: p
  original: That is just it, the majority cannot reason; it has no judgment.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.6
  kind: p
  original: Lacking utterly in originality and moral courage, the majority has always placed its destiny in the hands of others.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.7
  kind: p
  original: Incapable of standing responsibilities, it has followed its leaders even unto destruction.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.8
  kind: p
  original: 'Dr. Stockman was right: "The most dangerous enemies of truth and justice in our midst are the compact majorities, the damned compact majority."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.9
  kind: p
  original: Without ambition or initiative, the compact mass hates nothing so much as innovation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.10
  kind: p
  original: It has always opposed, condemned, and hounded the innovator, the pioneer of a new truth.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.5.1
  kind: p
  original: The oft repeated slogan of our time is, among all politicians, the Socialists included, that ours is an era of individualism, of the minority.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.5.2
  kind: p
  original: Only those who do not probe beneath the surface might be led to entertain this view.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.5.3
  kind: p
  original: Have not the few accumulated the wealth of the world?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.5.4
  kind: p
  original: Are they not the masters, the absolute kings of the situation?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.5.5
  kind: p
  original: Their success, however, is due not to individualism, but to the inertia, the cravenness, the utter submission of the mass.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.5.6
  kind: p
  original: The latter wants but to be dominated, to be led, to be coerced.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.5.7
  kind: p
  original: As to individualism, at no time in human history did it have less chance of expression, less opportunity to assert itself in a normal, healthy manner.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.6.1
  kind: p
  original: The individual educator imbued with honesty of purpose, the artist or writer of original ideas, the independent scientist or explorer, the non-compromising pioneers of social changes are daily pushed to the wall by men whose learning and creative ability have become decrepit with age.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.7.1
  kind: p
  original: Educators of Ferrer's type are nowhere tolerated, while the dietitians of predigested food, a la Professors Eliot and Butler, are the successful perpetuators of an age of nonentities, of automatons.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.7.2
  kind: p
  original: In the literary and dramatic world, the Humphrey Wards and Clyde Fitches are the idols of the mass, while but few know or appreciate the beauty and genius of an Emerson, Thoreau, Whitman; an Ibsen, a Hauptmann, a Butler Yeats, or a Stephen Phillips.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.7.3
  kind: p
  original: They are like solitary stars, far beyond the horizon of the multitude.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.1
  kind: p
  original: Publishers, theatrical managers, and critics ask not for the quality inherent in creative art, but will it meet with a good sale, will it suit the palate of the people?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.2
  kind: p
  original: Alas, this palate is like a dumping ground; it relishes anything that needs no mental mastication.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.3
  kind: p
  original: As a result, the mediocre, the ordinary, the commonplace represents the chief literary output.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.1
  kind: p
  original: Need I say that in art we are confronted with the same sad facts?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.2
  kind: p
  original: One has but to inspect our parks and thoroughfares to realize the hideousness and vulgarity of the art manufacture.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.3
  kind: p
  original: Certainly, none but a majority taste would tolerate such an outrage on art.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.4
  kind: p
  original: False in conception and barbarous in execution, the statuary that infests American cities has as much relation to true art, as a totem to a Michael Angelo.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.5
  kind: p
  original: Yet that is the only art that succeeds.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.6
  kind: p
  original: The true artistic genius, who will not cater to accepted notions, who exercises originality, and strives to be true to life, leads an obscure and wretched existence.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.7
  kind: p
  original: His work may some day become the fad of the mob, but not until his heart's blood had been exhausted; not until the pathfinder has ceased to be, and a throng of an idealless and visionless mob has done to death the heritage of the master.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.10.1
  kind: p
  original: It is said that the artist of today cannot create because Prometheus-like he is bound to the rock of economic necessity.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.10.2
  kind: p
  original: This, however, is true of art in all ages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.10.3
  kind: p
  original: Michael Angelo was dependent on his patron saint, no less than the sculptor or painter of today, except that the art connoisseurs of those days were far away from the madding crowd.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.10.4
  kind: p
  original: They felt honored to be permitted to worship at the shrine of the master.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.1
  kind: p
  original: The art protector of our time knows but one criterion, one value,--the dollar.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.2
  kind: p
  original: He is not concerned about the quality of any great work, but in the quantity of dollars his purchase implies.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.3
  kind: p
  original: Thus the financier in Mirbeau's LES AFFAIRES SONT LES AFFAIRES points to some blurred arrangement in colors, saying "See how great it is; it cost 50,000 francs."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.4
  kind: p
  original: Just like our own parvenues.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.5
  kind: p
  original: The fabulous figures paid for their great art discoveries must make up for the poverty of their taste.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.12.1
  kind: p
  original: The most unpardonable sin in society is independence of thought.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.12.2
  kind: p
  original: That this should be so terribly apparent in a country whose symbol is democracy, is very significant of the tremendous power of the majority.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.13.1
  kind: p
  original: 'Wendell Phillips said fifty years ago: "In our country of absolute democratic equality, public opinion is not only omnipotent, it is omnipresent.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.13.2
  kind: p
  original: There is no refuge from its tyranny, there is no hiding from its reach, and the result is that if you take the old Greek lantern and go about to seek among a hundred, you will not find a single American who has not, or who does not fancy at least he has, something to gain or lose in his ambition, his social life, or business, from the good opinion and the votes of those around him.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.13.3
  kind: p
  original: And the consequence is that instead of being a mass of individuals, each one fearlessly blurting out his own conviction, as a nation compared to other nations we are a mass of cowards.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.13.4
  kind: p
  original: More than any other people we are afraid of each other."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.13.5
  kind: p
  original: Evidently we have not advanced very far from the condition that confronted Wendell Phillips.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.14.1
  kind: p
  original: Today, as then, public opinion is the omnipresent tyrant; today, as then, the majority represents a mass of cowards, willing to accept him who mirrors its own soul and mind poverty.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.14.2
  kind: p
  original: That accounts for the unprecedented rise of a man like Roosevelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.14.3
  kind: p
  original: He embodies the very worst element of mob psychology.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.14.4
  kind: p
  original: A politician, he knows that the majority cares little for ideals or integrity.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.14.5
  kind: p
  original: What it craves is display.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.14.6
  kind: p
  original: It matters not whether that be a dog show, a prize fight, the lynching of a "nigger," the rounding up of some petty offender, the marriage exposition of an heiress, or the acrobatic stunts of an ex-president.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.14.7
  kind: p
  original: The more hideous the mental contortions, the greater the delight and bravos of the mass.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.14.8
  kind: p
  original: Thus, poor in ideals and vulgar of soul, Roosevelt continues to be the man of the hour.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.15.1
  kind: p
  original: On the other hand, men towering high above such political pygmies, men of refinement, of culture, of ability, are jeered into silence as mollycoddles.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.15.2
  kind: p
  original: It is absurd to claim that ours is the era of individualism.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.15.3
  kind: p
  original: 'Ours is merely a more poignant repetition of the phenomenon of all history: every effort for progress, for enlightenment, for science, for religious, political, and economic liberty, emanates from the minority, and not from the mass.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.15.4
  kind: p
  original: Today, as ever, the few are misunderstood, hounded, imprisoned, tortured, and killed.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.16.1
  kind: p
  original: The principle of brotherhood expounded by the agitator of Nazareth preserved the germ of life, of truth and justice, so long as it was the beacon light of the few.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.16.2
  kind: p
  original: The moment the majority seized upon it, that great principle became a shibboleth and harbinger of blood and fire, spreading suffering and disaster.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.16.3
  kind: p
  original: The attack on the omnipotence of Rome was like a sunrise amid the darkness of the night, only so long as it was made by the colossal figures of a Huss, a Calvin, or a Luther.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.16.4
  kind: p
  original: Yet when the mass joined in the procession against the Catholic monster, it was no less cruel, no less bloodthirsty than its enemy.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.16.5
  kind: p
  original: Woe to the heretics, to the minority, who would not bow to its dicta.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.16.6
  kind: p
  original: After infinite zeal, endurance, and sacrifice, the human mind is at last free from the religious phantom; the minority has gone on in pursuit of new conquests, and the majority is lagging behind, handicapped by truth grown false with age.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.17.1
  kind: p
  original: Politically the human race would still be in the most absolute slavery, were it not for the John Balls, the Wat Tylers, the Tells, the innumerable individual giants who fought inch by inch against the power of kings and tyrants.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.17.2
  kind: p
  original: But for individual pioneers the world would have never been shaken to its very roots by that tremendous wave, the French Revolution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.17.3
  kind: p
  original: Great events are usually preceded by apparently small things.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.17.4
  kind: p
  original: Thus the eloquence and fire of Camille Desmoulins was like the trumpet before Jericho, razing to the ground that emblem of torture, of abuse, of horror, the Bastille.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.18.1
  kind: p
  original: Always, at every period, the few were the banner bearers of a great idea, of liberating effort.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.18.2
  kind: p
  original: Not so the mass, the leaden weight of which does not let it move.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.18.3
  kind: p
  original: The truth of this is borne out in Russia with greater force than elsewhere.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.18.4
  kind: p
  original: Thousands of lives have already been consumed by that bloody regime, yet the monster on the throne is not appeased.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.18.5
  kind: p
  original: How is such a thing possible when ideas, culture, literature, when the deepest and finest emotions groan under the iron yoke?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.18.6
  kind: p
  original: The majority, that compact, immobile, drowsy mass, the Russian peasant, after a century of struggle, of sacrifice, of untold misery, still believes that the rope which strangles "the man with the white hands" brings luck.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N1
- id: II.19.1
  kind: p
  original: In the American struggle for liberty, the majority was no less of a stumbling block.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.19.2
  kind: p
  original: Until this very day the ideas of Jefferson, of Patrick Henry, of Thomas Paine, are denied and sold by their posterity.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.19.3
  kind: p
  original: The mass wants none of them.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.19.4
  kind: p
  original: The greatness and courage worshipped in Lincoln have been forgotten in the men who created the background for the panorama of that time.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.19.5
  kind: p
  original: The true patron saints of the black men were represented in that handful of fighters in Boston, Lloyd Garrison, Wendell Phillips, Thoreau, Margaret Fuller, and Theodore Parker, whose great courage and sturdiness culminated in that somber giant, John Brown.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.19.6
  kind: p
  original: Their untiring zeal, their eloquence and perseverance undermined the stronghold of the Southern lords.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.19.7
  kind: p
  original: Lincoln and his minions followed only when abolition had become a practical issue, recognized as such by all.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.20.1
  kind: p
  original: About fifty years ago, a meteor-like idea made its appearance on the social horizon of the world, an idea so far-reaching, so revolutionary, so all-embracing as to spread terror in the hearts of tyrants everywhere.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.20.2
  kind: p
  original: On the other hand, that idea was a harbinger of joy, of cheer, of hope to the millions.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.20.3
  kind: p
  original: The pioneers knew the difficulties in their way, they knew the opposition, the persecution, the hardships that would meet them, but proud and unafraid they started on their march onward, ever onward.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.20.4
  kind: p
  original: Now that idea has become a popular slogan.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.20.5
  kind: p
  original: 'Almost everyone is a Socialist today: the rich man, as well as his poor victim; the upholders of law and authority, as well as their unfortunate culprits; the freethinker, as well as the perpetuator of religious falsehoods; the fashionable lady, as well as the shirtwaist girl.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.20.6
  kind: p
  original: Why not?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.20.7
  kind: p
  original: Now that the truth of fifty years ago has become a lie, now that it has been clipped of all its youthful imagination, and been robbed of its vigor, its strength, its revolutionary ideal--why not?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.20.8
  kind: p
  original: Now that it is no longer a beautiful vision, but a "practical, workable scheme," resting on the will of the majority, why not?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.20.9
  kind: p
  original: With the same political cunning and shrewdness the mass is petted, pampered, cheated daily.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.20.10
  kind: p
  original: 'Its praise is being sung in many keys: the poor majority, the outraged, the abused, the giant majority, if only it would follow us.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.21.1
  kind: p
  original: Who has not heard this litany before?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.21.2
  kind: p
  original: Who does not know this never-varying refrain of all politicians?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.21.3
  kind: p
  original: That the mass bleeds, that it is being robbed and exploited, I know as well as our vote-baiters.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.21.4
  kind: p
  original: But I insist that not the handful of parasites, but the mass itself is responsible for this horrible state of affairs.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.21.5
  kind: p
  original: It clings to its masters, loves the whip, and is the first to cry Crucify! the moment a protesting voice is raised against the sacredness of capitalistic authority or any other decayed institution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.21.6
  kind: p
  original: Yet how long would authority and private property exist, if not for the willingness of the mass to become soldiers, policemen, jailers, and hangmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.21.7
  kind: p
  original: The Socialist demagogues know that as well as I, but they maintain the myth of the virtues of the majority, because their very scheme of life means the perpetuation of power.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.21.8
  kind: p
  original: And how could the latter be acquired without numbers?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.21.9
  kind: p
  original: Yes, power, authority, coercion, and dependence rest on the mass, but never freedom, never the free unfoldment of the individual, never the birth of a free society.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.22.1
  kind: p
  original: Not because I do not feel with the oppressed, the disinherited of the earth; not because I do not know the shame, the horror, the indignity of the lives the people lead, do I repudiate the majority as a creative force for good.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.22.2
  kind: p
  original: Oh, no, no!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.22.3
  kind: p
  original: But because I know so well that as a compact mass it has never stood for justice or equality.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.22.4
  kind: p
  original: It has suppressed the human voice, subdued the human spirit, chained the human body.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.22.5
  kind: p
  original: As a mass its aim has always been to make life uniform, gray, and monotonous as the desert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.22.6
  kind: p
  original: As a mass it will always be the annihilator of individuality, of free initiative, of originality.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.22.7
  kind: p
  original: I therefore believe with Emerson that "the masses are crude, lame, pernicious in their demands and influence, and need not to be flattered, but to be schooled.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.22.8
  kind: p
  original: I wish not to concede anything to them, but to drill, divide, and break them up, and draw individuals out of them.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.22.9
  kind: p
  original: Masses!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.22.10
  kind: p
  original: The calamity are the masses.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.22.11
  kind: p
  original: I do not wish any mass at all, but honest men only, lovely, sweet, accomplished women only."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.23.1
  kind: p
  original: In other words, the living, vital truth of social and economic well-being will become a reality only through the zeal, courage, the non-compromising determination of intelligent minorities, and not through the mass.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N1.1.1
  kind: note
  original: The intellectuals.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
