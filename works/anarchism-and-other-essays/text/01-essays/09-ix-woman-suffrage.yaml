# Master file. Edit the `modern` and `notes` fields; see CONTRIBUTING.md.
# Verse ids are frozen. Never renumber; see VERSIFICATION.md.
section: IX
title_original: Woman Suffrage
title_en: Woman Suffrage
author: Emma Goldman
date: '1910'
original_language: en
anchor_language: en
source_original: 'Emma Goldman, Anarchism and Other Essays, with a biographic sketch by Hippolyte Havel (New York: Mother Earth Publishing Association, 1910), public domain; Project Gutenberg ebook 2162'
source_en: 'None needed: the original is in English'
verses:
- id: IX.0.1
  kind: heading
  original: Woman Suffrage
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.1.1
  kind: p
  original: We boast of the age of advancement, of science, and progress.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.1.2
  kind: p
  original: Is it not strange, then, that we still believe in fetich worship?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.1.3
  kind: p
  original: True, our fetiches have different form and substance, yet in their power over the human mind they are still as disastrous as were those of old.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.2.1
  kind: p
  original: Our modern fetich is universal suffrage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.2.2
  kind: p
  original: Those who have not yet achieved that goal fight bloody revolutions to obtain it, and those who have enjoyed its reign bring heavy sacrifice to the altar of this omnipotent deity.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.2.3
  kind: p
  original: Woe to the heretic who dare question that divinity!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.3.1
  kind: p
  original: Woman, even more than man, is a fetich worshipper, and though her idols may change, she is ever on her knees, ever holding up her hands, ever blind to the fact that her god has feet of clay.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.3.2
  kind: p
  original: Thus woman has been the greatest supporter of all deities from time immemorial.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.3.3
  kind: p
  original: Thus, too, she has had to pay the price that only gods can exact,--her freedom, her heart's blood, her very life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.4.1
  kind: p
  original: Nietzsche's memorable maxim, "When you go to woman, take the whip along," is considered very brutal, yet Nietzsche expressed in one sentence the attitude of woman towards her gods.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.5.1
  kind: p
  original: Religion, especially the Christian religion, has condemned woman to the life of an inferior, a slave.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.5.2
  kind: p
  original: It has thwarted her nature and fettered her soul, yet the Christian religion has no greater supporter, none more devout, than woman.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.5.3
  kind: p
  original: Indeed, it is safe to say that religion would have long ceased to be a factor in the lives of the people, if it were not for the support it receives from woman.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.5.4
  kind: p
  original: The most ardent churchworkers, the most tireless missionaries the world over, are women, always sacrificing on the altar of the gods that have chained her spirit and enslaved her body.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.6.1
  kind: p
  original: The insatiable monster, war, robs woman of all that is dear and precious to her.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.6.2
  kind: p
  original: It exacts her brothers, lovers, sons, and in return gives her a life of loneliness and despair.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.6.3
  kind: p
  original: Yet the greatest supporter and worshiper of war is woman.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.6.4
  kind: p
  original: She it is who instills the love of conquest and power into her children; she it is who whispers the glories of war into the ears of her little ones, and who rocks her baby to sleep with the tunes of trumpets and the noise of guns.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.6.5
  kind: p
  original: It is woman, too, who crowns the victor on his return from the battlefield.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.6.6
  kind: p
  original: Yes, it is woman who pays the highest price to that insatiable monster, war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.7.1
  kind: p
  original: Then there is the home.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.7.2
  kind: p
  original: What a terrible fetich it is!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.7.3
  kind: p
  original: How it saps the very life-energy of woman,--this modern prison with golden bars.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.7.4
  kind: p
  original: Its shining aspect blinds woman to the price she would have to pay as wife, mother, and housekeeper.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.7.5
  kind: p
  original: Yet woman clings tenaciously to the home, to the power that holds her in bondage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.8.1
  kind: p
  original: It may be said that because woman recognizes the awful toll she is made to pay to the Church, State, and the home, she wants suffrage to set herself free.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.8.2
  kind: p
  original: That may be true of the few; the majority of suffragists repudiate utterly such blasphemy.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.8.3
  kind: p
  original: On the contrary, they insist always that it is woman suffrage which will make her a better Christian and homekeeper, a staunch citizen of the State.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.8.4
  kind: p
  original: Thus suffrage is only a means of strengthening the omnipotence of the very Gods that woman has served from time immemorial.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.9.1
  kind: p
  original: What wonder, then, that she should be just as devout, just as zealous, just as prostrate before the new idol, woman suffrage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.9.2
  kind: p
  original: As of old, she endures persecution, imprisonment, torture, and all forms of condemnation, with a smile on her face.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.9.3
  kind: p
  original: As of old, the most enlightened, even, hope for a miracle from the twentieth century deity,--suffrage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.9.4
  kind: p
  original: Life, happiness, joy, freedom, independence,--all that, and more, is to spring from suffrage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.9.5
  kind: p
  original: 'In her blind devotion woman does not see what people of intellect perceived fifty years ago: that suffrage is an evil, that it has only helped to enslave people, that it has but closed their eyes that they may not see how craftily they were made to submit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.10.1
  kind: p
  original: Woman's demand for equal suffrage is based largely on the contention that woman must have the equal right in all affairs of society.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.10.2
  kind: p
  original: No one could, possibly, refute that, if suffrage were a right.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.10.3
  kind: p
  original: Alas, for the ignorance of the human mind, which can see a right in an imposition.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.10.4
  kind: p
  original: Or is it not the most brutal imposition for one set of people to make laws that another set is coerced by force to obey?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.10.5
  kind: p
  original: Yet woman clamors for that "golden opportunity" that has wrought so much misery in the world, and robbed man of his integrity and self-reliance; an imposition which has thoroughly corrupted the people, and made them absolute prey in the hands of unscrupulous politicians.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.11.1
  kind: p
  original: The poor, stupid, free American citizen!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.11.2
  kind: p
  original: Free to starve, free to tramp the highways of this great country, he enjoys universal suffrage, and, by that right, he has forged chains about his limbs.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.11.3
  kind: p
  original: The reward that he receives is stringent labor laws prohibiting the right of boycott, of picketing, in fact, of everything, except the right to be robbed of the fruits of his labor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.11.4
  kind: p
  original: Yet all these disastrous results of the twentieth century fetich have taught woman nothing.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.11.5
  kind: p
  original: But, then, woman will purify politics, we are assured.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.12.1
  kind: p
  original: Needless to say, I am not opposed to woman suffrage on the conventional ground that she is not equal to it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.12.2
  kind: p
  original: I see neither physical, psychological, nor mental reasons why woman should not have the equal right to vote with man.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.12.3
  kind: p
  original: But that can not possibly blind me to the absurd notion that woman will accomplish that wherein man has failed.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.12.4
  kind: p
  original: If she would not make things worse, she certainly could not make them better.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.12.5
  kind: p
  original: To assume, therefore, that she would succeed in purifying something which is not susceptible of purification, is to credit her with supernatural powers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.12.6
  kind: p
  original: Since woman's greatest misfortune has been that she was looked upon as either angel or devil, her true salvation lies in being placed on earth; namely, in being considered human, and therefore subject to all human follies and mistakes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.12.7
  kind: p
  original: Are we, then, to believe that two errors will make a right?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.12.8
  kind: p
  original: Are we to assume that the poison already inherent in politics will be decreased, if women were to enter the political arena?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.12.9
  kind: p
  original: The most ardent suffragists would hardly maintain such a folly.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.13.1
  kind: p
  original: As a matter of fact, the most advanced students of universal suffrage have come to realize that all existing systems of political power are absurd, and are completely inadequate to meet the pressing issues of life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.13.2
  kind: p
  original: This view is also borne out by a statement of one who is herself an ardent believer in woman suffrage, Dr. Helen L. Sumner.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.13.3
  kind: p
  original: 'In her able work on EQUAL SUFFRAGE, she says: "In Colorado, we find that equal suffrage serves to show in the most striking way the essential rottenness and degrading character of the existing system."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.13.4
  kind: p
  original: Of course, Dr. Sumner has in mind a particular system of voting, but the same applies with equal force to the entire machinery of the representative system.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.13.5
  kind: p
  original: With such a basis, it is difficult to understand how woman, as a political factor, would benefit either herself or the rest of mankind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.14.1
  kind: p
  original: But, say our suffrage devotees, look at the countries and States where female suffrage exists.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.14.2
  kind: p
  original: See what woman has accomplished--in Australia, New Zealand, Finland, the Scandinavian countries, and in our own four States, Idaho, Colorado, Wyoming, and Utah.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.14.3
  kind: p
  original: Distance lends enchantment--or, to quote a Polish formula--"it is well where we are not."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.14.4
  kind: p
  original: Thus one would assume that those countries and States are unlike other countries or States, that they have greater freedom, greater social and economic equality, a finer appreciation of human life, deeper understanding of the great social struggle, with all the vital questions it involves for the human race.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.15.1
  kind: p
  original: The women of Australia and New Zealand can vote, and help make the laws.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.15.2
  kind: p
  original: Are the labor conditions better there than they are in England, where the suffragettes are making such a heroic struggle?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.15.3
  kind: p
  original: Does there exist a greater motherhood, happier and freer children than in England?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.15.4
  kind: p
  original: Is woman there no longer considered a mere sex commodity?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.15.5
  kind: p
  original: Has she emancipated herself from the Puritanical double standard of morality for men and women?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.15.6
  kind: p
  original: Certainly none but the ordinary female stump politician will dare answer these questions in the affirmative.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.15.7
  kind: p
  original: If that be so, it seems ridiculous to point to Australia and New Zealand as the Mecca of equal suffrage accomplishments.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.16.1
  kind: p
  original: On the other hand, it is a fact to those who know the real political conditions in Australia, that politics have gagged labor by enacting the most stringent labor laws, making strikes without the sanction of an arbitration committee a crime equal to treason.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.17.1
  kind: p
  original: Not for a moment do I mean to imply that woman suffrage is responsible for this state of affairs.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.17.2
  kind: p
  original: I do mean, however, that there is no reason to point to Australia as a wonder-worker of woman's accomplishment, since her influence has been unable to free labor from the thralldom of political bossism.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.18.1
  kind: p
  original: Finland has given woman equal suffrage; nay, even the right to sit in Parliament.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.18.2
  kind: p
  original: Has that helped to develop a greater heroism, an intenser zeal than that of the women of Russia?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.18.3
  kind: p
  original: Finland, like Russia, smarts under the terrible whip of the bloody Tsar.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.18.4
  kind: p
  original: Where are the Finnish Perovskaias, Spiridonovas, Figners, Breshkovskaias?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.18.5
  kind: p
  original: Where are the countless numbers of Finnish young girls who cheerfully go to Siberia for their cause?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.18.6
  kind: p
  original: Finland is sadly in need of heroic liberators.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.18.7
  kind: p
  original: Why has the ballot not created them?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.18.8
  kind: p
  original: The only Finnish avenger of his people was a man, not a woman, and he used a more effective weapon than the ballot.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.19.1
  kind: p
  original: As to our own States where women vote, and which are constantly being pointed out as examples of marvels, what has been accomplished there through the ballot that women do not to a large extent enjoy in other States; or that they could not achieve through energetic efforts without the ballot?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.1
  kind: p
  original: True, in the suffrage States women are guaranteed equal rights to property; but of what avail is that right to the mass of women without property, the thousands of wage workers, who live from hand to mouth?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.2
  kind: p
  original: That equal suffrage did not, and cannot, affect their condition is admitted even by Dr. Sumner, who certainly is in a position to know.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.3
  kind: p
  original: As an ardent suffragist, and having been sent to Colorado by the Collegiate Equal Suffrage League of New York State to collect material in favor of suffrage, she would be the last to say anything derogatory; yet we are informed that "equal suffrage has but slightly affected the economic conditions of women.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.4
  kind: p
  original: That women do not receive equal pay for equal work, and that, though woman in Colorado has enjoyed school suffrage since 1876, women teachers are paid less than in California."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.5
  kind: p
  original: On the other hand, Miss Sumner fails to account for the fact that although women have had school suffrage for thirty-four years, and equal suffrage since 1894, the census in Denver alone a few months ago disclosed the fact of fifteen thousand defective school children.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.6
  kind: p
  original: And that, too, with mostly women in the educational department, and also notwithstanding that women in Colorado have passed the "most stringent laws for child and animal protection."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.7
  kind: p
  original: The women of Colorado "have taken great interest in the State institutions for the care of dependent, defective, and delinquent children."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.8
  kind: p
  original: What a horrible indictment against woman's care and interest, if one city has fifteen thousand defective children.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.9
  kind: p
  original: What about the glory of woman suffrage, since it has failed utterly in the most important social issue, the child?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.10
  kind: p
  original: And where is the superior sense of justice that woman was to bring into the political field?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.11
  kind: p
  original: Where was it in 1903, when the mine owners waged a guerilla war against the Western Miners' Union; when General Bell established a reign of terror, pulling men out of beds at night, kidnapping them across the border line, throwing them into bull pens, declaring "to hell with the Constitution, the club is the Constitution"?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.12
  kind: p
  original: Where were the women politicians then, and why did they not exercise the power of their vote?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.13
  kind: p
  original: But they did.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.14
  kind: p
  original: They helped to defeat the most fair-minded and liberal man, Governor Waite.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.15
  kind: p
  original: The latter had to make way for the tool of the mine kings, Governor Peabody, the enemy of labor, the Tsar of Colorado.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.16
  kind: p
  original: '"Certainly male suffrage could have done nothing worse."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.17
  kind: p
  original: Granted.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.18
  kind: p
  original: Wherein, then, are the advantages to woman and society from woman suffrage?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.19
  kind: p
  original: The oft-repeated assertion that woman will purify politics is also but a myth.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.20
  kind: p
  original: It is not borne out by the people who know the political conditions of Idaho, Colorado, Wyoming, and Utah.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.21.1
  kind: p
  original: Woman, essentially a purist, is naturally bigotted and relentless in her effort to make others as good as she thinks they ought to be.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.21.2
  kind: p
  original: Thus, in Idaho, she has disfranchised her sister of the street, and declared all women of "lewd character" unfit to vote.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.21.3
  kind: p
  original: '"Lewd" not being interpreted, of course, as prostitution IN marriage.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.21.4
  kind: p
  original: It goes without saying that illegal prostitution and gambling have been prohibited.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.21.5
  kind: p
  original: 'In this regard the law must needs be of feminine nature: it always prohibits.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.21.6
  kind: p
  original: Therein all laws are wonderful.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.21.7
  kind: p
  original: They go no further, but their very tendencies open all the floodgates of hell.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.21.8
  kind: p
  original: Prostitution and gambling have never done a more flourishing business than since the law has been set against them.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.22.1
  kind: p
  original: In Colorado, the Puritanism of woman has expressed itself in a more drastic form.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.22.2
  kind: p
  original: '"Men of notoriously unclean lives, and men connected with saloons, have been dropped from politics since women have the vote."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IX.N1
- id: IX.22.3
  kind: p
  original: Could brother Comstock do more?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.22.4
  kind: p
  original: Could all the Puritan fathers have done more?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.22.5
  kind: p
  original: I wonder how many women realize the gravity of this would-be feat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.22.6
  kind: p
  original: I wonder if they understand that it is the very thing which, instead of elevating woman, has made her a political spy, a contemptible pry into the private affairs of people, not so much for the good of the cause, but because, as a Colorado woman said, "they like to get into houses they have never been in, and find out all they can, politically and otherwise."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IX.N2
- id: IX.22.7
  kind: p
  original: Yes, and into the human soul and its minutest nooks and corners.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.22.8
  kind: p
  original: For nothing satisfies the craving of most women so much as scandal.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.22.9
  kind: p
  original: And when did she ever enjoy such opportunities as are hers, the politician's?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.23.1
  kind: p
  original: '"Notoriously unclean lives, and men connected with the saloons."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.23.2
  kind: p
  original: Certainly, the lady vote gatherers can not be accused of much sense of proportion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.23.3
  kind: p
  original: Granting even that these busybodies can decide whose lives are clean enough for that eminently clean atmosphere, politics, must it follow that saloon-keepers belong to the same category?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.23.4
  kind: p
  original: Unless it be American hypocrisy and bigotry, so manifest in the principle of Prohibition, which sanctions the spread of drunkenness among men and women of the rich class, yet keeps vigilant watch on the only place left to the poor man.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.23.5
  kind: p
  original: If no other reason, woman's narrow and purist attitude toward life makes her a greater danger to liberty wherever she has political power.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.23.6
  kind: p
  original: Man has long overcome the superstitions that still engulf woman.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.23.7
  kind: p
  original: In the economic competitive field, man has been compelled to exercise efficiency, judgment, ability, competency.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.23.8
  kind: p
  original: He therefore had neither time nor inclination to measure everyone's morality with a Puritanic yardstick.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.23.9
  kind: p
  original: In his political activities, too, he has not gone about blindfolded.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.23.10
  kind: p
  original: He knows that quantity and not quality is the material for the political grinding mill, and, unless he is a sentimental reformer or an old fossil, he knows that politics can never be anything but a swamp.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.24.1
  kind: p
  original: Women who are at all conversant with the process of politics, know the nature of the beast, but in their self-sufficiency and egotism they make themselves believe that they have but to pet the beast, and he will become as gentle as a lamb, sweet and pure.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.24.2
  kind: p
  original: As if women have not sold their votes, as if women politicians can not be bought!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.24.3
  kind: p
  original: If her body can be bought in return for material consideration, why not her vote?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.24.4
  kind: p
  original: That it is being done in Colorado and in other States, is not denied even by those in favor of woman suffrage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.25.1
  kind: p
  original: As I have said before, woman's narrow view of human affairs is not the only argument against her as a politician superior to man.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.25.2
  kind: p
  original: There are others.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.25.3
  kind: p
  original: Her life-long economic parasitism has utterly blurred her conception of the meaning of equality.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.25.4
  kind: p
  original: She clamors for equal rights with men, yet we learn that "few women care to canvas in undesirable districts."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IX.N3
- id: IX.25.5
  kind: p
  original: How little equality means to them compared with the Russian women, who face hell itself for their ideal!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.26.1
  kind: p
  original: 'Woman demands the same rights as man, yet she is indignant that her presence does not strike him dead: he smokes, keeps his hat on, and does not jump from his seat like a flunkey.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.26.2
  kind: p
  original: These may be trivial things, but they are nevertheless the key to the nature of American suffragists.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.26.3
  kind: p
  original: To be sure, their English sisters have outgrown these silly notions.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.26.4
  kind: p
  original: They have shown themselves equal to the greatest demands on their character and power of endurance.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.26.5
  kind: p
  original: All honor to the heroism and sturdiness of the English suffragettes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.26.6
  kind: p
  original: Thanks to their energetic, aggressive methods, they have proved an inspiration to some of our own lifeless and spineless ladies.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.26.7
  kind: p
  original: But after all, the suffragettes, too, are still lacking in appreciation of real equality.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.26.8
  kind: p
  original: Else how is one to account for the tremendous, truly gigantic effort set in motion by those valiant fighters for a wretched little bill which will benefit a handful of propertied ladies, with absolutely no provision for the vast mass of workingwomen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.26.9
  kind: p
  original: True, as politicians they must be opportunists, must take half measures if they can not get all.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.26.10
  kind: p
  original: But as intelligent and liberal women they ought to realize that if the ballot is a weapon, the disinherited need it more than the economically superior class, and that the latter already enjoy too much power by virtue of their economic superiority.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.27.1
  kind: p
  original: The brilliant leader of the English suffragettes, Mrs. Emmeline Pankhurst, herself admitted, when on her American lecture tour, that there can be no equality between political superiors and inferiors.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.27.2
  kind: p
  original: If so, how will the workingwoman of England, already inferior economically to the ladies who are benefited by the Shackleton bill, be able to work with their political superiors, should the bill pass?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IX.N4
- id: IX.27.3
  kind: p
  original: Is it not probable that the class of Annie Keeney, so full of zeal, devotion, and martyrdom, will be compelled to carry on their backs their female political bosses, even as they are carrying their economic masters.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.27.4
  kind: p
  original: They would still have to do it, were universal suffrage for men and women established in England.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.27.5
  kind: p
  original: No matter what the workers do, they are made to pay, always.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.27.6
  kind: p
  original: Still, those who believe in the power of the vote show little sense of justice when they concern themselves not at all with those whom, as they claim, it might serve most.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.28.1
  kind: p
  original: The American suffrage movement has been, until very recently, altogether a parlor affair, absolutely detached from the economic needs of the people.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.28.2
  kind: p
  original: Thus Susan B. Anthony, no doubt an exceptional type of woman, was not only indifferent but antagonistic to labor; nor did she hesitate to manifest her antagonism when, in 1869, she advised women to take the places of striking printers in New York.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IX.N5
- id: IX.28.3
  kind: p
  original: I do not know whether her attitude had changed before her death.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.29.1
  kind: p
  original: There are, of course, some suffragists who are affiliated with workingwomen--the Women's Trade Union League, for instance; but they are a small minority, and their activities are essentially economic.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.29.2
  kind: p
  original: The rest look upon toil as a just provision of Providence.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.29.3
  kind: p
  original: What would become of the rich, if not for the poor?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.29.4
  kind: p
  original: What would become of these idle, parasitic ladies, who squander more in a week than their victims earn in a year, if not for the eighty million wage workers?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.29.5
  kind: p
  original: Equality, who ever heard of such a thing?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.30.1
  kind: p
  original: Few countries have produced such arrogance and snobbishness as America.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.30.2
  kind: p
  original: Particularly this is true of the American woman of the middle class.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.30.3
  kind: p
  original: She not only considers herself the equal of man, but his superior, especially in her purity, goodness, and morality.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.30.4
  kind: p
  original: Small wonder that the American suffragist claims for her vote the most miraculous powers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.30.5
  kind: p
  original: In her exalted conceit she does not see how truly enslaved she is, not so much by man, as by her own silly notions and traditions.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.30.6
  kind: p
  original: Suffrage can not ameliorate that sad fact; it can only accentuate it, as indeed it does.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.31.1
  kind: p
  original: One of the great American women leaders claims that woman is entitled not only to equal pay, but that she ought to be legally entitled even to the pay of her husband.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.31.2
  kind: p
  original: Failing to support her, he should be put in convict stripes, and his earnings in prison be collected by his equal wife.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.31.3
  kind: p
  original: Does not another brilliant exponent of the cause claim for woman that her vote will abolish the social evil, which has been fought in vain by the collective efforts of the most illustrious minds the world over?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.31.4
  kind: p
  original: It is indeed to be regretted that the alleged creator of the universe has already presented us with his wonderful scheme of things, else woman suffrage would surely enable woman to outdo him completely.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.32.1
  kind: p
  original: Nothing is so dangerous as the dissection of a fetich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.32.2
  kind: p
  original: If we have outlived the time when such heresy was punishable at the stake, we have not outlived the narrow spirit of condemnation of those who dare differ with accepted notions.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.32.3
  kind: p
  original: Therefore I shall probably be put down as an opponent of woman.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.32.4
  kind: p
  original: But that can not deter me from looking the question squarely in the face.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.32.5
  kind: p
  original: 'I repeat what I have said in the beginning: I do not believe that woman will make politics worse; nor can I believe that she could make it better.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.32.6
  kind: p
  original: If, then, she cannot improve on man's mistakes, why perpetuate the latter?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.33.1
  kind: p
  original: History may be a compilation of lies; nevertheless, it contains a few truths, and they are the only guide we have for the future.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.33.2
  kind: p
  original: The history of the political activities of men proves that they have given him absolutely nothing that he could not have achieved in a more direct, less costly, and more lasting manner.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.33.3
  kind: p
  original: As a matter of fact, every inch of ground he has gained has been through a constant fight, a ceaseless struggle for self-assertion, and not through suffrage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.33.4
  kind: p
  original: There is no reason whatever to assume that woman, in her climb to emancipation, has been, or will be, helped by the ballot.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.34.1
  kind: p
  original: In the darkest of all countries, Russia, with her absolute despotism, woman has become man's equal, not through the ballot, but by her will to be and to do.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.34.2
  kind: p
  original: 'Not only has she conquered for herself every avenue of learning and vocation, but she has won man''s esteem, his respect, his comradeship; aye, even more than that: she has gained the admiration, the respect of the whole world.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.34.3
  kind: p
  original: That, too, not through suffrage, but by her wonderful heroism, her fortitude, her ability, will power, and her endurance in the struggle for liberty.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.34.4
  kind: p
  original: Where are the women in any suffrage country or State that can lay claim to such a victory?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.34.5
  kind: p
  original: When we consider the accomplishments of woman in America, we find also that something deeper and more powerful than suffrage has helped her in the march to emancipation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.35.1
  kind: p
  original: It is just sixty-two years ago since a handful of women at the Seneca Falls Convention set forth a few demands for their right to equal education with men, and access to the various professions, trades, etc.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.35.2
  kind: p
  original: What wonderful accomplishment, what wonderful triumphs!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.35.3
  kind: p
  original: Who but the most ignorant dare speak of woman as a mere domestic drudge?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.35.4
  kind: p
  original: Who dare suggest that this or that profession should not be open to her?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.35.5
  kind: p
  original: For over sixty years she has molded a new atmosphere and a new life for herself.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.35.6
  kind: p
  original: She has become a world power in every domain of human thought and activity.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.35.7
  kind: p
  original: And all that without suffrage, without the right to make laws, without the "privilege" of becoming a judge, a jailer, or an executioner.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.36.1
  kind: p
  original: Yes, I may be considered an enemy of woman; but if I can help her see the light, I shall not complain.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.37.1
  kind: p
  original: The misfortune of woman is not that she is unable to do the work of man, but that she is wasting her life force to outdo him, with a tradition of centuries which has left her physically incapable of keeping pace with him.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.37.2
  kind: p
  original: Oh, I know some have succeeded, but at what cost, at what terrific cost!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.37.3
  kind: p
  original: The import is not the kind of work woman does, but rather the quality of the work she furnishes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.37.4
  kind: p
  original: She can give suffrage or the ballot no new quality, nor can she receive anything from it that will enhance her own quality.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.37.5
  kind: p
  original: Her development, her freedom, her independence, must come from and through herself.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.37.6
  kind: p
  original: First, by asserting herself as a personality, and not as a sex commodity.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.37.7
  kind: p
  original: Second, by refusing the right to anyone over her body; by refusing to bear children, unless she wants them; by refusing to be a servant to God, the State, society, the husband, the family, etc.; by making her life simpler, but deeper and richer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.37.8
  kind: p
  original: That is, by trying to learn the meaning and substance of life in all its complexities, by freeing herself from the fear of public opinion and public condemnation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.37.9
  kind: p
  original: Only that, and not the ballot, will set woman free, will make her a force hitherto unknown in the world, a force for real love, for peace, for harmony; a force of divine fire, of life giving; a creator of free men and women.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N1.1.1
  kind: note
  original: EQUAL SUFFRAGE. Dr. Helen Sumner.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N2.1.1
  kind: note
  original: EQUAL SUFFRAGE.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N3.1.1
  kind: note
  original: Dr. Helen A. Sumner.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N4.1.1
  kind: note
  original: Mr. Shackleton was a labor leader.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N4.1.2
  kind: note
  original: It is therefore self-evident that he should introduce a bill excluding his own constituents.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N4.1.3
  kind: note
  original: The English Parliament is full of such Judases.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N5.1.1
  kind: note
  original: EQUAL SUFFRAGE. Dr. Helen A. Sumner.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
