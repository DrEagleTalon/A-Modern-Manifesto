section: IV
title_original: 'Prisons: A Social Crime and Failure'
title_en: 'Prisons: A Social Crime and Failure'
author: Emma Goldman
date: '1910'
original_language: en
anchor_language: en
source_original: 'Emma Goldman, Anarchism and Other Essays, with a biographic sketch by Hippolyte Havel (New York: Mother Earth Publishing Association, 1910), public domain; Project Gutenberg ebook 2162'
source_en: 'None needed: the original is in English'
verses:
- id: IV.0.1
  kind: heading
  original: 'Prisons: A Social Crime and Failure'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.1.1
  kind: p
  original: 'In 1849, Feodor Dostoyevsky wrote on the wall of his prison cell the following story of THE PRIEST AND THE DEVIL:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.1
  kind: p
  original: '"''Hello, you little fat father!'' the devil said to the priest.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.2
  kind: p
  original: '''What made you lie so to those poor, misled people?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.3
  kind: p
  original: What tortures of hell did you depict?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.4
  kind: p
  original: Don't you know they are already suffering the tortures of hell in their earthly lives?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.5
  kind: p
  original: Don't you know that you and the authorities of the State are my representatives on earth?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.6
  kind: p
  original: It is you that make them suffer the pains of hell with which you threaten them.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.7
  kind: p
  original: Don't you know this?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.8
  kind: p
  original: Well, then, come with me!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.3.1
  kind: p
  original: '"The devil grabbed the priest by the collar, lifted him high in the air, and carried him to a factory, to an iron foundry.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.3.2
  kind: p
  original: He saw the workmen there running and hurrying to and fro, and toiling in the scorching heat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.3.3
  kind: p
  original: Very soon the thick, heavy air and the heat are too much for the priest.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.3.4
  kind: p
  original: 'With tears in his eyes, he pleads with the devil: ''Let me go!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.3.5
  kind: p
  original: Let me leave this hell!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.4.1
  kind: p
  original: '"''Oh, my dear friend, I must show you many more places.'''
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.4.2
  kind: p
  original: The devil gets hold of him again and drags him off to a farm.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.4.3
  kind: p
  original: There he sees workmen threshing the grain.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.4.4
  kind: p
  original: The dust and heat are insufferable.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.4.5
  kind: p
  original: The overseer carries a knout, and unmercifully beats anyone who falls to the ground overcome by hard toil or hunger.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.1
  kind: p
  original: '"Next the priest is taken to the huts where these same workers live with their families--dirty, cold, smoky, ill-smelling holes.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.2
  kind: p
  original: The devil grins.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.3
  kind: p
  original: He points out the poverty and hardships which are at home here.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.6.1
  kind: p
  original: '"''Well, isn''t this enough?'' he asks.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.6.2
  kind: p
  original: And it seems as if even he, the devil, pities the people.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.6.3
  kind: p
  original: The pious servant of God can hardly bear it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.6.4
  kind: p
  original: 'With uplifted hands he begs: ''Let me go away from here.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.6.5
  kind: p
  original: Yes, yes!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.6.6
  kind: p
  original: This is hell on earth!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.7.1
  kind: p
  original: '"''Well, then, you see.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.7.2
  kind: p
  original: And you still promise them another hell.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.7.3
  kind: p
  original: You torment them, torture them to death mentally when they are already all but dead physically!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.7.4
  kind: p
  original: Come on!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.7.5
  kind: p
  original: I will show you one more hell--one more, the very worst.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.8.1
  kind: p
  original: '"He took him to a prison and showed him a dungeon, with its foul air and the many human forms, robbed of all health and energy, lying on the floor, covered with vermin that were devouring their poor, naked, emaciated bodies.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.9.1
  kind: p
  original: '"''Take off your silken clothes,'' said the devil to the priest, ''put on your ankles heavy chains such as these unfortunates wear; lie down on the cold and filthy floor--and then talk to them about a hell that still awaits them!'''
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.10.1
  kind: p
  original: '"''No, no!'' answered the priest, ''I cannot think of anything more dreadful than this.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.10.2
  kind: p
  original: I entreat you, let me go away from here!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.11.1
  kind: p
  original: '"''Yes, this is hell.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.11.2
  kind: p
  original: There can be no worse hell than this.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.11.3
  kind: p
  original: Did you not know it?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.11.4
  kind: p
  original: Did you not know that these men and women whom you are frightening with the picture of a hell hereafter--did you not know that they are in hell right here, before they die?'"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.12.1
  kind: p
  original: This was written fifty years ago in dark Russia, on the wall of one of the most horrible prisons.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.12.2
  kind: p
  original: Yet who can deny that the same applies with equal force to the present time, even to American prisons?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.13.1
  kind: p
  original: With all our boasted reforms, our great social changes, and our far-reaching discoveries, human beings continue to be sent to the worst of hells, wherein they are outraged, degraded, and tortured, that society may be "protected" from the phantoms of its own making.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.1
  kind: p
  original: Prison, a social protection?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.2
  kind: p
  original: What monstrous mind ever conceived such an idea?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.3
  kind: p
  original: Just as well say that health can be promoted by a widespread contagion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.15.1
  kind: p
  original: 'After eighteen months of horror in an English prison, Oscar Wilde gave to the world his great masterpiece, THE BALLAD OF READING GAOL:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.1
  kind: p
  original: The vilest deeds, like poison weeds, / Bloom well in prison air; / It is only what is good in Man / That wastes and withers there. / Pale Anguish keeps the heavy gate, / And the Warder is Despair.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.17.1
  kind: p
  original: Society goes on perpetuating this poisonous air, not realizing that out of it can come naught but the most poisonous results.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.18.1
  kind: p
  original: We are spending at the present $3,500,000 per day, $1,000,095,000 per year, to maintain prison institutions, and that in a democratic country,--a sum almost as large as the combined output of wheat, valued at $750,000,000, and the output of coal, valued at $350,000,000.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.18.2
  kind: p
  original: Professor Bushnell of Washington, D.C., estimates the cost of prisons at $6,000,000,000 annually, and Dr. G. Frank Lydston, an eminent American writer on crime, gives $5,000,000,000 annually as a reasonable figure.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.18.3
  kind: p
  original: Such unheard-of expenditure for the purpose of maintaining vast armies of human beings caged up like wild beasts!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IV.N1
- id: IV.19.1
  kind: p
  original: Yet crimes are on the increase.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.19.2
  kind: p
  original: Thus we learn that in America there are four and a half times as many crimes to every million population today as there were twenty years ago.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.20.1
  kind: p
  original: The most horrible aspect is that our national crime is murder, not robbery, embezzlement, or rape, as in the South.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.20.2
  kind: p
  original: London is five times as large as Chicago, yet there are one hundred and eighteen murders annually in the latter city, while only twenty in London.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.20.3
  kind: p
  original: Nor is Chicago the leading city in crime, since it is only seventh on the list, which is headed by four Southern cities, and San Francisco and Los Angeles.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.20.4
  kind: p
  original: In view of such a terrible condition of affairs, it seems ridiculous to prate of the protection society derives from its prisons.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.21.1
  kind: p
  original: The average mind is slow in grasping a truth, but when the most thoroughly organized, centralized institution, maintained at an excessive national expense, has proven a complete social failure, the dullest must begin to question its right to exist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.21.2
  kind: p
  original: The time is past when we can be content with our social fabric merely because it is "ordained by divine right," or by the majesty of the law.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.22.1
  kind: p
  original: The widespread prison investigations, agitation, and education during the last few years are conclusive proof that men are learning to dig deep into the very bottom of society, down to the causes of the terrible discrepancy between social and individual life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.23.1
  kind: p
  original: Why, then, are prisons a social crime and a failure?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.23.2
  kind: p
  original: To answer this vital question it behooves us to seek the nature and cause of crimes, the methods employed in coping with them, and the effects these methods produce in ridding society of the curse and horror of crimes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.24.1
  kind: p
  original: 'First, as to the NATURE of crime:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.25.1
  kind: p
  original: Havelock Ellis divides crime into four phases, the political, the passional, the insane, and the occasional.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.25.2
  kind: p
  original: He says that the political criminal is the victim of an attempt of a more or less despotic government to preserve its own stability.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.25.3
  kind: p
  original: He is not necessarily guilty of an unsocial offense; he simply tries to overturn a certain political order which may itself be anti-social.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.25.4
  kind: p
  original: This truth is recognized all over the world, except in America where the foolish notion still prevails that in a Democracy there is no place for political criminals.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.25.5
  kind: p
  original: Yet John Brown was a political criminal; so were the Chicago Anarchists; so is every striker.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.25.6
  kind: p
  original: Consequently, says Havelock Ellis, the political criminal of our time or place may be the hero, martyr, saint of another age.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.25.7
  kind: p
  original: Lombroso calls the political criminal the true precursor of the progressive movement of humanity.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.26.1
  kind: p
  original: '"The criminal by passion is usually a man of wholesome birth and honest life, who under the stress of some great, unmerited wrong has wrought justice for himself."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IV.N2
- id: IV.27.1
  kind: p
  original: Mr. Hugh C. Weir, in THE MENACE OF THE POLICE, cites the case of Jim Flaherty, a criminal by passion, who, instead of being saved by society, is turned into a drunkard and a recidivist, with a ruined and poverty-stricken family as the result.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.28.1
  kind: p
  original: A more pathetic type is Archie, the victim in Brand Whitlock's novel, THE TURN OF THE BALANCE, the greatest American expose of crime in the making.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.28.2
  kind: p
  original: Archie, even more than Flaherty, was driven to crime and death by the cruel inhumanity of his surroundings, and by the unscrupulous hounding of the machinery of the law.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.28.3
  kind: p
  original: Archie and Flaherty are but the types of many thousands, demonstrating how the legal aspects of crime, and the methods of dealing with it, help to create the disease which is undermining our entire social life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.29.1
  kind: p
  original: '"The insane criminal really can no more be considered a criminal than a child, since he is mentally in the same condition as an infant or an animal."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IV.N3
- id: IV.30.1
  kind: p
  original: The law already recognizes that, but only in rare cases of a very flagrant nature, or when the culprit's wealth permits the luxury of criminal insanity.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.30.2
  kind: p
  original: It has become quite fashionable to be the victim of paranoia.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.30.3
  kind: p
  original: But on the whole the "sovereignty of justice" still continues to punish criminally insane with the whole severity of its power.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.30.4
  kind: p
  original: Thus Mr. Ellis quotes from Dr. Richter's statistics showing that in Germany, one hundred and six madmen, out of one hundred and forty-four criminal insane, were condemned to severe punishment.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.31.1
  kind: p
  original: The occasional criminal "represents by far the largest class of our prison population, hence is the greatest menace to social well-being."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.31.2
  kind: p
  original: What is the cause that compels a vast army of the human family to take to crime, to prefer the hideous life within prison walls to the life outside?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.31.3
  kind: p
  original: Certainly that cause must be an iron master, who leaves its victims no avenue of escape, for the most depraved human being loves liberty.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.32.1
  kind: p
  original: This terrific force is conditioned in our cruel social and economic arrangement.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.32.2
  kind: p
  original: I do not mean to deny the biologic, physiologic, or psychologic factors in creating crime; but there is hardly an advanced criminologist who will not concede that the social and economic influences are the most relentless, the most poisonous germs of crime.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.32.3
  kind: p
  original: Granted even that there are innate criminal tendencies, it is none the less true that these tendencies find rich nutrition in our social environment.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.33.1
  kind: p
  original: There is close relation, says Havelock Ellis, between crimes against the person and the price of alcohol, between crimes against property and the price of wheat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.33.2
  kind: p
  original: He quotes Quetelet and Lacassagne, the former looking upon society as the preparer of crime, and the criminals as instruments that execute them.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.33.3
  kind: p
  original: The latter find that "the social environment is the cultivation medium of criminality; that the criminal is the microbe, an element which only becomes important when it finds the medium which causes it to ferment; EVERY SOCIETY HAS THE CRIMINALS IT DESERVES."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IV.N4
- id: IV.34.1
  kind: p
  original: The most "prosperous" industrial period makes it impossible for the worker to earn enough to keep up health and vigor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.34.2
  kind: p
  original: And as prosperity is, at best, an imaginary condition, thousands of people are constantly added to the host of the unemployed.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.34.3
  kind: p
  original: From East to West, from South to North, this vast army tramps in search of work or food, and all they find is the workhouse or the slums.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.34.4
  kind: p
  original: Those who have a spark of self-respect left, prefer open defiance, prefer crime to the emaciated, degraded position of poverty.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.35.1
  kind: p
  original: Edward Carpenter estimates that five-sixths of indictable crimes consist in some violation of property rights; but that is too low a figure.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.35.2
  kind: p
  original: A thorough investigation would prove that nine crimes out of ten could be traced, directly or indirectly, to our economic and social iniquities, to our system of remorseless exploitation and robbery.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.35.3
  kind: p
  original: There is no criminal so stupid but recognizes this terrible fact, though he may not be able to account for it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.36.1
  kind: p
  original: A collection of criminal philosophy, which Havelock Ellis, Lombroso, and other eminent men have compiled, shows that the criminal feels only too keenly that it is society that drives him to crime.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.36.2
  kind: p
  original: 'A Milanese thief said to Lombroso: "I do not rob, I merely take from the rich their superfluities; besides, do not advocates and merchants rob?"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.36.3
  kind: p
  original: 'A murderer wrote: "Knowing that three-fourths of the social virtues are cowardly vices, I thought an open assault on a rich man would be less ignoble than the cautious combination of fraud."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.36.4
  kind: p
  original: 'Another wrote: "I am imprisoned for stealing a half dozen eggs.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.36.5
  kind: p
  original: Ministers who rob millions are honored.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.36.6
  kind: p
  original: Poor Italy!"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.36.7
  kind: p
  original: 'An educated convict said to Mr. Davitt: "The laws of society are framed for the purpose of securing the wealth of the world to power and calculation, thereby depriving the larger portion of mankind of its rights and chances.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.36.8
  kind: p
  original: Why should they punish me for taking by somewhat similar means from those who have taken more than they had a right to?"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.36.9
  kind: p
  original: 'The same man added: "Religion robs the soul of its independence; patriotism is the stupid worship of the world for which the well-being and the peace of the inhabitants were sacrificed by those who profit by it, while the laws of the land, in restraining natural desires, were waging war on the manifest spirit of the law of our beings.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.36.10
  kind: p
  original: Compared with this," he concluded, "thieving is an honorable pursuit."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IV.N5
- id: IV.37.1
  kind: p
  original: Verily, there is greater truth in this philosophy than in all the law-and-moral books of society.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.38.1
  kind: p
  original: The economic, political, moral, and physical factors being the microbes of crime, how does society meet the situation?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.39.1
  kind: p
  original: The methods of coping with crime have no doubt undergone several changes, but mainly in a theoretic sense.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.39.2
  kind: p
  original: In practice, society has retained the primitive motive in dealing with the offender; that is, revenge.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.39.3
  kind: p
  original: It has also adopted the theologic idea; namely, punishment; while the legal and "civilized" methods consist of deterrence or terror, and reform.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.39.4
  kind: p
  original: We shall presently see that all four modes have failed utterly, and that we are today no nearer a solution than in the dark ages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.40.1
  kind: p
  original: The natural impulse of the primitive man to strike back, to avenge a wrong, is out of date.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.40.2
  kind: p
  original: Instead, the civilized man, stripped of courage and daring, has delegated to an organized machinery the duty of avenging his wrongs, in the foolish belief that the State is justified in doing what he no longer has the manhood or consistency to do.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.40.3
  kind: p
  original: The majesty-of-the-law is a reasoning thing; it would not stoop to primitive instincts.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.40.4
  kind: p
  original: Its mission is of a "higher" nature.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.40.5
  kind: p
  original: True, it is still steeped in the theologic muddle, which proclaims punishment as a means of purification, or the vicarious atonement of sin.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.40.6
  kind: p
  original: But legally and socially the statute exercises punishment, not merely as an infliction of pain upon the offender, but also for its terrifying effect upon others.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.41.1
  kind: p
  original: What is the real basis of punishment, however?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.41.2
  kind: p
  original: The notion of a free will, the idea that man is at all times a free agent for good or evil; if he chooses the latter, he must be made to pay the price.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.41.3
  kind: p
  original: Although this theory has long been exploded, and thrown upon the dustheap, it continues to be applied daily by the entire machinery of government, turning it into the most cruel and brutal tormentor of human life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.41.4
  kind: p
  original: The only reason for its continuance is the still more cruel notion that the greater the terror punishment spreads, the more certain its preventative effect.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.42.1
  kind: p
  original: Society is using the most drastic methods in dealing with the social offender.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.42.2
  kind: p
  original: Why do they not deter?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.42.3
  kind: p
  original: Although in America a man is supposed to be considered innocent until proven guilty, the instruments of law, the police, carry on a reign of terror, making indiscriminate arrests, beating, clubbing, bullying people, using the barbarous method of the "third degree," subjecting their unfortunate victims to the foul air of the station house, and the still fouler language of its guardians.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.42.4
  kind: p
  original: Yet crimes are rapidly multiplying, and society is paying the price.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.42.5
  kind: p
  original: On the other hand, it is an open secret that when the unfortunate citizen has been given the full "mercy" of the law, and for the sake of safety is hidden in the worst of hells, his real Calvary begins.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.42.6
  kind: p
  original: Robbed of his rights as a human being, degraded to a mere automaton without will or feeling, dependent entirely upon the mercy of brutal keepers, he daily goes through a process of dehumanization, compared with which savage revenge was mere child's play.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.43.1
  kind: p
  original: There is not a single penal institution or reformatory in the United States where men are not tortured "to be made good," by means of the blackjack, the club, the straightjacket, the water-cure, the "humming bird" (an electrical contrivance run along the human body), the solitary, the bullring, and starvation diet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.43.2
  kind: p
  original: In these institutions his will is broken, his soul degraded, his spirit subdued by the deadly monotony and routine of prison life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.43.3
  kind: p
  original: In Ohio, Illinois, Pennsylvania, Missouri, and in the South, these horrors have become so flagrant as to reach the outside world, while in most other prisons the same Christian methods still prevail.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.43.4
  kind: p
  original: But prison walls rarely allow the agonized shrieks of the victims to escape--prison walls are thick, they dull the sound.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.43.5
  kind: p
  original: Society might with greater immunity abolish all prisons at once, than to hope for protection from these twentieth century chambers of horrors.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.44.1
  kind: p
  original: Year after year the gates of prison hells return to the world an emaciated, deformed, willless, ship-wrecked crew of humanity, with the Cain mark on their foreheads, their hopes crushed, all their natural inclinations thwarted.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.44.2
  kind: p
  original: With nothing but hunger and inhumanity to greet them, these victims soon sink back into crime as the only possibility of existence.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.44.3
  kind: p
  original: It is not at all an unusual thing to find men and women who have spent half their lives--nay, almost their entire existence--in prison.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.44.4
  kind: p
  original: I know a woman on Blackwell's Island, who had been in and out thirty-eight times; and through a friend I learn that a young boy of seventeen, whom he had nursed and cared for in the Pittsburg penitentiary, had never known the meaning of liberty.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.44.5
  kind: p
  original: From the reformatory to the penitentiary had been the path of this boy's life, until, broken in body, he died a victim of social revenge.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.44.6
  kind: p
  original: These personal experiences are substantiated by extensive data giving overwhelming proof of the utter futility of prisons as a means of deterrence or reform.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.45.1
  kind: p
  original: Well-meaning persons are now working for a new departure in the prison question,--reclamation, to restore once more to the prisoner the possibility of becoming a human being.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.45.2
  kind: p
  original: Commendable as this is, I fear it is impossible to hope for good results from pouring good wine into a musty bottle.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.45.3
  kind: p
  original: Nothing short of a complete reconstruction of society will deliver mankind from the cancer of crime.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.45.4
  kind: p
  original: Still, if the dull edge of our social conscience would be sharpened, the penal institutions might be given a new coat of varnish.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.45.5
  kind: p
  original: But the first step to be taken is the renovation of the social consciousness, which is in a rather dilapidated condition.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.45.6
  kind: p
  original: It is sadly in need to be awakened to the fact that crime is a question of degree, that we all have the rudiments of crime in us, more or less, according to our mental, physical, and social environment; and that the individual criminal is merely a reflex of the tendencies of the aggregate.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.46.1
  kind: p
  original: With the social consciousness awakened, the average individual may learn to refuse the "honor" of being the bloodhound of the law.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.46.2
  kind: p
  original: He may cease to persecute, despise, and mistrust the social offender, and give him a chance to live and breathe among his fellows.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.46.3
  kind: p
  original: Institutions are, of course, harder to reach.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.46.4
  kind: p
  original: They are cold, impenetrable, and cruel; still, with the social consciousness quickened, it might be possible to free the prison victims from the brutality of prison officials, guards, and keepers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.46.5
  kind: p
  original: Public opinion is a powerful weapon; keepers of human prey, even, are afraid of it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.46.6
  kind: p
  original: They may be taught a little humanity, especially if they realize that their jobs depend upon it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.47.1
  kind: p
  original: But the most important step is to demand for the prisoner the right to work while in prison, with some monetary recompense that would enable him to lay aside a little for the day of his release, the beginning of a new life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.48.1
  kind: p
  original: It is almost ridiculous to hope much from present society when we consider that workingmen, wage slaves themselves, object to convict labor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.48.2
  kind: p
  original: I shall not go into the cruelty of this objection, but merely consider the impracticability of it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.48.3
  kind: p
  original: To begin with, the opposition so far raised by organized labor has been directed against windmills.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.48.4
  kind: p
  original: Prisoners have always worked; only the State has been their exploiter, even as the individual employer has been the robber of organized labor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.48.5
  kind: p
  original: The States have either set the convicts to work for the government, or they have farmed convict labor to private individuals.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.48.6
  kind: p
  original: Twenty-nine of the States pursue the latter plan.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.48.7
  kind: p
  original: The Federal government and seventeen States have discarded it, as have the leading nations of Europe, since it leads to hideous overworking and abuse of prisoners, and to endless graft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.49.1
  kind: p
  original: Rhode Island, the State dominated by Aldrich, offers perhaps the worst example.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.49.2
  kind: p
  original: Under a five-year contract, dated July 7th, 1906, and renewable for five years more at the option of private contractors, the labor of the inmates of the Rhode Island Penitentiary and the Providence County Jail is sold to the Reliance-Sterling Mfg. Co. at the rate of a trifle less than 25 cents a day per man.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.49.3
  kind: p
  original: This Company is really a gigantic Prison Labor Trust, for it also leases the convict labor of Connecticut, Michigan, Indiana, Nebraska, and South Dakota penitentiaries, and the reformatories of New Jersey, Indiana, Illinois, and Wisconsin, eleven establishments in all.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.50.1
  kind: p
  original: The enormity of the graft under the Rhode Island contract may be estimated from the fact that this same Company pays 62 1/2 cents a day in Nebraska for the convict's labor, and that Tennessee, for example, gets $1.10 a day for a convict's work from the Gray-Dudley Hardware Co.; Missouri gets 70 cents a day from the Star Overall Mfg. Co.; West Virginia 65 cents a day from the Kraft Mfg. Co., and Maryland 55 cents a day from Oppenheim, Oberndorf & Co., shirt manufacturers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.50.2
  kind: p
  original: The very difference in prices points to enormous graft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.50.3
  kind: p
  original: For example, the Reliance-Sterling Mfg. Co. manufactures shirts, the cost of free labor being not less than $1.20 per dozen, while it pays Rhode Island thirty cents a dozen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.50.4
  kind: p
  original: Furthermore, the State charges this Trust no rent for the use of its huge factory, charges nothing for power, heat, light, or even drainage, and exacts no taxes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.50.5
  kind: p
  original: What graft!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.51.1
  kind: p
  original: It is estimated that more than twelve million dollars' worth of workingmen's shirts and overalls is produced annually in this country by prison labor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.51.2
  kind: p
  original: It is a woman's industry, and the first reflection that arises is that an immense amount of free female labor is thus displaced.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.51.3
  kind: p
  original: The second consideration is that male convicts, who should be learning trades that would give them some chance of being self-supporting after their release, are kept at this work at which they can not possibly make a dollar.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.51.4
  kind: p
  original: This is the more serious when we consider that much of this labor is done in reformatories, which so loudly profess to be training their inmates to become useful citizens.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.52.1
  kind: p
  original: The third, and most important, consideration is that the enormous profits thus wrung from convict labor are a constant incentive to the contractors to exact from their unhappy victims tasks altogether beyond their strength, and to punish them cruelly when their work does not come up to the excessive demands made.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.53.1
  kind: p
  original: Another word on the condemnation of convicts to tasks at which they cannot hope to make a living after release.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.53.2
  kind: p
  original: Indiana, for example, is a State that has made a great splurge over being in the front rank of modern penological improvements.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.53.3
  kind: p
  original: Yet, according to the report rendered in 1908 by the training school of its "reformatory," 135 were engaged in the manufacture of chains, 207 in that of shirts, and 255 in the foundry--a total of 597 in three occupations.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.53.4
  kind: p
  original: But at this so-called reformatory 59 occupations were represented by the inmates, 39 of which were connected with country pursuits.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.53.5
  kind: p
  original: Indiana, like other States, professes to be training the inmates of her reformatory to occupations by which they will be able to make their living when released.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.53.6
  kind: p
  original: She actually sets them to work making chains, shirts, and brooms, the latter for the benefit of the Louisville Fancy Grocery Co.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.53.7
  kind: p
  original: Broom making is a trade largely monopolized by the blind, shirt making is done by women, and there is only one free chain factory in the State, and at that a released convict can not hope to get employment.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.53.8
  kind: p
  original: The whole thing is a cruel farce.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.54.1
  kind: p
  original: If, then, the States can be instrumental in robbing their helpless victims of such tremendous profits, is it not high time for organized labor to stop its idle howl, and to insist on decent remuneration for the convict, even as labor organizations claim for themselves?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.54.2
  kind: p
  original: In that way workingmen would kill the germ which makes of the prisoner an enemy to the interests of labor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.54.3
  kind: p
  original: I have said elsewhere that thousands of convicts, incompetent and without a trade, without means of subsistence, are yearly turned back into the social fold.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.54.4
  kind: p
  original: These men and women must live, for even an ex-convict has needs.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.54.5
  kind: p
  original: Prison life has made them anti-social beings, and the rigidly closed doors that meet them on their release are not likely to decrease their bitterness.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.54.6
  kind: p
  original: The inevitable result is that they form a favorable nucleus out of which scabs, blacklegs, detectives, and policemen are drawn, only too willing to do the master's bidding.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.54.7
  kind: p
  original: Thus organized labor, by its foolish opposition to work in prison, defeats its own ends.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.54.8
  kind: p
  original: It helps to create poisonous fumes that stifle every attempt for economic betterment.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.54.9
  kind: p
  original: If the workingman wants to avoid these effects, he should INSIST on the right of the convict to work, he should meet him as a brother, take him into his organization, and WITH HIS AID TURN AGAINST THE SYSTEM WHICH GRINDS THEM BOTH.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.55.1
  kind: p
  original: Last, but not least, is the growing realization of the barbarity and the inadequacy of the definite sentence.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.55.2
  kind: p
  original: Those who believe in, and earnestly aim at, a change are fast coming to the conclusion that man must be given an opportunity to make good.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.55.3
  kind: p
  original: And how is he to do it with ten, fifteen, or twenty years' imprisonment before him?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.55.4
  kind: p
  original: The hope of liberty and of opportunity is the only incentive to life, especially the prisoner's life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.55.5
  kind: p
  original: Society has sinned so long against him--it ought at least to leave him that.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.55.6
  kind: p
  original: I am not very sanguine that it will, or that any real change in that direction can take place until the conditions that breed both the prisoner and the jailer will be forever abolished.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.56.1
  kind: p
  original: Out of his mouth a red, red rose! / Out of his heart a white! / For who can say by what strange way / Christ brings his will to light, / Since the barren staff the pilgrim bore / Bloomed in the great Pope's sight.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.N1.1.1
  kind: note
  original: CRIME AND CRIMINALS. W. C. Owen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.N2.1.1
  kind: note
  original: THE CRIMINAL, Havelock Ellis.
  en: ''
