section: XII
title_original: 'The Modern Drama: A Powerful Disseminator of Radical Thought'
title_en: 'The Modern Drama: A Powerful Disseminator of Radical Thought'
author: Emma Goldman
date: '1910'
original_language: en
anchor_language: en
source_original: 'Emma Goldman, Anarchism and Other Essays, with a biographic sketch by Hippolyte Havel (New York: Mother Earth Publishing Association, 1910), public domain; Project Gutenberg ebook 2162'
source_en: 'None needed: the original is in English'
verses:
- id: XII.0.1
  kind: heading
  original: 'The Modern Drama: A Powerful Disseminator of Radical Thought'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.1.1
  kind: p
  original: So long as discontent and unrest make themselves but dumbly felt within a limited social class, the powers of reaction may often succeed in suppressing such manifestations.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.1.2
  kind: p
  original: But when the dumb unrest grows into conscious expression and becomes almost universal, it necessarily affects all phases of human thought and action, and seeks its individual and social expression in the gradual transvaluation of existing values.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.2.1
  kind: p
  original: An adequate appreciation of the tremendous spread of the modern, conscious social unrest cannot be gained from merely propagandistic literature.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.2.2
  kind: p
  original: Rather must we become conversant with the larger phases of human expression manifest in art, literature, and, above all, the modern drama--the strongest and most far-reaching interpreter of our deep-felt dissatisfaction.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.3.1
  kind: p
  original: What a tremendous factor for the awakening of conscious discontent are the simple canvasses of a Millet!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.3.2
  kind: p
  original: The figures of his peasants--what terrific indictment against our social wrongs; wrongs that condemn the Man With the Hoe to hopeless drudgery, himself excluded from Nature's bounty.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.4.1
  kind: p
  original: The vision of a Meunier conceives the growing solidarity and defiance of labor in the group of miners carrying their maimed brother to safety.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.4.2
  kind: p
  original: His genius thus powerfully portrays the interrelation of the seething unrest among those slaving in the bowels of the earth, and the spiritual revolt that seeks artistic expression.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.5.1
  kind: p
  original: No less important is the factor for rebellious awakening in modern literature--Turgeniev, Dostoyevsky, Tolstoy, Andreiev, Gorki, Whitman, Emerson, and scores of others embodying the spirit of universal ferment and the longing for social change.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.6.1
  kind: p
  original: Still more far-reaching is the modern drama, as the leaven of radical thought and the disseminator of new values.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.7.1
  kind: p
  original: It might seem an exaggeration to ascribe to the modern drama such an important role.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.7.2
  kind: p
  original: But a study of the development of modern ideas in most countries will prove that the drama has succeeded in driving home great social truths, truths generally ignored when presented in other forms.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.7.3
  kind: p
  original: No doubt there are exceptions, as Russia and France.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.8.1
  kind: p
  original: Russia, with its terrible political pressure, has made people think and has awakened their social sympathies, because of the tremendous contrast which exists between the intellectual life of the people and the despotic regime that is trying to crush that life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.8.2
  kind: p
  original: Yet while the great dramatic works of Tolstoy, Tchechov, Gorki, and Andreiev closely mirror the life and the struggle, the hopes and aspirations of the Russian people, they did not influence radical thought to the extent the drama has done in other countries.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.9.1
  kind: p
  original: Who can deny, however, the tremendous influence exerted by THE POWER OF DARKNESS or NIGHT LODGING.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.9.2
  kind: p
  original: Tolstoy, the real, true Christian, is yet the greatest enemy of organized Christianity.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.9.3
  kind: p
  original: With a master hand he portrays the destructive effects upon the human mind of the power of darkness, the superstitions of the Christian Church.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.10.1
  kind: p
  original: What other medium could express, with such dramatic force, the responsibility of the Church for crimes committed by its deluded victims; what other medium could, in consequence, rouse the indignation of man's conscience?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.11.1
  kind: p
  original: Similarly direct and powerful is the indictment contained in Gorki's NIGHT LODGING.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.11.2
  kind: p
  original: The social pariahs, forced into poverty and crime, yet desperately clutch at the last vestiges of hope and aspiration.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.11.3
  kind: p
  original: Lost existences these, blighted and crushed by cruel, unsocial environment.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.12.1
  kind: p
  original: France, on the other hand, with her continuous struggle for liberty, is indeed the cradle of radical thought; as such she, too, did not need the drama as a means of awakening.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.12.2
  kind: p
  original: And yet the works of Brieux--as ROBE ROUGE, portraying the terrible corruption of the judiciary--and Mirbeau's LES AFFAIRES SONT LES AFFAIRES--picturing the destructive influence of wealth on the human soul--have undoubtedly reached wider circles than most of the articles and books which have been written in France on the social question.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.13.1
  kind: p
  original: In countries like Germany, Scandinavia, England, and even in America--though in a lesser degree--the drama is the vehicle which is really making history, disseminating radical thought in ranks not otherwise to be reached.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.14.1
  kind: p
  original: Let us take Germany, for instance.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.14.2
  kind: p
  original: For nearly a quarter of a century men of brains, of ideas, and of the greatest integrity, made it their life-work to spread the truth of human brotherhood, of justice, among the oppressed and downtrodden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.14.3
  kind: p
  original: Socialism, that tremendous revolutionary wave, was to the victims of a merciless and inhumane system like water to the parched lips of the desert traveler.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.14.4
  kind: p
  original: Alas!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.14.5
  kind: p
  original: The cultured people remained absolutely indifferent; to them that revolutionary tide was but the murmur of dissatisfied, discontented men, dangerous, illiterate troublemakers, whose proper place was behind prison bars.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.15.1
  kind: p
  original: Self-satisfied as the "cultured" usually are, they could not understand why one should fuss about the fact that thousands of people were starving, though they contributed towards the wealth of the world.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.15.2
  kind: p
  original: Surrounded by beauty and luxury, they could not believe that side by side with them lived human beings degraded to a position lower than a beast's, shelterless and ragged, without hope or ambition.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.16.1
  kind: p
  original: This condition of affairs was particularly pronounced in Germany after the Franco-German war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.16.2
  kind: p
  original: Full to the bursting point with its victory, Germany thrived on a sentimental, patriotic literature, thereby poisoning the minds of the country's youth by the glory of conquest and bloodshed.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.17.1
  kind: p
  original: Intellectual Germany had to take refuge in the literature of other countries, in the works of Ibsen, Zola, Daudet, Maupassant, and especially in the great works of Dostoyevsky, Tolstoy, and Turgeniev.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.17.2
  kind: p
  original: But as no country can long maintain a standard of culture without a literature and drama related to its own soil, so Germany gradually began to develop a drama reflecting the life and the struggles of its own people.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.18.1
  kind: p
  original: Arno Holz, one of the youngest dramatists of that period, startled the Philistines out of their ease and comfort with his FAMILIE SELICKE.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.18.2
  kind: p
  original: The play deals with society's refuse, men and women of the alleys, whose only subsistence consists of what they can pick out of the garbage barrels.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.18.3
  kind: p
  original: A gruesome subject, is it not?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.18.4
  kind: p
  original: And yet what other method is there to break through the hard shell of the minds and souls of people who have never known want, and who therefore assume that all is well in the world?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.19.1
  kind: p
  original: Needless to say, the play aroused tremendous indignation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.19.2
  kind: p
  original: The truth is bitter, and the people living on the Fifth Avenue of Berlin hated to be confronted with the truth.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.20.1
  kind: p
  original: Not that FAMILIE SELICKE represented anything that had not been written about for years without any seeming result.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.20.2
  kind: p
  original: But the dramatic genius of Holz, together with the powerful interpretation of the play, necessarily made inroads into the widest circles, and forced people to think about the terrible inequalities around them.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.21.1
  kind: p
  original: Sudermann's EHRE and HEIMAT deal with vital subjects.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - XII.N1
  - XII.N2
- id: XII.21.2
  kind: p
  original: I have already referred to the sentimental patriotism so completely turning the head of the average German as to create a perverted conception of honor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.21.3
  kind: p
  original: Duelling became an every-day affair, costing innumerable lives.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.21.4
  kind: p
  original: A great cry was raised against the fad by a number of leading writers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.21.5
  kind: p
  original: But nothing acted as such a clarifier and exposer of that national disease as the EHRE.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.22.1
  kind: p
  original: Not that the play merely deals with duelling; it analyzes the real meaning of honor, proving that it is not a fixed, inborn feeling, but that it varies with every people and every epoch, depending particularly on one's economic and social station in life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.22.2
  kind: p
  original: We realize from this play that the man in the brownstone mansion will necessarily define honor differently from his victims.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.23.1
  kind: p
  original: The family Heinecke enjoys the charity of the millionaire Muhling, being permitted to occupy a dilapidated shanty on his premises in the absence of their son, Robert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.23.2
  kind: p
  original: The latter, as Muhling's representative, is making a vast fortune for his employer in India.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.23.3
  kind: p
  original: On his return Robert discovers that his sister had been seduced by young Muhling, whose father graciously offers to straighten matters with a check for 40,000 marks.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.23.4
  kind: p
  original: Robert, outraged and indignant, resents the insult to his family's honor, and is forthwith dismissed from his position for impudence.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.23.5
  kind: p
  original: 'Robert finally throws this accusation into the face of the philanthropist millionaire:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.24.1
  kind: p
  original: '"We slave for you, we sacrifice our heart''s blood for you, while you seduce our daughters and sisters and kindly pay for their disgrace with the gold we have earned for you.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.24.2
  kind: p
  original: That is what you call honor."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.25.1
  kind: p
  original: An incidental side-light upon the conception of honor is given by Count Trast, the principal character in the EHRE, a man widely conversant with the customs of various climes, who relates that in his many travels he chanced across a savage tribe whose honor he mortally offended by refusing the hospitality which offered him the charms of the chieftain's wife.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.26.1
  kind: p
  original: The theme of HEIMAT treats of the struggle between the old and the young generations.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.26.2
  kind: p
  original: It holds a permanent and important place in dramatic literature.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.1
  kind: p
  original: 'Magda, the daughter of Lieutenant Colonel Schwartz, has committed an unpardonable sin: she refused the suitor selected by her father.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.2
  kind: p
  original: For daring to disobey the parental commands she is driven from home.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.3
  kind: p
  original: Magda, full of life and the spirit of liberty, goes out into the world to return to her native town, twelve years later, a celebrated singer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.4
  kind: p
  original: She consents to visit her parents on condition that they respect the privacy of her past.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.5
  kind: p
  original: But her martinet father immediately begins to question her, insisting on his "paternal rights."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.6
  kind: p
  original: Magda is indignant, but gradually his persistence brings to light the tragedy of her life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.7
  kind: p
  original: He learns that the respected Councillor Von Keller had in his student days been Magda's lover, while she was battling for her economic and social independence.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.8
  kind: p
  original: The consequence of the fleeting romance was a child, deserted by the man even before birth.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.9
  kind: p
  original: The rigid military father of Magda demands as retribution from Councillor Von Keller that he legalize the love affair.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.10
  kind: p
  original: In view of Magda's social and professional success, Keller willingly consents, but on condition that she forsake the stage, and place the child in an institution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.11
  kind: p
  original: 'The struggle between the Old and the New culminates in Magda''s defiant words of the woman grown to conscious independence of thought and action: "...I''ll say what I think of you--of you and your respectable society.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.12
  kind: p
  original: Why should I be worse than you that I must prolong my existence among you by a lie!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.13
  kind: p
  original: Why should this gold upon my body, and the lustre which surrounds my name, only increase my infamy?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.14
  kind: p
  original: Have I not worked early and late for ten long years?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.15
  kind: p
  original: Have I not woven this dress with sleepless nights?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.16
  kind: p
  original: Have I not built up my career step by step, like thousands of my kind?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.17
  kind: p
  original: Why should I blush before anyone?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.27.18
  kind: p
  original: I am myself, and through myself I have become what I am."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.28.1
  kind: p
  original: The general theme of HEIMAT was not original.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.28.2
  kind: p
  original: It had been previously treated by a master hand in FATHERS AND SONS.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.28.3
  kind: p
  original: Partly because Turgeniev's great work was typical rather of Russian than universal conditions, and still more because it was in the form of fiction, the influence of FATHERS AND SONS was limited to Russia.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.28.4
  kind: p
  original: But HEIMAT, especially because of its dramatic expression, became almost a world factor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.29.1
  kind: p
  original: The dramatist who not only disseminated radicalism, but literally revolutionized the thoughtful Germans, is Gerhardt Hauptmann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.29.2
  kind: p
  original: His first play VOR SONNENAUFGANG, refused by every leading German theatre and first performed in a wretched little playhouse behind a beer garden, acted like a stroke of lightning, illuminating the entire social horizon.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - XII.N3
- id: XII.29.3
  kind: p
  original: Its subject matter deals with the life of an extensive landowner, ignorant, illiterate, and brutalized, and his economic slaves of the same mental calibre.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.29.4
  kind: p
  original: The influence of wealth, both on the victims who created it and the possessor thereof, is shown in the most vivid colors, as resulting in drunkenness, idiocy, and decay.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.29.5
  kind: p
  original: But the most striking feature of VOR SONNENAUFGANG, the one which brought a shower of abuse on Hauptmann's head, was the question as to the indiscriminate breeding of children by unfit parents.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.30.1
  kind: p
  original: 'During the second performance of the play a leading Berlin surgeon almost caused a panic in the theatre by swinging a pair of forceps over his head and screaming at the top of his voice: "The decency and morality of Germany are at stake if childbirth is to be discussed openly from the stage."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.30.2
  kind: p
  original: The surgeon is forgotten, and Hauptmann stands a colossal figure before the world.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.31.1
  kind: p
  original: When DIE WEBER first saw the light, pandemonium broke out in the land of thinkers and poets.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - XII.N4
- id: XII.31.2
  kind: p
  original: '"What," cried the moralists, "workingmen, dirty, filthy slaves, to be put on the stage!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.31.3
  kind: p
  original: Poverty in all its horrors and ugliness to be dished out as an after-dinner amusement?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.31.4
  kind: p
  original: That is too much!"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.32.1
  kind: p
  original: Indeed, it was too much for the fat and greasy bourgeoisie to be brought face to face with the horrors of the weaver's existence.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.32.2
  kind: p
  original: It was too much because of the truth and reality that rang like thunder in the deaf ears of self-satisfied society, J'ACCUSE!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.33.1
  kind: p
  original: Of course, it was generally known even before the appearance of this drama that capital can not get fat unless it devours labor, that wealth can not be hoarded except through the channels of poverty, hunger, and cold; but such things are better kept in the dark, lest the victims awaken to a realization of their position.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.33.2
  kind: p
  original: But it is the purpose of the modern drama to rouse the consciousness of the oppressed; and that, indeed, was the purpose of Gerhardt Hauptmann in depicting to the world the conditions of the weavers in Silesia.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.33.3
  kind: p
  original: Human beings working eighteen hours daily, yet not earning enough for bread and fuel; human beings living in broken, wretched huts half covered with snow, and nothing but tatters to protect them from the cold; infants covered with scurvy from hunger and exposure; pregnant women in the last stages of consumption.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.33.4
  kind: p
  original: Victims of a benevolent Christian era, without life, without hope, without warmth.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.33.5
  kind: p
  original: Ah, yes, it was too much!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.34.1
  kind: p
  original: Hauptmann's dramatic versatility deals with every stratum of social life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.34.2
  kind: p
  original: Besides portraying the grinding effect of economic conditions, he also treats of the struggle of the individual for his mental and spiritual liberation from the slavery of convention and tradition.
  en: ''
