  modern: ''
  modern_status: empty
  notes: ''
- id: XII.69.2
  kind: p
  original: Between them the strikers are worn and weary with the terrible struggle, and are harassed and driven by the awful sight of poverty and want in their families.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.70.1
  kind: p
  original: The most marvellous and brilliant piece of work in STRIFE is Galsworthy's portrayal of the mob, its fickleness, and lack of backbone.
