- id: XII.64.1
  kind: p
  original: These plays of Ibsen--THE PILLARS OF SOCIETY, A DOLL'S HOUSE, GHOSTS, and AN ENEMY OF THE PEOPLE--constitute a dynamic force which is gradually dissipating the ghosts walking the social burying ground called civilization.
