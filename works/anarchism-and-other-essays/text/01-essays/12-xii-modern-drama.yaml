  kind: p
  original: '"In fast-falling daylight, Falder, in his stockings, is seen standing motionless, with his head inclined towards the door, listening.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.85.2
  kind: p
  original: He moves a little closer to the door, his stockinged feet making no noise.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.85.3
  kind: p
  original: He stops at the door.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.85.4
  kind: p
  original: He is trying harder and harder to hear something, any little thing that is going on outside.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.85.5
  kind: p
  original: He springs suddenly upright--as if at a sound--and remains perfectly motionless.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.85.6
  kind: p
  original: Then, with a heavy sigh, he moves to his work, and stands looking at it, with his head down; he does a stitch or two, having the air of a man so lost in sadness that each stitch is, as it were, a coming to life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.85.7
  kind: p
  original: Then, turning abruptly, he begins pacing his cell, moving his head, like an animal pacing its cage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.85.8
  kind: p
  original: He stops again at the door, listens, and, placing the palms of his hands against it with his fingers spread out, leans his forehead against the iron.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.85.9
  kind: p
  original: Turning from it, presently, he moves slowly back towards the window, holding his head, as if he felt that it were going to burst, and stops under the window.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.85.10
  kind: p
  original: But since he cannot see out of it he leaves off looking, and, picking up the lid of one of the tins, peers into it, as if trying to make a companion of his own face.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.85.11
  kind: p
  original: It has grown very nearly dark.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.85.12
  kind: p
  original: Suddenly the lid falls out of his hand with a clatter--the only sound that has broken the silence--and he stands staring intently at the wall where the stuff of the shirt is hanging rather white in the darkness--he seems to be seeing somebody or something there.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.85.13
  kind: p
  original: There is a sharp tap and click; the cell light behind the glass screen has been turned up.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.85.14
  kind: p
  original: The cell is brightly lighted.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.85.15
  kind: p
  original: Falder is seen gasping for breath.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.86.1
  kind: p
  original: A sound from far away, as of distant, dull beating on thick metal, is suddenly audible.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.86.2
  kind: p
  original: Falder shrinks back, not able to bear this sudden clamor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.86.3
  kind: p
  original: But the sound grows, as though some great tumbril were rolling towards the cell.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.86.4
  kind: p
  original: And gradually it seems to hypnotize him.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.86.5
  kind: p
  original: He begins creeping inch by inch nearer to the door.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.86.6
  kind: p
  original: The banging sound, traveling from cell to cell, draws closer and closer; Falder's hands are seen moving as if his spirit had already joined in this beating, and the sound swells till it seems to have entered the very cell.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.86.7
  kind: p
  original: He suddenly raises his clenched fists.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.86.8
  kind: p
  original: Panting violently, he flings himself at his door, and beats on it."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.87.1
  kind: p
  original: Finally Falder leaves the prison, a broken ticket-of-leave man, the stamp of the convict upon his brow, the iron of misery in his soul.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.87.2
  kind: p
  original: Thanks to Ruth's pleading, the firm of James How and Son is willing to take Falder back in their employ, on condition that he give up Ruth.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.87.3
  kind: p
  original: It is then that Falder learns the awful news that the woman he loves had been driven by the merciless economic Moloch to sell herself.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.87.4
  kind: p
  original: She "tried making skirts... cheap things....
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.87.5
  kind: p
  original: I never made more than ten shillings a week, buying my own cotton, and working all day.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.87.6
  kind: p
  original: I hardly ever got to bed till past twelve....
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.87.7
  kind: p
  original: And then... my employer happened--he's happened ever since."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.87.8
  kind: p
  original: At this terrible psychologic moment the police appear to drag him back to prison for failing to report himself as ticket-of-leave man.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.87.9
  kind: p
  original: Completely overwhelmed by the inexorability of his environment, young Falder seeks and finds peace, greater than human justice, by throwing himself down to death, as the detectives are taking him back to prison.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.88.1
  kind: p
  original: It would be impossible to estimate the effect produced by this play.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.88.2
  kind: p
  original: Perhaps some conception can be gained from the very unusual circumstance that it had proved so powerful as to induce the Home Secretary of Great Britain to undertake extensive prison reforms in England.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.88.3
  kind: p
  original: A very encouraging sign this, of the influence exerted by the modern drama.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.88.4
  kind: p
  original: It is to be hoped that the thundering indictment of Mr. Galsworthy will not remain without similar effect upon the public sentiment and prison conditions of America.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.88.5
  kind: p
  original: At any rate, it is certain that no other modern play has borne such direct and immediate fruit in wakening the social conscience.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.89.1
  kind: p
  original: Another modern play, THE SERVANT IN THE HOUSE, strikes a vital key in our social life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.89.2
  kind: p
  original: The hero of Mr. Kennedy's masterpiece is Robert, a coarse, filthy drunkard, whom respectable society has repudiated.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.89.3
  kind: p
  original: Robert, the sewer cleaner, is the real hero of the play; nay, its true and only savior.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.89.4
  kind: p
  original: It is he who volunteers to go down into the dangerous sewer, so that his comrades "can 'ave light and air."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.89.5
  kind: p
  original: After all, has he not sacrificed his life always, so that others may have light and air?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.90.1
  kind: p
  original: The thought that labor is the redeemer of social well-being has been cried from the housetops in every tongue and every clime.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.90.2
  kind: p
  original: Yet the simple words of Robert express the significance of labor and its mission with far greater potency.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.91.1
  kind: p
  original: America is still in its dramatic infancy.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.91.2
  kind: p
  original: Most of the attempts along this line to mirror life, have been wretched failures.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.91.3
  kind: p
  original: Still, there are hopeful signs in the attitude of the intelligent public toward modern plays, even if they be from foreign soil.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.92.1
  kind: p
  original: The only real drama America has so far produced is THE EASIEST WAY, by Eugene Walter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.93.1
  kind: p
  original: It is supposed to represent a "peculiar phase" of New York life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.93.2
  kind: p
  original: If that were all, it would be of minor significance.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.93.3
  kind: p
  original: That which gives the play its real importance and value lies much deeper.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.93.4
  kind: p
  original: It lies, first, in the fundamental current of our social fabric which drives us all, even stronger characters than Laura, into the easiest way--a way so very destructive of integrity, truth, and justice.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.93.5
  kind: p
  original: Secondly, the cruel, senseless fatalism conditioned in Laura's sex.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.93.6
  kind: p
  original: These two features put the universal stamp upon the play, and characterize it as one of the strongest dramatic indictments against society.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.94.1
  kind: p
  original: The criminal waste of human energy, in economic and social conditions, drives Laura as it drives the average girl to marry any man for a "home"; or as it drives men to endure the worst indignities for a miserable pittance.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.95.1
  kind: p
  original: Then there is that other respectable institution, the fatalism of Laura's sex.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.95.2
  kind: p
  original: 'The inevitability of that force is summed up in the following words: "Don''t you know that we count no more in the life of these men than tamed animals?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.95.3
  kind: p
  original: It's a game, and if we don't play our cards well, we lose."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.95.4
  kind: p
  original: Woman in the battle with life has but one weapon, one commodity--sex.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.95.5
  kind: p
  original: That alone serves as a trump card in the game of life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.96.1
  kind: p
  original: This blind fatalism has made of woman a parasite, an inert thing.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.96.2
  kind: p
  original: Why then expect perseverance or energy of Laura?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.96.3
  kind: p
  original: The easiest way is the path mapped out for her from time immemorial.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.96.4
  kind: p
  original: She could follow no other.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.97.1
  kind: p
  original: A number of other plays could be quoted as characteristic of the growing role of the drama as a disseminator of radical thought.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.97.2
  kind: p
  original: Suffice to mention THE THIRD DEGREE, by Charles Klein; THE FOURTH ESTATE, by Medill Patterson; A MAN'S WORLD, by Ida Croutchers,--all pointing to the dawn of dramatic art in America, an art which is discovering to the people the terrible diseases of our social body.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.98.1
  kind: p
  original: It has been said of old, all roads lead to Rome.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.98.2
  kind: p
  original: In paraphrased application to the tendencies of our day, it may truly be said that all roads lead to the great social reconstruction.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.98.3
  kind: p
  original: The economic awakening of the workingman, and his realization of the necessity for concerted industrial action; the tendencies of modern education, especially in their application to the free development of the child; the spirit of growing unrest expressed through, and cultivated by, art and literature, all pave the way to the Open Road.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.98.4
  kind: p
  original: Above all, the modern drama, operating through the double channel of dramatist and interpreter, affecting as it does both mind and heart, is the strongest force in developing social discontent, swelling the powerful tide of unrest that sweeps onward and over the dam of ignorance, prejudice, and superstition.
  en: ''
  modern: ''
  modern_status: empty
