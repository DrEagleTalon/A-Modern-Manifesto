- id: XII.65.1
  kind: p
  original: England with her great pioneers of radical thought, the intellectual pilgrims like Godwin, Robert Owen, Darwin, Spencer, William Morris, and scores of others; with her wonderful larks of liberty--Shelley, Byron, Keats--is another example of the influence of dramatic art.
