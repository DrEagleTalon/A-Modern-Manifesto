  notes: ''
- id: XII.65.3
  kind: p
  original: Thus a public which will remain indifferent reading an essay by Robert Owen, on Poverty, or ignore Bernard Shaw's Socialistic tracts, was made to think by MAJOR BARBARA, wherein poverty is described as the greatest crime of Christian civilization.
