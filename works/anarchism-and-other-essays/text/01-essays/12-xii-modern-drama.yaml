  modern_status: empty
  notes: ''
- id: XII.70.2
  kind: p
  original: One moment they applaud old Thomas, who speaks of the power of God and religion and admonishes the men against rebellion; the next instant they are carried away by a walking delegate, who pleads the cause of the union,--the union that always stands for compromise, and which forsakes the workingmen whenever they dare to strike for independent demands; again they are aglow with the earnestness, the spirit, and the intensity of David Roberts--all these people willing to go in whatever direction the wind blows.
