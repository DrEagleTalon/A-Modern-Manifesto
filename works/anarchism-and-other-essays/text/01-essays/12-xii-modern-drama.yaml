  notes: ''
- id: XII.69.1
  kind: p
  original: 'The theme of STRIFE is a strike with two dominant factors: Anthony, the president of the company, rigid, uncompromising, unwilling to make the slightest concession, although the men held out for months and are in a condition of semi-starvation; and David Roberts, an uncompromising revolutionist, whose devotion to the workingman and the cause of freedom is at white heat.'
