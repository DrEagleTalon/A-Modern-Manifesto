  original: We may not like this adherence to old, reactionary notions, and yet there is something admirable in the courage and consistency of this man, nor is he half as dangerous to the interests of the oppressed, as our sentimental and soft reformers who rob with nine fingers, and give libraries with the tenth; who grind human beings like Russell Sage, and then spend millions of dollars in social research work; who turn beautiful young plants into faded old women, and then give them a few paltry dollars or found a Home for Working Girls.
