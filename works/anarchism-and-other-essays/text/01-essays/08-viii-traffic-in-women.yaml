verses:
- id: VIII.0.1
  kind: heading
  original: The Traffic in Women
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.1.1
  kind: p
  original: Our reformers have suddenly made a great discovery--the white slave traffic.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.1.2
  kind: p
  original: The papers are full of these "unheard of conditions," and lawmakers are already planning a new set of laws to check the horror.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.2.1
  kind: p
  original: It is significant that whenever the public mind is to be diverted from a great social wrong, a crusade is inaugurated against indecency, gambling, saloons, etc.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.2.2
  kind: p
  original: And what is the result of such crusades?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.2.3
  kind: p
  original: Gambling is increasing, saloons are doing a lively business through back entrances, prostitution is at its height, and the system of pimps and cadets is but aggravated.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.3.1
  kind: p
  original: How is it that an institution, known almost to every child, should have been discovered so suddenly?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.3.2
  kind: p
  original: How is it that this evil, known to all sociologists, should now be made such an important issue?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.1
  kind: p
  original: To assume that the recent investigation of the white slave traffic (and, by the way, a very superficial investigation) has discovered anything new, is, to say the least, very foolish.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.2
  kind: p
  original: Prostitution has been, and is, a widespread evil, yet mankind goes on its business, perfectly indifferent to the sufferings and distress of the victims of prostitution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.3
  kind: p
  original: As indifferent, indeed, as mankind has remained to our industrial system, or to economic prostitution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.5.1
  kind: p
  original: Only when human sorrows are turned into a toy with glaring colors will baby people become interested--for a while at least.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.5.2
  kind: p
  original: The people are a very fickle baby that must have new toys every day.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.5.3
  kind: p
  original: The "righteous" cry against the white slave traffic is such a toy.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.5.4
  kind: p
  original: It serves to amuse the people for a little while, and it will help to create a few more fat political jobs--parasites who stalk about the world as inspectors, investigators, detectives, and so forth.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.6.1
  kind: p
  original: What is really the cause of the trade in women?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.6.2
  kind: p
  original: Not merely white women, but yellow and black women as well.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.6.3
  kind: p
  original: Exploitation, of course; the merciless Moloch of capitalism that fattens on underpaid labor, thus driving thousands of women and girls into prostitution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.6.4
  kind: p
  original: With Mrs. Warren these girls feel, "Why waste your life working for a few shillings a week in a scullery, eighteen hours a day?"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.7.1
  kind: p
  original: Naturally our reformers say nothing about this cause.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.7.2
  kind: p
  original: They know it well enough, but it doesn't pay to say anything about it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.7.3
  kind: p
  original: It is much more profitable to play the Pharisee, to pretend an outraged morality, than to go to the bottom of things.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.8.1
  kind: p
  original: 'However, there is one commendable exception among the young writers: Reginald Wright Kauffman, whose work, THE HOUSE OF BONDAGE, is the first earnest attempt to treat the social evil, not from a sentimental Philistine viewpoint.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.8.2
  kind: p
  original: A journalist of wide experience, Mr. Kauffman proves that our industrial system leaves most women no alternative except prostitution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.8.3
  kind: p
  original: The women portrayed in THE HOUSE OF BONDAGE belong to the working class.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.8.4
  kind: p
  original: Had the author portrayed the life of women in other spheres, he would have been confronted with the same state of affairs.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.9.1
  kind: p
  original: Nowhere is woman treated according to the merit of her work, but rather as a sex.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.9.2
  kind: p
  original: It is therefore almost inevitable that she should pay for her right to exist, to keep a position in whatever line, with sex favors.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.9.3
  kind: p
  original: Thus it is merely a question of degree whether she sells herself to one man, in or out of marriage, or to many men.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.9.4
  kind: p
  original: Whether our reformers admit it or not, the economic and social inferiority of woman is responsible for prostitution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.10.1
  kind: p
  original: Just at present our good people are shocked by the disclosures that in New York City alone, one out of every ten women works in a factory, that the average wage received by women is six dollars per week for forty-eight to sixty hours of work, and that the majority of female wage workers face many months of idleness which leaves the average wage about $280 a year.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.10.2
  kind: p
  original: In view of these economic horrors, is it to be wondered at that prostitution and the white slave trade have become such dominant factors?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.11.1
  kind: p
  original: 'Lest the preceding figures be considered an exaggeration, it is well to examine what some authorities on prostitution have to say:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.12.1
  kind: p
  original: '"A prolific cause of female depravity can be found in the several tables, showing the description of the employment pursued, and the wages received, by the women previous to their fall, and it will be a question for the political economist to decide how far mere business consideration should be an apology on the part of employers for a reduction in their rates of remuneration, and whether the savings of a small percentage on wages is not more than counter-balanced by the enormous amount of taxation enforced on the public at large to defray the expenses incurred on account of a system of vice, WHICH IS THE DIRECT RESULT, IN MANY CASES, OF INSUFFICIENT COMPENSATION OF HONEST LABOR."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VIII.N1
- id: VIII.13.1
  kind: p
  original: Our present-day reformers would do well to look into Dr. Sanger's book.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.13.2
  kind: p
  original: There they will find that out of 2,000 cases under his observation, but few came from the middle classes, from well-ordered conditions, or pleasant homes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.13.3
  kind: p
  original: By far the largest majority were working girls and working women; some driven into prostitution through sheer want, others because of a cruel, wretched life at home, others again because of thwarted and crippled physical natures (of which I shall speak later on).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.13.4
  kind: p
  original: Also it will do the maintainers of purity and morality good to learn that out of two thousand cases, 490 were married women, women who lived with their husbands.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.13.5
  kind: p
  original: Evidently there was not much of a guaranty for their "safety and purity" in the sanctity of marriage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VIII.N2
- id: VIII.14.1
  kind: p
  original: Dr. Alfred Blaschko, in PROSTITUTION IN THE NINETEENTH CENTURY, is even more emphatic in characterizing economic conditions as one of the most vital factors of prostitution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.15.1
  kind: p
  original: '"Although prostitution has existed in all ages, it was left to the nineteenth century to develop it into a gigantic social institution.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.15.2
  kind: p
  original: The development of industry with vast masses of people in the competitive market, the growth and congestion of large cities, the insecurity and uncertainty of employment, has given prostitution an impetus never dreamed of at any period in human history."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.16.1
  kind: p
  original: And again Havelock Ellis, while not so absolute in dealing with the economic cause, is nevertheless compelled to admit that it is indirectly and directly the main cause.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.16.2
  kind: p
  original: Thus he finds that a large percentage of prostitutes is recruited from the servant class, although the latter have less care and greater security.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.16.3
  kind: p
  original: On the other hand, Mr. Ellis does not deny that the daily routine, the drudgery, the monotony of the servant girl's lot, and especially the fact that she may never partake of the companionship and joy of a home, is no mean factor in forcing her to seek recreation and forgetfulness in the gaiety and glimmer of prostitution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.16.4
  kind: p
  original: In other words, the servant girl, being treated as a drudge, never having the right to herself, and worn out by the caprices of her mistress, can find an outlet, like the factory or shopgirl, only in prostitution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.17.1
  kind: p
  original: The most amusing side of the question now before the public is the indignation of our "good, respectable people," especially the various Christian gentlemen, who are always to be found in the front ranks of every crusade.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.17.2
  kind: p
  original: Is it that they are absolutely ignorant of the history of religion, and especially of the Christian religion?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.17.3
  kind: p
  original: Or is it that they hope to blind the present generation to the part played in the past by the Church in relation to prostitution?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.17.4
  kind: p
  original: Whatever their reason, they should be the last to cry out against the unfortunate victims of today, since it is known to every intelligent student that prostitution is of religious origin, maintained and fostered for many centuries, not as a shame but as a virtue, hailed as such by the Gods themselves.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.18.1
  kind: p
  original: '"It would seem that the origin of prostitution is to be found primarily in a religious custom, religion, the great conserver of social tradition, preserving in a transformed shape a primitive freedom that was passing out of the general social life.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.18.2
  kind: p
  original: The typical example is that recorded by Herodotus, in the fifth century before Christ, at the Temple of Mylitta, the Babylonian Venus, where every woman, once in her life, had to come and give herself to the first stranger, who threw a coin in her lap, to worship the goddess.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.18.3
  kind: p
  original: Very similar customs existed in other parts of Western Asia, in North Africa, in Cyprus, and other islands of the Eastern Mediterranean, and also in Greece, where the temple of Aphrodite on the fort at Corinth possessed over a thousand hierodules, dedicated to the service of the goddess.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.19.1
  kind: p
  original: '"The theory that religious prostitution developed, as a general rule, out of the belief that the generative activity of human beings possessed a mysterious and sacred influence in promoting the fertility of Nature, is maintained by all authoritative writers on the subject.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.19.2
  kind: p
  original: Gradually, however, and when prostitution became an organized institution under priestly influence, religious prostitution developed utilitarian sides, thus helping to increase public revenue.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.20.1
  kind: p
  original: '"The rise of Christianity to political power produced little change in policy.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.20.2
  kind: p
  original: The leading fathers of the Church tolerated prostitution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.20.3
  kind: p
  original: Brothels under municipal protection are found in the thirteenth century.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.20.4
  kind: p
  original: They constituted a sort of public service, the directors of them being considered almost as public servants."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VIII.N3
- id: VIII.21.1
  kind: p
  original: 'To this must be added the following from Dr. Sanger''s work:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.22.1
  kind: p
  original: '"Pope Clement II. issued a bull that prostitutes would be tolerated if they pay a certain amount of their earnings to the Church.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.23.1
  kind: p
  original: '"Pope Sixtus IV. was more practical; from one single brothel, which he himself had built, he received an income of 20,000 ducats."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.24.1
  kind: p
  original: In modern times the Church is a little more careful in that direction.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.24.2
  kind: p
  original: At least she does not openly demand tribute from prostitutes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.24.3
  kind: p
  original: She finds it much more profitable to go in for real estate, like Trinity Church, for instance, to rent out death traps at an exorbitant price to those who live off and by prostitution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.25.1
  kind: p
  original: Much as I should like to, my space will not admit speaking of prostitution in Egypt, Greece, Rome, and during the Middle Ages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.25.2
  kind: p
  original: The conditions in the latter period are particularly interesting, inasmuch as prostitution was organized into guilds, presided over by a brothel Queen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.25.3
  kind: p
  original: These guilds employed strikes as a medium of improving their condition and keeping a standard price.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.25.4
  kind: p
  original: Certainly that is more practical a method than the one used by the modern wage slave in society.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.26.1
  kind: p
  original: It would be one-sided and extremely superficial to maintain that the economic factor is the only cause of prostitution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.26.2
  kind: p
  original: There are others no less important and vital.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.26.3
  kind: p
  original: That, too, our reformers know, but dare discuss even less than the institution that saps the very life out of both men and women.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.26.4
  kind: p
  original: I refer to the sex question, the very mention of which causes most people moral spasms.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.27.1
  kind: p
  original: It is a conceded fact that woman is being reared as a sex commodity, and yet she is kept in absolute ignorance of the meaning and importance of sex.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.27.2
  kind: p
  original: Everything dealing with the subject is suppressed, and persons who attempt to bring light into this terrible darkness are persecuted and thrown into prison.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.27.3
  kind: p
  original: Yet it is nevertheless true that so long as a girl is not to know how to take care of herself, not to know the function of the most important part of her life, we need not be surprised if she becomes an easy prey to prostitution, or to any other form of a relationship which degrades her to the position of an object for mere sex gratification.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.28.1
  kind: p
  original: It is due to this ignorance that the entire life and nature of the girl is thwarted and crippled.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.28.2
  kind: p
  original: We have long ago taken it as a self-evident fact that the boy may follow the call of the wild; that is to say, that the boy may, as soon has his sex nature asserts itself, satisfy that nature; but our moralists are scandalized at the very thought that the nature of a girl should assert itself.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.28.3
  kind: p
  original: To the moralist prostitution does not consist so much in the fact that the woman sells her body, but rather that she sells it out of wedlock.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.28.4
  kind: p
  original: That this is no mere statement is proved by the fact that marriage for monetary considerations is perfectly legitimate, sanctified by law and public opinion, while any other union is condemned and repudiated.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.28.5
  kind: p
  original: Yet a prostitute, if properly defined, means nothing else than "any person for whom sexual relationships are subordinated to gain."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VIII.N4
- id: VIII.29.1
  kind: p
  original: '"Those women are prostitutes who sell their bodies for the exercise of the sexual act and make of this a profession."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VIII.N5
- id: VIII.30.1
  kind: p
  original: In fact, Banger goes further; he maintains that the act of prostitution is "intrinsically equal to that of a man or woman who contracts a marriage for economic reasons."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.31.1
  kind: p
  original: Of course, marriage is the goal of every girl, but as thousands of girls cannot marry, our stupid social customs condemn them either to a life of celibacy or prostitution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.31.2
  kind: p
  original: Human nature asserts itself regardless of all laws, nor is there any plausible reason why nature should adapt itself to a perverted conception of morality.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.32.1
  kind: p
  original: Society considers the sex experiences of a man as attributes of his general development, while similar experiences in the life of a woman are looked upon as a terrible calamity, a loss of honor and of all that is good and noble in a human being.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.32.2
  kind: p
  original: This double standard of morality has played no little part in the creation and perpetuation of prostitution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.32.3
  kind: p
  original: It involves the keeping of the young in absolute ignorance on sex matters, which alleged "innocence," together with an overwrought and stifled sex nature, helps to bring about a state of affairs that our Puritans are so anxious to avoid or prevent.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.33.1
  kind: p
  original: Not that the gratification of sex must needs lead to prostitution; it is the cruel, heartless, criminal persecution of those who dare divert from the beaten paths, which is responsible for it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.34.1
  kind: p
  original: Girls, mere children, work in crowded, over-heated rooms ten to twelve hours daily at a machine, which tends to keep them in a constant over-excited sex state.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.34.2
  kind: p
  original: Many of these girls have no home or comforts of any kind; therefore the street or some place of cheap amusement is the only means of forgetting their daily routine.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.34.3
  kind: p
  original: This naturally brings them into close proximity with the other sex.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.34.4
  kind: p
  original: It is hard to say which of the two factors brings the girl's over-sexed condition to a climax, but it is certainly the most natural thing that a climax should result.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.34.5
  kind: p
  original: That is the first step toward prostitution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.34.6
  kind: p
  original: Nor is the girl to be held responsible for it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.34.7
  kind: p
  original: On the contrary, it is altogether the fault of society, the fault of our lack of understanding, of our lack of appreciation of life in the making; especially is it the criminal fault of our moralists, who condemn a girl for all eternity, because she has gone from the "path of virtue"; that is, because her first sex experience has taken place without the sanction of the Church.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.35.1
  kind: p
  original: The girl feels herself a complete outcast, with the doors of home and society closed in her face.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.35.2
  kind: p
  original: Her entire training and tradition is such that the girl herself feels depraved and fallen, and therefore has no ground to stand upon, or any hold that will lift her up, instead of dragging her down.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.35.3
  kind: p
  original: Thus society creates the victims that it afterwards vainly attempts to get rid of.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.35.4
  kind: p
  original: The meanest, most depraved and decrepit man still considers himself too good to take as his wife the woman whose grace he was quite willing to buy, even though he might thereby save her from a life of horror.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.35.5
  kind: p
  original: Nor can she turn to her own sister for help.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
