section: VI
title_original: Francisco Ferrer and The Modern School
title_en: Francisco Ferrer and The Modern School
author: Emma Goldman
date: '1910'
original_language: en
anchor_language: en
source_original: 'Emma Goldman, Anarchism and Other Essays, with a biographic sketch by Hippolyte Havel (New York: Mother Earth Publishing Association, 1910), public domain; Project Gutenberg ebook 2162'
source_en: 'None needed: the original is in English'
verses:
- id: VI.0.1
  kind: heading
  original: Francisco Ferrer and The Modern School
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.1.1
  kind: p
  original: Experience has come to be considered the best school of life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.1.2
  kind: p
  original: The man or woman who does not learn some vital lesson in that school is looked upon as a dunce indeed.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.1.3
  kind: p
  original: Yet strange to say, that though organized institutions continue perpetrating errors, though they learn nothing from experience, we acquiesce, as a matter of course.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.2.1
  kind: p
  original: There lived and worked in Barcelona a man by the name of Francisco Ferrer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.2.2
  kind: p
  original: A teacher of children he was, known and loved by his people.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.2.3
  kind: p
  original: Outside of Spain only the cultured few knew of Francisco Ferrer's work.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.2.4
  kind: p
  original: To the world at large this teacher was non-existent.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.3.1
  kind: p
  original: On the first of September, 1909, the Spanish government--at the behest of the Catholic Church--arrested Francisco Ferrer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.3.2
  kind: p
  original: On the thirteenth of October, after a mock trial, he was placed in the ditch at Montjuich prison, against the hideous wall of many sighs, and shot dead.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.3.3
  kind: p
  original: Instantly Ferrer, the obscure teacher, became a universal figure, blazing forth the indignation and wrath of the whole civilized world against the wanton murder.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.4.1
  kind: p
  original: The killing of Francisco Ferrer was not the first crime committed by the Spanish government and the Catholic Church.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.4.2
  kind: p
  original: The history of these institutions is one long stream of fire and blood.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.4.3
  kind: p
  original: Still they have not learned through experience, nor yet come to realize that every frail being slain by Church and State grows and grows into a mighty giant, who will some day free humanity from their perilous hold.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.5.1
  kind: p
  original: Francisco Ferrer was born in 1859, of humble parents.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.5.2
  kind: p
  original: They were Catholics, and therefore hoped to raise their son in the same faith.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.5.3
  kind: p
  original: They did not know that the boy was to become the harbinger of a great truth, that his mind would refuse to travel in the old path.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.5.4
  kind: p
  original: At an early age Ferrer began to question the faith of his fathers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.5.5
  kind: p
  original: He demanded to know how it is that the God who spoke to him of goodness and love would mar the sleep of the innocent child with dread and awe of tortures, of suffering, of hell.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.5.6
  kind: p
  original: Alert and of a vivid and investigating mind, it did not take him long to discover the hideousness of that black monster, the Catholic Church.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.5.7
  kind: p
  original: He would have none of it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.6.1
  kind: p
  original: Francisco Ferrer was not only a doubter, a searcher for truth; he was also a rebel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.6.2
  kind: p
  original: His spirit would rise in just indignation against the iron regime of his country, and when a band of rebels, led by the brave patriot, General Villacampa, under the banner of the Republican ideal, made an onslaught on that regime, none was more ardent a fighter than young Francisco Ferrer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.6.3
  kind: p
  original: The Republican ideal,--I hope no one will confound it with the Republicanism of this country.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.6.4
  kind: p
  original: Whatever objection I, as an Anarchist, have to the Republicans of Latin countries, I know they tower high above the corrupt and reactionary party which, in America, is destroying every vestige of liberty and justice.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.6.5
  kind: p
  original: One has but to think of the Mazzinis, the Garibaldis, the scores of others, to realize that their efforts were directed, not merely towards the overthrow of despotism, but particularly against the Catholic Church, which from its very inception has been the enemy of all progress and liberalism.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.7.1
  kind: p
  original: In America it is just the reverse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.7.2
  kind: p
  original: Republicanism stands for vested rights, for imperialism, for graft, for the annihilation of every semblance of liberty.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.7.3
  kind: p
  original: Its ideal is the oily, creepy respectability of a McKinley, and the brutal arrogance of a Roosevelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.8.1
  kind: p
  original: The Spanish republican rebels were subdued.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.8.2
  kind: p
  original: It takes more than one brave effort to split the rock of ages, to cut off the head of that hydra monster, the Catholic Church and the Spanish throne.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.8.3
  kind: p
  original: Arrest, persecution, and punishment followed the heroic attempt of the little band.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.8.4
  kind: p
  original: Those who could escape the bloodhounds had to flee for safety to foreign shores.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.8.5
  kind: p
  original: Francisco Ferrer was among the latter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.8.6
  kind: p
  original: He went to France.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.9.1
  kind: p
  original: How his soul must have expanded in the new land!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.9.2
  kind: p
  original: France, the cradle of liberty, of ideas, of action.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.9.3
  kind: p
  original: Paris, the ever young, intense Paris, with her pulsating life, after the gloom of his own belated country,--how she must have inspired him.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.9.4
  kind: p
  original: What opportunities, what a glorious chance for a young idealist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.10.1
  kind: p
  original: Francisco Ferrer lost no time.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.10.2
  kind: p
  original: Like one famished he threw himself into the various liberal movements, met all kinds of people, learned, absorbed, and grew.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.10.3
  kind: p
  original: While there, he also saw in operation the Modern School, which was to play such an important and fatal part in his life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.11.1
  kind: p
  original: The Modern School in France was founded long before Ferrer's time.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.11.2
  kind: p
  original: Its originator, though on a small scale, was that sweet spirit, Louise Michel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.11.3
  kind: p
  original: Whether consciously or unconsciously, our own great Louise felt long ago that the future belongs to the young generation; that unless the young be rescued from that mind and soul destroying institution, the bourgeois school, social evils will continue to exist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.11.4
  kind: p
  original: Perhaps she thought, with Ibsen, that the atmosphere is saturated with ghosts, that the adult man and woman have so many superstitions to overcome.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.11.5
  kind: p
  original: No sooner do they outgrow the deathlike grip of one spook, lo! they find themselves in the thralldom of ninety-nine other spooks.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.11.6
  kind: p
  original: Thus but a few reach the mountain peak of complete regeneration.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.12.1
  kind: p
  original: The child, however, has no traditions to overcome.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.12.2
  kind: p
  original: Its mind is not burdened with set ideas, its heart has not grown cold with class and caste distinctions.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.12.3
  kind: p
  original: The child is to the teacher what clay is to the sculptor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.12.4
  kind: p
  original: Whether the world will receive a work of art or a wretched imitation, depends to a large extent on the creative power of the teacher.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.13.1
  kind: p
  original: Louise Michel was pre-eminently qualified to meet the child's soul cravings.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.13.2
  kind: p
  original: Was she not herself of a childlike nature, so sweet and tender, unsophisticated and generous.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.13.3
  kind: p
  original: The soul of Louise burned always at white heat over every social injustice.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.13.4
  kind: p
  original: She was invariably in the front ranks whenever the people of Paris rebelled against some wrong.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.13.5
  kind: p
  original: And as she was made to suffer imprisonment for her great devotion to the oppressed, the little school on Montmartre was soon no more.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.13.6
  kind: p
  original: But the seed was planted, and has since borne fruit in many cities of France.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.14.1
  kind: p
  original: The most important venture of a Modern School was that of the great, young old man, Paul Robin.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.14.2
  kind: p
  original: Together with a few friends he established a large school at Cempuis, a beautiful place near Paris.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.14.3
  kind: p
  original: Paul Robin aimed at a higher ideal than merely modern ideas in education.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.14.4
  kind: p
  original: He wanted to demonstrate by actual facts that the bourgeois conception of heredity is but a mere pretext to exempt society from its terrible crimes against the young.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.14.5
  kind: p
  original: The contention that the child must suffer for the sins of the fathers, that it must continue in poverty and filth, that it must grow up a drunkard or criminal, just because its parents left it no other legacy, was too preposterous to the beautiful spirit of Paul Robin.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.14.6
  kind: p
  original: He believed that whatever part heredity may play, there are other factors equally great, if not greater, that may and will eradicate or minimize the so-called first cause.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.14.7
  kind: p
  original: Proper economic and social environment, the breath and freedom of nature, healthy exercise, love and sympathy, and, above all, a deep understanding for the needs of the child--these would destroy the cruel, unjust, and criminal stigma imposed on the innocent young.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.15.1
  kind: p
  original: 'Paul Robin did not select his children; he did not go to the so-called best parents: he took his material wherever he could find it.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.15.2
  kind: p
  original: From the street, the hovels, the orphan and foundling asylums, the reformatories, from all those gray and hideous places where a benevolent society hides its victims in order to pacify its guilty conscience.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.15.3
  kind: p
  original: He gathered all the dirty, filthy, shivering little waifs his place would hold, and brought them to Cempuis.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.15.4
  kind: p
  original: There, surrounded by nature's own glory, free and unrestrained, well fed, clean kept, deeply loved and understood, the little human plants began to grow, to blossom, to develop beyond even the expectations of their friend and teacher, Paul Robin.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.16.1
  kind: p
  original: The children grew and developed into self-reliant, liberty loving men and women.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.16.2
  kind: p
  original: What greater danger to the institutions that make the poor in order to perpetuate the poor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.16.3
  kind: p
  original: Cempuis was closed by the French government on the charge of co-education, which is prohibited in France.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.16.4
  kind: p
  original: However, Cempuis had been in operation long enough to prove to all advanced educators its tremendous possibilities, and to serve as an impetus for modern methods of education, that are slowly but inevitably undermining the present system.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.17.1
  kind: p
  original: Cempuis was followed by a great number of other educational attempts,--among them, by Madelaine Vernet, a gifted writer and poet, author of L'AMOUR LIBRE, and Sebastian Faure, with his LA RUCHE, which I visited while in Paris, in 1907.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N1
- id: VI.18.1
  kind: p
  original: Several years ago Comrade Faure bought the land on which he built his LA RUCHE.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.18.2
  kind: p
  original: In a comparatively short time he succeeded in transforming the former wild, uncultivated country into a blooming spot, having all the appearance of a well kept farm.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.18.3
  kind: p
  original: A large, square court, enclosed by three buildings, and a broad path leading to the garden and orchards, greet the eye of the visitor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.18.4
  kind: p
  original: The garden, kept as only a Frenchman knows how, furnishes a large variety of vegetables for LA RUCHE.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.19.1
  kind: p
  original: Sebastian Faure is of the opinion that if the child is subjected to contradictory influences, its development suffers in consequence.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.19.2
  kind: p
  original: Only when the material needs, the hygiene of the home, and intellectual environment are harmonious, can the child grow into a healthy, free being.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.20.1
  kind: p
  original: 'Referring to his school, Sebastian Faure has this to say:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.21.1
  kind: p
  original: '"I have taken twenty-four children of both sexes, mostly orphans, or those whose parents are too poor to pay.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.21.2
  kind: p
  original: They are clothed, housed, and educated at my expense.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.21.3
  kind: p
  original: Till their twelfth year they will receive a sound, elementary education.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.21.4
  kind: p
  original: Between the age of twelve and fifteen--their studies still continuing--they are to be taught some trade, in keeping with their individual disposition and abilities.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.21.5
  kind: p
  original: After that they are at liberty to leave LA RUCHE to begin life in the outside world, with the assurance that they may at any time return to LA RUCHE, where they will be received with open arms and welcomed as parents do their beloved children.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.21.6
  kind: p
  original: 'Then, if they wish to work at our place, they may do so under the following conditions: One third of the product to cover his or her expenses of maintenance, another third to go towards the general fund set aside for accommodating new children, and the last third to be devoted to the personal use of the child, as he or she may see fit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.22.1
  kind: p
  original: '"The health of the children who are now in my care is perfect.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.22.2
  kind: p
  original: Pure air, nutritious food, physical exercise in the open, long walks, observation of hygienic rules, the short and interesting method of instruction, and, above all, our affectionate understanding and care of the children, have produced admirable physical and mental results.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.23.1
  kind: p
  original: '"It would be unjust to claim that our pupils have accomplished wonders; yet, considering that they belong to the average, having had no previous opportunities, the results are very gratifying indeed.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.23.2
  kind: p
  original: The most important thing they have acquired--a rare trait with ordinary school children--is the love of study, the desire to know, to be informed.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.23.3
  kind: p
  original: They have learned a new method of work, one that quickens the memory and stimulates the imagination.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.23.4
  kind: p
  original: We make a particular effort to awaken the child's interest in his surroundings, to make him realize the importance of observation, investigation, and reflection, so that when the children reach maturity, they would not be deaf and blind to the things about them.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.23.5
  kind: p
  original: Our children never accept anything in blind faith, without inquiry as to why and wherefore; nor do they feel satisfied until their questions are thoroughly answered.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.23.6
  kind: p
  original: Thus their minds are free from doubts and fear resultant from incomplete or untruthful replies; it is the latter which warp the growth of the child, and create a lack of confidence in himself and those about him.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.24.1
  kind: p
  original: '"It is surprising how frank and kind and affectionate our little ones are to each other.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.24.2
  kind: p
  original: The harmony between themselves and the adults at LA RUCHE is highly encouraging.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.24.3
  kind: p
  original: We should feel at fault if the children were to fear or honor us merely because we are their elders.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.24.4
  kind: p
  original: We leave nothing undone to gain their confidence and love; that accomplished, understanding will replace duty; confidence, fear; and affection, severity.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.25.1
  kind: p
  original: '"No one has yet fully realized the wealth of sympathy, kindness, and generosity hidden in the soul of the child.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.25.2
  kind: p
  original: The effort of every true educator should be to unlock that treasure--to stimulate the child's impulses, and call forth the best and noblest tendencies.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.25.3
  kind: p
  original: What greater reward can there be for one whose life-work is to watch over the growth of the human plant, than to see its nature unfold its petals, and to observe it develop into a true individuality.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.25.4
  kind: p
  original: My comrades at LA RUCHE look for no greater reward, and it is due to them and their efforts, even more than to my own, that our human garden promises to bear beautiful fruit."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N2
- id: VI.26.1
  kind: p
  original: 'Regarding the subject of history and the prevailing old methods of instruction, Sebastian Faure said:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.27.1
  kind: p
  original: '"We explain to our children that true history is yet to be written,--the story of those who have died, unknown, in the effort to aid humanity to greater achievement."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N3
- id: VI.28.1
  kind: p
  original: Francisco Ferrer could not escape this great wave of Modern School attempts.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.28.2
  kind: p
  original: He saw its possibilities, not merely in theoretic form, but in their practical application to every-day needs.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.28.3
  kind: p
  original: He must have realized that Spain, more than any other country, stands in need of just such schools, if it is ever to throw off the double yoke of priest and soldier.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.29.1
  kind: p
  original: When we consider that the entire system of education in Spain is in the hands of the Catholic Church, and when we further remember the Catholic formula, "To inculcate Catholicism in the mind of the child until it is nine years of age is to ruin it forever for any other idea," we will understand the tremendous task of Ferrer in bringing the new light to his people.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.29.2
  kind: p
  original: Fate soon assisted him in realizing his great dream.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.30.1
  kind: p
  original: Mlle. Meunier, a pupil of Francisco Ferrer, and a lady of wealth, became interested in the Modern School project.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.30.2
  kind: p
  original: When she died, she left Ferrer some valuable property and twelve thousand francs yearly income for the School.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.31.1
  kind: p
  original: It is said that mean souls can conceive of naught but mean ideas.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.31.2
  kind: p
  original: If so, the contemptible methods of the Catholic Church to blackguard Ferrer's character, in order to justify her own black crime, can readily be explained.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.31.3
  kind: p
  original: Thus the lie was spread in American Catholic papers, that Ferrer used his intimacy with Mlle. Meunier to get possession of her money.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.32.1
  kind: p
  original: Personally, I hold that the intimacy, of whatever nature, between a man and a woman, is their own affair, their sacred own.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.32.2
  kind: p
  original: I would therefore not lose a word in referring to the matter, if it were not one of the many dastardly lies circulated about Ferrer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.32.3
  kind: p
  original: Of course, those who know the purity of the Catholic clergy will understand the insinuation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.32.4
  kind: p
  original: Have the Catholic priests ever looked upon woman as anything but a sex commodity?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.32.5
  kind: p
  original: The historical data regarding the discoveries in the cloisters and monasteries will bear me out in that.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.32.6
  kind: p
  original: How, then, are they to understand the co-operation of a man and a woman, except on a sex basis?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.33.1
  kind: p
  original: As a matter of fact, Mlle. Meunier was considerably Ferrer's senior.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.33.2
  kind: p
  original: Having spent her childhood and girlhood with a miserly father and a submissive mother, she could easily appreciate the necessity of love and joy in child life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.33.3
  kind: p
  original: She must have seen that Francisco Ferrer was a teacher, not college, machine, or diploma-made, but one endowed with genius for that calling.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.34.1
  kind: p
  original: Equipped with knowledge, with experience, and with the necessary means; above all, imbued with the divine fire of his mission, our Comrade came back to Spain, and there began his life's work.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.34.2
  kind: p
  original: On the ninth of September, 1901, the first Modern School was opened.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.34.3
  kind: p
  original: It was enthusiastically received by the people of Barcelona, who pledged their support.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.34.4
  kind: p
  original: In a short address at the opening of the School, Ferrer submitted his program to his friends.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.34.5
  kind: p
  original: 'He said: "I am not a speaker, not a propagandist, not a fighter.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.34.6
  kind: p
  original: I am a teacher; I love children above everything.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.34.7
  kind: p
  original: I think I understand them.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.34.8
  kind: p
  original: I want my contribution to the cause of liberty to be a young generation ready to meet a new era."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.35.1
  kind: p
  original: He was cautioned by his friends to be careful in his opposition to the Catholic Church.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.35.2
  kind: p
  original: They knew to what lengths she would go to dispose of an enemy.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.35.3
  kind: p
  original: Ferrer, too, knew.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.35.4
  kind: p
  original: But, like Brand, he believed in all or nothing.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.35.5
  kind: p
  original: He would not erect the Modern School on the same old lie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.35.6
  kind: p
  original: He would be frank and honest and open with the children.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.36.1
  kind: p
  original: Francisco Ferrer became a marked man.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.36.2
  kind: p
  original: From the very first day of the opening of the School, he was shadowed.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.36.3
  kind: p
  original: The school building was watched, his little home in Mangat was watched.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.36.4
  kind: p
  original: He was followed every step, even when he went to France or England to confer with his colleagues.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.36.5
  kind: p
  original: He was a marked man, and it was only a question of time when the lurking enemy would tighten the noose.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.37.1
  kind: p
  original: It succeeded, almost, in 1906, when Ferrer was implicated in the attempt on the life of Alfonso.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.37.2
  kind: p
  original: The evidence exonerating him was too strong even for the black crows; they had to let him go--not for good, however.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N4
- id: VI.37.3
  kind: p
  original: They waited.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.37.4
  kind: p
  original: Oh, they can wait, when they have set themselves to trap a victim.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.38.1
  kind: p
  original: The moment came at last, during the anti-military uprising in Spain, in July, 1909.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.38.2
  kind: p
  original: One will have to search in vain the annals of revolutionary history to find a more remarkable protest against militarism.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.38.3
  kind: p
  original: Having been soldier-ridden for centuries, the people of Spain could stand the yoke no longer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.38.4
  kind: p
  original: They would refuse to participate in useless slaughter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.38.5
  kind: p
  original: They saw no reason for aiding a despotic government in subduing and oppressing a small people fighting for their independence, as did the brave Riffs.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.38.6
  kind: p
  original: No, they would not bear arms against them.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.39.1
  kind: p
  original: For eighteen hundred years the Catholic Church has preached the gospel of peace.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.39.2
  kind: p
  original: Yet, when the people actually wanted to make this gospel a living reality, she urged the authorities to force them to bear arms.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.39.3
  kind: p
  original: Thus the dynasty of Spain followed the murderous methods of the Russian dynasty,--the people were forced to the battlefield.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.40.1
  kind: p
  original: Then, and not until then, was their power of endurance at an end.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.40.2
  kind: p
  original: Then, and not until then, did the workers of Spain turn against their masters, against those who, like leeches, had drained their strength, their very life-blood.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.40.3
  kind: p
  original: Yes, they attacked the churches and the priests, but if the latter had a thousand lives, they could not possibly pay for the terrible outrages and crimes perpetrated upon the Spanish people.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.41.1
  kind: p
  original: Francisco Ferrer was arrested on the first of September, 1909.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.41.2
  kind: p
  original: Until October first, his friends and comrades did not even know what had become of him.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.41.3
  kind: p
  original: On that day a letter was received by L'HUMANITE, from which can be learned the whole mockery of the trial.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.41.4
  kind: p
  original: 'And the next day his companion, Soledad Villafranca, received the following letter:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.42.1
  kind: p
  original: '"No reason to worry; you know I am absolutely innocent.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.42.2
  kind: p
  original: Today I am particularly hopeful and joyous.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.42.3
  kind: p
  original: It is the first time I can write to you, and the first time since my arrest that I can bathe in the rays of the sun, streaming generously through my cell window.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.42.4
  kind: p
  original: You, too, must be joyous."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.43.1
  kind: p
  original: How pathetic that Ferrer should have believed, as late as October fourth, that he would not be condemned to death.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.43.2
  kind: p
  original: Even more pathetic that his friends and comrades should once more have made the blunder in crediting the enemy with a sense of justice.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.43.3
  kind: p
  original: Time and again they had placed faith in the judicial powers, only to see their brothers killed before their very eyes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.43.4
  kind: p
  original: They made no preparation to rescue Ferrer, not even a protest of any extent; nothing.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.43.5
  kind: p
  original: '"Why, it is impossible to condemn Ferrer; he is innocent."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.43.6
  kind: p
  original: But everything is possible with the Catholic Church.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.43.7
  kind: p
  original: Is she not a practiced henchman, whose trials of her enemies are the worst mockery of justice?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.44.1
  kind: p
  original: 'On October fourth Ferrer sent the following letter to L''HUMANITE:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.45.1
  kind: signature
  original: The Prison Cell, Oct. 4, 1909.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.46.1
  kind: p
  original: My dear Friends--Notwithstanding most absolute innocence, the prosecutor demands the death penalty, based on denunciations of the police, representing me as the chief of the world's Anarchists, directing the labor syndicates of France, and guilty of conspiracies and insurrections everywhere, and declaring that my voyages to London and Paris were undertaken with no other object.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.47.1
  kind: p
  original: With such infamous lies they are trying to kill me.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.48.1
  kind: p
  original: The messenger is about to depart and I have not time for more.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.48.2
  kind: p
  original: All the evidence presented to the investigating judge by the police is nothing but a tissue of lies and calumnious insinuations.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.48.3
  kind: p
  original: But no proofs against me, having done nothing at all.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.49.1
  kind: signature
  original: FERRER.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.50.1
  kind: p
  original: October thirteenth, 1909, Ferrer's heart, so brave, so staunch, so loyal, was stilled.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.50.2
  kind: p
  original: Poor fools!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.50.3
  kind: p
  original: The last agonized throb of that heart had barely died away when it began to beat a hundredfold in the hearts of the civilized world, until it grew into terrific thunder, hurling forth its malediction upon the instigators of the black crime.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.50.4
  kind: p
  original: Murderers of black garb and pious mien, to the bar of justice!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.51.1
  kind: p
  original: Did Francisco Ferrer participate in the anti-military uprising?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.51.2
  kind: p
  original: According to the first indictment, which appeared in a Catholic paper in Madrid, signed by the Bishop and all the prelates of Barcelona, he was not even accused of participation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.51.3
  kind: p
  original: The indictment was to the effect that Francisco Ferrer was guilty of having organized godless schools, and having circulated godless literature.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.51.4
  kind: p
  original: But in the twentieth century men can not be burned merely for their godless beliefs.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.51.5
  kind: p
  original: Something else had to be devised; hence the charge of instigating the uprising.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.52.1
  kind: p
  original: In no authentic source so far investigated could a single proof be found to connect Ferrer with the uprising.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.52.2
  kind: p
  original: But then, no proofs were wanted, or accepted, by the authorities.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.52.3
  kind: p
  original: There were seventy-two witnesses, to be sure, but their testimony was taken on paper.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.52.4
  kind: p
  original: They never were confronted with Ferrer, or he with them.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.53.1
  kind: p
  original: Is it psychologically possible that Ferrer should have participated?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.53.2
  kind: p
  original: I do not believe it is, and here are my reasons.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.53.3
  kind: p
  original: Francisco Ferrer was not only a great teacher, but he was also undoubtedly a marvelous organizer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.53.4
  kind: p
  original: In eight years, between 1901-1909, he had organized in Spain one hundred and nine schools, besides inducing the liberal element of his country to organize three hundred and eight other schools.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.53.5
  kind: p
  original: In connection with his own school work, Ferrer had equipped a modern printing plant, organized a staff of translators, and spread broadcast one hundred and fifty thousand copies of modern scientific and sociologic works, not to forget the large quantity of rationalist text books.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.53.6
  kind: p
  original: Surely none but the most methodical and efficient organizer could have accomplished such a feat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.54.1
  kind: p
  original: On the other hand, it was absolutely proven that the anti-military uprising was not at all organized; that it came as a surprise to the people themselves, like a great many revolutionary waves on previous occasions.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.54.2
  kind: p
  original: The people of Barcelona, for instance, had the city in their control for four days, and, according to the statement of tourists, greater order and peace never prevailed.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.54.3
  kind: p
  original: Of course, the people were so little prepared that when the time came, they did not know what to do.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.54.4
  kind: p
  original: In this regard they were like the people of Paris during the Commune of 1871.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.54.5
  kind: p
  original: They, too, were unprepared.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.54.6
  kind: p
  original: While they were starving, they protected the warehouses, filled to the brim with provisions.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.54.7
  kind: p
  original: They placed sentinels to guard the Bank of France, where the bourgeoisie kept the stolen money.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.54.8
  kind: p
  original: The workers of Barcelona, too, watched over the spoils of their masters.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.55.1
  kind: p
  original: How pathetic is the stupidity of the underdog; how terribly tragic!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.55.2
  kind: p
  original: But, then, have not his fetters been forged so deeply into his flesh, that he would not, even if he could, break them?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.55.3
  kind: p
  original: The awe of authority, of law, of private property, hundredfold burned into his soul,--how is he to throw it off unprepared, unexpectedly?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.56.1
  kind: p
  original: Can anyone assume for a moment that a man like Ferrer would affiliate himself with such a spontaneous, unorganized effort?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.56.2
  kind: p
  original: Would he not have known that it would result in a defeat, a disastrous defeat for the people?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.56.3
  kind: p
  original: And is it not more likely that if he would have taken part, he, the experienced ENTREPRENEUR, would have thoroughly organized the attempt?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.56.4
  kind: p
  original: If all other proofs were lacking, that one factor would be sufficient to exonerate Francisco Ferrer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.56.5
  kind: p
  original: But there are others equally convincing.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.57.1
  kind: p
  original: For the very date of the outbreak, July twenty-fifth, Ferrer had called a conference of his teachers and members of the League of Rational Education.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.57.2
  kind: p
  original: It was to consider the autumn work, and particularly the publication of Elisee Reclus' great book, L'HOMME ET LA TERRE, and Peter Kropotkin's GREAT FRENCH REVOLUTION.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.57.3
  kind: p
  original: Is it at all likely, is it at all plausible that Ferrer, knowing of the uprising, being a party to it, would in cold blood invite his friends and colleagues to Barcelona for the day on which he realized their lives would be endangered?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.57.4
  kind: p
  original: Surely, only the criminal, vicious mind of a Jesuit could credit such deliberate murder.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.58.1
  kind: p
  original: Francisco Ferrer had his life-work mapped out; he had everything to lose and nothing to gain, except ruin and disaster, were he to lend assistance to the outbreak.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.58.2
  kind: p
  original: Not that he doubted the justice of the people's wrath; but his work, his hope, his very nature was directed toward another goal.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.59.1
  kind: p
  original: In vain are the frantic efforts of the Catholic Church, her lies, falsehoods, calumnies.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.59.2
  kind: p
  original: She stands condemned by the awakened human conscience of having once more repeated the foul crimes of the past.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.60.1
  kind: p
  original: Francisco Ferrer is accused of teaching the children the most blood-curdling ideas,--to hate God, for instance.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.60.2
  kind: p
  original: Horrors!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.60.3
  kind: p
  original: Francisco Ferrer did not believe in the existence of a God.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.60.4
  kind: p
  original: Why teach the child to hate something which does not exist?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.60.5
  kind: p
  original: Is it not more likely that he took the children out into the open, that he showed them the splendor of the sunset, the brilliancy of the starry heavens, the awe-inspiring wonder of the mountains and seas; that he explained to them in his simple, direct way the law of growth, of development, of the interrelation of all life?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.60.6
  kind: p
  original: In so doing he made it forever impossible for the poisonous weeds of the Catholic Church to take root in the child's mind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.61.1
  kind: p
  original: It has been stated that Ferrer prepared the children to destroy the rich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.61.2
  kind: p
  original: Ghost stories of old maids.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.61.3
  kind: p
  original: Is it not more likely that he prepared them to succor the poor?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.61.4
  kind: p
  original: That he taught them the humiliation, the degradation, the awfulness of poverty, which is a vice and not a virtue; that he taught the dignity and importance of all creative efforts, which alone sustain life and build character.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.61.5
  kind: p
  original: Is it not the best and most effective way of bringing into the proper light the absolute uselessness and injury of parasitism?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.62.1
  kind: p
  original: Last, but not least, Ferrer is charged with undermining the army by inculcating anti-military ideas.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.62.2
  kind: p
  original: Indeed?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.62.3
  kind: p
  original: He must have believed with Tolstoy that war is legalized slaughter, that it perpetuates hatred and arrogance, that it eats away the heart of nations, and turns them into raving maniacs.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.63.1
  kind: p
  original: 'However, we have Ferrer''s own word regarding his ideas of modern education:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.64.1
  kind: p
  original: '"I would like to call the attention of my readers to this idea: All the value of education rests in the respect for the physical, intellectual, and moral will of the child.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.64.2
  kind: p
  original: Just as in science no demonstration is possible save by facts, just so there is no real education save that which is exempt from all dogmatism, which leaves to the child itself the direction of its effort, and confines itself to the seconding of its effort.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.64.3
  kind: p
  original: Now, there is nothing easier than to alter this purpose, and nothing harder than to respect it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.64.4
  kind: p
  original: Education is always imposing, violating, constraining; the real educator is he who can best protect the child against his (the teacher's) own ideas, his peculiar whims; he who can best appeal to the child's own energies.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.65.1
  kind: p
  original: '"We are convinced that the education of the future will be of an entirely spontaneous nature; certainly we can not as yet realize it, but the evolution of methods in the direction of a wider comprehension of the phenomena of life, and the fact that all advances toward perfection mean the overcoming of restraint,--all this indicates that we are in the right when we hope for the deliverance of the child through science.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.66.1
  kind: p
  original: '"Let us not fear to say that we want men capable of evolving without stopping, capable of destroying and renewing their environments without cessation, of renewing themselves also; men, whose intellectual independence will be their greatest force, who will attach themselves to nothing, always ready to accept what is best, happy in the triumph of new ideas, aspiring to live multiple lives in one life.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.66.2
  kind: p
  original: Society fears such men; we therefore must not hope that it will ever want an education able to give them to us.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.67.1
  kind: p
  original: '"We shall follow the labors of the scientists who study the child with the greatest attention, and we shall eagerly seek for means of applying their experience to the education which we want to build up, in the direction of an ever fuller liberation of the individual.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.67.2
  kind: p
  original: But how can we attain our end?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.67.3
  kind: p
  original: Shall it not be by putting ourselves directly to the work favoring the foundation of new schools, which shall be ruled as much as possible by this spirit of liberty, which we forefeel will dominate the entire work of education in the future?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.68.1
  kind: p
  original: '"A trial has been made, which, for the present, has already given excellent results.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.68.2
  kind: p
  original: We can destroy all which in the present school answers to the organization of constraint, the artificial surroundings by which children are separated from nature and life, the intellectual and moral discipline made use of to impose ready-made ideas upon them, beliefs which deprave and annihilate natural bent.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.68.3
  kind: p
  original: Without fear of deceiving ourselves, we can restore the child to the environment which entices it, the environment of nature in which he will be in contact with all that he loves, and in which impressions of life will replace fastidious book-learning.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.68.4
  kind: p
  original: If we did no more than that, we should already have prepared in great part the deliverance of the child.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.69.1
  kind: p
  original: '"In such conditions we might already freely apply the data of science and labor most fruitfully.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.70.1
  kind: p
  original: '"I know very well we could not thus realize all our hopes, that we should often be forced, for lack of knowledge, to employ undesirable methods; but a certitude would sustain us in our efforts--namely, that even without reaching our aim completely we should do more and better in our still imperfect work than the present school accomplishes.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.70.2
  kind: p
  original: I like the free spontaneity of a child who knows nothing, better than the world-knowledge and intellectual deformity of a child who has been subjected to our present education."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N5
- id: VI.71.1
  kind: p
  original: Had Ferrer actually organized the riots, had he fought on the barricades, had he hurled a hundred bombs, he could not have been so dangerous to the Catholic Church and to despotism, as with his opposition to discipline and restraint.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.71.2
  kind: p
  original: Discipline and restraint--are they not back of all the evils in the world?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.71.3
  kind: p
  original: Slavery, submission, poverty, all misery, all social iniquities result from discipline and restraint.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.71.4
  kind: p
  original: Indeed, Ferrer was dangerous.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.71.5
  kind: p
  original: Therefore he had to die, October thirteenth, 1909, in the ditch of Montjuich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.71.6
  kind: p
  original: Yet who dare say his death was in vain?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.71.7
  kind: p
  original: 'In view of the tempestuous rise of universal indignation: Italy naming streets in memory of Francisco Ferrer, Belgium inaugurating a movement to erect a memorial; France calling to the front her most illustrious men to resume the heritage of the martyr; England being the first to issue a biography:--all countries uniting in perpetuating the great work of Francisco Ferrer; America, even, tardy always in progressive ideas, giving birth to a Francisco Ferrer Association, its aim being to publish a complete life of Ferrer and to organize Modern Schools all over the country; in the face of this international revolutionary wave, who is there to say Ferrer died in vain?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.72.1
  kind: p
  original: That death at Montjuich,--how wonderful, how dramatic it was, how it stirs the human soul.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.72.2
  kind: p
  original: Proud and erect, the inner eye turned toward the light, Francisco Ferrer needed no lying priests to give him courage, nor did he upbraid a phantom for forsaking him.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.72.3
  kind: p
  original: The consciousness that his executioners represented a dying age, and that his was the living truth, sustained him in the last heroic moments.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.73.1
  kind: p
  original: A dying age and a living truth, / The living burying the dead.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
