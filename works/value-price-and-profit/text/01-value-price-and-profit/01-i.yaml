section: I
title_original: I. Production and Wages
title_en: I. Production and Wages
author: Karl Marx
date: 1865-06
original_language: en
anchor_language: en
source_original: Karl Marx, Value, Price and Profit, ed. Eleanor Marx Aveling (London 1898), public domain; Marxists Internet Archive transcription (proofed by Brandon Poole, 2009; CC BY-SA)
source_en: 'None needed: the original is in English'
verses:
- id: I.0.1
  kind: heading
  original: I. Production and Wages
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.1.1
  kind: p
  original: 'Citizen Weston''s argument rested, in fact, upon two premises: firstly, the amount of national production is a fixed thing, a constant quantity or magnitude, as the mathematicians would say; secondly, that the amount of real wages, that is to say, of wages as measured by the quantity of the commodities they can buy, is a fixed amount, a constant magnitude.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.1
  kind: p
  original: Now, his first assertion is evidently erroneous.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.2
  kind: p
  original: Year after year you will find that the value and mass of production increase, that the productive powers of the national labour increase, and that the amount of money necessary to circulate this increasing production continuously changes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.3
  kind: p
  original: What is true at the end of the year, and for different years compared with each other, is true for every average day of the year.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.4
  kind: p
  original: The amount or magnitude of national production changes continuously.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.5
  kind: p
  original: It is not a constant but a variable magnitude, and apart from changes in population it must be so, because of the continuous change in the accumulation of capital and the productive powers of labour.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.6
  kind: p
  original: It is perfectly true that if a rise in the general rate of wages should take place today, that rise, whatever its ulterior effects might be, would, by itself, not immediately change the amount of production.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.7
  kind: p
  original: It would, in the first instance, proceed from the existing state of things.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.8
  kind: p
  original: But if before the rise of wages the national production was variable, and not fixed, it will continue to be variable and not fixed after the rise of wages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.3.1
  kind: p
  original: But suppose the amount of national production to be constant instead of variable.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.3.2
  kind: p
  original: Even then, what our friend Weston considers a logical conclusion would still remain a gratuitous assertion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.3.3
  kind: p
  original: If I have a given number, say eight, the absolute limits of this number do not prevent its parts from changing their relative limits.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.3.4
  kind: p
  original: If profits were six and wages two, wages might increase to six and profits decrease to two, and still the total amount remain eight.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.3.5
  kind: p
  original: The fixed amount of production would by no means prove the fixed amount of wages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.3.6
  kind: p
  original: How then does our friend Weston prove this fixity?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.3.7
  kind: p
  original: By asserting it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.1
  kind: p
  original: But even conceding him his assertion, it would cut both ways, while he presses it only in one direction.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.2
  kind: p
  original: If the amount of wages is a constant magnitude, then it can be neither increased nor diminished.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.3
  kind: p
  original: If then, in enforcing a temporary rise of wages, the working men act foolishly, the capitalists, in enforcing a temporary fall of wages, would act not less foolishly.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.4
  kind: p
  original: Our friend Weston does not deny that, under certain circumstances, the working men can enforce a rise of wages, but their amount being naturally fixed, there must follow a reaction.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.5
  kind: p
  original: On the other hand, he knows also that the capitalists can enforce a fall of wages, and, indeed, continuously try to enforce it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.6
  kind: p
  original: According to the principle of the constancy of wages, a reaction ought to follow in this case not less than in the former.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.7
  kind: p
  original: The working men, therefore, reacting against the attempt at, or the act of, lowering wages, would act rightly.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.8
  kind: p
  original: They would, therefore, act rightly in enforcing a rise of wages, because every reaction against the lowering of wages is an action for raising wages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.9
  kind: p
  original: According to Citizen Weston's own principle of the constancy of wages, the working men ought, therefore, under certain circumstances, to combine and struggle for a rise of wages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.10
  kind: p
  original: If he denies this conclusion, he must give up the premise from which it flows.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.11
  kind: p
  original: He must not say that the amount of wages is a constant quantity, but that, although it cannot and must not rise, it can and must fall, whenever capital pleases to lower it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.12
  kind: p
  original: If the capitalist pleases to feed you upon potatoes instead of upon meat, and upon oats instead of upon wheat, you must accept his will as a law of political economy, and submit to it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.13
  kind: p
  original: If in one country the rate of wages is higher than in another, in the United States, for example, than in England, you must explain this difference in the rate of wages by a difference between the will of the American capitalist and the will of the English capitalist, a method which would certainly very much simplify, not only the study of economic phenomena, but of all other phenomena.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.5.1
  kind: p
  original: But even then, we might ask, why the will of the American capitalist differs from the will of the English capitalist?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.5.2
  kind: p
  original: And to answer the question you must go beyond the domain of will.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.5.3
  kind: p
  original: A person may tell me that God wills one thing in France, and another thing in England.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.5.4
  kind: p
  original: If I summon him to explain this duality of will, he might have the brass to answer me that God wills to have one will in France and another will in England.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.5.5
  kind: p
  original: But our friend Weston is certainly the last man to make an argument of such a complete negation of all reasoning.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.6.1
  kind: p
  original: The will of the capitalist is certainly to take as much as possible.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.6.2
  kind: p
  original: What we have to do is not to talk about his will, but to enquire into his power, the limits of that power, and the character of those limits.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
