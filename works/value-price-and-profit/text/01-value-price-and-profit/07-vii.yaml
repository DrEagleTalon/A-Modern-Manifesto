verses:
- id: VII.0.1
  kind: heading
  original: VII. Labour Power
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.1.1
  kind: p
  original: Having now, as far as it could be done in such a cursory manner, analyzed the nature of value, of the value of any commodity whatever, we must turn our attention to the specific value of labour.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.1.2
  kind: p
  original: And here, again, I must startle you by a seeming paradox.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.1.3
  kind: p
  original: All of you feel sure that what they daily sell is their Labour; that, therefore, Labour has a price, and that, the price of a commodity being only the monetary expression of its value, there must certainly exist such a thing as the value of labour.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.1.4
  kind: p
  original: However, there exists no such thing as the value of labour in the common acceptance of the word.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.1.5
  kind: p
  original: We have seen that the amount of necessary labour crystallized in a commodity constitutes its value.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.1.6
  kind: p
  original: Now, applying this notion of value, how could we define, say, the value of a ten hours working day?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.1.7
  kind: p
  original: How much labour is contained in that day?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.1.8
  kind: p
  original: Ten hours' labour.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.1
  kind: p
  original: To say that the value of a ten hours working day is equal to ten hours' labour, or the quantity of labour contained in it, would be a tautological and, moreover, a nonsensical expression.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.2
  kind: p
  original: Of course, having once found out the true but hidden sense of the expression "value of labour," we shall be able to interpret this irrational, and seemingly impossible application of value, in the same way that, having once made sure of the real movement of the celestial bodies, we shall be able to explain their apparent or merely phenomenal movements.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.1
  kind: p
  original: What the working man sells is not directly his labour, but his labouring power, the temporary disposal of which he makes over to the capitalist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.2
  kind: p
  original: This is so much the case that I do not know whether by the English Laws, but certainly by some Continental Laws, the maximum time is fixed for which a man is allowed to sell his labouring power.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.3
  kind: p
  original: If allowed to do so for any indefinite period whatever, slavery would be immediately restored.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.4
  kind: p
  original: Such a sale, if it comprised his lifetime, for example, would make him at once the lifelong slave of his employer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.4.1
  kind: p
  original: One of the oldest economists and most original philosophers of England — Thomas Hobbes — has already, in his Leviathan, instinctively hit upon this point overlooked by all his successors.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.4.2
  kind: p
  original: 'He says: "the value or worth of a man is, as in all other things, his price: that is so much as would be given for the use of his power."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.4.3
  kind: p
  original: Proceeding from this basis, we shall be able to determine the value of labour as that of all other commodities.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.1
  kind: p
  original: But before doing so, we might ask, how does this strange phenomenon arise, that we find on the market a set of buyers, possessed of land, machinery, raw material, and the means of subsistence, all of them, save land in its crude state, the products of labour, and on the other hand, a set of sellers who have nothing to sell except their labouring power, their working arms and brains?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.2
  kind: p
  original: That the one set buys continually in order to make a profit and enrich themselves, while the other set continually sells in order to earn their livelihood?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.3
  kind: p
  original: The inquiry into this question would be an inquiry into what the economists call "previous or original accumulation," but which ought to be called original expropriation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.4
  kind: p
  original: We should find that this so-called original accumulation means nothing but a series of historical processes, resulting in a decomposition of the original union existing between the labouring Man and his Instruments of Labour.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.5
  kind: p
  original: Such an inquiry, however, lies beyond the pale of my present subject.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.6
  kind: p
  original: The separation between the Man of Labour and the Instruments of Labour once established, such a state of things will maintain itself and reproduce itself upon a constantly increasing scale, until a new and fundamental revolution in the mode of production should again overturn it, and restore the original union in a new historical form.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.1
  kind: p
  original: What, then, is the value of labouring power?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.1
  kind: p
  original: Like that of every other commodity, its value is determined by the quantity of labour necessary to produce it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.2
  kind: p
  original: The labouring power of a man exists only in his living individuality.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.3
  kind: p
  original: A certain mass of necessaries must be consumed by a man to grow up and maintain his life.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.4
  kind: p
  original: But the man, like the machine, will wear out, and must be replaced by another man.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.5
  kind: p
  original: Beside the mass of necessaries required for his own maintenance, he wants another amount of necessaries to bring up a certain quota of children that are to replace him on the labour market and to perpetuate the race of labourers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.6
  kind: p
  original: Moreover, to develop his labouring power, and acquire a given skill,another amount of values must be spent.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.7
  kind: p
  original: For our purpose it suffices to consider only average labour, the costs of whose education and development are vanishing magnitudes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.8
  kind: p
  original: Still I must seize upon this occasion to state that, as the costs of producing labouring powers of different quality differ, so much differ the values of the labouring powers employed in different trades.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.9
  kind: p
  original: The cry for an equality of wages rests, therefore, upon a mistake, is an inane wish never to be fulfilled.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.10
  kind: p
  original: It is an offspring of that false and superficial radicalism that accepts premises and tries to evade conclusions.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.11
  kind: p
  original: Upon the basis of the wages system the value of labouring power is settled like that of every other commodity; and as different kinds of labouring power have different values, or require different quantities of labour for their production, they must fetch different prices in the labour market.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.12
  kind: p
  original: To clamour for equal or even equitable retribution on the basis of the wages system is the same as to clamour for freedom on the basis of the slavery system.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.13
  kind: p
  original: What you think just or equitable is out of the question.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.14
  kind: p
  original: 'The question is: What is necessary and unavoidable with a given system of production?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.15
  kind: p
  original: After what has been said, it will be seen that the value of labouring power is determined by the value of the necessaries required to produce, develop, maintain, and perpetuate the labouring power.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
