verses:
- id: X.0.1
  kind: heading
  original: X. Profit is Made by Selling a Commodity at its Value
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: X.1.1
  kind: p
  original: Suppose an average hour of labour to be realized in a value equal to sixpence, or twelve average hours of labour to be realized in six shillings.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: X.1.2
  kind: p
  original: Suppose, further, the value of labour to be three shillings or the produce of six hours' labour.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: X.1.3
  kind: p
  original: If, then, in the raw material, machinery, and so forth, used up in a commodity, twenty-four hours of average labour were realized, its value would amount to twelve shillings.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: X.1.4
  kind: p
  original: If, moreover, the workman employed by the capitalist added twelve hours of labour to those means of production, these twelve hours would be realized in an additional value of six shillings.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: X.1.5
  kind: p
  original: The total value of the product would, therefore, amount to thirty-six hours of realized labour, and be equal to eighteen shillings.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: X.1.6
  kind: p
  original: But as the value of labour, or the wages paid to the workman, would be three shillings only, no equivalent would have been paid by the capitalist for the six hours of surplus labour worked by the workman, and realized in the value of the commodity.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: X.1.7
  kind: p
  original: By selling this commodity at its value for eighteen shillings, the capitalist would, therefore, realize a value of three shillings, for which had paid no equivalent.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: X.1.8
  kind: p
  original: These three shillings would constitute the surplus value or profit pocketed by him.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: X.1.9
  kind: p
  original: The capitalist would consequently realize the profit of three shillings, not by selling his commodity at a price over and above its value, but by selling it at its real value.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: X.2.1
  kind: p
  original: The value of a commodity is determined by the total quantity of labour contained in it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: X.2.2
  kind: p
  original: But part of that quantity of labour is realized in a value for which and equivalent has been paid in the form of wages; part of it is realized in a value for which NO equivalent has been paid.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: X.2.3
  kind: p
  original: Part of the labour contained in the commodity is paid labour; part is unpaid labour.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: X.2.4
  kind: p
  original: By selling, therefore, the commodity at its value, that is, as the crystallization of the total quantity of labour bestowed upon it, the capitalist must necessarily sell it at a profit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: X.2.5
  kind: p
  original: He sells not only what has cost him an equivalent, but he sells also what has cost him nothing, although it has cost his workman labour.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: X.2.6
  kind: p
  original: The cost of the commodity to the capitalist and its real cost are different things.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: X.3.1
  kind: p
  original: I repeat, therefore, that normal and average profits are made by selling commodities not above, but at their real values.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
