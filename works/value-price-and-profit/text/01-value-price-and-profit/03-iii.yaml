verses:
- id: III.0.1
  kind: heading
  original: III. Wages and Currency
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.1.1
  kind: p
  original: On the second day of the debate our friend Weston clothed his old assertions in new forms.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.1.2
  kind: p
  original: 'He said: Consequent upon a general rise in money wages, more currency will be wanted to pay the same wages.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.1.3
  kind: p
  original: The currency being fixed, how can you pay with this fixed currency increased money wages?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.1.4
  kind: p
  original: First the difficulty arose from the fixed amount of commodities accruing to the working man despite his increase of money wages; now it arises from the increased money wages, despite the fixed amount of commodities.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.1.5
  kind: p
  original: Of course, if you reject his original dogma, his secondary grievance will disappear.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.1.6
  kind: p
  original: However, I shall show that this currency question has nothing at all to do with the subject before us.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.2.1
  kind: p
  original: In your country the mechanism of payments is much more perfected than in any other country of Europe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.2.2
  kind: p
  original: Thanks to the extent and concentration of the banking system, much less currency is wanted to circulate the same amount of values, and to transact the same or a greater amount of business.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.2.3
  kind: p
  original: For example, as far as wages are concerned, the English factory operative pays his wages weekly to the shopkeeper, who sends them weekly to the banker, who returns them weekly to the manufacturer, who again pays them away to his working men, and so forth.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.2.4
  kind: p
  original: By this contrivance the yearly wages of an operative, say of 52 Pounds, may be paid by one single Sovereign turning round every week in the same circle.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.2.5
  kind: p
  original: Even in England the mechanism is less perfect than in Scotland, and is not everywhere equally perfect; and therefore we find, for example, that in some agricultural districts, much more currency is wanted to circulate a much smaller amount of values.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.3.1
  kind: p
  original: If you cross the Channel you will find that the money wages are much lower than in England, but that they are circulated in Germany, Italy, Switzerland, and France by a much larger amount of currency.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.3.2
  kind: p
  original: The same Sovereign will not be so quickly intercepted by the banker or returned to the industrial capitalist; and, therefore, instead of one Sovereign circulating 52 Pounds yearly, you want, perhaps, three Sovereigns to circulate yearly wages to the amount of 25 Pounds.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.3.3
  kind: p
  original: Thus, by comparing continental countries with England, you will see at once that low money wages may require a much larger currency for their circulation than high money wages, and that this is, in fact, a merely technical point, quite foreign to our subject.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.4.1
  kind: p
  original: According to the best calculations I know, the yearly income of the working class of this country may be estimated at 250,000,000 Pounds.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.4.2
  kind: p
  original: This immense sum is circulated by about three million Pounds.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.4.3
  kind: p
  original: Suppose a rise of wages of fifty per cent to take place.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.4.4
  kind: p
  original: Then, instead of three millions of currency, four and a half millions would be wanted.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.4.5
  kind: p
  original: As a very considerable part of the working-man's daily expenses is laid out in silver and copper, that is to say, in mere tokens, whose relative value to gold is arbitrarily fixed by law, like that of inconvertible money paper, a rise of money wages by fifty per cent would, in the extreme case, require and additional circulation of Sovereigns, say to the amount of one million.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.4.6
  kind: p
  original: One million, now dormant, in the shape of bullion or coin, in the cellars of the Bank of England, or of private bankers would circulate.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.4.7
  kind: p
  original: But even the trifling expense resulting from the additional minting or the additional wear and tear of that million might be spared, and would actually be spared, if any friction should arise from the want of the additional currency.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.4.8
  kind: p
  original: All of you know that the currency of this country is divided into two great departments.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.4.9
  kind: p
  original: One sort, supplied by bank-notes of different descriptions, is used in the transactions between dealers and dealers, and the larger payments from consumers to dealers, while another sort of currency, metallic coin, circulates in the retail trade.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.4.10
  kind: p
  original: Although distinct, these two sorts of currency intermix with each other.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.4.11
  kind: p
  original: Thus gold coin, to a very great extent, circulates even in larger payments for all the odd sums under 5 Pounds.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.4.12
  kind: p
  original: If tomorrow 4 Pound notes, or 3 Pound notes, or 2 Pound notes were issued, the gold filling these channels of circulation would at once be driven out of them, and flow into those channels where they would be needed from the increase of money wages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.4.13
  kind: p
  original: Thus the additional million required by an advance of wages by fifty per cent would be supplied without the addition of one single Sovereign.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.4.14
  kind: p
  original: The same effect might be produced, without one additional bank-note, by an additional bill circulation, as was the case in Lancashire for a very considerable time.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.5.1
  kind: p
  original: If a general rise in the rate of wages, for example, of 100 per cent, as Citizen Weston supposed it to take place in agricultural wages, would produce a great rise in the prices of necessaries, and, according to his views, require an additional amount of currency not to be procured, a general fall in wages must produce the same effect, on the same scale, in the opposite direction.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.5.2
  kind: p
  original: Well!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.5.3
  kind: p
  original: All of you know that the years 1858 to 1860 were the most prosperous years for the cotton industry, and that peculiarly the year 1860 stands in that respect unrivalled in the annals of commerce, while at the same time all other branches of industry were most flourishing.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.5.4
  kind: p
  original: The wages of the cotton operatives and of all the other working men connected with their trade stood, in 1860, higher than ever before.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.5.5
  kind: p
  original: The American crisis came, and those aggregate wages were suddenly reduced to about one-fourth of their former amount.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.5.6
  kind: p
  original: This would have been in the opposite direction a rise of 400 per cent.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.5.7
  kind: p
  original: If wages rise from five to twenty, we say that they rise by 400 per cent; if they fall from twenty to five, we say that they fall by seventy-five per cent; but the amount of rise in the one and the amount of fall in the other case would be the same, namely, fifteen shillings.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.5.8
  kind: p
  original: This, then, was a sudden change in the rate of wages unprecedented, and at the same time extending over a number of operatives which, if we count all the operatives not only directly engaged in but indirectly dependent upon the cotton trade, was larger by one-half than the number of agricultural labourers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.5.9
  kind: p
  original: Did the price of wheat fall?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.5.10
  kind: p
  original: It rose from the annual average of 47 shillings 8d per quarter during the three years of 1858-1860 to the annual average of 55 shillings 10d per quarter during the three years 1861-1863.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.5.11
  kind: p
  original: As to the currency, there were coined in the mint in 1861 8,673,323 Pounds, against 3,378,792 Pounds in 1860.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.5.12
  kind: p
  original: That is to say, there were coined 5,294,440 Pounds more in 1861 than in 1860.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.5.13
  kind: p
  original: It is true the bank-note circulation was in 1861 less by 1,319,000 Pounds than in 1860.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.5.14
  kind: p
  original: Take this off.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.5.15
  kind: p
  original: There remains still a surplus of currency for the year 1861, as compared with the prosperity year, 1860, to the amount of 3,975,440 Pounds, or about 4,000,000 Pounds; but the bullion reserve in the Bank of England had simultaneously decreased, not quite to the same, but in an approximating proportion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.6.1
  kind: p
  original: Compare the year 1862 with 1842.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.6.2
  kind: p
  original: Apart from the immense increase in the value and amount of commodities circulated, in 1862 the capital paid in regular transactions for shares, loans, etc. for the railways in England and Wales amounted alone to 320,000,000 Pounds, a sum that would have appeared fabulous in 1842.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.6.3
  kind: p
  original: Still, the aggregate amounts in currency in 1862 and 1842 were pretty nearly equal, and generally you will find a tendency to a progressive diminution of currency in the face of enormously increasing value, not only of commodities, but of monetary transactions generally.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.6.4
  kind: p
  original: From our friend Weston's standpoint this is an unsolvable riddle.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.6.5
  kind: p
  original: Looking somewhat deeper into this matter, he would have found that, quite apart from wages, and supposing them to be fixed, the value and mass of the commodities to be circulated, and generally the amount of monetary transactions to be settled, vary daily; that the amount of bank-notes issued varies daily; that the amount of payments realized without the intervention of any money, by the instrumentality of bills, cheques, book-credits, clearing houses, varies daily; that, as far as actual metallic currency is required, the proportion between the coin in circulation and the coin and bullion in reserve or sleeping in the cellars of banks varies daily; that the amount of bullion absorbed by the national circulation and the amount being sent abroad for international circulation vary daily.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.6.6
  kind: p
  original: He would have found that this dogma of a fixed currency is a monstrous error, incompatible with our everyday movement.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: III.6.7
  kind: p
  original: He would have inquired into the laws which enable a currency to adapt itself to circumstances so continually changing, instead of turning his misconception of the laws of currency into an argument against a rise of wages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
