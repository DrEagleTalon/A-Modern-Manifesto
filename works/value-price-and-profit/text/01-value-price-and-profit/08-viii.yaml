verses:
- id: VIII.0.1
  kind: heading
  original: VIII. Production of Surplus Value
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.1.1
  kind: p
  original: Now suppose that the average amount of the daily necessaries of a labouring man require six hours of average labour for their production.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.1.2
  kind: p
  original: Suppose, moreover, six hours of average labour to be also realized in a quantity of gold equal to 3s.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.1.3
  kind: p
  original: Then 3s. would be the price, or the monetary expression of the daily value of that man's labouring power.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.1.4
  kind: p
  original: If he worked daily six hours he would daily produce a value sufficient to buy the average amount of his daily necessaries, or to maintain himself as a labouring man.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.2.1
  kind: p
  original: But our man is a wages labourer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.2.2
  kind: p
  original: He must, therefore, sell his labouring power to a capitalist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.2.3
  kind: p
  original: If he sells it at 3s. daily, or 18s. weekly, he sells it at its value.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.2.4
  kind: p
  original: Suppose him to be a spinner.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.2.5
  kind: p
  original: If he works six hours daily he will add to the cotton a value of 3s. daily.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.2.6
  kind: p
  original: This value, daily added by him, would be an exact equivalent for the wages, or the price of his labouring power, received daily.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.2.7
  kind: p
  original: But in that case no surplus value or surplus produce whatever would go to the capitalist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.2.8
  kind: p
  original: Here, then, we come to the rub.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.3.1
  kind: p
  original: In buying the labouring power of the workman, and paying its value, the capitalist, like every other purchaser, has acquired the right to consume or use the commodity bought.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.3.2
  kind: p
  original: You consume or use the labouring power of a man by making him work, as you consume or use a machine by making it run.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.3.3
  kind: p
  original: By buying the daily or weekly value of the labouring power of the workman, the capitalist has, therefore, acquired the right to use or make that labouring power during the whole day or week.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.3.4
  kind: p
  original: The working day or the working week has, of course, certain limits, but those we shall afterwards look more closely at.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.1
  kind: p
  original: For the present I want to turn your attention to one decisive point.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.2
  kind: p
  original: The value of the labouring power is determined by the quantity of labour necessary to maintain or reproduce it, but the use of that labouring power is only limited by the active energies and physical strength of the labourer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.3
  kind: p
  original: The daily or weekly value of the labouring power is quite distinct from the daily or weekly exercise of that power, the same as the food a horse wants and the time it can carry the horseman are quite distinct.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.4
  kind: p
  original: The quantity of labour by which the value of the workman's labouring power is limited forms by no means a limit to the quantity of labour which his labouring power is apt to perform.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.5
  kind: p
  original: Take the example of our spinner.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.6
  kind: p
  original: We have seen that, to daily reproduce his labouring power, he must daily reproduce a value of three shillings, which he will do by working six hours daily.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.7
  kind: p
  original: But this does not disable him from working ten or twelve or more hours a day.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.8
  kind: p
  original: But by paying the daily or weekly value of the spinner's labouring power the capitalist has acquired the right of using that labouring power during the whole day or week.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.9
  kind: p
  original: He will, therefore, make him work say, daily, twelve hours.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.10
  kind: p
  original: Over and above the six hours required to replace his wages, or the value of his labouring power, he will, therefore, have to work six other hours, which I shall call hours of surplus labour, which surplus labour will realize itself in a surplus value and a surplus produce.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.11
  kind: p
  original: If our spinner, for example, by his daily labour of six hours, added three shillings' value to the cotton, a value forming an exact equivalent to his wages, he will, in twelve hours, add six shillings' worth to the cotton, and produce a proportional surplus of yarn.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.12
  kind: p
  original: As he has sold his labouring power to the capitalist, the whole value of produce created by him belongs to the capitalist, the owner pro tem. of his labouring power.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.13
  kind: p
  original: By advancing three shillings, the capitalist will, therefore, realize a value of six shillings, because, advancing a value in which six hours of labour are crystallized, he will receive in return a value in which twelve hours of labour are crystallized.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.14
  kind: p
  original: By repeating this same process daily, the capitalist will daily advance three shillings and daily pocket six shillings, one half of which will go to pay wages anew, and the other half of which will form surplus value, for which the capitalist pays no equivalent.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.4.15
  kind: p
  original: It is this sort of exchange between capital and labour upon which capitalistic production, or the wages system, is founded, and which must constantly result in reproducing the working man as a working man, and the capitalist as a capitalist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.5.1
  kind: p
  original: The rate of surplus value, all other circumstances remaining the same, will depend on the proportion between that part of the working day necessary to reproduce the value of the labouring power and the surplus time or surplus labour performed for the capitalist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.5.2
  kind: p
  original: It will, therefore, depend on the ratio in which the working day is prolonged over and above that extent, by working which the working man would only reproduce the value of his labouring power, or replace his wages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
