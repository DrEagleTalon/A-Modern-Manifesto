verses:
- id: XII.0.1
  kind: heading
  original: XII. General Relation of Profits, Wages, and Prices
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.1.1
  kind: p
  original: Deduct from the value of a commodity the value replacing the value of the raw materials and other means of production used upon it, that is to say, deduct the value representing the past labour contained in it, and the remainder of its value will resolve into the quantity of labour added by the working man last employed.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.1.2
  kind: p
  original: If that working man works twelve hours daily, if twelve hours of average labour crystallize themselves in an amount of gold equal to six shillings, this additional value of six shillings is the only value his labour will have created.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.1.3
  kind: p
  original: This given value, determined by the time of his labour, is the only fund from which both he and the capitalist have to draw their respective shares or dividends, the only value to be divided into wages and profits.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.1.4
  kind: p
  original: It is evident that this value itself will not be altered by the variable proportions in which it may be divided amongst the two parties.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.1.5
  kind: p
  original: There will also be nothing changed if in the place of one working man you put the whole working population, twelve million working days, for example, instead of one.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.2.1
  kind: p
  original: Since the capitalist and workman have only to divide this limited value, that is, the value measured by the total labour of the working man, the more the one gets the less will the other get, and vice versa.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.2.2
  kind: p
  original: Whenever a quantity is given, one part of it will increase inversely as the other decreases.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.2.3
  kind: p
  original: If the wages change, profits will change in an opposite direction.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.2.4
  kind: p
  original: If wages fall, profits will rise; and if wages rise, profits will fall.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.2.5
  kind: p
  original: If the working man, on our former supposition, gets three shillings, equal to one half of the value he has created, or if his whole working day consists half of paid, half of unpaid labour, the rate of profit will be 100 percent, because the capitalist would also get three shillings.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.2.6
  kind: p
  original: If the working man receives only two shillings, or works only one third of the whole day for himself, the capitalist will get four shillings, and the rate of profit will be 200 per cent.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.2.7
  kind: p
  original: If the working man receives four shillings, the capitalist will only receive two, and the rate of profit would sink to 50 percent, but all these variations will not affect the value of the commodity.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.2.8
  kind: p
  original: A general rise of wages would, therefore, result in a fall of the general rate of profit, but not affect values.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.3.1
  kind: p
  original: But although the values of commodities, which must ultimately regulate their market prices, are exclusively determined by the total quantities of labour fixed in them, and not by the division of that quantity into paid and unpaid labour, it by no means follows that the values of the single commodities, or lots of commodities, produced during twelve hours, for example, will remain constant.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.3.2
  kind: p
  original: The number or mass of commodities produced in a given time of labour, or by a given quantity of labour, depends upon the productive power of the labour employed, and not upon its extent or length.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.3.3
  kind: p
  original: With one degree of the productive power of spinning labour, for example, a working day of twelve hours may produce twelve pounds of yarn, with a lesser degree of productive power only two pounds.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.3.4
  kind: p
  original: If then twelve hours' average labour were realized in the value of six shillings in the one case, the twelve pounds of yarn would cost six shillings, in the other case the two pounds of yarn would also cost six shillings.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.3.5
  kind: p
  original: One pound of yarn would, therefore, cost sixpence in the one case, and three shillings in the other.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.3.6
  kind: p
  original: The difference of price would result from the difference in the productive powers of labour employed.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.3.7
  kind: p
  original: One hour of labour would be realized in one pound of yarn with the greater productive power, while with the smaller productive power, six hours of labour would be realized in one pound of yarn.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.3.8
  kind: p
  original: The price of a pound of yarn would, in the one instance, be only sixpence, although wages were relatively high and the rate of profit low; it would be three shillings in the other instance, although wages were low and the rate of profit high.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.3.9
  kind: p
  original: This would be so because the price of the pound of yarn is regulated by the total amount of labour worked up in it, and not by the proportional division of that total amount into paid and unpaid labour.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.3.10
  kind: p
  original: The fact I have mentioned before that high-price labour may produce cheap, and low-priced labour may produce dear commodities, loses, therefore, its paradoxical appearance.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: XII.3.11
  kind: p
  original: It is only the expression of the general law that the value of a commodity is regulated by the quantity of labour worked up in it, and the the quantity of labour worked up in it depends altogether upon the productive powers of labour employed, and will therefore, vary with every variation in the productivity of labour.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
