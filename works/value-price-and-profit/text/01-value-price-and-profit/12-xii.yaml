section: XII
title_original: XII. General Relation of Profits, Wages, and Prices
title_en: XII. General Relation of Profits, Wages, and Prices
author: Karl Marx
date: 1865-06
original_language: en
anchor_language: en
source_original: Karl Marx, Value, Price and Profit, ed. Eleanor Marx Aveling (London 1898), public domain; Marxists Internet Archive transcription (proofed by Brandon Poole, 2009; CC BY-SA)
