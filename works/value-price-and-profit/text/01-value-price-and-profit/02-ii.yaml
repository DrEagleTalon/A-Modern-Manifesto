section: II
title_original: II. Production, Wages, Profits
title_en: II. Production, Wages, Profits
author: Karl Marx
date: 1865-06
original_language: en
anchor_language: en
source_original: Karl Marx, Value, Price and Profit, ed. Eleanor Marx Aveling (London 1898), public domain; Marxists Internet Archive transcription (proofed by Brandon Poole, 2009; CC BY-SA)
source_en: 'None needed: the original is in English'
verses:
- id: II.0.1
  kind: heading
  original: II. Production, Wages, Profits
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.1.1
  kind: p
  original: The address Citizen Weston read to us might have been compressed into a nutshell.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.1
  kind: p
  original: 'All his reasoning amounted to this: If the working class forces the capitalist class to pay five shillings instead of four shillings in the shape of money wages, the capitalist will return in the shape of commodities four shillings'' worth instead of five shillings'' worth.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.2
  kind: p
  original: The working class would have to pay five shillings for what, before the rise of wages, they bought with four shillings.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.3
  kind: p
  original: But why is this the case?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.4
  kind: p
  original: Why does the capitalist only return four shillings' worth for five shillings?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.5
  kind: p
  original: Because the amount of wages is fixed.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.6
  kind: p
  original: By why is it fixed at four shillings' worth of commodities?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.7
  kind: p
  original: Why not at three, or two, or any other sum?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.8
  kind: p
  original: If the limit of the amount of wages is settled by an economical law, independent alike of the will of the capitalist and the will of the working man, the first thing Citizen Weston had to do was to state that law and prove it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.9
  kind: p
  original: He ought then, moreover, to have proved that the amount of wages actually paid at every given moment always corresponds exactly to the necessary amount of wages, and never deviates from it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.10
  kind: p
  original: If, on the other hand, the given limit of the amount of wages is founded on the mere will of the capitalist, or the limits of his avarice, it is an arbitrary limit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.11
  kind: p
  original: There is nothing necessary in it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.12
  kind: p
  original: It may be changed by the will of the capitalist, and may, therefore, be changed against his will.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.3.1
  kind: p
  original: Citizen Weston illustrated his theory by telling you that a bowl contains a certain quantity of soup, to be eaten by a certain number of persons, an increase in the broadness of the spoons would produce no increase in the amount of soup.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.3.2
  kind: p
  original: He must allow me to find this illustration rather spoony.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.3.3
  kind: p
  original: It reminded me somewhat of the simile employed by Menenius Agrippa.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.3.4
  kind: p
  original: When the Roman plebeians struck against the Roman patricians, the patrician Agrippa told them that the patrician belly fed the plebeian members of the body politic.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.3.5
  kind: p
  original: Agrippa failed to show that you feed the members of one man by filling the belly of another.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.3.6
  kind: p
  original: Citizen Weston, on his part, has forgotten that the bowl from which the workmen eat is filled with the whole produce of national labour, and that what prevents them fetching more out of it is neither the narrowness of the bowl nor the scantiness of its contents, but only the smallness of their spoons.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.1
  kind: p
  original: By what contrivance is the capitalist enabled to return four shillings' worth for five shillings?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.2
  kind: p
  original: By raising the price of the commodity he sells.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.3
  kind: p
  original: Now, does a rise and more generally a change in the prices of commodities, do the prices of commodities themselves, depend on the mere will of the capitalist?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.4
  kind: p
  original: Or are, on the contrary, certain circumstances wanted to give effect to that will?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.5
  kind: p
  original: If not, the ups and downs, the incessant fluctuations of market prices, become an insoluble riddle.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.5.1
  kind: p
  original: As we suppose that no change whatever has taken place either in the productive powers of labour, or in the amount of capital and labour employed, or in the value of the money wherein the values of products are estimated, but only a change in the rate of wages, how could that rise of wages affect the prices of commodities?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.5.2
  kind: p
  original: Only by affecting the actual proportion between the demand for, and the supply of these commodities.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.6.1
  kind: p
  original: It is perfectly true that, considered as a whole, the working class spends, and must spend, its income upon necessaries.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.6.2
  kind: p
  original: A general rise in the rate of wages would, therefore, produce a rise in the demand for, and consequently in the market prices of necessaries.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.6.3
  kind: p
  original: The capitalists who produce these necessaries would be compensated for the risen wages by the rising market prices of their commodities.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.6.4
  kind: p
  original: But how with the other capitalists who do not produce necessaries?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.6.5
  kind: p
  original: And you must not fancy them a small body.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.6.6
  kind: p
  original: If you consider that two-thirds of the national produce are consumed by one-fifth of the population — a member of the House of Commons stated it recently to be but one-seventh of the population — you will understand what an immense proportion of the national produce must be produced in the shape of luxuries, or be exchanged for luxuries, and what an immense amount of the necessaries themselves must be wasted upon flunkeys, horses, cats, and so forth, a waste we know from experience to become always much limited with the rising prices of necessaries.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.7.1
  kind: p
  original: Well, what would be the position of those capitalists who do not produce necessaries?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.7.2
  kind: p
  original: For the fall in the rate of profit, consequent upon the general rise of wages, they could not compensate themselves by a rise in the price of their commodities, because the demand for those commodities would not have increased.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.7.3
  kind: p
  original: Their income would have decreased, and from this decreased income they would have to pay more for the same amount of higher-priced necessaries.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.7.4
  kind: p
  original: But this would not be all.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.7.5
  kind: p
  original: As their income had diminished they would have less to spend upon luxuries, and therefore their mutual demand for their respective commodities would diminish.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.7.6
  kind: p
  original: Consequent upon this diminished demand the prices of their commodities would fall.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.7.7
  kind: p
  original: In these branches of industry, therefore, the rate of profit would fall, not only in simple proportion to the general rise in the rate of wages, but in the compound ratio of the general rise of wages, the rise in the prices of necessaries, and the fall in the prices of luxuries.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.1
  kind: p
  original: What would be the consequence of this difference in the rates of profit for capitals employed in the different branches of industry?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.2
  kind: p
  original: Why, the consequence that generally obtains whenever, from whatever reason, the average rate of profit comes to differ in different spheres of production.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.3
  kind: p
  original: Capital and labour would be transferred from the less remunerative to the more remunerative branches; and this process of transfer would go on until the supply in the one department of industry would have risen proportionately to the increased demand, and would have sunk in the other departments according to the decreased demand.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.4
  kind: p
  original: This change effected, the general rate of profit would again be equalized in the different branches.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.5
  kind: p
  original: As the whole derangement originally arose from a mere change in the proportion of the demand for, and supply of, different commodities, the cause ceasing, the effect would cease, and PRICES would return to their former level and equilibrium.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.6
  kind: p
  original: Instead of being limited to some branches of industry, the fall in the rate of profit consequent upon the rise of wages would have become general.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.7
  kind: p
  original: According to our supposition, there would have taken place no change in the productive powers of labour, nor in the aggregate amount of production, but that given amount of production would have changed its form.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.8
  kind: p
  original: A greater part of the produce would exist in the shape of necessaries, a lesser part in the shape of luxuries, or what comes to the same, a lesser part would be exchanged for foreign luxuries, and be consumed in its original form, or, what again comes to the same, a greater part of the native produce would be exchanged for foreign necessaries instead of for luxuries.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.9
  kind: p
  original: The general rise in the rate of wages would, therefore, after a temporary disturbance of market prices, only result in a general fall of the rate of profit without any permanent change in the prices of commodities.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.10
  kind: p
  original: If I am told that in the previous argument I assume the whole surplus wages to be spent upon necessaries, I answer that I have made the supposition most advantageous to the opinion of Citizen Weston.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.11
  kind: p
  original: If the surplus wages were spent upon articles formerly not entering into the consumption of the working men, the real increase of their purchasing power would need no proof.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.12
  kind: p
  original: Being, however, only derived from an advance of wages, that increase of their purchasing power must exactly correspond to the decrease of the purchasing power of the capitalists.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.13
  kind: p
  original: The aggregate demand for commodities would, therefore, not increase, but the constituent parts of that demand would change.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.14
  kind: p
  original: The increasing demand on the one side would be counterbalanced by the decreasing demand on the other side.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.15
  kind: p
  original: Thus the aggregate demand remaining stationary, no change whatever could take place in the market prices of commodities.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.16
  kind: p
  original: 'You arrive, therefore, at this dilemma: Either the surplus wages are equally spent upon all articles of consumption — then the expansion of demand on the part of the working class must be compensated by the contraction of demand on the part of the capitalist class — or the surplus wages are only spent upon some articles whose market prices will temporarily rise.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.17
  kind: p
  original: The consequent rise in the rate of profit in some, and the consequent fall in the rate of profit in other branches of industry will produce a change in the distribution of capital and labour, going on until the supply is brought up to the increased demand in the one department of industry, and brought down to the diminished demand in the other departments of industry.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.18
  kind: p
  original: On the one supposition there will occur no change in the prices of commodities.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.19
  kind: p
  original: On the other supposition, after some fluctuations of market prices, the exchangeable values of commodities will subside to the former level.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.20
  kind: p
  original: On both suppositions the general rise in the rate of wages will ultimately result in nothing else but a general fall in the rate of profit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.1
  kind: p
  original: To stir up your powers of imagination Citizen Weston requested you to think of the difficulties which a general rise of English agricultural wages from nine shillings to eighteen shillings would produce.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.2
  kind: p
  original: Think, he exclaimed, of the immense rise in the demand for necessaries, and the consequent fearful rise in their prices!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.3
  kind: p
  original: Now, all of you know that the average wages of the American agricultural labourer amount to more than double that of the English agricultural labourer, although the prices of agricultural produce are lower in the United States than in the United Kingdom, although the general relations of capital and labour obtain in the United States the same as in England, and although the annual amount of production is much smaller in the United States than in England.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.4
  kind: p
  original: Why, then, does our friend ring this alarm bell?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.5
  kind: p
  original: Simply to shift the real question before us.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.6
  kind: p
  original: A sudden rise of wages from nine shillings to eighteen shillings would be a sudden rise to the amount of 100 percent.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.7
  kind: p
  original: Now, we are not at all discussing the question whether the general rate of wages in England could be suddenly increased by 100 percent.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.8
  kind: p
  original: We have nothing at all to do with the magnitude of the rise, which in every practical instance must depend on, and be suited to, given circumstances.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.9
  kind: p
  original: We have only to inquire how a general rise in the rate of wages, even if restricted to one percent, will act.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.10.1
  kind: p
  original: Dismissing friend Weston's fancy rise of 100 percent, I propose calling your attention to the real rise of wages that took place in Great Britain from 1849 to 1859.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.1
  kind: p
  original: You are all aware of the Ten Hours Bill, or rather Ten-and-a-half Hours Bill, introduced since 1848.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.2
  kind: p
  original: This was one of the greatest economical changes we have witnessed.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.3
  kind: p
  original: It was a sudden and compulsory rise of wages, not in some local trades, but in the leading industrial branches by which England sways the markets of the world.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.4
  kind: p
  original: It was a rise of wages under circumstances singularly unpropitious.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.5
  kind: p
  original: Dr. Ure, Professor Senior, and all the other official economical mouthpieces of the middle class, proved, and I must say upon much stronger grounds than those of our friend Weston, that it would sound the death-knell of English industry.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.6
  kind: p
  original: They proved that it not only amounted to a simple rise of wages, but to a rise of wages initiated by, and based upon, a diminution of the quantity of labour employed.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.7
  kind: p
  original: They asserted that the twelfth hour you wanted to take from the capitalist was exactly the only hour from which he derived his profit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.8
  kind: p
  original: They threatened a decrease of accumulation, rise of prices, loss of markets, stinting of production, consequent reaction upon wages, ultimate ruin.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.9
  kind: p
  original: In fact, they declared Maximillian Robespierre's Maximum Laws to be a small affair compared to it; and they were right in a certain sense.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.10
  kind: p
  original: Well, what was the result?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.11
  kind: p
  original: A rise in the money wages of the factory operatives, despite the curtailing of the working day, a great increase in the number of factory hands employed, a continuous fall in the prices of their products, a marvellous development in the productive powers of their labour, an unheard-of progressive expansion of the markets for their commodities.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.12
  kind: p
  original: In Manchester, at the meeting, in 1860, of the Society for the Advancement of Science, I myself heard Mr. Newman confess that he, Dr. Ure, Senior, and all other official propounders of economical science had been wrong, while the instinct of the people had been right.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.13
  kind: p
  original: I mention Mr. W. Newman, not Professor Francis Newman, because he occupies an eminent position in economical science, as the contributor to, and editor of, Mr. Thomas Tooke's History Of Prices, that magnificent work which traces the history of prices from 1793 to 1856.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.14
  kind: p
  original: If our friend Weston's fixed idea of a fixed amount of wages, a fixed amount of production, a fixed degree of the productive power of labour, a fixed and permanent will of the capitalist, and all his other fixedness and finality were correct, Professor Senior's woeful forebodings would been right, and Robert Owen, who already in 1816 proclaimed a general limitation of the working day the first preparatory step to the emancipation of the working class, and actually in the teeth of the general prejudice inaugurated it on his own hook in his cotton factory at New Lanark, would have been wrong.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.12.1
  kind: p
  original: In the very same period during which the introduction of the Ten Hours Bill, and the rise of wages consequent upon it, occurred, there took place in Great Britain, for reasons which it would be out of place to enumerate here, a general rise in agricultural wages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.12.2
  kind: p
  original: Although it is not required for my immediate purpose, in order not to mislead you, I shall make some preliminary remarks.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.13.1
  kind: p
  original: If a man got two shillings weekly wages, and if his wages rose to four shillings, the rate of wages would have risen by 100 per cent.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.13.2
  kind: p
  original: This would seem a very magnificent thing if expressed as a rise in the rate of wages, although the actual amount of wages, four shillings weekly, would still remain a wretchedly small, a starvation pittance.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.13.3
  kind: p
  original: You must not, therefore, allow yourselves to be carried away by the high sounding per cents in rate of wages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.13.4
  kind: p
  original: 'You must always ask: What was the original amount?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.14.1
  kind: p
  original: Moreover, you will understand, that if there were ten men receiving each 2s. per week, five men receiving each 5s., and five men receiving 11s. weekly, the twenty men together would receive 100s., or 5 Pounds, weekly.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.14.2
  kind: p
  original: If then a rise, say by 20 per cent, upon the aggregate sum of their weekly wages took place, there would be an advance from 5 Pounds to 6 Pounds.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.14.3
  kind: p
  original: Taking the average, we might say that the general rate of wages had risen by 25 per cent, although, in fact, the wages of the ten men had remained stationary, the wages of the one lot of five men had risen from 5s. to 6s. only, and the wages of the other lot of five from 55s. to 70s.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.14.4
  kind: p
  original: One half of the men would not have improved at all their position, one quarter would have improved it in an imperceptible degree, and only one quarter would have bettered it really.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.14.5
  kind: p
  original: Still, reckoning by the average, the total amount of the wages of those twenty men would have increased by 25 per cent, and as far as the aggregate capital that employs them, and the prices of the commodities they produce, are concerned, it would be exactly the same as if all of them had equally shared in the average rise of wages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.14.6
  kind: p
  original: In the case of agricultural labour, the standard wages being very different in the different counties of England and Scotland, the rise affected them very unequally.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.15.1
  kind: p
  original: Lastly, during the period when that rise of wages took place counteracting influences were at work such as the new taxes consequent upon the Russian war, the extensive demolition of the dwelling-houses of the agricultural labourers, and so forth.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.15.2
  kind: p
  original: Having premised so much, I proceed to state that from 1849 to 1859 there took place a rise of about 40 percent in the average rate of the agricultural wages of Great Britain.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.15.3
  kind: p
  original: I could give you ample details in proof of my assertion, but for the present purpose think it sufficient to refer you to the conscientious and critical paper read in 1860 by the late Mr. John C. Morton at the London Society of Arts on "The Forces used in Agriculture."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.15.4
  kind: p
  original: Mr. Morton gives the returns, from bills and other authentic documents, which he had collected from about one hundred farmers, residing in twelve Scotch and thirty-five English counties.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.16.1
  kind: p
  original: According to our friend Weston's opinion, and taken together with the simultaneous rise in the wages of the factory operatives, there ought to have occurred a tremendous rise in the prices of agricultural produce during the period 1849 to 1859.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.16.2
  kind: p
  original: But what is the fact?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.16.3
  kind: p
  original: Despite the Russian war, and the consecutive unfavourable harvests from 1854 to 1856, the average price of wheat, which is the leading agricultural produce of England, fell from about 3 Pounds per quarter for the years 1838 to 1848 to about 2 Pounds 10 Shillings per quarter for the years 1849 to 1859.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.16.4
  kind: p
  original: This constitutes a fall in the price of wheat of more than 16 percent simultaneously with an average rise of agricultural wages of 40 percent.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.16.5
  kind: p
  original: During the same period, if we compare its end with its beginning, 1859 with 1849, there was a decrease of official pauperism from 934,419 to 860,470, the difference being 73,949; a very small decrease, I grant, and which in the following years was again lost, but still a decrease.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.17.1
  kind: p
  original: It might be said that, consequent upon the abolition of the Corn Laws, the import of foreign corn was more than doubled during the period from 1849 to 1859, as compared with the period from 1838 to 1848.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.17.2
  kind: p
  original: And what of that?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.17.3
  kind: p
  original: From Citizen Weston's standpoint one would have expected that this sudden, immense, and continuously increasing demand upon foreign markets must have sent up the prices of agricultural produce there to a frightful height, the effect of increased demand remaining the same, whether it comes from without or from within.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.17.4
  kind: p
  original: What was the fact?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.17.5
  kind: p
  original: Apart from some years of failing harvests, during all that period the ruinous fall in the price of corn formed a standing theme of declamation in France; the Americans were again and again compelled to burn their surplus produce; and Russia, if we are to believe Mr. Urquhart, prompted the Civil War in the United States because her agricultural exports were crippled by the Yankee competition in the markets of Europe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.18.1
  kind: p
  original: 'Reduced to its abstract form, Citizen Weston''s argument would come to this: Every rise in demand occurs always on the basis of a given amount of production.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.18.2
  kind: p
  original: It can, therefore, never increase the supply of the articles demanded, but can only enhance their money prices.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.18.3
  kind: p
  original: Now the most common observation shows than an increased demand will, in some instances, leave the market prices of commodities altogether unchanged, and will, in other instances, cause a temporary rise of market prices followed by an increased supply, followed by a reduction of the prices to their original level, and in many cases below their original level.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.18.4
  kind: p
  original: Whether the rise of demand springs from surplus wages, or from any other cause, does not at all change the conditions of the problem.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.18.5
  kind: p
  original: From Citizen Weston's standpoint the general phenomenon was as difficult to explain as the phenomenon occurring under the exceptional circumstances of a rise of wages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.18.6
  kind: p
  original: His argument had, therefore, no peculiar bearing whatever upon the subject we treat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.18.7
  kind: p
  original: It only expressed his perplexity at accounting for the laws by which an increase of demand produces an increase of supply, instead of an ultimate rise of market prices.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
