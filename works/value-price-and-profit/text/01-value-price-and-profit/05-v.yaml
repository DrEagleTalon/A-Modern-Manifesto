section: V
title_original: V. Wages and Prices
title_en: V. Wages and Prices
author: Karl Marx
date: 1865-06
original_language: en
anchor_language: en
source_original: Karl Marx, Value, Price and Profit, ed. Eleanor Marx Aveling (London 1898), public domain; Marxists Internet Archive transcription (proofed by Brandon Poole, 2009; CC BY-SA)
source_en: 'None needed: the original is in English'
verses:
- id: V.0.1
  kind: heading
  original: V. Wages and Prices
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.1.1
  kind: p
  original: 'Reduced to their simplest theoretical expression, all our friend''s arguments resolve themselves into this one dogma: "The prices of commodities are determined or regulated by wages."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.2.1
  kind: p
  original: I might appeal to practical observation to bear witness against this antiquated and exploded fallacy.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.2.2
  kind: p
  original: I might tell you that the English factory operatives, miners, shipbuilders, and so forth, whose labour is relatively high-priced, undersell by the cheapness of their produce all other nations; while the English agricultural labourer, for example, whose labour is relatively low-priced, is undersold by almost every other nation because of the dearness of his produce.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.2.3
  kind: p
  original: By comparing article with article in the same country, and the commodities of different countries, I might show, apart from some exceptions more apparent than real, that on an average the high-priced labour produces the low-priced, and low priced labour produces the high-priced commodities.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.2.4
  kind: p
  original: This, of course, would not prove that the high price of labour in the one, and its low price in the other instance, are the respective causes of those diametrically opposed effects, but at all events it would prove that the prices of commodities are not ruled by the prices of labour.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.2.5
  kind: p
  original: However, it is quite superfluous for us to employ this empirical method.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.1
  kind: p
  original: 'It might, perhaps, be denied that Citizen Weston has put forward the dogma: "The prices of commodities are determined or regulated by wages."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.2
  kind: p
  original: In point of fact, he has never formulated it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.3
  kind: p
  original: He said, on the contrary, that profit and rent also form constituent parts of the prices of commodities, because it is out of the prices of commodities that not only the working man's wages, but also the capitalist's profits and the landlord's rents must be paid.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.4
  kind: p
  original: But how in his idea are prices formed?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.5
  kind: p
  original: First by wages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.6
  kind: p
  original: Then an additional percentage is joined to the price on behalf of the capitalist, and another additional percentage on behalf of the landlord.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.7
  kind: p
  original: Suppose the wages of the labour employed in the production of a commodity to be ten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.8
  kind: p
  original: If the rate of profit was 100 per cent, to the wages advanced the capitalist would add ten, and if the rate of rent was also 100 per cent upon the wages, there would be added ten more, and the aggregate price of the commodity would amount to thirty.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.9
  kind: p
  original: But such a determination of prices would be simply their determination by wages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.10
  kind: p
  original: If wages in the above case rose to twenty, the price of the commodity would rise to sixty, and so forth.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.11
  kind: p
  original: Consequently all the superannuated writers on political economy who propounded the dogma that wages regulate prices, have tried to prove it by treating profit and rent as mere additional percentages upon wages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.12
  kind: p
  original: None of them were, of course, able to reduce the limits of those percentages to any economic law.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.13
  kind: p
  original: They seem, on the contrary, to think profits settled by tradition, custom, the will of the capitalist, or by some other equally arbitrary and inexplicable method.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.14
  kind: p
  original: If they assert that they are settled by the competition between the capitalists, they say nothing.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.3.15
  kind: p
  original: That competition is sure to equalize the different rates of profit in different trades, or reduce them to one average level, but it can never determine the level itself, or the general rate of profit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.4.1
  kind: p
  original: What do we mean by saying that the prices of the commodities are determined by wages?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.4.2
  kind: p
  original: Wages being but a name for the price of labour, we mean that the prices of commodities are regulated by the price of labour.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.4.3
  kind: p
  original: As "price" is exchangeable value — and in speaking of value I speak always of exchangeable value — is exchangeable value expressed in money, the proposition comes to this, that "the value of commodities is determined by the value of labour," or that "the value of labour is the general measure of value."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.5.1
  kind: p
  original: But how, then, is the "value of labour" itself determined?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.5.2
  kind: p
  original: Here we come to a standstill.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.5.3
  kind: p
  original: Of course, we come to a standstill if we try reasoning logically, yet the propounders of that doctrine make short work of logical scruples.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.5.4
  kind: p
  original: Take our friend Weston, for example.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.5.5
  kind: p
  original: First he told us that wages regulate the price of commodities and that consequently when wages rise prices must rise.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.5.6
  kind: p
  original: Then he turned round to show us that a rise of wages will be no good because the prices of commodities had risen, and because wages were indeed measured by the prices of the commodities upon which they are spent.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.5.7
  kind: p
  original: Thus we begin by saying that the value of labour determines the value of commodities, and we wind up by saying that the value of commodities determines the value of labour.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.5.8
  kind: p
  original: Thus we move to and fro in the most vicious circle, and arrive at no conclusion at all.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.6.1
  kind: p
  original: On the whole, it is evident that by making the value of one commodity, say labour, corn, or any other commodity, the general measure and regulator of value, we only shift the difficulty, since we determine one value by another, which on its side wants to be determined.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.7.1
  kind: p
  original: The dogma that "wages determine the price of commodities," expressed in its most abstract terms, comes to this, that "value is determined by value," and this tautology means that, in fact, we know nothing at all about value.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.7.2
  kind: p
  original: Accepting this premise, all reasoning about the general laws of political economy turns into mere twaddle.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: V.7.3
  kind: p
  original: It was, therefore, the great merit of Ricardo that in his work on the principles of political economy, published in 1817, he fundamentally destroyed the old popular, and worn-out fallacy that "wages determine prices," a fallacy which Adam Smith and his French predecessors had spurned in the really scientific parts of their researches, but which they reproduced in their more exoterical and vulgarizing chapters.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
