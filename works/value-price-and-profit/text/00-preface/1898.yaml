- id: P1898.1.9
  kind: p
  original: I am often asked what is the best succession of books for the student to acquire the fundamental principles of Socialism.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: P1898.1.10
  kind: p
  original: The question is a difficult one to answer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: P1898.1.11
  kind: p
  original: But, by way of suggestion, one might say, first, Engels' Socialism, Scientific And Utopian, then the present work, the first volume of Capital, and the Student's Marx.
