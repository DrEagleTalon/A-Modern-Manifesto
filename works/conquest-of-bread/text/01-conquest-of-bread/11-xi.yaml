# Master file. Edit the `modern` and `notes` fields; see CONTRIBUTING.md.
# Verse ids are frozen. Never renumber; see VERSIFICATION.md.
section: XI
title_original: Chapter XI. Free Agreement
title_en: Chapter XI. Free Agreement
author: Peter Kropotkin
date: 1892 (French); English 1906
original_language: fr
anchor_language: en
source_original: Not yet in this repository. Kropotkin's French, La Conquête du pain (Paris 1892), is still to be located on a reachable mirror.
source_en: 'Anonymous English translation (London: Chapman and Hall, 1906) with Kropotkin''s preface of 1913, Vanguard Press printing (New York 1926), Project Gutenberg ebook 23428 (public domain)'
verses:
- id: XI.0.1
  kind: heading
  original: ''
  en: Chapter XI. Free Agreement
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.1.1
  kind: heading
  original: ''
  en: I
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.2.1
  kind: p
  original: ''
  en: Accustomed as we are by heredity prejudices and our unsound education and training to represent ourselves the beneficial hand of Government, legislation and magistracy everywhere, we have come to believe that man would tear his fellow-man to pieces like a wild beast the day the police took his eye off him; that absolute chaos would come about if authority were overthrown during a revolution.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.2.2
  kind: p
  original: ''
  en: And with our eyes shut we pass by thousands and thousands of human groupings which form themselves freely, without any intervention of the law, and attain results infinitely superior to those achieved under governmental tutelage.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.3.1
  kind: p
  original: ''
  en: If you open a daily paper you find that its pages are entirely devoted to Government transactions and to political jobbery.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.3.2
  kind: p
  original: ''
  en: A man from another world, reading it, would believe that, with the exception of the Stock Exchange transactions, nothing gets done in Europe save by order of some master.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.3.3
  kind: p
  original: ''
  en: You find nothing in the paper about institutions that spring up, grow up, and develop without ministerial prescription!
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.3.4
  kind: p
  original: ''
  en: Nothing--or almost nothing!
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.3.5
  kind: p
  original: ''
  en: Even where there is a heading, "Sundry Events" (Faits divers, a favorite column in the French papers), it is because they are connected with the police.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.3.6
  kind: p
  original: ''
  en: A family drama, an act of rebellion, will only be mentioned if the police have appeared on the scene.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.4.1
  kind: p
  original: ''
  en: Three hundred and fifty million Europeans love or hate one another, work, or live on their incomes; but, apart from literature, theatre, or sport, their lives remain ignored by newspapers if Governments have not intervened in it in some way or other.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.4.2
  kind: p
  original: ''
  en: It is even so with history.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.4.3
  kind: p
  original: ''
  en: 'We know the least details of the life of a king or of a parliament; all good and bad speeches pronounced by the politicians have been preserved: "speeches that have never had the least influence on the vote of a single member," as an old parliamentarian said.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.4.4
  kind: p
  original: ''
  en: Royal visits, the good or bad humour of politicians, their jokes and intrigues, are all carefully recorded for posterity.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.4.5
  kind: p
  original: ''
  en: But we have the greatest difficulty to reconstitute a city of the Middle Ages, to understand the mechanism of that immense commerce that was carried on between Hanseatic cities, or to know how the city of Rouen built its cathedral.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.4.6
  kind: p
  original: ''
  en: If a scholar spends his life in studying these questions, his works remain unknown, and parliamentary histories--that is to say, the defective ones, as they only treat of one side of social life--multiply; they are circulated, they are taught in schools.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.5.1
  kind: p
  original: ''
  en: In this way we do not even perceive the prodigious work, accomplished every day by spontaneous groups of men, which constitutes the chief work of our century.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.6.1
  kind: p
  original: ''
  en: We therefore propose to point out some of these most striking manifestations, and to show how men, as soon as their interests do not absolutely clash, act in concert, harmoniously, and perform collective work of a very complex nature.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.7.1
  kind: p
  original: ''
  en: It is evident that in present society, based on individual property--that is to say, on plunder, and on a narrow-minded, and therefore foolish individualism--facts of this kind are necessarily limited; agreements are not always perfectly free, and often they have a mean, if not execrable aim.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.8.1
  kind: p
  original: ''
  en: But what concerns us is not to give examples which might be blindly followed, and which, moreover, present society could not possibly give us.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.8.2
  kind: p
  original: ''
  en: What we have to do is to show that, in spite of the authoritarian individualism which stifles us, there remains in our life, taken as a whole, a very great part in which we only act by free agreement; and that therefore it would be much easier than is usually thought, to dispense with Government.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.9.1
  kind: p
  original: ''
  en: In support of our view we have already mentioned railways, and we will now return to them.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.10.1
  kind: p
  original: ''
  en: We know that Europe has a system of railways, over 175,000 miles long, and that on this network you can nowadays travel from north to south, from east to west, from Madrid to Petersburg, and from Calais to Constantinople, without delays, without even changing carriages (when you travel by express).
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.10.2
  kind: p
  original: ''
  en: 'More than that: a parcel deposited at a station will find its addressee anywhere, in Turkey or in Central Asia, without more formality needed for sending it than writing its destination on a bit of paper.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.11.1
  kind: p
  original: ''
  en: This result might have been obtained in two ways.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.11.2
  kind: p
  original: ''
  en: A Napoleon, a Bismarck, or some potentate having conquered Europe, would from Paris, Berlin, or Rome, draw a railway map and regulate the hours of the trains.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.11.3
  kind: p
  original: ''
  en: The Russian Tsar Nicholas I. dreamt of such a power.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.11.4
  kind: p
  original: ''
  en: When he was shown rough drafts of railways between Moscow and Petersburg, he seized a ruler and drew on the map of Russia a straight line between these two capitals, saying, "Here is the plan."
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.11.5
  kind: p
  original: ''
  en: And the road was built in a straight line, filling in deep ravines, building bridges of a giddy height, which had to be abandoned a few years later, after the railway had cost about £120,000 to £150,000 per English mile.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.12.1
  kind: p
  original: ''
  en: This is one way, but happily things were managed differently.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.12.2
  kind: p
  original: ''
  en: Railways were constructed piece by piece, the pieces were joined together, and the hundred different companies, to whom these pieces belonged, gradually came to an understanding concerning the arrival and departure of their trains, and the running of carriages on their rails, from all countries, without unloading merchandise as it passes from one network to another.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.13.1
  kind: p
  original: ''
  en: All this was done by free agreement, by exchange of letters and proposals, and by congresses at which delegates met to discuss well specified special points, and to come to an agreement about them, but not to make laws.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.13.2
  kind: p
  original: ''
  en: After the congress was over, the delegates returned to their respective companies, not with a law, but with the draft of a contract to be accepted or rejected.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.14.1
  kind: p
  original: ''
  en: Of course difficulties were met in the way.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.14.2
  kind: p
  original: ''
  en: There were obstinate men who would not be convinced.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.14.3
  kind: p
  original: ''
  en: But a common interest compelled them to agree in the end, without invoking the help of armies against the refractory members.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.15.1
  kind: p
  original: ''
  en: This immense network of railways connected together, and the enormous traffic it has given rise to, no doubt constitutes the most striking trait of the nineteenth century; and it is the result of free agreement.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.15.2
  kind: p
  original: ''
  en: If somebody had foretold it eighty years ago, our grandfathers would have thought him idiotic or mad.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.15.3
  kind: p
  original: ''
  en: 'They would have said: "Never will you be able to make the shareholders of a hundred companies listen to reason!'
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.15.4
  kind: p
  original: ''
  en: It is a Utopia, a fairy tale.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.15.5
  kind: p
  original: ''
  en: A central Government, with an 'iron' dictator, can alone enforce it."
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.16.1
  kind: p
  original: ''
  en: And the most interesting thing in this organization is, that there is no European Central Government of Railways!
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.16.2
  kind: p
  original: ''
  en: Nothing!
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.16.3
  kind: p
  original: ''
  en: No minister of railways, no dictator, not even a continental parliament, not even a directing committee!
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.16.4
  kind: p
  original: ''
  en: Everything is done by free agreement.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.17.1
  kind: p
  original: ''
  en: 'So we ask the believers in the State, who pretend that "we can never do without a central Government, were it only for regulating the traffic," we ask them: "But how do European railways manage without them?'
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.17.2
  kind: p
  original: ''
  en: How do they continue to convey millions of travellers and mountains of luggage across a continent?
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.17.3
  kind: p
  original: ''
  en: If companies owning railways have been able to agree, why should railway workers, who would take possession of railways, not agree likewise?
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.17.4
  kind: p
  original: ''
  en: And if the Petersburg-Warsaw Company and that of Paris-Belfort can act in harmony, without giving themselves the luxury of a common commander, why, in the midst of our societies, consisting of groups of free workers, should we need a Government?"
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.18.1
  kind: heading
  original: ''
  en: II
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.19.1
  kind: p
  original: ''
  en: When we endeavour to prove by examples that even to-day, in spite of the iniquitous organization of society as a whole, men, provided their interests be not diametrically opposed, agree without the intervention of authority, we do not ignore the objections that will be put forth.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.20.1
  kind: p
  original: ''
  en: All such examples have their defective side, because it is impossible to quote a single organization exempt from the exploitation of the weak by the strong, the poor by the rich.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.20.2
  kind: p
  original: ''
  en: 'This is why the Statists will not fail to tell us with their wonted logic: "You see that the intervention of the State is necessary to put an end to this exploitation!"'
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.21.1
  kind: p
  original: ''
  en: Only they forget the lessons of history; they do not tell us to what extent the State itself has contributed towards the existing order by creating proletarians and delivering them up to exploiters.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.21.2
  kind: p
  original: ''
  en: They forget to prove us that it is possible to put an end to exploitation while the primal causes--private capital and poverty, two-thirds of which are artificially created by the State--continue to exist.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.22.1
  kind: p
  original: ''
  en: 'When we speak of the accord established among the railway companies, we expect them, the worshippers of the bourgeois State, to say to us: "Do you not see how the railway companies oppress and ill-use their employees and the travellers!'
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.22.2
  kind: p
  original: ''
  en: The only way is, that the State should intervene to protect the workers and the public!"
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.23.1
  kind: p
  original: ''
  en: But have we not said and repeated over and over again, that as long as there are capitalists, these abuses of power will be perpetuated?
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.23.2
  kind: p
  original: ''
  en: It is precisely the State, the would-be benefactor, that has given to the companies that monopoly and those rights upon us which they possess to-day.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.23.3
  kind: p
  original: ''
  en: Has it not created concessions, guarantees?
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.23.4
  kind: p
  original: ''
  en: Has it not sent its soldiers against railwaymen on strike?
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.23.5
  kind: p
  original: ''
  en: And during the first trials (quite lately we saw it still in Russia), has it not extended the privilege of the railway magnates as far as to forbid the Press to mention railway accidents, so as not to depreciate the shares it guaranteed?
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.23.6
  kind: p
  original: ''
  en: Has it not favoured the monopoly which has anointed the Vanderbilts and the Polyakoffs, the directors of the P.L.M., the C.P.R., the St. Gothard, "the kings of our days"?
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.24.1
  kind: p
  original: ''
  en: Therefore, if we give as an example the tacit agreement come to between railway companies, it is by no means as an ideal of economical management, nor even an ideal of technical organization.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.24.2
  kind: p
  original: ''
  en: It is to show that if capitalists, without any other aim than that of augmenting their dividends at other people's expense, can exploit railways successfully without establishing an International Department,--societies of working men will be able to do it just as well, and even better, without nominating a Ministry of European railways.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.25.1
  kind: p
  original: ''
  en: Another objection is raised that is more serious at first sight.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.25.2
  kind: p
  original: ''
  en: We may be told that the agreement we speak of is not perfectly free, that the large companies lay down the law to the small ones.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.25.3
  kind: p
  original: ''
  en: It might be mentioned, for example, that a certain rich German company, supported by the State, compel travellers who go from Berlin to Bâle to pass via Cologne and Frankfort, instead of taking the Leipzig route; or that such a company carries goods a hundred and thirty miles in a roundabout way (on a long distance) to favour its influential shareholders, and thus ruins the secondary lines.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.25.4
  kind: p
  original: ''
  en: In the United States travellers and goods are sometimes compelled to travel impossibly circuitous routes so that dollars may flow into the pocket of a Vanderbilt.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.26.1
  kind: p
  original: ''
  en: 'Our answer will be the same: As long as Capital exists, the Greater Capital will oppress the lesser.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.26.2
  kind: p
  original: ''
  en: But oppression does not result from Capital only.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.26.3
  kind: p
  original: ''
  en: It is also owing to the support given them by the State, to monopoly created by the State in their favour, that the large companies oppress the small ones.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.1
  kind: p
  original: ''
  en: The early English and French Socialists have shown long since how English legislation did all in its power to ruin the small industries, drive the peasant to poverty, and deliver over to wealthy industrial employers battalions of men, compelled to work for no matter what salary.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.2
  kind: p
  original: ''
  en: Railway legislation did exactly the same.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.3
  kind: p
  original: ''
  en: Strategic lines, subsidized lines, companies which received the International Mail monopoly, everything was brought into play to forward the interests of wealthy financiers.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.27.4
  kind: p
  original: ''
  en: When Rothschild, creditor to all European States, puts capital in a railway, his faithful subjects, the ministers, will do their best to make him earn more.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.28.1
  kind: p
  original: ''
  en: In the United States, in the Democracy that authoritarians hold up to us as an ideal, the most scandalous fraudulency has crept into everything that concerns railroads.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.28.2
  kind: p
  original: ''
  en: Thus, if a company ruins its competitors by cheap fares, it is often enabled to do so because it is reimbursed by land given to it by the State for a gratuity.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.28.3
  kind: p
  original: ''
  en: Documents recently published concerning the American wheat trade have fully shown up the part played by the State in the exploitation of the weak by the strong.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.28.4
  kind: p
  original: ''
  en: Here, too, the power of accumulated capital has increased tenfold and a hundredfold by means of State help.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.28.5
  kind: p
  original: ''
  en: So that, when we see syndicates of railway companies (a product of free agreement) succeeding in protecting their small companies against big ones, we are astonished at the intrinsic force of free agreement that can hold its own against all-powerful Capital favoured by the State.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.29.1
  kind: p
  original: ''
  en: It is a fact that little companies exist, in spite of the State's partiality.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.29.2
  kind: p
  original: ''
  en: If in France, land of centralization, we only see five or six large companies, there are more than a hundred and ten in Great Britain who agree remarkably well, and who are certainly better organized for the rapid transit of travellers and goods than the French and German companies.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.30.1
  kind: p
  original: ''
  en: Moreover, that is not the question.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.30.2
  kind: p
  original: ''
  en: Large Capital, favoured by the State, can always, if it be to its advantage, crush the lesser one.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.30.3
  kind: p
  original: ''
  en: 'What is of importance to us is this: The agreement between hundreds of capitalist companies to whom the railways of Europe belong, was established without intervention of a central government to lay down the law to the divers societies; it has subsisted by means of congresses composed of delegates, who discuss among themselves, and submit proposals, not laws, to their constituents.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.30.4
  kind: p
  original: ''
  en: It is a new principle that differs completely from all governmental principle, monarchical or republican, absolute or parliamentarian.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.30.5
  kind: p
  original: ''
  en: It is an innovation that has been timidly introduced into the customs of Europe, but has come to stay.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.31.1
  kind: heading
  original: ''
  en: III
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.32.1
  kind: p
  original: ''
  en: 'How often have we not read in the writings of State-loving Socialists: "Who, then, will undertake the regulation of canal traffic in the future society?'
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.32.2
  kind: p
  original: ''
  en: Should it enter the mind of one of your Anarchist 'comrades' to put his barge across a canal and obstruct thousands of boats, who will force him to reason?"
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.33.1
  kind: p
  original: ''
  en: Let us confess the supposition to be somewhat fanciful.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.33.2
  kind: p
  original: ''
  en: 'Still, it might be said, for instance: "Should a certain commune, or a group of communes, want to make their barges pass before others, they might perhaps block the canal in order to carry stones, while wheat, needed in another commune, would have to stand by.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.33.3
  kind: p
  original: ''
  en: Who, then, would regulate the traffic if not the Government?"
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.34.1
  kind: p
  original: ''
  en: But real life has again demonstrated that Government can be very well dispensed with here as elsewhere.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.34.2
  kind: p
  original: ''
  en: Free agreement, free organization, replace that noxious and costly system, and do better.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.35.1
  kind: p
  original: ''
  en: We know what canals mean to Holland.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.35.2
  kind: p
  original: ''
  en: They are its highways.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.35.3
  kind: p
  original: ''
  en: We also know how much traffic there is on the canals.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.35.4
  kind: p
  original: ''
  en: What is carried along our highroads and railroads is transported on canal-boats in Holland.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.35.5
  kind: p
  original: ''
  en: There you could find cause to fight, in order to make your boats pass before others.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.35.6
  kind: p
  original: ''
  en: There the Government might really interfere to keep the traffic in order.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.36.1
  kind: p
  original: ''
  en: Yet it is not so.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.36.2
  kind: p
  original: ''
  en: The Dutch settled matters in a more practical way, long ago, by founding guilds, or syndicates of boatmen.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.36.3
  kind: p
  original: ''
  en: These were free associations sprung from the very needs of navigation.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.36.4
  kind: p
  original: ''
  en: The right of way for the boats was adjusted by the order of inscription in a navigation register; they had to follow one another in turn.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.36.5
  kind: p
  original: ''
  en: Nobody was allowed to get ahead of the others under pain of being excluded from the guild.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.36.6
  kind: p
  original: ''
  en: None could station more than a certain number of days along the quay; and if the owner found no goods to carry during that time, so much the worse for him; he had to depart with his empty barge to leave room for newcomers.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.36.7
  kind: p
  original: ''
  en: Obstruction was thus avoided, even though the competition between the private owners of the boats continued to exist.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.36.8
  kind: p
  original: ''
  en: Were the latter suppressed, the agreement would have been only the more cordial.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.37.1
  kind: p
  original: ''
  en: It is unnecessary to add that the shipowners could adhere or not to the syndicate.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.37.2
  kind: p
  original: ''
  en: That was their business, but most of them elected to join it.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.37.3
  kind: p
  original: ''
  en: Moreover, these syndicates offered such great advantages that they spread also along the Rhine, the Weser, the Oder, and as far as Berlin.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.37.4
  kind: p
  original: ''
  en: The boatmen did not wait for a great Bismarck to annex Holland to Germany, and to appoint an Ober Haupt General Staats Canal Navigation's Rath (Supreme Head Councillor of the General States Canal Navigation), with a number of gold stripes on his sleeves, corresponding to the length of the title.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.37.5
  kind: p
  original: ''
  en: They preferred coming to an international understanding.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.37.6
  kind: p
  original: ''
  en: Besides, a number of shipowners, whose sailing-vessels ply between Germany and Scandinavia, as well as Russia, have also joined these syndicates, in order to regulate traffic in the Baltic, and to bring about a certain harmony in the chassé-croisé of vessels.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.37.7
  kind: p
  original: ''
  en: These associations have sprung up freely, recruiting volunteer adherents, and have nought in common with governments.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.38.1
  kind: p
  original: ''
  en: It is, however, more than probable that here too greater capital oppresses lesser.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.38.2
  kind: p
  original: ''
  en: Maybe the syndicate has also a tendency to become a monopoly, especially where it receives the precious patronage of the State that surely did not fail to interfere with it.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.38.3
  kind: p
  original: ''
  en: Let us not forget either, that these syndicates represent associations whose members have only private interests at stake, and that if at the same time each shipowner were compelled--by the socializing of production, consumption, and exchange--to belong to federated Communes, or to a hundred other associations for the satisfying of his needs, things would have a different aspect.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.38.4
  kind: p
  original: ''
  en: A group of shipowners, powerful on sea, would feel weak on land, and they would be obliged to lessen their claims in order to come to terms with railways, factories, and other groups.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.39.1
  kind: p
  original: ''
  en: At any rate, without discussing the future, here is another spontaneous association that has dispensed with Government.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.39.2
  kind: p
  original: ''
  en: Let us quote more examples.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.40.1
  kind: p
  original: ''
  en: As we are talking of ships and boats, let us mention one of the most splendid organizations that the nineteenth century has brought forth, one of those we may with right be proud of--the English Lifeboat Association.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.41.1
  kind: p
  original: ''
  en: It is known that every year more than a thousand ships are wrecked on the shores of England.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.41.2
  kind: p
  original: ''
  en: At sea a good ship seldom fears a storm.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.41.3
  kind: p
  original: ''
  en: It is near the coasts that danger threatens--rough seas that shatter her stern-post, squalls that carry off her masts and sails, currents that render her unmanageable, reefs and sand banks on which she runs aground.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.42.1
  kind: p
  original: ''
  en: Even in olden times, when it was a custom among inhabitants of the coasts to light fires in order to attract vessels on to reefs, in order to plunder their cargoes, they always strove to save the crew.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.42.2
  kind: p
  original: ''
  en: Seeing a ship in distress, they launched their boats and went to the rescue of shipwrecked sailors, only too often finding a watery grave themselves.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.42.3
  kind: p
  original: ''
  en: Every hamlet along the sea shore has its legends of heroism, displayed by woman as well as by man, to save crews in distress.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.43.1
  kind: p
  original: ''
  en: No doubt the State and men of science have done something to diminish the number of casualties.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.43.2
  kind: p
  original: ''
  en: Lighthouses, signals, charts, meteorological warnings have diminished them greatly, but there remains a thousand ships and several thousand human lives to be saved every year.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.44.1
  kind: p
  original: ''
  en: To this end a few men of goodwill put their shoulders to the wheel.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.44.2
  kind: p
  original: ''
  en: Being good sailors and navigators themselves, they invented a lifeboat that could weather a storm without being torn to pieces or capsizing, and they set to work to interest the public in their venture, to collect the necessary funds for constructing boats, and for stationing them along the coasts, wherever they could be of use.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.45.1
  kind: p
  original: ''
  en: These men, not being Jacobins, did not turn to the Government.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.45.2
  kind: p
  original: ''
  en: They understood that to bring their enterprise to a successful issue they must have the co-operation, the enthusiasm, the local knowledge, and especially the self-sacrifice of the local sailors.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.45.3
  kind: p
  original: ''
  en: They also understood that to find men who at the first signal would launch their boat at night, in a chaos of waves, not suffering themselves to be deterred by darkness or breakers, and struggling five, six, ten hours against the tide before reaching a vessel in distress--men ready to risk their lives to save those of others--there must be a feeling of solidarity, a spirit of sacrifice not to be bought with galloon.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.45.4
  kind: p
  original: ''
  en: It was therefore a perfectly spontaneous movement, sprung from agreement and individual initiative.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.45.5
  kind: p
  original: ''
  en: Hundreds of local groups arose along the coasts.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.45.6
  kind: p
  original: ''
  en: The initiators had the common senses not to pose as masters.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.45.7
  kind: p
  original: ''
  en: They looked for sagacity in the fishermen's hamlets, and when a rich man sent £1,000 to a village on the coast to erect a lifeboat station, and his offer was accepted, he left the choice of a site to the local fishermen and sailors.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.46.1
  kind: p
  original: ''
  en: Models of new boats were not submitted to the Admiralty.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.46.2
  kind: p
  original: ''
  en: 'We read in a Report of the Association: "As it is of importance that life-boatmen should have full confidence in the vessel they man, the Committee will make a point of constructing and equipping the boats according to the life-boatmen''s expressed wish."'
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.46.3
  kind: p
  original: ''
  en: In consequence every year brings with it new improvements.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.47.1
  kind: p
  original: ''
  en: The work is wholly conducted by volunteers organizing in committees and local groups; by mutual aid and agreement!--Oh, Anarchists!
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.47.2
  kind: p
  original: ''
  en: Moreover, they ask nothing of the ratepayers, and in a year they may receive £40,000 in spontaneous subscriptions.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.48.1
  kind: p
  original: ''
  en: 'As to the results, here they are: In 1891 the Association possessed 293 lifeboats.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.48.2
  kind: p
  original: ''
  en: The same year it saved 601 shipwrecked sailors and 33 vessels.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.48.3
  kind: p
  original: ''
  en: Since its foundation it has saved 32,671 human beings.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.49.1
  kind: p
  original: ''
  en: In 1886, three lifeboats with all their men having perished at sea, hundreds of new volunteers entered their names, organized themselves into local groups, and the agitation resulted in the construction of twenty additional boats.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.49.2
  kind: p
  original: ''
  en: As we proceed, let us note that every year the Association sends to the fishermen and sailors excellent barometers at a price three times less than their sale price in private shops.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.49.3
  kind: p
  original: ''
  en: It propagates meteorological knowledge, and warns the parties concerned of the sudden changes of weather predicted by men of science.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.50.1
  kind: p
  original: ''
  en: Let us repeat that these hundreds of committees and local groups are not organized hierarchically, and are composed exclusively of volunteers, lifeboatmen, and people interested in the work.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.50.2
  kind: p
  original: ''
  en: The Central Committee, which is more of a centre for correspondence, in no wise interferes.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.51.1
  kind: p
  original: ''
  en: It is true that when a voting on some question of education or local taxation takes place in a district, these committees of the National Lifeboat Association do not, as such, take part in the deliberations--a modesty, which unfortunately the members of elected bodies do not imitate.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.51.2
  kind: p
  original: ''
  en: But, on the other hand, these brave men do not allow those who have never faced a storm to legislate for them about saving life.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.51.3
  kind: p
  original: ''
  en: At the first signal of distress they rush to their boats, and go ahead.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.51.4
  kind: p
  original: ''
  en: There are no embroidered uniforms, but much goodwill.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.52.1
  kind: p
  original: ''
  en: Let us take another society of the same kind, that of the Red Cross.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.52.2
  kind: p
  original: ''
  en: The name matters little; let us examine it.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.53.1
  kind: p
  original: ''
  en: 'Imagine somebody saying fifty years ago: "The State, capable as it is of massacring twenty thousand men in a day, and of wounding fifty thousand more, is incapable of helping its own victims; consequently, as long as war exists private initiative must intervene, and men of goodwill must organize internationally for this humane work!"'
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.53.2
  kind: p
  original: ''
  en: What mockery would not have met the man who would have dared to speak thus!
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.53.3
  kind: p
  original: ''
  en: 'To begin with, he would have been called a Utopian, and if that did not silence him he would have been told: "What nonsense!'
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.53.4
  kind: p
  original: ''
  en: Your volunteers will be found wanting precisely where they are most needed, your volunteer hospitals will be centralized in a safe place, while everything will be wanting in the ambulances.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.53.5
  kind: p
  original: ''
  en: Utopians like you forget the national rivalries which will cause the poor soldiers to die without any help."
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.53.6
  kind: p
  original: ''
  en: Such disheartening remarks would have only been equalled by the number of speakers.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.53.7
  kind: p
  original: ''
  en: Who of us has not heard men hold forth in this strain?
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.54.1
  kind: p
  original: ''
  en: Now we know what happened.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.54.2
  kind: p
  original: ''
  en: Red Cross societies organized themselves freely, everywhere, in all countries, in thousands of localities; and when the war of 1870-1 broke out, the volunteers set to work.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.54.3
  kind: p
  original: ''
  en: Men and women offered their services.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.54.4
  kind: p
  original: ''
  en: Thousands of hospitals and ambulances were organized; trains were started carrying ambulances, provisions, linen, and medicaments for the wounded.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.54.5
  kind: p
  original: ''
  en: The English committees sent entire convoys of food, clothing, tools, grain to sow, beasts of draught, even steam-ploughs with their attendants to help in the tillage of departments devastated by the war!
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.54.6
  kind: p
  original: ''
  en: Only consult La Croix Rouge, by Gustave Moynier, and you will be really struck by the immensity of the work performed.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.55.1
  kind: p
  original: ''
  en: As to the prophets ever ready to deny other men's courage, good sense, and intelligence, and believing themselves to be the only ones capable of ruling the world with a rod, none of their predictions were realized.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.55.2
  kind: p
  original: ''
  en: The devotion of the Red Cross volunteers was beyond all praise.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.55.3
  kind: p
  original: ''
  en: They were only too eager to occupy the most dangerous posts; and whereas the salaried doctors of the Napoleonic State fled with their staff when the Prussians approached, the Red Cross volunteers continued their work under fire, enduring the brutalities of Bismarck's and Napoleon's officers, lavishing their care on the wounded of all nationalities.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.55.4
  kind: p
  original: ''
  en: Dutch, Italians, Swedes, Belgians, even Japanese and Chinese agreed remarkably well.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.55.5
  kind: p
  original: ''
  en: They distributed their hospitals and their ambulances according to the needs of the occasion.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.55.6
  kind: p
  original: ''
  en: They vied with one another especially in the hygiene of their hospitals.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.55.7
  kind: p
  original: ''
  en: And there is many a Frenchman who still speaks with deep gratitude of the tender care he received from the Dutch or German volunteers in the Red Cross ambulances.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.55.8
  kind: p
  original: ''
  en: But what is this to an authoritarian?
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.55.9
  kind: p
  original: ''
  en: His ideal is the regiment doctor, salaried by the State.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.55.10
  kind: p
  original: ''
  en: What does he care for the Red Cross and its hygienic hospitals, if the nurses be not functionaries!
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.56.1
  kind: p
  original: ''
  en: Here is then an organization, sprung up but yesterday, and which reckons its members by hundreds of thousands; possesses ambulances, hospital trains, elaborates new processes for treating wounds, and so on, and is due to the spontaneous initiative of a few devoted men.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.57.1
  kind: p
  original: ''
  en: Perhaps we shall be told that the State has something to do with this organization.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.57.2
  kind: p
  original: ''
  en: Yes, States have laid hands on it to seize it.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.57.3
  kind: p
  original: ''
  en: The directing committees are presided over by those whom flunkeys call princes of the blood.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.57.4
  kind: p
  original: ''
  en: Emperors and queens lavishly patronize the national committees.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.57.5
  kind: p
  original: ''
  en: But it is not to this patronage that the success of the organization is due.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.57.6
  kind: p
  original: ''
  en: It is to the thousand local committees of each nation; to the activity of individuals, to the devotion of all those who try to help the victims of war.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.57.7
  kind: p
  original: ''
  en: And this devotion would be far greater if the State did not meddle with it.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.58.1
  kind: p
  original: ''
  en: In any case, it was not by the order of an International Directing Committee that Englishmen and Japanese, Swedes and Chinamen, bestirred themselves to send help to the wounded in 1871.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.58.2
  kind: p
  original: ''
  en: It was not by order of an international ministry that hospitals rose on the invaded territory and that ambulances were carried on to the battlefield.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.58.3
  kind: p
  original: ''
  en: It was by the initiative of volunteers from each country.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.58.4
  kind: p
  original: ''
  en: Once on the spot, they did not get hold of one another by the hair as was foreseen by the Jacobinists of all nations; they all set to work without distinction of nationality.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.59.1
  kind: p
  original: ''
  en: 'We may regret that such great efforts should be put to the service of so bad a cause, and we may ask ourselves like the poet''s child: "Why inflict wounds if you are to heal them afterwards?"'
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.59.2
  kind: p
  original: ''
  en: In striving to destroy the power of capitalist and middle-class authority, we work to put an end to the massacres called wars, and we would far rather see the Red Cross volunteers put forth their activity to bring about (with us) the suppression of war; but we had to mention this immense organization as another illustration of results produced by free agreement and free aid.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.60.1
  kind: p
  original: ''
  en: If we wished to multiply examples taken from the art of exterminating men we should never end.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.60.2
  kind: p
  original: ''
  en: Suffice to quote the numerous societies to which the German army owes its force, that does not only depend on discipline, as is generally believed.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.60.3
  kind: p
  original: ''
  en: I mean the societies whose aim is to propagate military knowledge.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.61.1
  kind: p
  original: ''
  en: At one of the last congresses of the Military Alliance (Kriegerbund), delegates from 2,452 federated societies, comprising 151,712 members, were present.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.61.2
  kind: p
  original: ''
  en: But there are besides very numerous Shooting, Military Games, Strategical Games, Topographical Studies Societies--these are the workshops in which the technical knowledge of the German army is developed, not in regimental schools.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.61.3
  kind: p
  original: ''
  en: It is a formidable network of all kinds of societies, including military men and civilians, geographers and gymnasts, sportsmen and technologists, which rise up spontaneously, organize, federate, discuss, and explore the country.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.61.4
  kind: p
  original: ''
  en: It is these voluntary and free associations that go to make the real backbone of the German army.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.62.1
  kind: p
  original: ''
  en: Their aim is execrable.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.62.2
  kind: p
  original: ''
  en: It is the maintenance of the Empire.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.62.3
  kind: p
  original: ''
  en: But what concerns us, is to point out that, in spite of military organization being the "Great Mission of the State," success in this branch is the more certain the more it is left to the free agreement of groups and to the free initiative of individuals.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.63.1
  kind: p
  original: ''
  en: Even in matters pertaining to war, free agreement is thus appealed to; and to further prove our assertion let us mention the Volunteer Topographers' Corps of Switzerland who study in detail the mountain passages, the Aeroplane Corps of France, the three hundred thousand British volunteers, the British National Artillery Association, and the Society, now in course of organization, for the defence of England's coasts, as well as the appeals made to the commercial fleet, the Bicyclists' Corps, and the new organizations of private motorcars and steam launches.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.64.1
  kind: p
  original: ''
  en: Everywhere the State is abdicating and abandoning its holy functions to private individuals.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.64.2
  kind: p
  original: ''
  en: Everywhere free organization trespasses on its domain.
  modern: ''
  modern_status: empty
  notes: ''
- id: XI.64.3
  kind: p
  original: ''
