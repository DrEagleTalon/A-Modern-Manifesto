section: VII
title_original: Chapter VII. Clothing
title_en: Chapter VII. Clothing
author: Peter Kropotkin
date: 1892 (French); English 1906
original_language: fr
anchor_language: en
source_original: Not yet in this repository. Kropotkin's French, La Conquête du pain (Paris 1892), is still to be located on a reachable mirror.
source_en: 'Anonymous English translation (London: Chapman and Hall, 1906) with Kropotkin''s preface of 1913, Vanguard Press printing (New York 1926), Project Gutenberg ebook 23428 (public domain)'
verses:
- id: VII.0.1
  kind: heading
  original: ''
  en: Chapter VII. Clothing
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.1.1
  kind: p
  original: ''
  en: When the houses have become the common heritage of the citizens, and when each man has his daily supply of food, another forward step will have to be taken.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.1.2
  kind: p
  original: ''
  en: The question of clothing will of course demand consideration next, and again the only possible solution will be to take possession, in the name of the people, of all the shops and warehouses where clothing is sold or stored, and to throw open the doors to all, so that each can take what he needs.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.1.3
  kind: p
  original: ''
  en: The communalization of clothing--the right of each to take what he needs from the communal stores, or to have it made for him at the tailors and outfitters--is a necessary corollary of the communalization of houses and food.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.1
  kind: p
  original: ''
  en: Obviously we shall not need for that to despoil all citizens of their coats, to put all the garments in a heap and draw lots for them, as our critics, with equal wit and ingenuity, suggest.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.2
  kind: p
  original: ''
  en: Let him who has a coat keep it still--nay, if he have ten coats it is highly improbable that any one will want to deprive him of them, for most folk would prefer a new coat to one that has already graced the shoulders of some fat bourgeois; and there will be enough new garments, and to spare, without having recourse to second-hand wardrobes.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.1
  kind: p
  original: ''
  en: If we were to take an inventory of all the clothes and stuff for clothing accumulated in the shops and stores of the large towns, we should find probably that in Paris, Lyons, Bordeaux, and Marseilles, there was enough to enable the commune to offer garments to all the citizens, of both sexes; and if all were not suited at once, the communal outfitters would soon make good these shortcomings.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.2
  kind: p
  original: ''
  en: We know how rapidly our great tailoring and dressmaking establishments work nowadays, provided as they are with machinery specially adapted for production on a large scale.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.4.1
  kind: p
  original: ''
  en: '"But every one will want a sable-lined coat or a velvet gown!" exclaim our adversaries.'
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.1
  kind: p
  original: ''
  en: Frankly, we do not believe it.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.2
  kind: p
  original: ''
  en: Every woman does not dote on velvet nor does every man dream of sable linings.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.3
  kind: p
  original: ''
  en: Even now, if we were to ask each woman to choose her gown, we should find some to prefer a simple, practical garment to all the fantastic trimmings the fashionable world affects.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.1
  kind: p
  original: ''
  en: Tastes change with the times, and the fashion in vogue at the time of the Revolution will certainly make for simplicity.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.2
  kind: p
  original: ''
  en: Societies, like individuals, have their hours of cowardice, but also their heroic moments; and though the society of to-day cuts a very poor figure sunk in the pursuit of narrow personal interests and second-rate ideas, it wears a different air when great crises come.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.3
  kind: p
  original: ''
  en: It has its moments of greatness and enthusiasm.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.4
  kind: p
  original: ''
  en: Men of generous nature will gain the power which to-day is in the hand of jobbers.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.5
  kind: p
  original: ''
  en: Self-devotion will spring up, and noble deeds beget their like; even the egotists will be ashamed of hanging back, and will be drawn in spite of themselves to admire, if not to imitate, the generous and brave.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.1
  kind: p
  original: ''
  en: The great Revolution of 1793 abounds in examples of this kind, and it is always during such times of spiritual revival--as natural to societies as to individuals--that the spring-tide of enthusiasm sweeps humanity onwards.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.8.1
  kind: p
  original: ''
  en: We do not wish to exaggerate the part played by such noble passions, nor is it upon them that we would found our ideal of society.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.8.2
  kind: p
  original: ''
  en: But we are not asking too much if we expect their aid in tiding over the first and most difficult moments.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.8.3
  kind: p
  original: ''
  en: We cannot hope that our daily life will be continuously inspired by such exalted enthusiasms, but we may expect their aid at the first, and that is all we need.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.1
  kind: p
  original: ''
  en: It is just to wash the earth clean, to sweep away the shards and refuse, accumulated by centuries of slavery and oppression, that the new anarchist society will have need of this wave of brotherly love.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.2
  kind: p
  original: ''
  en: Later on it can exist without appealing to the spirit of self-sacrifice, because it will have eliminated oppression, and thus created a new world instinct with all the feelings of solidarity.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.1
  kind: p
  original: ''
  en: Besides, should the character of the Revolution be such as we have sketched here, the free initiative of individuals would find an extensive field of action in thwarting the efforts of the egotists.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.2
  kind: p
  original: ''
  en: Groups would spring up in every street and quarter to undertake the charge of the clothing.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.3
  kind: p
  original: ''
  en: They would make inventories of all that the city possessed, and would find out approximately what were the resources at their disposal.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.4
  kind: p
  original: ''
  en: It is more than likely that in the matter of clothing the citizens would adopt the same principle as in the matter of provisions--that is to say, they would offer freely from the common store everything which was to be found in abundance, and dole out whatever was limited in quantity.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.11.1
  kind: p
  original: ''
  en: Not being able to offer to each man a sable-lined coat and to every woman a velvet gown, society would probably distinguish between the superfluous and the necessary, and, provisionally at least class sable and velvet among the superfluities of life, ready to let time prove whether what is a luxury to-day may not become common to all to-morrow.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.11.2
  kind: p
  original: ''
  en: While the necessary clothing would be guaranteed to each inhabitant of the anarchist city, it would be left to private activity to provide for the sick and feeble those things, provisionally considered as luxuries, and to procure for the less robust such special articles, as would not enter into the daily consumption of ordinary citizens.
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.12.1
  kind: p
  original: ''
  en: '"But," it may be urged, "this means grey uniformity and the end of everything beautiful in life and art."'
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.13.1
  kind: p
  original: ''
  en: '"Certainly not," we reply.'
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.13.2
  kind: p
  original: ''
  en: And, still basing our reasonings on what already exists, we are going to show how an Anarchist society could satisfy the most artistic tastes of its citizens without allowing them to amass the fortunes of millionaires.
  modern: ''
  modern_status: empty
  notes: ''
