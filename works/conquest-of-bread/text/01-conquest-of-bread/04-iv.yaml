# Master file. Edit the `modern` and `notes` fields; see CONTRIBUTING.md.
# Verse ids are frozen. Never renumber; see VERSIFICATION.md.
section: IV
title_original: Chapter IV. Expropriation
title_en: Chapter IV. Expropriation
author: Peter Kropotkin
date: 1892 (French); English 1906
original_language: fr
anchor_language: en
source_original: Not yet in this repository. Kropotkin's French, La Conquête du pain (Paris 1892), is still to be located on a reachable mirror.
source_en: 'Anonymous English translation (London: Chapman and Hall, 1906) with Kropotkin''s preface of 1913, Vanguard Press printing (New York 1926), Project Gutenberg ebook 23428 (public domain)'
verses:
- id: IV.0.1
  kind: heading
  original: ''
  en: Chapter IV. Expropriation
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.1.1
  kind: heading
  original: ''
  en: I
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.1
  kind: p
  original: ''
  en: 'It is told of Rothschild that, seeing his fortune threatened by the Revolution of 1848, he hit upon the following stratagem: "I am quite willing to admit," said he, "that my fortune has been accumulated at the expense of others; but if it were divided to-morrow among the millions of Europe, the share of each would only amount to four shillings.'
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.2
  kind: p
  original: ''
  en: Very well, then, I undertake to render to each his four shillings if he asks me for it."
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.3.1
  kind: p
  original: ''
  en: Having given due publicity to his promise, our millionaire proceeded as usual to stroll quietly through the streets of Frankfort.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.3.2
  kind: p
  original: ''
  en: Three or four passers-by asked for their four shillings, which he disbursed with a sardonic smile.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.3.3
  kind: p
  original: ''
  en: His stratagem succeeded, and the family of the millionaire is still in possession of its wealth.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.4.1
  kind: p
  original: ''
  en: It is in much the same fashion that the shrewd heads among the middle classes reason when they say, "Ah, Expropriation!
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.4.2
  kind: p
  original: ''
  en: I know what that means.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.4.3
  kind: p
  original: ''
  en: You take all the overcoats and lay them in a heap, and every one is free to help himself and fight for the best."
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.1
  kind: p
  original: ''
  en: But such jests are irrelevant as well as flippant.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.2
  kind: p
  original: ''
  en: What we want is not a redistribution of overcoats, although it must be said that even in such a case, the shivering folk would see advantage in it.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.3
  kind: p
  original: ''
  en: Nor do we want to divide up the wealth of the Rothschilds.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.4
  kind: p
  original: ''
  en: What we do want is so to arrange things that every human being born into the world shall be ensured the opportunity, in the first instance of learning some useful occupation, and of becoming skilled in it; and next, that he shall be free to work at his trade without asking leave of master or owner, and without handing over to landlord or capitalist the lion's share of what he produces.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.5
  kind: p
  original: ''
  en: As to the wealth held by the Rothschilds or the Vanderbilts, it will serve us to organize our system of communal production.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.6.1
  kind: p
  original: ''
  en: The day when the labourer may till the ground without paying away half of what he produces, the day when the machines necessary to prepare the soil for rich harvests are at the free disposal of the cultivators, the day when the worker in the factory produces for the community and not the monopolist--that day will see the workers clothed and fed, and there will be no more Rothschilds or other exploiters.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.7.1
  kind: p
  original: ''
  en: No one will then have to sell his working power for a wage that only represents a fraction of what he produces.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.8.1
  kind: p
  original: ''
  en: '"So far, so good," say our critics, "but you will have Rothschilds coming in from the outside.'
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.8.2
  kind: p
  original: ''
  en: How are you to prevent a person from amassing millions in China, and then settling amongst you?
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.8.3
  kind: p
  original: ''
  en: How are you going to prevent such a one from surrounding himself with lackeys and wage-slaves--from exploiting them and enriching himself at their expense?
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.9.1
  kind: p
  original: ''
  en: '"You cannot bring about a revolution all over the world at the same time.'
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.9.2
  kind: p
  original: ''
  en: Well, then--are you going to establish custom-houses on your frontiers to search all who enter your country and confiscate the money they bring with them?--Anarchist policemen firing on travellers would be a fine spectacle!"
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.10.1
  kind: p
  original: ''
  en: But at the root of this argument there is a great error.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.10.2
  kind: p
  original: ''
  en: Those who propound it have never paused to inquire whence come the fortunes of the rich.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.10.3
  kind: p
  original: ''
  en: A little thought would, however, suffice to show them that these fortunes have their beginnings in the poverty of the poor.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.10.4
  kind: p
  original: ''
  en: When there are no longer any destitute, there will no longer be any rich to exploit them.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.11.1
  kind: p
  original: ''
  en: Let us glance for a moment at the Middle Ages, when great fortunes began to spring up.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.12.1
  kind: p
  original: ''
  en: A feudal baron seizes on a fertile valley.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.12.2
  kind: p
  original: ''
  en: But as long as the fertile valley is empty of folk our baron is not rich.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.12.3
  kind: p
  original: ''
  en: His land brings him in nothing; he might as well possess a property in the moon.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.13.1
  kind: p
  original: ''
  en: What does our baron do to enrich himself?
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.13.2
  kind: p
  original: ''
  en: He looks out for peasants--for poor peasants!
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.1
  kind: p
  original: ''
  en: If every peasant-farmer had a piece of land, free from rent and taxes, if he had in addition the tools and the stock necessary for farm labour--Who would plough the lands of the baron?
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.2
  kind: p
  original: ''
  en: Everyone would look after his own.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.3
  kind: p
  original: ''
  en: But there are thousands of destitute persons ruined by wars, or drought, or pestilence.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.4
  kind: p
  original: ''
  en: They have neither horse nor plough.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.5
  kind: p
  original: ''
  en: (Iron was very costly in the Middle Ages, and a draught-horse still more so.)
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.15.1
  kind: p
  original: ''
  en: All these destitute creatures are trying to better their condition.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.15.2
  kind: p
  original: ''
  en: One day they see on the road at the confines of our baron's estate a notice-board indicating by certain signs adapted to their comprehension that the labourer who is willing to settle on his estate will receive the tools and materials to build his cottage and sow his fields, and a portion of land rent free for a certain number of years.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.15.3
  kind: p
  original: ''
  en: The number of years is represented by so many crosses on the sign-board, and the peasant understands the meaning of these crosses.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.1
  kind: p
  original: ''
  en: So the poor wretches come to settle on the baron's lands.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.2
  kind: p
  original: ''
  en: They make roads, drain the marshes, build villages.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.3
  kind: p
  original: ''
  en: In nine or ten years the baron begins to tax them.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.4
  kind: p
  original: ''
  en: Five years later he increases the rent.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.5
  kind: p
  original: ''
  en: Then he doubles it, and the peasant accepts these new conditions because he cannot find better ones elsewhere.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.6
  kind: p
  original: ''
  en: Little by little, with the aid of laws made by the barons, the poverty of the peasant becomes the source of the landlord's wealth.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.7
  kind: p
  original: ''
  en: And it is not only the lord of the manor who preys upon him.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.8
  kind: p
  original: ''
  en: A whole host of usurers swoop down upon the villages, multiplying as the wretchedness of the peasants increases.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.9
  kind: p
  original: ''
  en: That is how these things happened in the Middle Ages.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.10
  kind: p
  original: ''
  en: And to-day is it not still the same thing?
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.11
  kind: p
  original: ''
  en: If there were free lands which the peasant could cultivate if he pleased, would he pay £50 to some "shabble of a Duke" for condescending to sell him a scrap?
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IV.N2
- id: IV.16.12
  kind: p
  original: ''
  en: Would he burden himself with a lease which absorbed a third of the produce?
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.13
  kind: p
  original: ''
  en: Would he--on the métayer system--consent to give half of his harvest to the landowner?
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.17.1
  kind: p
  original: ''
  en: But he has nothing.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.17.2
  kind: p
  original: ''
  en: So he will accept any conditions, if only he can keep body and soul together, while he tills the soil and enriches the landlord.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.18.1
  kind: p
  original: ''
  en: So in the nineteenth century, just as in the Middle Ages, the poverty of the peasant is a source of wealth to the landed proprietor.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.19.1
  kind: heading
  original: ''
  en: II
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.20.1
  kind: p
  original: ''
  en: The landlord owes his riches to the poverty of the peasants, and the wealth of the capitalist comes from the same source.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.21.1
  kind: p
  original: ''
  en: Take the case of a citizen of the middle class, who somehow or other finds himself in possession of £20,000.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.21.2
  kind: p
  original: ''
  en: He could, of course, spend his money at the rate of £2,000 a year, a mere bagatelle in these days of fantastic, senseless luxury.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.21.3
  kind: p
  original: ''
  en: But then he would have nothing left at the end of ten years.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.21.4
  kind: p
  original: ''
  en: So, being a "practical person," he prefers to keep his fortune intact, and win for himself a snug little annual income as well.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.22.1
  kind: p
  original: ''
  en: This is very easy in our society, for the good reason that the towns and villages swarm with workers who have not the wherewithal to live for a month, or even a fortnight.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.22.2
  kind: p
  original: ''
  en: So our worthy citizen starts a factory.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.22.3
  kind: p
  original: ''
  en: The banks hasten to lend him another £20,000, especially if he has a reputation for "business ability"; and with this round sum he can command the labour of five hundred hands.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.23.1
  kind: p
  original: ''
  en: If all the men and women in the countryside had their daily bread assured, and their daily needs already satisfied, who would work for our capitalist at a wage of half a crown a day, while the commodities one produces in a day sell in the market for a crown or more?
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.24.1
  kind: p
  original: ''
  en: Unhappily--we know it all too well--the poor quarters of our towns and the neighbouring villages are full of needy wretches, whose children clamour for bread.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.24.2
  kind: p
  original: ''
  en: So, before the factory is well finished, the workers hasten to offer themselves.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.24.3
  kind: p
  original: ''
  en: Where a hundred are required three hundred besiege the doors, and from the time his mill is started, the owner, if he only has average business capacities, will clear £40 a year out of each mill-hand he employs.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.25.1
  kind: p
  original: ''
  en: He is thus able to lay by a snug little fortune; and if he chooses a lucrative trade, and has "business talents," he will soon increase his income by doubling the number of men he exploits.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.26.1
  kind: p
  original: ''
  en: So he becomes a personage of importance.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.26.2
  kind: p
  original: ''
  en: He can afford to give dinners to other personages--to the local magnates, the civic, legal, and political dignitaries.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.26.3
  kind: p
  original: ''
  en: With his money he can "marry money"; by and by he may pick and choose places for his children, and later on perhaps get something good from the Government--a contract for the army or for the police.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.26.4
  kind: p
  original: ''
  en: His gold breeds gold; till at last a war, or even a rumour of war, or a speculation on the Stock Exchange, gives him his great opportunity.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.27.1
  kind: p
  original: ''
  en: Nine-tenths of the great fortunes made in the United States are (as Henry George has shown in his "Social Problems") the result of knavery on a large scale, assisted by the State.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.27.2
  kind: p
  original: ''
  en: In Europe, nine-tenths of the fortunes made in our monarchies and republics have the same origin.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.27.3
  kind: p
  original: ''
  en: There are not two ways of becoming a millionaire.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.28.1
  kind: p
  original: ''
  en: 'This is the secret of wealth: find the starving and destitute, pay them half a crown, and make them produce five shillings worth in the day, amass a fortune by these means, and then increase it by some lucky speculation, made with the help of the State.'
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.29.1
  kind: p
  original: ''
  en: Need we go on to speak of small fortunes attributed by the economists to forethought and frugality, when we know that mere saving in itself brings in nothing, so long as the pence saved are not used to exploit the famishing?
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.30.1
  kind: p
  original: ''
  en: Take a shoemaker, for instance.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.30.2
  kind: p
  original: ''
  en: Grant that his work is well paid, that he has plenty of custom, and that by dint of strict frugality he contrives to lay by from eighteen pence to two shillings a day, perhaps two pounds a month.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.31.1
  kind: p
  original: ''
  en: Grant that our shoemaker is never ill, that he does not half starve himself, in spite of his passion for economy; that he does not marry or that he has no children; that he does not die of consumption; suppose anything and everything you please!
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.32.1
  kind: p
  original: ''
  en: Well, at the age of fifty he will not have scraped together £800; and he will not have enough to live on during his old age, when he is past work.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.32.2
  kind: p
  original: ''
  en: Assuredly this is not how fortunes are made.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.32.3
  kind: p
  original: ''
  en: But suppose our shoemaker, as soon as he has laid by a few pence, thriftily conveys them to the savings bank and that the savings bank lends them to the capitalist who is just about to "employ labour," i.e., to exploit the poor.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.32.4
  kind: p
  original: ''
  en: Then our shoemaker takes an apprentice, the child of some poor wretch, who will think himself lucky if in five years' time his son has learned the trade and is able to earn his living.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.33.1
  kind: p
  original: ''
  en: Meanwhile our shoemaker does not lose by him, and if trade is brisk he soon takes a second, and then a third apprentice.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.33.2
  kind: p
  original: ''
  en: By and by he will take two or three working men--poor wretches, thankful to receive half a crown a day for work that is worth five shillings, and if our shoemaker is "in luck," that is to say, if he is keen enough and mean enough, his working men and apprentices will bring him in nearly one pound a day, over and above the product of his own toil.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.33.3
  kind: p
  original: ''
  en: He can then enlarge his business.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.33.4
  kind: p
  original: ''
  en: He will gradually become rich, and no longer have any need to stint himself in the necessaries of life.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.33.5
  kind: p
  original: ''
  en: He will leave a snug little fortune to his son.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.34.1
  kind: p
  original: ''
  en: That is what people call "being economical and having frugal, temperate habits."
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.34.2
  kind: p
  original: ''
  en: At bottom it is nothing more nor less than grinding the face of the poor.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.35.1
  kind: p
  original: ''
  en: Commerce seems an exception to this rule.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.35.2
  kind: p
  original: ''
  en: '"Such a man," we are told, "buys tea in China, brings it to France, and realizes a profit of thirty per cent. on his original outlay.'
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.35.3
  kind: p
  original: ''
  en: He has exploited nobody."
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.36.1
  kind: p
  original: ''
  en: Nevertheless the case is quite similar.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.36.2
  kind: p
  original: ''
  en: If our merchant had carried his bales on his back, well and good!
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.36.3
  kind: p
  original: ''
  en: In early medieval times that was exactly how foreign trade was conducted, and so no one reached such giddy heights of fortune as in our days.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.36.4
  kind: p
  original: ''
  en: Very few and very hardly earned were the gold coins which the medieval merchant gained from a long and dangerous voyage.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.36.5
  kind: p
  original: ''
  en: It was less the love of money than the thirst of travel and adventure that inspired his undertakings.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.37.1
  kind: p
  original: ''
  en: Nowadays the method is simpler.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.37.2
  kind: p
  original: ''
  en: A merchant who has some capital need not stir from his desk to become wealthy.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.37.3
  kind: p
  original: ''
  en: He telegraphs to an agent telling him to buy a hundred tons of tea; he freights a ship, and in a few weeks, in three months if it is a sailing ship, the vessels brings him his cargo.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.37.4
  kind: p
  original: ''
  en: He does not even take the risks of the voyage, for his tea and his vessel are insured, and if he has expended four thousand pounds he will receive more than five or six thousand; that is to say, if he has not attempted to speculate in some novel commodities, in which case he runs a chance of either doubling his fortune or losing it altogether.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.38.1
  kind: p
  original: ''
  en: Now, how could he find men willing to cross the sea, to travel to China and back, to endure hardship and slavish toil and to risk their lives for a miserable pittance?
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.38.2
  kind: p
  original: ''
  en: How could he find dock labourers willing to load and unload his ships for "starvation wages"?
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.38.3
  kind: p
  original: ''
  en: How?
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.38.4
  kind: p
  original: ''
  en: Because they are needy and starving.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.38.5
  kind: p
  original: ''
  en: Go to the seaports, visit the cook-shops and taverns on the quays, and look at these men who have come to hire themselves, crowding round the dock-gates, which they besiege from early dawn, hoping to be allowed to work on the vessels.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.38.6
  kind: p
  original: ''
  en: Look at these sailors, happy to be hired for a long voyage, after weeks and months of waiting.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.38.7
  kind: p
  original: ''
  en: All their lives long they have gone to the sea in ships, and they will sail in others still, until they have perished in the waves.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.39.1
  kind: p
  original: ''
  en: Enter their homes, look at their wives and children in rags, living one knows not how till the father's return, and you will have the answer to the question.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.40.1
  kind: p
  original: ''
  en: Multiply examples, choose them where you will, consider the origin of all fortunes, large or small, whether arising out of commerce, finance, manufacturers, or the land.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.40.2
  kind: p
  original: ''
  en: Everywhere you will find that the wealth of the wealthy springs from the poverty of the poor.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.40.3
  kind: p
  original: ''
  en: This is why an anarchist society need not fear the advent of a Rothschild who would settle in its midst.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.40.4
  kind: p
  original: ''
  en: If every member of the community knows that after a few hours of productive toil he will have a right to all the pleasures that civilization procures, and to those deeper sources of enjoyment which art and science offer to all who seek them, he will not sell his strength for a starvation wage.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.40.5
  kind: p
  original: ''
  en: No one will volunteer to work for the enrichment of your Rothschild.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.40.6
  kind: p
  original: ''
  en: His golden guineas will be only so many pieces of metal--useful for various purposes, but incapable of breeding more.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.41.1
  kind: p
  original: ''
  en: In answering the above objection we have at the same time indicated the scope of Expropriation.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.41.2
  kind: p
  original: ''
  en: It must apply to everything that enables any man--be he financier, mill-owner, or landlord--to appropriate the product of others' toil.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.41.3
  kind: p
  original: ''
  en: Our formula is simple and comprehensive.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.42.1
  kind: p
  original: ''
  en: We do not want to rob any one of his coat, but we wish to give to the workers all those things the lack of which makes them fall an easy prey to the exploiter, and we will do our utmost that none shall lack aught, that not a single man shall be forced to sell the strength of his right arm to obtain a bare subsistence for himself and his babes.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.42.2
  kind: p
  original: ''
  en: This is what we mean when we talk of Expropriation; this will be our duty during the Revolution, for whose coming we look, not two hundred years hence, but soon, very soon.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.43.1
  kind: heading
  original: ''
  en: III
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.44.1
  kind: p
  original: ''
  en: The ideas of Anarchism in general and of Expropriation in particular find much more sympathy than we are apt to imagine among men of independent character, and those for whom idleness is not the supreme ideal.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.44.2
  kind: p
  original: ''
  en: '"Still," our friends often warn us, "take care you do not go too far!'
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.44.3
  kind: p
  original: ''
  en: Humanity cannot be changed in a day, so do not be in to great a hurry with your schemes of Expropriation and Anarchy, or you will be in danger of achieving no permanent result."
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.45.1
  kind: p
  original: ''
  en: Now, what we fear with regard to Expropriation is exactly the contrary.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.45.2
  kind: p
  original: ''
  en: We are afraid of not going far enough, of carrying out Expropriation on too small a scale to be lasting.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.45.3
  kind: p
  original: ''
  en: We would not have the revolutionary impulse arrested in mid-career, to exhaust itself in half measures, which would content no one, and while producing a tremendous confusion in society, and stopping its customary activities, would have no vital power--would merely spread general discontent and inevitably prepare the way for the triumph of reaction.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.46.1
  kind: p
  original: ''
  en: There are, in fact, in a modern State established relations which it is practically impossible to modify if one attacks them only in detail.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.46.2
  kind: p
  original: ''
  en: There are wheels within wheels in our economic organization--the machinery is so complex and interdependent that no one part can be modified without disturbing the whole.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.46.3
  kind: p
  original: ''
  en: This becomes clear as soon as an attempt is made to expropriate anything.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.47.1
  kind: p
  original: ''
  en: Let us suppose that in a certain country a limited form of expropriation is effected.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.47.2
  kind: p
  original: ''
  en: For example, that, as it has been suggested more than once, only the property of the great landlords is socialized, whilst the factories are left untouched; or that, in a certain city, house property is taken over by the Commune, but everything else is left to private ownership; or that, in some manufacturing centre, the factories are communalized, but the land is not interfered with.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.48.1
  kind: p
  original: ''
  en: The same result would follow in each case--a terrible shattering of the industrial system, without the means of reorganizing it on new lines.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.48.2
  kind: p
  original: ''
  en: Industry and finance would be at a deadlock, yet a return to the first principles of justice would not have been achieved, and society would find itself powerless to construct a harmonious whole.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.49.1
  kind: p
  original: ''
  en: If agriculture were freed from great landowners, while industry still remained the bond-slave of the capitalist, the merchant, and the banker, nothing would be accomplished.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.49.2
  kind: p
  original: ''
  en: The peasant suffers to-day not only in having to pay rent to the landlord; he is oppressed on all hands by existing conditions.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.49.3
  kind: p
  original: ''
  en: He is exploited by the tradesman, who makes him pay half a crown for a spade which, measured by the labour spent on it, is not worth more than sixpence.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.49.4
  kind: p
  original: ''
  en: He is taxed by the State, which cannot do without its formidable hierarchy of officials, and finds it necessary to maintain an expensive army, because the traders of all nations are perpetually fighting for the markets, and any day a little quarrel arising from the exploitation of some part of Asia or Africa may result in war.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.50.1
  kind: p
  original: ''
  en: 'Then again the peasant suffers from the depopulation of country places: the young people are attracted to the large manufacturing towns by the bait of high wages paid temporarily by the producers of articles of luxury, or by the attractions of a more stirring life.'
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.50.2
  kind: p
  original: ''
  en: The artificial protection of industry, the industrial exploitation of foreign countries, the prevalence of stock-jobbing, the difficulty of improving the soil and the machinery of production--all these agencies combine nowadays to work against agriculture, which is burdened not only by rent, but by the whole complex of conditions in a society based on exploitation.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.50.3
  kind: p
  original: ''
  en: Thus, even if the expropriation of land were accomplished, and every one were free to till the soil and cultivate it to the best advantage, without paying rent, agriculture, even though it should enjoy--which can by no means be taken for granted--a momentary prosperity, would soon fall back into the slough in which it finds itself to-day.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.50.4
  kind: p
  original: ''
  en: The whole thing would have to be begun over again, with increased difficulties.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.51.1
  kind: p
  original: ''
  en: The same holds true of industry.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.51.2
  kind: p
  original: ''
  en: 'Take the converse case: instead of turning the agricultural labourers into peasant-proprietors, make over the factories to those who work in them.'
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.51.3
  kind: p
  original: ''
  en: Abolish the master-manufacturers, but leave the landlord his land, the banker his money, the merchant his Exchange; maintain the swarm of idlers who live on the toil of the workmen, the thousand and one middlemen, the State with its numberless officials,--and industry would come to a standstill.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.51.4
  kind: p
  original: ''
  en: Finding no purchasers in the mass of peasants who would remain poor; not possessing the raw material, and unable to export their produce, partly on account of the stoppage of trade, and still more so because industries spread all over the world, the manufacturers would feel unable to struggle, and thousands of workers would be thrown upon the streets.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.51.5
  kind: p
  original: ''
  en: These starving crowds would be ready and willing to submit to the first schemer who came to exploit them; they would even consent to return to the old slavery, under promise of guaranteed work.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.52.1
  kind: p
  original: ''
  en: Or, finally, suppose you oust the landowners, and hand over the mills and factories to the worker, without interfering with the swarm of middlemen who drain the product of our manufacturers, and speculate in corn and flour, meat and groceries, in our great centres of commerce.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.52.2
  kind: p
  original: ''
  en: Then, as soon as the exchange of produce is slackened; as soon as the great cities are left without bread, while the great manufacturing centres find no buyers for the articles of luxury they produce,--the counter-revolution is bound to take place, and it would come, treading upon the slain, sweeping the towns and villages with shot and shell; indulging in orgies of proscriptions and deportations, such as were seen in France in 1815, 1848, and 1871.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.53.1
  kind: p
  original: ''
  en: All is interdependent in a civilized society; it is impossible to reform any one thing without altering the whole.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.53.2
  kind: p
  original: ''
  en: Therefore, on the day a nation will strike at private property, under any one of its forms, territorial or industrial, it will be obliged to attack them all.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.53.3
  kind: p
  original: ''
  en: The very success of the Revolution will impose it.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.54.1
  kind: p
  original: ''
  en: Besides, even if it were desired, it would be impossible to confine the change to a partial expropriation.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.54.2
  kind: p
  original: ''
  en: Once the principle of the "Divine Right of Property" is shaken, no amount of theorizing will prevent its overthrow, here by the slaves of the field, there by the slaves of the machine.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.55.1
  kind: p
  original: ''
  en: If a great town, Paris for example, were to confine itself to taking possession of the dwelling houses of the factories, it would be forced also to deny the right of the bankers to levy upon the Commune a tax amounting to £2,000,000, in the form of interest for former loans.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.55.2
  kind: p
  original: ''
  en: The great city would be obliged to put itself in touch with the rural districts, and its influence would inevitably urge the peasants to free themselves from the landowner.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.55.3
  kind: p
  original: ''
  en: It would be necessary to communalize the railways, that the citizens might get food and work, and lastly, to prevent the waste of supplies; and to guard against the trusts of corn-speculators, like those to whom the Paris Commune of 1793 fell a prey, it would have to place in the hands of the City the work of stocking its warehouses with commodities, and apportioning the produce.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.56.1
  kind: p
  original: ''
  en: Some Socialists still seek, however, to establish a distinction.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.56.2
  kind: p
  original: ''
  en: '"Of course," they say, "the soil, the mines, the mills, and manufacturers must be expropriated, these are the instruments of production, and it is right we should consider them public property.'
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.56.3
  kind: p
  original: ''
  en: But articles of consumption--food, clothes, and dwellings--should remain private property."
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.57.1
  kind: p
  original: ''
  en: Popular common sense has got the better of this subtle distinction.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.57.2
  kind: p
  original: ''
  en: We are not savages who can live in the woods, without other shelter than the branches.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.57.3
  kind: p
  original: ''
  en: The civilized man needs a roof, a room, a hearth, and a bed.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.57.4
  kind: p
  original: ''
  en: It is true that the bed, the room, and the house is a home of idleness for the non-producer.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.57.5
  kind: p
  original: ''
  en: But for the worker, a room, properly heated and lighted, is as much an instrument of production as the tool or the machine.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.57.6
  kind: p
  original: ''
  en: It is the place where the nerves and sinews gather strength for the work of the morrow.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.57.7
  kind: p
  original: ''
  en: The rest of the workman is the daily repairing of the machine.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.58.1
  kind: p
  original: ''
  en: The same argument applies even more obviously to food.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.58.2
  kind: p
  original: ''
  en: The so-called economists, who make the just-mentioned distinction, would hardly deny that the coal burnt in a machine is as necessary to production as the raw material itself.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.58.3
  kind: p
  original: ''
  en: How then can food, without which the human machine could do no work, be excluded from the list of things indispensable to the producer?
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.58.4
  kind: p
  original: ''
  en: Can this be a relic of religious metaphysics?
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.58.5
  kind: p
  original: ''
  en: The rich man's feast is indeed a matter of luxury, but the food of the worker is just as much a part of production as the fuel burnt by the steam-engine.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.59.1
  kind: p
  original: ''
  en: The same with clothing.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.59.2
  kind: p
  original: ''
  en: We are not New Guinea savages.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.59.3
  kind: p
  original: ''
  en: And if the dainty gowns of our ladies must rank as objects of luxury, there is nevertheless a certain quantity of linen, cotton, and woolen stuff which is a necessity of life to the producer.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.59.4
  kind: p
  original: ''
  en: The shirt and trousers in which he goes to his work, the jacket he slips on after the day's toil is over, are as necessary to him as the hammer to the anvil.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.60.1
  kind: p
  original: ''
  en: Whether we like it or not, this is what the people mean by a revolution.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.60.2
  kind: p
  original: ''
  en: As soon as they have made a clean sweep of the Government, they will seek first of all to ensure to themselves decent dwellings and sufficient food and clothes--free of capitalist rent.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.61.1
  kind: p
  original: ''
  en: And the people will be right.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.61.2
  kind: p
  original: ''
  en: The methods of the people will be much more in accordance with science than those of the economists who draw so many distinctions between instruments of production and articles of consumption.
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.61.3
  kind: p
  original: ''
  en: 'The people understand that this is just the point where the Revolution ought to begin; and they will lay the foundations of the only economic science worthy the name--a science which might be called: "The Study of the Needs of Humanity, and of the Economic Means to satisfy them."'
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.N2.1.1
  kind: note
  original: ''
  en: '"Shabble of a Duke" is an expression coined by Carlyle; it is a somewhat free rendering of Kropotkine''s "Monsieur le Vicomte," but I think it expresses his meaning.--Trans.'
  modern: ''
  modern_status: empty
  notes: ''
