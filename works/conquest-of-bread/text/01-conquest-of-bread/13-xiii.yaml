section: XIII
title_original: Chapter XIII. The Collectivist Wages System
title_en: Chapter XIII. The Collectivist Wages System
author: Peter Kropotkin
date: 1892 (French); English 1906
original_language: fr
anchor_language: en
source_original: Not yet in this repository. Kropotkin's French, La Conquête du pain (Paris 1892), is still to be located on a reachable mirror.
source_en: 'Anonymous English translation (London: Chapman and Hall, 1906) with Kropotkin''s preface of 1913, Vanguard Press printing (New York 1926), Project Gutenberg ebook 23428 (public domain)'
verses:
- id: XIII.0.1
  kind: heading
  original: ''
  en: Chapter XIII. The Collectivist Wages System
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.1.1
  kind: heading
  original: ''
  en: I
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.2.1
  kind: p
  original: ''
  en: In their plans for the reconstruction of society the collectivists commit, in our opinion, a twofold error.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.2.2
  kind: p
  original: ''
  en: While speaking of abolishing capitalist rule, they intend nevertheless to retain two institutions which are the very basis of this rule--Representative Government and the Wages' System.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.3.1
  kind: p
  original: ''
  en: As regards so-called representative government, we have often spoken about it.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.3.2
  kind: p
  original: ''
  en: It is absolutely incomprehensible to us that intelligent men--and such are not wanting in the collectivist party--can remain partisans of national or municipal parliaments after all the lessons history has given them--in France, in England, in Germany, or in the United States.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.4.1
  kind: p
  original: ''
  en: While we see parliamentary rule breaking up, and from all sides criticism of this rule growing louder--not only of its results, but also of its principles--how is it that the revolutionary socialists defend a system already condemned to die?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.5.1
  kind: p
  original: ''
  en: Built up by the middle classes to hold their own against royalty, sanctioning, and, at the same time strengthening, their sway over the workers, parliamentary rule is pre-eminently a middle-class rule.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.5.2
  kind: p
  original: ''
  en: The upholders of this system have never seriously maintained that a parliament or a municipal council represent a nation or a city.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.5.3
  kind: p
  original: ''
  en: The most intelligent among them know that this is impossible.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.5.4
  kind: p
  original: ''
  en: The middle classes have simply used the parliamentary system to raise a protecting barrier against the pretensions of royalty, without giving the people liberty.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.5.5
  kind: p
  original: ''
  en: But gradually, as the people become conscious of their real interests, and the variety of their interests is growing, the system can no longer work.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.5.6
  kind: p
  original: ''
  en: Therefore democrats of all countries vainly imagine various palliatives.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.5.7
  kind: p
  original: ''
  en: The Referendum is tried and found to be a failure; proportional representation is spoken of, the representation of minorities, and other parliamentary Utopias.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.5.8
  kind: p
  original: ''
  en: In a word, they strive to find what is not to be found, and after each new experiment they are bound to recognize that it was a failure; so that confidence in Representative Government vanishes more and more.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.6.1
  kind: p
  original: ''
  en: It is the same with the Wages' system; because, once the abolition of private property is proclaimed, and the possession in common of all means of production is introduced,--how can the wages' system be maintained in any form?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.6.2
  kind: p
  original: ''
  en: This is, nevertheless, what collectivists are doing when they recommend the use of the labour-cheques as a mode of remuneration for labour accomplished for the great Collectivist employer--the State.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.7.1
  kind: p
  original: ''
  en: It is easy to understand why the early English socialists, since the time of Robert Owen, came to the system of labour-cheques.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.7.2
  kind: p
  original: ''
  en: They simply tried to make Capital and Labour agree.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.7.3
  kind: p
  original: ''
  en: They repudiated the idea of laying hands on capitalist property by means of revolutionary measures.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.8.1
  kind: p
  original: ''
  en: It is also easy to understand why Proudhon took up later on the same idea.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.8.2
  kind: p
  original: ''
  en: In his Mutualist system he tried to make Capital less offensive, notwithstanding the retaining of private property, which he detested from the bottom of his heart, but which he believed to be necessary to guarantee individuals against the State.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.9.1
  kind: p
  original: ''
  en: Neither is it astonishing that certain economists, more or less bourgeois, admit labour-cheques.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.9.2
  kind: p
  original: ''
  en: They care little whether the worker is paid in labour-notes or in coin stamped with the effigy of the Republic or the Empire.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.9.3
  kind: p
  original: ''
  en: They only care to save from destruction the individual ownership of dwelling-houses, of land, of factories; in any case--that, at least, of dwelling-houses and the capital that is necessary for manufacturing.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.9.4
  kind: p
  original: ''
  en: And labour-notes would just answer the purpose of upholding this private property.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.10.1
  kind: p
  original: ''
  en: As long as labour-notes can be exchanged for jewels or carriages, the owner of the house will willingly accept them for rent.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.10.2
  kind: p
  original: ''
  en: And as long as dwelling houses, fields, and factories belong to isolated owners, men will have to pay these owners, in one way or another, for being allowed to work in the fields or factories, or for living in the houses.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.10.3
  kind: p
  original: ''
  en: The owners will agree to be paid by the workers in gold, in paper-money, or in cheques exchangeable for all sorts of commodities, once that toll upon labour is maintained, and the right to levy it is left with them.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.10.4
  kind: p
  original: ''
  en: But how can we defend labour-notes, this new form of wagedom, when we admit that the houses, the fields, and the factories will no longer be private property,--that they will belong to the commune or the nation?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.11.1
  kind: heading
  original: ''
  en: II
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.12.1
  kind: p
  original: ''
  en: Let us closely examine this system of remuneration for work done, preached by the French, German, English, and Italian collectivists (the Spanish anarchists, who still call themselves collectivists, imply by Collectivism the possession in common of all instruments of production, and the "liberty of each group to divide the produce, as they think fit, according to communist or any other principles").
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.13.1
  kind: p
  original: ''
  en: 'It amounts to this: Everybody works in field, factory, school, hospital, etc. The working-day is fixed by the State, which owns the land, the factories, the roads, etc. Every work-day is paid for with a labour-note, which is inscribed with these words: Eight hours'' work.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.13.2
  kind: p
  original: ''
  en: With this cheque the worker can procure all sorts of merchandise in the stores owned by the State or by divers corporations.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.13.3
  kind: p
  original: ''
  en: The cheque is divisible, so that you can buy an hour's-work worth of meat, ten minutes' worth of matches, or half an hour of tobacco.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.13.4
  kind: p
  original: ''
  en: After the Collectivist Revolution, instead of saying "twopence worth of soap," we shall say "five minutes' worth of soap."
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.14.1
  kind: p
  original: ''
  en: Most collectivists, true to the distinction laid down by middle-class economists (and by Marx as well) between qualified work and simple work, tell us, moreover, that qualified or professional work must be paid a certain quantity more than simple work.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.14.2
  kind: p
  original: ''
  en: Thus one hour's work of a doctor will have to be considered as equivalent to two or three hours' work of a hospital nurse, or to three or five hours' work of a navvy.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.14.3
  kind: p
  original: ''
  en: '"Professional, or qualified work, will be a multiple of simple work," says the collectivist Grönlund, "because this kind of work needs a more or less long apprenticeship."'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.15.1
  kind: p
  original: ''
  en: Some other collectivists, such as the French Marxist, Guesde, do not make this distinction.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.15.2
  kind: p
  original: ''
  en: They proclaim the "Equality of Wages."
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.15.3
  kind: p
  original: ''
  en: The doctor, the schoolmaster, and the professor will be paid (in labour-cheques) at the same rate as the navvy.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.15.4
  kind: p
  original: ''
  en: Eight hours visiting the sick in a hospital will be worth the same as eight hours spent in earthworks or else in mines or factories.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.16.1
  kind: p
  original: ''
  en: Some make a greater concession; they admit that disagreeable or unhealthy work--such as sewerage--could be paid for at a higher rate than agreeable work.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.16.2
  kind: p
  original: ''
  en: One hour's work of a sewerman would be worth, they say, two hours of a professor's work.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.17.1
  kind: p
  original: ''
  en: Let us add that certain collectivists admit of corporations being paid a lump sum for work done.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.17.2
  kind: p
  original: ''
  en: 'Thus a corporation would say: "Here are a hundred tons of steel.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.17.3
  kind: p
  original: ''
  en: A hundred workmen were required to produce them, and it took them ten days.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.17.4
  kind: p
  original: ''
  en: Their work-day being an eight-hours day, it has taken them eight thousand working hours to produce a hundred tons of steel--eight hours a ton."
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.17.5
  kind: p
  original: ''
  en: For this the State would pay them eight thousand labour-notes of one hour each, and these eight thousand cheques would be divided among the members of the iron-works as they themselves thought proper.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.18.1
  kind: p
  original: ''
  en: On the other hand, a hundred miners having taken twenty days to extract eight thousand tons of coal, coal would be worth two hours a ton, and the sixteen thousand cheques of one hour each, received by the Guild of Miners, would be divided among their members according to their own appreciation.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.19.1
  kind: p
  original: ''
  en: If the miners protested and said that a ton of steel should only cost six hours' work instead of eight; if the professor wished to have his day paid four times more than the nurse, then the State would interfere and would settle their differences.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.20.1
  kind: p
  original: ''
  en: Such is, in a few words, the organization the collectivists wish to see arise out of the Social Revolution.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.20.2
  kind: p
  original: ''
  en: 'As we see, their principles are: Collective property of the instruments of production, and remuneration to each according to the time spent in producing, while taking into account the productivity of his labour.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.20.3
  kind: p
  original: ''
  en: As to the political system, it would be the Parliamentary system, modified by positive instructions given to those elected, and by the Referendum--a vote, taken by noes or ayes by the nation.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.21.1
  kind: p
  original: ''
  en: Let us own that this system appears to us simply unrealizable.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.22.1
  kind: p
  original: ''
  en: Collectivists begin by proclaiming a revolutionary principle--the abolition of private property--and then they deny it, no sooner than proclaimed, by upholding an organization of production and consumption which originated in private property.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.23.1
  kind: p
  original: ''
  en: They proclaim a revolutionary principle, and ignore the consequences that this principle will inevitably bring about.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.23.2
  kind: p
  original: ''
  en: They forget that the very fact of abolishing individual property in the instruments of work--land, factories, road, capital--must launch society into absolutely new channels; must completely overthrow the present system of production, both in its aim as well as in its means; must modify daily relations between individuals, as soon as land, machinery, and all other instruments of production are considered common property.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.24.1
  kind: p
  original: ''
  en: They say, "No private property," and immediately after strive to maintain private property in its daily manifestations.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.24.2
  kind: p
  original: ''
  en: '"You shall be a Commune as far as regards production: fields, tools, machinery, all that has been invented up till now--factories, railways, harbours, mines, etc., all are yours.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.24.3
  kind: p
  original: ''
  en: Not the slightest distinction will be made concerning the share of each in this collective property.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.25.1
  kind: p
  original: ''
  en: '"But from to-morrow you will minutely debate the share you are going to take in the creation of new machinery, in the digging of new mines.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.25.2
  kind: p
  original: ''
  en: You will carefully weigh what part of the new produce belongs to you.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.25.3
  kind: p
  original: ''
  en: You will count your minutes of work, and you will take care that a minute of your neighbours should not buy more than yours.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.26.1
  kind: p
  original: ''
  en: '"And as an hour measures nothing, as in some factories a worker can see to six power-looms at a time, while in another he only tends two, you will weigh the muscular force, the brain energy, and the nervous energy you have expended.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.26.2
  kind: p
  original: ''
  en: You will accurately calculate the years of apprenticeship in order to appraise the amount each will contribute to future production.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.26.3
  kind: p
  original: ''
  en: And this--after having declared that you do not take into account his share in past production."
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.27.1
  kind: p
  original: ''
  en: Well, for us it is evident that a society cannot be based on two absolutely opposed principles, two principles that contradict one another continually.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.27.2
  kind: p
  original: ''
  en: And a nation or a commune which would have such an organization would be compelled to revert to private property in the instruments of production, or to transform itself into a communist society.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.28.1
  kind: heading
  original: ''
  en: III
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.29.1
  kind: p
  original: ''
  en: We have said that certain collectivist writers desire that a distinction should be made between qualified or professional work and simple work.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.29.2
  kind: p
  original: ''
  en: They pretend that an hour's work of an engineer, an architect, or a doctor, must be considered as two or three hours' work of a blacksmith, a mason, or a hospital nurse.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.29.3
  kind: p
  original: ''
  en: And the same distinction must be made between all sorts of trades necessitating apprenticeship, and the simple toil of day labourers.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.30.1
  kind: p
  original: ''
  en: Well, to establish this distinction would be to maintain all the inequalities of present society.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.30.2
  kind: p
  original: ''
  en: It would mean fixing a dividing line, from the beginning, between the workers and those who pretend to govern them.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.30.3
  kind: p
  original: ''
  en: It would mean dividing society into two very distinct classes--the aristocracy of knowledge placed above the horny-handed lower orders--the one doomed to serve the other; the one working with its hands to feed and clothe those who, profiting by their leisure, study how to govern their fosterers.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.31.1
  kind: p
  original: ''
  en: It would mean reviving one of the distinct peculiarities of present society and giving it the sanction of the Social Revolution.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.31.2
  kind: p
  original: ''
  en: It would mean setting up as a principle an abuse already condemned in our ancient crumbling society.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.32.1
  kind: p
  original: ''
  en: We know the answer we shall get.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.32.2
  kind: p
  original: ''
  en: They will speak of "Scientific Socialism"; they will quote bourgeois economists, and Marx too, to prove that a scale of wages has its raison d'être, as "the labour force" of the engineer will have cost more to society than the "labour-force" of the navvy.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.32.3
  kind: p
  original: ''
  en: In fact--have not economists tried to prove to us that if an engineer is paid twenty times more than a navvy it is because the "necessary" outlay to make an engineer is greater than that necessary to make a navvy?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.32.4
  kind: p
  original: ''
  en: And has not Marx asserted that the same distinction is equally logical between two branches of manual labour?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.32.5
  kind: p
  original: ''
  en: He could not conclude otherwise, having taken up on his own account Ricardo's theory of value, and upheld that goods are exchanged in proportion to the quantity of work socially necessary for their production.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.33.1
  kind: p
  original: ''
  en: But we know what to think of this.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.33.2
  kind: p
  original: ''
  en: We know that if engineers, scientists, or doctors are paid ten or a hundred times more than a labourer, and if a weaver earns three times more than an agricultural labourer, and ten times more than a girl in a match factory, it is not by reason of their "cost of production," but by reason of a monopoly of education, or a monopoly of industry.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.33.3
  kind: p
  original: ''
  en: Engineers, scientists, and doctors merely exploit their capital--their diplomas--as middle-class employers exploit a factory, or as nobles used to exploit their titles of nobility.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.34.1
  kind: p
  original: ''
  en: As to the employer who pays an engineer twenty times more than a labourer, it is simply due to personal interest; if the engineer can economize £4,000 a year on the cost of production, the employer pays him £800.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.34.2
  kind: p
  original: ''
  en: And if the employer has a foreman who saves £400 on the work by cleverly sweating workmen, he gladly gives him £80 or £120 a year.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.34.3
  kind: p
  original: ''
  en: He parts with an extra £40 when he expects to gain £400 by it; and this is the essence of the Capitalist system.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.34.4
  kind: p
  original: ''
  en: The same differences obtain among different manual trades.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.35.1
  kind: p
  original: ''
  en: Let them, therefore, not talk to us of "the cost of production" which raises the cost of skilled labour, and tell us that a student who has gaily spent his youth in a university has a right to a wage ten times greater than the son of a miner who has grown pale in a mine since the age of eleven; or that a weaver has a right to a wage three or four times greater than that of an agricultural labourer.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.35.2
  kind: p
  original: ''
  en: The cost of teaching a weaver his work is not four times greater than the cost of teaching a peasant his.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.35.3
  kind: p
  original: ''
  en: The weaver simply benefits by the advantages his industry reaps in international trade, from countries that have as yet no industries, and in consequence of the privileges accorded by all States to industries in preference to the tilling of the soil.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.36.1
  kind: p
  original: ''
  en: Nobody has ever calculated the cost of production of a producer; and if a noble loafer costs far more to society than a worker, it remains to be seen whether a robust day-labourer does not cost more to society than a skilled artisan, when we have taken into account infant-mortality among the poor, the ravages of anæmia, and premature deaths.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.37.1
  kind: p
  original: ''
  en: Could they, for example, make us believe that the 1s. 3d. paid to a Paris workwoman, the 3d. paid to an Auvergne peasant girl who grows blind at lace-making, or the 1s. 8d. paid to the peasant represent their "cost of production."
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.37.2
  kind: p
  original: ''
  en: We know full well that people work for less, but we also know that they do so exclusively because, thanks to our wonderful organization, they would die of hunger did they not accept these mock wages.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.38.1
  kind: p
  original: ''
  en: For us the scale of remuneration is a complex result of taxes, of governmental tutelage, of Capitalist monopoly.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.38.2
  kind: p
  original: ''
  en: In a word, of State and Capital.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.38.3
  kind: p
  original: ''
  en: Therefore, we say that all wages' theories have been invented after the event to justify injustices at present existing, and that we need not take them into consideration.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.39.1
  kind: p
  original: ''
  en: Neither will they fail to tell us that the Collectivist scale of wages would be an improvement.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.39.2
  kind: p
  original: ''
  en: '"It would be better," so they say, "to see certain artisans receiving a wage two or three times higher than common labourers, than to see a minister receiving in a day what a workman cannot earn in a year.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.39.3
  kind: p
  original: ''
  en: It would be a great step towards equality."
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.40.1
  kind: p
  original: ''
  en: For us this step would be the reverse of progress.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.40.2
  kind: p
  original: ''
  en: To make a distinction between simple and professional work in a new society would result in the Revolution sanctioning and recognizing as a principle a brutal fact we submit to nowadays, but that we nevertheless find unjust.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.40.3
  kind: p
  original: ''
  en: It would mean imitating those gentlemen of the French Assembly who proclaimed on August 4th, 1789, the abolition of feudal rights, but who on August 8th sanctioned these same rights by imposing dues on the peasants to compensate the noblemen, placing these dues under the protection of the Revolution.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.40.4
  kind: p
  original: ''
  en: It would mean imitating the Russian Government, which proclaimed, at the time of the emancipation of the serfs, that certain lands should henceforth belong to the nobility, while formerly these lands were considered as belonging to the serfs.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.41.1
  kind: p
  original: ''
  en: Or else, to take a better known example, when the Commune of 1871 decided to pay members of the Commune Council 12s. 6d. a day, while the Federates on the ramparts received only 1s. 3d., this decision was hailed as an act of superior democratic equality.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.41.2
  kind: p
  original: ''
  en: In reality, the Commune only ratified the former inequality between functionary and soldier, Government and governed.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.41.3
  kind: p
  original: ''
  en: Coming from an Opportunist Chamber of Deputies, such a decision would have appeared admirable, but the Commune doomed her own revolutionary principles when she failed to put them into practice.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.42.1
  kind: p
  original: ''
  en: Under our existing social system, when a minister gets paid £4,000 a year, while a workman must content himself with £40 or less; when a foreman is paid two or three times more than a workman, and among workmen there is every gradation, from 8s. a day down to the peasant girl's 3d., we disapprove of the high salary of the minister as well as of the difference between the 8s. of the workman and the 3d. of the poor woman.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.42.2
  kind: p
  original: ''
  en: And we say, '"Down with the privileges of education, as well as with those of birth!"
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.42.3
  kind: p
  original: ''
  en: We are anarchists precisely because these privileges revolt us.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.43.1
  kind: p
  original: ''
  en: They revolt us already in this authoritarian society.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.43.2
  kind: p
  original: ''
  en: Could we endure them in a society that began by proclaiming equality?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.44.1
  kind: p
  original: ''
  en: This is why some collectivists, understanding the impossibility of maintaining a scale of wages in a society inspired by the breath of the Revolution, hasten to proclaim equality of wage.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.44.2
  kind: p
  original: ''
  en: But they meet with new difficulties, and their equality of wages becomes the same unrealizable Utopia as the scale of wages of other collectivists.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.45.1
  kind: p
  original: ''
  en: A society having taken possession of all social wealth, having boldly proclaimed the right of all to this wealth--whatever share they may have taken in producing it--will be compelled to abandon any system of wages, whether in currency or labour-notes.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.46.1
  kind: heading
  original: ''
  en: IV
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.47.1
  kind: p
  original: ''
  en: The collectivists say, "To each according to his deeds"; or, in other terms, according to his share of services rendered to society.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.47.2
  kind: p
  original: ''
  en: They think it expedient to put this principle into practice, as soon as the Social Revolution will have made all instruments of production common property.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.47.3
  kind: p
  original: ''
  en: But we think that if the Social Revolution had the misfortune of proclaiming such a principle, it would mean its necessary failure; it would mean leaving the social problem, which past centuries have burdened us with, unsolved.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.48.1
  kind: p
  original: ''
  en: Of course, in a society like ours, in which the more a man works the less he is remunerated, this principle, at first sight, may appear to be a yearning for justice.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.48.2
  kind: p
  original: ''
  en: But in reality it is only the perpetuation of injustice.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.48.3
  kind: p
  original: ''
  en: It was by proclaiming this principle that wagedom began, to end in the glaring inequalities and all the abominations of present society; because, from the moment work done began to be appraised in currency, or in any other form of wage, the day it was agreed upon that man would only receive the wage he should be able to secure to himself, the whole history of a State-aided Capitalist Society was as good as written; it was contained in germ in this principle.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.49.1
  kind: p
  original: ''
  en: Shall we, then, return to our starting-point, and go through the same evolution again?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.49.2
  kind: p
  original: ''
  en: Our theorists desire it, but fortunately it is impossible.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.49.3
  kind: p
  original: ''
  en: The Revolution, we maintain, must be communist; if not, it will be drowned in blood, and have to be begun over again.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.50.1
  kind: p
  original: ''
  en: Services rendered to society, be they work in factory or field, or mental services, cannot be valued in money.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.50.2
  kind: p
  original: ''
  en: There can be no exact measure of value (of what has been wrongly termed exchange value), nor of use value, in terms of production.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.50.3
  kind: p
  original: ''
  en: If two individuals work for the community five hours a day, year in year out, at different work which is equally agreeable to them, we may say that on the whole their labour is approximately equivalent.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.50.4
  kind: p
  original: ''
  en: But we cannot divide their work, and say that the result of any particular day, hour, or minute of work of the one is worth the result of one day, one hour, or one minute of the other.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.51.1
  kind: p
  original: ''
  en: We may roughly say that the man, who during his lifetime has deprived himself of leisure during ten hours a day has given far more to society than the one who has only deprived himself of leisure during five hours a day, or who has not deprived himself at all.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.51.2
  kind: p
  original: ''
  en: But we cannot take what he has done during two hours, and say that the yield of his two hours' work is worth twice as much as the yield of another individual, who has worked only one hour, and remunerate the two in proportion.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.51.3
  kind: p
  original: ''
  en: It would be disregarding all that is complex in industry, in agriculture, in the whole life of present society; it would be ignoring to what extent all individual work is the result of the past and the present labour of society as a whole.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.51.4
  kind: p
  original: ''
  en: It would mean believing ourselves to be living in the Stone Age, whereas we are living in an age of steel.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.52.1
  kind: p
  original: ''
  en: If you enter a modern coal-mine you will see a man in charge of a huge machine that raises and lowers a cage.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.52.2
  kind: p
  original: ''
  en: In his hand he holds a lever that stops and reverses the course of the machine; he lowers it and the cage reverses its course in the twinkling of an eye; he sends it upwards or downwards into the depths of the shaft with a giddy swiftness.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.52.3
  kind: p
  original: ''
  en: All attention, he follows with his eyes fixed on an indicator which shows him, on a small scale, at which point of the shaft the cage is at each second of its progress; and as soon as the indicator has reached a certain level, he suddenly stops the course of the cage, not a yard higher nor lower than the required spot.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.52.4
  kind: p
  original: ''
  en: And no sooner have the colliers unloaded their coal-wagonettes, and pushed empty ones instead, than he reverses the lever and again sends the cage back into space.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.53.1
  kind: p
  original: ''
  en: During eight or ten consecutive hours every day he must keep the same strain of attention.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.53.2
  kind: p
  original: ''
  en: Should his brain relax for a moment, the cage would inevitably strike against the gear, break its wheels, snap the rope, crush men, and put a stop to all work in the mine.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.53.3
  kind: p
  original: ''
  en: Should he waste three seconds at each touch of the lever,--the extraction, in our modern, perfected mines, would be reduced from twenty to fifty tons a day.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.54.1
  kind: p
  original: ''
  en: Is it he who is the most necessary man in the mine?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.54.2
  kind: p
  original: ''
  en: Or, is it perhaps the boy who signals to him from below to raise the cage?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.54.3
  kind: p
  original: ''
  en: Is it the miner at the bottom of the shaft, who risks his life every instant, and who will some day be killed by fire-damp?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.54.4
  kind: p
  original: ''
  en: Or is it the engineer, who would lose the layer of coal, and would cause the miners to dig on rock by a simple mistake in his calculations?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.54.5
  kind: p
  original: ''
  en: Or is it the mine owner who has put his capital into the mine, and who has perhaps, contrary to expert advice, asserted that excellent coal would be found there?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.55.1
  kind: p
  original: ''
  en: All those who are engaged in the mine contribute to the extraction of coal in proportion to their strength, their energy, their knowledge, their intelligence, and their skill.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.55.2
  kind: p
  original: ''
  en: And we may say that all have the right to live, to satisfy their needs, and even their whims, when the necessaries of life have been secured for all.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.55.3
  kind: p
  original: ''
  en: But how can we appraise the work of each one of them?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.56.1
  kind: p
  original: ''
  en: And, moreover, Is the coal they have extracted entirely their work?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.56.2
  kind: p
  original: ''
  en: Is it not also the work of the men who have built the railway leading to the mine and the roads that radiate from all the railway stations?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.56.3
  kind: p
  original: ''
  en: Is it not also the work of those that have tilled and sown the fields, extracted iron, cut wood in the forests, built the machines that burn coal, slowly developed the mining industry altogether, and so on?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.57.1
  kind: p
  original: ''
  en: It is utterly impossible to draw a distinction between the work of each of those men.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.57.2
  kind: p
  original: ''
  en: To measure the work by its results leads us to an absurdity; to divide the total work, and to measure its fractions by the number of hours spent on the work also leads us to absurdity.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.57.3
  kind: p
  original: ''
  en: 'One thing remains: to put the needs above the works, and first of all to recognize the right to live, and later on the right to well-being for all those who took their share in production.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.58.1
  kind: p
  original: ''
  en: But take any other branch of human activity--take the manifestations of life as a whole.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.58.2
  kind: p
  original: ''
  en: Which one of us can claim the higher remuneration for his work?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.58.3
  kind: p
  original: ''
  en: Is it the doctor who has found out the illness, or the nurse who has brought about recovery by her hygienic care?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.58.4
  kind: p
  original: ''
  en: Is it the inventor of the first steam-engine, or the boy, who, one day getting tired of pulling the rope that formerly opened the valve to let steam under the piston, tied the rope to the lever of the machine, without suspecting that he had invented the essential mechanical part of all modern machinery--the automatic valve?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.59.1
  kind: p
  original: ''
  en: Is it the inventor of the locomotive, or the workman of Newcastle, who suggested replacing the stones formerly laid under the rails by wooden sleepers, as the stones, for want of elasticity, caused the trains to derail?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.59.2
  kind: p
  original: ''
  en: Is it the engineer on the locomotive?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.59.3
  kind: p
  original: ''
  en: The signalman who stops the trains, or lets them pass by?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.59.4
  kind: p
  original: ''
  en: The switchman who transfers a train from one line to another?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.60.1
  kind: p
  original: ''
  en: Again, to whom do we owe the transatlantic cable?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.60.2
  kind: p
  original: ''
  en: Is it to the electrical engineer who obstinately affirmed that the cable would transmit messages while learned men of science declared it to be impossible?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.60.3
  kind: p
  original: ''
  en: Is it to Maury, the learned physical geographer, who advised that thick cables should be set aside for others as thin as a walking cane?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.60.4
  kind: p
  original: ''
  en: Or else to those volunteers, come from nobody knows where, who spent their days and nights on deck minutely examining every yard of the cable, and removed the nails that the shareholders of steamship companies stupidly caused to be driven into the non-conducting wrapper of the cable, so as to make it unserviceable?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.61.1
  kind: p
  original: ''
  en: And in a wider sphere, the true sphere of life, with its joys, its sufferings, and its accidents, cannot each one of us recall someone who has rendered him so great a service that we should be indignant if its equivalent in coin were mentioned?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.61.2
  kind: p
  original: ''
  en: The service may have been but a word, nothing but a word spoken at the right time, or else it may have been months and years of devotion, and we are going to appraise these "incalculable" services in "labour-notes"?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.62.1
  kind: p
  original: ''
  en: '"The works of each!"'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.62.2
  kind: p
  original: ''
  en: But human society would not exist for more than two consecutive generations if everyone did not give infinitely more than that for which he is paid in coin, in "cheques," or in civic rewards.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.62.3
  kind: p
  original: ''
  en: The race would soon become extinct if mothers did not sacrifice their lives to take care of their children, if men did not give continually, without demanding an equivalent reward, if men did not give most precisely when they expect no reward.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.63.1
  kind: p
  original: ''
  en: If middle-class society is decaying, if we have got into a blind alley from which we cannot emerge without attacking past institutions with torch and hatchet, it is precisely because we have given too much to counting.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.63.2
  kind: p
  original: ''
  en: It is because we have let ourselves be influenced into giving only to receive.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.63.3
  kind: p
  original: ''
  en: It is because we have aimed at turning society into a commercial company based on debit and credit.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.64.1
  kind: p
  original: ''
  en: After all, the Collectivists know this themselves.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.64.2
  kind: p
  original: ''
  en: They vaguely understand that a society could not exist if it carried out the principle of "Each according to his deeds."
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.64.3
  kind: p
  original: ''
  en: They have a notion that necessaries--we do not speak of whims--the needs of the individual, do not always correspond to his works.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.64.4
  kind: p
  original: ''
  en: 'Thus De Paepe tells us: "The principle--the eminently Individualist principle--would, however, be tempered by social intervention for the education of children and young persons (including maintenance and lodging), and by the social organization for assisting the infirm and the sick, for retreats for aged workers, etc."'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.64.5
  kind: p
  original: ''
  en: They understand that a man of forty, father of three children, has other needs than a young man of twenty.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.64.6
  kind: p
  original: ''
  en: They know that the woman who suckles her infant and spends sleepless nights at its bedside, cannot do as much work as the man who has slept peacefully.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.64.7
  kind: p
  original: ''
  en: They seem to take in that men and women, worn out maybe by dint of overwork for society, may be incapable of doing as much work as those who have spent their time leisurely and pocketed their "labour-notes" in the privileged career of State functionaries.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.65.1
  kind: p
  original: ''
  en: They are eager to temper their principle.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.65.2
  kind: p
  original: ''
  en: 'They say: "Society will not fail to maintain and bring up its children; to help both aged and infirm.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.65.3
  kind: p
  original: ''
  en: Without doubt needs will be the measure of the cost that society will burden itself with, to temper the principle of deeds."
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.66.1
  kind: p
  original: ''
  en: Charity, charity, always Christian charity, organized by the State this time.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.66.2
  kind: p
  original: ''
  en: They believe in improving the asylums for foundlings, in effecting old-age and sick insurances--so as to temper their principle.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.66.3
  kind: p
  original: ''
  en: But they cannot yet throw aside the idea of "wounding first and healing afterwards"!
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.67.1
  kind: p
  original: ''
  en: Thus, after having denied Communism, after having laughed at their ease at the formula--"To each according to his needs"--these great economists discover that they have forgotten something, the needs of the producers, which they now admit.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.67.2
  kind: p
  original: ''
  en: Only it is for the State to estimate them, for the State to verify if the needs are not disproportionate to the work.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.68.1
  kind: p
  original: ''
  en: The State will dole out charity.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.68.2
  kind: p
  original: ''
  en: Thence to the English poor-law and the workhouse is but a step.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.69.1
  kind: p
  original: ''
  en: There is but a slight difference, because even this stepmother of a society against whom we are in revolt has also been compelled to temper her individualist principles; she, too, has had to make concessions in a communist direction and under the same form of charity.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.70.1
  kind: p
  original: ''
  en: She, too, distributes halfpenny dinners to prevent the pillaging of her shops; builds hospitals--often very bad ones, but sometimes splendid ones--to prevent the ravages of contagious diseases.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.70.2
  kind: p
  original: ''
  en: She, too, after having paid the hours of labour, shelters the children of those she has wrecked.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.70.3
  kind: p
  original: ''
  en: She takes their needs into consideration and doles out charity.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.71.1
  kind: p
  original: ''
  en: Poverty, we have said elsewhere, was the primary cause of wealth.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.71.2
  kind: p
  original: ''
  en: It was poverty that created the first capitalist; because, before accumulating "surplus value," of which we hear so much, men had to be sufficiently destitute to consent to sell their labour, so as not to die of hunger.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.71.3
  kind: p
  original: ''
  en: It was poverty that made capitalists.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.71.4
  kind: p
  original: ''
  en: And if the number of the poor increased so rapidly during the Middle Ages, it was due to the invasions and wars that followed the founding of States, and to the increase of riches resulting from the exploitation of the East.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.71.5
  kind: p
  original: ''
  en: These two causes tore asunder the bonds that kept men together in the agrarian and urban communities, and taught them to proclaim the principle of wages, so dear to the exploiters, instead of the solidarity they formerly practiced in their tribal life.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.72.1
  kind: p
  original: ''
  en: And it is this principle that is to spring from a revolution which men dare to call by the name of Social Revolution,--a name so dear to the starved, the oppressed, and the sufferers!
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.73.1
  kind: p
  original: ''
  en: It can never be.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.73.2
  kind: p
  original: ''
  en: 'For the day on which old institutions will fall under the proletarian axe, voices will cry out: "Bread, shelter, ease for all!"'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.73.3
  kind: p
  original: ''
  en: 'And those voices will be listened to; the people will say: "Let us begin by allaying our thirst for life, for happiness, for liberty, that we have never quenched.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.73.4
  kind: p
  original: ''
  en: 'And when we shall have tasted of this joy, we will set to work to demolish the last vestiges of middle-class rule: its morality drawn from account books, its ''debit and credit'' philosophy, its ''mine and yours'' institutions.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIII.73.5
  kind: p
  original: ''
  en: '''In demolishing we shall build,'' as Proudhon said; and we shall build in the name of Communism and Anarchy."'
  modern: ''
  modern_status: empty
  notes: ''
