# Master file. Edit the `modern` and `notes` fields; see CONTRIBUTING.md.
# Verse ids are frozen. Never renumber; see VERSIFICATION.md.
section: XIV
title_original: Chapter XIV. Consumption and Production
title_en: Chapter XIV. Consumption and Production
author: Peter Kropotkin
date: 1892 (French); English 1906
original_language: fr
anchor_language: en
source_original: Not yet in this repository. Kropotkin's French, La Conquête du pain (Paris 1892), is still to be located on a reachable mirror.
source_en: 'Anonymous English translation (London: Chapman and Hall, 1906) with Kropotkin''s preface of 1913, Vanguard Press printing (New York 1926), Project Gutenberg ebook 23428 (public domain)'
verses:
- id: XIV.0.1
  kind: heading
  original: ''
  en: Chapter XIV. Consumption and Production
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.1.1
  kind: heading
  original: ''
  en: I
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.2.1
  kind: p
  original: ''
  en: Looking at society and its political organization from a different standpoint than that of all the authoritarian schools--for we start from a free individual to reach a free society, instead of beginning by the State to come down to the individual--we follow the same method in economic questions.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.2.2
  kind: p
  original: ''
  en: We study the needs of the individuals, and the means by which they satisfy them, before discussing Production, Exchange, Taxation, Government, and so on.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.2.3
  kind: p
  original: ''
  en: At first sight the difference may appear trifling, but in reality it upsets all the canons of official Political Economy.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.3.1
  kind: p
  original: ''
  en: 'If you open the works of any economist you will find that he begins with PRODUCTION, i. e., by the analysis of the means employed nowadays for the creation of wealth: division of labour, the factory, its machinery, the accumulation of capital.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.3.2
  kind: p
  original: ''
  en: From Adam Smith to Marx, all have proceeded along these lines.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.3.3
  kind: p
  original: ''
  en: Only in the latter parts of their books do they treat of CONSUMPTION, that is to say, of the means resorted to in our present Society to satisfy the needs of the individuals; and even there they confine themselves to explaining how riches are divided among those who vie with one another for their possession.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.4.1
  kind: p
  original: ''
  en: Perhaps you will say this is logical.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.4.2
  kind: p
  original: ''
  en: Before satisfying needs you must create the wherewithal to satisfy them.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.4.3
  kind: p
  original: ''
  en: But, before producing anything, must you not feel the need of it?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.4.4
  kind: p
  original: ''
  en: Was it not necessity that first drove man to hunt, to raise cattle, to cultivate land, to make implements, and later on to invent machinery?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.4.5
  kind: p
  original: ''
  en: Is it not the study of the needs that should govern production?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.4.6
  kind: p
  original: ''
  en: To say the least, it would therefore be quite as logical to begin by considering the needs, and afterwards to discuss how production is, and ought to be, organized, in order to satisfy these needs.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.5.1
  kind: p
  original: ''
  en: This is precisely what we mean to do.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.6.1
  kind: p
  original: ''
  en: But as soon as we look at Political Economy from this point of view, it entirely changes its aspect.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.6.2
  kind: p
  original: ''
  en: 'It ceases to be a simple description of facts, and becomes a science, and we may define this science as: "The study of the needs of mankind, and the means of satisfying them with the least possible waste of human energy".'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.6.3
  kind: p
  original: ''
  en: Its true name should be, Physiology of Society.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.6.4
  kind: p
  original: ''
  en: It constitutes a parallel science to the physiology of plants and animals, which is the study of the needs of plants and animals, and of the most advantageous ways of satisfying them.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.6.5
  kind: p
  original: ''
  en: In the series of sociological sciences, the economy of human societies takes the place, occupied in the series of biological sciences by the physiology of organic bodies.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.7.1
  kind: p
  original: ''
  en: We say, here are human beings, united in a society.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.7.2
  kind: p
  original: ''
  en: All of them feel the need of living in healthy houses.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.7.3
  kind: p
  original: ''
  en: The savage's hut no longer satisfies them; they require a more or less comfortable solid shelter.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.7.4
  kind: p
  original: ''
  en: 'The question is, then: whether, taking the present capacity of men for production, every man can have a house of his own? and what is hindering him from having it?'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.8.1
  kind: p
  original: ''
  en: And as soon as we ask this question, we see that every family in Europe could perfectly well have a comfortable house, such as are built in England, in Belgium, or in Pullman City, or else an equivalent set of rooms.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.8.2
  kind: p
  original: ''
  en: A certain number of days' work would suffice to build a pretty little airy house, well fitted up and lighted by electricity.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.9.1
  kind: p
  original: ''
  en: But nine-tenths of Europeans have never possessed a healthy house, because at all times common people have had to work day after day to satisfy the needs of their rulers, and have never had the necessary leisure or money to build, or to have built, the home of their dreams.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.9.2
  kind: p
  original: ''
  en: And they can have no houses, and will inhabit hovels as long as present conditions remain unchanged.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.10.1
  kind: p
  original: ''
  en: It is thus seen that our method is quite contrary to that of the economists, who immortalize the so-called laws of production, and, reckoning up the number of houses built every year, demonstrate by statistics, that as the number of the new-built houses is too small to meet all demands, nine-tenths of Europeans must live in hovels.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.11.1
  kind: p
  original: ''
  en: Let us pass on to food.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.11.2
  kind: p
  original: ''
  en: After having enumerated the benefits accruing from the division of labour, economists tell us the division of labour requires that some men should work at agriculture and others at manufacture.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.11.3
  kind: p
  original: ''
  en: Farmers producing so much, factories so much, exchange being carried on in such a way, they analyze the sale, the profit, the net gain or the surplus value, the wages, the taxes, banking, and so on.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.12.1
  kind: p
  original: ''
  en: 'But after having followed them so far, we are none the wiser, and if we ask them: "How is it that millions of human beings are in want of bread, when every family could grow sufficient wheat to feed ten, twenty, and even a hundred people annually?" they answer us by droning the same anthem--division of labour, wages, surplus value, capital, etc.--arriving at the same conclusion, that production is insufficient to satisfy all needs; a conclusion which, if true, does not answer the question: "Can or cannot man by his labour produce the bread he needs?'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.12.2
  kind: p
  original: ''
  en: And if he cannot, what is it that hinders him?"
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.13.1
  kind: p
  original: ''
  en: Here are 350 million Europeans.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.13.2
  kind: p
  original: ''
  en: They need so much bread, so much meat, wine, milk, eggs, and butter every year.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.13.3
  kind: p
  original: ''
  en: They need so many houses, so much clothing.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.13.4
  kind: p
  original: ''
  en: This is the minimum of their needs.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.13.5
  kind: p
  original: ''
  en: Can they produce all this? and if they can, will sufficient leisure be left them for art, science, and amusement?--in a word, for everything that is not comprised in the category of absolute necessities?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.13.6
  kind: p
  original: ''
  en: If the answer is in the affirmative,--What hinders them going ahead?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.13.7
  kind: p
  original: ''
  en: What must they do to remove the obstacles?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.13.8
  kind: p
  original: ''
  en: Is it time that is needed to achieve such a result?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.13.9
  kind: p
  original: ''
  en: Let them take it!
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.13.10
  kind: p
  original: ''
  en: But let us not lose sight of the aim of production--the satisfaction of the needs of all.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.14.1
  kind: p
  original: ''
  en: If the most imperious needs of man remain unsatisfied now,--What must we do to increase the productivity of our work?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.14.2
  kind: p
  original: ''
  en: But is there no other cause?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.14.3
  kind: p
  original: ''
  en: Might it not be that production, having lost sight of the needs of man, has strayed in an absolutely wrong direction, and that its organization is at fault?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.14.4
  kind: p
  original: ''
  en: And as we can prove that such is the case, let us see how to reorganize production so as to really satisfy all needs.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.15.1
  kind: p
  original: ''
  en: This seems to us the only right way of facing things.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.15.2
  kind: p
  original: ''
  en: The only way that would allow of Political Economy becoming a science--the Science of Social Physiology.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.16.1
  kind: p
  original: ''
  en: It is evident that so long as science treats of production, as it is carried on at present by civilized nations, by Hindoo communes, or by savages, it can hardly state facts otherwise than the economists state them now; that is to say, as a simple descriptive chapter, analogous to the descriptive chapters of Zoology and Botany.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.16.2
  kind: p
  original: ''
  en: But if this chapter were written so as to throw some light on the economy of the energy that is necessary to satisfy human needs, the chapter would gain in precision, as well as in descriptive value.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.16.3
  kind: p
  original: ''
  en: It would clearly show the frightful waste of human energy under the present system, and it would prove that as long as this system exists, the needs of humanity will never be satisfied.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.17.1
  kind: p
  original: ''
  en: The point of view, we see, would be entirely changed.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.17.2
  kind: p
  original: ''
  en: Behind the loom that weaves so many yards of cloth, behind the steel-plate perforator, and behind the safe in which dividends are hoarded, we should see man, the artisan of production, more often than not excluded from the feast he has prepared for others.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.17.3
  kind: p
  original: ''
  en: We should also understand that the standpoint being wrong, the so-called "laws" of value and exchange are but a very false explanation of events, as they happen nowadays; and that things will come to pass very differently when production is organized in such a manner as to meet all needs of society.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.18.1
  kind: heading
  original: ''
  en: II
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.19.1
  kind: p
  original: ''
  en: There is not one single principle of Political Economy that does not change its aspect if you look at it from our point of view.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.20.1
  kind: p
  original: ''
  en: Take, for instance, over-production, a word which every day re-echoes in our ears.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.20.2
  kind: p
  original: ''
  en: Is there a single economist, academician, or candidate for academical honours, who has not supported arguments, proving that economic crises are due to over-production--that at a given moment more cotton, more cloth, more watches are produced than are needed!
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.20.3
  kind: p
  original: ''
  en: Have we not, all of us, thundered against the rapacity of the capitalists who are obstinately bent on producing more than can possibly be consumed!
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.21.1
  kind: p
  original: ''
  en: However, on careful examination all these reasonings prove unsound.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.21.2
  kind: p
  original: ''
  en: In fact, Is there one single commodity among those in universal use which is produced in greater quantity than need be.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.21.3
  kind: p
  original: ''
  en: Examine one by one all commodities sent out by countries exporting on a large scale, and you will see that nearly all are produced in insufficient quantities for the inhabitants of the countries exporting them.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.22.1
  kind: p
  original: ''
  en: It is not a surplus of wheat that the Russian peasant sends to Europe.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.22.2
  kind: p
  original: ''
  en: The most plentiful harvests of wheat and rye in European Russia only yield enough for the population.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.22.3
  kind: p
  original: ''
  en: And as a rule, the peasant deprives himself of what he actually needs when he sells his wheat or rye to pay rent and taxes.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.23.1
  kind: p
  original: ''
  en: It is not a surplus of coal that England sends to the four corners of the globe, because only three-quarters of a ton, per head of population, annually, remains for home domestic consumption, and millions of Englishmen are deprived of fire in the winter, or have only just enough to boil a few vegetables.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.23.2
  kind: p
  original: ''
  en: In fact, setting aside useless luxuries, there is in England, which exports more than any other country, one single commodity in universal use--cottons--whose production is sufficiently great to perhaps exceed the needs of the community.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.23.3
  kind: p
  original: ''
  en: Yet when we look upon the rags that pass for wearing apparel worn by over a third of the inhabitants of the United Kingdom, we are led to ask ourselves whether the cottons exported would not, on the whole, suit the real needs of the population?
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.24.1
  kind: p
  original: ''
  en: As a rule it is not a surplus that is exported, though it may have been so originally.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.24.2
  kind: p
  original: ''
  en: The fable of the barefooted shoemaker is as true of nations as it was formerly of individual artisans.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.24.3
  kind: p
  original: ''
  en: We export the necessary commodities.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.24.4
  kind: p
  original: ''
  en: And we do so, because the workmen cannot buy with their wages what they have produced, and pay besides the rent and interest to the capitalist and the banker.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.25.1
  kind: p
  original: ''
  en: Not only does the ever-growing need of comfort remain unsatisfied, but the strict necessities of life are often wanting.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.25.2
  kind: p
  original: ''
  en: Therefore, "surplus production" does not exist, at least not in the sense given to it by the theorists of Political Economy.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.26.1
  kind: p
  original: ''
  en: 'Taking another point--all economists tell us that there is a well-proved law: "Man produces more than he consumes."'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.26.2
  kind: p
  original: ''
  en: After he has lived on the proceeds of his toil, there remains a surplus.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.26.3
  kind: p
  original: ''
  en: Thus, a family of cultivators produces enough to feed several families, and so forth.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.27.1
  kind: p
  original: ''
  en: For us, this oft-repeated sentence has no sense.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.27.2
  kind: p
  original: ''
  en: If it meant that each generation leaves something to future generations, it would be true; thus, for example, a farmer plants a tree that will live, maybe, for thirty, forty, or a hundred years, and whose fruits will still be gathered by the farmer's grandchildren.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.27.3
  kind: p
  original: ''
  en: Or he clears a few acres of virgin soil, and we say that the heritage of future generations has been increased by that much.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.27.4
  kind: p
  original: ''
  en: Roads, bridges, canals, his house and his furniture are so much wealth bequeathed to succeeding generations.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.28.1
  kind: p
  original: ''
  en: But this is not what is meant.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.28.2
  kind: p
  original: ''
  en: We are told that the cultivator produces more than he need consume.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.28.3
  kind: p
  original: ''
  en: Rather should they say that, the State having always taken from him a large share of his produce for taxes, the priest for tithe, and the landlord for rent, a whole class of men has been created, who formerly consumed what they produced--save what was set aside for unforeseen accidents, or expenses incurred in afforestation, roads, etc.--but who to-day are compelled to live very poorly, from hand to mouth, the remainder having been taken from them by the State, the landlord, the priest, and the usurer.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.29.1
  kind: p
  original: ''
  en: 'Therefore we prefer to say: The agricultural labourer, the industrial worker and so on consume less than they produce,--because they are compelled to sell most of the produce of their labour and to be satisfied with but a small portion of it.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.30.1
  kind: p
  original: ''
  en: Let us also observe that if the needs of the individual are taken as the starting-point of our political economy, we cannot fail to reach Communism, an organization which enables us to satisfy all needs in the most thorough and economical way.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.30.2
  kind: p
  original: ''
  en: While if we start from our present method of production, and aim at gain and surplus value, without asking whether our production corresponds to the satisfaction of needs, we necessarily arrive at Capitalism, or at most at Collectivism--both being but two different forms of the present wages' system.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.31.1
  kind: p
  original: ''
  en: In fact, when we consider the needs of the individual and of society, and the means which man has resorted to in order to satisfy them during his varied phases of development, we see at once the necessity of systematizing our efforts, instead of producing haphazard as we do nowadays.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.31.2
  kind: p
  original: ''
  en: It becomes evident that the appropriation by a few of all riches not consumed, and transmitted from one generation to another, is not in the general interest.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.31.3
  kind: p
  original: ''
  en: And we see as a fact that owing to these methods the needs of three-quarters of society are not satisfied, so that the present waste of human strength in useless things is only the more criminal.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.32.1
  kind: p
  original: ''
  en: 'We discover, moreover, that the most advantageous use of all commodities would be, for each of them, to go, first, for satisfying those needs which are the most pressing: that, in other words, the so-called "value in use" of a commodity does not depend on a simple whim, as has often been affirmed, but on the satisfaction it brings to real needs.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.33.1
  kind: p
  original: ''
  en: Communism--that is to say, an organization which would correspond to a view of Consumption, Production, and Exchange, taken as a whole--therefore becomes the logical consequence of such a comprehension of things--the only one, in our opinion, that is really scientific.
  modern: ''
  modern_status: empty
  notes: ''
- id: XIV.34.1
  kind: p
  original: ''
  en: A society that will satisfy the needs of all, and which will know how to organize production to answer to this aim will also have to make a clean sweep of several prejudices concerning industry, and first of all the theory often preached by economists--The Division of Labour theory--which we are going to discuss in the next chapter.
  modern: ''
  modern_status: empty
  notes: ''
