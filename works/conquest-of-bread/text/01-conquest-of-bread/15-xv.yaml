section: XV
title_original: Chapter XV. The Division of Labour
title_en: Chapter XV. The Division of Labour
author: Peter Kropotkin
date: 1892 (French); English 1906
original_language: fr
anchor_language: en
source_original: Not yet in this repository. Kropotkin's French, La Conquête du pain (Paris 1892), is still to be located on a reachable mirror.
source_en: 'Anonymous English translation (London: Chapman and Hall, 1906) with Kropotkin''s preface of 1913, Vanguard Press printing (New York 1926), Project Gutenberg ebook 23428 (public domain)'
verses:
- id: XV.0.1
  kind: heading
  original: ''
  en: Chapter XV. The Division of Labour
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.1.1
  kind: p
  original: ''
  en: Political Economy has always confined itself to stating facts occurring in society, and justifying them in the interest of the dominant class.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.1.2
  kind: p
  original: ''
  en: Therefore, it pronounces itself in favour of the division of labour in industry.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.1.3
  kind: p
  original: ''
  en: Having found it profitable to capitalists, it has set it up as a principle.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.2.1
  kind: p
  original: ''
  en: Look at the village smith, said Adam Smith, the father of modern Political Economy.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.2.2
  kind: p
  original: ''
  en: If he has never been accustomed to making nails he will only succeed by hard toil in forging two or three hundred a day, and even then they will be bad.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.2.3
  kind: p
  original: ''
  en: But if this same smith has never made anything but nails, he will easily supply as many as two thousand three hundred in the course of a day.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.2.4
  kind: p
  original: ''
  en: And Smith hastened to the conclusion--"Divide labour, specialize, go on specializing; let us have smiths who only know how to make heads or points of nails, and by this means we shall produce more.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.2.5
  kind: p
  original: ''
  en: We shall grow rich."
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.3.1
  kind: p
  original: ''
  en: That a smith condemned for life to make the heads of nails would lose all interest in his work, that he would be entirely at the mercy of his employer with his limited handicraft, that he would be out of work four months out of twelve, and that his wages would fall very low down, when it would be easy to replace him by an apprentice, Smith did not think of all this when he exclaimed--"Long live the division o£ labour.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.3.2
  kind: p
  original: ''
  en: This is the real gold-mine that will enrich the nation!"
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.3.3
  kind: p
  original: ''
  en: And all joined him in this cry.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.4.1
  kind: p
  original: ''
  en: And later on, when a Sismondi or a J. B. Say began to understand that the division of labour, instead of enriching the whole nation, only enriches the rich, and that the worker, who is doomed for life to making the eighteenth part of a pin, grows stupid and sinks into poverty--what did official economists propose?
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.4.2
  kind: p
  original: ''
  en: Nothing!
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.4.3
  kind: p
  original: ''
  en: They did not say to themselves that by a lifelong grind at one and the same mechanical toil the worker would lose his intelligence and his spirit of invention, and that, on the contrary, a variety of occupations would result in considerably augmenting the productivity of a nation.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.4.4
  kind: p
  original: ''
  en: But this is the very issue we have now to consider.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.5.1
  kind: p
  original: ''
  en: If, however, learned economists were the only ones to preach the permanent and often hereditary division of labour, we might allow them to preach it as much as they pleased.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.5.2
  kind: p
  original: ''
  en: But the ideas taught by doctors of science filter into men's minds and pervert them; and from repeatedly hearing the division of labour, profits, interest, credit, etc., spoken of as problems long since solved, all middle-class people, and workers too, end by arguing like economists; they venerate the same fetishes.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.6.1
  kind: p
  original: ''
  en: Thus we see most socialists, even those who have not feared to point out the mistakes of economical science, justifying the division of labour.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.6.2
  kind: p
  original: ''
  en: Talk to them about the organization of work during the Revolution, and they answer that the division of labour must be maintained; that if you sharpened pins before the Revolution you must go on sharpening them after.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.6.3
  kind: p
  original: ''
  en: True, you will not have to work more than five hours a day, but you will have to sharpen pins all your life, while others will make designs for machines that will enable you to sharpen hundreds of millions of pins during your life-time; and others again will be specialists in the higher branches of literature, science, and art, etc. You were born to sharpen pins while Pasteur was born to invent the inoculation against anthrax, and the Revolution will leave you both to your respective employments.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.6.4
  kind: p
  original: ''
  en: Well, it is this horrible principle, so noxious to society, so brutalizing to the individual, source of so much harm, that we propose to discuss in its divers manifestations.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.7.1
  kind: p
  original: ''
  en: We know the consequences of the division of labour full well.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.7.2
  kind: p
  original: ''
  en: 'It is evident that, first of all, we are divided into two classes: on the one hand, producers, who consume very little and are exempt from thinking because they only do physical work, and who work badly because their brains remain inactive; and on the other hand, the consumers, who, producing little or hardly anything, have the privilege of thinking for the others, and who think badly because the whole world of those who toil with their hands is unknown to them.'
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.7.3
  kind: p
  original: ''
  en: Then, we have the labourers of the soil who know nothing of machinery, while those who work at machinery ignore everything about agriculture.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.7.4
  kind: p
  original: ''
  en: The idea of modern industry is a child tending a machine that he cannot and must not understand, and a foreman who fines him if his attention flags for a moment.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.7.5
  kind: p
  original: ''
  en: The ideal of industrial agriculture is to do away with the agricultural labourer altogether and to set a man who does odd jobs to tend a steam-plough or a threshing-machine.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.7.6
  kind: p
  original: ''
  en: The division of labour means labelling and stamping men for life--some to splice ropes in factories, some to be foremen in a business, others to shove huge coal-baskets in a particular part of a mine; but none of them to have any idea of machinery as a whole, nor of business, nor of mines.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.7.7
  kind: p
  original: ''
  en: And thereby they destroy the love of work and the capacity for invention that, at the beginning of modern industry, created the machinery on which we pride ourselves so much.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.8.1
  kind: p
  original: ''
  en: What they have done for individuals, they also wanted to do for nations.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.8.2
  kind: p
  original: ''
  en: Humanity was to be divided into national workshops, having each its speciality.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.8.3
  kind: p
  original: ''
  en: Russia, we were taught, was destined by nature to grow corn; England to spin cotton; Belgium to weave cloth; while Switzerland was to train nurses and governesses.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.8.4
  kind: p
  original: ''
  en: Moreover, each separate city was to establish a specialty.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.8.5
  kind: p
  original: ''
  en: Lyons was to weave silk, Auvergne to make lace, and Paris fancy articles.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.8.6
  kind: p
  original: ''
  en: In this way, economists said, an immense field was opened for production and consumption, and in this way an era of limitless wealth for mankind was at hand.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.9.1
  kind: p
  original: ''
  en: However, these great hopes vanished as fast as technical knowledge spread abroad.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.9.2
  kind: p
  original: ''
  en: As long as England stood alone as a weaver of cotton and as a metal-worker on a large scale; as long as only Paris made artistic fancy articles, etc., all went well, economists could preach the so-called division of labour without being refuted.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.10.1
  kind: p
  original: ''
  en: But a new current of thought induced bye and bye all civilized nations to manufacture for themselves.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.10.2
  kind: p
  original: ''
  en: They found it advantageous to produce what they formerly received from other countries, or from their colonies, which in their turn aimed at emancipating themselves from the mother-country.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.10.3
  kind: p
  original: ''
  en: Scientific discoveries universalized the methods of production, and henceforth it was useless to pay an exorbitant price abroad for what could easily be produced at home.
  modern: ''
  modern_status: empty
  notes: ''
- id: XV.10.4
  kind: p
  original: ''
  en: And now we see already that this industrial revolution strikes a crushing blow at the theory of the division of labour which for a long time was supposed to be so sound.
  modern: ''
  modern_status: empty
  notes: ''
