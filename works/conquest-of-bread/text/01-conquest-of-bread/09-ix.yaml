# Master file. Edit the `modern` and `notes` fields; see CONTRIBUTING.md.
# Verse ids are frozen. Never renumber; see VERSIFICATION.md.
section: IX
title_original: Chapter IX. The Need for Luxury
title_en: Chapter IX. The Need for Luxury
author: Peter Kropotkin
date: 1892 (French); English 1906
original_language: fr
anchor_language: en
source_original: Not yet in this repository. Kropotkin's French, La Conquête du pain (Paris 1892), is still to be located on a reachable mirror.
source_en: 'Anonymous English translation (London: Chapman and Hall, 1906) with Kropotkin''s preface of 1913, Vanguard Press printing (New York 1926), Project Gutenberg ebook 23428 (public domain)'
verses:
- id: IX.0.1
  kind: heading
  original: ''
  en: Chapter IX. The Need for Luxury
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.1.1
  kind: heading
  original: ''
  en: I
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.2.1
  kind: p
  original: ''
  en: Man is not a being whose exclusive purpose in life is eating, drinking, and providing a shelter for himself.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.2.2
  kind: p
  original: ''
  en: As soon as his material wants are satisfied, other needs, which, generally speaking, may be described as of an artistic character, will thrust themselves forward.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.2.3
  kind: p
  original: ''
  en: These needs are of the greatest variety; they vary with each and every individual; and the more society is civilized, the more will individuality be developed, and the more will desires be varied.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.3.1
  kind: p
  original: ''
  en: Even to-day we see men and women denying themselves necessaries to acquire mere trifles, to obtain some particular gratification, or some intellectual or material enjoyment.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.3.2
  kind: p
  original: ''
  en: A Christian or an ascetic may disapprove of these desires for luxury; but it is precisely these trifles that break the monotony of existence and make it agreeable.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.3.3
  kind: p
  original: ''
  en: Would life, with all its inevitable drudge and sorrows, be worth living, if, besides daily work, man could never obtain a single pleasure according to his individual tastes?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.4.1
  kind: p
  original: ''
  en: If we wish for a Social Revolution, it is no doubt, first of all, to give bread to everyone; to transform this execrable society, in which we can every day see capable workmen dangling their arms for want of an employer who will exploit them; women and children wandering shelterless at night; whole families reduced to dry bread; men, women, and children dying for want of care and even for want of food.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.4.2
  kind: p
  original: ''
  en: It is to put an end to these iniquities that we rebel.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.5.1
  kind: p
  original: ''
  en: But we expect more from the Revolution.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.5.2
  kind: p
  original: ''
  en: We see that the worker, compelled to struggle painfully for bare existence, is reduced to ignore the higher delights, the highest within man's reach, of science, and especially of scientific discovery; of art, and especially of artistic creation.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.5.3
  kind: p
  original: ''
  en: It is in order to obtain for all of us joys that are now reserved to a few; in order to give leisure and the possibility of developing everyone's intellectual capacities, that the social revolution must guarantee daily bread to all.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.5.4
  kind: p
  original: ''
  en: After bread has been secured, leisure is the supreme aim.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.6.1
  kind: p
  original: ''
  en: No doubt, nowadays, when hundreds and thousands of human beings are in need of bread, coal, clothing, and shelter, luxury is a crime; to satisfy it, the worker's child must go without bread!
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.6.2
  kind: p
  original: ''
  en: But in a society in which all have the necessary food and shelter, the needs which we consider luxuries to-day will be the more keenly felt.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.6.3
  kind: p
  original: ''
  en: And as all men do not and cannot resemble one another (the variety of tastes and needs is the chief guarantee of human progress) there will always be, and it is desirable that there should always be, men and women whose desire will go beyond those of ordinary individuals in some particular direction.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.7.1
  kind: p
  original: ''
  en: Everybody does not need a telescope, because, even if learning were general, there are people who prefer to examine things through a microscope to studying the starry heavens.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.7.2
  kind: p
  original: ''
  en: Some like statues, some like pictures.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.7.3
  kind: p
  original: ''
  en: A particular individual has no other ambition than to possess a good piano, while another is pleased with an accordion.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.7.4
  kind: p
  original: ''
  en: The tastes vary, but the artistic needs exist in all.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.7.5
  kind: p
  original: ''
  en: In our present, poor capitalistic society, the man who has artistic needs cannot satisfy them unless he is heir to a large fortune, or by dint of hard work appropriates to himself an intellectual capital which will enable him to take up a liberal profession.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.7.6
  kind: p
  original: ''
  en: Still he cherishes the hope of some day satisfying his tastes more or less, and for this reason he reproaches the idealist Communist societies with having the material life of each individual as their sole aim.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.7.7
  kind: p
  original: ''
  en: '"In your communal stores you may perhaps have bread for all," he says to us, "but you will not have beautiful pictures, optical instruments, luxurious furniture, artistic jewelry--in short, the many things that minister to the infinite variety of human tastes.'
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.7.8
  kind: p
  original: ''
  en: And you suppress the possibility of obtaining anything besides the bread and meat which the commune can offer to all, and the drab linen in which all your lady citizens will be dressed."
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.8.1
  kind: p
  original: ''
  en: These are the objections which all communist systems have to consider, and which the founders of new societies, established in American deserts, never understood.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.8.2
  kind: p
  original: ''
  en: They believed that if the community could procure sufficient cloth to dress all its members, a music-room in which the "brothers" could strum a piece of music, or act a play from time to time, it was enough.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.8.3
  kind: p
  original: ''
  en: They forgot that the feeling for art existed in the agriculturist as well as in the burgher, and, notwithstanding that the expression of artistic feeling varies according to the difference in culture, in the main it remains the same.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.8.4
  kind: p
  original: ''
  en: In vain did the community guarantee the common necessaries of life, in vain did it suppress all education that would tend to develop individuality, in vain did it eliminate all reading save the Bible.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.8.5
  kind: p
  original: ''
  en: Individual tastes broke forth, and caused general discontent; quarrels arose when somebody proposed to buy a piano or scientific instruments; and the elements of progress flagged.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.8.6
  kind: p
  original: ''
  en: The society could only exist on condition that it crushed all individual feeling, all artistic tendency, and all development.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.9.1
  kind: p
  original: ''
  en: Will the anarchist Commune be impelled by the same direction?--Evidently not, if it understands that while it produces all that is necessary to material life, it must also strive to satisfy all manifestations of the human mind.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.10.1
  kind: heading
  original: ''
  en: II
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.11.1
  kind: p
  original: ''
  en: 'We frankly confess that when we think of the abyss of poverty and suffering that surrounds us, when we hear the heartrending cry of the worker walking the streets begging for work, we are loth to discuss the question: How will men act in a society, whose members are properly fed, to satisfy certain individuals desirous of possessing a piece of Sèvres china or a velvet dress?'
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.12.1
  kind: p
  original: ''
  en: 'We are tempted to answer: Let us make sure of bread to begin with, we shall see to china and velvet later on.'
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.13.1
  kind: p
  original: ''
  en: But as we must recognize that man has other needs besides food, and as the strength of Anarchy lies precisely in that that it understands all human faculties and all passions, and ignores none, we shall, in a few words, explain how man can contrive to satisfy all his intellectual and artistic needs.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.14.1
  kind: p
  original: ''
  en: We have already mentioned that by working 4 or 5 hours a day till the age of forty-five or fifty, man could easily produce all that is necessary to guarantee comfort to society.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.15.1
  kind: p
  original: ''
  en: But the day's work of a man accustomed to toil does not consist of 5 hours; it is a 10 hours' day for 300 days a year, and lasts all his life.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.15.2
  kind: p
  original: ''
  en: Of course, when a man is harnessed to a machine, his health is soon undermined and his intelligence is blunted; but when man has the possibility of varying occupations, and especially of alternating manual with intellectual work, he can remain occupied without fatigue, and even with pleasure, for 10 or 12 hours a day.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.15.3
  kind: p
  original: ''
  en: Consequently, the man who will have done the 4 or 5 hours of manual work that are necessary for his existence, will have before him 5 or 6 hours which he will seek to employ according to his tastes.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.15.4
  kind: p
  original: ''
  en: And these 5 or 6 hours a day will fully enable him to procure for himself, if he associates with others, all he wishes for, in addition to the necessaries guaranteed to all.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.16.1
  kind: p
  original: ''
  en: He will discharge first his task in the field, the factory, and so on, which he owes to society as his contribution to the general production.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.16.2
  kind: p
  original: ''
  en: And he will employ the second half of his day, his week, or his year, to satisfy his artistic or scientific needs, or his hobbies.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.17.1
  kind: p
  original: ''
  en: Thousands of societies will spring up to gratify every taste and every possible fancy.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.18.1
  kind: p
  original: ''
  en: Some, for example, will give their hours of leisure to literature.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.18.2
  kind: p
  original: ''
  en: They will then form groups comprising authors, compositors, printers, engravers, draughtsmen, all pursuing a common aim--the propagation of ideas that are dear to them.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.19.1
  kind: p
  original: ''
  en: Nowadays an author knows that there is a beast of burden, the worker, to whom, for the sum of a few shillings a day, he can entrust the printing of his books; but he hardly cares to know what a printing office is like.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.19.2
  kind: p
  original: ''
  en: If the compositor suffers from lead-poisoning, and if the child who sees to the machine dies of anæmia, are there not other poor wretches to replace them?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.20.1
  kind: p
  original: ''
  en: But when there will be no more starvelings ready to sell their work for a pittance, when the exploited worker of to-day will be educated, and will have his own ideas to put down in black and white and to communicate to others, then the authors and scientific men will be compelled to combine among themselves and with the printers, in order to bring out their prose and their poetry.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.21.1
  kind: p
  original: ''
  en: So long as men consider fustian and manual labour a mark of inferiority, it will appear amazing to them to see an author setting up his own book in type, for has he not a gymnasium or games by way of diversion?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.21.2
  kind: p
  original: ''
  en: But when the opprobrium connected with manual labor has disappeared, when all will have to work with their hands, there being no one to do it for them, then the authors as well as their admirers will soon learn the art of handling composing-sticks and type; they will know the pleasure of coming together--all admirers of the work to be printed--to set up the type, to shape it into pages, to take it in its virginal purity from the press.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.21.3
  kind: p
  original: ''
  en: These beautiful machines, instruments of torture to the child who attends on them from morn till night, will be a source of enjoyment for those who will make use of them in order to give voice to the thoughts of their favourite author.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.22.1
  kind: p
  original: ''
  en: Will literature lose by it?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.22.2
  kind: p
  original: ''
  en: Will the poet be less a poet after having worked out of doors or helped with his hands to multiply his work?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.22.3
  kind: p
  original: ''
  en: Will the novelist lose his knowledge of human nature after having rubbed shoulders with other men in the forest or the factory, in the laying out of a road or on a railway line?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.22.4
  kind: p
  original: ''
  en: Can there be two answers to these questions?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.23.1
  kind: p
  original: ''
  en: Maybe some books will be less voluminous; but then, more will be said on fewer pages.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.23.2
  kind: p
  original: ''
  en: Maybe fewer waste-sheets will be published; but the matter printed will be more attentively read and more appreciated.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.23.3
  kind: p
  original: ''
  en: The book will appeal to a larger circle of better educated readers, who will be more competent to judge.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.24.1
  kind: p
  original: ''
  en: Moreover, the art of printing, that has so little progressed since Gutenberg, is still in its infancy.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.24.2
  kind: p
  original: ''
  en: It takes two hours to compose in type what is written in ten minutes, but more expeditious methods of multiplying thought are being sought after and will be discovered.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IX.N6
- id: IX.25.1
  kind: p
  original: ''
  en: What a pity every author does not have to take his share in the printing of his works!
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.25.2
  kind: p
  original: ''
  en: What progress printing would have already made!
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.25.3
  kind: p
  original: ''
  en: We should no longer be using movable letters, as in the seventeenth century.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.26.1
  kind: heading
  original: ''
  en: III
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.27.1
  kind: p
  original: ''
  en: Is it a dream to conceive a society in which--all having become producers, all having received an education that enables them to cultivate science or art, and all having leisure to do so--men would combine to publish the works of their choice, by contributing each his share of manual work?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.27.2
  kind: p
  original: ''
  en: We have already hundreds of learned, literary, and other societies; and these societies are nothing but voluntary groups of men, interested in certain branches of learning, and associated for the purpose of publishing their works.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.27.3
  kind: p
  original: ''
  en: The authors who write for the periodicals of these societies are not paid, and the periodicals, apart from a limited number of copies, are not for sale; they are sent gratis to all quarters of the globe, to other societies, cultivating the same branches of learning.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.27.4
  kind: p
  original: ''
  en: This member of the Society may insert in its review a one-page note summarizing his observations; another may publish therein an extensive work, the results of long years of study; while others will confine themselves to consulting the review as a starting-point for further research.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.27.5
  kind: p
  original: ''
  en: 'It does not matter: all these authors and readers are associated for the production of works in which all of them take an interest.'
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.28.1
  kind: p
  original: ''
  en: It is true that a learned society, like the individual author, goes to a printing office where workmen are engaged to do the printing.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.28.2
  kind: p
  original: ''
  en: Nowadays, those who belong to the learned societies despise manual labour which indeed is carried on under very bad conditions; but a community which would give a generous philosophic and scientific education to all its members, would know how to organize manual labour in such a way that it would be the pride of humanity.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.28.3
  kind: p
  original: ''
  en: Its learned societies would become associations of explorers, lovers of science, and workers--all knowing a manual trade and all interested in science.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.29.1
  kind: p
  original: ''
  en: If, for example, the Society is studying geology, all will contribute to the exploration of the earth's strata; each member will take his share in research, and ten thousand observers, where we have now only a hundred, will do more in a year than we can do in twenty years.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.29.2
  kind: p
  original: ''
  en: And when their works are to be published, ten thousand men and women, skilled in different trades, will be ready to draw maps, engrave designs, compose, and print the books.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.29.3
  kind: p
  original: ''
  en: With gladness will they give their leisure--in summer to exploration, in winter to indoor work.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.29.4
  kind: p
  original: ''
  en: And when their works appear, they will find not only a hundred, but ten thousand readers interested in their common work.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.30.1
  kind: p
  original: ''
  en: This is the direction in which progress is already moving.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.30.2
  kind: p
  original: ''
  en: Even to-day, when England felt the need of a complete dictionary of the English language, the birth of a Littré, who would devote his life to this work, was not waited for.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.30.3
  kind: p
  original: ''
  en: Volunteers were appealed to, and a thousand men offered their services, spontaneously and gratuitously, to ransack the libraries, to take notes, and to accomplish in a few years a work which one man could not complete in his lifetime.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.30.4
  kind: p
  original: ''
  en: In all branches of human intelligence the same spirit is breaking forth, and we should have a very limited knowledge of humanity could we not guess that the future is announcing itself in such tentative co-operation, which is gradually taking the place of individual work.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.31.1
  kind: p
  original: ''
  en: For this dictionary to be a really collective work, it would have been necessary that many volunteer authors, printers, and printers' readers should have worked in common; but something in this direction is done already in the Socialist Press, which offers us examples of manual and intellectual work combined.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.31.2
  kind: p
  original: ''
  en: It happens in our newspapers that a Socialist author composes in lead his own article.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.31.3
  kind: p
  original: ''
  en: True, such attempts are rare, but they indicate in which direction evolution is going.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.32.1
  kind: p
  original: ''
  en: They show the road of liberty.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.32.2
  kind: p
  original: ''
  en: In future, when a man will have something useful to say--a word that goes beyond the thoughts of his century, he will not have to look for an editor who might advance the necessary capital.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.32.3
  kind: p
  original: ''
  en: He will look for collaborators among those who know the printing trade, and who approve the idea of his new work.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.32.4
  kind: p
  original: ''
  en: Together they will publish the new book or journal.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.33.1
  kind: p
  original: ''
  en: Literature and journalism will cease to be a means of money-making and living at the cost of others.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.33.2
  kind: p
  original: ''
  en: But is there any one who knows literature and journalism from within, and who does not ardently desire that literature should at last be able to free itself from those who formerly protected it, and who now exploit it, and from the multitude, which, with rare exceptions, pays for it in proportion to its mediocrity, or to the ease with which it adapts itself to the bad taste o£ the greater number?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.34.1
  kind: p
  original: ''
  en: Letters and science will only take their proper place in the work of human development when, freed from all mercenary bondage, they will be exclusively cultivated by those who love them, and for those who love them.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.35.1
  kind: heading
  original: ''
  en: IV
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.36.1
  kind: p
  original: ''
  en: Literature, science, and art must be cultivated by free men.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.36.2
  kind: p
  original: ''
  en: Only on this condition will they succeed in emancipating themselves from the yoke of the State, of Capital, and of the bourgeois mediocrity which stifles them.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.37.1
  kind: p
  original: ''
  en: What means has the scientist of to-day to make researches that interest him?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.37.2
  kind: p
  original: ''
  en: Should he ask help of the State, which can only be given to one candidate in a hundred, and which only he may obtain who promises ostensibly to keep to the beaten track?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.37.3
  kind: p
  original: ''
  en: Let us remember how the Academy of Sciences of France repudiated Darwin, how the Academy of St. Petersburg treated Mendeléeff with contempt, and how the Royal Society of London refused to publish Joule's paper, in which he determined the mechanical equivalent of heat, finding it "unscientific."
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IX.N7
- id: IX.38.1
  kind: p
  original: ''
  en: It was why all great researches, all discoveries revolutionizing science, have been made outside academies and universities, either by men rich enough to remain independent, like Darwin and Lyell, or by men who undermined their health by working in poverty, and often in great straits, losing endless time for want of a laboratory, and unable to procure the instruments or books necessary to continue their researches, but persevering against hope, and often dying before they had reached the end in view.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.38.2
  kind: p
  original: ''
  en: Their name is legion.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.39.1
  kind: p
  original: ''
  en: Altogether, the system of help granted by the State is so bad that science has always endeavoured to emancipate itself from it.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.39.2
  kind: p
  original: ''
  en: For this very reason there are thousands of learned societies organized and maintained by volunteers in Europe and America,--some having developed to such a degree that all the resources of subventioned societies, and all the wealth of millionaires, would not buy their treasures.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.39.3
  kind: p
  original: ''
  en: No governmental institution is as rich as the Zoological Society of London, which is supported by voluntary contributions.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.40.1
  kind: p
  original: ''
  en: 'It does not buy the animals which in thousands people its gardens: they are sent by other societies and by collectors of the entire world.'
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.40.2
  kind: p
  original: ''
  en: The Zoological Society of Bombay will send an elephant as a gift; another time a hippopotamus or a rhinoceros is offered by Egyptian naturalists.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.40.3
  kind: p
  original: ''
  en: And these magnificent presents are pouring in every day, arriving from all quarters of the globe--birds, reptiles, collections of insects, etc. Such consignments often comprise animals that could not be bought for all the gold in the world; thus a traveller who has captured an animal at life's peril, and now loves it as he would love a child, will give it to the Society because he is sure it will be cared for.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.40.4
  kind: p
  original: ''
  en: The entrance fee paid by visitors, and they are numberless, suffices for the maintenance of that immense institution.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.41.1
  kind: p
  original: ''
  en: What is defective in the Zoological Society of London, and in other kindred societies, is that the member's fee cannot be paid in work; that the keepers and numerous employes of this large institution are not recognized as members of the Society, while many have no other incentive to joining the society than to put the cabalistic letters F.Z.S (Fellow of the Zoological Society) on their cards.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.41.2
  kind: p
  original: ''
  en: In a word, what is needed is a more perfect co-operation.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.42.1
  kind: p
  original: ''
  en: We may say the same about inventors, that we have said of scientists.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.42.2
  kind: p
  original: ''
  en: Who does not know what sufferings nearly all great inventions have cost?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.42.3
  kind: p
  original: ''
  en: Sleepless nights, families deprived of bread, want of tools and materials for experiments, this is the history of nearly all those who have enriched industry with inventions which are the truly legitimate pride of our civilization.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.43.1
  kind: p
  original: ''
  en: But what are we to do to alter the conditions that everybody is convinced are bad?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.43.2
  kind: p
  original: ''
  en: Patents have been tried, and we know with what results.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.43.3
  kind: p
  original: ''
  en: The inventor sells his patent for a few pounds, and the man who has only lent the capital pockets the enormous profits often resulting from the invention.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.43.4
  kind: p
  original: ''
  en: Besides, patents isolate the inventor.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.43.5
  kind: p
  original: ''
  en: They compel him to keep secret his researches which therefore end in failure; whereas the simplest suggestion, coming from a brain less absorbed in the fundamental idea, sometimes suffices to fertilize the invention and make it practical.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.43.6
  kind: p
  original: ''
  en: Like all State control, patents hamper the progress of industry.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.43.7
  kind: p
  original: ''
  en: Thought being incapable of being patented, patents are a crying injustice in theory, and in practice they result in one of the great obstacles to the rapid development of invention.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.44.1
  kind: p
  original: ''
  en: What is needed to promote the spirit of invention is, first of all, the awakening of thought, the boldness of conception, which our entire education causes to languish; it is the spreading of a scientific education, which would increase the number of inquirers a hundredfold; it is faith that humanity is going to take a step forward, because it is enthusiasm, the hope of doing good, that has inspired all the great inventors.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.44.2
  kind: p
  original: ''
  en: The Social Revolution alone can give this impulse to thought, this boldness, this knowledge, this conviction of working for all.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.45.1
  kind: p
  original: ''
  en: Then we shall have vast institutes supplied with motor-power and tools of all sorts, immense industrial laboratories open to all inquirers, where men will be able to work out their dreams, after having acquitted themselves of their duty towards society; machinery palaces where they will spend their five or six hours of leisure; where they will make their experiments; where they will find other comrades, experts in other branches of industry, likewise coming to study some difficult problem, and therefore able to help and enlighten each other,--the encounter of their ideas and experience causing the longed-for solution to be found.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.45.2
  kind: p
  original: ''
  en: And yet again, this is no dream.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.45.3
  kind: p
  original: ''
  en: Solanóy Gorodók, in Petersburg, has already partially realized it as regards technical matters.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.45.4
  kind: p
  original: ''
  en: It is a factory well furnished with tools and free to all; tools and motor-power are supplied gratis, only metals and wood are charged for at cost price.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.45.5
  kind: p
  original: ''
  en: Unfortunately workmen only go there at night when worn out by ten hours' labour in the workshop.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.45.6
  kind: p
  original: ''
  en: Moreover, they carefully hide their inventions from each other, as they are hampered by patents and Capitalism--that bane of present society, that stumbling-block in the path of intellectual and moral progress.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.46.1
  kind: heading
  original: ''
  en: V
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.47.1
  kind: p
  original: ''
  en: And what about art?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.47.2
  kind: p
  original: ''
  en: From all sides we hear lamentations about the decadence of art.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.47.3
  kind: p
  original: ''
  en: We are, indeed, far behind the great masters of the Renaissance.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.47.4
  kind: p
  original: ''
  en: The technicalities of art have recently made great progress; thousands of people gifted with a certain amount of talent cultivate every branch, but art seems to fly from civilization!
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.47.5
  kind: p
  original: ''
  en: Technicalities make headway, but inspiration frequents artists' studios less than ever.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.48.1
  kind: p
  original: ''
  en: Where, indeed, should it come from?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.48.2
  kind: p
  original: ''
  en: Only a grand idea can inspire art.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.48.3
  kind: p
  original: ''
  en: Art is in our ideal synonymous with creation, it must look ahead; but save a few rare, very rare exceptions, the professional artist remains too philistine to perceive new horizons.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.49.1
  kind: p
  original: ''
  en: Moreover, this inspiration cannot come from books; it must be drawn from life, and present society cannot arouse it.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.50.1
  kind: p
  original: ''
  en: Raphael and Murillo painted at a time when the search of a new ideal could be pursued while retaining the old religious traditions.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.50.2
  kind: p
  original: ''
  en: They painted to decorate churches which themselves represented the pious work of several generations of a given city.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.50.3
  kind: p
  original: ''
  en: The basilic with its mysterious aspect, its grandeur, was connected with the life itself of the city, and could inspire a painter.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.50.4
  kind: p
  original: ''
  en: He worked for a popular monument; he spoke to his fellow-citizens, and in return he received inspiration; he appealed to the multitude in the same way as did the nave, the pillars, the stained windows, the statues, and the carved doors.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.50.5
  kind: p
  original: ''
  en: Nowadays the greatest honour a painter can aspire to is to see his canvas, framed in gilded wood, hung in a museum, a sort of old curiosity shop, where you see, as in the Prado, Murillo's Ascension next to a beggar of Velasquez and the dogs of Philip II. Poor Velasquez and poor Murillo!
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.50.6
  kind: p
  original: ''
  en: Poor Greek statues which lived in the Acropolis of their cities, and are now stifled beneath the red cloth hangings of the Louvre!
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.51.1
  kind: p
  original: ''
  en: When a Greek sculptor chiseled his marble he endeavored to express the spirit and heart of the city.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.51.2
  kind: p
  original: ''
  en: All its passions, all its traditions of glory, were to live again in the work.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.51.3
  kind: p
  original: ''
  en: But to-day the united city has ceased to exist; there is no more communion of ideas.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.51.4
  kind: p
  original: ''
  en: The town is a chance agglomeration of people who do not know one another, who have no common interest, save that of enriching themselves at the expense of one another.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.51.5
  kind: p
  original: ''
  en: The fatherland does not exist....
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.51.6
  kind: p
  original: ''
  en: What fatherland can the international banker and the rag-picker have in common?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.51.7
  kind: p
  original: ''
  en: Only when cities, territories, nations, or groups of nations, will have renewed their harmonious life, will art be able to draw its inspiration from ideals held in common.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.51.8
  kind: p
  original: ''
  en: Then will the architect conceive the city's monument which will no longer be a temple, a prison, or a fortress; then will the painter, the sculptor, the carver, the ornament-worker know where to put their canvases, their statues, and their decoration; deriving their power of execution from the same vital source, and gloriously marching all together towards the future.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.52.1
  kind: p
  original: ''
  en: But till then art can only vegetate.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.52.2
  kind: p
  original: ''
  en: The best canvases of modern artists are those that represent nature, villages, valleys, the sea with its dangers, the mountain with its splendours.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.52.3
  kind: p
  original: ''
  en: But how can the painter express the poetry of work in the fields if he has only contemplated it, imagined it, if he has never delighted in it himself?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.52.4
  kind: p
  original: ''
  en: If he only knows it as a bird of passage knows the country he soars over in his migrations?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.52.5
  kind: p
  original: ''
  en: If, in the vigour of early youth, he has not followed the plough at dawn, and enjoyed mowing grass with a large sweep of the scythe next to hardy haymakers vying in energy with lively young girls who fill the air with their songs?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.52.6
  kind: p
  original: ''
  en: The love of the soil and of what grows on it is not acquired by sketching with a paint-brush--it is only in its service; and without loving it, how paint it?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.52.7
  kind: p
  original: ''
  en: This is why all that the best painters have produced in this direction is still so imperfect, not true to life, nearly always merely sentimental.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.52.8
  kind: p
  original: ''
  en: There is no strength in it.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.53.1
  kind: p
  original: ''
  en: You must have seen a sunset when returning from work.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.53.2
  kind: p
  original: ''
  en: You must have been a peasant among peasants to keep the splendour of it in your eye.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.53.3
  kind: p
  original: ''
  en: You must have been at sea with fishermen at all hours of the day and night, have fished yourself, struggled with the waves, faced the storm, and after rough work experienced the joy of hauling a heavy net, or the disappointment of seeing it empty, to understand the poetry of fishing.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.53.4
  kind: p
  original: ''
  en: You must have spent time in a factory, known the fatigues and the joys of creative work, forged metals by the vivid light of a blast furnace, have felt the life in a machine, to understand the power of man and to express it in a work of art.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.53.5
  kind: p
  original: ''
  en: You must, in fact, be permeated with popular feelings, to describe them.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.54.1
  kind: p
  original: ''
  en: Besides, the works of future artists who will have lived the life of the people, like the great artists of the past, will not be destined for sale.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.54.2
  kind: p
  original: ''
  en: They will be an integral part of a living whole that would not be complete without them, any more than they would be complete without it.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.54.3
  kind: p
  original: ''
  en: Men will go to the artist's own city to gaze at his work, and the spirited and serene beauty of such creations will produce its beneficial effect on heart and mind.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.55.1
  kind: p
  original: ''
  en: Art, in order to develop, must be bound up with industry by a thousand intermediate degrees, blended, so to say, as Ruskin and the great Socialist poet Morris have proved so often and so well.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.55.2
  kind: p
  original: ''
  en: Everything that surrounds man, in the street, in the interior and exterior of public monuments, must be of a pure artistic form.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.56.1
  kind: p
  original: ''
  en: But this can only be realized in a society in which all enjoy comfort and leisure.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.56.2
  kind: p
  original: ''
  en: Then only shall we see art associations, of which each member will find room for his capacity; for art cannot dispense with an infinity of purely manual and technical supplementary works.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.56.3
  kind: p
  original: ''
  en: These artistic associations will undertake to embellish the houses of their members, as those kind volunteers, the young painters of Edinburgh, did in decorating the walls and ceilings of the great hospital for the poor in their city.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.57.1
  kind: p
  original: ''
  en: A painter or sculptor who has produced a work of personal feeling will offer it to the woman he loves, or to a friend.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.57.2
  kind: p
  original: ''
  en: Executed for love's sake,--will his work, inspired by love, be inferior to the art that to-day satisfies the vanity of the philistine, because it has cost much money?
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.58.1
  kind: p
  original: ''
  en: The same will be done as regards all pleasures not comprised in the necessaries of life.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.58.2
  kind: p
  original: ''
  en: He who wishes for a grand piano will enter the association of musical instrument makers.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.58.3
  kind: p
  original: ''
  en: And by giving the association part of his half-days' leisure, he will soon possess the piano of his dreams.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.58.4
  kind: p
  original: ''
  en: If he is fond of astronomical studies he will join the association of astronomers, with its philosophers, its observers, its calculators, with its artists in astronomical instruments, its scientists and amateurs, and he will have the telescope he desires by taking his share of the associated work, for it is especially the rough work that is needed in an astronomical observatory--bricklayer's, carpenter's, founder's, mechanic's work, the last touch being given to the instrument of precision by the artist.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.59.1
  kind: p
  original: ''
  en: In short, the five or seven hours a day which each will have at his disposal, after having consecrated several hours to the production of necessities, would amply suffice to satisfy all longings for luxury, however varied.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.59.2
  kind: p
  original: ''
  en: Thousands of associations would undertake to supply them.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.59.3
  kind: p
  original: ''
  en: What is now the privilege of an insignificant minority would be accessible to all.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.59.4
  kind: p
  original: ''
  en: Luxury, ceasing to be a foolish and ostentatious display of the bourgeois class, would become an artistic pleasure.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.60.1
  kind: p
  original: ''
  en: Everyone would be the happier for it.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.60.2
  kind: p
  original: ''
  en: In collective work, performed with a light heart to attain a desired end, a book, a work of art, or an object of luxury, each will find an incentive and the necessary relaxation that makes life pleasant.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.61.1
  kind: p
  original: ''
  en: In working to put an end to the division between master and slave, we work for the happiness of both, for the happiness of humanity.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N6.1.1
  kind: note
  original: ''
  en: They have already been discovered since the above lines were written.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N7.1.1
  kind: note
  original: ''
  en: We know this from Playfair, who mentioned it at Joule's death.
  modern: ''
  modern_status: empty
  notes: ''
