  modern: ''
  modern_status: empty
  notes: ''
- id: XVII.N13.10.1
  kind: note
  original: ''
  en: 'Leaving a balance for houses, roads, parks, forests: 494,000'
  modern: ''
  modern_status: empty
  notes: ''
- id: XVII.N13.11.1
  kind: note
  original: ''
  en: Quantity of annual work necessary to improve and cultivate the above surfaces in five-hour workdays:--
  modern: ''
  modern_status: empty
  notes: ''
- id: XVII.N13.12.1
  kind: note
  original: ''
  en: 'Cereals (culture and crop): 15,000,000'
  modern: ''
  modern_status: empty
  notes: ''
- id: XVII.N13.13.1
  kind: note
  original: ''
  en: 'Meadows, milk, rearing of cattle: 10,000,000'
  modern: ''
  modern_status: empty
  notes: ''
- id: XVII.N13.14.1
  kind: note
  original: ''
  en: 'Market-gardening culture, high-class fruit: 33,000,000'
  modern: ''
  modern_status: empty
  notes: ''
- id: XVII.N13.15.1
  kind: note
  original: ''
  en: 'Extras: 12,000,000'
  modern: ''
  modern_status: empty
  notes: ''
- id: XVII.N13.16.1
  kind: note
  original: ''
  en: 'Total: 70,000,000'
  modern: ''
  modern_status: empty
  notes: ''
- id: XVII.N13.17.1
  kind: note
  original: ''
  en: If we suppose that only half of the able-bodied adults (men and women) are willing to work at agriculture, we see that 70 million work-days must be divided among 1,200,000 individuals, which gives us fifty-eight work-days of 5 hours for each of these workers.
  modern: ''
  modern_status: empty
  notes: ''
- id: XVII.N13.17.2
  kind: note
  original: ''
  en: With that the population of the two departments would have all necessary bread, meat, milk, vegetables, and fruit, both for ordinary and even luxurious consumption.
  modern: ''
  modern_status: empty
  notes: ''
- id: XVII.N13.17.3
  kind: note
  original: ''
  en: To-day a workman spends for the necessary food of his family (generally less than what is necessary) at least one-third of his 300 work-days a year, about 1,000 hours be it, instead of 290.
  modern: ''
  modern_status: empty
  notes: ''
- id: XVII.N13.17.4
  kind: note
  original: ''
  en: That is, he thus gives about 700 hours too much to fatten the idle and the would-be administrators, because he does not produce his own food, but buys it of middlemen, who in their turn buy it of peasants who exhaust themselves by working with bad tools, because, being robbed by the landowners and the State, they cannot procure better ones.
  modern: ''
  modern_status: empty
  notes: ''
