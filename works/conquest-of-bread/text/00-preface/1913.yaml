section: P1913
title_original: Preface (1913)
title_en: Preface (1913)
author: Peter Kropotkin
date: '1913'
original_language: fr
anchor_language: en
source_original: Not yet in this repository. Kropotkin's French, La Conquête du pain (Paris 1892), is still to be located on a reachable mirror.
source_en: 'Anonymous English translation (London: Chapman and Hall, 1906) with Kropotkin''s preface of 1913, Vanguard Press printing (New York 1926), Project Gutenberg ebook 23428 (public domain)'
verses:
- id: P1913.0.1
  kind: heading
  original: ''
  en: Preface
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.1.1
  kind: p
  original: ''
  en: One of the current objections to Communism, and Socialism altogether, is that the idea is so old, and yet it has never been realized.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.1.2
  kind: p
  original: ''
  en: Schemes of ideal States haunted the thinkers of Ancient Greece; later on, the early Christians joined in communist groups; centuries later, large communist brotherhoods came into existence during the Reform movement.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.1.3
  kind: p
  original: ''
  en: Then, the same ideals were revived during the great English and French Revolutions; and finally, quite lately, in 1848, a revolution, inspired to a great extent with Socialist ideals, took place in France.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.1.4
  kind: p
  original: ''
  en: '"And yet, you see," we are told, "how far away is still the realization of your schemes.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.1.5
  kind: p
  original: ''
  en: Don't you think that there is some fundamental error in your understanding of human nature and its needs?"
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.2.1
  kind: p
  original: ''
  en: At first sight this objection seems very serious.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.2.2
  kind: p
  original: ''
  en: However, the moment we consider human history more attentively, it loses its strength.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.2.3
  kind: p
  original: ''
  en: We see, first, that hundreds of millions of men have succeeded in maintaining amongst themselves, in their village communities, for many hundreds of years, one of the main elements of Socialism--the common ownership of the chief instrument of production, the land, and the apportionment of the same according to the labour capacities of the different families; and we learn that if the communal possession of the land has been destroyed in Western Europe, it was not from within, but from without, by the governments which created a land monopoly in favour of the nobility and the middle classes.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.2.4
  kind: p
  original: ''
  en: We learn, moreover, that the medieval cities succeeded in maintaining in their midst, for several centuries in succession, a certain socialized organization of production and trade; that these centuries were periods of a rapid intellectual, industrial, and artistic progress; while the decay of these communal institutions came mainly from the incapacity of men of combining the village with the city, the peasant with the citizen, so as jointly to oppose the growth of the military states, which destroyed the free cities.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.3.1
  kind: p
  original: ''
  en: The history of mankind, thus understood, does not offer, then, an argument against Communism.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.3.2
  kind: p
  original: ''
  en: It appears, on the contrary, as a succession of endeavours to realize some sort of communist organization, endeavours which were crowned here and there with a partial success of a certain duration; and all we are authorized to conclude is, that mankind has not yet found the proper form for combining, on communistic principles, agriculture with a suddenly developed industry and a rapidly growing international trade.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.3.3
  kind: p
  original: ''
  en: The latter appears especially as a disturbing element, since it is no longer individuals only, or cities, that enrich themselves by distant commerce and export; but whole nations grow rich at the cost of those nations which lag behind in their industrial development.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.4.1
  kind: p
  original: ''
  en: These conditions, which began to appear by the end of the eighteenth century, took, however, their full development in the nineteenth century only, after the Napoleonic wars came to an end.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.4.2
  kind: p
  original: ''
  en: And modern Communism has to take them into account.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.5.1
  kind: p
  original: ''
  en: It is now known that the French Revolution, apart from its political significance, was an attempt made by the French people, in 1793 and 1794, in three different directions more or less akin to Socialism.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.5.2
  kind: p
  original: ''
  en: It was, first, the equalization of fortunes, by means of an income tax and succession duties, both heavily progressive, as also by a direct confiscation of the land in order to sub-divide it, and by heavy war taxes levied upon the rich only.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.5.3
  kind: p
  original: ''
  en: The second attempt was a sort of Municipal Communism as regards the consumption of some objects of first necessity, bought by the municipalities, and sold by them at cost price.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.5.4
  kind: p
  original: ''
  en: And the third attempt was to introduce a wide national system of rationally established prices of all commodities, for which the real cost of production and moderate trade profits had to be taken into account.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.5.5
  kind: p
  original: ''
  en: The Convention worked hard at this scheme, and had nearly completed its work, when reaction took the upper hand.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.6.1
  kind: p
  original: ''
  en: It was during this remarkable movement, which has never yet been properly studied, that modern Socialism was born--Fourierism with L'Ange, at Lyons, and authoritarian Communism with Buonarroti, Babeuf, and their comrades.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.6.2
  kind: p
  original: ''
  en: And it was immediately after the Great Revolution that the three great theoretical founders of modern Socialism--Fourier, Saint Simon, and Robert Owen, as well as Godwin (the No-State Socialism)--came forward; while the secret communist societies, originated from those of Buonarroti and Babeuf, gave their stamp to militant, authoritarian Communism for the next fifty years.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.7.1
  kind: p
  original: ''
  en: To be correct, then, we must say that modern Socialism is not yet a hundred years old, and that, for the first half of these hundred years, two nations only, which stood at the head of the industrial movement, i.e., Britain and France, took part in its elaboration.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.7.2
  kind: p
  original: ''
  en: Both--bleeding at that time from the terrible wounds inflicted upon them by fifteen years of Napoleonic wars, and both enveloped in the great European reaction that had come from the East.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.8.1
  kind: p
  original: ''
  en: In fact, it was only after the Revolution of July, 1830, in France, and the Reform movement of 1830-1832 in this country, had begun to shake off that terrible reaction, that the discussion of Socialism became possible for a few years before the revolution of 1848.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.8.2
  kind: p
  original: ''
  en: And it was during those years that the aspirations of Fourier, St. Simon, and Robert Owen, worked out by their followers, took a definite shape, and the different schools of Socialism which exist nowadays were defined.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.9.1
  kind: p
  original: ''
  en: In Britain, Robert Owen and his followers worked out their schemes of communist villages, agricultural and industrial at the same time; immense co-operative associations were started for creating with their dividends more communist colonies; and the Great Consolidated Trades' Union was founded--the forerunner of both the Labour Parties of our days and the International Working-men's Association.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.10.1
  kind: p
  original: ''
  en: In France, the Fourierist Considérant issued his remarkable manifesto, which contains, beautifully developed, all the theoretical considerations upon the growth of Capitalism, which are now described as "Scientific Socialism."
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.10.2
  kind: p
  original: ''
  en: Proudhon worked out his idea of Anarchism and Mutualism, without State interference.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.10.3
  kind: p
  original: ''
  en: Louis Blanc published his Organization of Labour, which became later on the programme of Lassalle.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.10.4
  kind: p
  original: ''
  en: Vidal in France and Lorenz Stein in Germany further developed, in two remarkable works, published in 1846 and 1847 respectively, the theoretical conceptions of Considérant; and finally Vidal, and especially Pecqueur, developed in detail the system of Collectivism, which the former wanted the National Assembly of 1848 to vote in the shape of laws.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.11.1
  kind: p
  original: ''
  en: However, there is one feature, common to all Socialist schemes of that period, which must be noted.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.11.2
  kind: p
  original: ''
  en: The three great founders of Socialism who wrote at the dawn of the nineteenth century were so entranced by the wide horizons which it opened before them, that they looked upon it as a new revelation, and upon themselves as upon the founders of a new religion.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.11.3
  kind: p
  original: ''
  en: Socialism had to be a religion, and they had to regulate its march, as the heads of a new church.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.11.4
  kind: p
  original: ''
  en: Besides, writing during the period of reaction which had followed the French Revolution, and seeing more its failures than its successes, they did not trust the masses, and they did not appeal to them for bringing about the changes which they thought necessary.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.11.5
  kind: p
  original: ''
  en: They put their faith, on the contrary, into some great ruler, some Socialist Napoleon.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.11.6
  kind: p
  original: ''
  en: He would understand the new revelation; he would be convinced of its desirability by the successful experiments of their phalansteries, or associations; and he would peacefully accomplish by his own authority the revolution which would bring well-being and happiness to mankind.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.11.7
  kind: p
  original: ''
  en: A military genius, Napoleon, had just been ruling Europe.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.11.8
  kind: p
  original: ''
  en: Why should not a social genius come forward, carry Europe with him and translate the new Gospel into life?
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.11.9
  kind: p
  original: ''
  en: That faith was rooted very deep, and it stood for a long time in the way of Socialism; its traces are even seen amongst us, down to the present day.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.12.1
  kind: p
  original: ''
  en: 'It was only during the years 1840-48, when the approach of the Revolution was felt everywhere, and the proletarians were beginning to plant the banner of Socialism on the barricades, that faith in the people began to enter once more the hearts of the social schemers: faith, on the one side, in Republican Democracy, and on the other side in free association, in the organizing powers of the working-men themselves.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.13.1
  kind: p
  original: ''
  en: But then came the Revolution of February, 1848, the middle-class Republic, and--with it, shattered hopes.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.13.2
  kind: p
  original: ''
  en: Four months only after the proclamation of the Republic, the June insurrection of the Paris proletarians broke out, and it was crushed in blood.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.13.3
  kind: p
  original: ''
  en: The wholesale shooting of the working-men, the mass deportations to New Guinea, and finally the Napoleonian coup d'état followed.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.13.4
  kind: p
  original: ''
  en: The Socialists were prosecuted with fury, and the weeding out was so terrible and so thorough that for the next twelve or fifteen years the very traces of Socialism disappeared; its literature vanished so completely that even names, once so familiar before 1848, were entirely forgotten; ideas which were then current--the stock ideas of the Socialists before 1848--were so wiped out as to be taken, later on, by our generation, for new discoveries.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.14.1
  kind: p
  original: ''
  en: However, when a new revival began, about 1866, when Communism and Collectivism once more came forward, it appeared that the conception as to the means of their realization had undergone a deep change.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.14.2
  kind: p
  original: ''
  en: The old faith in Political Democracy was dying out, and the first principles upon which the Paris working-men agreed with the British trade-unionists and Owenites, when they met in 1862 and 1864, at London, was that "the emancipation of the working-men must be accomplished by the working-men themselves."
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.14.3
  kind: p
  original: ''
  en: Upon another point they also were agreed.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.14.4
  kind: p
  original: ''
  en: It was that the labour unions themselves would have to get hold of the instruments of production, and organize production themselves.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.14.5
  kind: p
  original: ''
  en: The French idea of the Fourierist and Mutualist "Association" thus joined hands with Robert Owen's idea of "The Great Consolidated Trades' Union," which was extended now, so as to become an International Working-men's Association.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.15.1
  kind: p
  original: ''
  en: Again this new revival of Socialism lasted but a few years.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.15.2
  kind: p
  original: ''
  en: Soon came the war of 1870-71, the uprising of the Paris Commune--and again the free development of Socialism was rendered impossible in France.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.15.3
  kind: p
  original: ''
  en: But while Germany accepted now from the hands of its German teachers, Marx and Engels, the Socialism of the French "forty-eighters" that is, the Socialism of Considérant and Louis Blanc, and the Collectivism of Pecqueur,--France made a further step forward.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.16.1
  kind: p
  original: ''
  en: 'In March, 1871, Paris had proclaimed that henceforward it would not wait for the retardatory portions of France: that it intended to start within its Commune its own social development.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.17.1
  kind: p
  original: ''
  en: The movement was too short-lived to give any positive result.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.17.2
  kind: p
  original: ''
  en: It remained communalist only; it merely asserted the rights of the Commune to its full autonomy.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.17.3
  kind: p
  original: ''
  en: But the working-classes of the old International saw at once its historical significance.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.17.4
  kind: p
  original: ''
  en: They understood that the free commune would be henceforth the medium in which the ideas of modern Socialism may come to realization.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.17.5
  kind: p
  original: ''
  en: The free agro-industrial communes, of which so much was spoken in England and France before 1848, need not be small phalansteries, or small communities of 2000 persons.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.17.6
  kind: p
  original: ''
  en: They must be vast agglomerations, like Paris, or, still better, small territories.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.17.7
  kind: p
  original: ''
  en: These communes would federate to constitute nations in some cases, even irrespectively of the present national frontiers (like the Cinque Ports, or the Hansa).
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.17.8
  kind: p
  original: ''
  en: At the same time large labour associations would come into existence for the inter-communal service of the railways, the docks, and so on.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.18.1
  kind: p
  original: ''
  en: Such were the ideas which began vaguely to circulate after 1871 amongst the thinking working-men, especially in the Latin countries.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.18.2
  kind: p
  original: ''
  en: In some such organization, the details of which life itself would settle, the labour circles saw the medium through which Socialist forms of life could find a much easier realization than through the seizure of all industrial property by the State, and the State organization of agriculture and industry.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.19.1
  kind: p
  original: ''
  en: These are the ideas to which I have endeavoured to give a more or less definite expression in this book.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.20.1
  kind: p
  original: ''
  en: Looking back now at the years that have passed since this book was written, I can say in full conscience that its leading ideas must have been correct.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.20.2
  kind: p
  original: ''
  en: State Socialism has certainly made considerable progress.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.20.3
  kind: p
  original: ''
  en: State railways, State banking, and State trade in spirits have been introduced here and there.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.20.4
  kind: p
  original: ''
  en: But every step made in this direction, even though it resulted in the cheapening of a given commodity, was found to be a new obstacle in the struggle of the working-men for their emancipation.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.20.5
  kind: p
  original: ''
  en: So that we find growing amongst the working-men, especially in Western Europe, the idea that even the working of such a vast national property as a railway-net could be much better handled by a Federated Union of railway employés, than by a State organization.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.21.1
  kind: p
  original: ''
  en: On the other side, we see that countless attempts have been made all over Europe and America, the leading idea of which is, on the one side, to get into the hands of the working-men themselves wide branches of production, and, on the other side, to always widen in the cities the circles of the functions which the city performs in the interest of its inhabitants.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.21.2
  kind: p
  original: ''
  en: Trade-unionism, with a growing tendency towards organizing the different trades internationally, and of being not only an instrument for the improvement of the conditions of labour, but also of becoming an organization which might, at a given moment, take into its hands the management of production; Co-operation, both for production and for distribution, both in industry and agriculture, and attempts at combining both sorts of co-operation in experimental colonies; and finally, the immensely varied field of the so-called Municipal Socialism--these are the three directions in which the greatest amount of creative power has been developed lately.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.22.1
  kind: p
  original: ''
  en: Of course, none of these may, in any degree, be taken as a substitute for Communism, or even for Socialism, both of which imply the common possession of the instruments of production.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.22.2
  kind: p
  original: ''
  en: But we certainly must look at all these attempts as upon experiments--like those which Owen, Fourier, and Saint Simon tried in their colonies--experiments which prepare human thought to conceive some of the practical forms in which a communist society might find its expression.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.22.3
  kind: p
  original: ''
  en: The synthesis of all these partial experiments will have to be made some day by the constructive genius of some one of the civilized nations.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.22.4
  kind: p
  original: ''
  en: But samples of the bricks out of which the great synthetic building will have to be built, and even samples of some of its rooms, are being prepared by the immense effort of the constructive genius of man.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1913.23.1
  kind: signature
  original: ''
  en: BRIGHTON. January, 1913.
  modern: ''
  modern_status: empty
  notes: ''
