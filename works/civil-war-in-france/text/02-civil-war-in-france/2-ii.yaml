section: II
title_original: The Civil War in France, part II
title_en: The Civil War in France, part II
author: Karl Marx
date: '1871-05-30'
original_language: en
anchor_language: en
source_original: Karl Marx for the General Council of the International Working Men's Association, English editions of 1870 and 1871, public domain; Marxists Internet Archive transcription (Zodiac and Brian Baggins, proofed by Matthew Carmody 2009; CC BY-SA)
source_en: 'None needed: the original is in English'
verses:
- id: II.0.1
  kind: heading
  original: II
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.1.1
  kind: p
  original: Armed Paris was the only serious obstacle in the way of the counter-revolutionary conspiracy.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.1.2
  kind: p
  original: Paris was, therefore, to be disarmed.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.1
  kind: p
  original: On this point, the Bordeaux Assembly was sincerity itself.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.2.2
  kind: p
  original: If the roaring rant of its Rurals had not been audible enough, the surrender of Paris by Thiers to the tender mercies of the triumvirate of Vinoy the Decembriseur, Valentin the Bonapartist gendarme, and Aurelles de Paladine the Jesuit general, would have cut off even the last subterfuge of doubt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.3.1
  kind: p
  original: But while insultingly exhibiting the true purpose of the disarmament of Paris, the conspirators asked her to lay down her arms on a pretext which was the most glaring, the most barefaced of lies.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.3.2
  kind: p
  original: The artillery of the Paris National Guard, said Thiers, belonged to the state, and to the state it must be returned.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.3.3
  kind: p
  original: 'The fact was this: From the very day of the capitulation, by which Bismarck''s prisoners had signed the surrender of France, but reserved to themselves a numerous bodyguard for the express purpose of cowing Paris, Paris stood on the watch.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.3.4
  kind: p
  original: The National Guard reorganized themselves and entrusted their supreme control to a Central Committee elected by their whole body, save some fragments of the old Bonapartist formations.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.3.5
  kind: p
  original: On the eve of the entrance of the Prussians into Paris, the Central Committee took measures for the removal to Montmartre, Belleville, and La Villette, of the cannon and mitrailleuses treacherously abandoned by the capitulards in and about the very quarters the Prussians were to occupy.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.3.6
  kind: p
  original: That artillery had been furnished by the subscriptions of the National Guard.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.3.7
  kind: p
  original: As their private property, it was officially recognized in the capitulation of January 28, and on that very title exempted from the general surrender, into the hands of the conqueror, or arms belonging to the government.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.3.8
  kind: p
  original: And Thiers was so utterly destitute of even the flimsiest pretext for initiating the war against Paris, that he had to resort to the flagrant lie of the artillery of the National Guard being state property!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.1
  kind: p
  original: The seizure of her artillery was evidently but to serve as the preliminary to the general disarmament of Paris, and, therefore, of the Revolution of September 4. But that revolution had become the legal status of France.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.2
  kind: p
  original: The republic, its work, was recognized by the conqueror in the terms of the capitulation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.3
  kind: p
  original: After the capitulation, it was acknowledged by all foreign powers, and in its name, the National Assembly had been summoned.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.4
  kind: p
  original: The Paris working men's revolution of September 4 was the only legal title of the National Assembly seated at Bordeaux, and of its executive.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.5
  kind: p
  original: Without it, the National Assembly would at once have to give way to the Corps Legislatif elected in 1869 by universal suffrage under French, not under Prussian, rule, and forcibly dispersed by the arm of the revolution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.6
  kind: p
  original: Thiers and his ticket-of-leave men would have had to capitulate for safe conducts signed by Louis Bonaparte, to save them from a voyage to Cayenne.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.7
  kind: p
  original: The National Assembly, with its power of attorney to settle the terms of peace with Prussia, was but an incident of that revolution, the true embodiment of which was still armed Paris, which had initiated it, undergone for it a five-months' siege, with its horrors of famine, and made her prolonged resistance, despite Trochu's plan, the basis of an obstinate war of defence in the provinces.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.8
  kind: p
  original: And Paris was now either to lay down her arms at the insulting behest of the rebellious slaveholders of Bordeaux, and acknowledge that her Revolution of September 4 meant nothing but a simple transfer of power from Louis Bonaparte to his royal rivals; or she had to stand forward as the self-sacrificing champion of France, whose salvation from ruin and whose regeneration were impossible without the revolutionary overthrow of the political and social conditions that had engendered the Second Empire, and under its fostering care, matured into utter rottenness.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.9
  kind: p
  original: Paris, emaciated by a five-months' famine, did not hesitate one moment.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.10
  kind: p
  original: She heroically resolved to run all the hazards of a resistance against French conspirators, even with Prussian cannon frowning upon her from her own forts.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.4.11
  kind: p
  original: Still, in its abhorrence of the civil war into which Paris was to be goaded, the Central Committee continued to persist in a merely defensive attitude, despite the provocations of the Assembly, the usurpations of the Executive, and the menacing concentration of troops in and around Paris.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.5.1
  kind: p
  original: Thiers opened the civil war by sending Vinoy, at the head of a multitude of sergents-de-ville, and some regiments of the line, upon a nocturnal expedition against Montmartre, there to seize, by surprise, the artillery of the National Guard.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.5.2
  kind: p
  original: It is well known how this attempt broke down before the resistance of the National Guard and the fraternization of the line with the people.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.5.3
  kind: p
  original: Aurelles de Paldine had printed beforehand his bulletin of victory, and Thiers held ready the placards announcing his measures of coup d'etat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.5.4
  kind: p
  original: Now these had to be replaced by Thiers' appeals, imparting his magnanimous resolve to leave the National Guard in the possession of their arms, with which, he said, he felt sure they would rally round the government against the rebels.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.5.5
  kind: p
  original: Out of 300,000 National guards, only 300 responded to this summons to rally around little Thiers against themselves.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.5.6
  kind: p
  original: The glorious working men's Revolution of March 18 took undisputed sway of Paris.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.5.7
  kind: p
  original: The Central Committee was its provisional government.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.5.8
  kind: p
  original: Europe seemed, for a moment, to doubt whether its recent sensational performances of state and war had any reality in them, or whether they were the dreams of a long bygone past.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.6.1
  kind: p
  original: From March 18 to the entrance of the Versailles troops into Paris, the proletarian revolution remained so free from the acts of violence in which the revolutions - and still more the counter-revolutions - of the "better classes" abound, that no facts were left to its opponents to cry out about, but the executions of Generals Lecomte and Clement Thomas, and the affair of the Place Vendome.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.7.1
  kind: p
  original: One of the Bonapartist officers engaged in the nocturnal attempt against Montmartre, General Lecomte, had four times ordered the 81st line regiment to fire at an unarmed gathering in the Place Pigalle, and on their refusal fiercely insulted them.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.7.2
  kind: p
  original: Instead of shooting women and children, his own men shot him.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.7.3
  kind: p
  original: The inveterate habits acquired by the soldiery under the training of the enemies of the working class are, of course, not likely to change the very moment these soldiers change sides.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.7.4
  kind: p
  original: The same men executed Clement Thomas.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.1
  kind: p
  original: '"General" Clement Thomas, a malcontent ex-quartermaster-sergeant, had, in the latter times of Louis Philippe''s reign, enlisted at the office of the republican newspaper Le National, there to serve in the double capacity of responsible man-of-straw ( gerant responsable) and of duelling bully to that very combative journal.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.2
  kind: p
  original: After the February Revolution, the men of the National having got into power, they metamorphosed this old quarter-master-sergeant into a general on the eve of the butchery of June - of which he, like Jules Favre, was one of the sinister plotters, and became one of the most dastardly executioners.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.3
  kind: p
  original: Then he and his generalship disappeared for a long time, to again rise to the surface on November 1, 1870.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.4
  kind: p
  original: The day before, the Government of National Defence, caught at the Hotel de Ville, had solemnly pledged their parole to Blanqui, Flourens, and other representatives of the working class, to abdicate their usurped power into the hands of a commune to be freely elected by Paris.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.5
  kind: p
  original: Instead of keeping their word, they let loose on Paris the Bretons of Trochu, who now replaced the Corsicans of Bonaparte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.6
  kind: p
  original: General Tamisier alone, refusing to sully his name by such a breach of faith, resigned the commandership-in-chief of the National Guard, and in his place Clement Thomas for once became again a general.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.7
  kind: p
  original: During the whole of his tenure of command, he made war, not upon the Prussians, but upon the Paris National Guard.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.8
  kind: p
  original: He prevented their general armament, pitted the bourgeois battalions against the working men's battalions, weeded out officers hostile to Trochu's "plan," and disbanded, under the stigma of cowardice, the very same proletarian battalions whose heroism has now astonished their most inveterate enemies.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.9
  kind: p
  original: Clement Thomas felt quite proud of having reconquered his June pre-eminence as the personal enemy of the working class of Paris.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.10
  kind: p
  original: Only a few days before March 18, he laid before the War Minister, Leflo, a plan of his own for "finishing off la fine fleur of the Paris canaille."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.11
  kind: p
  original: After Vinoy's rout, he must needs appear upon the scene of action in the quality of an amateur spy.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.8.12
  kind: p
  original: The Central Committee and the Paris working men were as much responsible for the killing of Clement Thomas and Lecomte as the Princess of Wales for the fate of the people crushed to death on the day of her entrance into London.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.1
  kind: p
  original: The massacre of unarmed citizens in Place Vendome is a myth which M. Thiers and the Rurals persistently ignored in the Assembly, entrusting its propagation exclusively to the servants' hall of European journalism.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.2
  kind: p
  original: '"The men of order," the reactionists of Paris, trembled at the victory of March 18. To them, it was the signal of popular retribution at last arriving.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.3
  kind: p
  original: The ghosts of the victims assassinated at their hands from the days of June 1848, down to January 22, 1871, arose before their faces.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.4
  kind: p
  original: Their panic was their only punishment.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.5
  kind: p
  original: Even the sergents-de-ville, instead of being disarmed and locked up, as ought to have been done, had the gates of Paris flung open wide for their safe retreat to Versailles.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.6
  kind: p
  original: The men of order were left not only unharmed, but allowed to rally and quietly seize more than one stronghold in the very centre of Paris.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.7
  kind: p
  original: This indulgence of the Central Committee - this magnanimity of the armed working men - so strangely at variance with the habits of the "Party of Order," the latter misinterpreted as mere symptoms of conscious weakness.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.8
  kind: p
  original: Hence their silly plan to try, under the cloak of an unarmed demonstration, what Vinoy had failed to perform with his cannon and mitrailleuses.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.9
  kind: p
  original: On March 22, a riotous mob of swells started from the quarters of luxury, all the petits creves in their ranks, and at their head the notorious familiars of the empire - the Heeckeren, Coetlogon, Henri de Pene, etc. Under the cowardly pretence of a pacific demonstration, this rabble, secretly armed with the weapons of the bravo, fell into marching order, ill-treated and disarmed the detached patrols and sentries of the National Guard they met with on their progress, and, on debouching from the Rue de la Paix, with the cry of "Down with the Central Committee!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.10
  kind: p
  original: Down with the assassins!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.11
  kind: p
  original: The National Assembly forever!" attempted to break through the line drawn up there, and thus to carry by surprise the headquarters of the National Guard in the Place Vendome.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.12
  kind: p
  original: In reply to their pistol-shots, the regular sommations (the French equivalent of the English Riot Act) were made, and, proving ineffective, fire was commanded by the general of the National Guard.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.13
  kind: p
  original: One volley dispersed into wild flight the silly coxcombs, who expected that the mere exhibition of their "respectability" would have the same effect upon the Revolution of Paris as Joshua's trumpets upon the walls of Jericho.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.14
  kind: p
  original: The runaways left behind them two National Guards killed, nine severely wounded (among them a member of the Central Committee), and the whole scene of their exploit strewn with revolvers, daggers, and sword-canes, in evidence of the "unarmed" character of their "pacific" demonstration.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.15
  kind: p
  original: When, on June 13, 1849, the National Guard made a really pacific demonstration in protest against the felonious assault of French troops upon Rome, Changarnier, then general of the Party of Order, was acclaimed by the National Assembly, and especially by M. Thiers, as the savior of society, for having launched his troops from all sides upon these unarmed men, to shoot and sabre them down, and to trample them under their horses' feet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.16
  kind: p
  original: Paris, then was placed under a state of siege.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.17
  kind: p
  original: Dufaure hurried through the Assembly new laws of repression.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.18
  kind: p
  original: New arrests, new proscriptions - a new reign of terror set in.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.19
  kind: p
  original: But the lower orders manage these things otherwise.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.20
  kind: p
  original: The Central Committee of 1871 simply ignored the heroes of the "pacific demonstration"; so much so, that only two days later, they were enabled to muster under Admiral Saisset, for that armed demonstration, crowned by the famous stampede to Versailles.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.21
  kind: p
  original: In their reluctance to continue the civil war opened by Thiers' burglarious attempt on Montmartre, the Central Committee made themselves, this time, guilty of a decisive mistake in not at once marching upon Versailles, then completely helpless, and thus putting an end to the conspiracies of Thiers and his Rurals.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.22
  kind: p
  original: Instead of this, the Party of Order was again allowed to try its strength at the ballot box, on March 26, the day of the election of the Commune.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.9.23
  kind: p
  original: Then, in the mairies of Paris, they exchanged bland words of conciliation with their too generous conquerors, muttering in their hearts solemn vows to exterminate them in due time.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.10.1
  kind: p
  original: Now, look at the reverse of the medal.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.10.2
  kind: p
  original: Thiers opened his second campaign against Paris in the beginning of April.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.10.3
  kind: p
  original: The first batch of Parisian prisoners brought into Versailles was subjected to revolting atrocities, while Ernest Picard, with his hands in his trousers' pockets, strolled about jeering them, and while Mesdames Thiers and Favre, in the midst of their ladies of honor (?) applauded, from the balcony, the outrages of the Versailles mob.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.10.4
  kind: p
  original: The captured soldiers of the line were massacred in cold blood; our brave friend, General Duval, the iron-founder, was shot without any form of trial.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.10.5
  kind: p
  original: Galifet, the kept man of his wife, so notorious for her shameless exhibitions at the orgies of the Second Empire, boasted in a proclamation of having commanded the murder of a small troop of National Guards, with their captain and lieutenant, surprised and disarmed by his Chasseurs.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.10.6
  kind: p
  original: Vinoy, the runaway, was appointed by Thiers, Grand Cross of the Legion of Honor, for his general order to shoot down every soldier of the line taken in the ranks of the Federals.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.10.7
  kind: p
  original: Desmaret, the Gendarme, was decorated for the treacherous butcher-like chopping in pieces of the high-souled and chivalrous Flourens, who had saved the heads of the Government of Defence on October 31, 1870.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.10.8
  kind: p
  original: '"The encouraging particulars" of his assassination were triumphantly expatiated upon by Thiers in the National Assembly.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.10.9
  kind: p
  original: With the elated vanity of a parliamentary Tom Thumb permitted to play the part of a Tamerlane, he denied the rebels the right of neutrality for ambulances.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.10.10
  kind: p
  original: Nothing more horrid than that monkey allowed for a time to give full fling to his tigerish instincts, as foreseen by Voltaire.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.1
  kind: p
  original: 'After the decree of the Commune of April 7, ordering reprisals and declaring it to be the duty "to protect Paris against the cannibal exploits of the Versailles banditti, and to demand an eye for an eye, a tooth for a tooth," Thiers did not stop the barbarous treatment of prisoners, moreover, insulting them in his bulletins as follows: "Never have more degraded countenances of a degraded democracy met the afflicted gazes of honest men" - honest, like Thiers himself and his ministerial ticket-of-leave men.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.2
  kind: p
  original: Still, the shooting of prisoners was suspended for a time.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.3
  kind: p
  original: Hardly, however, had Thiers and his Decembrist generals become aware that the Communal decree of reprisals was but an empty threat, that even their gendarme spies caught in Paris under the disguise of National Guards, that even sergents-de-ville, taken with incendiary shells upon them, were spared - when the wholesale shooting of prisoners was resumed and carried on uninterruptedly to the end.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.4
  kind: p
  original: Houses to which National Guards had fled were surrounded by gendarmes, inundated with petroleum (which here occurs for the first time in this war), and then set fire to, the charred corpses being afterwards brought out by the ambulance of the Press at the Ternes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.5
  kind: p
  original: Four National Guards having surrendered to a troop of mounted Chasseurs at Belle Epine, on April 25, were afterwards shot down, one after another, by the captain, a worthy man of Gallifet's.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.6
  kind: p
  original: One of his four victims, left for dead, Scheffer, crawled back to the Parisian outposts, and deposed to this fact before a commission of the Commune.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.7
  kind: p
  original: When Tolain interpellated the War Minister upon the report of this commission, the Rurals drowned his voice and forbade Leflo to answer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.8
  kind: p
  original: It would be an insult to their "glorious" army to speak of its deeds.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.9
  kind: p
  original: The flippant tone in which Thiers' bulletin announced the bayoneting of the Federals, surprised asleep at Moulin Saquet, and the wholesale fusillades at Clamart shocked the nerves even of the not over-sensitive London Times.
  en: ''
  modern: ''
