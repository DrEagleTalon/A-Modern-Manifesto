- id: II.11.10
  kind: p
  original: But it would be ludicrous today to attempt recounting the merely preliminary atrocities committed by the bombarders of Paris and the fomenters of a slaveholders' rebellion protected by foreign invasion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: II.11.11
  kind: p
  original: Amidst all these horrors, Thiers, forgetful of his parliamentary laments on the terrible responsibility weighing down his dwarfish shoulders, boasts in his bulletins that l'Assemblee siege paisiblement (the Assembly continues meeting in peace), and proves by his constant carousals, now with Decembrist generals, now with German princes, that his digestion is not troubled in the least, not even by the ghosts of Lecomte and Clement Thomas.
  en: ''
