section: I
title_original: The Civil War in France, part I
title_en: The Civil War in France, part I
author: Karl Marx
date: '1871-05-30'
original_language: en
anchor_language: en
source_original: Karl Marx for the General Council of the International Working Men's Association, English editions of 1870 and 1871, public domain; Marxists Internet Archive transcription (Zodiac and Brian Baggins, proofed by Matthew Carmody 2009; CC BY-SA)
source_en: 'None needed: the original is in English'
verses:
- id: I.0.1
  kind: heading
  original: I
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.1.1
  kind: p
  original: On September 4, 1870, when the working men of Paris proclaimed the republic, which was almost instantaneously acclaimed throughout France, without a single voice of dissent, a cabal of place-hunting barristers, with Thiers for their statesman, and Trochu for their general, took hold of the Hotel de Ville.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.1.2
  kind: p
  original: At that time they were imbued with so fanatical a faith in the mission of Paris to represent France in all epochs of historical crisis that, to legitimate their usurped titles as governors of France, they thought it quite sufficient to produce their lapsed mandates as representatives of Paris.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.1
  kind: p
  original: In our second address on the late war, five days after the rise of these men, we told you who they were.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.2
  kind: p
  original: Yet, in the turmoil of surprise, with the real leaders of the working class still shut up in Bonapartist prisons and the Prussians already marching on Paris, Paris bore with their assumption of power, on the express condition that it was to be wielded for the single purpose of national defence.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.3
  kind: p
  original: Paris, however, was not to be defended without arming its working class, organizing them into an effective force, and training their ranks by the war itself.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.4
  kind: p
  original: But Paris armed was the revolution armed.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.5
  kind: p
  original: A victory of Paris over the Prussian aggressor would have been a victory of the French workmen over the French capitalist and his state parasites.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.6
  kind: p
  original: In this conflict between national duty and class interest, the Government of National Defence did not hesitate one moment to turn into a Government of National Defection.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.3.1
  kind: p
  original: The first step they took was to send Thiers on a roving tour to all the courts of Europe, there to beg mediation by offering the barter of the republic for a king.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.3.2
  kind: p
  original: 'Four months after the commencement of the siege, when they thought the opportune moment came for breaking the first word of capitulation, Trochu, in the presence of Jules Favre, and others of his colleagues, addressed the assembled mayors of Paris in these terms:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.1
  kind: p
  original: '"The first question put to me by my colleagues on the very evening of the 4th of September was this: Paris, can it, with any chance of success, stand a siege by the Prussian army?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.2
  kind: p
  original: I did not hesitate to answer in the negative.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.3
  kind: p
  original: Some of my colleagues here present will warrant the truth of my words and the persistence of my opinion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.4
  kind: p
  original: I told them, in these very terms, that, under the existing state of things, the attempt of Paris to hold out a siege by the Prussian army would be a folly.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.5
  kind: p
  original: Without doubt, I added, it would be an heroic folly; but that would be all....
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.6
  kind: p
  original: The events have not given the lie to my prevision."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.5.1
  kind: p
  original: This nice little speech of Trochu was afterwards published by M. Carbon, one of the mayors present.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.6.1
  kind: p
  original: Thus, on the very evening of the proclamation of the republic, Trochu's "plan" was known to his colleagues to be the capitulation of Paris.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.6.2
  kind: p
  original: If national defence has been more than a pretext for the personal government of Thiers, Favre, and Co., the upstarts of September 4 would have abdicated on the 5th - would have initiated the Paris people into Trochu's "plan," and called upon them to surrender at once, or to take their own fate into their own hands.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.6.3
  kind: p
  original: Instead of this, the infamous impostors resolved upon curing the heroic folly of Paris by a regimen of famine and broken heads, and to dupe her in the meanwhile by ranting manifestos, holding forth that Trochu, "the governor of Paris, will never capitulate", and Jules Favre, the foreign minister, will "not cede an inch of our territory, nor a stone of our fortresses."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.7.1
  kind: p
  original: In a letter to Gambetta, the very same Jules Favre avows that what they were "defending" against were not the Prussian soldiers, but the working men of Paris.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.7.2
  kind: p
  original: During the whole continuance of the siege, the Bonapartist cut-throats, whom Trochu had wisely entrusted with the command of the Paris army, exchanged, in their intimate correspondence, ribald jokes at the well-understood mockery of defence.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.7.3
  kind: p
  original: (See, for instance, the correspondence of Alphonse Simon Guiod, supreme commander of the artillery of the Army of Defence of Paris and Grand Cross of the Legion of Honor, to Suzanne, general of division of artillery, a correspondence published by the Journal officiel of the Commune.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.7.4
  kind: p
  original: The mask of the true heroism was at last dropped on January 28, 1871.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.7.5
  kind: p
  original: With the true heroism of utter self-debasement, the Government of National Defence, in their capitulation, came out as the government of France by Bismarck's prisoners - a part so base that Louis Bonaparte himself had, at Sedan, shrunk from accepting it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.7.6
  kind: p
  original: After the events of March 18 on their wild flight to Versailles, the capitulards left in the hands of Paris the documentary evidence of their treason, to destroy which, as the Commune says in its manifesto to the provinces, "those men would not recoil from battering Paris into a heap of ruins washed by a sea of blood."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.8.1
  kind: p
  original: To be eagerly bent upon such a consummation, some of the leading members of the Government of Defence had, besides, most peculiar reasons of their own.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.9.1
  kind: p
  original: Shortly after the conclusion of the armistice, M. Milliere, one of the representatives of Paris to the National Assembly, now shot by express orders of Jules Favre, published a series of authentic legal documents in proof that Jules Favre, living in concubinage with the wife of a drunken resident at Algiers, had, by a most daring concoction of forgeries, spread over many years, contrived to grasp, in the name of the children of his adultery, a large succession, which made him a rich man, and that, in a lawsuit undertaken by the legitimate heirs, he only escaped exposure by the connivance of the Bonapartist tribunals.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.9.2
  kind: p
  original: As these dry legal documents were not to be got rid of by any amount of rhetorical horse-power, Jules Favre, for the first time in his life, held his tongue, quietly awaiting the outbreak of the civil war, in order, then, frantically to denounce the people of Paris as a band of escaped convicts in utter revolt against family, religion, order, and property.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.9.3
  kind: p
  original: This same forger had hardly got into power, after September 4, when he sympathetically let loose upon society Pic and Taillefer, convicted, even under the empire, of forgery in the scandalous affair of "Etendard."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.9.4
  kind: p
  original: One of these men, Taillefer, having dared to return to Paris under the Commune, was at once reinstated in prison; and then Jules Favre exclaimed, from the tribune of the National Assembly, that Paris was setting free all her jailbirds!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.10.1
  kind: p
  original: Ernest Picard, the Joe Miller of the Government of National Defence, who appointed himself Finance Minister of the republic after having in vain striven to become home minister of the empire, is the brother of one Arthur Picard, an individual expelled from the Paris Bourse as a blackleg (see report of the Prefecture of Police, dated July 13, 1867), and convicted, on his own confession, of theft of 300,000 francs, while manager of one of the branches of the Societe Generale, Rue Palestro, No.5 (see report of the Prefecture of Police, dated December 11, 1868).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.10.2
  kind: p
  original: This Arthur Picard was made by Ernest Picard the editor of his paper, l'Electeur Libre.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.10.3
  kind: p
  original: While the common run of stockjobbers were led astray by the official lies of this finance office paper, Arthur was running backwards and forwards between the finance office and the Bourse, there to discount the disasters of the French army.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.10.4
  kind: p
  original: The whole financial correspondence of that worthy pair of brothers fell into the hands of the Commune.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.11.1
  kind: p
  original: Jules Ferry, a penniless barrister before September 4, contrived, as mayor of Paris during the siege, to job a fortune out of famine.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.11.2
  kind: p
  original: The day on which he would have to give an account of his maladministration would be the day of his conviction.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.12.1
  kind: p
  original: These men, then, could find in the ruins of Paris only their tickets-of-leave; they were the very men Bismarck wanted.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.12.2
  kind: p
  original: With the help of some shuffling of cards, Thiers, hitherto the secret prompter of the government, now appeared at its head, with the tickets-of-leave men for his ministers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.13.1
  kind: p
  original: Thiers, that monstrous gnome, has charmed the French bourgeoisie for almost half a century, because he is the most consummate intellectual expression of their own class corruption.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.13.2
  kind: p
  original: Before he became a statesman, he had already proved his lying powers as an historian.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.13.3
  kind: p
  original: The chronicle of his public life is the record of the misfortunes of France.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.13.4
  kind: p
  original: Banded, before 1830, with the republicans, he slipped into office under Louis Philippe by betraying his protector Lafitte, ingratiating himself with the king by exciting mob riots against the clergy, during which the church of Saint Germain l'Auxerrois and the Archbishop's palace were plundered, and by acting the minister-spy upon, and the jail-accoucheur of the Duchess de Berry.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.13.5
  kind: p
  original: The massacre of the republicans in the Rue Transnonian, and the subsequent infamous laws of September against the press and the right of association, were his work.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.13.6
  kind: p
  original: Reappearing as the chief of the cabinet in March 1840, he astonished France with his plan for fortifying France.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.13.7
  kind: p
  original: 'To the republicans, who denounced this plan as a sinister plot against the liberty of Paris, he replied from the tribune of the Chamber of Deputies:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.14.1
  kind: p
  original: '"What!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.14.2
  kind: p
  original: To fancy that any works of fortification could ever endanger liberty!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.14.3
  kind: p
  original: And first of all you calumniate any possible government in supposing that it could some day attempt to maintain itself by bombarding the capital; but that the government would be a hundred times more impossible after its victory than before."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.15.1
  kind: p
  original: Indeed, no government would ever have dared to bombard Paris from the forts, save that government which had previously surrendered these forts to the Prussians.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.16.1
  kind: p
  original: 'When King Bomba tried his hand at Palermo, in January 1848, Thiers, then long since out of office, again rose in the Chamber of Deputies:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.17.1
  kind: p
  original: '"You know, gentlemen, what is happening at Palermo.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.17.2
  kind: p
  original: You, all of you, shake with horror on hearing that during 48 hours a large town has been bombarded - by whom?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.17.3
  kind: p
  original: Was it a foreign enemy exercising the rights of war?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.17.4
  kind: p
  original: No, gentlemen, it was by its own government.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.17.5
  kind: p
  original: And why?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.17.6
  kind: p
  original: Because the unfortunate town demanded its rights.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.17.7
  kind: p
  original: Well, then, for the demand of its rights it has got 48 hours of bombardment....
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.17.8
  kind: p
  original: Allow me to appeal to the opinion of Europe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.17.9
  kind: p
  original: It is doing a service to mankind to arise, and to make reverberate, from what is perhaps the greatest tribune in Europe, some words of indignation against such acts....
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.17.10
  kind: p
  original: When the Regent Espartero, who had rendered services to his country intended bombarding Barcelona, in order to suppress its insurrection, there arose from all parts of the world a general outcry of indignation."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.18.1
  kind: p
  original: Eighteen months afterwards, M. Thiers was amongst the fiercest defenders of the bombardment of Rome by a French army.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.18.2
  kind: p
  original: In fact, the fault of King Bomba seems to have consisted in this only - that he limited his bombardment to 48 hours.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.19.1
  kind: p
  original: 'A few days before the February Revolution, fretting at the long exile from place and pelf to which Guizot had condemned him, and sniffing in the air the scent of an approaching popular commotion, Thiers, in that pseudo-heroic style which won him the nickname Mirabeau-mouche, declared, to the Chamber of Deputies:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.20.1
  kind: p
  original: '"I am of the party of revolution, not only in France, but in Europe.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.20.2
  kind: p
  original: I wish the government of the revolution to remain in the hands of moderate men... but if that government should fall into the hand of ardent minds, even into those of radicals, I shall, for all that, not desert my cause.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.20.3
  kind: p
  original: I shall always be of the party of the revolution."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.21.1
  kind: p
  original: The February Revolution came.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.21.2
  kind: p
  original: Instead of displacing the Guizot Cabinet by the Thiers Cabinet, as the little man had dreamt, it superseded Louis Philippe by the republic.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.21.3
  kind: p
  original: On the first day of the popular victory, he carefully hid himself, forgetting that the contempt of the working men screened him from their hatred.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.21.4
  kind: p
  original: Still, with his legendary courage, he continued to shy the public stage, until the June massacres had cleared it for his sort of action.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.21.5
  kind: p
  original: Then he became the leading mind of the "Party of Order" and its parliamentary republic, that anonymous interregnum, in which all the rival factions of the ruling class conspired together to crush the people, and conspired against each other to restore to each of them its own monarchy.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.21.6
  kind: p
  original: 'Then, as now, Thiers denounced the republicans as the only obstacle to the consolidation of the republic; then, as now, he spoke to the republic as the hangman spoke to Don Carlos: "I shall assassinate thee, but for thy own good."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.21.7
  kind: p
  original: 'Now, as then, he will have to exclaim on the day after his victory: L''Empire est fait - the empire is consummated.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.22.1
  kind: p
  original: Despite his hypocritical homilies about the necessary liberties and his personal grudge against Louis Bonaparte, who had made a dupe of him, and kicked out parliamentarism - and, outside of its factitious atmosphere, the little man is conscious of withering into nothingness - he had a hand in all the infamies of the Second Empire, from the occupation of Rome by French troops to the war with Prussia, which he incited by his fierce invective against German unity - not as a cloak of Prussian despotism, but as an encroachment upon the vested right of France in German disunion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.22.2
  kind: p
  original: Fond of brandishing, with his dwarfish arms in the face of Europe, the sword of the first Napoleon, whose historical shoeblack he had become, his foreign policy always culminated in the utter humiliation of France - from the London convention of 1840 to the Paris capitulation of 1871, and the present civil war, where he hounds on the prisoners of Sedan and Metz against Paris by special permission of Bismarck.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.23.1
  kind: p
  original: Despite his versatility of talent and shiftiness of purpose, this man has his whole lifetime been wedded to the most fossil routine.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.23.2
  kind: p
  original: It is self-evident that to him the deeper undercurrents of modern society remained forever hidden; but even the most palpable changes on its surface were abhorrent to a brain (all the vitality of which) had fled to the tongue.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.23.3
  kind: p
  original: Thus, he never tired of denouncing as a sacrilege any deviation from the old French protective system.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.24.1
  kind: p
  original: When a minister of Louis Philippe, he railed at railways as a wild chimera; and when in opposition under Louis Bonaparte, he branded as a profanation every attempt to reform the rotten French army system.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.24.2
  kind: p
  original: Never in his long political career has he been guilty of a single - even the smallest - measure of any practical use.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.24.3
  kind: p
  original: Thiers was consistent only in his greed for wealth and his hatred of the men that produce it.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.24.4
  kind: p
  original: Having entered his first ministry, under Louis Philippe, poor as Job, he left it a millionaire.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.24.5
  kind: p
  original: His last ministry under the same king (of March 1, 1840) exposed him to public taunts of peculation in the Chamber of Deputies, to which he was content to reply by tears - a commodity he deals in as freely as Jules Favre, or any other crocodile.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.24.6
  kind: p
  original: At Bordeaux, his first measure for saving France from impending financial ruin was to endow himself with three millions a year, the first and the last word of the "Economical Republic," the vista of which he had opened to his Paris electors in 1869.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.24.7
  kind: p
  original: 'One of his former colleagues of the Chamber of Deputies of 1830, himself a capitalist and, nevertheless, a devoted member of the Paris Commune, M. Beslay, lately addressed Thiers thus in a public placard:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.25.1
  kind: p
  original: '"The enslavement of labor by capital has always been the cornerstone of your policy, and from the very day you saw the Republic of Labor installed at the Hotel de Ville, you have never ceased to cry out to France: ''These are criminals!''"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.26.1
  kind: p
  original: A master in small state roguery, a virtuoso in perjury and treason, a craftsman in all the petty stratagems, cunning devices, and base perfidies of parliamentary warfare; never scrupling, when out of office, to fan a revolution, and to stifle it in blood when at the helm of the state; with class prejudices standing him in the place of ideas, and vanity in the place of a heart; his private life as infamous as his public life is odious - even now, when playing the part of a French Sulla, he cannot help setting off the abomination of his deeds by the ridicule of his ostentation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.27.1
  kind: p
  original: The capitulation of Paris, by surrendering to Prussia not only Paris, but all France, closed the long-continued intrigues of treason with the enemy, which the usurpers of September 4 had begun, as Trochu himself said, on the very same day.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.27.2
  kind: p
  original: On the other hand, it initiated the civil war they were now to wage, with the assistance of Prussia, against the republic and Paris.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.27.3
  kind: p
  original: The trap was laid in the very terms of the capitulation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.27.4
  kind: p
  original: At that time, above one-third of the territory was in the hands of the enemy, the capital was cut off from the provinces, all communications were disorganized.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.27.5
  kind: p
  original: To elect, under such circumstances, a real representation of France was impossible, unless ample time were given for preparation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.27.6
  kind: p
  original: In view of this, the capitulation stipulated that a National Assembly must be elected within eight days; so that in many parts of France the news of the impending election arrived on its eve only.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.27.7
  kind: p
  original: This assembly, moreover, was, by an express clause of the capitulation, to be elected for the sole purpose of deciding on peace or war, and, eventually, to conclude a treaty of peace.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.27.8
  kind: p
  original: The population could not but feel that the terms of the armistice rendered the continuation of the war impossible, and that for sanctioning the peace imposed by Bismarck, the worst men in France were the best.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.27.9
  kind: p
  original: But not content with these precautions, Thiers even before the secret of the armistice had been broached to Paris, set out for an electioneering tour through the provinces, there to galvanize back into life the Legitimist party, which now, along with the Orleanists, had to take the place of the then impossible Bonapartists.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.27.10
  kind: p
  original: He was not afraid of them.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.27.11
  kind: p
  original: Impossible as a government of modern France, and, therefore, contemptible as rivals, what party were more eligible as tools of counter-revolution than the party whose action, in the words of Thiers himself (Chamber of Deputies, January 5, 1833), "Had always been confined to the three resources of foreign invasion, civil war, and anarchy"?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.27.12
  kind: p
  original: They verily believed in the advent of their long-expected retrospective millennium.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.27.13
  kind: p
  original: There were the heels of foreign invasion trampling upon France; there was the downfall of an empire, and the captivity of Bonaparte; and there they were themselves.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.27.14
  kind: p
  original: The wheel of history had evidently rolled back to stop at the "Chambers introuvable" of 1816.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.27.15
  kind: p
  original: In the assemblies of the republic, 1848 to 1851, they had been represented by their educated and trained parliamentary champions; it was the rank-and-file of the party which now rushed in - all the Pourceaugnacs of France.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.28.1
  kind: p
  original: As soon as this Assembly of "Rurals" had met at Bordeaux, Thiers made it clear to them that the peace preliminaries must be assented to at once, without even the honors of a parliamentary debate, as the only conditions on which Prussia would permit them to open the war against the republic and Paris, its stronghold.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.28.2
  kind: p
  original: The counter-revolution had, in fact, no time to lose.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.28.3
  kind: p
  original: The Second Empire had more than doubled the national debt, and plunged all the large towns into heavy municipal debts.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.28.4
  kind: p
  original: The war had fearfully swelled the liabilities, and mercilessly ravaged the resources of the nation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.28.5
  kind: p
  original: To complete the ruin, the Prussian Shylock was there with his bond for the keep of half a million of his soldiers on French soil, his indemnity for five milliards, and interest at 5 per cent on the unpaid instalments thereof.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.28.6
  kind: p
  original: Who was to pay this bill?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.28.7
  kind: p
  original: It was only by the violent overthrow of the republic that the appropriators of wealth could hope to shift onto the shoulders of its producers the cost of a war which they, the appropriators, had themselves originated.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.28.8
  kind: p
  original: Thus, the immense ruin of France spurred on these patriotic representatives of land and capital, under the very eyes and patronage of the invader, to graft upon the foreign war a civil war - a slaveholders' rebellion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.29.1
  kind: p
  original: There stood in the way of this conspiracy one great obstacle - Paris.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.29.2
  kind: p
  original: To disarm Paris was the first condition of success.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.29.3
  kind: p
  original: Paris was therefore summoned by Thiers to surrender its arms.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.29.4
  kind: p
  original: Then Paris was exasperated by the frantic anti-republican demonstrations of the "Rural" Assembly and by Thiers' own equivocations about the legal status of the republic; by the threat to decapitate and decapitalize Paris; the appointment of Orleanist ambassadors; Dufaure's laws on over-due commercial bills and house rents, inflicting ruin on the commerce and industry of Paris; Pouyer-Quertier's tax of two centimes upon every copy of every imaginable publication; the sentences of death against Blanqui and Flourens; the suppression of the republican journals; the transfer of the National Assembly to Versailles; the renewal of the state of siege declared by Palikao, and expired on September 4; the appointment of Vinoy, the Décembriseur, as governor of Paris - of Valentin, the imperialist gendarme, as its prefect of police - and of D'Aurelles de Paladine, the Jesuit general, as the commander-in-chief of its National Guard.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.30.1
  kind: p
  original: And now we have to address a question to M. Thiers and the men of national defence, his under-strappers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.30.2
  kind: p
  original: It is known that, through the agency of M. Pouyer-Quertier, his finance ministers, Thiers had contracted a loan of two milliards.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.30.3
  kind: p
  original: Now, is it true or not -
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.31.1
  kind: p
  original: 1. That the business was so managed that a consideration of several hundred millions was secured for the private benefit of Thiers, Jules Favre, Ernest Picard, Pouyer-Quertier, and Jules Simon? and -
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.32.1
  kind: p
  original: 2. That no money was to be paid down until after the "pacification" of Paris?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.33.1
  kind: p
  original: At all events, there must have been something very pressing in the matter, for Thiers and Jules Favre, in the name of the majority of the Bordeaux Assembly, unblushingly solicited the immediate occupation of Paris by Prussian troops.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.33.2
  kind: p
  original: Such, however, was not the game of Bismarck, as he sneeringly, and in public, told the admiring Frankfort philistines on his return to Germany.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
