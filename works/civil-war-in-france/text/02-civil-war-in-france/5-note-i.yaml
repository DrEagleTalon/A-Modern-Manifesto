- id: N1.1.1
  kind: p
  original: '"The column of prisoners halted in the Avenue Uhrich, and was drawn up, four or five deep, on the footway facing to the road.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.1.2
  kind: p
  original: General Marquis de Gallifet and his staff dismounted and commenced an inspection from the left of the line.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.1.3
  kind: p
  original: Walking down slowly and eyeing the ranks, the general stopped here and there, tapping a man on the shoulder or beckoning him out of the rear ranks.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.1.4
  kind: p
  original: In most cases, without further parley, the individual thus selected was marched out into the centre of the road, where a small supplementary column was thus soon formed....
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.1.5
  kind: p
  original: A mounted officer pointed out to General Gallifet a man and woman for some particular offence.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.1.6
  kind: p
  original: The woman, rushing out of the ranks, threw herself on her knees, and, with outstretched arms, protested her innocence in passionate terms.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.1.7
  kind: p
  original: 'The general waited for a pause, and then with most impassible face and unmoved demeanor, said: ''Madame, I have visited every theatre in Paris, your acting will have no effect on me.'''
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.1.8
  kind: p
  original: (ce n'est pas la peine de jouer la comedie)....
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.1.9
  kind: p
  original: It was not a good thing on that day to be noticeably taller, dirtier, cleaner, older, uglier than one's neighbors.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.1.10
  kind: p
  original: One individual in particular struck me as probably owing his speedy release from the ills of this world to his having a broken nose....
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.1.11
  kind: p
  original: Over a hundred being thus chosen, a firing party told off, and the column resumed its march, leaving them behind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.1.12
  kind: p
  original: A few minutes afterwards a dropping fire in our rear commenced, and continued for over a quarter of an hour.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.1.13
  kind: p
  original: It was the execution of the summarily-convicted wretches."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.1.14
  kind: p
  original: (Paris Correspondent, Daily News, June 8.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.2.1
  kind: p
  original: This Gallifet, "the kept man of his wife, so notorious for her shameless exhibitions at the orgies of the Second Empire," went, during the war, by the name of the French "Ensign Pistol."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.3.1
  kind: p
  original: '"The Temps, which is a careful journal, and not given to sensation, tells a dreadful story of people imperfectly shot and buried before life was extinct.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.3.2
  kind: p
  original: A great number were buried in the Square round St. Jacques-la-Bouchiere; some of them very superficially.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.3.3
  kind: p
  original: In the daytime the roar of the busy streets prevented any notice being taken; but in the stillness of the night the inhabitants of the houses in the neighborhood were roused by distant moans, and in the morning a clenched hand was seen protruding through the soil.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.3.4
  kind: p
  original: In consequence of this, exhumations were ordered to take place.... that many wounded have been buried alive I have not the slightest doubt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.3.5
  kind: p
  original: One case I can vouch for.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.3.6
  kind: p
  original: When Brunel was shot with his mistress on the 24th ult. in the courtyard of a house in the place Vendome, the bodies lay there until the afternoon of the 27th.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.3.7
  kind: p
  original: When the burial party came to remove the corpses, they found the woman still living, and took her to an ambulance.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: N1.3.8
  kind: p
  original: Though she had received four bullets she is now out of danger."
  en: ''
  modern: ''
  modern_status: empty
