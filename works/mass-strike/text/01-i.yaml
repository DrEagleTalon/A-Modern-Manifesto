verses:
- id: I.0.1
  kind: heading
  original: I.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.1.1
  kind: p
  original: Fast alle bisherigen Schriften und Äußerungen des internationalen Sozialismus über die Frage des Massenstreiks datieren aus der Zeit vor der russischen Revolution, dem ersten geschichtlichen Experiment mit diesem Kampfmittel auf größter Skala.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.1.2
  kind: p
  original: Daher erklärt sich auch, daß sie meistenteils antiquiert sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.1.3
  kind: p
  original: 'In ihrer Auffassung stehen sie wesentlich auf demselben Standpunkt wie Friedrich Engels, der 1873 in seiner Kritik der Bakunistischen Revolutionsmacherei in Spanien schrieb:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.1
  kind: p
  original: '"Der allgemeine Streik ist im Bakunistischen Programm der Hebel, der zur Einleitung der sozialen Revolution angesetzt wird.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.2
  kind: p
  original: Eines schönen Morgens legen alle Arbeiter aller Gewerke eines Landes oder gar der ganzen Welt die Arbeit nieder und zwingen dadurch in längstens vier Wochen die besitzenden Klassen, entweder zu Kreuze zu kriechen oder auf die Arbeiter loszuschlagen, so daß diese dann das Recht haben, sich zu verteidigen und bei dieser Gelegenheit die ganze alte Gesellschaft über den Haufen zu werfen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.3
  kind: p
  original: Der Vorschlag ist weit entfernt davon, neu zu sein; französische und nach ihnen belgische Sozialisten haben seit 1848 dies Paradepferd stark geritten, das aber ursprünglich englischer Rasse ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.4
  kind: p
  original: 'Während der auf die Krise von 1837 folgenden raschen und heftigen Entwicklung des Chartismus unter den englischen Arbeitern war schon 1839 der "heilige Monat" gepredigt worden, die Arbeitseinstellung auf nationalem Maßstab (siehe Engels: "Lage der arbeitenden Klasse", zweite Auflage, Seite 234), und hatte solchen Anklang gefunden, dass die Fabrikarbeiter von Nordengland im Juli 1842 die Sache auszuführen versuchten.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.5
  kind: p
  original: -- Auch auf dem Genfer Allianzistenkongreß vom 1. September 1873 spielte der allgemeine Streik eine große Rolle, nur wurde allseitig zugegeben, dass dazu eine vollständige Organisation der Arbeiterklasse und eine gefüllte Kasse nötig sei.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.6
  kind: p
  original: Und darin liegt eben der Haken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.7
  kind: p
  original: Einerseits werden die Regierungen, besonders wenn man sie durch politische Enthaltung ermutigt, weder die Organisation noch die Kasse der Arbeiter je soweit kommen lassen, und anderseits werden die politischen Ereignisse und die Übergriffe der herrschenden Klassen die Befreiung der Arbeiter zu Wege bringen, lange bevor das Proletariat dazu kommt, sich diese ideale Organisation und diesen kolossalen Reservefonds anzuschaffen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.2.8
  kind: p
  original: Hätte es sie aber, so brauchte es nicht den Umweg des allgemeinen Streiks, um zum Ziele zu gelangen."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N1
- id: I.3.1
  kind: p
  original: Hier haben wir die Argumentation, die für die Stellungnahme der internationalen Sozialdemokratie zum Massenstreik in den folgenden Jahrzehnten maßgebend war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.3.2
  kind: p
  original: 'Sie ist ganz auf die anarchistische Theorie des Generalstreiks zugeschnitten, d. h. auf die Theorie vom Generalstreik als Mittel, die soziale Revolution einzuleiten, im Gegensatz zum täglichen politischen Kampf der Arbeiterklasse, und erschöpft sich in dem folgenden einfachen Dilemma: entweder ist das gesamte Proletariat noch nicht im Besitz mächtiger Organisationen und Kassen, dann kann es den Generalstreik nicht durchführen, oder es ist bereits mächtig genug organisiert, dann braucht es den Generalstreik nicht.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.3.3
  kind: p
  original: Diese Argumentation ist allerdings so einfach und auf den ersten Blick so unanfechtbar, daß sie ein Vierteljahrhundert lang der modernen Arbeiterbewegung ausgezeichnete Dienste leistete, als logische Waffe wider die anarchistischen Hirngespinnste und als Hülfsmittel, um die Idee des politischen Kampfes in die weitesten Kreise der Arbeiterschaft zu tragen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.3.4
  kind: p
  original: Die großartigen Fortschritte der Arbeiterbewegung in allen modernen Ländern während der letzten 25 Jahre sind der glänzendste Beweis für die von Marx und Engels im Gegensatz zum Bakunismus verfochtene Taktik des politischen Kampfes, und die deutsche Sozialdemokratie in ihrer heutigen Macht, in ihrer Stellung als Vorhut der gesamten internationalen Arbeiterbewegung, ist nicht zum geringsten das direkte Produkt der konsequenten und nachdrücklichen Anwendung dieser Taktik.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.1
  kind: p
  original: Die russische Revolution hat nun die obige Argumentation einer gründlichen Revision unterzogen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.2
  kind: p
  original: Sie hat zum ersten Male in der Geschichte der Klassenkämpfe eine grandiose Verwirklichung der Idee des Massenstreiks und -- wie wir unten näher ausführen werden -- selbst des Generalstreiks gezeitigt und damit eine neue Epoche in der Entwicklung der Arbeiterbewegung eröffnet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.3
  kind: p
  original: Freilich folgt daraus nicht etwa, daß die von Marx und Engels empfohlene Taktik des politischen Kampfes oder ihre an dem Anarchismus geübte Kritik falsch war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.4
  kind: p
  original: Umgekehrt, es sind dieselben Gedankengänge, dieselbe Methode, die der Marx-Engelschen Taktik, die auch der bisherigen Praxis der deutschen Sozialdemokratie zu grunde lagen, welche jetzt in der russischen Revolution ganz neue Momente und neue Bedingungen des Klassenkampfes erzeugten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.5
  kind: p
  original: Die russische Revolution, dieselbe Revolution, die die erste geschichtliche Probe auf das Exempel des Massenstreiks bildet, bedeutet nicht bloß keine Ehrenrettung für den Anarchismus, sondern sie bedeutet geradezu eine geschichtliche Liquidation des Anarchismus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.6
  kind: p
  original: Das triste Dasein, wozu diese Geistesrichtung von der mächtigen Entwicklung der Sozialdemokratie in Deutschland in den letzten Jahrzehnten verurteilt war, mochte gewissermaßen durch die ausschließliche Herrschaft und lange Dauer der parlamentarischen Periode erklärt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.7
  kind: p
  original: Eine ganz auf das "Losschlagen" und die "direkte Aktion" zugeschnittene, im nacktesten Heugabelsinne "revolutionäre" Richtung mochte immerhin in der Windstille des parlamentarischen Alltags nur zeitweilig verkümmern, um erst bei einer Wiederkehr der direkten offenen Kampfperiode, bei einer Straßenrevolution aufzuleben und ihre innere Kraft zu entfalten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.8
  kind: p
  original: Zumal schien Rußland besonders dazu angetan, das Experimentierfeld für die Heldentaten des Anarchismus zu werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.9
  kind: p
  original: Ein Land, wo das Proletariat gar keine politischen Rechte und eine äußerst schwache Organisation hatte, ein buntes Durcheinander verschiedener Volksschichten mit sehr verschiedenen, wirr durcheinanderlaufenden Interessen, geringe Bildung der Volksmasse, dafür äußerste Bestialität in der Gewaltanwendung seitens des herrschenden Regimes -- alles das schien wie geschaffen, um den Anarchismus zu einer plötzlichen, wenn auch vielleicht kurzlebigen Macht zu erheben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.10
  kind: p
  original: Und schließlich war Rußland die geschichtliche Geburtsstätte des Anarchismus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.11
  kind: p
  original: Allein, das Vaterland Bakunins sollte für seine Lehre zur Grabesstätte werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.12
  kind: p
  original: Nicht bloß standen und stehen in Rußland nicht die Anarchisten an der Spitze der Massenstreikbewegung; nicht bloß liegt die ganze politische Führung der revolutionären Aktion und auch des Massenstreiks in den Händen der sozialdemokratischen Organisationen, die von den russischen Anarchisten als "bürgerliche Partei" bitter bekämpft werden, oder zum Teil in den Händen solcher mehr oder weniger von der Sozialdemokratie beeinflußten und sich ihr annähernden sozialistischen Organisationen, wie die terroristische Partei der "Sozialisten-Revolutionäre", -- die Anarchisten existieren als ernste politische Richtung überhaupt in der russischen Revolution gar nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.13
  kind: p
  original: Nur in einer litauischen Kleinstadt mit besonders schwierigen Verhältnissen -- bunte nationale Zusammenwürfelung der Arbeiter, überwiegende Zersplitterung des Kleinbetriebs, sehr tiefstehendes Proletariat --, in Bialystok, gibt es unter den sieben oder acht verschiedenen revolutionären Gruppen auch ein Häuflein halbwüchsiger "Anarchisten", das die Konfusion und Verwirrung der Arbeiterschaft nach Kräften fördert, und letzthin macht sich in Moskau und vielleicht noch in zwei bis drei Städten je ein Häuflein dieser Gattung bemerkbar.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.14
  kind: p
  original: Allein, was ist jetzt, abgesehen von diesen paar "revolutionären" Gruppen, die eigentliche Rolle des Anarchismus in der russischen Revolution?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.15
  kind: p
  original: Er ist zum Aushängeschild für gemeine Diebe und Plünderer geworden; unter der Firma des "Anarcho-Kommunismus" wird ein großer Teil jener unzähligen Diebstähle und Plündereien bei Privatleuten ausgeübt, die in jeder Periode der Depression, der momentanen Defensive der Revolution wie eine trübe Welle emporkommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.16
  kind: p
  original: Der Anarchismus ist in der russischen Revolution nicht die Theorie des kämpfenden Proletariats, sondern das ideologische Aushängeschild des kontrerevolutionären Lumpenproletariats geworden, das wie ein Rudel Haifische hinter dem Schlachtschiff der Revolution wimmelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.4.17
  kind: p
  original: Und damit ist die geschichtliche Laufbahn des Anarchismus wohl beendet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.5.1
  kind: p
  original: Auf der anderen Seite ist der Massenstreik in Rußland verwirklicht worden nicht als ein Mittel, unter Umgehung des politischen Kampfes der Arbeiterklasse und speziell des Parlamentarismus durch einen Theatercoup plötzlich in die soziale Revolution hineinzuspringen, sondern als ein Mittel, erst die Bedingungen des täglichen politischen Kampfes und insbesondere des Parlamentarismus für das Proletariat zu schaffen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.5.2
  kind: p
  original: Der revolutionäre Kampf in Rußland, in dem die Massenstreiks als die wichtigste Waffe zur Anwendung kommen, wird von dem arbeitenden Volke und in erster Reihe vom Proletariat gerade um dieselben politischen Rechte und Bedingungen geführt, deren Notwendigkeit und Bedeutung im Emanzipationskampfe der Arbeiterklasse Marx und Engels zuerst nachgewiesen und im Gegensatz zum Anarchismus in der Internationale mit aller Macht verfochten haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.5.3
  kind: p
  original: So hat die geschichtliche Dialektik, der Fels, auf dem die ganze Lehre des Marxschen Sozialismus beruht, es mit sich gebracht, daß heute der Anarchismus, mit dem die Idee des Massenstreiks unzertrennlich verknüpft war, zu der Praxis des Massenstreiks selbst in einen Gegensatz gerathen ist, während umgekehrt der Massenstreik, der als der Gegensatz zur politischen Betätigung des Proletariats bekämpft wurde, heute als die mächtigste Waffe des politischen Kampfes um politische Rechte erscheint.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.5.4
  kind: p
  original: Wenn also die russische Revolution eine gründliche Revision des alten Standpunkts des Marxismus zum Massenstreik erforderlich macht, so ist es wieder nur der Marxismus, dessen allgemeine Methoden und Gesichtspunkte dabei in neuer Gestalt den Sieg davontragen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.5.5
  kind: p
  original: Moors Geliebte kann nur durch Moor sterben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
