section: IV
title_original: IV.
title_en: Part IV
author: Rosa Luxemburg
date: '1906'
original_language: de
anchor_language: de
source_original: 'Rosa Luxemburg, Massenstreik, Partei und Gewerkschaften (Hamburg: Erdmann Dubber, 1906), public domain; Project Gutenberg ebook 31614'
source_en: 'None yet: Patrick Lavin''s translation (Detroit 1925) is not on a reachable mirror'
verses:
- id: IV.0.1
  kind: heading
  original: IV.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.1.1
  kind: p
  original: Wir haben im vorigen in wenigen knappen Zügen die Geschichte der Massenstreiks in Rußland zu skizzieren gesucht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.1.2
  kind: p
  original: Schon ein flüchtiger Blick auf diese Geschichte zeigt uns ein Bild, das in keinem Strich demjenigen ähnelt, welches man sich bei der Diskussion in Deutschland gewöhnlich vom Massenstreik macht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.1.3
  kind: p
  original: Statt des starren und hohlen Schemas einer auf Beschluß der höchsten Instanzen mit Plan und Umsicht ausgeführten trocknen politischen "Aktion", sehen wir ein Stück lebendiges Leben aus Fleisch und Blut, das sich gar nicht aus dem großen Rahmen der Revolution herausschneiden läßt, das durch tausend Adern mit dem ganzen Drum und Dran der Revolution verbunden ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.1
  kind: p
  original: Der Massenstreik, wie ihn uns die russische Revolution zeigt, ist eine so wandelbare Erscheinung, daß er alle Phasen des politischen und ökonomischen Kampfes, alle Stadien und Momente der Revolution in sich spiegelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.2
  kind: p
  original: Seine Anwendbarkeit, seine Wirkungskraft, seine Entstehungsmomente ändern sich fortwährend.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.3
  kind: p
  original: Er eröffnet plötzlich neue, weite Perspektiven der Revolution, wo sie bereits in einen Engpaß geraten schien, und er versagt, wo man auf ihn mit voller Sicherheit glaubt rechnen zu können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.4
  kind: p
  original: Er flutet bald wie eine breite Meereswoge über das ganze Reich, bald zerteilt er sich in ein Riesennetz dünner Ströme; bald sprudelt er aus dem Untergrunde wie ein frischer Quell, bald versickert er ganz im Boden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.5
  kind: p
  original: Politische und ökonomische Streiks, Massenstreiks und partielle Streiks, Demonstrationsstreiks und Kampfstreiks, Generalstreiks einzelner Branchen und Generalstreiks einzelner Städte, ruhige Lohnkämpfe und Straßenschlachten, Barrikadenkämpfe -- alles das läuft durcheinander, nebeneinander, durchkreuzt sich, flutet ineinander über; es ist ein ewig bewegliches, wechselndes Meer von Erscheinungen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.6
  kind: p
  original: 'Und das Bewegungsgesetz dieser Erscheinungen wird klar: Es liegt nicht in dem Massenstreik selbst, nicht in seinen technischen Besonderheiten, sondern in dem politischen und sozialen Kräfteverhältnis der Revolution.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.7
  kind: p
  original: Der Massenstreik ist bloß die Form des revolutionären Kampfes und jede Verschiebung im Verhältnis der streitenden Kräfte, in der Parteientwicklung und der Klassenscheidung, in der Position der Kontrerevolution, alles das beeinflußt sofort auf tausend unsichtbaren, kaum kontrollierbaren Wegen die Streikaktion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.8
  kind: p
  original: Dabei hört aber die Streikaktion selbst fast keinen Augenblick auf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.9
  kind: p
  original: Sie ändert bloß ihre Formen, ihre Ausdehnung, ihre Wirkung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.10
  kind: p
  original: Sie ist der lebendige Pulsschlag der Revolution und zugleich ihr mächtigstes Triebrad.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.2.11
  kind: p
  original: 'Mit einem Wort: der Massenstreik, wie ihn uns die russische Revolution zeigt, ist nicht ein pfiffiges Mittel, ausgeklügelt zum Zwecke einer kräftigeren Wirkung des proletarischen Kampfes, sondern er ist die Bewegungsweise der proletarischen Masse, die Erscheinungsform des proletarischen Kampfes in der Revolution.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.3.1
  kind: p
  original: Daraus lassen sich für die Beurteilung des Massenstreikproblems einige allgemeine Gesichtspunkte ableiten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.4.1
  kind: p
  original: 1. Es ist gänzlich verkehrt, sich den Massenstreik als einen Akt, eine Einzelhandlung zu denken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.4.2
  kind: p
  original: Der Massenstreik ist vielmehr die Bezeichnung, der Sammelbegriff einer ganzen jahrelangen, vielleicht jahrzehntelangen Periode des Klassenkampfes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.4.3
  kind: p
  original: 'Von den unzähligen verschiedensten Massenstreiks, die sich in Rußland seit vier Jahren abgespielt haben, paßt das Schema des Massenstreiks als eines rein politischen, nach Plan und Absicht hervorgerufenen und abgeschlossenen, kurzen Einzelaktes lediglich auf eine und zwar untergeordnete Spielart: auf den reinen Demonstrationsstreik.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.4.4
  kind: p
  original: Im ganzen Verlauf der fünfjährigen Periode sehen wir in Rußland bloß einige wenige Demonstrationsstreiks, die sich notabene gewöhnlich nur auf einzelne Städte beschränken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.4.5
  kind: p
  original: So der jährliche Maifeier-Generalstreik in Warschau und in Lodz -- im eigentlichen Rußland ist der 1. Mai bis jetzt noch nicht in nennenswertem Umfange durch Arbeitsruhe gefeiert worden; der Massenstreik in Warschau am 11. September 1905 als Trauerfeier zu Ehren des hingerichteten Martin Kasprzak, im November 1905 in Petersburg als Protestkundgebung gegen die Erklärung des Belagerungszustandes in Polen und Livland, am 22. Januar 1906 in Warschau, Lodz, Czenstochau und dem Dombrowaer Kohlenbecken, sowie zum Teil in einigen russischen Städten als Jahresfeier des Gedenktages des Petersburger Blutbades; ferner im Juli 1906 ein Generalstreik in Tiflis als Sympathiekundgebung für die vom Kriegsgericht wegen der Militärrevolte abgeurteilten Soldaten, endlich aus gleichem Anlaß im September d. J. während der Verhandlung des Kriegsgerichts in Reval.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.4.6
  kind: p
  original: Alle übrigen großen und partiellen Massenstreiks und Generalstreiks waren nicht Demonstrations- sondern Kampfstreiks, und als solche entstanden sie meistens spontan, jedesmal aus spezifischen lokalen zufälligen Anlässen, ohne Plan und Absicht und wuchsen sich mit elementarer Macht zu großen Bewegungen aus, wobei sie nicht einen "geordneten Rückzug" antraten, sondern sich bald in ökonomischen Kampf verwandelten, bald in Straßenkampf, bald fielen sie von selbst zusammen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.1
  kind: p
  original: In diesem allgemeinen Bilde spielen die reinen politischen Demonstrationsstreiks eine ganz untergeordnete Rolle -- die einzelner kleiner Punkte mitten unter gewaltigen Flächen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.2
  kind: p
  original: 'Dabei läßt sich, zeitlich betrachtet, folgender Zug wahrnehmen: Die Demonstrationsstreiks, die im Unterschied von den Kampfstreiks das größte Maß von Parteidisziplin, bewußter Leitung und politischem Gedanken aufweisen, also nach dem Schema als die höchste und reifste Form der Massenstreiks erscheinen müßten, spielen in Wahrheit die größte Rolle in den Anfängen der Bewegung.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.3
  kind: p
  original: So war z. B. die absolute Arbeitsruhe am 1. Mai 1905 in Warschau, als der erste Fall eines so staunenswert durchgeführten Beschlusses der Sozialdemokratie, für die proletarische Bewegung in Polen ein Ereignis von großer Tragweite.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.4
  kind: p
  original: Ebenso hat der Sympathiestreik im November des gleichen Jahres in Petersburg als die erste Probe einer bewußten planmäßigen Massenaktion in Rußland großen Eindruck gemacht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.5
  kind: p
  original: Genau so wird auch der "Probemassenstreik" der Hamburger Genossen vom 17. Januar 1906 eine hervorragende Rolle in der Geschichte der künftigen deutschen Massenstreiks spielen, als der erste frische Versuch mit der soviel umstrittenen Waffe und zwar als ein so wohlgelungener, von der Kampfstimmung und Kampffreude der Hamburger Arbeiterschaft so überzeugend sprechender Versuch.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.6
  kind: p
  original: Und ebenso sicher wird die Periode der Massenstreiks in Deutschland, wenn sie einmal im Ernst begonnen hat, von selbst zu einer wirklichen allgemeinen Arbeitsruhe am 1. Mai führen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.7
  kind: p
  original: Die Maifeier dürfte naturgemäß als die erste große Demonstration im Zeichen der Massenkämpfe zu Ehren kommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.8
  kind: p
  original: In diesem Sinne hat der "lahme Gaul", wie die Maifeier auf dem Kölner Gewerkschaftskongreß genannt wurde, noch eine große Zukunft und eine wichtige Rolle im proletarischen Klassenkampfe in Deutschland vor sich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.9
  kind: p
  original: Allein mit der Entwicklung der ernsten revolutionären Kämpfe nimmt die Bedeutung solcher Demonstrationen rasch ab.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.10
  kind: p
  original: 'Gerade dieselben Momente, die das Zustandekommen der Demonstrationsstreiks nach vorgefaßtem Plan und auf die Parole der Parteien hin objektiv ermöglichen: das Wachstum des politischen Bewußtseins und der Schulung des Proletariats, machen diese Art von Massenstreiks unmöglich: heute will das Proletariat in Rußland, und zwar gerade die tüchtigste Vorhut der Masse, von Demonstrationsstreiks nichts wissen; die Arbeiter verstehen keinen Spaß mehr und wollen nunmehr bloß an ernsten Kampf mit allen seinen Konsequenzen denken.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.5.11
  kind: p
  original: Und wenn in dem ersten großen Massenstreik im Januar 1905 das demonstrative Element, zwar nicht in absichtlicher, sondern mehr in instinktiver, spontaner Form, noch eine große Rolle spielte, so scheiterte umgekehrt der Versuch des Zentralkomitees der russischen Sozialdemokratie, im August einen Massenstreik als Kundgebung für die aufgelöste Duma hervorzurufen, unter anderem an der entschiedenen Abneigung des geschulten Proletariats gegen schwächliche Halbaktionen und bloße Demonstrationen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.6.1
  kind: p
  original: 2. Wenn wir aber anstatt der untergeordneten Spielart des demonstrativen Streiks den Kampfstreik ins Auge fassen, wie er im heutigen Rußland den eigentlichen Träger der proletarischen Aktion darstellt, so fällt weiter ins Auge, daß darin das ökonomische und das politische Moment unmöglich voneinander zu trennen sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.6.2
  kind: p
  original: Auch hier weicht die Wirklichkeit von dem theoretischen Schema weit ab, und die pedantische Vorstellung, in der der reine politische Massenstreik logisch von dem gewerkschaftlichen Generalstreik als die reifste und höchste Stufe abgeleitet, aber zugleich klar auseinandergehalten wird, ist von der Erfahrung der russischen Revolution gründlich widerlegt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.6.3
  kind: p
  original: Dies äußert sich nicht bloß geschichtlich darin, daß die Massenstreiks, von jenem ersten großen Lohnkampf der Petersburger Textilarbeiter im Jahre 1896-1897 bis zu dem letzten großen Massenstreik im Dezember 1905, ganz unmerklich aus ökonomischen in politische übergehen, so daß es fast unmöglich ist, die Grenze zwischen beiden zu ziehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.6.4
  kind: p
  original: Auch jeder einzelne von den großen Massenstreiks wiederholt sozusagen im kleinen die allgemeine Geschichte der russischen Massenstreiks und beginnt mit einem rein ökonomischen oder jedenfalls partiellen gewerkschaftlichen Konflikt, um die Stufenleiter bis zur politischen Kundgebung zu durchlaufen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.6.5
  kind: p
  original: Das große Massenstreikgewitter im Süden Rußlands 1902 und 1903 entstand, wie wir gesehen, in Baku aus einem Konflikt infolge der Maßregelung Arbeitsloser, in Rostow aus Lohndifferenzen in den Eisenbahnwerkstätten, in Tiflis aus einem Kampf der Handelsangestellten um die Verkürzung der Arbeitszeit, in Odessa aus einem Lohnkampf in einer einzelnen kleinen Fabrik.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.6.6
  kind: p
  original: Der Januar-Massenstreik 1905 entwickelt sich aus dem internen Konflikt in den Putilow-Werken, der Oktoberstreik aus dem Kampf der Eisenbahner um die Pensionskasse, der Dezemberstreik endlich aus dem Kampf der Post- und Telegraphenangestellten um das Koalitionsrecht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.6.7
  kind: p
  original: Der Fortschritt der Bewegung im ganzen äußert sich nicht darin, daß das ökonomische Anfangsstadium ausfällt, sondern vielmehr in der Rapidität, womit die Stufenleiter zur politischen Kundgebung durchlaufen wird und in der Extremität des Punktes, bis zu dem sich der Massenstreik voranbewegt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.7.1
  kind: p
  original: Allein die Bewegung im ganzen geht nicht bloß nach der Richtung vom ökonomischen zum politischen Kampf, sondern auch umgekehrt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.7.2
  kind: p
  original: Jede von den großen politischen Massenaktionen schlägt, nachdem sie ihren politischen Höhepunkt erreicht hat, in einen ganzen Wust ökonomischer Streiks um.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.7.3
  kind: p
  original: Und dies bezieht sich wieder nicht bloß auf jeden einzelnen von den großen Massenstreiks, sondern auch auf die Revolution im ganzen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.7.4
  kind: p
  original: Mit der Verbreitung, Klärung und Potenzierung des politischen Kampfes tritt nicht bloß der ökonomische Kampf nicht zurück, sondern er verbreitet sich, organisiert sich und potenziert sich seinerseits in gleichem Schritt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.7.5
  kind: p
  original: Es besteht zwischen beiden eine völlige Wechselwirkung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.8.1
  kind: p
  original: Jeder neue Anlauf und neue Sieg des politischen Kampfes verwandelt sich in einen mächtigen Anstoß für den wirtschaftlichen Kampf, indem er zugleich seine äußeren Möglichkeiten erweitert und den inneren Antrieb der Arbeiter, ihre Lage zu bessern, ihre Kampflust erhöht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.8.2
  kind: p
  original: Nach jeder schäumenden Welle der politischen Aktion bleibt ein befruchtender Niederschlag zurück, aus dem sofort tausendfältige Halme des ökonomischen Kampfes emporschießen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.8.3
  kind: p
  original: Und umgekehrt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.8.4
  kind: p
  original: Der unaufhörliche ökonomische Kriegszustand der Arbeiter mit dem Kapital hält die Kampfenergie in allen politischen Pausen wach, er bildet sozusagen das ständige frische Reservoir der proletarischen Klassenkraft, aus dem der politische Kampf immer von neuem seine Macht hervorholt, und zugleich führt das unermüdliche ökonomische Bohren des Proletariats alle Augenblicke bald hier, bald dort zu einzelnen scharfen Konflikten, aus denen unversehens politische Konflikte auf großem Maßstab explodieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.9.1
  kind: p
  original: 'Mit einem Wort: Der ökonomische Kampf ist das Fortleitende von einem politischen Knotenpunkt zum andern, der politische Kampf ist die periodische Befruchtung des Bodens für den ökonomischen Kampf.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.9.2
  kind: p
  original: Ursache und Wirkung wechseln hier alle Augenblicke ihre Stellen, und so bilden das ökonomische und das politische Moment in der Massenstreikperiode, weit entfernt, sich reinlich zu scheiden oder gar auszuschließen, wie es das pedantische Schema will, vielmehr nur zwei ineinandergeschlungene Seiten des proletarischen Klassenkampfes in Rußland.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.9.3
  kind: p
  original: Und ihre Einheit ist eben der Massenstreik.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.9.4
  kind: p
  original: Wenn die spintisierende Theorie, um zu dem "reinen politischen Massenstreik" zu gelangen, eine künstliche logische Sektion an dem Massenstreik vornimmt, so wird bei diesem Sezieren, wie bei jedem anderen, die Erscheinung nicht in ihrem lebendigen Wesen erkannt, sondern bloß abgetötet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.10.1
  kind: p
  original: 3. Endlich zeigen uns die Vorgänge in Rußland, daß der Massenstreik von der Revolution unzertrennlich ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.10.2
  kind: p
  original: Die Geschichte der russischen Massenstreiks das ist die Geschichte der russischen Revolution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.10.3
  kind: p
  original: 'Wenn freilich die Vertreter unseres deutschen Opportunismus von "Revolution" hören, so denken sie sofort an Blutvergießen, Straßenschlachten, an Pulver und Blei, und der logische Schluß daraus ist: der Massenstreik führt unvermeidlich zur Revolution, ergo dürfen wir ihn nicht machen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.10.4
  kind: p
  original: In der Tat sehen wir in Rußland, daß beinahe jeder Massenstreik im letzten Schluß auf ein Renkontre mit den bewaffneten Hütern der zarischen Ordnung hinausläuft; darin sind die sogenannten politischen Streiks den größeren ökonomischen Kämpfen ganz gleich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.10.5
  kind: p
  original: Allein die Revolution ist etwas anderes und etwas mehr als Blutvergießen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.10.6
  kind: p
  original: Im Unterschied von der polizeilichen Auffassung, die die Revolution ausschließlich vom Standpunkte der Straßenunruhen und Krawalle, d. h. vom Standpunkte der "Unordnung" ins Auge faßt, erblickt die Auffassung des wissenschaftlichen Sozialismus in der Revolution vor allem eine tiefgehende innere Umwälzung in den sozialen Klassenverhältnissen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.10.7
  kind: p
  original: Und von diesem Standpunkt besteht zwischen Revolution und Massenstreik in Rußland auch noch ein ganz anderer Zusammenhang als der von der trivialen Wahrnehmung konstatierte, daß der Massenstreik gewöhnlich im Blutvergießen endet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.11.1
  kind: p
  original: Wir haben oben den inneren Mechanismus der russischen Massenstreiks gesehen, der auf der unaufhörlichen Wechselwirkung des politischen und des ökonomischen Kampfes beruht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.11.2
  kind: p
  original: Aber gerade diese Wechselwirkung ist bedingt durch die Revolutionsperiode.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.11.3
  kind: p
  original: Nur in der Gewitterluft der revolutionären Periode vermag sich nämlich jeder partielle kleine Konflikt zwischen Arbeit und Kapital zu einer allgemeinen Explosion auszuwachsen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.11.4
  kind: p
  original: In Deutschland passieren jährlich und täglich die heftigsten, brutalsten Zusammenstöße zwischen Arbeitern und Unternehmern, ohne daß der Kampf die Schranken der betreffenden einzelnen Branche oder der einzelnen Stadt, ja Fabrik überspringt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.11.5
  kind: p
  original: Maßregelungen organisierter Arbeiter wie in Petersburg, Arbeitslosigkeit wie in Baku, Lohnkonflikte wie in Odessa, Kämpfe um das Koalitionsrecht wie in Moskau sind in Deutschland auf der Tagesordnung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.11.6
  kind: p
  original: Kein einziger dieser Fälle schlägt jedoch in eine gemeinsame Klassenaktion um.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.11.7
  kind: p
  original: Und wenn sie sich selbst zu einzelnen Massenstreiks auswachsen, die zweifellos einen politischen Anstrich haben, so entzünden sie auch dann noch kein allgemeines Gewitter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.11.8
  kind: p
  original: Der Generalstreik der holländischen Eisenbahner, der trotz wärmster Sympathien mitten in völliger Unbeweglichkeit des Proletariats im Lande verblutete, liefert einen frappanten Beweis dafür.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.12.1
  kind: p
  original: Und umgekehrt, nur in der Revolutionsperiode, wo die sozialen Fundamente und die Mauern der Klassengesellschaft aufgelockert und in ständiger Verschiebung begriffen sind, vermag jede politische Klassenaktion des Proletariats in wenigen Stunden ganze, bis dahin unberührte Schichten der Arbeiterschaft aus der Unbeweglichkeit zu reißen, was sich sofort naturgemäß in einem stürmischen ökonomischen Kampf äußert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.12.2
  kind: p
  original: 'Der plötzlich durch den elektrischen Schlag einer politischen Aktion wachgerüttelte Arbeiter greift im nächsten Augenblick vor allem zu dem nächstliegenden: zur Abwehr gegen sein ökonomisches Sklavenverhältnis; die stürmische Geste des politischen Kampfes läßt ihn plötzlich mit ungeahnter Intensität die Schwere und den Druck seiner ökonomischen Ketten fühlen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.12.3
  kind: p
  original: 'Und während z. B. der heftigste politische Kampf in Deutschland: der Wahlkampf oder der parlamentarische Kampf um den Zolltarif kaum einen vernehmbaren direkten Einfluß auf den Verlauf und die Intensität der gleichzeitig in Deutschland geführten Lohnkämpfe ausübt, äußert sich jede politische Aktion des Proletariats in Rußland sofort in der Erweiterung und Vertiefung der Fläche des wirtschaftlichen Kampfes.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.13.1
  kind: p
  original: So schafft also die Revolution erst die sozialen Bedingungen, in denen jenes unmittelbare Umschlagen des ökonomischen Kampfes in politischen und des politischen Kampfes in ökonomischen ermöglicht wird, das im Massenstreik seinen Ausdruck findet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.13.2
  kind: p
  original: 'Und wenn das vulgäre Schema den Zusammenhang zwischen Massenstreik und Revolution nur in den blutigen Straßen-Renkontres erblickt, mit denen die Massenstreiks abschließen, so zeigt uns ein etwas tieferer Blick in die russischen Vorgänge einen ganz umgekehrten Zusammenhang: in Wirklichkeit produziert nicht der Massenstreik die Revolution, sondern die Revolution produziert den Massenstreik.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.1
  kind: p
  original: 4. Es genügt, das Bisherige zusammenzufassen, um auch über die Frage der bewußten Leitung und der Initiative bei dem Massenstreik Aufschluß zu bekommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.2
  kind: p
  original: Wenn der Massenstreik nicht einen einzelnen Akt, sondern eine ganze Periode des Klassenkampfes bedeutet, und wenn diese Periode mit einer Revolutionsperiode identisch ist, so ist es klar, daß der Massenstreik nicht aus freien Stücken hervorgerufen werden kann, auch wenn der Entschluß dazu von der höchsten Instanz der stärksten sozialdemokratischen Partei ausgehen mag.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.3
  kind: p
  original: Solange die Sozialdemokratie es nicht in ihrer Hand hat, nach eigenem Ermessen Revolutionen zu inszenieren und abzusagen, genügt auch nicht die größte Begeisterung und Ungeduld der sozialdemokratischen Truppen dazu, eine wirkliche Periode der Massenstreiks als eine lebendige mächtige Volksbewegung ins Leben zu rufen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.4
  kind: p
  original: Auf Grund der Entschlossenheit einer Parteileitung und der Parteidisziplin der sozialdemokratischen Arbeiterschaft kann man wohl eine einmalige kurze Demonstration veranstalten, wie der schwedische Massenstreik oder die jüngsten österreichischen oder auch der Hamburger Massenstreik vom 17. Januar.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.5
  kind: p
  original: Diese Demonstrationen unterscheiden sich aber von einer wirklichen Periode revolutionärer Massenstreiks genau so, wie sich die bekannten Flottendemonstrationen in fremden Häfen bei gespannten diplomatischen Beziehungen von einem Seekrieg unterscheiden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.6
  kind: p
  original: Ein aus lauter Disziplin und Begeisterung geborener Massenstreik wird im besten Falle als eine Episode, als ein Symptom der Kampfstimmung der Arbeiterschaft eine Rolle spielen, worauf die Verhältnisse aber in den ruhigen Alltag zurückfallen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.7
  kind: p
  original: Freilich fallen auch während der Revolution die Massenstreiks nicht ganz vom Himmel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.8
  kind: p
  original: Sie müssen so oder anders von den Arbeitern gemacht werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.9
  kind: p
  original: Der Entschluß und Beschluß der Arbeiterschaft spielt auch dabei eine Rolle, und zwar kommt die Initiative sowie die weitere Leitung natürlich dem organisierten und aufgeklärtesten sozialdemokratischen Kern des Proletariats zu.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.10
  kind: p
  original: Allein diese Initiative und diese Leitung haben einen Spielraum meistens nur in Anwendung auf die einzelnen Akte, einzelnen Streiks, wenn die revolutionäre Periode bereits vorhanden ist, und zwar meistens in den Grenzen einer einzelnen Stadt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.11
  kind: p
  original: So hat z. B., wie wir gesehen, die Sozialdemokratie mehrmals direkt die Losung zum Massenstreik in Baku, in Warschau, in Lodz, in Petersburg mit Erfolg gegeben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.12
  kind: p
  original: Dasselbe gelingt schon viel weniger in Anwendung auf allgemeine Bewegungen des gesamten Proletariats.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.13
  kind: p
  original: Ferner sind dabei der Initiative und der bewußten Leitung ganz bestimmte Schranken gesteckt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.14
  kind: p
  original: Gerade während der Revolution ist es für irgend ein leitendes Organ der proletarischen Bewegung äußerst schwer, vorauszusehen und zu berechnen, welcher Anlaß und welche Momente zu Explosionen führen können und welche nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.15
  kind: p
  original: Auch hier besteht die Initiative und Leitung nicht in dem Kommandieren aus freien Stücken, sondern in der möglichst geschickten Anpassung an die Situation und möglichst engen Fühlung mit den Stimmungen der Masse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.16
  kind: p
  original: Das Element des Spontanen spielt, wie wir gesehen, in allen russischen Massenstreiks ohne Ausnahme eine große Rolle, sei es als treibendes oder als hemmendes Element.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.17
  kind: p
  original: Dies rührt aber nicht daher, weil in Rußland die Sozialdemokratie noch jung oder schwach ist, sondern daher, weil bei jedem einzelnen Akt des Kampfes so viele unübersehbare ökonomische, politische und soziale, allgemeine und lokale, materielle und psychische Momente mitwirken, daß kein einziger Akt sich wie ein Rechenexempel bestimmen und abwickeln läßt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.18
  kind: p
  original: Die Revolution ist, auch wenn in ihr das Proletariat mit der Sozialdemokratie an der Spitze die führende Rolle spielt, nicht ein Manöver des Proletariats im freien Felde, sondern es ist ein Kampf mitten im unaufhörlichen Krachen, Zerbröckeln, Verschieben aller sozialen Fundamente.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.14.19
  kind: p
  original: Kurz, in den Massenstreiks in Rußland spielt das Element des Spontanen eine so vorherrschende Rolle, nicht weil das russische Proletariat "ungeschult" ist, sondern weil sich Revolutionen nicht schulmeistern lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.15.1
  kind: p
  original: 'Anderseits aber sehen wir in Rußland, daß dieselbe Revolution, die der Sozialdemokratie das Kommando über den Massenstreik so sehr erschwert und ihr alle Augenblicke launig das Dirigentenstöckchen aus der Hand schlägt oder in die Hand drückt, daß sie dafür selbst gerade alle jene Schwierigkeiten der Massenstreiks löst, die im theoretischen Schema der deutschen Diskussion als die Hauptsorgen der "Leitung" behandelt werden: die Frage der "Verproviantierung", der "Kostendeckung" und der "Opfer".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.15.2
  kind: p
  original: Freilich, sie löst sie durchaus nicht in dem Sinne, wie man es bei einer ruhigen, vertraulichen Konferenz zwischen den leitenden Oberinstanzen der Arbeiterbewegung mit dem Bleistift in der Hand regelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.15.3
  kind: p
  original: Die "Regelung" all dieser Fragen besteht darin, daß die Revolution eben so enorme Volksmassen auf die Bühne bringt, daß jede Berechnung und Regelung der Kosten ihrer Bewegung, wie man die Kosten eines Zivilprozesses im voraus aufzeichnet, als ein ganz hoffnungsloses Unternehmen erscheint.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.15.4
  kind: p
  original: Gewiß suchen auch die leitenden Organisationen in Rußland die direkten Opfer des Kampfes nach Kräften zu unterstützen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.15.5
  kind: p
  original: So wurden z. B. die tapferen Opfer der Riesenaussperrung in Petersburg infolge der Achtstundenkampagne wochenlang unterstützt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.15.6
  kind: p
  original: Allein alle diese Maßnahmen sind in der enormen Bilanz der Revolution ein Tropfen im Meere.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.15.7
  kind: p
  original: Mit dem Augenblick, wo eine wirkliche ernste Massenstreikperiode beginnt, verwandeln sich alle "Kostenberechnungen" in das Vorhaben, den Ozean mit einem Wasserglas auszuschöpfen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.15.8
  kind: p
  original: Es ist nämlich ein Ozean furchtbarer Entbehrungen und Leiden, durch den jede Revolution für die Proletariermasse erkauft wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.15.9
  kind: p
  original: Und die Lösung, die eine revolutionäre Periode dieser scheinbar unüberwindlichen Schwierigkeit gibt, besteht darin, daß sie zugleich eine so gewaltige Summe von Massenidealismus auslöst, bei der die Masse gegen die schärfsten Leiden unempfindlich wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.15.10
  kind: p
  original: Mit der Psychologie eines Gewerkschaftlers, der sich auf keine Arbeitsruhe bei der Maifeier einläßt, bevor ihm eine genau bestimmte Unterstützung für den Fall seiner Maßregelung im voraus zugesichert wird, läßt sich weder Revolution noch Massenstreik machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.15.11
  kind: p
  original: Aber im Sturm der revolutionären Periode verwandelt sich eben der Proletarier aus einem Unterstützung heischenden vorsorglichen Familienvater in einen "Revolutionsromantiker", für den sogar das höchste Gut, nämlich das Leben, geschweige das materielle Wohlsein, im Vergleich mit den Kampfidealen geringen Wert besitzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.1
  kind: p
  original: Wenn aber die Leitung der Massenstreiks im Sinne des Kommandos über ihre Entstehung und im Sinne der Berechnung und Deckung ihrer Kosten Sache der revolutionären Periode selbst ist, so kommt dafür die Leitung bei Massenstreiks in einem ganz anderen Sinne der Sozialdemokratie und ihren führenden Organen zu.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.2
  kind: p
  original: Statt sich mit der technischen Seite, mit dem Mechanismus der Massenstreiks fremden Kopf zu zerbrechen, ist die Sozialdemokratie berufen, die politische Leitung auch mitten in der Revolutionsperiode zu übernehmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.3
  kind: p
  original: Die Parole, die Richtung dem Kampfe zu geben, die Taktik des politischen Kampfes so einzurichten, daß in jeder Phase und in jedem Moment des Kampfes die ganze Summe der vorhandenen und bereits ausgelösten, betätigten Macht des Proletariats realisiert wird und in der Kampfstellung der Partei zum Ausdruck kommt, daß die Taktik der Sozialdemokratie nach ihrer Entschlossenheit und Schärfe nie unter dem Niveau des tatsächlichen Kräfteverhältnisses steht, sondern vielmehr diesem Verhältnis vorauseilt, das ist die wichtigste Aufgabe der "Leitung" in der Periode der Massenstreiks.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.4
  kind: p
  original: Und diese Leitung schlägt von selbst gewissermaßen in technische Leitung um.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.5
  kind: p
  original: Eine konsequente, entschlossene, vorwärtsstrebende Taktik der Sozialdemokratie ruft in der Masse das Gefühl der Sicherheit, des Selbstvertrauens und der Kampflust hervor; eine schwankende, schwächliche, auf der Unterschätzung des Proletariats basierte Taktik wirkt auf die Masse lähmend und verwirrend.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.6
  kind: p
  original: Im ersteren Falle brechen Massenstreiks "von selbst" und immer "rechtzeitig" aus, im zweiten bleiben mitunter direkte Aufforderungen der Leitung zum Massenstreik erfolglos.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: IV.16.7
  kind: p
  original: Und für beides liefert die russische Revolution sprechende Beispiele.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
