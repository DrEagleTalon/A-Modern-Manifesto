section: VII
title_original: VII.
title_en: Part VII
author: Rosa Luxemburg
date: '1906'
original_language: de
anchor_language: de
source_original: 'Rosa Luxemburg, Massenstreik, Partei und Gewerkschaften (Hamburg: Erdmann Dubber, 1906), public domain; Project Gutenberg ebook 31614'
source_en: 'None yet: Patrick Lavin''s translation (Detroit 1925) is not on a reachable mirror'
verses:
- id: VII.0.1
  kind: heading
  original: VII.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.1.1
  kind: p
  original: Wir haben gesehen, daß der Massenstreik in Rußland nicht ein künstliches Produkt einer absichtlichen Taktik der Sozialdemokratie, sondern eine natürliche geschichtliche Erscheinung auf dem Boden der jetzigen Revolution darstellt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.1.2
  kind: p
  original: Welche sind nun die Momente, die in Rußland diese neue Erscheinungsform der Revolution hervorgebracht haben?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.1
  kind: p
  original: Die russische Revolution hat zur nächsten Aufgabe die Beseitigung des Absolutismus und die Herstellung eines modernen bürgerlich-parlamentarischen Rechtsstaates.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.2
  kind: p
  original: Formell ist es genau dieselbe Aufgabe, die in Deutschland der Märzrevolution, in Frankreich der großen Revolution am Ausgang des 18. Jahrhunderts bevorstand.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.3
  kind: p
  original: Allein die Verhältnisse, das geschichtliche Milieu, in dem diese formell analogen Revolutionen stattfanden, sind grundverschieden von den heutigen Rußlands.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.4
  kind: p
  original: Das Entscheidende ist der Umstand, daß zwischen jenen bürgerlichen Revolutionen des Westens und der heutigen bürgerlichen Revolution im Osten der ganze Cyklus der kapitalistischen Entwicklung abgelaufen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.5
  kind: p
  original: Und zwar hatte diese Entwicklung nicht bloß die westeuropäischen Länder, sondern auch das absolutistische Rußland ergriffen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.6
  kind: p
  original: Die Großindustrie mit allen ihren Konsequenzen, der modernen Klassenscheidung, den schroffen sozialen Kontrasten, dem modernen Großstadtleben und dem modernen Proletariat, ist in Rußland die herrschende, d. h. in der sozialen Entwicklung ausschlaggebende Produktionsform geworden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.7
  kind: p
  original: Daraus hat sich aber die merkwürdige, widerspruchsvolle, geschichtliche Situation ergeben, daß die nach ihren formellen Aufgaben bürgerliche Revolution in erster Reihe von einem modernen klassenbewußten Proletariat ausgeführt wird, und in einem internationalen Milieu, das im Zeichen des Verfalls der bürgerlichen Demokratie steht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.8
  kind: p
  original: Nicht die Bourgeoisie ist jetzt das führende revolutionäre Element, wie in den früheren Revolutionen des Westens, während die proletarische Masse, aufgelöst im Kleinbürgertum, der Bourgeoisie Heerbanndienste leistet, sondern umgekehrt, das klassenbewußte Proletariat ist das führende und treibende Element, während die großbürgerlichen Schichten teils direkt kontrerevolutionär, teils schwächlich-liberal, und nur das ländliche Kleinbürgertum nebst der städtischen kleinbürgerlichen Intelligenz entschieden oppositionell, ja revolutionär gesinnt sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.9
  kind: p
  original: Das russische Proletariat aber, das dermaßen zur führenden Rolle in der bürgerlichen Revolution bestimmt ist, tritt selbst frei von allen Illusionen der bürgerlichen Demokratie, dafür mit einem stark entwickelten Bewußtsein der eigenen spezifischen Klasseninteressen, bei einem scharf zugespitzten Gegensatz zwischen Kapital und Arbeit, in den Kampf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.10
  kind: p
  original: Dieses widerspruchsvolle Verhältnis findet seinen Ausdruck in der Tatsache, daß in dieser formell bürgerlichen Revolution der Gegensatz der bürgerlichen Gesellschaft zum Absolutismus von dem Gegensatz des Proletariats zur bürgerlichen Gesellschaft beherrscht wird, daß der Kampf des Proletariats sich mit gleicher Kraft gleichzeitig gegen den Absolutismus und gegen die kapitalistische Ausbeutung richtet, daß das Programm der revolutionären Kämpfe mit gleichem Nachdruck auf die politische Freiheit und auf die Eroberung des Achtstundentages sowie einer menschenwürdigen materiellen Existenz für das Proletariat gerichtet ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.2.11
  kind: p
  original: Dieser zwiespältige Charakter der russischen Revolution äußert sich in jener innigen Verbindung und Wechselwirkung des ökonomischen mit dem politischen Kampf, die wir an der Hand der Vorgänge in Rußland kennen gelernt haben, und die ihren entsprechenden Ausdruck eben im Massenstreik findet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.1
  kind: p
  original: In den früheren bürgerlichen Revolutionen, wo einerseits die politische Schulung und Anführung der revolutionären Masse von den bürgerlichen Parteien besorgt wurde und wo es sich anderseits um den nackten Sturz der alten Regierung handelte, war die kurze Barrikadenschlacht die passende Form des revolutionären Kampfes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.2
  kind: p
  original: Heute, wo die Arbeiterklasse sich selbst im Laufe des revolutionären Kampfes aufklären, selbst sammeln und selbst anführen muß, und wo die Revolution ihrerseits ebenso gegen die alte Staatsgewalt wie gegen die kapitalistische Ausbeutung gerichtet ist, erscheint der Massenstreik als das natürliche Mittel, die breitesten proletarischen Schichten in der Aktion selbst zu rekrutieren, zu revolutionieren und zu organisieren, ebenso wie es gleichzeitig ein Mittel ist, die alte Staatsgewalt zu unterminieren und zu stürzen und die kapitalistische Ausbeutung einzudämmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.3
  kind: p
  original: Das städtische Industrieproletariat ist jetzt die Seele der Revolution in Rußland.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.4
  kind: p
  original: Um aber irgend eine direkte politische Aktion als Masse auszuführen, muß sich das Proletariat erst zur Masse wieder sammeln und zu diesem Behufe muß es vor allem aus Fabriken und Werkstätten, aus Schächten und Hütten heraustreten, muß es die Pulverisierung und Zerbröckelung in den Einzelwerkstätten überwinden, zu der es im täglichen Joch des Kapitals verurteilt ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.5
  kind: p
  original: Der Massenstreik ist somit die erste natürliche, impulsive Form jeder großen revolutionären Aktion des Proletariats, und je mehr die Industrie die vorherrschende Form der sozialen Wirtschaft, je hervorragender die Rolle des Proletariats in der Revolution und je entwickelter der Gegensatz zwischen Arbeit und Kapital, um so mächtiger und ausschlaggebender müssen die Massenstreiks werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.3.6
  kind: p
  original: Die frühere Hauptform der bürgerlichen Revolutionen, die Barrikadenschlacht, die offene Begegnung mit der bewaffneten Macht des Staates, ist in der heutigen Revolution nur ein äußerster Punkt, nur ein Moment in dem ganzen Prozeß des proletarischen Massenkampfes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.4.1
  kind: p
  original: Und damit ist in der neuen Form der Revolution auch jene Zivilisierung und Milderung der Klassenkämpfe erreicht, die von den Opportunisten der deutschen Sozialdemokratie, von den Bernstein, David u. a. prophetisch vorausgesagt wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.4.2
  kind: p
  original: Die Genannten erblickten freilich die ersehnte Milderung und Zivilisierung des Klassenkampfes, im Geiste kleinbürgerlich-demokratischer Illusionen, darin, daß der Klassenkampf ausschließlich zu einem parlamentarischen Kampf beschränkt und die Straßenrevolution einfach abgeschafft wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.4.3
  kind: p
  original: 'Die Geschichte hat die Lösung in einer etwas tieferen und feineren Weise gefunden: in dem Aufkommen des revolutionären Massenstreiks, der freilich den nackten brutalen Straßenkampf durchaus nicht ersetzt und nicht überflüssig macht, ihn aber bloß zu einem Moment der langen politischen Kampfperiode reduziert und gleichzeitig mit der Revolutionsperiode ein enormes Kulturwerk im genauesten Sinne dieses Wortes verbindet: die materielle und geistige Hebung der gesamten Arbeiterklasse durch die "Zivilisierung" der barbarischen Formen der kapitalistischen Ausbeutung.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.1
  kind: p
  original: So erweist sich der Massenstreik also nicht als ein spezifisch russisches, aus dem Absolutismus entsprungenes Produkt, sondern als eine allgemeine Form des proletarischen Klassenkampfes, die sich aus dem gegenwärtigen Stadium der kapitalistischen Entwicklung und der Klassenverhältnisse ergibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.2
  kind: p
  original: 'Die drei bürgerlichen Revolutionen: die große französische, die deutsche Märzrevolution und die jetzige russische bilden von diesem Standpunkt eine Kette der fortlaufenden Entwicklung, in der sich das Glück und Ende des kapitalistischen Jahrhunderts spiegelt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.3
  kind: p
  original: In der großen französischen Revolution geben die noch ganz unentwickelten inneren Widersprüche der bürgerlichen Gesellschaft für eine lange Periode gewaltiger Kämpfe Raum, wo sich alle die erst in der Hitze der Revolution rasch aufkeimenden und reifenden Gegensätze ungehindert und ungezwungen mit rücksichtslosem Radikalismus austoben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.4
  kind: p
  original: Ein halbes Jahrhundert später wird die auf halbem Wege der kapitalistischen Entwicklung ausgebrochene Revolution des deutschen Bürgertums schon durch den Gegensatz der Interessen und das Gleichgewicht der Kräfte zwischen Kapital und Arbeit in der Mitte unterbunden und durch einen bürgerlich-feudalen Kompromiß erstickt, zu einer kurzen, kläglichen, mitten im Worte verstummten Episode abgekürzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.5
  kind: p
  original: Noch ein halbes Jahrhundert, und die heutige russische Revolution steht auf einem Punkt des geschichtlichen Weges, der bereits über den Berg, über den Höhepunkt der kapitalistischen Gesellschaft hinweggeschritten ist, wo die bürgerliche Revolution nicht mehr durch den Gegensatz zwischen Bourgeoisie und Proletariat erstickt werden kann, sondern umgekehrt zu einer neuen, langen Periode gewaltigster sozialer Kämpfe entfaltet wird, in denen die Begleichung der alten Rechnung mit dem Absolutismus als eine Kleinigkeit erscheint gegen die vielen neuen Rechnungen, die die Revolution selbst aufmacht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.6
  kind: p
  original: Die heutige Revolution realisiert somit in der besonderen Angelegenheit des absolutistischen Rußland zugleich die allgemeinen Resultate der internationalen kapitalistischen Entwicklung und erscheint weniger ein letzter Nachläufer der alten bürgerlichen, wie ein Vorläufer der neuen Serie der proletarischen Revolutionen des Westens.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.5.7
  kind: p
  original: Das zurückgebliebenste Land weist, gerade weil es sich mit seiner bürgerlichen Revolution so unverzeihlich verspätet hat, Wege und Methoden des weiteren Klassenkampfes dem Proletariat Deutschlands und der vorgeschrittensten kapitalistischen Länder.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.1
  kind: p
  original: Demnach erscheint es, auch von dieser Seite genommen, gänzlich verfehlt, die russische Revolution als ein schönes Schauspiel, als etwas spezifisch "Russisches" von weitem zu betrachten und höchstens das Heldentum der Kämpfer, d. h. die äußeren Akzessorien des Kampfes zu bewundern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.2
  kind: p
  original: Viel wichtiger ist es, daß die deutschen Arbeiter die russische Revolution als ihre eigene Angelegenheit zu betrachten lernen, nicht bloß im Sinne der internationalen Klassensolidarität mit dem russischen Proletariat, sondern vor allem als ein Kapitel der eigenen sozialen und politischen Geschichte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.3
  kind: p
  original: Diejenigen Gewerkschaftsführer und Parlamentarier, die das deutsche Proletariat als "zu schwach" und die deutschen Verhältnisse als zu unreif für revolutionäre Massenkämpfe betrachten, haben offenbar keine Ahnung davon, daß der Gradmesser der Reife der Klassenverhältnisse in Deutschland und der Macht des Proletariats nicht in den Statistiken der deutschen Gewerkschaften oder in den Wahlstatistiken liegt, sondern -- in den Vorgängen der russischen Revolution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.4
  kind: p
  original: Genau so, wie sich die Reife der französischen Klassengegensätze unter der Julimonarchie und die Pariser Junischlacht in der deutschen Märzrevolution, in ihrem Verlauf und ihrem Fiasko spiegelte, ebenso spiegelt sich heute die Reife der deutschen Klassengegensätze in den Vorgängen, in der Macht der russischen Revolution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.6.5
  kind: p
  original: Und während die Bureaukraten der deutschen Arbeiterbewegung den Nachweis ihrer Kraft und ihrer Reife in den Schubfächern ihrer Kontore auskramen, sehen sie nicht, daß das Gesuchte gerade vor ihren Augen in einer großen historischen Offenbarung liegt, denn geschichtlich genommen ist die russische Revolution ein Reflex der Macht und der Reife der internationalen, also in erster Linie der deutschen Arbeiterbewegung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.1
  kind: p
  original: Es wäre deshalb ein gar zu klägliches, grotesk winziges Resultat der russischen Revolution, wollte das deutsche Proletariat aus ihr bloß die Lehre ziehen, daß es -- wie die Gen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.2
  kind: p
  original: Frohme, Elm und andere wollen -- von der russischen Revolution die äußere Form des Kampfes, den Massenstreik entlehnt und zu einer Vorratskanone für den Fall der Kassierung des Reichstagswahlrechts, also zu einem passiven Mittel der parlamentarischen Defensive kastriert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.3
  kind: p
  original: Wenn man uns das Reichstagswahlrecht nimmt, dann wehren wir uns.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.4
  kind: p
  original: Das ist ein ganz selbstverständlicher Entschluß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.5
  kind: p
  original: Aber zu diesem Entschluß braucht man sich nicht in die heldenhafte Pose eines Danton zu werfen, wie es z. B. Genosse Elm in Jena getan; denn die Verteidigung des bereits besessenen bescheidenen Maßes der parlamentarischen Rechte ist weniger eine himmelstürmende Neuerung, zu der erst die furchtbaren Hekatomben der russischen Revolution als Ermunterung notwendig waren, als vielmehr die einfachste und erste Pflicht jeder Oppositionspartei.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.6
  kind: p
  original: Allein die bloße Defensive darf niemals die Politik des Proletariats in einer Revolutionsperiode erschöpfen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.7
  kind: p
  original: Und wenn es einerseits schwerlich mit Sicherheit vorausgesagt werden kann, ob die Vernichtung des allgemeinen Wahlrechts in Deutschland in einer Situation eintritt, die unbedingt eine sofortige Massenstreikaktion hervorrufen wird, so ist es anderseits ganz sicher, daß, sobald wir in Deutschland in die Periode stürmischer Massenaktionen eingetreten sind, die Sozialdemokratie unmöglich auf die bloße parlamentarische Defensive ihre Taktik festlegen darf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.8
  kind: p
  original: Den Anlaß und den Moment vorauszubestimmen, an dem die Massenstreiks in Deutschland ausbrechen sollen, liegt außerhalb der Macht der Sozialdemokratie, weil es außerhalb ihrer Macht liegt, geschichtliche Situationen durch Parteitagsbeschlüsse herbeizuführen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.9
  kind: p
  original: Was sie aber kann und muß, ist, die politischen Richtlinien dieser Kämpfe, wenn sie einmal eintreten, klarlegen und in einer entschlossenen, konsequenten Taktik formulieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.7.10
  kind: p
  original: Man hält nicht die geschichtlichen Ereignisse im Zaum, indem man ihnen Vorschriften macht, sondern indem man sich im voraus ihre wahrscheinlichen berechenbaren Konsequenzen zum Bewußtsein bringt und die eigene Handlungsweise danach einrichtet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.8.1
  kind: p
  original: Die zunächst drohende politische Gefahr, auf die sich die deutsche Arbeiterbewegung seit einer Reihe von Jahren gefaßt macht, ist ein Staatsstreich der Reaktion, der den breitesten Schichten der arbeitenden Volksmasse das wichtigste politische Recht, das Reichstagswahlrecht, wird entreißen wollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.8.2
  kind: p
  original: Trotz der ungeheuren Tragweite dieses eventuellen Ereignisses ist es, wie gesagt, unmöglich, mit Bestimmtheit zu behaupten, daß auf den Staatsstreich alsdann sofort eine offene Volksbewegung in der Form von Massenstreiks ausbricht, weil uns heute alle jene unzähligen Umstände und Momente unbekannt sind, die bei einer Massenbewegung die Situation mitbestimmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.8.3
  kind: p
  original: Allein, wenn man die gegenwärtige äußerste Zuspitzung der Verhältnisse in Deutschland und anderseits die mannigfachen internationalen Rückwirkungen der russischen Revolution und weiter des künftigen renovierten Rußlands in Betracht zieht, so ist es klar, daß der Umsturz in der deutschen Politik, der aus einer Kassierung des Reichstagswahlrechts entstehen würde, nicht bei dem Kampf um dieses Wahlrecht allein Halt machen könnte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.8.4
  kind: p
  original: Dieser Staatsstreich würde vielmehr in kürzerer oder längerer Frist mit elementarer Macht eine große allgemeine politische Abrechnung der einmal empörten und aufgerüttelten Volksmassen mit der Reaktion nach sich ziehen -- eine Abrechnung für den Brotwucher, für die künstliche Fleischteuerung, für die Auspowerung durch den uferlosen Militarismus und Marinismus, für die Korruption der Kolonialpolitik, für die nationale Schmach des Königsberger Prozesses, für den Stillstand der Sozialreform, für die Entrechtung der Eisenbahner, der Postbeamten und der Landarbeiter, für die Bemogelung und Verhöhnung der Bergarbeiter, für das Löbtauer Urteil und die ganze Klassenjustiz, für das brutale Aussperrungssystem -- kurz, für den gesamten zwanzigjährigen Druck der koalierten Herrschaft des ostelbischen Junkertums und des kartellierten Großkapitals.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.1
  kind: p
  original: Ist aber einmal der Stein ins Rollen gekommen, so kann er, ob es die Sozialdemokratie will oder nicht, nicht mehr zum Stillstand gebracht werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.2
  kind: p
  original: Die Gegner des Massenstreiks pflegen die Lehren und Beispiele der russischen Revolution, als für Deutschland gar nicht maßgebend, vor allem deshalb abzuweisen, weil ja in Rußland erst der gewaltige Sprung aus einer orientalischen Despotie in eine moderne bürgerliche Rechtsordnung gemacht werden mußte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.3
  kind: p
  original: Der formelle Abstand zwischen der alten und der neuen politischen Ordnung soll für die Vehemenz und die Gewalt der Revolution in Rußland als ausreichender Erklärungsgrund dienen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.4
  kind: p
  original: In Deutschland haben wir längst die notwendigsten Formen und Garantien des Rechtsstaats, weshalb hier ein so elementares Toben der sozialen Gegensätze unmöglich ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.5
  kind: p
  original: Die also spekulieren, vergessen, daß dafür in Deutschland, wenn es einmal zum Ausbruch offener politischer Kämpfe kommt, eben das geschichtlich bedingte Ziel ein ganz anderes sein wird, als heute in Rußland.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.6
  kind: p
  original: Gerade weil die bürgerliche Rechtsordnung in Deutschland längst besteht, weil sie also Zeit hatte, sich gänzlich zu erschöpfen und auf die Neige zu gehen, weil die bürgerliche Demokratie und der Liberalismus Zeit hatten, auszusterben, kann von einer bürgerlichen Revolution in Deutschland nicht mehr die Rede sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.7
  kind: p
  original: Und deshalb kann es sich bei einer Periode offener politischer Volkskämpfe in Deutschland als letztes geschichtlich notwendiges Ziel nur noch um die Diktatur des Proletariats handeln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.9.8
  kind: p
  original: Der Abstand aber dieser Aufgabe von den heutigen Zuständen in Deutschland ist ein noch viel gewaltigerer, als der Abstand der bürgerlichen Rechtsordnung von der orientalischen Despotie, und deshalb kann diese Aufgabe auch nicht mit einem Schlag, sondern gleichfalls in einer langen Periode gigantischer sozialer Kämpfe vollzogen werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.1
  kind: p
  original: Liegt aber nicht ein krasser Widerspruch in den von uns aufgezeichneten Perspektiven?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.2
  kind: p
  original: Einerseits heißt es, bei einer eventuellen künftigen Periode der politischen Massenaktion werden vor allem die zurückgebliebensten Schichten des deutschen Proletariats, die Landarbeiter, die Eisenbahner, die Postsklaven, erst ihr Koalitionsrecht erobern, die ärgsten Auswüchse der Ausbeutung erst beseitigt werden müssen, anderseits soll die politische Aufgabe dieser Periode schon die politische Machteroberung durch das Proletariat sein!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.3
  kind: p
  original: Einerseits ökonomische, gewerkschaftliche Kämpfe um die nächsten Interessen, um die materielle Hebung der Arbeiterklasse, anderseits schon das äußerste Endziel der Sozialdemokratie!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.4
  kind: p
  original: Gewiß, das sind krasse Widersprüche, aber nicht Widersprüche unseres Raisonnements, sondern Widersprüche der kapitalistischen Entwicklung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.5
  kind: p
  original: Sie verläuft nicht in einer hübschen, geraden Linie, sondern im schroffen blitzähnlichen Zickzack.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.6
  kind: p
  original: Ebenso wie die verschiedenen kapitalistischen Länder die verschiedensten Stadien der Entwicklung darstellen, ebenso innerhalb jedes Landes die verschiedenen Schichten derselben Arbeiterklasse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.7
  kind: p
  original: Die Geschichte wartet aber nicht geduldig, bis erst die zurückgebliebenen Länder und Schichten die fortgeschrittensten eingeholt haben, damit sich das Ganze wie eine stramme Kolonne symmetrisch weiter bewegen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.10.8
  kind: p
  original: Sie bringt es bereits in den vordersten exponiertesten Punkten zu Explosionen, sobald die Verhältnisse hier dafür reif sind, und im Sturme der revolutionären Periode wird dann in wenigen Tagen und Monaten das Versäumte nachgeholt, das Ungleiche ausgeglichen, der gesamte soziale Fortschritt mit einem Ruck in Sturmschritt versetzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.11.1
  kind: p
  original: Wie in der russischen Revolution sich die ganze Stufenleiter der Entwicklung und der Interessen der verschiedenen Arbeiterschichten in dem sozialdemokratischen Programm der Revolution und die unzähligen partiellen Kämpfe in der gemeinsamen großen Klassenaktion des Proletariats vereinigen, so wird es, wenn die Verhältnisse dafür reif sind, auch in Deutschland der Fall sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: VII.11.2
  kind: p
  original: Und Aufgabe der Sozialdemokratie wird es alsdann sein, ihre Taktik nicht nach den zurückgebliebensten Phasen der Entwicklung, sondern nach den fortgeschrittensten zu richten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
