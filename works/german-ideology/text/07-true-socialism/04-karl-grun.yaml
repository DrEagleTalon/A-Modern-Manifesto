- id: WSIV.0.2
  kind: heading
  original: 'Karl Grün: "Die soziale Bewegung in Frankreich und Belgien" (Darmstadt 1845) oder Die Geschichtschreibung des wahren Sozialismus'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '472'
- id: WSIV.1.1
  kind: p
  original: '"Wahrlich, gälte es hier nicht, zugleich eine ganze Rotte zu zeichnen... wir würden die Feder noch wegwerfen...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '472'
- id: WSIV.1.2
  kind: p
  original: Und jetzt tritt sie" (Mundts "Geschichte der Gesellschaft") "mit derselben Anmaßung vor den großen Leserkreis des Publikums, des Publikums, das heißhungrig nach Allem greift, was nur das Wort sozial an der Stirne trägt, weil ein richtiger Takt ihm sagt, welche Geheimnisse der Zukunft in diesem Wörtchen verborgen liegen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '472'
- id: WSIV.1.3
  kind: p
  original: Doppelte Verantwortlichkeit des Schriftstellers, doppelte Züchtigung, wenn er unberufen ans Werk ging!"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '472'
- id: WSIV.2.1
  kind: p
  original: '"Darüber wollen wir eigentlich mit Herrn Mundt nicht rechten, daß er von den faktischen Leistungen der sozialen Literatur Frankreichs und Englands durchaus nichts weiß, als was ihm Herr L.Stein verraten, dessen Buch anerkannt werden konnte, als es erschien....'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '472'
- id: WSIV.2.2
  kind: p
  original: Aber heute noch... über Saint-Simon Phrasen machen, Bazard und Enfantin die beiden Zweige des Saint-Simonismus nennen, Fourier folgen lassen, über Proudhon ungenügendes Zeug nachplappern, etc.!...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '472'
- id: WSIV.2.3
  kind: p
  original: Dennoch würden wir gerne ein Auge zudrücken, wäre mindestens die Genesis der sozialen Ideen eigen und neu dargestellt."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '472'
- id: WSIV.3.1
  kind: p
  original: Mit dieser hochfahrenden, rhadamantischen Sentenz eröffnet Herr Grün ("Neue Anekdote" p. 122, 123) eine Rezension von Mundts "Geschichte der Gesellschaft".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '472'
- id: WSIV.4.1
  kind: p
  original: Wie überrascht wird der Leser von dem artistischen Talent des Herrn Grün sein, das unter der obigen Maske nur eine Selbstkritik seines eignen, damals noch ungebornen Buchs versteckte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '472'
- id: WSIV.5.1
  kind: p
  original: Herr Grün bietet uns das amüsante Schauspiel einer Verschmelzung des wahren Sozialismus mit jungdeutschem Literatentum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '472'
- id: WSIV.5.2
  kind: p
  original: Das obige Buch ist in Briefen an eine Dame geschrieben, woraus der Leser schon ahnt, daß hier die tiefsinnigen Götter des wahren Sozialismus mit den Rosen und Myrten der "jungen Literatur" bekränzt einherwandeln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 472-474
- id: WSIV.5.3
  kind: p
  original: 'Pflücken wir gleich einige Rosen:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.6.1
  kind: p
  original: '"Die Carmagnole sang sich selbst in meinem Kopfe... auf alle Fälle aber bleibt es schrecklich, daß die Carmagnole im Kopfe eines deutschen Schriftstellers, wenn nicht vollständig logieren, so doch ein Frühstück nehmen darf." p. 3.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.7.1
  kind: p
  original: '"Hätte ich den alten Hegel hier, ich packte ihn bei den Ohren: Was, die Natur wäre das Anderssein des Geistes?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.7.2
  kind: p
  original: Was, Er Nachtwächter?" p. 11.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.8.1
  kind: p
  original: '"Brüssel stellt gewissermaßen den französischen Konvent dar: es hat eine Bergpartie und eine Partie des Tales." p. 24.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.9.1
  kind: p
  original: '"Die Lüneburger Heide der Politik." p. 80.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.10.1
  kind: p
  original: '"Bunte, poetische, inkonsequente, phantastische Chrysalide." p. 82.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.11.1
  kind: p
  original: '"Den Liberalismus der Restauration, den bodenlosen Kaktus, der sich als Schmarotzerpflanze um die Bänke der Deputiertenkammer wand." p. 87, 88.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.12.1
  kind: p
  original: Daß der Kaktus weder "bodenlos" noch eine "Schmarotzerpflanze" ist, tut diesem schönen Bilde ebensowenig Abbruch, wie dem vorigen, daß es weder "bunte" noch "poetische" noch "inkonsequente" "Chrysaliden" oder Puppen gibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.13.1
  kind: p
  original: '"Ich selbst aber komme mir mitten in diesem Gewoge" (der Zeitungen und Zeitungsschreiber im Cabinet Montpensier) "vor wie ein zweiter Noah, der seine Tauben aussendet, ob sich irgendwo Hütten oder Reben bauen lassen, ob es möglich sei, mit den erzürnten Göttern einen räsonnablen Vertrag abzuschließen." p. 259.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.14.1
  kind: p
  original: Herr Grün spricht hier wohl von seiner Tätigkeit als Zeitungskorrespondent.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.15.1
  kind: p
  original: '"Camille Desmoulins war ein Mensch.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.15.2
  kind: p
  original: Die Konstituante bestand aus Philistern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.15.3
  kind: p
  original: Robespierre war ein tugendhafter Magnetiseur.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.15.4
  kind: p
  original: Die neue Geschichte ist mit einem Wort der Kampf auf Tod und Leben wider die Épiciers <Krämer> und die Magnetiseure!!!" p. 311.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.16.1
  kind: p
  original: '"Das Glück ist ein Plus, aber ein Plus in der xten Potenz." p. 203.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.17.1
  kind: p
  original: Also das Glück = + x, eine Formel, die sich nur in der ästhetischen Mathematik des Herrn Grün findet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.18.1
  kind: p
  original: '"Die Organisation der Arbeit, was ist sie?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.18.2
  kind: p
  original: Und die Völker antworteten der Sphinx mit tausend Zeitungsstimmen...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.18.3
  kind: p
  original: Frankreich singt die Strophe, Deutschland die Antistrophe, das alte mystische Deutschland." p. 259.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.19.1
  kind: p
  original: '"Nordamerika ist mir sogar widerwärtiger als die alte Welt, weil dieser Egoismus der Krämerwelt die rote Farbe einer impertinenten Gesundheit trägt... weil dort Alles so oberflächlich, so wurzellos, fast möchte ich sagen so kleinstädtisch ist...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.19.2
  kind: p
  original: Ihr nennt Amerika die neue Welt; es ist die älteste von allen alten, unsre abgetragenen Kleider machen dort Parade." p. 101, 324.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '474'
- id: WSIV.20.1
  kind: p
  original: Bisher wußte man nur, daß die ungetragenen deutschen Strümpfe dort getragen werden, obwohl sie zum "Parademachen" zu schlecht sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.21.1
  kind: p
  original: '"Der logisch feste Garantismus dieser Institutionen". p.461.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.22.1
  kind: p
  original: Wen solche Blüten nicht erfreun, Verdienet nicht, ein "Mensch" zu sein!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.23.1
  kind: p
  original: Welch graziöser Mutwille!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.23.2
  kind: p
  original: Welche schnippische Naivetät!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.23.3
  kind: p
  original: Welch heroisches Durchwühlen durch die Ästhetik!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.23.4
  kind: p
  original: Welche Heinesche Nonchalance und Genialität!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.24.1
  kind: p
  original: Wir haben den Leser getäuscht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.24.2
  kind: p
  original: Herrn Grüns Belletristik schmückt nicht die Wissenschaft des wahren Sozialismus, sondern die Wissenschaft ist nur die Ausfüllung zwischen diesen belletristischen Schwätzereien.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.24.3
  kind: p
  original: Sie bildet sozusagen ihren "sozialen Hintergrund".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.25.1
  kind: p
  original: 'In einem Aufsatze des Herrn Grün: "Feuerbach und die Socialisten" ("Deutsches Bürgerbuch", p. 74) findet sich folgende Äußerung:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.26.1
  kind: p
  original: '"Wenn man Feuerbach nennt, so hat man die ganze Arbeit der Philosophie genannt von Baco von Verulam bis heute, so hat man zugleich gesagt, was die Philosophie in letzter Instanz will und bedeutet, so hat man den Menschen als letztes Ergebnis der Weltgeschichte.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.26.2
  kind: p
  original: Dabei geht man sicherer, weil gründlicher, zu Werke, als wenn man den Arbeitslohn. die Konkurrenz, die Mangelhaftigkeit der Konstitutionen und Verfassungen aufs Tapet bringt...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.26.3
  kind: p
  original: Wir haben den Menschen gewonnen, den Menschen, der sich der Religion, der toten Gedanken, alles ihm fremden Wesens mit allen Übersetzungen in der Praxis entledigt hat, den reinen, wahrhaften Menschen."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.27.1
  kind: p
  original: Dieser Eine Satz klärt vollständig auf über die Art von "Sicherheit" und "Gründlichkeit", welche bei Herrn Grün zu suchen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.27.2
  kind: p
  original: Auf kleine Fragen läßt er sich nicht ein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.27.3
  kind: p
  original: Ausgestattet mit dem ungetrübten Glauben an die Resultate der deutschen Philosophie, wie sie in Feuerbach niedergelegt sind, nämlich daß "der Mensch ", der "reine, wahrhafte Mensch", das Endziel der Weltgeschichte sei, daß die Religion das entäußerte menschliche Wesen sei, daß das menschliche Wesen das menschliche Wesen und der Maßstab aller Dinge sei; ausgestattet mit den weiteren Wahrheiten des deutschen Sozialismus (siehe oben), daß auch das Geld, die Lohnarbeit pp. Entäußerungen des menschlichen Wesens seien, daß der deutsche Sozialismus die Verwirklichung der deutschen Philosophie und die theoretische Wahrheit des auswärtigen Sozialismus und Kommunismus sei pp. - reist Herr Grün nach Brüssel und Paris mit der ganzen Selbstgefälligkeit des wahren Sozialismus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.28.1
  kind: p
  original: Die gewaltigen Posaunenstöße des Herrn Grün zum Lobe des wahren Sozialismus und der deutschen Wissenschaft übertreffen Alles, was von seinen übrigen Glaubensgenossen in dieser Beziehung geliefert ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '475'
- id: WSIV.28.2
  kind: p
  original: Was den wahren Sozialismus angeht, so kommen diese Lobpreisungen offenbar von Herzen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 475-476
- id: WSIV.28.3
  kind: p
  original: Herrn Grüns Bescheidenheit erlaubt ihm nicht, einen einzigen Satz auszusprechen, den nicht schon ein anderer wahrer Sozialist vor ihm in den "Einundzwanzig Bogen", dem "Bürgerbuch" und den "Neuen Anekdotis" geoffenbart hatte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.28.4
  kind: p
  original: Ja, sein ganzes Buch hat keinen andren Zweck, als ein in den "Einundzwanzig Bogen" p. 74-88 von Heß gegebenes Konstruktionsschema der französischen sozialen Bewegung auszufüllen und damit einem ebendaselbst p. 88 ausgesprochenen Bedürfnis zu entsprechen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.28.5
  kind: p
  original: Was aber die Lobeserhebungen der deutschen Philosophie angeht, so muß diese sie ihm um so höher anrechnen, je weniger er sie kennt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.28.6
  kind: p
  original: Der Nationalstolz der wahren Sozialisten, der Stolz auf Deutschland als das Land "des Menschen", des "Wesens des Menschen", gegenüber den andern profanen Nationalitäten erreicht bei ihm seinen Gipfelpunkt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.28.7
  kind: p
  original: 'Wir geben gleich einige Proben davon:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.29.1
  kind: p
  original: '"Ich möchte doch wissen, ob sie nicht Alle erst von uns lernen müssen, Franzosen und Engländer, Belgier und Nordamerikaner." p. 28.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.30.1
  kind: p
  original: Dies wird jetzt ausgeführt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.31.1
  kind: p
  original: '"Die Nordamerikaner kommen mir grundprosaisch vor, und den Sozialismus sollen sie wohl, trotz aller ihrer gesetzlichen Freiheit, erst von uns kennenlernen." p. 101.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.32.1
  kind: p
  original: Besonders seitdem sie seit 1829 eine eigne sozialistisch-demokratische Schule haben, die ihr Nationalökonom Cooper bereits 1830 bekämpfte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.33.1
  kind: p
  original: '"Die belgischen Demokraten!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.33.2
  kind: p
  original: Glaubst Du wohl, sie wären halb so weit als wir Deutsche?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.33.3
  kind: p
  original: Habe ich mich wieder mit Einem herumbalgen müssen, der die Realisierung des freien Menschentums für eine Chimäre hält!" p. 28.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.34.1
  kind: p
  original: Hier macht sich die Nationalität "des Menschen", des "Wesens des Menschen", des "Menschentums" breit gegenüber der belgischen Nationalität.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.35.1
  kind: p
  original: '"Ihr Franzosen, laßt den Hegel in Ruhe, bis Ihr ihn versteht.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.35.2
  kind: p
  original: (Wir glauben, daß die sonst sehr schwache Kritik der Rechtsphilosophie von Lerminier mehr Einsicht in Hegel beweist als irgend etwas, was Herr Grün, sei es unter eigenem Namen, sei es qua <als > "Ernst von der Haide" geschrieben hat.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.35.3
  kind: p
  original: '"Trinkt einmal ein Jahr lang keinen Kaffee, keinen Wein; erhitzt Euer Gemüt durch keine aufregende Leidenschaft; laßt den Guizot regieren und Algier unter die Herrschaft Marokkos kommen" (wie sollte Algier je unter die Herrschaft Marokkos kommen, selbst wenn die Franzosen es aufgäben!); "sitzt auf einer Mansarde und studiert die ''Logik'' nebst der ''Phänomenologie''.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.35.4
  kind: p
  original: Wenn Ihr dann endlich nach Jahresfrist, mager und mit rotangelaufenen Augen in die Straßen hinabsteigt und meinetwegen über den ersten Dandy oder öffentlichen Ausrufer stolpert, laßt Euch das nicht irren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.35.5
  kind: p
  original: Denn Ihr seid mittlerweile große und mächtige Menschen geworden, Euer Geist gleicht einem Eichbaum, den wundertätige" (!)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '476'
- id: WSIV.35.6
  kind: p
  original: '"Säfte ernährten; was Ihr anseht, das enthüllt Euch seine geheimsten Schwächen; Ihr dringt als erschaffne Geister dennoch ins Innre der Natur; Euer Blick ist tötend, Euer Wort versetzt Berge, Eure Dialektik ist schärfer als die schärfste Guillotine.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 476-477
- id: WSIV.35.7
  kind: p
  original: Ihr Stellt Euch ans Hotel de Ville - und die Bourgeoisie ist gewesen, Ihr tretet ans Palais Bourbon - und es zerfällt, seine ganze Deputiertenkammer löst sich in das nihilum album <graue Nichts> auf, Guizot verschwindet, Ludwig Philipp erblaßt zum geschichtlichen Schemen, und aus all diesen zugrunde gegangnen Momenten erhebt sich siegesstolz die absolute Idee der freien Gesellschaft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '477'
- id: WSIV.35.8
  kind: p
  original: Ohne Scherz, den Hegel könnt Ihr nur bezwingen, wenn Ihr selbst vorher Hegel werdet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '477'
- id: WSIV.35.9
  kind: p
  original: 'Wie ich schon oben sagte: Moors Geliebte kann nur durch Moor sterben." p. 115, 116.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '477'
- id: WSIV.36.1
  kind: p
  original: Der belletristische Duft, der diese Sätze des wahren Sozialismus umgibt, wird Jedermann in die Nase steigen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '477'
- id: WSIV.36.2
  kind: p
  original: 'Herr Grün, wie alle wahren Sozialisten, vergißt nicht, das alte Geschwätz von der Oberflächlichkeit der Franzosen wieder vorzubringen:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '477'
- id: WSIV.37.1
  kind: p
  original: '"Bin ich doch dazu verdammt, den französischen Geist jedesmal, wenn ich ihn in der Nähe habe, ungenügend und oberflächlich zu finden." p. 371.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '477'
- id: WSIV.38.1
  kind: p
  original: 'Herr Grün verheimlicht es uns nicht, daß sein Buch dazu bestimmt ist, den deutschen Sozialismus als die Kritik des französischen zu verherrlichen:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '477'
- id: WSIV.39.1
  kind: p
  original: '"Der Pöbel der deutschen Tagesliteratur hat unsren sozialistischen Bestrebungen nachgesagt, sie seien die Nachahmung französischer Verkehrtheiten.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '477'
- id: WSIV.39.2
  kind: p
  original: Es hat bis jetzt Niemand der Mühe wert gehalten, nur eine Silbe darauf zu erwidern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '477'
- id: WSIV.39.3
  kind: p
  original: Dieser Pöbel muß sich schämen - besitzt er anders noch Schamgefühl -, wenn er dieses Buch liest.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '477'
- id: WSIV.39.4
  kind: p
  original: Das hat er sich wohl nicht träumen lassen, daß der deutsche Sozialismus die Kritik des französischen ist, daß er, weit entfernt, die Franzosen für Erfinder des neuen Contrat social <Gesellschaftsvertrag> zu halten, vielmehr die Forderung an sie stellt, sich erst durch die deutsche Wissenschaft zu ergänzen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '477'
- id: WSIV.39.5
  kind: p
  original: In diesem Augenblick wird hier in Paris die Herausgabe einer Übersetzung von Feuerbachs 'Wesen des Christenthums' veranstaltet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '477'
- id: WSIV.39.6
  kind: p
  original: Wohl bekomme den Franzosen die deutsche Schule!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '477'
- id: WSIV.39.7
  kind: p
  original: Was auch aus der ökonomischen Lage des Landes, aus der Konstellation der hiesigen Politik entstehe, zu einem menschlichen Leben in der Zukunft befähigt einzig die humanistische Weltanschauung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '477'
- id: WSIV.39.8
  kind: p
  original: Das unpolitische, verworfne Volk der Deutschen, dies Volk, welches gar kein Volk ist, wird den Eckstein gelegt haben zum Bau der Zukunft." p. 353.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '477'
- id: WSIV.40.1
  kind: p
  original: Allerdings, "was aus der ökonomischen Lage und der Konstellation der Politik" in einem Lande "entsteht", braucht ein wahrer Sozialist bei seinem vertrauten Umgange mit dem "Wesen des Menschen" nicht zu wissen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '477'
- id: WSIV.41.1
  kind: p
  original: Herr Grün als Apostel des wahren Sozialismus begnügt sich nicht damit, gleich seinen Mitaposteln der Unwissenheit andrer Völker die Allwissenheit der Deutschen stolz entgegenzuhalten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '477'
- id: WSIV.41.2
  kind: p
  original: Er nimmt seine alte Literatenpraxis zu Hülfe, er drängt sich den Repräsentanten der verschiedenen sozialistischen, demokratischen und kommunistischen Parteien in der verrufensten Weltfahrer-Manier auf, und nachdem er sie von allen Seiten beschnüffelt hat, tritt er ihnen als Apostel des wahren Sozialismus entgegen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 477-478
- id: WSIV.41.3
  kind: p
  original: Er hat sie nur noch zu belehren, ihnen die tiefsten Aufschlüsse über das freie Menschentum mitzuteilen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '478'
- id: WSIV.41.4
  kind: p
  original: Die Überlegenheit des wahren Sozialismus über die Parteien Frankreichs verwandelt sich hier in die persönliche Überlegenheit des Herrn Grün gegenüber den Repräsentanten dieser Parteien.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '478'
- id: WSIV.41.5
  kind: p
  original: Schließlich bietet dies dann auch Gelegenheit, nicht nur die französischen Parteichefs als Piedestal des Herrn Grün dienen zu lassen, sondern auch noch eine Masse von Klatschereien anzubringen und so den deutschen Kleinstädter für die Anstrengung zu entschädigen, die ihm die inhaltvolleren Sätze des wahren Sozialismus verursacht haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '478'
- id: WSIV.42.1
  kind: p
  original: '" Kats verzog sein ganzes Gesicht zu einer plebejischen Heiterkeit, als ich ihm meine hohe Zufriedenheit mit seiner Rede bezeugte." p. 50.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '478'
- id: WSIV.43.1
  kind: p
  original: Herr Grün erteilt Kats auch sogleich Unterricht über den französischen Terrorismus und "war so glücklich, meinem neuen Freunde Beifall abzugewinnen". p. 51.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '478'
- id: WSIV.44.1
  kind: p
  original: 'Ganz anders bedeutsam wirkt er auf Proudhon:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '478'
- id: WSIV.45.1
  kind: p
  original: '"Ich hatte das unendliche Vergnügen, gewissermaßen der Privatdozent des Mannes zu werden, dessen Scharfsinn vielleicht seit Lessing und Kant nicht überboten wurde." p. 404.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '478'
- id: WSIV.46.1
  kind: p
  original: Louis Blanc ist nur "sein schwarz Jüngelchen". p. 314.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '478'
- id: WSIV.47.1
  kind: p
  original: '"Er frug sehr wißbegierig, aber zugleich sehr unwissend, nach unsren Zuständen, Wir Deutsche kennen" (?) "die französischen fast so gut wie die Franzosen selbst; wenigstens studieren" (?) "wir sie." p. 315.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '478'
- id: WSIV.48.1
  kind: p
  original: Und über den "Papa Cabet " erfahren wir, daß er "borniert" ist. p. 382.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '478'
- id: WSIV.48.2
  kind: p
  original: Herr Grün legt ihm "Fragen" vor, von denen Cabet
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '478'
- id: WSIV.49.1
  kind: p
  original: '"gestand, daß er sie nicht gerade approfondiert hätte.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '478'
- id: WSIV.49.2
  kind: p
  original: Das hatte ich " (Grün) "längst gemerkt. und da hörte natürlich Alles auf, um so mehr, als mir einfiel, daß Cabets Mission eine längst in sich abgeschlossene sei." p. 381.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '478'
- id: WSIV.50.1
  kind: p
  original: Wir werden später sehen, wie Herr Grün dem Cabet eine neue "Mission" zu geben gewußt hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '478'
- id: WSIV.51.1
  kind: p
  original: Wir heben zunächst das Schema und die paar überkommenen allgemeinen Gedanken hervor, die das Gerippe des Grünschen Buches bilden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '478'
- id: WSIV.51.2
  kind: p
  original: Beides ist abgeschrieben von Heß, den Herr Grün überhaupt auf die großartigste Weise paraphrasiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '478'
- id: WSIV.51.3
  kind: p
  original: Sachen, die schon bei Heß ganz unbestimmt und mystisch sind, die aber im Anfange - in den "Einundzwanzig Bogen" - anzuerkennen waren und nur durch ihre ewige Wiederaufdrängung im "Bürgerbuch", den "Neuen Anekdotis" und den "Rheinischen Jahrbüchern" zu einer Zeit, wo sie bereits antiquiert waren, langweilig und reaktionär geworden sind - diese Sachen werden bei Herrn Grün vollends Unsinn.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 478-479
- id: WSIV.52.1
  kind: p
  original: Heß synthetisiert die Entwicklung des französischen Sozialismus mit der Entwicklung der deutschen Philosophie - Saint-Simon mit Schelling, Fourier mit Hegel, Proudhon mit Feuerbach.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '479'
- id: WSIV.52.2
  kind: p
  original: 'Vgl. z.B. "Einundzw[anzig] Bogen", p. 78, 79, 326, 327, "Neue Anekd[ota]". p. 194, 195, 196, 202 seqq. (Parallele zwischen Feuerbach und Proudhon. Z.B. Heß: "Feuerbach ist der deutsche Proudhon" pp., "N[eue] A[nekdota]", p. 202. Grün: "Proudhon ist der französische Feuerbach", p. 404.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '479'
- id: WSIV.52.3
  kind: p
  original: '- Dieser Schematismus mit der Ausführung, die Heß ihm gibt, bildet den ganzen inneren Zusammenhang des Grünschen Buchs.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '479'
- id: WSIV.52.4
  kind: p
  original: Nur daß Herr Grün nicht verfehlt, die Heßschen Sätze belletristisch anzustreichen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '479'
- id: WSIV.52.5
  kind: p
  original: Ja selbst offenbare Schnitzer von Heß, z.B. daß theoretische Entwicklungen den "sozialen Hintergrund" und die "theoretische Basis" praktischer Bewegungen bilden (z.B. "N. An.", p. 192), schreibt Herr Grün getreulichst nach.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '479'
- id: WSIV.52.6
  kind: p
  original: '(Z.B. Grün, p. 264: "Der soziale Hintergrund, den die politische Frage des achtzehnten Jahrhunderts hatte... war das gleichzeitige Produkt beider philosophischen Richtungen" - der Sensualisten und Deisten.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '479'
- id: WSIV.52.7
  kind: p
  original: Ebenso die Meinung, man brauche Feuerbach nur praktisch zu machen, ihn nur aufs soziale Leben anzuwenden, um die vollständige Kritik der bestehenden Gesellschaft zu geben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '479'
- id: WSIV.52.8
  kind: p
  original: Nimmt man noch die sonstige Kritik des französischen Kommunismus und Sozialismus durch Heß hinzu, z.B. daß "Fourier, Proudhon pp. nicht über die Kategorie der Lohnarbeit hinausgekommen sind", "Bürgerbuch", p. 40 u.a., daß "Fourier die Welt mit neuen Assoziationen des Egoismus beglücken möchte", "N. Anekd.", p. 196, daß "selbst die radikalen franz[ösischen] Kommunisten noch nicht über den Gegensatz von Arbeit und Genuß hinaus sind, sich noch nicht zu der Einheit von Produktion und Konsumtion pp. erhoben haben", "Bürgerb[uch]", p. 43, daß "die Anarchie die Negation des Begriffs der politischen Herrschaft ist", "Einundzwanzig Bogen", p. 77 ppp., so hat man die ganze Kritik der Franzosen durch Herrn Grün in der Tasche, ebensogut wie Herr Grün sie bereits in der Tasche hatte, ehe er nach Paris ging.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '479'
- id: WSIV.52.9
  kind: p
  original: Außer dem Obengenannten erleichtern dann noch einige in Deutschland traditionell zirkulierende Phrasen über Religion, Politik, Nationalität, menschlich und unmenschlich ppp., Phrasen, die von den Philosophen auf die wahren Sozialisten übergegangen sind, Herrn Grün den Rechnungsabschluß mit den französischen Sozialisten und Kommunisten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '479'
- id: WSIV.52.10
  kind: p
  original: Er hat nur überall nach "dem Menschen" und dem Worte menschlich zu suchen und zu verdammen, wo er dies nicht findet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 479-480
- id: WSIV.52.11
  kind: p
  original: 'Z.B.: "Du bist politisch, Du bist borniert", p. 283.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '480'
- id: WSIV.52.12
  kind: p
  original: 'In ähnlicher Weise kann Herr Grün dann ausrufen: Du bist national, religiös, nationalökonomisch, Du hast einen Gott - Du bist nicht menschlich, Du bist borniert, wie er dies im ganzen Buche tut.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '480'
- id: WSIV.52.13
  kind: p
  original: Womit natürlich Politik, Nationalität, Religion pp. gründlich kritisiert und zugleich die Eigentümlichkeit der gerade kritisierten Schriftsteller und ihr Zusammenhang mit der gesellschaftlichen Entwicklung hinreichend beleuchtet sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '480'
- id: WSIV.53.1
  kind: p
  original: Man sieht schon hieraus, daß das Grünsche Machwerk weit unter dem Buche von Stein steht, der wenigstens versuchte, den Zusammenhang der sozialistischen Literatur mit der wirklichen Entwicklung der französischen Gesellschaft darzustellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '480'
- id: WSIV.53.2
  kind: p
  original: Es bedarf indes kaum der Erwähnung, daß Herr Grün sowohl im vorliegenden Buche wie in den "Neuen Anekdotis" mit der größten Vornehmheit auf seinen Vorgänger herabsieht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '480'
- id: WSIV.54.1
  kind: p
  original: Aber hat Herr Grün wenigstens die ihm von Heß und Andern überlieferten Sachen richtig kopiert?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '480'
- id: WSIV.54.2
  kind: p
  original: Hat er innerhalb seines höchst unkritisch auf Treu und Glauben angenommenen Schemas wenigstens das nötige Material niedergelegt, hat er eine richtige und vollständige Darstellung der einzelnen sozialistischen Schriftsteller nach den Quellen gegeben?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '480'
- id: WSIV.54.3
  kind: p
  original: Dies sind doch wahrlich die niedrigsten Forderungen, die man an den Mann stellen kann, von dem Nordamerikaner und Franzosen, Engländer und Belgier zu lernen haben, der der Privatdozent Proudhons war und jeden Augenblick auf die deutsche Gründlichkeit gegenüber den oberflächlichen Franzosen pocht
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '480'
- id: WSIV.55.1
  kind: heading
  original: Saint-Simonismus
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '480'
- id: WSIV.56.1
  kind: p
  original: Von der ganzen saint-simonistischen Literatur hat Herr Grün kein einziges Buch in der Hand gehabt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '480'
- id: WSIV.56.2
  kind: p
  original: 'Seine Hauptquellen sind: vor Allem der vielverachtete Lorenz Stein, ferner die Hauptquelle Steins, L. Reybaud (wofür er p. 260 an Herrn Reybaud ein Exempel statuieren will und ihn einen Philister nennt; er stellt sich auf derselben Seite, als sei ihm Reybaud erst lange, nachdem er die Saint-Simonisten abgefertigt, ganz zufällig in die Hände geraten) und stellenweise L. Blanc.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '480'
- id: WSIV.56.3
  kind: p
  original: Wir werden den Beweis ganz direkt liefern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '480'
- id: WSIV.57.1
  kind: p
  original: Vergleichen wir zuerst, was Herr Grün über das Leben Saint-Simons selbst sagt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '480'
- id: WSIV.58.1
  kind: p
  original: Die Hauptquellen für das Leben Saint-Simons sind die Fragmente seiner Selbstbiographie in den Œuvres de Saint-Simon, publiziert von Olinde Rodrigues, und dem "Organisateur" vom 19. Mai 1830.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.58.2
  kind: p
  original: 'Wir haben hier also sämtliche Aktenstücke vor uns: 1. die Originalquellen, 2. Reybaud, der sie auszog, 3. Stein, der Reybaud benutzte, 4. die belletristische Ausgabe von Herrn Grün.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.59.1
  kind: p
  original: 'Herr Grün:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.60.1
  kind: p
  original: '"Saint-Simon kämpft den Befreiungskampf der Amerikaner mit, ohne ein besondres Interesse am Kriege selbst zu haben; es fällt ihm ein, man könne die beiden großen Weltmeere verbinden." p. 84.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.61.1
  kind: p
  original: 'Stein, p. 143:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.62.1
  kind: p
  original: '"Zuerst trat er in den militärischen Dienst... und ging mit Bouillé nach Amerika...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.62.2
  kind: p
  original: In diesem Krieg, dessen Bedeutung er übrigens wohl begriff... der Krieg als solcher, sagte er, interessierte mich nicht, nur der Zweck dieses Kriegs etc."...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.62.3
  kind: p
  original: '"Nachdem er vergebens versucht, den Vizekönig von Mexiko für einen großen Kanalbau zur Verbindung der beiden Weltmeere zu interessieren."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.63.1
  kind: p
  original: 'Reybaud, p. 77:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.64.1
  kind: p
  original: '"Soldat de l''indépendance américaine, il servait sous Washington... la guerre, en elle-même, ne m''intéressait pas, dit-il; mais le seul but de la guerre m''intéressait vivement, et cet intérêt m''en faisait supporter les travaux sans répugnance."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.65.1
  kind: p
  original: <"Als Soldat der amerikanischen Unabhängigkeitsbewegung diente er unter Washington... der Krieg selbst interessierte mich nicht, sagte er, sondern einzig der Zweck des Krieges interessierte mich lebhaft, und dieses Interesse ließ mich seine Beschwernisse ohne Widerwillen ertragen.>
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.66.1
  kind: p
  original: Herr Grün schreibt nur ab, daß Saint-Simon "kein besondres Interesse am Kriege selbst" hatte, läßt aber die Pointe aus, nämlich sein Interesse für den Zweck dieses Kriegs.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.67.1
  kind: p
  original: Herr Grün läßt ferner weg, daß Saint-Simon seinen Plan beim Vizekönig habe durchsetzen wollen, und reduziert ihn dadurch auf einen bloßen "Einfall".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.67.2
  kind: p
  original: Er läßt ebenfalls fort, weil Stein dies nur durch die Jahreszahl andeutet, daß Saint-Simon dies erst "à la paix" <"im Frieden"> tat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.68.1
  kind: p
  original: 'Herr Grün fährt unmittelbar fort:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.69.1
  kind: p
  original: '" Später " (wann?)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.69.2
  kind: p
  original: '" entwirft er den Plan zu einer französisch-holländischen Expedition nach dem englischen Indien." (ibid).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.70.1
  kind: p
  original: 'Stein:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.71.1
  kind: p
  original: '"Er reiste 1785 nach Holland, um eine vereinigte französisch-holländische Expedition gegen die englischen Kolonien in Indien zu entwerfen." p.143.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '481'
- id: WSIV.72.1
  kind: p
  original: Stein erzählt hier falsch und Grün kopiert getreu.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.72.2
  kind: p
  original: Nach Saint-Simon selbst hatte der Herzog von La Vauguyon die Generalstaaten bestimmt, eine vereinigte Expedition mit Frankreich nach den englischen Kolonien in Indien zu unternehmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.72.3
  kind: p
  original: Von sich selbst sagt er nur, daß er, "während eines Jahres die Ausführung dieses Plans betrieben " (poursuivi) habe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.73.1
  kind: p
  original: 'Herr Grün:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.74.1
  kind: p
  original: '"In Spanien will er einen Kanal von Madrid ins Meer graben." (ibid.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.75.1
  kind: p
  original: Saint-Simon will einen Kanal graben, welcher Unsinn!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.75.2
  kind: p
  original: Vorhin fiel ihm ein, jetzt will er.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.75.3
  kind: p
  original: Grün verfälscht hier das Faktum, nicht weil er, wie oben, den Stein zu getreu, sondern weil er ihn zu oberflächlich abschreibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.76.1
  kind: p
  original: 'Stein, p. 44:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.77.1
  kind: p
  original: '"1786 nach Frankreich zurückgekehrt, ging er schon im folgenden Jahr nach Spanien, um dem Gouvernement einen Plan zur Vollendung eines Kanals von Madrid bis zum Meere vorzulegen."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.78.1
  kind: p
  original: Herr Grün konnte bei raschem Lesen sich seinen obigen Satz aus dem Steinschen abstrahieren, weil es bei Stein wenigstens den Schein hat, als sei der Bauplan und die Idee des ganzen Projekts von Saint-Simon ausgegangen, während dieser nur einen Plan zur Beseitigung der bei dem längst begonnenen Kanalbau eingetretenen finanziellen Schwierigkeiten entwarf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.79.1
  kind: p
  original: 'Reybaud:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.80.1
  kind: p
  original: '"Six ans plus tard il proposa au gouvernement espagnol un plan de canal qui devait établir une ligne navigable de Madrid à la mer." p.78.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.81.1
  kind: p
  original: <"Sechs Jahre später unterbreitete er der spanischen Regierung den Plan eines Kanals, der eine schiffbare Verbindung zwischen Madrid und dem Meer herstellen sollte.">
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.82.1
  kind: p
  original: Derselbe Irrtum wie bei Stein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.83.1
  kind: p
  original: 'Saint-Simon, p. XVII:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.84.1
  kind: p
  original: '"Le gouvernement espagnol avait entrepris un canal qui devait faire communiquer Madrid à la mer; cette entreprise languissait parce que ce gouvernement manquait d''ouvriers et d''argent; je me concertait avec M. le comte de Cabarrus, aujourd''hui ministre des finances, et nous présentâmes au gouvernement le projet suivant" etc.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.85.1
  kind: p
  original: <"Die spanische Regierung hatte den Bau eines Kanals unternommen, der Madrid mit dem Meere verbinden sollte; dieses Unternehmen stockte, weil es der Regierung an Arbeitern und Geld fehlte, ich verständigte mich mit dem Grafen Cabarrus, dem heutigen Finanzminister, und wir legten der Regierung folgendes Projekt vor" usw.>
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.86.1
  kind: p
  original: 'Herr Grün:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.87.1
  kind: p
  original: '"In Frankreich spekuliert er auf Nationalgüter."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '482'
- id: WSIV.88.1
  kind: p
  original: 'Stein schildert erst Saint-Simons Stellung während der Revolution und kommt dann auf seine Spekulation in Nationalgütern, p. 144 seqq. Woher aber Herr Grün den unsinnigen Ausdruck hat: " auf Nationalgüter spekulieren", statt in Nationalgütern, auch hierüber können wir dem Leser durch Vorlage des Originals Aufklärung geben:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.89.1
  kind: p
  original: 'Reybaud, p. 78:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.90.1
  kind: p
  original: '"Revenu à Paris, il tourna son activité vers des spéculations, et trafiqua sur les domaines nationaux."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.91.1
  kind: p
  original: <"Nach Paris zurückgekehrt, wandte er seine Tätigkeit Spekulationen zu und spekulierte in Nationalgütern."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.91.2
  kind: p
  original: (sur ist in den meisten anderen Verbindungen mit auf zu übersetzen.)>
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.92.1
  kind: p
  original: Herr Grün stellt seinen obigen Satz ohne alle Motivierung hin.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.92.2
  kind: p
  original: Man erfährt gar nicht, weshalb Saint-Simon in Nationalgütern spekulierte und weshalb dies an sich triviale Faktum von Bedeutung in seinem Leben ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.92.3
  kind: p
  original: Herr Grün findet nämlich überflüssig, aus Stein und Reybaud abzuschreiben, daß Saint-Simon eine wissenschaftliche Schule und ein großes industrielles Etablissement als Experimente gründen und sich das dazu nötige Kapital durch diese Spekulationen verschaffen wollte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.92.4
  kind: p
  original: Saint-Simon motiviert selbst seine Spekulationen hierdurch. (Œuvres, p. XIX.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.93.1
  kind: p
  original: 'Herr Grün:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.94.1
  kind: p
  original: '"Er heiratet, um die Wissenschaft bewirten zu können, um das Leben der Menschen zu erproben, um sie psychologisch auszusaugen." (ibid.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.95.1
  kind: p
  original: Herr Grün überspringt hier plötzlich eine der wichtigsten Perioden Saint-Simons, die seiner naturwissenschaftlichen Studien und Reisen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.95.2
  kind: p
  original: Was heißt das, heiraten, um die Wissenschaft zu bewirten, heiraten, um die Menschen (die man nicht heiratet) psychologisch auszusaugen pp.?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.95.3
  kind: p
  original: 'Die ganze Sache ist die: Saint-Simon heiratete, um Salons halten und dort unter Andern auch die Gelehrten studieren zu können.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.96.1
  kind: p
  original: 'Stein drückt dies so aus, p. 149:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.97.1
  kind: p
  original: '"Er verheiratet sich 1801...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.97.2
  kind: p
  original: Ich habe die Ehe benutzt, um die Gelehrten zu studieren." (Vgl. Saint-Simon. p. 23.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.98.1
  kind: p
  original: Jetzt, durch Vergleichung des Originals, wird Herrn Grüns Unsinn verständlich und erklärlich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.99.1
  kind: p
  original: Das "psychologische Aussaugen der Menschen " reduziert sich bei Stein und Saint-Simon selbst auf die Beobachtung der Gelehrten im gesellschaftlichen Leben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '483'
- id: WSIV.99.2
  kind: p
  original: Saint-Simon wollte, ganz im Zusammenhange mit seiner sozialistischen Grundansicht, den Einfluß der Wissenschaft auf die Persönlichkeit der Gelehrten und auf ihr Verhalten im gewöhnlichen Leben kennenlernen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 483-484
- id: WSIV.99.3
  kind: p
  original: Bei Herrn Grün verwandelt sich dies in einen sinnlosen, unbestimmten, romanhaften Einfall.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.100.1
  kind: p
  original: 'Herr Grün:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.101.1
  kind: p
  original: '"Er wird arm" (wie, wodurch?), "kopiert in einem Lombard für tausend Franken Jahrgehalt - er, der Graf, der Sprößling Karls des Großen; dann " (wann und warum?) lebt er von der Gnade eines ehemaligen Dieners; später" (wann und warum?) "versucht er sich zu erschießen, wird gerettet und beginnt ein neues Leben des Studiums und der Propaganda.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.101.2
  kind: p
  original: Jetzt erst schreibt er seine beiden Hauptwerke."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.102.1
  kind: p
  original: '"Er wird" - "dann" - "später - "Jetzt" sollen bei Herrn Grün die Chronologie und den Zusammenhang der einzelnen Lebensmomente Saint-Simons ersetzen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.103.1
  kind: p
  original: 'Stein, p. 156,157:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.104.1
  kind: p
  original: '"Dazu kam ein neuer und furchtbarer Feind, die allmählich immer drückender werdende äußere Not...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.104.2
  kind: p
  original: Nach sechs Monaten peinlichen Harrens wird... ihm eine Stelle -" (auch den Gedankenstrich hat Herr Grün von Stein, nur daß er so pfiffig war, ihn hinter den Lombard zu stellen) "als Kopist im Lombard" (nicht, wie Herr Grün pfiffigerweise ändert, in einem Lombard", da es bekanntlich in Paris nur den einen, öffentlichen Lombard gibt) mit tausend Franken Jahrgehalt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.104.3
  kind: p
  original: Wunderbarer Glückswechsel jener Zeiten!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.104.4
  kind: p
  original: Der Enkel des berühmten Höflings an Ludwigs XIV. Hofe, der Erbe einer Herzogskrone, eines mächtigen Vermögens, ein geborner Pair von Frankreich und Grande von Spanien, Kopist in einem Lombard!"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.105.1
  kind: p
  original: Hier erklärt sich Herrn Grüns Versehen mit dem Lombard; hier, bei Stein, ist der Ausdruck am Orte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.105.2
  kind: p
  original: Um sich auch sonst noch von Stein zu unterscheiden, nennt Herr Grün Saint-Simon nur "Graf" und "Sprößling Karls des Großen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.105.3
  kind: p
  original: Letzteres hat er von Stein p. 142, Reybaud p. 77, die indes so klug sind, zu sagen, Saint-Simon leite sich selbst von Karl dem Großen her.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.105.4
  kind: p
  original: Statt der positiven Fakta Steins, die allerdings unter der Restauration die Armut Saint-Simons auffallend machen, erfahren wir bei Herrn Grün nur seine Verwunderung darüber, daß ein Graf und angeblicher Sprößling Karls des Großen überhaupt herunterkommen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.106.1
  kind: p
  original: 'Stein:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.107.1
  kind: p
  original: '"Zwei Jahre lebte er noch" (nach dem Selbstmordsversuch),und wirkte in ihnen vielleicht mehr als in ebensoviel Jahrzehnten seines früheren Lebens.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.107.2
  kind: p
  original: 'Der ''Catéchisme des industriels'' ward vollendet " (Herr Grün verwandelt dies Vollenden eines längst vorbereiteten Werks in: "Jetzt erst schrieb er" pp.) "und der ''Nouveau christianisme'' pp.", p. 164, 165.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.108.1
  kind: p
  original: p. 169 nennt Stein diese beiden Schriften "die beiden Hauptwerke seines Lebens".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '484'
- id: WSIV.109.1
  kind: p
  original: Herr Grün hat also nicht nur die Irrtümer Steins kopiert, sondern auch aus unbestimmt gehaltenen Stellen Steins neue fabriziert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '485'
- id: WSIV.109.2
  kind: p
  original: Um seine Abschreiberei zu verdecken, nimmt er nur die hervorspringendsten Fakta heraus, raubt ihnen aber ihren Charakter als Fakta, indem er sie sowohl aus dem chronologischen Zusammenhange wie aus ihrer ganzen Motivierung reißt und selbst die allernotwendigsten Mittelglieder ausläßt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '485'
- id: WSIV.109.3
  kind: p
  original: Was wir nämlich oben gegeben haben, ist buchstäblich Alles, was Herr Grün von Saint-Simons Leben berichtet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '485'
- id: WSIV.109.4
  kind: p
  original: In dieser Darstellung wird das bewegte, tätige Leben Saint-Simons in eine Reihe von Einfällen und Ereignissen verwandelt, die weniger Interesse darbieten als das Leben des ersten besten gleichzeitigen Bauern oder Spekulanten in einer bewegten Provinz Frankreichs.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '485'
- id: WSIV.109.5
  kind: p
  original: 'Und dann, nachdem er diese biographische Sudelei hingeworfen hat, ruft er aus: "Dieses ganze, echt zivilisierte Leben!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '485'
- id: WSIV.109.6
  kind: p
  original: 'Ja er scheut sich nicht, p. 85 zu sagen: "Saint-Simons Leben ist der Spiegel des Saint-Simonismus selbst -" als wenn dies Grünsche "Leben" Saint-Simons der Spiegel von irgend etwas wäre, außer von Herrn Grüns Art der Buchmacherei "selbst".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '485'
- id: WSIV.110.1
  kind: p
  original: Wir haben uns bei dieser Biographie länger aufgehalten, weil sie ein klassisches Exempel von der Art und Weise liefert, in der Herr Grün die französischen Sozialisten gründlich behandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '485'
- id: WSIV.110.2
  kind: p
  original: 'Wie er hier schon scheinbar nonchalant hinwirft, ausläßt, verfälscht, transponiert, um seine Abschreiberei zu verbergen, so werden wir später sehen, daß Herr Grün auch fernerhin alle Symptome eines innerlich beunruhigten Plagiarius entwickelt: künstliche Unordnung, um die Vergleichung zu erschweren, Auslassung von Sätzen und Worten, die er wegen Unkenntnis der Originale nicht recht versteht, aus den Zitaten seiner Vorgänger, Dichtung und Ausschmückung durch unbestimmte Phrasen, perfide Ausfälle auf die Leute, die er gerade kopiert.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '485'
- id: WSIV.110.3
  kind: p
  original: Ja Herr Grün ist so übereilt und hastig in seiner Abschreiberei, daß er sich oft auf Sachen beruft, von denen er dem Leser nie gesprochen, die er aber als Leser Steins im Kopfe mit sich herumträgt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '485'
- id: WSIV.111.1
  kind: p
  original: Wir gehn jetzt auf die Grünsche Darstellung der Doktrin Saint-Simons über.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '485'
- id: WSIV.112.1
  kind: heading
  original: 1."Lettres d'un habitant de Genève à ses contemporains"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '485'
- id: WSIV.113.1
  kind: p
  original: Herr[n] Grün wurde aus Stein nicht recht klar, in welchem Zusammenhange der in der eben zitierten Schrift gegebene Plan zur Unterstützung der Gelehrten mit dem phantastischen Anhange der Broschüre steht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '485'
- id: WSIV.113.2
  kind: p
  original: 'Er spricht von dieser Schrift, als wenn es sich in ihr hauptsächlich um eine neue Organisation der Gesellschaft handle, und schließt wie folgt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 485-486
- id: WSIV.114.1
  kind: p
  original: '"Die geistliche Macht in den Händen der Gelehrten, die weltliche Macht in den Händen der Eigentümer, die Wahl für Alle." p. 85. Vgl. Stein, p. 151, Reybaud, p. 83.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '486'
- id: WSIV.115.1
  kind: p
  original: Den Satz "le pouvoir de nommer les individus appelés à remplir les fonctions des chefs de l'humanité entre les mains de tout le monde" <"die Macht zur Ernennung der Individuen, die berufen sind, die Funktionen der Führer der Menschheit auszuüben, in den Händen von jedermann">, den Reybaud aus Saint-Simon (p. 47) zitiert und Stein höchst unbeholfen übersetzt - diesen Satz reduziert Herr Grün auf "die Wahl für Alle", wodurch er allen Sinn verliert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '486'
- id: WSIV.115.2
  kind: p
  original: Bei Saint-Simon ist von der Wahl des Newtonschen Rats die Rede, bei Herrn Grün handelt es sich von der Wahl überhaupt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '486'
- id: WSIV.116.1
  kind: p
  original: Nachdem Herr Grün durch vier oder fünf von Stein und Reybaud abgeschriebne Sätze längst mit den "Lettres pp." fertig geworden ist und schon vom "Nouveau christianisme" gesprochen hat, kehrt er plötzlich zu ihnen zurück.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '486'
- id: WSIV.117.1
  kind: p
  original: '"Aber die abstrakte Wissenschaft tut''s freilich nicht."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '486'
- id: WSIV.117.2
  kind: p
  original: (Noch viel weniger die konkrete Unwissenheit, wie wir sehen.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '486'
- id: WSIV.117.3
  kind: p
  original: '"Vom Standpunkt der abstrakten Wissenschaft waren ja die ''Eigentümer'' und ''Jedermann'' noch auseinandergefallen." p. 87.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '486'
- id: WSIV.118.1
  kind: p
  original: Herr Grün vergißt, daß er bisher nur von "der Wahl für alle", nicht von "Jedermann" gesprochen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '486'
- id: WSIV.118.2
  kind: p
  original: Aber bei Stein und Reybaud findet er "tout le monde" und setzt daher "Jedermann" in Anführungszeichen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '486'
- id: WSIV.118.3
  kind: p
  original: 'Er vergißt ferner, daß er den folgenden Satz Steins, wodurch das "ja" in seinem eignen Satze motiviert wird, nicht mitgeteilt hat:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '486'
- id: WSIV.119.1
  kind: p
  original: '"Es treten ihm" (Saint-Simon) "neben den Weisen oder Wissenden die propriétaires <Eigentümer> und tout le monde auseinander.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '486'
- id: WSIV.119.2
  kind: p
  original: Zwar sind Beide noch ohne eigentliche Grenze im Verhältnis zueinander... dennoch liegt schon in jenem vagen Bilde der tout le monde der Keim der Klasse verborgen, die zu begreifen und zu heben die spätere Grundtendenz seiner Theorie ward, der classe la plus nombreuse et la plus pauvre <zahlreichsten und ärmsten Klasse> wie in der Wirklichkeit dieser Teil des Volkes damals nur potentiell da war." p. 154.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '486'
- id: WSIV.120.1
  kind: p
  original: Stein hebt hervor, daß Saint-Simon zwischen propriétaires und tout le monde schon einen Unterschied, aber noch einen sehr unbestimmten macht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '486'
- id: WSIV.120.2
  kind: p
  original: Herr Grün verdreht dies dahin, daß Saint-Simon den Unterschied überhaupt noch macht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '486'
- id: WSIV.120.3
  kind: p
  original: Dies ist natürlich ein großes Versehen von Saint-Simon und nur dadurch zu erklären, daß er in den "Lettres" auf dem Standpunkte der abstrakten Wissenschaft sich befindet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '486'
- id: WSIV.120.4
  kind: p
  original: Leider aber spricht Saint-Simon an der fraglichen Stelle gar nicht, wie Herr Grün meint, von Unterschieden in einer zukünftigen Gesellschaftsordnung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 486-487
- id: WSIV.120.5
  kind: p
  original: 'Er adressiert sich wegen einer Subskription an die ganze Menschheit, die ihm, wie er sie vorfindet, in drei Klassen geteilt erscheint: in drei Klassen, die nicht, wie Stein glaubt, savants <gelehrte>, propriétaires und tout le monde sind, sondern 1. die savants und artistes <Künstler> und alle Leute mit liberalen Ideen, 2. die Gegner der Neuerung, d.h. die propriétaires, sofern sie sich nicht der ersten Klasse anschließen, 3. das surplus de l''humanité qui se rallie au mot: Égalité <Der Rest der Menschheit, der sich bei der Parole Gleichheit versammelt>.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '487'
- id: WSIV.120.6
  kind: p
  original: Diese drei Klassen bilden tout le monde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '487'
- id: WSIV.120.7
  kind: p
  original: Vgl. Saint-Simon, "Lettres", p. 21, 22. Da Saint-Simon übrigens an einer späteren Stelle sagt, er halte seine Verteilung der Gewalt für vorteilhaft für alle Klassen, so entspricht in der Stelle, wo er von dieser Verteilung spricht, p. 47, tout le monde offenbar dem surplus, das sich bei der Parole Gleichheit ralliiert, ohne indes die andern Klassen auszuschließen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '487'
- id: WSIV.120.8
  kind: p
  original: Stein hat also in der Hauptsache das Richtige getroffen, obwohl er die Stelle p. 21, 22 nicht berücksichtigt, und Herr Grün, der das Original gar nicht kennt, klammert sich an das unbedeutende Versehen Steins, um aus seinem Räsonnement sich baren Unsinn zu abstrahieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '487'
- id: WSIV.121.1
  kind: p
  original: 'Wir erhalten sogleich ein noch frappanteres Beispiel. p. 94, wo Herr Grün gar nicht mehr von Saint-Simon, sondern von seiner Schule spricht, erfahren wir unerwartet:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '487'
- id: WSIV.122.1
  kind: p
  original: '"Saint-Simon sagt in einem seiner Bücher die mysteriösen Worte: ''Die Frauen werden zugelassen werden, sie werden selbst ernannt werden können.'''
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '487'
- id: WSIV.122.2
  kind: p
  original: Aus diesem fast tauben Saatkorn ist der ganze ungeheure Spektakel der Emanzipation der Frauen entsprossen."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '487'
- id: WSIV.123.1
  kind: p
  original: Allerdings, wenn Saint-Simon in einer beliebigen Schrift von einer Zulassung und Ernennung der Frauen, man weiß nicht wozu, gesprochen hat, so sind dies sehr "mysteriöse Worte".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '487'
- id: WSIV.123.2
  kind: p
  original: Dies Mysterium existiert aber nur für Herrn Grün.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '487'
- id: WSIV.123.3
  kind: p
  original: Das "eine der Bücher" Saint-Simons ist kein andres als die "Lettres d'un habitant de Genève".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '487'
- id: WSIV.123.4
  kind: p
  original: 'Nachdem Saint-Simon hier gesagt hat, daß jeder Mensch für den Newtonschen Rat oder dessen Abteilungen unterschreiben kann, fährt er fort: Les femmes seront admises à souscrire, elles pourront être nommées < Die Frauen werden zum Unterschreiben zugelassen werden, sie werden ernannt werden können.>.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '487'
- id: WSIV.123.5
  kind: p
  original: Natürlich, zu einer Stelle in diesem Rat oder seinen Abteilungen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '487'
- id: WSIV.123.6
  kind: p
  original: 'Stein hat diese Stelle, wie sich gebührt, bei dem Buche selbst zitiert und macht dabei folgende Bemerkung:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '487'
- id: WSIV.124.1
  kind: p
  original: Hier pp. "finden sich alle Spuren seiner späteren Ansicht und selbst seiner Schule im Keime wieder, und selbst der erste Gedanke einer Emanzipation der Frauen ". p. 152.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '487'
- id: WSIV.125.1
  kind: p
  original: Stein hebt auch richtig in einer Note hervor, daß Olinde Rodrigues diese Stelle in seiner Ausgabe von 1832 als einzige Belegstelle für die Frauenemanzipation bei Saint-Simon selbst aus polemischen Gründen groß drucken ließ.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '488'
- id: WSIV.125.2
  kind: p
  original: Grün, um seine Abschreiberei zu verbergen, versetzt diese Stelle von dem Buch, wohin sie gehört, in die Schule, macht den obigen Unsinn daraus, verwandelt Steins "Keim" in ein "Saatkorn" und bildet sich kindischerweise ein, die Lehre von der Emanzipation der Frauen sei aus dieser Stelle hervorgegangen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '488'
- id: WSIV.126.1
  kind: p
  original: Herr Grün riskiert eine Ansicht über einen Gegensatz, worin die "Briefe eines Bewohners von Genf" zum "Katechismus der Industriellen" stehen sollen und der darin besteht, daß im "Katechismus" das Recht der travailleurs geltend gemacht wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '488'
- id: WSIV.126.2
  kind: p
  original: Herr Grün mußte diesen Unterschied allerdings zwischen den ihm von Stein und Reybaud überlieferten "Lettres" und dem ebenso überlieferten "Catéchisme" entdecken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '488'
- id: WSIV.126.3
  kind: p
  original: Hätte er den Saint-Simon selbst gelesen, so konnte er statt dieses Gegensatzes in den "Lettres" schon sein "Saatkorn" zu der unter Andern im "Catéchisme" weiter entwickelten Anschauung finden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '488'
- id: WSIV.126.4
  kind: p
  original: 'Z.B.:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '488'
- id: WSIV.127.1
  kind: p
  original: '"Tous les hommes travailleront" <"Alle Menschen werden arbeiten müssen">, "Lettres", p. 60. "Si sa cervelle" (des Reichen) "ne sera pas propre au travail, il sera bien obligé de faire travailler ses bras; car Newton ne laissera sûrement pas sur cette planète... des ouvriers volontairement inutiles dans l''atelier." <" Wenn sein Gehirn nicht zur Arbeit taugt, wird er mit den Händen arbeiten müssen; denn Newton wird auf diesem Planeten sicher keine Arbeiter dulden, die in der Werkstatt willentlich unnütz sind."> p. 64.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '488'
- id: WSIV.128.1
  kind: heading
  original: 2. "Catéchisme politique des industriels"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '488'
- id: WSIV.129.1
  kind: p
  original: Da Stein diese Schrift gewöhnlich als "Catéchisme des industriels" zitiert, so kennt Herr Grün keinen andern Titel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '488'
- id: WSIV.129.2
  kind: p
  original: Die Angabe des richtigen Titels wenigstens wäre um so eher von Herrn Grün zu verlangen gewesen, als er da, wo er ex officio <von Amts wegen> von dieser Schrift spricht, ihr nur zehn Zeilen dediziert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '488'
- id: WSIV.130.1
  kind: p
  original: 'Nachdem Herr Grün aus Stein abgeschrieben hat; daß Saint-Simon in dieser Schrift der Arbeit die Herrschaft geben will, fährt er fort:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '488'
- id: WSIV.131.1
  kind: p
  original: '"Die Welt teilt sich für ihn jetzt in Müßiggänger und Industrielle." p. 85.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '488'
- id: WSIV.132.1
  kind: p
  original: Herr Grün begeht hier ein Falsum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '488'
- id: WSIV.132.2
  kind: p
  original: 'Er schiebt dem "Catéchisme" eine Unterscheidung unter, die er bei Stein viel später, bei Gelegenheit der saint-simonistischen Schule, vorfindet:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '488'
- id: WSIV.133.1
  kind: p
  original: 'Stein, p. 206:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.134.1
  kind: p
  original: '"Die Gesellschaft besteht gegenwärtig nur aus Müßiggängern und Arbeitern." (Enfantin.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.135.1
  kind: p
  original: Statt dieser untergeschobenen Einteilung findet sich im "Catéchisme" die Einteilung in drei Klassen, die classes féodale, intermédiaire et industrielle <feudale, mittlere und industrielle Klasse>, auf die Herr Grün natürlich nicht eingehen konnte, ohne Stein abzuschreiben, da er den "Catéchisme" selbst nicht kannte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.136.1
  kind: p
  original: 'Herr Grün wiederholt hierauf noch einmal, daß die Herrschaft der Arbeit der Inhalt des "Catéchisme" ist, und schließt dann seine Charakteristik dieser Schrift folgendermaßen:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.137.1
  kind: p
  original: '"Wie der Republikanismus sagt: Alles für das Volk, Alles durch das Volk, so sagt Saint-Simon: Alles für die Industrie, Alles durch die Industrie." (ibid.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.138.1
  kind: p
  original: 'Stein, p. 165:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.139.1
  kind: p
  original: '"Da Alles durch die Industrie geschieht, so muß auch Alles für sie geschehen."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.140.1
  kind: p
  original: 'Wie Stein richtig angibt (p. 160, Note), findet sich bereits auf der Schrift Saint-Simons "L''industrie" von 1817 das Motto: Tout par l''industrie, tout pour elle <Alles durch die Industrie, alles für sie>.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.140.2
  kind: p
  original: Herrn Grüns Charakteristik des "Catéchisme" besteht also darin, daß er, außer dem obigen Falsum, das Motto einer viel früheren Schrift, die er gar nicht kennt, falsch zitiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.141.1
  kind: p
  original: Hiermit hat die deutsche Gründlichkeit den "Catéchisme politique des industriels" hinreichend kritisiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.141.2
  kind: p
  original: Wir finden indes noch an andern sehr zerstreuten Stellen des Grünschen Sammelsuriums einzelne hieher gehörige Glossen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.141.3
  kind: p
  original: 'Herr Grün verteilt mit innerem Vergnügen über seine eigene Schlauheit die Sachen, die er bei Steins Charakteristik dieser Schrift zusammenfindet, und verarbeitet sie mit anerkennenswerter Courage:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.142.1
  kind: p
  original: 'Herr Grün, p. 87:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.143.1
  kind: p
  original: '"Die freie Konkurrenz war ein unreiner, ein konfuser Begriff, ein Begriff, der in sich selbst eine neue Welt von Kampf und Unglück enthielt, den Kampf zwischen Kapital und Arbeit und das Unglück des kapitallosen Arbeiters.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.143.2
  kind: p
  original: Saint-Simon reinigte den Begriff der Industrie, er reduzierte ihn auf den Begriff der Arbeiter, er formulierte die Rechte und Beschwerden des vierten Standes, des Proletariats.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.143.3
  kind: p
  original: Er mußte das Erbrecht aufheben, weil es zum Unrecht am Arbeiter, am Industriellen wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.143.4
  kind: p
  original: Diese Bedeutung hat sein 'Katechismus der Industriellen'."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.144.1
  kind: p
  original: 'Herr Grün fand bei Stein, p. 169, bei Gelegenheit des "Catéchisme":'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.145.1
  kind: p
  original: '"Das ist mithin die wahre Bedeutung Saint-Simons, diesen Gegensatz" (von Bourgeoisie und peuple <Volk>) "als einen bestimmten vorausgesehen zu haben."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '489'
- id: WSIV.146.1
  kind: p
  original: Dies das Original zu der "Bedeutung" des "Katechismus"' bei Herrn Grün.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '490'
- id: WSIV.146.2
  kind: p
  original: 'Stein:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '490'
- id: WSIV.147.1
  kind: p
  original: '"Er" (Saint-Simon im "Catéchisme") "beginnt mit dem Begriff des industriellen Arbeiters.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '490'
- id: WSIV.148.1
  kind: p
  original: Hieraus macht Herr Grün den kolossalen Unsinn, daß Saint-Simon, der die freie Konkurrenz als einen "unreinen Begriff" vorfand, "den Begriff der Industrie reinigte und ihn auf den Begriff der Arbeiter reduzierte".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '490'
- id: WSIV.148.2
  kind: p
  original: Daß der Begriff des Herrn Grün von der freien Konkurrenz und Industrie ein sehr "unreiner" und "konfuser" ist, zeigt er an allen Ecken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '490'
- id: WSIV.149.1
  kind: p
  original: Noch nicht zufrieden mit diesem Unsinn, wagt er die direkte Lüge, Saint-Simon habe die Aufhebung des Erbrechts verlangt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '490'
- id: WSIV.150.1
  kind: p
  original: 'Immer noch auf die Art gestützt, wie er den "Catéchisme" nach Stein versteht, sagt er p. 88:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '490'
- id: WSIV.151.1
  kind: p
  original: '"Saint-Simon hatte die Rechte des Proletariats festgesetzt, er hatte die neue Parole bereits ausgegeben: Die Industriellen, die Arbeiter sollen auf die erste Stufe der Macht erhoben werden.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '490'
- id: WSIV.151.2
  kind: p
  original: Das war einseitig, aber jeder Kampf führt die Einseitigkeit mit sich; wer nicht einseitig ist, kann nicht kämpfen."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '490'
- id: WSIV.152.1
  kind: p
  original: Herr Grün mit seiner schönrednerischen Maxime von der Einseitigkeit begeht hier selbst die Einseitigkeit, den Stein dahin mißzuverstehen, Saint-Simon habe die eigentlichen Arbeiter, die Proletarier, "auf die erste Stufe der Macht erheben" wollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '490'
- id: WSIV.152.2
  kind: p
  original: 'Vgl. p. 102, wo über Michel Chevalier gesagt wird:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '490'
- id: WSIV.153.1
  kind: p
  original: '"M. Chevalier spricht noch mit sehr großer Teilnahme von den Industriellen... aber dem Jünger sind die Industriellen nicht mehr die Proletarier, wie dem Meister; er faßt Kapitalist, Unternehmer und Arbeiter in einen Begriff zusammen, rechnet also die Müßiggänger mit zu einer Kategorie, die nur die ärmste und zahlreichste Klasse umfassen sollte."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '490'
- id: WSIV.154.1
  kind: p
  original: Bei Saint-Simon gehören zu den industriellen außer den Arbeitern auch die fabricants, négociants <Fabrikanten, Kaufleute>, kurz, sämtliche industrielle Kapitalisten, an die er sich sogar vorzugsweise adressiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '490'
- id: WSIV.154.2
  kind: p
  original: Herr Grün konnte dies bereits auf der ersten Seite des "Catéchisme" finden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '490'
- id: WSIV.154.3
  kind: p
  original: Man sieht aber, wie er, ohne die Schrift selbst je gesehen zu haben, nach dem Hörensagen belletristisch über sie phantasiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '490'
- id: WSIV.155.1
  kind: p
  original: 'Bei seiner Besprechung des "Catéchisme" sagt Stein:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '490'
- id: WSIV.156.1
  kind: p
  original: '"Von... kommt Saint-Simon zu einer Geschichte der Industrie in ihrem Verhältnis zur Staatsgewalt... er ist der erste, der es zum Bewußtsein gebracht hat, daß in der Wissenschaft der Industrie ein staatliches Moment verborgen liege... es läßt sich nicht leugnen, daß ihm ein wesentlicher Anstoß gelungen ist.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 490-491
- id: WSIV.156.2
  kind: p
  original: Denn erst seit ihm besitzt Frankreich eine Histoire de l'économie politique" pp., p. 165, 170.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '491'
- id: WSIV.157.1
  kind: p
  original: Stein selbst ist im höchsten Grade konfus, wenn er von einem "staatlichen Moment" in "der Wissenschaft der Industrie" spricht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '491'
- id: WSIV.157.2
  kind: p
  original: Er zeigt indes, daß er eine richtige Ahnung hatte, indem er hinzufügt, daß die Geschichte des Staats aufs genaueste zusammenhänge mit der Geschichte der Volkswirtschaft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '491'
- id: WSIV.158.1
  kind: p
  original: Sehen wir, wie Herr Grün später, da er von der saint-simonistischen Schule spricht, diesen Fetzen Steins sich aneignet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '491'
- id: WSIV.159.1
  kind: p
  original: '"Saint-Simon hatte in seinem ''Katechismus der Industriellen'' eine Geschichte der Industrie versucht, indem er das staatliche Element in ihr hervorhob.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '491'
- id: WSIV.159.2
  kind: p
  original: Der Meister selbst brach also die Bahn zur politischen Ökonomie." p. 99.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '491'
- id: WSIV.160.1
  kind: p
  original: Herr Grün verwandelt "also" zunächst das "staatliche Moment " Steins in ein "staatliches Element " und macht es zu einer sinnlosen Phrase, indem er die näheren Data, die Stein gegeben hatte, wegläßt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '491'
- id: WSIV.160.2
  kind: p
  original: Dieser "Stein, den die Bauleute verworfen haben", ist für Herrn Grün wirklich zum "Eckstein" seiner "Briefe und Studien" geworden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '491'
- id: WSIV.160.3
  kind: p
  original: Zugleich aber auch zum Stein des Anstoßes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '491'
- id: WSIV.160.4
  kind: p
  original: Aber noch mehr.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '491'
- id: WSIV.160.5
  kind: p
  original: Während Stein sagt, Saint-Simon habe durch Hervorhebung dieses staatlichen Moments in der Wissenschaft der Industrie die Bahn gebrochen zur Geschichte der politischen Ökonomie, läßt Herr Grün ihn die Bahn zur politischen Ökonomie selbst brechen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '491'
- id: WSIV.160.6
  kind: p
  original: 'Herr Grün räsoniert etwa so: Ökonomie gab es bereits vor Saint-Simon; wie Stein erzählt, hob er das staatliche Moment in der Industrie hervor, machte also die Ökonomie staatlich - staatliche Ökonomie = politische Ökonomie, also brach Saint-Simon die Bahn zur politischen Ökonomie.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '491'
- id: WSIV.160.7
  kind: p
  original: Herr Grün verrät unleugbar einen sehr heitern Geist bei Bildung seiner Konjekturen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '491'
- id: WSIV.161.1
  kind: p
  original: 'Der Art, wie Herr Grün Saint-Simon die Bahn zur politischen Ökonomie brechen läßt, entspricht die Art, wie er ihn die Bahn zum wissenschaftlichen Sozialismus brechen läßt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '491'
- id: WSIV.162.1
  kind: p
  original: '"Er" (der Saint-Simonismus) enthält... den wissenschaftlichen Sozialismus, indem Saint-Simon sein ganzes Leben lang nach der neuen Wissenschaft suchte"! p. 82.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '491'
- id: WSIV.163.1
  kind: heading
  original: 3. "Nouveau christianisme"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '491'
- id: WSIV.164.1
  kind: p
  original: Herr Grün gibt in derselben glänzenden Weise wie bisher Auszüge aus den Auszügen von Stein und Reybaud mit belletristischer Ausschmückung und unbarmherziger Zerreißung der bei diesen zusammengehörigen Glieder.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '491'
- id: WSIV.164.2
  kind: p
  original: Wir geben nur ein Beispiel, um zu zeigen, daß er auch diese Schrift nie in der Hand gehabt hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.165.1
  kind: p
  original: '"Es galt für Saint-Simon, eine einheitliche Weltanschauung herstellen, wie sie für organische Geschichtsperioden paßt, die er ausdrücklich den kritischen gegenüberstellt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.165.2
  kind: p
  original: Seit Luther leben wir nach seiner Meinung in einer kritischen Periode, er gedachte den Anfang der neuen organischen Periode zu begründen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.165.3
  kind: p
  original: Daher das 'Neue Christentum'." p. 88.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.166.1
  kind: p
  original: Saint-Simon hat nie und nirgends die organischen Geschichtsperioden den kritischen gegenübergestellt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.166.2
  kind: p
  original: Herr Grün lügt dies geradezu.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.166.3
  kind: p
  original: Erst Bazard machte diese Einteilung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.166.4
  kind: p
  original: Herr Grün fand bei Stein und Reybaud, daß im "Nouveau christianisme" Saint-Simon die Kritik Luthers anerkennt, aber seine positive, dogmatische Doktrin mangelhaft findet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.166.5
  kind: p
  original: Herr Grün wirft diesen Satz mit seinen Reminiszenzen aus ebendenselben Quellen über die saint-simonistische Schule zusammen und fabriziert daraus seine obige Behauptung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.167.1
  kind: p
  original: 'Nachdem Herr Grün in der geschilderten Weise über Saint-Simons Leben und Werke mit einziger Benutzung von Stein und dessen Leitfaden Reybaud einige belletristische Phrasen gemacht hat, schließt er mit dem Ausruf:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.168.1
  kind: p
  original: '"Und diesen Saint-Simon haben die Philister der Moral, Herr Reybaud und mit ihm die ganze Schar deutscher Nachschwätzer, in Schutz nehmen zu müssen geglaubt, indem sie mit ihrer gewöhnlichen Weisheit orakelten, ein solcher Mensch, ein solches Leben seien nicht nach gewöhnlichen Maßstäben zu messen!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.168.2
  kind: p
  original: '- Sagt doch, sind Eure Maßstäbe von Holz?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.168.3
  kind: p
  original: Sprecht die Wahrheit, es soll uns lieb sein, wenn sie von recht festem Eichenstamm sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.168.4
  kind: p
  original: Gebt sie her, wir wollen sie als ein kostbares Geschenk dankbar hinnehmen, wir wollen sie nicht verbrennen, behüte!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.168.5
  kind: p
  original: Wir wollen den Rücken der Philister mit ihnen - messen." p. 89.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.169.1
  kind: p
  original: Durch solche belletristische burschikose Phrasen dokumentiert Herr Grün seine Überlegenheit über seine Vorbilder.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.170.1
  kind: heading
  original: 4. Saint-simonistische Schule
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.171.1
  kind: p
  original: Da Herr Grün von den Saint-Simonisten geradesoviel gelesen hat wie von Saint-Simon selbst, nämlich Nichts, so hätte er wenigstens einen ordentlichen Auszug aus Stein und Reybaud machen, die chronologische Reihenfolge beobachten, den Verlauf im Zusammenhange erzählen, die nötigen Punkte erwähnen sollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.171.2
  kind: p
  original: Statt dessen tut er, durch sein böses Gewissen verleitet, das Gegenteil, wirft möglichst durcheinander, läßt die allernotwendigsten Dinge aus und richtet eine Konfusion an, die noch größer ist als in seiner Darstellung von Saint-Simon.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '492'
- id: WSIV.171.3
  kind: p
  original: Wir müssen uns hier noch kürzer fassen, da wir ein Buch schreiben müßten, so dick wie das des Herrn Grün, um jedes Plagiat und jeden Schnitzer hervorzuheben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 492-493
- id: WSIV.172.1
  kind: p
  original: 'Über die Zeit vom Tode Saint-Simons bis zur Julirevolution, die Zeit, worin mit die bedeutendste theoretische Entwicklung des Saint-Simonismus fällt, erfahren wir nichts: Hiermit fällt sogleich der bedeutendste Teil des Saint-Simonismus, die Kritik der bestehenden Zustände, ganz fort für Herrn Grün.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '493'
- id: WSIV.172.2
  kind: p
  original: Es war in der Tat auch schwer, hierüber etwas zu sagen, ohne die Quellen selbst, namentlich die Journale, zu kennen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '493'
- id: WSIV.173.1
  kind: p
  original: 'Herr Grün eröffnet seinen Kursus über die Saint-Simonisten mit folgendem Satze:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '493'
- id: WSIV.174.1
  kind: p
  original: '"Jedem nach seiner Fähigkeit, jeder Fähigkeit nach ihren Werken, so heißt das praktische Dogma des Saint-Simonismus."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '493'
- id: WSIV.175.1
  kind: p
  original: 'Wie Reybaud, p. 96, diesen Satz als Übergangspunkt von Saint-Simon zu den Saint-Simonisten darstellt, so Herr Grün, der fortfährt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '493'
- id: WSIV.176.1
  kind: p
  original: '"Es entspringt unmittelbar aus dem letzten Worte Saint-Simons: allen Menschen die freiste Entwicklung ihrer Anlagen zu sichern."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '493'
- id: WSIV.177.1
  kind: p
  original: Herr Grün wollte sich hier von Reybaud unterscheiden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '493'
- id: WSIV.177.2
  kind: p
  original: Reybaud knüpft dieses "praktische Dogma" an den "Nouveau christianisme" an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '493'
- id: WSIV.177.3
  kind: p
  original: Herr Grün hält dies für einen Einfall Reybauds und substituiert dem "Nouveau christianisme" ungeniert das letzte Wort Saint-Simons.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '493'
- id: WSIV.177.4
  kind: p
  original: Er wußte nicht, daß Reybaud nur einen wörtlichen Auszug aus der "Doctrine de Saint-Simon, Exposition, première année", p. 70, gab.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '493'
- id: WSIV.178.1
  kind: p
  original: Herr Grün weiß sich nicht recht zu erklären, wie hier bei Reybaud, nach einigen Auszügen über die religiöse Hierarchie des Saint-Simonismus, das "praktische Dogma" plötzlich hereingeschneit kommt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '493'
- id: WSIV.178.2
  kind: p
  original: Während dieser Satz erst im Zusammenhang mit den religiösen Ideen des "Nouveau christianisme" aufgefaßt auf eine neue Hierarchie hinweisen kann, während er ohne diese Ideen höchstens eine profane Klassifikation der Gesellschaft verlangt, bildet sich Herr Grün ein, aus diesem Satze allein folge die Hierarchie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '493'
- id: WSIV.178.3
  kind: p
  original: 'Er sagt p. 91:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '493'
- id: WSIV.179.1
  kind: p
  original: '"Jedem nach seiner Fähigkeit, das heißt die katholische Hierarchie zum Gesetz der gesellschaftlichen Ordnung machen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '493'
- id: WSIV.179.2
  kind: p
  original: 'Jeder Fähigkeit nach ihren Werken: das heißt auch noch die Werkstatt zur Sakristei, auch noch das ganze bürgerliche Leben in eine Domäne des Pfaffen verwandeln."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '493'
- id: WSIV.180.1
  kind: p
  original: 'Bei Reybaud findet er nämlich im oben erwähnten Auszug aus der Exposition:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '493'
- id: WSIV.181.1
  kind: p
  original: '"L''église vraiment universelle va paraître... l''église universelle gouverne le temporel comme le spirituel.... la science est sainte, l''industrie est sainte... et tout bien est bien d''église et toute profession est une fonction religieuse, un grade dans la hiérarchie sociale. - À chacun selon sa capacité, a chaque capacité selon ses œuvres."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 493-494
- id: WSIV.182.1
  kind: p
  original: <"Die wahrhaft allumfassende Kirche wird erscheinen... die allumfassende Kirche regiert das Weltliche wie das Geistliche... die Wissenschaft ist heilig, die Industrie ist heilig... und alles Gut ist Kirchengut, und jeder Beruf ist ein geistliches Amt, ein Grad in der sozialen Hierarchie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.182.2
  kind: p
  original: '- Jedem nach seiner Fähigkeit, jeder Fähigkeit nach ihren Werken.">'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.183.1
  kind: p
  original: Herr Grün hatte offenbar nur diese Stelle umzudrehen, nur die vorhergehenden Sätze in Folgerungen aus dem Schlußsatz zu verwandeln, um seinen ganz unbegreiflichen Satz herauszubringen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.184.1
  kind: p
  original: '"So wirr und kraus gestaltet sich" die Grünsche Widerspiegelung des Saint-Simonismus, daß er p. 90 erst aus dem "praktischen Dogma" ein "geistiges Proletariat", aus diesem geistigen Proletariat eine "Hierarchie der Geister" und aus dieser Hierarchie der Geister eine Spitze der Hierarchie hervorgehen läßt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.184.2
  kind: p
  original: Hätte er auch nur die Exposition gelesen, so würde er gesehen haben, wie die religiöse Anschauungsweise des "Nouveau christianisme" in Verbindung mit der Frage, wie denn die capacité festzustellen sei, die Notwendigkeit der Hierarchie und ihrer Spitze hereinbringt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.185.1
  kind: p
  original: Mit dem Einen Satz "À chacun selon sa capacité, à chaque capacité selon ses œuvres" hat Herr Grün seine ganze Darstellung und Kritik der Exposition von 1828/29 abgeschlossen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.185.2
  kind: p
  original: Den "Producteur" und "Organisateur" erwähnt er außerdem kaum einmal.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.185.3
  kind: p
  original: 'Er blättert in Reybaud und findet in dem Abschnitt "Dritte Epoche des Saint-Simonismus", p. 126, Stein, p. 205:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.186.1
  kind: p
  original: '"... et les jours suivants le Globe parut avec le sous-titre de Journal de la doctrine de Saint-Simon, laquelle était résumée ainsi sur la première page:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.187.1
  kind: heading
  original: Religion
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.188.1
  kind: p
  original: Science Industrie
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.189.1
  kind: heading
  original: Association universelle."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.190.1
  kind: p
  original: <"... und in den folgenden Tagen erschien der 'Globe' mit dem Untertitel 'Zeitschrift für die Lehre Saint-Simons', welche auf der ersten Seite wie folgt zusammengefaßt wurde;
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.191.1
  kind: heading
  original: Religion
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.192.1
  kind: p
  original: Wissenschaft Industrie
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.193.1
  kind: heading
  original: Allumfassende Vereinigung.">
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.194.1
  kind: p
  original: 'Herr Grün springt nun unmittelbar von dem obigen Satze ins Jahr 1831, indem er folgendermaßen Reybaud verarbeitet (p. 91):'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.195.1
  kind: p
  original: '"Die Saint-Simonisten stellten folgendes Schema ihres Systems auf, dessen Formulierung besonders das Werk Bazards war:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.196.1
  kind: heading
  original: Religion
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.197.1
  kind: p
  original: Wissenschaft Industrie
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.198.1
  kind: heading
  original: Allgemeine Association."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '494'
- id: WSIV.199.1
  kind: p
  original: Herr Grün läßt drei Sätze fort, die ebenfalls auf dem Titel des "Globe" stehen und sich Alle auf praktische soziale Reformen beziehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.199.2
  kind: p
  original: Sie finden sich sowohl bei Stein wie bei Reybaud.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.199.3
  kind: p
  original: Er tut dies, um dies bloße Aushängeschild eines Journals in ein "Schema" des Systems verwandeln zu können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.199.4
  kind: p
  original: Er verschweigt, daß es auf dem Titel des "Globe" stand, und kann nun im verstümmelten Titel dieses Blattes den ganzen Saint-Simonismus durch die kluge Bemerkung kritisieren, daß die Religion obenan stehe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.199.5
  kind: p
  original: Er konnte übrigens bei Stein finden, daß im "Globe" dies keineswegs der Fall ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.199.6
  kind: p
  original: Der "Globe" enthält, was Herr Grün freilich nicht wissen konnte, die ausführlichsten und wichtigsten Kritiken der bestehenden, besonders der ökonomischen Zustände
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.200.1
  kind: p
  original: Woher Herr Grün die neue, aber wichtige Nachricht hat, daß die "Formulierung dieses Schemas" von vier Worten " besonders das Werk Bazards war", ist schwer zu sagen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.201.1
  kind: p
  original: 'Vom Januar 1831 springt Herr Grün jetzt zurück zum Oktober 1830:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.202.1
  kind: p
  original: '"Ein kurzes, aber umfassendes Glaubensbekenntnis adressierten die Saint-Simonisten in der Periode Bazard " (woher die?) "kurz nach der Julirevolution an die Deputiertenkammer, nachdem die Herren Dupin und Mauguin sie von der Tribüne herab bezichtigt hatten, Güter- und Weibergemeinschaft zu lehren."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.203.1
  kind: p
  original: 'Folgt nun diese Adresse, und macht Herr Grün darauf die Bemerkung:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.204.1
  kind: p
  original: '"Wie vernünftig und gemessen ist das Alles noch.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.204.2
  kind: p
  original: Bazard redigierte die Eingabe an die Kammer." p. 92-94.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.205.1
  kind: p
  original: 'Was zunächst diese Schlußbemerkung betrifft, so sagt Stein, p. 205:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.206.1
  kind: p
  original: '"Seiner Form und Haltung nach stehen wir keinen Augenblick an, es" (dies Aktenstück) "mit Reybaud Bazard mehr zuzuschreiben als Enfantin."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.207.1
  kind: p
  original: 'Und Reybaud, p. 123:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.208.1
  kind: p
  original: '"Aux formes, aux prétentions assez modérées de cet écrit il est facile de voir qu''il provenait plutôt de l''impulsion de M. Bazard que de celle de son collègue."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.209.1
  kind: p
  original: <"An den Formen, an den ziemlich gemäßigten Forderungen dieser Schrift sieht man leicht, daß sie eher dem Anstoß des Herrn Bazard als dem seines Kollegen entsprang.">
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.210.1
  kind: p
  original: Herrn Grüns geniale Kühnheit verwandelt Reybauds Vermutung, daß Bazard eher als Enfantin den Anstoß zu dieser Adresse gab, in die Gewißheit, daß er sie ganz redigierte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.210.2
  kind: p
  original: 'Der Übergang zu diesem Aktenstück ist übersetzt aus Reybaud, p. 122:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.211.1
  kind: p
  original: '"MM. Dupin et Mauguin signalèrent du haut de la tribune une secte qui prêchait la communauté des biens et la communauté des femmes."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.212.1
  kind: p
  original: <"Die Herren Dupin und Mauguin wiesen von der Tribüne herab auf eine Sekte hin, die Güter- und Weibergemeinschaft predigt.">
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '495'
- id: WSIV.213.1
  kind: p
  original: 'Nur läßt Herr Grün das von Reybaud gegebne Datum weg und sagt dafür: "kurz nach der Julirevolution".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.213.2
  kind: p
  original: Die Chronologie paßt überhaupt nicht in die Art des Herrn Grün, sich von seinen Vorgängern zu emanzipieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.213.3
  kind: p
  original: Von Stein unterscheidet er sich hier, indem er in den Text setzt, was bei Stein in einer Note steht, indem er den Eingangspassus der Adresse wegläßt, indem er fonds de production (produktives Kapital) mit "Grundvermögen" und classement social des individus (gesellschaftliche Klassifizierung der Individuen) mit "gesellschaftliche Ordnung der Einzelnen" übersetzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.214.1
  kind: p
  original: Folgen nun einige liederliche Notizen über die Geschichte der saint-simonistischen Schule, welche mit derselben künstlerischen Plastik aus Stein, Reybaud und L. Blanc zusammengewürfelt sind wie oben das Leben Saint-Simons.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.214.2
  kind: p
  original: Wir überlassen dem Leser, diese im Buche selbst nachzusehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.215.1
  kind: p
  original: Wir haben dem Leser jetzt Alles mitgeteilt, was Herr Grün vom Saint-Simonismus in der Periode Bazard, d.h. seit dem Tode Saint-Simons bis zum ersten Schisma, zu sagen weiß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.215.2
  kind: p
  original: 'Er kann jetzt einen belletristisch-kritischen Trumpf ausspielen, indem er Bazard einen "schlechten Dialektiker" nennt und fortfährt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.216.1
  kind: p
  original: '"Aber so sind die Republikaner.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.216.2
  kind: p
  original: Sie wissen nur zu sterben, Cato wie Bazard; wenn sie sich nicht erdolchen, lassen sie sich das Herz brechen." p. 95. "Wenige Monate nach diesem Streite brach ihm " (Bazard) " das Herz."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.216.3
  kind: p
  original: Stein, p. 210.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.217.1
  kind: p
  original: Wie richtig die Bemerkung des Herrn Grün ist, beweisen Republikaner wie Levasseur, Carnot, Barère, Billaud-Varennes, Buonarroti, Teste, d'Argenson etc. etc.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.218.1
  kind: p
  original: 'Folgen nun einige banale Phrasen über Enfantin, wo wir bloß auf folgende Entdeckung des Herrn Grün aufmerksam machen:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.219.1
  kind: p
  original: '"Wird es an dieser geschichtlichen Erscheinung endlich klar, daß die Religion nichts ist als Sensualismus, daß der Materialismus kühn denselben Ursprung in Anspruch nehmen darf wie das heilige Dogma selbst?" p. 97.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.220.1
  kind: p
  original: 'Herr Grün blickt selbstgefällig um sich: "Hat wohl schon Jemand daran gedacht?"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.220.2
  kind: p
  original: Er würde nie "daran gedacht" haben, wenn nicht schon die "Hallischen Jahrbücher" bei Gelegenheit der Romantiker "daran gedacht" hätten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.220.3
  kind: p
  original: Man hätte übrigens hoffen können, daß seit der Zeit Herr Grün weiter gedacht hätte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.221.1
  kind: p
  original: Herr Grün weiß, wie wir gesehen haben, von der ganzen ökonomischen Kritik der Saint-Simonisten Nichts.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.221.2
  kind: p
  original: Indessen benutzt er Enfantin, um auch über die ökonomischen Konsequenzen Saint-Simons, von denen er schon oben fabelte, ein Wort zu sagen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '496'
- id: WSIV.221.3
  kind: p
  original: Er findet nämlich bei Reybaud, p. 129 seqq., und Stein, p. 206, Auszüge aus der "Politischen Ökonomie" Enfantins, verfälscht aber auch hier, indem er die Aufhebung der Steuern auf die notwendigsten Lebensbedürfnisse, welche Reybaud und Stein nach Enfantin richtig als Konsequenz der Vorschläge über das Erbrecht darstellen, zu einer gleichgültigen, unabhängigen Maßregel neben diesen Vorschlägen macht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 496-497
- id: WSIV.221.4
  kind: p
  original: Er beweist auch darin seine Originalität, daß er die chronologische Ordnung verfälscht, zuerst vom Priester Enfantin und Ménilmontant und dann vom Ökonomen Enfantin spricht, während seine Vorgänger die Ökonomie Enfantins in der Periode Bazard gleichzeitig mit dem "Globe" behandeln, für den sie geschrieben wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '497'
- id: WSIV.221.5
  kind: p
  original: Wenn er hier die Periode Bazard in die Periode Ménilmontant hereinzieht, so zieht er später, wo er von der Ökonomie und M. Chevalier spricht, wieder die Periode von Ménilmontant herein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '497'
- id: WSIV.221.6
  kind: p
  original: Das "Livre nouveau" gibt ihm hiezu Gelegenheit, und wie gewöhnlich verwandelt er die Vermutung Reybauds, daß M. Chevalier der Verfasser dieser Schrift sei, in eine kategorische Behauptung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '497'
- id: WSIV.222.1
  kind: p
  original: Herr Grün hat jetzt den Saint-Simonismus "in seiner Gesamtheit" (p. 82) dargestellt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '497'
- id: WSIV.222.2
  kind: p
  original: Er hat sein Versprechen gehalten, "ihn nicht in seine Literatur hinein kritisch zu verfolgen" (ibid.), und hat sich daher in eine ganz andere "Literatur", in Stein und Reybaud, höchst unkritisch verwickelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '497'
- id: WSIV.222.3
  kind: p
  original: Zum Ersatz gibt er uns einige Aufschlüsse über M. Chevaliers ökonomische Vorlesungen von 1841/42, wo er längst aufgehört hatte, Saint-Simonist zu sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '497'
- id: WSIV.222.4
  kind: p
  original: Herrn Grün lag nämlich, als er über den Saint-Simonismus schrieb, eine Kritik dieser Vorlesungen in der "Revue des deux Mondes" vor, die er in derselben Weise benutzen konnte wie bisher Stein und Reybaud.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '497'
- id: WSIV.222.5
  kind: p
  original: 'Wir geben nur eine Probe seiner kritischen Einsicht:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '497'
- id: WSIV.223.1
  kind: p
  original: '"Er behauptet darin, es würde nicht genug produziert.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '497'
- id: WSIV.223.2
  kind: p
  original: Das ist ein Wort, ganz würdig der alten ökonomischen Schule mit ihren verrosteten Einseitigkeiten...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '497'
- id: WSIV.223.3
  kind: p
  original: Solange die politische Ökonomie nicht einsieht, daß die Produktion abhängig von der Konsumtion ist, solange kommt diese sogenannte Wissenschaft auf keinen grünen Zweig." p. 102.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '497'
- id: WSIV.224.1
  kind: p
  original: Man sieht, wie Herr Grün mit den ihm vom wahren Sozialismus überlieferten Phrasen über Konsumtion und Produktion weit über jedes ökonomische Werk erhaben dasteht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '497'
- id: WSIV.224.2
  kind: p
  original: Abgesehen davon, daß er in jedem Ökonomen finden kann, daß die Zufuhr auch von der Nachfrage, d.h. die Produktion von der Konsumtion abhängt, gibt es in Frankreich sogar eine eigne ökonomische Schule, die von Sismondi, die die Produktion in einer andern Weise von der Konsumtion abhängig machen will, als dies durch die freie Konkurrenz ohnehin der Fall ist, und die den entschiedensten Gegensatz bildet zu den von Herrn Grün angefeindeten Ökonomen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '497'
- id: WSIV.224.3
  kind: p
  original: Wir werden Herrn Grün übrigens erst später mit dem ihm anvertrauten Pfunde, der Einheit von Produktion und Konsumtion, mit Erfolg wuchern sehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '497'
- id: WSIV.225.1
  kind: p
  original: 'Herr Grün entschädigt den Leser für die durch seine dünnen, verfälschten und mit Phrasen adulterierten Auszüge aus Stein und Reybaud erregte Langeweile durch folgendes jungdeutsch sprühendes, humanistisch glühendes und sozialistisch blühendes Raketenfeuer:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '498'
- id: WSIV.226.1
  kind: p
  original: '"Der ganze Saint-Simonismus als soziales System war nichts weiter als ein Sprudelregen von Gedanken, den eine wohltätige Wolke über den Boden Frankreichs ausgoß" (früher p. 82, 83 eine "Lichtmasse, aber noch als Lichtchaos (!), "nicht als geordnete Helle "!!).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '498'
- id: WSIV.226.2
  kind: p
  original: '"Er war ein Schaustück von der erschütterndsten und lustigsten Wirkung zugleich.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '498'
- id: WSIV.226.3
  kind: p
  original: Der Dichter starb noch vor der Aufführung, der eine Regisseur während der Vorstellung; die übrigen Regisseure und sämtliche Schauspieler legten ihre Kostüme ab, schlüpften in ihre bürgerlichen Kleider hinein, gingen heim und taten, als sei Nichts vorgefallen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '498'
- id: WSIV.226.4
  kind: p
  original: Es war ein Schauspiel, ein interessantes, zuletzt etwas verwirrt, einige Akteure chargierten - das war Alles." p. 104.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '498'
- id: WSIV.227.1
  kind: p
  original: 'Wie richtig hat Heine seine Nachkläffer beurteilt: "Ich habe Drachenzähne gesäet und Flöhe geerntet."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '498'
- id: WSIV.228.1
  kind: heading
  original: Fourierismus
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '498'
- id: WSIV.229.1
  kind: p
  original: Außer einigen Übersetzungen über die Liebe aus den "Quatre mouvements" erfahren wir auch hier nichts, was nicht schon bei Stein vollständiger ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '498'
- id: WSIV.229.2
  kind: p
  original: 'Die Moral fertigt Herr Grün mit einem Satze ab, der schon lange vor Fourier von hundert anderen Schriftstellern gesagt war:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '498'
- id: WSIV.230.1
  kind: p
  original: '"Die Moral ist nach Fourier weiter nichts als der systematische Versuch, die Leidenschaften der Menschen zu unterdrücken." p. 147.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '498'
- id: WSIV.231.1
  kind: p
  original: Die christliche Moral hat sich selbst nie anders definiert, Auf Fouriers Kritik der jetzigen Landwirtschaft und Industrie geht Herr Grün gar nicht ein und begnügt sich, zur Kritik des Handels einige allgemeine Sätze aus der Einleitung ("Origine de l'économie politique et de la controverse mercantile", <"Ursprung der politischen Ökonomie und der Kontroverse über den Handel"> p. 332, 334 der "Quatre mouvements") zu einem Abschnitt der "Quatre mouvements" zu übersetzen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '498'
- id: WSIV.231.2
  kind: p
  original: Folgen dann einige Auszüge aus den "Quatre mouvements" und einer aus dem "Traité de l'association" über die französische Revolution, nebst den schon aus Stein bekannten Tabellen über die Zivilisation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '498'
- id: WSIV.231.3
  kind: p
  original: So wird der kritische Teil Fouriers, der wichtigste, auf 28 Seiten wörtlicher Übersetzungen, die sich mit sehr wenigen Ausnahmen auf das Allerallgemeinste und Abstrakteste beschränken und Wichtiges und Unwichtiges durcheinanderwerfen, mit der größten Oberflächlichkeit und Hast abgefertigt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '498'
- id: WSIV.232.1
  kind: p
  original: Herr Grün geht nun zur Darstellung des Fourierschen Systems über.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '499'
- id: WSIV.232.2
  kind: p
  original: Vollständigeres und Besseres liegt längst in der schon von Stein zitierten Schrift von Chouroa vor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '499'
- id: WSIV.232.3
  kind: p
  original: Herr Grün hält es zwar für "unumgänglich nötig", tiefe Aufschlüsse über die Serien Fouriers zu geben, weiß aber zu diesem Behufe nichts Besseres zu tun, als wörtliche Zitate aus Fourier selbst zu übersetzen und später, wie wir sehen werden, einige belletristische Phrasen über die Zahl zu machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '499'
- id: WSIV.232.4
  kind: p
  original: Er denkt nicht daran, zu zeigen, wie Fourier auf die Serien kam und wie er und seine Schüler Serien konstruiert haben; er gibt nicht den geringsten Aufschluß über die innere Konstruktion dieser Serien.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '499'
- id: WSIV.232.5
  kind: p
  original: Derartige Konstruktionen, gerade wie die Hegelsche Methode, werden nur kritisiert, indem man aufzeigt, wie sie zu machen sind, und dadurch beweist, daß man Herr über sie ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '499'
- id: WSIV.233.1
  kind: p
  original: Bei Herrn Grün tritt endlich ganz in den Hintergrund, was Stein wenigstens einigermaßen hervorhebt, der Gegensatz von travail répugnant <abstoßender Arbeit> und travail attrayant <anziehender Arbeit>.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '499'
- id: WSIV.234.1
  kind: p
  original: Die Hauptsache bei dieser ganzen Darstellung ist die Kritik Fouriers durch Herrn Grün.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '499'
- id: WSIV.234.2
  kind: p
  original: Wir rufen dem Leser ins Gedächtnis zurück, was wir schon oben über die Quellen der Grünschen Kritik sagten, und werden nun an einigen Beispielen zeigen, wie Herr Grün die Sätze des wahren Sozialismus erst akzeptiert und dann übertreibt und verfälscht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '499'
- id: WSIV.234.3
  kind: p
  original: Daß die Fouriersche Teilung zwischen Kapital, Talent und Arbeit einen prächtigen Stoff zu breiter Klugtuerei bietet, daß man hier über die Unmöglichkeit und Ungerechtigkeit der Teilung, über das Hereinkommen der Lohnarbeit usw. weitläuftiges Gerede machen kann, ohne diese Teilung aus dem wirklichen Verhältnis von Arbeit und Kapital zu kritisieren, bedarf keiner weiteren Erwähnung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '499'
- id: WSIV.234.4
  kind: p
  original: Proudhon hat das vor Herrn Grün schon Alles unendlich besser gesagt, ohne damit den Kern der Frage auch nur berührt zu haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '499'
- id: WSIV.235.1
  kind: p
  original: 'Die Kritik der Psychologie Fouriers schöpft Herr Grün, wie seine ganze Kritik, aus dem "Wesen des Menschen":'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '499'
- id: WSIV.236.1
  kind: p
  original: '"Denn das menschliche Wesen ist Alles in Allem." p. 190.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '499'
- id: WSIV.237.1
  kind: p
  original: '"Fourier appelliert ebenfalls an dies menschliche Wesen, dessen inneres Gehäuse" (!) "er uns auf seine Weise in der Tafel der zwölf Leidenschaften enthüllt; auch er will, was alle redlichen und vernünftigen Köpfe wollen, das innere Wesen des Menschen zur Wirklichkeit, zur Praxis machen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '499'
- id: WSIV.237.2
  kind: p
  original: Was drinnen ist, soll auch draußen sein, und so der Unterschied zwischen drinnen und draußen überhaupt aufgehoben werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '499'
- id: WSIV.237.3
  kind: p
  original: Die Geschichte der Menschheit wimmelt von Sozialisten, wenn wir sie an diesem Merkmale erkennen wollen... es kommt bei Jedem nur darauf an, was er sich unter dem Wesen des Menschen denkt." p. 190.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '499'
- id: WSIV.238.1
  kind: p
  original: Oder vielmehr, es kommt den wahren Sozialisten nur darauf an, Jedem Gedanken über das Wesen des Menschen unterzuschieben und die verschiedenen Stufen des Sozialismus in verschiedne Philosophien des Wesens des Menschen zu verwandeln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '500'
- id: WSIV.238.2
  kind: p
  original: Diese ungeschichtliche Abstraktion verleitet hier Herrn Grün dazu, die Aufhebung alles Unterschiedes zwischen Innen und Außen zu proklamieren, eine Aufhebung, die sogar der Fortpflanzung des Wesens des Menschen ein Ende machen würde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '500'
- id: WSIV.238.3
  kind: p
  original: Man sieht übrigens gar nicht ein, weshalb die Deutschen so erschrecklich mit ihrer Weisheit vom Wesen des Menschen renommieren, da ihre ganze Weisheit, die drei allgemeinen Eigenschaften, Verstand, Herz und Wille, bereits seit Aristoteles und den Stoikern ziemlich allgemein bekannt sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '500'
- id: WSIV.238.4
  kind: p
  original: Von diesem Standpunkt aus wirft Herr Grün Fourier vor, daß er den Menschen in zwölf Leidenschaften "zerklüftet".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '500'
- id: WSIV.239.1
  kind: p
  original: '"Von der Vollständigkeit dieser Tafel, psychologisch gesprochen, will ich gar nicht reden; ich halte sie für ungenügend - (wobei sich, "psychologisch gesprochen", das Publikum beruhigen mag).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '500'
- id: WSIV.239.2
  kind: p
  original: '- "Weiß man etwa durch diese Zwölfzahl, was der Mensch ist?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '500'
- id: WSIV.239.3
  kind: p
  original: Noch keinen Augenblick.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '500'
- id: WSIV.239.4
  kind: p
  original: Fourier hätte ebensogut bloß die fünf Sensitiven nennen können; in ihnen liegt der ganze Mensch, wenn man sie erklärt, wenn man den menschlichen Inhalt derselben zu deuten versteht" (als wenn dieser "menschliche Inhalt" nicht ganz von der Stufe der Produktion und des Verkehrs der Menschen abhinge).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '500'
- id: WSIV.239.5
  kind: p
  original: '"Ja, der Mensch liegt ganz allein in Einem Sinne, im Gefühle, er fühlt anders als das Tier" pp, p. 205.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '500'
- id: WSIV.240.1
  kind: p
  original: Man sieht, wie Herr Grün, hier zum ersten Male im ganzen Buche, sich anstrengt, um vom Feuerbachschen Standpunkte nur irgend etwas über Fouriers Psychologie zu sagen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '500'
- id: WSIV.240.2
  kind: p
  original: Man sieht ebenfalls, welch eine Phantasie dieser "ganze Mensch" ist, der in einer einzigen Eigenschaft eines wirklichen Individuums "liegt" und vom Philosophen aus ihr heraus interpretiert wird; was das überhaupt für ein "Mensch" ist, der nicht in seiner wirklichen geschichtlichen Tätigkeit und Dasein angeschaut wird, sondern aus seinem eignen Ohrläppchen oder sonstigen Unterscheidungsmerkmal vom Tier gefolgert werden kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '500'
- id: WSIV.240.3
  kind: p
  original: Dieser Mensch "liegt" in sich selbst, wie sein eigner Komedon.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '500'
- id: WSIV.240.4
  kind: p
  original: Daß das menschliche Gefühl menschlich und nicht tierisch ist, diese Einsicht macht natürlich nicht nur jeden psychologischen Versuch überflüssig, sondern ist auch zugleich die Kritik aller Psychologie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '500'
- id: WSIV.241.1
  kind: p
  original: Fouriers Behandlung der Liebe kann Herr Grün sehr leicht kritisieren, indem er dessen Kritik der jetzigen Liebesverhältnisse an den Phantasien mißt, in denen Fourier sich eine Anschauung von der freien Liebe zu geben suchte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '500'
- id: WSIV.241.2
  kind: p
  original: Herr Grün nimmt diese Phantasien ernsthaft als echter deutscher Philister.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '500'
- id: WSIV.241.3
  kind: p
  original: Sie sind das Einzige, das er ernsthaft nimmt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '500'
- id: WSIV.241.4
  kind: p
  original: Wollte er einmal auf diese Seite des Systems eingehen, so ist nicht abzusehen, weshalb er nicht auch auf Fouriers Ausführungen über Erziehung einging, die bei weitem das beste sind, was in dieser Art existiert, und die genialsten Beobachtungen enthalten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 500-501
- id: WSIV.241.5
  kind: p
  original: Übrigens verrät Herr Grün bei Gelegenheit der Liebe, wie wenig er als echter jungdeutscher Belletrist von Fouriers Kritik gelernt hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.241.6
  kind: p
  original: Er meint, es sei einerlei, ob man von der Aufhebung der Ehe oder des Privateigentums ausgehe, eins müsse immer das Andre nach sich ziehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.241.7
  kind: p
  original: Es ist aber reine belletristische Phantasie, von einer andern Auflösung der Ehe, als wie sie sich schon jetzt in der bürgerlichen Gesellschaft praktisch vorfindet, ausgehen zu wollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.241.8
  kind: p
  original: Bei Fourier selbst konnte er finden, daß dieser überall nur von der Umänderung der Produktion ausgeht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.242.1
  kind: p
  original: Es nimmt Herrn Grün wunder, daß Fourier, der doch überall von der Neigung (soll heißen Attraktion) ausgeht, allerlei "mathematische" Versuche macht, weshalb er auch p. 203 der "mathematische Sozialist" genannt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.242.2
  kind: p
  original: Selbst die ganzen Lebensverhältnisse Fouriers aus dem Spiel gelassen, hätte Herr Grün auf die Attraktion näher eingehen müssen, wo er sehr bald gefunden haben würde, daß solch ein Naturverhältnis nicht ohne Berechnung näher bestimmt werden kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.242.3
  kind: p
  original: 'Statt dessen regaliert er uns mit einer belletristischen, mit Hegelschen Traditionen verquickten Philippika gegen die Zahl, worin Stellen vorkommen wie:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.243.1
  kind: p
  original: Fourier "berechnet die Moleküle Deines abnormsten Geschmackes",
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.244.1
  kind: p
  original: 'ein wahres Wunder - ferner:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.245.1
  kind: p
  original: '"Die so hart befehdete Zivilisation beruhte auf dem herzlosen Einmaleins... die Zahl ist nichts Bestimmtes...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.245.2
  kind: p
  original: Was ist Eins?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.245.3
  kind: p
  original: Die Eins hat keine Ruhe, sie wird Zwei, Drei, Vier" -
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.246.1
  kind: p
  original: es geht ihr wie dem deutschen Landpfarrer, der auch "keine Ruhe" hat, bis er eine Frau und neun Kinder hat...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.247.1
  kind: p
  original: '"Die Zahl tötet alles Wesentliche und Wirkliche, was ist eine halbe Vernunft, was ist ein Drittel Wahrheit" -'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.248.1
  kind: p
  original: 'er hätte auch fragen können: Was ist ein grün angelaufener Logarithmus?...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.249.1
  kind: p
  original: '"bei der organischen Entwicklung wird die Zahl verrückt"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.250.1
  kind: p
  original: ein Satz, worauf die Physiologie und organische Chemie beruhen. (p. 203, 204.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.251.1
  kind: p
  original: '"Wer die Zahl zum Maße der Dinge nimmt, der wird, nein - der ist ein Egoist.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.252.1
  kind: p
  original: 'An diesen Satz kann er den ihm von Heß überlieferten (s. oben) übertreibend anknüpfen:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.253.1
  kind: p
  original: '"Der ganze Fouriersche Organisationsplan beruht auf Nichts als auf Egoismus... der ärgste Ausdruck des zivilisierten Egoismus ist gerade Fourier." p. 206, 208.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '501'
- id: WSIV.254.1
  kind: p
  original: Er beweist dies sogleich, indem er erzählt, wie in der Fourierschen Weltordnung der Ärmste täglich von 40 Schüsseln speist, 5 Mahlzeiten täglich genommen werden, die Leute 144 Jahre alt werden und dergl. mehr.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '502'
- id: WSIV.254.2
  kind: p
  original: Die kolossale Anschauung der Menschen, die Fourier der bescheidnen Mittelmäßigkeit der Restaurationsmenschen mit naivem Humor gegenüberstellt, gibt Herrn Grün bloß Gelegenheit, die unschuldigste Seite herauszunehmen und darüber moralische Philisterglossen zu machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '502'
- id: WSIV.255.1
  kind: p
  original: 'Indem Herr Grün Fourier Vorwürfe macht über seine Auffassung der französischen Revolution, gibt er zugleich einen Vorschmack seiner eignen Einsicht in die Revolutionszeit:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '502'
- id: WSIV.256.1
  kind: p
  original: '"Hätte man nur vierzig Jahre früher um die Assoziation gewußt" (läßt er Fourier sagen), "so wäre die Revolution vermieden worden.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '502'
- id: WSIV.256.2
  kind: p
  original: Wie kam es denn aber" (fragt Herr Grün), "daß der Minister Turgot das Recht zur Arbeit kannte und daß dennoch der Kopf Ludwigs XVI. fiel?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '502'
- id: WSIV.256.3
  kind: p
  original: Mit dem Rechte zur Arbeit hätte man doch leichter als mit Hühnereiern die Staatsschuld bezahlen können." p. 211.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '502'
- id: WSIV.257.1
  kind: p
  original: Herr Grün übersieht nur die Bagatelle, daß das Recht zur Arbeit, wovon Turgot spricht, die freie Konkurrenz ist, und daß ebendiese freie Konkurrenz die Revolution nötig hatte, um sich durchzusetzen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '502'
- id: WSIV.258.1
  kind: p
  original: Herr Grün kann seine ganze Kritik Fouriers zusammenfassen in dem Satz, daß Fourier "die Zivilisation" keiner "gründlichen Kritik" unterworfen habe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '502'
- id: WSIV.258.2
  kind: p
  original: Und warum tat Fourier dies nicht?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '502'
- id: WSIV.258.3
  kind: p
  original: 'Man höre:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '502'
- id: WSIV.259.1
  kind: p
  original: '"Sie ist kritisiert worden in ihren Erscheinungen, nicht in ihren Grundlagen; sie ist als Daseiendes perhorresziert, lächerlich gemacht, in ihrer Wurzel aber nicht untersucht worden.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '502'
- id: WSIV.259.2
  kind: p
  original: Weder die Politik noch die Religion sind vor das Forum der Kritik gezogen worden, und deshalb blieb das Wesen des Menschen ununtersucht." p. 209.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '502'
- id: WSIV.260.1
  kind: p
  original: Herr Grün erklärt hier also die wirklichen Lebensverhältnisse der Menschen für Erscheinungen, Religion und Politik aber für die Grundlage und Wurzel dieser Erscheinungen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '502'
- id: WSIV.260.2
  kind: p
  original: Man sieht an diesem abgeschmackten Satze, wie die wahren Sozialisten die ideologischen Phrasen der deutschen Philosophie gegenüber den wirklichen Darstellungen französischer Sozialisten als höhere Wahrheit geltend machen und zugleich, wie sie ihr eigentliches Objekt, das Wesen des Menschen, mit den Resultaten der französischen Kritik der Gesellschaft zu verbinden streben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '502'
- id: WSIV.260.3
  kind: p
  original: Daß, wenn Religion und Politik als Grundlage der materiellen Lebensverhältnisse gefaßt werden, Alles in letzter Instanz auf Untersuchungen über das Wesen des Menschen, d.h. über das Bewußtsein des Menschen von sich selbst ausläuft, ist ganz natürlich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '502'
- id: WSIV.260.4
  kind: p
  original: '- Man sieht zugleich, wie wenig es dem Herrn Grün darauf ankommt, was er abschreibt; an einer späteren Stelle, wie auch in den "Rhein[ischen] Jahrbüchern", eignet er sich in seiner Weise an, was in den "Deutsch-Französischen Jahrbüchern" über das Verhältnis von citoyen und bourgeois gesagt war und was dem obigen Satze direkt widerspricht.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 502-503
- id: WSIV.261.1
  kind: p
  original: Wir haben dem Leser bis zuletzt die Ausführung des vom wahren Sozialismus Herrn Grün anvertrauten Satzes über Produktion und Konsumtion vorbehalten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.261.2
  kind: p
  original: Sie ist ein schlagendes Exempel, wie Herr Grün die Sätze des wahren Sozialismus als Maßstab an die Leistungen der Franzosen legt und sie dadurch, daß er sie aus ihrer völligen Unbestimmtheit herausreißt, als vollständigen Unsinn darlegt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.262.1
  kind: p
  original: '"Produktion und Konsumtion lassen sich in der Theorie und in der äußern Wirklichkeit zeitlich und räumlich trennen, dem Wesen nach sind sie nur Eins.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.262.2
  kind: p
  original: Ist nicht die Tätigkeit des gewöhnlichsten Gewerbes, z.B. des Brotbackens, eine Produktion, welche für hundert Andre zur Konsumtion wird?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.262.3
  kind: p
  original: Ja, welche es für den Backenden selbst ist, der ja Korn, Wasser, Milch, Eier pp. konsumiert?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.262.4
  kind: p
  original: Ist die Konsumtion von Schuhen und Kleidern nicht die Produktion bei Schustern und Schneidern?...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.262.5
  kind: p
  original: Produziere ich nicht, wenn ich Brot esse?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.262.6
  kind: p
  original: Ich produziere ungeheuer, ich produziere Mühlen, Backtröge, Backöfen und folglich Pflüge, Eggen, Dreschflegel, Mühlräder, Schreinerarbeit, Maurerarbeit" ("und folglich" Schreiner, Maurer und Bauern, "folglich" ihre Eltern, "folglich" alle ihre Vorfahren, "folglich" Adam).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.262.7
  kind: p
  original: '"Konsumiere ich nicht, wenn ich produziere?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.262.8
  kind: p
  original: Ebenfalls ungeheuer...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.262.9
  kind: p
  original: Lese ich ein Buch, so konsumiere ich zwar zunächst das Produkt ganzer Jahre, wenn ich es für mich behalte oder verderbe, ich konsumiere den Stoff und die Tätigkeit der Papierfabrik, der Buchdruckerei, des Buchbinders.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.262.10
  kind: p
  original: Produziere ich aber nichts?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.262.11
  kind: p
  original: Ich produziere vielleicht ein neues Buch, und dadurch neues Papier, neue Typen, neue Druckerschwärze, neue Buchbinderwerkzeuge; lese ich es bloß, und lesen es tausend Andre auch, so produzieren wir durch unsre Konsumtion eine neue Auflage und dadurch alle jene Materialien, die zur Beschaffung derselben erforderlich sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.262.12
  kind: p
  original: Die Alles das verfertigen, konsumieren wieder eine Masse Rohmaterial, das aber produziert werden will und nur durch Konsumtion produziert werden kann...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.262.13
  kind: p
  original: Mit Einem Worte, Tätigkeit und Genuß sind Eins, eine verkehrte Welt hat sie nur auseinandergerissen, hat den Begriff des Wertes und Preises zwischen Beide hineingeschoben, durch diesen Begriff den Menschen mitten auseinandergerissen und mit dem Menschen die Gesellschaft." p. 191.192.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.263.1
  kind: p
  original: Produktion und Konsumtion stehen in der Wirklichkeit vielfach im Widerspruch gegeneinander.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.263.2
  kind: p
  original: Man braucht aber nur diesen Widerspruch wahrhaft zu interpretieren, das wahre Wesen der Produktion und Konsumtion zu greifen, um die Einheit Beider herzustellen und allen Widerspruch aufzuheben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.263.3
  kind: p
  original: Diese deutsch-ideologische Theorie paßt daher auch ganz vortrefflich auf die bestehende Welt; die Einheit von Produktion und Konsumtion wird an Exempeln aus der gegenwärtigen Gesellschaft bewiesen, sie existiert an sich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '503'
- id: WSIV.263.4
  kind: p
  original: Herr Grün beweist vor allen Dingen, daß überhaupt ein Verhältnis zwischen Produktion und Konsumtion existiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '504'
- id: WSIV.263.5
  kind: p
  original: Er setzt auseinander, daß er keinen Rock tragen, kein Brot essen kann, ohne daß Beides produziert ist, und daß es in der heutigen Gesellschaft Leute gibt, die Röcke, Schuhe, Brot produzieren, von welchen Dingen andre Leute die Konsumenten sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '504'
- id: WSIV.263.6
  kind: p
  original: Herr Grün hält diese Einsicht für neu.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '504'
- id: WSIV.263.7
  kind: p
  original: Er drückt sie in einer klassischen, belletristisch-ideologischen Sprache aus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '504'
- id: WSIV.263.8
  kind: p
  original: 'Z.B.:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '504'
- id: WSIV.264.1
  kind: p
  original: '"Man glaubt, der Genuß des Kaffees, des Zuckers usw. sei bloße Konsumtion; ist dieser Genuß aber nicht Produktion in den Kolonien?"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '504'
- id: WSIV.265.1
  kind: p
  original: 'Er hätte ebensogut fragen können: Ist dieser Genuß nicht der Genuß der Peitsche für den Negersklaven und die Produktion von Prügeln in den Kolonien?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '504'
- id: WSIV.265.2
  kind: p
  original: Man sieht, wie bei dieser überschwenglichen Manier nichts als eine Apologie der bestehenden Zustände herauskommt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '504'
- id: WSIV.265.3
  kind: p
  original: Die zweite Einsicht des Herrn Grün besteht darin, daß er konsumiert, wenn er produziert, nämlich das Rohmaterial, überhaupt die Produktionskosten; dies ist die Einsicht, daß Nichts aus Nichts wird, daß er Material haben muß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '504'
- id: WSIV.265.4
  kind: p
  original: Er konnte in jeder Ökonomie unter dem Kapitel "Reproduktive Konsumtion" ausgeführt finden, welche verwickelten Beziehungen in dies Verhältnis hereinkommen, wenn man sich nicht mit Herrn Grün auf die triviale Erkenntnis beschränkt, daß man ohne Leder keine Stiefel machen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '504'
- id: WSIV.266.1
  kind: p
  original: Bisher hat Herr Grün sich davon überzeugt, daß produziert werden muß, um zu konsumieren, und daß bei der Produktion Rohmaterial konsumiert wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '504'
- id: WSIV.266.2
  kind: p
  original: Die eigentliche Schwierigkeit für ihn beginnt da, wo er beweisen will, daß er produziert, wenn er konsumiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '504'
- id: WSIV.266.3
  kind: p
  original: Herr Grün macht hier einen gänzlich verfehlten Versuch, sich über das allertrivialste und allgemeinste Verhältnis von Nachfrage und Zufuhr ein geringes Licht zu verschaffen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '504'
- id: WSIV.266.4
  kind: p
  original: Er bringt es zu der Einsicht, daß seine Konsumtion, d.h. seine Nachfrage, neue Zufuhr produziert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '504'
- id: WSIV.266.5
  kind: p
  original: Er vergißt aber, daß seine Nachfrage eine effektive Nachfrage sein, daß er ein Äquivalent für das verlangte Produkt bieten muß, damit sie neue Produktion hervorrufe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '504'
- id: WSIV.266.6
  kind: p
  original: Die Ökonomen beziehen sich ebenfalls auf die Untrennbarkeit von Konsumtion und Produktion und die absolute Identität von Nachfrage und Zufuhr, gerade wenn sie beweisen wollen, daß nie Überproduktion stattfindet; aber so ungeschickte und triviale Dinge wie Herr Grün bringen sie nicht vor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '504'
- id: WSIV.266.7
  kind: p
  original: Übrigens ist diese Manier ganz dieselbe, wodurch alle Adlige, Pfaffen, Rentiers usw. von jeher ihre Produktivität bewiesen haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '504'
- id: WSIV.266.8
  kind: p
  original: Herr Grün vergißt ferner, daß Brot heutzutage durch Dampfmühlen, früher durch Wind- und Wassermühlen, noch früher durch Handmühlen produziert wurde, daß diese verschiedenen Produktionsweisen vom bloßen Brotessen gänzlich unabhängig sind und also eine geschichtliche Entwicklung der Produktion hereinkommt, an die der "ungeheuer produzierende" Herr Grün nicht denkt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 504-505
- id: WSIV.266.9
  kind: p
  original: Daß mit diesen verschiedenen Stufen der Produktion auch verschiedene Verhältnisse der Produktion zur Konsumtion, verschiedne Widersprüche Beider gegeben sind, daß diese Widersprüche zu verstehen sind nur aus einer Betrachtung, zu lösen nur durch eine praktische Veränderung der jedesmaligen Produktionsweise und des ganzen darauf basierenden gesellschaftlichen Zustandes, das ahnt Herr Grün nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.266.10
  kind: p
  original: Wenn Herr Grün in seinen übrigen Beispielen an Trivialität schon unter den allergewöhnlichsten Ökonomen steht, so beweist er bei seinem Beispiel vom Buch, daß diese viel "menschlicher" sind als er.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.266.11
  kind: p
  original: Sie verlangen gar nicht, daß er, wenn er ein Buch konsumiert hat, sogleich ein neues produziere!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.266.12
  kind: p
  original: Sie sind damit zufrieden, daß er seine eigne Bildung dadurch produziert und damit auf die Produktion überhaupt günstig wirkt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.266.13
  kind: p
  original: Durch die Auslassung des Mittelgliedes, der baren Zahlung, die Herr Grün durch bloße Abstraktion von ihr überflüssig macht, wodurch seine Nachfrage erst effektiv wird, verwandelt sich die reproduktive Konsumtion des Herrn Grün in ein blaues Wunder.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.266.14
  kind: p
  original: Er liest, und durch sein bloßes Lesen setzt er die Schriftgießer, Papierfabrikanten und Drucker in den Stand, neue Typen, neues Papier, neue Bücher zu produzieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.266.15
  kind: p
  original: Seine bloße Konsumtion ersetzt allen diesen Leuten die Produktionskosten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.266.16
  kind: p
  original: Wir haben übrigens bisher die Virtuosität hinreichend nachgewiesen, womit Herr Grün aus alten Büchern neue Bücher herauszulesen und sich als Produzent von neuem Papier, neuen Typen, neuer Druckerschwärze und neuen Buchbinderwerkzeugen um die kommerzielle Welt verdient zu machen weiß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.266.17
  kind: p
  original: 'Der erste Brief des Grünschen Buchs endet mit den Worten: "Ich stehe im Begriff, mich in die Industrie zu stürzen."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.266.18
  kind: p
  original: Nirgendwo im ganzen Buche verleugnet Herr Grün diese seine Devise.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.267.1
  kind: p
  original: Worin bestand also die ganze Tätigkeit des Herrn Grün?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.267.2
  kind: p
  original: Um den Satz des wahren Sozialismus von der Einheit von Produktion und Konsumtion zu beweisen, nimmt Herr Grün seine Zuflucht zu den allertrivialsten Sätzen der Ökonomie über Nachfrage und Zufuhr, und um diese wieder für seinen Zweck zurechtzustutzen, wirft er aus ihnen die notwendigen Mittelglieder heraus und verwandelt sie damit in reine Phantasien.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.267.3
  kind: p
  original: Der Kern des Ganzen ist also eine unwissende und phantastische Verklärung der bestehenden Zustände.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.268.1
  kind: p
  original: Charakteristisch ist noch der sozialistische Schluß, worin er wieder ganz seinen deutschen Vorgängern nachstammelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.268.2
  kind: p
  original: Produktion und Konsumtion sind getrennt, weil eine verkehrte Welt sie auseinandergerissen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.268.3
  kind: p
  original: Wie fing das diese verkehrte Welt an?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.268.4
  kind: p
  original: Sie schob einen Begriff zwischen Beide.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.268.5
  kind: p
  original: Durch diesen Schub riß sie den Menschen mitten auseinander.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '505'
- id: WSIV.268.6
  kind: p
  original: Damit nicht zufrieden, reißt sie hierdurch die Gesellschaft, d.h. sich selbst, ebenfalls mitten auseinander.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 505-506
- id: WSIV.268.7
  kind: p
  original: Diese Tragödie hat sich im Jahre 1845 zugetragen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '506'
- id: WSIV.269.1
  kind: p
  original: Die Einheit von Konsumtion und Produktion, die bei den wahren Sozialisten ursprünglich die Bedeutung hat, daß die Tätigkeit selbst Genuß bieten soll (bei ihnen freilich eine rein phantastische Vorstellung), wird von Herrn Grün dahin weiter bestimmt, daß "Konsumtion und Produktion, ökonomisch gesprochen, sich decken müssen" (p. 196), daß kein Überschuß der Produktenmasse über die unmittelbaren Konsumtionsbedürfnisse stattfinden darf, womit natürlich alle Bewegung ein Ende hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '506'
- id: WSIV.269.2
  kind: p
  original: Er wirft daher auch Fourier mit wichtiger Miene vor, daß er diese Einheit durch eine Überproduktion stören wolle.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '506'
- id: WSIV.269.3
  kind: p
  original: Herr Grün vergißt, daß die Überproduktion nur durch ihren Einfluß auf den Tauschwert der Produkte Krisen hervorruft, und daß nicht nur bei Fourier, sondern auch in der besten Welt des Herrn Grün der Tauschwert verschwunden ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '506'
- id: WSIV.269.4
  kind: p
  original: Über diese philisterhafte Albernheit ist weiter nichts zu sagen, als daß sie des wahren Sozialismus würdig ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '506'
- id: WSIV.270.1
  kind: p
  original: Herr Grün wiederholt an vielen Orten mit großer Selbstgefälligkeit seinen Kommentar zur Theorie des wahren Sozialismus über Produktion und Konsumtion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '506'
- id: WSIV.270.2
  kind: p
  original: 'So auch bei Gelegenheit Proudhons:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '506'
- id: WSIV.271.1
  kind: p
  original: '"Predigt die soziale Freiheit der Konsumenten, so habt Ihr die wahre Gleichheit der Produktion." p. 433.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '506'
- id: WSIV.272.1
  kind: p
  original: Nichts leichter als das zu predigen!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '506'
- id: WSIV.272.2
  kind: p
  original: Der Fehler lag bisher bloß daran,
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '506'
- id: WSIV.273.1
  kind: p
  original: '"daß die Konsumenten nicht erzogen, nicht gebildet sind, daß nicht Alle menschlich konsumieren". p. 432.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '506'
- id: WSIV.273.2
  kind: p
  original: '"Dieser Gesichtspunkt, daß die Konsumtion der Maßstab der Produktion ist, nicht umgekehrt, ist der Tod jeder bisherigen ökonomischen Anschauung." (ibid.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '506'
- id: WSIV.273.3
  kind: p
  original: '"Die wahre Solidarität der Menschen untereinander macht sogar den Satz zur Wahrheit, daß die Konsumtion eines Jeden die Konsumtion Aller zur Voraussetzung hat." (ibid.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '506'
- id: WSIV.274.1
  kind: p
  original: Die Konsumtion eines Jeden hat innerhalb der Konkurrenz plus ou moins <mehr oder weniger> fortwährend die Konsumtion Aller zur Voraussetzung, ebenso wie die Produktion eines Jeden die Produktion Aller.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '506'
- id: WSIV.274.2
  kind: p
  original: Es handelt sich nur darum, wie, in welcher Weise dies der Fall ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '506'
- id: WSIV.274.3
  kind: p
  original: Hierauf antwortet Herr Grün nur mit dem moralischen Postulat der menschlichen Konsumtion, der Erkenntnis des "wahren Wesens der Konsumtion" (p. 432).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '506'
- id: WSIV.274.4
  kind: p
  original: Da er von den wirklichen Produktions- und Konsumtionsverhältnissen nichts weiß, so bleibt ihm keine andre Zuflucht übrig als der letzte Schlupfwinkel der wahren Sozialisten, das Wesen des Menschen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '506'
- id: WSIV.274.5
  kind: p
  original: Aus demselben Grunde beharrt er darauf, nicht von der Produktion, sondern von der Konsumtion auszugehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 506-507
- id: WSIV.274.6
  kind: p
  original: Wenn man von der Produktion ausgeht, so muß man sich um die wirklichen Produktionsbedingungen und die produktive Tätigkeit der Menschen bekümmern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.274.7
  kind: p
  original: Wenn man aber von der Konsumtion ausgeht, so kann man sich bei der Erklärung, daß jetzt nicht "menschlich" konsumiert werde, und bei dem Postulat der "menschlichen Konsumtion", der Erziehung zur wahren Konsumtion und dergleichen Phrasen beruhigen, ohne sich im Geringsten auf die wirklichen Lebensverhältnisse der Menschen und ihre Tätigkeit einzulassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.275.1
  kind: p
  original: Schließlich ist noch zu erwähnen, daß gerade die Ökonomen, die von der Konsumtion ausgingen, reaktionär waren und das revolutionäre Element in der Konkurrenz und großen Industrie ignoriert haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.276.1
  kind: heading
  original: Der "bornierte Papa Cabet" und Herr Grün
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.277.1
  kind: p
  original: 'Herr Grün schließt seinen Exkurs über die fourieristische Schule und Herrn Reybaud mit folgenden Worten:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.278.1
  kind: p
  original: '"Ich will den Arbeitsorganisierern das Bewußtsein ihres Wesens beibringen, ich will ihnen historisch zeigen, woher sie stammen... diesen Zwittern... die auch nicht den mindesten Gedanken aus sich selbst geschöpft haben.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.278.2
  kind: p
  original: Und später werde ich vielleicht Raum finden, an dem Herrn Reybaud ein Exempel zu statuieren, nicht nur an Herrn Reybaud, sondern auch an Herrn Say.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.278.3
  kind: p
  original: Im Grunde genommen ist der erstere so schlimm nicht, er ist bloß dumm; der Zweite aber ist mehr als dumm, er ist gelehrt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.279.1
  kind: p
  original: Also." p. 260.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.280.1
  kind: p
  original: Die gladiatorische Stellung, in die sich Herr Grün wirft, seine Drohungen gegen Reybaud, die Verachtung gegen die Gelehrsamkeit, seine schmetternden Versprechungen, alles das sind sichre Zeichen, daß er hier mit großen Dingen schwanger geht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.280.2
  kind: p
  original: Im vollen "Bewußtsein seines Wesens"' ahnten wir aus diesen Symptomen, daß Herr Grün im Begriffe stehe, einen der ungeheuerlichsten plagiarischen Coups auszuführen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.280.3
  kind: p
  original: Wenn man seiner Taktik einmal auf die Spur gekommen ist, verliert seine Marktschreierei ihre Unschuld und löst sich überall in eine pfiffige Berechnung auf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.281.1
  kind: p
  original: '"Also":'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.282.1
  kind: p
  original: 'Folgt ein Kapitel mit der Überschrift:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.283.1
  kind: heading
  original: '"Die Organisation der Arbeit!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.284.1
  kind: p
  original: '"Wo wurde dieser Gedanke geboren?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.284.2
  kind: p
  original: '- In Frankreich.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.284.3
  kind: p
  original: '- Aber wie?"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.285.1
  kind: p
  original: 'Auch unter der Etikette:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.286.1
  kind: p
  original: '"Rückblick auf das achtzehnte Jahrhundert."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '507'
- id: WSIV.287.1
  kind: p
  original: '"Wo wurde dies" Kapitel des Herrn Grün "geboren?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '508'
- id: WSIV.287.2
  kind: p
  original: In Frankreich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '508'
- id: WSIV.287.3
  kind: p
  original: Aber wie?"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '508'
- id: WSIV.287.4
  kind: p
  original: Das wird der Leser sogleich erfahren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '508'
- id: WSIV.288.1
  kind: p
  original: Noch einmal erinnre sich der Leser, daß Herr Grün hier den französischen Arbeitsorganisierern das Bewußtsein ihres Wesens durch eine historische Demonstration auf gründliche deutsche Weise beibringen will.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '508'
- id: WSIV.289.1
  kind: p
  original: Also.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '508'
- id: WSIV.290.1
  kind: p
  original: Als Herr Grün gemerkt hatte, daß Cabet "borniert" und seine "Mission eine längst in sich abgeschlossene" sei, was er freilich längst gemerkt hatte, hörte nicht "natürlich alles auf".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
