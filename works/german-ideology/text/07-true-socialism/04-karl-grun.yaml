- id: WSIV.324.4
  kind: p
  original: 'Cabet fährt fort: "Écoutez le fameux Mirabeau!" <"Hört den berühmten Mirabeau!">, p. 504, Herr Grün sagt: "Hören wir Mirabeau!" p. 292, und zitiert einige der von Cabet hervorgehobenen Stellen, worin Mirabeau sich für gleiche Teilung der Erbschaft unter den Geschwistern ausspricht.'
