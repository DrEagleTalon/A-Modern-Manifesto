- id: WSIV.310.1
  kind: p
  original: '"Ecoutez le baron de Puffendorff, professeur de droit naturel en Allemagne et conseiller d''état à Stockholm et à Berlin, qui dans son droit de la nature et des gens réfute la doctrine d''Hobbes et de Grotius sur la monarchie absolue, qui proclame l''égalité naturelle, la fraternité, la communauté des biens primitive, et qui reconnaît que la propriété est une institution humaine, qu''elle résulte d''un partage consenti pour assurer à chacun et surtout au travailleur une possession perpétuelle, indivise ou divise, et que par conséquent l''inégalité actuelle de fortune est une injustice qui n''entraîne les autres inégalités" (unsinnig von Herrn Grün übersetzt) "que par l''insolence des riches et la lâcheté des pauvres.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '511'
  review: true
  review_reason: MEW prints this passage in two columns side by side (the quoted text and the authors' version of it); the left column is read first, then the right. Check that the pairing still reads clearly
- id: WSIV.310.2
  kind: p
  original: 'Et Bossuet, l''évêque de Meaux, le précepteur du dauphin de France, le célèbre Bossuet, dans sa ''Politique tiré de l''Ecriture sainte'', rédigée pour l''instruction du Dauphin, ne reconnaît-il pas aussi que sans les gouvernements la terre et tous les biens seraient aussi communs entre les hommes que l''air et la lumière: Selon le droit primitif de la nature nul n''a le droit particulier sur quoi que ce soit: tout est à tous, et c''est du gouvernement civil que naît la propriété." <"Hört den Baron von Puffendorff, Professor des Naturrechts in Deutschland und Staatsrat in Stockholm und Berlin, der in seinem Natur- und Völkerrecht die Lehre von Hobbes und Grotius über die absolute Monarchie widerlegt, der die natürliche Gleichheit, die Brüderlichkeit und die ursprüngliche Gütergemeinschaft verkündet und der erkennt, daß das Eigentum eins menschliche Einrichtung ist, daß es aus einer allgemein gebilligten Teilung hervorgeht, um jedem und vor allem dem Arbeiter einen dauernden, ungeteilten oder geteilten Besitz zu sichern, und daß folglich die gegenwärtige Ungleichheit der Vermögen eine Ungerechtigkeit ist, die die anderen Ungleichheiten (...) nur durch die Unverschämtheit der Reichen und die Feigheit der Armen nach sich zieht.'
  en: ''
  modern: ''
  modern_status: empty
