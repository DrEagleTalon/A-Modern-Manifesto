  original: '"Et cependant, tandis que le roi déclare que lui seul et son ministre (Turgot) sont dans la cour les amis du peuple, tandis que le peuple le comble de ses bénédictions, tandis que les philosophes le couvrent de leur admiration, tandis que Voltaire veut, avant de mourir, baiser la main qui a signé tant d''améliorations populaires, l''aristocratie conspire, organise même une vaste famine et des émeutes pour le perdre et fait tant par ses intrigues et calomnies qu''elle parvient à déchaîner les salons de Paris contre le réformateur et à perdre Louis XVI lui-même en le forçant à renvoyer le vertueux ministre qui le sauverait," p. 497.'
