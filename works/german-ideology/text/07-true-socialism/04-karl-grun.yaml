- id: WSIV.332.1
  kind: p
  original: 'Herr Grün, der durch diese unverschämte Abschreiberei aus Cabet den französischen Arbeitsorganisierern auf historischem Wege das Bewußtsein ihres Wesens beibringt, verfährt nebenbei noch nach dem Prinzip: Divide et impera <Teile und herrsche>.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '516'
- id: WSIV.332.2
  kind: p
  original: Er wirft zwischen die Zitate sogleich sein Endurteil über die Leute, die er soeben aus einer Stelle kennengelernt, ferner einige Phrasen über die französische Revolution, und teilt das Ganze in zwei Hälften durch einige Zitate aus Morelly, der gerade zur rechten Zeit für Herrn Grün durch Villegardelle in Paris en vogue <in Mode> gebracht und von dem die Hauptstellen bereits lange vor Herrn Grün im Pariser "Vorwärts" übersetzt worden waren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 516-517
