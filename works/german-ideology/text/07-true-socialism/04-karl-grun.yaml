  original: '" - "Hört einen der Girondistenführer, den Philosophen Condorcet, am 6. Juli 1792 auf der Tribüne der gesetzgebenden Versammlung: ''Dekretiert, daß die Güter der drei französischen Prinzen (Ludwigs XVIII., Karl X. und des Prinzen von Condé) auf der Stelle zum Verkauf ausgeboten werden... sie belaufen sich auf nahezu 100 Millionen, und ihr werdet drei Prinzen durch hunderttausend Staatsbürger ersetzen... organisiert den Unterricht und öffentliche Unterstützungseinrichtungen.'''
