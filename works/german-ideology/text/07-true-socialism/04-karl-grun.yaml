  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '514'
- id: WSIV.323.6
  kind: p
  original: Daß Herr Grün diesen Irrtum des "bornierten Papa" Cabet abschreibt, ist in der Ordnung.
