  kind: p
  original: '"Revenons à Turgot, baron, ministre de Louis XVI pendant la première année de son règne, qui veut réformer les abus, qui fait une foule de réformes, qui veut faire établir une nouvelle langue et qui, pour assurer la liberté de la presse, travaille lui-même à l''invention d''une presse à domicile." <"Indes, während der König erklärt, am Hofe seien allein er und sein Minister (Turgot) Freunde des Volkes, während das Volk ihn mit seinen Segnungen überhäuft, während die Philosophen ihn mit Bewunderung überschütten, während Voltaire vor seinem Tode die Hand küssen will, die soviel dem Volk wohltätige Verordnungen unterschrieben hat - währenddessen verschwört sich die Aristokratie, organisiert sogar eine ausgedehnte Hungersnot und Aufstände, um ihn zu stürzen, und erreicht mit ihren Ränken und Verleumdungen so viel, daß sie die Salons von Paris gegen den Reformator entfesselt und Ludwig XVI. selbst zugrunde richtet, indem sie ihn zwingt, den tugendhaften Minister zu entlassen, der ihn gerettet hätte."'
