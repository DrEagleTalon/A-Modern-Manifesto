- id: WSIV.330.2
  kind: p
  original: 'Ecoutez-le dans son journal ''L''instruction sociale''... il tolère même de grands capitalistes." pp. Écoutez l''un des chefs Girondins, le philosophe Condorcet, le 6 juillet 1792 à la tribune de l''assemblée législative: ''Décrétez que les biens des trois princes, français (Louis XVIII, Charles X, et le prince de Condé''" - was Herr Grün wegläßt -) "''soient sur-le-champ mis en vente... ils montent à près de 100 millions, et vous remplacerez trois princes par cent mille citoyens... organisez l''instruction et les établissements de secours publics.'''
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '516'
  review: true
  review_reason: MEW prints this passage in two columns side by side (the quoted text and the authors' version of it); the left column is read first, then the right. Check that the pairing still reads clearly
- id: WSIV.331.1
  kind: p
  original: 'Mais écoutez le comité d''instruction publique présentant à l''assemblée législative son rapport sur le plan d''éducation rédigé par Condorcet, 20 avril 1792: ''L''éducation publique doit offrir à tous les individus les moyens de pourvoir a leurs besoins... tel doit être le premier but d''une instruction nationale et sous ce point de vue elle est pour la puissance politique un devoir de justice''". <"Hört Condorcet in seiner Artwort an die Berliner Akademie behaupten,...Also einzig, weil die Einrichtungen schlecht sind, ist das Volk so oft aus Prinzip ein wenig diebisch.'''
