  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '514'
- id: WSIV.323.4
  kind: p
  original: Bis auf die heutige Zeit ist man über die Urheber des Geschreis über die Hungersnot und der damit zusammenhängenden Bewegung nicht aufgeklärt.
