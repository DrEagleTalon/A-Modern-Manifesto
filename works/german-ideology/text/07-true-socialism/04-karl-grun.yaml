- id: WSIV.292.7
  kind: p
  original: 'Wenn ein berühmter Mann gelegentlich einmal gegen das Geld, gegen die Ungleichheit, gegen den Reichtum, gegen soziale Mißstände ein Wort hat fallen lassen, Cabet hebt es auf, bittet es zu wiederholen, macht es zum Glaubensbekenntnis des Mannes, läßt es drucken, klatscht in die Hände und ruft mit ironischer Bonhomie seinem geärgerten Bourgeois zu: Écoutez, écoutez, n''était-il pas communiste? <Hört, war er nicht Kommunist?> Da entgeht ihm keiner, nicht Montesquieu, nicht Sieyes, nicht Lamartine, nicht einmal Guizot - alles Kommunisten malgré eux <gegen ihren Willen>.'
