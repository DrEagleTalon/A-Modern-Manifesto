  mew_page: '518'
- id: WSIV.357.1
  kind: p
  original: '"Dieser Kritik des Eigentums, welche die vollständige Auflösung desselben ist, brauchen wir nichts hinzuzufügen!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '518'
- id: WSIV.357.2
  kind: p
  original: Wir wollen hier nicht eine neue Kritik schreiben, welche wieder die Gleichheit der Produktion, die Vereinzelung der gleichen Arbeiter aufhöbe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 518-519
- id: WSIV.357.3
  kind: p
  original: Schon oben habe ich das Nötige angedeutet, das Übrige" (was Herr Grün nämlich nicht angedeutet hat) "wird sich beim Wiederaufbau der Gesellschaft, bei der Gründung der wahren Besitzverhältnisse finden." p. 444.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '519'
- id: WSIV.358.1
  kind: p
  original: So sucht Herr Grün dem Eingehen auf die nationalökonomischen Entwicklungen Proudhons zu entschlüpfen und zugleich sich darüber zu erheben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '519'
- id: WSIV.358.2
  kind: p
  original: Proudhons sämtliche Beweise sind falsch, doch das wird sich für Herrn Grün finden, sobald es von Andern nachgewiesen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '519'
- id: WSIV.359.1
  kind: p
  original: Die in der "Heiligen Familie" gegebenen Bemerkungen über Proudhon, namentlich, daß Proudhon die Nationalökonomie vom nationalökonomischen, das Recht vom juristischen Standpunkte aus kritisiere, werden von Herrn Grün abgeschrieben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '519'
- id: WSIV.359.2
  kind: p
  original: Er hat indes so wenig verstanden, w[or]u[m] es sich handelte, daß er die [ei]gentliche Pointe wegläßt, [nämlich] daß Proudhon die Illusi [ onen der] Juristen und Ökonomen ge[genüber] ihrer Praxis geltend m[acht, und] rein sinnlos[e Phrasen] für den obigen Satz gibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '519'
- id: WSIV.360.1
  kind: p
  original: Das Wichtigste in Proudhons Buch "De la création de l'ordre dans l'humanité" ist seine dialectique sérielle <Seriendialektik>, der Versuch, eine Methode des Denkens zu geben, wodurch an die Stelle der selbständigen Gedanken der Denkprozeß tritt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '519'
- id: WSIV.360.2
  kind: p
  original: Proudhon sucht von französischem Standpunkte aus nach einer Dialektik, wie Hegel sie wirklich gegeben hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '519'
- id: WSIV.360.3
  kind: p
  original: Die Verwandtschaft mit Hegel ist hier also realiter vorhanden, nicht durch phantastische Analogie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '519'
- id: WSIV.360.4
  kind: p
  original: Hier war es also leicht, eine Kritik der Proudhonschen Dialektik zu geben, wenn man mit der Kritik der Hegelschen fertig geworden war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '519'
- id: WSIV.360.5
  kind: p
  original: Dies war aber um so weniger von den wahren Sozialisten zu verlangen, als der von ihnen sich vindizierte Philosoph Feuerbach damit nicht zustande gekommen war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '519'
- id: WSIV.360.6
  kind: p
  original: Herr Grün sucht auf eine wirklich drollige Weise seine Aufgabe zu eskamotieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '519'
- id: WSIV.360.7
  kind: p
  original: Gerade an der Stelle, wo er sein deutsches schweres Geschütz spielen lassen sollte, reißt er aus mit einer unanständigen Gebärde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '519'
- id: WSIV.360.8
  kind: p
  original: Er füllt erst einige Blätter mit Übersetzungen aus und erklärt dem Proudhon dann mit breitspuriger belletristischer captatio benevolentiae <Jagen nach Popularität>, daß er mit seiner ganzen dialectique serielle nur den Gelehrten spielen wolle.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '519'
- id: WSIV.360.9
  kind: p
  original: 'Er sucht ihn freilich durch den Zuruf zu trösten:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '519'
- id: WSIV.361.1
  kind: p
  original: '"Ach, mein lieber Freund, was das Gelehrt- (und "Privatdozent-)sein anbetrifft, so täusche dich nicht.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '519'
- id: WSIV.361.2
  kind: p
  original: Wir haben Alles wieder verlernen müssen, was uns unsre Scholarchen und Universitätsmaschinen (mit Ausnahme von Stein, Reybaud und Cabet) - mit so unendlicher Mühe, mit so vielem Widerwillen von ihrer und von unsrer Seite beizubringen suchten." p. [457.]
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '519'
- id: WSIV.362.1
  kind: p
  original: Zum Beweise, daß Herr Grün jetzt nicht mehr "mit so unendlicher Mühe", wenn auch vielleicht noch mit eben "so vielem Widerwillen" lernt, beginnt er seine sozialistischen St[ud]ien und Briefe in Paris am 6. November [und] hat bis zum nächsten 20. Januar [nicht] nur die Studien, sondern auch [die Darstellung de]s "wahren Gesamteindrucks des vollstän[dig]en Verlaufs mit Notwendigkeit" voll[en]det.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '520'
