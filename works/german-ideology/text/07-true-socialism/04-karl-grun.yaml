  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '514'
- id: WSIV.323.5
  kind: p
  original: Jedenfalls hatten die Parlamente und populäre Vorurteile weit mehr Anteil daran als die Aristokratie.
