- id: WSIV.324.2
  kind: p
  original: Cabet setzt seinen Bourgeois, gegen den er plädiert, in die äußerste Verlegenheit, indem er Sieyès unter die Vorläufer des Kommunismus zählt, und zwar weil Sieyès die Gleichheit der Rechte anerkenne und das Eigentum erst durch den Staat sanktionieren lasse, Cabet, p. 499-502.
