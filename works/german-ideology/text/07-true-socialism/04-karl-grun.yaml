  kind: p
  original: '"Entendez Condorcet soutenir dans sa réponse à l''académie de Berlin"...(kommt lange Stelle bei Cabet, schließt:) "''C''est donc uniquement parce que les institutions sont mauvaises que le peuple est Si souvent un peu voleur par principe.'''
