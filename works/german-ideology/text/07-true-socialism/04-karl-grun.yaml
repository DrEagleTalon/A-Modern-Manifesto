  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '514'
- id: WSIV.323.8
  kind: p
  original: Auf Cabets Autorität gestützt, zählt Herr Grün Turgot unter die Kommunisten, Turgot, einen der Chefs der physiokratischen Schule, den entschiedensten Vertreter der freien Konkurrenz, den Verteidiger des Wuchers, den Lehrer Adam Smiths.
