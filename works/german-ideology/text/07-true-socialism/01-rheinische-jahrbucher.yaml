section: WSI
title_original: I. "Die Rheinischen Jahrbücher" oder Die Philosophie des wahren Sozialismus A. "Communismus, Socialismus, Humanismus" Rhein[ische] Jahrb[ücher] 1. Bd., p.167ff.
title_en: I. The "Rheinische Jahrbücher", or The Philosophy of True Socialism
author: Karl Marx, Friedrich Engels
date: 1845-1846
original_language: de
anchor_language: de
source_original: MEW 3, S. 445-472 (Dietz, Berlin 1969) via mlwerke.de; written 1845-1846, first printed in full 1932; the authors' footnotes from mlwerke's me03_anm.htm
source_en: 'None: no public-domain English translation'
verses:
- id: WSI.0.1
  kind: heading
  original: I.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: WSI.0.2
  kind: heading
  original: '"Die Rheinischen Jahrbücher" oder Die Philosophie des wahren Sozialismus'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: WSI.0.3
  kind: heading
  original: A. "Communismus, Socialismus, Humanismus" Rhein[ische] Jahrb[ücher] 1. Bd., p.167ff.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: WSI.1.1
  kind: p
  original: Wir beginnen mit diesem Aufsatz, weil er den deutsch-nationalen Charakter des wahren Sozialismus mit vollständigem Bewußtsein und großem Selbstgefühl zur Schau trägt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: WSI.2.1
  kind: p
  original: p. 168.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: WSI.2.2
  kind: p
  original: '"Es scheint, als ob die Franzosen ihre eignen Genies nicht verständen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: WSI.2.3
  kind: p
  original: Hier kommt ihnen die deutsche Wissenschaft zu Hülfe, die im Sozialismus, wenn bei der Vernunft eine Steigerung gilt, die vernünftigste Ordnung der Gesellschaft gibt."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: WSI.3.1
  kind: p
  original: Hier gibt also "die deutsche Wissenschaft" eine, und zwar "die vernünftigste", "Ordnung der Gesellschaft" " im Sozialismus".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: WSI.3.2
  kind: p
  original: Der Sozialismus wird ein bloßer Zweig der allmächtigen, allweisen, Alles umfassenden deutschen Wissenschaft, die sogar eine Gesellschaft stiftet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: WSI.3.3
  kind: p
  original: Der Sozialismus ist zwar ursprünglich französisch, aber die französischen Sozialisten waren "an sich" Deutsche, weshalb auch die wirklichen Franzosen sie "nicht verstanden".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: WSI.3.4
  kind: p
  original: 'Daher kann unser Verfasser sagen:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: WSI.4.1
  kind: p
  original: '"Der Kommunismus ist französisch, der Sozialismus deutsch; ein Glück ist es für die Franzosen, daß sie einen so glücklichen gesellschaftlichen Instinkt haben, der ihnen einst die wissenschaftlichen Studien wird ersetzen helfen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: WSI.4.2
  kind: p
  original: Dieses Resultat lag in dem Entwicklungsgange beider Völker vorgezeichnet; die Franzosen kamen durch die Politik zum Kommunismus " (nun weiß man natürlich, wie das französische Volk zum Kommunismus kam), "die Deutschen durch die Metaphysik, die zuletzt in Anthropologie umschlug, zum Sozialismus " (nämlich zum "wahren Sozialismus").
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: WSI.4.3
  kind: p
  original: '"Beide lösen sich zuletzt in Humanismus auf."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: WSI.5.1
  kind: p
  original: Nachdem man den Kommunismus und Sozialismus in zwei abstrakte Theorien, zwei Prinzipien verwandelt hat, ist natürlich nichts leichter, als eine beliebige Hegelsche Einheit dieser beiden Gegensätze unter einem beliebigen unbestimmten Namen zu phantasieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: WSI.5.2
  kind: p
  original: Womit nicht nur ein durchdringender Blick in "den Entwicklungsgang beider Völker" geworfen, sondern auch die Erhabenheit des spekulierenden Individuums über Franzosen und Deutsche glänzend dargetan ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 445-446
- id: WSI.6.1
  kind: p
  original: Übrigens ist dieser Satz ziemlich wörtlich kopiert aus dem Püttmannschen "Bürgerbuch". p. 43 und anderwärts; wie denn auch die "wissenschaftlichen Studien" des Verfassers über den Sozialismus sich auf eine konstruierende Reproduktion der in diesem Buch, den "Einundzwanzig Bogen" und anderen Schriften aus der Entstehungsepoche des deutschen Kommunismus gegebenen Ideen beschränken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: WSI.7.1
  kind: p
  original: Wir geben nun einige Proben von den in diesem Aufsatze erhobenen Einwendungen gegen den Kommunismus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: WSI.8.1
  kind: p
  original: p. 168 "Der Kommunismus verbindet die Atome zu keinem organischen Ganzen."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: WSI.9.1
  kind: p
  original: Die Verbindung von "Atomen" zu einem "organischen Ganzen" ist ebensowenig zu verlangen wie die Quadratur des Zirkels.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: WSI.10.1
  kind: p
  original: '"Wie der Kommunismus faktisch in Frankreich, seinem Hauptsitz, vertreten wird, ist er der rohe Gegensatz gegen die egoistische Zerfallenheit des Krämerstaats, über diesen politischen Gegensatz kommt er nicht hinaus, gelangt zu keiner unbedingten, voraussetzungslosen Freiheit ". (ibidem)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: WSI.11.1
  kind: p
  original: Voilà das deutsch-ideologische Postulat der "unbedingten, voraussetzungslosen Freiheit", die nur die praktische Formel für das "unbedingte, voraussetzungslose Denken" ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: WSI.11.2
  kind: p
  original: Der französische Kommunismus ist allerdings "roh", weil er der theoretische Ausdruck eines wirklichen Gegensatzes ist, über den er nach unserm Verfasser aber dadurch hinaus sein sollte, daß er diesen Gegensatz in der Einbildung als schon Überwunden unterstellt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: WSI.11.3
  kind: p
  original: Vergleiche übrigens "Bürgerbuch" u.a. p. 43.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: WSI.12.1
  kind: p
  original: '"Innerhalb des Kommunismus kann die Tyrannei recht wohl fortbestehen, weil er nicht die Gattung fortbestehen läßt." p. 168'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: WSI.13.1
  kind: p
  original: Arme Gattung!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: WSI.13.2
  kind: p
  original: Bisher hat die "Gattung" gleichzeitig mit der "Tyrannei" bestanden; aber weil der Kommunismus die "Gattung" abschafft, deshalb kann er die Tyrannei fortbestehen lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: WSI.13.3
  kind: p
  original: Und wie fängt es nach unserm wahren Sozialisten der Kommunismus an, "die Gattung" abzuschaffen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: WSI.13.4
  kind: p
  original: Er "hat die Masse vor sich". (ibidem)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: WSI.14.1
  kind: p
  original: '"Der Mensch wird im Kommunismus seines Wesens nicht bewußt... seine Abhängigkeit wird durch den Kommunismus auf das letzte, brutalste Verhältnis gebracht, auf die Abhängigkeit von der rohen Materie - Trennung von Arbeit und Genuß.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: WSI.14.2
  kind: p
  original: Der Mensch gelangt zu keiner freien sittlichen Tätigkeit ".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: WSI.15.1
  kind: p
  original: 'Um die "wissenschaftlichen Studien" zu würdigen, welche unsrem wahren Sozialisten zu diesem Satz verholfen haben, vergleiche man folgenden Satz:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: WSI.16.1
  kind: p
  original: '"Die französischen Sozialisten und Kommunisten...haben das Wesen des Sozialismus theoretisch keineswegs erkannt... selbst die radikalen" (französischen) "Kommunisten sind noch keineswegs über den Gegensatz von Arbeit und Genuß hinaus... haben sich noch nicht zum Gedanken der freien Tätigkeit erhoben...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: WSI.16.2
  kind: p
  original: Der Unterschied zwischen dem Kommunismus und der Krämerwelt ist nur der, daß die vollständige Entäußerung des wirklichen menschlichen Eigentums im Kommunismus aller Zufälligkeit enthoben, d.h. idealisiert werden soll."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: WSI.16.3
  kind: p
  original: '"Bürgerbuch", p. 43.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: WSI.17.1
  kind: p
  original: Unser wahrer Sozialist wirft also hier den Franzosen vor, daß sie ein richtiges Bewußtsein ihrer faktischen gesellschaftlichen Zustände haben, während sie das Bewußtsein "des Menschen" über " sein Wesen" zutage fördern sollten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: WSI.17.2
  kind: p
  original: Alle Vorwürfe dieser wahren Sozialisten gegen die Franzosen laufen darauf hinaus, daß die Feuerbachsche Philosophie nicht die letzte Pointe ihrer gesamten Bewegung ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: WSI.17.3
  kind: p
  original: Wovon der Verfasser ausgeht, ist der vorgefundene Satz von der Trennung von Arbeit und Genuß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: WSI.17.4
  kind: p
  original: Statt mit diesem Satze anzufangen, dreht er ideologisch die Sache um, fängt an mit dem fehlenden Bewußtsein des Menschen, schließt daraus auf die "Abhängigkeit von der rohen Materie" und läßt diese sich realisieren in der "Trennung von Arbeit und Genuß".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: WSI.17.5
  kind: p
  original: Wir werden übrigens noch Exempel davon sehen, wohin unser wahrer Sozialist mit seiner Unabhängigkeit "von der rohen Materie" kommt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: WSI.17.6
  kind: p
  original: '- Überhaupt sind diese Herren alle von merkwürdigem Zartgefühl.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: WSI.17.7
  kind: p
  original: Alles, namentlich die Materie, schockiert sie, überall klagen sie über Roheit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: WSI.17.8
  kind: p
  original: Oben hatten wir schon den " rohen Gegensatz", jetzt das " brutalste Verhältnis" der "Abhängigkeit von der rohen Materie".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: WSI.18.1
  kind: p
  original: 'Der Deutsche öffnet den Mund weit: Die Liebe sei nicht zu roh, Sie schadet sonst der Gesundheit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: WSI.19.1
  kind: p
  original: <Abgewandeltes Zitat aus Heine, "Lyrisches Intermezzo, 50. Gedicht">
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: WSI.20.1
  kind: p
  original: 'Natürlich, die deutsche Philosophie in ihrer Verkleidung als Sozialismus geht zwar zum Schein auf die "rohe Wirklichkeit", ein, aber sie hält sich immer in anständiger Entfernung von ihr und ruft ihr mit hysterischer Gereiztheit zu: Noli me tangere! <Rühr mich nicht an!>'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: WSI.21.1
  kind: p
  original: Nach diesen wissenschaftlichen Einwürfen gegen den französischen Kommunismus kommen wir auf einige historische Erörterungen, die von der "freien sittlichen Tätigkeit" und den "wissenschaftlichen Studien" unsres wahren Sozialisten wie auch von seiner Unabhängigkeit von der rohen Materie glänzendes Zeugnis ablegen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: WSI.22.1
  kind: p
  original: p.170 kommt er zudem "Resultate", daß "der" (abermals) "rohe französische Kommunismus" der einzige ist, den es "gibt".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: WSI.22.2
  kind: p
  original: Die Konstruktion dieser Wahrheit a priori wird mit großem "gesellschaftlichem Instinkt" durchgeführt und zeigt, daß "der Mensch seines Wesens sich bewußt" geworden ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: WSI.22.3
  kind: p
  original: 'Man höre:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: WSI.23.1
  kind: p
  original: '"Es gibt keinen andern, denn was Weitling gegeben hat, ist nur eine Verarbeitung fourieristischer und kommunistischer Ideen, wie er sie in Paris und Genf kennenlernte."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: WSI.24.1
  kind: p
  original: '"Es gibt keinen" englischen Kommunismus, "denn was Weitling" usw. Thomas Morus, die Levellers, Owen, Thompson, Watts, Holyoake, Harney, Morgan, Southwell, Goodwyn Barmby, Greaves, Edmonds, Hobson, Spence werden sich sehr wundern, resp. im Grabe umdrehen, wenn ihnen zu Ohren kommt, wie sie keine Kommunisten sind, "denn" Weitling ging nach Paris und Genf.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: WSI.25.1
  kind: p
  original: Übrigens scheint der Weitlingsche Kommunismus doch auch ein andrer zu sein als der "rohe französische", vulgo Babouvismus, da er auch "fourieristische Ideen" enthält.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: WSI.26.1
  kind: p
  original: '"Die Kommunisten waren besonders stark in der Aufstellung von Systemen oder gleich fertigen Gesellschaftsordnungen (Cabets Ikarien, ''La Félicité, Weitling).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: WSI.26.2
  kind: p
  original: Alle Systeme aber sind dogmatisch-diktatorisch." p. 170
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: WSI.27.1
  kind: p
  original: Mit seiner Meinungsabgabe über Systeme überhaupt hat der wahre Sozialismus sich natürlich der Mühe überhoben, die kommunistischen Systeme selbst kennenzulernen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: WSI.27.2
  kind: p
  original: Mit einem Schlage hat er nicht nur Ikarien, sondern auch alle philosophischen Systeme von Aristoteles bis Hegel, das système de la nature, das Linnésche und Jussieusche Pflanzensystem und sogar das Sonnensystem überwunden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: WSI.27.3
  kind: p
  original: Was übrigens die Systeme selbst angeht, so sind diese fast alle im Anfange der kommunistischen Bewegung aufgekommen und dienten damals der Propaganda als Volksromane, die dem noch unentwickelten Bewußtsein der sich eben in Bewegung setzenden Proletarier vollkommen entsprachen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: WSI.27.4
  kind: p
  original: Cabet selbst nennt seine "Icarie" einen roman philosophique <philosophschen Roman> und ist keineswegs aus seinem System, sondern aus seinen Streitschriften, überhaupt aus seiner ganzen Tätigkeit als Parteichef zu beurteilen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: WSI.27.5
  kind: p
  original: Einige dieser Romane, z.B. das Fouriersche System, sind mit wirklich poetischem Geiste, andere, wie das Owensche und Cabetsche, ohne alle Phantasie mit kaufmännischer Berechnung oder juristisch-schlauem Anschmiegen an die Anschauungen der zu bearbeitenden Klasse ausgeführt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: WSI.27.6
  kind: p
  original: Diese Systeme verlieren bei der Entwicklung der Partei alle Bedeutung und werden höchstens nominell als Stichwörter beibehalten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 448-449
- id: WSI.27.7
  kind: p
  original: Wer glaubt in Frankreich an Ikarien, wer in England an die verschiedenen modifizierten Pläne Owens, die er selbst je nach veränderten Zeitumständen oder mit Rücksicht auf Propaganda unter bestimmten Klassen predigte?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: WSI.27.8
  kind: p
  original: Wie wenig der wirkliche Inhalt dieser Systeme in ihrer systematischen Form liegt, beweisen am besten die orthodoxen Fourieristen der "Démocratie pacifique", die bei all ihrer Orthodoxie die geraden Antipoden Fouriers, doktrinäre Bourgeois sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: WSI.27.9
  kind: p
  original: Der eigentliche Inhalt aller epochemachenden Systeme sind die Bedürfnisse der Zeit, in der sie entstanden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: WSI.27.10
  kind: p
  original: Jedem derselben liegt die ganze vorhergegangne Entwicklung einer Nation, die geschichtliche Gestaltung der Klassenverhältnisse mit ihren politischen, moralischen, philosophischen und andern Konsequenzen zugrunde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: WSI.27.11
  kind: p
  original: Dieser Basis und diesem Inhalt der kommunistischen Systeme gegenüber ist mit dem Satz, daß alle Systeme dogmatisch-diktatorisch sind, gar nichts ausgerichtet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: WSI.27.12
  kind: p
  original: Den Deutschen lagen keine ausgebildeten Klassenverhältnisse vor wie den Engländern und Franzosen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: WSI.27.13
  kind: p
  original: Die deutschen Kommunisten konnten daher die Basis ihres Systems nur aus den Verhältnissen des Standes nehmen, aus dem sie hervorgingen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: WSI.27.14
  kind: p
  original: Daß daher das einzige existierende deutsche kommunistische System eine Reproduktion der französischen Ideen innerhalb der durch die kleinen Handwerkerverhältnisse beschränkten Anschauungsweise war, ist ganz natürlich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: WSI.28.1
  kind: p
  original: Die Tyrannei, die innerhalb des Kommunismus fortbesteht, zeigt "der Wahnsinn Cabets, welcher verlangt, daß alle Welt auf seinen 'Populaire' abonnieren soll". p.168.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: WSI.28.2
  kind: p
  original: Wenn unser Freund Forderungen, die ein Parteichef, durch bestimmte Umstände und die Gefahr der Zersplitterung beschränkter Geldmittel gezwungen, an seine Partei stellt, zuerst verdreht und dann an dem "Wesen des Menschen" mißt, so, muß er allerdings zu dem Resultate kommen, daß dieser Parteichef und alle andern Parteileute "wahnsinnig", dagegen bloß unparteiische Gestalten, wie er und das "Wesen des Menschen", gesunden Verstandes seien.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: WSI.28.3
  kind: p
  original: Er möge übrigens aus Cabets "Ma ligne droite" das wahre Sachverhältnis kennenlernen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: WSI.29.1
  kind: p
  original: Schließlich faßt sich der ganze Gegensatz unsres Verfassers und überhaupt der deutschen wahren Sozialisten und Ideologen gegen die wirklichen Bewegungen andrer Nationen in einem klassischen Satze zusammen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: WSI.29.2
  kind: p
  original: Die Deutschen beurteilen Alles sub specie aeterni <vom Gesichtspunkt der Ewigkeit> (nach dem Wesen des Menschen), die Ausländer sehen alles praktisch, nach den wirklich vorliegenden Menschen und Verhältnissen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: WSI.29.3
  kind: p
  original: Die Ausländer denken und handeln für die Zeit, die Deutschen für die Ewigkeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: WSI.29.4
  kind: p
  original: 'Dies gesteht unser wahrer Sozialist folgendermaßen ein:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: WSI.30.1
  kind: p
  original: '"Schon durch seinen Namen, den Gegensatz gegen die Konkurrenz, zeigt der Kommunismus seine Einseitigkeit; soll denn aber diese Befangenheit, die wohl jetzt als Parteiname ihre Geltung haben kann ewig währen?"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: WSI.31.1
  kind: p
  original: Nach dieser gründlichen Vernichtung des Kommunismus geht unser Verfasser auf seinen Gegensatz, den Sozialismus, über.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: WSI.32.1
  kind: p
  original: '"Der Sozialismus gibt die anarchische Ordnung, die der menschlichen Gattung, wie dem Universum, wesentlich eigentümlich ist" (p. 170) und ebendeshalb für "die menschliche Gattung" bisher nicht existiert hat.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: WSI.33.1
  kind: p
  original: Die freie Konkurrenz ist zu "roh", um unsrem wahren Sozialisten als "anarchische Ordnung" zu erscheinen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: WSI.34.1
  kind: p
  original: '"Voll Vertrauen auf den sittlichen Kern der Menschheit" dekretiert "der Sozialismus", daß "die Vereinigung der Geschlechter nur die höchste Steigerung der Liebe ist und sein sollte, denn nur das Natürliche ist wahr, und das Wahre ist sittlich." p. 171.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: WSI.35.1
  kind: p
  original: Der Grund, weshalb "die Vereinigung etc. etc. ist und sein sollte", paßt auf Alles.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: WSI.35.2
  kind: p
  original: Z.B. "Voll Vertrauen auf den sittlichen Kern " des Affengeschlechts kann "der Sozialismus" ebenfalls dekretieren, daß die bei den Affen sich natürlich vorfindende Onanie "nur die höchste Steigerung der" Selbst-"Liebe ist und sein sollte; denn nur das Natürliche ist wahr, und das Wahre ist sittlich."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: WSI.36.1
  kind: p
  original: Woher der Sozialismus den Maßstab dessen nimmt, was "natürlich" ist, läßt sich schwer sagen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: WSI.37.1
  kind: p
  original: '"Tätigkeit und Genuß fallen in des Menschen Eigentümlichkeit zusammen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: WSI.37.2
  kind: p
  original: Durch diese warnen jene beiden bestimmt, nicht durch die außer uns stehenden Produkte."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: WSI.38.1
  kind: p
  original: '"Da nun aber diese Produkte zur Tätigkeit, das ist zum wahren Leben unumgänglich sind, dieselben aber durch die gemeinsame Tätigkeit der gesamten Menschheit sich von Letzterer gleichsam abgelöst haben, so sind oder sollen sie auch für Alle das gemeinsame Substrat weiterer Entwicklung sein (Gütergemeinschaft).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: WSI.39.1
  kind: p
  original: '"Unsre heutige Gesellschaft ist freilich so verwildert, daß Einzelne in tierischem Heißhunger über die Produkte fremder Arbeit herfallen und dabei untätig ihr eignes Wesen verfaulen lassen (Rentiers); wovon wieder die notwendige Konsequenz ist, daß Andere, deren Eigentum (ihr eignes menschliches Wesen) nicht durch Untätigkeit, sondern durch aufreibende Anspannung verkümmert, zu maschinenmäßigem Produzieren getrieben werden (Proletarier)...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: WSI.39.2
  kind: p
  original: Beide Extreme unsrer Gesellschaft aber, Rentiers und Proletarier, stehen auf Einer Stufe der Bildung, Beide sind abhängig von den Dingen außer ihnen" oder "Neger", wie Sankt Max sagen würde, p.169, 170.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: WSI.40.1
  kind: p
  original: Diese obigen "Resultate" unsres "Mongolen" über "Unser Negertum" sind das Vollendetste, was der wahre Sozialismus bis jetzt "als zum wahren Leben unumgängliches Produkt gleichsam von sich abgelöst hat" und wovon er nach "des Menschen Eigentümlichkeit" glaubt, daß "die gesamte Menschheit" darüber "in tierischem Heißhunger herfallen" müsse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 450-451
- id: WSI.41.1
  kind: p
  original: '"Rentiers, "Proletarier", "maschinenmäßig", "Gütergemeinschaft" - diese vier Vorstellungen sind jedenfalls für unsren Mongolen "außer ihm stehende Produkte", in Beziehung auf welche seine "Tätigkeit" und sein "Genuß" darin besteht, sie als die bloß antizipierten Namen für die Resultate seines eignen "maschinenmäßigen Produzierens" darzustellen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: WSI.42.1
  kind: p
  original: Wir erfahren, daß die Gesellschaft verwildert ist und daß deshalb die Individuen, die ebendiese Gesellschaft bilden, an allerhand Gebrechen leiden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: WSI.42.2
  kind: p
  original: Die Gesellschaft wird getrennt von diesen Individuen, verselbständigt, sie verwildert auf eigne Faust, und erst in Folge dieser Verwilderung leiden die Individuen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: WSI.42.3
  kind: p
  original: Die erste Folge dieser Verwilderung sind die Bestimmungen Raubtier, untätig und Inhaber eines "verfaulenden eignen Wesens", worauf wir zu unsrem Schrecken erfahren, daß diese Bestimmungen "der Rentier" sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: WSI.42.4
  kind: p
  original: Dabei ist nur zu bemerken, daß dies "Verfaulenlassen des eignen Wesens" weiter nichts ist als eine philosophisch mystifizierte Manier, sich über die "Untätigkeit" klarzuwerden, von deren praktischer Beschaffenheit wenig zu wissen scheint.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: WSI.43.1
  kind: p
  original: 'Die zweite "notwendige Konsequenz" dieser ersten Folge der Verwilderung sind die beiden Bestimmungen: "Verkümmern des eignen menschlichen Wesens durch aufreibende Anspannung" und "Getriebenwerden zu maschinenmäßigem Produzieren".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: WSI.43.2
  kind: p
  original: Diese beiden Bestimmungen sind die notwendige "Konsequenz davon, daß die Rentiers ihr eignes Wesen verfaulen lassen", und heißen in der profanen Sprache, wie wir wiederum mit Schrecken erfahren, "der Proletarier".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: WSI.44.1
  kind: p
  original: 'Der Kausalnexus des Satzes ist also folgender: Daß Proletarier existieren und maschinenmäßig arbeiten, findet sich als Tatsache vor.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: WSI.44.2
  kind: p
  original: Warum müssen die Proletarier "maschinenmäßig produzieren"?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: WSI.44.3
  kind: p
  original: Weil die Rentiers "ihr eignes Wesen verfaulen lassen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: WSI.44.4
  kind: p
  original: Warum lassen die Rentiers ihr eignes Wesen verfaulen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: WSI.44.5
  kind: p
  original: Weil "unsre heutige Gesellschaft so verwildert ist".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: WSI.44.6
  kind: p
  original: Warum ist sie so verwildert?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: WSI.44.7
  kind: p
  original: Das frage deinen Schöpfer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: WSI.45.1
  kind: p
  original: Charakteristisch ist für unsren wahren Sozialisten, daß er in dem Gegensatz von Rentiers und Proletariern "die Extreme unsrer Gesellschaft" sieht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: WSI.45.2
  kind: p
  original: Dieser Gegensatz, der so ziemlich auf allen einigermaßen entwickelten Gesellschaftsstufen existiert hat und seit undenklicher Zeit von allen Moralisten breitgeschlagen ist, wurde namentlich ganz im Anfange der proletarischen Bewegung wieder hervorgesucht, zu einer Zeit, wo das Proletariat mit der industriellen und kleinen Bourgeoisie noch gemeinsame Interessen hatte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: WSI.45.3
  kind: p
  original: Vergleiche z.B. Cobbetts und P.L. Couriers Schriften oder Saint-Simon, der im Anfange die industriellen Kapitalisten noch zu den travailleurs <Arbeitern> rechnete, im Gegensatz zu den oisifs <Müßiggängern>, den Rentiers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 451-452
- id: WSI.45.4
  kind: p
  original: Diesen trivialen Gegensatz auszusprechen, und zwar nicht in der gewöhnlichen, sondern in der heiligen philosophischen Sprache, für diese kindliche Einsicht nicht den passenden, sondern einen verhimmelten, abstrakten Ausdruck zu geben, darauf reduziert sich die Gründlichkeit der im wahren Sozialismus vollendeten deutschen Wissenschaft hier wie in allen andern Fällen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
- id: WSI.45.5
  kind: p
  original: Dieser Gründlichkeit setzt dann auch der Schluß die Krone auf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
- id: WSI.45.6
  kind: p
  original: Hier verwandelt unser wahrer Sozialist die ganz verschiedenen Bildungsstufen der Proletarier und Rentiers in "eine Stufe der Bildung", weil er von ihren wirklichen Bildungsstufen Umgang nehmen und sie unter die philosophische Phrase "Abhängigkeit von den Dingen außer ihnen" subsumieren kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
- id: WSI.45.7
  kind: p
  original: Hier hat der wahre Sozialismus die Bildungsstufe gefunden, auf der die Verschiedenheit aller Bildungsstufen in den drei Naturreichen, der Geologie und Geschichte sich vollständig in nichts auflöst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
- id: WSI.46.1
  kind: p
  original: Trotz seines Hasses gegen die "Abhängigkeit von den Dingen außer ihm" gesteht der wahre Sozialist doch ein, daß er von ihnen abhängig ist, "da die Produkte", d.h. eben diese Dinge, "zur Tätigkeit" und "zum wahren Leben unumgänglich sind".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
- id: WSI.46.2
  kind: p
  original: Dies verschämte Geständnis wird gemacht, um einer philosophischen Konstruktion der Gütergemeinschaft Bahn zu brechen, einer Konstruktion, die in so baren Unsinn verläuft, daß sie bloß der Aufmerksamkeit des Lesers zu empfehlen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
- id: WSI.47.1
  kind: p
  original: Wir kommen jetzt zu dem ersten der oben zitierten Sätze.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
- id: WSI.47.2
  kind: p
  original: Hier wird wieder die "Unabhängigkeit von den Dingen" für die Tätigkeit und den Genuß in Anspruch genommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
- id: WSI.47.3
  kind: p
  original: Tätigkeit und Genuß "werden bestimmt" durch "die Eigentümlichkeit des Menschen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
- id: WSI.47.4
  kind: p
  original: Statt diese Eigentümlichkeit in der Tätigkeit und dem Genuß der ihn umgebenden Menschen nachzuweisen, wo er sehr bald gefunden haben würde, inwiefern hier die außer uns stehenden Produkte ebenfalls mitsprechen, läßt er Beide in "der Eigentümlichkeit des Menschen zusammenfallen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
- id: WSI.47.5
  kind: p
  original: Statt die Eigentümlichkeit der Menschen in ihrer Tätigkeit und der dadurch bedingten Weise des Genusses sich zur Anschauung zu bringen, erklärt er Beide aus der "Eigentümlichkeit des Menschen", wo dann alle Diskussion abgeschnitten ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
- id: WSI.47.6
  kind: p
  original: Von der wirklichen Handlung des Individuums flüchtet er sich wieder in seine unbeschreibliche, unnahbare Eigentümlichkeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
- id: WSI.47.7
  kind: p
  original: Wir sehen hier übrigens, was die wahren Sozialisten unter der "freien Tätigkeit" verstehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
- id: WSI.47.8
  kind: p
  original: Unser Verfasser verrät uns unvorsichtigerweise, daß sie die Tätigkeit ist, die "nicht durch die Dinge außer uns bestimmt wird", d.h. der actus purus, die reine, absolute Tätigkeit, die nichts als Tätigkeit ist und in letzter Instanz wieder auf die Illusion vom "reinen Denken" hinausläuft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 452-453
- id: WSI.47.9
  kind: p
  original: Diese reine Tätigkeit wird natürlich sehr verunreinigt, wenn sie ein materielles Substrat und ein materielles Resultat hat; der wahre Sozialist befaßt sich nur widerstrebend mit solcher unreinen Tätigkeit und verachtet ihr Produkt, das nicht mehr "Resultat", sondern "nur ein Abfall vom Menschen" genannt wird (p. 169).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: WSI.47.10
  kind: p
  original: Das Subjekt, das dieser reinen Tätigkeit zugrunde liegt, kann daher auch kein wirklicher sinnlicher Mensch, sondern nur der denkende Geist sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: WSI.47.11
  kind: p
  original: Die so verdeutschte "freie Tätigkeit" ist nur eine andere Formel für die obige "unbedingte, voraussetzungslose Freiheit".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: WSI.47.12
  kind: p
  original: Wie sehr übrigens dies Gerede von der "freien Tätigkeit", das bei den wahren Sozialisten nur dazu dient, ihre Unkenntnis der wirklichen Produktion zu verhüllen, in letzter Instanz auf das "reine Denken" hinausläuft, beweist unser Verfasser schon dadurch, daß das Postulat der wahrhaften Erkenntnis sein letztes Wort ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: WSI.48.1
  kind: p
  original: '"Diese Sonderung der beiden Hauptparteien der Zeit " (nämlich des französischen rohen Kommunismus und des deutschen Sozialismus) "hat sich durch die Entwicklung der letzten zwei Jahre ergeben, wie sie namentlich in Heß'' ''Philosophie der That'' - Herweghs,Einundzwanzig Bogen'' - begann.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: WSI.48.2
  kind: p
  original: Es war somit an der Zeit, auch einmal die Schibboleths der gesellschaftlichen Parteien näher zu beleuchten." p. 173.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: WSI.49.1
  kind: p
  original: Wir haben hier also auf der einen Seite die wirklich existierende kommunistische Partei in Frankreich mit ihrer Literatur und auf der andern einige deutsche Halbgelehrte, die sich die Ideen dieser Literatur philosophisch zu verdeutlichen streben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: WSI.49.2
  kind: p
  original: Diese letzteren gelten ebensogut wie die ersteren für eine " Hauptpartei der Zeit ", also für eine Partei, die nicht nur für ihren nächsten Gegensatz, die französischen Kommunisten, sondern auch für die englischen Chartisten und Kommunisten, die amerikanischen Nationalreformer und überhaupt alle andern Parteien "der Zeit" von unendlicher Wichtigkeit ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: WSI.49.3
  kind: p
  original: Leider wissen alle diese Parteien nichts von der Existenz dieser "Hauptpartei".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: WSI.49.4
  kind: p
  original: Es ist aber seit geraumer Zeit die Manier der deutschen Ideologen, daß jede ihrer literarischen Fraktionen, besonders die, die "am weitesten zu gehen" wähnt, sich nicht nur für "eine Hauptpartei", sondern geradezu für " die Hauptpartei der Zeit" erklärt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: WSI.49.5
  kind: p
  original: Wir haben so unter andern "die Hauptpartei" der kritischen Kritik, "die Hauptpartei" des mit sich einigen Egoismus und jetzt "die Hauptpartei" der wahren Sozialisten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: WSI.49.6
  kind: p
  original: Deutschland kann es auf diese Weise noch zu einem ganzen Schock von "Hauptparteien" bringen, deren Existenz bloß in Deutschland und auch hier nur unter dem kleinen Stande der Gelehrten, Halbgelehrten und Literaten bekannt ist, während sie alle wähnen, die Kurbel der Weltgeschichte zu drehen, wenn sie das lange Garn ihrer eignen Phantasien spinnen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: WSI.50.1
  kind: p
  original: Diese "Hauptpartei der wahren Sozialisten hat sich "durch die Entwicklung der letzten zwei Jahre ergeben, wie sie namentlich in Heß' Philosophie begann".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.50.2
  kind: p
  original: D.h., sie hat "sich ergeben", als die Verwicklung unsres Verfassers in den Sozialismus "begann", nämlich in den "zwei letzten Jahren", womit es für ihn "an der Zeit war", sich vermittelst einiger "Schibboleths" über das, was er für "gesellschaftliche Parteien" hält, "auch einmal näher" zu erleuchten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.51.1
  kind: p
  original: Nachdem wir so mit dem Kommunismus und Sozialismus fertig geworden sind" führt uns unser Verfasser die höhere Einheit beider, den Humanismus, vor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.51.2
  kind: p
  original: Von diesem Augenblicke an betreten wir das Land " des Menschen", und von nun an trägt sich die ganze wahre Geschichte unsres wahren Sozialisten nur in Deutschland zu.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.52.1
  kind: p
  original: '"In dem Humanismus nun lösen sich alle Namenstreitigkeiten auf; zu was Kommunisten, zu was Sozialisten?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.52.2
  kind: p
  original: Wir sind Menschen " (p. 72)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.53.1
  kind: p
  original: '- tous frères, tous amis <alle Brüder, alle Freunde>,'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.54.1
  kind: p
  original: Laßt uns nicht schwimmen gegen den Strom, Ihr Brüder, es hilft uns wenig!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.54.2
  kind: p
  original: 'Laßt uns besteigen den Templower Berg und rufen: Es lebe der König!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.55.1
  kind: p
  original: Zu was Menschen, zu was Bestien, zu was Pflanzen, zu was Steine?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.55.2
  kind: p
  original: Wir sind Körper!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.56.1
  kind: p
  original: Folgt eine historische Auseinandersetzung, die auf der deutschen Wissenschaft basiert und die den Franzosen ihr "gesellschaftlicher Instinkt einst ersetzen helfen wird".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.56.2
  kind: p
  original: Antike Zeit - Naivetät, Mittelalter - Romantik, neue Zeit - Humanismus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.56.3
  kind: p
  original: Durch diese drei Trivialitäten ist natürlich der Humanismus unsres Verfassers historisch konstruiert und als die Wahrheit der Humaniora von ehedem erwiesen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.56.4
  kind: p
  original: Über dergleichen Konstruktionen vergleiche man "Sankt Max" im ersten Bande, der diesen Artikel viel kunstgerechter und weniger dilettantisch fabriziert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.57.1
  kind: p
  original: p. 172 wird uns berichtet, daß
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.58.1
  kind: p
  original: '"die letzte Folge des Scholastizismus die Spaltung des Lebens ist, die Heß vernichtete".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.59.1
  kind: p
  original: Die Theorie wird hier also als die Ursache der "Spaltung des Lebens" dargestellt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.59.2
  kind: p
  original: Man sieht nicht ein, weshalb diese wahren Sozialisten überhaupt von der Gesellschaft sprechen, wenn sie mit den Philosophen glauben, daß alle wirklichen Spaltungen durch Begriffsspaltungen hervorgerufen wurden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: WSI.59.3
  kind: p
  original: Sie können sich in diesem philosophischen Glauben an die weltschöpferische und weltzerstörende Macht der Begriffe dann auch einbilden, ein beliebiges Individuum habe durch irgendwelche "Vernichtung" von Begriffen "die Spaltung des Lebens vernichtet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: WSI.59.4
  kind: p
  original: Bei diesen wahren Sozialisten wird, wie bei allen deutschen Ideologen, die literarische Geschichte fortwährend mit der wirklichen Geschichte als gleich wirkend durcheinandergeworfen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: WSI.59.5
  kind: p
  original: Diese Manier ist allerdings sehr begreiflich bei den Deutschen, die die miserable Rolle, die sie in der wirklichen Geschichte gespielt haben und fortwährend spielen, dadurch verdecken, daß sie die Illusionen, an denen sie so besonders reich waren, auf gleiche Stufe mit der Wirklichkeit stellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: WSI.60.1
  kind: p
  original: Nun zu den "letzten zwei Jahren", in denen die deutsche Wissenschaft sämtliche Fragen gründlichst erledigt und den andern Nationen nichts mehr übrig läßt als die Ausführung ihrer Dekrete.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: WSI.61.1
  kind: p
  original: '"Das Werk der Anthropologie, die Wiedergewinnung seines" (Feuerbachs oder des Menschen?) "ihm entfremdeten Wesens durch den Menschen ward durch Feuerbach nur einseitig vollzogen, d.h. begonnen; er vernichtete die religiöse Illusion, die theoretische Abstraktion, den Gott-Menschen, während Heß die politische Illusion, die Abstraktion seines" (Hessens oder des Menschen?), "Vermögens, seiner Tätigkeit, d. i. das Vermögen zerstört.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: WSI.61.2
  kind: p
  original: 'Nur durch die Arbeit des letzteren ward der Mensch von den letzten Mächten außer ihm befreit, zu sittlicher Tätigkeit befähigt - alle Uneigennützigkeit der früheren" (vorhessischen) "Zeit war nur eine scheinbare - und in seine Würde wieder eingesetzt: oder wo galt der Mensch früher" (vor Heß) "das, was er war?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: WSI.61.3
  kind: p
  original: Wurde er nicht nach seinen Schätzen geschätzt?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: WSI.61.4
  kind: p
  original: Sein Geld schaffte ihm seine Geltung." p. 171.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: WSI.62.1
  kind: p
  original: Charakteristisch ist für alle diese hohen Worte von Befreiung usw., daß immer nur " der Mensch" der Befreite etc. ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: WSI.62.2
  kind: p
  original: 'Obgleich es nach den obigen Aussprüchen scheint, als habe nun das "Vermögen", "Geld" usw. aufgehört, so erfahren wir doch im folgenden Satz:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: WSI.63.1
  kind: p
  original: '"Nun erst, nach Zerstörung dieser Illusionen" (das Geld ist, sub specie aeterni <vom Gesichtspunkt der Ewigkeit> betrachtet, allerdings eine Illusion, l''or n''est qu''une chimère <das Gold ist nur ein Hirngespinst>), "kann an eine neue, menschliche Ordnung der Gesellschaft gedacht werden." (ibid.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: WSI.64.1
  kind: p
  original: Dies ist aber ganz überflüssig, denn
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: WSI.65.1
  kind: p
  original: '"die Erkenntnis des Wesens des Menschen hat ein wahrhaft menschliches Leben zur natürlichen, notwendigen Folge". (p. 172.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: WSI.66.1
  kind: p
  original: Durch die Metaphysik, durch die Politik pp. zum Kommunismus oder Sozialismus kommen - diese bei den wahren Sozialisten sehr beliebten Phrasen besagen weiter nichts, als daß dieser oder jener Schriftsteller die ihm von Außen zu gekommenen und aus ganz andern Verhältnissen entsprungenen kommunistischen Ideen sich in der Redeweise seines bisherigen Standpunkts angeeignet und ihnen den diesem Standpunkte entsprechenden Ausdruck gegeben hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 455-456
- id: WSI.66.2
  kind: p
  original: Ob einer oder der andre dieser Standpunkte bei einer ganzen Nation vorwiegt, ob ihre kommunistische Anschauungsweise politisch, metaphysisch oder sonst tingiert ist, hängt natürlich von der ganzen Entwicklung des Volkes ab.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '456'
- id: WSI.66.3
  kind: p
  original: Unser Verfasser zieht aus der Tatsache, daß die Anschauungsweise der meisten französischen Kommunisten eine politische Färbung hat - einer Tatsache, der die andre gegenübersteht, daß sehr viele französische Sozialisten von der Politik gänzlich abstrahiert haben - den Schluß, daß die Franzosen "durch die Politik", durch ihre politische Entwicklung "zum Kommunismus gekommen seien".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '456'
- id: WSI.66.4
  kind: p
  original: Dieser überhaupt in Deutschland sehr stark zirkulierende Satz beweist nicht, daß unser Verfasser von der Politik, namentlich der französischen politischen Entwicklung, oder vom Kommunismus irgend etwas weiß, sondern nur, daß er die Politik für eine selbständige Sphäre hält, die ihre eigne, selbständige Entwicklung hat, ein Glaube, den er mit allen Ideologen teilt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '456'
- id: WSI.67.1
  kind: p
  original: Ein anderes Stichwort der wahren Sozialisten ist das "wahre Eigentum", das "wahre, persönliche Eigentum", "wirkliche", "gesellschaftliche", "lebendige", "natürliche" ppp.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '456'
- id: WSI.67.2
  kind: p
  original: Eigentum, wogegen sie höchst charakteristisch das Privateigentum als " sogenanntes Eigentum" bezeichnen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '456'
- id: WSI.67.3
  kind: p
  original: Wir haben schon im ersten Bande darauf hingewiesen, daß dieser Sprachgebrauch ursprünglich von den Saint-Simonisten herrührt, bei denen er indes nie diese deutsche metaphysisch-mysteriöse Form erreichte und bei denen er im Anfange der sozialistischen Bewegung gegenüber dem bornierten Geschrei der Bourgeois einigermaßen berechtigt war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '456'
- id: WSI.67.4
  kind: p
  original: Das Ende, das die meisten Saint-Simonisten genommen haben, beweist übrigens, wie leicht dies "wahre Eigentum" sich in "gewöhnliches Privateigentum" wieder auflöst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '456'
- id: WSI.68.1
  kind: p
  original: Wenn man sich den Gegensatz des Kommunismus zur Welt des Privateigentums in der rohsten Form vorstellt, d.h. in der abstraktesten Form, in der man alle wirklichen Bedingungen dieses Gegensatzes entfernt, so hat man den Gegensatz von Eigentum und Eigentumslosigkeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '456'
- id: WSI.68.2
  kind: p
  original: Man kann dann die Aufhebung dieses Gegensatzes als Aufhebung der einen oder der andern Seite fassen, als Aufhebung des Eigentums, wobei die allgemeine Eigentumslosigkeit oder Lumperei herauskommt, oder als Aufhebung der Eigentumslosigkeit, die in der Herstellung des wahren Eigentums besteht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '456'
- id: WSI.68.3
  kind: p
  original: In der Wirklichkeit stehen auf der einen Seite die wirklichen Privateigentümer, auf der andern die eigentumslosen kommunistischen Proletarier.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 456-457
- id: WSI.68.4
  kind: p
  original: Dieser Gegensatz wird täglich schärfer und drängt auf eine Krise hin.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '457'
- id: WSI.68.5
  kind: p
  original: Wenn also die theoretischen Vertreter der Proletarier irgend etwas durch ihre literarische Tätigkeit ausrichten wollen, so müssen sie vor Allem darauf dringen, daß alle Phrasen entfernt werden, die das Bewußtsein der Schärfe dieses Gegensatzes schwächen, alle Phrasen, die diesen Gegensatz vertuschen und wohl gar den Bourgeois Gelegenheit bieten, sich kraft ihrer philanthropischen Schwärmereien der Sicherheit halber den Kommunisten zu nähern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '457'
- id: WSI.68.6
  kind: p
  original: Alle diese schlechten Eigenschaften finden wir aber in den Stichwörtern der wahren Sozialisten, namentlich in dem "wahren Eigentum".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '457'
- id: WSI.68.7
  kind: p
  original: Wir wissen sehr gut, daß die kommunistische Bewegung nicht durch ein paar deutsche Phrasenmacher verdorben werden kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '457'
- id: WSI.68.8
  kind: p
  original: Aber es ist dennoch nötig, in einem Lande wie Deutschland, wo die philosophischen Phrasen seit Jahrhunderten eine gewisse Macht hatten und wo die Abwesenheit der scharfen Klassengegensätze andrer Nationen ohnehin dem kommunistischen Bewußtsein weniger Schärfe und Entschiedenheit gibt, allen Phrasen entgegenzutreten, die das Bewußtsein über den totalen Gegensatz des Kommunismus gegen die bestehende Weltordnung noch mehr abschwächen und verwässern könnten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '457'
- id: WSI.69.1
  kind: p
  original: Diese Theorie vom wahren Eigentum faßt das bisherige wirkliche Privateigentum nur als Schein, dagegen die aus diesem wirklichen Eigentum abstrahierte Vorstellung als Wahrheit und Wirklichkeit dieses Scheins, ist also durch und durch ideologisch.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '457'
- id: WSI.69.2
  kind: p
  original: Sie spricht nur klarer und bestimmter die Vorstellungen der Kleinbürger aus, deren wohltätige Bestrebungen und fromme Wünsche ebenfalls auf die Aufhebung der Eigentumslosigkeit hinauslaufen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '457'
- id: WSI.70.1
  kind: p
  original: Wir haben in diesem Aufsatze wieder gesehen, welche borniert-nationale Anschauungsweise dem vorgeblichen Universalismus und Kosmopolitismus der Deutschen zugrunde liegt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '457'
- id: WSI.71.1
  kind: p
  original: Franzosen und Russen gehört das Land, Das Meer gehört den Briten, Wir aber besitzen im Luftreich des Traums Die Herrschaft unbestritten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '457'
- id: WSI.71.2
  kind: p
  original: Hier üben wir die Hegemonie Hier sind wir unzerstückelt; Die andern Völker haben sich Auf platter Erde entwickelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '457'
- id: WSI.72.1
  kind: p
  original: <Aus Heines "Deutschland, ein Wintermärchen, Kaput VII.>
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '457'
- id: WSI.73.1
  kind: p
  original: Dieses Luftreich des Traums, das Reich des "Wesens des Menschen", halten die Deutschen den andern Völkern mit gewaltigem Selbstgefühl als die Vollendung und den Zweck der ganzen Weltgeschichte entgegen; auf jedem Felde betrachten sie ihre Träumereien als schließliches Endurteil über die Taten der andern Nationen, und weil sie überall nur das Zusehen und Nachsehen haben, glauben sie berufen zu sein, über alle Welt zu Gericht zu sitzen und die ganze Geschichte in Deutschland ihr letztes Absehen erreichen zu lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 457-458
- id: WSI.73.2
  kind: p
  original: Daß dieser aufgeblasene und überschwengliche Nationalhochmut einer ganz kleinlichen, krämerhaften und handwerkermäßigen Praxis entspricht, haben wir bereits mehrere Male gesehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '458'
- id: WSI.73.3
  kind: p
  original: Wenn die nationale Borniertheit überall widerlich ist, so wird sie namentlich in Deutschland ekelhaft, weil sie hier mit der Illusion, über die Nationalität und über alle wirklichen Interessen erhaben zu sein, denjenigen Nationalitäten entgegengehalten wird, die ihre nationale Borniertheit und ihr Beruhen auf wirklichen Interessen offen eingestehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '458'
- id: WSI.73.4
  kind: p
  original: Übrigens findet sich unter allen Völkern das Beharren auf der Nationalität nur noch bei den Bourgeois und ihren Schriftstellern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '458'
- id: WSI.74.1
  kind: heading
  original: B) "Socialistische Bausteine" "Rhein[ische] Jahrb[ücher]" p. 155 seqq.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '458'
- id: WSI.75.1
  kind: p
  original: In diesem Aufsatze wird der Leser zunächst durch einen belletristisch-poetischen Prolog auf die schwereren Wahrheiten des wahren Sozialismus vorbereitet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '458'
- id: WSI.75.2
  kind: p
  original: Der Prolog beginnt damit, als "Endzweck alles Strebens, aller Bewegungen, der schweren und unermüdeten Anstrengungen vergangener Jahrtausende"... "das Glück" zu konstatieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '458'
- id: WSI.75.3
  kind: p
  original: 'Wir erhalten in einigen kurzen Zügen sozusagen eine Geschichte des Strebens nach Glück:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '458'
- id: WSI.76.1
  kind: p
  original: '"Als das Gebäude der alten Welt in Trümmer zerfiel, flüchtete sich das menschliche Herz mit seinen Wünschen hinüber in das Jenseits; dorthin übertrug es sein Glück." p. 156.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '458'
- id: WSI.77.1
  kind: p
  original: Daher alles Pech der irdischen Welt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '458'
- id: WSI.77.2
  kind: p
  original: 'In der neuesten Zeit hat der Mensch dem Jenseits den Abschied gegeben, und unser wahrer Sozialist fragt nun:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '458'
- id: WSI.78.1
  kind: p
  original: '"Vermag er die Erde wiederum als das Land seines Glücks zu begrüßen?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '458'
- id: WSI.78.2
  kind: p
  original: Hat er in ihr wieder seine ursprüngliche Heimat erkannt?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '458'
- id: WSI.78.3
  kind: p
  original: Warum trennt er dann noch länger Leben und Glück, warum hebt er die letzte Scheidewand nicht auf, welche das irdische Leben selbst noch immer in zwei feindliche Hälften spaltet?" (ibidem.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '458'
- id: WSI.79.1
  kind: p
  original: '"Land meiner seligsten Gefühle!" etc.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '458'
- id: WSI.80.1
  kind: p
  original: Er erläßt nun eine Einladung zu einem Spaziergange an " den Menschen", eine Einladung, die " der Mensch" mit Vergnügen akzeptiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '458'
- id: WSI.80.2
  kind: p
  original: '"Der Mensch" tritt in die "freie Natur" und entwickelt unter Anderm folgende Herzensergießungen eines wahren Sozialisten:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '458'
- id: WSI.81.1
  kind: p
  original: '".!. bunte Blumen... hohe und stolze Eichen... ihr Wachsen und Blühen, ihr Leben ist ihre Befriedigung, ihr Glück... eine unermeßliche Schar von kleinen Tieren auf den Wiesen...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '459'
- id: WSI.81.2
  kind: p
  original: Waldvögel... mutige Schar junger Rosse... ich sehe" (spricht "der Mensch"), "daß diese Tiere kein anderes Glück kennen noch begehren als dasjenige, welches für sie in der Äußerung und im Genusse ihres Lebens liegt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '459'
- id: WSI.81.3
  kind: p
  original: Wenn die Nacht herabsinkt, begegnet dem Blick meines Auges eine unzählbare Schar von Welten, welche nach ewigen Gesetzen im unendlichen Raum kreisend sich umschwingen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '459'
- id: WSI.81.4
  kind: p
  original: In diesen Schwingungen sehe ich eine Einheit von Leben, Bewegung und Glück." p. 157.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '459'
- id: WSI.82.1
  kind: p
  original: '"Der Mensch" konnte noch eine Masse andrer Dinge in der Natur sehen, z.B. die größte Konkurrenz unter Pflanzen und Tieren, wie z.B. im Pflanzenreich, in seinem "Walde von hohen und stolzen Eichen" diese hohen und stolzen Kapitalisten dem kleinen Gebüsch die Lebensmittel verkümmern und dies ebenfalls ausrufen könnte: terra, aqua, aere et igni interdicti sumus <von Erde, Wasser, Luft und Feuer sind wir ausgeschlossen worden>; er konnte die Schmarotzerpflanzen, die Ideologen der Vegetation, sehen, ferner einen offenen Krieg zwischen den "Waldvögeln" und der "unermeßlichen Schar kleiner Tiere", zwischen dem Grase seiner "Wiesen" und der "mutigen Schar junger Rosse".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '459'
- id: WSI.82.2
  kind: p
  original: Er konnte in des "unzählbaren Schar von Welten" eine ganze himmlische Feudalmonarchie mit Hintersassen und Inliegern sehen, von welchen letzteren einige, z.B. der Mond, eine sehr kümmerliche Existenz fristen, aere et aqua interdicti; ein Lehnswesen, in dem sogar die heimatlosen Vagabunden, die Kometen, eine ständische Gliederung erhalten haben, und in dem z.B. die zerschlagenen Asteroiden von zeitweiligen unangenehmen Auftritten zeugen, während die Meteorsteine, diese gefallnen Engel, sich verschämt durch "den unendlichen Raum" schleichen, bis sie irgendwo ein bescheidnes Unterkommen finden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '459'
- id: WSI.82.3
  kind: p
  original: Weiter hinaus würde er dann auf die reaktionären Fixsterne kommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '459'
- id: WSI.83.1
  kind: p
  original: '"Alle diese Wesen finden in der Übung und Äußerung aller ihrer Lebensfähigkeiten, mit denen sie von der Natur begabt sind, zugleich ihr Glück, die Befriedigung und den Genuß ihres Lebens."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '459'
- id: WSI.84.1
  kind: p
  original: D.h., in der gegenseitigen Einwirkung der Naturkörper aufeinander, in der Äußerung ihrer Kräfte findet "der Mensch", daß diese Naturkörper darin ihr Glück usw. finden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '459'
- id: WSI.85.1
  kind: p
  original: '"Der Mensch" erhält nunmehr von unsrem wahren Sozialisten einen Verweis wegen seiner Zwietracht:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '459'
- id: WSI.86.1
  kind: p
  original: '"Ist der Mensch nicht gleichfalls hervorgegangen aus der Urwelt, ein Geschöpf der Natur wie alle andern?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '459'
- id: WSI.86.2
  kind: p
  original: Ist er nicht aus denselben Stoffen gebildet, mit denselben allgemeinen Kräften und Eigenschaften begabt, welche alle Dinge beleben?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 459-460
- id: WSI.86.3
  kind: p
  original: Warum sucht er sein Glück auf der Erde noch immer in einem irdischen Jenseits?" p. 158.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '460'
- id: WSI.87.1
  kind: p
  original: '" Dieselben allgemeinen Kräfte und Eigenschaften", die der Mensch mit " allen Dingen" gemein hat, sind Kohäsion, Undurchdringlichkeit, Volumen, Schwere usw., die man auf der ersten Seite jedes Lehrbuchs der Physik ausführlich verzeichnet findet.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '460'
- id: WSI.87.2
  kind: p
  original: Wie hieraus ein Grund gezogen werden kann, warum der Mensch nicht "sein Glück in einem irdischen Jenseits suchen" sollte, ist schlechterdings nicht abzusehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '460'
- id: WSI.87.3
  kind: p
  original: 'Aber, ermahnt er den Menschen:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '460'
- id: WSI.88.1
  kind: p
  original: '"Sehet die Lilien auf dem Felde."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '460'
- id: WSI.89.1
  kind: p
  original: Ja, sehet die Lilien auf dem Felde, wie sie von den Ziegen verspeist, von "dem Menschen" ins Knopfloch verpflanzt werden, wie sie unter den unkeuschen Liebkosungen der Viehmagd und des Eselstreibers zusammenknicken!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '460'
- id: WSI.90.1
  kind: p
  original: '"Sehet die Lilien auf dem Felde, sie arbeiten nicht, sie spinnen nicht, und euer himmlischer Vater ernähret sie doch."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '460'
- id: WSI.91.1
  kind: p
  original: Gehet hin und tut desgleichen!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '460'
- id: WSI.92.1
  kind: p
  original: Nachdem wir so die Einheit "des Menschen" mit "allen Dingen" erfahren haben, erfahren wir nun seinen Unterschied von "allen Dingen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '460'
- id: WSI.93.1
  kind: p
  original: '"Aber der Mensch erkennt sich, besitzt das Bewußtsein seiner selbst.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '460'
- id: WSI.93.2
  kind: p
  original: Während in den andern Wesen die Triebe und Kräfte der Natur einzeln und unbewußt zur Erscheinung kommen, vereinigen sie sich im Menschen und gelangen in ihm zum Bewußtsein... seine Natur ist der Spiegel der ganzen Natur, welche sich in ihm erkennt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '460'
- id: WSI.93.3
  kind: p
  original: Wohlan!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '460'
- id: WSI.93.4
  kind: p
  original: Erkennt sich die Natur in mir, so erkenne ich in der Natur mich selbst, in ihrem Leben mein eignes Leben [...] So leben auch wir aus, was die Natur in uns hineingelegt hat." p. 158.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '460'
- id: WSI.94.1
  kind: p
  original: Dieser ganze Prolog ist ein Muster naiver philosophischer Mystifikation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '460'
- id: WSI.94.2
  kind: p
  original: Der wahre Sozialist geht von dem Gedanken aus, daß der Zwiespalt von Leben und Glück aufhören müsse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '460'
- id: WSI.94.3
  kind: p
  original: Um für diesen Satz einen Beweis zu finden, nimmt er die Natur zu Hülfe und unterstellt, daß in ihr dieser Zwiespalt nicht existiere, und hieraus schließt er, daß, da der Mensch ebenfalls ein Naturkörper sei und die allgemeinen Eigenschaften des Körpers besitze, für ihn dieser Zwiespalt ebenfalls nicht existieren dürfe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '460'
- id: WSI.94.4
  kind: p
  original: Mit viel größerem Rechte konnte Hobbes sein bellum omnium contra omnes <[seinen] Kampf aller gegen alle> aus der Natur beweisen und Hegel, auf dessen Konstruktion unser wahrer Sozialist fußt, in der Natur den Zwiespalt, die liederliche Periode der absoluten Idee erblicken und das Tier sogar die konkrete Angst Gottes nennen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '460'
- id: WSI.94.5
  kind: p
  original: Nachdem unser wahrer Sozialist die Natur so mystifiziert hat, mystifiziert er das menschliche Bewußtsein, indem er es zum "Spiegel" der so mystifizierten Natur macht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 460-461
- id: WSI.94.6
  kind: p
  original: Natürlich, sobald die Äußerung des Bewußtseins den Gedankenausdruck eines frommen Wunsches über menschliche Verhältnisse der Natur untergeschoben, versteht es sich von selbst, daß das Bewußtsein nur der Spiegel ist, in dem die Natur sich selbst beschaut.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '461'
- id: WSI.94.7
  kind: p
  original: Wie oben aus der Qualität des Menschen als bloßer Naturkörper, so hier aus seiner Qualität als bloßer passiver Spiegel, in dem die Natur zum Bewußtsein kommt, wird bewiesen, daß "der Mensch" den in der Natur als nicht existierend unterstellten Zwiespalt ebenfalls in seiner Sphäre aufzuheben habe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '461'
- id: WSI.94.8
  kind: p
  original: Doch sehen wir uns den letzten Satz, in dem sich der ganze Unsinn zusammenfaßt, näher an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '461'
- id: WSI.95.1
  kind: p
  original: Der Mensch besitzt Selbstbewußtsein, erstes Faktum, was ausgesagt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '461'
- id: WSI.95.2
  kind: p
  original: Die Triebe und Kräfte der einzelnen Naturwesen werden verwandelt in die Triebe und Kräfte " der Natur", die dann natürlich in diesen einzelnen Wesen vereinzelt "zur Erscheinung kommen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '461'
- id: WSI.95.3
  kind: p
  original: Diese Mystifikation war nötig, um nachher die Vereinigung dieser Triebe und Kräfte " der Natur" im menschlichen Selbstbewußtsein hervorzubringen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '461'
- id: WSI.95.4
  kind: p
  original: Hiermit wird dann auch ganz selbstredend das Selbstbewußtsein des Menschen verwandelt in das Selbstbewußtsein der Natur in ihm.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '461'
- id: WSI.95.5
  kind: p
  original: Diese Mystifikation wird dadurch scheinbar wieder aufgelöst, daß der Mensch an der Natur Revanche nimmt und dafür, daß die Natur in ihm ihr Selbstbewußtsein findet, er nun in ihr das seinige sucht - eine Prozedur, wobei er natürlich nichts in ihr findet, als was er durch die oben beschriebne Mystifikation in sie hineingelegt hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '461'
- id: WSI.96.1
  kind: p
  original: Er ist jetzt glücklich wieder dabei angekommen, wovon er im Anfange ausging, und dies Herumdrehen auf dem Absatz nennt man neuerdings in Deutschland...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '461'
- id: WSI.96.2
  kind: p
  original: Entwicklung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '461'
- id: WSI.97.1
  kind: p
  original: Nach diesem Prologe kommt die eigentliche Entwicklung des wahren Sozialismus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '461'
- id: WSI.98.1
  kind: heading
  original: Erster Baustein
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '461'
- id: WSI.99.1
  kind: p
  original: p. 160.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '461'
- id: WSI.99.2
  kind: p
  original: '"Saint-Simon sagte auf seinem Totenbett zu seinen Schülern: Mein ganzes Leben faßt sich in Einen Gedanken zusammen: allen Menschen die freieste Entwicklung ihrer natürlichen Anlagen zu sichern.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '461'
- id: WSI.99.3
  kind: p
  original: Saint-Simon war ein Verkündiger des Sozialismus."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '461'
- id: WSI.100.1
  kind: p
  original: Dieser Satz wird nach der oben geschilderten Methode der wahren Sozialisten und in Verbindung mit der Naturmystifikation des Prologs verarbeitet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '461'
- id: WSI.101.1
  kind: p
  original: '"Die Natur als Grundlage alles Lebens ist eine aus sich selbst hervorgehende und auf sich selbst zurückgehende Einheit, welche alle die unzähligen Mannigfaltigkeiten ihrer Erscheinungen umfaßt und außer welcher Nichts ist." p. 158.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '462'
- id: WSI.102.1
  kind: p
  original: Wir haben gesehen, wie man es anfängt, die verschiedenen Naturkörper und ihre gegenseitigen Verhältnisse in mannigfaltige "Erscheinungen" des geheimen Wesens dieser mysteriösen "Einheit" zu verwandeln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '462'
- id: WSI.102.2
  kind: p
  original: Neu ist in diesem Satze nur, daß die Natur einmal "die Grundlage alles Lebens" heißt und gleich darauf gesagt wird, daß "außer ihr Nichts ist", wonach sie "das Leben" ebenfalls umschließt und nicht seine bloße Grundlage sein kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '462'
- id: WSI.103.1
  kind: p
  original: 'Auf diese Donnerworte folgt das Pivot <der Angelpunkt> des ganzen Aufsatzes:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '462'
- id: WSI.104.1
  kind: p
  original: '"Jede dieser Erscheinungen, jedes Einzelleben besteht und entwickelt sich nur durch seinen Gegensatz, seinen Kampf mit der Außenwelt, beruht nur auf seiner Wechselwirkung mit dem Gesamtleben, mit dem es wiederum durch seine Natur zu einem Ganzen, zur organischen Einheit des Universums verknüpft ist." p. 158, 159.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '462'
- id: WSI.105.1
  kind: p
  original: 'Dieser Pivotalsatz wird folgendermaßen näher erläutert:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '462'
- id: WSI.106.1
  kind: p
  original: '"Das Einzelleben findet einerseits seine Grundlage, seine Quelle und Nahrung in dem Gesamtleben, andererseits sucht das Gesamtleben das Einzelleben in stetem Kampf zu verzehren und in sich aufzulösen." p. 159.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '462'
- id: WSI.107.1
  kind: p
  original: 'Nachdem dieser Satz so von allem Einzelleben ausgesagt ist, kann er "demnach" auch auf den Menschen angewandt werden, wie dies auch wirklich geschieht:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '462'
- id: WSI.108.1
  kind: p
  original: '"Der Mensch kann sich demnach nur in und durch das Gesamtleben entfalten."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '462'
- id: WSI.108.2
  kind: p
  original: (Nr. II) ibid.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '462'
- id: WSI.109.1
  kind: p
  original: 'Nun wird dem unbewußten Einzelleben das bewußte, dem allgemeinen Naturleben die menschliche Gesellschaft gegenübergestellt und dann der letztzitierte Satz unter folgender Form wiederholt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '462'
- id: WSI.110.1
  kind: p
  original: '"Ich kann meiner Natur nach nur in und durch die Gemeinschaft mit andern Menschen zur Entwicklung, zum selbstbewußten Genusse meines Lebens gelangen, meines Glückes teilhaftig werden."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '462'
- id: WSI.110.2
  kind: p
  original: (Nr. II) ibid.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '462'
- id: WSI.111.1
  kind: p
  original: 'Diese Entwicklung des einzelnen Menschen in der Gesellschaft wird, wie oben beim "Einzelleben" überhaupt, weiter ausgeführt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '462'
- id: WSI.112.1
  kind: p
  original: '"Der Gegensatz des einzelnen zum allgemeinen Leben wird auch in der Gesellschaft die Bedingung zur bewußten menschlichen Entwicklung.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '462'
- id: WSI.112.2
  kind: p
  original: Ich entwickle mich im steten Kampfe, in steter Gegenwirkung gegen die Gesellschaft, die mir als beschränkende Macht gegenübersteht, zur Selbstbestimmung, zur Freiheit, ohne welche kein Glück ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 462-463
- id: WSI.112.3
  kind: p
  original: Mein Leben ist eine fortwährende Befreiung, ein fortwährender Streit und Sieg über die bewußte und unbewußte Außenwelt, um sie mir zu unterwerfen und sie zum Genusse meines Lebens zu verbrauchen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.112.4
  kind: p
  original: Der Trieb der Selbsterhaltung, das Streben nach eignem Glück, Freiheit, Befriedigung sind also natürliche, d.h. vernünftige Lebensäußerungen." (ibid.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.113.1
  kind: p
  original: Weiter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.114.1
  kind: p
  original: '"Ich verlange demnach von der Gesellschaft, daß sie mir die Möglichkeit gewährt. von ihr meine Befriedigung, mein Glück zu erkämpfen, daß sie meiner Kampfeslust ein Schlachtfeld eröffne.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.114.2
  kind: p
  original: '- Wie die einzelne Pflanze Boden, Wärme, Sonne, Luft und Regen verlangt, um zu wachsen, ihre Blätter, Blüten und Früchte zu tragen, so will auch der Mensch in der Gesellschaft die Bedingungen für die allseitige Ausbildung und Befriedigung aller seiner Bedürfnisse, Neigungen und Anlagen finden.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.114.3
  kind: p
  original: Sie soll ihm die Möglichkeit zur Erringung seines Glücks bieten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.114.4
  kind: p
  original: Wie er sie benutzen, was er aus sich, aus seinem Leben machen wird, das hängt von ihm, von seiner Eigenheit ab.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.114.5
  kind: p
  original: Über mein Glück kann Niemand als ich selbst bestimmen." p. 159, 160.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.115.1
  kind: p
  original: Folgt nun der von uns am Anfange dieses Bausteins zitierte Satz Saint-Simons als Schlußresultat der ganzen Auseinandersetzung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.115.2
  kind: p
  original: Der französische Einfall ist somit durch die deutsche Wissenschaft begründet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.115.3
  kind: p
  original: Worin besteht diese Begründung?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.116.1
  kind: p
  original: Der Natur waren bereits oben einige Ideen untergeschoben, die der wahre Sozialist in der menschlichen Gesellschaft realisiert zu sehen wünscht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.116.2
  kind: p
  original: Wie früher der einzelne Mensch, so ist jetzt die ganze Gesellschaft der Spiegel der Natur.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.116.3
  kind: p
  original: Von den der Natur untergeschobenen Vorstellungen kann jetzt ein weiterer Schluß auf die menschliche Gesellschaft gezogen werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.116.4
  kind: p
  original: Da der Verfasser sich nicht auf die historische Entwicklung der Gesellschaft einläßt und sich bei dieser dürren Analogie beruhigt, so ist nicht abzusehen, weshalb sie nicht zu allen Zeiten ein getreues Abbild der Natur gewesen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.116.5
  kind: p
  original: Die Phrasen über die Gesellschaft, die den Einzelnen als beschränkende Macht gegenüber tritt usw., passen daher auch auf alle Gesellschaftsformen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.116.6
  kind: p
  original: Daß bei dieser Konstruktion der Gesellschaft einige Inkonsequenzen sich einschleichen, ist natürlich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.116.7
  kind: p
  original: So muß hier im Gegensatz zur Harmonie des Prologs ein Kampf in der Natur anerkannt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.116.8
  kind: p
  original: Die Gesellschaft, das "Gesamtleben", faßt unser Verfasser nicht als die Wechselwirkung der sie zusammensetzenden "Einzelleben", sondern als eine besondre Existenz, die mit diesen "Einzelleben" noch in eine aparte Wechselwirkung tritt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.116.9
  kind: p
  original: Wenn hier irgendeine Beziehung auf wirkliche Verhältnisse zugrunde liegt, so ist es die Illusion von der Selbständigkeit des Staates gegenüber dem Privatleben und der Glaube an diese scheinbare Selbständigkeit als an etwas Absolutes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '463'
- id: WSI.116.10
  kind: p
  original: Übrigens handelt es sich hier ebensowenig wie im ganzen Aufsatze von Natur und Gesellschaft, sondern bloß von den beiden Kategorien Einzelnheit und Allgemeinheit, denen verschiedene Namen gegeben werden und von welchen gesagt wird, daß sie einen Gegensatz bilden, dessen Versöhnung höchst wünschenswert sei.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 463-464
- id: WSI.117.1
  kind: p
  original: Aus der Berechtigung des "Einzellebens" gegen das "Gesamtleben" folgt, daß die Befriedigung der Bedürfnisse, die Entwicklung der Anlagen, die Selbstliebe pp. "natürliche, vernünftige Lebensäußerungen" sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '464'
- id: WSI.117.2
  kind: p
  original: Aus der Auffassung der Gesellschaft als Spiegelbild der Natur folgt, daß in allen bisherigen Gesellschaftsformen, die gegenwärtige eingeschlossen, diese Lebensäußerungen zu ihrer vollständigen Entwicklung kamen und in ihrer Berechtigung anerkannt wurden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '464'
- id: WSI.118.1
  kind: p
  original: Plötzlich erfahren wir p. 159, daß "in unsrer heutigen Gesellschaft" diese vernünftigen, natürlichen Lebensäußerungen dennoch so oft unterdrückt werden" und "gewöhnlich nur deshalb in Unnatur, Verbildung, Egoismus, Laster pp. ausarten".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '464'
- id: WSI.119.1
  kind: p
  original: Da also dennoch die Gesellschaft nicht der Natur, ihrem Urbilde, entspricht, so "verlangt" der wahre Sozialist von ihr, daß sie sich naturgemäß einrichte, und beweist sein Recht zu diesem Postulat durch das unglückliche Beispiel von der Pflanze.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '464'
- id: WSI.119.2
  kind: p
  original: Erstens "verlangt" nicht die Pflanze von der Natur alle die oben aufgezählten Existenzbedingungen, sondern sie wird gar nicht Pflanze, sie bleibt Samenkorn, wenn sie sie nicht findet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '464'
- id: WSI.119.3
  kind: p
  original: Dann hängt die Beschaffenheit der "Blätter, Blüten und Früchte" sehr von dem "Boden", der "Wärme" pp., von den klimatischen und geologischen Verhältnissen ab, unter denen sie wächst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '464'
- id: WSI.119.4
  kind: p
  original: Während also das der Pflanze untergeschobene "Verlangen" sich in eine vollständige Abhängigkeit von den vorliegenden Existenzbedingungen auflöst, soll ebendies Verlangen unsren wahren Sozialisten berechtigen, eine Einrichtung der Gesellschaft nach seiner individuellen "Eigenheit" zu verlangen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '464'
- id: WSI.119.5
  kind: p
  original: Das Postulat der wahren sozialistischen Gesellschaft begründet sich auf das eingebildete Postulat einer Kokospalme an "das Gesamtleben", ihr am Nordpol "Boden, Wärme, Sonne, Luft und Regen" zu verschaffen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '464'
- id: WSI.120.1
  kind: p
  original: Aus dem angeblichen Verhältnis der metaphysischen Personen Einzelnheit und Allgemeinheit, nicht aus der wirklichen Entwicklung der Gesellschaft, wird das obige Postulat des Einzelnen an die Gesellschaft deduziert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '464'
- id: WSI.120.2
  kind: p
  original: Hierzu braucht man nur die einzelnen Individuen als Repräsentanten, Verkörperungen der Einzelnheit, und die Gesellschaft als Verkörperung der Allgemeinheit zu interpretieren, und das ganze Kunststück ist fertig.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '464'
- id: WSI.120.3
  kind: p
  original: Zugleich ist hierdurch der saint-simonistische Satz von der freien Entwicklung der Anlagen auf seinen richtigen Ausdruck und seine wahre Begründung zurückgeführt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '464'
- id: WSI.121.1
  kind: p
  original: Dieser richtige Ausdruck besteht in dem Unsinn, daß die Individuen, die die Gesellschaft bilden, ihre "Eigenheit" bewahren, daß sie bleiben wollen, wie sie sind, während sie von der Gesellschaft eine Veränderung verlangen, die bloß aus ihrer eignen Veränderung hervorgehen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '465'
- id: WSI.122.1
  kind: heading
  original: Zweiter Baustein
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '465'
