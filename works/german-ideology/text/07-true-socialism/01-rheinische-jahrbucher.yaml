- id: WSI.147.1
  kind: p
  original: Mit dieser Kaleidoskopie nicht zufrieden, wiederholt unser Verfasser seine einfachen Sätze über Einzelnheit und Allgemeinheit auch noch auf andre Weise.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '466'
- id: WSI.147.2
  kind: p
  original: Zuerst stellt er diese paar dürren Abstraktionen als absolute Prinzipien auf und schließt daraus, daß in der Wirklichkeit dasselbe Verhältnis wiederkehren müsse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '466'
- id: WSI.147.3
  kind: p
  original: Dies gibt schon Gelegenheit, unter dem Schein der Deduktion alles zweimal zu sagen, in abstrakter und als Schluß daraus in scheinbar konkreter Form.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '466'
- id: WSI.147.4
  kind: p
  original: Dann aber wechselt er mit den konkreten Namen, die er seinen beiden Kategorien gibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '466'
- id: WSI.147.5
  kind: p
  original: Die Allgemeinheit tritt so nach der Reihe als Natur, unbewußtes Gesamtleben, bewußtes ditto, allgemeines Leben, Weltorganismus, zusammenfassende Einheit, menschliche Gesellschaft, Gemeinschaft, organische Einheit des Universums, allgemeines Glück, Gesamtwohl pp., und die Einzelnheit unter den entsprechenden Namen unbewußtes und bewußtes Einzelleben, Glück des Einzelnen, eignes Wohl pp. auf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '466'
- id: WSI.147.6
  kind: p
  original: Bei jedem dieser Namen müssen wir dieselben Phrasen wieder anhören, die über Einzelnheit und Allgemeinheit schon oft genug gesagt sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '466'
- id: WSI.148.1
  kind: p
  original: Der zweite Baustein enthält also nichts, als was der erste schon enthielt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '466'
- id: WSI.148.2
  kind: p
  original: Da sich aber bei den französischen Sozialisten die Worte égalité, solidarité, unité des intérêts < Gleichheit, Solidarität, Einheit der Interessen > vorfinden, so sucht unser Verfasser sie durch Verdeutschung zu "Bausteinen" des wahren Sozialismus zuzuhauen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '466'
- id: WSI.149.1
  kind: p
  original: '"Als bewußtes Mitglied der Gesellschaft erkenne ich jedes andre Mitglied als ein von mir verschiedenes, mir gegenüberstehendes, zugleich aber wieder als ein auf dem gemeinschaftlichen Urgrunde des Seins ruhendes und von ihm ausgehendes, mir gleiches Wesen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '467'
- id: WSI.149.2
  kind: p
  original: Ich erkenne jeden Mitmenschen durch seine besondre Natur als mir entgegengesetzt und durch seine allgemeine Natur als mir gleich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '467'
- id: WSI.149.3
  kind: p
  original: 'Die Anerkennung der menschlichen Gleichheit, der Berechtigung eines Jeden zum Leben, beruht demnach auf dem Bewußtsein der gemeinschaftlichen. allen gemeinsamen menschlichen Natur: Liebe, Freundschaft, Gerechtigkeit und alle gesellschaftlichen Tugenden beruhen gleichfalls auf dem Gefühle der natürlichen menschlichen Zusammengehörigkeit und Einheit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '467'
- id: WSI.149.4
  kind: p
  original: Hat man sie bisher als Pflichten bezeichnet und auferlegt, so werden sie in einer Gesellschaft, welche nicht auf äußern Zwang, sondern auf das Bewußtsein der inneren menschlichen Natur, d.h. die Vernunft, gegründet ist, zu freien, naturgemäßen Äußerungen des Lebens werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '467'
- id: WSI.149.5
  kind: p
  original: In der natur-, d.h. vernunftgemäßen Gesellschaft müssen daher die Bedingungen des Lebens für alle Mitglieder gleich, d.h. allgemein sein." p. 161. 162.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '467'
- id: WSI.150.1
  kind: p
  original: Der Verfasser besitzt ein großes Talent, zuerst einen Satz assertorisch aufzustellen und ihn dann durch ein Daher, Dennoch pp. als Konsequenz aus sich selbst zu legitimieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '467'
- id: WSI.150.2
  kind: p
  original: Ebenso versteht er es, mitten in diese merkwürdige Art der Deduktion traditionell gewordene sozialistische Sätze durch ein "Hat", "Ist" - "so müssen", "so wird" usw. erzählend einzuschmuggeln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '467'
- id: WSI.151.1
  kind: p
  original: In dem ersten Baustein hatten wir auf der einen Seite den Einzelnen und auf der andern das Allgemeine, gegenüber den Einzelnen, als Gesellschaft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '467'
- id: WSI.151.2
  kind: p
  original: Hier kehrt der Gegensatz in der Form wieder, daß der Einzelne in sich selbst in eine besondre und eine allgemeine Natur gespalten wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '467'
- id: WSI.151.3
  kind: p
  original: Aus der allgemeinen Natur wird dann auf die "menschliche Gleichheit" und die Gemeinschaftlichkeit geschlossen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '467'
- id: WSI.151.4
  kind: p
  original: Die den Menschen gemeinschaftlichen Verhältnisse erscheinen hier also als Produkt des "Wesens des Menschen", der Natur, während sie ebensogut wie das Bewußtsein der Gleichheit historische Produkte sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '467'
- id: WSI.151.5
  kind: p
  original: Damit noch nicht zufrieden, begründet der Verfasser die Gleichheit durch ihr allerseitiges Beruhen "auf dem gemeinschaftlichen Urgrunde des Seins".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '467'
- id: WSI.151.6
  kind: p
  original: Im Prolog erfuhren wir p.158, daß der Mensch "aus denselben Stoffen gebildet, mit denselben allgemeinen Kräften und Eigenschaften begabt ist, welche alle Dinge beleben".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '467'
- id: WSI.151.7
  kind: p
  original: Im ersten Baustein erfuhren wir, daß die Natur die "Grundlage alles Lebens" ist, also "der gemeinschaftliche Urgrund des Seins".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '467'
- id: WSI.151.8
  kind: p
  original: Der Verfasser ist also weit über die Franzosen hinausgegangen, indem er "als bewußtes Mitglied der Gesellschaft" nicht nur die Gleichheit der Menschen unter sich, sondern auch ihre Gleichheit mit jedem Floh, jedem Strohwisch, jedem Stein bewiesen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '467'
- id: WSI.152.1
  kind: p
  original: Wir wollen gerne glauben, daß "alle gesellschaftlichen Tugenden" unsres wahren Sozialisten "auf dem Gefühl der natürlichen menschlichen Zusammengehörigkeit und Einheit" beruhen, obwohl auf dieser "natürlichen Zusammengehörigkeit" auch die Feudalhörigkeit, die Sklaverei und alle gesellschaftlichen Ungleichheiten aller Epochen beruhen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 467-468
- id: WSI.152.2
  kind: p
  original: Nebenbei bemerkt, ist diese "natürliche menschliche Zusammengehörigkeit" ein täglich von den Menschen umgestaltetes historisches Produkt, das immer sehr natürlich war, so unmenschlich und widernatürlich es nicht nur vor dem Richterstuhl " des Menschen", sondern auch einer nachfolgenden revolutionären Generation erscheinen mag.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '468'
- id: WSI.153.1
  kind: p
  original: Zufällig erfahren wir noch, daß die jetzige Gesellschaft "auf äußerm Zwang" beruht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '468'
- id: WSI.153.2
  kind: p
  original: Nicht die beschränkenden materiellen Lebensbedingungen gegebner Individuen stellen sich die wahren Sozialisten unter "äußerm Zwang" vor, sondern nur den Staatszwang, Bajonette, Polizei, Kanonen, welche, weit entfernt, die Grundlage der Gesellschaft zu sein, nur eine Konsequenz ihrer eignen Gliederung sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '468'
- id: WSI.153.3
  kind: p
  original: Es ist dies bereits in der "Heiligen Familie" und jetzt wieder im ersten Bande dieser Publikation auseinandergesetzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '468'
- id: WSI.154.1
  kind: p
  original: Gegenüber der jetzigen, "auf äußerm Zwang beruhenden" Gesellschaft stellt der Sozialist das Ideal der wahren Gesellschaft auf, die auf dem "Bewußtsein der Innern menschlichen Natur, d.h. der Vernunft" beruht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '468'
- id: WSI.154.2
  kind: p
  original: Also auf dem Bewußtsein des Bewußtseins, dem Denken des Denkens.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '468'
- id: WSI.154.3
  kind: p
  original: Der wahre Sozialist unterscheidet sich nicht einmal im Ausdruck mehr von den Philosophen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '468'
- id: WSI.154.4
  kind: p
  original: Er vergißt, daß sowohl die "innere Natur" der Menschen wie ihr "Bewußtsein" darüber, "d.h." ihre "Vernunft", zu allen Zeiten ein historisches Produkt war, und daß, selbst wenn ihre Gesellschaft, wie er meint, "auf äußerm Zwang" beruhte, ihre "innere Natur" diesem "äußern Zwang" entsprach.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '468'
- id: WSI.155.1
  kind: p
  original: Folgen p. 163 die Einzelnheit und Allgemeinheit mit gewohntem Gefolge in der Gestalt des einzelnen Wohls und des Gesamtwohls.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '468'
- id: WSI.155.2
  kind: p
  original: Ähnliche Erklärungen über das Verhältnis beider findet man in jedem Handbuch der Nationalökonomie bei Gelegenheit der Konkurrenz, und u.a. auch, nur besser ausgedrückt, bei Hegel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '468'
- id: WSI.156.1
  kind: p
  original: 'Z.B. "Rhein[ische] Jahrb[ücher]" p. 163:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '468'
- id: WSI.157.1
  kind: p
  original: '"Indem ich das Gesamtwohl fördere, fördere ich mein eignes Wohl, und indem ich mein eignes Wohl fördere, das Gesamtwohl."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '468'
- id: WSI.158.1
  kind: p
  original: 'Hegels "Rechtsphilosophie", p. 248 (1833):'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '468'
- id: WSI.159.1
  kind: p
  original: '"Meinen Zweck befördernd, fördere ich das Allgemeine, und dieses befördert wiederum meinen Zweck."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '468'
- id: WSI.160.1
  kind: p
  original: Vgl. auch "Rechtsphil[osophie]", p. 323 seqq. über das Verhältnis des Staatsbürgers zum Staat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.161.1
  kind: p
  original: Als letztes Ergebnis erscheint daher die bewußte Einheit des Einzellebens mit dem Gesamtleben, die Harmonie." (p. 163, "Rh[einische] J[ahrbücher]".)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.162.1
  kind: p
  original: '"Als letztes Ergebnis" nämlich daraus, daß'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.163.1
  kind: p
  original: '"dieses polare Verhältnis zwischen dem einzelnen und allgemeinen Leben darin besteht, daß sich einmal Beide bekämpfen und feindlich gegenüberstehen, das andre Mal, daß sich Beide gegenseitig bedingen und begründen."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.164.1
  kind: p
  original: '"Als letztes Ergebnis" folgt hieraus höchstens die Harmonie der Disharmonie mit der Harmonie, und aus der ganzen abermaligen Repetition der bekannten Phrasen folgt nur der Glaube des Verfassers, daß sein vergebliches Abquälen mit den Kategorien der Einzelnheit und Allgemeinheit die wahre Form sei, in der die gesellschaftlichen Fragen zu lösen seien.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.165.1
  kind: p
  original: 'Der Verfasser schließt mit folgendem Tusch:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.166.1
  kind: p
  original: '" Die organische Gesellschaft hat zur Grundlage die allgemeine Gleichheit und entwickelt sich durch die Gegensätze der Einzelnen gegen das Allgemeine zum freien Einklange, zur Einheit des einzelnen mit dem allgemeinen Glücke, zur sozialen " (!)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.166.2
  kind: p
  original: '" gesellschaftlichen " (!!)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.166.3
  kind: p
  original: '" Harmonie, dem Spiegelbilde der universellen Harmonie." p. 164.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.167.1
  kind: p
  original: Nur die Bescheidenheit kann diesen Satz einen "Baustein" nennen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.167.2
  kind: p
  original: Er ist ein ganzer Urfels des wahren Sozialismus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.168.1
  kind: heading
  original: Dritter Baustein
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.169.1
  kind: p
  original: '"Auf dem polaren Gegensatz, der Wechselwirkung meines besondern Lebens mit dem allgemeinen Naturleben, beruht der Kampf des Menschen mit der Natur.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.169.2
  kind: p
  original: Wenn dieser Kampf als bewußte Tätigkeit erscheint, heißt er Arbeit." p. 164.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.170.1
  kind: p
  original: Sollte nicht umgekehrt die Vorstellung von dem "polaren Gegensatz" auf der Beobachtung eines Kampfes der Menschen mit der Natur beruhen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.170.2
  kind: p
  original: Erst wird eine Abstraktion aus einem Faktum gezogen; dann erklärt, daß dies Faktum auf dieser Abstraktion beruhe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.170.3
  kind: p
  original: Wohlfeilste Methode, deutsch-tief und spekulativ zu erscheinen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.171.1
  kind: p
  original: 'Z.B.: Faktum: Die Katze frißt die Maus.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.172.1
  kind: p
  original: 'Reflexion: Katze - Natur, Maus - Natur, Verzehren der Maus durch die Katze = Verzehren der Natur durch die Natur = Selbstverzehren der Natur.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '469'
- id: WSI.173.1
  kind: p
  original: 'Philosophische Darstellung des Faktums: Auf dem Selbstverzehren der Natur beruht das Gefressenwerden der Maus von der Katze.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '470'
- id: WSI.174.1
  kind: p
  original: Nachdem also auf diese Weise der Kampf des Menschen mit der Natur mystifiziert ist, wird die bewußte Tätigkeit des Menschen in Beziehung auf die Natur mystifiziert, indem sie als Erscheinung dieser bloßen Abstraktion wirklicher Kämpfe gefaßt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '470'
- id: WSI.174.2
  kind: p
  original: Schließlich wird dann das profane Wort Arbeit als Resultat dieser Mystifikation hereingeschmuggelt, ein Wort, das unser wahrer Sozialist von Anfang an auf der Zunge hatte, aber erst nach gehöriger Legitimierung auszusprechen wagte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '470'
- id: WSI.174.3
  kind: p
  original: Die Arbeit wird aus der bloßen, abstrakten Vorstellung des Menschen und der Natur konstruiert und daher auch auf eine Weise bestimmt, die auf alle Entwicklungsstufen der Arbeit gleich gut paßt und nicht paßt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '470'
- id: WSI.175.1
  kind: p
  original: '"Die Arbeit ist demnach jede bewußte Tätigkeit des Menschen, wodurch er die Natur seiner Herrschaft in geistiger und materieller Beziehung zu unterwerfen strebt, um sie zum bewußten Genuß seines Lebens zu bringen, sie zu seiner geistigen oder körperlichen Befriedigung zu verwenden." (ibid.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '470'
- id: WSI.176.1
  kind: p
  original: 'Wir machen bloß auf die glänzende Schlußfolgerung aufmerksam:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '470'
- id: WSI.177.1
  kind: p
  original: '"Wenn dieser Kampf als bewußte Tätigkeit erscheint, heißt er Arbeit - die Arbeit ist demnach jede bewußte Tätigkeit des Menschen" usw.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '470'
- id: WSI.178.1
  kind: p
  original: Diese tiefe Einsicht verdanken wir dem "polaren Gegensatz".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '470'
- id: WSI.179.1
  kind: p
  original: Man rufe sich den obigen saint-simonistischen Satz von dem libre développement de toutes les facultés <[der] freien Entwicklung aller Fähigkeiten> ins Gedächtnis zurück.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '470'
- id: WSI.179.2
  kind: p
  original: Man erinnere sich zu gleicher Zeit, daß Fourier an die Stelle des heutigen travail répugnant <[der] abstoßenden Arbeit> den travail attrayant <[die] anziehende Arbeit> gesetzt sehen wollte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '470'
- id: WSI.179.3
  kind: p
  original: 'Dem "polaren Gegensatz" verdanken wir folgende philosophische Begründung und Explikation dieser Sätze:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '470'
- id: WSI.180.1
  kind: p
  original: '"Da aber " (dies Aber soll andeuten, daß hier kein Zusammenhang stattfindet) "das Leben in jeder Entfaltung, Übung und Äußerung seiner Kräfte und Fähigkeiten zu seinem Genusse, zu seiner Befriedigung kommen soll, so ergibt sich, daß die Arbeit selbst eine Entfaltung und Entwicklung menschlicher Anlagen sein und Genuß, Befriedigung und Glück gewähren soll.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '470'
- id: WSI.180.2
  kind: p
  original: Die Arbeit selbst muß mithin zu einer freien Äußerung des Lebens und dadurch zum Genuß werden." (ibid.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '470'
- id: WSI.181.1
  kind: p
  original: Hier wird gezeigt, was in der Vorrede der "Rh[einischen] Jahrb[ücher]" versprochen ist, nämlich "inwiefern die deutsche Gesellschaftswissenschaft in ihrer bisherigen Ausbildung sich von der französischen und englischen unterscheidet", und was das heißt, "die Lehre des Kommunismus wissenschaftlich darzustellen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 470-471
- id: WSI.182.1
  kind: p
  original: Es ist schwer, jeden logischen Lapsus in diesen wenigen Zeilen aufzudecken, ohne langweilig zu werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '471'
- id: WSI.182.2
  kind: p
  original: Zunächst die Schnitzer gegen die formelle Logik.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '471'
- id: WSI.183.1
  kind: p
  original: Um zu beweisen, daß die Arbeit, eine Äußerung des Lebens, Genuß bringen soll, wird unterstellt, daß das Leben in jeder Äußerung Genuß bringen soll, und hieraus geschlossen, daß das Leben dies auch in seiner Äußerung als Arbeit soll.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '471'
- id: WSI.183.2
  kind: p
  original: Mit dieser paraphrastischen Verwandlung eines Postulats in eine Konklusion nicht zufrieden, macht der Verfasser die Konklusion noch dazu falsch.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '471'
- id: WSI.183.3
  kind: p
  original: Daraus, daß "das Leben in jeder Entfaltung zum Genuß kommen soll", ergibt sich für ihn, daß die Arbeit, die eine dieser Entfaltungen des Lebens ist, "selbst eine Entfaltung und Entwicklung menschlicher Anlagen", also wieder des Lebens, "sein soll".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '471'
- id: WSI.183.4
  kind: p
  original: Sie soll also sein, was sie ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '471'
- id: WSI.183.5
  kind: p
  original: Wie hätte die Arbeit es anfangen sollen, um jemals nicht eine "Entfaltung menschlicher Anlagen" zu sein?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '471'
- id: WSI.183.6
  kind: p
  original: Damit nicht genug.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '471'
- id: WSI.183.7
  kind: p
  original: 'Weil die Arbeit dies sein soll, "muß" sie es "mithin" sein, oder noch besser: Weil sie eine "Entfaltung und Entwicklung menschlicher Anlagen sein soll", muß sie mithin ganz etwas Andres werden, nämlich "eine freie Äußerung des Lebens", wovon bisher noch gar nicht die Rede war.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '471'
- id: WSI.183.8
  kind: p
  original: Und während oben direkt von dem Postulat des Lebensgenusses auf das Postulat der Arbeit als Genuß geschlossen wurde, wird hier dies letztere Postulat als Konsequenz des neuen Postulats der "freien Äußerung des Lebens in der Arbeit" dargestellt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '471'
- id: WSI.184.1
  kind: p
  original: Was den Inhalt dieses Satzes angeht, so ist nicht abzusehen, warum die Arbeit nicht immer das war, was sie sein soll, und warum sie es jetzt werden muß, oder warum sie etwas werden soll, was sie bis dato nicht muß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '471'
- id: WSI.184.2
  kind: p
  original: Aber bisher war freilich nicht das Wesen des Menschen und der polare Gegensatz des Menschen und der Natur entwickelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '471'
- id: WSI.185.1
  kind: p
  original: 'Folgt eine "wissenschaftliche Begründung" des kommunistischen Satzes von dem gemeinschaftlichen Eigentum an den Produkten der Arbeit:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '471'
- id: WSI.186.1
  kind: p
  original: '"Das Produkt der Arbeit aber " (dies abermalige Aber hat denselben Sinn wie das obige) "muß zugleich dem Glücke des Einzelnen, Arbeitenden und dem allgemeinen Glücke dienen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '471'
- id: WSI.186.2
  kind: p
  original: Dies geschieht durch die Gegenseitigkeit, durch die gegenseitige Ergänzung aller gesellschaftlichen Tätigkeiten." (ibid.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '471'
- id: WSI.187.1
  kind: p
  original: Dieser Satz ist nichts als eine durch das Wort "Glück" schwankend gemachte Kopie dessen, was in jeder Ökonomie der Konkurrenz und Teilung der Arbeit nachgerühmt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '471'
- id: WSI.188.1
  kind: p
  original: 'Endlich philosophische Begründung der französischen Organisation der Arbeit:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '471'
- id: WSI.189.1
  kind: p
  original: '"Die Arbeit als eine genußreiche, Befriedigung gewährende und zugleich dem allgemeinen Wohle dienende freie Tätigkeit ist die Grundlage der Organisation der Arbeit." p. 165.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '472'
- id: WSI.190.1
  kind: p
  original: Da die Arbeit erst "eine genußreiche pp. freie Tätigkeit" werden soll und muß, es also noch nicht ist, so wäre eher zu erwarten, daß die Organisation der Arbeit umgekehrt die Grundlage der "Arbeit als einer genußreichen Tätigkeit" ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '472'
- id: WSI.190.2
  kind: p
  original: Aber der Begriff der Arbeit als dieser Tätigkeit reicht vollständig hin.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '472'
- id: WSI.191.1
  kind: p
  original: Der Verfasser glaubt am Schlusse seines Aufsatzes zu "Resultaten" gekommen zu sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '472'
- id: WSI.192.1
  kind: p
