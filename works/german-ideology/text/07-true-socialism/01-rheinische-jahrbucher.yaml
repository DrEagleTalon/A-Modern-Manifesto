  kind: p
  original: '"Und wer das Lied nicht weiter kann, Der fang'' es wieder von vornen an."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '465'
- id: WSI.124.1
  kind: p
  original: '"Die unendliche Mannigfaltigkeit aller Einzel- Wesen als Einheit zusammengefaßt ist der Weltorganismus". (p. 160.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '465'
- id: WSI.125.1
  kind: p
  original: Also zurück an den Anfang des Aufsatzes sind wir geschleudert und erleben die ganze Komödie vom Einzelleben und Gesamtleben zum andern Mal.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '465'
- id: WSI.125.2
  kind: p
  original: Wiederum enthüllt sich uns das tiefe Geheimnis der Wechselwirkung zwischen den beiden Leben, restauré à neuf <auf neu hergerichtete> durch den neuen Ausdruck "polares Verhältnis " und die Verwandlung des Einzellebens in ein bloßes Symbol, "Abbild" des Gesamtlebens.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '465'
- id: WSI.125.3
  kind: p
  original: Dieser Aufsatz reflektiert sich kaleidoskopisch in sich selbst, eine Manier der Entwicklung, die allen wahren Sozialisten gemeinsam ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '465'
- id: WSI.125.4
  kind: p
  original: 'Sie machen es mit ihren Sätzen wie jenes Kirschenweib, das unter dem Einkaufspreise losschlug nach dem richtigen ökonomischen Prinzip: Die Masse muß es tun.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '465'
- id: WSI.125.5
  kind: p
  original: Bei dem wahren Sozialismus ist dies um so notwendiger, als seine Kirschen faul waren, ehe sie reiften.
  en: ''
