- id: AT1.33.1
  kind: p
  original: '"Das Kind war realistisch in den Dingen dieser Welt befangen, bis ihm nach und nach hinter eben diesen Dingen zu kommen gelang.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
  review: true
  review_reason: MEW prints this passage in two columns side by side (the quoted text and the authors' version of it); the left column is read first, then the right. Check that the pairing still reads clearly
- id: AT1.33.2
  kind: p
  original: Der Jüngling war idealistisch, von dem Gedanken begeistert, bis er sich zum Manne hinaufgearbeitet, dem egoistischen, der mit den Dingen und Gedanken nach Herzenslust gebart und sein persönliches Interesse über Alles setzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
  review: true
  review_reason: MEW prints this passage in two columns side by side (the quoted text and the authors' version of it); the left column is read first, then the right. Check that the pairing still reads clearly
