- id: AT1.36.1
  kind: p
  original: 'Die ganze Geschichte "eines Menschenlebens" läuft also, "um hiermit zu schließen", auf Folgendes hinaus:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
- id: AT1.37.1
  kind: p
  original: 1. faßt Stirner die verschiedenen Lebensstufen nur als "Selbstfindungen" Individuums, und zwar reduzieren sich diese "Selbstfindungen" immer auf ein bestimmtes Bewußtseinsverhältnis.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
- id: AT1.37.2
  kind: p
  original: Die Verschiedenheit des Bewußtseins ist hier also das Leben des Individuums.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
- id: AT1.37.3
  kind: p
  original: Die physische und soziale Veränderung, die mit den Individuen vorgeht und ein verändertes Bewußtsein erzeugt, geht ihn natürlich Nichts an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
- id: AT1.37.4
  kind: p
  original: Deswegen finden auch Kind, Jüngling Mann bei Stirner die Welt immer fertig vor, wie sie sich "selbst" nur "finden"; es wird durchaus Nichts getan, um dafür zu sorgen, daß überhaupt etwas vorgefunden werden kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
- id: AT1.37.5
  kind: p
  original: Aber selbst das Verhältnis des Bewußtseins wird nicht einmal richtig, sondern nur in seiner spekulativen Verdrehung aufgefaßt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
- id: AT1.37.6
  kind: p
  original: Darum verhalten sich auch alle diese Gestalten philosophisch zur Welt - "das Kind realistisch ", "der Jüngling idealistisch", der Mann als negative Einheit Beider, als absolute Negativität, was in dem obigen Schlußsatz zum Vorschein kam.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 111-112
- id: AT1.37.7
  kind: p
  original: Hier ist das Geheimnis "eines Menschenlebens" enthüllt, hier tritt es hervor, daß "das Kind" nur eine Verkleidung des "Realismus", "der Jüngling " des "Idealismus", "der Mann " der versuchten Lösung dieses philosophischen Gegensatzes war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: AT1.37.8
  kind: p
  original: Diese Lösung, diese "absolute Negativität", kommt, wie sich schon jetzt ergibt, nur dadurch zustande, daß der Mann die Illusionen sowohl des Kindes wie des Jünglings auf Treu und Glauben akzeptiert und damit glaubt, die Welt der Dinge und die Welt des Geistes überwunden zu haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: AT1.38.1
  kind: p
  original: 2. Wenn Sankt Max auf das physische und soziale "Leben" des Individuums keine Rücksicht nimmt, überhaupt nicht vom "Leben" spricht, abstrahiert er ganz konsequent von den historischen Epochen, von der Nationalität, Klasse etc., oder, was dasselbe ist, er bläht das herrschende Bewußtsein der ihm am nächsten stehenden Klasse seiner unmittelbaren Umgebung zum Normalen Bewußtsein "Eines Menschenlebens" auf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: AT1.38.2
  kind: p
  original: Um sich über diese lokale und Schulmeister-Borniertheit zu erheben, braucht er "seinen Jüngling nur mit dem ersten besten Kontorjüngling, einem jungen englischen Fabrikarbeiter, einem jungen Yankee, von den jungen Kirgiskaisaken gar nicht zu reden, zu konfrontieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: AT1.39.1
  kind: p
  original: 3. Die enorme Leichtgläubigkeit unseres Heiligen - der eigentliche Geist seines Buchs - beruhigt sich nicht dabei, seinen Jüngling an sein Kind, seinen Mann an seinen Jüngling glauben zu lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: AT1.39.2
  kind: p
  original: Er selbst verwechselt unbesehens die Illusionen, die gewisse "Jünglinge", "Männer" etc. sich etwa von sich machen oder zu machen behaupten, mit dem "Leben", der Wirklichkeit dieser höchst zweideutigen Jünglinge und Männer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: AT1.40.1
  kind: p
  original: 4. ist die ganze Konstruktion der Menschenalter im dritten Teile der Hegelschen "Encyclopädie" und "unter mancherlei Wandlungen" auch sonst von Hegel bereits prototypisch vorgebildet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: AT1.40.2
  kind: p
  original: Der heilige Max, der "eigne" Zwecke verfolgt, mußte natürlich hier auch einige "Wandlungen" vornehmen; während Hegel z.B. sich noch so weit durch die empirische Welt bestimmen läßt, daß er den deutschen Bürgersmann als Knecht der ihn umgebenden Welt darstellt, muß ihn Stirner zum Herrn dieser Welt machen, was er nicht einmal in der Einbildung ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: AT1.40.3
  kind: p
  original: 'Ebenso gibt sich Sankt Max das Ansehen, als spreche er aus empirischen Gründen nicht vom Greis: er wolle nämlich abwarten, bis er einer werde (hier ist also "Ein Menschenleben" = Sein Einziges Menschenleben).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: AT1.40.4
  kind: p
  original: Hegel konstruiert die vier Menschenalter frisch darauf los, weil in der realen Welt sich die Negation doppelt setze, nämlich als Mond und Komet (vgl. Hegels Naturphilosophie), und darum hier die Vierheit an die Stelle der Dreiheit trete.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: AT1.40.5
  kind: p
  original: Stirner setzt seine Einzigkeit darin, Mond und Komet zusammenfallen zu lassen, und beseitigt so den unglücklichen Greis aus "einem Menschenleben".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 112-113
- id: AT1.40.6
  kind: p
  original: Der Grund dieser Eskamotage wird sich sogleich zeigen, wenn wir auf die Konstruktion der einzigen Geschichte des Menschen eingehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
