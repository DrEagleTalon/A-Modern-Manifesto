- id: AT1.35.1
  kind: p
  original: Das Kind war wirklich in der Welt seiner Dinge befangen, bis ihm nach und nach (borgerliche Eskamotage der Entwicklung) eben diese Dinge hinter sich zu bekommen gelang.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
  review: true
  review_reason: MEW prints this passage in two columns side by side (the quoted text and the authors' version of it); the left column is read first, then the right. Check that the pairing still reads clearly
- id: AT1.35.2
  kind: p
  original: Der Jüngling war phantastisch, von Begeisterung gedankenlos, bis der Mann ihn hinabarbeitete, der egoistische Bürger, mit dem die Dinge und Gedanken nach Herzenslust gebaren, weil sein persönliches Interesse Alles über ihn setzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
