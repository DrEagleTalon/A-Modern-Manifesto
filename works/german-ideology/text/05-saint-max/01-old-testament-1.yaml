section: AT1
title_original: 'Altes Testament: Der Mensch 1. Genesis, d.i. Ein Menschenleben'
title_en: 'Old Testament: Man. 1. Genesis, i.e. A Man''s Life'
author: Karl Marx, Friedrich Engels
date: 1845-1846
original_language: de
anchor_language: de
source_original: MEW 3, S. 104-113 (Dietz, Berlin 1969) via mlwerke.de; written 1845-1846, first printed in full 1932; the authors' footnotes from mlwerke's me03_anm.htm
source_en: 'None: no public-domain English translation'
verses:
- id: AT1.0.1
  kind: heading
  original: 'Altes Testament: Der Mensch'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '104'
- id: AT1.0.2
  kind: heading
  original: 1. Genesis, d.i. Ein Menschenleben
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '104'
- id: AT1.1.1
  kind: p
  original: Sankt Max schützt hier vor, die Biographie seines Todfeindes, "des Menschen ", zu schreiben, nicht die eines "Einzigen" oder "wirklichen Individuums".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '104'
- id: AT1.1.2
  kind: p
  original: Dies verwickelt ihn in ergötzliche Widersprüche.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '104'
- id: AT1.2.1
  kind: p
  original: Wie sich's für eine normale Genesis geziemt, beginnt das "Menschenleben" ab ovo <vom Ei an; ganz von vorn>, mit dem "Kinde".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '104'
- id: AT1.2.2
  kind: p
  original: Das Kind, wird uns p. 13 enthüllt, "lebt gleich im Kampfe gegen die ganze Welt, es wehrt sich gegen Alles, und Alles wehrt sich gegen es".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '104'
- id: AT1.2.3
  kind: p
  original: '"Feinde bleiben Beide", aber "in Ehrfurcht und Respekt"'' und "liegen immer auf der Lauer, sie lauern einer auf die Schwäche des Andern"; was p. 14 dahin weiter ausgeführt wird, "daß wir" als Kinder ein "auf den Grund der Dinge oder hinter die Dinge zu kommen suchen; daher " (also nicht mehr aus Feindschaft) " lauschen wir Allen ihre Schwächen ab".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '104'
- id: AT1.2.4
  kind: p
  original: (Hier ist Szeligas Finger, des Geheimniskrämers.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '104'
- id: AT1.2.5
  kind: p
  original: Das Kind wird also gleich zum Metaphysiker, der "auf den Grund der Dinge" zu kommen sucht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '104'
- id: AT1.3.1
  kind: p
  original: Dieses spekulierende Kind, dem die "Natur der Dinge" mehr am Herzen liegt als sein Spielzeug, wird nun "mitunter" auf die Dauer mit der "Welt der Dinge" fertig, besiegt sie und kommt dann in eine neue Phase, das Jünglingsalter, wo es einen neuen "sauern Lebenskampf", den Kampf gegen die Vernunft, zu bestehen hat, denn "Geist heißt die erste Selbstfindung" und "Wir sind über der Welt, Wir sind Geist" (p. 15).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '104'
- id: AT1.3.2
  kind: p
  original: 'Der Standpunkt des Jünglings ist "der himmlische"; das Kind "lernte" nur, "es hielt sich bei rein logischen oder theologischen Fragen nicht auf", wie denn auch (das Kind) "Pilatus" rasch über die Frage: "Was ist Wahrheit?" hinwegeilt (p. 17).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '104'
- id: AT1.3.3
  kind: p
  original: Der Jüngling "sucht der Gedanken habhaft zu werden", "versteht Ideen, den Geist" und "sucht nach Ideen"; er "hängt seinen Gedanken nach" (p. 16), er hat "absolute Gedanken, d.h. nichts als Gedanken, logische Gedanken".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '104'
- id: AT1.3.4
  kind: p
  original: Der Jüngling, der also "sich gebart", statt jungen Frauenzimmern und sonstigen profanen Dingen nachzujagen, ist kein andrer als der junge "Stirner", der Berliner studierende Jüngling, der Hegelsche Logik treibt und dem großen Michelet zustaunt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 104-105
- id: AT1.3.5
  kind: p
  original: 'Von diesem Jüngling heißt es mit Recht p. 17: "Den reinen Gedanken zutage zu fördern, ihm anzuhangen, das ist Jugendlust, und alle Lichtgestalten der Gedankenwelt, die Wahrheit, Freiheit, Menschentum, der Mensch usw. erleuchten und begeistern die jugendliche Seele."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '105'
- id: AT1.4.1
  kind: p
  original: Dieser Jüngling "wirft" dann auch "den Gegenstand beiseite" und "beschäftigt sich" bloß "mit seinen Gedanken"; "alles nicht Geistige befaßt er unter dem verächtlichen Namen der Äußerlichkeiten, und wenn er gleichwohl an solchen Äußerlichkeiten haftet, z. B. am Burschikosen etc., so geschieht es, wenn und weil er in ihnen Geist entdeckt, d.h., wenn sie ihm Symbole sind" (Wer "entdeckt" hier nicht "Szeliga"?).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '105'
- id: AT1.4.2
  kind: p
  original: Guter Berliner Jüngling!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '105'
- id: AT1.4.3
  kind: p
  original: Der Bierkomment der Korpsburschen war für ihn nur "ein Symbol", nur "einem Symbol" zu Gefallen hat er sich so manches Mal unter den Tisch trinken lassen, unter welchem er wahrscheinlich auch "Geist entdecken" wollte!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '105'
- id: AT1.4.4
  kind: p
  original: '- Wie gut dieser gute Jüngling ist, an dem sich der alte Ewald, der zwei Bände über den "guten Jüngling" schrieb, ein Exempel hätte nehmen können, zeigt sich auch daraus, daß es für Ihn "heißt" (p. 15), "Vater und Mutter sei zu verlassen, alle Naturgewalt für gesprengt zu erachten".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '105'
- id: AT1.4.5
  kind: p
  original: Für ihn, "den Vernünftigen, gibt es keine Familie als Naturgewalt, es zeigt sich eine Absagung von Eltern, Geschwistern etc." - die aber Alle "als geistige, vernünftige Gewalten wiedergeboren werden", wodurch der gute Jüngling dann den Gehorsam und die Furcht vor den Eltern mit seinem spekulierenden Gewissen in Einklang gebracht hat und Alles beim Alten bleibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '105'
- id: AT1.4.6
  kind: p
  original: Ebenso "heißt es nun" (p. 15) "Man muß Gott mehr gehorchen als den Menschen."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '105'
- id: AT1.4.7
  kind: p
  original: 'Ja, der gute Jüngling erreicht die höchste Spitze der Moralität p. 16, wo "es nun heißt": "Man muß seinem Gewissen mehr gehorchen als Gott."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '105'
- id: AT1.4.8
  kind: p
  original: Dieses moralische Hochgefühl setzt ihn sogar über "die rächenden Eumeniden", ja über "den Zorn des Poseidon" hinweg - nichts fürchtet er mehr als - "das Gewissen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '105'
- id: AT1.5.1
  kind: p
  original: 'Nachdem er entdeckt hat, daß "der Geist das Wesentliche" sei, fürchtet er sich sogar nicht mehr vor folgenden halsbrechenden Schlüssen:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '105'
- id: AT1.6.1
  kind: p
  original: '"Ist aber der Geist als das Wesentliche erkannt, so macht es doch einen Unterschied, ob der Geist arm oder reich ist, und man sucht deshalb " (!) "reich an Geist zu werden; es will der Geist sich ausbreiten, sein Reich zu gründen, ein Reich, das nicht von dieser Welt ist, der eben überwundenen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '105'
- id: AT1.6.2
  kind: p
  original: So sehnt er sich nun Alles in Allem zu werden (wie so?), "d.h., obgleich Ich Geist bin, bin Ich doch nicht vollendeter Geist und muß " (?) "den vollendeten Geist erst suchen." (p. 17.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '105'
- id: AT1.7.1
  kind: p
  original: '" So macht es doch einen Unterschied."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '105'
- id: AT1.7.2
  kind: p
  original: '- "Es", was?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '105'
- id: AT1.7.3
  kind: p
  original: Welches "Es" macht diesen Unterschied?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '105'
- id: AT1.7.4
  kind: p
  original: Wir werden dieses geheimnisvolle "Es" noch sehr häufig bei dem heiligen Manne wiederfinden, wo sich dann herausstellen wird, daß es der Einzige auf dem Standpunkte der Substanz, der Anfang der "einzigen" Logik und als solches die wahre Identität des Hegelschen "Sein" und "Nichts" ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 105-106
- id: AT1.7.5
  kind: p
  original: Für alles, was dieses "Es" tut, sagt und macht, machen wir daher unsren Heiligen, der sich zu ihm als Schöpfer verhält, verantwortlich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.7.6
  kind: p
  original: Zuerst macht dieses "Es", wie wir sahen, einen Unterschied zwischen Arm und Reich; und zwar weshalb? weil "der Geist als das Wesentliche erkannt ist".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.7.7
  kind: p
  original: Armes "Es", das ohne diese Erkenntnis nie zu dem Unterschiede von Arm und Reich gekommen wäre!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.7.8
  kind: p
  original: '"Und man sucht deshalb" etc. "Man!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.7.9
  kind: p
  original: Hier haben wir die zweite unpersönliche Person, die außer dem "Es" in Stirners Diensten steht und ihm die härtesten Hand- und Schubdienste verrichten muß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.7.10
  kind: p
  original: Wie sich die Beiden unter die Arme zu greifen gewohnt sind, zeigt sich hier.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.7.11
  kind: p
  original: Weil "Es" einen Unterschied macht, ob der Geist arm oder reich sei, so sucht "Man" (wer anders als Stirners getreuer Knecht wäre auf diesen Einfall gekommen!), so sucht " Man deshalb reich an Geist zu werden".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.7.12
  kind: p
  original: '"Es" gibt das Signal, und gleich stimmt "Man" aus voller Kehle ein.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.7.13
  kind: p
  original: Die Teilung der Arbeit ist klassisch durchgeführt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.8.1
  kind: p
  original: Weil "man reich an Geist zu werden sucht", so "will der Geist sich ausbreiten, sein Reich gründen" etc. "Ist aber" hier ein Zusammenhang vorhanden, "so macht es doch einen Unterschied", ob "man reich an Geist" werden oder " der Geist sein Reich gründen" will.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.8.2
  kind: p
  original: '"Der Geist" hat bisher noch nichts gewollt, "der Geist" hat noch nicht als Person figuriert, es hat sich nur um den Geist des "Jünglings", nicht um "den Geist" schlechthin, den Geist als Subjekt, gehandelt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.8.3
  kind: p
  original: Aber der heilige Schriftsteller hat jetzt einen andern Geist als den des Jünglings nötig, um ihn diesem als fremden, in letzter Instanz als heiligen Geist entgegenstellen zu können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.8.4
  kind: p
  original: Eskamotage Nr. 1.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.9.1
  kind: p
  original: '"So sehnt sich der Geist denn Alles in Allem zu werden", ein etwas dunkler Spruch, der dahin erläutert wird: "Obgleich Ich Geist bin, bin Ich doch nicht vollendeter Geist und muß den vollkommenen Geist erst suchen."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.9.2
  kind: p
  original: Ist aber der heilige Max "unvollendeter Geist", "so macht es doch einen Unterschied", ob er seinen Geist "vollenden" oder ob er " den vollendeten Geist" suchen muß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.9.3
  kind: p
  original: Er hatte es überhaupt ein paar Zeilen vorher nur mit dem "armen" und "reichen" Geiste zu tun - quantitativer, profaner Unterschied -, jetzt auf einmal mit dem "unvollendeten" und "vollendeten" Geiste - qualitativer, mysteriöser Unterschied.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.9.4
  kind: p
  original: Das Streben nach Ausbildung des eignen Geistes kann sich nun in die Jagd des "unvollendeten Geistes" auf " den vollendeten Geist" verwandeln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.9.5
  kind: p
  original: Der heilige Geist geht als Gespenst um.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.9.6
  kind: p
  original: Eskamotage Nr. 2.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '106'
- id: AT1.10.1
  kind: p
  original: 'Der heilige Autor fährt fort:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.11.1
  kind: p
  original: '"Damit" (nämlich mit dieser Verwandlung des Strebens nach der "Vollendung" meines Geistes in das Suchen nach " dem vollendeten Geist") "verliere Ich aber, der Ich soeben als Geist gefunden hatte, sogleich Mich wieder, indem Ich vor dem vollendeten Geiste, als einem Mir nicht eignen, sondern jenseitigen Mich beuge und meine Leerheit fühle." p. 18.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.12.1
  kind: p
  original: Dies ist weiter Nichts als eine weitere Ausführung von Eskamotage Nr. 2. Nachdem der "vollendete Geist" einmal als ein existierendes Wesen vorausgesetzt und dem "unvollendeten Geist" gegenübergestellt ist, versteht es sich von selbst, daß der "unvollendete Geist", der Jüngling, "seine Leerheit" bis auf den Grund seines Herzens schmerzlich empfindet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.12.2
  kind: p
  original: Weiter!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.13.1
  kind: p
  original: '"Auf Geist kommt zwar Alles an, aber ist auch jeder Geist der rechte Geist?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.13.2
  kind: p
  original: Der rechte und wahre Geist ist das Ideal des Geistes, der 'heilige Geist'.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.13.3
  kind: p
  original: Er ist nicht Mein oder Dein Geist, sondern eben " (!) "ein - idealer, jenseitiger, er ist 'Gott'.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.13.4
  kind: p
  original: '''Gott ist Geist''." p. 18.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.14.1
  kind: p
  original: Hier haben wir auf einmal den "vollendeten Geist" in den "rechten" und gleich darauf in den "rechten und wahren Geist" verwandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.14.2
  kind: p
  original: Dieser wird dadurch näher bestimmt, daß er "das Ideal des Geistes, der heilige Geist" sei, was dadurch bewiesen wird, daß er "nicht Mein oder Dein Geist, sondern eben ein jenseitiger, idealer, Gott" ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.14.3
  kind: p
  original: Der wahre Geist ist das Ideal des Geistes, weil er "eben" ein idealer ist!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.14.4
  kind: p
  original: Er ist der heilige Geist, weil er "eben" - Gott ist!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.14.5
  kind: p
  original: Welche "Virtuosität im Denken"!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.14.6
  kind: p
  original: Beiläufig bemerken wir noch, daß von "Deinem" Geiste bisher noch nicht die Rede war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.14.7
  kind: p
  original: Eskamotage Nr. 3.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.15.1
  kind: p
  original: Also wenn ich mich als Mathematiker auszubilden oder nach Sankt Max zu "vollenden" suche, so suche ich den "vollendeten" Mathematiker, d.h. "den rechten und wahren" Mathematiker, der "das Ideal "des Mathematikers, den "heiligen" Mathematiker, der ein von Mir und Dir verschiedener Mathematiker ist (obgleich Du mir als vollendeter Mathematiker gelten kannst, wie für den Berliner Jüngling sein Professor der Philosophie als vollendeter Geist gilt), "sondern eben ein idealer, jenseitiger", der Mathematiker im Himmel, "Gott" ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.15.2
  kind: p
  original: Gott ist Mathematiker,
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.16.1
  kind: p
  original: Auf alle diese großen Resultate kommt der heilige Max, weil "es einen Unterschied macht, ob der Geist reich oder arm sei", d.h. zu deutsch übersetzt:, ob einer reich oder arm an Geist ist, und weil sein "Jüngling" diese merkwürdige Tatsache entdeckt hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.17.1
  kind: p
  original: Der heilige Max fährt fort p. 18.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.18.1
  kind: p
  original: '"Den Mann scheidet es vom Jünglinge, daß er die Welt nimmt, wie sie ist" etc.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: AT1.19.1
  kind: p
  original: Wir erfahren also nicht, wie der Jüngling dazu kommt, die Welt plötzlich zu nehmen, "wie sie ist", wir sehen auch nicht unsern heiligen Dialektiker den Übergang vom Jüngling zum Manne machen, wir erfahren bloß, daß "Es" hier diesen Dienst verrichten und den Jüngling vom Manne "scheiden" muß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: AT1.19.2
  kind: p
  original: Selbst das "Es" allein reicht nicht hin, den schwerfälligen Frachtwagen der einzigen Gedanken in Gang zu bringen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: AT1.19.3
  kind: p
  original: Denn nachdem "Es" "den Mann vom Jüngling geschieden" hat, fällt der Mann dennoch wieder in den Jüngling zurück. beschäftigt sich von Neuem "ausschließlich mit Geistigem" und kommt nicht in den Zug, bis das "Man" mit neuem Vorspann zu Hilfe eilt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: AT1.19.4
  kind: p
  original: '"Erst dann, wenn man sich leibhaftig liebgewonnen etc.", p. 18 - "erst dann" geht es wieder flott voran, der Mann entdeckt, daß er ein persönliches Interesse hat, und kommt zur " zweiten Selbstfindung " indem er sich nicht nur "als Geist findet", wie der Jüngling, "und sich dann sogleich wieder an den allgemeinen Geist verliert", sondern als "leibhaftiger Geist". p. 19. Dieser "leibhaftige Geist" kommt endlich dann auch dazu, "ein Interesse nicht etwa nur seines Geistes" (wie der Jüngling), "sondern totaler Befriedigung, Befriedigung des ganzen Kerls" (ein Interesse der Befriedigung des ganzen Kerls!) zu haben - er kommt dazu, "an sich, wie er leibt und lebt, eine Lust zu haben".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: AT1.19.5
  kind: p
  original: Stirners "Mann" kommt als Deutscher zu Allem sehr spät.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: AT1.19.6
  kind: p
  original: Er kann auf den Pariser Boulevards und in der Londoner Regent Street Hunderte von "Jünglingen", Muscadins und Dandies, flanieren sehen, die sich noch nicht als "leibhaftigen Geist" gefunden haben, aber nichtsdestoweniger "an sich, wie sie leiben und leben, eine Lust haben" und ihr Hauptinteresse in die "Befriedigung des ganzen Kerls" setzen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: AT1.20.1
  kind: p
  original: Diese zweite "Selbstfindung" begeistert unsern heiligen Dialektiker so sehr, daß er plötzlich aus der Rolle fällt und statt vom Manne von Sich selbst spricht, uns verrät, daß Er selber, Er der Einzige, "der Mann" ist, und daß "der Mann" "der Einzige" ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: AT1.20.2
  kind: p
  original: Neue Eskamotage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: AT1.21.1
  kind: p
  original: '"Wie Ich Mich (soll heißen "der Jüngling sich") "hinter den Dingen finde, und zwar als Geist, so muß ich Mich" (soll heißen "der Mann sich") "später auch hinter den Gedanken finden, nämlich als ihr Schöpfer und Eigner.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: AT1.21.2
  kind: p
  original: In der Geisterzeit wuchsen Mir" (dem Jünglinge) "die Gedanken über den Kopf, dessen Geburten sie doch waren; wie Fieberphantasien umschwebten und erschütterten sie Mich, eine schauervolle Macht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: AT1.21.3
  kind: p
  original: 'Die Gedanken waren für sich selbst leibhaftig geworden, waren Gespenster, wie Gott, Kaiser, Papst, Vaterland usw.; zerstöre ich ihre Leibhaftigkeit, so nehme Ich sie in die Meinige zurück und sage: Ich allein bin leibhaftig.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: AT1.21.4
  kind: p
  original: 'Und nun nehme Ich die Welt als das, was sie Mir ist, als die Meinige, als Mein Eigentum: Ich beziehe Alles auf Mich."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: AT1.22.1
  kind: p
  original: Nachdem also der hier mit "dem Einzigen" identifizierte Mann zuerst den Gedanken Leibhaftigkeit gegeben, d.h. sie zu Gespenstern gemacht hat, zerstört er nun wieder diese Leibhaftigkeit, indem er sie in seinen eignen Leib zurücknimmt und diesen somit als den Leib der Gespenster setzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: AT1.22.2
  kind: p
  original: Daß er erst durch die Negation der Gespenster auf seine eigne Leibhaftigkeit kommt, dies zeigt, wie diese konstruierte Leibhaftigkeit des Mannes beschaffen ist, die er "sich" erst "sagen" muß, um daran zu glauben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: AT1.22.3
  kind: p
  original: '"Und nun sagt" er sich nicht einmal richtig, was er "sich sagt".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: AT1.22.4
  kind: p
  original: 'Daß außer seinem "einzigen" Leib nicht noch in seinem Kopf allerlei selbständige Leiber, Spermatozoa, hausen, verwandelt er in die "Sage": Ich allein bin leibhaftig.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: AT1.22.5
  kind: p
  original: Abermalige Eskamotage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: AT1.23.1
  kind: p
  original: Weiter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: AT1.23.2
  kind: p
  original: Der Mann, der sich als Jüngling allerlei dummes Zeug über bestehende Mächte und Verhältnisse, wie Kaiser, Vaterland, Staat etc., in den Kopf gesetzt und sie nur als seine eigne "Fieberphantasie" in der Gestalt seiner Vorstellung gekannt hat, zerstört nach Sankt Max diese Mächte wirklich, indem er seine falsche Meinung von ihnen sich aus dem Kopf schlägt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: AT1.23.3
  kind: p
  original: Umgekehrt, indem er die Welt nicht mehr durch die Brille seiner Phantasie erblickt, hat er sich nun um ihren praktischen Zusammenhang zu bekümmern, ihn kennenzulernen und nach ihm sich zu richten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: AT1.23.4
  kind: p
  original: Indem er ihre phantastische Leibhaftigkeit, die sie für ihn hatte, zerstört, findet er ihre wirkliche Leibhaftigkeit außer seiner Phantasie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: AT1.23.5
  kind: p
  original: Indem ihm die gespenstige Leibhaftigkeit des Kaisers verschwindet, ist ihm nicht die Leibhaftigkeit, sondern die Gespensterhaftigkeit des Kaisers verschwunden, dessen wirkliche Macht er jetzt erst in ihrer Ausdehnung würdigen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: AT1.23.6
  kind: p
  original: Eskamotage Nr. 3[a].
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: AT1.24.1
  kind: p
  original: Der Jüngling als Mann verhält sich nicht einmal kritisch zu Gedanken, die auch für Andre gültig sind und als Kategorien zirkulieren, sondern nur zu solchen Gedanken, die "bloße Geburten seines Kopfes", d.h. die von seinem Kopfe wiedergebornen allgemeinen Vorstellungen über bestehende Verhältnisse sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: AT1.24.2
  kind: p
  original: Er löst also z.B. nicht einmal die Kategorie "Vaterland" auf, sondern nur seine Privatmeinung von dieser Kategorie, wo denn immer noch die allgemeingültige Kategorie übrigbleibt und selbst im Gebiete des "philosophischen Denkens" die Arbeit erst anfängt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: AT1.24.3
  kind: p
  original: Er will uns aber weismachen, er habe die Kategorie selbst aufgelöst, weil er sein gemütliches Privatverhältnis zu ihr aufgelöst hat - gerade wie er uns eben weismachen wollte, er habe die Macht des Kaisers vernichtet, wenn er seine phantastische Vorstellung vom Kaiser aufgegeben hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: AT1.24.4
  kind: p
  original: Eskamotage Nr. 4.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: AT1.25.1
  kind: p
  original: '"Und nun", fährt der heilige Max fort, "nehme ich die Welt als das, was sie Mir ist, als die Meinige, als Mein Eigentum."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: AT1.26.1
  kind: p
  original: Er nimmt die Welt als das, was sie ihm ist, d.h. als das, als was er sie nehmen muß, und hierdurch hat er sich die Welt angeeignet, sie zu seinem Eigentum gemacht - eine Manier des Erwerbs, die sich zwar bei keinem Ökonomen findet, deren Methode und Erfolge dagegen "das Buch" selbst um so prunkvoller offenbaren wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: AT1.26.2
  kind: p
  original: Im Grunde "nimmt" er aber nicht "die Welt", sondern nur seine "Fieberphantasie" von der Welt als die Seinige und eignet sie Sich an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: AT1.26.3
  kind: p
  original: 'Er nimmt die Welt als seine Vorstellung von der Welt, und als seine Vorstellung ist die Welt sein vorgestelltes Eigentum, das Eigentum seiner Vorstellung, seine Vorstellung als Eigentum, sein Eigentum als Vorstellung, seine eigentümliche Vorstellung, oder seine Vorstellung vom Eigentum; und dies Alles drückt er in dem unvergleichlichen Satze aus: "Ich beziehe Alles auf Mich."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: AT1.27.1
  kind: p
  original: Nachdem der Mann nach des Heiligen eignem Bekenntnis erkannt hat, daß die Welt nur mit Gespenstern bevölkert war, weil der Jüngling Gespenster sah, nachdem die Scheinwelt des Jünglings für ihn verschwunden ist, befindet er sich in einer wirklichen, von den Einbildungen des Jünglings unabhängigen Welt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: AT1.28.1
  kind: p
  original: 'Und nun, muß es also heißen, nehme Ich die Welt als das, was sie unabhängig von Mir ist, als die Ihrige ("der Mann nimmt" p. 18 selbst "die Welt wie sie ist", nicht wie ihm beliebt), zunächst als Mein Nichteigentum (Mein Eigentum war sie bisher nur als Gespenst): Ich beziehe Mich auf Alles und nur insofern Alles auf Mich.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: AT1.29.1
  kind: p
  original: '"Stieß ich als Geist die Welt zurück in tiefster Weltverachtung, so stoße Ich als Eigner die Geister oder Ideen zurück in ihre Eitelkeit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: AT1.29.2
  kind: p
  original: Sie haben keine Macht mehr über mich, wie über den Geist keine 'Gewalt der Erde' eine Macht hat." p. 20.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: AT1.30.1
  kind: p
  original: 'Wir sehen hier, wie der Eigner, der Stirnersche Mann, die Erbschaft des Jünglings, die, wie er selbst sagt, nur in "Fieberphantasien" und "Gespenstern" besteht, sine beneficio deliberandi atque inventarii <wörtlich: ohne die Vergünstigung der Bedenkzeit und der Bestandsaufnahme> sofort antritt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: AT1.30.2
  kind: p
  original: Er glaubt es, daß er als Jüngling werdendes Kind mit der Welt der Dinge, als Mann werdender Jüngling mit der Welt des Geistes wirklich fertiggeworden ist, daß er als Mann jetzt die ganze Welt in der Tasche und sich um Nichts mehr Sorge zu machen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: AT1.30.3
  kind: p
  original: Wenn, wie er dem Jüngling nachschwatzt, keine Gewalt der Erde außer ihm Macht über den Geist hat, also der Geist die höchste Macht der Erde ist - und Er, der Mann, diesen allmächtigen Geist sich unterworfen hat - ist er da nicht vollends allmächtig?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: AT1.30.4
  kind: p
  original: Er vergißt, daß er nur die phantastische und gespenstige Gestalt, welche die Gedanken Vaterland etc. unter dem Schädel "des Jünglings" annahmen, zerstörte, daß er aber diese Gedanken, sofern sie wirkliche Verhältnisse ausdrücken, noch nicht berührt hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 110-111
- id: AT1.30.5
  kind: p
  original: Weit entfernt, Herr der Gedanken geworden zu sein, ist er erst jetzt fähig, zu "Gedanken" zu kommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
- id: AT1.31.1
  kind: p
  original: '"Es kann nun, um hiermit zu schließen, einleuchten" (p. 199), daß der heilige Mann seine Konstruktion der Lebensalter zum erwünschten und prädestinierten Ziele geführt hat.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
- id: AT1.31.2
  kind: p
  original: Das gewonnene Resultat teilt er uns in einem Satze mit, einem gespenstigen Schatten, den wir mit seinem abhanden gekommenen Leib wieder konfrontieren wollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
- id: AT1.32.1
  kind: p
  original: Einziger Satz, p. 20
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
