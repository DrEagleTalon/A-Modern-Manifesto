section: NT1
title_original: 'Neues Testament: "Ich" 1. Ökonomie des Neuen Bundes'
title_en: 'New Testament: "I". 1. The Economy of the New Covenant'
author: Karl Marx, Friedrich Engels
date: 1845-1846
original_language: de
anchor_language: de
source_original: MEW 3, S. 222-224 (Dietz, Berlin 1969) via mlwerke.de; written 1845-1846, first printed in full 1932; the authors' footnotes from mlwerke's me03_anm.htm
source_en: 'None: no public-domain English translation'
verses:
- id: NT1.0.1
  kind: heading
  original: 'Neues Testament: "Ich"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '222'
- id: NT1.0.2
  kind: heading
  original: 1. Ökonomie des Neuen Bundes
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '222'
- id: NT1.1.1
  kind: p
  original: Wenn wir im Alten Bunde die "einzige" Logik innerhalb der Vergangenheit zum Gegenstande unserer Erbauung hatten, so haben wir nun die Gegenwart innerhalb der "einzigen" Logik vor uns.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '222'
- id: NT1.1.2
  kind: p
  original: Wir haben den "Einzigen" in seinen mannigfaltigen, antediluvianischen "Brechungen", als Mann, kaukasischen Kaukasier, vollendeten Christen, Wahrheit des humanen Liberalismus, negative Einheit von Realismus und Idealismus ppp. bereits hinlänglich beleuchtet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '222'
- id: NT1.1.3
  kind: p
  original: Mit der historischen Konstruktion des "Ich" fällt das "Ich" selber.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '222'
- id: NT1.1.4
  kind: p
  original: Dies "Ich", das Ende einer geschichtlichen Konstruktion, ist kein "leibhaftiges", fleischlich von Mann und Weib erzeugtes Ich, das keiner Konstruktionen bedarf, um zu existieren; es ist ein geistlich von zwei Kategorien, "Idealismus" und "Realismus", erzeugtes "Ich", eine bloße Gedankenexistenz.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '222'
- id: NT1.2.1
  kind: p
  original: 'Der Neue Bund, der schon mit dem Alten Bunde, seiner Voraussetzung, aufgelöst ist, hat einen buchstäblich ebenso weisen Haushalt wie der Alte, nämlich "unter mancherlei Wandlungen" denselben, wie dies aus der folgenden Tabelle hervorgeht:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '222'
- id: NT1.3.1
  kind: p
  original: I. Die Eigenheit = die Alten, Kind, Neger pp. in ihrer Wahrheit, nämlich die Herausarbeitung aus der "Welt der Dinge" zur "eignen" Anschauung und Besitzergreifung dieser Welt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '222'
- id: NT1.3.2
  kind: p
  original: Es ergab sich bei den Alten Lossein von der Welt, bei den Neuen Lossein vom Geist, bei den Liberalen Lossein von der Person, bei den Kommunisten Lossein vom Eigentum, bei den Humanen Lossein von Gott, also überhaupt die Kategorie des Losseins (Freiheit) als Ziel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '222'
- id: NT1.3.3
  kind: p
  original: Die negierte Kategorie des Losseins ist die Eigenheit, die natürlich keinen andern Inhalt als dies Lossein hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '222'
- id: NT1.3.4
  kind: p
  original: Die Eigenheit ist die philosophisch konstruierte Eigenschaft aller Eigenschaften des Stirnerschen Individui.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '222'
- id: NT1.4.1
  kind: p
  original: II. Der Eigner - als solcher ist Stirner hinter die Unwahrheit der Welt der Dinge und der Welt des Geistes gekommen, also die Neuen, Phase des Christentums innerhalb der logischen Entwicklung - Jüngling, Mongole.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 222-223
- id: NT1.4.2
  kind: p
  original: '- Wie die Neuen in die dreifach bestimmten Freien, so schlägt der Eigner in die drei ferneren Bestimmungen auseinander:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '223'
- id: NT1.5.1
  kind: p
  original: 1. Meine Macht, dem politischen Liberalismus entsprechend, wo die Wahrheit des Rechts an den Tag kommt, das Recht als die Macht "des Menschen" in die Macht als das Recht des "Ich" aufgelöst wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '223'
- id: NT1.5.2
  kind: p
  original: Kampf gegen den Staat als solchen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '223'
- id: NT1.6.1
  kind: p
  original: 2. Mein Verkehr, dem Kommunismus entsprechend, wobei die Wahrheit der Gesellschaft an den Tag kommt und die Gesellschaft als der durch "den Menschen" vermittelte Verkehr (in ihren Formen als Gefängnisgesellschaft, Familie, Staat, bürgerliche Gesellschaft pp.) in den Verkehr des "Ich" aufgelöst wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '223'
- id: NT1.7.1
  kind: p
  original: 3. Mein Selbstgenuß, dem kritischen, humanen Liberalismus entsprechend, worin die Wahrheit der Kritik, das Verzehren, Auflösen und die Wahrheit des absoluten Selbstbewußtseins als Selbstverzehren an den Tag kommt und die Kritik als das Auflösen im Interesse des Menschen in das Auflösen im Interesse des "Ich" sich verwandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '223'
- id: NT1.8.1
  kind: p
  original: Die Eigentümlichkeit der Individuen löste sich, wie wir sahen, in die allgemeine Kategorie der Eigenheit auf, welche die Negation des Losseins, der Freiheit im Allgemeinen war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '223'
- id: NT1.8.2
  kind: p
  original: Die Beschreibung der besondern Eigenschaften des Individuums kann also wieder nur in der Negation dieser "Freiheit" in ihren drei "Brechungen" bestehen; jede dieser negativen Freiheiten wird jetzt durch ihre Negation in eine positive Eigenschaft verwandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '223'
- id: NT1.8.3
  kind: p
  original: Es versteht sich, daß, wie im Alten Testament das Lossein der Welt der Dinge und der Welt der Gedanken schon als Aneignung dieser beiden Welten gefaßt wurde, so auch hier diese Eigenheit oder Aneignung der Dinge und Gedanken wieder als vollendetes Lossein dargestellt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '223'
- id: NT1.9.1
  kind: p
  original: Das "Ich" mit seinem Eigentum, seiner Welt, die in den eben "signalisierten" Eigenschaften besteht, ist Eigner.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '223'
- id: NT1.9.2
  kind: p
  original: Als sich selbst genießend und sich selbst verzehrend, ist es das "Ich" in der zweiten Potenz, der Eigner des Eigners, den es ebensowohl los ist, als er ihm gehört, also die "absolute Negativität" in ihrer doppelten Bestimmung als Indifferenz, Jleichjültigkeit und negative Beziehung auf sich, den Eigner.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '223'
- id: NT1.9.3
  kind: p
  original: Sein Eigentum an der Welt und sein Lossein von der Welt hat sich nun verwandelt in diese negative Beziehung auf sich, in dieses Selbstauflösen und Sichselbstgehören des Eigners.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '223'
- id: NT1.9.4
  kind: p
  original: Das Ich, so bestimmt, ist -
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '223'
- id: NT1.10.1
  kind: p
  original: III. Der Einzige, der also wieder keinen andern Inhalt hat als den Eigner plus die philosophische Bestimmung der "negativen Beziehung auf sich".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 223-224
- id: NT1.10.2
  kind: p
  original: Der tiefsinnige Jacques gibt sich den Schein, als sei von diesem Einzigen Nichts auszusagen, weil er ein leibhaftiges, nicht konstruierbares Individuum ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '224'
- id: NT1.10.3
  kind: p
  original: Es verhält sich aber vielmehr damit wie mit der Hegelschen absoluten Idee am Ende der "Logik" und der absoluten Persönlichkeit am Ende der "Encyklopädie", von der ebenfalls Nichts auszusagen ist, weil nämlich die Konstruktion Alles enthält, was von solchen konstruierten Persönlichkeiten ausgesagt werden kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '224'
- id: NT1.10.4
  kind: p
  original: Hegel weiß dies und geniert sich nicht, dies zu gestehen, während Stirner die Heuchelei begeht, zu behaupten, sein "Einziger" sei noch etwas Andres als der konstruierte Einzige, aber Etwas, das sich nicht sagen lasse - nämlich ein leibhaftiges Individuum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '224'
- id: NT1.10.5
  kind: p
  original: Dieser heuchlerische Schein verschwindet, wenn man die Sache umkehrt, den Einzigen als Eigner bestimmt und vom Eigner aussagt, daß er die allgemeine Kategorie der Eigenheit zu seiner allgemeinen Bestimmung hat; womit nicht allein Alles gesagt ist, was über den Einzigen "sagbar" ist, sondern auch, was er überhaupt ist - minus Jacques le bonhommes Einbildung von ihm.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '224'
- id: NT1.11.1
  kind: p
  original: '"O welch eine Tiefe des Reichtums, beides der Weisheit und Erkenntnis des Einzigen!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '224'
- id: NT1.11.2
  kind: p
  original: Wie gar unergründlich sind seine Gedanken und unerforschlich seine Wege!"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '224'
- id: NT1.12.1
  kind: p
  original: '"Siehe, also gehet sein Tun; aber davon haben wir ein geringes Wörtlein vernommen." (Hiob 26,14.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '224'
