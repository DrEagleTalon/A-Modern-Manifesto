- id: III.1.1
  kind: p
  original: '"Was jehen mir die jrinen Beeme an?"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '100'
- id: III.2.1
  kind: p
  original: Der heilige Max exploitiert, "verbraucht" oder "benutzt" das Konzil dazu, einen langen apologetischen Kommentar "des Buches" zu geben, welches kein anderes Buch ist als "das Buch", das Buch als solches, das Buch schlechthin, d.h. das vollkommene Buch, das Heilige Buch, das Buch als Heiliges, das Buch als das Heilige - das Buch im Himmel, nämlich "Der Einzige und sein Eigenthum".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '101'
- id: III.2.2
  kind: p
  original: '"Das Buch" war bekanntlich gegen Ende 1844 aus dem Himmel herabgefallen und hatte bei O. Wigand in Leipzig Knechtsgestalt angenommen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '101'
- id: III.2.3
  kind: p
  original: Es hatte sich so den Wechselfällen des irdischen Lebens preisgegeben und war von drei "Einzigen", nämlich von der geheimnisvollen Persönlichkeit Szeliga, von dem Gnostiker Feuerbach und von Heß angegriffen worden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '101'
- id: III.2.4
  kind: p
  original: So erhaben der heilige Max auch als Schöpfer in jedem Augenblick über sich als Geschöpf wie über seine sonstigen Geschöpfe ist, erbarmte er sich dennoch seines schwachen Kindleins und stieß zu seiner Wehrung und Sicherstellung ein lautes "kritisches Juchhe" aus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '101'
- id: III.2.5
  kind: p
  original: Um sowohl dies "kritische Juchhe" wie die geheimnisvolle Persönlichkeit Szeliga in ihrer ganzen Bedeutung zu ergründen, müssen wir hier einigermaßen auf die Kirchengeschichte eingehen und "das Buch" näher betrachten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '101'
- id: III.2.6
  kind: p
  original: 'Oder um mit Sankt Max zu sprechen: Wir wollen "an dieser Stelle" eine kirchengeschichtliche "Reflexion" über den "Einzigen und sein Eigenthum" "episodisch einlegen", "lediglich darum", "weil uns dünkt, sie könne zur Verdeutlichung des Übrigen beitragen".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '101'
- id: III.3.1
  kind: p
  original: '"Machet die Tore weit und die Türen in der Welt hoch, daß der König der Ehren einziehe.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '101'
- id: III.3.2
  kind: p
  original: '- Wer ist derselbe König der Ehren?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '101'
- id: III.3.3
  kind: p
  original: Es ist der 'Feldherr', stark und mächtig, 'der Feldherr', mächtig im Streit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '101'
- id: III.3.4
  kind: p
  original: Machet die Tore weit und die Türen in der Welt hoch, daß der König der Ehren einziehe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '101'
- id: III.3.5
  kind: p
  original: '- Wer ist derselbe König der Ehren?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '101'
- id: III.3.6
  kind: p
  original: Es ist der Herr Einzige, Er ist der König der Ehren." (Ps[alm] 24, 7-10.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '101'
- id: III.4.1
  kind: heading
  original: 1. Der Einzige und sein Eigentum
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '101'
- id: III.5.1
  kind: p
  original: 'Der Mann, der "sein'' Sach'' auf Nichts gestellt hat", beginnt als guter Deutscher sein langgezogenes "kritisches Juchhe" sogleich mit einer Jeremiade: "Was soll nicht Alles Meine Sache sein?" (p. 5 des Buchs).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '102'
- id: III.5.2
  kind: p
  original: Und er jammert herzzerreißend weiter, daß "Alles seine Sache sein soll", daß man ihm "die Sache Gottes, die Sache der Menschheit, der Wahrheit, Freiheit, ferner die Sache Seines Volkes, Seines Fürsten" und tausend andre gute Sachen aufbürdet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '102'
- id: III.5.3
  kind: p
  original: Der arme Mann!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '102'
- id: III.5.4
  kind: p
  original: Der französische und englische Bourgeois klagt über Mangel an Débouchés <Absatzgelegenheiten>, über Handelskrisen, panische Schrecken an der Börse, augenblickliche politische Konstellationen usw.; der deutsche Kleinbürger, der aktiv nur einen ideellen Anteil an der Bourgeoisbewegung genommen und im übrigen nur seine eigne Haut zu Markt getragen hat, stellt sich seine eigne Sache nur als "die gute Sache", die "Sache der Freiheit, Wahrheit, Menschheit" etc. vor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '102'
- id: III.6.1
  kind: p
  original: Unser deutscher Schulmeister glaubt ihm tout bonnement <ohne weiteres> diese Einbildung und setzt sich mit allen diesen guten Sachen auf drei Seiten vorläufig auseinander.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '102'
- id: III.7.1
  kind: p
  original: Er untersucht die "Sache Gottes", die "Sache der Menschheit", p. 6 und 7, und findet, daß dies "rein egoistische Sachen" sind, daß sowohl "Gott" wie "die Menschheit" sich nur um das Ihrige bekümmern, daß es "der Wahrheit, der Freiheit, der Humanität, der Gerechtigkeit" "nur um sich, nicht um Uns, nur um Ihr Wohl, nicht um das Unsere zu tun ist" - woraus er den Schluß zieht, daß sich alle diese Personen "ausnehmend gut dabei stehen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '102'
- id: III.7.2
  kind: p
  original: Er geht so weit, diese idealistischen Phrasen, Gott, Wahrheit usw., in wohlhabende Bürger zu verwandeln, die "sich ausnehmend gut stehen" und eines " einträglichen Egoismus" erfreuen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '102'
- id: III.7.3
  kind: p
  original: 'Das aber wurmt den heiligen Egoisten: "Und Ich?" ruft er aus.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '102'
- id: III.8.1
  kind: p
  original: '"Ich Meinesteils nehme Mir eine Lehre daran und will, statt jenen großen Egoisten zu dienen, lieber selber der Egoist sein!" (p. 7).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '103'
- id: III.9.1
  kind: p
  original: Wir sehen also, welch heilige Motive den heiligen Max bei seinem Übertritt zum Egoismus leiten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '103'
- id: III.9.2
  kind: p
  original: Nicht die Güter dieser Welt, nicht die Schätze, so die Motten und der Rost fressen, nicht die Kapitalien seiner Mit-Einzigen, sondern der Schatz im Himmel, die Kapitalien Gottes, der Wahrheit, Freiheit, Menschheit etc. lassen ihn nicht ruhen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '103'
- id: III.10.1
  kind: p
  original: Mutete man ihm nicht zu, den vielen guten Sachen zu dienen, er würde nie zu der Entdeckung gekommen sein, daß er auch eine "eigne" Sache habe, würde also auch diese seine Sache nicht "auf Nichts" (d.h. "das Buch") "gestellt haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '103'
- id: III.11.1
  kind: p
  original: Hätte Sankt Max sich die verschiedenen "Sachen" und "Eigner" dieser Sachen, z.B. Gott, Menschheit, Wahrheit etwas näher betrachtet, so wäre er zu dem entgegengesetzten Schluß gekommen, daß ein auf die egoistische Handlungsweise dieser Personen basierter Egoismus ebenso eingebildet sein müsse wie diese Personen selbst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '103'
- id: III.12.1
  kind: p
  original: Statt dessen entschließt sich unser Heiliger, "Gott" und "der Wahrheit" Konkurrenz zu machen und seine Sache auf Sich zu stellen -
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '103'
- id: III.13.1
  kind: p
  original: '"auf Mich, der Ich so gut wie Gott das Nichts von allem Andern, der Ich Mein Alles, der Ich der Einzige bin. - - Ich bin Nichts im Sinne der Leerheit, sondern das schöpferische Nichts, das Nichts, aus welchem ich selbst als Schöpfer Alles schaffe."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '103'
- id: III.14.1
  kind: p
  original: 'Der heilige Kirchenvater hätte diesen letzten Satz auch so ausdrücken können: Ich bin Alles in der Leerheit des Unsinns, "sondern" der nichtige Schöpfer, das Alles, aus welchem ich selbst als Schöpfer Nichts schaffe.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '103'
- id: III.15.1
  kind: p
  original: Welche von diesen beiden Lesarten die richtige ist, wird sich herausstellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '103'
- id: III.15.2
  kind: p
  original: Soweit die Vorrede.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '103'
- id: III.16.1
  kind: p
  original: '"Das Buch" selbst teilt sich, wie das "weiland" Buch, in das Alte und Neue Testament, nämlich in die einzige Geschichte des Menschen (das Gesetz und die Propheten) und in die unmenschliche Geschichte des Einzigen (Evangelium vom Reiche Gottes).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '103'
- id: III.16.2
  kind: p
  original: Das erste ist die Geschichte innerhalb der Logik, der in der Vergangenheit gebundene Logos, das zweite die Logik in der Geschichte, der freigewordene Logos, der mit der Gegenwart kämpft und sie siegreich überwältigt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '103'
