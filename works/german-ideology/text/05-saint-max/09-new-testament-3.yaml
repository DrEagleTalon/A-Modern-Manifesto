section: NT3
title_original: 3. Offenbarung Johannis des Theologen oder "die Logik der neuen Weisheit"
title_en: New Testament, 3. The Revelation of John the Divine
author: Karl Marx, Friedrich Engels
date: 1845-1846
original_language: de
anchor_language: de
source_original: MEW 3, S. 253-282 (Dietz, Berlin 1969) via mlwerke.de; written 1845-1846, first printed in full 1932; the authors' footnotes from mlwerke's me03_anm.htm
source_en: 'None: no public-domain English translation'
verses:
- id: NT3.0.1
  kind: heading
  original: 3. Offenbarung Johannis des Theologen oder "die Logik der neuen Weisheit"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: NT3.1.1
  kind: p
  original: Im Anfang war das Wort, der Logos.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: NT3.1.2
  kind: p
  original: In ihm war das Leben, und das Leben war das Licht der Menschen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: NT3.1.3
  kind: p
  original: 'Und das Licht scheinet in die Finsternis und die Finsternis hat <im Manuskript: haben> es nicht begriffen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: NT3.1.4
  kind: p
  original: Das war das wahrhaftige Licht, es war in der Welt, und die Welt kannte es nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: NT3.1.5
  kind: p
  original: Er kam in sein Eigentum, und die Seinen nahmen ihn nicht auf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: NT3.1.6
  kind: p
  original: Wie viele ihn aber aufnahmen, denen gab er Macht, Eigentümer zu werden, die an [den N]amen des Einzigen glauben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: NT3.1.7
  kind: p
  original: '[Aber we]r hat den Einzigen je ge[sehen?]'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: NT3.2.1
  kind: p
  original: '[Betrachten] wir jetzt dieses "Licht der Welt" in "der] Logik der neuen Weis[heit", da Sankt] Sancho sich bei den frü[heren Vernich]tungen nicht beruhigt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: NT3.3.1
  kind: p
  original: '[Bei unserm "]einzigen" Schriftsteller versteht es sich [von selbst, daß] die Grundlage seiner [Genialität] in einer glänzen[den Reihe pers]önlicher Vorzüge [besteht, welc]he seine eigentüm[liche Virtuosität] im Denken ausma[chen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: NT3.3.2
  kind: p
  original: 'D]a alle diese Vorzüge bereits im Vorhergehenden weitläuftig nachgewiesen sind, so genügt hier eine kurze Zusammenstellung der hauptsächlichsten unter ihnen: Liederlichkeit im Denken - Konfusion - Zusammenhangslosigkeit - eingestandene Unbeholfenheit - unendliche Wiederholungen -beständiger Widerspruch mit sich selbst - Gleichnisse ohnegleichen - Einschüchterungsversuche gegen den Leser - systematische Gedanken-Erbschleicherei vermittelst der Hebel "Du", "Es", "Man" usw. und groben Mißbrauchs der Konjunktionen Denn, Deshalb, Darum, Weil, Demnach, Sondern etc. - Unwissenheit - schwerfällige Beteuerung - feierlicher Leichtsinn - revolutionäre Redensarten und friedliche Gedanken - Sprachpolterei - aufgedunsene Gemeinheit und Kokettieren mit wohlfeiler Unanständigkeit - Erhebung des Eckenstehers Nante in den absoluten Begriff - Abhängigkeit von Hegelschen Traditionen und Berliner Tagesphrasen - kurz, vollendete Fabrikation einer breiten Bettelsuppe (491 Seiten) nach Rumfordscher Manier.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: NT3.4.1
  kind: p
  original: 'In dieser Bettelsuppe schwimmen dann eine ganze Reihe von Übergängen als Knochen herum, von denen wir jetzt einige Specimina <Probestücke, Muster> zur öffentlichen Ergötzung des ohnehin so gedrückten deutschen Publikums mitteilen wollen:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: NT3.5.1
  kind: p
  original: '"Könnten wir nicht - nun ist aber - man teilt mitunter - man kann nun - zur Wirksamkeit von... gehört besonders das, was man häufig... nennen hört - und dies heißt - Er kann nun, um hiermit zu schließen, einleuchten - mittlerweise - so kann hier beiläufig gedacht werden - sollte nicht - oder wäre nicht etwa - der Fortgang von... dahin, daß... ist nicht schwer - von einem gewissen Standpunkt aus räsoniert man etwa so - z.B. usw. " - etc. und "ist an dem" in allen möglichen "Wandlungen".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 253-254
- id: NT3.6.1
  kind: p
  original: Wir können hier gleich einen [logischen] Kniff erwähnen, von dem [sich nicht] entscheiden läßt, ob er der [gepriesenen] Tüchtigkeit Sanchos [oder der] Untüchtigkeit seiner [Gedanken seine] Existenz verdankt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: NT3.6.2
  kind: p
  original: Dies[er Kniff besteht] darin, aus einer Vorstel[lung, aus einem] Begriff, der mehrere [bestimmt aus]gemachte Seiten (hat, eine Seite] als die bisher allein[ige und einzige] herauszunehmen, sie [dem Begriff als] seine alleinige Bestimmt [ heit unter]zuschieben und dieser gege[nüber jede andre] Seite unter einem [neuen Namen als] etwas Originelles gelten[d zu machen]. So mit der Freiheit und der Eigen[heit, wie] wir später sehen werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: NT3.7.1
  kind: p
  original: Unter den Kategorien, welche weniger der Persönlichkeit Sanchos, als der allgemeinen Bedrängnis, in welcher sich die deutschen Theoretiker dermalen befinden, ihren Ursprung verdanken, steht obenan die lumpige Distinktion, die Vollendung der Lumperei.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: NT3.7.2
  kind: p
  original: Da unser Heiliger sich in den "seelenmarterndsten" Gegensätzen herumtreibt, wie Einzelnes und Allgemeines, Privatinteresse und allgemeines Interesse, gewöhnlicher Egoismus und Aufopferung pp., so kommt es schließlich auf die lumpigsten Konzessionen und Transaktionen der beiden Seiten untereinander, die wiederum auf den subtilsten Distinktionen beruhen - Distinktionen, deren Nebeneinander-Bestehen durch " auch " ausgedrückt und deren Trennung voneinander dann wieder durch ein dürftiges " insofern " aufrechterhalten wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: NT3.7.3
  kind: p
  original: 'Solche lumpige Distinktionen sind z.B.: wie die Menschen sich gegenseitig exploitieren, aber doch Keiner dies auf Kosten des Andern tut; inwiefern Etwas mir eigen oder eingegeben ist; die Konstruktion einer menschlichen und einer einzigen Arbeit, die nebeneinander existieren; das für das menschliche Leben Unentbehrliche und das dem einzigen Leben Unentbehrliche; was der reinen Persönlichkeit angehört und was sachlich zufällig ist, wo Sankt Max, von seinem Standpunkte aus, gar kein Kriterium hat; was zu den Lumpen und was zur Haut des Individuums gehört; was er durch die Verneinung total los wird oder sich aneignet, inwiefern er bloß seine Freiheit oder bloß seine Eigenheit aufopfert, wo er auch opfert, aber nur insofern er eigentlich nicht opfert, was mich als Band und was mich als persönliche Beziehung zu den Andern in Verhältnis bringt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: NT3.7.4
  kind: p
  original: Ein Teil dieser Distinktionen ist absolut lumpig, ein anderer verliert, wenigstens bei Sancho, allen Sinn und Halt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: NT3.7.5
  kind: p
  original: Als Vollendung dieser lumpigen Distinktion kann betrachtet werden die zwischen der Weltschöpfung durch das Individuum und dem Anstoß, den es von der Welt erhält.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: NT3.7.6
  kind: p
  original: 'Ginge er hier z.B. auf den Anstoß näher ein, in der ganzen Ausbreitung und Mannigfaltigkeit, in der dieser auf ihn wirkt, so würde [sich bei] ihm schließlich der Widerspruch [herauss]tellen, daß er ebenso blind [ abhängig ] von der Welt ist, wie er [sie egois]tisch-ideologisch schafft. (Siehe: "Mein Selbstgenuß".)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 254-255
- id: NT3.7.7
  kind: p
  original: Er [würde seine " ] Auchs" und "Insoferns" [ebensowenig] nebeneinander [nennen, wie d]ie "menschliche" Arbeit [neben der "]einzigen", Eins nicht [gegenüber dem] Andern streitig [machen, so Eins nic]ht dem Andern [in den Rücken] fallen und so nicht der [ "mit sich selbst e ] inige Egoist" vollständig [sich selbst unterst]ellt zu werden - aber wir [wissen,] daß dieser nicht erst [unterste]llt zu werden braucht, sondern schon von vornherein der Ausgangspunkt war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: NT3.8.1
  kind: p
  original: Diese Lumperei der Distinktion geht durch das ganze "Buch", ist ein Haupthebel auch der übrigen logischen Kniffe und äußert sich namentlich in einer ebenso selbstgefälligen wie spottwohlfeilen moralischen Kasuistik.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: NT3.8.2
  kind: p
  original: So wird uns an Exempeln klargemacht, inwieweit der wahre Egoist lügen darf und nicht lügen darf, inwiefern es "verächtlich" und nicht verächtlich ist, ein Vertrauen zu täuschen, inwiefern Kaiser Sigismund und Franz I. von Frankreich Eide brechen durften und inwiefern sie sich dabei "lumpig" benahmen, und andre dergleichen feine historische Illustrationen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: NT3.8.3
  kind: p
  original: Gegenüber diesen mühsamen Distinktionen und Quästiunculis <winzigen (gelehrten) Fragen> nimmt sich dann wieder sehr gut aus die Gleichgültigkeit unsres Sancho, der Alles einerlei ist und die alle wirklichen, praktischen und Gedanken-Unterschiede beiseite wirft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: NT3.8.4
  kind: p
  original: Im Allgemeinen können wir schon jetzt sagen, daß seine Kunst zu unterscheiden lange noch nicht reicht an seine Kunst, nicht zu unterscheiden, alle Kühe in der Nacht des Heiligen grau werden zu lassen und Alles auf Alles zu reduzieren - eine Kunst, die in der Apposition ihren adäquaten Ausdruck erreicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: NT3.9.1
  kind: p
  original: Umarme Deinen "Grauen"', Sancho, Du hast ihn hier wiedergefunden!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: NT3.9.2
  kind: p
  original: Lustig springt er Dir entgegen, nicht achtend der Fußtritte, die ihm geworden sind, und begrüßt Dich mit heller Stimme.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: NT3.9.3
  kind: p
  original: Kniee nieder vor ihm, umschlinge seinen Hals und erfülle Deinen Beruf, zu dem Dich Cervantes am dreißigsten berufen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: NT3.10.1
  kind: p
  original: Die Apposition ist der Graue Sankt Sanchos, seine logische und historische Lokomotive, die auf ihren kürzesten und einfachsten Ausdruck reduzierte treibende Kraft "des Buchs".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: NT3.10.2
  kind: p
  original: Um eine Vorstellung in eine andere zu verwandeln oder die Identität zweier ganz disparaten Dinge nachzuweisen, werden einige Mittelglieder gesucht, die teils dem Sinn, teils der Etymologie, teils dem bloßen Klange nach zur Herstellung eines scheinbaren Zusammenhangs zwischen den beiden Grundvorstellungen brauchbar sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: NT3.10.3
  kind: p
  original: Diese werden dann in der Form der Apposition der ersten Vorstellung angehängt, und zwar so, daß man immer weiter von dem abkommt, wovon man ausging, und immer näher zu dem kommt, wohin man will.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 255-256
- id: NT3.10.4
  kind: p
  original: Ist die Appositionskette so weit präpariert, daß man ohne Gefahr schließen kann, so wird vermittelst eines Gedankenstrichs die Schlußvorstellung ebenfalls als Apposition angehangen, und das Kunststück ist fertig.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '256'
- id: NT3.10.5
  kind: p
  original: Dies ist eine höchst empfehlenswerte Manier des Gedankenschmuggels, die um so wirksamer ist, je mehr sie zum Hebel der Hauptentwicklungen gemacht wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '256'
- id: NT3.10.6
  kind: p
  original: Wenn man dies Kunststück bereits mehrere Male mit Erfolg vollzogen hat, so kann man, nach Sankt Sanchos Vorgang, allmählich einige Mittelglieder auslassen und endlich die Appositionsreihe auf die allernotdürftigsten Haken reduzieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '256'
- id: NT3.11.1
  kind: p
  original: Die Apposition kann nun auch, wie wir schon oben sahen, umgedreht werden und dadurch zu neuen, komplizierteren Kunststücken und erstaunlicheren Resultaten führen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '256'
- id: NT3.11.2
  kind: p
  original: Wir sahen ebendaselbst, daß die Apposition die logische Form der unendlichen Reihe aus der Mathematik ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '256'
- id: NT3.12.1
  kind: p
  original: Sankt Sancho wendet die Apposition doppelt an, einerseits rein logisch, bei der Kanonisation der Welt, wo sie ihm dazu dient, jedes beliebige weltliche Ding in "das Heilige" zu verwandeln, andererseits historisch, bei Entwicklungen des Zusammenhangs und bei Zusammenfassung verschiedener Epochen, wo jede geschichtliche Stufe auf ein einziges Wort reduziert wird und am Ende das Resultat herauskommt, daß das letzte Glied in der historischen Reihe um kein Haarbreit weiter ist als das erste und sämtliche Epochen der Reihe schließlich in [e]iner einzigen abstrakten Kategorie, [e]twa Idealismus, Abhängigkeit von Gedanken pp. zusammengefaßt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '256'
- id: NT3.12.2
  kind: p
  original: Wenn in die historische Appositionsreihe der Schein eines Fortschritts gebracht werden soll, so geschieht dies dadurch, daß die Schlußphrase als die Vollendung der ersten Epoche der Reihe und die Zwischenglieder als Entwicklungsstufen in aufsteigender Ordnung zur letzten, vollendeten Phrase hin gefaßt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '256'
- id: NT3.13.1
  kind: p
  original: Der Apposition zur Seite geht die Synonymik, die von Sankt Sancho nach allen Seiten hin exploitiert wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '256'
- id: NT3.13.2
  kind: p
  original: Wenn zwei Worte etymologisch zusammenhängen oder nur ähnlichen Klang haben, so werden sie solidarisch füreinander verantwortlich gemacht, oder wenn ein Wort verschiedene Bedeutungen hat, so wird dies Wort nach Bedürfnis bald in der einen, bald in der andern Bedeutung, und zwar mit dem Scheine gebraucht, als spreche Sankt Sancho von Einer und derselben Sache in verschiedenen "Brechungen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '256'
- id: NT3.13.3
  kind: p
  original: Eine eigne Sektion der Synonymik bildet noch die Übersetzung, wo ein französischer oder lateinischer Ausdruck durch einen deutschen ergänzt wird, der jenen ersten halb und sonst noch ganz andre Dinge ausdrückt, z.B. wenn, wie wir oben sahen, "respektieren" durch "Ehrfurcht und Furcht empfinden" pp. übersetzt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 256-257
- id: NT3.13.4
  kind: p
  original: Man erinnere sich an Staat, Status, Stand, Notstand etc. Wir haben beim Kommunismus schon Gelegenheit gehabt, reichhaltige Exempel dieses Gebrauchs von doppelsinnigen Ausdrücken zu sehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: NT3.13.5
  kind: p
  original: Wir wollen jetzt noch kurz ein Beispiel der etymologischen Synonymik vornehmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: NT3.14.1
  kind: p
  original: '"Das Wort ''Gesellschaft'' hat seinen Ursprung in dem Worte ''Sal''.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: NT3.14.2
  kind: p
  original: Schließt ein Saal viele Menschen ein, so macht's der Saal, daß sie in Gesellschaft sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: NT3.14.3
  kind: p
  original: Sie sind in Gesellschaft und machen höchstens eine Salon-Gesellschaft aus, indem sie in den herkömmlichen Salon-Redensarten sprechen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: NT3.14.4
  kind: p
  original: Wenn es zum wirklichen Verkehr kommt, so ist dieser als von der Gesellschaft unabhängig zu betrachten." (pag. 286.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: NT3.15.1
  kind: p
  original: Weil "das Wort 'Gesellschaft' in 'Sal' seinen Ursprung hat" (was beiläufig gesagt nicht wahr ist, da die ursprünglichen Wurzeln aller Wörter Zeitwörter sind), so muß "Sal" = "Saal" sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: NT3.15.2
  kind: p
  original: Sal heißt aber im Althochdeutschen ein Gebäude, Kisello, Geselle, wovon Gesellschaft herkommt, ein Hausgenosse, und daher kommt der "Saal" ganz willkürlich herein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: NT3.15.3
  kind: p
  original: Aber das tut nichts; der "Saal" wird sogleich in einen "Salon" verwandelt, als ob zwischen dem althochdeutschen "Sal" und dem neufranzösischen "Salon" nicht eine Zwischenstufe von zirka tausend Jahren und soundso viel Meilen läge.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: NT3.15.4
  kind: p
  original: So ist die Gesellschaft in eine Salon-Gesellschaft verwandelt, in der nach deutsch-spießbürgerlicher Vorstellung nur ein Phrasenverkehr stattfindet und von der aller wirkliche Verkehr ausgeschlossen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: NT3.15.5
  kind: p
  original: '- Übrigens hätte Sankt Max, da er doch nur darauf ausgeht, die Gesellschaft in "das Heilige" zu verwandeln, die Sache viel kürzer haben können, wenn er die Etymologie etwas genauer betrieben und sich ein beliebiges Wurzellexikon angesehen hätte.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: NT3.15.6
  kind: p
  original: Welch ein Fund wäre es für ihn gewesen, wenn er dort den etymologischen Zusammenhang zwischen "Gesellschaft" und "selig" entdeckt hätte - Gesellschaft - selig - heilig - das Heilige - was kann einfacher aussehen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: NT3.16.1
  kind: p
  original: Wenn "Stirners" etymologische Synonymik richtig ist, so suchen die Kommunisten die wahre Grafschaft, die Grafschaft als das Heilige.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: NT3.16.2
  kind: p
  original: Wie Gesellschaft von Sal, Gebäude, so kommt Graf (got[isch] garâvjo) vom [go]tischen râvo, Haus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: NT3.16.3
  kind: p
  original: Sal, Gebäude = râvo, Haus, also Gesellschaft gleich Grafschaft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: NT3.16.4
  kind: p
  original: Vor- und Endsilben sind in beiden Worten gleich, die Stammsilben haben gleiche Bedeutung - also ist die heilige Gesellschaft der Kommunisten die heilige Grafschaft, die Grafschaft als das Heilige - was kann einfacher aussehen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: NT3.16.5
  kind: p
  original: Sankt Sancho ahnte dies, als er im Kommunismus die Vollendung des Lehnswesens, d.h. Grafschaftenwesens sah.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: NT3.17.1
  kind: p
  original: Die Synonymik dient unsrem Heiligen einerseits dazu, empirische Verhältnisse in spekulative zu verwandeln, indem er ein Wort, das in der Praxis sowohl wie in der Spekulation vorkommt, in seiner spekulativen Bedeutung anwendet, über diese spekulative Bedeutung einige Phrasen macht und dann sich stellt, als ob er damit auch die wirklichen Verhältnisse kritisiert habe, zu deren Bezeichnung dasselbe Wort auch gebraucht wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 257-258
- id: NT3.17.2
  kind: p
  original: So mit der Spekulation. p. 406 "erscheint" "die Spekulation" nach zwei Seiten hin als Ein Wesen, das sich eine "doppelte Erscheinung" gibt - o Szeliga!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: NT3.17.3
  kind: p
  original: Er poltert gegen die philosophische Spekulation und glaubt, damit auch [die] kommerzielle Spekulation, von [der] er nichts weiß, abgetan zu [hab]en.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: NT3.17.4
  kind: p
  original: '- Andrerseits dient ihm, dem verborgnen Kleinbürger, [die]se Synonymik dazu, Bourgeoisverhältnisse (siehe, was oben beim "Kommunismus" über den Zusammenhang der Sprache mit den Bourgeoisverhältnissen gesagt wird) in persönliche, individuelle zu verwandeln, die man nicht antasten kann, ohne das Individuum in seiner Individualität, "Eigenheit" und "Einzigkeit" anzutasten.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: NT3.17.5
  kind: p
  original: So exploitiert Sancho z.B. den etymologischen Zusammenhang zwischen Geld und Geltung, Vermögen und vermögen usw.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: NT3.18.1
  kind: p
  original: Die Synonymik, vereinigt mit der Apposition, bildet den Haupthebel seiner Eskamotage, die wir bereits zu unzähligen Malen enthüllten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: NT3.18.2
  kind: p
  original: Um ein Exempel davon zu geben, wie leicht diese Kunst ist, wollen wir auch einmal à la Sancho eskamotieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: NT3.19.1
  kind: p
  original: Der Wechsel als Wechsel ist das Gesetz der Erscheinung, sagt Hegel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: NT3.19.2
  kind: p
  original: Darum, könnte "Stirner" fortfahren, die Erscheinung von der Strenge des Gesetzes gegen falsche Wechsel; denn es ist hier das über der Erscheinung erhabene Gesetz, das Gesetz als solches, das heilige Gesetz, das Gesetz als das Heilige - das Heilige, wogegen gesündigt und das in der Strafe gerächt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: NT3.19.3
  kind: p
  original: 'Oder aber: Der Wechsel "in seiner doppelten Erscheinung" als Wechsel (lettre de change) und Wechsel (changement) führt zum Verfall (échéance und décadence).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: NT3.19.4
  kind: p
  original: Der Verfall als Konsequenz des Wechsels zeigt sich in der Geschichte unter andern beim Untergang des römischen Reichs, der Feudalität, des deutschen Kaiserreichs und der Herrschaft Napoleons.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: NT3.19.5
  kind: p
  original: '"Der Fortgang von" diesen großen geschichtlichen Krisen "zu" den Handelskrisen unserer Tage "ist nicht schwer", und hieraus erklärt sich denn auch, warum diese Handelskrisen stets durch den Verfall von Wechseln bedingt sind.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: NT3.20.1
  kind: p
  original: 'Oder er konnte auch, wie Vermögen und Geld, den Wechsel etymologisch rechtfertigen und "von einem gewissen Standpunkt aus etwa so räsonieren": Die Kommunisten wollen unter andern den Wechsel (lettre de change) beseitigen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: NT3.20.2
  kind: p
  original: Besteht aber nicht gerade im Wechsel (changement) der Haupt-Weltgenuß?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: NT3.20.3
  kind: p
  original: Sie wollen also das Tote, Unbewegte, China - d.h., der vollendete Chinese ist Kommunist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: NT3.20.4
  kind: p
  original: '"Daher" die Deklamationen der Kommunisten gegen die Wechselbriefe und die Wechsler.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: NT3.20.5
  kind: p
  original: Als ob nicht jeder Brief ein Wechselbrief, ein einen Wechsel konstatierender Brief, und jeder Mensch ein Wechselnder, ein Wechsler wäre!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 258-259
- id: NT3.21.1
  kind: p
  original: Um der Einfachheit seiner Konstruktion und seiner logischen Kunststücke einen recht mannigfaltigen Schein zu geben, hat Sankt Sancho die Episode nötig.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: NT3.21.2
  kind: p
  original: Von Zeit zu Zeit legt er eine Stelle "episodisch" ein, die an einen andern Teil des Buchs gehörte oder ganz gut wegbleiben könnte, und unterbricht so den ohnehin vielfach zerrissenen Faden seiner sogenannten Entwicklung noch mehr.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: NT3.21.3
  kind: p
  original: Dies geschieht dann mit der naiven Erklärung, daß "Wir" "nicht am Schnürchen gehen", und bewirkt nach mehrmaliger Wiederholung in dem Leser eine gewisse Stumpfheit gegen alle, auch die größeste Zusammenhangslosigkeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: NT3.21.4
  kind: p
  original: Wenn man "das Buch" liest, gewöhnt man sich an Alles und läßt zuletzt gern das Schlimmste über sich ergehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: NT3.21.5
  kind: p
  original: Übrigens sind diese Episoden, wie sich von Sankt Sancho nicht anders erwarten [läßt,] selbst nur scheinbare und nur [Wiederhol]ungen der hundertmal [schon dage]wesenen Phrasen unter [andern Fir]men.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: NT3.22.1
  kind: p
  original: Nachdem Sankt Max [sich so in] seinen persönlichen Qualitäten [gezeigt, so]dann in der Distinktion, [in der] Synonymik und Episode als [ "Schein" und] als "Wesen" enthüllte, kommen [wir zu de]r wahren Spitze und Vollen[dung der] Logik, zum "Begriff".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: NT3.23.1
  kind: p
  original: '[Der] Begriff ist "Ich" (siehe Hegels "Logik", 3. Teil), die Logik [als Ich].'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: NT3.23.2
  kind: p
  original: Es ist das reine Verhältnis [des] Ich zur Welt, das Verhältnis, [entkleidet] aller für ihn existierenden realen Verhältnisse, [eine Forme]l für alle Gleichungen, in [die ein He]iliger die weltlichen [Begriffe] bringt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: NT3.23.3
  kind: p
  original: Schon oben ist ent[hüllt], wie Sancho in dieser Formel sich nur die verschiedenen reinen Reflexionsbestimmungen wie Identität, Gegensatz pp. an allen möglichen Dingen klarzumachen erfolglos "trachtet".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: NT3.24.1
  kind: p
  original: Fangen wir gleich an irgendeinem bestimmten Exempel an, z.B. dem Verhältnis von "Ich" und Volk.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: NT3.25.1
  kind: p
  original: Ich bin nicht das Volk.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: NT3.25.2
  kind: p
  original: Das Volk = Nicht-Ich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: NT3.25.3
  kind: p
  original: Ich = das Nicht-Volk.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: NT3.26.1
  kind: p
  original: Ich bin also die Negation des Volks, das Volk ist in Mir aufgelöst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: NT3.27.1
  kind: p
  original: 'Die zweite Gleichung kann auch in der Nebengleichung gefaßt werden:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: NT3.28.1
  kind: p
  original: 'Das Volks-Ich ist nicht, oder: Das Ich des Volks ist das Nicht Meines Ich.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: NT3.29.1
  kind: p
  original: Die ganze Kunst besteht also 1. darin, daß die Negation, die im Anfang zur Kopula gehörte, erst zum Subjekt und dann zum Prädikat geschlagen wird; 2. daß die Negation, das "Nicht", je nachdem es konveniert, als Ausdruck von Verschiedenheit, Unterschied, Gegensatz und direkte Auflösung gefaßt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 259-260
- id: NT3.29.2
  kind: p
  original: Im vorliegenden Beispiel wird es als absolute Auflösung, als vollständige Negation gefaßt; wir werden finden, daß es je nach Sankt Maxens Konvenienz auch in den andern Bedeutungen gebraucht wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.29.3
  kind: p
  original: So verwandelt sich denn der tautologische Satz, daß Ich nicht das Volk bin, in die gewaltige neue Entdeckung, daß Ich die Auflösung des Volkes bin.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.30.1
  kind: p
  original: Zu den bisherigen Gleichungen war es nicht einmal nötig, daß Sankt Sancho auch nur irgendeine Vorstellung vom Volk hatte; es genügte zu wissen, daß Ich und Volk "völlig verschiedene Namen für völlig Verschiedenes sind"; es reichte hin, daß beide Worte nicht einen einzigen Buchstaben gemeinsam haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.30.2
  kind: p
  original: Soll nun vom Standpunkt der egoistischen Logik weiter über das Volk spekuliert werden, so genügt es, an das Volk und an "Ich" von außen her, aus der alltäglichen Erfahrung, irgendeine beliebige triviale Bestimmung anzureihen, was zu neuen Gleichungen Anlaß gibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.30.3
  kind: p
  original: Es wird zugleich der Schein hervorgebracht, als würden verschiedne Bestimmungen verschiedenartig kritisiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.30.4
  kind: p
  original: 'In dieser Weise soll nun jetzt über Freiheit, Glück und Reichtum spekuliert werden:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.31.1
  kind: p
  original: 'Grundgleichung: Volk = Nicht-Ich.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.32.1
  kind: p
  original: 'Gleichung Nr. 1: Volks-Freiheit = Nicht Meine Freiheit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.33.1
  kind: p
  original: Volks-Freiheit = Meine Nichtfreiheit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.34.1
  kind: p
  original: Volks-Freiheit = Meine Unfreiheit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.35.1
  kind: p
  original: '(Dies kann nun auch umgedreht werden, wo dann der große Satz herauskommt: Meine Unfreiheit = Knechtschaft ist die Freiheit des Volkes.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.36.1
  kind: p
  original: Gleichung Nr. II Volks-Glück = Nicht Mein Glück.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.37.1
  kind: p
  original: Volks-Glück = Mein Nichtglück.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.38.1
  kind: p
  original: Volks-Glück = Mein Unglück.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.39.1
  kind: p
  original: '(Umkehrung: Mein Unglück, Meine Misère ist das Glück des Volkes.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.40.1
  kind: p
  original: Gleichung Nr. III Volksreichtum = Nicht Mein Reichtum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.41.1
  kind: p
  original: Volksreichtum = Mein Nichtreichtum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.42.1
  kind: p
  original: Volksreichtum = Meine Armut.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.43.1
  kind: p
  original: '(Umkehrung: Meine Armut ist der Reichtum des Volkes.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.43.2
  kind: p
  original: Dies ist nun ad libitum <nach Belieben> weiter zu führen und auf andere Bestimmungen auszudehnen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: NT3.44.1
  kind: p
  original: Zur Bildung dieser Gleichungen gehört außer einer höchst allgemeinen Kenntnis derjenigen Vorstellungen, die er mit "Volk" in ein Wort zusammensetzen darf, weiter nichts als die Kenntnis des positiven Ausdrucks für das in negativer Form gewonnene Resultat, also z.B. Armut für Nicht-Reichtum pp., also geradesoviel Kenntnis der Sprache, wie man im täglichen Umgang sich erwirbt, reicht vollständig hin, um auf diese Weise zu den überraschendsten Entdeckungen zu kommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 260-261
- id: NT3.45.1
  kind: p
  original: Die ganze Kunst bestand also hier darin, daß Nicht Mein Reichtum, Nicht Mein Glück, Nicht Meine Freiheit verwandelt wird in Mein Nicht-Reichtum, Mein Nichtglück, Meine Nichtfreiheit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: NT3.45.2
  kind: p
  original: Das Nicht, was in der ersten Gleichung die allgemeine Negation [ist,] alle möglichen Formen der Verschiedenheit ausdrücken, z.B. bloß enthalten kann, daß es Unser gemeinsamer, nicht Mein ausschließlicher Reichtum ist, wird in der [zweiten Gl]eichung zur Verneinung Meines Reich[tums, Meines] Glücks pp. und schreibt Mir [das Nichtglüc]k, das Unglück, die Knechtschaft [zu.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: NT3.45.3
  kind: p
  original: Indem] Mir ein bestimmter Reichtum, [der Volksre]ichtum, keineswegs der [Reichtum] überhaupt abgesprochen wird, [meint Sancho,] muß mir die[ Armut zu]gesprochen werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: NT3.45.4
  kind: p
  original: Dies [aber kom]mt nun auch dadurch zu[stande,] daß Meine Nichtfreiheit [ebenfalls pos]itiv übersetzt und so in Meine ["Unfreiheit"] verwandelt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: NT3.45.5
  kind: p
  original: Meine [Nichtfreiheit] kann ja aber hundert [andre] Dinge sein dies - z.B. meine ["Unfrei]heit", meine Nichtfreiheit von [mein]em Leibe etc.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: NT3.46.1
  kind: p
  original: 'Wir gingen eben aus von der zweiten Gleichung: Das Volk = Nicht-Ich.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: NT3.46.2
  kind: p
  original: 'Wir hätten auch ausgehen können von der dritten Gleichung: Ich = das Nicht-Volk, wo sich dann z.B. beim Reichtum nach obiger Manier schließlich herausgestellt haben würde: "Mein Reichtum ist die Armut des Volks."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: NT3.46.3
  kind: p
  original: 'Hier würde aber Sankt Sancho nicht so verfahren, sondern die Vermögensverhältnisse des Volks überhaupt und das Volk selbst auflösen und dann zu dem Resultate kommen: Mein Reichtum ist die Vernichtung nicht nur des Volksreichtums, sondern des Volkes selbst.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: NT3.46.4
  kind: p
  original: Hier zeigt sich denn, wie willkürlich Sankt Sancho verfuhr, wenn er eben den Nicht-Reichtum in die Armut verwandelte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: NT3.46.5
  kind: p
  original: Unser Heiliger wendet diese verschiedenen Methoden durcheinander an und exploitiert die Negation bald in der einen, bald in der andern Bedeutung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: NT3.46.6
  kind: p
  original: Welch eine Konfusion daraus entsteht, "sieht augenblicklich" auch "Jeder ein, der Stirners Buch nicht gelesen hat" (Wigand, p.191).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: NT3.47.1
  kind: p
  original: Ebenso "machiniert" das "Ich" gegen den Staat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: NT3.48.1
  kind: p
  original: Ich bin nicht der Staat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: NT3.48.2
  kind: p
  original: Staat = Nicht-Ich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: NT3.48.3
  kind: p
  original: Ich = Nicht des Staates.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: NT3.48.4
  kind: p
  original: Nichts des Staates = Ich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: NT3.49.1
  kind: p
  original: 'Oder in andern Worten: Ich bin das "schöpferische Nichts", worin der Staat untergegangen ist.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: NT3.50.1
  kind: p
  original: Diese einfache Melodie kann nun auf jedes beliebige Thema abgesungen werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: NT3.51.1
  kind: p
  original: 'Der große Satz, der allen diesen Gleichungen zugrunde liegt, ist: Ich bin nicht Nicht-Ich.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: NT3.51.2
  kind: p
  original: Diesem Nicht-Ich werden verschiedene Namen gegeben, die einerseits rein logisch sein können, wie z.B. Ansichsein, Anderssein, andererseits die Namen konkreter Vorstellungen, Volk, Staat pp. Hierdurch kann denn der Schein einer Entwicklung hereingebracht werden, indem man von diesen Namen ausgeht und sie vermittelst der Gleichung oder der Appositionsreihe allmählich wieder auf das ihnen von Anfang an zugrunde gelegte Nicht-Ich reduziert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: NT3.51.3
  kind: p
  original: Da die auf solche Weise hereingebrachten realen Verhältnisse nur als verschiedene, und zwar nur dem Namen nach verschiedene Modifikationen des Nicht-Ich auftreten, so braucht über diese realen Verhältnisse selbst gar nichts gesagt zu werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: NT3.51.4
  kind: p
  original: Dies ist um so komischer, als d[ie realen] Verhältnisse die Verhältnisse [der Indi]viduen selbst sind und man ebe[n dadurch,] daß man sie für Verhältnisse [des Nicht]-Ichs erklärt, beweist, daß man nichts von ihnen weiß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: NT3.51.5
  kind: p
  original: Dies vereinfacht die Sache so sehr, daß selbst die aus "gebornen beschränkten Köpfen bestehende große Mehrzahl" diesen Kunstgriff in höchstens zehn Minuten erlernen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: NT3.51.6
  kind: p
  original: Dies gibt zugleich ein Kriterium für die "Einzigkeit" Sankt Sanchos.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: NT3.52.1
  kind: p
  original: Das dem Ich gegenüberstehende Nicht-Ich wird nun von Sankt Sancho dahin bestimmt, daß es das dem Ich Fremde, das Fremde ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: NT3.52.2
  kind: p
  original: Das Verhältnis des Nicht-Ich zum Ich ist "daher" das der Entfremdung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: NT3.52.3
  kind: p
  original: Wir haben soeben die logische Formel dafür gegeben, wie Sankt Sancho irgendein beliebiges Objekt oder Verhältnis als das dem Ich Fremde, die Entfremdung des Ichs darstellt; auf der andern Seite kann Sankt Sancho nun wieder irgendein Objekt oder Verhältnis, wie wir sehen werden, als ein vom Ich geschaffenes und ihm angehöriges darstellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: NT3.52.4
  kind: p
  original: Abgesehen zunächst von der Willkür, mit der er jedes beliebige Verhältnis als ein Verhältnis der Entfremdung darstellt oder nicht darstellt (da Alles in die obigen Gleichungen paßt), sehen wir schon hier, daß es [sich bei] ihm um weiter nichts handelt [als daru]m, alle wirklichen Verhältnisse, [ebenso wie] die wirklichen Individuen, [als entfre]mdet (um den philosophischen [Ausdruck] einstweilen noch beizubehalten) vorfinden [zu lass]en, in die ganz [abstrakte] Phrase der Entfremdung zu ver[wandeln; sta]tt der Aufgabe also, die [wirklichen] Individuen in ihrer [wirklichen] Entfremdung und den empi[rischen Verh]ältnissen dieser Entfrem[dung darzus]tellen, tritt hier [ebendassel]be ein, an die Stelle der Entwicklung aller [rein empir]ischen Verhältnisse den [bloßen Gedanke]n der Entfremdung, [ des Fremde]n, des Heiligen zu [setzen.] [Die] Unterschiebung der Kategorie [der Ent]fremdung (wieder einer Reflexionsbestimmung, die als Gegensatz, Unterschied, Nichtidentität pp. gefaßt werden kann) erhält darin ihren letzten und höchsten Ausdruck, daß "das Fremde" wieder in "das Heilige", die Entfremdung in das Verhältnis von Ich zu irgendeiner beliebigen Sache als dem Heiligen verwandelt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 262-263
- id: NT3.52.5
  kind: p
  original: Wir ziehen vor, den logischen Prozeß an Sankt Sanchos Verhältnis zum Heiligen zu verdeutlichen, da dies die vorherrschende Formel ist, und bemerken nebenbei, daß "das Fremde" auch als "das Bestehende " (per appos[itionem]), das, was ohne Mich besteht, das unabhängig von Mir Bestehende, per appos., das durch Meine Unselbständigkeit Selbständige gefaßt wird, so daß Sankt Sancho also Alles, was unabhängig von ihm besteht, z.B. den Blocksberg, als das Heilige schildern kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: NT3.53.1
  kind: p
  original: Weil das Heilige etwas Fremdes ist, wird jedes Fremde in das Heilige, weil jedes Heilige ein Band, eine Fessel ist, wird jedes Band, jede Fessel in das Heilige verwandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: NT3.53.2
  kind: p
  original: Hiermit hat Sankt Sancho schon das gewonnen, daß ihm alles Fremde zu einem bloßen Scheine, einer bloßen Vorstellung wird, von der er sich einfach dadurch befreit, daß er gegen sie protestiert und erklärt, daß er diese Vorstellung nicht habe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: NT3.53.3
  kind: p
  original: Gerade wie wir beim mit sich uneinigen Egoisten sahen, daß die Menschen bloß ihr Bewußtsein zu ändern haben, um Alles in der Welt all right zu machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: NT3.54.1
  kind: p
  original: Unsere ganze Darstellung hat gezeigt, wie Sankt Sancho alle wirklichen Verhältnisse dadurch kritisiert, daß er sie für "das Heilige" erklärt, und sie dadurch bekämpft, daß er seine heilige Vorstellung von ihnen bekämpft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: NT3.54.2
  kind: p
  original: Dies einfache Kunststück, Alles in das Heilige zu verwandeln, kam, wie wir schon oben weitläuftig sahen, dadurch zustande, daß Jacques le bonhomme die Illusionen der Philosophie auf guten Glauben akzeptierte, den ideologischen, spekulativen Ausdruck der Wirklichkeit, getrennt von seiner empirischen Basis, für die Wirklichkeit selber nahm, ebenso die Illusionen der Klein[bürger über] die Bourgeoisie für das "[heilige Wesen" der] Bourgeoisie versah und daher sich einbilden konnte, es nur mit Gedanken und Vorstellungen zu tun zu haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: NT3.54.3
  kind: p
  original: Nicht minder leicht verwandelten sich auch die Menschen in "Heilige"', indem sie, nachdem ihre Gedanken von ihnen und ihren empirischen Verhältnissen getrennt waren, nun als bloße Gefäße dieser Gedanken gefaßt werden konnten und so z.B. aus dem Bourgeois der heilige Liberale gemacht wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: NT3.55.1
  kind: p
  original: Die positive Beziehung des in letzter Instanz [gläubigen Sancho] zum Heiligen ([von ihm] Respekt genannt), figuriert auch [unter dem] Namen "Liebe".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: NT3.55.2
  kind: p
  original: '"Liebe" [heißt das] anerkennende Verhältnis zu " dem [Menschen",] Heiligen, Ideal, höheren Wesen, oder ein solches menschliches, heiliges, ideales, wesentliches Verhältnis.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 263-264
- id: NT3.55.3
  kind: p
  original: Was also sonst als Dasein des Heiligen ausgedrückt wird, z.B. Staat, Gefängnisse, Tortur, Polizei, Handel und Wandel pp., kann von Sancho auch als "anderes Beispiel" der "Liebe" gefaßt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: NT3.55.4
  kind: p
  original: Diese neue Nomenklatur befähigt ihn, neue Kapitel über das zu machen, was er schon unter der Firma des Heiligen und des Respekts perhorresziert hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: NT3.55.5
  kind: p
  original: Es ist die alte Geschichte von den Ziegen der Schäferin Torralva in ihrer heiligen Gestalt, womit er, wie damals seinen Herrn, jetzt sich und das Publikum das ganze Buch durch an der Nase herumführt, ohne sie indes so geistreich abzubrechen wie vorzeiten, da er noch profaner Schildknapp war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: NT3.55.6
  kind: p
  original: Überhaupt hat Sancho seit seiner Kanonisation allen seinen ursprünglichen Mutterwitz verloren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: NT3.56.1
  kind: p
  original: Die erste Schwierigkeit scheint dadurch hereinzukommen, daß dies Heilige in sich sehr verschieden ist und so auch bei der Kritik eines bestimmten Heiligen die Heiligkeit außer Augen gesetzt und der bestimmte Inhalt selbst kritisiert werden müßte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: NT3.56.2
  kind: p
  original: Sankt Sancho umgeht diese Klippe dadurch, daß er alles Bestimmte nur als Ein "Beispiel" des Heiligen anführt; gerade wie es in der Hegelschen Logik gleichgültig ist, ob zur Erläuterung des "Fürsichseins" das Atom oder die Person, als Beispiel der Attraktion das Sonnensystem, der Magnetismus oder die Geschlechtsliebe angeführt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: NT3.56.3
  kind: p
  original: Wenn "das Buch" von Beispielen wimmelt, so ist das also keineswegs zufällig, sondern im innersten Wesen der darin vor sich gehenden Entwicklungsmethode begründet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: NT3.56.4
  kind: p
  original: Es ist die "einzige" Möglichkeit für Sankt Sancho, einen Schein von Inhalt hereinzubringen, wie dies schon bei Cervantes prototypisch sich findet, da Sancho ebenfalls stets in Beispielen redet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: NT3.56.5
  kind: p
  original: 'So kann Sancho denn sagen: "Ein anderes Beispiel des Heiligen" (Uninteressanten) "ist die Arbeit."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: NT3.56.6
  kind: p
  original: 'Er konnte fortfahren: ein anderes Beispiel ist der Staat, ein anderes Beispiel ist die Familie, ein anderes Beispiel die Grundrente, ein anderes Beispiel St. Jacobus (Saint-Jacques, le bonhomme), ein anderes Beispiel die heilige Ursula und ihre elftausend Jungfrauen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: NT3.56.7
  kind: p
  original: Alle diese Dinge haben nun zwar in seiner Vorstellung das gemein, daß sie "das Heilige" sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: NT3.56.8
  kind: p
  original: Aber sie sind zugleich total voneinander verschiedene Dinge, und eben das macht ihre Bestimmtheit aus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: NT3.56.9
  kind: p
  original: '[Soweit über] sie in ihrer Bestimmtheit [gesprochen] wird, wird über sie, insofern [sie nicht "]das Heilige" sind, gesprochen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: NT3.57.1
  kind: p
  original: '[Die Arbeit is]t nicht die Grundrente, und [die Grundrente] ist nicht der Staat; [es kommt] also darauf an, zu bestimmen, [inwiefern] Staat, Grundrente, Arbeit sind, abge[sehen von] ihrer vorgestellten Heilig[keit, und San]kt Max macht das nun so: [Er tut, als] spräche er vom Staat, [der Arbeit] etc., bezeichnet dann ["den" Staat] als die Wirklichkeit irgend[einer Ide]e, der Liebe, des Füreinan[derseins, d]es Bestehenden, des über die [Einzelnen] Mächtigen und, vermittelst [eines Gedan]kenstrichs - "des Heiligen", [was er von vornherein hätte sagen [können].'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 264-265
- id: NT3.57.2
  kind: p
  original: Oder über die Arbeit wird [gesagt, si]e gelte als Lebensaufgabe, Be[ruf, B]estimmung - "das Heilige".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: NT3.57.3
  kind: p
  original: D.h., Staat und Arbeit werden erst unter eine schon vorher in derselben Weise zurechtgemachte, besondere Art des Heiligen subsumiert und dies besondre Heilige dann wieder in das allgemeine "Heilige" aufgelöst; was Alles geschehen kann, ohne über die Arbeit und den Staat irgend etwas zu sagen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: NT3.57.4
  kind: p
  original: Derselbe ausgekaute Kohl kann nun bei jeder Gelegenheit wiedergekäut werden, indem Alles, was scheinbar der Gegenstand der Kritik ist, unsrem Sancho nur zum Vorwande dient, die abstrakten Ideen und in Subjekte verwandelten Prädikate (die nichts andres sind als das assortierte Heilige und von denen stets ein hinreichendes Lager gehalten wird) für das zu erklären, wozu sie schon im Anfange gemacht waren, für das Heilige.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: NT3.57.5
  kind: p
  original: Er hat in der Tat Alles auf den erschöpfenden, klassischen Ausdruck reduziert, wenn er von ihm ausgesagt hat, daß es "ein anderes Beispiel des Heiligen" sei.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: NT3.57.6
  kind: p
  original: Die Bestimmungen, die vom Hörensagen hereinkommen und sich auf den Inhalt beziehen sollen, sind ganz überflüssig, und bei ihrer näheren Betrachtung ergibt sich dann auch, daß sie weder eine Bestimmung noch einen Inhalt hereinbringen und sich auf unwissende Abgeschmacktheiten reduzieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: NT3.57.7
  kind: p
  original: Diese wohlfeile "Virtuosität im Denken", von der nicht zu sagen wäre, mit welchem Gegenstande sie nicht fertig ist, schon ehe sie ihn kennt, kann sich natürlich Jeder, nicht wie vorher in zehn, sondern in fünf Minuten aneignen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: NT3.57.8
  kind: p
  original: Sankt Sancho bedroht uns im Kommentar mit "Abhandlungen" über Feuerbach, den Sozialismus, die bürgerliche Gesellschaft und das Heilige weiß worüber noch sonst Alles.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: NT3.57.9
  kind: p
  original: 'Diese Abhandlungen können schon vorläufig hier auf ihren einfachsten Ausdruck folgendermaßen reduziert werden:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: NT3.58.1
  kind: p
  original: 'Erste Abhandlung: Ein anderes Beispiel des Heiligen ist Feuerbach.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: NT3.58.2
  kind: p
  original: 'Zweite Abhandlung: Ein anderes Beispiel des Heiligen ist der Sozialismus.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: NT3.58.3
  kind: p
  original: 'Dritte Abhandlung: Ein anderes Beispiel des Heiligen ist die bürgerliche Gesellschaft.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: NT3.58.4
  kind: p
  original: 'Vierte Abhandlung: Ein anderes Beispiel des Heiligen ist die verstirnerte "Abhandlung".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: NT3.59.1
  kind: p
  original: usw. in infinitum <ins Unendliche>.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: NT3.60.1
  kind: p
  original: Die zweite Klippe, woran Sankt Sancho bei einiger Überlegung notwendig scheitern mußte, ist seine eigne Behauptung, daß jedes Individuum ein von allen Andern total verschiedenes, einziges ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 265-266
- id: NT3.60.2
  kind: p
  original: Da jedes Individuum ein durchaus Andres, also das Andere ist, so braucht das, was für das Eine Individuum ein Fremdes, Heiliges ist, es keineswegs für das andre Individuum zu sein, kann es sogar nicht sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '266'
- id: NT3.60.3
  kind: p
  original: Und der gemeinsame Name, wie Staat, Religion, Sittlichkeit etc. darf uns nicht täuschen, da diese Namen nur Abstraktionen von dem wirklichen Verhalten der einzelnen Individuen sind und diese Gegenstände durch das total verschiedene Verhalten der einzigen Individuen gegen sie für jedes derselben einzige Gegenstände werden, also total verschiedene Gegenstände, die nur den Namen miteinander gemein haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '266'
- id: NT3.60.4
  kind: p
  original: 'Sankt Sancho hätte also höchstens sagen dürfen: Der Staat, die Religion pp. sind Mir, Sankt Sancho, das Fremde, das Heilige.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '266'
- id: NT3.60.5
  kind: p
  original: Statt dessen müssen sie bei ihm absolut Heilige, das für alle Individuen Heilige sein - wie hätte er sonst auch sein konstruiertes Ich, seinen mit sich einigen Egoisten etc. fabrizieren, wie hätte er sonst überhaupt sein ganzes "Buch" schreiben können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '266'
- id: NT3.60.6
  kind: p
  original: Wie wenig ihm überhaupt einfällt, jeden "Einzigen" zum Maßstab seiner eignen "Einzigkeit" zu machen, wie sehr er seine "Einzigkeit" als Maßstab, als moralische Norm an alle andern Individuen legt und sie als echter Moralist in sein Prokrustesbett wirft, geht schon unter anderm aus seinem Urteil über den selig verschollenen Klopstock hervor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '266'
- id: NT3.60.7
  kind: p
  original: 'Diesem hält er die sittliche Maxime entgegen: er hätte sich "ganz eigen gegen die Religion verhalten" sollen, wo er dann nicht, wie der richtige Schluß wäre (ein Schluß, den "Stirner" unzählige Male, z.B. beim Geld, selbst macht), eine eigne Religion, sondern eine "Auflösung und Verzehrung der Religion" (p 85), ein allgemeines statt eines eignen, einzigen Resultats erhalten hätte.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '266'
- id: NT3.60.8
  kind: p
  original: Und als ob Klopstock nicht auch "Auflösung und Verzehrung der Religion" erhalten hätte, und zwar eine ganz eigne, einzige Auflösung, wie sie nur dieser einzige Klopstock "prästieren" konnte, eine Auflösung, deren Einzigkeit "Stirner" schon aus den vielen mißlungenen Nachahmungen ersehen konnte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '266'
- id: NT3.60.9
  kind: p
  original: Klopstocks Verhalten zur Religion soll kein "eignes" gewesen sein, obgleich es ein ganz eigentümliches, und zwar ein den Klopstock zum Klopstock machendes Verhalten zur Religion war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '266'
- id: NT3.60.10
  kind: p
  original: '"Eigen" würde er sich erst zu ihr verhalten haben, wenn er sich nicht als Klopstock, sondern als moderner deutscher Philosoph zu ihr verhalten hätte.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '266'
- id: NT3.61.1
  kind: p
  original: 'Der "Egoist im gewöhnlichen Verstande", der nicht so folgsam ist wie Szeliga und schon oben allerlei Einwendungen zu machen hatte, wirft unsrem Heiligen hier folgendes ein: Ich gehe hier in der Wirklichkeit, und das weiß ich sehr wohl - rien pour la gloire <nicht um des Ruhmes willen> - auf meinen Vorteil, auf weiter Nichts aus.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 266-267
- id: NT3.61.2
  kind: p
  original: Außerdem macht es mir Spaß, mir auch noch Vorteil im Himmel, mich unsterblich zu denken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.3
  kind: p
  original: Soll ich diese egoistische Vorstellung aufopfern dem bloßen Bewußtsein des mit sich einigen Egoismus, das mir keinen Pfennig einbringt, zuliebe?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.4
  kind: p
  original: 'Die Philosophen sagen mir: Das sei unmenschlich.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.5
  kind: p
  original: Was schert das mich?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.6
  kind: p
  original: Bin ich nicht ein Mensch?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.7
  kind: p
  original: Ist nicht Alles Menschlich, was ich tue und weil ich's tue, und kümmert's mich überhaupt, wie "Andre" meine Handlungen "rubrizieren"?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.8
  kind: p
  original: Du, Sancho, der Du zwar auch ein Philosoph, aber ein bankrutter Philosoph bist und schon wegen Deiner Philosophie keinen pekuniären und wegen deines Bankrutts keinen Gedankenkredit verdienst, sagst mir, ich verhalte mich nicht eigen zur Religion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.9
  kind: p
  original: Du sagst mir also dasselbe, was die andern Philosophen sagen, nur daß es bei Dir, wie gewöhnlich, allen Sinn verliert, indem Du "eigen" nennst, was sie "menschlich" nennen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.10
  kind: p
  original: Könntest Du sonst von einer andern Eigenheit als von Deiner eignen sprechen und das eigne Verhalten wieder in ein allgemeines verwandeln?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.11
  kind: p
  original: Ich verhalte mich, wenn Du willst, auch in meiner Weise kritisch zur Religion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.12
  kind: p
  original: Einmal zaudre ich gar nicht, sie aufzuopfern, sobald sie in meinen Commerce <Handel> störend eingreifen will, dann dient es mir in meinen Geschäften, wenn ich für religiös gelte (wie es meinem Proletarier dient, wenn er den Kuchen, den ich hier esse, wenigstens im Himmel ißt), und endlich mache ich den Himmel zu meinem Eigentum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.13
  kind: p
  original: Er ist une propriété ajoutée à la propriété <ein zum Eigentum hizugefügtes Eigentum>, obgleich schon Montesquieu, der doch ein ganz andrer Kerl war als Du, mir weismachen wollte, er sei une terreur ajoutée à la terreur <ein zum Schrecken hinzugefügter Schrecken>.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.14
  kind: p
  original: Wie ich mich zu ihm verhalte, so verhält sich kein andrer zu ihm, und durch dies einzige Verhältnis, welches ich mit ihm kontrahiere, ist er ein einziger Gegenstand, ein einziger Himmel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.15
  kind: p
  original: Du kritisierst also höchstens Deine Vorstellung von meinem Himmel, nicht meinen Himmel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.16
  kind: p
  original: Und nun gar die Unsterblichkeit!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.17
  kind: p
  original: Da wirst Du mir lächerlich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.18
  kind: p
  original: Ich verleugne meinen Egoismus, wie Du den Philosophen zulieb behauptest, weil ich ihn verewige und die Natur- und Denkgesetze für null und nichtig erkläre, sobald sie Meiner Existenz eine Bestimmung, die nicht von mir selbst produziert, mir höchst unangenehm ist, nämlich den Tod, setzen wollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.19
  kind: p
  original: Du nennst die Unsterblichkeit eine "leidige Stabilität" - als ob ich nicht fortwährend ein "bewegtes" Leben führen könnte, solange im Diesseits oder Jenseits der Handel gut geht und ich in andern Dingen als Deinem "Buch" machen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.20
  kind: p
  original: Und was kann "stabiler" sein als der Tod, der meiner Bewegung wider meinen Willen ein Ende macht und mich in das Allgemeine, die Natur, die Gattung, in das - Heilige versenkt?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: NT3.61.21
  kind: p
  original: Und nun gar Staat, Gesetz, Polizei!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 267-268
- id: NT3.61.22
  kind: p
  original: Die mögen für manches "Ich" als fremde Mächte erscheinen; ich weiß, daß sie meine eignen Mächte sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: NT3.61.23
  kind: p
  original: Übrigens - und hiermit kehrt der Bourgeois, diesmal mit gnädigem Kopfnicken, unsrem Heiligen wieder den Rücken - poltre meinetwegen nur fort gegen Religion, Himmel, Gott u. dgl.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: NT3.61.24
  kind: p
  original: Ich weiß doch, daß Du in Allem, was in meinem Interesse liegt, Privateigentum, Wert, Preis, Geld, Kauf und Verkauf, immer das "Eigne" siehst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: NT3.62.1
  kind: p
  original: Wir haben eben gesehen, wie die Individuen unter sich verschieden sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: NT3.62.2
  kind: p
  original: Jedes Individuum ist aber wieder in sich selbst verschieden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: NT3.62.3
  kind: p
  original: So kann Sankt Sancho, indem er sich in irgendeiner dieser Eigenschaften reflektiert, d.h. sich als "Ich" in einer dieser Bestimmtheiten faßt, bestimmt, den Gegenstand der andern Eigenschaften und diese andern Eigenschaften selbst als das Fremde, das Heilige bestimmen, und so der Reihe nach mit allen seinen Eigenschaften.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: NT3.62.4
  kind: p
  original: So z.B. was Gegenstand für sein Fleisch, ist das Heilige für seinen Geist, oder was Gegenstand für sein Bedürfnis des Ausruhens, ist das Heilige für sein Bedürfnis der Bewegung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: NT3.62.5
  kind: p
  original: Auf diesen, Kunstgriff beruht seine obige Verwandlung alles Tuns und Nichttuns in Selbstverleugnung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: NT3.62.6
  kind: p
  original: Übrigens ist sein Ich kein wirkliches Ich, sondern nur das Ich der obigen Gleichungen, dasselbe Ich, das in der formellen Logik bei der Lehre von den Urteilen als Cajus figuriert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: NT3.63.1
  kind: p
  original: '"Ein anderes Beispiel", nämlich ein allgemeineres Beispiel von der Kanonisation der Welt ist die Verwandlung praktischer Kollisionen, d.h. Kollisionen der Individuen mit ihren praktischen Lebensbedingungen, in ideelle Kollisionen, d.h. in Kollisionen dieser Individuen mit Vorstellungen, die sie sich machen oder sich in den Kopf setzen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: NT3.63.2
  kind: p
  original: Dies Kunststück ist wieder sehr einfach.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: NT3.63.3
  kind: p
  original: Wie Sankt Sancho früher schon die Gedanken der Individuen verselbständigte, so trennt er hier das ideelle Spiegelbild der wirklichen Kollisionen von diesen Kollisionen und verselbständigt es.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: NT3.63.4
  kind: p
  original: Die wirklichen Widersprüche, in denen sich das Individuum befindet, werden verwandelt in Widersprüche des Individuums mit seiner Vorstellung, oder, wie Sankt Sancho es auch einfacher ausdrückt, mit der Vorstellung, dem Heiligen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: NT3.63.5
  kind: p
  original: Hierdurch bringt er es zustande, die wirkliche Kollision, das Urbild ihres ideellen Abbildes, in eine Konsequenz dieses ideologischen Scheins zu verwandeln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: NT3.63.6
  kind: p
  original: So kommt er zu dem Resultat, daß es sich nicht um praktische Aufhebung der praktischen Kollision, sondern bloß um das Aufgeben der Vorstellung von dieser Kollision handelt, ein Aufgeben, wozu er die Menschen als guter Moralist dringend auffordert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: NT3.64.1
  kind: p
  original: Nachdem Sankt Sancho so die sämtlichen Widersprüche und Kollisionen, in denen sich ein Individuum befindet, in bloße Widersprüche und Kollisionen dieses Individuums mit einer seiner Vorstellungen verwandelt hat, die sich von ihm unabhängig gemacht und es sich unterworfen hat, daher sich "leicht" in die Vorstellung, die heilige Vorstellung, das Heilige verwandelt, bleibt also dem Individuum nur noch das Eine zu tun übrig, daß es die Sünde wider den heiligen Geist begehe, von dieser Vorstellung abstrahiert und das Heilige für ein Gespenst erklärt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 268-269
- id: NT3.64.2
  kind: p
  original: Diese logische Prellerei, welche das Individuum mit sich selbst vornimmt, gilt unsrem Heiligen für einen der höchsten Efforts des Egoisten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '269'
- id: NT3.64.3
  kind: p
  original: Andrerseits wird aber Jeder einsehen, wie leicht es ist, auf diese Weise alle vorkommenden geschichtlichen Konflikte und Bewegungen vom egoistischen Standpunkte aus für untergeordnet zu erklären, ohne etwas von ihnen zu wissen, indem man nämlich nur einige der dabei vorkommenden Redensarten herauszunehmen, auf die angegebne Weise in "das Heilige" zu verwandeln, die Individuen als unterjocht von diesem Heiligen darzustellen und sich dann als Verächter "des Heiligen als solchen" auch hiergegen geltend zu machen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '269'
- id: NT3.65.1
  kind: p
  original: Eine weitere Verzweigung dieses logischen Kunststücks, und zwar das Lieblingsmanöver unsres Heiligen, ist die Exploitation der Worte Bestimmung, Beruf, Aufgabe pp., wodurch es ihm unendlich erleichtert wird, Alles Beliebige in das Heilige zu verwandeln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '269'
- id: NT3.65.2
  kind: p
  original: Im Beruf, Bestimmung, Aufgabe pp. erscheint nämlich das Individuum in seiner eignen Vorstellung als ein Anderes, als was es wirklich ist, als das Fremde, also das Heilige, und macht seine Vorstellung von dem, was es sein soll, als das Berechtigte, das Ideale, das Heilige, seinem wirklichen Sein gegenüber geltend.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '269'
- id: NT3.65.3
  kind: p
  original: 'So kann Sankt Sancho, wo es ihm darauf ankommt, durch folgende Appositionsreihe Alles in das Heilige verwandeln: Sich bestimmen, d.h. sich eine Bestimmung (setze hier einen beliebigen Inhalt herein) setzen, sich die Bestimmung als solche setzen, sich die heilige Bestimmung setzen, sich die Bestimmung als das Heilige, d.h. das Heilige als die Bestimmung setzen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '269'
- id: NT3.65.4
  kind: p
  original: 'Oder: Bestimmt sein, d.h. eine Bestimmung haben, die Bestimmung haben, die heilige Bestimmung, die Bestimmung als das Heilige, das Heilige als die Bestimmung, das Heilige zur Bestimmung, die Bestimmung des Heiligen haben.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '269'
- id: NT3.66.1
  kind: p
  original: 'Jetzt braucht er natürlich nichts mehr zu tun, als die Menschen kräftiglich zu vermahnen, sich die Bestimmung der Bestimmungslosigkeit, den Beruf der Berufslosigkeit, die Aufgabe der Aufgabenlosigkeit zu setzen - obgleich er im ganzen "Buche" "bis hinab zum" Kommentar Nichts tut, als den Menschen lauter Bestimmungen zu setzen, Aufgaben zu stellen und sie als Prediger in der Wüste zum Evangelium des wahren Egoismus zu berufen, von dem es allerdings heißt: Alle sind berufen, aber nur Einer - O''Connell - ist auserwählt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '269'
- id: NT3.67.1
  kind: p
  original: Wir sahen bereits oben, wie Sankt Sancho die Vorstellungen der Individuen von ihren Lebensverhältnissen, ihren praktischen Kollisionen und Widersprüchen trennt, um sie dann in das Heilige zu verwandeln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: NT3.67.2
  kind: p
  original: Hier nun erscheinen diese Vorstellungen in der Form der Bestimmung, des Berufs, der Aufgabe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: NT3.67.3
  kind: p
  original: Der Beruf hat bei Sankt Sancho eine doppelte Gestalt; zuerst als Beruf, den Mir Andre setzen, wovon wir schon oben bei den Zeitungen, die von Politik strotzen, und bei den Gefängnissen, die unser Heiliger für Sittenverbesserungshäuser versah, Exempel hatten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - NT3.N1
  mew_page: '270'
- id: NT3.67.4
  kind: p
  original: Sodann erscheint der Beruf noch als ein Beruf, an den das Individuum selber glaubt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: NT3.67.5
  kind: p
  original: Wenn das Ich aus allen seinen empirischen Lebensverhältnissen, aus seiner Tätigkeit, seinen Existenzbedingungen losgerissen, von der ihm zugrunde liegenden Welt und von seinem eignen Leib getrennt wird, so hat es freilich keinen andern Beruf und keine andre Bestimmung als den Cajus der logischen Urteile zu repräsentieren und Sankt Sancho zu den obigen Gleichungen zu verhelfen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: NT3.67.6
  kind: p
  original: In der Wirklichkeit dagegen, wo die Individuen Bedürfnisse haben, haben sie schon hierdurch einen Beruf und eine Aufgabe, wobei es zunächst noch gleichgültig ist, ob sie diesen auch in der Vorstellung zu ihrem Beruf machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: NT3.67.7
  kind: p
  original: Es versteht sich indes, daß die Individuen, weil sie Bewußtsein haben, sich von diesem ihnen durch ihr empirisches Dasein gegebenen Beruf auch eine Vorstellung machen und dadurch Sankt Sancho Gelegenheit bieten, sich an das Wort "Beruf", an den Vorstellungsausdruck ihrer wirklichen Lebensbedingungen festzuklammern und diese Lebensbedingungen selbst außer Augen zu lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: NT3.67.8
  kind: p
  original: Der Proletarier z.B., der den Beruf hat, seine Bedürfnisse zu befriedigen, wie jeder andre Mensch, und der nicht einmal die ihm mit jedem andern Menschen gemeinsamen Bedürfnisse befriedigen kann, den die Notwendigkeit einer vierzehnstündigen Arbeit zu gleicher Stufe mit dem Lasttier, den die Konkurrenz zu einer Sache, einem Handelsartikel herabdrückt, der aus seiner Stellung als bloße Produktivkraft, der einzigen, die ihm übrig gelassen, durch andre gewaltigere Produktivkräfte verdrängt wird - dieser Proletarier hat schon hierdurch die wirkliche Aufgabe, seine Verhältnisse zu revolutionieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: NT3.67.9
  kind: p
  original: Er kann sich dies allerdings als seinen "Beruf" vorstellen, er kann auch, wenn er Propaganda machen will, diesen seinen "Beruf" so ausdrücken, daß es der menschliche Beruf des Proletariers sei, dies und jenes zu tun, um so mehr, da seine Stellung ihm nicht einmal die Befriedigung der aus seiner unmittelbaren menschlichen Natur hervorgehenden Bedürfnisse gestattet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 270-271
- id: NT3.67.10
  kind: p
  original: Sankt Sancho kümmert sich nicht um die dieser Vorstellung zugrunde liegende Realität, nicht um den praktischen Zweck dieses Proletariers - er hält fest an dem Wort "Beruf" und erklärt ihn für das Heilige und den Proletarier für einen Knecht des Heiligen - die leichteste Manier, sich überlegen zu wissen und "weiterzugeben".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '271'
- id: NT3.68.1
  kind: p
  original: Namentlich unter den bisherigen Verhältnissen, wo immer eine Klasse herrschte, wo die Lebensbedingungen eines Individuums stets mit denen einer Klasse zusammenfielen, wo also die praktische Aufgabe jeder neu aufkommenden Klasse jedem Individuum derselben als eine allgemeine Aufgabe erscheinen mußte und wo wirklich jede Klasse nur dadurch ihre Vorgängerin stürzen konnte, daß sie die Individuen aller Klassen von einzelnen bisherigen Fesseln befreite - namentlich unter diesen Umständen war es notwendig, daß die Aufgabe der Individuen einer zur Herrschaft strebenden Klasse als die allgemein menschliche Aufgabe dargestellt wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '271'
- id: NT3.69.1
  kind: p
  original: 'Wenn übrigens z.B. der Bourgeois dem Proletarier vorhält, Er, Proletarier, habe die menschliche Aufgabe, vierzehn Stunden täglich zu arbeiten, so hat der Proletarier ganz recht, in derselben Sprache zu antworten: seine Aufgabe sei vielmehr, das ganze Bourgeoisrégime zu stürzen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '271'
- id: NT3.70.1
  kind: p
  original: Wir haben schon zu wiederholten Malen gesehen, wie Sankt Sancho eine ganze Reihe von Aufgaben stellt, die sich alle in die schließliche, für alle Menschen existierende Aufgabe des wahren Egoismus auflösen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '271'
- id: NT3.70.2
  kind: p
  original: 'Aber selbst da, wo er nicht reflektiert, sich nicht als Schöpfer und Geschöpf weiß, bringt er es vermöge der folgenden lumpigen Distinktion zu einer Aufgabe:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '271'
- id: NT3.71.1
  kind: p
  original: 'p. 466: "Ob Du Dich mit dem Denken des weiteren befassen willst, das kommt auf Dich an.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '271'
- id: NT3.71.2
  kind: p
  original: Wenn Du es im Denken zu etwas Erheblichem bringen willst, so" (fangen die Bedingungen und Bestimmungen für Dich an) "so - - - hat also, wer denken will, allerdings eine Aufgabe, die er sich mit jenem Willen bewußt oder unbewußt setzt; aber die Aufgabe zu denken hat Keiner."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '271'
- id: NT3.72.1
  kind: p
  original: Zunächst abgesehen von dem sonstigen Inhalt dieses Satzes, ist er schon insofern selbst von Sankt Sanchos Standpunkt aus unrichtig, als der mit sich einige Egoist allerdings, er mag wollen oder nicht, die "Aufgabe" hat zu denken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '271'
- id: NT3.72.2
  kind: p
  original: Er muß denken, einerseits, um das nur durch den Geist, das Denken, zu bändigende Fleisch im Zaum zu halten, und andererseits, um seine Reflexionsbestimmung als Schöpfer und Geschöpf erfüllen zu können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '271'
- id: NT3.72.3
  kind: p
  original: Er stellt daher auch die "Aufgabe" des Sichselbsterkennens an die ganze Welt von betrogenen Egoisten - eine "Aufgabe", die ohne Denken wohl nicht auszuführen sein wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '271'
- id: NT3.73.1
  kind: p
  original: Um nun diesen Satz aus der Form der lumpigen Distinktion heraus in eine logische Form zu bringen, ist zuerst das "Erhebliche" wegzuschaffen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 271-272
- id: NT3.73.2
  kind: p
  original: Für jeden Menschen ist das "Erhebliche", wozu er es im Denken bringen will, ein verschiedenes, je nach seiner Bildungsstufe, seinen Lebensverhältnissen und seinem augenblicklichen Zweck.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
- id: NT3.73.3
  kind: p
  original: Sankt Max gibt uns hier also gar kein festes Kriterium dafür, wann die Aufgabe, die man sich mit dem Denken stellt, anfängt, wie weit man denken kann, ohne sich eine Aufgabe zu stellen - er beschränkt sich auf den relativen Ausdruck "erheblich".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
- id: NT3.73.4
  kind: p
  original: '"Erheblich" ist mir aber Alles, was mich zum Denken sollizitiert, "erheblich" Alles, worüber ich denke.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
- id: NT3.73.5
  kind: p
  original: 'Daher muß es statt: Wenn Du es im Denken zu etwas Erheblichem bringen willst, heißen: Wenn Du überhaupt denken willst.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
- id: NT3.73.6
  kind: p
  original: Dies hängt aber gar nicht von Deinem Wollen oder Nichtwollen ab, da Du Bewußtsein hast und Deine Bedürfnisse nur durch eine Tätigkeit befriedigen kannst, bei der Du auch Dein Bewußtsein anwenden mußt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
- id: NT3.73.7
  kind: p
  original: Ferner muß die hypothetische Form weggeschafft werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
- id: NT3.73.8
  kind: p
  original: '" Wenn Du denken willst " - so stellst Du Dir von vornherein die "Aufgabe" zu denken; diesen tautologischen Satz brauchte Sankt Sancho nicht so pomphaft auszuposaunen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
- id: NT3.73.9
  kind: p
  original: 'Der ganze Satz war überhaupt nur in diese Form der lumpigen Distinktion und pomphaften Tautologie gehüllt, um den Inhalt zu verdecken: Als Bestimmter, Wirklicher hast Du eine Bestimmung, eine Aufgabe, Du magst ein Bewußtsein darüber haben oder nicht.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - NT3.N2
  mew_page: '272'
- id: NT3.73.10
  kind: p
  original: Sie geht aus Deinem Bedürfnis und seinem Zusammenhang mit der vorhandenen Welt hervor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
- id: NT3.73.11
  kind: p
  original: Die eigentliche Weisheit Sanchos besteht nun darin, daß es von Deinem Willen abhängt, ob Du denkst, lebst etc., überhaupt in irgendeiner Bestimmtheit bist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
- id: NT3.73.12
  kind: p
  original: Sonst, fürchtet er, würde die Bestimmung aufhören, Deine Selbstbestimmung zu sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
- id: NT3.73.13
  kind: p
  original: Wenn Du Dein Selbst mit Deiner Reflexion oder nach Bedürfnis mit Deinem Willen identifizierst, so versteht es sich von selbst, daß in dieser Abstraktion Alles nicht Selbstbestimmung ist, was nicht durch Deine Reflexion oder Deinen Willen gesetzt ist, also auch z.B. Dein Atmen, die Zirkulation Deines Blutes, Denken, Leben pp. Bei Sankt Sancho besteht aber die Selbstbestimmung nicht einmal im Willen, sondern, wie wir beim wahren Egoisten schon sahen, in der reservatio mentalis <dem (geheimen) geistigen Vorbehalt> der Gleichgültigkeit gegen jede Bestimmtheit, eine Gleichgültigkeit, die hier als Bestimmungslosigkeit wiederkehrt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
- id: NT3.73.14
  kind: p
  original: 'In seiner "eignen" Appositionsreihe würde sich das so ausnehmen: Jedem wirklichen Bestimmen gegenüber setzt er sich die Bestimmungslosigkeit als Bestimmung, unterscheidet von sich in jedem Momente den Bestimmungslosen, ist so in jedem Momente auch ein Anderer, als er ist, eine dritte Person, und zwar der Andere schlechthin, der heilige Andere, der jeder Einzigkeit gegenüberstehende Andere, der Bestimmungslose, der Allgemeine, der Gemeine, der - Lump.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 272-273
- id: NT3.74.1
  kind: p
  original: Rettet Sankt Sancho sich vor der Bestimmung durch den Sprung in die Bestimmungslosigkeit (selbst eine Bestimmung, und zwar die allerschlechteste), so ist der praktische, moralische Gehalt dieses ganzen Kunststücks, abgesehen von dem schon oben beim wahren Egoisten Entwickelten, nur die Apologie des in der bisherigen Welt jedem Individuum aufgedrungenen Berufs.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '273'
- id: NT3.74.2
  kind: p
  original: Machen z.B. die Arbeiter in ihrer kommunistischen Propaganda geltend, es sei Beruf, Bestimmung, Aufgabe jedes Menschen, sich vielseitig, alle seine Anlagen zu entwickeln, z.B. auch die Anlage des Denkens, so sieht Sankt Sancho hierin nur den Beruf zu einem Fremden, die Geltendmachung "des Heiligen", wovon er dadurch zu befreien sucht, daß er das Individuum, wie es auf Kosten seiner selbst durch die Teilung der Arbeit zerstümmelt und unter einen einseitigen Beruf subsumiert worden ist, gegen sein eignes, ihm als Beruf von Andern ausgesprochenes Bedürfnis, anders zu werden, in Schutz nimmt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '273'
- id: NT3.74.3
  kind: p
  original: Was hier unter der Form eines Berufs, einer Bestimmung geltend gemacht wird, ist eben die Verneinung des durch die Teilung der Arbeit bisher praktisch erzeugten Berufs, des einzig wirklich existierenden Berufs - also die Verneinung des Berufs überhaupt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '273'
- id: NT3.74.4
  kind: p
  original: Die allseitige Verwirklichung des Individuums wird erst dann aufhören, als Ideal, als Beruf pp. vorgestellt zu werden, wenn der Weltanstoß, der die Anlagen der Individuen zur wirklichen Entwicklung sollizitiert, unter die Kontrolle der Individuen genommen ist, wie dies die Kommunisten wollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '273'
- id: NT3.75.1
  kind: p
  original: Schließlich hat das ganze Gekohl über den Beruf in der egoistischen Logik wieder den Beruf, die Hineinschauung des Heiligen in die Dinge möglich zu machen und zu ihrer Vernichtung zu befähigen, ohne daß man sie zu berühren braucht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '273'
- id: NT3.75.2
  kind: p
  original: Also z.B. Arbeit, Geschäftsleben pp. gelten Diesem oder Jenem für seinen Beruf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '273'
- id: NT3.75.3
  kind: p
  original: Damit werden sie die heilige Arbeit, das heilige Geschäftsleben, das Heilige.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '273'
- id: NT3.75.4
  kind: p
  original: Dem wahren Egoisten gelten sie nicht als Beruf; damit hat er die heilige Arbeit und das heilige Geschäftsleben aufgelöst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '273'
- id: NT3.75.5
  kind: p
  original: Damit bleiben sie, was sie sind, und er, was er war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '273'
- id: NT3.75.6
  kind: p
  original: 'Es fällt ihm nicht ein zu untersuchen, ob Arbeit, Geschäftsleben pp., diese Daseinsweisen der Individuen, ihrem wirklichen Inhalt und Prozeß nach nicht notwendig zu den ideologischen Vorstellungen führen, die er als selbständige Wesen bekämpft, d.h. bei ihm: kanonisiert.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '273'
- id: NT3.75.7
  kind: p
  original: Gerade wie Sankt Sancho den Kommunismus kanonisiert, um seine heilige Vorstellung von ihm nachher im Verein als "eigne" Erfindung desto besser an den Mann zu bringen, geradeso poltert er gegen "Beruf, Bestimmung, Aufgabe" nur, um sie als kategorischen Imperativ in seinem ganzen Buche zu reproduzieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: NT3.75.8
  kind: p
  original: 'Überall wo Schwierigkeiten entstehen, durchhaut Sancho sie mit einem solchen kategorischen Imperativ: "Verwerte Dich", "Erkennet Euch wieder", "Werde Jeder ein allmächtiges Ich" usw. Über den kategorischen Imperativ siehe den "Verein", über "Beruf" usw. siehe den "Selbstgenuß".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: NT3.76.1
  kind: p
  original: Wir haben jetzt die hauptsächlichsten logischen Kunststücke aufgezeigt, vermittelst deren Sankt Sancho die bestehende Welt kanonisiert und damit kritisiert und verzehrt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: NT3.76.2
  kind: p
  original: Er verzehrt wirklich nur das Heilige an der Welt, ohne sie selbst nur anzurühren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: NT3.76.3
  kind: p
  original: Daß er sich daher praktisch ganz konservativ verhalten muß, versteht sich von selbst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: NT3.76.4
  kind: p
  original: Wollte er kritisieren, so finge die profane Kritik gerade da an, wo der etwaige Heiligenschein aufhört.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: NT3.76.5
  kind: p
  original: Je mehr die normale Verkehrsform der Gesellschaft und damit die Bedingungen der herrschenden Klasse ihren Gegensatz gegen die fortgeschrittenen Produktivkräfte entwickeln, je größer daher der Zwiespalt in der herrschenden Klasse selbst und mit der beherrschten Klasse wird, desto unwahrer wird natürlich das dieser Verkehrsform ursprünglich entsprechende Bewußtsein, d.h., es hört auf, das ihr entsprechende Bewußtsein zu sein, desto mehr sinken die früheren überlieferten Vorstellungen dieser Verkehrsverhältnisse, worin die wirklichen persönlichen Interessen ppp. als allgemeine ausgesprochen werden, zu bloß idealisierenden Phrasen, zur bewußten Illusion, zur absichtlichen Heuchelei herab.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: NT3.76.6
  kind: p
  original: Je mehr sie aber durch das Leben Lügen gestraft werden und je weniger sie dem Bewußtsein selbst gelten, desto entschiedner werden sie geltend gemacht, desto heuchlerischer, moralischer und heiliger wird die Sprache dieser normalen Gesellschaft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: NT3.76.7
  kind: p
  original: Je heuchlerischer diese Gesellschaft wird, desto leichter ist es einem leichtgläubigen Mann wie Sancho, überall die Vorstellung des Heiligen, des Idealen zu entdecken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: NT3.76.8
  kind: p
  original: Aus der allgemeinen Heuchelei der Gesellschaft kann er, der Leichtgläubige, den allgemeinen Glauben an das Heilige, die Herrschaft des Heiligen, abstrahieren und dies Heilige sogar für ihr Piedestal versehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: NT3.76.9
  kind: p
  original: Er ist der Dupe <Betrogene> dieser Heuchelei, aus der er gerade das Umgekehrte hätte schließen sollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: NT3.77.1
  kind: p
  original: Die Welt des Heiligen faßt sich in letzter Instanz zusammen in " dem Menschen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: NT3.77.2
  kind: p
  original: Wie wir schon im ganzen Alten Testament sahen, legt er " den Menschen" der ganzen bisherigen Geschichte als tätiges Subjekt unter; im Neuen Testament dehnt er diese Herrschaft " des Menschen" auf die ganze vorhandene, gegenwärtige physische und geistige Welt, wie auf die Eigenschaften der jetzt existierenden Individuen aus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 274-275
- id: NT3.77.3
  kind: p
  original: Alles ist " des Menschen", und somit die Welt in "die Welt des Menschen" verwandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: NT3.77.4
  kind: p
  original: Das Heilige als Person ist " der Mensch", der bei ihm nur ein anderer Name für den Begriff, die Idee ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: NT3.77.5
  kind: p
  original: Die von den wirklichen Dingen getrennten Vorstellungen und Ideen der Menschen müssen natürlich auch nicht die wirklichen Individuen, sondern das Individuum der philosophischen Vorstellung, das von seiner Wirklichkeit getrennte, bloß gedachte Individuum, " den Menschen" als solchen, den Begriff des Menschen zu ihrer Grundlage haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: NT3.77.6
  kind: p
  original: Darin vollendet sich sein Glaube an die Philosophie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: NT3.78.1
  kind: p
  original: Jetzt, nachdem Alles in "das Heilige" oder in das, was " des Menschen" ist, verwandelt ist, kann unser Heiliger dadurch zur Aneignung weitergehen, daß er die Vorstellung vom "Heiligen" oder vom "Menschen" als einer über ihm stehenden Macht aufgibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: NT3.78.2
  kind: p
  original: Dadurch, daß das Fremde in das Heilige, in eine bloße Vorstellung, verwandelt worden ist, ist natürlich diese Vorstellung von dem Fremden, die er für das wirkliche Fremde versieht, sein Eigentum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: NT3.78.3
  kind: p
  original: Die Grundformeln zur Aneignung der Welt des Menschen (die Manier, wie das Ich nun Besitz von der Welt ergreift, nachdem es keinen Respekt mehr vor dem Heiligen hat) liegen schon in den obigen Gleichungen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: NT3.79.1
  kind: p
  original: Herr über seine Eigenschaften ist Sankt Sancho, wie wir sahen, bereits als mit sich einiger Egoist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: NT3.79.2
  kind: p
  original: Um Herr über die Welt zu werden, hat er nichts zu tun, als sie zu seiner Eigenschaft zu machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: NT3.79.3
  kind: p
  original: Die einfachste Weise, dies zu tun, ist, daß er die Eigenschaft "des Menschen" mit dem ganzen Unsinn, der darin liegt, direkt als seine Eigenschaft ausspricht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: NT3.79.4
  kind: p
  original: So vindiziert er sich z.B. als die Eigenschaft des Ich den Unsinn der allgemeinen Menschenliebe, indem er behauptet, "Jeden" zu lieben (p. 387), und zwar mit dem Bewußtsein des Egoismus, weil "die Liebe ihn glücklich macht".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: NT3.79.5
  kind: p
  original: 'Wer ein so glückliches Naturell hat, der gehört freilich zu denen, von welchen es heißt: Wehe Euch, so Ihr Einen dieser Kleinen ärgert!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: NT3.80.1
  kind: p
  original: Die zweite Methode ist die, daß Sankt Sancho Etwas als seine Eigenschaft konservieren will, während er dasselbe, wenn es ihm ganz notwendig als Verhältnis erscheint, in ein Verhältnis, eine Daseinsweise " des Menschen", ein heiliges Verhältnis verwandelt und damit zurückstößt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: NT3.80.2
  kind: p
  original: Dies tut Sankt Sancho selbst da, wo die Eigenschaft, getrennt von dem Verhältnis, durch welches sie realisiert wird, sich in reinen Unsinn auflöst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: NT3.80.3
  kind: p
  original: So will er z.B. p. 322 Nationalstolz beibehalten, indem er "die Nationalität für seine Eigenschaft, die Nation für seine Eignerin und Herrin erklärt".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: NT3.80.4
  kind: p
  original: 'Er könnte fortfahren: Die Religiosität ist Meine Eigenschaft, sie aufzugeben als Meine Eigenschaft, das sei ferne von Mir - die Religion ist Meine Herrin, das Heilige.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 275-276
- id: NT3.80.5
  kind: p
  original: Die Familienliebe ist Meine Eigenschaft, die Familie Meine Herrin.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: NT3.80.6
  kind: p
  original: Die Rechtlichkeit ist Meine Eigenschaft, das Recht Mein Herr, das Politisieren ist Meine Eigenschaft, der Staat Mein Herr.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: NT3.81.1
  kind: p
  original: Die dritte Weise der Aneignung wird dann angewandt, wenn er eine fremde Macht, deren Druck er praktisch empfindet, ganz und gar als heilig verwirft, ohne sie sich anzueignen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: NT3.81.2
  kind: p
  original: In diesem Falle sieht er in der fremden Macht seine eigne Ohnmacht und erkennt diese als seine Eigenschaft, sein Geschöpf an, über das er in jedem Moment als Schöpfer hinaus ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: NT3.81.3
  kind: p
  original: Dies ist der Fall z.B. mit dem Staat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: NT3.81.4
  kind: p
  original: Auch hier kommt er glücklich dahin, es mit keinem Fremden, sondern nur mit seiner eignen Eigenschaft zu tun zu haben, gegen die er sich nur als Schöpfer zu setzen braucht, um sie zu überwinden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: NT3.81.5
  kind: p
  original: Der Mangel einer Eigenschaft gilt ihm also im Notfall auch für seine Eigenschaft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: NT3.81.6
  kind: p
  original: Wenn Sankt Sancho verhungert, so ist nicht der Mangel an Nahrungsmitteln die Ursache davon, sondern Sein eignes Hungerhaben, seine eigne Eigenschaft des Hungerns.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: NT3.81.7
  kind: p
  original: Wenn er aus seinem Fenster fällt und den Hals bricht, so geschieht dies nicht, weil die Macht der Schwere ihn herab stürzt, sondern weil der Mangel an Flügeln, die Ohnmacht zu fliegen, seine eigne Eigenschaft ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: NT3.82.1
  kind: p
  original: Die vierte Methode, die er mit dem brillantesten Erfolg anwendet, ist die, Alles, was Gegenstand Einer seiner Eigenschaften ist, als seinen Gegenstand, für sein Eigentum zu erklären, weil er sich vermöge einer seiner Eigenschaften darauf bezieht, gleichviel, wie diese Beziehung auch immer beschaffen sei.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: NT3.82.2
  kind: p
  original: 'Also was man bisher Sehen, Hören, Fühlen pp. nannte, nennt dieser harmlose Akkapareur <wörtlich: wucherischer Aufkäufer; dem Sinne nach: einer der alles an sich reißt> Sancho: Eigentum erwerben.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: NT3.82.3
  kind: p
  original: Der Laden, den ich ansehe, ist als Erblickter der Gegenstand meines Auges, und sein Reflex auf meiner Retina ist das Eigentum meines Auges.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: NT3.82.4
  kind: p
  original: Nun wird der Laden außer der Beziehung zum Auge sein Eigentum und nicht nur das Eigentum seines Auges - sein Eigentum, das geradeso auf dem Kopfe steht wie das Bild des Ladens auf seiner Retina.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: NT3.82.5
  kind: p
  original: Läßt der Ladenhüter das Rouleau (oder nach Szeliga "Gardinen und Vorhänge") herunter, so hört sein Eigentum auf, und er behält, wie der bankrutte Bourgeois, nur noch die schmerzliche Erinnerung vergangenen Glanzes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: NT3.82.6
  kind: p
  original: Geht "Stirner" an der Hofküche vorbei, so erwirbt er sich allerdings ein Eigentum an dem Geruch der Fasanen, die dort gebraten werden, aber die Fasanen selbst bekommt er nicht einmal zu sehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: NT3.82.7
  kind: p
  original: Das einzige nachhaltige Eigentum, was ihm dabei zuteil wird, ist ein mehr oder weniger lautes Knurren in seinem Magen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: NT3.82.8
  kind: p
  original: Übrigens hängt es nicht nur von dem vorhandenen Weltzustand ab, den er keineswegs gemacht hat, was und wieviel er zu sehen bekommt, sondern auch von seinem Beutel und von seiner ihm durch die Teilung der Arbeit zugefallenen Lebensstellung, die ihm vielleicht sehr viel verschließt, obgleich er sehr akkaparierende Augen und Ohren haben mag.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 276-277
- id: NT3.83.1
  kind: p
  original: Hätte Sankt Sancho schlecht und recht gesagt, daß Alles was Gegenstand seiner Vorstellung ist, als von ihm vorgestellter Gegenstand, d.h. als seine Vorstellung von einem Gegenstande, seine Vorstellung, id est sein Eigentum ist, (ebenso mit dem Anschauen pp.), so würde man nur die kindliche Naivetät des Mannes bewundert haben, der an einer solchen Trivialität einen Fund und ein Vermögen erbeutet zu haben glaubt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '277'
- id: NT3.83.2
  kind: p
  original: Daß er aber diesem spekulativen Eigentum das Eigentum schlechthin unterschiebt, mußte natürlich eine große Magie auf die eigentumslosen deutschen Ideologen ausüben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '277'
- id: NT3.84.1
  kind: p
  original: Sein Gegenstand ist auch jeder andere Mensch in seinem Bereich, "und als sein Gegenstand - sein Eigentum", seine Kreatur.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '277'
- id: NT3.84.2
  kind: p
  original: 'Jedes der Ichs sagt zu dem andern (siehe p. 184): "Mir bist Du nur Dasjenige, was Du für Mich bist" z.B. mein Exploiteur), "nämlich Mein Gegenstand, und weil Mein Gegenstand, Mein Eigentum."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '277'
- id: NT3.84.3
  kind: p
  original: Daher auch Meine Kreatur, die Ich jeden Augenblick als Schöpfer verschlingen und in Mich zurücknehmen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '277'
- id: NT3.84.4
  kind: p
  original: Jedes Ich nimmt das Andre also nicht als einen Eigentümer, sondern als sein Eigentum; nicht als "Ich" (si[ehe p. 184),] sondern als Sein-für-Ihn, als Objekt; nicht als sich angehörig, sondern als ihm, einem Andern angehörig, als sich entfremdet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '277'
- id: NT3.84.5
  kind: p
  original: '"Nehmen Wir denn Beide, wofür sie sich ausgeben" (p. 187), für Eigentümer, für Selbstangehörige, "und wofür sie einander nehmen", für Eigentum, für dem Fremden Angehörige.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '277'
- id: NT3.84.6
  kind: p
  original: Sie sind Eigentümer und sind es nicht (vgl. p. 187).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '277'
- id: NT3.84.7
  kind: p
  original: Es ist aber für Sankt Sancho wichtig, in allen Verhältnissen mit Andern nicht das wirkliche Verhältnis zu nehmen, sondern was Jeder sich einbilden kann, in seiner Reflexion an sich ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '277'
- id: NT3.85.1
  kind: p
  original: Da Alles, was Gegenstand für "Ich" ist, vermittelst irgendeiner seiner Eigenschaften auch sein Gegenstand ist, d.h. also sein Eigentum, z.B. die Prügel, die er erhält, als Gegenstand seiner Gliedmaßen, seines Gefühls, seiner Vorstellung, sein Gegenstand, mithin sein Eigentum sind, so kann er sich als Eigentümer jedes für ihn vorhandenen Gegenstands proklamieren und damit die ihn umgebende Welt, möge sie ihn auch noch so sehr mißhandeln und zu einem "Menschen von nur idealem Reichtum, einem Lump" herabdrücken, sein Eigentum erklären und sich zu ihrem Eigentümer proklamieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '277'
- id: NT3.85.2
  kind: p
  original: Andererseits, da jeder Gegenstand für "Ich" nicht nur Mein Gegenstand, sondern auch mein Gegenstand ist, so kann jeder Gegenstand mit derselben Gleichgültigkeit gegen den Inhalt für das Nicht-Eigne, Fremde, Heilige erklärt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '277'
- id: NT3.85.3
  kind: p
  original: Derselbe Gegenstand und dasselbe Verhältnis kann daher mit gleicher Geläufigkeit und gleichem Erfolge für das Heilige und für Mein Eigentum erklärt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 277-278
- id: NT3.85.4
  kind: p
  original: Es kommt Alles darauf an, ob der Akzent auf das Mein oder auf den Gegenstand gelegt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.85.5
  kind: p
  original: Die Methoden der Aneignung und Kanonisation sind nur zwei verschiedene "Brechungen" Einer "Wendung".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.86.1
  kind: p
  original: Alle diese Methoden sind bloß positive Ausdrücke für die Negation des in den obigen Gleichungen dem Ich Fremd-Gesetzten; nur daß die Negation wieder, wie oben, in verschiednen Bestimmungen gefaßt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.86.2
  kind: p
  original: Die Negation kann erstlich rein formell bestimmt werden, so daß sie den Inhalt gar nicht affiziert, wie oben bei der Menschenliebe und in allen Fällen, wo sich seine ganze Veränderung auf die Hinzufügung des Bewußtseins der Gleichgültigkeit beschränkt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.86.3
  kind: p
  original: Oder die ganze Sphäre des Objekts oder Prädikats, der ganze Inhalt kann negiert werden, wie bei Religion und Staat, oder drittens kann die Kopula, meine bisher fremde Beziehung zum Prädikat, allein negiert und auf das Mein der Akzent gelegt werden, so daß Ich mich als Eigentümer zum Meinigen verhalte, z.B. beim Gelde, was zur Münze Meines eignen Gepräges wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.86.4
  kind: p
  original: Indem letzteren Fall kann sowohl die Eigenschaft des Menschen wie sein Verhältnis allen Sinn verlieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.86.5
  kind: p
  original: Jede der Eigenschaften des Menschen wird dadurch, daß Ich sie in Mich zurücknehme, in Meiner Ichheit ausgelöscht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.86.6
  kind: p
  original: Es ist nicht mehr von ihr zu sagen, was sie ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.86.7
  kind: p
  original: Sie ist nur noch nominell, was sie war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.86.8
  kind: p
  original: Sie hat als "Mein", als in Mir aufgelöste Bestimmtheit, gar keine Bestimmtheit mehr gegen Andre, noch gegen Mich, sie ist bloß von Mir gesetzt, Schein -Eigenschaft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.86.9
  kind: p
  original: So z.B. Mein Denken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.86.10
  kind: p
  original: Eben wie mit Meinen Eigenschaften verhält es sich mit den Dingen, die mit Mir in einem Verhältnis stehen und, wie schon oben gesehen, im Grunde auch nur [M]eine Eigenschaften sind - z.B. mit [Mei]nem angeschauten Laden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.86.11
  kind: p
  original: Insofern [also] in Mir das Denken von allen [andern] Eigenschaften, z.B. der Goldschmiedsladen wieder von dem Wurstladen etc. total unter[schieden] ist, kommt der Unter[schied] wieder als Unterschied des Scheins herein und macht sich auch nach Außen, in Meiner Äußerung für Andre, wieder geltend.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.86.12
  kind: p
  original: Hiermit ist diese aufgelöste Bestimmtheit glücklich wieder vorhanden und muß, soweit sie überhaupt sprachlich ausgedrückt werden kann, ebenfalls in den alten Ausdrücken wiedergegeben werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.86.13
  kind: p
  original: (Von Sankt Sanchos nichtetymologischen Illusionen über die Sprache werden wir übrigens auch noch ein geringes Wörtlein vernehmen.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.87.1
  kind: p
  original: An die Stelle der obigen einfachen Gleichung tritt hier die Antithese.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.87.2
  kind: p
  original: 'In ihrer simpelsten Form lautet sie z.B. so:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.88.1
  kind: p
  original: Denken des Menschen - Mein Denken, egoistisches Denken,
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.89.1
  kind: p
  original: wo hier das Mein so viel heißt, daß er auch gedankenlos sein kann, also das
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '278'
- id: NT3.90.1
  kind: p
  original: Mein das Denken aufhebt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.90.2
  kind: p
  original: 'Verwickelter schon wird die Antithese im folgenden Beispiel:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.91.1
  kind: p
  original: Das Geld als Tauschmittel des Menschen - - Das Geld meines eignen Gepräges, als Tauschmittel des Egoisten -
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.92.1
  kind: p
  original: wo der Unsinn entbunden wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.92.2
  kind: p
  original: '- Noch verwickelter wird die Antithese, wenn Sankt Max eine Bestimmung hereinbringt und sich den Schein einer weitläuftigen Entwicklung geben will.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.92.3
  kind: p
  original: Hier wird aus der einzelnen Antithese eine Antithesenreihe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.92.4
  kind: p
  original: Zuerst heißt es z.B.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.93.1
  kind: p
  original: Das Recht überhaupt als das Recht des Menschen - Recht ist, was Mir Recht ist,
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.94.1
  kind: p
  original: wo er ebensogut statt Recht jedes andre Wort setzen könnte, da es eingestandenermaßen gar keinen Sinn mehr hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.94.2
  kind: p
  original: Obgleich dieser Unsinn fortwährend noch mit unter läuft, so muß er doch, um von ihr weiterzukommen, eine andre, notorische Bestimmung des Rechts hereinbringen, die sowohl im rein persönlichen als auch im ideologischen Sinn gebraucht werden kann - etwa die Macht als Basis des Rechts.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.94.3
  kind: p
  original: Nun erst, wo das Recht in der ersten These noch eine andere Bestimmtheit hat, die in der Antithese festgehalten wird, kann die Antithese einen Inhalt erzeugen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.94.4
  kind: p
  original: 'Nun heißt es:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.95.1
  kind: p
  original: Recht - die Macht des Menschen - Macht - das Recht Meiner,
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.96.1
  kind: p
  original: 'was dann wieder sich einfach dahin auflöst:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.97.1
  kind: p
  original: Macht als Recht Meiner = Meine Macht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.98.1
  kind: p
  original: Diese Antithesen sind weiter nichts als die positiven Umdrehungen der obigen negativen Gleichungen, bei denen sich schon am Schluß fortwährend Antithesen herausstellten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.98.2
  kind: p
  original: Sie übertreffen die Gleichungen noch an einfacher Größe und großer Einfalt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.99.1
  kind: p
  original: Wie Sankt Sancho früher Alles für fremd, ohne ihn bestehend, heilig ansehen konnte, so kann er nun ebenso leicht Alles für sein Machwerk, für nur durch ihn bestehend, für sein Eigentum ansehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.99.2
  kind: p
  original: Da er nämlich Alles in seine Eigenschaften verwandelt, so braucht er sich nun dazu nur [so zu ver]halten, wie er sich als mit sich einiger Egoist zu seinen ursprünglichen Eigenschaften verhielt, eine Prozedur, die wir hier nicht zu wiederholen brauchen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.99.3
  kind: p
  original: Hierdurch wird unser Berliner Schulmeister absoluter Herr der Welt - "freilich ist dies auch der Fall mit jeder Gans, jedem Hunde, jedem Pferde".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.99.4
  kind: p
  original: Wig[and,] p. 187.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: NT3.99.5
  kind: p
  original: Das eigentliche logische Experiment, das allen diesen Formen der Aneignung zugrunde liegt, ist eine bloße Form des Sprechens, nämlich die Paraphrase, die Umschreibung eines Verhältnisses als Ausdruck, als Existenzweise eines andern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: NT3.99.6
  kind: p
  original: Wie wir eben sahen, daß jedes Verhältnis als Exempel des Verhältnisses des Eigentums dargestellt werden konnte, geradeso kann es als Verhältnis der Liebe, der Macht, der Exploitation usw. dargestellt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: NT3.99.7
  kind: p
  original: Sankt Sancho fand diese Manier der Paraphrase in der Spekulation fertig vor, wo sie eine Hauptrolle spielt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: NT3.99.8
  kind: p
  original: Siehe unten "Exploitationstheorie".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: NT3.100.1
  kind: p
  original: Die verschiedenen Kategorien der Aneignung werden gemütliche Kategorien, sobald der Schein der Praxis hereingebracht und mit der Aneignung Ernst gemacht werden soll.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: NT3.100.2
  kind: p
  original: Die gemütliche Form der Behauptung des Ich gegen das Fremde, Heilige, die Welt, " des Menschen" ist die Renommage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: NT3.100.3
  kind: p
  original: Dem Heiligen wird der Respekt aufgekündigt (Respekt, Achtung etc., diese gemütlichen Kategorien gelten ihm für Beziehung auf das Heilige oder auf ein Drittes als Heiliges) und diese permanente Aufkündigung eine Tat tituliert, eine Tat, die umso burlesker erscheint, als er fortwährend nur gegen das Gespenst seiner heiligenden Vorstellung kämpft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: NT3.100.4
  kind: p
  original: Andererseits, da die Welt trotz seiner Respektskündigung gegen das Heilige heillos mit ihm umspringt, genießt er dagegen die innere Befriedigung, ihr zu erklären, daß er nur nötig habe, zur Macht gegen sie zu kommen, um respektslos mit ihr umzuspringen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: NT3.100.5
  kind: p
  original: Diese Drohung mit ihrer weltvernichtenden reservatio mentalis <(geheimen) geistigen Vorbehalt> vollendet die Komik.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: NT3.100.6
  kind: p
  original: Zur ersten Form der Renommage gehört, wie Sankt Sancho p. 16 "nicht den Zorn des Poseidon, nicht die rächenden Eumeniden " "fürchtet", p. 58 "den Fluch nicht fürchtet", p. 242 "keine Vergebung will" usw. und zum Schluß beteuert, die "maßloseste Entweihung" des Heiligen zu begehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: NT3.100.7
  kind: p
  original: 'Zur zweiten Form seine Drohung gegen den Mond p. 218:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: NT3.101.1
  kind: p
  original: '"Könnte Ich Dich nur fassen, Ich faßte Dich wahrlich, und finde Ich Mittel, zu Dir hinaufzukommen, Du sollst Mich nicht schrecken - - ich gebe Mich nicht auf gegen Dich, sondern warte nur Meine Zeit ab.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: NT3.101.2
  kind: p
  original: Bescheide Ich Mich auch für jetzt, Dir etwas anhaben zu können, so gedenke Ich Dir's doch!" -
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: NT3.102.1
  kind: p
  original: eine Apostrophe, in der unser Heiliger unter das Niveau von Pfeffels Mops im Graben sinkt - ebenso p. 425, wo er "der Macht über Leben und Tod nicht entsagt" usw.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: NT3.103.1
  kind: p
  original: Schließlich [kann] die renommistische Praxis wieder zu einer bloßen [Praxis] innerhalb der Theorie werden, [indem] der Heilige mit den pomp[haftesten] Worten Dinge getan zu haben [vorgibt], die er nie getan [hat, wobei er] tradi[tion]elle Triviali[tät]en vermittelst [voll]tönender Phrasen [als] originelle Schöp[f]ungen einzuschmuggeln versucht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 280-281
- id: NT3.103.2
  kind: p
  original: '[Da]zu gehört eigentlich das ganze Buch, speziell seine uns als eine Entwicklung aufgedrungene, aber nur schlecht abgeschriebene Geschichtskonstruktion, dann die Versicherung, daß "das Buch" "gegen den Menschen geschrieben zu sein scheint" (Wig[and,] p. 168), und eine Unzahl einzelner Beteuerungen, wie: "Mit einem Hauche des lebendigen Ichs blase Ich Völker um" (p. 219 "des Buchs"), "Ich schlage frisch drauflos" (p. 254), p. 285: "Tot ist das Volk", ferner die Beteuerung, "in den Eingeweiden des Rechts zu wühlen", p. 275 und der herausfordernde, mit Zitaten und Sprüchlein verbrämte Ruf nach "einem leibhaftigen Gegner" p. 280.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: NT3.104.1
  kind: p
  original: Die Renommage ist schon an und für sich sentimental.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: NT3.104.2
  kind: p
  original: Außerdem kommt aber die Sentimentalität im "Buche" auch noch als ausdrückliche Kategorie vor, die namentlich bei der positiven Aneignung, welche nicht mehr bloße Behauptung gegen das Fremde ist, eine Rolle spielt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: NT3.104.3
  kind: p
  original: So einfach die bisherigen Methoden der Aneignung auch waren, so muß bei näherer Entwicklung doch der Schein hereingebracht werden, als ob das Ich sich dadurch auch Eigentum "im gewöhnlichen Verstande" erwerbe, und dies ist nur durch eine forcierte Aufspreizung dieses Ichs zu erreichen, nur dadurch, daß er sich und Andre in einen sentimentalen Zauber hüllt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: NT3.104.4
  kind: p
  original: Die Sentimentalität ist überhaupt gar nicht zu vermeiden, sobald er sich die Prädikate " des Menschen" unbesehen als seine eignen vindiziert, z.B. "Jeden" "aus Egoismus" "liebt" - und so seinen Eigenschaften eine überschwengliche Aufgedunsenheit gibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: NT3.104.5
  kind: p
  original: So wird p. 351 "das Lächeln des Kindes" für "sein Eigentum" erklärt und ebendaselbst die Stufe der Zivilisation, auf der man die Greise nicht mehr totschlägt, als die Tat dieser Greise selbst mit den rührendsten Wendungen dargestellt pp. Zu dieser Sentimentalität gehört auch durchaus sein Verhältnis zur Maritornes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: NT3.105.1
  kind: p
  original: Die Einheit von Sentimentalität und Renommage ist die Empörung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: NT3.105.2
  kind: p
  original: In ihrer Richtung nach Außen, gegen Andre, ist sie Renommage; in ihrer Richtung nach innen, als Knurren-in-sich, ist sie Sentimentalität.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: NT3.105.3
  kind: p
  original: Sie ist der spezifische Ausdruck des ohnmächtigen Widerwillens des Philisters.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: NT3.105.4
  kind: p
  original: Er empört sich beim Gedanken des Atheismus, Terrorismus, Kommunismus, Königsmordes etc. Der Gegenstand, wogegen Sankt Sancho sich empört, ist das Heilige; darum ist die Empörung, die zwar auch als Verbrechen charakterisiert wird, in letzter Instanz Sünde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: NT3.105.5
  kind: p
  original: Die Empörung braucht also in keiner Weise als eine Tat aufzutreten, da sie nur "die Sünde" wider "das Heilige" ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: NT3.105.6
  kind: p
  original: Sankt Sancho begnügt sich daher damit, sich die "Heiligkeit" oder den "Geist der Fremdheit" "aus dem Kopfe zu schlagen" und seine ideologische Aneignung zu vollziehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: NT3.105.7
  kind: p
  original: Wie ihm aber überhaupt Gegenwart und Zukunft sehr im Kopfe durcheinandergehen, wie er bald behauptet, sich schon alles angeeignet zu haben, bald, es erst erwerben zu müssen, so fällt ihm auch bei der Empörung zuweilen ganz zufällig ein, daß er das wirkliche Fremde sich auch dann noch gegenüber hat, wenn er mit dem Heiligenschein des Fremden fertig geworden ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 281-282
- id: NT3.105.8
  kind: p
  original: In diesem Falle oder vielmehr Einfalle wird dann die Empörung in eine eingebildete Tat und das Ich in ein "Wir" verwandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: NT3.105.9
  kind: p
  original: Hierüber werden wir später das Nähere sehen. (Siehe " Empörung ".)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: NT3.106.1
  kind: p
  original: Der wahre Egoist, der sich nach der bisherigen Darstellung als der größte Konservateur erwiesen hat, sammelt schließlich die Brocken "der Welt des Menschen", zwölf Körbe voll; denn "es sei ferne, daß Etwas verloren gehe!"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: NT3.106.2
  kind: p
  original: Da sich seine ganze Aktion darauf beschränkt, an der ihm von der philosophischen Tradition überlieferten Gedankenwelt einige abgegriffene, kasuistische Kunststücke zu probieren, so versteht es sich von selbst, daß die wirkliche Welt für ihn gar nicht besteht und daher auch fortbestehen bleibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: NT3.106.3
  kind: p
  original: Der Inhalt des Neuen Testaments wird uns dazu den Beweis im Einzelnen liefern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: NT3.107.1
  kind: p
  original: So "erscheinen wir vor den Schranken der Mündigkeit und werden mündig gesprochen". (p. 86.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: NT3.N1.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Über diese Art des Berufes, wo eine der Lebensbedingungen einer Klasse von den diese Klasse konstituierenden Individuen herausgehoben und als allgemeine Forderung an alle Menschen hingestellt wird, wo der Bourgeois die Politik und die Moralität, deren Existenz er nicht entbehren kann, zum Beruf aller Menschen macht, hierüber haben wir schon oben weitläuftig gesprochen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT3.N2.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Du kannst nicht leben, nicht essen, nicht schlafen, nicht Dich bewegen, nicht irgend etwas Beliebiges tun, ohne Dir zugleich eine Bestimmung, eine Aufgabe zu setzen - eine Theorie, die also, statt von der Aufgabenstellung, dem Beruf pp. loszukommen, wie sie vorgibt, erst recht jede Lebensäußerung, ja das Leben selbst in eine,Aufgabe" verwandelt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
