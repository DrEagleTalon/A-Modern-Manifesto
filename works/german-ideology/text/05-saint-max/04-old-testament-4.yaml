source_en: 'None: no public-domain English translation'
verses:
- id: AT4.0.1
  kind: heading
  original: 4. Die Neuen
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: AT4.1.1
  kind: p
  original: '"Darum, ist Jemand in Christo, so ist er eine neue Kreatur; das Alte ist vergangen, siehe, es ist Alles neu geworden. (2. Cor[inther] 5, 17.) (p. 33.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: AT4.2.1
  kind: p
  original: Vermittelst dieses Bibelspruchs ist die alte Welt nun wirklich "vergangen" oder, wie Sankt Max eigentlich sagen wollte, "alle jeworden", und wir sind mit Einem Satze in die neue, christliche, jünglingshafte, mongolenhafte "Welt des Geistes" herübergesprungen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: AT4.2.2
  kind: p
  original: Wir werden auch diese in kürzester Frist "Alle werden" sehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: AT4.3.1
  kind: p
  original: '"Wurde oben gesagt: ''Den Alten war die Welt eine Wahrheit'', so müssen wir hier sagen: ''Den Neuen war der Geist eine Wahrheit'', dürfen aber, wie dort, so hier, den wichtigen Zusatz nicht vergessen: ''eine Wahrheit, hinter deren Unwahrheit sie zu kommen suchten und endlich wirklich kamen''." p. 33.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: AT4.4.1
  kind: p
  original: 'Wenn wir keine Stirnerschen Konstruktionen machen wollen, "so müssen wir hier sagen": Den Neuen war die Wahrheit ein Geist - nämlich der heilige Geist.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: AT4.4.2
  kind: p
  original: 'Jacques le bonhomme faßt wieder die Neuen nicht in ihrem wirklichen (historischen Zusammenhange mit der "Welt der Dinge", die trotz ihres Allewerdens ja noch immer fortexistiert, sondern in ihrem theoretischen, und zwar religiösen, Verhalten; die Geschichte des Mittelalters und der neueren Zeit existiert für ihn wieder nur als Geschichte der Religion und Philosophie; alle Illusionen dieser Epochen und die philosophischen Illusionen über diese Illusionen werden treulich geglaubt. Nachdem Sankt Max so der Geschichte der Neuen dieselbe Wendung wie der der Alten gegeben hat, kann er in ihr dann leicht "einen ähnlichen Gang, wie ihn das Altertum genommen, nachweisen", und ebenso rasch, wie er von der alten Philosophie auf die christliche Religion kam, von dieser auf die neuere deutsche Philosophie kommen. Er charakterisiert seine historische Illusion selbst p. 37, indem er entdeckt, daß "die Alten nichts aufzuweisen haben als Weltweisheit ", und "die Neuen es niemals weiter als bis zur Gottesgelahrtheit brachten und bringen", und die feierliche Frage aufwirft: "Hinter was suchten die Neuen zu kommen?" Die Alten wie die Neuen tun weiter Nichts in der Geschichte, als daß sie "hinter etwas zu kommen suchen", die Alten hinter die Welt der Dinge, die Neuen hinter die Welt des Geistes. Die Alten werden am Ende "weltlos", die Neuen werden "geistlos", die Alten wollten Idealisten, die Neuen Realisten werden (p. 485), Beiden war es nur um das Göttliche zu tun (p. 488) - "die bisherige Geschichte" ist nur "die Geschichte des geistigen Menschen" (welcher Glaube!) p. 442 - kurz, wir haben hier wieder Kind und Jüngling, Neger und Mongole und wie die ganze Terminologie der "mancherlei Wandlungen''" weiter heißt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: AT4.5.1
  kind: p
  original: Dabei wird dann die spekulative Manier, die Kinder ihren Vater erzeugen und das Frühere durch das Spätere bewirken zu lassen, gläubig nachgeahmt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: AT4.5.2
  kind: p
  original: Die Christen müssen gleich von vornherein "hinter die Unwahrheit ihrer Wahrheit zu kommen suchen", sie müssen sogleich verborgene Atheisten und Kritiker sein, wie schon bei den Alten angedeutet wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 128-129
- id: AT4.5.3
  kind: p
  original: 'Damit nicht zufrieden, gibt Sankt Max noch ein glänzendes Exempel seiner "Virtuosität im" (spekulativen) "Denken", p. 230:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: AT4.6.1
  kind: p
  original: '"Jetzt, nachdem der Liberalismus den Menschen proklamiert hat, kann man es aussprechen, daß damit nur die letzte Konsequenz des Christentums vollzogen wurde, und daß das Christentum sich von Haus aus keine andre Aufgabe stellte, als den Menschen --- zu realisieren."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: AT4.7.1
  kind: p
  original: Nachdem angeblich die letzte Konsequenz des Christentums vollzogen wurde, kann "Man" es aussprechen - daß sie vollzogen wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: AT4.7.2
  kind: p
  original: Sobald die Späteren das Frühere umgestaltet haben, "kann Man es aussprechen", daß die Früheren "von Haus aus", nämlich "in Wahrheit", im Wesen, im Himmel, als verborgene Juden, "sich keine andere Aufgabe stellten", als von den Späteren umgestaltet zu werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: AT4.7.3
  kind: p
  original: Das Christentum ist für Jacques le bonhomme sich selbst setzendes Subjekt, der absolute Geist, der "von Haus aus" sein Ende als seinen Anfang setzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: AT4.7.4
  kind: p
  original: Vgl. Hegels "Encycl[opädie]" etc.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: AT4.8.1
  kind: p
  original: '"Daher" (nämlich weil man dem Christentum eine eingebildete Aufgabe unterlegen kann) "denn die Täuschung" (natürlich, vor Feuerbach konnte man nicht wissen, welche Aufgabe sich das Christentum "von Haus aus gestellt hatte"), "es lege das Christentum dem Ich einen unendlichen Wert bei, wie z.B. in der Unsterblichkeitslehre und Seelsorge an den Tag kommt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: AT4.8.2
  kind: p
  original: Nein, diesen Wert erteilt es allein dem Menschen, nur der Mensch ist unsterblich, und nur weil Ich Mensch bin, bin auch Ich's."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: AT4.9.1
  kind: p
  original: Wenn auch schon aus der ganzen Stirnerschen Konstruktion und Aufgabenstellung klar genug hervorgeht, daß das Christentum nur "dem Menschen" Feuerbachs die Unsterblichkeit verleihen kann, so erfahren wir hier noch zum Überfluß, daß dies auch deshalb geschieht, weil das Christentum diese Unsterblichkeit - nicht auch den Tieren zuschreibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: AT4.10.1
  kind: p
  original: Konstruieren wir auch einmal à la Sankt Max.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: AT4.11.1
  kind: p
  original: '"Jetzt, nachdem" der moderne, aus der Parzellierung hervorgegangene große Grundbesitz das Majorat faktisch "proklamiert hat, kann man es aussprechen, daß damit nur die letzte Konsequenz" der Parzellierung des Grundbesitzes "vollzogen wurde" "und daß" die Parzellierung "in Wahrheit sich von Haus keine andre Aufgabe stellte, als" das Majorat, das wahre Majorat "zu realisieren."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: AT4.11.2
  kind: p
  original: '"Daher denn die Täuschung, es lege" die Parzellierung dem gleichen Rechte der Familienglieder "einen unendlichen Wert bei, wie z.B." in dem Erbrecht des Code Napoleon "an den Tag kommt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: AT4.11.3
  kind: p
  original: Nein, diesen Wert erteilt sie allein" dem ältesten Sohne; "nur" der älteste Sohn, der zukünftige Majoratsherr, wird großer Grundbesitzer, "und nur weil Ich" ältester Sohn "bin, werde auch Ich's."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: AT4.12.1
  kind: p
  original: Auf diese Weise ist es unendlich leicht, der Geschichte "einzige" Wendungen zu geben, indem man stets nur ihr allerneustes Resultat als "die Aufgabe" zu schildern hat, die "sie sich von Haus aus in Wahrheit stellte".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: AT4.12.2
  kind: p
  original: Dadurch treten die früheren Zeiten in einer bizarren und noch nie dagewesenen Gestalt auf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: AT4.12.3
  kind: p
  original: Das frappiert, ohne viele Produktionskosten zu machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: AT4.12.4
  kind: p
  original: Z.B. wenn man sagt, die eigentliche "Aufgabe", welche sich die Institution des Grundeigentums "von Haus aus stellte", sei gewesen, Menschen durch Schafe zu verdrängen, eine Konsequenz, die in Schottland etc. neuerdings hervorgetreten sei; oder auch die Proklamation der Kapetinger habe sich "von Haus aus in Wahrheit die Aufgabe gestellt", Ludwig XVI. auf die Guillotine und Herrn Guizot ins Ministerium zu bringen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: AT4.12.5
  kind: p
  original: 'Namentlich muß man dies in einer feierlichen, heiligen, priesterlichen Weise tun, tiefen Atem schöpfen und dann hervorplatzen: "Jetzt endlich kann Man es aussprechen."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: AT4.13.1
  kind: p
  original: Was Sankt Max in dem vorliegenden Abschnitte p. 33-37 über die Neuen sagt, ist nur der Prolog der uns bevorstehenden Geistergeschichte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: AT4.13.2
  kind: p
  original: 'Wir sehen auch hier, wie er sich von den empirischen Tatsachen "nicht zeitig genug losmachen kann" und dieselben Parteien wie bei den Alten: Verstand, Herz, Geist, etc. wieder auftreten läßt - nur daß sie andere Namen erhalten.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: AT4.13.3
  kind: p
  original: Aus den Sophisten werden sophistische Scholastiker, "Humanisten, Machiavellismus (Buchdruckerkunst, Neue Welt" etc., vgl. Hegel, "Geschichte der Philosophie", III, p. 128), die den Verstand repräsentieren, Sokrates verwandelt sich in Luther; der das Herz proklamiert (Hegel, l. c. p. 227), und von der nachreformatorischen Zeit erfahren wir, daß es sich in ihr um die "leere Herzlichkeit" (die bei den Alten "Herzensreinheit" hieß, vgl. Hegel, l. c. p. 241) handelte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: AT4.13.4
  kind: p
  original: Alles das auf p. 34. Auf diese Weise "weist" der heilige Max "im Christentum einen ähnlichen Gang wie im Altertum nach".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: AT4.13.5
  kind: p
  original: Nach Luther gibt er sich nun gar nicht mehr die Mühe, seine Kategorien mit Namen zu bekleiden; mit Meilenstiefeln eilt er der neueren deutschen Philosophie zu - vier Appositionen ("bis Nichts als die leere Herzlichkeit übrigbleibt, die ganze allgemeine Menschenliebe, die Liebe des Menschen, das Freiheitsbewußtsein, das 'Selbstbewußtsein'", p. 34; Hegel, l. c. p. 228, 229), vier Worte füllen die Kluft zwischen Luther und Hegel aus, und "so erst ist das Christentum vollendet".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: AT4.13.6
  kind: p
  original: Diese ganze Entwicklung wird in einem meisterhaften Satze und mit Hebebäumen wie "endlich" - "und seitdem" - "indem man " "auch" - "von Tag zu Tag" - "bis zuletzt" usw. fertiggebracht, einem Satze, den der Leser auf der erwähnten klassischen Seite 34 selbst nachsehen mag.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: AT4.14.1
  kind: p
  original: 'Zu guter Letzt gibt Sankt Max noch ein paar Proben seines Glaubens, indem er sich des Evangeliums so wenig schämt, daß er behauptet: "und Geist sind wir doch allein wirklich" - und darauf besteht, daß "der Geist" am Ende der alten Welt "nach langem Mühen die Welt" wirklich "losgeworden ist" - und hiernächst noch einmal das Geheimnis seiner Konstruktion verrät, indem er von dem christlichen Geiste aussagt, daß er " wie ein Jüngling mit Weltverbesserungs- oder Welterlösungsplänen umgehe".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 130-131
- id: AT4.14.2
  kind: p
  original: Alles p. 36.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: AT4.15.1
  kind: p
  original: '"Und er brachte mich im Geist in die Wüste.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: AT4.15.2
  kind: p
  original: Und ich sahe das Weib sitzen auf einem rosinfarbenen Tier, das war voll Namen der Lästerung -.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: AT4.15.3
  kind: p
  original: Und an ihrer Stirn geschrieben den Namen, das Geheimnis, die große Babylon - - und ich sahe das Weib trunken von dem Blute der Heiligen pp."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: AT4.15.4
  kind: p
  original: Off[enbarung] Joh[annis] 17, v. 3, 5, 6. -
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: AT4.16.1
  kind: p
  original: Der Apokalyptiker hat diesmal nicht genau geweissagt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: AT4.16.2
  kind: p
  original: 'Jetzt endlich, nachdem Stirner den Mann proklamiert hat, kann man es aussprechen, daß er so hätte sagen müssen: Und er brachte Mich in die Wüste des Geistes.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: AT4.16.3
  kind: p
  original: Und Ich sahe den Mann sitzen auf einem rosinfarbenen Tier, das war voll Lästerung der Namen - - und an seiner Stirn geschrieben den Namen, das Geheimnis, den Einzigen - - und Ich sahe den Mann trunken von dem Blute Heiligen etc.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: AT4.17.1
  kind: p
  original: Wir geraten also jetzt in die Wüste des Geistes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: AT4.18.1
  kind: heading
  original: A) Der Geist (Reine Geistergeschichte)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: AT4.19.1
  kind: p
  original: Das Erste, was wir vom "Geiste" erfahren, ist, daß nicht der Geist, sondern das Geisterreich ungeheuer groß ist".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: AT4.19.2
  kind: p
  original: Sankt Max weiß sogleich vom Geiste nichts zu sagen, als daß ein "ungeheuer großes Geisterreich" existiert, gerade wie er vom Mittelalter nur weiß, daß es "eine lange Zeit" war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: AT4.19.3
  kind: p
  original: Nachdem dies "Geisterreich" als existierend vorausgesetzt worden ist, wird seine Existenz nachträglich vermittelst zehn Thesen bewiesen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: AT4.20.1
  kind: p
  original: 1. Der Geist ist nicht freier Geist, bevor er sich nicht mit sich allein beschäftigte, bevor er es nicht mit seiner Welt, "der geistigen, allein zu tun hatte" - (erst mit sich allein, dann mit seiner Welt); 2. "Er ist freier Geist erst in einer ihm eignen Welt"; 3. "Nur mittelst einer geistigen Welt ist der Geist wirklich Geist"; 4. "Bevor der Geist sich seine Geisterwelt erschafft, ist er nicht Geist" - 5. "Seine Schöpfungen machen ihn zum Geist" - 6. "Seine Schöpfungen sind seine Welt" - 7. "Der Geist ist der Schöpfer einer geistigen Welt" - 8. "Der Geist ist nur, wenn er Geistiges schafft - 9. "Er ist nur mit dem Geistigen, seinem Geschöpfe, zusammen wirklich" - 10. "Die Werke oder Kinder des Geistes sind aber nichts Anders als - Geister." p. 38-39.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: AT4.21.1
  kind: p
  original: Die "geistige Welt" wird in These 1 gleich wieder als existierend vorausgesetzt, statt entwickelt zu werden, und diese These 1 uns dann These 2-9 in acht neuen Wandlungen wieder vorgepredigt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: AT4.21.2
  kind: p
  original: Am Ende von These 9 sind wir geradeso weit wie am Ende von These 1 und nun bringt These 10 plötzlich ein " Aber " uns " die Geister " herein, von denen bisher noch keine Rede gewesen war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: AT4.22.1
  kind: p
  original: '" Da der Geist nur ist, indem er Geistige schafft, so sehen wir uns nach seinen ersten Schöpfungen um." p. 41. -'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: AT4.23.1
  kind: p
  original: Nach These 3, 4, 5, 8 und 9 ist aber der Geist seine eigne Schöpfung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: AT4.23.2
  kind: p
  original: Dies wird jetzt so ausgedrückt, daß der Geist, d.h. die erste Schöpfung des Geistes,
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: AT4.24.1
  kind: p
  original: '"aus dem Nichts hervorgehen muß" - - "er muß sich erst erschaffen" - - "seine erste Schöpfung ist er selber, der Geist" (ibid.).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: AT4.24.2
  kind: p
  original: '"Hat er diese erst vollbracht, so folgt fortan eine natürliche Fortpflanzung von Schöpfungen, wie nach der Mythe nur die ersten Menschen geschaffen zu werden brauchten, das übrige Geschlecht sich von selbst fortpflanzte." (ibid.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: AT4.25.1
  kind: p
  original: '"So mystisch dies auch klinge, so erleben Wir''s doch als eine alltägliche Erfahrung.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: AT4.25.2
  kind: p
  original: Bist Du eher ein Denkender, als Du denkst?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: AT4.25.3
  kind: p
  original: Indem Du den ersten Gedanken erschaffst, erschaffst Du Dich, den Denkenden, denn Du denkst nicht, bevor Du einen Gedanken denkst, d.h." - d.h. - " hast.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: AT4.25.4
  kind: p
  original: Macht Dich nicht erst Dein Singen zum Sänger, Dein Sprechen zum sprechenden Menschen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: AT4.25.5
  kind: p
  original: Nun, so macht Dich auch das Hervorbringen von Geistigem erst zum Geiste."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: AT4.26.1
  kind: p
  original: Der heilige Eskamoteur unterstellt, daß der Geist Geistiges hervorbringt, um zu folgern, daß er sich selbst als Geist hervorbringt, und andrerseits unterstellt er ihn als Geist, um ihn zu seinen geistigen Schöpfungen (die "nach der Mythe sich von selbst fortpflanzen" und Geister werden) kommen zu lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: AT4.26.2
  kind: p
  original: Bis hieher altbekannte, rechtgläubig-hegelsche Phrase.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: AT4.26.3
  kind: p
  original: Die eigentlich "einzige" Entwicklung Dessen, was Sankt Max sagen will, fängt erst bei seinem Beispiel an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: AT4.26.4
  kind: p
  original: Wenn nämlich Jacques le bonhomme gar nicht weiter kann, wenn selbst "Man" und "Es" nicht imstande sind, das gestrandete Boot wieder flott zu machen, dann ruft "Stirner" seinen dritten Leibeignen zu Hülfe, den "Du", der ihn nie im Stich läßt und auf den er sich in der höchsten Not verlassen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: AT4.26.5
  kind: p
  original: 'Dieser "Du" ist ein Individuum, das uns nicht zum ersten mal vorkommt, ein frommer und getreuer Knecht, den wir durch Dick und Dünn haben gehen sehen, ein Arbeiter im Weinberge seines Herrn, der sich durch Nichts schrecken läßt - er ist, mit Einem Wort: Szeliga.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - AT4.N1
  mew_page: '132'
- id: AT4.26.6
  kind: p
  original: 'Wenn "Stirner" in den höchsten Entwicklungsnöten ist, so ruft er aus: Szeliga, hilf! und der treue Eckart Szeliga setzt sogleich die Schultern an, um den Karren aus dem Dreck zu heben.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 132-133
- id: AT4.26.7
  kind: p
  original: Wir werden über das Verhältnis von Sankt Max zu Szeliga später noch Mehr zu sagen haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: AT4.27.1
  kind: p
  original: Es handelt sich um den Geist, der sich selbst aus Nichts erschafft - also um Nichts, das sich aus Nichts zum Geist schafft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: AT4.27.2
  kind: p
  original: Sankt Max macht hieraus die Schöpfung des Szeligaschen Geistes aus Szeliga.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: AT4.27.3
  kind: p
  original: Und wem anders als Szeliga könnte "Stirner" es zumuten, sich in der Weise, wie es oben geschieht, dem Nichts unterschieben zu lassen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: AT4.27.4
  kind: p
  original: Wem anders als Szeliga, der sich schon dadurch aufs Höchste geschmeichelt fühlt, daß er überhaupt als handelnde Person auftreten darf, wird eine solche Eskamotage imponieren?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: AT4.27.5
  kind: p
  original: 'Sankt Max mußte beweisen, nicht daß ein gegebenes "Du", also der gegebne Szeliga, zum Denkenden, Sprechenden, Sänger wird, wenn er zu denken, zu sprechen, zu singen anfängt - sondern: Der Denker schafft sich aus Nichts, indem er zu denken anfängt, der Sänger schafft sich aus Nichts, indem er zu singen anfängt etc. - und nicht einmal der Denker und Sänger, sondern der Gedanke und der Gesang als Subjekte schaffen sich aus Nichts, indem sie zu denken und singen anfangen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: AT4.27.6
  kind: p
  original: Sonst "stellt Stirner bloß die höchst einfache Reflexion an" und spricht bloß den "höchst populären" Satz aus (vgl. Wigand, p. 156), daß Szeliga eine seiner Eigenschaften entwickelt, indem er sie entwickelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: AT4.27.7
  kind: p
  original: Es ist freilich durchaus nicht "zu verwundern", daß Sankt Max "dergleichen einfache Reflexionen" nicht einmal richtig "anstellt", sondern sie falsch ausspricht, um dadurch einen noch viel falscheren Satz vermittelst der falschesten Logik von der Welt zu beweisen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: AT4.28.1
  kind: p
  original: Weit entfernt, daß ich "aus dem Nichts" mich z. B. als "Sprechenden" erschüfe, ist das Nichts, was hier zugrunde liegt, ein sehr mannigfaltiges Etwas, das wirkliche Individuum, seine Sprachorgane, eine bestimmte Stufe der physischen Entwicklung, vorhandene Sprache und Dialekte, hörende Ohren und eine menschliche Umgebung, die etwas zu hören gibt, etc. etc. Es wird also bei der Ausbildung einer Eigenschaft Etwas von Etwas durch Etwas geschaffen, und keineswegs, wie in der Hegelschen Logik, von Nichts durch Nichts zu Nichts gekommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: AT4.29.1
  kind: p
  original: Jetzt, nachdem Sankt Max einmal seinen getreuen Szeliga bei der Hand hat, geht die Fahrt wieder flott voran.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: AT4.29.2
  kind: p
  original: Wir werden sehen, wie er vermittelst seines "Du" den Geist wieder in den Jüngling verwandelt, gerade wie er früher den Jüngling in den Geist verwandelte; wir werden die ganze Jünglingsgeschichte hier fast wörtlich, nur mit einigen verdeckenden Umstellungen, wiederfinden - wie schon das "ungeheuer große Geisterreich" von p. 37 Nichts andres war als das "Reich des Geistes", welches der Geist des Jünglings p. 17 zu stiften und auszubreiten "das Absehen" hatte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: AT4.30.1
  kind: p
  original: '" Wie Du indes vom Denker, Sänger, Sprecher Dich unterscheidest, so unterscheidest Du Dich nicht minder vom Geiste und fühlst sehr wohl, daß Du noch etwas Anderes bist als Geist.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: AT4.30.2
  kind: p
  original: Allein wie dem denkenden Ich im Enthusiasmus des Denkens leicht Hören und Sehen vergeht, so hat auch Dich der Geist-Enthusiasmus ergriffen, und Du sehnst Dich nun mit aller Gewalt, ganz Geist zu werden und im Geiste aufzugehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: AT4.30.3
  kind: p
  original: 'Der Geist ist Dein Ideal, das Unerreichte, das Jenseitige: Geist heißt Dein - Gott, ''Gott ist Geist'' - - Du eiferst gegen Dich selbst, der Du einen Rest von Nichtgeistigem nicht los wirst.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: AT4.30.4
  kind: p
  original: 'Statt zu sagen: Ich bin mehr als Geist, sagst Du mit Zerknirschung: Ich bin weniger als Geist, und Geist, reinen Geist, oder den Geist, der Nichts als Geist, den kann Ich mir nur denken, bin es aber nicht, und da Ich''s nicht bin, so ist''s ein Andrer, existiert als ein Andrer, den Ich ''Gott'' nenne."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: AT4.31.1
  kind: p
  original: Nachdem wir vorher uns eine lange Zeit mit dem Kunststück beschäftigten, aus Nichts Etwas zu machen, kommen wir jetzt plötzlich ganz "natürlich" zu einem Individuum, das noch etwas Anderes als Geist, also Etwas ist, Geist und reiner Geist, d.h. Nichts, werden will.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: AT4.31.2
  kind: p
  original: Wir haben mit diesem viel leichteren Problem (aus Etwas Nichts zu machen) sogleich wieder die ganze Geschichte vom Jüngling, der "den vollendeten Geist erst suchen muß", und brauchen jetzt nur wieder die alten Phrasen von p. 17 bis 18 hervorzuholen, um aller Not überhoben zu sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: AT4.31.3
  kind: p
  original: Besonders, wenn man einen so gehorsamen und gläubigen Diener hat wie Szeliga, dem "Stirner" aufbinden kann, wie ihm, "Stirner", "im Enthusiasmus des Denkens leicht " (!)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: AT4.31.4
  kind: p
  original: '"Hören und Sehen vergehe", so habe auch ihn, Szeliga, "der Geist-Enthusiasmus ergriffen", und er, Szeliga, "sehne sich nun mit aller Gewalt danach, Geist zu werden ", statt Geist zu bekommen, d.h., er habe jetzt die Rolle des Jünglings von p. 18 zu spielen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: AT4.31.5
  kind: p
  original: 'Szeliga glaubt das und gehorcht in Furcht und Zittern; er gehorcht, wenn ihm Sankt Max zudonnert: Der Geist ist Dein Ideal - Dein Gott, Du tust mir dies, Du tust mir Das, jetzt "eiferst Du", jetzt "sagst Du", jetzt " kannst Du Dir denken" usw. Wenn "Stirner" ihm aufbindet, daß "der reine Geist ein Andrer sei, da er" (Szeliga) "es nicht sei", so ist doch wirklich nur Szeliga imstande, ihm dies zu glauben und den ganzen Unsinn Wort für Wort nachzuplappern.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: AT4.31.6
  kind: p
  original: Die Methode übrigens, mit der Jacques le bonhomme diesen Unsinn zusammenbringt, ist bereits bei Gelegenheit des Jünglings ausführlich analysiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: AT4.31.7
  kind: p
  original: 'Weil Du sehr wohl fühlst, daß Du noch etwas andres als Mathematiker bist so sehnst Du Dich, ganz Mathematiker zu werden, in der Mathematik aufzugehen, der Mathematiker ist Dein Ideal, Mathematiker heißt Dein - Gott - - Du sagst mit Zerknirschung: Ich bin weniger als Mathematiker, und den Mathematiker kann Ich mir nur vorstellen, und da Ich''s nicht bin, so ist''s ein Andrer, existiert als ein Andrer, den Ich "Gott" nenne.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: AT4.31.8
  kind: p
  original: Ein Andrer als Szeliga würde sagen Arago.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: AT4.32.1
  kind: p
  original: '"Jetzt endlich, nachdem" wir den Stirnerschen Satz als die Wiederholung des "Jünglings" nachgewiesen haben, "kann man es aussprechen", daß er "in Wahrheit von Haus aus sich keine andre Aufgabe stellte", als den Geist der christlichen Askese mit Geist überhaupt und die frivole Geistreichheit z.B. des achtzehnten Jahrhunderts mit der christlichen Geistlosigkeit zu identifizieren.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: AT4.33.1
  kind: p
  original: Also nicht, wie Stirner behauptet, "weil Ich und Geist verschiedne Namen für Verschiednes sind, weil Ich nicht Geist und Geist nicht Ich ist" (p. 42), erklärt sich die Notwendigkeit, daß der Geist im Jenseits haust, d.h. Gott ist - sondern aus dem dem Szeliga ganz grundlos zugemuteten "Geistesenthusiasmus", der ihn zum Asketen macht, d.h. zu Einem, der Gott (reiner Geist) werden will, und, weil er dies nicht kann, den Gott außer sich setzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: AT4.33.2
  kind: p
  original: Es handelte sich aber darum, daß der Geist erst sich aus Nichts und dann aus sich Geister schaffen sollte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: AT4.33.3
  kind: p
  original: Statt dessen produziert jetzt Szeliga Gott (den einzigen Geist, der hier vorkommt) - nicht weil er, Szeliga, der Geist, sondern weil er Szeliga, d. h. unvollendeter Geist, ungeistiger Geist, also zugleich der Nichtgeist ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: AT4.33.4
  kind: p
  original: Wie aber die christliche Vorstellung vom Geiste als Gott entsteht, darüber sagt der heilige Max kein Wort; obwohl dies jetzt kein so großes Kunststück mehr ist; er setzt ihre Existenz voraus, um sie zu erklären.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: AT4.34.1
  kind: p
  original: Die Schöpfungsgeschichte des Geistes "stellt sich in Wahrheit von Haus aus keine andre Aufgabe", als Stirners Magen unter die Sterne zu versetzen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: AT4.35.1
  kind: p
  original: '"Gerade weil Wir nicht der Geist sind, der in Uns wohnt, gerade darum mußten Wir ihn außer'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
  review: true
  review_reason: MEW prints this passage in two columns side by side (the quoted text and the authors' version of it); the left column is read first, then the right. Check that the pairing still reads clearly
- id: AT4.36.1
  kind: p
  original: Gerade weil wir nicht der Magen sind, der in Uns wohnt, gerade darum mußten Wir ihn außer
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
  review: true
  review_reason: MEW prints this passage in two columns side by side (the quoted text and the authors' version of it); the left column is read first, then the right. Check that the pairing still reads clearly
- id: AT4.37.1
  kind: p
  original: Uns versetzen, er war nicht Wir, und darum konnten Wir ihn nicht anders existierend denken als außer Uns, jenseits von Uns, im Jenseits." p. 43.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: AT4.38.1
  kind: p
  original: Es handelte sich darum, daß der Geist erst sich und dann etwas Andres als sich aus sich schaffen sollte; die Frage war, was dieses Andre sei?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: AT4.38.2
  kind: p
  original: 'Diese Frage wird nicht beantwortet, sondern nach den obigen "mancherlei Wandlungen" und Wendungen in die folgende neue Frage verdreht:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: AT4.39.1
  kind: p
  original: '"Der Geist ist etwas Andres als Ich.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: AT4.39.2
  kind: p
  original: Dieses Andre aber, was ist's?" (p. 45.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: AT4.40.1
  kind: p
  original: 'Jetzt fragt es sich also: Was ist der Geist anderes als Ich? während die ursprüngliche Frage war: Was ist der Geist durch seine Schöpfung aus Nichts anderes als er selbst?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: AT4.40.2
  kind: p
  original: Hiermit springt Sankt Max in die nächste "Wandlung" über.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: AT4.41.1
  kind: heading
  original: B) Die Besessenen (Unreine Geistergeschichte)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: AT4.42.1
  kind: p
  original: Sankt Max hat, ohne es zu wissen, bisher weiter nichts getan als eine Anleitung zum Geistersehen gegeben, indem er die alte und neue Welt nur als "Scheinleib eines Geistes", als gespenstige Erscheinung faßte und nur Geisterkämpfe in ihr sah.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
- id: AT4.42.2
  kind: p
  original: 'Jetzt gibt er mit Bewußtsein und ex professo <wörtlich: von Berufs wegen; hier: mit Vorbedacht> eine Anleitung zum Gespenstersehen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
- id: AT4.43.1
  kind: p
  original: Anleitung zum Geistersehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
- id: AT4.43.2
  kind: p
  original: 'Man muß sich zuerst in einen erzdummen Teufel verwandeln, d.h. sich als Szeliga setzen, und dann zu sich selbst sprechen, wie Sankt Max zu diesem Szeliga: "Blick umher in der Welt, und sage selbst, ob nicht aus Allem Dich ein Geist anschaut!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
- id: AT4.43.3
  kind: p
  original: Ist man dahin gekommen, sich dies einzubilden, so kommen die Geister "leicht" von selbst, in der "Blume" sieht man nur den "Schöpfer", in den Bergen "einen Geist der Erhabenheit", im Wasser "einen Geist der Sehnsucht" oder die Sehnsucht des Geistes, und man hört "aus den Menschen Millionen Geister reden".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
- id: AT4.43.4
  kind: p
  original: 'Hat man es bis zu dieser Stufe gebracht, kann man mit Stirner ausrufen: " Ja, es spukt in der Ganzen Welt", so "ist der Fortgang dahin nicht schwer" (p. 93), daß man den weiteren Ausruf tut: "Nur in ihr?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
- id: AT4.43.5
  kind: p
  original: Nein, sie selber spukt" (Eure Rede sei Ja, Ja, Nein, Nein, was darüber ist, das ist vom Übel, nämlich logischer Übergang), "sie ist der wandelnde Scheinleib eines Geistes, sie ist ein Spuk."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
- id: AT4.43.6
  kind: p
  original: Dann "schau" getrost "in die Nähe oder in die Ferne, Dich umgibt eine gespenstige Welt - - Du siehst Geister".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
- id: AT4.43.7
  kind: p
  original: Hiermit kannst Du zufrieden sein, wenn Du ein gewöhnlicher Mensch bist; gedenkst Du aber Dich mit Szeliga messen zu können, so kannst Du auch in Dich selbst schauen und darfst "Dich dann nicht wundern", wenn Du bei dieser Gelegenheit und auf dieser Höhe der Szeligaität findest, daß auch "Dein Geist in Deinem Leibe spukt", daß Du selbst ein Gespenst bist, das "auf Erlösung harrt, nämlich ein Geist".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
- id: AT4.43.8
  kind: p
  original: Hiermit bist Du so weit gekommen, daß Du in "Allen" Menschen "Geister" und "Gespenster" sehen kannst, womit die Geisterseherei "ihr letztes Absehen erreicht". p. 46, 47.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
- id: AT4.44.1
  kind: p
  original: Die Grundlage dieser Anleitung findet sich, nur viel richtiger ausgedrückt, bei Hegel u. a.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
- id: AT4.44.2
  kind: p
  original: '"Geschichte der Philosophie" III, p. 124, 125.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
- id: AT4.45.1
  kind: p
  original: 'Der heilige Max glaubt seiner eignen Anleitung so sehr, daß er darüber selbst zum Szeliga wird und behauptet:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
- id: AT4.46.1
  kind: p
  original: '"Seit das Wort Fleisch geworden ist, seitdem ist die Welt vergeistigt, verzaubert, ein Spuk." p. 47.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
- id: AT4.47.1
  kind: p
  original: '"Stirner" "sieht Geister".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: AT4.48.1
  kind: p
  original: Sankt Max beabsichtigt, uns eine Phänomenologie des christlichen Geistes zu geben, und nimmt nach seiner Gewohnheit nur die eine Seite heraus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: AT4.48.2
  kind: p
  original: Den Christen war die Welt nicht allein vergeistigt, sondern ebensosehr entgeistigt, wie Hegel z.B. in der ebengenannten Stelle dies ganz richtig anerkennt und die beiden Seiten miteinander in Beziehung bringt, was Sankt Max, wenn er historisch verfahren wollte, ebenfalls hätte tun müssen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: AT4.48.3
  kind: p
  original: 'Der Entgeistigung der Welt im christlichen Bewußtsein gegenüber können die Alten, "die überall Götter sahen", mit gleichem Recht als Vergeistiger der Welt aufgefaßt werden, eine Auffassung, die unser heiliger Dialektiker mit der wohlmeinenden Ermahnung zurückweist: "Götter, mein lieber Neuer, sind keine Geister." p. 47. Der gläubige Max erkennt nur den heiligen Geist als Geist an.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: AT4.49.1
  kind: p
  original: Aber selbst wenn er uns diese Phänomenologie gegeben hätte (was nach Hegel übrigens überflüssig ist), so hätte er uns noch Nichts gegeben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: AT4.49.2
  kind: p
  original: Der Standpunkt, auf dem man sich mit solchen Geistergeschichten begnügt, ist selbst ein religiöser, weil man sich auf ihm bei der Religion beruhigt, die Religion als causa sui <Ursache ihrer selbst> auffaßt (denn auch "das Selbstbewußtsein" und "der Mensch" sind noch religiös), statt sie aus den empirischen Bedingungen zu erklären und nachzuweisen, wie bestimmte industrielle und Verkehrsverhältnisse notwendig mit einer bestimmten Gesellschaftsform, damit einer bestimmten Staatsform, und damit einer bestimmten Form des religiösen Bewußtseins verbunden sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: AT4.49.3
  kind: p
  original: Hätte Stirner sich die wirkliche Geschichte des Mittelalters angesehen, so hätte er finden können, warum die Vorstellung der Christen von der Welt im Mittelalter gerade diese Gestalt annahm, und wie es kam, daß sie später in eine andre überging; er hätte finden können, daß "das Christentum" gar keine Geschichte hat und alle die verschiednen Formen, in denen es zu verschiednen Zeiten aufgefaßt wurde, nicht "Selbstbestimmungen" und "Fortentwicklungen" " des religiösen Geistes" waren, sondern von ganz empirischen, allem Einflusse des religiösen Geistes entzogenen Ursachen bewirkt wurden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: AT4.50.1
  kind: p
  original: Da Stirner "nicht am Schnürchen geht" (p. 45), so kann, ehe wir auf die Geisterseherei weiter eingehen, schon hier gesagt werden, daß die verschiedenen "Wandlungen" der Stirnerschen Menschen und ihrer Welt nur in der Verwandlung der ganzen Weltgeschichte in den Leib der Hegelschen Philosophie bestehen; in Gespenster, die nur zum Schein ein "Anderssein" der Gedanken des Berliner Professors sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: AT4.50.2
  kind: p
  original: In der "Phänomenologie", der Hegelschen Bibel, "dem Buch", werden zunächst die Individuen in "das Bewußtsein" [und die] Welt in "den Gegenstand" ver[wa]ndelt, wodurch die Mannigfaltigkeit des Lebens und der Geschichte sich auf ein verschiedenes Verhalten "des Bewußtseins" zu "dem Gegenstande" reduziert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 137-138
- id: AT4.50.3
  kind: p
  original: 'Dies verschiedene Verhalten wird wieder auf drei Kardinalverhältnisse reduziert: 1. Verhältnis des Bewußtseins zum Gegenstand als der Wahrheit oder zur Wahrheit als bloßem Gegenstand (z.B. sinnliches Bewußtsein, Naturreligion, ionische Philosophie, Katholizismus, Autoritätsstaat pp.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.50.4
  kind: p
  original: '- 2. Verhältnis des Bewußtseins als des Wahren zum Gegenstand (Verstand, geistige Religion, Sokrates, Protestantismus, französische Revolution) - 3. wahres Verhalten des Bewußtseins zur Wahrheit als Gegenstand oder zum Gegenstand als Wahrheit (logisches Denken, spekulative Philosophie, der Geist als für den Geist).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.50.5
  kind: p
  original: Das erste wird auch bei Hegel gefaßt als Gottvater, das zweite als Christus, das dritte als Heiliger Geist usw. Stirner hat diese Wandlungen schon angebracht bei Kind und Jüngling, Alten und Neuen, wiederholt sie später bei Katholizismus und Protestantismus, Neger und Mongole etc. und akzeptiert diese Reihe von Verkleidungen eines Gedankens nun auf Treu und Glauben als die Welt, gegen die er sich als "leibhaftiges Individuum" geltend zu machen, zu behaupten hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.51.1
  kind: p
  original: Zweite Anleitung zum Geistersehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.51.2
  kind: p
  original: Wie man die Welt in das Gespenst der Wahrheit und sich selbst in einen Geheiligten oder Gespenstigen verwandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.51.3
  kind: p
  original: Ein Gespräch zwischen Sankt Max und Szeliga, seinem Knecht. (p. 47, 48.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.1
  kind: p
  original: Sankt Max.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.2
  kind: p
  original: '"Du hast Geist, denn Du hast Gedanken.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.3
  kind: p
  original: Was sind Deine Gedanken?"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.4
  kind: p
  original: Szeliga.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.5
  kind: p
  original: '"Geistige Wesen."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.6
  kind: p
  original: Sankt Max.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.7
  kind: p
  original: '"Also keine Dinge?"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.8
  kind: p
  original: Szeliga.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.9
  kind: p
  original: '"Nein, aber der Geist der Dinge, die Hauptsache an allen Dingen, ihr Innerstes, ihre - Idee."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.10
  kind: p
  original: Sankt Max.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.11
  kind: p
  original: '"Was Du denkst, ist mithin nicht bloß Dein Gedanke?"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.12
  kind: p
  original: Szeliga.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.13
  kind: p
  original: '"Im Gegenteil, es ist das Wirklichste, das eigentlich Wahre an der Welt: es ist die Wahrheit selber; wenn ich nur wahrhaft denke, so denke ich die Wahrheit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.14
  kind: p
  original: Ich kann mich zwar über die Wahrheit täuschen und sie verkennen; wenn ich aber wahrhaft erkenne, so ist der Gegenstand meiner Erkenntnis die Wahrheit."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.15
  kind: p
  original: Sankt Max.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.16
  kind: p
  original: '"So trachtest Du wohl allezeit die Wahrheit zu erkennen?"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.17
  kind: p
  original: Szeliga.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.18
  kind: p
  original: '"Die Wahrheit ist mir heilig. - - Die Wahrheit kann ich nicht abschaffen; an die Wahrheit glaube ich, darum forsche ich in ihr; über sie geht''s nicht hinaus, sie ist ewig.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.19
  kind: p
  original: Heilig, ewig ist die Wahrheit, sie ist das Heilige, das Ewige."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.20
  kind: p
  original: Sankt Max (erbost).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.52.21
  kind: p
  original: Du aber, der Du von diesem Heiligen Dich erfüllen lässest, wirst selbst geheiligt!"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.53.1
  kind: p
  original: Also, wenn Szeliga einen Gegenstand wahrhaft erkennt, so hört der Gegenstand auf, Gegenstand zu sein, und wird "die Wahrheit".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.53.2
  kind: p
  original: Erste Gespensterfabrikation im Großen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: AT4.53.3
  kind: p
  original: '- Es handelt sich nun nicht mehr um das Erkennen der Gegenstände, sondern um die Erkenntnis der Wahrheit; erst erkennt er Gegenstände wahrhaft, das fixiert er als Wahrheit der Erkenntnis, und diese verwandelt er in Erkenntnis der Wahrheit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 138-139
- id: AT4.53.4
  kind: p
  original: Nachdem sich so Szeliga von dem drohenden Heiligen die Wahrheit als Gespenst hat aufbinden lassen, so rückt ihm sein gestrenger Herr mit der Gewissensfrage auf den Leib, ob er "allezeit" trächtig sei mit der Sehnsucht nach Wahrheit, worauf der verwirrte Szeliga etwas vor der Zeit mit der Antwort hervorplatzt - die Wahrheit ist mir heilig.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: AT4.53.5
  kind: p
  original: Er merkt aber sogleich sein Versehen und nimmt es nach, indem er beschämt die Gegenstände in Wahrheiten, nicht mehr in die Wahrheit, verwandelt und sich als die Wahrheit dieser Wahrheiten " die Wahrheit" abstrahiert, die er nun nicht mehr abschaffen kann, nachdem er sie von den abschaffbaren Wahrheiten unterschieden hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: AT4.53.6
  kind: p
  original: Damit ist sie dann "ewig".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: AT4.53.7
  kind: p
  original: Aber nicht damit zufrieden, ihr Prädikate wie "heilig, ewig" beizulegen, verwandelt er sie in das Heilige, das Ewige als Subjekt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: AT4.53.8
  kind: p
  original: Jetzt kann ihm Sankt Max natürlich erklären, daß er, nachdem er sich vom Heiligen habe "erfüllen" lassen, "selbst geheiligt werde", und sich "nicht wundern dürfe", wenn er nunmehr in sich "nichts als einen Spuk finde".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: AT4.53.9
  kind: p
  original: 'Der Heilige beginnt sodann eine Predigt: "Auch ist das Heilige nicht für Deine Sinne" und schließt ganz folgerichtig durch ein "und" an: "niemals entdeckst Du als ein Sinnlicher seine Spur"; nachdem nämlich die sinnlichen Gegenstände "alle jeworden" sind und an ihre Stelle "die Wahrheit", "die Heilige Wahrheit", "das Heilige" getreten ist.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: AT4.53.10
  kind: p
  original: '"Sondern" - versteht sich!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: AT4.53.11
  kind: p
  original: '- "für Deinen Glauben, oder bestimmter noch für Deinen Geist" (für Deine Geistlosigkeit), denn es ist ja selbst ein Geistiges" (per appositionem <durch den Beisatz; durch Apposition>), " ein Geist" (wieder per appos.), "ist Geist für den Geist ".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: AT4.53.12
  kind: p
  original: Dies ist die Kunst, wie man die profane Welt, die "Gegenstände", vermittelst einer arithmetischen Reihe von Appositionen in "Geist für den Geist" verwandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: AT4.53.13
  kind: p
  original: Wir können hier diese dialektische Methode der Appositionen nur noch bewundern - später werden wir Gelegenheit haben, sie zu ergründen und in ihrer ganzen Klassizität darzustellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: AT4.54.1
  kind: p
  original: 'Die Appositionsmethode kann auch umgedreht werden - so hier, wo, nachdem wir "das Heilige" bereits erzeugt haben, es nicht wieder Appositionen erhält, sondern zur Apposition einer neuen Bestimmung gemacht wird: dies ist die Vereinigung der Progression mit der Gleichung.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: AT4.54.2
  kind: p
  original: So wird hier der aus irgendeinem dialektischen Prozeß "übrigbleibende Gedanke an ein Anderes", dem "Ich mehr dienen sollte als Mir" (per appos.), "das Mir wichtiger sein müßte als Alles" (per appos.), "kurz, ein Etwas, worin Ich Mein Wahres Heil zu suchen hätte " (und endlich per appos. die Rückkehr auf die erste Reihe) "- ein 'Heiliges'" (p. 48).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 139-140
- id: AT4.54.3
  kind: p
  original: Wir haben hier zwei Progressionen, die einander gleichgesetzt werden und so zu einer großen Mannigfaltigkeit von Gleichungen Gelegenheit geben können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
- id: AT4.54.4
  kind: p
  original: Hierüber später.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
- id: AT4.54.5
  kind: p
  original: Durch diese Methode hat dann auch "das Heilige", das wir bisher nur als eine rein theoretische Bestimmung für rein theoretische Verhältnisse kennenlernten, einen neuen praktischen Sinn bekommen, als "Etwas, worin Ich Mein wahres Heil zu suchen hätte", wodurch es möglich wird, das Heilige zum Gegensatz des Egoisten zu machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
- id: AT4.54.6
  kind: p
  original: Wir brauchen übrigens kaum zu erwähnen, daß dieser ganze Dialog, nebst nachfolgender Predigt, weiter nichts ist als eine neue Wiederholung der bereits drei- bis viermal dagewesenen Jünglingsgeschichte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
- id: AT4.55.1
  kind: p
  original: 'Hier, bei dem "Egoisten" angekommen, schneiden wir Stirners "Schnürchen" ab, weil wir erstens seine Konstruktion in ihrer Reinheit darzustellen haben, frei von allen dazwischengeworfenen Intermezzos, und weil zweitens er diese Intermezzi (Sancho würde nach Analogie " des Lazaroni" (Wig[and], p. 159, soll heißen Lazzarone) sagen: Intermezzi''s) an andern Stellen des Buchs ohnehin wieder vorkommen, da Stirner, weit entfernt, sich nach seiner eigenen Zumutung "stets in sich zurückzunehmen", im Gegenteil sich stets von Neuem von sich gibt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
- id: AT4.55.2
  kind: p
  original: 'Wir erwähnen nur noch eben, daß die p. 45 aufgeworfene Frage: Was ist dies vom Ich Unterschiedene, das der Geist ist, jetzt dahin beantwortet ist, daß es das Heilige, id est das dem Ich Fremde ist und daß Alles dem Ich Fremde - kraft einiger nicht ausgesprochenen Appositionen, Appositionen "an sich" - hiernach ohne Weiteres als Geist gefaßt wird.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
- id: AT4.55.3
  kind: p
  original: Geist, Heiliges, Fremdes sind identische Vorstellungen, denen er den Krieg erklärt, wie dies schon bei dem Jüngling und Mann ganz im Anfang fast wörtlich dagewesen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
- id: AT4.55.4
  kind: p
  original: Wir sind also noch keinen Schritt weiter, als wir p. 20 waren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
- id: AT4.56.1
  kind: heading
  original: a) Der Spuk
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
- id: AT4.57.1
  kind: p
  original: Sankt Max macht jetzt Ernst mit den "Geistern", welche die "Kinder des Geistes sind" (p. 39), mit der Gespensterhaftigkeit Aller (p. 47).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
- id: AT4.57.2
  kind: p
  original: Wenigstens bildet er sichs ein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
- id: AT4.57.3
  kind: p
  original: In Wahrheit aber schiebt er nur seiner bisherigen Geschichtsauffassung, nach der die Menschen von vornherein die Repräsentanten von allgemeinen Begriffen waren, einen andern Namen unter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
- id: AT4.57.4
  kind: p
  original: Diese allgemeinen Begriffe treten hier zuerst im negerhaften Zustande, als objektive, den Menschen gegenständliche Geister auf und heißen auf dieser Stufe Gespenster oder - Spuk.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
- id: AT4.57.5
  kind: p
  original: Das Hauptgespenst ist natürlich "der Mensch" selbst, da die Menschen nach dem Bisherigen nur als Repräsentanten eines Allgemeinen, Wesens, Begriffs, Heiligen, Fremden, Geistes, d. h. nur als Gespenstige, Gespenster füreinander vorhanden sind, und da schon nach Hegels "Phänomenologie" p. 255 und anderwärts der Geist, sofern er "die Form der Dingheit" für den Menschen hat, ein anderer Mensch ist. (Siehe weiter unten über " den Menschen".)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 140-141
- id: AT4.58.1
  kind: p
  original: Wir sehen also hier den Himmel offen und die verschiedenen Gespenster der Reihe nach vor uns vorüberziehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.58.2
  kind: p
  original: Jacques le bonhomme vergißt nur, daß er die alte und neue Zeit als Riesengespenster bereits hat vor uns vorbeiziehen lassen, wogegen alle die harmlosen Einfälle von Gott etc. wahre Lumpereien sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.59.1
  kind: p
  original: 'Gespenst Nr. 1: das höchste Wesen, Gott (p. 53).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.59.2
  kind: p
  original: Wie nach dem Bisherigen zu erwarten, glaubt der alle weltgeschichtlichen Berge durch seinen Glauben versetzende Jacques le bonhomme, daß "die Menschen sich jahrtausendelang die Aufgabe setzten", sich "mit der gräßlichen Unmöglichkeit, der endlosen Danaidenarbeit abquälten" - "das Dasein Gottes zu beweisen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.59.3
  kind: p
  original: Über diesen unglaublichen Glauben brauchen wir kein Wort mehr zu verlieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.60.1
  kind: p
  original: 'Gespenst Nr. 2: das Wesen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.60.2
  kind: p
  original: Was unser guter Mann über das Wesen sagt, beschränkt sich nach Abzug des aus Hegel Abgeschriebenen auf "pomphafte Worte und armselige Gedanken" (p. 53).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.60.3
  kind: p
  original: '"Der Fortgang vom" Wesen "auf" das Weltwesen "ist nicht schwer", und dies Weltwesen ist natürlich'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.61.1
  kind: p
  original: Gespenst Nr. 3, die Eitelkeit der Welt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.61.2
  kind: p
  original: Hierüber ist Nichts zu sagen, als daraus "leicht"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.62.1
  kind: p
  original: Gespenst Nr. 4, die guten und bösen Wesen werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.62.2
  kind: p
  original: Hierüber wäre zwar etwas zu sagen, wird aber nichts gesagt, und sogleich zum nächsten
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.63.1
  kind: p
  original: 'Gespenst Nr. 5: das Wesen und sein Reich fortgeschritten.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.63.2
  kind: p
  original: Daß wir das Wesen hier zum zweiten Male haben, darf uns bei unsrem ehrlichen Schriftsteller, der seine "Unbeholfenheit" (Wigand, p. 166) sehr gut kennt und deshalb Alles mehrmals sagt, damit es ja nicht mißverstanden werde, keineswegs verwundern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.63.3
  kind: p
  original: Das Wesen wird hier zuerst als Inhaber eines "Reiches" bestimmt und sodann von ihm ausgesagt, daß es "das Wesen" ist (p. 54), worauf es sich flugs in
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.64.1
  kind: p
  original: 'Gespenst Nr. 6: "die Wesen" verwandelt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.64.2
  kind: p
  original: Sie und sie allein zu erkennen und anzuerkennen, das ist Religion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.64.3
  kind: p
  original: '"Ihr Reich" (der Wesen) "ist - ein Reich der Wesen." (p. 54.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.64.4
  kind: p
  original: Plötzlich tritt hier
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.65.1
  kind: p
  original: Gespenst Nr. 7, der Gottmensch, Christus, ohne alle sichtbare Veranlassung herein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.65.2
  kind: p
  original: Von ihm weiß Stirner zu sagen, daß er "beleibt" gewesen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.65.3
  kind: p
  original: Wenn Sankt Max nicht an Christus glaubt, so glaubt er wenigstens an seinen "wirklichen Leib".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: AT4.65.4
  kind: p
  original: Christus hat nach Stirner eine große Misère in die Geschichte gebracht, und der sentimentale Heilige erzählt mit Tränen in den Augen, "wie sich die kräftigsten Christenmenschen abgemartert haben, um ihn zu begreifen" - ja - "seelenmarternder war noch nie ein Gespenst, und kein Schamane, der bis zu rasender Wut und nervenzerreißenden Krämpfen sich aufstachelt, kann solche Qual erdulden, wie Christen sie von jenem unbegreiflichsten Gespenst erlitten".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 141-142
- id: AT4.65.5
  kind: p
  original: Sankt Max weint eine empfindsame Zähre auf dem Grabe der Opfer Christi und kommt dann zum "grauenhaften Wesen",
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: AT4.66.1
  kind: p
  original: dem Gespenst Nr. 8, dem Menschen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: AT4.66.2
  kind: p
  original: Hier "graut" es unsrem wackeren Schriftsteller in Eins fort - "er erschrickt vor sich selbst", er sieht in jedem Menschen einen "grausigen Spuk"' einen "unheimlichen Spuk", in dem es "umgeht" (p. 55, 56).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: AT4.66.3
  kind: p
  original: Er fühlt sich höchst unbehaglich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: AT4.66.4
  kind: p
  original: Der Zwiespalt zwischen Erscheinung und Wesen läßt ihn nicht ruhen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: AT4.66.5
  kind: p
  original: 'Er ist wie Nabal, der Gemahl der Abigail, von dem geschrieben steht, daß sein Wesen ebenfalls von seiner Erscheinung getrennt war: Es war ein Mann zu Maon und sein Wesen zu Carmel (1. Samuel 25, 2).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: AT4.66.6
  kind: p
  original: Zur rechten Zeit und ehe sich der "seelengemarterte" Sankt Max aus Verzweiflung eine Kugel durch den Kopf jagt, fallen ihm plötzlich die Alten ein, die "so etwas nicht in ihren Sklaven beachteten".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: AT4.66.7
  kind: p
  original: Dies bringt ihn auf
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: AT4.67.1
  kind: p
  original: Gespenst Nr. 9, den Volksgeist (p. 56), über den sich Sankt Max, an dem jetzt kein Aufhalten mehr ist, ebenfalls "grausige" Einbildungen macht, um
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: AT4.68.1
  kind: p
  original: 'Gespenst Nr. 10: "Alles" in einen Spuk zu verwandeln, und schließlich, wo alles Zählen aufhört, den "heiligen Geist", die Wahrheit, das Recht, das Gesetz, die gute Sache (die er noch immer nicht vergessen kann) und ein halbes Dutzend anderer, einander wildfremder Dinge in der Klasse Gespenster zusammenzuwerfen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: AT4.69.1
  kind: p
  original: Sonst ist in dem ganzen Kapitel Nichts bemerkenswert als die Versetzung eines historischen Berges durch Sankt Maxens Glauben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: AT4.69.2
  kind: p
  original: Er meint nämlich p. 56, "nur um eines höheren Wesens willen sei man von jeher geehrt, nur als ein Gespenst für eine geheiligte, d.h." (das heißt!) "geschützte und anerkannte Person betrachtet worden".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: AT4.69.3
  kind: p
  original: 'Versetzen wir diesen durch bloßen Glauben versetzten Berg wieder an seine rechte Stelle, so "heißt es nun": Nur um der geschützten, d.h. sich selbst schützenden, und privilegierten, d. h. sich selbst privilegierenden Personen willen wurden höhere Wesen verehrt und Gespenster geheiligt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: AT4.69.4
  kind: p
  original: Sankt Max bildet sich z.B. ein, daß im Altertum, wo jedes Volk durch materielle Verhältnisse und Interessen, z.B. Feindschaft der verschiednen Stämme etc., zusammengehalten wurde, wo wegen Mangel an Produktivkräften Jeder entweder Sklave sein oder Sklaven haben mußte etc. etc., wo es also vom "natürlichsten Interesse" (Wigand, p. [162]) war, einem Volke anzugehören - daß also damals der Begriff Volk oder "das Volkswesen" erst diese Interessen aus sich erzeugt habe; daß in der neueren Zeit, wo die freie Konkurrenz und der Welthandel den heuchlerischen, bürgerlichen Kosmopolitismus und den Begriff des Menschen erzeugte, umgekehrt die spätere philosophische Konstruktion des Menschen jene Verhältnisse als seine "Offenbarungen" (p. 51) produziert habe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 142-143
- id: AT4.69.5
  kind: p
  original: Ebenso mit der Religion, dem Reich der Wesen, das er für das einzige Reich hält, von deren Wesen er aber nichts weiß, weil er sonst wissen müßte, daß sie, als Religion, weder ein Wesen noch ein Reich hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
- id: AT4.69.6
  kind: p
  original: In der Religion machen die Menschen ihre empirische Welt zu einem nur gedachten, vorgestellten Wesen, das ihnen fremd gegenübertritt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
- id: AT4.69.7
  kind: p
  original: Dies ist keineswegs wieder aus andern Begriffen zu erklären, aus " dem Selbstbewußtsein" und dergleichen Faseleien, sondern aus der ganzen bisherigen Produktions- und Verkehrsweise, die ebenso unabhängig vom reinen Begriff ist wie die Erfindung der self-acting mule und Anwendung der Eisenbahnen von der Hegelschen Philosophie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
- id: AT4.69.8
  kind: p
  original: Will er einmal von einem "Wesen" der Religion sprechen, d.h. von einer materiellen Grundlage dieses Unwesens, so hat er es weder im "Wesen des Menschen" noch in den Prädikaten Gottes zu suchen, sondern in der von jeder Stufe der religiösen Entwicklung vorgefundenen materiellen Welt. (Vgl. oben Feuerbach.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
- id: AT4.70.1
  kind: p
  original: Die sämtlichen "Gespenster", die wir Revue passieren ließen, waren Vorstellungen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
- id: AT4.70.2
  kind: p
  original: Diese Vorstellungen, abgesehen von ihrer realen Grundlage (von der Stirner ohnehin absieht), als Vorstellungen innerhalb des Bewußtseins, als Gedanken im Kopfe der Menschen gefaßt, aus ihrer Gegenständlichkeit in das Subjekt zurückgenommen, aus der Substanz ins Selbstbewußtsein erhoben, sind - der Sparren oder die fixe Idee.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
- id: AT4.71.1
  kind: p
  original: 'Über den Ursprung von Sankt Maxens Gespenstergeschichte siehe Feuerbach in den "Anekdotis" II, p. 66, wo es heißt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
- id: AT4.72.1
  kind: p
  original: '"Die Theologie ist Gespensterglaube.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
- id: AT4.72.2
  kind: p
  original: Die gemeine Theologie hat aber ihre Gespenster in der sinnlichen Imagination, die spekulative Theologie in der unsinnlichen Abstraktion."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
- id: AT4.73.1
  kind: p
  original: Da nun Sankt Max mit sämtlichen kritischen Spekulanten der neueren Zeit den Glauben teilt, daß verselbständigte Gedanken, verkörperte Gedanken - Gespenster - die Welt beherrscht haben und beherrschen, daß alle bisherige Geschichte Geschichte der Theologie gewesen sei, so war nichts leichter, als sie in eine Gespenstergeschichte zu verwandeln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
- id: AT4.73.2
  kind: p
  original: Sanchos Gespenstergeschichte beruht also auf dem traditionell überlieferten Gespensterglauben der Spekulanten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
- id: AT4.74.1
  kind: heading
  original: b) Der Sparren
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
- id: AT4.75.1
  kind: p
  original: '"Mensch, es spukt in Deinem Kopfe! - - Du hast eine fixe Idee!" donnert der heilige Max seinen Sklaven Szeliga an.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: AT4.75.2
  kind: p
  original: '"Denke nicht, daß Ich scherze", droht er ihm.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: AT4.75.3
  kind: p
  original: Untersteh Dich nicht zu glauben, daß der feierliche "Max Stirner" scherzen könne.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: AT4.76.1
  kind: p
  original: Der Mann Gottes hat wieder seinen getreuen Szeliga nötig, um vom Objekt auf das Subjekt, vom Spuk auf den Sparren zu kommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: AT4.77.1
  kind: p
  original: Der Sparren ist die Hierarchie im einzelnen Individuum, die Herrschaft des Gedankens "in ihm über ihm".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: AT4.77.2
  kind: p
  original: Nachdem die Welt dem phantasierenden Jüngling von p. 20 als Welt seiner "Fieberphantasien", als Gespensterwelt gegenübergetreten ist, wachsen ihm die "eignen Geburten seines Kopfs" innerhalb seines Kopfs über seinen Kopf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: AT4.77.3
  kind: p
  original: Die Welt seiner Fieberphantasien - das ist sein Fortschritt - existiert nun als die Welt seines zerrütteten Kopfes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: AT4.77.4
  kind: p
  original: Sankt Max, der Mann, der die "Welt der Neuen" als den phantasierenden Jüngling sich gegenüberstehen hat, muß notwendig erklären, daß "beinahe die ganze Menschenwelt aus veritablen Narren, Narren im Tollhause bestehe". (p. 57.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: AT4.78.1
  kind: p
  original: 'Der Sparren, den Sankt Max in den Köpfen der Menschen entdeckt, ist nichts als sein eigner Sparren, der Sparren "des Heiligen", der die Welt sub specie aeterni <vom Gesichtspunkt der Ewigkeit> betrachtet und sowohl die heuchlerischen Phrasen wie die Illusionen der Menschen für die wirklichen Motive ihrer Handlungen versieht; weswegen auch der naive, gläubige Mann getrost den großen Satz ausspricht: "Fast die ganze Menschenwelt hängt am Höheren." (p. 57.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: AT4.79.1
  kind: p
  original: Der "Sparren" ist "eine fixe Idee", d.h. "eine Idee, die den Menschen sich unterworfen hat", oder, wie später populärer gesagt wird, allerlei Abgeschmacktheiten, die die Leute " sich in den Kopf gesetzt haben ".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: AT4.79.2
  kind: p
  original: Mit spielender Leichtigkeit ergibt sich für Sankt Max, daß Alles, was die Menschen sich unterworfen hat, z. B. die Notwendigkeit zu produzieren, um zu leben, und die davon abhängigen Verhältnisse eine solche "Abgeschmacktheit" oder " fixe Idee " ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: AT4.79.3
  kind: p
  original: Da die Kinderwelt die einzige "Welt der Dinge" ist, wie wir in der Mythe vom "Menschenleben" sahen, so ist Alles, was "für das Kind" (von Zeit zu Zeit auch für das Tier) nicht existiert, jedenfalls "eine Idee" und "leicht auch" eine "fixe Idee".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: AT4.79.4
  kind: p
  original: Wir sind den Jüngling und das Kind noch lange nicht los.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: AT4.80.1
  kind: p
  original: Das Kapitel vom Sparren hat bloß den Zweck, die Kategorie des Sparrens in der Geschichte " des Menschen" zu konstatieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: AT4.80.2
  kind: p
  original: Der eigentliche Kampf gegen die Sparren zieht sich durch das ganze "Buch" und wird namentlich im zweiten Teil geführt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 144-145
- id: AT4.80.3
  kind: p
  original: Wir können uns deshalb hier mit ein paar Beispielen von Sparren begnügen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: AT4.81.1
  kind: p
  original: p. 59 glaubt Jacques le bonhomme, daß "unsere Zeitungen von Politik strotzen, weil sie in dem Wahne gebannt sind, der Mensch sei dazu geschaffen, ein Zoon politikon <gesellschaftliches Wesen> zu werden".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: AT4.81.2
  kind: p
  original: Also nach Jacques le bonhomme wird Politik getrieben, weil unsre Zeitungen davon strotzen!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: AT4.81.3
  kind: p
  original: 'Wenn ein Kirchenvater die Börsennachrichten unserer Zeitungen ansähe, so könnte er gar nicht anders urteilen wie Sankt Max und müßte sagen: Diese Zeitungen strotzen von Börsennachrichten, weil sie in den Wahn gebannt sind, der Mensch sei dazu geschaffen, in Fonds zu spekulieren.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: AT4.81.4
  kind: p
  original: Also nicht die Zeitungen haben den Sparren, sondern der Sparren hat den "Stirner".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: AT4.82.1
  kind: p
  original: Die Verpönung der Blutschande und die Institutionen der Monogamie werden aus "dem Heiligen" erklärt, "sie sind das Heilige".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: AT4.82.2
  kind: p
  original: Wenn bei den Persern die Blutschande nicht verpönt ist und die Institution der Polygamie bei den Türken sich vorfindet, so sind dort also Blutschande und Polygamie "das Heilige".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: AT4.82.3
  kind: p
  original: Zwischen diesen beiden "Heiligen" wäre kein Unterschied anzugeben, als daß Perser und Türken sich andres dummes Zeug "in den Kopf gesetzt haben" als die christlich germanischen Völker.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: AT4.82.4
  kind: p
  original: '- Kirchenväterliche Manier, sich "zeitig genug" von der Geschichte "loszumachen".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: AT4.82.5
  kind: p
  original: '- Jacques le bonhomme ahnt so wenig die wirklichen, materialistischen Ursachen der Verpönung der Polygamie und Blutschande unter gewissen sozialen Verhältnissen, daß er sie nur für einen Glaubenssatz erklärt und sich in Gemeinschaft mit jedem Spießbürger einbildet, wenn einer für derartige Vergehen eingesperrt werde, so sperre ihn "die Sittenreinheit" in ein "Sittenverbesserungshaus" (p. 61), wie denn die Kerker ihm überhaupt - und hierin steht er unter dem gebildeten Bourgeois, der dies besser weiß, vgl. die Gefängnisliteratur - als Sittenverbesserungshäuser erscheinen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: AT4.82.6
  kind: p
  original: '"Stirners" "Kerker sind die allertrivialsten Illusionen des Berliner Bürgers, die indes für ihn schwerlich ein "Sittenverbesserungshaus" genannt zu werden verdienen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: AT4.83.1
  kind: p
  original: Nachdem Stirner durch eine "episodisch eingelegte" "geschichtliche Reflexion entdeckt hat, daß "es dahin kommen mußte", daß der ganze Mensch sich mit allen seinen Fähigkeiten als religiös erwies" (p 64), "so ist auch in der Tat "nicht zu verwundern", "weil wir jetzt so durch und durch religiös sind daß" der Eid "der Geschwornen uns zum Tode verdammt und der Polizeidiener uns als guter Christ durch 'Amtseid' ins Loch bringt".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: AT4.83.2
  kind: p
  original: Wenn ihn ein Gensdarme wegen Rauchens im Tiergarten anhält, so schlägt ihm nicht der kgl. preuß. dafür bezahlte und an den Strafgeldern beteiligte Gensdarme, sondern der "Amtseid" die Zigarre aus dem Munde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 145-146
- id: AT4.83.3
  kind: p
  original: Geradeso verwandelt sich für ihn die Macht des Bourgeois im Geschwornengerichte, wegen des scheinheiligen Aussehens, das sich die amis du commerce <Freunde des Handels> hier geben, in die Macht des Schwörens, des Eides, in "das Heilige".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: AT4.83.4
  kind: p
  original: 'Wahrlich, wahrlich, ich sage Euch: solchen Glauben habe ich in Israel nicht gefunden. (Matth[äi] 8, 10.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: AT4.84.1
  kind: p
  original: '"Bei so Manchem wird ein Gedanke zur Maxime, so daß nicht Er die Maxime, sondern diese vielmehr Ihn hat, und mit der Maxime hat er wieder einen festen Standpunkt."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: AT4.84.2
  kind: p
  original: Aber "so liegt es nun nicht an Jemandes Wollen, Sollen oder Laufen, sondern an Gottes Erbarmen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: AT4.84.3
  kind: p
  original: 'Röm[er] 9, 16. Darum muß der heilige Max sogleich auf derselben Seite einige Pfähle ins Fleisch bekommen und uns selbst mehrere Maximen geben: nämlich erstens die Maxime, keine Maxime, damit zweitens die Maxime, keinen festen Standpunkt zu haben, drittens die Maxime: "Wir sollen zwar Geist haben, aber der Geist soll Uns nicht haben"; und viertens die Maxime, daß man auch sein Fleisch vernehmen soll, "denn nur wenn ein Mensch sein Fleisch vernimmt, vernimmt er sich ganz, und nur wenn er sich ganz vernimmt, ist er vernehmend oder vernünftig".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: AT4.85.1
  kind: heading
  original: C) Unreine unreine Geistergeschichte
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: AT4.86.1
  kind: heading
  original: a) Neger und Mongolen
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: AT4.87.1
  kind: p
  original: Wir kehren jetzt zum Anfang der "einzigen" Geschichtskonstruktion und Namengebung zurück.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: AT4.87.2
  kind: p
  original: Das Kind wird Neger, der Jüngling Mongole.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: AT4.87.3
  kind: p
  original: Siehe die Ökonomie des Alten Bundes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: AT4.88.1
  kind: p
  original: '"Die geschichtliche Reflexion über Unser Mongolentum, welche Ich an dieser Stelle episodisch einlegen will, gebe Ich nicht mit dem Anspruche auf Gründlichkeit oder auch nur auf Bewährtheit, sondern lediglich darum, weil Mich dünkt, sie könne zur Verdeutlichung des Übrigen beitragen." p. 87.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: AT4.89.1
  kind: p
  original: Sankt Max sucht sich seine Phrasen über Kind und Jüngling zu "verdeutlichen", indem er ihnen weltumfassende Namen gibt, und diese weltumfassenden Namen, indem er ihnen seine Phrasen über Kind und Jüngling unterschiebt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: AT4.89.2
  kind: p
  original: '"Die Negerhaftigkeit stellt dar das Altertum, die Abhängigkeit von den Dingen" (Kind); "die Mongolenhaftigkeit die Zeit der Abhängigkeit von Gedanken, die christliche" (Jüngling). (Vergl. "Ökonomie des Alten Bundes".)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: AT4.89.3
  kind: p
  original: '"Der Zukunft sind die Worte vorbehalten: Ich bin Eigner der Welt der Dinge, und Ich bin Eigner der Welt der Gedanken." (p. 87,88.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: AT4.89.4
  kind: p
  original: Diese "Zukunft" hat sich bereits einmal auf p. 20 bei Gelegenheit des Mannes zugetragen und wird sich später noch einmal, von p. 226 an, ereignen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 146-147
- id: AT4.90.1
  kind: p
  original: Erste "geschichtliche Reflexion ohne Anspruch auf Gründlichkeit oder auch nur auf Bewährtheit".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: AT4.90.2
  kind: p
  original: Weil Ägypten zu Afrika gehört, wo die Neger hausen, so "fallen" p. 88 die nie vorgekommenen "Züge des Sesostris" und die "Bedeutsamkeit Ägyptens" (auch unter den Ptolemäern, Napoleons Expedition nach Ägypten, Mehemet Ali, orientalische Frage, Duvergier de Haurannes Broschüren pp.) "und Nordafrikas überhaupt" (also Karthagos, Hannibals Zug nach Rom und "leicht auch" von Syrakus und Spanien, Vandalen, Tertullian, Mauren, Al Hussein Abu Ali Ben Abdallah Ebn Sina, Raubstaaten, Franzosen in Algier, Abd el Kâder, Père Enfantin und die vier neuen Kröten des "Charivari") "in das negerhafte Weltalter". p. 88. Also Stirner verdeutlicht hier die Züge des Sesostris pp., indem er sie in das negerhafte Zeitalter versetzt, und das negerhafte Weltalter, indem er es als historische Illustration zu seinen einzigen Gedanken "über Unsere Kinderjahre" "episodisch einlegt".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: AT4.91.1
  kind: p
  original: Zweite "geschichtliche Reflexion" "Dem mongolenhaften Weltalter gehören die Hunnen- und Mongolenzüge an, bis hinauf zu den Russen" (und Wasserpolacken), wo denn wieder die Hunnen- und Mongolenzüge nebst den Russen dadurch "verdeutlicht" werden, daß sie dem "mongolenhaften Weltalter" angehören, und das "mongolenhafte Weltalter" dadurch, daß es das Weltalter der schon als Jüngling aufgetretenen Phrase "Abhängigkeit von Gedanken" ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: AT4.92.1
  kind: p
  original: 'Dritte "geschichtliche Reflexion":'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: AT4.93.1
  kind: p
  original: Im mongolenhaften Weltalter "kann der Wert Meiner unmöglich hoch angeschlagen werden, weil der harte Demant des Nicht-Ich zu hoch im Preise steht, weil es noch zu körnig und unbezwinglich ist, um von Mir absorbiert und verzehrt zu werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: AT4.93.2
  kind: p
  original: Vielmehr kriechen die Menschen nur mit außerordentlicher Geschäftigkeit auf diesem Unbeweglichen, dieser Substanz, herum, wie Schmarotzertierchen auf einem Leibe, von dessen Säften sie Nahrung ziehen, ohne ihn deshalb aufzuzehren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: AT4.93.3
  kind: p
  original: Es ist die Geschäftigkeit des Ungeziefers, die Betriebsamkeit der Mongolen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: AT4.93.4
  kind: p
  original: Bei den Chinesen bleibt ja Alles beim Alten etc. - - Sonach " (weil bei den Chinesen Alles beim Alten bleibt) "ist in unsrem mongolischen Weltalter alle Veränderung nur eine reformatorische und ausbessernde, keine destruktive oder verzehrende oder vernichtende gewesen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: AT4.93.5
  kind: p
  original: Die Substanz, das Objekt bleibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: AT4.93.6
  kind: p
  original: All unsre Betriebsamkeit ist nur Ameisentätigkeit und Flohsprung...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: AT4.93.7
  kind: p
  original: Jongleurkünste auf dem Seile des Objektiven" pp. (p. 88. Vgl. Hegel, Phil[osophie] der Gesch[ichte]" p. 113, 118, 119 (die undurchweichte Substanz), 140 etc., wo China als die "Substantialität" gefaßt wird.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: AT4.94.1
  kind: p
  original: Also hier erfahren wir, daß in dem wahren kaukasischen Weltalter die Menschen die Maxime haben werden, die Erde, die "Substanz", "das Objekt", das "Unbewegliche" zu verschlingen, "verzehren", "vernichten", "absorbieren", "destruieren", und mit der Erde zugleich das nicht von ihr zu trennende Sonnensystem.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 147-148
- id: AT4.94.2
  kind: p
  original: Der weltverschlingende "Stirner" hat uns die "reformatorische oder ausbessernde Tätigkeit" des Mongolen bereits als "Welterlösungs- und Weltverbesserungspläne " des Jünglings und Christen p. 36 vorgeführt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.94.3
  kind: p
  original: Wir sind also noch immer keinen Schritt weiter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.94.4
  kind: p
  original: Charakteristisch für die ganze "einzige" Geschichtsauffassung ist, daß die höchste Stufe dieser mongolischen Tätigkeit den Namen der "wissenschaftlichen" verdient - woraus schon jetzt zu folgern ist, was Sankt Max uns später sagt, daß die Vollendung des mongolischen Himmels das Hegelsche Geisterreich ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.95.1
  kind: p
  original: Vierte "geschichtliche Reflexion".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.95.2
  kind: p
  original: Die Welt, auf der die Mongolen herumkriechen, verwandelt sich jetzt vermittelst eines "Flohsprungs" in "das Positive", dies in "die Satzung", und die Satzung wird vermittelst eines Absatzes p. 89 zur "Sittlichkeit".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.95.3
  kind: p
  original: '"Diese gibt sich in ihrer ersten Form als Gewohnheit" - sie tritt also als Person auf; flugs verwandelt sie sich aber in einen Raum.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.95.4
  kind: p
  original: '"Nach seines Landes Sitte und Gewohnheit handeln, heißt da " (nämlich in der Sittlichkeit) "sittlich sein".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.95.5
  kind: p
  original: '"Darum" (weil dies in der Sittlichkeit als Gewohnheit passiert) "wird ein lauteres, sittliches Handeln am schlichtesten in - - China geübt!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.96.1
  kind: p
  original: Sankt Max ist unglücklich in seinen Exempeln. p. 116 schiebt er ebenso den Nordamerikanern die "Religion der Rechtschaffenheit" unter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.96.2
  kind: p
  original: Er hält die beiden spitzbübischsten Völker der Erde, die patriarchalischen Betrüger, die Chinesen, und die zivilisierten Betrüger, die Yankees, für "schlicht", "sittlich" und "rechtschaffen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.96.3
  kind: p
  original: Hätte er seine Eselsbrücke nachgesehen, so hätte er die Nordamerikaner p. 81 der "Philosophie der Geschichte" und die Chinesen p. 130 ibid. als Betrüger klassifiziert finden können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.97.1
  kind: p
  original: Freund " Man " verhilft dem heiligen Biedermann jetzt auf die Neuerung; von dieser bringt ihn ein " Und " wieder auf die Gewohnheit, und somit ist das Material präpariert, um in der
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.98.1
  kind: p
  original: Fünften geschichtlichen Reflexion einen Hauptcoup vollziehen zu können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.98.2
  kind: p
  original: '"Es unterliegt auch in der Tat keinem Zweifel, daß der Mensch sich durch Gewohnheit gegen die Zudringlichkeit der Dinge[,] der Welt sichert" - z.B. gegen den Hunger -'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.99.1
  kind: p
  original: '"und" - wie hieraus ganz natürlich folgt -'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.100.1
  kind: p
  original: '"eine eigne Welt gründet" - die "Stirner" jetzt nötig hat - "'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.101.1
  kind: p
  original: in welcher er allein heimisch und zu Hause ist" - "allein", nachdem er sich erst durch "Gewohnheit" in der bestehenden "Welt" "heimisch" gemacht hat -
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.102.1
  kind: p
  original: '" d.h. sich einen Himmel gründet" - weil China das himmlische Reich heißt. -'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: AT4.103.1
  kind: p
  original: '"Hat ja doch der Himmel keinen andern Sinn als den, daß er die eigentliche Heimat des Menschen ist" - wo er im Gegenteil die vorgestellte Uneigentlichkeit der eigentlichen Heimat zum Sinn hat -'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '149'
- id: AT4.104.1
  kind: p
  original: '"worin ihn Nichts Fremdes mehr bestimmt" - d.h. worin ihn das Eigne als Fremdes bestimmt, und wie die nun in Gang gebrachte Leier weiter heißt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '149'
- id: AT4.104.2
  kind: p
  original: '"Vielmehr", um mit Sankt Bruno, oder "etwa leicht", um mit Sankt Max zu sprechen, müßte dieser Satz so heißen:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '149'
