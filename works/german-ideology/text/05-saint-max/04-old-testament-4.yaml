- id: AT4.108.1
  kind: p
  original: '"Es unterliegt auch in der Tat keinem Zweifel", daß, weil China das himmlische Reich heißt, weil "Stirner" gerade von China spricht und "gewohnt" ist, sich durch Unwissenheit "gegen die Zudringlichkeit der Dinge, der Welt, zu sichern und eine eigne Welt zu gründen, in welcher er allein heimisch und zu Hause ist", er sich aus dem himmlischen Reich China "einen Himmel erbaut.'
