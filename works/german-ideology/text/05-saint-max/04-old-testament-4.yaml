- id: AT4.108.2
  kind: p
  original: Hat ja doch" die Zudringlichkeit der Welt, der Dinge, "keinen andern Sinn als den, daß" sie "die eigentliche" Hölle des Einzigen "sind, worin ihn "Alles als "Fremdes bestimmt und beherrscht", die er sich aber dadurch in einen "Himmel" zu verwandeln weiß, daß er sich allem "Einfluß der irdischen", geschichtlichen Tatsachen und Zusammenhänge "entfremdet", daher sich also nicht mehr vor ihnen befremdet, "kurz, wo die Schlacken des Irdischen", Historischen "abgeworfen sind und" Stirner im "Ende" "der Welt" keinen "Kampf" mehr "findet, womit also Alles gesagt ist.
