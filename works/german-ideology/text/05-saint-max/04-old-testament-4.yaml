- id: AT4.109.1
  kind: p
  original: 'Sechste "geschichtliche Reflexion". p. 90 bildet sich Stirner ein:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '149'
- id: AT4.110.1
  kind: p
  original: '"In China ist für Alles vorgesehen; was auch kommen mag, es weiß der Chinese immer, wie er sich zu verhalten hat, und er braucht sich nicht erst nach den Umständen zu bestimmen; aus dem Himmel seiner Ruhe stürzt ihn kein unvorhergesehener Fall."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '149'
- id: AT4.111.1
  kind: p
  original: Auch kein englisches Bombardement - er wußte ganz genau, "wie er sich zu verhalten hatte", besonders den ihm unbekannten Dampfschiffen und Schrapnell-Bomben gegenüber.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '150'
- id: AT4.112.1
  kind: p
  original: Sankt Max hat dies sich aus Hegels "Philosophie der Geschichte" p. 118 und p. 127 abstrahiert, wo er freilich einiges Einzige hinzufügen mußte, um seine obige Reflexion zustande zu bringen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '150'
- id: AT4.113.1
  kind: p
  original: '" Mithin ", fährt Sankt Max fort, "besteigt die Menschheit auf der Stufenleiter der Bildung durch die Gewohnheit die erste Sprosse, und da sie sich vorstellt, im Erklimmen der Kultur zugleich den Himmel, das Reich der Kultur oder zweiten Natur zu erklimmen, so besteigt sie wirklich die erste Sprosse der - Himmelsleiter." p. 90.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '150'
- id: AT4.114.1
  kind: p
  original: '"Mithin", d.h. weil Hegel mit China die Geschichte anfängt und weil "der Chinese nicht außer Fassung kommt", verwandelt "Stirner" die Menschheit in eine Person, die "auf der Stufenleiter der Kultur die erste Sprosse" ersteigt, und zwar "durch die Gewohnheit", weil China für Stirner keine andre Bedeutung hat, als "die Gewohnheit" zu sein.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '150'
- id: AT4.114.2
  kind: p
  original: Jetzt handelt es sich für unsren Eiferer gegen das Heilige nur noch darum, die "Stufenleiter" in die "Himmelsleiter" zu verwandeln, da China auch noch den Namen des Himmlischen Reichs führt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '150'
- id: AT4.114.3
  kind: p
  original: '"Da die Menschheit sich vorstellt" ("woher nur" Stirner "Alles das weiß, was" die Menschheit sich vorstellt, Wigand, p. 189) - was Stirner zu beweisen hatte - erstens "die Kultur" in "den Himmel der Kultur" und zweitens "den Himmel der Kultur" in "die Kultur des Himmels" zu verwandeln (eine angebliche Vorstellung der Menschheit, die p. 91 als Vorstellung Stirners auftritt und dadurch ihren richtigen Ausdruck erhält), "so besteigt sie wirklich die erste Sprosse der Himmelsleiter."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '150'
- id: AT4.114.4
  kind: p
  original: Da sie sich vorstellt, die erste Sprosse der Himmelsleiter zu besteigen - - so - - besteigt sie sie wirklich!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '150'
- id: AT4.114.5
  kind: p
  original: '"Da" "der Jüngling" "sich vorstellt", reiner Geist zu werden, wird er es wirklich!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '150'
- id: AT4.114.6
  kind: p
  original: Siehe "Jüngling" und "Christ" über den Übergang aus der Welt der Dinge in die Welt des Geistes, wo sich die einfache Formel für diese Himmelsleiter der "einzigen" Gedanken vorfindet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '150'
- id: AT4.115.1
  kind: p
  original: Siebente geschichtliche Reflexion. p. 90. "Hat das Mongolentum" (folgt unmittelbar auf die Himmelsleiter, womit nämlich "Stirner" vermittelst der angeblichen Vorstellung der Menschheit ein geistiges Wesen konstatiert hat) - "hat das Mongolentum das Dasein geistiger Wesen festgestellt" (vielmehr "Stirner" seine Einbildung vom geistigen Wesen der Mongolen festgestellt), " so haben die Kaukasier Jahrtausende mit diesen geistigen Wesen gerungen, um ihnen auf den Grund zu kommen."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '150'
- id: AT4.115.2
  kind: p
  original: (Jüngling, der zum Manne wird und "hinter die Gedanken zu kommen", Christ, der die "Tiefen der Gottheit zu ergründen" "allezeit trachtet".)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '150'
- id: AT4.115.3
  kind: p
  original: 'Weil die Chinesen das Dasein Gott weiß welcher geistigen Wesen konstatiert haben ("Stirner" konstatiert außer seiner Himmelsleiter kein einziges), so müssen die Kaukasier Jahrtausende sich mit "diesen" chinesischen "geistigen Wesen" herumzanken; ja, Stirner konstatiert zwei Zeilen weiter, daß sie wirklich den " mongolischen Himmel, den Thiän, gestürmt haben", und fährt fort: "Wann werden sie diesen Himmel vernichten, wann werden sie endlich wirkliche Kaukasier werden und sich selber finden?"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 150-151
- id: AT4.115.4
  kind: p
  original: Hier haben wir die negative Einheit, die früher schon als Mann auftrat, als "wirklichen Kaukasier", d.h. als nicht negerhaften, nicht mongolischen - als kaukasischen Kaukasier, der hier also als Begriff, als Wesen von den wirklichen Kaukasiern getrennt, ihnen entgegengestellt wird als "Ideal des Kaukasiers", als "Beruf", in dem "sie sich selber finden" sollen, als "Bestimmung", "Aufgabe", als "das Heilige", "der heilige" Kaukasier, "der vollendete" Kaukasier, "welcher eben der" Kaukasier "im Himmel - Gott ist".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: AT4.116.1
  kind: p
  original: '"Im industriösen Ringen der mongolischen Rasse hatten die Menschen einen Himmel erbaut" - so glaubt p. 91 "Stirner", der es vergißt, daß die wirklichen Mongolen viel mehr mit den Hämmeln, als mit den Himmeln zu haben - "als die vom kaukasischen Stamme, solange sie - - es mit dem Himmel zu tun haben - - die himmelstürmende Tätigkeit übernahmen."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: AT4.116.2
  kind: p
  original: Hatten Himmel erbaut, als - -, solange haben, - - übernahmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: AT4.116.3
  kind: p
  original: Die anspruchslose "geschichtliche Reflexion" drückt sich in einer consecutio temporum <Aufeinanderfolge der grammatischen Zeitformen> die ebenfalls keinen "Anspruch" auf Klassizität "oder auch nur" auf grammatische Richtigkeit "macht"; der Konstruktion der Geschichte entspricht die Konstruktion der Sätze; "darauf beschränken sich" "Stirners" "Ansprüche" und "erreichen damit ihr letztes Absehen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: AT4.117.1
  kind: p
  original: 'Achte geschichtliche Reflexion, die die Reflexion der Reflexionen, das Alpha und Omega der ganzen Stirnerschen Geschichte ist: Jacques le bonhomme sieht in der ganzen bisherigen Völkerbewegung, was wir ihm von Anfang an nachweisen, nur eine Aufeinanderfolge von Himmeln (p. 91), was auch so ausgedrückt werden kann, daß die bisherigen aufeinanderfolgenden Generationen kaukasischer Rasse weiter nichts taten als sich mit dem Begriff der Sittlichkeit herumzanken (p. 92) und daß "darauf sich ihre Tat beschränkt" (p. 91).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: AT4.117.2
  kind: p
  original: Hätten sie sich die leidige Sittlichkeit, diesen Spuk, aus dem Kopfe geschlagen, so würden sie es zu etwas gebracht haben; so aber kamen sie zu Nichts und wieder Nichts und müssen sich von Sankt Max wie Schuljungen ein Pensum stellen lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: AT4.117.3
  kind: p
  original: Dieser seiner Geschichtsanschauung entspricht denn vollständig, daß am Schluß (p. 92) die spekulative Philosophie heraufbeschworen wird, damit "in ihr dies Himmelreich, das Reich der Geister und Gespenster, seine rechte Ordnung finde" - und an einer späteren Stelle als das "vollendete Geisterreich" selbst gefaßt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 151-152
- id: AT4.118.1
  kind: p
  original: Warum man, wenn man die Geschichte in Hegelscher Manier auffaßt, zuletzt zu dem in der spekulativen Philosophie vollendeten und in Ordnung gebrachten Geisterreich als dem Ergebnis der bisherigen Geschichte kommen mußte - dies Geheimnis konnte "Stirner" bei Hegel selbst sehr einfach enthüllt finden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: AT4.118.2
  kind: p
  original: Um zu diesem Resultat zu kommen, "muß der Begriff des Geistes zugrunde gelegt und nun gezeigt werden, daß die Geschichte der Prozeß des Geistes selbst ist".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: AT4.118.3
  kind: p
  original: ("Gesch[ichte] der Phil[osophie]" III, p. 91) Nachdem "der Begriff des Geistes" der Geschichte als Grundlage untergeschoben worden ist, kann man natürlich sehr leicht "zeigen", daß er sich überall wiederfindet, und dies dann als einen Prozeß "seine rechte Ordnung finden" lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: AT4.119.1
  kind: p
  original: 'Jetzt kann Sankt Max, nachdem er Alles "seine rechte Ordnung hat finden" lassen, begeistert ausrufen: "Dem Geiste Freiheit erwerben wollen, das ist Mongolentum" usw. (vergl. p. 17: "Den reinen Gedanken zutage zu fördern etc., das ist Jünglingslust" etc.) und die Heuchelei begehen, zu sagen: "Es springt daher in die Augen, daß das Mongolentum -- die Unsinnlichkeit und Unnatur repräsentiere" etc. - wo er hätte sagen müssen: Es springt in die Augen, daß der Mongole nur der verkleidete Jüngling ist, der als Negation der Welt der Dinge auch "Unnatur", "Unsinnlichkeit" etc. genannt werden kann.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: AT4.120.1
  kind: p
  original: 'Wir sind jetzt wieder so weit, daß der "Jüngling" in den "Mann" übergehen kann: "Wer aber wird den Geist in sein Nichts auflösen?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: AT4.120.2
  kind: p
  original: Er, der mittelst des Geistes die Natur als das Nichtige, Endliche, Vergängliche darstellte" (d.h. sich vorstellte - und dies tat nach p. 16 ff. der Jüngling, später der Christ, dann der Mongole, dann der mongolenhafte Kaukasier, eigentlich aber nur der Idealismus), "er kann allein auch den Geist zu gleicher Nichtigkeit" (nämlich in seiner Einbildung) "herabsetzen" (also der Christ pp.? Nein, ruft "Stirner", mit einer ähnlichen Eskamotage wie p. 19/20 beim Mann), "Ich kann es, Jeder unter Euch kann es, der als unumschränktes Ich waltet und schafft" (in seiner Einbildung), "es kann's mit Einem Worte - der Egoist " (p. 93) - also der Mann, der kaukasische Kaukasier, der sonach der vollendete Christ, der rechte Christ, der Heilige, das Heilige ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: AT4.121.1
  kind: p
  original: Ehe wir auf die weitere Namengebung eingehen, "wollen wir an dieser Stelle" ebenfalls "eine geschichtliche Reflexion" über den Ursprung von Stirners "geschichtlicher Reflexion über Unser Mongolentum einlegen", die sich aber von der Stirnerschen dadurch unterscheidet, daß sie allerdings "Anspruch auf Gründlichkeit und Bewährtheit macht".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: AT4.121.2
  kind: p
  original: Seine ganze geschichtliche Reflexion, wie die über die "Alten", ist aus Hegel zusammengebraut.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: AT4.121.3
  kind: p
  original: '"Die Negerhaftigkeit wird darum als "das Kind" aufgefaßt, weil Hegel, Phil[osophie] d[er] Gesch[ichte]" p. 89, sagt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: AT4.122.1
  kind: p
  original: '"Afrika ist das Kinderland der Geschichte."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: AT4.122.2
  kind: p
  original: '"Bei der Bestimmung des afrikanischen" (negerhaften) "Geistes müssen wir auf die Kategorie der Allgemeinheit ganz Verzicht leisten" p. 90 - d.h. das Kind oder der Neger hat zwar Gedanken, aber noch nicht den Gedanken.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: AT4.122.3
  kind: p
  original: '"Bei den Negern ist das Bewußtsein noch nicht zu einer festen Objektivität gekommen, wie z.B. Gott, Gesetz, worin der Mensch die Anschauung seines Wesens hätte" - - "wodurch ganz das Wissen von einem absoluten Wesen fehlt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: AT4.122.4
  kind: p
  original: Der Neger stellt den natürlichen Menschen in seiner ganzen Unbändigkeit dar." (p. 90.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: AT4.122.5
  kind: p
  original: '"Obgleich sie sich der Abhängigkeit vom Natürlichen" (den Dingen, wie "Stirner" sagt) "bewußt sein müssen, so führt dies doch nicht zum Bewußtsein eines Höheren." p. 91.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: AT4.123.1
  kind: p
  original: Hier finden wir sämtliche Stirnersche Bestimmungen des Kindes und Negers wieder - Abhängigkeit von den Dingen, Unabhängigkeit von Gedanken, speziell von "dem Gedanken", "dem Wesen", "dem absoluten" (heiligen) "Wesen" pp.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: AT4.124.1
  kind: p
  original: Die Mongolen und speziell die Chinesen fand er bei Hegel als den Anfang der Geschichte vor, und da diesem ebenfalls die Geschichte eine Geistergeschichte (nur nicht so kindisch wie "Stirners") ist, so versteht es sich von selbst, daß die Mongolen den Geist in die Geschichte gebracht haben und die Urrepräsentanten alles "Heiligen" sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: AT4.124.2
  kind: p
  original: Speziell faßt Hegel noch p. 110 "das mongolische Reich" (des Dalai Lama) als "das geistliche ", das "Reich der theokratischen Herrschaft", ein "geistiges, religiöses Reich" - gegenüber dem chinesischen weltlichen Reich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: AT4.124.3
  kind: p
  original: '"Stirner" muß natürlich China mit den Mongolen identifizieren. p. 140 kommt bei Hegel sogar "das mongolische Prinzip" vor, woraus "Stirner" das "Mongolentum" macht.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: AT4.124.4
  kind: p
  original: Wenn er übrigens einmal die Mongolen auf die Kategorie "der Idealismus" reduzieren wollte, so konnte er in der Dalai-Lama-Wirtschaft und dem Buddhismus ganz andere "geistige Wesen" "festgestellt finden" als seine gebrechliche "Himmelsleiter".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: AT4.124.5
  kind: p
  original: Aber er hatte nicht einmal die Zeit, die Hegelsche Geschichtsphilosophie ordentlich anzusehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: AT4.124.6
  kind: p
  original: Die Eigenheit und Einzigkeit des Stirnerschen Verhaltens zur Geschichte besteht darin, daß der Egoist sich in einen "unbeholfenen" Kopisten Hegels verwandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: AT4.125.1
  kind: heading
  original: b) Katholizismus und Protestantismus
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: AT4.126.1
  kind: heading
  original: (Vgl. die "Ökonomie des Alten Bundes")
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: AT4.127.1
  kind: p
  original: Was wir hier Katholizismus nennen, nennt "Stirner" "das Mittelalter"; da er aber das heilige, religiöse Wesen des Mittelalters, die Religion des Mittelalters, mit dem wirklichen, profanen, leibhaftigen Mittelalter verwechselt (wie "in Allem"), geben wir der Sache lieber gleich ihren richtigen Namen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 153-154
- id: AT4.128.1
  kind: p
  original: '"Das Mittelalter" war "eine lange Zeit, in der man sich mit dem Wahne begnügte" (weiter verlangte und tat man Nichts), "die Wahrheit zu haben, ohne daß man ernstlich daran dachte, ob man selbst wahr sein müßte, um die Wahrheit zu besitzen." - - "Im Mittelalter kasteite man " (also das ganze Mittelalter) " sich, um fähig zu werden, das Heilige in sich aufzunehmen." p. 108.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: AT4.129.1
  kind: p
  original: Hegel bestimmt das Verhältnis zum Göttlichen in der katholischen Kirche dahin,
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: AT4.130.1
  kind: p
  original: '"daß man sich zum Absoluten als bloß äußerlichem Ding verhalte" (Christentum in der Form des Äußerlichseins), "Gesch[ichte] der Phil[osophie]."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: AT4.130.2
  kind: p
  original: III, p. 148 und anderwärts.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: AT4.130.3
  kind: p
  original: Das Individuum muß allerdings gereinigt werden. um die Wahrheit aufzunehmen, aber "auch dies geschieht auf eine äußerliche Weise, durch Abkaufen, Abfasten, Abprügeln, Abmarschieren, Pilgrimschaft". (p. 140 ibid.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: AT4.131.1
  kind: p
  original: 'Diesen Übergang macht "Stirner" durch:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: AT4.132.1
  kind: p
  original: '"Wie man freilich auch sein Auge anstrengt, um das Entfernte zu sehen, - - so kasteite man sich etc."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: AT4.133.1
  kind: p
  original: Weil nun bei "Stirner" das Mittelalter mit dem Katholizismus identifiziert wird, endet es natürlich auch mit Luther. p. 108.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: AT4.133.2
  kind: p
  original: 'Dieser selbst wird auf folgende, schon beim Jüngling, im Gespräch mit Szeliga und sonst vorgekommene Begriffsbestimmung reduziert:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: AT4.134.1
  kind: p
  original: '"daß der Mensch, wenn er die Wahrheit auffassen wolle, ebenso wahr werden müsse wie die Wahrheit selbst.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: AT4.134.2
  kind: p
  original: Nur wer die Wahrheit schon im Glauben hat, kann ihrer teilhaftig werden."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: AT4.135.1
  kind: p
  original: 'Hegel sagt in bezug auf das Luthertum:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: AT4.136.1
  kind: p
  original: '"Die Wahrheit des Evangeliums [...] existiert nur im wahrhaften Verhalten zu demselben. - - Das wesentliche Verhalten des Geistes ist nur für den Geist. - - Es ist also das Verhalten des Geistes zu diesem Inhalt, daß der Inhalt zwar wesentlich ist, daß aber ebenso wesentlich ist, daß der heilige und heiligende Geist sich zu ihm verhalte." ("Gesch. d. Phil." III. p. 234.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: AT4.136.2
  kind: p
  original: '"Dies ist nun der lutherische Glaube - sein" (nämlich des Menschen) " Glaube ist gefordert und kann allein wahrhaft in Betracht kommen." (l.c.p. 230.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: AT4.136.3
  kind: p
  original: '"Luther - - behauptet: daß das Göttliche nur insofern göttlich ist, als es in dieser subjektiven Geistigkeit des Glaubens genossen wird." (l.c.p. 138.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: AT4.136.4
  kind: p
  original: '"Die Lehre der" (katholischen) "Kirche ist die Wahrheit als vorhandene Wahrheit." ("Ph[ilosophie] der Rel[igion]" II, p. 331.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: AT4.137.1
  kind: p
  original: '"Stirner" fährt fort:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: AT4.138.1
  kind: p
  original: '"Demnach geht mit Luther die Erkenntnis auf, daß die Wahrheit, weil sie Gedanke ist, nur für den denkenden Menschen sei, und dies heißt, daß der Mensch einen schlechterdings andern Standpunkt einnehmen müsse, den gläubigen" (per appos[itionem]), "wissenschaftlichen, oder den Standpunkt des Denkens gegenüber seinem Gegenstande, dem Gedanken." p. 110.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 154-155
- id: AT4.139.1
  kind: p
  original: Außer der Wiederholung, die "Stirner" hier wieder "einlegt", ist nur der Übergang vom Glauben zum Denken zu beachten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.139.2
  kind: p
  original: 'Diesen Übergang macht Hegel wie folgt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.140.1
  kind: p
  original: '"Dieser Geist" (nämlich der heilige und heiligende Geist) "ist zweitens aber wesentlich auch denkender Geist.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.140.2
  kind: p
  original: Das Denken als solches muß sich auch darin entwickeln etc." p. 234.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.141.1
  kind: p
  original: '"Stirner" fährt fort:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.142.1
  kind: p
  original: '"Dieser Gedanke" ("daß Ich Geist bin, nur Geist") "durchzieht die Reformationsgeschichte bis heute." p. 111.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.143.1
  kind: p
  original: Eine andre Geschichte als die Reformationsgeschichte existiert für "Stirner" vom sechzehnten Jahrhundert an nicht - und auch diese bloß in der Auffassung, in der Hegel sie darstellt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.144.1
  kind: p
  original: Sankt Max hat wieder seinen Riesenglauben bewiesen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.144.2
  kind: p
  original: Er hat wieder sämtliche Illusionen der deutschen spekulativen Philosophie wörtlich für wahr genommen, ja er hat sie noch spekulativer, noch abstrakter gemacht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.144.3
  kind: p
  original: Für ihn existiert nur die Geschichte der Religion und Philosophie - und diese existiert nur durch Hegel für ihn, der mit der Zeit zur allgemeinen Eselsbrücke, zum Konversationslexikon aller neuen deutschen Prinzipspekulanten und Systemfabrikanten geworden ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.145.1
  kind: p
  original: Katholizismus = Verhalten zur Wahrheit als Ding, Kind, Neger, "Alter".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.145.2
  kind: p
  original: Protestantismus = Verhalten zur Wahrheit im Geist, Jüngling, Mongole, "Neuer".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.146.1
  kind: p
  original: Die ganze Konstruktion war überflüssig, da dies Alles schon beim "Geist" dagewesen war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.147.1
  kind: p
  original: Wie schon in der "Ökonomie des Alten Bundes" angedeutet, kann man nun innerhalb des Protestantismus wieder Kind und Jüngling in neuen "Wandlungen" auftreten lassen, wie "Stirner" dies p. 112 tut, wo er die englische, empirische Philosophie als Kind in Gegensatz zur deutschen, spekulativen Philosophie, dem Jüngling, faßt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.147.2
  kind: p
  original: Er schreibt hier wieder Hegel aus, der hier wie sonst "im Buche" sehr häufig als "Man" auftritt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.148.1
  kind: p
  original: '"Man" - d.h. Hegel - "verwies den Baco aus dem Reiche der Philosophie."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.148.2
  kind: p
  original: '"Und weiter scheint es allerdings dasjenige, was man englische Philosophie nennt, nicht gebracht zu haben als bis zu den Entdeckungen sogenannter offner Köpfe wie Bacon und Hume" (p. 112) -'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.149.1
  kind: p
  original: 'was Hegel so ausdrückt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: AT4.150.1
  kind: p
  original: '"Bacon ist in der Tat eigentlich der Anführer und Repräsentant dessen, was in England Philosophie genannt wird und worüber die Engländer noch durchaus nicht hinausgekommen sind."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: AT4.150.2
  kind: p
  original: '"Gesch[ichte] d[er] Phil[osophie]", III, p. 254.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: AT4.151.1
  kind: p
  original: Was "Stirner" "offene Köpfe" nennt, nennt Hegel, l. c. p. 255, "gebildete Weltmänner" - diese verwandelt Sankt Max einmal auch in "die Einfalt des kindlichen Gemütes", weil die englischen Philosophen das Kind repräsentieren müssen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: AT4.151.2
  kind: p
  original: Aus demselben kindlichen Grunde darf "sich Baco nicht um die theologischen Fragen und Kardinalpunkte bekümmert" haben, was auch seine Schriften (speziell "De Augmentis Scientiarum", "Novum Organum" und die Essays) sagen mögen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: AT4.151.3
  kind: p
  original: Dagegen "sieht - - das deutsche Denken - - im Erkennen selbst erst das Leben" (p. 112), denn es ist der Jüngling.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: AT4.151.4
  kind: p
  original: 'Ecce iterum Crispinus! <übertragen: "Wieder dieselbe Figur!">'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: AT4.152.1
  kind: p
  original: Wie Stirner den Cartesius in einen deutschen Philosophen verwandelt, kann man "im Buche" p. 112 selbst nachsehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: AT4.153.1
  kind: heading
  original: D) Die Hierarchie
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: AT4.154.1
  kind: p
  original: Jacques le bonhomme faßt in der bisherigen Darstellung die Geschichte nur als das Produkt abstrakter Gedanken - oder vielmehr seiner Vorstellungen von den abstrakten Gedanken -, als beherrscht von diesen Vorstellungen, die sich alle in letzter Instanz in "das Heilige" auflösen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: AT4.154.2
  kind: p
  original: Diese Herrschaft des "Heiligen", des Gedankens, der Hegelschen absoluten Idee über die empirische Welt stellt er nun als gegenwärtiges historisches Verhältnis dar, als Herrschaft der Heiligen, Ideologen über die profane Welt - als Hierarchie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: AT4.154.3
  kind: p
  original: In dieser Hierarchie haben wir das, was früher nacheinander erschien, nebeneinander, so daß eine der beiden koexistierenden Entwicklungsformen über die andre herrscht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: AT4.154.4
  kind: p
  original: So herrscht also der Jüngling über das Kind, der Mongole über den Neger, der Neue über den Alten, der aufopfernde Egoist (citoyen) über den Egoisten im gewöhnlichen Verstande (bourgeois) etc. - siehe die "Ökonomie des Alten Bundes".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: AT4.154.5
  kind: p
  original: Die "Vernichtung" der "Welt der Dinge" durch die "Welt des Geistes" tritt hier als "Herrschaft" der "Welt der Gedanken" über die "Welt der Dinge" auf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: AT4.154.6
  kind: p
  original: Es muß natürlich dahin kommen, daß die Herrschaft, die die "Welt der Gedanken" von Anfang an in der Geschichte führt, am Ende derselben auch als wirkliche, faktisch existierende Herrschaft der Denkenden - und wie wir sehen werden, in letzter Instanz der spekulativen Philosophen - über die Welt der Dinge dargestellt wird, so daß Sankt Max dann nur noch gegen Gedanken und Vorstellungen der Ideologen zu kämpfen und sie zu überwinden hat, um sich zum "Eigner der Welt der Dinge und der Welt der Gedanken" zu machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: AT4.155.1
  kind: p
  original: '" Hierarchie ist Gedankenherrschaft, Herrschaft des Geistes.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: AT4.155.2
  kind: p
  original: Hierarchisch sind wir bis auf diesen Tag, unterdrückt von denen, die sich auf Gedanken stützen, und Gedanken sind" - wer hat das nicht längst gemerkt - " das Heilige." (p. 97.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: AT4.155.3
  kind: p
  original: (Stirner hat vor dem Vorwurf, als mache er in seinem ganzen Buch nur "Gedanken", d.h. "das Heilige", dadurch zu bewahren gesucht, daß er darin wirklich nirgendwo Gedanken macht. Allerdings schreibt er sich bei Wigand "Virtuosität im Denken", d.h. nach ihm in der Fabrikation "des Heiligen" zu - und das letztere wird ihm konzediert.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: AT4.155.4
  kind: p
  original: '- "Hierarchie ist Oberherrlichkeit des Geistes." p. 467.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: AT4.155.5
  kind: p
  original: '- "Jene mittelaltrige Hierarchie war nur eine schwächliche Hierarchie gewesen, da sie alle mögliche Barbarei des Profanen unbezwungen neben sich hergehen lassen mußte" ("woher nur Stirner das alles weiß, was die Hierarchie mußte", wird sich gleich finden), "und erst die Reformation stählte die Kraft der Hierarchie." p. 110.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: AT4.155.6
  kind: p
  original: '"Stirner" meint nämlich, "die Geisterherrschaft sei nie zuvor so umfassend und allmächtig gewesen" als nach der Reformation; er meint, daß diese Geisterherrschaft, "statt das religiöse Prinzip von Kunst, Staat und Wissenschaft loszureißen, vielmehr diese ganz aus der Wirklichkeit in das Reich des Geistes erhob und religiös machte".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: AT4.156.1
  kind: p
  original: In dieser Auffassung der neueren Geschichte ist nur wieder die alte Illusion der spekulativen Philosophie über die Herrschaft des Geistes in der Geschichte breitgetreten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: AT4.156.2
  kind: p
  original: Ja, diese Stelle zeigt sogar, wie der gläubige Jacques le bonhomme fortwährend die ihm von Hegel überkommene, für ihn traditionell gewordene Weltanschauung für die Wirkliche Welt auf Treu und Glauben annimmt und nun von diesem Boden aus "machiniert".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: AT4.156.3
  kind: p
  original: Was an dieser Stelle "eigen" und "einzig" erscheinen könnte, ist die Auffassung dieser Geistesherrschaft als Hierarchie - und hier wollen wir wiederum eine kurze "geschichtliche Reflexion" über den Ursprung der Stirnerschen "Hierarchie" "einlegen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: AT4.157.1
  kind: p
  original: 'Hegel spricht sich in folgenden "Wandlungen" über die Philosophie der Hierarchie aus:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: AT4.158.1
  kind: p
  original: '"Wir haben bei Plato in seiner Republik die Idee gesehen, daß die Philosophen regieren sollen; jetzt" (im katholischen Mittelalter) "ist die Zeit, wo es ausgesprochen wird, daß das Geistige herrschen solle; aber das Geistige hat den Sinn erhalten, daß das Geistliche, die Geistlichen herrschen sollen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: AT4.158.2
  kind: p
  original: Das Geistige ist so zur besondern Gestalt, zum Individuum gemacht."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: AT4.158.3
  kind: p
  original: ("Gesch[ichte] d[er] Phil[osophie]" III, p. 132.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: AT4.158.4
  kind: p
  original: '- "Die Wirklichkeit, das Irdische, ist damit gottverlassen - - einzelne wenige Individuen sind heilig, die Andern unheilig." (l. c. p. 136.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: AT4.158.5
  kind: p
  original: Die "Gottverlassenheit" wird näher so bestimmt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: AT4.158.6
  kind: p
  original: '"Alle diese Formen" (Familie, Arbeit, Staatsleben etc.) "gelten als nichtige, unheilige." ("Phil[osophie] d[er] Rel[igion]" II, p. 343.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: AT4.158.7
  kind: p
  original: '- "Es ist eine Vereinigung mit der Weltlichkeit, die unversöhnt ist, die Weltlichkeit roh in sich" (wofür Hegel sonst das Wort Barbarei braucht, vergl. z.B. "Gesch. d. Phil." III, p. 136). "und die roh in sich nur beherrscht wird." ("Phil. d. Rel." II, p. 342, 343.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: AT4.158.8
  kind: p
  original: '- "Diese Herrschaft" (die Hierarchie der katholischen Kirche) "ist also, obgleich sie Herrschaft des Geistigen sein soll, eine Herrschaft der Leidenschaft." ("Gesch. d. Phil." III. p. 134.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 157-158
- id: AT4.158.9
  kind: p
  original: '- "Die wahrhafte Herrschaft des Geistes kann aber nicht Herrschaft des Geistes in dem Sinne sein, daß das Gegenüberstehende ein Unterworfenes ist." (l. c. p. 131.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: AT4.158.10
  kind: p
  original: '"Der rechte Sinn ist, daß das Geistige als solches " (nach "Stirner" "das Heilige") "das Bestimmende sein soll, was bis auf unsere Zeiten gegangen ist: So sehen wir in der französischen Revolution " (was "Stirner" Hegel nachsieht), "daß der abstrakte Gedanke herrschen soll; nach ihm sollen Staatsverfassungen und Gesetze bestimmt werden, er soll das Band unter den Menschen ausmachen, und das Bewußtsein der Menschen soll sein, daß das, was unter ihnen gilt, abstrakte Gedanken sind, Freiheit und Gleichheit etc." ("Gesch. d. Phil." III, p. 132.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: AT4.158.11
  kind: p
  original: Die wahre Herrschaft des Geistes im Gegensatz zu ihrer unvollkommenen Form in der katholischen Hierarchie, wie sie durch den Protestantismus herbeigeführt wird, wird weiter dahin bestimmt, daß "das Weltliche in sich vergeistigt wird". ("Gesch. d. Phil." III, p. 185.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: AT4.158.12
  kind: p
  original: '"Daß das Göttliche sich im Felde der Wirklichkeit realisiert" (also die katholische Gottverlassenheit der Wirklichkeit aufhört - "Phil. d. Rel." II, p. 343); daß der "Widerspruch" zwischen Heiligkeit und Weltlichkeit "sich auflöst in der Sittlichkeit " ("Phil.d. Rel." II, p. 343); daß " die Institutionen der Sittlichkeit " (Ehe, Familie, Staat, Selbsterwerb etc.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: AT4.158.13
  kind: p
  original: '" göttliche, heilige " sind. ("Phil. d. Rel." II, p. 344.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: AT4.158.14
  kind: p
  original: 'Diese wahre Herrschaft des Geistes spricht Hegel in zwei Formen aus: " Staat, Regierung, Recht, Eigentum, bürgerliche Ordnung " (und wie wir aus andern Werken von ihm wissen, auch Kunst, Wissenschaft etc.), "alles dies ist das Religiöse - - herausgetreten in die Form der Endlichkeit." ("Gesch. d. Ph." III, p. 185.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: AT4.158.15
  kind: p
  original: 'Und diese Herrschaft des Religiösen, Geistigen etc. wird endlich ausgesprochen als die Herrschaft der Philosophie: "Das Bewußtsein des Geistigen ist jetzt" (im achtzehnten Jahrhundert) "wesentlich das Fundament, und die Herrschaft ist dadurch der Philosophie geworden." ("Phil. d. Gesch." p. 440.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: AT4.159.1
  kind: p
  original: Hegel schiebt also der katholischen Hierarchie des Mittelalters die Absicht unter, als hätte sie "die Herrschaft des Geistes sein" wollen, und faßt sie demnächst als eine beschränkte, unvollkommene Form dieser Geistesherrschaft, deren Vollendung er im Protestantismus und dessen angeblicher Ausbildung sieht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: AT4.159.2
  kind: p
  original: So unhistorisch dies ist, so ist er doch noch historisch genug, um den Namen der Hierarchie nicht über das Mittelalter hinaus auszudehnen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: AT4.159.3
  kind: p
  original: Sankt Max weiß aber aus ebendemselben Hegel, daß die spätere Epoche die "Wahrheit" der früheren ist, also die Epoche der vollkommenen Herrschaft des Geistes die Wahrheit der Epoche, in welcher der Geist nur noch unvollkommen herrschte, daß also der Protestantismus die Wahrheit der Hierarchie, also die wahre Hierarchie ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: AT4.159.4
  kind: p
  original: Da aber nur die wahre Hierarchie den Namen der Hierarchie verdient, so ist es klar, daß die Hierarchie des Mittelalters eine "schwächliche" sein mußte, was ihm um so leichter zu beweisen wird, als in den obigen und hundert andern Hegelschen Stellen die Unvollkommenheit der Geistesherrschaft im Mittelalter dargestellt war, was er nur abzuschreiben brauchte und wobei seine ganze " eigne " Tätigkeit darin bestand, das Wort "Geistesherrschaft" durch "Hierarchie" zu ersetzen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 158-159
- id: AT4.159.5
  kind: p
  original: Die einfache Schlußfolge, durch welche sich ihm die Geistesherrschaft schlechthin in die Hierarchie verwandelte, brauchte er nicht einmal zu machen, nachdem es unter den deutschen Theoretikern Mode geworden war, die Wirkung mit dem Namen der Ursache zu belegen und Alles z.B. in die Kategorie der Theologie zurückzuwerfen, was aus der Theologie hervorgegangen war und noch nicht ganz auf der Höhe der Prinzipien dieser Theoretiker stand - z.B. die Hegelsche Spekulation, den Straußischen Pantheismus pp. - ein Kunststück, das namentlich im Jahre 1842 an der Tagesordnung war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: AT4.159.6
  kind: p
  original: Aus den obigen Stellen geht ebenfalls hervor, daß Hegel 1. die französische Revolution als eine neue und vollendetere Phase dieser Geistesherrschaft faßt, 2. in den Philosophen die Weltherrscher des neunzehnten Jahrhunderts sieht, 3. behauptet, daß jetzt nur abstrakte Gedanken unter den Menschen gelten, 4. daß schon bei ihm Ehe, Familie, Staat, Selbsterwerb, bürgerliche Ordnung, Eigentum pp. als "Göttlich und Heilig", als "das Religiöse" gefaßt werden, und 5. daß die Sittlichkeit als verweltlichte Heiligkeit oder geheiligte Weltlichkeit, als die höchste und letzte Form der Herrschaft des Geistes über die Welt dargestellt wird - Alles Dinge, die wir bei "Stirner" wörtlich wiederfinden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: AT4.160.1
  kind: p
  original: Hiernach wäre in Beziehung auf die Stirnersche Hierarchie gar nichts mehr zu sagen und nachzuweisen, als warum Sankt Max Hegel abgeschrieben hat - ein Faktum, zu dessen Erklärung aber wieder materielle Fakta notwendig sind und das deshalb nur für diejenigen erklärlich ist, die die Berliner Luft kennen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: AT4.160.2
  kind: p
  original: Eine andre Frage ist, wie die Hegelsche Vorstellung von der Herrschaft des Geistes zustande kommt, und hierüber siehe oben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: AT4.161.1
  kind: p
  original: Die Adoption der Hegelschen Weltherrschaft der Philosophen und ihre Verwandlung in eine Hierarchie durch Sankt Max kommt vermittelst der gänzlich unkritischen Leichtgläubigkeit unsres Heiligen und durch eine "heilige" oder heillose Unwissenheit zustande, die sich damit begnügt, die Geschichte zu "durchschauen" (d.h. die Hegelschen geschichtlichen Sachen durchzuschauen), ohne von ihr viele "Dinge" zu "wissen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: AT4.161.2
  kind: p
  original: Überhaupt müßte er ja fürchten, sobald er "lernte" - sich nicht mehr "abschaffend und auflösend" (p. 96) zu verhalten, also in der "Geschäftigkeit des Ungeziefers" steckenzubleiben - Grund genug, um nicht zur "Abschaffung und Auflösung" seiner eignen Unwissenheit "weiterzugehen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: AT4.162.1
  kind: p
  original: Macht man, wie Hegel, eine solche Konstruktion zum ersten Male für die ganze Geschichte und die gegenwärtige Welt in ihrem ganzen Umfange, so ist dies nicht möglich ohne umfassende positive Kenntnisse, ohne wenigstens stellenweise auf die empirische Geschichte einzugehen, ohne große Energie und Tiefblick.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 159-160
- id: AT4.162.2
  kind: p
  original: Begnügt man sich dagegen, eine vorhandene überlieferte Konstruktion zu seinen eignen Zwecken zu exploitieren und umzuwandeln und diese "eigene" Auffassung an einzelnen Exempeln (z.B. Negern und Mongolen, Katholiken und Protestanten, der französischen Revolution pp.) nachzuweisen - und dies tut unser Eiferer wider das Heilige - so ist dazu durchaus keine Kenntnis der Geschichte nötig.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: AT4.162.3
  kind: p
  original: Das Resultat dieser ganzen Exploitation wird notwendig komisch; am komischsten, wenn aus der Vergangenheit in die unmittelbarste Gegenwart hinübergesprungen wird, wie wir davon beim "Sparren" schon Exempel fanden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: AT4.163.1
  kind: p
  original: Was nun die wirkliche Hierarchie des Mittelalters betrifft, so bemerken wir hier bloß, daß diese für das Volk, für die große Masse der Menschen nicht existierte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: AT4.163.2
  kind: p
  original: Für die große Masse existierte nur die Feudalität, und die Hierarchie nur, insofern sie selbst entweder Feudalität oder antifeudal (innerhalb der Feudalität) ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: AT4.163.3
  kind: p
  original: Die Feudalität selbst hat ganz empirische Verhältnisse zu ihrer Grundlage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: AT4.163.4
  kind: p
  original: Die Hierarchie und ihre Kämpfe mit der Feudalität (die Kämpfe der Ideologen einer Klasse gegen die Klasse selbst) sind nur der ideologische Ausdruck der Feudalität und der innerhalb der Feudalität selbst sich entwickelnden Kämpfe, wozu auch die Kämpfe der feudalistisch organisierten Nationen unter sich gehören.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: AT4.163.5
  kind: p
  original: Die Hierarchie ist die ideale Form der Feudalität; die Feudalität - die politische Form der mittelaltrigen Produktions- und Verkehrsverhältnisse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: AT4.163.6
  kind: p
  original: Aus der Darstellung dieser praktischen, materiellen Verhältnisse ist also allein der Kampf der Feudalität gegen die Hierarchie zu erklären; mit dieser Darstellung hört von selbst die bisherige Geschichtsauffassung auf, die die Illusionen des Mittelalters auf Treu und Glauben annahm, namentlich die Illusionen, die Kaiser und Papst in ihrem Kampfe gegeneinander geltend machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: AT4.164.1
  kind: p
  original: Da Sankt Max nur Hegels Abstraktionen über Mittelalter und Hierarchie auf "pomphafte Worte und armselige Gedanken" reduziert, ist keine Veranlassung gegeben, auf die wirkliche, geschichtliche Hierarchie weiter einzugehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: AT4.165.1
  kind: p
  original: Aus dem Obigen geht schon hervor, daß man das Kunststück auch umdrehen und den Katholizismus nicht nur als Vorstufe, sondern auch als Verneinung der wahren Hierarchie fassen kann; so ist also Katholizismus Negation des Geistes, Ungeist, Sinnlichkeit, und hierbei kommt dann der große Satz unsres Jacques le bonhomme heraus, daß die Jesuiten "Uns vor dem Verkommen und Untergang der Sinnlichkeit gerettet haben". (p. 118.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: AT4.165.2
  kind: p
  original: Was aus "Uns" geworden wäre, wenn der "Untergang" der Sinnlichkeit zustande gekommen, erfahren wir nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: AT4.165.3
  kind: p
  original: Die ganz[e] materielle Bewegung seit dem sechzehnten Jahrhundert, die "Uns" nicht vor dem "Verkommen" der Sinnlichkeit rettete, sondern im Gegenteil die "Sinnlichkeit" viel weiter ausbildete, existiert für "Stirner" nicht - es sind die Jesuiten, die alles das zustande gebracht haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 160-161
- id: AT4.165.4
  kind: p
  original: Man vergleiche übrigens Hegels "Phil[osophie] d[er] Gesch[ichte]", p. 425.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: AT4.166.1
  kind: p
  original: Indem Sankt Max die alte Pfaffenherrschaft in die neuere Zeit überträgt, hat er damit die neuere Zeit als "das Pfaffentum" aufgefaßt; und indem er diese in die neuere Zeit übertragene Pfaffenherrschaft wieder in ihrem Unterschiede von der alten mittelalterlichen Pfaffenherrschaft faßt, stellt er sie als Herrschaft der Ideologen, als "das Schulmeistertum" dar.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: AT4.166.2
  kind: p
  original: So ist also Pfaffentum = Hierarchie als Geistesherrschaft, Schulmeistertum = Geistesherrschaft als Hierarchie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: AT4.167.1
  kind: p
  original: Diesen einfachen Übergang auf das Pfaffentum, der gar kein Übergang ist, bringt "Stirner" in drei schweren Wandlungen fertig.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: AT4.168.1
  kind: p
  original: Zum ersten "hat" er den "Begriff des Pfaffentums" in Jedem, "der für eine große Idee, eine gute Sache" (noch immer die gute Sache!), "eine Lehre pp. lebt".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: AT4.169.1
  kind: p
  original: Zum Zweiten "stößt" Stirner in seiner Welt des Wahns auf "den uralten Wahn der Welt, die des Pfaffentums noch nicht entraten gelernt hat", nämlich "für eine Idee zu leben und zu schaffen pp.".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: AT4.170.1
  kind: p
  original: Zum Dritten "ist dies die Herrschaft der Idee oder das Pfaffentum", nämlich "Robespierre z.B."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: AT4.170.2
  kind: p
  original: (zum Beispiel!), "St.-Just usw." (und so weiter!) "waren durch und durch Pfaffen" pp. Alle drei Wandlungen, in denen das Pfaffentum "entdeckt", "aufgestoßen" und "berufen" wird (alle p. 100), drücken also weiter Nichts aus als was Sankt Max uns bereits früher schon wiederholt gesagt hat, nämlich die Herrschaft des Geistes, der Idee, des Heiligen über das "Leben" (ibid.).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: AT4.171.1
  kind: p
  original: Nachdem so der Geschichte die "Herrschaft der Idee oder das Pfaffentum" ein mal untergeschoben ist, kann Sankt Max natürlich ohne Schwierigkeit in der ganzen bisherigen Geschichte "das Pfaffentum" wiederfinden, und "Robespierre z.B., St-Just usw." als Pfaffen darstellen und mit Innozenz III. und Gregor VII. identifizieren, wo somit alle Einzigkeit vor dem Einzigen verschwindet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: AT4.171.2
  kind: p
  original: Sie sind ja Alle eigentlich nur verschiedene Namen, verschiedene Verkleidungen einer Person, "des" Pfaffentums, das die ganze Geschichte vom Anfang des Christentums an gemacht hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: AT4.171.3
  kind: p
  original: Wie man in dieser Art der Geschichtsauffassung "alle Kühe grau macht", indem man alle historischen Unterschiede "aufhebt" und in "den Begriff des Pfaffentums" "auflöst", davon gibt uns der heilige Max sogleich ein schlagendes Beispiel an "Robespierre z.B., St.-Just usw.".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: AT4.171.4
  kind: p
  original: Hier wird uns zuerst Robespierre als "Beispiel" von Saint-Just und Saint-Just als "undsoweiter" von Robespierre angeführt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 161-162
- id: AT4.171.5
  kind: p
  original: 'Sodann heißt es: "Diesen Vertretern heiliger Interessen steht eine Welt zahlloser ''persönlicher'', profaner Interessen gegenüber."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: AT4.171.6
  kind: p
  original: Wer stand ihnen gegenüber?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: AT4.171.7
  kind: p
  original: Die Girondins und Thermidoriens, die ihnen, den wirklichen Repräsentanten der revolutionären Force - d.h. der nur wirklich revolutionären Klasse, der "zahllosen" Masse - gegenüber beständig (siehe "Mémoires" de R. Levasseur "z.B.", "usw.", "d.h." Nougaret, "Hist[oire] des prisons" - Barère - "Deux amis de la liberté" (et du commerce) <(und des Handels)> - Montgaillard, "Hist[oire]de France" - Mme Roland, "Appel à la postérité" - "Mémoires" de J. B. Louvet - und selbst die ekelhaften "Essais historiques" par Beaulieu ppp., sowie sämtliche Verhandlungen vor dem Revolutionstribunal "usw.") die Verletzung der "heiligen Interessen", der Konstitution, der Freiheit, Gleichheit, Menschenrechte, Republikanismus, Recht, sainte propriété <heiliges Eigentum>, "z.B."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: AT4.171.8
  kind: p
  original: Teilung der Gewalten, Menschlichkeit, Sittlichkeit, Mäßigung "usw." vorwarfen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: AT4.171.9
  kind: p
  original: Ihnen standen gegenüber alle Pfaffen, die sie der Verletzung sämtlicher Haupt- und Nebenstücke des religiösen und moralischen Katechismus anklagten (siehe "z.B." "Histoire de clergé de France pendant la révolution" par M.R., Paris, libraire catholique 1828 "usw.").
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: AT4.171.10
  kind: p
  original: 'Die historische Glosse des Bürgers, daß während des règne de la terreur <Schreckensherrschaft> "Robespierre z.B., St.-Just usw." den honnêtes gens <anständigen Leuten> (siehe die unzähligen Schriften des einfältigen Herrn Peltier "z.B.", "Conspiration de Robespierre" par Montjoie "usw.") die Köpfe abschlugen, drückt der heilige Max in folgender Wandlung aus: "Weil die revolutionären Pfaffen oder Schulmeister dem Menschen dienten, darum schnitten sie den Menschen die Hälse ab."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: AT4.171.11
  kind: p
  original: Hiermit ist Sankt Max natürlich der Mühe überhoben, über die wirklichen, empirischen, auf höchst profanen Interessen, freilich nicht der Agioteurs, sondern der "zahllosen" Masse basierten Gründe des Kopfabschlagens auch nur ein "einziges" Wörtlein zu verlieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: AT4.171.12
  kind: p
  original: 'Ein früherer "Pfaffe", Spinoza, hatte bereits im siebzehnten Jahrhundert die Unverschämtheit, "ein Zuchtmeister" auf Sankt Max zu sein, indem er sagte: "Die Ignoranz ist kein Argument".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: AT4.171.13
  kind: p
  original: Dafür haßt der heilige Max auch den Pfaffen Spinoza so sehr, daß er seinen Antipfaffen, den Pfaffen Leibniz, akzeptiert und für alle dergleichen wundersame Phänomene, wie der Terrorismus "z.B.", das Kopfabschlagen "usw., einen "zureichenden Grund" produziert, nämlich, daß "die geistlichen Menschen sich so etwas in den Kopf gesetzt haben". (p. 98.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: AT4.172.1
  kind: p
  original: Der selige Max, der für Alles den zureichenden Grund gefunden hat ("Ich habe nun den Grund gefunden, an dem Mein Anker ewig hält", wo anders als in der Idee "z.B.", dem "Pfaffentum" "usw." von "Robespierre z.B." Saint-Just usw.", George Sand, Proudhon, die Berliner keusche Nähterin pp.), "verdenkt es der Bürgerklasse nicht, daß sie bei ihrem Egoismus anfragte, wie weit sie der revolutionären Idee Raum geben dürfe".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 162-163
- id: AT4.172.2
  kind: p
  original: Für Sankt Max ist "die revolutionäre Idee" der habits bleus und honnêtes gens von 1789 dieselbe "Idee" wie die der sansculottes von 1793, dieselbe Idee, worüber beraten wird, ob ihr "Raum zu geben" sei - worüber keiner "Idee" weiter "Raum gegeben" werden kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: AT4.173.1
  kind: p
  original: Wir kommen jetzt auf die gegenwärtige Hierarchie, die Herrschaft der Idee im gewöhnlichen Leben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: AT4.173.2
  kind: p
  original: Der ganze zweite Teil "des Buchs" wird von dem Kampfe gegen diese "Hierarchie" ausgefüllt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: AT4.173.3
  kind: p
  original: Wir gehen also erst in diesem zweiten Teil auf sie ein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: AT4.173.4
  kind: p
  original: Da indes Sankt Max gerade wie beim "Sparren" schon hier seine Ideen vorläufig genießt und im Anfange das Spätere wiederholt, wie im Späteren den Anfang, sind wir gezwungen, schon jetzt einige Exempel seiner Hierarchie zu konstatieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: AT4.173.5
  kind: p
  original: Seine Methode des Buchmachens ist der einzige "Egoismus", der sich im ganzen Buche vorfindet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: AT4.173.6
  kind: p
  original: Sein Selbstgenuß und der Genuß des Lesers stehen in umgekehrtem Verhältnis.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: AT4.174.1
  kind: p
  original: Weil die Bürger Liebe zu ihrem Reich, ihrem Régime verlangen, wollen sie nach Jacques le bonhomme ein "Reich der Liebe auf Erden gründen" (p. 98).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: AT4.174.2
  kind: p
  original: Weil sie Respekt vor ihrer Herrschaft und den Verhältnissen ihrer Herrschaft fordern, also die Herrschaft über den Respekt usurpieren wollen, verlangen sie nach demselben Biedermann die Herrschaft des Respekts schlechthin, verhalten sie sich zum Respekt als zum heiligen Geist, der in ihnen lebt (p. 95).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: AT4.174.3
  kind: p
  original: Die verdrehte Form, worin die scheinheilige und heuchlerische Ideologie der Bourgeois ihre aparten Interessen als allgemeine Interessen ausspricht, wird von dem Berge versetzenden Glauben unsres Jacques le bonhomme als wirkliche, profane Grundlage der bürgerlichen Welt akzeptiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: AT4.174.4
  kind: p
  original: Warum diese ideologische Täuschung bei unserm Heiligen gerade diese Form annimmt, werden wir beim "politischen Liberalismus" sehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: AT4.175.1
  kind: p
  original: Ein neues Beispiel gibt uns Sankt Max p. 115 in der Familie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: AT4.175.2
  kind: p
  original: Er erklärt, man könne sich zwar sehr leicht von der Herrschaft seiner eigenen Familie emanzipieren, aber "der aufgekündigte Gehorsam fährt Einem leicht ins Gewissen", und so hält man die Familienliebe, den Familienbegriff fest; man hat also den "heiligen Familienbegriff", "das Heilige" (p. 116).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: AT4.176.1
  kind: p
  original: Der gute Junge sieht hier wieder die Herrschaft des Heiligen, wo ganz empirische Verhältnisse herrschen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: AT4.176.2
  kind: p
  original: Der Bourgeois verhält sich zu den Institutionen seines Regimes wie der Jude zum Gesetz; er umgeht sie, sooft es tunlich ist, in jedem einzelnen Fall, aber er will, daß alle Andern sie halten sollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 163-164
- id: AT4.176.3
  kind: p
  original: Wenn sämtliche Bourgeois in Masse und auf Einmal die Institutionen der Bourgeoisie umgingen, so würden sie aufhören, Bourgeois zu sein - ein Verhalten, das ihnen natürlich nicht einfällt und keineswegs von ihrem Wollen oder Laufen abhängt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: AT4.176.4
  kind: p
  original: Der liederliche Bourgeois umgeht die Ehe und begeht heimlichen Ehebruch; der Kaufmann umgeht die Institution des Eigentums, indem er Andre durch Spekulation, Bankerott pp. um ihr Eigentum bringt - der junge Bourgeois macht sich von seiner eignen Familie unabhängig, wenn kann, löst für sich die Familie praktisch auf; aber die Ehe, das Eigentum, die Familie bleiben theoretisch unangetastet, weil sie praktisch die Grundlagen sind, auf denen die Bourgeoisie ihre Herrschaft errichtet hat, weil sie in ihrer Bourgeoisform die Bedingungen sind, die den Bourgeois zum Bourgeois machen, gerade wie das stets umgangene Gesetz den religiösen Juden zum religiösen Juden macht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: AT4.176.5
  kind: p
  original: Dieses Verhältnis des Bourgeois zu seinen Existenzbedingungen erhält eine seiner allgemeinen Formen in der bürgerlichen Moralität.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: AT4.176.6
  kind: p
  original: Es ist überhaupt nicht von "der" Familie zu sprechen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: AT4.176.7
  kind: p
  original: Die Bourgeoisie gibt historisch der Familie den Charakter der bürgerlichen Familie, worin die Langweile und das Geld das Bindende ist und zu welcher auch die bürgerliche Auflösung der Familie gehört, bei der die Familie selbst stets fortexistiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: AT4.176.8
  kind: p
  original: Ihrer schmutzigen Existenz entspricht der heilige Begriff in offiziellen Redensarten und in der allgemeinen Heuchelei.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: AT4.176.9
  kind: p
  original: Wo die Familie mit wirklich aufgelöst ist, wie im Proletariat, findet grade das Gegenteil von dem statt, was "Stirner" meint.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: AT4.176.10
  kind: p
  original: Dort existiert der Familienbegriff durchaus nicht, während stellenweise allerdings Familienzuneigung, gestützt auf höchst reale Verhältnisse, gefunden wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: AT4.176.11
  kind: p
  original: Im achtzehnten Jahrhundert wurde der Familienbegriff von den Philosophen aufgelöst, weil die wirkliche Familie auf den höchsten Spitzen der Zivilisation bereits in der Auflösung begriffen war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: AT4.176.12
  kind: p
  original: Aufgelöst war das innere Band der Familie, die einzelnen Teile, aus denen der Familienbegriff komponiert ist, z.B. Gehorsam, Pietät, eheliche Treue pp.; aber der wirkliche Körper der Familie, Vermögensverhältnis, ausschließliches Verhältnis gegen andre Familien, gezwungenes Zusammenleben, die Verhältnisse, die schon durch die Existenz der Kinder, den Bau der jetzigen Städte, Bildung des Kapitals pp. gegeben waren, blieben, wenn auch vielfach gestört, weil das Dasein der Familie durch ihren Zusammenhang mit der vom Willen der bürgerlichen Gesellschaft unabhängigen Produktionsweise nötig gemacht ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: AT4.176.13
  kind: p
  original: Am frappantesten zeigt sich diese Unentbehrlichkeit in der französischen Revolution, wo die Familie für einen Augenblick gesetzlich so gut als aufgehoben war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: AT4.176.14
  kind: p
  original: Die Familie existiert sogar im neunzehnten Jahrhundert noch fort, nur daß die Tätigkeit der Auflösung nicht des Begriffs wegen, sondern wegen entwickelterer Industrie und Konkurrenz allgemeiner geworden ist; existiert noch immer, trotzdem daß ihre Auflösung längst von französischen und englischen Sozialisten proklamiert und vermittelst französischer Romane endlich auch zu den deutschen Kirchenvätern gedrungen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 164-165
- id: AT4.177.1
  kind: p
  original: Noch ein Beispiel von der Herrschaft der Idee im gewöhnlichen Leben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.177.2
  kind: p
  original: Weil die Schulmeister über ihren geringen Sold mit der Heiligkeit der Sache, der sie dienen, vertröstet werden mögen (was bloß in Deutschland vorfallen kann), glaubt Jacques le bonhomme wirklich, diese Redensart sei die Ursache ihrer niedrigen Besoldung (p. 100).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.177.3
  kind: p
  original: Er glaubt, daß "das Heilige" in der heutigen bürgerlichen Welt einen wirklichen Geldwert habe, er glaubt, daß die dürftigen Ressourcen des preußischen Staats, worüber u.a.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.177.4
  kind: p
  original: Browning zu vergleichen, sich durch die Abschaffung "des Heiligen" so sehr vergrößern würden, daß jeder Dorfschulmeister plötzlich wie ein Minister salariert werden könnte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.178.1
  kind: p
  original: Dies ist die Hierarchie des Unsinns.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.179.1
  kind: p
  original: Der "Schlußstein des erhabnen Domwerkes" wie der große Michelet sagt, der Hierarchie ist "mitunter" die Tat von "Man".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.180.1
  kind: p
  original: '" Man teilt mitunter die Menschen in zwei Klassen, in Gebildete und Ungebildete."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.180.2
  kind: p
  original: (Man teilt mitunter die Affen in zwei Klassen, in Geschwänzte und Ungeschwänzte.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.180.3
  kind: p
  original: '"Die Ersteren beschäftigten sich, soweit sie ihres Namens würdig waren, mit Gedanken, mit dem Geiste."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.180.4
  kind: p
  original: Sie "waren in der nachchristlichen Zeit die Herrschenden und forderten für ihre Gedanken - - Respekt".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.180.5
  kind: p
  original: Die Ungebildeten (Tier, Kind, Neger) sind "schwach" gegen die Gedanken und "werden von ihnen beherrscht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.180.6
  kind: p
  original: Dies ist der Sinn der Hierarchie."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.181.1
  kind: p
  original: Die Jebildeten (Jüngling, Mongole, Neuer) sind also wieder nur mit " dem Geist", dem reinen Gedanken pp. beschäftigt, Metaphysiker von Profession, in letzter Instanz Hegelianer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.181.2
  kind: p
  original: '"Daher" sind die Unjebildeten die Nichthegelianer.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.181.3
  kind: p
  original: Hegel war ohne Zweifel der allerjebildetste Hegelianer, und darum muß auch bei ihm "an den Tag kommen, welche Sehnsucht gerade der Gebildetste nach den Dingen hat".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.181.4
  kind: p
  original: Nämlich der Jebildete und Unjebildete stoßen auch ineinander aneinander, und zwar in jedem Menschen stößt der Unjebildete auf den Jebildeten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.181.5
  kind: p
  original: Da nun bei Hegel die größte Sehnsucht nach den Dingen, also nach dem, was des Unjebildeten ist, an den Tag kommt, so kommt hier ebenfalls an den Tag, daß der Allerjebildetste zugleich der Unjebildetste ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.181.6
  kind: p
  original: '"Da" (bei Hegel) "soll dem Gedanken ganz und gar die Wirklichkeit entsprechen und kein Begriff ohne Realität sein."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.181.7
  kind: p
  original: 'Soll heißen: Da soll denn ganz und gar die gewöhnliche Vorstellung von der Wirklichkeit ihren philosophischen Ausdruck erhalten, wobei Hegel sich nun umgekehrt einbildet, daß "mithin" jeder philosophische Ausdruck sich die ihm entsprechende Wirklichkeit erschaffe.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: AT4.181.8
  kind: p
  original: Jacques le bonhomme nimmt die Illusion, die Hegel von seiner Philosophie hat, für die bare Münze der Hegelschen Philosophie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 165-166
- id: AT4.182.1
  kind: p
  original: Die Hegelsche Philosophie, die in der Herrschaft der Hegelianer über die Nichthegelianer als Krone der Hierarchie auftritt, erobert nun das letzte Weltreich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: AT4.183.1
  kind: p
  original: '"Hegels System - war die höchste Despotie und Alleinherrschaft des Denkens, die Allgewalt und Allmacht des Geistes." (p. 97.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: AT4.184.1
  kind: p
  original: Hier geraten wir also in das Geisterreich der Hegelschen Philosophie, das von Berlin bis Halle und Tübingen geht, das Geisterreich, dessen Geschichte Herr Bayrhoffer geschrieben und wozu die statistischen Notizen von dem großen Michelet zusammengetragen sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: AT4.185.1
  kind: p
  original: Die Vorbereitung zu diesem Geisterreich war die französische Revolution, die " nichts anders getan hat als die Dinge in Vorstellungen von den Dingen verwandelt" (p. 115 - vergl. oben Hegel über die Revolution p. [158]).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: AT4.185.2
  kind: p
  original: '"So blieb man Staatsbürger" (dies geht zwar bei "Stirner" vorher, aber "was Stirner sagt, ist nicht das Gemeinte, und was er meint, ist unsagbar", Wig[and,] p. 149) und "lebte in der Reflexion, man hatte einen Gegenstand, auf den man reflektierte, vor dem man" (per appos[itionem]) "Ehrfurcht und Furcht empfand".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: AT4.185.3
  kind: p
  original: '"Stirner" sagt einmal p. 98: "Der Weg zur Hölle ist mit guten Vorsätzen gepflastert."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: AT4.185.4
  kind: p
  original: 'Wir sagen dagegen: Der Weg zum Einzigen ist mit schlechten Nachsätzen gepflastert, mit Appositionen, die seine den Chinesen abgeborgte "Himmelsleiter" und sein "Seil des Objektiven" (p. 88) sind, auf dem er seine "Flohsprünge" macht.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: AT4.185.5
  kind: p
  original: Hiernach war es für "die neuere Philosophie oder Zeit" - seit dem Hereinbrechen des Geisterreiches ist ja die neuere Zeit Nichts Andres als die neuere Philosophie - ein Leichtes, "die existierenden Objekte in vorgestellte, d.h. in Begriffe zu verwandeln", p. 114, eine Arbeit, die Sankt Max weiter fortsetzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: AT4.186.1
  kind: p
  original: Wir haben unsren Ritter von der traurigen Gestalt bereits, "ehe denn die Berge waren", die er nachher durch seinen Glauben versetzte, bereits im Anfange seines Buches auf das große Resultat seines "erhabenen Domwerkes" mit verhängtem Zügel lostraben sehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: AT4.186.2
  kind: p
  original: Sein "Grauer", die Apposition, konnte ihm nicht rasch genug springen; jetzt endlich, auf p. 114, hat er sein Ziel erreicht und durch ein mächtiges Oder die neuere Zeit in die neuere Philosophie verwandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: AT4.187.1
  kind: p
  original: Hiermit hat die alte (d.h. die alte und neue, negerhafte und mongolische, eigentlich aber nur die vorstirnersche) Zeit, "ihr letztes Absehen erreicht".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: AT4.187.2
  kind: p
  original: Wir können jetzt enthüllen, weshalb Sankt Max seinen ganzen ersten Teil "Der Mensch " betitelt und seine ganze Zauber-, Gespenster- und Rittergeschichte für die Geschichte " des Menschen" ausgegeben hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 166-167
- id: AT4.187.3
  kind: p
  original: Die Ideen und Gedanken der Menschen waren natürlich Ideen und Gedanken über sich und ihre Verhältnisse, ihr Bewußtsein von sich, von den Menschen, denn es war ein Bewußtsein nicht nur der einzelnen Person, sondern der einzelnen Person im Zusammenhange mit der ganzen Gesellschaft und von der ganzen Gesellschaft, in der sie lebten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: AT4.187.4
  kind: p
  original: Die von ihnen unabhängigen Bedingungen, innerhalb deren sie ihr Leben produzierten, die damit zusammenhängenden notwendigen Verkehrsformen, die damit gegebenen persönlichen und sozialen Verhältnisse, mußten, soweit sie in Gedanken ausgedrückt wurden, die Form von idealen Bedingungen und notwendigen Verhältnissen annehmen, d.h. als aus dem Begriff des Menschen, dem menschlichen Wesen, der Natur des Menschen, dem Menschen hervorgehende Bestimmungen ihren Ausdruck im Bewußtsein erhalten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: AT4.187.5
  kind: p
  original: Was die Menschen waren, was ihre Verhältnisse waren, erschien im Bewußtsein als Vorstellung von dem Menschen, von seinen Daseinsweisen oder von seinen näheren Begriffsbestimmungen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: AT4.187.6
  kind: p
  original: Nachdem die Ideologen nun vorausgesetzt hatten, daß die Ideen und Gedanken die bisherige Geschichte beherrschten, daß ihre Geschichte alle bisherige Geschichte sei, nachdem sie sich eingebildet hatten, die wirklichen Verhältnisse hätten sich nach dem Menschen und seinen idealen Verhältnissen, id est Begriffsbestimmungen gerichtet, nachdem sie überhaupt die Geschichte des Bewußtseins der Menschen von sich zur Grundlage ihrer wirklichen Geschichte gemacht hatten, war Nichts leichter als die Geschichte des Bewußtseins, der Ideen, des Heiligen, der fixierten Vorstellungen Geschichte "des Menschen" zu nennen und diese der wirklichen Geschichte unterzuschieben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: AT4.187.7
  kind: p
  original: Sankt Max zeichnet sich vor allen seinen Vorgängern nur dadurch aus, daß er von diesen Vorstellungen, selbst in ihrer willkürlichen Isolierung vom wirklichen Leben, dessen Produkte sie waren, Nichts weiß und seine nichtige Schöpfung darauf beschränkt, in seiner Kopie der Hegelschen Ideologie die Unkenntnis selbst dessen, was er kopiert, zu konstatieren, - Schon hieraus ergibt sich, wie er seiner Phantasie von der Geschichte des Menschen die Geschichte des wirklichen Individuums in der Form des Einzigen gegenüberstellen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: AT4.188.1
  kind: p
  original: Die einzige Geschichte trägt sich anfangs in der Stoa zu Athen, später fast gänzlich in Deutschland und schließlich am Kupfergraben in Berlin zu, wo der Despot der "neueren Philosophie oder Zeit" seine Hofburg aufgeschlagen hatte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: AT4.188.2
  kind: p
  original: Schon daraus geht hervor, welch eine ausschließlich nationale und lokale Angelegenheit hier verhandelt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: AT4.188.3
  kind: p
  original: Statt der Weltgeschichte gibt der heilige Max uns einige, noch dazu höchst dürftige und schiefe Glossen über die Geschichte der deutschen Theologie und Philosophie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: AT4.188.4
  kind: p
  original: Wenn wir einmal zum Schein aus Deutschland heraustreten, so geschieht es nur, um die Taten und Gedanken andrer Völker, z.B. die französische Revolution, in Deutschland und zwar am Kupfergraben "ihr letztes Absehen erreichen" zu lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 167-168
- id: AT4.188.5
  kind: p
  original: Nur deutsch-nationale Tatsachen werden zitiert, nach deutsch-nationaler Weise werden sie verhandelt und aufgefaßt, und das Resultat bleibt ein national-deutsches.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: AT4.188.6
  kind: p
  original: Aber auch damit ist es nicht genug.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: AT4.188.7
  kind: p
  original: Die Auffassung und Bildung unsres Heiligen ist nicht nur deutsch, sie ist durch und durch berlinisch.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: AT4.188.8
  kind: p
  original: Die Rolle, die der Hegelschen Philosophie erteilt wird, ist dieselbe, die sie in Berlin spielt, und Stirner verwechselt nun Berlin mit der Welt und ihrer Geschichte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: AT4.188.9
  kind: p
  original: Der "Jüngling" ist ein Berliner, die guten Bürger, die uns im ganzen Buche begegnen, sind Berliner Weißbierphilister.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: AT4.188.10
  kind: p
  original: Mit solchen Prämissen kommt man natürlich nur zu einem innerhalb der Nationalität und Lokalität befangenen Resultate.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: AT4.188.11
  kind: p
  original: '"Stirner" und seine ganze philosophische Bruderschaft, deren Schwächster und Unwissendster er ist, liefern den praktischen Kommentar zu dem wackern Verslein des wackern Hoffmann von Fallersleben:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: AT4.189.1
  kind: p
  original: Nur in Deutschland, nur in Deutschland, Da möcht' ich ewig leben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: AT4.190.1
  kind: p
  original: Das Berliner Lokalresultat unsres wackern Heiligen, daß die ganze Welt in der Hegelschen Philosophie alle jeworden sei, befähigt ihn nun, ohne große Unkosten zu einem "eignen" Weltreich zu kommen..
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: AT4.190.2
  kind: p
  original: Die Hegelsche Philosophie hat Alles in Gedanken, in das Heilige, in Spuk, in Geist, in Geister, in Gespenster verwandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: AT4.190.3
  kind: p
  original: Diese wird "Stirner" bekämpfen, in seiner Einbildung überwinden und auf ihren Leichen sein "eignes", "einziges", "leibhaftiges" Weltreich, das Weltreich des "ganzen Kerls" stiften.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: AT4.191.1
  kind: p
  original: '"Denn wir haben nicht mit Fleisch und Blut zu kämpfen, sondern mit Fürsten und Gewaltigen, nämlich mit den Herren dieser Welt, die in der Finsternis dieser Welt herrschen, mit den bösen Geistern unter dem Himmel."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: AT4.191.2
  kind: p
  original: Epheser 6, 12.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: AT4.192.1
  kind: p
  original: Jetzt ist "Stirner" "an Beinen gestiefelt, als fertig zu treiben" den Kampf gegen die Gedanken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: AT4.192.2
  kind: p
  original: Den "Schild des Glaubens" braucht er nicht erst zu "ergreifen", da er ihn nie aus den Händen gegeben hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: AT4.192.3
  kind: p
  original: Mit dem "Helm" des Unheils und dem "Schwert" der Geistlosigkeit (vergl. ibid.) gewappnet, zieht er in den Kampf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: AT4.192.4
  kind: p
  original: '"Und es ward ihm gegeben, zu streiten wider das Heilige", aber nicht, es "zu besiegen". (Offenb[arung] Joh[annis] 13, 7.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: AT4.N1.1.1
  kind: note
  original: Vgl. "Die heilige Familie oder Kritik der kritischen Kritik", wo die früheren Heldentaten dieses Mannes Gottes bereits besungen worden sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
