section: AT3
title_original: 3. Die Alten
title_en: Old Testament, 3. The Ancients
author: Karl Marx, Friedrich Engels
date: 1845-1846
original_language: de
anchor_language: de
source_original: MEW 3, S. 119-127 (Dietz, Berlin 1969) via mlwerke.de; written 1845-1846, first printed in full 1932; the authors' footnotes from mlwerke's me03_anm.htm
source_en: 'None: no public-domain English translation'
verses:
- id: AT3.0.1
  kind: heading
  original: 3. Die Alten
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '119'
- id: AT3.1.1
  kind: p
  original: Eigentlich müßten wir hier mit den Negern beginnen; aber der heilige Max, der ohne Zweifel mit im "Rate der Wächter" sitzt, bringt in seiner unerforschlichen Weisheit die Neger erst später, und auch dann "nicht mit dem Anspruche auf Gründlichkeit und Bewährtheit" Wenn wir also die griechische Philosophie dem negerhaften Weltalter, d.h. den Zügen des Sesostris und der napoleonischen Expedition nach Ägypten vorhergehen lassen, so geschieht es in der Zuversicht, daß unser heiliger Schriftsteller Alles weislich angeordnet habe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '119'
- id: AT3.2.1
  kind: p
  original: '"Schauen wir daher in das Treiben hinein, welches" die Stirnerschen Alten "verführen".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '119'
- id: AT3.3.1
  kind: p
  original: '"''Den Alten war die Welt eine Wahrheit'', sagt Feuerbach; aber er vergißt den wichtigen Zusatz zu machen: eine Wahrheit, hinter deren Unwahrheit sie zu kommen suchten und endlich wirklich kamen." p. 22'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '119'
- id: AT3.4.1
  kind: p
  original: '"Den Alten war" ihre "Welt" (nicht die Welt) "eine Wahrheit" - womit natürlich keine Wahrheit über die alte Welt gesagt ist, sondern nur, daß sie sich nicht christlich zu ihrer Welt verhielten.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: AT3.4.2
  kind: p
  original: Sobald die Unwahrheit hinter ihre Welt kam (d.h. sobald diese Welt in sich selbst durch praktische Kollisionen zerfiel - und diese materialistische Entwicklung empirisch nachzuweisen wäre das einzig Interessante), suchten die alten Philosophen hinter die Welt der Wahrheit oder die Wahrheit ihrer Welt zu kommen und fanden dann natürlich, daß sie unwahr geworden war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: AT3.4.3
  kind: p
  original: Ihr Suchen selbst war schon ein Symptom des inneren Verfalls dieser Welt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: AT3.4.4
  kind: p
  original: Jacques le bonhomme macht das idealistische Symptom zur materiellen Ursache des Verfalls und läßt als deutscher Kirchenvater das Altertum selbst seine eigne Verneinung, das Christentum, suchen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: AT3.4.5
  kind: p
  original: Diese Stellung des Altertums ist bei ihm notwendig, weil die Alten die "Kinder" sind, die hinter die "Welt der Dinge" zu kommen suchen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: AT3.4.6
  kind: p
  original: '"Und etwa leicht auch": Indem Jacques le bonhomme die alte Welt in das spätere Bewußtsein von der alten Welt verwandelt, kann er natürlich mit Einem Sprunge aus der materialistischen alten Welt sich in die Welt der Religion, das Christentum, hinüberschwingen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: AT3.4.7
  kind: p
  original: Der realen Welt des Altertums tritt nun sogleich "das göttliche Wort" gegenüber, dem als Philosoph gefaßten Alten der als moderner Zweifler gefaßte Christ.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: AT3.4.8
  kind: p
  original: Sein Christ "kann sich niemals von der Eitelkeit des göttlichen Wortes überzeugen" und "glaubt" infolge dieser Nichtüberzeugung "an die ewige und unerschütterliche Wahrheit desselben", p.22. Wie sein Alter Alter ist, weil er der Nichtchrist, noch nicht Christ oder verborgener Christ ist, so ist sein Urchrist Christ, weil er der Nichtatheist, noch nicht Atheist, verborgener Atheist ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: AT3.4.9
  kind: p
  original: Er läßt also das Christentum von den Alten, wie den modernen Atheismus von den Urchristen negiert werden, statt umgekehrt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: AT3.4.10
  kind: p
  original: Jacques le bonhomme, wie alle andern Spekulanten, faßt Alles beim philosophischen Schwanz an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: AT3.4.11
  kind: p
  original: 'Folgen sogleich noch ein paar Exempel dieser kindlichen Leichtgläubigkeit:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: AT3.5.1
  kind: p
  original: '"Der Christ muß sich für einen ''Fremdling auf Erden'' ansehen (Hebr[äer] 11, 13)", p.23.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: AT3.6.1
  kind: p
  original: Umgekehrt, die Fremdlinge auf Erden (durch höchst natürliche Gründe erzeugt, z.B. die kolossale Konzentration des Reichtums in der ganzen römischen Welt etc. etc.) mußten sich als Christen ansehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: AT3.6.2
  kind: p
  original: Nicht ihr Christentum machte sie zu Vagabunden, sondern ihr Vagabundentum machte sie zu Christen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: AT3.6.3
  kind: p
  original: '- Auf derselben Seite springt der heilige Vater von der Antigone des Sophokles und der mit ihr zusammenhängenden Heiligkeit der Totenbestattung sogleich zum Evangelium Matthäi 8, 22 (laß die Toten ihre Toten begraben), während Hegel wenigstens in der "Phänomenologie" von der Antigone usw. allgemach auf das Römertum übergeht.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 120-121
- id: AT3.6.4
  kind: p
  original: Mit demselben Rechte hätte Sankt Max sogleich ins Mittelalter übergehen und den Kreuzfahrern mit Hegel diesen Bibelspruch entgegenhalten, oder gar, um recht originell zu sein, die Bestattung des Polynices durch Antigone mit der Abholung der Asche Napoleons von St. Helena nach Paris in Gegensatz bringen können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: AT3.6.5
  kind: p
  original: 'Weiter heißt es:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: AT3.7.1
  kind: p
  original: '"Im Christentum wird die unverbrüchliche Wahrheit der Familienbande" (die auf p. 22 als eine der "Wahrheiten" der Alten konstatiert wird) "als eine Unwahrheit dargestellt, von der man sich nicht zeitig genug losmachen könne (Mark[us] 10, 29), und so in Allem." (p. 23.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: AT3.8.1
  kind: p
  original: 'Dieser Satz, in welchem wieder die Wirklichkeit auf den Kopf gestellt ist, muß folgendermaßen zurechtgerückt werden: Die faktische Unwahrheit der Familienbande (darüber u.a. die noch vorhandnen Dokumente der vorchristlichen römischen Gesetzgebung nachzusehen) wird im Christentum als eine unverbrüchliche Wahrheit dargestellt, "und so in Allem".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: AT3.9.1
  kind: p
  original: Wir sehen also an diesen Exempeln im Übermaße, wie Jacques le bonhomme, der von der empirischen Geschichte "sich nicht zeitig genug losreißen kann", die Tatsachen auf den Kopf stellt, die materielle Geschichte von der ideellen produziert werden läßt, "und so in Allem".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: AT3.9.2
  kind: p
  original: Von vornherein erfahren wir nur, was die Alten von ihrer Welt angeblich hielten; sie werden als Dogmatiker der alten, ihrer eignen Welt gegenübergestellt, statt als Produzenten derselben aufzutreten; es handelt sich nur um das Verhältnis des Bewußtseins zum Gegenstande, zur Wahrheit; es handelt sich also nur um das philosophische Verhältnis der Alten zu ihrer Welt - an die Stelle der alten Geschichte tritt die Geschichte der alten Philosophie, und auch diese nur, wie Sankt Max sie sich nach Hegel und Feuerbach vorstellt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: AT3.10.1
  kind: p
  original: Die Geschichte Griechenlands von der perikleischen Zeit inklusive an reduziert sich so auf den Kampf der Abstrakta Verstand, Geist, Herz, Weltlichkeit usw. Dies sind die griechischen Parteien.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: AT3.10.2
  kind: p
  original: In dieser Gespensterwelt, die für die griechische Welt ausgegeben wird, "machinieren" dann auch allegorische Personen, wie Frau Herzensreinheit, und nehmen mythische Figuren wie Pilatus (der nie fehlen darf, wo Kinder sind) ernsthaft Platz neben Timon dem Phliasier.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: AT3.11.1
  kind: p
  original: Nachdem Sankt Max uns über die Sophisten und Sokrates einige überraschende Offenbarungen gegeben hat, springt er sogleich zu der Skeptikern über.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: AT3.11.2
  kind: p
  original: Er entdeckt in ihnen die Vollender der von Sokrates angefangenen Arbeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: AT3.11.3
  kind: p
  original: Die positive Philosophie der Griechen, die gerade auf die Sophisten und Sokrates folgt, namentlich die enzyklopädische Wissenschaft des Aristoteles existiert also für Jacques le bonhomme gar nicht, Er "kann nicht zeitig genug sich" von dem Früheren "losmachen" - er eilt auf den Übergang zu den "Neuen" und findet diesen in den Skeptikern, Stoikern und Epikuräern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 121-122
- id: AT3.11.4
  kind: p
  original: Sehen wir uns an, was der heilige Vater uns über diese offenbart.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
- id: AT3.12.1
  kind: p
  original: '"Die Stoiker wollen den Weisen verwirklichen - - den Mann, der zu leben weiß - - sie finden ihn in der Verachtung der Welt, in einem Leben ohne Lebensentwicklung, [--] ohne freundliches Vernehmen mit der Welt, d.h. im isolierten Leben, [- -] nicht im Mitleben; nur der Stoiker lebt, alles Andre ist für ihn tot.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
- id: AT3.12.2
  kind: p
  original: Umgekehrt verlangen die Epikuräer ein bewegliches Leben." p. 30.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
- id: AT3.13.1
  kind: p
  original: Wir verweisen Jacques le bonhomme, den Mann, der sich verwirklichen will und der zu leben weiß, u. a. auf Diogenes Laertius, wo er finden wird, daß der Weise, Sophos, nichts ist als der idealisierte Stoiker, nicht der Stoiker der realisierte Weise; wo er finden wird, daß der Sophos durchaus nicht bloß stoisch ist, sondern ebensogut bei den Epikuräern, Neuakademikern und Skeptikern vorkommt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
- id: AT3.13.2
  kind: p
  original: Übrigens ist der Sophos die erste Gestalt, in der uns der griechische Philosophos entgegentritt; er tritt mythisch auf in den sieben Weisen, praktisch im Sokrates und als Ideal bei den Stoikern, Epikuräern, Neuakademikern und Skeptikern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
- id: AT3.13.3
  kind: p
  original: Jede dieser Schulen hat natürlich einen eignen σοφός <Weisen> wie Sankt Bruno sein eignes, "einziges Geschlecht" hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
- id: AT3.13.4
  kind: p
  original: Ja, Sankt Max kann "le sage" <den Weisen> wiederfinden im achtzehnten Jahrhundert in der Aufklärungsphilosophie und sogar bei Jean Paul in den "weisen Männern" wie Emanuel etc. Der stoische Weise stellt sich kein "Leben ohne Lebensentwicklung", sondern ein absolut bewegliches Leben vor, was schon aus seiner Naturanschauung hervorgeht, welche die heraklitische, die dynamische, entwickelnde, lebendige ist, während bei den Epikuräern der mors immortalis <unsterbliche Tod>, wie Lukrez sagt, das Atom das Prinzip der Naturanschauung ist und an die Stelle des "beweglichen Lebens" die göttliche Muße im Gegensatz zur göttlichen Energie des Aristoteles als Lebensideal vorgestellt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
- id: AT3.14.1
  kind: p
  original: '"Die Ethik der Stoiker (ihre einzige Wissenschaft, da sie nichts vom Geiste auszusagen wußten, als wie er sich zur Welt verhalten solle, und von der Natur - Physik - nur dies, daß der Weise sich gegen sie zu behaupten habe) ist nicht eine Lehre des Geistes, sondern nur eine Lehre der Weltabstoßung und Selbstbehauptung gegen die Welt." p. 31.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
- id: AT3.15.1
  kind: p
  original: Die Stoiker wußten "von der Natur dies zu sagen", daß die Physik für den Philosophen eine der wichtigsten Wissenschaften sei, und gaben sich deshalb sogar die Mühe, die Physik des Heraklit weiter auszubilden; sie "wußten ferner zu sagen", daß die ὥρα, die männliche Schönheit, das Höchste sei, was von dem Individuum darzustellen sei, und feierten gerade das Leben im Einklang mit der Natur, obgleich sie dabei in Widersprüche geraten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 122-123
- id: AT3.15.2
  kind: p
  original: 'Nach den Stoikern zerfällt die Philosophie in drei Doktrinen: "Physik, Ethik, Logik".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: AT3.16.1
  kind: p
  original: '"Sie vergleichen die Philosophie dem Tier und dem Ei, die Logik den Knochen und Sehnen des Tiers, der äußeren Schale des Eis, die Ethik dem Fleisch des Tiers, und im Ei dem Eiweiß und die Physik der Seele des Tiers und der Eidotter."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: AT3.16.2
  kind: p
  original: (Diog[enes] Laert[ius] Zeno.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: AT3.17.1
  kind: p
  original: Wir sehen schon hieraus, wie wenig "die Ethik die einzige Wissenschaft der Stoiker ist".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: AT3.17.2
  kind: p
  original: Hierzu kommt noch, daß sie, nach Aristoteles, die Hauptbegründer der formalen Logik und der Systematik überhaupt sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: AT3.18.1
  kind: p
  original: '"Die Stoiker wußten" so wenig "Nichts vom Geiste auszusagen", daß bei ihnen sogar die Geisterseherei beginnt, weswegen Epikur ihnen als Aufklärer gegenübertritt und sie als "alte Weiber" verspottet, während gerade die Neuplatoniker einen Teil ihrer Geistergeschichten den Stoikern entnommen haben.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: AT3.18.2
  kind: p
  original: Diese Geisterseherei der Stoiker geht einerseits aus der Unmöglichkeit hervor, eine dynamische Naturanschauung ohne das von einer empirischen Naturwissenschaft zu liefernde Material durchzuführen, und andrerseits aus ihrer Sucht, die alte griechische Welt und selbst die Religion spekulativ zu interpretieren und dem denkenden Geiste analog zu machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: AT3.19.1
  kind: p
  original: '"Die stoische Ethik" ist so sehr "eine Lehre der Weltabstoßung und Selbstbehauptung gegen die Welt", daß z.B. zur stoischen Tugend gerechnet wird: "ein tüchtiges Vaterland, einen braven Freund haben", daß "das Schöne allein" für "das Gute" erklärt wird, und daß dem stoischen Weisen erlaubt ist, sich in jeder Weise mit der Welt zu vermengen, z.B. Blutschande zu begehen etc. etc. Der stoische Weise ist so sehr "im isolierten Leben, nicht im Mitleben" befangen, daß es von ihm bei Zeno heißt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: AT3.20.1
  kind: p
  original: '"Der Weise bewundre Nichts von dem, was wunderbar erscheint - aber der Tüchtige wird auch nicht in der Einsamkeit leben, denn er ist gesellschaftlich von Natur und praktisch tätig."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: AT3.20.2
  kind: p
  original: (Diog[enes] Laert[ius] Lib[er stromatum] VII, 1.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: AT3.21.1
  kind: p
  original: Übrigens wäre es zuviel verlangt, wenn man gegenüber dieser Gymnasiastenweisheit des Jacques le bonhomme die sehr verwickelte und widerspruchsvolle Ethik der Stoiker entwickeln sollte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: AT3.22.1
  kind: p
  original: Bei Gelegenheit der Stoiker existieren dann auch die Römer für Jacques le bonhomme (p. 31), von denen er natürlich nichts zu sagen weiß, da sie keine Philosophie haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: AT3.22.2
  kind: p
  original: Wir hören nur von ihnen, daß Horaz! es "nicht weiter als bis zur stoischen Lebensweisheit gebracht hat". p. 32. Integer vitae, scelerisque purus! <Von makellosem Lebenswandel und unbefleckt von Verbrechen!>
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: AT3.23.1
  kind: p
  original: Bei Gelegenheit der Stoiker wird auch Demokrit erwähnt, und zwar, indem aus irgendeinem Handbuch eine konfuse Stelle des Diogenes Laertius (Democr[it], lib. IX, 7, 45), und noch dazu falsch übersetzt, abgeschrieben und hierauf eine lange Diatribe über Demokrit begründet wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: AT3.23.2
  kind: p
  original: Diese Diatribe zeichnet sich dadurch aus, daß sie mit ihrer Grundlage, der obigen konfusen und falsch übersetzten Stelle, in direkten Widerspruch tritt und aus der "Gemütsruhe" (der Stirnerschen Übersetzung von εὐθυμία <Heiterkeit; Frohsinn> - niederdeutsch Wellmuth) die "Weltabstoßung" macht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: AT3.23.3
  kind: p
  original: Stirner bildet sich nämlich ein, Demokrit sei ein Stoiker gewesen, und zwar ein solcher Stoiker, wie ihn sich der Einzige und das gemeine Gymnasiastenbewußtsein vorstellen; er meint, "seine ganze Tätigkeit gehe in dem Bemühen auf, von der Welt loszukommen, "also im Abstoßen der Welt", und kann nun im Demokrit die Stoiker widerlegen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: AT3.23.4
  kind: p
  original: Daß das bewegte, weltdurchstreifende Leben des Demokrit dieser Vorstellung des heiligen Max ins Gesicht schlägt, daß die eigentliche Quelle für die demokritische Philosophie Aristoteles ist und nicht die paar Anekdoten des Diogenes Laertius, daß Demokrit so wenig die Welt abstieß, daß er vielmehr ein empirischer Naturforscher und der erste enzyklopädische Kopf unter den Griechen war - daß seine kaum bekannte Ethik sich auf einige Glossen beschränkt, die er als alter vielgereister Mann gemacht haben soll, daß seine naturwissenschaftlichen Sachen nur per abusum <mißbräuchlich> Philosophie genannt werden, weil bei ihm das Atom, im Unterschiede von Epikur, nur eine physikalische Hypothese, ein Notbehelf zur Erklärung von Tatsachen ist, gerade wie in den Mischungsverhältnissen der neueren Chemie (Dalton usw.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: AT3.23.5
  kind: p
  original: '- Alles Das paßt nicht in Jacques le bonhomme''s Kram; Demokrit muß "einzig" aufgefaßt werden, Demokrit spricht von der Euthymie, also der Gemütsruhe, also der Zurückziehung in sich selbst, also der Weltabstoßung, Demokrit ist ein Stoiker und unterscheidet sich vom indischen Fakir, der "Brahm" (soll heißen "Om") wispert, nur wie der Komparativ vom Superlativ, nämlich "nur dem Grade nach".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: AT3.24.1
  kind: p
  original: Von den Epikuräern weiß unser Freund geradesoviel wie von den Stoikern, nämlich das unvermeidliche Gymnasiastenquantum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: AT3.24.2
  kind: p
  original: Er stellt die epikuräische Hedone der stoischen und skeptischen Ataraxie gegenüber und weiß nicht, daß diese Ataraxie ebenfalls bei Epikur, und zwar als der Hedone übergeordnet, vorkommt, wodurch sein ganzer Gegensatz zusammenfällt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: AT3.24.3
  kind: p
  original: Er erzählt uns, daß die Epikuräer " nur ein anderes Verhalten gegen die Welt lehren" als die Stoiker; er möge uns den (nichtstoischen) Philosophen der "alten und neuen Zeit" zeigen, der nicht "nur" dasselbe tue.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: AT3.24.4
  kind: p
  original: 'Schließlich bereichert uns der heilige Max mit einem neuen Ausspruch der Epikuräer: "Die Welt muß betrogen werden, denn sie ist meine Feindin"; bisher war es nur bekannt, daß die Epikuräer sich dahin aussprachen: Die Welt muß enttäuscht, namentlich von der Furcht der Götter befreit werden, denn sie ist meine Freundin.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 124-125
- id: AT3.25.1
  kind: p
  original: Um unsrem Heiligen eine Andeutung von der der Philosophie des Epikur zugrunde liegenden realen Basis zu geben, brauchen wir nur zu erwähnen, daß sich bei ihm zuerst die Vorstellung findet, daß der Staat auf einem gegenseitigen Vertrage der Menschen, einem contrat social (συνθήκη) beruhe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: AT3.26.1
  kind: p
  original: Wie sehr die Aufschlüsse des heiligen Max über die Skeptiker in demselben Geleise bleiben, geht schon daraus hervor, daß er ihre Philosophie für radikaler hält als die des Epikur.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: AT3.26.2
  kind: p
  original: Die Skeptiker reduzierten das theoretische Verhältnis der Menschen zu den Dingen auf den Schein und ließen in der Praxis Alles beim Alten, indem sie sich ebensosehr nach diesem Scheine richteten wie Andre nach der Wirklichkeit; sie gaben der Sache nur einen andern Namen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: AT3.26.3
  kind: p
  original: Epikur dagegen war der eigentliche radikale Aufklärer des Altertums, der die antike Religion offen angriff und von dem auch bei den Römern der Atheismus, soweit er bei ihnen existierte, ausging.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: AT3.26.4
  kind: p
  original: Daher hat ihn auch Lukrez als einen Helden gefeiert, der zuerst die Götter gestürzt und die Religion mit Füßen getreten habe, daher hat Epikur bei allen Kirchenvätern, von Plutarch bis Luther, den Ruf des gottlosen Philosophen par excellence, des Schweins, behalten, weshalb auch Clemens Alexandrinus sagt, wenn Paulus gegen die Philosophie eifere, so meine er damit nur die epikuräische.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: AT3.26.5
  kind: p
  original: (stromatum lib. 1, [cap. XI] p. 295 der Kölner Ausg. 1688.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: AT3.26.6
  kind: p
  original: Wir sehen hieraus, wie "listig, betrügerisch" und "klug" dieser offne Atheist sich zur Welt verhielt, indem er ihre Religion unverhohlen angriff, während die Stoiker sich die alte Religion spekulativ zurechtmachten und die Skeptiker ihren "Schein" zum Vorwande nahmen, um ihr Urteil überall mit einer reservatio mentalis <(geheimen) geistigen Vorbehalt> begleiten zu können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: AT3.27.1
  kind: p
  original: So kommen nach Stirner die Stoiker zuletzt auf die "Verachtung" der Welt (p. 30), die Epikuräer auf "dieselbe Lebensweisheit wie die Stoiker" p. 32, die Skeptiker darauf heraus, daß sie "die Welt stehen lassen und sich nichts aus ihr machen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: AT3.27.2
  kind: p
  original: Alle drei also nach Stirner enden in der Gleichgültigkeit gegen die Welt, der "Weltverachtung" (p. 485).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: AT3.27.3
  kind: p
  original: 'Dies drückte Hegel längst vor ihm so aus: Stoizismus, Skeptizismus, Epikuräismus - "gingen darauf aus, den Geist gegen Alles gleichgültig zu machen, was die Wirklichkeit darbietet".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: AT3.27.4
  kind: p
  original: '"Phil[osophie] d[er] Gesch[ichte]", p. 327.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: AT3.28.1
  kind: p
  original: '"Die Alten", so faßt Sankt Max seine Kritik der alten Gedankenwelt zusammen, "hatten wohl Gedanken, allein den Gedanken kannten sie nicht." p. 30. Hierbei "erinnere man sich dessen, was oben über Unsere Kindergedanken gesagt wurde". (ibid.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 125-126
- id: AT3.28.2
  kind: p
  original: Die Geschichte der alten Philosophie muß sich nach der Konstruktion Stirners richten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: AT3.28.3
  kind: p
  original: Damit die Griechen nicht aus ihrer Kinderrolle fallen, darf Aristoteles nicht gelebt haben und bei ihm das an und für sich seiende Denken (ἡ νόησις ἡ καθ' αὑτήν), der sich selbst denkende Verstand (αὑτὸν δὲ νοεῖ ὁ νοῦς) und das sich selbst denkende Denken (ἡ νόησις τῆς νοήσεως) nicht vorkommen; überhaupt dürfen seine Metaphysik und das dritte Buch seiner Psychologie nicht existieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: AT3.29.1
  kind: p
  original: 'So gut wie Sankt Max hier "an das, was oben über Unsere Kinderjahre gesagt wurde", erinnert, so gut hätte er bei "Unseren Kinderjahren" sagen können: man sehe nach, was später über die Alten und die Neger gesagt und über den Aristoteles nicht gesagt werden wird.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: AT3.30.1
  kind: p
  original: Um die wirkliche Bedeutung der letzten antiken Philosophien während der Auflösung des Altertums zu würdigen, hätte Jacques le bonhomme nur die wirkliche Lebensstellung ihrer Jünger unter der römischen Weltherrschaft zu betrachten brauchen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: AT3.30.2
  kind: p
  original: Er konnte u.a. bei Lukian ausführlich beschrieben finden, wie sie vom Volk als öffentliche Possenreißer betrachtet und von den römischen Kapitalisten, Prokonsuln etc. als Hofnarren zur Unterhaltung gedungen wurden, um, nachdem sie sich über der Tafel mit den Sklaven um ein paar Knochen und Brotkrumen gezankt und einen aparten sauren Wein vorgesetzt bekommen hatten, den großen Herrn und seine Gäste mit den ergötzlichen Phrasen Ataraxie, Aphasie, Hedone usw. zu amüsieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - AT3.N1
  mew_page: '126'
- id: AT3.31.1
  kind: p
  original: Wollte übrigens unser guter Mann einmal die Geschichte der alten Philosophie zur Geschichte des Altertums machen, so verstand es sich von selbst, daß er die Stoiker, Epikuräer und Skeptiker sich in die Neuplatoniker auflösen lassen mußte, deren Philosophie nichts weiter ist als die phantastische Zusammenfassung der stoischen, epikuräischen und skeptischen Doktrin mit dem Inhalt der Philosophie des Plato und Aristoteles.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: AT3.31.2
  kind: p
  original: Statt dessen läßt er diese Doktrinen direkt ins Christentum sich auflösen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - AT3.N2
  mew_page: '126'
- id: AT3.32.1
  kind: p
  original: '"Stirner" hat nicht die griechische Philosophie "hinter sich", sondern die griechische Philosophie hat "den Stirner" hinter ihr. (Vgl. Wig[and,] p.186.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: AT3.32.2
  kind: p
  original: Statt uns zu sagen, wie "das Altertum" zu einer Welt der Dinge kommt und mit ihr "fertig" wird, läßt der unwissende Schulmeister es durch ein Zitat von Timon selig verschwinden, womit um so natürlicher das Altertum sein "letztes Absehen erreicht", als die Alten nach Sankt Max "durch die Natur " sich in das antike "Gemeinwesen gestellt sahen", was, "um hiermit zu schließen", um so leichter "einleuchten kann", als man dies Gemeinwesen, Familie etc. "die sogenannten natürlichen Bande" nennt. (p. 33.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: AT3.32.3
  kind: p
  original: Durch die Natur wird die alte "Welt der Dinge" gemacht, durch Timon und Pilatus (p. 32) vernichtet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: AT3.32.4
  kind: p
  original: Statt die "Welt der Dinge" zu schildern, die dem Christentum zur materiellen Basis dient, läßt er diese "Welt der Dinge" vertilgt werden in der Welt des Geistes im - Christentum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: AT3.33.1
  kind: p
  original: Die deutschen Philosophen sind gewohnt, das Altertum als die Epoche des Realismus der christlichen und neueren Zeit als der Epoche des Idealismus entgegenzustellen, während die französischen und englischen Ökonomen, Geschichts- und Naturforscher gewohnt sind, das Altertum als die Periode Idealismus gegenüber dem Materialismus und Empirismus der neueren Zeit aufzufassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: AT3.33.2
  kind: p
  original: Ebenso kann man das Altertum insofern als idealistisch fassen, als die Alten in der Geschichte den "citoyen" repräsentieren, den idealistischen Politiker, während die Neuen zuletzt auf den "bourgeois" den realistischen ami du commerce <Freund des Handels>, hinauslaufen - oder auch wieder realistisch, weil bei ihnen das Gemeinwesen "eine Wahrheit" war, während es bei den Neuen eine idealistische "Lüge" ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: AT3.33.3
  kind: p
  original: So wenig kommt bei allen diesen abstrakten Gegensätzen und Geschichtskonstruktionen heraus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: AT3.34.1
  kind: p
  original: Das "Einzige", was wir aus dieser ganzen Darstellung der Alten lernen, ist, daß Stirner von der alten Welt zwar wenig "Dinge" "weiß", sie aber dafür desto "besser durchschaut hat". (Vgl. Wigand, p. 191.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: AT3.35.1
  kind: p
  original: Stirner ist wirklich jenes "Knäblein", von dem die Offenbarung Johannis 12, 5 weissagt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: AT3.35.2
  kind: p
  original: '"Der alle Heiden sollte weiden mit der eisernen Rute."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: AT3.35.3
  kind: p
  original: Wir haben gesehen, wie er mit der eisernen Rute seiner Unwissenheit auf die armen Heiden loshaut.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: AT3.35.4
  kind: p
  original: Den "Neuen" wirds nicht besser gehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: AT3.N1.1.1
  kind: note
  original: '[Im Manuskript gestrichen:]... gerade wie die französischen Aristokraten nach der Revolution die Tanzmeister von ganz Europa wurden, und wie die englischen Lords bald als die Stallknechte und Hundefütterer der zivilisierten Welt ihre rechte Stelle finden werden.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: AT3.N2.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Stirner hätte uns dagegen zeigen müssen, wie das Griechentum selbst nach seiner Auflösung noch eine lange Zeit fortexistierte - wie neben ihm die Römer zur Weltherrschaft kamen, was sie überhaupt in der Welt taten, wie das Römertum sich entwickelte und zerfiel und endlich Griechentum und Römertum idealistisch im Christentum, materialistisch in der Völkerwanderung zugrunde gingen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
