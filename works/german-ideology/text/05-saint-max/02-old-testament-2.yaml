  notes: ''
  mew_page: '119'
- id: AT2.56.2
  kind: p
  original: Der Schlächter schlacht't den Ochsen nicht, Der Ochse säuft das Wasser nicht, Das Wasser löscht das Feuer nicht, Das Feuer brennt den Prügel nicht, Der Prügel prügelt Pudel nicht, Der Pudel beißt den Jochem nicht, Der Jochem schneidt den Hafer nicht Und kommen nicht nach Haus.
