section: AT2
title_original: 2. Ökonomie des Alten Bundes
title_en: Old Testament, 2. The Economy of the Old Covenant
author: Karl Marx, Friedrich Engels
date: 1845-1846
original_language: de
anchor_language: de
source_original: MEW 3, S. 113-119 (Dietz, Berlin 1969) via mlwerke.de; written 1845-1846, first printed in full 1932; the authors' footnotes from mlwerke's me03_anm.htm
