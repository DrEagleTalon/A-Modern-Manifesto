  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: AT2.55.2
  kind: p
  original: Der Ochse säuft das Wasser nicht, Das Wasser löscht das Feuer nicht, Das Feuer brennt den Prügel nicht, Der Prügel prügelt Pudel nicht, Der Pudel beißt den Jochem nicht, Der Jochem schneidt den Hafer nicht Und kommt auch nicht nach Haus.
  en: ''
  modern: ''
