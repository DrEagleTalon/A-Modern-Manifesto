  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: AT2.54.2
  kind: p
  original: Das Wasser löscht das Feuer nicht, Das Feuer brennt den Prügel nicht, Der Prügel prügelt Pudel nicht, Der Pudel beißt den Jochem nicht, Der Jochem schneidt den Hafer nicht Und kommen nicht nach Haus.
