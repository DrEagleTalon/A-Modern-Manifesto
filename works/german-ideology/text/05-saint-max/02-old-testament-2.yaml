  modern_status: empty
  notes: ''
  mew_page: '116'
- id: AT2.41.5
  kind: p
  original: 'Diese Herrschaft der Spekulanten und Ideologen entwickelt sich zu guter Letzt, "da die Zeit erfüllet war", in die folgende schließliche Namengebung:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
- id: AT2.42.1
  kind: p
  original: a) der politische Liberalismus, abhängig von den Dingen, unabhängig von den Personen - Realismus, Kind, Neger, Alter, Spuk, Katholizismus, Unjebildeter, herrenlos.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
- id: AT2.43.1
  kind: p
  original: b) der soziale Liberalismus, unabhängig von den Dingen, abhängig vom Geist, gegenstandlos - Idealismus, Jüngling, Mongole, Neuer, Sparren, Protestantismus, Jebildeter, besitzlos.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
- id: AT2.44.1
  kind: p
  original: c) der humane Liberalismus, herrenlos und besitzlos, nämlich gottlos, weil Gott zugleich der höchste Herr und der höchste Besitz, Hierarchie - negative Einheit innerhalb der Sphäre des Liberalismus, als solche Herrschaft über die Welt der Dinge und der Gedanken, zugleich der vollendete Egoist in der Aufhebung des Egoismus - die vollendete Hierarchie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 116-117
- id: AT2.44.2
  kind: p
  original: Bildet zugleich den Übergang (Jüngling, der hinter die Welt der Gedanken kommt) zum
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
- id: AT2.45.1
  kind: p
  original: 'III. "Ich" - d.h. dem vollendeten Christen, vollendeten Mann, kaukasischen Kaukasier und wahren Egoisten, der, wie der Christ durch Aufhebung der alten Welt der Geist - so durch Auflösung des Geisterreichs der Leibhaftige wird, indem er die Erbschaft des Idealismus, Jünglings, Mongolen, Neuen, Christen, Besessenen, Sparrens, Protestanten, Jebildeten, Hegelianers und humanen Liberalen sine beneficio deliberandi et inventarii <wörtlich: ohne die Vergünstigung der Bedenkzeit und der Bestandsaufnahme>antritt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
- id: AT2.46.1
  kind: p
  original: NB. 1. Es können nun noch "mitunter" Feuerbachsche und sonstige Kategorien, wie Verstand, Herz etc. bei passender Gelegenheit "episodisch eingelegt" werden, um den Farbenschmelz dieses Gemäldes zu erhöhen und neue Effekte zu produzieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
- id: AT2.46.2
  kind: p
  original: Es versteht sich, daß auch diese nur neue Verkleidungen des stets durchgehenden Idealismus und Realismus sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
- id: AT2.47.1
  kind: p
  original: 2. Von der wirklichen profanen Geschichte weiß der recht gläubige Sankt Max, Jacques le bonhomme, Nichts Wirkliches und Profanes zu sagen, als daß er sie unter dem Namen der "Natur", der "Welt der Dinge", der "Welt des Kindes" pp. stets dem Bewußtsein gegenüberstellt als einen Gegenstand, worüber es spekuliert, als eine Welt, die trotz ihres beständigen Vertilgtwerdens in einem mystischen Dunkel fortexistiert, um bei jeder Gelegenheit wieder zum Vorschein zu kommen; wahrscheinlich weil die Kinder und Neger fortexistieren, also auch "leicht" ihre Welt, die sogenannte Welt der Dinge.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
- id: AT2.47.2
  kind: p
  original: 'Über dergleichen historische und unhistorische Konstruktionen hat bereits der gute alte Hegel, bei Gelegenheit Schellings, des Musterreiters aller Konstruktoren, gesagt, daß hier dies zu sagen sei:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
- id: AT2.48.1
  kind: p
  original: '"Das Instrument dieses gleichtönigen Formalismus ist nicht schwerer zu handhaben als die Palette eines Malers, auf der sich nur zwei Farben vorfinden, etwa schwarz" (realistisch, kindlich, negerhaft etc.) "und Gelb" <Bei Hegel: Rot und Grün> (idealistisch, jünglingshaft, mongolisch etc.), "um mit jener eine Fläche anzufärben, wenn ein historisches Stück" (die "Welt der Dinge"), "mit dieser, wenn eine Landschaft" ("der Himmel", Geist, das Heilige etc.) "verlangt wäre."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
- id: AT2.48.2
  kind: p
  original: '"Phänom[enologie]" p. 39.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
- id: AT2.49.1
  kind: p
  original: 'Noch treffender hat das "gemeine Bewußtsein" diese Art Konstruktionen indem folgenden Liede verspottet:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
- id: AT2.50.1
  kind: p
  original: Der Herr, der schickt den Jochem aus, Er sollt' den Hafer schneiden, Der Jochem schneidt den Hafer nicht Und kommt auch nicht nach Haus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: AT2.51.1
  kind: p
  original: Da schickt der Herr den Pudel aus, Er sollt' den Jochem beißen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: AT2.51.2
  kind: p
  original: Der Pudel beißt den Jochem nicht, Der Jochem schneidt den Hafer nicht Und kommen nicht nach Haus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: AT2.52.1
  kind: p
  original: Da schickt der Herr den Prügel aus, Er sollt' den Pudel prügeln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: AT2.52.2
  kind: p
  original: Der Prügel prügelt den Pudel nicht, Der Pudel beißt den Jochem nicht, Der Jochem schneidt den Hafer nicht Und kommen nicht nach Haus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: AT2.53.1
  kind: p
  original: Da schickt der Herr das Feuer aus, Es sollt' den Prügel brennen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: AT2.53.2
  kind: p
  original: Das Feuer brennt den Prügel nicht, Der Prügel prügelt Pudel nicht, Der Pudel beißt den Jochem nicht, Der Jochem, schneidt den Hafer nicht Und kommen nicht nach Haus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: AT2.54.1
  kind: p
  original: Da schickt der Herr das Wasser aus, Es sollt' das Feuer löschen.
