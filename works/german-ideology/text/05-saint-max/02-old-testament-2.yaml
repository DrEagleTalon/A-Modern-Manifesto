- id: AT2.57.1
  kind: p
  original: Da schickt der Herr den Henker aus, Er sollt' den Schlächter henken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '119'
- id: AT2.57.2
  kind: p
  original: Der Henker hängt den Schlächter, Der Schlächter schlacht't den Ochsen, Der Ochse säuft das Wasser, Das Wasser löscht das Feuer, Das Feuer brennt den Prügel, Der Prügel prügelt Pudel, Der Pudel beißt den Jochem, Der Jochem schneidt den Hafer, Und kommen all nach Haus.
  en: ''
  modern: ''
