verses:
- id: AT2.0.1
  kind: heading
  original: 2. Ökonomie des Alten Bundes
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: AT2.1.1
  kind: p
  original: Wir müssen hier für einen Augenblick aus "dem Gesetz" in "die Propheten" überspringen, indem wir das Geheimnis des einzigen Haushalts im Himmel und auf Erden schon an dieser Stelle enthüllen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: AT2.1.2
  kind: p
  original: Die Geschichte des Reiches des Einzigen auch im Alten Testamente, wo noch das Gesetz, der Mensch, als ein Zuchtmeister auf den Einzigen (Gal[ater] 3,24) herrscht, hat einen weisen Plan, der von Ewigkeit her beschlossen war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: AT2.1.3
  kind: p
  original: Es ist Alles zuvorgesehen und verordnet, damit der Einzige in die Welt kommen konnte, als die Zeit erfüllet war, um die heiligen Menschen von ihrer Heiligkeit zu erlösen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: AT2.2.1
  kind: p
  original: Das erste Buch, "Ein Menschenleben", heißt auch darum "Genesis", weil es den ganzen Einzigen Haushalt im Keime enthält, weil es die ganze spätere Entwickelung bis dahin, wo die Zeit erfüllet ist und das Ende der Tage hereinbricht, prototypisch uns vorführt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: AT2.2.2
  kind: p
  original: 'Die ganze Einzige Geschichte dreht sich um die drei Stufen: Kind, Jüngling, Mann, die "unter mancherlei Wandlungen" und in stets sich erweiternden Kreisen wiederkehren, bis endlich die ganze Geschichte der Welt der Dinge und der Welt des Geistes sich in "Kind, Jüngling und Mann" aufgelöst hat.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: AT2.2.3
  kind: p
  original: Wir werden überall nur verkleidete "Kind, Jüngling und Mann" wiederfinden, wie wir schon in diesen die Verkleidungen dreier Kategorien fanden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: AT2.3.1
  kind: p
  original: Wir haben oben über die deutsche philosophische Geschichtsauffassung gesprochen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: AT2.3.2
  kind: p
  original: Hier bei Sankt Max finden wir ein glänzendes Beispiel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: AT2.3.3
  kind: p
  original: Die spekulative Idee, die abstrakte Vorstellung wird zur treibenden Kraft der Geschichte und dadurch die Geschichte zur bloßen Geschichte der Philosophie gemacht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: AT2.3.4
  kind: p
  original: Aber auch diese wird nicht einmal so aufgefaßt, wie sie - nach den existierenden Quellen sich zugetragen, geschweige wie sie sich durch die Einwirkung der realen geschichtlichen Verhältnisse entwickelt hat, sondern wie sie von den neueren deutschen Philosophen, speziell Hegel und Feuerbach, aufgefaßt und dargestellt worden ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: AT2.3.5
  kind: p
  original: Und aus diesen Darstellungen selbst wird wieder nur das genommen, was für den vorliegenden Zweck passend gemacht werden kann und unserm Heiligen traditionell zugekommen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: AT2.3.6
  kind: p
  original: Die Geschichte wird so zu einer bloßen Geschichte der vorgeblichen Ideen, zu einer Geister- und Gespenstergeschichte, und die wirkliche, empirische Geschichte, die Grundlage dieser Gespenstergeschichte wird nur dazu exploitiert, um die Leiber für diese Gespenster herzugeben; ihr werden die nötigen Namen entnommen, die diese Gespenster mit dem Schein der Realität bekleiden sollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 113-114
- id: AT2.3.7
  kind: p
  original: Unser Heiliger fällt häufig bei diesem Experiment aus der Rolle und schreibt unverhüllte Gespenstergeschichte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
- id: AT2.4.1
  kind: p
  original: Bei ihm finden wir diese Art, Geschichte zu machen, in der naivsten, klassischsten Einfalt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
- id: AT2.4.2
  kind: p
  original: 'Die einfachen drei Kategorien: Realismus, Idealismus, absolute Negativität als Einheit Beider (hier "Egoismus" benamst), die wir schon als Kind, Jüngling und Mann vorfanden, werden der ganzen Geschichte zugrunde gelegt und mit verschiedenen geschichtlichen Aushängeschildern behangen; sie sind, mit ihrem bescheidenen Gefolge von Hülfskategorien, der Inhalt aller vorgeführten, vorgeblich geschichtlichen Phasen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
- id: AT2.4.3
  kind: p
  original: Der heilige Max bewährt hier wieder seinen riesenhaften Glauben, indem er den Glauben an den von deutschen Philosophen zubereiteten spekulativen Inhalt der Geschichte weiter treibt als irgendeiner seiner Vorgänger.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
- id: AT2.4.4
  kind: p
  original: Es handelt sich also in dieser feierlichen und langwierigen Geschichtskonstruktion nur darum, für drei Kategorien, die so abgedroschen sind, daß sie sich unter ihrem eignen Namen gar nicht mehr öffentlich sehen lassen dürfen, eine pomphafte Reihe volltönender Namen zu finden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
- id: AT2.4.5
  kind: p
  original: Unser gesalbter Autor hätte ganz gut von dem "Manne", p. 20, sogleich auf "Ich", p. 201, oder noch besser auf den "Einzigen", p. 485, übergehen können; das aber wäre viel zu einfach gewesen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
- id: AT2.4.6
  kind: p
  original: Zudem macht die große Konkurrenz unter den deutschen Spekulanten jedem neuen Mitbewerber eine schmetternde historische Annonce für seine Ware zur Pflicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
- id: AT2.5.1
  kind: p
  original: 'Die "Kraft des wahren Verlaufs", um mit dem Dottore Graziano zu sprechen, "verläuft sich aufs kräftigste" in folgenden "Wandlungen":'
  en: ''
  modern: ''
  modern_status: empty
