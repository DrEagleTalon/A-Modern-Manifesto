- id: AT2.58.1
  kind: p
  original: Mit welcher "Virtuosität im Denken" und mit welchem Gymnasiastenmaterial Jacques le bonhomme dieses Schema ausfüllt, werden wir sogleich zu sehen Gelegenheit haben.
