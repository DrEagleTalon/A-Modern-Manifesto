  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
- id: AT2.41.3
  kind: p
  original: Seine bisherige Anschauung von der Geschichte, die Herrschaft der Idee, wird in der Hierarchie zu einem gegenwärtig wirklich existierenden Verhältnis, zur Weltherrschaft der Ideologen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
- id: AT2.41.4
  kind: p
