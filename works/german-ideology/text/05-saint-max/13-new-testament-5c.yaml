section: NT5C
title_original: C. Mein Selbstgenuß
title_en: New Testament, 5. The Owner. C) My Self-Enjoyment
author: Karl Marx, Friedrich Engels
date: 1845-1846
original_language: de
anchor_language: de
source_original: MEW 3, S. 402-413 (Dietz, Berlin 1969) via mlwerke.de; written 1845-1846, first printed in full 1932; the authors' footnotes from mlwerke's me03_anm.htm
source_en: 'None: no public-domain English translation'
verses:
- id: NT5C.0.1
  kind: heading
  original: C. Mein Selbstgenuß
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: NT5C.1.1
  kind: p
  original: Die Philosophie, welche das Genießen predigt, ist in Europa so alt wie die kyrenäische Schule.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: NT5C.1.2
  kind: p
  original: Wie im Altertum die Griechen, sind unter den Neueren die Franzosen die Matadore in dieser Philosophie, und zwar aus demselben Grunde, weil ihr Temperament und ihre Gesellschaft sie am meisten zum Genießen befähigte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: NT5C.1.3
  kind: p
  original: Die Philosophie des Genusses war nie etwas andres als die geistreiche Sprache gewisser zum Genuß privilegierter gesellschaftlicher Kreise.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: NT5C.1.4
  kind: p
  original: Abgesehen davon, daß die Weise und der Inhalt ihres Genießens stets durch die ganze Gestalt der übrigen Gesellschaft bedingt war und an allen ihren Widersprüchen litt, wurde diese Philosophie zur reinen Phrase, sobald sie einen allgemeinen Charakter in Anspruch nahm und sich als die Lebensanschauung der Gesellschaft im Ganzen proklamierte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: NT5C.1.5
  kind: p
  original: Sie sank hier herab zur erbaulichen Moralpredigt, zur sophistischen Beschönigung der vorhandenen Gesellschaft, oder sie schlug in ihr Gegenteil um, indem sie eine unfreiwillige Askese für Genuß erklärte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: NT5C.2.1
  kind: p
  original: Die Philosophie des Genusses kam auf in der neueren Zeit mit dem Untergange der Feudalität und der Umwandlung des feudalen Landadels in den lebenslustigen und verschwenderischen Hofadel unter der absoluten Monarchie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 402-403
- id: NT5C.2.2
  kind: p
  original: Bei diesem Adel hat sie noch mehr die Gestalt unmittelbarer naiver Lebensanschauung, die ihren Ausdruck in Memoiren, Gedichten, Romanen pp. erhält.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '403'
- id: NT5C.2.3
  kind: p
  original: Zur eigentlichen Philosophie wird sie erst unter den Händen einiger Schriftsteller der revolutionären Bourgeoisie, die einerseits an der Bildung und Lebensweise des Hofadels teilnahmen und andererseits die auf den allgemeineren Bedingungen der Bourgeoisie beruhende allgemeinere Anschauungsweise dieser Klasse teilten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '403'
- id: NT5C.2.4
  kind: p
  original: Sie wurde deshalb von beiden Klassen, obwohl von ganz verschiedenen Gesichtspunkten aus, akzeptiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '403'
- id: NT5C.2.5
  kind: p
  original: War beim Adel diese Sprache noch ganz auf den Stand und die Lebensbedingungen des Standes beschränkt, so wurde sie von der Bourgeoisie verallgemeinert und an jedes Individuum ohne Unterschied gerichtet, so daß von den Lebensbedingungen dieser Individuen abstrahiert und die Genußtheorie dadurch in eine fade und heuchlerische Moraldoktrin verwandelt wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '403'
- id: NT5C.2.6
  kind: p
  original: Als die weitere Entwicklung den Adel gestürzt und die Bourgeoisie mit ihrem Gegensatz, dem Proletariat, in Konflikt gebracht hatte, wurde der Adel devot-religiös und die Bourgeoisie feierlich-moralisch und streng in ihren Theorien, oder verfiel in die oben angedeutete Heuchelei, obwohl der Adel in der Praxis keineswegs aufs Genießen verzichtete und der Genuß bei der Bourgeoisie sogar eine offizielle ökonomische Form annahm - als Luxus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - NT5C.N1
  mew_page: '403'
- id: NT5C.3.1
  kind: p
  original: Der Zusammenhang des Genießens der Individuen jeder Zeit mit den Klassenverhältnissen und den sie erzeugenden Produktions- und Verkehrsbedingungen, in denen sie leben, die Borniertheit des bisherigen, außer dem wirklichen Lebensinhalt der Individuen und zu ihm in Gegensatz stehenden Genießens, der Zusammenhang jeder Philosophie des Genießens mit dem ihr vorliegenden wirklichen Genießen und die Heuchelei einer solchen Philosophie, die sich an alle Individuen ohne Unterschied richtet, konnte natürlich erst aufgedeckt werden, als die Produktions- und Verkehrsbedingungen der bisherigen Welt kritisiert werden konnten, d.h. als der Gegensatz zwischen Bourgeoisie und Proletariat kommunistische und sozialistische Anschauungen erzeugt hatte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 403-404
- id: NT5C.3.2
  kind: p
  original: Damit war aller Moral, sei sie Moral der Askese oder des Genusses, der Stab gebrochen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '404'
- id: NT5C.4.1
  kind: p
  original: Unser fader, moralischer Sancho glaubt natürlich, wie aus dem ganzen Buche hervorgeht, es komme nur auf eine andere Moral, auf eine ihm neu scheinende Lebensanschauung, auf das "Sich-aus-dem-Kopf-Schlagen" einiger "fixen Ideen" an, damit Alle ihres Lebens froh werden, das Leben genießen können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '404'
- id: NT5C.4.2
  kind: p
  original: Das Kapitel vom Selbstgenuß könnte also höchstens unter einer neuen Etikette dieselben Phrasen und Sentenzen wiederbringen, die er schon so oft sich den "Selbstgenuß" machte, uns zu predigen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '404'
- id: NT5C.4.3
  kind: p
  original: Das einzig Originelle darin beschränkt sich auch darauf, daß er allen Genuß verhimmelt und philosophisch verdeutscht, indem er ihm den Namen "Selbstgenuß" gibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '404'
- id: NT5C.4.4
  kind: p
  original: Wenn die französische Genußphilosophie des achtzehnten Jahrhunderts wenigstens ein vorhandenes heiteres und keckes Leben in geistreicher Form schilderte, so beschränkt sich Sanchos ganze Frivolität auf Ausdrücke wie "Verzehren", "Vertun", auf Bilder wie "das Licht" (soll heißen die Kerze) und auf naturwissenschaftliche Erinnerungen, die entweder auf belletristischen Unsinn, wie daß die Pflanze "Luft des Äthers einsaugt", daß "die Singvögel Käfer schlucken", oder auf Falsa auslaufen, z.B. daß eine Kerze sich selbst verbrennt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '404'
- id: NT5C.4.5
  kind: p
  original: Dagegen genießen wir hier wieder den ganzen feierlichen Ernst gegen "das Heilige", von dem wir hören, daß es in seiner Gestalt als "Beruf - Bestimmung - Aufgabe", "Ideal", den Menschen bisher ihren Selbstgenuß versalzen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '404'
- id: NT5C.4.6
  kind: p
  original: Ohne im übrigen auf die mehr oder weniger schmutzigen Formen einzugehen, in denen das Selbst im "Selbstgenuß" mehr als eine Phrase sein kann, müssen wir dem Leser nochmals die Machinationen Sanchos gegen das Heilige, mit den geringen Modulationen dieses Kapitels, in aller Kürze vorführen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '404'
- id: NT5C.5.1
  kind: p
  original: '"Beruf, Bestimmung, Aufgabe, Ideal" sind, um dies kurz zu wiederholen, entweder'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: NT5C.6.1
  kind: p
  original: 1. die Vorstellung von den revolutionären Aufgaben, die einer unterdrückten Klasse materiell vorgeschrieben sind; oder
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: NT5C.7.1
  kind: p
  original: 2. bloße idealistische Paraphrasen oder auch entsprechender bewußter Ausdruck der durch die Teilung der Arbeit zu verschiedenen Geschäften verselbständigten Betätigungsweisen der Individuen; oder
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: NT5C.8.1
  kind: p
  original: 3. der bewußte Ausdruck der Notwendigkeit, in der Individuen, Klassen, Nationen sich jeden Augenblick befinden, durch eine ganz bestimmte Tätigkeit ihre Stellung zu behaupten; oder
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: NT5C.9.1
  kind: p
  original: 4. die in den Gesetzen, der Moral pp. ideell ausgedrückten Existenzbedingungen der herrschenden Klasse (bedingt durch die bisherige Entwicklung der Produktion), die von ihren Ideologen mit mehr oder weniger Bewußtsein theoretisch verselbständigt werden, in dem Bewußtsein der einzelnen Individuen dieser Klasse als Beruf pp. sich darstellen können und den Individuen der beherrschten Klasse als Lebensnorm entgegengehalten werden, teils als Beschönigung oder Bewußtsein der Herrschaft, teils als moralisches Mittel derselben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: NT5C.9.2
  kind: p
  original: Hier, wie überhaupt bei den Ideologen, ist zu bemerken, daß sie die Sache notwendig auf den Kopf stellen und ihre Ideologie sowohl für die erzeugende Kraft wie für den Zweck aller gesellschaftlichen Verhältnisse ansehen, während sie nur ihr Ausdruck und Symptom ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: NT5C.10.1
  kind: p
  original: Von unsrem Sancho wissen wir, daß er den unverwüstlichsten Glauben an die Illusionen dieser Ideologen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: NT5C.10.2
  kind: p
  original: Weil die Menschen sich je nach ihren verschiedenen Lebensverhältnissen verschiedne Vorstellungen von sich, d.h. dem Menschen machen, so glaubt Sancho, daß die verschiedenen Vorstellungen die verschiedenen Lebensverhältnisse gemacht und so die Engrosfabrikanten dieser Vorstellungen, die Ideologen, die Welt beherrscht haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: NT5C.10.3
  kind: p
  original: Vgl. p. 433.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: NT5C.11.1
  kind: p
  original: '"Die Denkenden herrschen in der Welt", "der Gedanke beherrscht die Welt"; "die Pfaffen oder Schulmeister" "setzen sich allerlei Zeug in den Kopf", "sie denken sich ein Menschenideal",'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: NT5C.12.1
  kind: p
  original: wonach sich die Übrigen richten müssen (p. 442).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: NT5C.12.2
  kind: p
  original: 'Sancho kennt sogar ganz genau den Schluß, wonach die Menschen den Schulmeistergrillen unterworfen wurden und in ihrer Dummheit sich selbst unterwarfen:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: NT5C.13.1
  kind: p
  original: '"Weil es Mir" (dem Schulmeister) " denkbar ist, ist es den Menschen möglich, weil den Menschen möglich, so sollten sie es sein, so war es ihr Beruf; und endlich nur nach diesem Beruf, nur als Berufene hat man die Menschen zu nehmen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: NT5C.13.2
  kind: p
  original: Und der weitere Schluß?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 405-406
- id: NT5C.13.3
  kind: p
  original: Nicht der Einzelne ist der Mensch, sondern ein Gedanke, ein Ideal ist der Mensch - Gattung - Menschheit." p. 441.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '406'
- id: NT5C.14.1
  kind: p
  original: Alle Kollisionen, in die die Menschen durch ihre wirklichen Lebensverhältnisse mit sich oder mit Andern geraten, erscheinen unsrem Schulmeister Sancho als Kollisionen, in die die Menschen mit Vorstellungen über das leben " des Menschen" geraten, die sie entweder sich selbst in den Kopf gesetzt haben oder sich von Schulmeistern haben in den Kopf setzen lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '406'
- id: NT5C.14.2
  kind: p
  original: Schlügen sie sich diese aus dem Kopf, "wie glücklich" könnten "diese armen Wesen leben", welche "Sprünge" dürften sie machen, während sie jetzt "nach der Pfeife der Schulmeister und Bärenführer tanzen" müssen! (p. 435.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '406'
- id: NT5C.14.3
  kind: p
  original: (Der niedrigste dieser "Bärenführer" ist Sancho, da er nur sich selbst an der Nase herumführt.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '406'
- id: NT5C.14.4
  kind: p
  original: Hätten z.B. die Menschen sich nicht fast immer und fast überall, in China sowohl wie in Frankreich, in den Kopf gesetzt, daß sie an Übervölkerung litten, welch einen Überfluß an Lebensmitteln würden diese "armen Wesen" nicht alsbald vorgefunden haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '406'
- id: NT5C.15.1
  kind: p
  original: Sancho versucht hier, seine alte Historie von der Herrschaft des Heiligen in der Welt wieder anzubringen unter dem Vorwande einer Abhandlung über Möglichkeit und Wirklichkeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '406'
- id: NT5C.15.2
  kind: p
  original: Möglich heißt ihm nämlich Alles, was sich ein Schulmeister von mir in den Kopf setzt, wo Sancho dann leicht beweisen kann, daß diese Möglichkeit keine andre Wirklichkeit hat als in seinem Kopfe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '406'
- id: NT5C.15.3
  kind: p
  original: Seine feierliche Behauptung, daß "sich der folgenreichste Mißverstand von Jahrtausenden hinter dem Wort möglich versteckt hielt" (p. 441), beweist hinlänglich, wie unmöglich es ihm ist, die Folgen seines reichlichen Mißverstandes von Jahrtausenden hinter Worten zu verstecken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '406'
- id: NT5C.16.1
  kind: p
  original: Diese Abhandlung über "Zusammenfallen von Möglichkeit und Wirklichkeit" (p. 439), von dem, was die Menschen das Vermögen haben zu sein und von dem, was sie sind, welche in so guter Harmonie steht mit seinen bisherigen zudringlichen Ermahnungen, man solle sein Vermögen wirken lassen usw., führt ihn indes noch auf einige Abschweifungen über die materialistische Umstandstheorie, die wir sogleich näher würdigen werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '406'
- id: NT5C.16.2
  kind: p
  original: Vorher noch ein Beispiel seiner ideologischen Verdrehung. p. 428 identifiziert er die Frage, "wie man das Leben erwerben könne", mit der Frage, wie man "das wahre Ich" (oder auch "Leben") "in sich herzustellen" habe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '406'
- id: NT5C.16.3
  kind: p
  original: Nach derselben p. [428] hört das "Bangen ums Leben" mit seiner neuen Moralphilosophie auf, und das "Vertun" desselben beginnt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '406'
- id: NT5C.16.4
  kind: p
  original: 'Die wundertätige Kraft dieser seiner angeblich neuen Moralphilosophie spricht unser Salomo "sprechender" noch in folgendem Sprüchlein aus:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '406'
- id: NT5C.17.1
  kind: p
  original: '"Sieh Dich als mächtiger an, als wofür man Dich ausgibt, so hast Du mehr Macht; sieh Dich als mehr an, so hast Du mehr." p. 483.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '407'
- id: NT5C.18.1
  kind: p
  original: Siehe oben im "Verein" Sanchos Manier, Eigentum zu erwerben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '407'
- id: NT5C.19.1
  kind: p
  original: Nun zu seiner Umstandstheorie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '407'
- id: NT5C.20.1
  kind: p
  original: '"Einen Beruf hat der Mensch nicht, aber er hat Kräfte, die sich äußern, wo sie sind, weil ihr Sein ja einzig in ihrer Äußerung besteht, und sowenig untätig verharren können als das Leben..'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '407'
- id: NT5C.20.2
  kind: p
  original: Es gebraucht jeder in Jedem Augenblick soviel Kraft, als er besitzt" ("verwertet Euch, ahmt den Tapfern nach, werde Jeder von Euch ein allmächtiges Ich" usw. ging oben die Rede Sanchos)."...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '407'
- id: NT5C.20.3
  kind: p
  original: Die Kräfte lassen sich allerdings schärfen und vervielfältigen, besonders durch feindlichen Widerstand oder freundlichen Beistand; aber wo man ihre Anwendung vermißt, da kann man auch ihrer Abwesenheit gewiß sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '407'
- id: NT5C.20.4
  kind: p
  original: Man kann aus einem Steine Feuer schlagen, aber ohne den Schlag kommt keines heraus; in gleicher Art bedarf auch ein Mensch des Anstoßes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '407'
- id: NT5C.20.5
  kind: p
  original: Darum nun, weil Kräfte sich stets von selbst werktätig erweisen, wäre das Gebot, sie zu gebrauchen. überflüssig und sinnlos...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '407'
- id: NT5C.20.6
  kind: p
  original: Kraft ist nur ein einfacheres Wort für Kraftäußerung." p.436, 437.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '407'
- id: NT5C.21.1
  kind: p
  original: 'Der "mit sich einige Egoismus", der seine Kräfte oder Vermögen ganz nach Belieben wirken oder nicht wirken läßt und das jus utendi et abutendi <Recht des Gebrauchens und Verbrauchens(auch: Mißbrauchens)> auf sie appliziert, purzelt hier plötzlich und unerwartet zusammen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '407'
- id: NT5C.21.2
  kind: p
  original: Die Kräfte wirken hier auf Einmal selbständig, ohne sich um das "Belieben" Sanchos zu kümmern, sobald sie vorhanden sind, sie wirken wie chemische oder mechanische Kräfte, unabhängig von dem Individuum, das sie besitzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '407'
- id: NT5C.21.3
  kind: p
  original: Wir erfahren ferner, daß eine Kraft nicht vorhanden ist, wenn man ihre Äußerung vermißt; was dadurch berichtigt wird, daß die Kraft eines Anstoßes bedarf, um sich zu äußern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '407'
- id: NT5C.21.4
  kind: p
  original: Wie aber Sancho entscheiden will, ob bei mangelnder Kraftäußerung der Anstoß oder die Kraft fehlt, erfahren wir nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '407'
- id: NT5C.21.5
  kind: p
  original: Dagegen belehrt uns unser einziger Naturforscher, daß "man aus einem Steine Feuer schlagen kann", ein Beispiel, das, wie immer bei Sancho, gar nicht unglücklicher gewählt werden konnte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '407'
- id: NT5C.21.6
  kind: p
  original: Sancho glaubt als schlichter Dorfschulmeister, daß, wenn er Feuer schlägt, dies aus dem Stein kommt, wo es bisher verborgen lag.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '407'
- id: NT5C.21.7
  kind: p
  original: Jeder Quartaner wird ihm sagen können, daß bei dieser in allen zivilisierten Ländern längst vergessenen Methode des Feuermachens durch die Reibung von Stahl und Stein Partikelchen vom Stahl, nicht vom Stein, abgelöst werden, die durch ebendieselbe Reibung in Glühhitze geraten; daß also "das Feuer", was für Sancho nicht ein unter gewissen Hitzegraden stattfindendes Verhältnis gewisser Körper zu gewissen andern Körpern, speziell dem Sauerstoff, sondern ein selbständiges Ding, ein "Element", eine fixe Idee, "das Heilige" ist - daß dies Feuer weder aus dem Stein noch aus dem Stahl kommt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 407-408
- id: NT5C.21.8
  kind: p
  original: 'Sancho hätte ebensogut sagen können: Man kann aus Chlor gebleichte Leinwand machen, aber wenn der "Anstoß" fehlt, nämlich die ungebleichte Leinwand, so "kommt keine heraus".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.21.9
  kind: p
  original: Bei dieser Gelegenheit wollen wir zu Sanchos "Selbstgenuß" ein früheres Faktum der "einzigen" Naturwissenschaft registrieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.21.10
  kind: p
  original: 'In der Ode vom Verbrechen hieß es:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.22.1
  kind: p
  original: '"Grollt es nicht in fernen Donnern, Und siehst Du nicht, wie der Himmel Ahnungsvoll schweigt und sich trübt?" (p. 319 "des Buchs".)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.23.1
  kind: p
  original: Es donnert, und der Himmel schweigt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.23.2
  kind: p
  original: Sancho weiß also von einem andern Ort, wo es donnert, als am Himmel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.23.3
  kind: p
  original: Sancho bemerkt ferner das Schweigen des Himmels durch seinen Gesichtssinn, ein Kunststück, das ihm niemand nachmacht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.23.4
  kind: p
  original: Oder aber, Sancho hört das Donnern und sieht das Schweigen, wo beides gleichzeitig geschehen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.23.5
  kind: p
  original: Wir sahen, wie Sancho beim "Spuk" die Berge den "Geist der Erhabenheit" repräsentieren ließ.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.23.6
  kind: p
  original: Hier repräsentiert ihm der schweigende Himmel den Geist der Ahnung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.24.1
  kind: p
  original: Man sieht übrigens nicht ein, warum Sancho hier so sehr gegen "das Gebot, seine Kräfte zu gebrauchen", eifert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.24.2
  kind: p
  original: Dies Gebot kann ja möglicherweise der fehlende "Anstoß" sein, ein "Anstoß", der zwar bei einem Stein seine Wirkung verfehlt, dessen Wirksamkeit Sancho indes bei jedem exerzierenden Bataillon beobachten kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.24.3
  kind: p
  original: Daß das "Gebot" selbst für seine geringen Kräfte ein "Anstoß" ist, geht ohnehin daraus hervor, daß es für ihn ein "Stein des Anstoßes" ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.25.1
  kind: p
  original: Das Bewußtsein ist auch eine Kraft, die sich nach der Doktrin, die wir eben hörten, auch "stets von selbst werktätig erweist".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.25.2
  kind: p
  original: Sancho müßte hiernach also nicht darauf ausgehen, das Bewußtsein zu ändern, sondern höchstens den "Anstoß", der auf das Bewußtsein wirkt; wonach Sancho sein ganzes Buch umsonst geschrieben hätte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.25.3
  kind: p
  original: Aber in diesem Falle hält er allerdings seine Moralpredigten und "Gebote" für einen hinreichenden "Anstoß."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.26.1
  kind: p
  original: '"Was Einer werden kann, das wird er auch.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.26.2
  kind: p
  original: Ein geborner Dichter mag wohl durch die Ungunst der Umstände gehindert werden, auf der Höhe der Zeit zu stehen und nach den dazu unerläßlichen großen Studien große Kunstwerke zu schaffen; aber dichten wird er, sei er Ackerknecht oder so glücklich, am Weimarschen Hofe zu leben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.26.3
  kind: p
  original: 'Ein geborner Musiker wird Musik treiben, gleichviel ob auf allen Instrumenten" (diese Phantasie von " allen Instrumenten hat ihm Proudhon geliefert. Sieh: "Der Kommunismus) "oder nur auf einem Haferrohr" (dem Schulmeister fallen natürlich wieder Virgils Eklogen ein).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.26.4
  kind: p
  original: '"Ein geborner philosophischer Kopf kann sich als Universitätsphilosoph oder als Dorfphilosoph bewähren.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.26.5
  kind: p
  original: Endlich ein geborner Dummerjan wird immer ein vernagelter Kopf bleiben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '408'
- id: NT5C.26.6
  kind: p
  original: Ja die gebornen beschränkten Köpfe bilden unstreitig die zahlreichste Menschenklasse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 408-409
- id: NT5C.26.7
  kind: p
  original: Warum sollten auch in der Menschengattung nicht dieselben Unterschiede hervortreten, welche in jeder Tiergattung unverkennbar sind?" p. 434.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '409'
- id: NT5C.27.1
  kind: p
  original: Sancho hat wieder sein Exempel mit dem gewöhnlichen Ungeschick gewählt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '409'
- id: NT5C.27.2
  kind: p
  original: Angenommen seinen Unsinn von den gebornen Dichtern, Musikern, Philosophen, so beweist dies Exempel einerseits nur, daß ein geborner P.P. das bleibt, was er schon durch die Geburt ist, nämlich Dichter etc., und andererseits, daß der geborne P,P., soweit er wird, sich entwickelt, "durch die Ungunst der Umstände" dahin kommen kann, das nicht zu werden, was er werden konnte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '409'
- id: NT5C.27.3
  kind: p
  original: Sein Exempel beweist also nach der einen Seite hin gar nichts, nach der andern das Gegenteil von dem, was es beweisen sollte, und nach beiden zusammen, daß Sancho, gleichviel ob durch Geburt oder Umstände, zu der "zahlreichsten Menschenklasse" gehört.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '409'
- id: NT5C.27.4
  kind: p
  original: Er teilt dafür mit ihr und seinem "Nagel" den Trost, daß er ein einziger "vernagelter Kopf" ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '409'
- id: NT5C.28.1
  kind: p
  original: Sancho erleidet hier das Abenteuer mit dem Zaubertrank, den Don Quijote aus Rosmarin, Wein, Öl und Salz gebraut hatte und wovon Cervantes am siebzehnten berichtet, daß Sancho danach zwei Stunden lang unter Schweiß und Verzuckungen aus beiden Kanälen seines Leibes sich ergoß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '409'
- id: NT5C.28.2
  kind: p
  original: Der materialistische Trank, den unser tapferer Schildknapp zu seinem Selbstgenuß eingenommen hat, entleert ihn seines ganzen Egoismus im außergewöhnlichen Verstande.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '409'
- id: NT5C.28.3
  kind: p
  original: Wir sahen oben, wie Sancho gegenüber dem "Anstoß" plötzlich alle Feierlichkeit verlor und auf seine "Vermögen" verzichtete, wie weiland die ägyptischen Zauberer gegenüber den Läusen Mosis; hier kommen nun zwei neue Anfälle von Kleinmütigkeit vor, in denen er auch vor "der Ungunst der Umstände " sich beugt und endlich sogar seine ursprüngliche physische Organisation für etwas anerkennt, das ohne sein Zutun verkrüppelt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '409'
- id: NT5C.28.4
  kind: p
  original: Was bleibt unsrem bankerutten Egoisten nun noch übrig?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '409'
- id: NT5C.28.5
  kind: p
  original: Seine ursprüngliche Organisation steht nicht in seiner Hand; die "Umstände" und den "Anstoß", unter deren Einfluß diese Organisation sich entwickelt, kann er nicht kontrollieren; "wie er in jedem Augenblicke ist, ist er" nicht "sein Geschöpf", sondern das Geschöpf der Wechselwirkung zwischen seinen angebornen Anlagen und den auf sie einwirkenden Umständen - alles das konzediert Sancho.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '409'
- id: NT5C.28.6
  kind: p
  original: Unglücklicher "Schöpfer"!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '409'
- id: NT5C.28.7
  kind: p
  original: Unglücklichstes "Geschöpf"!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '409'
- id: NT5C.29.1
  kind: p
  original: Aber das größte Unglück kommt zuletzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '409'
- id: NT5C.29.2
  kind: p
  original: Sancho, nicht zufrieden damit, daß die tres mil azotes y trecientos en ambas sus valientes posaderas <dreitausenddreihundert Geißelhiebe auf seine mächtigen Sitzfleischhälften > längst vollzählig sind, Sancho muß sich schließlich noch einen Hauptschlag dadurch versetzen, daß er sich als einen Gattungsgläubigen proklamiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 409-410
- id: NT5C.29.3
  kind: p
  original: Und welchen Gattungsgläubigen!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '410'
- id: NT5C.29.4
  kind: p
  original: Er schreibt der Gattung zuerst die Teilung der Arbeit zu, indem er sie für das Faktum verantwortlich macht, daß einige Leute Dichter, andre Musiker, andre Schulmeister sind; er schreibt ihr zweitens die existierenden physischen und intellektuellen Mängel der "zahlreichsten Menschenklasse" zu und macht sie dafür verantwortlich, daß unter der Herrschaft der Bourgeoisie die Mehrzahl der Individuen seines gleichen sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '410'
- id: NT5C.29.5
  kind: p
  original: Nach seinen Ansichten über die gebornen beschränkten Köpfe müßte man sich die heutige Verbreitung der Skrofeln daraus erklären, daß "die Gattung" ein besonderes Vergnügen daran findet, die gebornen skrofulösen Konstitutionen "die zahlreichste Menschenklasse" bilden zu lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '410'
- id: NT5C.29.6
  kind: p
  original: Über dergleichen Naivetäten waren sogar die gewöhnlichsten Materialisten und Mediziner hinaus, lange ehe der mit sich einige Egoist von der "Gattung", der "Ungunst der Umstände" und dem "Anstoß" den "Beruf" erhielt, vor dem deutschen Publikum zu debütieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '410'
- id: NT5C.29.7
  kind: p
  original: Wie Sancho bisher alle Verkrüppelung der Individuen und damit ihrer Verhältnisse aus den fixen Ideen der Schulmeister erklärte, ohne sich um die Entstehung dieser Ideen zu bekümmern, so erklärt er diese Verkrüppelung jetzt aus dem bloßen Naturprozeß der Erzeugung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '410'
- id: NT5C.29.8
  kind: p
  original: Er denkt nicht im entferntesten daran, daß die Entwicklungsfähigkeit der Kinder sich nach der Entwicklung der Eltern richtet und daß alle diese Verkrüppelungen unter den bisherigen gesellschaftlichen Verhältnissen historisch entstanden sind und ebensogut historisch wieder abgeschafft werden können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '410'
- id: NT5C.29.9
  kind: p
  original: Selbst die naturwüchsigen Gattungsverschiedenheiten, wie Rassenunterschiede etc., von denen Sancho gar nicht spricht, können und müssen historisch beseitigt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '410'
- id: NT5C.29.10
  kind: p
  original: Sancho, der bei dieser Gelegenheit einen verstohlenen Blick in die Zoologie wirft und dabei entdeckt, daß die "gebornen beschränkten Köpfe" nicht nur bei Schafen und Ochsen, sondern auch bei Polypen und Infusorien, die keine Köpfe haben, die zahl reichste Klasse bilden - Sancho hat vielleicht davon gehört, daß man auch Tierrassen veredeln und durch die Rassenkreuzung ganz neue, sowohl für den Genuß der Menschen wie für ihren eignen Selbstgenuß vollkommnere Arten erzeugen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '410'
- id: NT5C.29.11
  kind: p
  original: '"Warum sollte nicht" Sancho hieraus einen Schluß auf die Menschen ziehen können?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '410'
- id: NT5C.30.1
  kind: p
  original: Bei dieser Gelegenheit wollen wir Sanchos "Wandlungen" über die Gattung "episodisch einlegen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '410'
- id: NT5C.30.2
  kind: p
  original: Wir werden sehen, daß er sich zur Gattung geradeso stellt wie zum Heiligen; je mehr er gegen sie poltert, desto mehr glaubt er an sie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '410'
- id: NT5C.31.1
  kind: p
  original: Nr. I sahen wir schon, wie die Gattung die Teilung der Arbeit und die unter den bisherigen sozialen Umständen entstandenen Verkrüppelungen erzeugt, und zwar so, daß die Gattung samt ihren Produkten als etwas unter allen Umständen Unveränderliches, von der Kontrolle der Menschen Unabhängiges gefaßt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: NT5C.32.1
  kind: p
  original: Nr. II. "Die Gattung ist bereits durch die Anlage realisiert; was Du hingegen aus dieser Anlage machst" (mußte nach Obigem heißen was die "Umstände" aus ihr machen), "das ist die Realisation Deiner.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: NT5C.32.2
  kind: p
  original: Deine Hand ist vollkommen realisiert im Sinne der Gattung, sonst wäre sie nicht Hand, sondern etwa Tatze...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: NT5C.32.3
  kind: p
  original: Du machst aus ihr Das, was und wie Du sie haben willst und machen kannst." p. 184, 185 Wig[and].
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: NT5C.33.1
  kind: p
  original: Hier wiederholt Sancho das unter Nr. I. Gesagte in andrer Form.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: NT5C.34.1
  kind: p
  original: Wir haben also im Bisherigen gesehen, wie die Gattung unabhängig von der Kontrolle und der geschichtlichen Entwicklungsstufe der Individuen die sämtlichen physischen und geistigen Anlagen, das unmittelbare Dasein der Individuen und im Keim die Teilung der Arbeit in die Welt setzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: NT5C.35.1
  kind: p
  original: Nr. III. Die Gattung bleibt als "Anstoß", der nur der allgemeine Ausdruck für die "Umstände" ist, welche die Entwicklung des wieder von der Gattung erzeugten ursprünglichen Individuums bestimmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: NT5C.35.2
  kind: p
  original: Sie ist für Sancho hier ebendieselbe mysteriöse Macht, die die übrigen Bourgeois die Natur der Dinge nennen und der sie alle Verhältnisse auf die Schultern schieben, die von ihnen als Bourgeois unabhängig sind und deren Zusammenhang sie deshalb nicht verstehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: NT5C.36.1
  kind: p
  original: Nr. IV. Die Gattung als das "Menschenmögliche" und "menschliche Bedürfnis" bildet die Grundlage der Organisation der Arbeit im "Stirnerschen Verein", wo ebenfalls das Allen Mögliche und das Allen gemeinschaftliche Bedürfnis als Produkt der Gattung gefaßt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: NT5C.37.1
  kind: p
  original: 'Nr. V. Wir haben gehört, welche Rolle die Verständigung im Verein spielt. p. 462:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: NT5C.38.1
  kind: p
  original: '"Kommt es darauf an, sich zu verständigen und mitzuteilen, so kann Ich allerdings nur von den menschlichen Mitteln Gebrauch machen, die Mir, weil Ich zugleich Mensch bin" (id est Exemplar der Gattung), "zu Gebote stehen."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: NT5C.39.1
  kind: p
  original: Hier also die Sprache als Produkt der Gattung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: NT5C.39.2
  kind: p
  original: Daß Sancho deutsch und nicht französisch spricht, verdankt er keineswegs der Gattung, sondern den Umständen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '411'
- id: NT5C.39.3
  kind: p
  original: Die Naturwüchsigkeit der Sprache ist übrigens in jeder modernen ausgebildeten Sprache, teils durch die Geschichte der Sprachentwicklung aus vorgefundenem Material, wie bei den romanischen und germanischen Sprachen, teils durch die Kreuzung und Mischung von Nationen, wie im Englischen, teils durch auf ökonomischer und politischer Konzentration beruhende Konzentration der Dialekte innerhalb einer Nation zur Nationalsprache aufgehoben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 411-412
- id: NT5C.39.4
  kind: p
  original: Daß die Individuen ihrerzeit auch dies Produkt der Gattung vollständig unter ihre Kontrolle nehmen werden, versteht sich von selbst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.39.5
  kind: p
  original: In dem Verein wird man die Sprache als solche sprechen, die heilige Sprache, die Sprache des Heiligen - Hebräisch, und zwar den aramäischen Dialekt, den das "beleibte Wesen" Christus sprach.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.39.6
  kind: p
  original: Dies "fiel" uns hier "wider Erwarten" Sanchos ein, "und zwar lediglich, weil Uns dünkt, es könne zur Verdeutlichung des Übrigen beitragen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.40.1
  kind: p
  original: Nr. VI. p. 277, 278 erfahren wir, daß "die Gattung in Völker, Städte, Stände, allerlei Körperschaften", zuletzt "in die Familie" sich auftut und daher konsequent bis jetzt auch "Geschichte gespielt" hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.40.2
  kind: p
  original: Hier wird also die ganze bisherige Geschichte bis auf die unglückliche Geschichte des Einzigen zum Produkt der "Gattung", und zwar aus dem zureichenden Grunde, weil man zuweilen diese Geschichte unter dem Namen Geschichte der Menschheit, i.e. der Gattung, zusammengefaßt hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.41.1
  kind: p
  original: 'Nr. VII. Sancho hat in dem Bisherigen der Gattung mehr zugeteilt als je ein Sterblicher vor ihm und resümiert dies nun in dem Satz:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.42.1
  kind: p
  original: '"Die Gattung ist Nichts... die Gattung nur ein Gedachtes (Geist. Gespenst pp.). p. 239.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.43.1
  kind: p
  original: Schließlich hat es denn auch mit dem "Nichts" Sanchos, das mit dem "Gedachten" identisch ist, nichts auf sich, denn er selbst ist "das schöpferische Nichts", und die Gattung schafft, wie wir sahen, sehr viel, wobei sie also sehr gut "Nichts" sein kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.43.2
  kind: p
  original: 'Überdem erzählt Sancho uns p. 456:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.44.1
  kind: p
  original: '"Durch das Sein wird gar nichts gerechtfertigt; das Gedachte ist so gut wie das Nichtgedachte."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.45.1
  kind: p
  original: Von p. 448 an spinnt Sancho ein 30 Seiten langes Garn ab, um "Feuer" aus dem Denken und der Kritik des mit sich einigen Egoisten zu schlagen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.45.2
  kind: p
  original: Wir haben schon zu viel Äußerungen seines Denkens und seiner Kritik erlebt, um dem Leser noch mit Sanchos Armenhaus-Gerstenbrühe einen "Anstoß" zu geben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.45.3
  kind: p
  original: Ein Löffel voll von dieser Brühe mag hinreichen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.46.1
  kind: p
  original: '"Glaubt Ihr, die Gedanken flögen so vogelfrei umher, daß sich Jeder welche holen dürfte, die er dann als sein unantastbares Eigentum gegen Mich geltend machte?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.46.2
  kind: p
  original: Was umherfliegt, ist Alles - Mein." p. 457.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.47.1
  kind: p
  original: Sancho begeht hier Jagdfrevel an gedachten Schnepfen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.47.2
  kind: p
  original: Wir haben gesehen, wie viele von den umherfliegenden Gedanken er sich eingefangen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.47.3
  kind: p
  original: Er wähnte sie erhaschen zu können, sobald er ihnen nur das Salz des Heiligen auf den Schwanz streute.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '412'
- id: NT5C.47.4
  kind: p
  original: Dieser ungeheure Widerspruch zwischen seinem wirklichen Eigentum an Gedanken und seiner Illusion darüber mag als klassisches und sinnfälliges Exempel seines ganzen Eigentums im außergewöhnlichen Verstande dienen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 412-413
- id: NT5C.47.5
  kind: p
  original: Eben dieser Kontrast bildet seinen Selbstgenuß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '413'
- id: NT5C.N1.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Im Mittelalter waren die Genüsse vollständig klassifiziert; jeder Stand hatte seine besondern Genüsse und seine besondre Weise des Genießens.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5C.N1.1.2
  kind: note
  original: Der Adel war der zum ausschließlichen Genießen privilegierte Stand, während bei der Bourgeoisie schon die Spaltung zwischen Arbeit und Genuß existierte und der Genuß der Arbeit subordiniert war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5C.N1.1.3
  kind: note
  original: Die Leibeignen, die ausschließlich zur Arbeit bestimmte Klasse, hatte nur höchst wenige und beschränkte Genüsse, die ihnen mehr zufällig kamen, von der Laune ihrer Herren und andern zufälligen Umständen abhingen und kaum in Betracht kommen können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5C.N1.1.4
  kind: note
  original: '- Unter der Herrschaft der Bourgeoisie nahmen die Genüsse ihre Form von den Klassen der Gesellschaft an.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5C.N1.1.5
  kind: note
  original: Die Genüsse der Bourgeoisie richten sich nach dem Material, was diese Klasse in ihren verschiednen Entwicklungsstufen produziert hatte, und nahmen von den Individuen sowie von der fortgesetzten Subordination des Genusses unter den Gelderwerb den langweiligen Charakter an, den sie noch jetzt haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5C.N1.1.6
  kind: note
  original: Die Genüsse des Proletariats erhielten einerseits durch die lange Arbeitszeit, die das Genußbedürfnis aufs Höchste steigerte, und andrerseits durch die qualitative und quantitative Beschränkung der dem Proletarier zugänglichen Genüsse, die gegenwärtige brutale Form.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5C.N1.1.7
  kind: note
  original: '- Die Genüsse Aller bisherigen Stände und Klassen mußten überhaupt entweder kindisch, ermüdend oder brutal sein, weil sie immer von der gesamten Lebenstätigkeit, dem eigentlichen Inhalt des Lebens der Individuen getrennt waren, und sich mehr oder weniger darauf reduzierten, daß einer inhaltslosen Tätigkeit ein scheinbarer Inhalt gegeben wurde.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5C.N1.1.8
  kind: note
  original: Die Kritik dieser bisherigen Genüsse konnte natürlich erst dann stattfinden, als der Gegensatz zwischen Bourgeoisie und Proletariat soweit entwickelt war, daß auch die bisherige Produktions- und Verkehrsweise kritisiert werden konnte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
