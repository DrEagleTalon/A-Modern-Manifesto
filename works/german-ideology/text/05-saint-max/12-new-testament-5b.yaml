- id: NT5B.1.1
  kind: p
  original: '[...] zeigt er nur wieder seine Leichtgläubigkeit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '329'
- id: NT5B.1.2
  kind: p
  original: Schon die Reaktionäre wußten, daß die Bourgeois in der Konstitution den naturwüchsigen Staat aufheben und einen eignen Staat errichten und machen; daß "le pouvoir constituant, qui était dans le temps (naturwüchsig), passa dans la volonté humaine" <"die konstituierende Macht, die in der Zeit lag, in den Menschlichen Willen überging">, daß "dieser gemachte Staat wie ein gemachter, gemalter Baum ist" usw. Siehe Fiévée, "Correspondance politique et administrative", Paris 1815 - "Appel à la France contre la division des opinions" - "Le drapeau blanc" von Sarrans aîné <Sarran der Ältere> und "Gazette de France" aus der Restaurationszeit und die früheren Schriften von Bonald, de Maistre pp. Die liberalen Bourgeois werfen wiederum den alten Republikanern vor, von denen sie natürlich ebensowenig wußten als Sankt Max vom Bourgeoisstaat, daß ihr Patriotismus nichts sei als "une passion, factice envers und être abstrait, une idée générale" <"eine künstliche, auf ein abstraktes Wesen, eine allgemeine Idee gerichtete Leidenschaft"> (Benj. Constant, "De l'esprit des conquêtes", Paris 1814, p. 93), während die Reaktionäre den Bourgeois vorwarfen, daß ihre politische Ideologie nichts sei als "une mystification que la classe aisée fait subir à celles qui ne le sont pas"<"eine Täuschung, mit der die wohlhabende Klasse jene Klassen foppt, die es nicht sind"> ("Gazette de France", 1831, Février). - p. 295 erklärt Sankt Sancho den Staat für "eine Anstalt, das Volk zu christianisieren", und weiß von der Grundlage des Staats soviel zu sagen, daß dieser durch "den Kitt" der "Achtung vor dem Gesetz" oder das Heilige durch die Achtung (das Heilige als Kopula) vor dem Heiligen "zusammengehalten wird" (p. 314).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 329-330
- id: NT5B.2.1
  kind: p
  original: Note 4.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: NT5B.3.1
  kind: p
  original: '"Ist der Staat heilig, so muß Zensur sein", p. 316.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: NT5B.3.2
  kind: p
  original: '- "Die französische Regierung bestreitet die Preßfreiheit nicht als Menschenrecht, sie fordert aber vom Einzelnen eine Kaution dafür, daß er wirklich Mensch sei."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: NT5B.3.3
  kind: p
  original: (Quel bonhomme! <Welcher Biedermann!> Jacques le bonhomme wird zum Studium der Septembergesetze "berufen".) p. 380.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: NT5B.4.1
  kind: p
  original: Note 5, in der wir die tiefsten Aufschlüsse erhalten über die verschiedenen Staatsformen, die Jacques le bonhomme verselbständigt und in denen er nur verschiedene Versuche sieht, den wahren Staat zu realisieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: NT5B.5.1
  kind: p
  original: '"Die Republik ist gar nichts anderes als die absolute Monarchie: denn es verschlägt nichts, ob der Monarch Fürst oder Volk heiße, da Beide eine Majestät" (das Heilige) "sind...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: NT5B.5.2
  kind: p
  original: Der Konstitutionalismus ist weiter als die Republik, weil er der in der Auflösung begriffene Staat ist."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: NT5B.5.3
  kind: p
  original: 'Diese Auflösung wird dahin erklärt: "Im konstitutionellen Staate... will die Regierung absolut sein, und das Volk will absolut sein.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: NT5B.5.4
  kind: p
  original: Diese beiden Absoluten" (sc. Heiligen) "werden sich aneinander aufreiben." p. 302.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: NT5B.5.5
  kind: p
  original: '- ''Ich bin nicht der Staat, Ich bin das schöpferische Nichts des Staats''; "damit versinken alle Fragen" (über Konstitution pp.) "in ihr wahres Nichts." p. 310. -'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: NT5B.6.1
  kind: p
  original: 'Er hätte hinzufügen sollen, daß auch die obigen Sätze über die Staatsformen nur eine Umschreibung dieses "Nichts" sind, dessen einzige Schöpfung der obige Satz ist: Ich bin nicht der Staat.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: NT5B.6.2
  kind: p
  original: Sankt Sancho spricht hier ganz in deutscher Schulmeistermanier von " der " Republik, die natürlich viel älter ist als die konstitutionelle Monarchie, z.B. die griechischen Republiken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 330-331
- id: NT5B.7.1
  kind: p
  original: Daß in einem demokratischen Repräsentativstaat wie Nordamerika die Klassenkollisionen bereits eine Form erreicht haben, zu der die konstitutionellen Monarchien erst hingedrängt werden, davon weiß er natürlich Nichts.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: NT5B.7.2
  kind: p
  original: Seine Phrasen über die konstitutionelle Monarchie beweisen, daß er seit dem 1842 des Berliner Kalenders Nichts gelernt und Nichts vergessen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: NT5B.8.1
  kind: p
  original: Note 6.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: NT5B.9.1
  kind: p
  original: '"Der Staat verdankt nur der Mißachtung, welche Ich vor Mir habe, seine Existenz" und wird mit dem Verschwinden dieser Geringschätzung ganz erlöschen" (wonach es nur von Sancho abhängt, wie bald alle Staaten der Welt "erlöschen" sollen. Wiederholung von Note 3 in umgekehrter Gleichung - siehe Logik).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: NT5B.9.2
  kind: p
  original: '"Er ist nur, wenn er über Mir ist, nur als Macht und Mächtiger.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: NT5B.9.3
  kind: p
  original: Oder " (merkwürdiges Oder, das das Gegenteil von dem beweist, was es beweisen soll) "könnt ihr Euch einen Staat denken, dessen "Einwohner sich allesamt " (Sprung aus dem "Ich" in das "Wir") "nichts aus ihm machen?" p. 377.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: NT5B.10.1
  kind: p
  original: Auf die Synonymik von "Macht", "Mächtig" und "machen" brauchen wir nicht mehr einzugehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: NT5B.11.1
  kind: p
  original: Daraus, daß es Leute in jedem Staat gibt, die sich aus ihm etwas machen, d.h. die im Staat und durch den Staat aus sich etwas machen, schließt Sancho, daß der Staat eine Macht über diesen Leuten ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: NT5B.11.2
  kind: p
  original: Es handelt sich hier wieder nur darum, daß man sich die fixe Idee des Staats aus dem Kopfe zu schlagen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: NT5B.11.3
  kind: p
  original: Jacques le bonhomme träumt noch immer, daß der Staat eine bloße Idee sei, und glaubt an die selbständige Macht dieser Staatsidee.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: NT5B.11.4
  kind: p
  original: Er ist der wahre "Staatsgläubige, Staatsbesessene, Politiker" (p. 309).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: NT5B.11.5
  kind: p
  original: Hegel idealisierte die Vorstellung der politischen Ideologen vom Staat, die noch von den einzelnen Individuen, wenn auch bloß vom Willen dieser Individuen ausgingen; Hegel verwandelt den gemeinsamen Willen dieser Einzelnen in den absoluten Willen, und diese Idealisierung der Ideologie nimmt Jacques le bonhomme bona fide <gutgläubig> für die richtige Ansicht vom Staate an und kritisiert sie in diesem Glauben dadurch, daß er das Absolute für das Absolute erklärt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: NT5B.12.1
  kind: heading
  original: 5. Die Gesellschaft als bürgerliche Gesellschaft
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: NT5B.13.1
  kind: p
  original: Wir werden uns bei diesem Kapitel etwas länger aufhalten, weil es, nicht ohne Absicht, das konfuseste aller "im Buche" enthaltenen konfusen Kapitel ist, und weil es zugleich am glänzendsten beweist, wie wenig es unsrem Heiligen gelingt, die Dinge in ihrer profanen Gestalt kennenzulernen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 331-332
- id: NT5B.13.2
  kind: p
  original: Statt sie zu profanieren, heiligt er sie, indem er nur seine eigne heilige Vorstellung dem Leser "zugute kommen läßt".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: NT5B.13.3
  kind: p
  original: Ehe wir auf die eigentliche bürgerliche Gesellschaft kommen, werden wir noch über das Eigentum überhaupt und in seinem Verhältnis zum Staat einige neue Aufschlüsse vernehmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: NT5B.13.4
  kind: p
  original: Diese Aufschlüsse erscheinen um so neuer, als sie Sankt Sancho Gelegenheit geben, seine beliebtesten Gleichungen über Recht und Staat wieder anzubringen und dadurch seiner "Abhandlung" "mannigfaltigere Wandlungen" und "Brechungen zu geben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: NT5B.13.5
  kind: p
  original: Wir brauchen natürlich bloß die letzten Glieder dieser schon dagewesenen Gleichungen zu zitieren, da der Leser sich aus dem Kapitel "Meine Macht" ihres Zusammenhanges noch erinnern wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: NT5B.14.1
  kind: p
  original: Privateigentum oder
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: NT5B.15.1
  kind: p
  original: bürgerliches Eigentum = nicht Mein Eigentum, = Heiliges Eigentum = Fremdes Eigentum = Respektiertes Eigentum oder Respekt vor dem Fremden Eigentum = Eigentum des Menschen (p. 327, 369).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: NT5B.16.1
  kind: p
  original: 'Aus diesen Gleichungen ergeben sich zugleich folgende Antithesen:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: NT5B.17.1
  kind: p
  original: Eigentum im bürgerlichen Sinne - Eigentum im egoistischen Sinne. (p. 327)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: NT5B.18.1
  kind: p
  original: Eigentum des Menschen - "Eigentum Meiner".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: NT5B.19.1
  kind: p
  original: ("Menschliche Habe" - Meine Habe) p. 324.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: NT5B.20.1
  kind: p
  original: 'Gleichungen: der Mensch = Recht = Staatsgewalt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: NT5B.21.1
  kind: p
  original: Privateigentum oder bürgerliches Eigentum = Rechtliches Eigentum (p. 324), = Mein durch das Recht (p. 332), = garantiertes Eigentum, = Eigentum von Fremden, = dem Fremden angehöriges Eigentum, = Rechtseigentum (p. 367, 332), = ein Rechtsbegriff, = Etwas Geistiges, = Allgemeines, = Fiktion, = reiner Gedanke, = fixe Idee, = Gespenst, = Eigentum des Gespenstes (p. 368, 324, 332, 367, 369).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 332-333
- id: NT5B.22.1
  kind: p
  original: Privateigentum = Eigentum des Rechts.
  en: ''
  modern: ''
