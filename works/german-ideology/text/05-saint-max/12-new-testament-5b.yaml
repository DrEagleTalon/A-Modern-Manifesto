  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: NT5B.27.1
  kind: p
  original: Staat = der allgemeine Eigentümer (p. 339, 334).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: NT5B.28.1
  kind: p
  original: Wir kommen jetzt zu den Antithesen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: NT5B.29.1
  kind: p
  original: Privateigentum - Egoistisches Eigentum
  en: ''
