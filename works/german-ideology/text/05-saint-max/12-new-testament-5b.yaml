- id: NT5B.33.1
  kind: p
  original: Rechtliches Eigentum Anderer - Rechtliches Eigentum des Andern ist, was Mir Recht ist (p. 339),
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: NT5B.34.1
  kind: p
  original: was in hundert andern Formeln, wenn man z.B. Vollmacht statt Macht setzt oder schon dagewesene Formeln anwendet, wiederholt werden kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: NT5B.35.1
  kind: p
  original: Privateigentum = Fremdheit am Eigentum aller Andern - Mein Eigentum = Eigentum am Eigentum aller Andern
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
