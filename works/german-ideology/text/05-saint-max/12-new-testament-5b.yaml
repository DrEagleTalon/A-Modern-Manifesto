  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.43.1
  kind: p
  original: 'Abhandlung I: Über Parzellierung des Grundbesitzes, Ablösung der Servituten und Verschlingung des kleinen Grundeigentums durch das große.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.44.1
  kind: p
  original: Diese Sachen werden Alle aus dem heiligen Eigentum und der Gleichung bürgerliches Eigentum = Respekt vor dem Heiligen entwickelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.45.1
  kind: p
  original: 1. "Eigentum im bürgerlichen Sinn bedeutet heiliges Eigentum, derart, daß Ich Dein Eigentum respektieren muß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.45.2
  kind: p
  original: '''Respekt vor dem Eigentum!'''
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.45.3
  kind: p
  original: Daher möchten die Politiker, daß Jeder sein Stückchen Eigentum besäße, und haben durch dies Bestreben zum Teil eine unglaubliche Parzellierung herbeigeführt." p. 327, 328.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.45.4
  kind: p
  original: '- 2. "Die politischen Liberalen tragen Sorge, daß womöglich alle Servituten abgelöst werden und Jeder freier Herr auf seinem Grunde sei, wenn dieser Grund auch nur soviel Bodengehalt hat" (der Grund hat Bodengehalt!), "als von dem Dünger Eines Menschen sich hinlänglich düngen läßt...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.45.5
  kind: p
  original: Sei es auch noch so klein, wenn man nur Eigenes, nämlich ein respektiertes Eigentum hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.45.6
  kind: p
  original: Je mehr solcher Eigner, desto mehr freie Leute und gute Patrioten hat der Staat." p. 328.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.45.7
  kind: p
  original: '- 3. "Es rechnet der politische Liberalismus, wie alles Religiöse, auf den Respekt, die Humanität, die Liebestugenden.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.45.8
  kind: p
  original: Darum lebt er auch in unaufhörlichem Ärger.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.45.9
  kind: p
  original: Denn in der Praxis respektieren die Leute Nichts, und alle Tage werden die kleinen Besitzungen wieder von größeren Eigentümern aufgekauft, und aus den 'freien Leuten' werden Tagelöhner.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.45.10
  kind: p
  original: Hätten dagegen die 'kleinen Eigentümer' bedacht, daß auch das große Eigentum das Ihrige sei, so hätten sie sich nicht selber respektvoll davon ausgeschlossen und würden nicht ausgeschlossen worden sein." p. 328.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 334-335
- id: NT5B.46.1
  kind: p
  original: 1. Zuerst wird hier also die ganze Bewegung der Parzellierung, von der Sankt Sancho nur weiß, daß sie das Heilige ist, aus einer bloßen Einbildung erklärt, die " die Politiker" "sich in den Kopf gesetzt haben".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '335'
- id: NT5B.46.2
  kind: p
  original: Weil " die Politiker" "Respekt vor dem Eigentum" verlangen, daher "möchten" sie die Parzellierung, die noch dazu überall durch das Nichtrespektieren des fremden Eigentums durchgesetzt worden ist!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '335'
- id: NT5B.46.3
  kind: p
  original: '" Die Politiker" haben "zum Teil eine unglaubliche Parzellierung" wirklich "herbeigeführt".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '335'
- id: NT5B.46.4
  kind: p
  original: Es war also die Tat der "Politiker", daß in Frankreich schon vor der Revolution, wie noch heutzutage in Irland und teilweise in Wales, die Parzellierung in Beziehung auf die Kultur des Bodens längst bestand und zur Einführung der großen Kultur die Kapitalien und alle übrigen Bedingungen mangelten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '335'
- id: NT5B.46.5
  kind: p
  original: Wie sehr übrigens "die Politiker" die Parzellierung heutzutage durchführen "möchten", kann Sankt Sancho daraus ersehen, daß sämtliche französische Bourgeois mit der Parzellierung, sowohl weil sie die Konkurrenz der Arbeiter unter sich verringert, wie aus politischen Gründen, unzufrieden sind; ferner daraus, daß sämtliche Reaktionäre (was Sancho schon aus des alten Arndt "Erinnerungen" ersehen konnte) in der Parzellierung weiter nichts sahen als die Verwandlung des Grundeigentums in modernes, industrielles, verschacherbares, entheiligtes Eigentum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '335'
- id: NT5B.46.6
  kind: p
  original: Aus welchen ökonomischen Gründen die Bourgeois diese Verwandlung durchführen müssen, sobald sie zur Herrschaft kommen - eine Verwandlung, die ebensogut durch die Aufhebung der über den Profit überschießenden Grundrente wie durch die Parzellierung geschehen kann -, das ist unsrem Heiligen hier nicht weiter auseinanderzusetzen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '335'
- id: NT5B.46.7
  kind: p
  original: Ebensowenig ist ihm auseinanderzusetzen, wie die Form, in der diese Verwandlung geschieht, von der Stufe abhängt, worauf die Industrie, der Handel, die Schiffahrt pp. eines Landes stehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '335'
- id: NT5B.46.8
  kind: p
  original: Die obigen Sätze über Parzellierung sind weiter nichts als eine bombastische Umschreibung des einfachen Faktums, daß an verschiedenen Orten, "hie und da", eine große Parzellierung existiert - ausgedrückt in der kanonisierenden Redeweise unsres Sancho, die auf Alles und Nichts paßt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '335'
- id: NT5B.46.9
  kind: p
  original: Im übrigen enthalten Sanchos obige Sätze nur die Phantasien des deutschen Kleinbürgers über die Parzellierung, die für ihn allerdings das Fremde, "das Heilige" ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '335'
- id: NT5B.46.10
  kind: p
  original: Vgl. polit[ischen] Liberalismus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '335'
- id: NT5B.47.1
  kind: p
  original: 2. Die Ablösung der Servituten, eine Misère, die nur in Deutschland vorkommt, wo die Regierungen nur durch den fortgeschrittenen Zustand der Nachbarländer und durch Finanzverlegenheiten dazu gezwungen wurden, gilt hier unserm Heiligen für Etwas, das " die politischen Liberalen" wollen, um "freie Leute und gute Bürger" zu erzeugen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 335-336
- id: NT5B.47.2
  kind: p
  original: Sanchos Horizont reicht wieder nicht über den pommerschen Landtag und die sächsische Abgeordnetenkammer hinaus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '336'
- id: NT5B.47.3
  kind: p
  original: Diese deutsche Servituten-Ablösung hat nie zu irgendeinem politischen oder ökonomischen Resultat geführt und blieb als halbe Maßregel überhaupt ohne alle Wirkung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '336'
- id: NT5B.47.4
  kind: p
  original: Von der historisch wichtigen Ablösung der Servituten im vierzehnten und fünfzehnten Jahrhundert, die aus der beginnenden Entwicklung des Handels, der Industrie und dem Geldbedürfnis der Grundbesitzer hervorging, weiß Sancho natürlich wieder Nichts.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '336'
- id: NT5B.47.5
  kind: p
  original: '- Dieselben Leute, die in Deutschland die Servituten ablösen wollten, um, wie Sancho glaubt, gute Bürger und freie Leute zu machen, wie z.B. Stein und Vincke, fanden nachher, daß, um "gute Bürger und freie Leute" zu erzeugen, die Servitute wieder hergestellt werden müßten, wie dies eben jetzt in Westfalen versucht wird.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '336'
- id: NT5B.47.6
  kind: p
  original: Woraus folgt, daß der "Respekt" wie die Furcht Gottes zu allen Dingen nütze ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '336'
- id: NT5B.48.1
  kind: p
  original: 3. Das "Aufkaufen" des kleinen Grundbesitzes durch die "großen Eigentümer" findet nach Sancho statt, weil der "Respekt vor dem Eigentum" in der Praxis nicht stattfindet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '336'
- id: NT5B.48.2
  kind: p
  original: Zwei der alltäglichsten Folgen der Konkurrenz, Konzentration und Akkaparement, überhaupt die Konkurrenz, die ohne Konzentration nicht existiert, erscheinen hier unsrem Sancho als Verletzungen des bürgerlichen, in der Konkurrenz sich bewegenden Eigentums.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '336'
- id: NT5B.48.3
  kind: p
  original: Das bürgerliche Eigentum wird dadurch schon verletzt, daß es existiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '336'
- id: NT5B.48.4
  kind: p
  original: Man darf nach Sancho Nichts kaufen, ohne das Eigentum anzugreifen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - NT5B.N1
  mew_page: '336'
- id: NT5B.48.5
  kind: p
  original: Wie tief Sankt Sancho die Konzentration des Grundbesitzes durchschaut hat, geht schon daraus hervor, daß er nur den augenscheinlichsten Akt der Konzentration, das bloße "Aufkaufen" darin sieht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '336'
- id: NT5B.48.6
  kind: p
  original: Inwiefern übrigens die kleinen Eigentümer dadurch aufhören, Eigentümer zu sein, daß sie Taglöhner werden, ist nach Sancho nicht abzusehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '336'
- id: NT5B.48.7
  kind: p
  original: Sancho entwickelt ja selbst auf der nächsten Seite (p. 329) höchst feierlich gegen Proudhon, daß sie "Eigentümer des ihnen verbleibenden Anteils am Nutzen des Ackers", nämlich des Arbeitslohns, bleiben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '336'
- id: NT5B.48.8
  kind: p
  original: '"Es will mitunter etwa in der Geschichte gefunden werden", daß abwechselnd der große Grundbesitz den kleinen und der kleine den großen verschlingt, zwei Erscheinungen, die sich für Sankt Sancho friedfertig in den zureichenden Grund auflösen, daß "in der Praxis die Leute Nichts respektieren".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '336'
- id: NT5B.48.9
  kind: p
  original: Dasselbe gilt von den übrigen vielfachen Gestalten des Grundeigentums.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '336'
- id: NT5B.48.10
  kind: p
  original: Und dann das weise "hätten die kleinen Eigentümer" usw.!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 336-337
- id: NT5B.48.11
  kind: p
  original: Im "Alten Testament" sahen wir, wie Sankt Sancho nach spekulativer Manier die Früheren die Erfahrungen der Späteren bedenken ließ; jetzt sehen wir, wie er sich nach Kannegießer-Manier darüber beklagt, daß die Früheren nicht nur die Gedanken der Späteren über sie, sondern auch seinen eignen Unsinn nicht bedachten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '337'
- id: NT5B.48.12
  kind: p
  original: Welche Schulmeister-" Jescheitheit "!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '337'
- id: NT5B.48.13
  kind: p
  original: Hätten die Terroristen bedacht, daß sie Napoleon auf den Thron bringen würden - hätten die englischen Barone von Runnymede und der Magna Charta bedacht, daß 1849 die Korngesetze abgeschafft werden würden - hätte Krösus bedacht, daß Rothschild ihn an Reichtum übertreffen würde - hätte Alexander der Große bedacht, daß Rotteck ihn beurteilen und sein Reich den Türken in die Hände fallen würde - hätte Themistokles bedacht, daß er die Perser im Interesse Ottos des Kindes schlagen würde - hätte Hegel bedacht, daß er auf eine so "kommune" Weise von Sankt Sancho exploitiert werden würde - hätte, hätte, hätte!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '337'
- id: NT5B.48.14
  kind: p
  original: Von welchen "kleinen Eigentümern" bildet sich Sankt Sancho denn ein zu sprechen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '337'
- id: NT5B.48.15
  kind: p
  original: Von den eigentumslosen Bauern, welche durch Zerschlagen des großen Grundbesitzes erst zu "kleinen Eigentümern" wurden, oder von denen, die heutzutage von der Konzentration ruiniert werden?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '337'
- id: NT5B.48.16
  kind: p
  original: In beiden Fällen sieht Sankt Sancho sich so ähnlich wie ein Ei dem andern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '337'
- id: NT5B.48.17
  kind: p
  original: Im ersten Falle schlossen sie sich ganz und gar nicht vom "großen Eigentum" aus, sondern nahmen es Jeder so weit in Besitz, als er von den Andern nicht ausgeschlossen wurde und Vermögen hatte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '337'
- id: NT5B.48.18
  kind: p
  original: Dies Vermögen war aber nicht das Stirnersche renommistische Vermögen, sondern ein durch ganz empirische Verhältnisse bedingtes, z.B. durch ihre und die ganze bisherige Entwicklung der bürgerlichen Gesellschaft, die Lokalität und ihren größeren oder geringeren Zusammenhang mit der Nachbarschaft, die Größe des in Besitz genommenen Grundstücks und die Zahl derer, die es sich aneigneten, die Verhältnisse der Industrie, des Verkehrs, die Kommunikationsmittel und Produktionsinstrumente ppp.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '337'
- id: NT5B.48.19
  kind: p
  original: Wie wenig sie sich ausschließend gegen das große Grundeigentum verhielten, geht schon daraus hervor, daß viele unter ihnen selbst große Grundbesitzer wurden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '337'
- id: NT5B.48.20
  kind: p
  original: Sancho macht sich selbst vor Deutschland lächerlich mit seiner Zumutung, diese Bauern hätten damals die Parzellierung, die noch gar nicht existierte und die damals die einzig revolutionäre Form für sie war, überspringen und mit einem Satze in seinen mit sich einigen Egoismus sich lancieren sollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '337'
- id: NT5B.48.21
  kind: p
  original: Von seinem Unsinn gar nicht zusprechen, war es ihnen nicht möglich, sich kommunistisch zu organisieren, da ihnen alle Mittel abgingen, die erste Bedingung einer kommunistischen Assoziation, die gemeinsame Bewirtschaftung, durchzuführen, und da die Parzellierung vielmehr nur Eine der Bedingungen war, welche das Bedürfnis für eine solche Assoziation später hervorriefen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 337-338
- id: NT5B.48.22
  kind: p
  original: Überhaupt kann eine kommunistische Bewegung nie vom Lande, sondern immer nur von den Städten ausgehen
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: NT5B.49.1
  kind: p
  original: Im zweiten Falle, wenn Sankt Sancho von den ruinierten kleinen Eigentümern spricht - haben diese immer noch ein gemeinsames Interesse mit den großen Grundeigentümern gegenüber der ganz besitzlosen Klasse und gegenüber der industriellen Bourgeoisie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: NT5B.49.2
  kind: p
  original: Und falls dies gemeinsame Interesse nicht stattfindet, fehlt ihnen die Macht, sich das große Grundeigentum anzueignen, weil sie zerstreut wohnen und ihre ganze Tätigkeit und Lebenslage ihnen eine Vereinigung, die erste Bedingung einer solchen Aneignung, unmöglich macht und eine solche Bewegung wieder eine viel allgemeinere voraussetzt, die gar nicht von ihnen abhängt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: NT5B.49.3
  kind: p
  original: '- Schließlich kommt Sanchos ganze Tirade darauf hinaus, daß sie sich bloß den Respekt vor dem Eigentum Andrer aus dem Kopf schlagen sollen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: NT5B.49.4
  kind: p
  original: Hiervon werden wir weiter unten noch ein geringes Wörtlein vernehmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: NT5B.50.1
  kind: p
  original: 'Nehmen wir schließlich noch den Einen Satz ad acta <zu den Akten>: "in der Praxis respektieren die Leute eben Nichts "; so daß es doch am "Respekt" "eben" nicht zu liegen scheint.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: NT5B.51.1
  kind: p
  original: 'Abhandlung Nr. 2: Privateigentum, Staat und Recht.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: NT5B.52.1
  kind: p
  original: '"Hätte, hätte, hätte!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: NT5B.53.1
  kind: p
  original: '"Hätte" Sankt Sancho für einen Augenblick die kursierenden Gedanken der Juristen und Politiker über das Privateigentum, wie die Polemik dagegen, beiseite liegenlassen, hätte er dies Privateigentum einmal in seiner empirischen Existenz, in seinem Zusammenhange mit den Produktivkräften der Individuen gefaßt, so würde seine ganze Weisheit Salomonis, mit der er uns jetzt unterhalten wird, sich in Nichts aufgelöst haben.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: NT5B.53.2
  kind: p
  original: Es "hätte" ihm dann schwerlich entgehen können (obwohl er, wie Habakuk capable de tout <zu allem fähig> ist), daß das Privateigentum eine für gewisse Entwicklungsstufen der Produktivkräfte notwendige Verkehrsform ist, eine Verkehrsform, die nicht eher abgeschüttelt, nicht eher zur Produktion des unmittelbaren materiellen Lebens entbehrt werden kann, bis Produktivkräfte geschaffen sind, für die das Privateigentum eine hemmende Fessel wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: NT5B.53.3
  kind: p
  original: Es "hätte" dann auch dem Leser nicht entgehen können, daß Sancho sich auf materielle Verhältnisse einlassen mußte, statt die ganze Welt in ein System der theologischen Moral aufzulösen, um diesem ein neues System egoistisch sein sollender Moral entgegenzustellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: NT5B.53.4
  kind: p
  original: Es "hätte" ihm nicht entgehen können, daß es sich um ganz andre Dinge als den "Respekt" und Despekt handelte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: NT5B.53.5
  kind: p
  original: '"Hätte, hätte, hätte!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: NT5B.54.1
  kind: p
  original: Dies "hätte" ist übrigens nur ein Nachklang des obigen Sanchoschen Satzes; denn "hätte" Sancho dies Alles getan, so hätte er allerdings sein Buch nicht schreiben können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 338-339
- id: NT5B.55.1
  kind: p
  original: Indem Sankt Sancho die Illusion der Politiker, Juristen und sonstigen Ideologen, die alle empirischen Verhältnisse auf den Kopf stellt, auf Treu und Glauben akzeptiert und noch in deutscher Weise von dem Seinigen hinzutut, verwandelt sich ihm das Privateigentum in Staatseigentum, resp. Rechtseigentum, an dem er nun ein Experiment zur Rechtfertigung seiner obigen Gleichungen machen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: NT5B.55.2
  kind: p
  original: Sehen wir uns zuerst die Verwandlung des Privateigentums in Staatseigentum an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: NT5B.56.1
  kind: p
  original: '"Über das Eigentum entscheidet nur die Gewalt" (über die Gewalt entscheidet einstweilen vielmehr das Eigentum), "und da der Staat, gleichviel ob Staat der Bürger, Staat der Lumpe" (Stirnerscher "Verein") "oder Staat der Menschen schlechthin der allein Gewaltige ist, so ist er allein Eigentümer." p. 333.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: NT5B.57.1
  kind: p
  original: Neben der Tatsache des deutschen "Staats der Bürger" figurieren hier wieder Sanchosche und Bauersche Hirngespinste in gleicher Ordnung, während die historisch bedeutenden Staatsbildungen nirgends zu finden sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: NT5B.57.2
  kind: p
  original: Er verwandelt den Staat zunächst in eine Person, " den Gewaltigen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: NT5B.57.3
  kind: p
  original: Das Faktum, daß die herrschende Klasse ihre gemeinschaftliche Herrschaft zur öffentlichen Gewalt, zum Staat konstituiert, versteht und verdreht er in deutsch-kleinbürgerlicher Weise dahin, daß "der Staat" sich als eine dritte Macht gegen diese herrschende Klasse konstituiert und alle Gewalt ihr gegenüber in sich absorbiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: NT5B.57.4
  kind: p
  original: Er wird jetzt seinen Glauben an einer Reihe von Exempeln bewähren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: NT5B.58.1
  kind: p
  original: Wenn das Eigentum unter der Herrschaft der Bourgeoisie wie zu allen Zeiten an gewisse, zunächst ökonomische, von der Entwicklungsstufe der Produktivkräfte und des Verkehrs abhängige Bedingungen geknüpft ist, Bedingungen, die notwendig einen juristischen und politischen Ausdruck erhalten - so glaubt Sankt Sancho in seiner Einfalt,
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: NT5B.59.1
  kind: p
  original: '"der Staat knüpfe den Besitz des Eigentums" (car tel est son bon plaisir <denn so beliebt es ihm>) "an Bedingungen, wie er Alles daran knüpft, z.B. die Ehe". p. 335.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: NT5B.60.1
  kind: p
  original: Weil die Bourgeois dem Staat nicht erlauben, sich in ihre Privatinteressen einzumischen, und ihm nur soviel Macht geben, als zu ihrer eignen Sicherheit und der Aufrechthaltung der Konkurrenz nötig ist, weil die Bourgeois überhaupt nur insofern als Staatsbürger auftreten, als ihre Privatverhältnisse gebieten, glaubt Jacques le bonhomme, daß sie vor dem Staate "Nichts sind".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: NT5B.61.1
  kind: p
  original: '"Der Staat hat nur ein Interesse daran, selbst reich zu sein; ob Michel reich und Peter arm ist, gilt ihm gleich - - sie sind Beide vor ihm Nichts." p. 334.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: NT5B.62.1
  kind: p
  original: Dieselbe Weisheit schöpft er p. 345 aus der Duldung der Konkurrenz im Staat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: NT5B.63.1
  kind: p
  original: Wenn eine Eisenbahndirektion sich bloß um die Aktionäre zu kümmern hat, insofern sie ihre Einzahlungen leisten und ihre Dividenden empfangen, so schließt der Berliner Schulmeister in seiner Unschuld, daß die Aktionäre "vor ihr Nichts sind, wie wir vor Gott allzumal Sünder sind".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: NT5B.63.2
  kind: p
  original: Aus der Ohnmacht des Staats dem Treiben der Privateigentümer gegenüber beweist Sancho die Ohnmacht der Privateigentümer gegenüber dem Staat und seine eigne Ohnmacht gegenüber Beiden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: NT5B.64.1
  kind: p
  original: Ferner.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: NT5B.64.2
  kind: p
  original: 'Weil die Bourgeois die Verteidigung ihres Eigentums im Staat organisiert haben und "Ich" daher "jenem Fabrikanten" seine Fabrik nicht abnehmen kann, außer innerhalb der Bedingungen der Bourgeoisie, d.h. der Konkurrenz - glaubt Jacques le bonhomme:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: NT5B.65.1
  kind: p
  original: '"Der Staat hat die Fabrik als Eigentum, der Fabrikant nur als Lehen, als Besitztum." p.347.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: NT5B.66.1
  kind: p
  original: Ebenso "hat" der Hund, der mein Haus bewacht, das Haus "als Eigentum", und Ich habe es nur "als Lehen, als Besitztum" vom Hunde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: NT5B.67.1
  kind: p
  original: Weil die verdeckten materiellen Bedingungen des Privateigentums häufig in Widerspruch treten müssen mit der juristischen Illusion über das Privateigentum, wie sich z.B. bei Expropriationen zeigt, so schließt Jacques le bonhomme daraus, daß
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: NT5B.68.1
  kind: p
  original: '"hier das sonst verdeckte Prinzip, daß nur der Staat Eigentümer sei, der Einzelne hingegen Lehnsträger, deutlich in die Augen springt". p. 335.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: NT5B.69.1
  kind: p
  original: Es "springt hier nur in die Augen", daß unserm wackern Bürger die profanen Eigentumsverhältnisse hinter der Decke "des Heiligen" aus den Augen gesprungen sind und daß er sich noch immer aus China eine "Himmelsleiter" borgen muß, um eine "Sprosse der Kultur" zu "erklimmen", auf der in zivilisierten Ländern sogar die Schulmeister stehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: NT5B.69.2
  kind: p
  original: Wie hier Sancho die zur Existenz des Privateigentums gehörigen Widersprüche zur Negation des Privateigentums macht, so verfuhr er, wie wir oben sahen, mit den Widersprüchen innerhalb der bürgerlichen Familie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: NT5B.70.1
  kind: p
  original: Wenn die Bourgeois, überhaupt alle Mitglieder der bürgerlichen Gesellschaft, genötigt sind, sich als Wir, als moralische Person, als Staat zu konstituieren, um ihre gemeinschaftlichen Interessen zu sichern, und ihre dadurch hervorgebrachte Kollektivgewalt schon um der Teilung der Arbeit willen an Wenige delegieren, so bildet sich Jacques le bonhomme ein, daß
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: NT5B.71.1
  kind: p
  original: '"Jeder nur so lange den Nießbrauch des Eigentums hat, als er das Ich des Staats in sich trägt oder ein loyales Glied der Gesellschaft ist...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
- id: NT5B.71.2
  kind: p
  original: Wer ein Staats-Ich, d.h. ein guter Bürger oder Untertan ist, der trägt als solches Ich, nicht als eignes, das Lehen ungestört." p. 334. 335.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
- id: NT5B.72.1
  kind: p
  original: Auf diese Weise hat Jeder nur so lange den Besitz einer Eisenbahnaktie, als er "das Ich" der Direktion "in sich trägt", wonach man also nur als Heiliger eine Eisenbahnaktie besitzen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
- id: NT5B.73.1
  kind: p
  original: 'Nachdem Sankt Sancho auf diese Weise die Identität des Privat- und Staatseigentums sich weisgemacht hat, kann er fortfahren:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
- id: NT5B.74.1
  kind: p
  original: '"Daß der Staat nicht willkürlich dem Einzelnen entzieht, was er vom Staate hat, ist nur dasselbe wie dies, daß der Staat sich selbst nicht beraubt." p. 334, 335.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
- id: NT5B.75.1
  kind: p
  original: Daß Sankt Sancho nicht willkürlich Anderen ihr Eigentum raubt, ist nur dasselbe wie dies, daß Sankt Sancho sich selbst nicht beraubt, da er ja alles Eigentum als das seinige "ansieht".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
- id: NT5B.76.1
  kind: p
  original: Auf Sankt Sanchos übrige Phantasien über Staat und Eigentum, z.B. daß der Staat die Einzelnen durch Eigentum "kirrt" und "belohnt", daß er aus besonderer Malice die hohe Sporteltaxe erfunden habe, um die Bürger zu ruinieren, wenn sie nicht loyal seien etc. etc., überhaupt auf die kleinbürgerlich-deutsche Vorstellung von der Allmacht des Staats, eine Vorstellung, die bereits bei den alten deutschen Juristen durchläuft und hier in hochtrabenden Beteuerungen sich aufspreizt, kann man uns nicht zumuten, weiter einzugehn.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
- id: NT5B.77.1
  kind: p
  original: Seine hinreichend nachgewiesene Identität von Staats- und Privateigentum sucht er schließlich noch durch etymologische Synonymik darzutun, wobei er seiner Gelehrsamkeit indes en ambas posaderas schlägt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
- id: NT5B.78.1
  kind: p
  original: '"Mein Privateigentum ist nur Dasjenige, was der Staat Mir von dem Seinigen überläßt, indem er andere Staatsglieder darum verkürzt (priviert): es ist Staatseigentum." p. 339.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
- id: NT5B.79.1
  kind: p
  original: Zufällig verhält sich die Sache gerade umgekehrt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
- id: NT5B.79.2
  kind: p
  original: Das Privateigentum in Rom, worauf sich der etymologische Witz allein beziehen kann, stand im direktesten Gegensatz zum Staatseigentum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
- id: NT5B.79.3
  kind: p
  original: Der Staat gab allerdings den Plebejern Privateigentum, verkürzte dagegen nicht "Andre" um ihr Privateigentum, sondern diese Plebejer selbst um ihr Staatseigentum (ager publicus <Land, das sich in öffentlichem Besitz befand>) und ihre politischen Rechte, und deshalb hießen sie selbst privati, Beraubte, nicht aber jene phantastischen "andern Staatsglieder", von denen Sankt Sancho träumt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
- id: NT5B.79.4
  kind: p
  original: Jacques le bonhomme blamiert sich in allen Ländern, allen Sprachen und allen Epochen, sobald er auf positive Fakta zu sprechen kommt, von denen "das Heilige" keine aprioristische Kenntnis haben kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 341-342
- id: NT5B.80.1
  kind: p
  original: Die Verzweiflung darüber, daß der Staat alles Eigentum absorbiert, treibt ihn in sein innerstes "empörtes" Selbstbewußtsein zurück, wo er durch die Entdeckung überrascht wird, daß er Literat ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: NT5B.80.2
  kind: p
  original: 'Er drückt diese Verwunderung in folgenden merkwürdigen Worten aus:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: NT5B.81.1
  kind: p
  original: '"Im Gegensatz zum Staat fühle Ich immer deutlicher, daß Mir noch eine große Gewalt übrig bleibt, die Gewalt über Mich selbst";'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: NT5B.82.1
  kind: p
  original: 'was weiter dahin ausgeführt wird:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: NT5B.83.1
  kind: p
  original: '"An Meinen Gedanken habe Ich ein wirkliches Eigentum, womit Ich Handel treiben kann." p. 339.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: NT5B.84.1
  kind: p
  original: Der "Lump" Stirner, der "Mensch von nur ideellem Reichtum", kommt also auf den verzweifelten Entschluß, mit der geronnenen, sauer gewordenen Milch seiner Gedanken Handel zu treiben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: NT5B.84.2
  kind: p
  original: Und wie schlau fängt er es an, wenn der Staat seine Gedanken für Contrebande erklärt?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: NT5B.84.3
  kind: p
  original: 'Horcht:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: NT5B.85.1
  kind: p
  original: '"Ich gebe sie auf" (allerdings sehr weise) "und tausche Andere für sie ein" (d.h. falls Jemand ein so schlechter Geschäftsmann sein sollte, seine Gedankenwechsel anzunehmen), "die dann Mein neues, erkauftes Eigentum sind." p. 339.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: NT5B.86.1
  kind: p
  original: Der ehrliche Bürger beruhigt sich nicht eher, als bis er es schwarz auf weiß besitzt, daß er sein Eigentum redlich erkauft hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: NT5B.86.2
  kind: p
  original: 'Siehe da den Trost des Berliner Bürgers in allen seinen Staatsnöten und Polizeitrübsalen: "Gedanken sind zollfrei!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: NT5B.87.1
  kind: p
  original: Die Verwandlung des Privateigentums in Staatseigentum reduziert sich schließlich auf die Vorstellung, daß der Bourgeois nur besitzt als Exemplar der Bourgeoisgattung, die in ihrer Zusammenfassung Staat heißt und den Einzelnen mit Eigentum belehnt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: NT5B.87.2
  kind: p
  original: Hier steht die Sache wieder auf dem Kopf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: NT5B.87.3
  kind: p
  original: In der Bourgeoisklasse, wie in jeder anderen Klasse, sind nur die persönlichen Bedingungen zu gemeinschaftlichen und allgemeinen entwickelt, unter denen die einzelnen Mitglieder der Klasse besitzen und leben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: NT5B.87.4
  kind: p
  original: Wenn auch früher dergleichen philosophische Illusionen in Deutschland kursieren konnten, so sind sie doch jetzt vollständig lächerlich geworden, seitdem der Welthandel hinlänglich bewiesen hat, daß der bürgerliche Erwerb ganz unabhängig von der Politik, die Politik dagegen gänzlich abhängig vom bürgerlichen Erwerb ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: NT5B.87.5
  kind: p
  original: Schon im achtzehnten Jahrhundert war die Politik so sehr vom Handel abhängig, daß z.B., als der französische Staat eine Anleihe machen wollte, ein Privatmann für den Staat den Holländern gutsagen mußte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: NT5B.88.1
  kind: p
  original: Daß die "Wertlosigkeit Meiner" oder "der Pauperismus" die "Verwertung" oder das "Bestehen" des "Staats" ist (p. 336), ist eine der 1001 Stirnerschen Gleichungen, die wir hier bloß deshalb erwähnen, weil wir bei dieser Gelegenheit einige Neuigkeiten über den Pauperismus hören.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: NT5B.89.1
  kind: p
  original: '"Der Pauperismus ist die Wertlosigkeit Meiner, die Erscheinung, daß ich Mich nicht verwerten kann.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: NT5B.89.2
  kind: p
  original: Deshalb ist Staat und Pauperismus Ein und Dasselbe...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: NT5B.89.3
  kind: p
  original: Der Staat geht allezeit darauf aus, von Mir Nutzen zu ziehen, d.h. Mich zu exploitieren, auszubeuten, zu verbrauchen, bestände dieser Verbrauch auch nur darin, daß Ich für eine Proles <Nachkommenschaft> sorge (Proletariat).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: NT5B.89.4
  kind: p
  original: Er will, ich soll seine Kreatur sein." p. 336.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: NT5B.90.1
  kind: p
  original: Abgesehen davon, daß sich hier zeigt, wie wenig es von ihm abhängt, sich zu verwerten. obgleich er seine Eigenheit überall und immer durchsetzen kann, daß hier abermals Wesen und Erscheinung im Gegensatz zu den früheren Behauptungen ganz voneinander getrennt werden, kommt die obige kleinbürgerliche Ansicht unsres Bonhomme wieder zutage, daß "der Staat" ihn exploitieren will.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: NT5B.90.2
  kind: p
  original: Uns interessiert nur noch die altrömische etymologische Abstammung des Proletariats, die hier naiverweise in den modernen Staat eingeschmuggelt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: NT5B.90.3
  kind: p
  original: Sollte Sankt Sancho wirklich nicht Wissen, daß überall wo der moderne Staat sich entwickelt hat, das "Sorgen für eine Proles" dem Staat d.h. den offiziellen Bourgeois, gerade die unangenehmste Tätigkeit des Proletariats ist?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: NT5B.90.4
  kind: p
  original: Sollte er nicht etwa zu seinem eignen Besten auch Malthus und den Minister Duchâtel ins Deutsche übersetzen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: NT5B.90.5
  kind: p
  original: Sankt Sancho "fühlte" vorhin "immer deutlicher", als deutscher Kleinbürger, daß ihm "im Gegensatz zum Staat noch eine große Macht blieb", nämlich dem Staat zum Trotz sich Gedanken zu machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: NT5B.90.6
  kind: p
  original: Wäre er ein englischer Proletarier, so würde er gefühlt haben, daß ihm "die Macht blieb", dem Staat zum Trotz Kinder zu machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: NT5B.91.1
  kind: p
  original: Weitere Jeremiade gegen den Staat!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: NT5B.91.2
  kind: p
  original: Weitere Theorie des Pauperismus!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: NT5B.91.3
  kind: p
  original: Er "schafft" zunächst als "Ich" "Mehl, Leinwand oder Eisen und Kohlen", womit er die Teilung der Arbeit von vornherein aufhebt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: NT5B.91.4
  kind: p
  original: Dann fängt er an, "lange" zu "klagen", daß seine Arbeit nicht nach ihrem Wert bezahlt wird, und gerät zunächst in Konflikt mit den Bezahlenden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: NT5B.91.5
  kind: p
  original: Der Staat tritt dann "beschwichtigend" dazwischen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: NT5B.92.1
  kind: p
  original: '"Lasse Ich Mir nicht genügen an dem Preise, den er" (nämlich der Staat) "für eine Ware und Arbeit festsetzt, trachte Ich vielmehr, den Preis Meiner Ware selbst bestimmen, d.h. Mich bezahlt zu machen, so gerate Ich zunächst" (großes "Zunächst" - nicht mit dem Staat, sondern) "mit den Abnehmern der Ware in Konflikt." p. 337.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: NT5B.93.1
  kind: p
  original: Will er nun in ein "direktes Verhältnis" mit diesen Abnehmern treten, d.h. "sie bei den Köpfen fassen", so "interveniert" der Staat, "reißt den Menschen vom Menschen" (obgleich es sich nicht vom "Menschen", sondern vom Arbeiter und Arbeitgeber oder, was er durcheinanderwirft, vom Verkäufer und Käufer der Ware handelte), und zwar tut der Staat dies in der böswilligen Absicht, "um sich als Geist" (jedenfalls heiliger Geist)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: NT5B.94.1
  kind: p
  original: '"in die Mitte zu stellen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: NT5B.94.2
  kind: p
  original: Die Arbeiter, welche höheren Lohn verlangen, werden als Verbrecher behandelt, sobald sie ihn erzwingen wollen." p. 337.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: NT5B.95.1
  kind: p
  original: Hier haben wir wieder einmal eine Blütenlese des Unsinns.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: NT5B.95.2
  kind: p
  original: Herr Senior hätte seine Briefe über den Arbeitslohn sparen können, wenn er sich vorher in ein "direktes Verhältnis" zu Stirner gesetzt hätte; besonders da in diesem Falle der Staat wohl nicht "den Menschen vom Menschen gerissen" haben würde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: NT5B.95.3
  kind: p
  original: Sancho läßt hier den Staat dreimal auftreten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: NT5B.95.4
  kind: p
  original: Zuerst "beschwichtigend", dann preisbestimmend, zuletzt als "Geist", als das Heilige.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: NT5B.95.5
  kind: p
  original: Daß Sankt Sancho nach der glorreichen Identifikation des Privat- und Staatseigentums den Staat auch den Arbeitslohn bestimmen läßt, zeugt von gleich großer Konsequenz und Unbekanntschaft mit den Dingen dieser Welt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: NT5B.95.6
  kind: p
  original: Daß "die Arbeiter, welche höheren Lohn erzwingen wollen", in England, Amerika und Belgien keineswegs sogleich als "Verbrecher" behandelt werden, sondern im Gegenteil oft genug diesen Lohn wirklich erzwingen, ist ebenfalls ein unsrem Heiligen unbekanntes Faktum und zieht durch seine Legende vom Arbeitslohn einen großen Strich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: NT5B.95.7
  kind: p
  original: Daß die Arbeiter, selbst wenn der Staat nicht "in die Mitte träte", wenn sie ihre Arbeitgeber "bei den Köpfen fassen", damit noch gar nichts gewinnen, noch viel weniger als durch Assoziationen und Arbeitseinstellungen, solange sie nämlich Arbeiter und ihre Gegner Kapitalisten bleiben - das ist ebenfalls ein Faktum, das selbst in Berlin einzusehen wäre.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: NT5B.95.8
  kind: p
  original: Daß die bürgerliche Gesellschaft, die auf der Konkurrenz beruht, und ihr Bourgeoisstaat ihrer ganzen materiellen Grundlage nach keinen andern als einen Konkurrenzkampf unter den Bürgern zulassen können und nicht als "Geist", sondern mit Bajonetten dazwischentreten müssen, wenn die Leute sich "an den Köpfen fassen", braucht ebenfalls nicht auseinandergesetzt zu werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: NT5B.96.1
  kind: p
  original: Übrigens stellt Stirners Einfall, daß nur der Staat reicher werde, wenn die Individuen auf der Basis des bürgerlichen Eigentums reicher werden, oder daß bisher alles Privateigentum Staatseigentum gewesen sei, das historische Verhältnis wieder auf den Kopf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: NT5B.96.2
  kind: p
  original: Mit der Entwicklung und Akkumulation des bürgerlichen Eigentums, d.h. mit der Entwicklung des Handels und der Industrie wurden die Individuen immer reicher, während der Staat immer verschuldeter ward.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: NT5B.96.3
  kind: p
  original: Dies Faktum trat schon hervor in den ersten italienischen Handelsrepubliken, zeigte sich später in seiner Spitze in Holland seit dem vorigen Jahrhundert, wo der Fondsspekulant Pinto schon 1750 darauf aufmerksam machte, und findet jetzt wieder statt in England.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 344-345
- id: NT5B.96.4
  kind: p
  original: Es zeigt sich daher auch, daß, sobald die Bourgeoisie Geld gesammelt hat, der Staat bei ihr betteln gehen muß und endlich von ihr geradezu an sich gekauft wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: NT5B.96.5
  kind: p
  original: Dies findet in einer Periode statt, in welcher die Bourgeoisie noch eine andre Klasse sich gegenüberstehen hat, wo also der Staat zwischen Beiden den Schein einer gewissen Selbständigkeit behalten kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: NT5B.96.6
  kind: p
  original: Der Staat bleibt selbst nach diesem Ankauf immer noch geldbedürftig und dadurch von den Bourgeois abhängig, kann aber dennoch, wenn es das Interesse der Bourgeois erfordert, immer über mehr Mittel verfügen als andre, weniger entwickelte und daher weniger verschuldete Staaten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: NT5B.96.7
  kind: p
  original: Aber selbst die unentwickeltsten Staaten Europas, die der Heiligen Allianz, gehen diesem Schicksal unaufhaltsam entgegen und werden von den Bourgeois angesteigert werden; wo sie sich dann von Stirner mit der Identität von Privateigentum und Staatseigentum vertrösten lassen können, namentlich sein eigner Souverän, der vergebens die Stunde des Verschacherns der Staatsmacht an die "böse" gewordnen "Bürger hinzuhalten strebt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: NT5B.97.1
  kind: p
  original: Wir kommen jetzt zu dem Verhältnis von Privateigentum und Recht, wo wir dieselben Siebensachen in anderer Form wieder hören.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: NT5B.97.2
  kind: p
  original: Die Identität von Staats- und Privateigentum erhält eine scheinbar neue Wendung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: NT5B.97.3
  kind: p
  original: Die politische Anerkennung des Privateigentums im Recht wird als Basis des Privateigentums ausgesprochen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: NT5B.98.1
  kind: p
  original: '"Das Privateigentum lebt von der Gnade des Rechts.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: NT5B.98.2
  kind: p
  original: Nur im Rechte hat es seine Gewähr - Besitz ist ja noch nicht Eigentum, es wird erst das Meinige durch Zustimmung des Rechts -; es ist keine Tatsache, sondern eine Fiktion, ein Gedanke.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: NT5B.98.3
  kind: p
  original: Das ist das Rechtseigentum, rechtliches Eigentum, garantiertes Eigentum; nicht durch Mich Ist es Mein, sondern durchs - Recht." p. 332.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: NT5B.99.1
  kind: p
  original: Dieser Satz treibt nur den schon dagewesenen Unsinn vom Staatseigentum auf eine noch komischere Höhe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: NT5B.99.2
  kind: p
  original: 'Wir gehen daher gleich auf Sanchos Exploitation des fiktiven jus utendi et abutendi <das Recht, das Seinige zu gebrauchen und zu verbrauchen (auch: zu mißbrauchen)> über.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: NT5B.100.1
  kind: p
  original: p. 332 erfahren wir außer der obigen schönen Sentenz, daß das Eigentum
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: NT5B.101.1
  kind: p
  original: '"die unumschränkte Gewalt über etwas ist, womit Ich schalten und walten kann nach Gutdünken".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: NT5B.101.2
  kind: p
  original: '"Die Gewalt ist aber "nicht ein für sich Existierendes, sondern lediglich im gewaltigen Ich, in Mir, dem Gewaltigen". p. 366.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: NT5B.101.3
  kind: p
  original: Das Eigentum ist daher kein "Ding", "nicht dieser Baum, sondern Meine Gewalt, Verfügung über ihn ist die Meinige". p. 366.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 345-346
- id: NT5B.101.4
  kind: p
  original: Er kennt bloß "Dinge" oder "Iche".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.101.5
  kind: p
  original: Die "vom Ich getrennte", gegen es verselbständigte, in ein "Gespenst" verwandelte "Gewalt ist das Recht".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.101.6
  kind: p
  original: '"Diese verewigte Gewalt" (Abhandlung über das Erbrecht) "erlischt selbst mit Meinem Tode nicht, sondern wird übertragen oder vererbt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.101.7
  kind: p
  original: Die Dinge gehören nun wirklich nicht Mir, sondern dem Rechte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.101.8
  kind: p
  original: Andererseits ist dies weiter Nichts als eine Verblendung, denn die Gewalt des Einzelnen wird allein dadurch permanent und ein Recht, daß Andre ihre Gewalt mit der seinigen verbinden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.101.9
  kind: p
  original: Der Wahn besteht darin, daß sie ihre Gewalt nicht wieder zurückziehen zu können glauben." p. 366, 367.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.101.10
  kind: p
  original: '"Ein Hund sieht den Knochen in eines andern Gewalt und steht nur ab, wenn er sich zu schwach fühlt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.101.11
  kind: p
  original: Der Mensch aber respektiert das Recht des Andern an seinen Knochen...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.101.12
  kind: p
  original: Und wie hier, so heißt überhaupt dies 'menschlich', wenn man in Allem etwas Geistiges sieht, hier das Recht, d.h. Alles zu einem Gespenste macht und sich dazu als zu einem Gespenste verhält...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.101.13
  kind: p
  original: Menschlich ist es, das Einzelne nicht als Einzelnes, sondern als ein Allgemeines anzuschauen." p. 368, 369.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.102.1
  kind: p
  original: Das ganze Unheil entspringt also wieder aus dem Glauben der Individuen an den Rechtsbegriff, den sie sich aus dem Kopfe schlagen sollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.102.2
  kind: p
  original: Sankt Sancho kennt nur "Dinge" und "Iche", und von Allem, was nicht unter diese Rubriken paßt, von allen Verhältnissen kennt er nur die abstrakten Begriffe, die sich ihm daher auch in "Gespenster" verwandeln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.102.3
  kind: p
  original: '"Andererseits" dämmert ihm freilich zuweilen, daß dies Alles "weiter Nichts ist als eine Verblendung" und daß "die Gewalt des Einzelnen" sehr davon abhängig ist, ob Andre ihre Gewalt mit der seinigen verbinden.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.102.4
  kind: p
  original: Aber in letzter Instanz läuft Alles doch auf "den Wahn" heraus, daß die Einzelnen "ihre Gewalt nicht wieder zurückziehen zu können glauben ".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.102.5
  kind: p
  original: Die Eisenbahn gehört wieder "wirklich" nicht den Aktionären, sondern den Statuten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.102.6
  kind: p
  original: Sancho gibt gleich ein schlagendes Exempel am Erbrecht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.102.7
  kind: p
  original: Er erklärt es nicht aus der Notwendigkeit der Akkumulation und der vor dem Recht existierenden Familie, sondern aus der juristischen Fiktion von der Verlängerung der Gewalt. über den Tod hinaus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.102.8
  kind: p
  original: Diese juristische Fiktion selbst wird von allen Gesetzgebungen immer mehr aufgegeben, je mehr die feudale Gesellschaft in die bürgerliche übergeht. (Vergleiche z.B. den Code Napoleon.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.102.9
  kind: p
  original: Daß die absolute väterliche Gewalt und das Majorat, sowohl das naturwüchsige Lehnsmajorat wie das spätere, auf sehr bestimmten materiellen Verhältnissen beruhten, braucht hier nicht auseinandergesetzt zu werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.102.10
  kind: p
  original: Dasselbe findet bei den antiken Völkern statt in der Epoche der Auflösung des Gemeinwesens durch das Privatleben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.102.11
  kind: p
  original: (Bester Beweis die Geschichte des römischen Erbrechts.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.102.12
  kind: p
  original: Sancho konnte überhaupt kein unglücklicheres Beispiel wählen als das Erbrecht, das am allerdeutlichsten die Abhängigkeit des Rechts von den Produktionsverhältnissen zeigt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.102.13
  kind: p
  original: Vergleich zum Beispiel römisches und germanisches Erbrecht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: NT5B.102.14
  kind: p
  original: Ein Hund hat freilich noch nie aus einem Knochen Phosphor, Knochenmehl oder Kalk gemacht, ebensowenig wie er sich je über sein "Recht" an einen Knochen "etwas in den Kopf gesetzt hat"; Sankt Sancho hat sich ebenfalls nie "in den Kopf gesetzt", darüber nachzudenken, ob nicht das Recht, das die Menschen auf einen Knochen sich vindizieren und die Hunde nicht, mit der Art zusammenhängt, wie die Menschen diesen Knochen produktiv behandeln und die Hunde nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 346-347
- id: NT5B.102.15
  kind: p
  original: Überhaupt haben wir hier an einem Beispiel die ganze Manier der Sanchoschen Kritik und seinen unerschütterlichen Glauben an kurante Illusionen vor uns.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: NT5B.102.16
  kind: p
  original: Die bisherigen Produktionsverhältnisse der Individuen müssen sich ebenfalls als politische und rechtliche Verhältnisse ausdrücken. (Sieh oben.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: NT5B.102.17
  kind: p
  original: Innerhalb der Teilung der Arbeit müssen diese Verhältnisse gegenüber den Individuen sich verselbständigen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: NT5B.102.18
  kind: p
  original: Alle Verhältnisse können in der Sprache nur als Begriffe ausgedrückt werden Daß diese Allgemeinheiten und Begriffe als mysteriöse Mächte gelten, ist eine notwendige Folge der Verselbständigung der realen Verhältnisse, deren Ausdruck sie sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: NT5B.102.19
  kind: p
  original: Außer dieser Geltung im gewöhnlichen Bewußtsein erhalten diese Allgemeinheiten noch eine besondere Geltung und Ausbildung von den Politikern und Juristen, die durch die Teilung der Arbeit auf den Kultus dieser Begriffe angewiesen sind und in ihnen, nicht in den Produktionsverhältnissen, die wahre Grundlage aller realen Eigentumsverhältnisse sehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: NT5B.102.20
  kind: p
  original: Diese Illusion adoptiert Sankt Sancho unbesehens, hat es damit fertiggebracht, das rechtliche Eigentum für die Basis des Privateigentums und den Rechtsbegriff für die Basis des rechtlichen Eigentums zu erklären, und kann nun seine ganze Kritik darauf beschränken, den Rechtsbegriff für einen Begriff, ein Gespenst zu erklären.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: NT5B.102.21
  kind: p
  original: Womit Sankt Sancho fertig ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: NT5B.102.22
  kind: p
  original: 'Zu seiner Beruhigung kann ihm noch gesagt werden, daß das Verfahren der Hunde, wenn ihrer zwei einen Knochen finden, in allen ursprünglichen Gesetzbüchern als Recht anerkannt wird: vim vi repellere licere <Gewalt kann mit Gewalt abgewehrt werden>, sagen die Pandekten; idque jus natura comparatur <und dieses Recht ist von der Natur gesetzt>, worunter verstanden wird jus quod natura omnia animalia - Menschen und Hunden - docuit <ein Recht, das die Natur alle Lebewesen gelehrt hat>; daß aber später die organisierte Repulsion der Gewalt durch die Gewalt "eben" das Recht ist.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: NT5B.103.1
  kind: p
  original: Sankt Sancho, der nun im Zuge ist, dokumentiert seine rechtsgeschichtliche Gelehrsamkeit dadurch, daß er Proudhon seinen "Knochen" streitig macht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: NT5B.103.2
  kind: p
  original: Proudhon, sagt er,
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: NT5B.104.1
  kind: p
  original: '"schwindelt uns vor, die Sozietät sei die ursprüngliche Besitzerin und die einzige Eigentümerin von unverjährbarem Rechte; an ihr sei der sogenannte Eigentümer zum Diebe geworden; wenn sie nun dem dermaligen Eigentümer sein Eigentum entziehe, so raube sie ihm Nichts, da sie nur ihr unverjährbares Recht geltend mache.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 347-348
- id: NT5B.104.2
  kind: p
  original: So weit kommt man mit dem Spuk der Sozietät als einer moralischen Person." p. 330, 331.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.105.1
  kind: p
  original: Dagegen will Stirner uns "vorschwindeln", p. 340, 367, 420 und anderwärts, wir, nämlich die Besitzlosen, hätten den Eigentümern ihr Eigentum geschenkt, aus Unkunde, Feigheit oder auch Gutmütigkeit usw., und fordert uns auf, unser Geschenk zurückzunehmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.105.2
  kind: p
  original: Zwischen den beiden "Schwindeleien" ist der Unterschied, daß Proudhon sich auf ein historisches Faktum stützt, während Sankt Sancho sich nur etwas "in den Kopf gesetzt" hat, um der Sache eine "neue Wendung" zu geben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.105.3
  kind: p
  original: Die neueren rechtsgeschichtlichen Forschungen haben nämlich herausgestellt, daß sowohl in Rom wie bei den germanischen, keltischen und slawischen Völkern die Eigentumsentwicklung vom Gemeindeeigentum oder Stammeigentum ausging und das eigentliche Privateigentum überall durch Usurpation entstand, was Sankt Sancho freilich nicht aus der tiefen Einsicht herausklauben konnte, daß der Rechtsbegriff ein Begriff ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.105.4
  kind: p
  original: Den juristischen Dogmatikern gegenüber war Proudhon vollständig berechtigt, dies Faktum geltend zu machen und überhaupt sie mit ihren eignen Voraussetzungen zu bekämpfen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.105.5
  kind: p
  original: '"So weit kommt man mit dem Spuk" des Rechtsbegriffs als eines Begriffs.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.105.6
  kind: p
  original: Proudhon könnte nur dann wegen seines obigen Satzes angegriffen werden, wenn er dem über dies ursprüngliche Gemeinwesen hinausgegangenen Privateigentum gegenüber die frühere und rohere Form verteidigt hätte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.105.7
  kind: p
  original: 'Sancho resümiert seine Kritik Proudhons in der stolzen Frage:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.106.1
  kind: p
  original: '"Warum so sentimental, als ein armer Beraubter, das Mitleid anrufen?" p. 420.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.107.1
  kind: p
  original: Die Sentimentalität, die übrigens bei Proudhon nirgends zu finden ist, ist nur der Maritornes gegenüber erlaubt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.107.2
  kind: p
  original: Sancho bildet sich wirklich ein, ein "ganzer Kerl" zu sein gegenüber einem Gespenstergläubigen wie Proudhon.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.107.3
  kind: p
  original: Er hält seinen aufgedunsenen Kanzleistil, dessen sich Friedrich Wilhelm IV. zu schämen hätte, für revolutionär.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.107.4
  kind: p
  original: '"Der Glaube macht selig!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.108.1
  kind: p
  original: 'p. 340 erfahren wir:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.109.1
  kind: p
  original: '"Alle Versuche, über das Eigentum vernünftige Gesetze zu geben, liefen vom Busen der Liebe in ein wüstes Meer von Bestimmungen aus."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.110.1
  kind: p
  original: 'Hierzu paßt der gleich abenteuerliche Satz:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.111.1
  kind: p
  original: '"Der bisherige Verkehr beruhte auf der Liebe, dem rücksichtsvollen Benehmen, dem Füreinander-Tun," p. 385.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.112.1
  kind: p
  original: Sankt Sancho überrascht sich hier selbst mit einem frappanten Paradoxon über das Recht und den Verkehr.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: NT5B.112.2
  kind: p
  original: Wenn wir uns indes erinnern, daß er unter "der Liebe" die Liebe zu " dem Menschen", überhaupt einem An-und-für-sich-Seienden, Allgemeinen, das Verhältnis zu einem Individuum oder Ding als zum Wesen, zu dem Heiligen versteht, so fällt dieser glänzende Schein zusammen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 348-349
- id: NT5B.112.3
  kind: p
  original: Die obigen Orakelsprüche lösen sich dann in die alten, durch das ganze "Buch" uns ennuyierenden Trivialitäten auf, daß zwei Dinge, von denen Sancho Nichts weiß, nämlich hier das bisherige Recht und der bisherige Verkehr - "das Heilige" sind, und daß überhaupt bisher nur "Begriffe die Welt beherrscht" haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: NT5B.112.4
  kind: p
  original: Das Verhältnis zum Heiligen, sonst "Respekt" genannt, kann auch gelegentlich "Liebe" tituliert werden. (Siehe Logik".)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: NT5B.113.1
  kind: p
  original: Nur ein Beispiel, wie Sankt Sancho die Gesetzgebung in ein Liebesverhältnis und den Handel in einen Liebeshandel verwandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: NT5B.114.1
  kind: p
  original: '"In einer Registrationsbill für Irland stellte die Regierung den Antrag, Wähler diejenigen sein zu lassen, welche fünf Pfund Sterling Armensteuer entrichten.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: NT5B.114.2
  kind: p
  original: Also wer Almosen gibt, der erwirbt politische Rechte oder wird anderwärts Schwanenritter." p.344.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: NT5B.115.1
  kind: p
  original: Zuerst ist hier zu bemerken, daß diese "Registrationsbill", die "politische Rechte" verleiht, eine Munizipal- oder Korporationsbill war, oder, um für Sancho verständlich zu sprechen, eine "Städteordnung", die keine "politischen Rechte", sondern städtische Rechte, Wahlrecht für Lokalbeamte, verleihen sollte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: NT5B.115.2
  kind: p
  original: Zweitens sollte Sancho, der den MacCulloch übersetzt, doch wohl wissen, was das heißt, "to be assessed to the poor-rates at five pounds".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: NT5B.115.3
  kind: p
  original: Es heißt nicht "fünf Pfund Armensteuer zahlen", sondern in den Armensteuerrollen als Bewohner eines Hauses eingetragen sein, dessen jährliche Miete fünf Pfund beträgt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: NT5B.115.4
  kind: p
  original: Der Berliner Bonhomme weiß nicht, daß die Armensteuer in England und Irland eine lokale Steuer ist, die in jeder Stadt und in jedem Jahre verschieden ist, so daß es eine reine Unmöglichkeit wäre, irgendein Recht an einen bestimmten Steuerbetrag knüpfen zu wollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: NT5B.115.5
  kind: p
  original: Endlich glaubt Sancho, daß die englische und irische Armensteuer ein "Almosen" sei, während sie nur die Geldmittel zu einem offenen und direkten Angriffskrieg der herrschenden Bourgeoisie gegen das Proletariat aufbringt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: NT5B.115.6
  kind: p
  original: Sie deckt die Kosten der Arbeitshäuser, die bekanntlich ein Malthusianisches Abschreckungsmittel gegen den Pauperismus sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: NT5B.115.7
  kind: p
  original: Man sieht, wie Sancho "vom Busen der Liebe in ein wüstes Meer von Bestimmungen ausläuft".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: NT5B.116.1
  kind: p
  original: Beiläufig bemerkt, mußte die deutsche Philosophie, weil sie nur vom Bewußtsein ausging, in Moralphilosophie verenden, wo dann die verschiedenen Heroen einen Hader um die wahre Moral führen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: NT5B.116.2
  kind: p
  original: Feuerbach liebt den Menschen um des Menschen willen, Sankt Bruno liebt ihn, weil er es "verdient" (Wig[and,] p. 137), und Sankt Sancho liebt "Jeden", weil es ihm gefällt, mit dem Bewußtsein des Egoismus ("das Buch", p. 387).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: NT5B.117.1
  kind: p
  original: Wir haben schon oben, in der ersten Abhandlung, gehört, wie die kleinen Grundeigentümer sich respektvoll vom großen Grundeigentum ausschlossen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: NT5B.117.2
  kind: p
  original: Dies Sich-Ausschließen vom fremden Eigentum aus Respekt wird überhaupt als Charakter des bürgerlichen Eigentums dargestellt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: NT5B.117.3
  kind: p
  original: Aus diesem Charakter weiß Stirner sich zu erklären, warum
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: NT5B.118.1
  kind: p
  original: '"innerhalb des Bürgertums trotz seines Sinnes, daß Jeder Eigentümer sei, die Meisten soviel wie Nichts haben". p. 348.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: NT5B.118.2
  kind: p
  original: Dies "kommt daher, weil die Meisten sich schon darüber freuen, nur überhaupt Inhaber, sei es auch von einigen Lappen, zu sein p. 349.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: NT5B.119.1
  kind: p
  original: Daß "die Meisten" nur "einige Lappen" besitzen, erklärt sich Szeliga ganz natürlich aus ihrer Freude an den Lappen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: NT5B.120.1
  kind: p
  original: 'p. 343: "Ich wäre bloß Besitzer?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: NT5B.120.2
  kind: p
  original: Nein, bisher war man nur Besitzer, gesichert im Besitze einer Parzelle, dadurch, daß man Andere auch im Besitze einer Parzelle ließ; jetzt aber gehört Alles Mir.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: NT5B.120.3
  kind: p
  original: Ich bin Eigentümer von Allem, dessen Ich brauche und habhaft werden kann."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: NT5B.121.1
  kind: p
  original: Wie Sancho vorhin die kleinen Grundbesitzer sich respektvoll vom großen Grundeigentum ausschließen ließ, jetzt die kleinen Grundbesitzer sich voneinander, so konnte er weiter ins Detail gehen, die Ausschließung des kommerziellen Eigentums vom Grundeigentum, des Fabrikeigentums vom eigentlich kommerziellen usw. durch den Respekt bewerkstelligen lassen und es so zu einer ganz neuen Ökonomie auf der Basis des Heiligen bringen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: NT5B.121.2
  kind: p
  original: Er hat sich dann nur den Respekt aus dem Kopf zu schlagen, um die Teilung der Arbeit und die daraus hervorgehende Gestaltung des Eigentums mit Einem Schlage aufzuheben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: NT5B.121.3
  kind: p
  original: Zu dieser neuen Ökonomie gibt Sancho p. 128 "des Buchs" einen Beleg, wo er die Nadel nicht vom shopkeeper <Krämer>, sondern vom Respekt kauft, und nicht mit Geld von dem shopkeeper, sondern mit Respekt von der Nadel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: NT5B.121.4
  kind: p
  original: Übrigens ist die von Sancho angefeindete dogmatische Selbstausschließung eines Jeden vom fremden Eigentum eine rein juristische Illusion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: NT5B.121.5
  kind: p
  original: In der heutigen Produktions- und Verkehrsweise schlägt Jeder ihr ins Gesicht und trachtet gerade danach, alle Andern von ihrem einstweiligen Eigentum auszuschließen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: NT5B.121.6
  kind: p
  original: 'Wie es mit Sanchos "Eigentum an Allem" aussieht, geht schon aus dem ergänzenden Nachsatz hervor: "dessen Ich brauche und habhaft werden kann ".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: NT5B.121.7
  kind: p
  original: 'Er erörtert dies selbst näher p. 353: "Sage Ich: Mir gehört die Welt, so ist das eigentlich auch leeres Gerede, das nur insofern Sinn hat, als Ich kein fremdes Eigentum respektiere."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: NT5B.121.8
  kind: p
  original: Also insofern der Nichtrespekt vor dem fremden Eigentum sein Eigentum ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: NT5B.122.1
  kind: p
  original: Was Sancho an seinem geliebten Privateigentum kränkt, ist eben die Ausschließlichkeit, ohne die es Unsinn wäre, das Faktum, daß es außer ihm noch andre Privateigentümer gibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 350-351
- id: NT5B.122.2
  kind: p
  original: Fremdes Privateigentum ist nämlich heiliges.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.122.3
  kind: p
  original: Wir werden sehen, wie er in seinem "Vereine" diesem Übelstand abhilft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.122.4
  kind: p
  original: Wir werden nämlich finden, daß sein egoistisches Eigentum, das Eigentum im außergewöhnlichen Verstande, weiter nichts ist als das durch seine heiligende Phantasie verklärte, gewöhnliche oder bürgerliche Eigentum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.123.1
  kind: p
  original: 'Schließen wir mit dem Spruch Salomonis:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.124.1
  kind: p
  original: '"Gelangen die Menschen dahin, daß sie den Respekt vor dem Eigentum verlieren, so wird Jeder Eigentum haben... dann [werden Vereine auch in dieser Sache die Mittel des Einzelnen multiplizieren und sein angefochtenes Eigentum sicherstellen." p. 342] <Hier fehlen im Manuskript 4 Seiten>'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.125.1
  kind: p
  original: '[Abhandlung 3: Über die Konkurrenz im gewöhnlichen und außergewöhnlichen Verstande.]'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.126.1
  kind: p
  original: 'Schreiber dieses begab sich eines Morgens im gebührlichen Kostüm zum Herrn Minister Eichhorn:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.127.1
  kind: p
  original: '"Weil es mit dem Fabrikanten nicht geht" (der Herr Finanzminister hatte ihm nämlich weder Raum noch Geld zur Errichtung einer eigenen Fabrik gegeben, noch der Herr Justizminister ihm erlaubt, dem Fabrikanten die Fabrik zu nehmen - siehe oben bürgerliches Eigentum), "so will Ich mit jenem Professor der Rechte konkurrieren; der Mann ist ein Gimpel, und Ich, der Ich hundertmal mehr weiß als er, werde sein Auditorium leer machen."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.127.2
  kind: p
  original: '- "Hast Du studiert und promoviert, Freund?"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.127.3
  kind: p
  original: '- "Nein, aber was tut das?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.127.4
  kind: p
  original: Ich verstehe, was zu dem Lehrfache nötig ist, reichlich."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.127.5
  kind: p
  original: '- "Tut mir leid, aber die Konkurrenz ist hier nicht frei.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.127.6
  kind: p
  original: Gegen Deine Person ist nichts zu sagen, aber die Sache fehlt, das Doktordiplom.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.127.7
  kind: p
  original: Und dies verlange Ich, der Staat."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.127.8
  kind: p
  original: '- "Dies also ist die Freiheit der Konkurrenz", seufzte Schreiber dieses, "der Staat, Mein Herr, befähigt mich erst zum Konkurrieren."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.127.9
  kind: p
  original: Worauf er niedergeschlagen in seine Behausung zurückkehrte. p. 347.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.128.1
  kind: p
  original: In entwickelten Ländern wäre es ihm nicht vorgekommen, den Staat um die Erlaubnis fragen zu müssen, ob er mit einem Professor der Rechte konkurrieren dürfe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.128.2
  kind: p
  original: Wenn er sich aber an den Staat als einen Arbeitgeber wendet und Besoldung, d.h. Arbeitslohn verlangt, also sich selbst in das Konkurrenzverhältnis stellt, so ist allerdings nach seinen schon dagewesenen Abhandlungen über Privateigentum und privati <Beraubte>, Gemeinde-Eigentum, Proletariat, lettres patentes <verbriefte Rechte>, Staat und status usw. nicht zu vermuten, daß er "glücklich werben" wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.128.3
  kind: p
  original: Der Staat kann ihn nach seinen bisherigen Leistungen höchstens als Küster (custos) "des Heiligen" auf einer hinterpommerschen Domäne anstellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: NT5B.129.1
  kind: p
  original: Zur Erheiterung können wir hier "episodisch die große Entdeckung Sanchos "einlegen", daß zwischen "Armen" und "Reichen" kein "anderer Unterschied" existiert - "als der der Vermögenden und Unvermögenden ". p.354.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: NT5B.130.1
  kind: p
  original: 'Stürzen wir uns jetzt wieder in das "wüste Meer" der Stirnerschen "Bestimmungen" über die Konkurrenz:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: NT5B.131.1
  kind: p
  original: '"Mit der Konkurrenz ist weniger " (o "Weniger"!) "die Absicht verbunden, die Sache am besten zu machen, als die andre, sie möglichst einträglich, ergiebig zu machen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: NT5B.131.2
  kind: p
  original: Man studiert daher auf ein Amt los (Brotstudium), studiert Katzenbuckel und Schmeicheleien, Routine und Geschäftskenntnis, man arbeitet auf den Schein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: NT5B.131.3
  kind: p
  original: Während es daher scheinbar um eine gute Leistung zu tun ist, wird in Wahrheit nur auf ein gutes Geschäft und Geldverdienst gesehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: NT5B.131.4
  kind: p
  original: Man möchte zwar nicht gerne Zensor sein, aber man will befördert sein... man fürchtet Versetzung oder gar Absetzung." p. 354, 355.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: NT5B.132.1
  kind: p
  original: Unser Bonhomme möge ein ökonomisches Handbuch aufspüren. worin selbst die Theoretiker behaupten, es sei in der Konkurrenz um "eine gute Leistung" oder darum zu tun, "die Sache am besten zu machen", und nicht, "sie möglichst einträglich zu machen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: NT5B.132.2
  kind: p
  original: Er kann übrigens in jedem derartigen Buche finden, daß innerhalb des Privateigentums die ausgebildetste Konkurrenz, wie z.B. in England, die "Sache" allerdings "am besten macht".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: NT5B.132.3
  kind: p
  original: Der kleine kommerzielle und industrielle Betrug wuchert nur unter bornierten Konkurrenzverhältnissen, unter den Chinesen, Deutschen und Juden, überhaupt unter den Hausierern und Kleinkrämern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: NT5B.132.4
  kind: p
  original: Aber selbst den Hausierhandel erwähnt unser Heiliger nicht; er kennt nur die Konkurrenz der Supernumerarien und Referendarien, er beweist sich hier als vollständigen k[öniglich] preuß[ischen] Subalternbeamten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: NT5B.132.5
  kind: p
  original: Er hätte ebensogut die Bewerbung der Hofleute aller Zeiten um die Gunst ihres Fürsten als Beispiel der Konkurrenz anführen können, aber das lag seinem kleinbürgerlichen Gesichtskreis viel zu fern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: NT5B.133.1
  kind: p
  original: Nach diesen gewaltigen Abenteuern mit den Supernumerarien, Salarien-Kassen-Rendanten und Registratoren besteht Sankt Sancho das große Abenteuer mit dem famosen Roß Clavileno, davon der Prophet Cervantes zuvor geredet hat im Neuen Testament am Einundvierzigsten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: NT5B.133.2
  kind: p
  original: Sancho setzt sich nämlich aufs hohe ökonomische Pferd und bestimmt das Minimum des Arbeitslohnes vermittelst "des Heiligen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: NT5B.133.3
  kind: p
  original: Allerdings zeigt er hier wieder einmal seine angeborne Furchtsamkeit und weigert sich anfangs, das fliegende Roß zu besteigen, das ihn in die Region trägt, "wo der Hagel, der Schnee, der Donner, Blitz und Wetterstrahl erzeugt werden", weit über die Wolken hinaus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: NT5B.133.4
  kind: p
  original: Aber "der Herzog", das ist "der Staat", ermuntert ihn, und nachdem der kühnere und erfahrnere Szeliga-Don Quijote sich einmal in den Sattel geschwungen hat, klettert unser wackerer Sancho ihm nach auf die Kruppe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 352-353
- id: NT5B.133.5
  kind: p
  original: 'Und als die Hand Szeligas die Schraube am Kopfe des Pferdes gedreht hatte, erhob es sich hoch in die Lüfte, und alle Damen, vornehmlich Maritornes, riefen ihnen nach: "Der mit sich einige Egoismus geleite Dich, tapferer Ritter, und noch tapfrerer Schildknapp, und möge es Euch gelingen, uns von dem Spuk des Malambruno <Gestalt aus "Don Quijote" von Cervantes>, ''des Heiligen'', zu befreien.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: NT5B.133.6
  kind: p
  original: Halte Dich nur in der Balance, tapferer Sancho, damit Du nicht fallest und es Dir nicht ergehe wie Phaeton, da er den Sonnenwagen lenken wollte!"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: NT5B.134.1
  kind: p
  original: '"Nehmen wir an" (er schwankt schon hypothetisch), "daß, wie die Ordnung zum Wesen des Staats gehört, so auch die Unterordnung in seiner Natur " (angenehme Modulation zwischen "Wesen" und "Natur" - den "Ziegen", die Sancho auf seinem Fluge beobachtet) "gegründet ist, so sehen wir, daß von den Untergeordneten" (soll wohl heißen übergeordneten) "oder Bevorzugten die Zurückgesetzten unverhältnismäßig überteuert und übervorteilt werden." p. 357.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: NT5B.135.1
  kind: p
  original: '"Nehmen wir an... so sehen wir."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: NT5B.135.2
  kind: p
  original: 'Soll heißen: so nehmen wir an.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: NT5B.135.3
  kind: p
  original: Nehmen wir an, daß "Übergeordnete" und "Untergeordnete" im Staat existieren, so "nehmen wir" ebenfalls "an", daß erstere vor den letzteren "bevorzugt" werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: NT5B.135.4
  kind: p
  original: Doch die stilistische Schönheit dieses Satzes sowie die plötzliche Anerkennung des "Wesens" und der "Natur" eines Dings schieben wir auf die Furchtsamkeit und Verwirrung unsres ängstlich balancierenden Sancho während seiner Luftfahrt sowie auf die unter seiner Nase abgebrannten Raketen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: NT5B.135.5
  kind: p
  original: Wir bewundern selbst nicht, daß Sankt Sancho sich die Folgen der Konkurrenz nicht aus der Konkurrenz, sondern aus der Bürokratie erklärt und den Staat hier wiederum den Arbeitslohn bestimmen läßt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - NT5B.N2
  mew_page: '353'
- id: NT5B.136.1
  kind: p
  original: Er bedenkt nicht, daß die fortwährenden Schwankungen des Arbeitslohns seiner ganzen schönen Theorie ins Gesicht schlagen und ein näheres Eingehen auf industrielle Verhältnisse ihm allerdings Exempel zeigen würde, wo ein Fabrikant von seinen Arbeitern nach allgemeinen Konkurrenzgesetzen 'übervorteilt" und "überteuert" würde, wenn nicht diese juristischen und moralischen Ausdrücke innerhalb der Konkurrenz allen Sinn verloren hätten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: NT5B.137.1
  kind: p
  original: Wie einfältiglich und kleinbürgerlich sich in dem einzigen Schädel Sanchos die weltumfassendsten Verhältnisse abspiegeln, wie sehr er als Schulmeister daran gebunden ist, aus allen diesen Verhältnissen sich moralische Nutzanwendungen zu abstrahieren und sie mit moralischen Postulaten zu widerlegen, das zeigt wieder deutlich die Zwerggestalt, zu der für ihn die Konkurrenz zusammenschrumpft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: NT5B.137.2
  kind: p
  original: Wir müssen diese kostbare Stelle in extenso <ausführlich> mitteilen, "auf daß Nichts verlorengehe".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: NT5B.138.1
  kind: p
  original: '"Was noch einmal die Konkurrenz betrifft, so hat sie gerade dadurch Bestand, daß nicht Alle sich ihrer Sache annehmen und sich über sie miteinander verständigen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: NT5B.138.2
  kind: p
  original: Brot ist z.B. das Bedürfnis aller Einwohner einer Stadt, deshalb könnten sie leicht übereinkommen, eine öffentliche Bäckerei einzurichten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: NT5B.138.3
  kind: p
  original: Statt dessen überlassen sie die Lieferung des Bedarfs den konkurrierenden Bäckern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: NT5B.138.4
  kind: p
  original: Ebenso Fleisch den Fleischern, Wein den Weinhändlern usw....
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: NT5B.138.5
  kind: p
  original: Wenn Ich Mich nicht um Meine Sache bekümmere, so muß Ich mit dem vorliebnehmen, was anderen Mir zu gewähren beliebt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: NT5B.138.6
  kind: p
  original: Brot zu haben ist Meine Sache, Mein Wunsch und Begehren, und doch überläßt man es den Bäckern und hofft höchstens, durch ihren Hader, ihr Rangablaufen, ihren Wetteifer, kurz, ihre Konkurrenz, einen Vorteil zu erlangen, auf welchen man bei den Zünftigen, die gänzlich und allein im Eigentum der Backgerechtigkeit saßen, nicht rechnen konnte. p. 365.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: NT5B.139.1
  kind: p
  original: Charakteristisch für unsern Kleinbürger ist es, daß er hier eine Anstalt wie die öffentliche Bäckerei, die unter dem Zunftwesen vielfach existierte und durch die wohlfeilere Produktionsweise der Konkurrenz gestürzt wurde, eine lokale Anstalt, die sich nur unter beschränkten Verhältnissen halten konnte und mit dem Eintreten der Konkurrenz, welche die lokale Borniertheit aufhob, notwendig untergehen mußte - daß Sankt Sancho eine solche Anstalt der Konkurrenz gegenüber seinen Mitspießbürgern empfiehlt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: NT5B.139.2
  kind: p
  original: Er hat nicht einmal das aus der Konkurrenz gelernt, daß "der Bedarf", z.B. an Brot, jeden Tag ein anderer ist, daß es keineswegs von ihm abhängt, ob morgen noch das Brot "seine Sache" ist oder ob sein Bedürfnis den Andern noch für eine Sache gilt, und daß innerhalb der Konkurrenz der Brotpreis durch die Produktionskosten und nicht durch das Belieben der Bäcker bestimmt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: NT5B.139.3
  kind: p
  original: Er ignoriert sämtliche von der Konkurrenz erst geschaffenen Verhältnisse, Aufhebung der Lokalbeschränkung, Herstellung von Kommunikationen, ausgebildete Teilung der Arbeit, Weltverkehr, Proletariat, Maschinen pp., um einen wehmütigen Blick auf die mittelalterliche Spießbürgerei zurückzuwerfen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: NT5B.139.4
  kind: p
  original: Von der Konkurrenz weiß er soviel, daß sie "Hader, Rangablaufen und Wetteifer" ist; um ihren sonstigen Zusammenhang mit der Teilung der Arbeit, dem Verhältnis von Nachfrage und Zufuhr etc. kümmert er sich nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - NT5B.N3
  mew_page: 354-355
- id: NT5B.139.5
  kind: p
  original: Daß die Bourgeois sich allerdings überall, wo es ihr Interesse erheischte (und darüber wissen sie besser zu urteilen als Sankt Sancho), jedesmal "verständigten", soweit sie innerhalb der Konkurrenz und des Privateigentums dies konnten, zeigen die Aktiengesellschaften, die mit dem Aufkommen des Seehandels und der Manufaktur begannen und alle ihnen zugänglichen Zweige der Industrie und des Handels an sich rissen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '355'
- id: NT5B.139.6
  kind: p
  original: Solche "Verständigungen", die u.a. zur Eroberung eines Reiches in Ostindien führten, sind freilich kleinlich gegenüber der wohlmeinenden Phantasie einer öffentlichen Bäckerei, die in der "Vossischen Zeitung" besprochen zu werden verdiente.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '355'
- id: NT5B.139.7
  kind: p
  original: '- Was die Proletarier betrifft, so sind diese, wenigstens in ihrer modernen Gestalt, erst aus der Konkurrenz entstanden und haben bereits vielfach gemeinschaftliche Anstalten errichtet, die aber jedesmal untergingen, weil sie nicht mit den "hadernden" Privatbäckern, Fleischern pp. konkurrieren konnten und weil für die Proletarier wegen ihrer durch die Teilung der Arbeit selbst vielfach entgegengesetzten Interessen eine andere als politische, gegen den ganzen jetzigen Zustand gerichtete "Verständigung" unmöglich ist.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '355'
- id: NT5B.139.8
  kind: p
  original: Wo die Entwicklung der Konkurrenz die Proletarier befähigt, sich zu "verständigen", da "verständigen" sie sich über ganz andre Dinge als über öffentliche Bäckereien.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - NT5B.N4
  mew_page: '355'
- id: NT5B.139.9
  kind: p
  original: Der Mangel an "Verständigung", den Sancho hier unter den konkurrierenden Individuen bemerkt, entspricht und widerspricht vollständig seiner weiteren Ausführung über die Konkurrenz, die Wir im Kommentar, Wigand, p. 173, genießen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '355'
- id: NT5B.140.1
  kind: p
  original: '"Man führte die Konkurrenz ein, weil man ein Heil für Alle darin sah, man einigte sich über sie, man versuchte es gemeinschaftlich mit ihr... man stimmte in ihr etwa so überein, wie sämtliche Jäger bei einer Jagd für... ihre Zwecke es zuträglich finden können, sich im Walde zu zerstreuen und ''vereinzelt'' zu jagen...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 355-356
- id: NT5B.140.2
  kind: p
  original: Jetzt freilich stellt es sich heraus... daß bei der Konkurrenz nicht Jeder seinen Gewinn... findet."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: NT5B.141.1
  kind: p
  original: '"Es stellt sich hier heraus", daß Sancho von der Jagd geradesoviel weiß wie von der Konkurrenz.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: NT5B.141.2
  kind: p
  original: Er spricht nicht von einer Treibjagd, auch nicht von einer Hetzjagd, sondern von der Jagd im außergewöhnlichen Verstande.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: NT5B.141.3
  kind: p
  original: Es bleibt ihm nur noch übrig, nach den obigen Prinzipien eine neue Geschichte der Industrie und des Handels zu schreiben und einen "Verein" zu einer derartigen außergewöhnlichen Jagd zustande zu bringen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: NT5B.142.1
  kind: p
  original: Ganz in demselben stillen, gemütlichen und dorfzeitungsmäßigen Geleise spricht er sich über die Stellung der Konkurrenz zu den sittlichen Verhältnissen aus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: NT5B.143.1
  kind: p
  original: '"Was der Mensch als solcher"(!) "an körperlichen Gütern nicht behaupten kann, dürfen wir ihm nehmen: dies der Sinn der Konkurrenz, der Gewerbefreiheit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: NT5B.143.2
  kind: p
  original: Was er an geistigen Gütern nicht behaupten kann, verfällt uns gleichfalls.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: NT5B.143.3
  kind: p
  original: Aber unantastbar sind die geheiligten Güter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: NT5B.143.4
  kind: p
  original: Geheiligt und garantiert durch wen?...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: NT5B.143.5
  kind: p
  original: Durch den Menschen oder den Begriff, den Begriff der Sache."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: NT5B.143.6
  kind: p
  original: Als solche geheiligte Güter führt er an "das Leben", "Freiheit der Person", "Religion", "Ehre", "Anstands-, Schamgefühl" usw. p. 325.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: NT5B.144.1
  kind: p
  original: Alle diese "geheiligten Güter" "darf" Stirner in entwickelten Ländern zwar nicht "dem Menschen als solchen", aber doch den wirklichen Menschen nehmen, natürlich auf dem Wege und innerhalb der Bedingungen der Konkurrenz.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: NT5B.144.2
  kind: p
  original: Die große Umwälzung der Gesellschaft durch die Konkurrenz, die die Verhältnisse der Bourgeois untereinander und zu den Proletariern in reine Geldverhältnisse auflöste, sämtliche obengenannte "geheiligte Güter" in Handelsartikel verwandelte und für die Proletarier alle naturwüchsigen und überkommenen, z.B. Familien- und politische Verhältnisse nebst ihrem ganzen ideologischen Überbau zerstörte - diese gewaltige Revolution ging allerdings nicht von Deutschland aus; Deutschland spielte in ihr nur eine passive Rolle, es ließ sich seine geheiligten Güter nehmen und bekam nicht einmal den kuranten Preis dafür.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: NT5B.144.3
  kind: p
  original: Unser deutscher Kleinbürger kennt daher nur die heuchlerischen Beteuerungen der Bourgeois über die moralischen Grenzen der Konkurrenz der Bourgeois, die die "geheiligten Güter" der Proletarier, ihre "Ehre", "Schamgefühl", "Freiheit der Person" täglich mit Füßen treten und ihnen selbst den Religionsunterricht entziehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: NT5B.144.4
  kind: p
  original: Diese vorgeschützten "moralischen Grenzen" gelten ihm für den wahren "Sinn" der Konkurrenz, und ihre Wirklichkeit existiert nicht für ihren Sinn.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: NT5B.145.1
  kind: p
  original: 'Sancho resümiert die Resultate seiner Forschungen über die Konkurrenz in folgendem Satze:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: NT5B.146.1
  kind: p
  original: '"Ist eine Konkurrenz frei, die der Staat, dieser Herrscher im bürgerlichen Prinzip, in tausend Schranken einengt?" p. 347.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.147.1
  kind: p
  original: Das "bürgerliche Prinzip" Sanchos, "den Staat" überall zum "Herrscher" zu machen und die aus der Produktions- und Verkehrsweise hervorgehenden Schranken der Konkurrenz für Schranken zu halten, in die "der Staat" die Konkurrenz "einengt", spricht sich hier noch einmal mit gebührender "Empörung" aus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.148.1
  kind: p
  original: Sankt Sancho hat "in jüngster Zeit" "aus Frankreich" herüber (vgl. Wigand, p. 190) allerlei Neuigkeiten läuten gehört, und unter Andern über die Versachlichung der Personen in der Konkurrenz und über den Unterschied zwischen Konkurrenz und Wetteifer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.148.2
  kind: p
  original: Aber der "arme Berliner" hat "aus Dummheit die schönen Sachen verdorben".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.148.3
  kind: p
  original: (Wig[and] ibidem, wo sein böses Gewissen aus ihm redet.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.148.4
  kind: p
  original: '"So sagt er z.B." p. 346 "des Buchs":'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.149.1
  kind: p
  original: '"Ist die freie Konkurrenz denn wirklich frei?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.149.2
  kind: p
  original: Ja, ist sie wirklich eine Konkurrenz, nämlich der Personen, wofür sie sich ausgibt, weil sie auf diesen Titel ihr Recht gründet?"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.150.1
  kind: p
  original: Die Dame Konkurrenz gibt sich für etwas aus, weil sie (d.h. einige Juristen, Politiker und schwärmerische Kleinbürger, die letzten Nachzügler in ihrem Gefolge) auf diesen Titel ihr Recht gründet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.150.2
  kind: p
  original: Mit dieser Allegorie beginnt Sancho die "schönen Sachen" "aus Frankreich" für den Meridian von Berlin zurechtzustutzen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.150.3
  kind: p
  original: Wir übergehen die schon oben abgemachte absurde Vorstellung, daß "der Staat gegen Meine Person nichts einzuwenden hat" und mir so zu konkurrieren erlaubt, mir aber "die Sache" nicht gibt (p. 347), und gehen gleich auf seinen Beweis über, daß die Konkurrenz keine Konkurrenz der Personen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.151.1
  kind: p
  original: '"Konkurrieren aber wirklich die Personen?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.151.2
  kind: p
  original: Nein, wiederum nur die Sachen!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.151.3
  kind: p
  original: Die Gelder in erster Reihe, usw.; in dem Wetteifer wird immer Einer hinter dem Andern zurückbleiben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.151.4
  kind: p
  original: Allein es macht einen Unterschied, ob die fehlenden Mittel durch persönliche Kraft gewonnen werden können oder nur durch Gnade zu erhalten sind, nur als Geschenk, und zwar indem z.B. der Ärmere dem Reicheren seinen Reichtum lassen, d.h. schenken muß." p. 348.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.152.1
  kind: p
  original: Die Schenkungstheorie "schenken wir ihm" (Wig[and,] p. 190).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.152.2
  kind: p
  original: Er möge sich im ersten besten juristischen Handbuch, Kapitel "Vertrag", unterrichten, ob ein "Geschenk", das er "schenken muß", noch ein Geschenk ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.152.3
  kind: p
  original: In dieser Weise "schenkt" uns Stirner unsre Kritik seines Buchs, weil er sie uns "lassen, d h. schenken muß".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.153.1
  kind: p
  original: Die Tatsache, daß von zwei Konkurrenten, deren "Sachen" gleich sind, der eine den andern ruiniert, besteht für Sancho nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: NT5B.153.2
  kind: p
  original: Daß die Arbeiter untereinander konkurrieren, obgleich sie keine "Sachen" (im Stirnerschen Verstande) besitzen, existiert desgleichen nicht für ihn.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 357-358
- id: NT5B.153.3
  kind: p
  original: Indem er die Konkurrenz der Arbeiter untereinander aufhebt, erfüllt er einen der frommsten Wünsche unsrer "wahren Sozialisten", deren wärmster Dank ihm nicht entgehen wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: NT5B.153.4
  kind: p
  original: '"Nur die Sachen", nicht "die Personen" konkurrieren.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: NT5B.153.5
  kind: p
  original: Nur die Waffen kämpfen, nicht die Leute, die sie führen und zu führen gelernt haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: NT5B.153.6
  kind: p
  original: Diese sind bloß zum Totgeschossenwerden da.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: NT5B.153.7
  kind: p
  original: So spiegelt sich der Konkurrenzkampf in den Köpfen kleinbürgerlicher Schulmeister ab, die sich den modernen Börsenbaronen und Cotton-Lords gegenüber mit dem Bewußtsein trösten, daß ihnen nur "die Sache" fehle, um ihre "persönliche Kraft" gegen sie geltend zu machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: NT5B.153.8
  kind: p
  original: Noch komischer wird diese bornierte Vorstellung, wenn man auf die "Sachen" etwas näher eingeht, statt sich auf das Allergemeinste und Populärste, z.B. "das Geld" (das indes nicht so populär ist, wie es scheint), zu beschränken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: NT5B.153.9
  kind: p
  original: Unter diese "Sachen" gehört u.a., daß der Konkurrent in einem Lande und in einer Stadt lebt, wo er dieselben Vorteile hat wie seine von ihm vorgefundenen Konkurrenten; daß das Verhältnis von Stadt und Land eine fortgeschrittene Entwicklungsstufe erlangt hat; daß er in einer günstigen geographischen, geologischen und hydrographischen Lage konkurriert; daß er als Seidenfabrikant in Lyon, als Baumwollfabrikant in Manchester fabriziert oder in einer früheren Epoche als Reeder in Holland sein Geschäft betrieb; daß die Teilung der Arbeit in seinem wie in andern, von ihm keineswegs abhängigen Produktionszweigen eine hohe Ausbildung erlangt hat, daß die Kommunikationen ihm denselben wohlfeilen Transport sichern wie seinen Konkurrenten, daß er geschickte Arbeiter und ausgebildete Aufseher vorfindet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: NT5B.153.10
  kind: p
  original: Alle diese "Sachen", die zum Konkurrieren nötig sind, überhaupt die Konkurrenzfähigkeit auf dem Weltmarkte (den er nicht kennt und nicht kennen darf, um seiner Staatstheorie und öffentlichen Bäckerei willen, der aber leider die Konkurrenz und Konkurrenzfähigkeit bestimmt), kann er sich weder durch "persönliche Kraft" gewinnen noch durch "die Gnade" "des Staats" "schenken" "lassen" (vgl. p. 348).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: NT5B.153.11
  kind: p
  original: Der preußische Staat, der es versuchte, der Seehandlung alles dies zu "schenken", kann ihm darüber am besten Belehrung geben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: NT5B.153.12
  kind: p
  original: Sancho erweist sich hier als k[öniglich] preuß[ischer] Seehandlungsphilosoph, indem er die Illusion des preußischen Staats über seine Allmacht und die Illusion der Seehandlung über ihre Konkurrenzfähigkeit eines Breiteren glossiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: NT5B.153.13
  kind: p
  original: Übrigens hat die Konkurrenz allerdings als eine "Konkurrenz der Personen" mit "persönlichen Mitteln" angefangen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: NT5B.153.14
  kind: p
  original: Die Befreiung der Leibeigenen, die erste Bedingung der Konkurrenz, die erste Akkumulation von "Sachen", waren rein "persönliche" Akte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: NT5B.153.15
  kind: p
  original: 'Wenn Sancho also die Konkurrenz der Personen an die Stelle der Konkurrenz der Sachen setzen will, so heißt das: er will in den Anfang der Konkurrenz zurückgehen, und zwar mit der Einbildung, durch seinen guten Willen und sein außergewöhnlich-egoistisches Bewußtsein der Entwicklung der Konkurrenz eine andre Richtung geben zu können.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 358-359
- id: NT5B.154.1
  kind: p
  original: Dieser große Mann, dem Nichts heilig ist und der nach der "Natur der Sache" und dem "Begriff des Verhältnisses" Nichts fragt, muß dennoch zuletzt die "Natur" des Unterschiedes zwischen persönlich und sachlich und den "Begriff des Verhältnisses" dieser beiden Qualitäten für heilig erklären und damit darauf verzichten, sich als "Schöpfer" dazu zu verhalten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: NT5B.154.2
  kind: p
  original: Man kann diesen ihm heiligen Unterschied, wie er ihn im zitierten Passus macht, indes aufheben, ohne darum "die maßloseste Entheiligung" zu begehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: NT5B.154.3
  kind: p
  original: Zunächst hebt er ihn selbst auf, indem er durch persönliche Kraft sachliche Mittel erwerben läßt und so die persönliche Kraft in eine sachliche Macht verwandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: NT5B.154.4
  kind: p
  original: Er kann dann ruhig an die Andern das moralische Postulat stellen, sich persönlich zu ihm zu verhalten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: NT5B.154.5
  kind: p
  original: Geradeso hätten die Mexikaner von den Spaniern verlangen können, sie nicht mit Flinten zu erschießen, so sondern mit den Fäusten auf sie dreinzuschlagen oder mit Sankt Sancho "sie bei den Köpfen zu fassen", um sich "persönlich" bei ihnen zu verhalten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: NT5B.154.6
  kind: p
  original: '- Wenn der Eine durch gute Nahrung, sorgfältige Erziehung und körperliche Übung eine ausgebildete Körperkraft und Gewandtheit erlangt hat, während der Andre durch schmale und ungesunde Kost und davon geschwächte Verdauung, durch Vernachlässigung in der Kindheit und durch übermäßige Anstrengung nie Sachen" gewinnen konnte, um Muskel anzusetzen, geschweige eine Herrschaft über sie zu erhalten, so ist die "persönliche Kraft" des Einen dem Andern gegenüber eine rein sachliche.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: NT5B.154.7
  kind: p
  original: Er hat sich nicht "die fehlenden Mittel durch persönliche Kraft" gewonnen, sondern im Gegenteil, er verdankt seine "persönliche Kraft" den vorhandenen sachlichen Mitteln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: NT5B.154.8
  kind: p
  original: Übrigens ist die Verwandlung der persönlichen Mittel in sachliche und der sachlichen in persönliche nur eine Seite der Konkurrenz, die von ihr gar nicht zu trennen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: NT5B.154.9
  kind: p
  original: Die Forderung, daß man nicht mit sachlichen, sondern mit persönlichen Mitteln konkurrieren soll, kommt auf das moralische Postulat heraus, daß die Konkurrenz und die Verhältnisse, von denen sie bedingt ist, andre als ihre unvermeidlichen Wirkungen haben sollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: NT5B.155.1
  kind: p
  original: Abermalige und diesmal schließliche Zusammenfassung der Philosophie der Konkurrenz.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: NT5B.156.1
  kind: p
  original: '"Die Konkurrenz leidet an dem Übelstande, daß nicht Jedem die Mittel zum Konkurrieren zu Gebote stehen, weil sie nicht aus der Persönlichkeit entnommen sind, sondern aus der Zufälligkeit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: NT5B.156.2
  kind: p
  original: Die Meisten sind unbemittelt und deshalb" (o Deshalb!) "unbegütert". p. 349,
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: NT5B.157.1
  kind: p
  original: Es ist ihm schon oben bemerkt worden, daß in der Konkurrenz die Persönlichkeit selbst eine Zufälligkeit und die Zufälligkeit eine Persönlichkeit ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: NT5B.157.2
  kind: p
  original: Die von der Persönlichkeit unabhängigen "Mittel" zur Konkurrenz sind die Produktions- und Verkehrsbedingungen der Personen selbst, die innerhalb der Konkurrenz den Personen gegenüber als eine unabhängige Macht erscheinen, als den Personen zufällige Mittel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: NT5B.157.3
  kind: p
  original: Die Befreiung der Menschen von diesen Mächten wird nach Sancho dadurch bewerkstelligt, daß man sich die Vorstellungen von diesen Mächten oder vielmehr die philosophischen und religiösen Verdrehungen dieser Vorstellungen aus dem Kopfe schlägt, sei es durch etymologische Synonymik ("Vermögen" und "vermögen"), moralische Postulate (z.B. Jeder sei ein allmächtiges Ich) oder durch affenartige Grimassen und gemütlich-burleske Renommagen gegen "das Heilige".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: NT5B.158.1
  kind: p
  original: Schon früher hörten wir die Klage, daß in der jetzigen bürgerlichen Gesellschaft, namentlich des Staats wegen, das "Ich" sich nicht verwerten, id est seine "Vermögen" nicht wirken lassen könne.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: NT5B.158.2
  kind: p
  original: Jetzt erfahren wir noch, daß die "Eigenheit" ihm nicht die Mittel zum Konkurrieren gibt, daß "seine Macht" keine Macht ist und daß er "unbegütert" bleibt, wenn auch jeder Gegenstand, "weil sein Gegenstand, auch sein Eigentum ist".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - NT5B.N5
  mew_page: '360'
- id: NT5B.158.3
  kind: p
  original: Das Dementi des mit sich einigen Egoismus ist vollständig.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: NT5B.158.4
  kind: p
  original: Aber alle diese "Übelstände" der Konkurrenz werden schwinden, sobald "das Buch" in das allgemeine Bewußtsein übergegangen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: NT5B.158.5
  kind: p
  original: Bis dahin beharrt Sancho bei seinem Gedankenhandel, ohne es indes zu einer "guten Leistung" zu bringen oder "die Sache am besten zu machen."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: NT5B.159.1
  kind: heading
  original: II. Die Empörung
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: NT5B.160.1
  kind: p
  original: Mit der Kritik der Gesellschaft ist die Kritik der alten, heiligen Welt beschlossen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: NT5B.160.2
  kind: p
  original: Vermittelst der Empörung springen wir herüber in die neue egoistische Welt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: NT5B.161.1
  kind: p
  original: Was die Empörung überhaupt ist, haben wir bereits in der Logik gesehen; die Aufkündigung des Respekts gegen das Heilige.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: NT5B.161.2
  kind: p
  original: Hier indes nimmt sie außerdem noch einen besondern praktischen Charakter an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: NT5B.162.1
  kind: p
  original: Revolution = heilige Empörung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: NT5B.163.1
  kind: p
  original: Empörung = egoistische oder profane Revolution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: NT5B.164.1
  kind: p
  original: Revolution = Umwälzung der Zustände.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: NT5B.165.1
  kind: p
  original: Empörung = Umwälzung Meiner.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.166.1
  kind: p
  original: Revolution = politische oder soziale Tat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.167.1
  kind: p
  original: Empörung = Meine egoistische Tat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.168.1
  kind: p
  original: Revolution = Umsturz des Bestehenden,
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.169.1
  kind: p
  original: Empörung = Bestehen des Umsturzes,
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.170.1
  kind: p
  original: etc. etc., p. 422 usf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.170.2
  kind: p
  original: Die bisherige Weise der Menschen, ihre vorgefundene Welt umzustürzen, mußte natürlich auch für heilig erklärt und eine "eigne" Art des Bruchs der vorhandenen Welt dagegen geltend gemacht werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.171.1
  kind: p
  original: Die Revolution "besteht in einer Umwälzung des bestehenden Zustandes oder status, des Staats oder der Gesellschaft, ist mithin eine politische oder soziale Tat".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.171.2
  kind: p
  original: Die Empörung hat zwar eine Umwandlung der Zustände zur unvermeidlichen Folge geht aber nicht von ihr, sondern von der Unzufriedenheit der Menschen mit sich aus".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.171.3
  kind: p
  original: Sie ist eine Erhebung der Einzelnen, ein Emporkommen, ohne Rücksicht auf die Einrichtungen, welche daraus entsprießen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.171.4
  kind: p
  original: 'Die Revolution zielte auf neue Einrichtungen: die Empörung führt dahin, Uns nicht mehr einrichten zu lassen, sondern Uns selbst einzurichten.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.171.5
  kind: p
  original: Sie ist kein Kampf gegen das Bestehende, da, wenn sie gedeiht, das Bestehende von selbst zusammenstürzt, sie ist nur ein herausarbeiten Meiner aus dem Bestehenden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.171.6
  kind: p
  original: Verlasse Ich das Bestehende, so ist es tot und geht in Fäulnis über.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.171.7
  kind: p
  original: Da nun nicht der Umsturz eines Bestehenden Mein Zweck ist, sondern Meine Erhebung darüber, so ist Meine Absicht und Tat keine politische oder soziale, sondern, als allein auf Mich sind Meine Eigenheit gerichtet, eine egoistische." p. 421, 422.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.172.1
  kind: p
  original: Les beaux esprits se rencontrent <Die schönen Geister finden sich zusammen>.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.172.2
  kind: p
  original: Was die Stimme des Predigers in der Wüste verkündete, ist in Erfüllung gegangen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.172.3
  kind: p
  original: Der heillose Johannes Baptista "Stirner" hat im "Dr. Kuhlmann aus Holstein" seinen heiligen Messias gefunden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.172.4
  kind: p
  original: 'Man höre:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.173.1
  kind: p
  original: '"Ihr solltet nicht niederreißen und zerstören, was Euch da im Wege stehet, sondern es umgehen und verlassen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.173.2
  kind: p
  original: Und wenn Ihr es umgangen und verlassen habt, dann höret es von selber auf, denn es findet keine Nahrung mehr.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.173.3
  kind: p
  original: ("Das Reich des Geistes etc.", Genf 1845, p. 116.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.174.1
  kind: p
  original: Die Revolution und die Stirnersche Empörung unterscheiden sich nicht, wie Stirner meint, dadurch, daß die Eine eine politische oder soziale Tat, die Andre eine egoistische Tat ist, sondern dadurch, daß die Eine eine Tat ist und die Andre keine.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.174.2
  kind: p
  original: Der Unsinn seines ganzen Gegensatzes zeigt sich sogleich darin, daß er von " der Revolution" spricht, einer moralischen Person, die mit " dem Bestehenden", einer zweiten moralischen Person, zu kämpfen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: NT5B.174.3
  kind: p
  original: Hätte Sankt Sancho die verschiedenen wirklichen Revolutionen und revolutionären Versuche durchgegangen, so hätte er vielleicht in ihnen selbst diejenigen Formen gefunden, die er bei der Erzeugung seiner ideologischen " Empörung" dunkel ahnte; Z.B bei den Korsikanern, Irländern, russischen Leibeigenen und überhaupt bei unzivilisierten Völkern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 361-362
- id: NT5B.174.4
  kind: p
  original: Hätte er sich ferner um die wirklichen, bei jeder Revolution "bestehenden" Individuen und ihre Verhältnisse gekümmert, statt sich mit dem reinen Ich und " dem Bestehenden", d.i. der Substanz, zu begnügen (eine Phrase, zu deren Sturz keine Revolution, sondern nur ein fahrender Ritter wie Sankt Bruno nötig ist), so wäre er vielleicht zu der Einsicht gekommen, daß jede Revolution und ihre Resultate durch diese Verhältnisse, durch die Bedürfnisse, bedingt war und daß "die politische oder soziale Tat" keineswegs zu "der egoistischen Tat" im Gegensatz stand.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: NT5B.175.1
  kind: p
  original: 'Welche tiefe Einsicht Sankt Sancho in "die Revolution" hat, zeigt sich in dem Ausspruch: "Die Empörung hat zwar eine Umwandlung der Zustände zur Folge, geht aber nicht von ihr aus."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: NT5B.175.2
  kind: p
  original: Dies, in der Antithese gesagt, impliziert, daß die Revolution "von einer Umwandlung der Zustände" ausgeht, d.h., daß die Revolution von der Revolution ausgeht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: NT5B.175.3
  kind: p
  original: Dagegen "geht" die Empörung "von der Unzufriedenheit der Menschen mit sich aus".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: NT5B.175.4
  kind: p
  original: Diese "Unzufriedenheit mit sich" paßt vortrefflich zu den früheren Phrasen über die Eigenheit und den "mit sich einigen Egoisten", der stets "seinen eignen Weg" gehen kann, der stets Freude an sich erlebt und in jedem Augenblick das ist, was er sein kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: NT5B.175.5
  kind: p
  original: Die Unzufriedenheit mit sich ist entweder die Unzufriedenheit mit sich innerhalb eines gewissen Zustandes; durch den die ganze Persönlichkeit bedingt ist, z.B. die Unzufriedenheit mit sich als Arbeiter - oder die moralische Unzufriedenheit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: NT5B.175.6
  kind: p
  original: Im ersten Falle also Unzufriedenheit zugleich und hauptsächlich mit den bestehenden Verhältnissen; im zweiten Falle ein ideologischer Ausdruck dieser Verhältnisse selbst, der keineswegs über sie herausgeht, sondern ganz zu ihnen gehört.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: NT5B.175.7
  kind: p
  original: Der erste Fall führt, wie Sancho glaubt, zur Revolution; es bleibt also nur der zweite, die moralische Unzufriedenheit mit sich, für die Empörung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: NT5B.175.8
  kind: p
  original: '"Das Bestehende" ist, wie wir wissen, "das Heilige"; die "Unzufriedenheit mit sich" reduziert sich also auf die moralische Unzufriedenheit mit sich als einem Heiligen, d.h. einem Gläubigen an das Heilige, das Bestehende.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: NT5B.175.9
  kind: p
  original: Es konnte nur einem malkontenten Schulmeister einfallen, sein Räsonnement über Revolution und Empörung auf Zufriedenheit und Unzufriedenheit zu basieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: NT5B.175.10
  kind: p
  original: Stimmungen, die ganz dem kleinbürgerlichen Kreise angehören, aus welchem Sankt Sancho, wie wir fortwährend sehen, seine Inspirationen schöpft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: NT5B.176.1
  kind: p
  original: Was das "Heraustreten aus dem Bestehenden" für einen Sinn hat, wissen wir schon.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: NT5B.176.2
  kind: p
  original: Es ist die alte Einbildung, daß der Staat von selbst zusammenfällt, sobald alle Mitglieder aus ihm heraustreten, und daß das Geld seine Geltung verliert, wenn sämtliche Arbeiter es anzunehmen verweigern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: NT5B.176.3
  kind: p
  original: Schon in der hypothetischen Form dieses Satzes spricht sich die Phantasterei und Ohnmacht des frommen Wunsches aus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 362-363
- id: NT5B.176.4
  kind: p
  original: Es ist die alte Illusion, daß es nur vom guten Willen der Leute abhängt, die bestehenden Verhältnisse zu ändern, und daß die bestehenden Verhältnisse Ideen sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
- id: NT5B.176.5
  kind: p
  original: Die Veränderung des Bewußtseins, abgetrennt von den Verhältnissen, wie sie von den Philosophen als Beruf, d.h. als Geschäft, betrieben wird, ist selbst ein Produkt der bestehenden Verhältnisse und gehört mit zu ihnen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
- id: NT5B.176.6
  kind: p
  original: Diese ideelle Erhebung über die Welt ist der ideologische Ausdruck der Ohnmacht der Philosophen gegenüber der Welt Ihre ideologischen Prahlereien werden jeden Tag durch die Praxis Lügen gestraft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
- id: NT5B.177.1
  kind: p
  original: Jedenfalls hat Sancho sich nicht gegen seinen Zustand der Konfusion "empört", als er diese Zeilen schrieb.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
- id: NT5B.177.2
  kind: p
  original: Ihm steht die "Umwandlung der Zustände" auf der einen und die "Menschen" auf der andern Seite, und beide Seiten sind ganz voneinander getrennt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
- id: NT5B.177.3
  kind: p
  original: Sancho denkt nicht im Entferntesten daran daß die "Zustände" von jeher die Zustände dieser Menschen waren und nie umgewandelt werden konnten, ohne daß die Menschen sich umwandeln, und wenn es einmal so sein soll, "mit sich" in den alten Zuständen unzufrieden" wurden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
- id: NT5B.177.4
  kind: p
  original: Er glaubt der Revolution den Todesstreich zu versetzen, wenn er sie auf neue Einrichtungen zielen läßt, während die Empörung dahin führt, uns nicht mehr einrichten zu lassen, sondern Uns selbst einzurichten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
- id: NT5B.177.5
  kind: p
  original: Aber schon darin, daß "Wir" "Uns" einrichten, schon darin, daß die Empörer "Wir" sind, liegt, daß der Einzelne sich trotz alles Sanchoschen Widerwillens" von den "Wir" "einrichten lassen" muß und so Revolution und Empörung sich nur dadurch unterscheiden, daß man in der einen dies weiß und in der andern sich Illusionen macht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
- id: NT5B.177.6
  kind: p
  original: Dann läßt Sancho es hypothetisch, ob die Empörung "gedeiht" oder nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
- id: NT5B.177.7
  kind: p
  original: Wie sie nicht "gedeihen" soll, ist nicht abzusehen, und wie sie gedeihen soll, noch viel weniger, da jeder der Empörer nur seinen eignen Weg geht; es müßten denn profane Verhältnisse dazwischentreten, die den Empörern die Notwendigkeit einer gemeinsamen Tat zeigten, einer Tat, die "eine politische oder soziale" wäre, gleichviel, ob sie von egoistischen Motiven ausginge oder nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
- id: NT5B.177.8
  kind: p
  original: Eine fernere "lumpige Distinktion", die wieder auf der Konfusion beruht, macht Sancho zwischen "Umstürzen" des Bestehenden und "Erhebung" darüber, als ob er nicht im Umstürzen sich darüber erhebe und im Erheben darüber es umstürze, sei es auch nur insoweit, als es an ihm selbst Bestand hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
- id: NT5B.177.9
  kind: p
  original: Übrigens ist weder mit dem "Umstürzen" schlechthin noch mit dem "Sich-Erheben" schlechthin etwas gesagt; daß das Sich-Erheben ebenfalls in der Revolution vorkommt, kann Sancho daraus abnehmen, daß das "Levons-nous!" in der französischen Revolution ein bekanntes Stichwort war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
- id: NT5B.178.1
  kind: p
  original: '" Einrichtungen zu machen, gebietet (!) "die Revolution, sich auf- oder emporzurichten, heischt die Empörung.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: NT5B.178.2
  kind: p
  original: Welche Verfassung zu wählen sei, beschäftigte die revolutionären Köpfe, und von Verfassungskämpfen und Verfassungsfragen sprudelt die ganze politische Periode, wie auch die sozialen Talente an gesellschaftlichen Einrichtungen (Phalansterien u. dergl.) ungemein erfinderisch waren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: NT5B.178.3
  kind: p
  original: Verfassungslos zu werden, bestrebt sich der Empörer." p. 422.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: NT5B.179.1
  kind: p
  original: Daß die französische Revolution Einrichtungen zur Folge hatte, ist ein Faktum; daß Empörung von empor herkommt, ist auch ein Faktum; daß man in der Revolution und später um Verfassungen gekämpft hat, desgleichen; daß verschiedene soziale Systeme entworfen worden sind, ebenfalls; nicht minder, daß Proudhon von Anarchie gesprochen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: NT5B.179.2
  kind: p
  original: Aus diesen fünf Fakten braut sich Sancho seinen obigen Satz zusammen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: NT5B.180.1
  kind: p
  original: Aus dem Faktum, daß die französische Revolution zu "Einrichtungen" geführt hat, schließt Sancho, daß die Revolution dies "gebiete".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: NT5B.180.2
  kind: p
  original: Daraus, daß die politische Revolution eine politische war, in der die soziale Umwälzung zugleich einen offiziellen Ausdruck als Verfassungskämpfe erhielt, entnimmt Sancho, getreu seinem Geschichtsmakler, daß man sich in ihr um die beste Verfassung gestritten habe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: NT5B.180.3
  kind: p
  original: An diese Entdeckung knüpft er durch ein "Wie auch" eine Erwähnung der sozialen Systeme.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: NT5B.180.4
  kind: p
  original: In der Epoche der Bourgeoisie beschäftigte man sich mit Verfassungsfragen, "wie auch" verschiedene soziale Systeme neuerdings gemacht worden sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: NT5B.180.5
  kind: p
  original: Dies ist der Zusammenhang des obigen Satzes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: NT5B.181.1
  kind: p
  original: Daß die bisherigen Revolutionen innerhalb der Teilung der Arbeit zu neuen politischen Einrichtungen führen mußten, geht aus dem oben gegen Feuerbach Gesagten hervor; daß die kommunistische Revolution, die die Teilung der Arbeit aufhebt, die politischen Einrichtungen schließlich beseitigt, geht ebenfalls daraus hervor; und daß die kommunistische Revolution sich nicht nach den "gesellschaftlichen Einrichtungen erfinderischer sozialer Talente" richten wird, sondern nach den Produktivkräften, geht endlich auch daraus hervor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: NT5B.182.1
  kind: p
  original: Aber "verfassungslos zu werden, bestrebt sich der Empörer"!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: NT5B.182.2
  kind: p
  original: Er, der "geborne Freie", der von vornherein Alles los ist, bestrebt sich am Ende der Tage, die Verfassung loszuwerden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: NT5B.183.1
  kind: p
  original: Es ist noch zu bemerken, daß zur Entstehung der Sanchoschen "Empörung allerlei frühere Illusionen unsres Bonhomme beigetragen haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: NT5B.183.2
  kind: p
  original: So u.a. der Glaube, die Individuen, die eine Revolution machen, seien durch ein ideelles Band zusammengehalten, und ihre "Schilderhebung" beschränke sich darauf, einen neuen Begriff, fixe Idee, Spuk, Gespenst - das Heilige auf den Schild zu heben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: NT5B.183.3
  kind: p
  original: Sancho läßt sie sich dies ideelle Band aus dem Kopfe schlagen, wodurch sie in seiner Vorstellung zu einer regellosen Rotte werden, die sich nur noch "empören" kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 364-365
- id: NT5B.183.4
  kind: p
  original: Zudem hat er gehört, daß die Konkurrenz der Krieg Aller gegen Alle ist, und dieser Satz, vermengt mit seiner entheiligten Revolution, bildet den Hauptfaktor seiner "Empörung".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: NT5B.184.1
  kind: p
  original: '"Indem Ich zu größerer Verdeutlichung auf einen Vergleich sinne, fällt Mir wider Erwarten die Stiftung des Christentums ein." p. 423.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: NT5B.184.2
  kind: p
  original: '"Christus", erfahren wir hier, "war kein Revolutionär, sondern ein Empörer, der sich emporrichtete.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: NT5B.184.3
  kind: p
  original: 'Darum galt es ihm auch allein um ein: ''Seid klug wie die Schlangen.''" (ibid.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: NT5B.185.1
  kind: p
  original: 'Um dem "Erwarten" und dem "Allein" Sanchos zu entsprechen, muß die letzte Hälfte des eben zitierten Bibelspruchs (Matth[äi] 10, 16): "und ohne Falsch wie die Tauben" nicht existieren.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: NT5B.185.2
  kind: p
  original: Christus muß hier zum zweiten Male als historische Person figurieren, um dieselbe Rolle zu spielen wie oben die Mongolen und Neger.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: NT5B.185.3
  kind: p
  original: Man weiß wieder nicht, soll Christus die Empörung oder soll die Empörung Christus verdeutlichen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: NT5B.185.4
  kind: p
  original: 'Die christlich-germanische Leichtgläubigkeit unsres Heiligen konzentriert sich in dem Satze, daß Christus "die Lebensquellen der ganzen heidnischen Welt abgrub, mit welchen der bestehende Staat ohnehin " (soll heißen: ohne ihn) "verwelken mußte". p. 424.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: NT5B.185.5
  kind: p
  original: Welke Kanzelblume!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: NT5B.185.6
  kind: p
  original: Siehe oben "die Alten".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: NT5B.185.7
  kind: p
  original: Im übrigen credo ut intelligam <ich glaube, damit ich verstehe>, oder damit Ich "einen Vergleich zur Verdeutlichung" finde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: NT5B.186.1
  kind: p
  original: 'Wir haben an zahllosen Exempeln gesehen, wie unsrem Heiligen überall nichts als die heilige Geschichte einfällt, und zwar an solchen Stellen, wo sie nur dem Leser "wider Erwarten" kommt, "Wider Erwarten" fällt sie ihm sogar im Kommentar wieder ein, wo Sancho p. 154 "die jüdischen Rezensenten" im alten Jerusalem der christlichen Definition "Gott ist die Liebe" gegenüber ausrufen läßt: "Da seht Ihr, daß es ein heidnischer Gott ist, der von den Christen verkündet wird; denn ist Gott die Liebe, so ist er der Gott Amor, der Liebesgott!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: NT5B.186.2
  kind: p
  original: '- "Wider Erwarten" ist aber das Neue Testament griechisch geschrieben, und die christliche "Definition" lautet: ὁ θεὸς ἀγάπη ἐστίν <Gott ist die Liebe>1. Joh[annis] 4, 16; während "der Gott Amor, der Liebesgott" Ἔρως heißt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: NT5B.186.3
  kind: p
  original: Wie also die "jüdischen Rezensenten" die Verwandlung von ἀγάπη <(christliche) Liebe> in ἔρως <(geschlechtliche) Liebe> zustande brachten, darüber wird Sancho noch Aufschluß zu geben haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: NT5B.186.4
  kind: p
  original: An dieser Stelle des Kommentars wird nämlich Christus, ebenfalls "zur Verdeutlichung", mit Sancho verglichen; wobei allerdings zugegeben werden muß, daß Beide die frappanteste Ähnlichkeit miteinander haben, Beide "beleibte Wesen" sind und wenigstens der lachende Erbe an ihre wechselseitige Existenz resp. Einzigkeit glaubt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 365-366
- id: NT5B.186.5
  kind: p
  original: Daß Sancho der moderne Christus ist, auf diese seine "fixe Idee" "zielt" bereits die ganze Geschichtskonstruktion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: NT5B.187.1
  kind: p
  original: Die Philosophie der Empörung, die uns soeben in schlechten Antithesen und welken Redeblumen vorgetragen wurde, ist in letzter Instanz nichts als eine bramarbasierende Apologie der Parvenuwirtschaft (Parvenu, Emporkömmling, Emporgekommener, Empörer).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: NT5B.187.2
  kind: p
  original: Jeder Empörer hat bei seiner ",egoistischen Tat" ein spezielles Bestehende sich gegenüber, worüber er sich zu erheben strebt, unbekümmert um die allgemeinen Verhältnisse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: NT5B.187.3
  kind: p
  original: Er sucht das Bestehende nur, insoweit es eine Fessel ist, loszuwerden, im Übrigen dagegen sucht er es sich vielmehr anzueignen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: NT5B.187.4
  kind: p
  original: Der Weber, der zum Fabrikanten "emporkommt", wird dadurch seinen Webstuhl los und verläßt ihn; im übrigen geht die Welt ihren Gang fort, und unser "gedeihender" Empörer stellt an die Andern nur die heuchlerische moralische Forderung, auch Parvenus zu werden wie er.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - NT5B.N6
  mew_page: '366'
- id: NT5B.187.5
  kind: p
  original: So verlaufen sich alle kriegerischen Rodomontaden Stirners in moralische Schlußfolgerungen aus Gellerts Fabeln und spekulative Interpretationen der bürgerlichen Misere.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: NT5B.188.1
  kind: p
  original: Wir haben bisher gesehen, daß die Empörung Alles, nur keine Tat ist. p. 342 erfahren wir, daß das Verfahren des Zugreifens nicht verächtlich sei, sondern die reine Tat des mit sich einigen Egoisten bekunde".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: NT5B.188.2
  kind: p
  original: 'Soll wohl heißen: der miteinander einigen Egoisten, da sonst das Zugreifen auf das unzivilisierte "Verfahren" der Diebe oder das zivilisierte der Bourgeois hinausläuft und im ersten Falle nicht gedeiht, im zweiten Falle keine "Empörung" ist.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: NT5B.188.3
  kind: p
  original: Zu bemerken ist, daß dem mit sich einigen Egoisten, der Nichts tut, hier die "reine" Tat entspricht, eine Tat, die allerdings von einem so tatlosen Individuum allein zu erwarten stand.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: NT5B.189.1
  kind: p
  original: 'Nebenbei erfahren wir, was den Pöbel geschaffen hat, und wir können im Voraus wissen, daß es wieder eine "Satzung" und der Glaube an diese Satzung, an das Heilige, ist, der hier zur Abwechslung als Sündenbewußtsein auftritt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: NT5B.190.1
  kind: p
  original: '"Nur daß das Zugreifen Sünde, Verbrechen ist, nur diese Satzung schafft einen Pöbel... das alte Sündenbewußtsein trägt allein die Schuld." p. 342.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: NT5B.191.1
  kind: p
  original: Der Glaube, daß das Bewußtsein an Allem schuld ist, ist seine Satzung, die ihn zum Empörer und den Pöbel zum Sünder macht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: NT5B.192.1
  kind: p
  original: 'Im Gegensatz zu diesem Sündenbewußtsein feuert der Egoist sich, resp. den Pöbel, zum Zugreifen an wie folgt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.193.1
  kind: p
  original: '"Sage ich Mir: wohin Meine Gewalt langt, das ist Mein Eigentum, und nehme Ich Alles als Eigentum in Anspruch, was zu erreichen Ich Mich stark genug fühle etc." p. 340.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.194.1
  kind: p
  original: Sankt Sancho sagt sich also, daß er sich etwas sagen will, fordert sich auf, zu haben, was er hat, und drückt sein wirkliches Verhältnis als ein Verhältnis der Gewalt aus, eine Paraphrase, die überhaupt das Geheimnis aller seiner Renommagen ist. (Siehe Logik.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.194.2
  kind: p
  original: Dann unterscheidet er, der jeden Augenblick ist, was er sein kann, also auch hat, was er haben kann, sein realisiertes, wirkliches Eigentum, das er auf Kapitalkonto genießt, von seinem möglichen Eigentum, seinem unrealisierten "Gefühl der Stärke", das er sich auf Gewinn- und Verlustkonto gutschreibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.194.3
  kind: p
  original: Beitrag zur Buchführung über das Eigentum im außergewöhnlichen Verstande.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.195.1
  kind: p
  original: 'Was das feierliche "Sagen" zu bedeuten hat, verrät Sancho an einer bereits angeführten Stelle:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.196.1
  kind: p
  original: '" Sage Ich Mir... so ist das eigentlich auch leeres Gerede."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.197.1
  kind: p
  original: 'Er fährt darin fort:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.198.1
  kind: p
  original: '"Der Egoismus" sagt "dem besitzlosen Pöbel", um ihn "auszurotten": "Greife zu und nimm, was Du brauchst!" p. 341.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.199.1
  kind: p
  original: Wie "leer" dies "Gerede" ist, sieht man gleich an dem folgenden Beispiel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.200.1
  kind: p
  original: '"In dem Vermögen des Bankiers sehe Ich so wenig etwas Fremdes als Napoleon in Ländern der Könige: Wir" (das - "Ich" verwandelt sich plötzlich in "Wir") "tragen keine Scheu, es zu erobern, und sehen Uns auch nach den Mitteln dazu um.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.200.2
  kind: p
  original: Wir streifen ihm also den Geist der Fremdheit ab, vor dem Wir Uns gefürchtet hatten." p. 369.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.201.1
  kind: p
  original: Wie wenig Sancho dem Vermögen des Bankiers "den Geist der Fremdheit abgestreift" hat, beweist er sogleich mit seinem wohlmeinenden Vorschlag an den Pöbel, es durch Zugreifen zu "erobern".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.201.2
  kind: p
  original: '"Er greife zu und sehe, was er in der Hand behält!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.201.3
  kind: p
  original: Nicht das Vermögen des Bankiers, sondern nutzloses Papier, den "Leichnam" dieses Vermögens, der ebensowenig ein Vermögen ist, "als ein toter Hund noch ein Hund ist".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.201.4
  kind: p
  original: Das Vermögen des Bankiers ist nur innerhalb der bestehenden Produktions- und Verkehrsverhältnisse ein Vermögen und kann nur innerhalb der Bedingungen dieser Verhältnisse und mit den Mitteln, die ihnen gelten, "erobert" werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.201.5
  kind: p
  original: Und wenn etwa Sancho sich zu anderm Vermögen wenden sollte, so dürfte er finden, daß es damit nicht besser aussieht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.201.6
  kind: p
  original: So daß die "reine Tat des mit sich einigen Egoisten" schließlich auf ein höchst schmutziges Mißverständnis hinausläuft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.201.7
  kind: p
  original: '"So weit kommt man mit dem Spuk" des Heiligen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: NT5B.202.1
  kind: p
  original: Nachdem nun Sancho sich gesagt hat, was er sich sagen wollte, läßt er den empörten Pöbel sagen, was er ihm vorgesagt hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.202.2
  kind: p
  original: Er hat nämlich für den Fall einer Empörung eine Proklamation nebst Gebrauchsanweisung verfertigt, die in allen Dorfkneipen aufgelegt und auf dem Lande verteilt werden soll.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.202.3
  kind: p
  original: Sie macht Anspruch auf Insertion in den "Hinkenden Botten" und den herzoglich nassauischen Landeskalender.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.202.4
  kind: p
  original: Einstweilen beschränken sich Sanchos tendances incendiaires <aufrührerische Bestrebungen> auf das platte Land, auf die Propaganda unter den Ackerknechten und Viehmägden mit Ausschluß der Städte, was ein neuer Beweis ist, wie sehr er der großen Industrie "den Geist der Fremdheit abgestreift hat".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.202.5
  kind: p
  original: Inzwischen wollen wir das vorliegende wertvolle Dokument, das nicht verlorengehen darf, möglichst ausführlich mitteilen, um "soviel an Uns ist, zur Verbreitung eines wohlverdienten Ruhmes beizutragen". (Wig[and,] p. 191.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.203.1
  kind: p
  original: 'Die Proklamation steht Seite 358 u.f. und beginnt wie folgt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.204.1
  kind: p
  original: '"Wodurch ist denn Euer Eigentum sicher, Ihr Bevorzugten?...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.204.2
  kind: p
  original: Dadurch, daß Wir Uns des Eingriffs enthalten, mithin durch Unsern Schutz...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.204.3
  kind: p
  original: Dadurch, daß Ihr Uns Gewalt antut."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.205.1
  kind: p
  original: Erst dadurch, daß wir uns des Eingriffs enthalten, d.h. dadurch, daß wir uns selbst Gewalt antun, dann dadurch, daß Ihr uns Gewalt antut.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.205.2
  kind: p
  original: Cela va à merveille <Das geht wunderschön>.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.205.3
  kind: p
  original: Weiter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.206.1
  kind: p
  original: '"Wollt Ihr unsren Respekt, so kauft ihn für den Uns genehmen Preis...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.206.2
  kind: p
  original: Wir wollen nur Preiswürdigkeit."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.207.1
  kind: p
  original: Erst wollen die "Empörer" ihren Respekt um den ihnen "genehmen Preis" verschachern, nachher machen sie die "Preiswürdigkeit" zum Kriterium des Preises.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.207.2
  kind: p
  original: Erst ein willkürlicher, dann ein durch kommerzielle Gesetze, durch die Produktionskosten und das Verhältnis von Nachfrage und Zufuhr, unabhängig von der Willkür, bestimmter Preis.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.208.1
  kind: p
  original: '"Wir wollen Euer Eigentum Euch lassen, wenn Ihr dies Lassen gehörig aufwiegt...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.208.2
  kind: p
  original: Ihr werdet über Gewalt schreien, wenn Wir zulangen... ohne Gewalt bekommen Wir sie nicht" (nämlich die Austern der Bevorzugten)...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.208.3
  kind: p
  original: '"Wir wollen Euch Nichts, gar Nichts nehmen."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.209.1
  kind: p
  original: Erst "lassen" wir's Euch, dann nehmen wir's Euch und müssen "Gewalt" anwenden, und endlich wollen wir Euch doch lieber Nichts nehmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: NT5B.209.2
  kind: p
  original: Wir lassen es Euch in dem Falle, wo Ihr selbst davon ablaßt; in einem lichten Augenblick, dem einzigen, den Wir haben, sehen wir allerdings ein, daß dies "Lassen ein "Zulangen" und "Gewalt"-Anwenden ist, aber man kann uns dennoch schließlich nicht vorwerfen, daß wir Euch irgend etwas "nehmen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 368-369
- id: NT5B.209.3
  kind: p
  original: Wobei es sein Bewenden hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.210.1
  kind: p
  original: '"Wir plagen Uns zwölf Stunden im Schweiße Unsres Angesichts, und Ihr bietet Uns dafür ein paar Groschen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.210.2
  kind: p
  original: So nehmt denn auch für Eure Arbeit ein Gleiches...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.210.3
  kind: p
  original: Nichts von Gleichheit!"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.211.1
  kind: p
  original: Die "empörten" Ackerknechte beweisen sich als echte Stirnersche "Geschöpfe".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.212.1
  kind: p
  original: '"Mögt Ihr das nicht?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.212.2
  kind: p
  original: Ihr wähnt, Unsre Arbeit sei reichlich mit jenem Lohne bezahlt, die Eure dagegen eines Lohnes von vielen Tausenden wert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.212.3
  kind: p
  original: Schlüget Ihr aber die Eurige nicht so hoch an und ließet Uns die Unsrige besser verwerten, so würden Wir erforderlichenfalls wohl noch wichtigere zustande bringen, als Ihr für die vielen tausend Taler, und bekämet Ihr nur einen Lohn wie Wir, Ihr würdet bald fleißiger werden, um mehr zu erhalten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.212.4
  kind: p
  original: Leistet Ihr etwas, was Uns zehn- und hundertmal mehr wert scheint als Unsre eigne Arbeit, ei" (ei du frommer und getreuer Knecht!), "so sollt Ihr auch hundertmal mehr dafür bekommen; Wir denken Euch dagegen auch Dinge herzustellen, die Ihr Uns höher als mit dem gewöhnlichen Taglohn verwerten werdet."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.213.1
  kind: p
  original: Zuerst klagen die Empörer, ihre Arbeit werde zu niedrig bezahlt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.213.2
  kind: p
  original: Am Ende versprechen sie aber, erst bei höherem Taglohn Arbeit zu liefern, die "höher als mit dem gewöhnlichen Taglohn" zu verwerten ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.213.3
  kind: p
  original: Dann glauben sie, sie würden außerordentliche Dinge leisten, wenn sie nur erst besseren Lohn bekämen, während sie zu gleicher Zeit vom Kapitalisten erst dann außerordentliche Leistungen erwarten, wenn sein "Lohn" auf das Niveau des ihrigen herabgedrückt ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.213.4
  kind: p
  original: Endlich, nachdem sie das ökonomische Kunststück fertiggebracht haben, den Profit, diese notwendige Form des Kapitals, ohne welchen sie sowohl wie der Kapitalist zugrunde gehen würden - den Profit in Arbeitslohn zu verwandeln, vollbringen sie das Wunder, "hundertmal mehr" zu zahlen "als ihre eigne Arbeit", d.h. hundertmal mehr als sie verdienen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.213.5
  kind: p
  original: '"Dies ist der Sinn" des obigen Satzes, wenn Stirner "meint, was er sagt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.213.6
  kind: p
  original: Hat er aber nur einen stilistischen Fehler begangen, hat er die Empörer als Gesamtheit hundertmal mehr offrieren lassen wollen, als Jeder von ihnen verdient, so läßt er sie dem Kapitalisten nur Das anbieten, was jeder Kapitalist heutzutage bereits hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.213.7
  kind: p
  original: Daß die Arbeit des Kapitalisten in Verbindung mit seinem Kapital zehn- resp. hundertmal mehr wert ist als die eines einzelnen bloßen Arbeiters, ist klar.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.213.8
  kind: p
  original: Sancho läßt also in diesem Falle, wie immer, Alles beim Alten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.214.1
  kind: p
  original: '"Wir wollen schon miteinander fertig werden, wenn Wir nur erst dahin übereingekommen sind, daß Keiner mehr dem Andern etwas zu schenken braucht.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: NT5B.214.2
  kind: p
  original: Dann gehn Wir wohl gar selbst so weit, daß Wir selbst den Krüppeln und Greisen und Kranken einen angemessenen Preis dafür bezahlen, daß sie nicht aus Hunger und Not von Uns scheiden; denn wollen Wir, daß sie leben, so geziemt sich's auch, daß Wir die Erfüllung unseres Willens erkaufen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 369-370
- id: NT5B.214.3
  kind: p
  original: Ich sage erkaufen, meine also kein elendes Almosen."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.215.1
  kind: p
  original: Diese sentimentale Episode von den Krüppeln etc. soll beweisen, daß Sanchos empörte Ackerknechte bereits zu jener Höhe des bürgerlichen Bewußtseins "emporgekommen" sind, auf der sie nichts schenken und nichts geschenkt haben wollen und auf der sie glauben, in einem Verhältnis sei die Würde und das Interesse beider Teile gesichert, sobald es in einen Kauf verwandelt sei.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.215.2
  kind: p
  original: '- Auf diese donnernde Proklamation des in Sanchos Einbildung empörten Volks folgt die Gebrauchsanweisung in Form eines Dialogs zwischen dem Gutsbesitzer und seinen Ackerknechten, wobei sich diesmal der Herr wie Szeliga und die Knechte wie Stirner gebärden.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.215.3
  kind: p
  original: In dieser Gebrauchsanweisung werden die englischen Strikes und französischen Arbeiterkoalitionen a priori berlinisch konstruiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.216.1
  kind: p
  original: Der Wortführer der Ackerknechte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.216.2
  kind: p
  original: '"Was hast Du denn?"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.217.1
  kind: p
  original: Der Gutsbesitzer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.217.2
  kind: p
  original: '"Ich habe ein Gut von tausend Morgen."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.218.1
  kind: p
  original: Der Wortführer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.218.2
  kind: p
  original: '"Und Ich bin Dein Ackerknecht und werde Dir Deinen Acker hinfort nur für einen Taler Taglohn bestellen."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.219.1
  kind: p
  original: Der Gutsbesitzer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.219.2
  kind: p
  original: '"Dann nehme Ich einen Andern."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.220.1
  kind: p
  original: Der Wortführer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.220.2
  kind: p
  original: '"Du findest keinen, denn Wir Ackersknechte tun''s nicht mehr anders, und wenn Einer sich meldet, der weniger nimmt, so hüte er sich vor Uns.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.220.3
  kind: p
  original: Da ist die Hausmagd, die fordert jetzt auch so viel, und Du findest keine mehr unter diesem Preise."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.221.1
  kind: p
  original: Der Gutsbesitzer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.221.2
  kind: p
  original: '"Ei, so muß ich zugrunde gehen!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.222.1
  kind: p
  original: Die Ackerknechte im Chorus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.222.2
  kind: p
  original: '"Nicht so hastig!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.222.3
  kind: p
  original: Soviel wie Wir wirst Du wohl einnehmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.222.4
  kind: p
  original: Und wäre es nicht so, so lassen Wir so viel ab, daß Du wie Wir zu leben hast - Nichts von Gleichheit!"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.223.1
  kind: p
  original: Der Gutsbesitzer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.223.2
  kind: p
  original: '"Ich bin aber besser zu leben gewohnt!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.224.1
  kind: p
  original: Die Ackerknechte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.224.2
  kind: p
  original: '"Dagegen haben Wir nichts, aber es ist nicht Unsre Sorge; kannst Du mehr erübrigen, immerhin.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.224.3
  kind: p
  original: Sollen Wir Uns unterm Preise vermieten, damit Du wohlleben kannst?"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.225.1
  kind: p
  original: Der Gutsbesitzer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.225.2
  kind: p
  original: '"Aber Ihr ungebildeten Leute braucht doch nicht so viel!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.226.1
  kind: p
  original: Die Ackerknechte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.226.2
  kind: p
  original: '"Nun, Wir nehmen etwas mehr, damit Wir damit die Bildung, die Wir etwa brauchen, Uns verschaffen können."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.227.1
  kind: p
  original: Der Gutsbesitzer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.227.2
  kind: p
  original: '"Aber wenn Ihr so die Reichen herunterbringt, wer soll dann noch die Künste und Wissenschaften unterstützen?"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.228.1
  kind: p
  original: Die Ackerknechte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.228.2
  kind: p
  original: '"I nun, die Menge muß es bringen; Wir schießen zusammen, das gibt ein artiges Sümmchen, Ihr Reichen kauft ohnehin jetzt nur die abgeschmacktesten Bücher und die weinerlichen Muttergottesbilder oder ein Paar flinke Tänzerbeine."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.229.1
  kind: p
  original: Der Gutsbesitzer.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: NT5B.229.2
  kind: p
  original: '"O die unselige Gleichheit! "'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 370-371
- id: NT5B.230.1
  kind: p
  original: 'Die Ackerknechte: "Nein, mein bester alter Herr, Nichts von Gleichheit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: NT5B.230.2
  kind: p
  original: Wir wollen nur gelten, was Wir wert sind, und wenn Ihr mehr seid, da sollt Ihr immerhin auch mehr gelten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: NT5B.230.3
  kind: p
  original: Wir wollen nur Preiswürdigkeit und denken des Preises, den Ihr zahlen werdet, Uns würdig zu zeigen."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: NT5B.231.1
  kind: p
  original: Am Schlusse dieses dramatischen Meisterwerks gesteht Sancho, daß "die Einmütigkeit der Ackerknechte" allerdings "erfordert" werde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: NT5B.231.2
  kind: p
  original: Wie diese zustande kommt, erfahren wir nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: NT5B.231.3
  kind: p
  original: Was wir erfahren, ist, daß die Ackerknechte nicht beabsichtigen, die bestehenden Verhältnisse der Produktion und des Verkehrs irgendwie zu ändern, sondern bloß dem Gutsbesitzer soviel abzuzwingen, als er mehr ausgibt als sie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: NT5B.231.4
  kind: p
  original: Daß diese Differenz der Dépensen <Ausgaben>, auf die Masse der Proletarier verteilt, jedem Einzelnen nur eine Bagatelle abwerfen und seine Lage nicht im Mindesten verbessern würde, das ist unsrem wohlmeinenden Bonhomme gleichgültig.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: NT5B.231.5
  kind: p
  original: Welcher Stufe der Agrikultur diese heroischen Ackerknechte angehören, zeigt sich gleich nach dem Schlusse des Dramas, wo sie sich in "Hausknechte" verwandeln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: NT5B.231.6
  kind: p
  original: Sie leben also unter einem Patriarchat, in dem die Teilung der Arbeit noch sehr unentwickelt ist, in dem übrigens die ganze Verschwörung dadurch "ihr letztes Absehen erreichen" muß, daß der Gutsherr den Wortführer in die Scheune führt und ihm einige Hiebe aufzählt, während in zivilisierteren Ländern der Kapitalist die Sache dadurch beendigt, daß er die Arbeit einige Zeit einstellt und die Arbeiter "spielen gehen" läßt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: NT5B.231.7
  kind: p
  original: Wie praktisch überhaupt Sancho bei der ganzen Anlage seines Kunstwerks zu Werke geht, wie sehr er sich innerhalb der Grenzen der Wahrscheinlichkeit hält, geht außer dem sonderbaren Einfall, einen Turnout <Arbeitseinstellung> von Ackerknechten zustande bringen zu wollen, namentlich aus der Koalition der "Hausmägde" hervor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: NT5B.231.8
  kind: p
  original: Und welch eine Gemütlichkeit, zu glauben, der Kornpreis auf dem Weltmarkte werde sich nach den Lohnforderungen dieser hinterpommerschen Ackerknechte richten! statt nach dem Verhältnis von Nachfrage und Zufuhr!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: NT5B.231.9
  kind: p
  original: Einen wahren Knalleffekt macht der überraschende Exkurs der Ackerknechte über die Literatur, die letzte Gemäldeausstellung und die renommierte Tänzerin des Tages, überraschend selbst noch nach der unerwarteten Frage des Gutsherrn wegen Kunst und Wissenschaft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: NT5B.231.10
  kind: p
  original: Die Leute werden ganz freundschaftlich, sowie sie auf dies literarische Thema kommen, und der bedrängte Gutsherr vergißt selbst für einen Augenblick seinen drohenden Ruin, um sein Dévoûment <Aufopferung, Hingabe> für Kunst und Wissenschaft an den Tag zu legen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: NT5B.231.11
  kind: p
  original: Schließlich versichern ihn dann auch die Empörer ihrer Biederkeit und geben ihm die beruhigende Erklärung, daß sie weder vom leidigen Interesse noch von subversiven Tendenzen getrieben werden, sondern von den reinsten moralischen Motiven.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 371-372
- id: NT5B.231.12
  kind: p
  original: Sie wollen nur Preiswürdigkeit und versprechen auf Ehre und Gewissen, sich des höheren Preises würdig zu machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: NT5B.231.13
  kind: p
  original: Die ganze Sache hat nur den Zweck, Jedem das Seine, seinen redlichen und billigen Verdienst, "redlich erarbeiteten Genuß" zu sichern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: NT5B.231.14
  kind: p
  original: Daß dieser Preis von der Stellung des Arbeitsmarkts abhängt und nicht von der sittlichen Empörung einiger literarisch gebildeten Ackerknechte, die Kenntnis dieses Faktums war allerdings von unsren Biedermännern nicht zu verlangen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: NT5B.232.1
  kind: p
  original: Diese hinterpommerschen Empörer sind so bescheiden, daß sie, trotz ihrer "Einmütigkeit", die ihnen zu ganz andern Dingen Macht gibt, Knechte nach wie vor bleiben wollen und "ein Taler Taglohn" der höchste Wunsch ihres Herzens ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: NT5B.232.2
  kind: p
  original: Ganz konsequent katechisieren sie daher nicht den Gutsherrn, der in ihrer Gewalt ist, sondern der Gutsherr katechisiert sie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: NT5B.233.1
  kind: p
  original: Der "sichere Mut" und das "kräftige Selbstgefühl des Hausknechts" äußert sich auch in der "sichern" und "kräftigen" Sprache, die er und seine Genossen verführen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: NT5B.233.2
  kind: p
  original: '"Etwa - I nun - die Menge muß es bringen - artiges Sümmchen - mein bester alter Herr - immerhin."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: NT5B.233.3
  kind: p
  original: 'Schon vorher in der Proklamation hieß es: "erforderlichenfalls wohl ei - Wir denken herzustellen - wohl - vielleicht, etwa usw."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: NT5B.233.4
  kind: p
  original: Man meint, die Ackerknechte hätten ebenfalls das famose Roß Clavileno bestiegen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - NT5B.N7
  mew_page: '372'
- id: NT5B.234.1
  kind: p
  original: Die ganze lärmende "Empörung" unsres Sancho reduziert sich also in letzter Instanz auf einen Turnout, aber einen Turnout im außergewöhnlichen Verstande, nämlich einen berlinisierten Turnout.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: NT5B.234.2
  kind: p
  original: Während die wirklichen Turnouts in zivilisierten Ländern einen immer untergeordneteren Teil der Arbeiterbewegung bilden, weil die allgemeinere Verbindung der Arbeiter untereinander zu andern Bewegungsformen führt, versucht Sancho, den kleinbürgerlich karikierten Turnout als letzte und höchste Form des welthistorischen Kampfs darzustellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: NT5B.235.1
  kind: p
  original: Die Wogen der Empörung werfen uns jetzt an die Küste des gelobten Landes, da Milch und Honig fließt, wo jeder echte Israelit unter seinem Feigenbaum sitzt und das Millennium <Tausendjährige Reich> der "Verständigung" angebrochen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: NT5B.236.1
  kind: heading
  original: III. Der Verein
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: NT5B.237.1
  kind: p
  original: Wir haben bei der Empörung zuerst die Prahlereien Sanchos zusammengestellt und dann den praktischen Verlauf der "reinen Tat des mit sich einigen Egoisten" verfolgt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: NT5B.237.2
  kind: p
  original: Wir werden beim "Verein" den umgekehrten Weg einschlagen; zuerst die positiven Institutionen prüfen und dann die Illusionen unseres Heiligen über diese Institutionen danebenhalten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: NT5B.238.1
  kind: heading
  original: 1. Grundeigentum
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: NT5B.239.1
  kind: p
  original: '"Wenn Wir den Grundeigentümern den Grund nicht länger lassen, sondern Uns zueignen wollen, so vereinigen Wir Uns zu diesem Zwecke, bilden einen Verein, eine société"'' (Gesellschaft), " die sich zur Eigentümerin macht; glückt es Uns, so hören Jene auf, Grundeigentümer zu sein.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: NT5B.239.2
  kind: p
  original: Der "Grund und Boden" wird dann "zum Eigentum der Erobernden...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: NT5B.239.3
  kind: p
  original: Und diese Einzelnen werden als eine Gesamtmasse nicht weniger willkürlich mit Grund und Boden umgehen als ein vereinzelter Einzelner oder sogenannter propriétaire.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: NT5B.239.4
  kind: p
  original: Auch so bleibt also das Eigentum bestehen, und zwar auch als 'ausschließlich', indem die Menschheit, diese große Sozietät, den Einzelnen von ihrem Eigentum ausschließt, ihm vielleicht nur ein Stück davon verpachtet, zu Lohn gibt...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: NT5B.239.5
  kind: p
  original: So wird's auch bleiben und werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: NT5B.239.6
  kind: p
  original: Dasjenige, woran Alle Anteil haben wollen, wird demjenigen Einzelnen entzogen werden, der es für sich allein haben will, es wird zu einem Gemeingut gemacht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: NT5B.239.7
  kind: p
  original: Als an einem Gemeingut hat Jeder daran seinen Anteil, und dieser Anteil ist sein Eigentum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: NT5B.239.8
  kind: p
  original: So ist ja auch in unsren alten Verhältnissen ein Haus, welches fünf Erben gehört, ihr Gemeingut; der fünfte Teil des Ertrags aber ist eines Jeden Eigentum." p. 329, 330.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: NT5B.240.1
  kind: p
  original: Nachdem unsre tapfern Empörer sich zu einem Verein, einer Sozietät, formiert und in dieser Gestalt sich ein Stück Land erobert haben, "macht sich" diese "société", diese moralische Person, "zur Eigentümerin ".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: NT5B.240.2
  kind: p
  original: Damit man dies ja nicht mißverstehe, wird gleich darauf gesagt, daß "diese Sozietät den Einzelnen vom Eigentum ausschließt, ihm vielleicht nur ein Stück davon verpachtet, zu Lohn gibt".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: NT5B.240.3
  kind: p
  original: Auf diese Weise eignet Sankt Sancho sich und seinem "Verein" seine Vorstellung vom Kommunismus an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: NT5B.240.4
  kind: p
  original: Der Leser wird sich erinnern, daß Sancho in seiner Ignoranz den Kommunisten vorwarf, sie wollten die Gesellschaft zur höchsten Eigentümerin machen, die dem Einzelnen seine "Habe" zu Lehen gebe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: NT5B.241.1
  kind: p
  original: Ferner die Aussicht, die Sancho seinen Mannschaften auf einen "Anteil am Gemeingut" eröffnet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: NT5B.241.2
  kind: p
  original: 'Bei einer späteren Gelegenheit sagt derselbe Sancho ebenfalls gegen die Kommunisten: "Ob das Vermögen der Gesamtheit gehört, die Mir davon einen Teil zufließen läßt, oder einzelnen Besitzern, ist für Mich derselbe Zwang, da Ich über keins von Beiden bestimmen kann (weswegen ihm auch seine "Gesamtmasse" dasjenige "entzieht", von dem sie nicht will, daß es ihm allein gehöre, und ihm so die Macht des Gesamtwillens fühlbar macht).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 373-374
- id: NT5B.242.1
  kind: p
  original: Drittens finden wir hier wieder die "Ausschließlichkeit", die er dem bürgerlichen Eigentum so oft vorgeworfen hat, so daß "ihm nicht einmal der armselige Punkt gehört, auf dem er sich herumdreht".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: NT5B.242.2
  kind: p
  original: Er hat vielmehr nur das Recht und die Macht, als armseliger und gedrückter Fronbauer darauf herumzuhocken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: NT5B.243.1
  kind: p
  original: Viertens eignet sich hier Sancho das Lehnswesen an, das er zu seinem großen Verdruß in allen bisher existierenden und projektierten Gesellschaftsformen entdeckte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: NT5B.243.2
  kind: p
  original: Die erobernde "Sozietät" benimmt sich ungefähr wie die "Vereine" von halbwilden Germanen, die die römischen Provinzen eroberten und dort ein noch sehr mit dem alten Stammwesen versetztes, rohes Lehnswesen einrichteten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: NT5B.243.3
  kind: p
  original: Sie gibt jedem Einzelnen ein Stückchen Land "zu Lohn".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: NT5B.243.4
  kind: p
  original: Auf der Stufe, auf welcher Sancho und die Germanen des sechsten Jahrhunderts stehen, fällt das Lehnswesen allerdings noch sehr mit dem "Lohn"-wesen zusammen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: NT5B.244.1
  kind: p
  original: Es versteht sich übrigens, daß das von Sancho hier neuerdings zu Ehren gebrachte Stammeigentum sich binnen kurzem wieder in die jetzigen Verhältnisse auflösen müßte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: NT5B.244.2
  kind: p
  original: 'Sancho fühlt dies selbst, indem er ausruft: "So wird''s auch bleiben und" (schönes Und!) "werden", und schließlich durch sein großes Exempel von dem Hause, das fünf Erben gehört, beweist, daß er gar nicht die Absicht hat, über unsre alten Verhältnisse hinauszugehen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: NT5B.244.3
  kind: p
  original: Sein ganzer Plan zur Organisation des Grundeigentums hat nur den Zweck, uns auf einem historischen Umwege zu der kleinbürgerlichen Erbpacht und dem Familieneigentum deutscher Reichsstädte zurückzuführen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: NT5B.245.1
  kind: p
  original: Von unsren alten, d.h. den jetzt bestehenden Verhältnissen, hat sich Sancho nur den juristischen Unsinn angeeignet, daß die Einzelnen oder propriétaires "willkürlich" mit dem Grundeigentum umgeben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: NT5B.245.2
  kind: p
  original: Im "Verein" soll diese eingebildete "Willkür" von seiten der "Sozietät" fortgesetzt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: NT5B.245.3
  kind: p
  original: Es ist für den "Verein" so gleichgültig, was mit dem Boden geschieht, daß die "Sozietät" "vielleicht" den Einzelnen Parzellen verpachtet, vielleicht auch nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: NT5B.245.4
  kind: p
  original: Das ist Alles ganz gleichgültig.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: NT5B.245.5
  kind: p
  original: '- Daß mit einer bestimmten Organisation des Ackerbaus eine bestimmte Form der Tätigkeit, die Subsumtion unter eine bestimmte Stufe der Teilung der Arbeit gegeben ist, kann Sancho freilich nicht wissen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: NT5B.245.6
  kind: p
  original: Aber jeder Andere sieht ein, wie wenig die von Sancho hier vorgeschlagenen kleinen Fronbauern in der Lage sind, daß "Jeder von ihnen ein allmächtiges Ich werden" kann, und wie schlecht ihr Eigentum an ihre[r] lumpige[n] Parzelle zu dem viel gefeierten "Eigentum an Allem" paßt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 374-375
- id: NT5B.245.7
  kind: p
  original: In der wirklichen Welt hängt der Verkehr der Individuen von ihrer Produktionsweise ab, und daher wirft Sanchos "Vielleicht" vielleicht seinen ganzen Verein über den Haufen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.245.8
  kind: p
  original: '"Vielleicht" aber oder vielmehr unzweifelhaft tritt hier schon die wahre Ansicht Sanchos über den Verkehr im Verein zutage, nämlich die Ansicht, daß der egoistische Verkehr das Heilige zu seiner Grundlage hat.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.246.1
  kind: p
  original: Sancho tritt hier mit der ersten "Einrichtung" seines zukünftigen Vereins an das Tageslicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.246.2
  kind: p
  original: Die Empörer, die "verfassungslos" zu werden sich bestrebten, "richten sich selbst ein", indem sie eine "Verfassung" des Grundeigentums "wählen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.246.3
  kind: p
  original: Wir sehen, daß Sancho Recht hatte, wenn er sich von neuen "Institutionen" keine glänzenden Hoffnungen machte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.246.4
  kind: p
  original: Wir sehen aber zugleich, daß er einen hohen Rang unter den "sozialen Talenten" einnimmt und "an gesellschaftlichen Einrichtungen ungemein erfinderisch ist".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.247.1
  kind: heading
  original: 2. Organisation der Arbeit
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.248.1
  kind: p
  original: '"Die Organisation der Arbeit betrifft nur solche Arbeiten, welche Andre für Uns machen können, z.B. Schlachten, Ackern usw.; die übrigen bleiben egoistisch, weil z.B. Niemand an Deiner Statt Deine musikalischen Kompositionen anfertigen, Deine Malerentwürfe ausführen usw. kann.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.248.2
  kind: p
  original: Raffaels Arbeiten kann Niemand ersetzen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.248.3
  kind: p
  original: Die letzteren sind Arbeiten eines Einzigen, die nur dieser Einzige zu vollbringen vermag, wahrend Jene menschliche" (p. 356 identisch gesetzt mit den "gemeinnützigen") "genannt zu werden verdienen, da das Eigne daran von geringem Belang ist und so ziemlich jeder Mensch dazu abgerichtet werden kann." p. 355.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.249.1
  kind: p
  original: '"Es ist immer fördersam, daß Wir Uns über die menschlichen Arbeiten einigen, damit sie nicht, wie unter der Konkurrenz, alle unsre Zeit und Mühe in Anspruch nehmen...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.249.2
  kind: p
  original: Für wen soll aber Zeit gewonnen werden?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.249.3
  kind: p
  original: Wozu braucht der Mensch mehr Zeit als nötig ist, seine abgespannten Arbeitskräfte zu erfrischen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.249.4
  kind: p
  original: Hier schweigt der Kommunismus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.249.5
  kind: p
  original: Wozu?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.249.6
  kind: p
  original: Um seiner als des Einzigen froh zu werden, nachdem er als Mensch das Seinige getan hat." p. 356, 357.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.250.1
  kind: p
  original: '"Durch Arbeit kann Ich die Amtsfunktionen eines Präsidenten, Ministers usw. versehen; es erfordern diese Ämter nur eine allgemeine Bildung. nämlich eine solche, die allgemein erreichbar ist...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.250.2
  kind: p
  original: Kann aber auch Jeder diese Ämter bekleiden, so gibt doch erst die einzige, ihm allein eigne Kraft des Einzelnen ihnen sozusagen Leben und Bedeutung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.250.3
  kind: p
  original: Daß er sein Amt nicht wie ein gewöhnlicher Mensch führt, sondern das Vermögen seiner Einzigkeit hineinlegt, das bezahlt man ihm noch nicht, wenn man ihn überhaupt nur als Beamten oder Minister bezahlt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.250.4
  kind: p
  original: Hat er's Euch zu Dank gemacht und wollt Ihr diese dankenswerte Kraft des Einzigen Euch erhalten, so werdet Ihr ihn nicht als einen bloßen Menschen bezahlen dürfen, der nur Menschliches verrichtet, sondern nur als Einen, der Einziges vollbringt." p. 362, 363.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: NT5B.251.1
  kind: p
  original: '"Vermagst Du Tausenden Lust zu bereiten, so werden Tausende Dich dafür honorieren, es stände ja in Deiner Gewalt, es zu unterlassen, daher müssen sie Deine Tat erkaufen." p. 351.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
- id: NT5B.252.1
  kind: p
  original: '"Über Meine Einzigkeit läßt sich keine allgemeine Taxe feststellen, wie für das, was Ich als Mensch tue.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
- id: NT5B.252.2
  kind: p
  original: Nur über das Letztere kann eine Taxe bestimmt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
- id: NT5B.252.3
  kind: p
  original: Setzt also immerhin eine allgemeine Taxe für menschliche Arbeiten auf, bringt aber Eure Einzigkeit nicht um ihren Verdienst." p. 363.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
- id: NT5B.253.1
  kind: p
  original: Als Beispiel der Organisation der Arbeit im Verein wird p. 365 die schon besprochene öffentliche Bäckerei angeführt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
- id: NT5B.253.2
  kind: p
  original: Diese öffentlichen Anstalten müssen wahre Wunder sein unter der oben vorausgesetzten vandalischen Parzellierung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
- id: NT5B.254.1
  kind: p
  original: Zuerst soll die menschliche Arbeit organisiert und dadurch verkürzt werden, damit Bruder Straubinger hinterher, wenn er früh Feierabend gemacht hat, "seiner als des Einzigen froh werden kann" (p. 357); während p. 363 das "Frohwerden" des Einzigen sich in seinen Extraverdienst auflöst. p. 363 kommt die Lebensäußerung des Einzigen nicht hinterdrein nach der menschlichen Arbeit, sondern die menschliche Arbeit kann als einzige betrieben werden und erfordert dann einen Lohnzuschuß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
- id: NT5B.254.2
  kind: p
  original: Der Einzige, dem es nicht um seine Einzigkeit, sondern um den höheren Lohn zu tun ist, könnte ja sonst seine Einzigkeit in den Kleiderschrank verschließen und der Gesellschaft zum Trotz sich damit begnügen, den gewöhnlichen Menschen und sich selbst damit einen Possen zu spielen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
- id: NT5B.255.1
  kind: p
  original: Nach p. 356 fällt die menschliche Arbeit mit der gemeinnützigen zusammen, aber nach p. 351 und 363 bewährt sich die einzige Arbeit eben darin, daß sie als gemeinnützige oder wenigstens Vielen nützliche extra honoriert wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
- id: NT5B.256.1
  kind: p
  original: Die Organisation der Arbeit im Verein besteht also in der Trennung der menschlichen Arbeit von der einzigen, in der Feststellung einer Taxe für die menschliche und in dem Mauscheln um einen Lohnzuschuß für die einzige Arbeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
- id: NT5B.256.2
  kind: p
  original: Dieser Lohnzuschuß ist wieder doppelt, nämlich einer für die einzige Ausführung der menschlichen Arbeit und ein anderer für die einzige Ausführung der einzigen Arbeit, was eine um so verwickeltere Buchführung gibt, als heute Das eine menschliche Arbeit wird, was gestern eine einzige war (z.B. Baumwollengarn Nr. 200 zu spinnen), und als der einzige Betrieb menschlicher Arbeiten eine fortwährende Selbstmoucharderie <Selbstbespitzelung> im eignen und allgemeine Moucharderie im öffentlichen Interesse erfordert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
- id: NT5B.256.3
  kind: p
  original: Dieser ganze wichtige Organisationsplan läuft also auf eine ganz kleinbürgerliche Aneignung des Gesetzes von Nachfrage und Zufuhr hinaus, das heute existiert und von allen Ökonomen entwickelt worden ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 376-377
- id: NT5B.256.4
  kind: p
  original: Sancho kann das Gesetz, wonach der Preis derjenigen Arbeiten sich bestimmt, die er für einzige erklärt, z.B. der einer Tänzerin, eines ausgezeichneten Arztes oder Advokaten, schon bei Adam Smith erklärt und bei dem Amerikaner Cooper taxiert finden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: NT5B.256.5
  kind: p
  original: Die neueren Ökonomen haben aus diesem Gesetz das hohe Salär dessen, was sie travail improductif <unproduktive Arbeit> nennen, und das niedrige der Ackerbautaglöhner, überhaupt die Ungleichheiten des Arbeitslohns erklärt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: NT5B.256.6
  kind: p
  original: Wir sind so mit Gottes Hülfe wieder bei der Konkurrenz angekommen, aber bei der Konkurrenz in einem gänzlich heruntergekommenen Zustande, so heruntergekommen, daß Sancho eine Taxe, eine Fixierung des Arbeitslohns durch Gesetze, wie weiland im 14. und 15. Jahrhundert, vorschlagen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: NT5B.257.1
  kind: p
  original: Es verdient noch erwähnt zu werden, daß die hier von Sancho ans Licht gebrachte Vorstellung sich ebenfalls als etwas ganz Neues bei dem Herrn Messias Dr. Georg Kuhlmann aus Holstein findet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: NT5B.258.1
  kind: p
  original: Was Sancho hier menschliche Arbeiten nennt, ist, mit Ausschluß seiner bürokratischen Phantasien, dasselbe, was man sonst unter Maschinenarbeit versteht und was die Entwicklung der Industrie mehr und mehr den Maschinen anheim gibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: NT5B.258.2
  kind: p
  original: In dem "Verein" sind freilich bei der oben geschilderten Organisation des Grundbesitzes die Maschinen eine Unmöglichkeit, und daher ziehen es die mit sich einigen Fronbauern vor, sich über diese Arbeiten zu verständigen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: NT5B.258.3
  kind: p
  original: Über "Präsidenten" und "Minister" urteilt Sancho, this poor localized being <dieses arme, an den Ort gebundene Wesen>, wie Owen sagt, nur nach seiner unmittelbaren Umgebung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: NT5B.259.1
  kind: p
  original: Wie immer hat Sancho hier wieder Unglück mit seinen praktischen Exempeln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: NT5B.259.2
  kind: p
  original: Er meint, Niemand könne "an Deiner Stelle Deine musikalischen Kompositionen anfertigen, Deine Malerentwürfe ausführen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: NT5B.259.3
  kind: p
  original: Raffaels Arbeiten könne Niemand ersetzen."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: NT5B.259.4
  kind: p
  original: Sancho könnte doch wohl wissen, daß nicht Mozart selbst, sondern ein Anderer Mozarts Requiem größtenteils angefertigt und ganz ausgefertigt, daß Raffael von seinen Fresken die wenigsten selbst "ausgeführt" hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: NT5B.260.1
  kind: p
  original: Er bildet sich ein, die sogenannten Organisateure der Arbeit wollten die Gesamttätigkeit jedes Einzelnen organisieren, während gerade bei ihnen zwischen der unmittelbar produktiven Arbeit, die organisiert werden soll, und der nicht unmittelbar produktiven Arbeit unterschieden wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: NT5B.260.2
  kind: p
  original: In diesen Arbeiten aber soll nach ihrer Meinung nicht, wie Sancho sich einbildet, Jeder an Raffaels Statt arbeiten, sondern Jeder, in dem ein Raffael steckt, sich ungehindert ausbilden können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: NT5B.260.3
  kind: p
  original: Sancho bildet sich ein, Raffael habe seine Gemälde unabhängig von der zu seiner Zeit in Rom bestehenden Teilung der Arbeit hervorgebracht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 377-378
- id: NT5B.260.4
  kind: p
  original: Wenn er Raffael mit Leonardo da Vinci und Tizian vergleicht, so kann er sehen, wie sehr die Kunstwerke des ersteren von der unter florentinischem Einfluß ausgebildeten damaligen Blüte Roms, die des zweiten von den Zuständen von Florenz, und später die des dritten von der ganz verschiedenen Entwicklung Venedigs bedingt waren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: NT5B.260.5
  kind: p
  original: Raffael, so gut wie jeder andre Künstler, war bedingt durch die technischen Fortschritte der Kunst, die vor ihm gemacht waren, durch die Organisation der Gesellschaft und die Teilung der Arbeit in seiner Lokalität und endlich durch die Teilung der Arbeit in allen Ländern, mit denen seine Lokalität im Verkehr stand.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: NT5B.260.6
  kind: p
  original: Ob ein Individuum wie Raffael sein Talent entwickelt, hängt ganz von der Nachfrage ab, die wieder von der Teilung der Arbeit und den daraus hervorgegangenen Bildungsverhältnissen der Menschen abhängt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: NT5B.261.1
  kind: p
  original: Stirner steht hier noch weit unter der Bourgeoisie, indem er die Einzigkeit der wissenschaftlichen und künstlerischen Arbeit proklamiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: NT5B.261.2
  kind: p
  original: Man hat es bereits jetzt für nötig gefunden, diese "einzige" Tätigkeit zu organisieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: NT5B.261.3
  kind: p
  original: Horace Vernet hätte nicht Zeit für den zehnten Teil seiner Gemälde gehabt, wenn er sie für Arbeiten angesehen hätte, "die nur dieser Einzige zu vollbringen vermag.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: NT5B.261.4
  kind: p
  original: Die große Nachfrage nach Vaudevilles und Romanen in Paris hat eine Organisation der Arbeit zur Produktion dieser Artikel hervorgerufen, die noch immer Besseres leistet als ihre "einzigen" Konkurrenten in Deutschland.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: NT5B.261.5
  kind: p
  original: In der Astronomie haben es Leute wie Arago, Herschel, Encke und Bessel für nötig gefunden, sich zu gemeinsamen Beobachtungen zu organisieren, und sind erst seitdem zu einigen erträglichen Resultaten gekommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: NT5B.261.6
  kind: p
  original: In der Geschichtschreibung ist es für den "Einzigen" absolut unmöglich, etwas zu leisten, und die Franzosen haben auch hier längst durch die Organisation der Arbeit allen andern Nationen den Rang abgelaufen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: NT5B.261.7
  kind: p
  original: Es versteht sich übrigens, daß alle diese auf der modernen Teilung der Arbeit beruhenden Organisationen immer noch zu höchst beschränkten Resultaten führen und nur gegenüber der bisherigen bornierten Vereinzelung ein Fortschritt sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: NT5B.262.1
  kind: p
  original: Es muß noch besonders hervorgehoben werden, daß Sancho die Organisation der Arbeit mit dem Kommunismus verwechselt und sich gar wundert, daß "der Kommunismus" ihm nicht auf seine Bedenken über diese Organisation antwortet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: NT5B.262.2
  kind: p
  original: So wundert sich ein Gascogner Bauernjunge, daß Arago ihm nicht zu sagen weiß, auf welchem Stern der liebe Gott seinen Hof aufgeschlagen habe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: NT5B.263.1
  kind: p
  original: Die exklusive Konzentration des künstlerischen Talents in Einzelnen und seine damit zusammenhängende Unterdrückung in der großen Masse ist Folge der Teilung der Arbeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 378-379
- id: NT5B.263.2
  kind: p
  original: Wenn selbst in gewissen gesellschaftlichen Verhältnissen Jeder ein ausgezeichneter Maler wäre, so schlösse dies noch gar nicht aus, daß Jeder auch ein origineller Maler wäre, so daß auch hier der Unterschied zwischen "menschlicher" und "einziger" Arbeit in bloßen Unsinn sich verläuft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '379'
- id: NT5B.263.3
  kind: p
  original: Bei einer kommunistischen Organisation der Gesellschaft fällt jedenfalls fort die Subsumtion des Künstlers unter die lokale und nationale Borniertheit, die rein aus der Teilung der Arbeit hervorgeht, und die Subsumtion des Individuums unter diese bestimmte Kunst, so daß es ausschließlich Maler, Bildhauer usw. ist und schon der Name die Borniertheit seiner geschäftlichen Entwicklung und seine Abhängigkeit von der Teilung der Arbeit hinlänglich ausdrückt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '379'
- id: NT5B.263.4
  kind: p
  original: In einer kommunistischen Gesellschaft gibt es keine Maler, sondern höchstens Menschen, die unter Anderm auch malen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '379'
- id: NT5B.264.1
  kind: p
  original: Sanchos Organisation der Arbeit zeigt deutlich, wie sehr alle diese philosophischen Ritter von der Substanz sich bei bloßen Phrasen beruhigen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '379'
- id: NT5B.264.2
  kind: p
  original: Die Subsumtion der "Substanz" unter das "Subjekt", wovon sie Alle so hohe Worte machen, die Herabsetzung der "Substanz", die das "Subjekt" beherrscht, zu einem bloßen "Akzidens" dieses Subjekts, zeigt sich als bloßes "leeres Gerede".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - NT5B.N8
  mew_page: '379'
- id: NT5B.264.3
  kind: p
  original: Sie unterlassen es daher weislich, auf die Teilung der Arbeit, auf die materielle Produktion und den materiellen Verkehr einzugehen, die eben die Individuen unter bestimmte Verhältnisse und Tätigkeitsweisen subsumieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '379'
- id: NT5B.264.4
  kind: p
  original: Es handelt sich bei ihnen überhaupt nur darum, neue Phrasen zur Interpretation der bestehenden Welt zu erfinden, die um so gewisser in burleske Prahlereien auslaufen, je mehr sie sich über diese Welt zu erheben glauben und in Gegensatz zu ihr stellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '379'
- id: NT5B.264.5
  kind: p
  original: Wovon Sancho ein beklagenswertes Beispiel ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '379'
- id: NT5B.265.1
  kind: heading
  original: 3. Geld
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '379'
- id: NT5B.266.1
  kind: p
  original: '"Das Geld ist eine Ware, und zwar ein wesentliches Mittel oder Vermögen; denn es schützt vor der Verknöcherung des Vermögens, hält es im Fluß und bewirkt seinen Umsatz.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.266.2
  kind: p
  original: Wißt Ihr ein besseres Tauschmittel, immerhin; doch wird es wieder ein Geld sein." p. 364.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.267.1
  kind: p
  original: p. 353 wird das Geld als "gangbares oder kursierendes Eigentum" bestimmt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.268.1
  kind: p
  original: Im "Verein" wird also das Geld beibehalten, dies rein gesellschaftliche Eigentum, dem alles Individuelle abgestreift ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.268.2
  kind: p
  original: Wie sehr Sancho in der bürgerlichen Anschauungsweise befangen ist, zeigt seine Frage nach einem besseren Tauschmittel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.268.3
  kind: p
  original: Er setzt also zuerst voraus, daß ein Tauschmittel überhaupt nötig ist, und dann kennt er kein anderes Tauschmittel als das Geld.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.268.4
  kind: p
  original: Daß ein Schiff, eine Eisenbahn, die Waren transportieren, ebenfalls Tauschmittel sind, kümmert ihn nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.268.5
  kind: p
  original: Um also nicht bloß vom Tauschmittel, sondern vom Gelde speziell zu sprechen, ist er genötigt, die übrigen Bestimmungen des Geldes, daß es das allgemein gangbare und kursierende Tauschmittel ist, alles Eigentum im Fluß erhält etc., hereinzunehmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.268.6
  kind: p
  original: Damit kommen auch die ökonomischen Bestimmungen herein, die Sancho nicht kennt, die aber gerade das Geld konstituieren; und mit ihnen auch der ganze jetzige Zustand, Klassenwirtschaft, Herrschaft der Bourgeoisie etc.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.269.1
  kind: p
  original: Wir erhalten indes zunächst einige Aufschlüsse über den - sehr originellen - Verlauf der Geldkrisen im Verein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.270.1
  kind: p
  original: 'Es entsteht die Frage:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.271.1
  kind: p
  original: '"Wo Geld hernehmen?...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.271.2
  kind: p
  original: Man bezahlt nicht mit Geld, woran Mangel eintreten kann, sondern mit seinem Vermögen, durch welches allein Wir vermögend sind...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.271.3
  kind: p
  original: Nicht das Geld tut Euch Schaden, sondern Euer Unvermögen, es zu nehmen."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.272.1
  kind: p
  original: 'Und nun der moralische Zuspruch:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.273.1
  kind: p
  original: '"Laßt Euer Vermögen wirken, nehmt Euch zusammen, und es wird an Geld, an Eurem Gelde, dem Gelde Eures Gepräges, nicht fehlen...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.273.2
  kind: p
  original: Wisse denn, Du hast so viel Geld, als Du - Gewalt hast; denn Du giltst soviel, als Du Dir Geltung verschaffst." p. 353, 364.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.274.1
  kind: p
  original: In der Macht des Geldes, in der Verselbständigung des allgemeinen Tauschmittels, sowohl der Gesellschaft wie den Einzelnen gegenüber, tritt die Verselbständigung der Produktions- und Verkehrsverhältnisse überhaupt am deutlichsten hervor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.274.2
  kind: p
  original: Also Sancho weiß, wie gewöhnlich, Nichts vom Zusammenhange der Geldverhältnisse mit der allgemeinen Produktion und dem Verkehr.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: NT5B.274.3
  kind: p
  original: Er behält als guter Bürgersmann das Geld ruhig bei, wie dies auch nach seiner Teilung der Arbeit und Organisation des Grundbesitzes nicht anders möglich ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 380-381
- id: NT5B.274.4
  kind: p
  original: Die sachliche Macht des Geldes, die in den Geldkrisen eklatant hervortritt und den "kauflustigen" Kleinbürger in der Gestalt eines permanenten Geldmangels drückt, ist dem mit sich einigen Egoisten ebenfalls ein höchst unangenehmes Faktum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: NT5B.274.5
  kind: p
  original: Er entledigt sich seiner Ungelegenheit dadurch, daß er die gewöhnliche Vorstellung des Kleinbürgers umgekehrt ausdrückt und dadurch den Schein hereinbringt, als sei die Stellung der Individuen gegenüber der Geldmacht eine rein vom persönlichen Wollen oder Laufen abhängige Sache.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: NT5B.274.6
  kind: p
  original: Diese glückliche Wendung gibt ihm dann Gelegenheit, dem erstaunten und vom Geldmangel ohnehin entmutigten Kleinbürger eine durch Synonymik, Etymologie und Umlaut unterstützte Moralpredigt zu halten und dadurch alle ungelegenen Fragen über die Ursachen der Geldklemme vorweg abzuschneiden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: NT5B.275.1
  kind: p
  original: Die Geldkrise besteht zunächst darin, daß alle "Vermögen" auf einmal gegenüber dem Tauschmittel depreziiert werden und das "Vermögen" über das Geld verlieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: NT5B.275.2
  kind: p
  original: Die Krise ist gerade dann da, wenn man nicht mehr mit seinem "Vermögen" zahlen kann, sondern mit Geld zahlen muß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: NT5B.275.3
  kind: p
  original: Dies findet wieder nicht dadurch statt, daß Mangel an Geld eintritt, wie der Kleinbürger sich vorstellt, der die Krise nach seiner Privatmisère beurteilt, sondern dadurch, daß der spezifische Unterschied des Geldes als der allgemeinen Ware, des "gangbaren und kursierenden Eigentums", von allen andern speziellen Waren sich fixiert, die plötzlich aufhören, gangbares Eigentum zu sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: NT5B.275.4
  kind: p
  original: Die Ursachen dieses Phänomens hier, Sancho zu Gefallen, zu entwickeln, kann nicht erwartet werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: NT5B.275.5
  kind: p
  original: Den geld- und trostlosen Kleinkrämern gibt Sancho nun zunächst den Trost, daß nicht das Geld die Ursache des Geldmangels und der ganzen Krise sei, sondern ihr Unvermögen, es zu nehmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: NT5B.275.6
  kind: p
  original: Nicht der Arsenik ist schuld daran, daß Jemand stirbt, der ihn gegessen hat, sondern das Unvermögen seiner Konstitution, Arsenik zu verdauen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: NT5B.276.1
  kind: p
  original: Nachdem Sancho vorher das Geld als ein wesentliches, und zwar spezifisches Vermögen, als allgemeines Tauschmittel, als Geld im gewöhnlichen Verstande bestimmt hat, dreht er auf einmal, sowie er sieht, zu welchen Schwierigkeiten dies führen würde, die Sache um und erklärt alles Vermögen für Geld, um den Schein der persönlichen Macht hervorzubringen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: NT5B.276.2
  kind: p
  original: Die Schwierigkeit während der Krise ist eben, daß "alles Vermögen" aufgehört hat, "Geld" zu sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: NT5B.276.3
  kind: p
  original: Übrigens läuft dies auf die Praxis des Bürgers hinaus, der "alles Vermögen" solange an Zahlungs Statt annimmt, als es Geld ist, und erst dann Schwierigkeiten macht, wenn es schwierig wird, dies "Vermögen" in Geld zu verwandeln, Wo er es dann auch nicht mehr für ein "Vermögen" ansieht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: NT5B.276.4
  kind: p
  original: Die Schwierigkeit in der Krisis besteht ferner gerade darin, daß Ihr Kleinbürger, zu denen Sancho hier spricht, das Geld Eures Gepräges, Eure Wechsel nicht mehr zirkulieren lassen könnt, sondern daß man Geld von Euch verlangt, woran Ihr nichts mehr zu prägen hattet und dem kein Mensch es ansieht, daß es durch Eure Finger gegangen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 381-382
- id: NT5B.277.1
  kind: p
  original: 'Endlich verdreht Stirner das bürgerliche Motto: Du giltst so viel, als Du Geld hast, dahin: Du hast so viel Geld, als Du giltst, womit nichts verändert, sondern nur der Schein der persönlichen Macht hereingebracht und damit die triviale Bourgeoisillusion ausgedrückt ist, daß Jeder selbst schuld daran sei, wenn er kein Geld habe.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: NT5B.277.2
  kind: p
  original: 'So wird Sancho fertig mit dem klassischen Bourgeoisspruch: L''argent n''a pas de maître <Das Geld hat keinen Herrn>, und kann nun auf die Kanzel steigen und ausrufen: "Lasset Eure Vermögen wirken, nehmt Euch zusammen, und es wird am Gelde nicht fehlen!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: NT5B.277.3
  kind: p
  original: Je ne connais pas de lieu à la bourse où se fasse le transfert des bonnes intentions <Ich kenne keine Stelle an der Börse, wo gute Absichten gehandelt werden>.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: NT5B.277.4
  kind: p
  original: 'Er brauchte nur noch hinzuzusetzen: Verschafft Euch Kredit, knowledge is power <Wissen ist Macht>, der erste Taler ist schwerer zu erwerben als die letzte Million, seid mäßig und haltet das Eurige zu Rate, besonders aber pulluliert nicht zu viel usw., um statt des einen beide Eselsohren hervorblicken zu lassen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: NT5B.277.5
  kind: p
  original: Überhaupt endigen bei dem Manne, für den Jeder ist, was er sein kann, und tut, was er tun kann, alle Kapitel mit moralischen Postulaten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: NT5B.278.1
  kind: p
  original: Das Geldwesen im Stirnerschen Verein ist also das existierende Geldwesen, ausgedrückt in der beschönigenden und gemütlich-schwärmerischen Weise eines deutschen Kleinbürgers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: NT5B.279.1
  kind: p
  original: Nachdem Sancho auf diese Weise mit den Ohren seines Grauen paradiert hat, richtet sich Szeliga-Don Quijote in seiner ganzen Länge auf, um mit einer feierlichen Rede über die moderne fahrende Ritterschaft, wobei das Geld in die Dulcinea von Toboso verwandelt wird, die Fabrikanten und Commerçants en masse <Kaufleute in Massen> zu Rittern, nämlich Industrierittern, zu schlagen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: NT5B.279.2
  kind: p
  original: Die Rede hat noch den Nebenzweck, zu beweisen, daß das Geld, weil ein "wesentliches Mittel", auch "wesentlich Tochter ist".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - NT5B.N9
  mew_page: '382'
- id: NT5B.279.3
  kind: p
  original: 'Und er reckte seine Rechte aus und sprach:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: NT5B.280.1
  kind: p
  original: '"Vom Gelde hängt Glück und Unglück ab.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: NT5B.280.2
  kind: p
  original: Es ist darum in der Bürgerperiode eine Macht, weil es nur wie ein Mädchen" (Viehmädchen, per appos[itionem] Dulcinea) "umworben, von Niemand unauflöslich geehlicht wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: NT5B.280.3
  kind: p
  original: Alle Romantik und Ritterlichkeit des Werbens um einen teuren Gegenstand lebt in der Konkurrenz wieder auf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 382-383
- id: NT5B.280.4
  kind: p
  original: Das Geld, ein Gegenstand der Sehnsucht, wird von den kühnen Industrierittern entführt." p. 364.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.281.1
  kind: p
  original: Sancho hat jetzt einen tiefen Aufschluß darüber erhalten, weshalb das Geld in der Bürgerperiode eine Macht ist, nämlich erstens, weil von ihm Glück und Unglück abhängt, und zweitens, weil es ein Mädchen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.281.2
  kind: p
  original: Er hat ferner erfahren, weshalb er um sein Geld kommen kann, nämlich, weil ein Mädchen von Niemand unauflöslich geehlicht wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.281.3
  kind: p
  original: Jetzt weiß der arme Schlucker, woran er ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.282.1
  kind: p
  original: 'Szeliga, der so den Bürger zum Ritter gemacht hat, macht nun folgendermaßen den Kommunisten zum Bürger, und zwar zum bürgerlichen Ehemann:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.283.1
  kind: p
  original: '"Wer das Glück hat, führt die Braut heim.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.283.2
  kind: p
  original: Der Lump hat das Glück; er führt sie in sein Hauswesen, die Gesellschaft, ein und vernichtet die Jungfrau.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.283.3
  kind: p
  original: In seinem Hause ist sie nicht mehr Braut, sondern Frau, und mit der Jungfräulichkeit geht auch der Geschlechtsname verloren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.283.4
  kind: p
  original: Als Hausfrau heißt die Geldjungfer Arbeit, denn Arbeit ist der Name des Mannes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.283.5
  kind: p
  original: Sie ist ein Besitz des Mannes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.283.6
  kind: p
  original: '- Um dies Bild zu Ende zu bringen, so ist das Kind von Arbeit und Geld wieder ein Mädchen" ("wesentlich Tochter"), "ein unverehlichtes" (ist dem Szeliga je vorgekommen, daß ein Mädchen "verehlicht" aus dem Mutterleibe gekommen ist?), "also Geld".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.283.7
  kind: p
  original: (Nach dem obigen Beweise, daß alles Geld "ein unverehlichtes Mädchen" sei, leuchtet es von selbst ein, daß "alle unverehlichten Mädchen" "Geld" sind) - "also Geld, aber mit der gewissen Abstammung von der Arbeit, seinem Vater" (toute recherche de la paternité est interdite <Die Suche nach der Vaterschaft ist verboten (Code Napoleon)>).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.283.8
  kind: p
  original: '"Die Gesichtsform, das Bild, trägt ein anderes Gepräge." p. 364, 365.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.284.1
  kind: p
  original: Diese Hochzeits-, Leichenbitter- und Kindtaufsgeschichte beweist wohl durch sich selbst hinlänglich, wie sehr sie "wesentlich Tochter" Szeligas, und zwar Tochter von "gewisser Abstammung" ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.284.2
  kind: p
  original: Ihren letzten Grund hat sie indes in der Unwissenheit seines ehmaligen Stallknechts Sancho.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.284.3
  kind: p
  original: Diese tritt deutlich heraus am Schluß, wo der Redner wieder um das "Gepräge" des Geldes ängstlich besorgt ist und dadurch verrät, daß er noch immer das Metallgeld für das wichtigste zirkulierende Medium hält.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.284.4
  kind: p
  original: Wenn er sich um die ökonomischen Verhältnisse des Geldes etwas näher bekümmert hätte, statt ihm einen schönen grünen Jungfernkranz zu flechten, so würde er wissen, daß, von Staatspapieren, Aktien pp. nicht zu sprechen, die Wechsel den größten Teil des zirkulierenden Mediums ausmachen, während das Papiergeld ein verhältnismäßig sehr kleiner und das Metallgeld ein noch kleinerer Teil davon ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.284.5
  kind: p
  original: In England zirkuliert z.B. fünfzehnmal mehr Geld in Wechseln und Banknoten als in Metall.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.284.6
  kind: p
  original: Und selbst was das Metallgeld betrifft, so wird es rein durch die Produktionskosten, d.h. die Arbeit bestimmt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: NT5B.284.7
  kind: p
  original: Stirners weitläuftiger Zeugungsprozeß war also hier überflüssig.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 383-384
- id: NT5B.284.8
  kind: p
  original: '- Die feierlichen Reflexionen, die Szeliga über ein auf der Arbeit beruhendes und doch vom jetzigen Gelde unterschiedenes Tauschmittel anstellt, das er bei einigen Kommunisten entdeckt haben will, beweisen nur wieder die Einfalt, mit der unser edles Paar Alles unbesehen glaubt, was es liest.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: NT5B.285.1
  kind: p
  original: Beide führen, wenn sie nach dieser ritterlichen und "romantischen" Kampagne "des Werbens" nach Hause reiten, kein "Glück" heim, noch weniger "die Braut", am allerwenigsten "Geld", sondern höchstens ein "Lump" den andern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: NT5B.286.1
  kind: heading
  original: 4. Staat
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: NT5B.287.1
  kind: p
  original: Wir haben gesehen, wie Sancho in seinem "Verein" die bestehende Form des Grundbesitzes, die Teilung der Arbeit und das Geld in der Weise, wie diese Verhältnisse in der Vorstellung eines Kleinbürgers leben, beibehält.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: NT5B.287.2
  kind: p
  original: Daß nach diesen Prämissen Sancho den Staat nicht entbehren kann, leuchtet auf den ersten Blick ein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: NT5B.288.1
  kind: p
  original: Zunächst wird sein neuerworbenes Eigentum die Form des garantierten, rechtlichen Eigentums anzunehmen haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: NT5B.288.2
  kind: p
  original: 'Wir haben schon gehört:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: NT5B.289.1
  kind: p
  original: '"Dasjenige, woran Alle Anteil haben wollen, wird demjenigen Einzelnen entzogen werden, der es für sich allein haben will." (p. 330.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: NT5B.290.1
  kind: p
  original: Hier wird also der Wille der Gesamtheit geltend gemacht gegenüber dem Willen des vereinzelten Einzelnen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: NT5B.290.2
  kind: p
  original: Da jeder der mit sich einigen Egoisten mit den Andern uneinig werden und damit in diesen Widerspruch treten kann, muß der Gesamtwille auch einen Ausdruck haben gegenüber den vereinzelten Einzelnen -
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: NT5B.291.1
  kind: p
  original: '"und man nennt diesen Willen den Staatswillen " (p. 257).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: NT5B.292.1
  kind: p
  original: Seine Bestimmungen sind dann die rechtlichen Bestimmungen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: NT5B.292.2
  kind: p
  original: Die Exekution dieses Gesamtwillens wird wieder Repressivmaßregeln und eine öffentliche Gewalt nötig machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: NT5B.293.1
  kind: p
  original: '"Vereine werden dann auch in dieser Sache" (dem Eigentum) "die Mittel des Einzelnen multiplizieren und sein angefochtenes Eigentum sicherstellen " (garantieren also garantiertes Eigentum, also rechtliches Eigentum, also Eigentum, das Sancho nicht "unbedingt" besitzt, sondern vom "Verein" "zu Lehen trägt"). p. 342.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: NT5B.294.1
  kind: p
  original: 'Mit den Eigentumsverhältnissen versteht sich dann, daß das ganze Zivilrecht wiederhergestellt wird, und Sancho selbst trägt z.B. die Lehre vom Vertrag ganz im Sinne der Juristen vor, wie folgt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: NT5B.295.1
  kind: p
  original: '"Auch hat es Nichts zu sagen, wenn Ich selbst Mich um diese und jene Freiheit bringe, z.B. durch jeden Kontrakt." p. 409.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: NT5B.296.1
  kind: p
  original: Und um die "angefochtenen" Kontrakte "sicherzustellen", wird es ebenfalls "Nichts zu sagen haben", wenn er sich wieder einem Gerichte und allen jetzigen Folgen eines Zivilprozesses zu unterwerfen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: NT5B.297.1
  kind: p
  original: So rücken wir "allgemach aus Dämmerung und Nacht" den bestehenden Verhältnissen wieder näher, nur den bestehenden Verhältnissen in der zwerghaften Vorstellung des deutschen Kleinbürgers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: NT5B.298.1
  kind: p
  original: 'Sancho gesteht:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: NT5B.299.1
  kind: p
  original: '"In bezug auf die Freiheit unterliegen Staat und Verein keiner wesentlichen Verschiedenheit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: NT5B.299.2
  kind: p
  original: Der letztere kann ebensowenig entstehen und bestehen, ohne daß die Freiheit auf allerlei Art beschränkt werde, als der Staat mit ungemessener Freiheit sich verträgt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: NT5B.299.3
  kind: p
  original: Beschränkung der Freiheit ist überall unabwendbar, denn man kann nicht Alles loswerden; man kann nicht gleich einem Vogel fliegen, bloß weil man so fliegen möchte etc....
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: NT5B.299.4
  kind: p
  original: Der Unfreiheit und Unfreiwilligkeit wird der Verein noch genug enthalten, denn sein Zweck ist eben nicht die Freiheit, die er im Gegenteil der Eigenheit opfert, aber auch nur der Eigenheit." p.410, 411.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: NT5B.300.1
  kind: p
  original: Abgesehen einstweilen von der komischen Distinktion zwischen Freiheit und Eigenheit, so hat Sancho seine "Eigenheit" in seinem Vereine durch die ökonomischen Einrichtungen schon geopfert, ohne es zu wollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: NT5B.300.2
  kind: p
  original: Als echter "Staatsgläubiger" sieht er erst da eine Beschränkung, wo die politischen Einrichtungen anfangen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: NT5B.300.3
  kind: p
  original: Er läßt die alte Gesellschaft fortbestehen und mit ihr die Subsumtion der Individuen unter die Teilung der Arbeit; wobei er dann dem Schicksal nicht entgehen kann, von der Teilung der Arbeit und der ihm dadurch zugefallenen Beschäftigung und Lebenslage eine aparte "Eigenheit" sich vorschreiben zu lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: NT5B.300.4
  kind: p
  original: Wird ihm z.B. das Los angewiesen, in Willenhall als Schlossergesell zu arbeiten, so wird seine aufgedrungene "Eigenheit" in einer Verdrehung der Hüftknochen bestehen, die ihm ein "Hinterbein" verschafft; wird "das Titelgespenst seines Buchs" als Throstlespinnerin <Ringspinnerin> existieren müssen, so wird ihre "Eigenheit" in steifen Knien bestehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: NT5B.300.5
  kind: p
  original: Selbst wenn unser Sancho bei seinem alten Beruf des Fronbauers bleibt, den ihm schon Cervantes angewiesen hat und den er jetzt für seinen eignen Beruf erklärt, zu dem er sich beruft, so fällt ihm kraft der Teilung der Arbeit und der Trennung von Stadt und Land die "Eigenheit" zu, von allem Weltverkehr und folglich von aller Bildung ausgeschlossen ein bloßes Lokaltier zu werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: NT5B.301.1
  kind: p
  original: So verliert Sancho im Verein seine Eigenheit malgré lui <gegen seinen Wilen> durch die gesellschaftliche Organisation, wenn wir einmal ausnahmsweise die Eigenheit im Sinne von Individualität nehmen wollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: NT5B.301.2
  kind: p
  original: Daß er nun auch durch die politische Organisation seine Freiheit aufgibt, ist ganz konsequent und beweist nur noch deutlicher, wie sehr er den jetzigen Zustand im Verein sich anzueignen strebt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 385-386
- id: NT5B.302.1
  kind: p
  original: Die wesentliche Verschiedenheit von Freiheit und Eigenheit bildet also den Unterschied zwischen dem jetzigen Zustande und dem "Verein".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: NT5B.302.2
  kind: p
  original: Wie wesentlich dieser Unterschied ist, haben wir bereits gesehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: NT5B.302.3
  kind: p
  original: Die Majorität seines Vereins wird sich ebenfalls an dieser Distinktion möglicherweise nicht stören, sondern das "Lossein" von ihr dekretieren, und wenn er sich dabei nicht beruhigt, wird sie ihm aus seinem eignen "Buche" beweisen, daß es erstens keine Wesen gibt, sondern Wesen und wesentliche Unterschiede "das Heilige" sind; zweitens, daß der Verein nach "der Natur der Sache" und "dem Begriff des Verhältnisses" gar nichts zu fragen hat, und drittens, daß sie keineswegs seine Eigenheit antastet, sondern nur seine Freiheit, sie zu äußern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: NT5B.302.4
  kind: p
  original: Sie wird ihm vielleicht beweisen, wenn er "sich bestrebt, verfassungslos zu werden", daß sie nur seine Freiheit beschränkt, wenn sie ihn einsperrt, ihm Hiebe diktiert, ihm ein Bein ausreißt, daß er partout et toujours <überall und immer> "eigen" ist, solange er noch die Lebensäußerungen eines Polypen, einer Auster, ja eines galvanisierten Froschleichnams von sich zu geben vermag.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: NT5B.302.5
  kind: p
  original: Sie wird ihm für seine Arbeit eine "Preisbestimmung setzen", wie wir schon hörten, "eine wirkliche freie " (!)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: NT5B.302.6
  kind: p
  original: '"Verwertung seines Eigentums nicht zulassen", da sie ihm hiermit die Freiheit, nicht die Eigenheit beschränkt; Dinge, die Sancho p. 338 dem Staate vorwirft.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: NT5B.302.7
  kind: p
  original: '"Was soll also" der Fronbauer Sancho "anfangen?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: NT5B.302.8
  kind: p
  original: Auf sich halten und nach dem" Verein "nichts fragen". (ibid.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: NT5B.302.9
  kind: p
  original: Sie wird ihm schließlich insinuieren, sooft er gegen die ihm gesetzte Schranke poltert, daß, solange er die Eigenheit hat, Freiheiten für Eigenheiten zu erklären, sie sich die Freiheit nimmt, seine Eigenheiten für Freiheiten anzusehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: NT5B.303.1
  kind: p
  original: Wie oben der Unterschied zwischen menschlicher und einziger Arbeit nur eine kümmerliche Aneignung des Gesetzes von Nachfrage und Zufuhr war, so ist jetzt der Unterschied zwischen Freiheit und Eigenheit eine kümmerliche Aneignung des Verhältnisses von Staat und bürgerlicher Gesellschaft, oder, wie Herr Guizot sagt, der liberté individuelle <individuellen Freiheit> und des pouvoir public <öffentlichen Gewalt>.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: NT5B.303.2
  kind: p
  original: 'Dies ist so sehr der Fall, daß er im Folgenden den Rousseau fast wörtlich abschreiben kann:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: NT5B.304.1
  kind: p
  original: '"Die Übereinkunft, der Jeder einen Teil seiner Freiheit opfern muß", geschieht "ganz und gar nicht um eines Allgemeinen oder auch nur um eines andern Menschen willen", sondern "Ich ging vielmehr nur auf sie ein aus Eigennutz.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: NT5B.304.2
  kind: p
  original: Was aber das Opfern betrifft, so opfere Ich doch wohl nur Dasjenige, was nicht in Meiner Gewalt steht, d.h. opfere gar Nichts." p. 418.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: NT5B.305.1
  kind: p
  original: Diese Qualität teilt der mit sich einige Fronbauer mit jedem andern Fronbauer und überhaupt mit jedem Individuum, das je auf der Welt gelebt hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: NT5B.305.2
  kind: p
  original: Vergleiche auch Godwin, "Political Justice".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: NT5B.305.3
  kind: p
  original: '- Sancho scheint, nebenbei bemerkt, die Eigenheit zu besitzen, zu glauben, bei Rousseau schlössen die Individuen den Vertrag dem Allgemeinen zuliebe, was Rousseau nie eingefallen ist.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: NT5B.306.1
  kind: p
  original: Indessen Ein Trost ist ihm geblieben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: NT5B.307.1
  kind: p
  original: '"Der Staat ist heilig... der Verein aber ist... nicht heilig."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: NT5B.307.2
  kind: p
  original: Und darin besteht "der große Unterschied zwischen Staat und Verein". p. 411.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: NT5B.308.1
  kind: p
  original: Dieser ganze Unterschied läuft also darauf hinaus, daß der "Verein" der wirkliche moderne Staat und der "Staat" die Stirnersche Illusion vom preußischen Staat ist, den er für den Staat überhaupt versieht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: NT5B.309.1
  kind: heading
  original: 5. Empörung
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: NT5B.310.1
  kind: p
  original: Sancho traut seinen feinen Distinktionen zwischen Staat und Verein, heilig und nicht heilig, menschlich und einzig, Eigenheit und Freiheit usw. schließlich mit Recht so wenig, daß er zur ultima ratio <letzten Mittel> des mit sich einigen Egoisten seine Zuflucht nimmt - zur Empörung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: NT5B.310.2
  kind: p
  original: Diesmal indes empört er sich nicht gegen sich selbst, wie er früher vorgab, sondern gegen den Verein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: NT5B.310.3
  kind: p
  original: Wie er sich über alle Punkte erst im Verein klarzuwerden suchte, so auch hier mit der Empörung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: NT5B.311.1
  kind: p
  original: '"Macht Mir''s die Gemeinde nicht recht, so empöre Ich Mich gegen sie und verteidige Mein Eigentum." p. 343,'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: NT5B.312.1
  kind: p
  original: '"Gedeiht" die Empörung nicht, so wird der Verein "ihn ausschließen (einsperren, verbannen usw.)". p. 256, 257.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: NT5B.313.1
  kind: p
  original: Sancho sucht sich hier die droits de l'homme <Menschenrechte> von 1793, unter denen auch das Recht der Insurrektion aufgezählt wird, anzueignen, ein Menschenrecht, das natürlich bittere Früchte für den trägt, der davon nach seinem "eignen" Sinn Gebrauch macht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: NT5B.314.1
  kind: p
  original: Der ganze Verein Sanchos läuft also auf Folgendes hinaus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: NT5B.314.2
  kind: p
  original: Während er früher in der Kritik die bestehenden Verhältnisse nur nach der Seite der Illusion betrachtete, sucht er im Verein diese Verhältnisse ihrem wirklichen Inhalt nach kennenzulernen und diesen Inhalt gegen die früheren Illusionen geltend zu machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 387-388
- id: NT5B.314.3
  kind: p
  original: Bei diesem Versuch mußte unser ignoranter Schulmeister natürlich mit Eklat scheitern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.314.4
  kind: p
  original: Er hat sich ausnahmsweise einmal bestrebt, sich "die Natur der Sache" und "den Begriff des Verhältnisses" anzueignen, aber es ist ihm nicht gelungen, irgendeiner Sache oder einem Verhältnis "den Geist der Fremdheit abzustreifen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.315.1
  kind: p
  original: Nachdem wir jetzt den Verein in seiner wirklichen Gestalt kennenlernten, bleibt uns nur noch übrig, die schwärmerischen Vorstellungen, die Sancho sich von ihm macht, die Religion und Philosophie des Vereins, zu betrachten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.316.1
  kind: heading
  original: 6. Religion und Philosophie des Vereins
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.317.1
  kind: p
  original: Wir fangen hier wieder mit dem Punkte an, mit dem wir oben die Darstellung des Vereins eröffneten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.317.2
  kind: p
  original: Sancho gebraucht zwei Kategorien, Eigentum und Vermögen; die Illusionen über das Eigentum entsprechen hauptsächlich den gegebenen positiven Daten über das Grundeigentum, die über das Vermögen den Daten über die Organisation der Arbeit und das Geldwesen im "Verein".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.318.1
  kind: heading
  original: A. Eigentum
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.319.1
  kind: p
  original: p. 331.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.319.2
  kind: p
  original: '"Mir gehört die Welt."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.320.1
  kind: p
  original: Interpretation seiner Erbpacht an der Parzelle.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.321.1
  kind: p
  original: p. 343.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.321.2
  kind: p
  original: '"Ich bin Eigentümer von Allem, dessen Ich brauche",'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.322.1
  kind: p
  original: eine beschönigende Umschreibung davon, daß seine Bedürfnisse seine Habe sind und daß das, was er als Fronbauer braucht, durch seine Verhältnisse bedingt ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.322.2
  kind: p
  original: In derselben Weise behaupten die Ökonomen, daß der Arbeiter Eigentümer von Allem ist, was er als Arbeiter braucht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.322.3
  kind: p
  original: Siehe die Entwicklung über das Minimum des Salärs bei Ricardo.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.323.1
  kind: p
  original: p. 343.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.323.2
  kind: p
  original: '"Jetzt aber gehört Alles Mir."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.324.1
  kind: p
  original: Musikalischer Tusch zu seiner Lohntaxe, seiner Parzelle, seiner permanenten Geldklemme und seinem Ausgeschlossensein von Allem, wovon die "Sozietät" nicht will, daß er es allein besitze.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.324.2
  kind: p
  original: 'Derselbe Satz findet sich p. 327 auch so ausgedrückt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.325.1
  kind: p
  original: '"Seine" (sc. des Andern) "Güter sind Mein, und Ich schalte damit als Eigentümer nach dem Maße Meiner Gewalt."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: NT5B.326.1
  kind: p
  original: 'Dies hochtönende Allegro marciale <flotte Marschweise> geht folgendermaßen in eine sanfte Kadenz über, in welcher es allmählich ganz auf den Hintern fällt - gewöhnliches Schicksal Sanchos:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 388-389
- id: NT5B.327.1
  kind: p
  original: 'p. 331: "Mir gehört die Welt, Sagt Ihr (Kommunisten) etwas Anderes mit dem umgekehrten Satze: Allen gehört die Welt?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.327.2
  kind: p
  original: Alle sind Ich und wieder Ich usw." (z.B. "Robespierre, z.B. Saint Just usw.")
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.328.1
  kind: p
  original: 'p. 415: "Ich bin Ich und Du bist Ich, aber... dieses Ich, worin Wir alle gleich sind, ist nur Mein Gedanke -- eine Allgemeinheit" (des Heilige).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.329.1
  kind: p
  original: Die praktische Variation dieses Themas findet sich
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.330.1
  kind: p
  original: p. 330, wo die "Einzelnen als eine Gesamtmasse" (d.h. Alle) dem "vereinzelten Einzelnen" (d.h. Ich im Unterschied von Alle) als regulierende Macht gegenübergestellt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.331.1
  kind: p
  original: Diese Dissonanzen lösen sich also schließlich in den beruhigenden Schlußakkord auf, daß, was Ich nicht besitze, jedenfalls das Eigentum eines andern "Ich" ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.331.2
  kind: p
  original: Das "Eigentum an Allem" ist hiermit nur die Interpretation davon, daß Jeder ein ausschließliches Eigentum besitzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.332.1
  kind: p
  original: p. 336.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.332.2
  kind: p
  original: '"Eigentum ist aber nur Mein Eigentum, wenn Ich dasselbe unbedingt innehabe.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.332.3
  kind: p
  original: Als unbedingtes Ich habe Ich Eigentum, treibe freien Handel."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.333.1
  kind: p
  original: Wir wissen schon, daß, wenn die Handelsfreiheit und Unbedingtheit im Verein nicht respektiert wird, damit nur die Freiheit und nicht die Eigenheit angetastet wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.333.2
  kind: p
  original: Das "unbedingte Eigentum" ist ein passendes Supplement zu dem "sichergestellten", garantierten Eigentum im Verein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.334.1
  kind: p
  original: p. 342.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.334.2
  kind: p
  original: '"Nach der Meinung der Kommunisten soll die Gemeinde Eigentümerin sein.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.334.3
  kind: p
  original: Umgekehrt, Ich bin Eigentümer und verständige Mich nur mit Anderen über Mein Eigentum."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.335.1
  kind: p
  original: Nach p.329 sahen wir, wie "sich die société <Gesellschaft> zur Eigentümerin macht", und nach p.330, wie sie "die Einzelnen von ihrem Eigentum ausschließt".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.335.2
  kind: p
  original: Überhaupt sahen wir das Stammlehnswesen, den rohesten Anfang des Lehnswesens, eingeführt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.335.3
  kind: p
  original: Nach p. 416 ist "Feudalwesen = Eigentumslosigkeit", weswegen nach ebenderselben Pagina "im Vereine und nur im Vereine das Eigentum anerkannt wird", und zwar aus dem zureichenden Grunde, "weil man das Seine von keinem Wesen mehr zum Lehen trägt". (ibid.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.335.4
  kind: p
  original: D.h., in dem bisherigen Lehnswesen war "das Wesen" der Lehnsherr, im Verein ist es die société.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.335.5
  kind: p
  original: Woraus wenigstens soviel hervorgeht, daß Sancho ein "ausschließliches", aber keineswegs "sichergestelltes" Eigentum am "Wesen" der bisherigen Geschichte hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '389'
- id: NT5B.336.1
  kind: p
  original: Im Zusammenhang mit p.330, wonach jeder Einzelne von dem ausgeschlossen wird, wovon es der Sozietät nicht recht ist, daß er es allein besitzt, und mit dem Staats- und Rechtswesen des Vereins steht
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 389-390
- id: NT5B.337.1
  kind: p
  original: 'p. 369: "Rechtliches und rechtmäßiges Eigentum eines Andern wird nur dasjenige sein, wovon Dir''s recht ist, daß es sein Eigentum sei.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.337.2
  kind: p
  original: Hört es auf, Dir recht zu sein, so hat es für Dich seine Rechtmäßigkeit eingebüßt, und das absolute Recht daran wirst Du verlachen."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.338.1
  kind: p
  original: Er dokumentiert hiermit das erstaunliche Faktum, daß das, was Rechtens im Verein ist, ihm nicht recht zu sein braucht - ein unbestreitbares Menschenrecht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.338.2
  kind: p
  original: Findet sich im Verein die Institution der altfranzösischen Parlamente, die Sancho ja so sehr liebt, so wird er sogar seinen zu Protokoll gegebenen Widerwillen auf dem Greffe <[auf der] Gerichtsbarkeit> deponieren können und dabei den Trost behalten, daß "man nicht von Allem los sein kann".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.339.1
  kind: p
  original: Die bisherigen Sätze scheinen mit sich, untereinander und mit der Wirklichkeit des Vereins im Widerspruch zu stehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.339.2
  kind: p
  original: Der Schlüssel zum Rätsel liegt indes in der schon angeführten juristischen Fiktion, daß da, wo er vom Eigentum Anderer ausgeschlossen wird, er sich bloß mit diesen Andern verständigt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.339.3
  kind: p
  original: 'Diese Fiktion wird in folgenden Sätzen näher ausgeführt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.340.1
  kind: p
  original: p. 369.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.340.2
  kind: p
  original: '"Das nimmt ein Ende" (sc. der Respekt vor dem fremden Eigentum), "wenn Ich jenen Baum zwar einem Andern überlassen kann, wie Ich meinen Stock usw. einem Andern überlasse, aber nicht von vornherein ihn Mir als fremd, d.h. heilig betrachte, Vielmehr... er bleibt mein Eigentum, auf solange Ich ihn auch an Andre abtrete, er ist und bleibt Mein.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.340.3
  kind: p
  original: In dem Vermögen des Bankiers sehe Ich Nichts Fremdes."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.341.1
  kind: p
  original: p. 328.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.341.2
  kind: p
  original: '"Vor Deinem und Eurem Eigentum trete Ich nicht scheu zurück, sondern sehe es stets als Mein Eigentum an, woran Ich Nichts zu respektieren brauche.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.341.3
  kind: p
  original: Tut doch desgleichen mit dem, was Ihr Mein Eigentum nennt Bei dieser Ansicht werden Wir uns am leichtesten miteinander verständigen."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.342.1
  kind: p
  original: Wenn Sancho nach den Statuten des Vereins "mit Kolben gelaust" wird, sobald er nach fremdem Eigentum zugreift, so wird er zwar behaupten, es sei seine "Eigenheit", lange Finger zu machen, aber der Verein wird dekretieren, Sancho habe sich nur eine "Freiheit" herausgenommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.342.2
  kind: p
  original: Und wenn Sancho so "frei" ist, zuzugreifen, so hat der Verein die "Eigenheit", ihm dafür Hiebe zu diktieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.343.1
  kind: p
  original: Die Sache selbst ist die.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.343.2
  kind: p
  original: Das bürgerliche, und zwar speziell das kleinbürgerliche und kleinbäuerliche Eigentum bleibt im Verein bestehen, wie wir sahen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.343.3
  kind: p
  original: Nur die Interpretation, die " Ansicht ", ist eine verschiedene, weshalb auch Sancho den Akzent stets auf das "Ansehen" legt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: NT5B.343.4
  kind: p
  original: Die "Verständigung" wird damit vollzogen, daß diese neue Philosophie des Ansehens beim ganzen Verein zu Ansehen kommt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 390-391
- id: NT5B.343.5
  kind: p
  original: Diese Philosophie besteht darin, daß erstens jedes Verhältnis, sei es durch ökonomische Bedingungen oder durch direkten Zwang herbeigeführt, für ein Verhältnis der "Verständigung" angesehen wird; zweitens, daß man sich einbildet, alles Eigentum Andrer sei ihnen von uns überlassen und bleibe ihnen nur solange, bis wir die Gewalt haben, es ihnen zu nehmen, und bekommen wir diese Gewalt nie, tant mieux <um so besser>; drittens, daß Sancho und sein Verein sich in der Theorie die gegenseitige Respektslosigkeit garantieren, während in der Praxis der Verein vermittelst des Stockes sich mit Sancho "verständigt", und endlich, daß diese "Verständigung" eine bloße Phrase ist, da Jeder weiß, daß die Andern sie nur mit dem geheimen Vorbehalt eingegangen sind, sie bei der nächsten Gelegenheit wieder umzustoßen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
- id: NT5B.343.6
  kind: p
  original: Ich sehe in Deinem Eigentum nicht das Deine, sondern das Meine; da jedes Ich dies tut, so sehen sie das Allgemeine darin, wobei wir denn bei der moderndeutschphilosophischen Interpretation des gewöhnlichen, besondern und ausschließlichen Privateigentums angelangt sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
- id: NT5B.344.1
  kind: p
  original: 'Zu der Philosophie des Vereins über das Eigentum gehören, u. a. auch noch folgende, aus dem System Sanchos hervorgehende Marotten:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
- id: NT5B.345.1
  kind: p
  original: 'p. 342. daß man durch die Respektslosigkeit im Verein Eigentum erwerben kann, p. 351, daß "Wir Alle im Vollen sitzen" und Ich "nur zuzulangen habe, so gut Ich kann" - während doch der ganze Verein zu den sieben magern Kühen Pharaonis gehört, und endlich, daß Sancho "Gedanken hegt", die "in seinem Buche stehen", was p. 374 in der unvergleichlichen an sich gerichteten, den drei Heineschen Oden an Schlegel nachgemachten Ode besungen wird: " Du, der Du solche Gedanken, wie sie in Deinem Buche stehen, hegst - Unsinn!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
- id: NT5B.345.2
  kind: p
  original: Dies ist die Hymne, die Sancho vorläufig sich selbst dekretiert und worüber sich später der Verein mit ihm "verständigen" wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
- id: NT5B.346.1
  kind: p
  original: Schließlich versteht es sich auch ohne "Verständigung", daß das Eigentum im außergewöhnlichen Verstande, von dem wir schon in der Phänomenologie sprachen, im Verein als "gangbares" und "kursierendes Eigentum" an Zahlungs Statt angenommen wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
- id: NT5B.346.2
  kind: p
  original: Über die einfachen Tatsachen, z.B., daß Ich Mitgefühl hege, daß Ich mit Andern spreche, daß Mir ein Bein amputiert (resp. ausgerissen) wird, wird der Verein sich dahin verständlichen, daß "das Gefühl der Fühlenden auch das Meinige, ein Eigentum ist", p. 387; daß auch fremde Ohren und Zungen Mein Eigentum sind; daß auch mechanische Verhältnisse Mein Eigentum sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
- id: NT5B.346.3
  kind: p
  original: So wird das Akkaparement im Verein hauptsächlich darin bestehen, daß alle Verhältnisse vermöge einer leichten Paraphrase in Eigentumsverhältnisse verwandelt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
- id: NT5B.346.4
  kind: p
  original: Diese neue Ausdrucksweise schon jetzt grassierender "Übelstände" ist ein "wesentliches Mittel oder Vermögen" im Verein und wird das bei dem "sozialen Talente" Sanchos unvermeidliche Defizit an Lebensmitteln glücklich decken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 391-392
- id: NT5B.347.1
  kind: heading
  original: B. Vermögen
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: NT5B.348.1
  kind: p
  original: 'p. 216: "Werde Jeder von Euch ein allmächtiges Ich!" p. 353: "Denke auf die Vergrößerung Deines Vermögens!" p. 420: "Haltet auf den Wert Eurer Gaben", "Haltet sie im Preise", "Laßt Euch nicht zwingen, unter dem Preise loszuschlagen", "laßt Euch nicht einreden, Eure Ware sei nicht preiswürdig", "Macht Euch nicht zum Gespötte durch einen Spottpreis", "Ahmt den Tapfern nach" etc.! p. 420: "Verwertet Euer Eigentum!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: NT5B.348.2
  kind: p
  original: '"Verwerte Dich!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: NT5B.349.1
  kind: p
  original: Diese Sittensprüchlein, die Sancho von einem andalusischen Schacherjuden gelernt hat, der seinem Sohne Lebens- und Handelsregeln gab, und die er jetzt aus seinem Schnappsack hervorlangt, bilden das Hauptvermögen des Vereins.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: NT5B.349.2
  kind: p
  original: 'Die Grundlage aller dieser Sätze ist der große Satz p.351:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: NT5B.350.1
  kind: p
  original: '"Alles, was Du vermagst, ist Dein Vermögen."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: NT5B.351.1
  kind: p
  original: Dieser Satz hat entweder keinen, d.h. einen bloß tautologischen Sinn oder einen Unsinn.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: NT5B.351.2
  kind: p
  original: 'Tautologie ist er, wenn er heißt: Was Du vermagst, vermagst Du.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: NT5B.351.3
  kind: p
  original: Unsinn ist er, wenn das Vermögen Nr. 2 Vermögen "im gewöhnlichen Verstand", Handelsvermögen, ausdrücken soll, und wenn also auf diese Etymologie basiert wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: NT5B.351.4
  kind: p
  original: Die Kollision besteht eben darin, daß meinem Vermögen etwas Anderes, als dies Vermögen leisten kann, zugemutet wird, z.B. von meinem Vermögen, Verse zu machen, verlangt wird, Geld aus diesen Versen zu machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: NT5B.351.5
  kind: p
  original: Man verlangt eben von meinem Vermögen etwas ganz Anderes als das eigentümliche Produkt dieses besondern Vermögens, nämlich ein von fremden, meinem Vermögen nicht unterworfenen Verhältnissen abhängiges Produkt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: NT5B.351.6
  kind: p
  original: Diese Schwierigkeit soll im Verein durch etymologische Synonymik gelöst werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: NT5B.351.7
  kind: p
  original: Man sieht, wie unser egoistischer Schulmeister auf einen ansehnlichen Posten im Verein spekuliert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: NT5B.351.8
  kind: p
  original: Übrigens ist diese Schwierigkeit nur scheinbar.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: NT5B.351.9
  kind: p
  original: 'Das gewöhnliche Kern- und Sittensprüchlein der Bourgeois: Anything is good to make money of <Aus allem, was es auch sei, kann man Geld machen>, wird hier in Sanchos feierlicher Manier breitgetreten.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: NT5B.352.1
  kind: heading
  original: C. Moral. Verkehr, Exploitationstheorie
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: NT5B.353.1
  kind: p
  original: p. 352.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: NT5B.353.2
  kind: p
  original: '"Egoistisch verfahrt Ihr, wenn Ihr einander weder als Inhaber noch als Lumpe oder Arbeiter achtet, sondern als einen Teil Eures Vermögens, als brauchbare Subjekte.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: NT5B.353.3
  kind: p
  original: Dann werdet Ihr weder dem Inhaber, Eigentümer für seine Habe etwas geben, noch Dem, der arbeitet, sondern allein Dem, den Ihr braucht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: NT5B.353.4
  kind: p
  original: 'Brauchen Wir einen König? fragen sich die Nordamerikaner und antworten: Nicht einen Heller ist er und seine Arbeit Uns wert."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: NT5B.354.1
  kind: p
  original: 'Dagegen wirft er p. 229 der "Bürgerperiode" vor:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: NT5B.355.1
  kind: p
  original: '"Statt Mich zu nehmen, wie Ich bin, sieht man lediglich auf Mein Eigentum, Meine Eigenschaften, und schließt mit Mir einen ehelichen <Bei Stirner: ehrlichen> Bund, nur um Meines Besitztums willen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: NT5B.355.2
  kind: p
  original: Man heiratet gleichsam, was Ich habe, nicht was Ich bin."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: NT5B.356.1
  kind: p
  original: D.h. also, man nimmt bloß Rücksicht auf das, was Ich für den Andern bin auf Meine Brauchbarkeit, man behandelt Mich als brauchbares Subjekt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: NT5B.356.2
  kind: p
  original: Sancho spuckt der "Bürgerperiode" in die Suppe, um sie im Verein ganz allein auszufressen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: NT5B.357.1
  kind: p
  original: Wenn die Individuen der heutigen Gesellschaft einander als Inhaber, als Arbeiter, und, wenn Sancho will, als Lumpe achten, so heißt das ja weiter Nichts, als daß sie sich als brauchbare Subjekte behandeln, ein Faktum, das nur ein so unbrauchbares Individuum wie Sancho in Zweifel zu ziehen vermag.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: NT5B.357.2
  kind: p
  original: Der Kapitalist, der den Arbeiter "als Arbeiter achtet", nimmt nur deshalb Rücksicht auf ihn, weil er Arbeiter braucht; der Arbeiter macht es ebenso mit dem Kapitalisten; wie denn auch die Amerikaner nach Sanchos Meinung (er möge uns anzeigen, welcher Quelle er dies historische Faktum entnommen) deswegen keinen König brauchen, weil sie ihn nicht als Arbeiter brauchen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: NT5B.357.3
  kind: p
  original: Sancho hat sein Beispiel wieder mit seinem gewöhnlichen Ungeschick gewählt, indem es gerade das Gegenteil von dem beweisen soll, was es wirklich beweist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: NT5B.358.1
  kind: p
  original: p. 395.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: NT5B.358.2
  kind: p
  original: '"Du bist für Mich Nichts als eine Speise, gleichwie auch Ich von Dir verspeiset und verbraucht werde.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: NT5B.358.3
  kind: p
  original: 'Wir haben zueinander nur Eine Beziehung: die der Brauchbarkeit, der Nutzbarkeit, des Nutzens."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: NT5B.359.1
  kind: p
  original: p. 416 "Es ist Keiner für Mich eine Respektsperson, auch der Mitmensch nicht, Sondern lediglich wie andre Wesen " (!) "ein Gegenstand für den Ich Teilnahme habe oder auch nicht, ein interessanter oder uninteressanter Gegenstand, ein brauchbares oder unbrauchbares Subjekt."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: NT5B.360.1
  kind: p
  original: Das Verhältnis der "Brauchbarkeit", welches im Verein die einzige Beziehung der Individuen aufeinander sein soll, wird sogleich wieder paraphrasiert in das gegenseitige "Verspeisen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: NT5B.360.2
  kind: p
  original: Die "vollendeten Christen" des Vereins verzehren natürlich auch ein Abendmahl, nur nicht miteinander, sondern aneinander.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 393-394
- id: NT5B.361.1
  kind: p
  original: Wie sehr diese Theorie der wechselseitigen Exploitation, die Bentham bis zum Überdruß ausführte, schon im Anfange dieses Jahrhunderts als ein Phase des vorigen aufgefaßt werden konnte, beweist Hegel in der "Phänomenologie".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: NT5B.361.2
  kind: p
  original: Siehe daselbst das Kapitel "Der Kampf der Aufklärung mit dem Aberglauben", wo die Brauchbarkeitstheorie als das letzte Resultat der Aufklärung dargestellt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: NT5B.361.3
  kind: p
  original: Die scheinbare Albernheit, welche alle die mannigfaltigen Verhältnisse der Menschen zueinander in das Eine Verhältnis der Brauchbarkeit auflöst, diese scheinbar metaphysische Abstraktion geht daraus hervor, daß innerhalb der modernen bürgerlichen Gesellschaft alle Verhältnisse unter das Eine abstrakte Geld- und Schacherverhältnis praktisch subsumiert sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: NT5B.361.4
  kind: p
  original: Diese Theorie kam auf mit Hobbes und Locke, gleichzeitig mit der ersten und zweiten englischen Revolution, den ersten Schlägen, wodurch die Bourgeoisie sich politische Macht eroberte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: NT5B.361.5
  kind: p
  original: Bei ökonomischen Schriftstellern ist sie natürlich schon früher stillschweigende Voraussetzung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: NT5B.361.6
  kind: p
  original: Die eigentliche Wissenschaft dieser Nützlichkeitstheorie ist die Ökonomie; in den Physiokraten erhält sie ihren wahren Inhalt, da diese zuerst die Ökonomie systematisch zusammenfassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: NT5B.361.7
  kind: p
  original: Schon bei Helvétius und Holbach findet sich eine Idealisierung dieser Lehre, die ganz der oppositionellen Stellung der französischen Bourgeoisie vor der Revolution entspricht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: NT5B.361.8
  kind: p
  original: Bei Holbach wird alle Betätigung der Individuen durch ihren gegenseitigen Verkehr als Nützlichkeits- und Benutzungsverhältnis dargestellt, z.B. Sprechen, Lieben etc. Die wirklichen Verhältnisse, die hier vorausgesetzt werden, sind also Sprechen, Lieben, bestimmte Betätigungen bestimmter Eigenschaften der Individuen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: NT5B.361.9
  kind: p
  original: Diese Verhältnisse sollen nun nicht die ihnen eigentümliche Bedeutung haben, sondern der Ausdruck und die Darstellung eines dritten, ihnen untergeschobenen Verhältnisses sein, des Nützlichkeits- oder Benutzungsverhältnisses.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: NT5B.361.10
  kind: p
  original: Diese Umschreibung hört erst dann auf, sinnlos und willkürlich zu sein, sobald jene Verhältnisse den Individuen nicht ihrer selbst wegen gelten, nicht als Selbstbetätigung, sondern vielmehr als Verkleidungen keineswegs der Kategorie Benutzung, sondern eines wirklichen dritten Zwecks und Verhältnisses, welches Nützlichkeitsverhältnis heißt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: NT5B.362.1
  kind: p
  original: Die Maskerade in der Sprache hat nur dann einen Sinn, wenn sie der unbewußte oder bewußte Ausdruck einer wirklichen Maskerade ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: NT5B.362.2
  kind: p
  original: In diesem Falle hat das Nützlichkeitsverhältnis einen ganz bestimmten Sinn, nämlich den, daß ich mir dadurch nütze, daß ich einem Andern Abbruch tue (exploitation de l'homme par l'homme <Ausbeutung des Menschen durch den Menschen>); in diesem Falle ist ferner der Nutzen, den ich aus einem Verhältnisse ziehe, diesem Verhältnisse überhaupt fremd, wie wir oben beim Vermögen sahen, daß von jedem Vermögen ein ihm fremdes Produkt verlangt wird, eine Beziehung, die durch die gesellschaftlichen Verhältnisse bestimmt ist - und diese ist eben die Nützlichkeitsbeziehung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 394-395
- id: NT5B.362.3
  kind: p
  original: Dies Alles ist wirklich bei dem Bourgeois der Fall.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
- id: NT5B.362.4
  kind: p
  original: Ihm gilt nur ein Verhältnis um seiner selbst willen, das Exploitationsverhältnis; alle andern Verhältnisse gelten ihm nur so weit, als er sie unter dies eine Verhältnis subsumieren kann, und selbst wo ihm Verhältnisse vorkommen, die sich dem Exploitationsverhältnis nicht direkt unterordnen lassen, subordiniert er sie ihm wenigstens in der Illusion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
- id: NT5B.362.5
  kind: p
  original: Der materielle Ausdruck dieses Nutzens ist das Geld, der Repräsentant der Werte aller Dinge, Menschen und gesellschaftlichen Verhältnisse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
- id: NT5B.362.6
  kind: p
  original: Im Übrigen sieht man auf den ersten Blick, daß aus den wirklichen Verkehrsbeziehungen, in denen ich zu andern Menschen stehe, keineswegs aber aus Reflexion und bloßem Willen, erst die Kategorie "Benutzen" abstrahiert wird und dann umgekehrt jene Verhältnisse für die Wirklichkeit dieser aus ihnen selbst abstrahierten Kategorie ausgegeben werden, eine ganz spekulative Methode zu verfahren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
- id: NT5B.362.7
  kind: p
  original: Ganz in derselben Weise und mit demselben Rechte hat Hegel alle Verhältnisse als Verhältnisse des objektiven Geistes dargestellt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
- id: NT5B.362.8
  kind: p
  original: Holbachs Theorie ist also die historisch berechtigte, philosophische Illusion über die eben in Frankreich aufkommende Bourgeoisie, deren Exploitationslust noch ausgelegt werden konnte als Lust an der vollen Entwicklung der Individuen in einem von den alten feudalen Banden befreiten Verkehr.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
- id: NT5B.362.9
  kind: p
  original: Die Befreiung auf dem Standpunkte der Bourgeoisie, die Konkurrenz, war allerdings für das achtzehnte Jahrhundert die einzig mögliche Weise, den Individuen eine neue Laufbahn freierer Entwicklung zu eröffnen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
- id: NT5B.362.10
  kind: p
  original: Die theoretische Proklamation des dieser Bourgeoispraxis entsprechenden Bewußtseins, des Bewußtseins der wechselseitigen Exploitation als des allgemeinen Verhältnisses aller Individuen zueinander, war ebenfalls ein kühner und offner Fortschritt, eine profanierende Aufklärung über die politische, patriarchalische, religiöse und gemütliche Verbrämung der Exploitation unter der Feudalität; eine Verbrämung, die der damaligen Form der Exploitation entsprach und namentlich von den Schriftstellern der absoluten Monarchie systematisiert worden war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
- id: NT5B.363.1
  kind: p
  original: Selbst wenn Sancho in seinem "Buche" dasselbe getan hätte, was Helvétius und Holbach im vorigen Jahrhundert taten, so wäre der Anachronismus immer noch lächerlich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
- id: NT5B.363.2
  kind: p
  original: Aber wir sahen, wie er [a]n die Stelle des tätigen Bourgeoisegoismus einen rodomontierenden, mit sich ei[ni]gen Egoismus setzte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
- id: NT5B.363.3
  kind: p
  original: 'Sein einziges Ver[die]nst hat er wider seinen Willen und ohne es zu wissen: das Verdienst, der Ausdruck der deutschen Kleinbürger von heute zu sein, die danach trachten, Bourgeois zu werden.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 395-396
- id: NT5B.363.4
  kind: p
  original: Es war ganz in der Ordnung, daß, so kleinlich, zaghaft und befangen diese Bürger praktisch auftreten, ebenso marktschreierisch, bramarbasierend und vorwitzig "der Einzige" unter ihren philosophischen Repräsentanten in die Welt hinaus renommierte; es paßt ganz zu den Verhältnissen dieser Bürger, daß sie von ihrem theoretischen Maulhelden Nichts wissen wollen und er Nichts von ihnen weiß, daß sie miteinander uneinig sind und er den mit sich einigen Egoismus predigen muß; Sancho sieht jetzt vielleicht, durch welche Nabelschnur sein "Verein" mit dem Zollverein zusammenhängt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: NT5B.364.1
  kind: p
  original: Die Fortschritte der Nützlichkeits- und Exploitationstheorie, ihre verschiedenen Phasen hängen genau zusammen mit den verschiedenen Entwicklungsepochen der Bourgeoisie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: NT5B.364.2
  kind: p
  original: Bei Helvétius und Holbach war sie dem wirklichen Inhalt nach nie weit darüber hinausgekommen, die Ausdrucksweise der Schriftsteller aus der Zeit der absoluten Monarchie zu umschreiben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: NT5B.364.3
  kind: p
  original: Es war eine andere Ausdrucksweise, mehr der Wunsch, alle Verhältnisse auf das Exploitationsverhältnis zurückzuführen, den Verkehr aus den materiellen Bedürfnissen und den Weisen ihrer Befriedigung zu erklären, als die Tat selbst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: NT5B.364.4
  kind: p
  original: Die Aufgabe war gestellt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: NT5B.364.5
  kind: p
  original: 'Hobbes und Locke hatten sowohl die frühere Entwicklung der holländischen Bourgeoisie (sie lebten Beide eine Zeitlang in Holland) wie die ersten politischen Aktionen, durch welche die Bourgeoisie in England aus der lokalen und provinziellen Beschränkung heraustrat, und eine schon relativ entwickelte Stufe der Manufaktur, des Seehandels und der Kolonisation vor Augen: besonders Locke, der gleichzeitig mit der ersten Periode der englischen Ökonomie, mit dem Entstehen der Aktiengesellschaften, der englischen Bank und der Seeherrschaft Englands schrieb.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: NT5B.364.6
  kind: p
  original: Bei ihnen, und namentlich bei Locke, ist die Exploitationstheorie noch unmittelbar mit ökonomischem Inhalt verbunden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: NT5B.365.1
  kind: p
  original: Helvétius und Holbach hatten außer der englischen Theorie und der bisherigen Entwicklung der holländischen und englischen Bourgeoisie die um ihre freie Entfaltung noch kämpfende französische Bourgeoisie vor sich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: NT5B.365.2
  kind: p
  original: Der allgemeine kommerzielle Geist des achtzehnten Jahrhunderts hatte, namentlich in Frankreich in der Form der Spekulation alle Klassen ergriffen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: NT5B.365.3
  kind: p
  original: Die Finanzverlegenheiten der Regierung und die daraus entspringenden Debatten über die Besteuerung beschäftigten schon damals ganz Frankreich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: NT5B.365.4
  kind: p
  original: Dazu kam, daß Paris im achtzehnten Jahrhundert die einzige Weltstadt war, die einzige Stadt, in welcher ein persönlicher Verkehr von Individuen aller Nationen stattfand.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: NT5B.365.5
  kind: p
  original: Diese Prämissen, zusammen mit dem universelleren Charakter der Franzosen überhaupt, gaben der Theorie von Helvétius und Holbach die eigentümliche allgemeine Färbung, nahmen ihr aber zugleich den noch bei den Engländern vorfindlichen positiven ökonomischen Inhalt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 396-397
- id: NT5B.365.6
  kind: p
  original: Die Theorie, die bei den Engländern noch einfache Konstatierung einer Tatsache war, wird bei den Franzosen zu einem philosophischen System.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: NT5B.365.7
  kind: p
  original: Diese des positiven Inhalts beraubte Allgemeinheit, wie sie in Helvétius und Holbach hervortritt, ist wesentlich verschieden von der inhaltsvollen Totalität, die erst bei Bentham und Mill sich findet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: NT5B.365.8
  kind: p
  original: Die erstere entspricht der kämpfenden, noch unentwickelten Bourgeoisie, die zweite der herrschenden, entwickelten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: NT5B.366.1
  kind: p
  original: Der von Helvétius und Holbach vernachlässigte Inhalt der Exploitationstheorie wurde gleichzeitig mit Letzterem von den Physiokraten entwickelt und systematisiert; da ihnen aber die unentwickelten ökonomischen Verhältnisse Frankreichs zugrunde lagen, wo der den Grundbesitz zur Hauptsache machende Feudalismus noch ungebrochen war, so blieben sie insofern in der feudalistischen Anschauungsweise befangen, daß sie den Grundbesitz und die Agrikulturarbeit für diejenige [Produktivkraft] erklärten, welche die ganze Gestaltung der Gesellschaft bedingt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: NT5B.367.1
  kind: p
  original: Die weitere Entwicklung der Exploitationstheorie ging in England durch Godwin, besonders aber durch Bentham vor sich, der den von den Franzosen vernachlässigten ökonomischen Inhalt nach und nach wieder hereinnahm, je weiter sich die Bourgeoisie, sowohl in England wie in Frankreich, durchsetzte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: NT5B.367.2
  kind: p
  original: Godwins "Political Justice" wurde während der Schreckensperiode, die Hauptwerke Benthams während und seit der französischen Revolution und der Entwicklung der großen Industrie in England geschrieben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: NT5B.367.3
  kind: p
  original: Die vollständige Vereinigung der Nützlichkeitstheorie mit der Ökonomie finden wir endlich bei Mill.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: NT5B.368.1
  kind: p
  original: Die Ökonomie, die früher entweder von Finanzmännern, Bankiers und Kaufleuten, also überhaupt von Leuten, die unmittelbar mit ökonomischen Verhältnissen zu tun hatten, oder von allgemein gebildeten Männern wie Hobbes, Locke, Hume behandelt wurde, für die sie als ein Zweig des enzyklopädischen Wissens Bedeutung hatte - die Ökonomie wurde erst durch die Physiokraten zu einer besondern Wissenschaft erhoben und seit ihnen als eine solche behandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: NT5B.368.2
  kind: p
  original: Als besondere Fachwissenschaft nahm sie die übrigen, politischen, juristischen etc. Verhältnisse so weit in sich auf, daß sie diese Verhältnisse auf ökonomische reduzierte Sie hielt aber diese Subsumtion aller Verhältnisse unter sich nur für eine Seite dieser Verhältnisse und ließ ihnen damit im Übrigen auch eine selbständige Bedeutung außer der Ökonomie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: NT5B.368.3
  kind: p
  original: Die vollständige Subsumtion aller existierenden Verhältnisse unter das Nützlichkeitsverhältnis, die unbedingte Erhebung dieses Nützlichkeitsverhältnisses zum einzigen Inhalt aller übrigen, finden wir erst bei Bentham, wo nach der französischen Revolution und der Entwicklung der großen Industrie die Bourgeoisie nicht mehr als eine besondre Klasse, sondern als die Klasse auftritt, deren Bedingungen die Bedingungen der ganzen Gesellschaft sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 397-398
- id: NT5B.369.1
  kind: p
  original: Nachdem die sentimentalen und moralischen Paraphrasen, die bei den Franzosen den ganzen Inhalt der Nützlichkeitstheorie bildeten, erschöpft waren, blieb für eine fernere Ausbildung dieser Theorie nur noch die Frage übrig, wie die Individuen und Verhältnisse zu benutzen, zu exploitieren seien.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: NT5B.369.2
  kind: p
  original: Die Antwort auf diese Frage war inzwischen in der Ökonomie schon gegeben worden; der einzig mögliche Fortschritt lag in dem Hereinnehmen des ökonomischen Inhalts.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: NT5B.369.3
  kind: p
  original: Bentham vollzog diesen Fortschritt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: NT5B.369.4
  kind: p
  original: In der Ökonomie aber war es schon ausgesprochen, daß die hauptsächlichen Verhältnisse der Exploitation unabhängig von dem Willen der Einzelnen durch die Produktion im ganzen und großen bestimmt und von den einzelnen Individuen fertig vorgefunden werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: NT5B.369.5
  kind: p
  original: Es blieb also für die Nützlichkeitstheorie kein anderes Feld der Spekulation als die Stellung der Einzelnen zu diesen großen Verhältnissen, die Privat-Exploitation einer vorgefundenen Welt durch die einzelnen Individuen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: NT5B.369.6
  kind: p
  original: Hierüber hat Bentham und seine Schule lange moralische Reflexionen angestellt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: NT5B.369.7
  kind: p
  original: Die ganze Kritik der bestehenden Welt durch die Nützlichkeitstheorie erhielt hierdurch ebenfalls einen beschränkten Gesichtskreis.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: NT5B.369.8
  kind: p
  original: In den Bedingungen der Bourgeoisie befangen, blieben ihr zur Kritik nur diejenigen Verhältnisse, die aus einer früheren Epoche überkommen waren und der Entwicklung der Bourgeoisie im Wege standen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: NT5B.369.9
  kind: p
  original: Die Nützlichkeitstheorie entwickelt daher allerdings den Zusammenhang sämtlicher bestehenden Verhältnisse mit ökonomischen, aber nur auf eine beschränkte Weise.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: NT5B.370.1
  kind: p
  original: Die Nützlichkeitstheorie hatte von vornherein den Charakter der Gemeinnützlichkeitstheorie, dieser Charakter wurde jedoch erst inhaltsvoll mit dem Hereinnehmen der ökonomischen Verhältnisse, speziell der Teilung der Arbeit und des Austausches.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: NT5B.370.2
  kind: p
  original: In der Teilung der Arbeit wird die Privattätigkeit des Einzelnen gemeinnützlich; die Gemeinnützlichkeit Benthams reduziert sich auf dieselbe Gemeinnützlichkeit, die überhaupt in der Konkurrenz geltend gemacht wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: NT5B.370.3
  kind: p
  original: Durch das Hereinziehen der ökonomischen Verhältnisse von Grundrente, Profit und Arbeitslohn kamen die bestimmten Exploitationsverhältnisse der einzelnen Klassen herein, da die Art der Exploitation von der Lebensstellung des Exploitierenden abhängt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: NT5B.370.4
  kind: p
  original: Bis hieher konnte die Nützlichkeitstheorie sich an bestimmte gesellschaftliche Tatsachen anschließen; ihr weiteres Eingehen auf die Art der Exploitation verläuft sich in Katechismusphrasen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 398-399
- id: NT5B.371.1
  kind: p
  original: Der ökonomische Inhalt verwandelte die Nützlichkeitstheorie allmählich in eine bloße Apologie des Bestehenden, in den Nachweis, daß unter den existierenden Bedingungen die jetzigen Verhältnisse der Menschen zueinander die vorteilhaftesten und gemeinnützlichsten seien.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: NT5B.371.2
  kind: p
  original: Diesen Charakter trägt sie bei allen neueren Ökonomen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: NT5B.372.1
  kind: p
  original: Während so die Nützlichkeitstheorie wenigstens den Vorzug hatte, den Zusammenhang aller bestehenden Verhältnisse mit den ökonomischen Grundlagen der Gesellschaft anzudeuten, hat sie bei Sancho allen positiven Inhalt verloren, abstrahiert von allen wirklichen Verhältnissen und beschränkt sich auf die bloße Illusion des einzelnen Bürgers über seine "Gescheitheit", mit der er die Welt zu exploitieren glaubt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: NT5B.372.2
  kind: p
  original: Übrigens läßt sich Sancho nur an sehr wenigen Stellen auf die Nützlichkeitstheorie selbst in dieser verdünnten Gestalt ein; der mit sich einige Egoismus, d.h. die Illusion über diese Illusion des Kleinbürgers, erfüllt fast das ganze "Buch", wie wir gesehen haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: NT5B.372.3
  kind: p
  original: Und selbst diese wenigen Stellen löst Sancho schließlich, wie sich zeigen wird, in blauen Dunst auf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: NT5B.373.1
  kind: heading
  original: D. Religion
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: NT5B.374.1
  kind: p
  original: '"In dieser Gemeinsamkeit" (sc. mit andern Leuten) " sehe Ich durchaus nichts Anderes als eine Multiplikation Meiner Macht, und nur solange sie Meine vervielfachte Kraft ist, behalte Ich sie bei." p. 416.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: NT5B.375.1
  kind: p
  original: '"Ich demütige Mich vor keiner Macht mehr und erkenne, daß alle Mächte nur Meine Macht sind, die Ich sogleich zu unterwerfen habe, wenn sie eine Macht gegen oder über Mich zu werden drohen; jede derselben darf nur eins Meiner Mittel sein, Mich durchzusetzen."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: NT5B.376.1
  kind: p
  original: Ich "sehe an", ich "erkenne", ich "habe zu unterwerfen", die Macht" darf nur eins Meiner Mittel sein".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: NT5B.376.2
  kind: p
  original: Was diese moralischen Forderungen zu bedeuten haben und wie sehr sie der Wirklichkeit entsprechen, hat sich uns beim "Verein" selbst gezeigt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: NT5B.376.3
  kind: p
  original: Mit dieser Illusion von seiner Macht hängt denn auch genau die andre zusammen, daß im Verein "die Substanz" (siehe "Humaner Liberalismus") vernichtet wird und die Verhältnisse der Vereinsglieder nie eine feste Gestalt gegenüber den einzelnen Individuen gewinnen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: NT5B.377.1
  kind: p
  original: '"Der Verein, die Vereinigung, diese stets flüssige Vereinigung Alles Bestandes...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: NT5B.377.2
  kind: p
  original: Allerdings entsteht auch durch Verein eine Gesellschaft, aber nur, wie durch einen Gedanken eine fixe Idee entsteht...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: NT5B.377.3
  kind: p
  original: Hat sich ein Verein zur Gesellschaft kristallisiert, so hat er aufgehört, eine Vereinigung zu sein; denn Vereinigung ist ein unaufhörliches Sich-Vereinigen; er ist zu einem Vereinigtsein geworden, der Leichnam des Vereins oder der Vereinigung - Gesellschaft...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 399-400
- id: NT5B.377.4
  kind: p
  original: Den Verein hält weder ein natürliches noch ein geistiges Band zusammen." p. 294, 408, 416.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: NT5B.378.1
  kind: p
  original: Was das "natürliche Band" anbetrifft, so existiert das trotz Sanchos "Widerwillen" in der Fronbauerwirtschaft und Organisation der Arbeit etc. im Verein, ebenso das "geistige Band" in der Sanchoschen Philosophie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: NT5B.378.2
  kind: p
  original: Im Übrigen brauchen wir nur auf das zu verweisen, was wir mehrmals und noch beim Verein über die auf der Teilung der Arbeit beruhende Verselbständigung der Verhältnisse gegenüber den Individuen gesagt haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: NT5B.379.1
  kind: p
  original: '"Kurz, die Gesellschaft ist heilig, der Verein ist Dein eigen: die Gesellschaft verbraucht Dich, den Verein verbrauchst Du" usw. p. 418.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: NT5B.380.1
  kind: heading
  original: E. Nachträgliches zum Verein
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: NT5B.381.1
  kind: p
  original: Während wir bisher keine andre Möglichkeit sahen, in den "Verein" zu kommen, als durch die Empörung, erfahren wir jetzt aus dem Kommentar, daß der "Verein von Egoisten" bereits "zu Hunderttausenden" von Exemplaren existiert als eine Seite der bestehenden bürgerlichen Gesellschaft und uns auch ohne alle Empörung und jeden "Stirner" zugänglich ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: NT5B.381.2
  kind: p
  original: Sancho zeigt uns dann
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: NT5B.382.1
  kind: p
  original: '"solche Vereine im Leben.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: NT5B.382.2
  kind: p
  original: 'Faust befindet sich mitten in solchen Vereinen, als er ausruft: Hier bin ich Mensch " (!), "hier darf ich''s sein - Goethe gibt''s hier sogar schwarz auf weiß" ("aber Humanus heißt der Heilige, s. Goethe", vgl. "das Buch")...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: NT5B.382.3
  kind: p
  original: '"Sähe Heß das wirkliche Leben aufmerksam an, so würde er Hunderttausende von solchen teils schnell vorübergehenden, teils dauernden egoistischen Vereinen vor Augen haben."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: NT5B.383.1
  kind: p
  original: Sancho läßt dann vor Heß' Fenster "Kinder" zum Spiele zusammenlaufen, "ein paar gute Bekannte" ihn ins Wirtshaus abnehmen und ihn mit seiner "Geliebten" sich vereinigen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: NT5B.384.1
  kind: p
  original: '"Freilich wird Heß es diesen trivialen Beispielen nicht ansehen, wie inhaltsschwer und wie himmelweit verschieden sie von den heiligen Gesellschaften, ja von der brüderlichen, menschlichen Gesellschaft der heiligen Sozialisten sind." (Sancho contra Heß, Wigand, p. 193, 194.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: NT5B.385.1
  kind: p
  original: Ebenso ist schon p. 305 "des Buchs" "die Vereinigung zu materiellen Zwecken und Interessen" als freiwilliger Verein von Egoisten zu Gnaden angenommen worden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: NT5B.386.1
  kind: p
  original: Der Verein reduziert sich hier also einerseits auf die Bourgeoisassoziationen und Aktiengesellschaften, andererseits auf die Bürgerressourcen, Picknicks usw. Daß die ersteren ganz der gegenwärtigen Epoche angehören, ist bekannt, und daß die letzteren nicht minder, ist ebenfalls bekannt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 400-401
- id: NT5B.386.2
  kind: p
  original: Sancho möge sich die "Vereine" einer früheren Epoche, etwa der Feudalzeit, oder die anderer Nationen, etwa die der Italiener, Engländer etc. bis auf die Kinder herab, ansehen, um den Unterschied kennenzulernen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: NT5B.386.3
  kind: p
  original: Er bestätigt durch diese neue Interpretation des Vereins nur seinen eingerosteten Konservatismus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: NT5B.386.4
  kind: p
  original: Sancho, der die ganze bürgerliche Gesellschaft in sein vorgebliches neues Institut aufnahm, soweit sie ihm angenehm war, Sancho beteuert hier nachträglich nur, daß man in seinem Verein sich auch amüsieren, und zwar ganz in hergebrachter Weise amüsieren wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: NT5B.386.5
  kind: p
  original: Welche unabhängig von ihm existierenden Verhältnisse ihn in den Stand oder außer Stand setzen, "ein paar gute Bekannte in ein Weinhaus zu begleiten", daran denkt unser Bonhomme natürlich nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: NT5B.387.1
  kind: p
  original: Die hier nach Berliner Hörensagen verstirnerte Idee, die ganze Gesellschaft in freiwillige Gruppen aufzulösen, gehört Fourier an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: NT5B.387.2
  kind: p
  original: Aber bei Fourier hat diese Anschauung eine totale Umgestaltung der Gesellschaft zur Voraussetzung und basiert auf der Kritik der bestehenden, von Sancho so bewunderten "Vereine" und ihrer ganzen Langweiligkeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: NT5B.387.3
  kind: p
  original: Fourier schildert diese Erheiterungsversuche von heute im Zusammenhange mit den bestehenden Produktions- und Verkehrsverhältnissen und polemisiert gegen sie; Sancho, weit entfernt, sie zu kritisieren, will sie mit Haut und Haaren in sein neues Beglückungsinstitut der "Verständigung" verpflanzen und beweist dadurch nur noch einmal, wie sehr er in der bestehenden bürgerlichen Gesellschaft befangen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: NT5B.388.1
  kind: p
  original: 'Schließlich hält Sancho noch folgende oratio pro domo < wörtlich: Rede für das eigene Haus; hier im eigenen Interesse >, d.h. für den "Verein":'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: NT5B.389.1
  kind: p
  original: '"Ist ein Verein, in welchem sich die Meisten um ihre natürlichsten und offenbarsten Interessen prellen lassen, ein Verein von Egoisten?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: NT5B.389.2
  kind: p
  original: Haben sich da Egoisten vereint, wo Einer des Andern Sklav oder Leibeigner ist?...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: NT5B.389.3
  kind: p
  original: Gesellschaften, in welchen die Bedürfnisse der Einen auf Kosten der Andern befriedigt werden, in denen z.B. die Einen das Bedürfnis der Ruhe dadurch befriedigen können, daß die Andern bis zur Erschlaffung arbeiten müssen...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: NT5B.389.4
  kind: p
  original: Heß... identifiziert... diese seine 'egoistischen Vereine' mit dem Stirnerschen Verein von Egoisten."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: NT5B.389.5
  kind: p
  original: '[Wigand,] p.192, 193.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: NT5B.390.1
  kind: p
  original: Sancho spricht also den frommen Wunsch aus, daß in seinem auf der gegenseitigen Exploitation beruhenden Verein alle Mitglieder gleich mächtig, pfiffig etc. etc. sein möchten, damit Jeder die Andern gerade soweit exploitiert, als er von ihnen exploitiert wird, und damit Keiner um seine "natürlichsten und offenbarsten Interessen" "geprellt" wird oder seine "Bedürfnisse auf Kosten der Andern befriedigen" kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 401-402
- id: NT5B.390.2
  kind: p
  original: Wir bemerken hier, daß Sancho " natürliche und offenbare Interessen" und "Bedürfnisse" Aller - also gleiche Interessen und Bedürfnisse anerkennt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: NT5B.390.3
  kind: p
  original: Wir erinnern uns ferner zugleich der p. 456 des Buchs, wonach "die Übervorteilung" ein "vom Zunftgeist eingepredigter moralischer Gedanke" ist, und einem Menschen, der eine "weise Erziehung" genossen hat, bleibt sie "fixe Idee, gegen die keine Gedankenfreiheit schützt".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: NT5B.390.4
  kind: p
  original: Sancho "hat seine Gedanken von oben und bleibt dabei". (ibid.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: NT5B.390.5
  kind: p
  original: Diese gleiche Macht Aller ist nach seiner Forderung, daß Jeder "allmächtig", d.h., daß Alle gegeneinander ohnmächtig werden sollen, ein ganz konsequentes Postulat und fällt zusammen mit dem gemütlichen Verlangen des Kleinbürgers nach einer Welt des Schachers, in der Jeder seinen Vorteil findet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: NT5B.390.6
  kind: p
  original: Oder aber unser Heiliger setzt urplötzlich eine Gesellschaft voraus, in der Jeder seine Bedürfnisse ungehindert befriedigen kann, ohne dies "auf Kosten Andrer" zu tun, und in diesem Falle wird die Exploitationstheorie wieder zu einer sinnlosen Paraphrase für die wirklichen Verhältnisse der Individuen zueinander.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: NT5B.391.1
  kind: p
  original: Nachdem Sancho in seinem "Verein" die Andern "verzehrt" und verspeist und damit den Verkehr mit der Welt in den Verkehr mit sich verwandelt hat. geht er von diesem indirekten zum direkten Selbstgenuß über, indem er sich selber verspeist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: NT5B.N1.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Zu diesem Unsinn kommt Sankt Sancho, weil er den juristischen, ideologischen Ausdruck des bürgerlichen Eigentums für das wirkliche bürgerliche Eigentum hält und sich nun nicht erklären kann, weshalb dieser seiner Illusion die Wirklichkeit nicht entsprechen will.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5B.N2.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Er bedenkt hier wieder nicht, daß die "Übervorteilung" und "Überteuerung" der Arbeiter in der modernen Welt auf ihrer Besitzlosigkeit beruht und daß diese Besitzlosigkeit im direkten Widerspruch steht mit der von Sancho den liberalen Bourgeois untergeschobenen Versicherung [...] den liberalen Bourgeois, die durch die Parzellierung des Grundbesitzes einem Jeden Eigentum zu geben behaupten.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5B.N3.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Sie hätten sich von vornherein "verständigen" können.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5B.N3.1.2
  kind: note
  original: Daß erst die Konkurrenz eine "Verständigung" (um dies moralische Wort zu gebrauchen) überhaupt möglich macht, daß von einer Sanchoschen "Verständigung" Aller wegen der entgegengesetzten Klasseninteressen keine Rede sein kann, das kümmert unsren Weisen wenig.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5B.N3.1.3
  kind: note
  original: Überhaupt sehen diese deutschen Philosophen ihre eigne kleine Lokalmisere für welthistorisch an, während sie sich einbilden, bei den umfassendsten geschichtlichen Verhältnissen habe es nur an ihrer Weisheit gefehlt, um die Sache durch "Verständigung" abzumachen und Alles ins reine zu bringen Wie weit man mit solchen Phantasien kommt, sehen wir an unsrem Sancho.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5B.N4.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] "Sie" sollen sich über eine öffentliche Bäckerei "verständigen".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5B.N4.1.2
  kind: note
  original: Daß diese Sie", diese "Alle" in jeder Epoche und unter verschiedenen Verhältnissen selbst verschiedene Individuen mit verschiedenen Interessen sind, das geht unsern Sancho natürlich gar nichts an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5B.N4.1.3
  kind: note
  original: Überhaupt haben die Individuen der ganzen bisherigen Geschichte jedesmal den Fehler begangen, nicht gleich von vornherein diese superkluge "Gescheitheit" sich anzueignen, mit welcher unsre deutschen Philosophen nachträglich über sie kannegießern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5B.N5.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Der Unterschied zwischen Wesen und Erscheinung setzt sich hier trotz Sancho durch.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5B.N6.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Es ist die alte Moral des Kleinbürgers, daß die Welt am besten bestellt ist, wenn ein Jeder es für sich so weit wie möglich zu bringen sucht und sich im übrigen nicht um den Weltlauf kümmert.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5B.N7.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] In Frankreich wird verhältnismäßig mehr produziert als in Hinterpommern.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5B.N7.1.2
  kind: note
  original: In Frankreich kommen nach Michel Chevalier, wenn die ganze jährliche Produktion auf die Bevölkerung gleichmäßig verteilt wird, 97 Franken auf den Kopf, macht für eine Familie...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5B.N8.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Hätte Sancho mit seinen Phrasen Ernst machen wollen, so hätte er auf die Teilung der Arbeit eingehen müssen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5B.N8.1.2
  kind: note
  original: Dies unterließ er weislich und akzeptierte die bestehende Teilung der Arbeit ohne Bedenken, um sie für seinen "Verein" zu exploitieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5B.N8.1.3
  kind: note
  original: Er würde bei näherem Eingehen auf diesen Gegenstand freilich gefunden haben, daß die Teilung der Arbeit damit nicht aufgehoben ist, wenn man sie "sich aus dem Kopfe schlägt".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5B.N8.1.4
  kind: note
  original: Der Kampf der Philosophen gegen die "Substanz" und ihre gänzliche Vernachlässigung der Teilung der Arbeit, der materiellen Grundlage, aus der das Phantom der Substanz hervorgegangen ist, beweist eben nur, daß es diesen Helden nur um die Vernichtung der Phrasen zu tun ist und keineswegs um die Veränderung der Verhältnisse, aus denen diese Phrasen entstehen mußten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: NT5B.N9.1.1
  kind: note
  original: Vgl. "Die heilige Familie", p. 266.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
