  original: Eigentum an Einigem = Eigentum an Allem (p. 343).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: NT5B.38.1
  kind: p
  original: 'Die Entfremdung als Beziehung oder Kopula in den obigen Gleichungen kann auch in folgenden Antithesen ausgedrückt werden:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: NT5B.39.1
  kind: p
  original: Privateigentum - egoistisches Eigentum
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.40.1
  kind: p
  original: '"Sich auf das Eigentum als Heiliges, Gespenst, beziehen", "es respektieren", "Respekt vor dem Eigentum haben" (p. 324).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.40.2
  kind: p
  original: '- "Die heilige Beziehung zum Eigentum aufgeben", es nicht mehr als fremd betrachten, vor dem Gespenst sich nicht mehr fürchten, keinen Respekt vor dem Eigentum haben, Das Eigentum der Respektlosigkeit haben (p. 368, 340, 343).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.41.1
  kind: p
  original: Die in obigen Gleichungen und Antithesen enthaltenen Modi der Aneignung werden erst beim "Verein" ihre Erledigung finden; da wir uns einstweilen noch in der "heiligen Gesellschaft" befinden, so geht uns hier nur die Kanonisation an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.42.1
  kind: p
  original: Note.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.42.2
  kind: p
  original: Warum die Ideologen das Eigentumsverhältnis als ein Verhältnis "des Menschen" fassen können, dessen verschiedene Form in verschiedenen Epochen sich danach bestimmt, wie die Individuen sich " den Menschen" vorstellen, das ist schon bei der "Hierarchie" behandelt worden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '334'
- id: NT5B.42.3
  kind: p
