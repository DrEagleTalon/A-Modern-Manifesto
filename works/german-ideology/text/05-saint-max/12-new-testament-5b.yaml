  mew_page: '333'
- id: NT5B.30.1
  kind: p
  original: Vom Recht (Staat, dem Menschen) zum Eigentum berechtigt - Von Mir zum Eigentum ermächtigt. p. 339.
  en: ''
  modern: ''
  modern_status: empty
