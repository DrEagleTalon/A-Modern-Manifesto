section: AT6
title_original: 6. Die Freien
title_en: Old Testament, 6. The Free Ones
author: Karl Marx, Friedrich Engels
date: 1845-1846
original_language: de
anchor_language: de
source_original: MEW 3, S. 176-221 (Dietz, Berlin 1969) via mlwerke.de; written 1845-1846, first printed in full 1932; the authors' footnotes from mlwerke's me03_anm.htm
source_en: 'None: no public-domain English translation'
verses:
- id: AT6.0.1
  kind: heading
  original: 6. Die Freien
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
- id: AT6.1.1
  kind: p
  original: Was die "Freien" hier zu tun haben, besagt die Ökonomie des Alten Bundes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
- id: AT6.1.2
  kind: p
  original: Wir können nicht dafür, daß das Ich, dem wir bereits so nahe gerückt waren, uns jetzt wieder in unbestimmte Ferne zurücktritt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
- id: AT6.1.3
  kind: p
  original: Es ist überhaupt nicht unsre Schuld, daß wir nicht schon von p. 20 "des Buchs" sogleich auf das Ich übergingen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
- id: AT6.2.1
  kind: heading
  original: A) Der politische Liberalismus
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
- id: AT6.3.1
  kind: p
  original: Der Schlüssel zu Sankt Maxens und seiner Vorgänger Kritik des Liberalismus ist die Geschichte des deutschen Bürgertums.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
- id: AT6.3.2
  kind: p
  original: Wir heben einige Momente dieser Geschichte seit der französischen Revolution hervor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
- id: AT6.4.1
  kind: p
  original: Der Zustand Deutschlands am Ende des vorigen Jahrhunderts spiegelt sich vollständig ab in Kants "Critik der practischen Vernunft".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
- id: AT6.4.2
  kind: p
  original: Während die französische Bourgeoisie sich durch die kolossalste Revolution, die die Geschichte kennt, zur Herrschaft aufschwang und den europäischen Kontinent eroberte, während die bereits politisch emanzipierte englische Bourgeoisie die Industrie revolutionierte und sich Indien politisch und die ganze andere Welt kommerziell unterwarf, brachten es die ohnmächtigen deutschen Bürger nur zum "guten Willen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 176-177
- id: AT6.4.3
  kind: p
  original: Kant beruhigte sich bei dem bloßen "guten Willen", selbst wenn er ohne alles Resultat bleibt, und setzte die Verwirklichung dieses guten Willens, die Harmonie zwischen ihm und den Bedürfnissen und Trieben der Individuen, ins Jenseits.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: AT6.4.4
  kind: p
  original: Dieser gute Wille Kants entspricht vollständig der Ohnmacht, Gedrücktheit und Misere der deutschen Bürger, deren kleinliche Interessen nie fähig waren, sich zu gemeinschaftlichen, nationalen Interessen einer Klasse zu entwickeln, und die deshalb fortwährend von den Bourgeois aller andern Nationen exploitiert wurden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: AT6.4.5
  kind: p
  original: Diesen kleinlichen Lokalinteressen entsprach einerseits die wirkliche lokale und provinzielle Borniertheit, andrerseits die kosmopolitische Aufgeblähtheit der deutschen Bürger.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: AT6.4.6
  kind: p
  original: Überhaupt hatte seit der Reformation die deutsche Entwicklung einen ganz kleinbürgerlichen Charakter erhalten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: AT6.4.7
  kind: p
  original: Der alte Feudaladel war größtenteils in den Bauernkriegen vernichtet worden; was übrigblieb, waren entweder reichsunmittelbare Duodezfürsten, die sich allmählich eine ziemliche Unabhängigkeit verschafften und die absolute Monarchie im kleinsten und kleinstädtischsten Maßstabe nachahmten, oder kleinere Grundbesitzer, die teils ihr bißchen Vermögen an den kleinen Höfen durchbrachten und dann von kleinen Stellen in den kleinen Armeen und Regierungsbüros lebten - oder Krautjunker, die ein Leben führten, dessen sich der bescheidenste englische Squire <Landedelmann> oder französische gentilhomme de province <Landedelmann> geschämt hätte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: AT6.4.8
  kind: p
  original: Der Ackerbau wurde auf eine Weise betrieben, die weder Parzellierung noch große Kultur war und die trotz der fortdauernden Hörigkeit und Fronlasten die Bauern nie zur Emanzipation forttrieb, sowohl weil diese Art des Betriebes selbst keine aktiv revolutionäre Klasse aufkommen ließ, als auch weil ihr die einer solchen Bauernklasse entsprechende revolutionäre Bourgeoisie nicht zur Seite stand.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: AT6.5.1
  kind: p
  original: Was die Bürger betrifft, so können wir hier nur ein paar bezeichnende Momente hervorheben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: AT6.5.2
  kind: p
  original: Bezeichnend ist, daß die Leinenmanufaktur, d.h. die auf dem Spinnrad und Handwebstuhl beruhende Industrie, in Deutschland gerade zu derselben Zeit zu einiger Bedeutung kam, als in England diese unbeholfenen Instrumente durch Maschinen verdrängt wurden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: AT6.5.3
  kind: p
  original: Am bezeichnendsten ist ihre Stellung zu Holland.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: AT6.5.4
  kind: p
  original: Holland, der einzige Teil der Hanse, der zu kommerzieller Bedeutung kam, riß sich los, schnitt Deutschland bis auf zwei Häfen (Hamburg und Bremen) vom Welthandel ab und beherrschte seitdem den ganzen deutschen Handel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: AT6.5.5
  kind: p
  original: Die deutschen Bürger waren zu ohnmächtig, der Exploitation durch die Holländer Schranken zu setzen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: AT6.5.6
  kind: p
  original: Die Bourgeoisie des kleinen Hollands mit ihren entwickelten Klasseninteressen war mächtiger als die viel zahlreicheren Bürger Deutschlands mit ihrer Interesselosigkeit und ihren zersplitterten kleinlichen Interessen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 177-178
- id: AT6.5.7
  kind: p
  original: Der Zersplitterung der Interessen entsprach die Zersplitterung der politischen Organisation, die kleinen Fürstentümer und die freien Reichsstädte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: AT6.5.8
  kind: p
  original: Wo sollte politische Konzentration in einem Lande herkommen, dem alle ökonomischen Bedingungen derselben fehlten?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: AT6.5.9
  kind: p
  original: Die Ohnmacht jeder einzelnen Lebenssphäre (man kann weder von Ständen noch von Klassen sprechen, sondern höchstens von gewesenen Ständen und ungebornen Klassen) erlaubte keiner einzigen, die ausschließliche Herrschaft zu erobern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: AT6.5.10
  kind: p
  original: Die notwendige Folge davon war, daß während der Epoche der absoluten Monarchie, die hier in ihrer allerverkrüppeltsten, halb patriarchalischen Form vorkam, die besondre Sphäre, welcher durch die Teilung der Arbeit die Verwaltung der öffentlichen Interessen zufiel, eine abnorme Unabhängigkeit erhielt, die in der modernen Bürokratie noch weiter getrieben wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: AT6.5.11
  kind: p
  original: Der Staat konstituierte sich so zu einer scheinbar selbständigen Macht und hat diese in andern Ländern nur vorübergehende Stellung - Übergangsstufe - in Deutschland bis heute behalten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: AT6.5.12
  kind: p
  original: Aus dieser Stellung erklärt sich sowohl das anderwärts nie vorkommende redliche Beamtenbewußtsein wie die sämtlichen in Deutschland kursierenden Illusionen über den Staat, wie die scheinbare Unabhängigkeit, die die Theoretiker hier gegenüber den Bürgern haben - der scheinbare Widerspruch zwischen der Form, in der diese Theoretiker die Interessen der Bürger aussprechen, und diesen Interessen selbst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: AT6.6.1
  kind: p
  original: Die charakteristische Form, die der auf wirklichen Klasseninteressen beruhende französische Liberalismus in Deutschland annahm, finden wir wieder bei Kant.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: AT6.6.2
  kind: p
  original: Er sowohl wie die deutschen Bürger, deren beschönigender Wortführer er war, merkten nicht, daß diesen theoretischen Gedanken der Bourgeois materielle Interessen und ein durch die materiellen Produktionsverhältnisse bedingter und bestimmter Wille zugrunde lag; er trennte daher diesen theoretischen Ausdruck von den Interessen, die er ausdrückt, machte die materiell motivierten Bestimmungen des Willens der französischen Bourgeois zu reinen Selbstbestimmungen des "freien Willens", des Willens an und für sich, des menschlichen Willens, und verwandelte ihn so in rein ideologische Begriffsbestimmungen und moralische Postulate.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: AT6.6.3
  kind: p
  original: Die deutschen Kleinbürger schauderten daher auch vor der Praxis dieses energischen Bourgeoisliberalismus zurück, sobald diese sowohl in der Schreckensherrschaft als in dem unverschämten Bourgeoiserwerb hervortrat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: AT6.7.1
  kind: p
  original: Unter der Herrschaft Napoleons trieben die deutschen Bürger ihren kleinen Schacher und ihre großen Illusionen noch weiter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: AT6.7.2
  kind: p
  original: Über den Schachergeist, der damals in Deutschland herrschte, kann Sankt Sancho u.a.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: AT6.7.3
  kind: p
  original: Jean Paul vergleichen, um ihm allein zugängliche belletristische Quellen zu zitieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: AT6.7.4
  kind: p
  original: Die deutschen Bürger, die über Napoleon schimpften, weil er sie Zichorien zu trinken zwang und ihren Landfrieden durch Einquartierung und Konskription störte, verschwendeten ihren ganzen moralischen Haß an ihn und ihre ganze Bewunderung an England; während Napoleon ihnen durch seine Reinigung des deutschen Augiasstalles und die Herstellung zivilisierter Kommunikationen die größten Dienste leistete und die Engländer nur auf die Gelegenheit warteten, sie à tort et à travers <wild drauflos> zu exploitieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: AT6.7.5
  kind: p
  original: In gleich kleinbürgerlicher Weise bildeten sich die deutschen Fürsten ein, für das Prinzip der Legitimität und gegen die Revolution zu kämpfen, während sie nur die bezahlten Landsknechte der englischen Bourgeois waren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: AT6.7.6
  kind: p
  original: Unter diesen allgemeinen Illusionen war es ganz in der Ordnung, daß die zur Illusion privilegierten Stände, die Ideologen, die Schulmeister, die Studenten, die Tugendbündler, das große Wort führten und der allgemeinen Phantasterei und der Interesselosigkeit einen analogen, überschwenglichen Ausdruck gaben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: AT6.8.1
  kind: p
  original: Durch die Julirevolution - da wir nur wenige Hauptpunkte andeuten, überspringen wir den Zwischenraum - wurden die der ausgebildeten Bourgeoisie entsprechenden politischen Formen den Deutschen von außen zugeschoben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: AT6.8.2
  kind: p
  original: Da die deutschen ökonomischen Verhältnisse noch bei weitem nicht die Entwicklungsstufe erreicht hatten, der diese politischen Formen entsprachen, so akzeptierten die Bürger diese Formen nur als abstrakte Ideen, an und für sich gültige Prinzipien, fromme Wünsche und Phrasen, Kantsche Selbstbestimmungen des Willens und der Menschen, wie sie sein sollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: AT6.8.3
  kind: p
  original: Sie verhielten sich daher viel sittlicher und uninteressierter zu ihnen als andre Nationen; d.h., sie machten eine höchst eigentümliche Borniertheit geltend und blieben mit allen ihren Bestrebungen ohne Erfolg.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: AT6.9.1
  kind: p
  original: Endlich drückte die immer heftiger werdende Konkurrenz des Auslandes und der Weltverkehr, dem sich Deutschland immer weniger entziehen konnte, die deutschen zersplitterten Lokalinteressen zu einer gewissen Gemeinsamkeit zusammen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: AT6.9.2
  kind: p
  original: Die deutschen Bürger begannen, namentlich seit 1840, auf die Sicherstellung dieser gemeinsamen Interessen zu denken; sie wurden national und liberal und verlangten Schutzzölle und Konstitutionen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: AT6.9.3
  kind: p
  original: Sie sind also jetzt beinahe so weit wie die französischen Bourgeois 1789.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: AT6.10.1
  kind: p
  original: Wenn man, wie die Berliner Ideologen, den Liberalismus und den Staat, selbst innerhalb der deutschen Lokaleindrücke stehend, beurteilt oder gar auf die Kritik der deutschbürgerlichen Illusionen über den Liberalismus sich beschränkt, statt ihn im Zusammenhange mit den wirklichen Interessen aufzufassen, aus denen er hervorgegangen ist und mit denen zusammen er allein wirklich existiert, kommt man natürlich zu den abgeschmacktesten Resultaten von der Welt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: AT6.10.2
  kind: p
  original: Dieser deutsche Liberalismus, wie er sich bis zur neuesten Zeit hin noch aussprach, ist, wie wir gesehen haben, schon in seiner populären Form Schwärmerei, Ideologie über den wirklichen Liberalismus, Wie leicht also, seinen Inhalt ganz in Philosophie, in reine Begriffsbestimmungen, in "Vernunfterkenntnis" zu verwandeln!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: AT6.10.3
  kind: p
  original: Ist man also gar so unglücklich, selbst den verbürgerten Liberalismus nur in der sublimierten Gestalt zu kennen, die Hegel und die von ihm abhängigen Schulmeister ihm gegeben haben, so gelangt man zu Schlußfolgerungen, die ausschließlich ins Reich des Heiligen gehören.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: AT6.10.4
  kind: p
  original: Sancho wird uns hiervon ein trauriges Exempel liefern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: AT6.11.1
  kind: p
  original: '"Man hat in jüngster Zeit" in der aktiven Welt "so viel von" der Herrschaft der Bourgeois "gesprochen, daß man sich nicht wundern darf, wenn die Kunde davon", schon durch den von dem Berliner Buhl übersetzten L. Blanc pp., "auch nach Berlin gedrungen ist" und daselbst die Aufmerksamkeit gemütlicher Schulmeister auf sich gezogen hat (Wigand, p. 190).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: AT6.11.2
  kind: p
  original: Man kann indes nicht sagen, daß "Stirner" in seiner Methode der Aneignung der kursierenden Vorstellungen sich "eine besonders gewinnreiche und einträgliche Wendung angewöhnt" habe (Wig[and] ibid.), wie bereits aus seiner Ausbeutung Hegels hervorging und sich nun eines weiteren ergeben wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: AT6.12.1
  kind: p
  original: Es ist unserm Schulmeister nicht entgangen, daß in neuester Zeit die Liberalen mit den Bourgeois identifiziert wurden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: AT6.12.2
  kind: p
  original: Weil Sankt Max die Bourgeois mit den guten Bürgern, den kleinen Deutschbürgern identifiziert, faßt er das ihm Tradierte nicht, wie es wirklich ist und von allen kompetenten Schriftstellern ausgesprochen wurde - nämlich so, daß die liberalen Redensarten der idealistische Ausdruck der realen Interessen der Bourgeoisie seien, sondern umgekehrt, daß der letzte Zweck des Bourgeois der sei, ein vollendeter Liberaler, ein Staatsbürger zu werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: AT6.12.3
  kind: p
  original: Ihm ist nicht der bourgeois die Wahrheit des citoyen, ihm ist der citoyen die Wahrheit des bourgeois.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: AT6.12.4
  kind: p
  original: Diese ebenso heilige als deutsche Auffassung geht so weit, daß uns p. 130 "das Bürgertum" (soll heißen die Herrschaft der Bourgeoisie) in einen " Gedanken, nichts als einen Gedanken" verwandelt wird und "der Staat" als "der wahre Mensch" auftritt, der den einzelnen Bourgeois in den "Menschenrechten" die Rechte " des " Menschen, die wahre Weihe erteilt - Alles das, nachdem die Illusionen über den Staat und die Menschenrechte bereits in den "Deutsch- Französischen Jahrbüchern" hinlänglich aufgedeckt waren, eine Tatsache, die Sankt Max im "apologetischen Kommentar" anno 1845 endlich merkt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - AT6.N1
  mew_page: 180-181
- id: AT6.12.5
  kind: p
  original: So kann er nun den Bourgeois, indem er ihn als Liberalen von sich als empirischem Bourgeois trennt, in den heiligen Liberalen, wie den Staat in "das Heilige" und das Verhältnis des Bourgeois zum modernen Staat in ein heiliges Verhältnis, in Kultus verwandeln (p. 131), womit er eigentlich seine Kritik über den politischen Liberalismus schon beschlossen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: AT6.12.6
  kind: p
  original: Er hat ihn in "das Heilige" verwandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - AT6.N2
  mew_page: '181'
- id: AT6.13.1
  kind: p
  original: Wir wollen hier einige Exempel davon geben, wie Sankt Max dieses sein Eigentum mit historischen Arabesken herausputzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: AT6.13.2
  kind: p
  original: Hierzu benutzt er die französische Revolution, für die ihm sein Geschichtsmakler, der heilige Bruno, einen kleinen Lieferungskontrakt auf wenige Data vermittelt hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: AT6.14.1
  kind: p
  original: Vermittelst einiger Worte Baillys, die wieder durch des heiligen Bruno "Denkwürdigkeiten" vermittelt sind, "erlangen" durch die Berufung der Generalstaaten "die bisherigen Untertanen das Bewußtsein, daß sie Eigentümer seien" (p. 132).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: AT6.14.2
  kind: p
  original: Umgekehrt, mon brave <mein Bester>, die bisherigen Eigentümer betätigen dadurch ihr Bewußtsein, daß sie keine Untertanen mehr sind - ein Bewußtsein, das schon längst erlangt war, z.B. in den Physiokraten, und polemisch gegen die Bourgeois bei Linguet, "Théorie des lois civiles", 1767, Mercier, Mably, überhaupt den Schriften gegen die Physiokraten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: AT6.14.3
  kind: p
  original: Dieser Sinn wurde auch sogleich erkannt im Anfange der Revolution, z.B. von Brissot, Fauchet, Marat, im Cercle social und von sämtlichen demokratischen Gegnern Lafayettes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: AT6.14.4
  kind: p
  original: Hätte der heilige Max die Sache so gefaßt, wie sie sich unabhängig von seinem Geschichtsmakler zutrug, so würde er sich nicht wundern, daß "Baillys Worte freilich so klingen, [als wäre nun jeder ein Eigentümer..."] <folgen von Mäusen zerfressene Stellen>
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: AT6.15.1
  kind: p
  original: '[... "Stirner" glaubt, "''den guten Bü]rgern'' kann es gleich [gelten, wer sie] und ihre Prinzipien [schützt, ob ei]n absoluter oder konstitutioneller König, eine Republik usw."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 181-182
- id: AT6.15.2
  kind: p
  original: '- Den "guten Bürgern", die in einem Berliner Keller ihr stilles Weißbier trinken, ist dies allerdings "jleichjültig"; aber den historischen Bourgeois ist dies keineswegs gleich.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: AT6.15.3
  kind: p
  original: Der "gute Bürger" "Stirner" bildet sich hier wieder ein, wie überhaupt im ganzen Abschnitte, die französischen, amerikanischen und englischen Bourgeois seien gute Berliner Weißbierphilister.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: AT6.15.4
  kind: p
  original: 'Der obige Satz heißt, aus der Form der politischen Illusion in gutes Deutsch übersetzt: Den Bourgeois "kann es gleichgültig sein", ob sie unumschränkt herrschen oder ob andre Klassen ihrer politischen und ökonomischen Macht die Waage halten.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: AT6.15.5
  kind: p
  original: Sankt Max glaubt, ein absoluter König oder sonst Jemand könne die Bourgeois ebensogut schützen, wie sie sich selbst schützen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: AT6.15.6
  kind: p
  original: Und nun gar "ihre Prinzipien", die darin bestehen, die Staatsmacht dem chacun pour soi, chacun chez soi <jeder für sich, jeder bei sich (zu Hause)> unterzuordnen, sie dafür zu exploitieren - das soll ein "absoluter König" können!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: AT6.15.7
  kind: p
  original: Sankt Max möge uns das Land nennen, wo bei entwickelten Handels- und Industrieverhältnissen, bei einer großen Konkurrenz die Bourgeois sich von einem "absoluten König" schützen lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: AT6.16.1
  kind: p
  original: Nach dieser Verwandlung der geschichtlichen Bourgeois in geschichtslose deutsche Philister braucht "Stirner" denn auch keine andern Bourgeois zu kennen als "behagliche Bürger und treue Beamte" (!!) - zwei Gespenster, die sich nur auf dem "heiligen" deutschen Boden sehn lassen dürfen - und die ganze Klasse als "gehorsame Diener" zusammenzufassen (p. 138).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: AT6.16.2
  kind: p
  original: Er möge sich diese gehorsamen Diener auf der Börse von London, Manchester, New York und Paris einmal ansehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: AT6.16.3
  kind: p
  original: Da Sankt Max im Zuge ist, kann er jetzt auch the whole hog gehen <das Maß vollmachen> und einem bornierten Theoretiker der "Einundzwanzig Bogen" glauben, "der Liberalismus sei die Vernunfterkenntnis angewandt auf unsre bestehenden Verhältnisse", und zu erklären, "die Liberalen seien Eiferer für die Vernunft".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: AT6.16.4
  kind: p
  original: Man sieht aus diesen [...] Phrasen, wie wenig die Deutschen [sich von] ihren ersten Illusionen über den Libera[lismus] erholt haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: AT6.16.5
  kind: p
  original: '"Abraham hat geglaubet auf Hoffnung, da Nichts zu hoffen war, - - und sein Glaube ward ihm gerechnet zur Gerechtigkeit."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: AT6.16.6
  kind: p
  original: Röm[er] 4, 18 und 22.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: AT6.17.1
  kind: p
  original: '"Der Staat bezahlt gut, damit seine guten Bürger ohne Gefahr schlecht bezahlen können; er sichert sich seine Diener, aus denen er für die guten Bürger eine Schutz macht, eine Polizei bildet, durch gute Bezahlung; und die guten Bürger entrichten gern hohe Abgaben an ihn, um desto niedrigere an ihre Arbeiter zu leisten." p. 152.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: AT6.18.1
  kind: p
  original: 'Soll heißen: Die Bourgeois bezahlen ihren Staat gut und lassen die Nation dafür zahlen, damit sie ohne Gefahr schlecht bezahlen können; sie sichern sich durch gute Bezahlung in den Staatsdienern eine Schutzmacht, eine Polizei; sie entrichten gern und lassen die Nation hohe Abgaben entrichten, um das, was sie zahlen, ihren Arbeitern gefahrlos als Abgabe (als Abzug am Arbeitslohn) wieder auflegen zu können.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 182-183
- id: AT6.18.2
  kind: p
  original: '"Stirner" macht hier die neue ökonomische Entdeckung, daß der Arbeitslohn eine Abgabe, eine Steuer ist, die der Bourgeois dem Proletarier zahlt, während die andern, profanen Ökonomen die Steuern als eine Abgabe fassen, die der Proletarier dem Bourgeois zahlt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: AT6.19.1
  kind: p
  original: Von dem heiligen Bürgertum kommt unser heiliger Kirchenvater nun auf das Stirnersche "einzige" Proletariat (p. 148).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: AT6.19.2
  kind: p
  original: Dies besteht aus "Industrierittern, Buhlerinnen, Dieben, Räubern und Mördern, Spielern, vermögenslosen Leuten ohne Anstellung und Leichtsinnigen" (ibid.).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: AT6.19.3
  kind: p
  original: Sie sind "das gefährliche Proletariat" und reduzieren sich für einen Augenblick auf "einzelne Schreier", dann endlich "Vagabonden", deren vollendeter Ausdruck die " geistigen Vagabonden" sind, die sich nicht "in den Schranken einer gemäßigten Denkungsart halten". - - " Solch weiten Sinn hat das sogenannte Proletariat oder" (per appos[itionem]) "der Pauperismus!" (p. 149.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: AT6.20.1
  kind: p
  original: '[Das Pro]letariat wird p. 151 ["dagegen vo]m Staate ausgesogen".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: AT6.20.2
  kind: p
  original: '[Das] ganze Proletariat besteht also aus ruinierten Bourgeois und ruinierten Proletariern, aus einer Kollektion von Lumpen, die in jedem Zeitalter existiert haben und deren massenhafte Existenz nach dem Untergange des Mittelalters dem massenhaften Entstehen des profanen Proletariats vorherging, wie Sankt Max sich aus der englischen und französischen Gesetzgebung und Literatur überzeugen mag.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: AT6.20.3
  kind: p
  original: Unser Heiliger hat ganz dieselbe Vorstellung vom Proletariat wie die "guten behaglichen Bürger" und namentlich die "treuen Beamten".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: AT6.20.4
  kind: p
  original: Er identifiziert konsequenterweise auch Proletariat und Pauperismus, während der Pauperismus die Lage nur des ruinierten Proletariats, die letzte Stufe ist, auf die der gegen den Druck der Bourgeoisie widerstandslos gewordene Proletarier versinkt, und nur der aller Energie beraubte Proletarier ein Pauper ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: AT6.20.5
  kind: p
  original: Vgl. Sismondi, Wade etc. "Stirner" und Konsorten können z.B. in den Augen der Proletarier nach Umständen wohl für Paupers gelten, nie aber für Proletarier.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: AT6.21.1
  kind: p
  original: Dies sind Sankt Maxens "eigene" Vorstellungen von der Bourgeoisie und vom Proletariat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: AT6.21.2
  kind: p
  original: Da er aber mit diesen Imaginationen über Liberalismus, gute Bürger und Vagabunden natürlich zu Nichts kommt, so sieht er sich genötigt, um den Übergang auf den Kommunismus fertigzubringen, die wirklichen, profanen Bourgeois und Proletarier, soweit er sie vom Hörensagen kennt, hereinzubringen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: AT6.21.3
  kind: p
  original: Dies geschieht p. 151 und 152, wo das Lumpenproletariat sich in die "Arbeiter", die profanen Proletarier, verwandelt und die Bourgeois eine Reihe von "mancherlei Wandlungen" und "mannigfaltigen Brechungen" "mit der Zeit" "mitunter" durchmachen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 183-184
- id: AT6.21.4
  kind: p
  original: 'Auf der einen Zeile heißt es: "Die Besitzenden herrschen" - profane Bourgeois; sechs Zeilen weiter: "Der Bürger ist, was er ist, durch die Gnade des Staats" - heilige Bourgeois; wieder sechs Zeilen weiter: "Der Staat ist der status des Bürgertums" - profane Bourgeois; was dahin erklärt wird, daß "der Staat den Besitzenden" "ihren Besitz zu Lehen" gibt und daß das "Geld und Gut" der "Kapitalisten" - ein solches vom Staat zu "Lehen" übertragenes "Staatsgut" ist - heilige Bourgeois.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: AT6.21.5
  kind: p
  original: 'Am Ende verwandelt sich dann dieser allmächtige Staat wieder in "den Staat der Besitzenden", also der profanen Bourgeois, wozu dann eine spätere Stelle paßt: "Die Bourgeoisie wurde durch die Revolution allmächtig. " p. 156.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: AT6.21.6
  kind: p
  original: Diese "seelenmarternden" und "gräßlichen" Widersprüche hätte selbst Sankt Max nie zustande gebracht, wenigstens nie zu promulgieren gewagt, wenn ihm nicht das deutsche Wort "Bürger", das er nach Belieben als "citoyen" oder "bourgeois" oder als deutscher "guter Bürger" auslegen kann, zu Hülfe gekommen wäre.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: AT6.22.1
  kind: p
  original: Ehe wir weitergehen, müssen wir noch zwei große politisch-ökonomische Entdeckungen konstatieren, die unser Biedermann "in der Stille des Gemütes" "zutage fördert" und die mit der "Jünglingslust" von p. 17 das gemein haben, daß sie ebenfalls "reine Gedanken" sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: AT6.23.1
  kind: p
  original: p. 150 reduziert sich alles Unheil der bestehenden sozialen Verhältnisse darauf, daß "Bürger und Arbeiter an die 'Wahrheit' des Geldes glauben".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: AT6.23.2
  kind: p
  original: Jacques le bonhomme bildet sich hier ein, es hänge von den "Bürgern" und "Arbeitern" ab, die in allen zivilisierten Staaten der Welt zerstreut sind, morgen am Tage urplötzlich ihren "Unglauben" an die "Wahrheit des Geldes" zu Protokoll zu geben, er glaubt sogar, daß, wenn dieser Unsinn möglich sei, damit irgend etwas getan sei.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: AT6.23.3
  kind: p
  original: Er glaubt, die "Wahrheit des Geldes" könne jeder Berliner Literat ebensogut abschaffen, wie er für seinen Kopf die "Wahrheit" Gottes oder der Hegelschen Philosophie abschafft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: AT6.23.4
  kind: p
  original: Daß das Geld ein notwendiges Produkt gewisser Produktions- und Verkehrsverhältnisse ist und eine "Wahrheit" bleibt, solange diese Verhältnisse existieren, das geht einen Heiligen wie Sankt Max, der gen Himmel schaut und der profanen Welt seinen profanen Hintern zudreht, natürlich Nichts an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: AT6.24.1
  kind: p
  original: Die zweite Entdeckung wird auf p. 152 gemacht und geht dahin, daß "der Arbeiter seine Arbeit nicht verwerten kann", weil er "Denen, die irgendein Staatsgut" "zu Lehen" erhalten haben, "in die Hände fällt".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: AT6.24.2
  kind: p
  original: Dies ist nur die weitere Erklärung des schon früher zitierten Satzes von p. 151, daß der Arbeiter vom Staate ausgesogen wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: AT6.24.3
  kind: p
  original: Hierbei "stellt" sogleich Jeder "die einfache Reflexion an" - daß "Stirner" dies nicht tut, ist nicht "zu verwundern"-, wie es denn komme, daß der Staat nicht auch den "Arbeitern" irgendein "Staatsgut" zum "Lehen" gegeben habe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 184-185
- id: AT6.24.4
  kind: p
  original: Hätte Sankt Max sich diese Frage gestellt, so würde er sich seine Konstruktion des "heiligen" Bürgertums wahrscheinlich erspart haben, weil er dann hätte sehen müssen, in welchem Verhältnis die Besitzenden zum modernen Staat stehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: AT6.25.1
  kind: p
  original: Vermittelst des Gegensatzes von Bourgeoisie und Proletariat - das weiß selbst "Stirner" - kommt man auf den Kommunismus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: AT6.25.2
  kind: p
  original: Wie man aber darauf kommt, das weiß nur "Stirner".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: AT6.26.1
  kind: p
  original: '"Die Arbeiter haben die ungeheuerste Macht in Händen - - sie dürften nur die Arbeit einstellen und das Gearbeitete als das Ihrige ansehen und genießen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: AT6.26.2
  kind: p
  original: Dies ist der Sinn der hie und da auftauchenden Arbeiterunruhen." p. 53.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: AT6.27.1
  kind: p
  original: Die Arbeiterunruhen, die bereits unter dem byzantinischen Kaiser Zeno ein Gesetz veranlaßten (Zeno, de novis operibus constitutio <Verordnung über die neuen Arbeiten>), die im 14. Jahrhundert in der Jacquerie und dem Aufstande von Wat Tyler, 1518 am evil may-day in London und 1549 im großen Aufstande des Gerbers Ket "auftauchten", die dann den Act 2 und 3 Edward VI., 15 und eine Reihe ähnlicher Parlamentsakte veranlaßten, die bald darauf 1640 und 1659 (acht Aufstände in einem Jahre) in Paris vorkamen und schon seit dem vierzehnten Jahrhundert in Frankreich und England, der gleichzeitigen Gesetzgebung zufolge, häufig gewesen sein müssen - der beständige Krieg, der seit 1770 in England und seit der Revolution in Frankreich von den Arbeitern gegen die Bourgeois mit Gewalt und List geführt wird - Alles Das existiert für Sankt Max nur "hie und da", in Schlesien, Posen, Magdeburg und Berlin, "wie deutsche Blätter melden".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: AT6.28.1
  kind: p
  original: Das Gearbeitete würde, wie Jacques le bonhomme sich einbildet, als Gegenstand des "Ansehens" und "Genießens" immer fortexistieren und sich reproduzieren, wenn auch die Produzenten "die Arbeit einstellten".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: AT6.29.1
  kind: p
  original: Wie oben beim Gelde, verwandelt unser guter Bürger hier wieder "die Arbeiter", die in der ganzen zivilisierten Welt zerstreut sind, in eine geschlossene Gesellschaft, die nur einen Beschluß zu fassen hat, um sich aus allen Schwierigkeiten zu befreien.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: AT6.29.2
  kind: p
  original: Sankt Max weiß natürlich nicht, daß allein seit 1830 in England wenigstens fünfzig Versuche gemacht wurden, daß in diesem Augenblicke noch einer gemacht wird, um die sämtlichen Arbeiter nur von England in eine einzige Assoziation zusammenzubringen, und daß höchst empirische Gründe das Gelingen aller dieser Projekte vereitelten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: AT6.29.3
  kind: p
  original: Er weiß nicht, daß selbst eine Minorität der Arbeiter, die sich zu einer Arbeitseinstellung vereinigt, sich sehr bald gezwungen sieht, revolutionär aufzutreten, eine Tatsache, die er an der englischen Insurrektion von 1842 und früher schon an der welschen <walisischen> Insurrektion von 1839 hätte lernen können, in welchem Jahre die revolutionäre Aufregung unter den Arbeitern zuerst in dem "heiligen Monat", der zugleich mit der allgemeinen Bewaffnung des Volks proklamiert wurde, einen umfassenden Ausdruck erhielt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 185-186
- id: AT6.29.4
  kind: p
  original: Man sieht hier wieder, wie Sankt Max überall seinen Unsinn als " den Sinn" geschichtlicher Fakta an den Mann zu bringen sucht, was ihm höchstens bei seinem "Man" gelingt - geschichtlicher Fakta, "denen er seinen Sinn unterschiebt, die also auf einen Unsinn auslaufen mußten" (Wigand, p. 194).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: AT6.29.5
  kind: p
  original: Übrigens fällt es keinem Proletarier ein, Sankt Max über "den Sinn" der proletarischen Bewegungen oder über das, was jetzt gegen die Bourgeoisie zu unternehmen sei, zu Rate zu ziehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: AT6.30.1
  kind: p
  original: 'Nach dieser großen Kampagne zieht sich unser heiliger Sancho mit folgender Fanfare zu seiner Maritornes zurück:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: AT6.31.1
  kind: p
  original: '"Der Staat beruht auf der Sklaverei der Arbeit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: AT6.31.2
  kind: p
  original: Wird die Arbeit frei, so hat der Staat verloren." (p. 153.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: AT6.32.1
  kind: p
  original: Der moderne Staat, die Herrschaft der Bourgeoisie, beruht auf der Freiheit der Arbeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: AT6.32.2
  kind: p
  original: Der heilige Max hat sich ja selbst, wie oft! freilich karikiert genug! aus den "Deutsch-Französischen Jahrbüchern" abstrahiert, daß mit der Freiheit der Religion, des Staats, des Denkens pp., also doch "mitunter" "wohl auch" "etwa" der Arbeit, nicht Ich, sondern nur Einer meiner Zwingherrn frei werde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: AT6.32.3
  kind: p
  original: Die Freiheit der Arbeit ist die freie Konkurrenz der Arbeiter unter sich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: AT6.32.4
  kind: p
  original: Sankt Max hat großes Unglück, wie in allen andern Sphären, so auch in der Nationalökonomie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: AT6.32.5
  kind: p
  original: Die Arbeit ist frei in allen zivilisierten Ländern; es handelt sich nicht darum, die Arbeit zu befreien, sondern sie aufzuheben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: AT6.33.1
  kind: heading
  original: B) Der Kommunismus
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: AT6.34.1
  kind: p
  original: Sankt Max nennt den Kommunismus den "sozialen Liberalismus", weil er wohl weiß, in welchem schlechten Geruch das Wort Liberalismus bei den Radikalen von 1842 und bei den am weitesten gegangenen Berliner Freijeistern steht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: AT6.34.2
  kind: p
  original: Diese Verwandlung gibt ihm zugleich Gelegenheit und Courage, den "sozialen Liberalen" allerlei Dinge in den Mund zu legen, die vor "Stirner" noch nie ausgesprochen wurden und deren Widerlegung dann zugleich den Kommunismus widerlegen soll.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: AT6.35.1
  kind: p
  original: Die Überwindung des Kommunismus geschieht durch eine Reihe teils logischer, teils historischer Konstruktionen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: AT6.36.1
  kind: p
  original: Erste logische Konstruktion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.37.1
  kind: p
  original: Weil "Wir Uns zu Dienern von Egoisten gemacht sehen", "sollen Wir" nicht selbst zu Egoisten werden - - sondern lieber die Egoisten unmöglich machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.37.2
  kind: p
  original: Wir wollen sie Alle zu Lumpen machen, wollen Alle Nichts haben, damit 'Alle' haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.37.3
  kind: p
  original: '- So die Sozialen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.37.4
  kind: p
  original: '- Wer ist diese Person, die ihr ''Alle'' nennt?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.37.5
  kind: p
  original: Es ist die 'Gesellschaft'," p. 153.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.38.1
  kind: p
  original: Vermittelst ein paar Anführungszeichen verwandelt Sancho hier "Alle" in eine Person, die Gesellschaft als Person, als Subjekt = die heilige Gesellschaft, das Heilige.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.38.2
  kind: p
  original: Jetzt weiß unser Heiliger, woran er ist, und kann einen ganzen Strom seines Feuereifers gegen "das Heilige" loslassen, womit natürlich der Kommunismus vernichtet ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.39.1
  kind: p
  original: Daß Sankt Max hier wieder den "Sozialen" seinen Unsinn als ihren Sinn in den Mund legt, ist nicht "zu verwundern".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.39.2
  kind: p
  original: Er identifiziert zuerst das "Haben" als Privateigentümer mit dem "Haben" überhaupt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.39.3
  kind: p
  original: Statt die bestimmten Verhältnisse des Privateigentums zur Produktion, statt das "Haben" als Grundbesitzer, als Rentier, als Commercant <Kaufmann>, als Fabrikant, als Arbeiter zu betrachten - wo sich das "Haben" als ein ganz bestimmtes Haben, als das Kommando über fremde Arbeit ausweist - verwandelt er alle diese Verhältnisse in "die Habe". <hier fehlen im Manuskript 4 Seiten, nämlich der Bogen 31, auf dem sich der Schluß der "Ersten logischen Konstruktion" und der Anfang der "Zweiten logischen Konstruktion" befand>
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.40.1
  kind: p
  original: '[...] den politischen Liberalismus tun ließ, der die "Nation" zur höchsten Eigentümerin machte.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.40.2
  kind: p
  original: Der Kommunismus hat also gar kein "persönliches Eigentum" mehr "abzuschaffen", sondern höchstens die Verteilung der "Lehen" auszugleichen, die "égalité" <"Gleichheit"> darin einzuführen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.40.3
  kind: p
  original: 'Über die Gesellschaft als "höchste Eigentümerin" und den "Lumpen" vergleiche Sankt Max u.a. den "Egalitaire" von 1840:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.41.1
  kind: p
  original: '"Das soziale Eigentum ist ein Widerspruch, aber der soziale Reichtum ist eine Folge des Kommunismus.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.41.2
  kind: p
  original: Fourier sagt hundertmal, im Gegensatz zu den bescheidnen Bourgeoismoralisten, nicht darin, daß Einige zu viel haben, liege ein soziales Übel, sondern darin, daß Alle zu wenig haben", und signalisiert darum auch, "Le fausse industrie", Paris 1835, p. 410, die "Armut der Reichen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.42.1
  kind: p
  original: 'Desgleichen heißt es bereits in der 1839, also vor Weitlings "Garantien", in Paris erschienenen deutschen kommunistischen Zeitschrift "Die Stimme des Volks", Heft II, p. 14:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.43.1
  kind: p
  original: '"Das Privateigentum, der vielbelobte, fleißige, gemütliche, unschuldige ''Privaterwerb'', tut offenbar Abbruch dem Lebensreichtum."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: AT6.44.1
  kind: p
  original: Sankt Sancho nimmt hier die Vorstellung einiger zum Kommunismus übergehenden Liberalen und die Ausdrucksweise einiger aus sehr praktischen Gründen in politischer Form sprechenden Kommunisten für den Kommunismus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: AT6.45.1
  kind: p
  original: Nachdem er das Eigentum "der Gesellschaft" übertragen hat, werden ihm sämtliche Teilhaber dieser Gesellschaft sofort zu Habenichtsen und Lumpen, obgleich sie selbst in seiner Vorstellung von der kommunistischen Ordnung der Dinge die "höchste Eigentümerin" "haben".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: AT6.45.2
  kind: p
  original: '- Der wohlmeinende Vorschlag, den er den Kommunisten macht, "das Wort ''Lump'' zu einer ehrenden Anrede zu erheben, wie die Revolution das Wort Bürger dazu erhob", ist ein schlagendes Beispiel, wie er den Kommunismus mit einer längst dagewesenen Sache verwechselt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: AT6.45.3
  kind: p
  original: Die Revolution hat selbst, im Gegensatz zu den "honnêtes gens" <anständigen Leuten>, die er sehr dürftig durch gute Bürger übersetzt, das Wort sans-culotte "zu einer ehrenden Anrede erhoben".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: AT6.45.4
  kind: p
  original: 'Solches tut der heilige Sancho, auf daß erfüllet werde das Wort, das da geschrieben steht im Propheten Merlin von den dreitausenddreihundert Backenstreichen, die der Mann, der da kommen soll, sich selber geben muß:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: AT6.46.1
  kind: p
  original: Es menester, que Sancho tu escudero se dé tres mil azotes, y tre cientos En ambas sus valientes posaderas Al aire descubiertas, y de modo Que le escuezan, le amarguen y le enfaden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: AT6.47.1
  kind: p
  original: <Es muß dein Schildknapp' Sancho sich dreitausend Und noch dreihundert Geißelhiebe geben Auf seine beiden mächt'gen Sitzfleischhälften, Die er entblößt, und so, daß diese Streiche Ihn wirklich schmerzen, brennen, peinigen.>
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: AT6.48.1
  kind: p
  original: (Don Quijote, Band II, Kapitel 35.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: AT6.49.1
  kind: p
  original: Sankt Sancho konstatiert "die Erhebung der Gesellschaft zur höchsten Eigentümerin" als "zweiten Raub am Persönlichen, im Interesse der Menschlichkeit", während der Kommunismus nur der vollendete Raub am "Raub des Persönlichen" ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: AT6.49.2
  kind: p
  original: '"Weil ihm der Raub ohne alle Frage für verabscheuungswürdig gilt, darum glaubt z.B."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: AT6.49.3
  kind: p
  original: Sankt Sancho "schon mit dem" obigen "Satze" den Kommunismus "gebrandmarkt zu haben". ("Das Buch", p. 102.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: AT6.49.4
  kind: p
  original: '"Hatte" "Stirner" "gar den Raub" am Kommunismus "gewittert, wie sollte er denn nicht gegen ihn einen ''tiefen Abscheu'' und eine ''gerechte Entrüstung'' gefaßt haben"! (Wig[and,] p. 156.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: AT6.49.5
  kind: p
  original: '"Stirner" wird hiermit aufgefordert, uns den Bourgeois zu nennen, der über den Kommunismus (oder Chartismus) geschrieben und nicht dieselbe Albernheit mit vieler Emphase vorgebracht hat.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 188-189
- id: AT6.49.6
  kind: p
  original: An dem, was dem Bourgeois für "persönlich" gilt, wird der Kommunismus allerdings einen "Raub" ausüben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: AT6.50.1
  kind: p
  original: Erstes Korollar.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: AT6.51.1
  kind: p
  original: p. 349.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: AT6.51.2
  kind: p
  original: '"Der Liberalismus trat sogleich mit der Erklärung auf, daß es zum Wesen des Menschen gehöre, nicht Eigentum, sondern Eigentümer zu sein.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: AT6.51.3
  kind: p
  original: Da es hierbei um den Menschen, nicht um den Einzelnen zu tun war, so blieb das Wieviel, welches grade das spezielle Interesse der Einzelnen ausmachte, diesen überlassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: AT6.51.4
  kind: p
  original: Daher behielt der Egoismus der Einzelnen in diesem Wieviel den freiesten Spielraum und trieb eine unermüdliche Konkurrenz."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: AT6.52.1
  kind: p
  original: D.h. der Liberalismus, i.e. die liberalen Privateigentümer, gaben im Anfange der französischen Revolution dem Privateigentum einen liberalen Schein, indem sie es für ein Menschenrecht erklärten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: AT6.52.2
  kind: p
  original: Sie waren hierzu schon durch ihre Stellung als revolutionierende Partei gezwungen, sie waren sogar gezwungen, der Masse des französischen [Land]volks nicht nur das Recht des Eigentums zu geben, son[dern a]uch wirkliches Eigentum nehmen zu lassen, und sie konnten dies Alles tun, weil dadurch ihr eignes "Wieviel", worauf es ihnen hauptsächlich ankam, unberührt blieb und sogar sichergestellt wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: AT6.52.3
  kind: p
  original: '- Wir finden hier ferner konstatiert, daß Sankt Max die Konkurrenz aus dem Liberalismus entstehen läßt, ein Backenstreich, den er der Geschichte aus Rache für die Backenstreiche gibt, die er oben sich selbst geben mußte.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: AT6.52.4
  kind: p
  original: 'Die "genauere Erklärung" des Manifestes, womit er den Liberalismus " sogleich auftreten" läßt, finden wir bei Hegel, der sich im Jahre 1820 dahin aussprach:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: AT6.53.1
  kind: p
  original: '"Im Verhältnis zu äußerlichen Dingen ist das Vernünftige (d.h. geziemt es mir als Vernunft, als Mensch), "daß ich Eigentum besitze - - was und wieviel ich besitze, ist daher eine rechtliche Zufälligkeit." ("Rechtsphil[osophie]", § 49.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: AT6.54.1
  kind: p
  original: Bei Hegel ist das Bezeichnende, daß er die Phrase des Bourgeois zum wirklichen Begriff, zum Wesen des Eigentums macht, was "Stirner" ihm getreulich nachmacht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: AT6.54.2
  kind: p
  original: Sankt Max basiert nun auf obige Entwicklung die weitere Aussage, daß der Kommunismus
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: AT6.55.1
  kind: p
  original: '"die Frage nach dem Wieviel des Innehabens aufstellte und sie dahin beantwortete, daß der Mensch so viel haben müsse, als er brauche.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: AT6.55.2
  kind: p
  original: Wird sich mein Egoismus damit genügen können? - - - Ich muß vielmehr so viel haben, als ich mir anzueignen vermögend bin." (p. 349.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: AT6.56.1
  kind: p
  original: Zuerst ist hier zu bemerken, daß der Kommunismus keineswegs aus dem § 49 der Hegelschen "Rechtsphilosophie" und seinem "Was und Wieviel" hervorging.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 189-190
- id: AT6.56.2
  kind: p
  original: Zweitens fällt es " dem Kommunismus" nicht ein, " dem Menschen" etwas geben zu wollen, da " der Kommunismus" keineswegs der Meinung ist, daß " der Mensch" irgend etwas "brauche" als eine kurze kritische Beleuchtung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: AT6.56.3
  kind: p
  original: Drittens schiebt er dem Kommunismus das "Brauchen" des heutigen Bourgeois unter, er bringt also eine Distinktion herein, die ihrer Lumpigkeit wegen bloß in der heutigen Gesellschaft und ihrem ideellen Abbilde, dem Stirnerschen Verein von "einzelnen Schreiern" und freien Nähterinnen, von Wichtigkeit sein kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: AT6.56.4
  kind: p
  original: '"Stirner" hat wieder große "Durchschauungen" des Kommunismus zustande gebracht.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: AT6.56.5
  kind: p
  original: Schließlich unterstellt Sankt Sancho in seiner Forderung, so viel haben zu müssen, als er selbst sich anzueignen vermögend ist (wenn diese nicht etwa auf die gewöhnliche Bourgeoisphrase, daß Jeder nach Vermögen haben, das Recht des freien Erwerbs haben solle), den Kommunismus als durchgesetzt, um sein "Vermögen" frei entwickeln und geltend machen zu können, was keineswegs allein von ihm, so wenig wie sein "Vermögen" selbst, sondern auch von den Produktions- und Verkehrsverhältnissen, in denen er lebt, abhängt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: AT6.56.6
  kind: p
  original: '- (Vgl. unten den "Verein".)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: AT6.56.7
  kind: p
  original: Sankt Max handelt übrigens nicht einmal selbst nach seiner Lehre, da er in seinem ganzen "Buche" Sachen "braucht" und verbraucht, die er "sich anzueignen" nicht "vermögend war".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: AT6.57.1
  kind: p
  original: Zweites Korollar.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: AT6.58.1
  kind: p
  original: '"Aber die Sozialreformer predigen Uns ein Gesellschaftsrecht.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: AT6.58.2
  kind: p
  original: Da wird der Einzelne der Sklave der Gesellschaft." p. 246.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: AT6.58.3
  kind: p
  original: '"Nach der Meinung der Kommunisten soll jeder die ewigen Menschenrechte genießen." p. 238.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: AT6.59.1
  kind: p
  original: Über die Ausdrücke Recht, Arbeit pp., wie sie bei proletarischen Schriftstellern vorkommen, und wie sich die Kritik zu ihnen zu verhalten hat, werden wir beim "wahren Sozialismus" (siehe Band II) <gemeint ist Band II der "Deutschen Ideologie"> sprechen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: AT6.59.2
  kind: p
  original: Was das Recht betrifft, so haben wir unter vielen Andern den Gegensatz des Kommunismus gegen das Recht sowohl als politisches und privates als auch in seiner allgemeinsten Form als Menschenrecht geltend gemacht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: AT6.59.3
  kind: p
  original: Siehe "Deutsch-Französische Jahrbücher", wo das Privilegium, das Vorrecht als entsprechend dem ständisch gebundenen Privateigentum, und das Recht als entsprechend dem Zustande der Konkurrenz, des freien Privateigentums gefaßt ist, p. 206 und anderwärts; ebenso das Menschenrecht selbst als Privilegium und das Privateigentum als Monopol.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: AT6.59.4
  kind: p
  original: Ferner die Kritik des Rechts in Zusammenhang gebracht mit der deutschen Philosophie und als Konsequenz der Kritik der Religion dargestellt, p. 72, und ausdrücklich die Rechtsaxiome, die auf den Kommunismus führen sollen, als Axiome des Privateigentums gefaßt, wie das gemeinsame Besitzrecht als eingebildete Voraussetzung des Rechts des Privateigentums, p. 98, 99.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 190-191
- id: AT6.60.1
  kind: p
  original: Die obige Redensart übrigens einem Babeuf entgegenzuhalten, ihn als theoretischen Repräsentanten des Kommunismus zu fassen, konnte nur einem Berliner Schulmeister einfallen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: AT6.60.2
  kind: p
  original: '"Stirner" entblödet sich indessen nicht, p. 247 zu behaupten, daß der Kommunismus, welcher annimmt,'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: AT6.61.1
  kind: p
  original: '"daß die Menschen von Natur gleiche Rechte haben, seinen eignen Satz dahin widerlege, daß die Menschen von Natur gar keine Rechte haben.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: AT6.61.2
  kind: p
  original: Denn er will z.B. nicht anerkennen, daß die Eltern Rechte gegen die Kinder haben, er hebt die Familie auf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: AT6.61.3
  kind: p
  original: Überhaupt beruht dieser ganze revolutionäre oder Babeufsche (vgl. 'Die Kommunisten in der Schweiz, Kommissionalbericht', p. 3) Grundsatz auf einer religiösen, d.h. falschen Anschauung."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: AT6.62.1
  kind: p
  original: 'Nach England kommt ein Yankee, wird durch den Friedensrichter daran gehindert, seinen Sklaven auszupeitschen, und ruft entrüstet aus: "Do you call this a land of liberty, where a man can''t larrup his nigger?" <"Nennen Sie das ein freies Land, wo man seinen Nigger nicht durchprügeln kann?">'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: AT6.63.1
  kind: p
  original: Sankt Sancho blamiert sich hier doppelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: AT6.63.2
  kind: p
  original: Erstens sieht er darin eine Aufhebung der "gleichen Rechte der Menschen", daß die "von Natur gleichen Rechte" der Kinder gegen die Eltern geltend gemacht, daß Kindern wie Eltern gleiches Menschenrecht gegeben wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: AT6.63.3
  kind: p
  original: Zweitens erzählt Jacques le bonhomme zwei Seiten vorher, daß der Staat sich nicht einmische, wenn der Sohn vom Vater geprügelt werde, weil er das Familienrecht anerkenne.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: AT6.63.4
  kind: p
  original: Was er also einerseits für ein partikulares Recht (Familienrecht) ausgibt, subsumiert er andrerseits unter die "von Natur gleichen Rechte der Menschen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: AT6.63.5
  kind: p
  original: Schließlich gesteht er uns, daß er den Babeuf nur aus dem Bluntschlibericht kennt, während der Bluntschlibericht p. 3 uns ebenfalls gesteht, daß er seine Weisheit aus dem wackern L. Stein, Doktor der Rechte, geschöpft hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: AT6.63.6
  kind: p
  original: Die gründliche Kenntnis, die Sankt Sancho vom Kommunismus hat, geht aus diesem Zitat hervor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: AT6.63.7
  kind: p
  original: Wie Sankt Bruno sein Revolutionsmakler, so ist Sankt Bluntschli sein Kommunistenmakler.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: AT6.63.8
  kind: p
  original: Bei diesem Stande der Dinge darf es uns auch nicht wundern, wenn unser Wort Gottes vom Lande ein paar Zeilen weiter die fraternité <Brüderlichkeit> der Revolution auf die "Gleichheit der Kinder Gottes" (in welcher christlichen Dogmatik kommt die égalite vor?) reduziert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: AT6.64.1
  kind: p
  original: Drittes Korollar.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: AT6.65.1
  kind: p
  original: 'p. 414: Weil das Prinzip der Gemeinschaft im Kommunismus kulminiert, darum ist der Kommunismus = "Glorie des Liebesstaat".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: AT6.66.1
  kind: p
  original: Aus dem Liebesstaat, der ein eigenes Fabrikat Sankt Maxens ist, leitet er hier den Kommunismus ab, der dann natürlich auch ein ausschließlich Stirnerscher Kommunismus bleibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: AT6.66.2
  kind: p
  original: Sankt Sancho kennt nur den Egoismus auf der einen oder den Anspruch auf die Liebesdienste, Erbarmen, Almosen der Leute auf der andern Seite.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: AT6.66.3
  kind: p
  original: Außer und über diesem Dilemma gibt es für ihn Nichts.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: AT6.67.1
  kind: p
  original: Dritte logische Konstruktion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: AT6.68.1
  kind: p
  original: '"Weil in der Gesellschaft sich die drückendsten Übelstände bemerklich machen, so denken besonders" (!) "die Gedrückten" (!), "die Schuld in der Gesellschaft zu finden, und machen sich''s zur Aufgabe, die rechte Gesellschaft zu entdecken." p. 155.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: AT6.69.1
  kind: p
  original: Im Gegenteil "macht sich's" "Stirner" "zur Aufgabe", die ihm "rechte Gesellschaft", die heilige Gesellschaft, die Gesellschaft als das Heilige zu entdecken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: AT6.69.2
  kind: p
  original: Die heutzutage "in der Gesellschaft" "Gedrückten" "denken" bloß darauf, die ihnen rechte Gesellschaft, die zunächst in der Abschaffung der jetzigen Gesellschaft, auf der Basis der vorgefundenen Produktivkräfte, besteht, durchzusetzen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: AT6.69.3
  kind: p
  original: Weil e.g. <exempli gratia = zum Beispiel> bei einer Maschine "sich drückende Übelstände bemerkbar machen", z.B. daß sie nicht gehen will, und Diejenigen, die die Maschine nötig haben, z.B. um Geld zu machen, den Übelstand in der Maschine finden, auf ihre Veränderung ausgehen pp., so machen sie sich's nach Sankt Sancho zur Aufgabe, nicht sich die Maschine zurechtzurücken, ein sondern die rechte Maschine, die heilige Maschine, die Maschine als das Heilige, das Heilige als die Maschine, die Maschine im Himmel zu entdecken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: AT6.69.4
  kind: p
  original: '"Stirner" rät ihnen, "in sich" die Schuld suchen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: AT6.69.5
  kind: p
  original: Ist es nicht ihre Schuld, daß sie z.B. der Hacke und des Pflugs bedürfen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: AT6.69.6
  kind: p
  original: Könnten sie nicht mit den Nägeln die Kartoffeln in den Boden hinein- und aus ihm herauskratzen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: AT6.69.7
  kind: p
  original: 'Der Heilige predigt ihnen darüber p. 156:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: AT6.70.1
  kind: p
  original: '"Es ist das nur eine alte Erscheinung, daß man die Schuld zuerst in allem Andern als in sich sucht - also im Staat, in der Selbstsucht der Reichen, die doch gerade unsere Schuld ist."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: AT6.71.1
  kind: p
  original: Der "Gedrückte", der "im Staate" "die Schuld" des Pauperismus sucht, ist, wie wir oben vorläufig sahen, Niemand anders als Jacques le bonhomme selbst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: AT6.71.2
  kind: p
  original: Zweitens, der "Gedrückte", der sich dabei beruhigt, die "Schuld" in der "Selbstsucht des Reichen" finden zu lassen, ist wieder Niemand anders als Jacques le bonhomme.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: AT6.71.3
  kind: p
  original: Er hätte sich aus des Schneiders und Doktors der Philosophie John Watts "Facts and Fictions", aus Hobsons "Poor Man's Companion" etc. eines Bessern in Beziehung auf die andern Gedrückten belehren können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 192-193
- id: AT6.71.4
  kind: p
  original: Und wer ist, drittens; die Person von "Unsrer Schuld", etwa das Proletarierkind, das., skrofulös auf die Welt kommt, mit Opium heraufgezogen, im siebenten Jahre in die Fabrik geschickt wird - etwa der einzelne Arbeiter, dem hier zugemutet wird, sich auf seine Faust gegen den Weltmarkt zu "empören" - etwa das Mädchen, das entweder verhungern oder sich prostituieren muß?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.71.5
  kind: p
  original: 'Nein, sondern nur Der, der "alle Schuld", d.h. die "Schuld" des ganzen jetzigen Weltzustandes "in sich" sucht, nämlich abermals Niemand als Jacques le bonhomme selbst: "Es ist dies nur die alte Erscheinung" des christlichen Insichgehens und Bußetuns in germanisch-spekulativer Form, der idealistischen Phraseologie, wo Ich, der Wirkliche, nicht die Wirklichkeit verändern muß, was ich nur mit Andern kann, sondern in mir mich verändern.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.71.6
  kind: p
  original: '"Es ist der innerliche Kampf des Schriftstellers mit sich selbst."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.71.7
  kind: p
  original: (Die heilige Familie", p. 122, vgl. p. 73, p. 121 und p. 306.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.72.1
  kind: p
  original: Nach Sankt Sancho suchen also die von der Gesellschaft Gedrückten die rechte Gesellschaft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.72.2
  kind: p
  original: Konsequent müßte er also auch Diejenigen, die "im Staate die Schuld suchen", und Beide sind bei ihm dieselben Personen, den rechten Staat suchen lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.72.3
  kind: p
  original: Dies darf er aber nicht, denn er hat davon gehört, daß die Kommunisten den Staat abschaffen wollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.72.4
  kind: p
  original: 'Diese Abschaffung des Staats muß er jetzt konstruieren, und dies vollbringt der heilige Sancho wieder vermittelst seines "Grauen", der Apposition, in einer Weise, die "sehr einfach aussieht":'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.73.1
  kind: p
  original: '"Weil die Arbeiter sich im Notstand befinden, so muß der gegenwärtige Stand der Dinge d.i. der Staat (status = Stand) abgeschafft werden" (ibid.).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.74.1
  kind: p
  original: 'Also:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.75.1
  kind: p
  original: Notstand = gegenwärtigem Stand der Dinge.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.76.1
  kind: p
  original: Gegenwärtiger Stand der Dinge = Stand.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.77.1
  kind: p
  original: Stand = Status.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.78.1
  kind: p
  original: Status = Staat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.79.1
  kind: p
  original: 'Schluß: Notstand = Staat.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.80.1
  kind: p
  original: Was kann "einfacher aussehen"?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.80.2
  kind: p
  original: '"Es ist nur zu verwundern", daß die englischen Bourgeois von 1688, und die französischen von 1789 nicht dieselben "einfachen Reflexionen und Gleichungen "anstellten", wo damals doch noch viel mehr der Stand = Status = der Staat war.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.80.3
  kind: p
  original: Es folgt daraus, daß überall, wo "Notstand" vorhanden ist, " der Staat", der natürlich in Preußen und in Nordamerika derselbe ist, abgeschafft werden muß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '193'
- id: AT6.81.1
  kind: p
  original: Sankt Sancho gibt uns jetzt, nach seiner Gewohnheit, einige Sprüche Salomonis.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '194'
- id: AT6.82.1
  kind: p
  original: Spruch Salomonis Nr. 1.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '194'
- id: AT6.83.1
  kind: p
  original: 'p. 163: "Daß die Gesellschaft gar kein Ich ist, das gehen pp. könnte, sondern ein Instrument, aus dem wir Nutzen ziehen mögen. daß wir keine gesellschaftlichen Pflichten, sondern lediglich Interessen haben, daß wir der Gesellschaft keine Opfer schuldig sind, sondern, opfern wir etwas, es Uns opfern, daran denken die Sozialen nicht, weil sie im religiösen Prinzip gefangen sitzen und eifrig trachten nach einer - heiligen Gesellschaft,"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '194'
- id: AT6.84.1
  kind: p
  original: 'Hieraus ergeben sich folgende "Durchschauungen" des Kommunismus:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '194'
- id: AT6.85.1
  kind: p
  original: 1. hat Sankt Sancho ganz vergessen, daß Er selber es war, der "die Gesellschaft" in ein "Ich" verwandelte, und sich daher bloß in seiner eignen "Gesellschaft" befindet;
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '194'
- id: AT6.86.1
  kind: p
  original: 2. glaubt er, die Kommunisten warteten darauf, daß ihnen "die Gesellschaft" irgend etwas "gebe", während sie sich höchstens eine Gesellschaft geben wollen;
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '194'
- id: AT6.87.1
  kind: p
  original: 3. verwandelt er die Gesellschaft, ehe sie existiert, in ein Instrument, aus dem er Nutzen ziehen will, ohne daß er und andre Leute durch gegenseitiges gesellschaftliches Verhalten eine Gesellschaft, also dies "Instrument", produziert haben;
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '194'
- id: AT6.88.1
  kind: p
  original: 4. glaubt er, daß in der kommunistischen Gesellschaft von "Pflichten" und "Interessen" die Rede sein könne, von zwei sich ergänzenden Seiten eines Gegensatzes, der bloß der Bourgeoisgesellschaft angehört (im Interesse schiebt der reflektierende Bourgeois immer ein Drittes zwischen sich und seine Lebensäußerung, eine Manier, die wahrhaft klassisch bei Bentham erscheint, dessen Nase erst ein Interesse haben muß, ehe sie sich zum Riechen entschließt. Vgl. "das Buch" über das Recht an seiner Nase, p. 247);
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '194'
- id: AT6.89.1
  kind: p
  original: 5. glaubt Sankt Max, die Kommunisten wollten "der Gesellschaft" "Opfer bringen", wo sie höchstens die bestehende Gesellschaft opfern wollen - er müßte dann ihr Bewußtsein, daß ihr Kampf ein allen dem Bourgeoisregime entwachsenen Menschen gemeinschaftlicher ist, als ein Opfer bezeichnen, das sie sich bringen;
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '194'
- id: AT6.90.1
  kind: p
  original: 6. daß die Sozialen im religiösen Prinzip befangen sind und
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '194'
- id: AT6.91.1
  kind: p
  original: 7. daß sie nach einer heiligen Gesellschaft trachten, fand schon oben seine Erledigung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '194'
- id: AT6.91.2
  kind: p
  original: Wie "eifrig" Sankt Sancho nach der "heiligen [Gese]llschaft" "trachtet", um durch sie den Kommu[nis]mus widerlegen zu können, haben wir gesehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '194'
- id: AT6.92.1
  kind: p
  original: Spruch Salomonis Nr. II.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '195'
- id: AT6.93.1
  kind: p
  original: 'p. 277: "Wäre das Interesse an der sozialen Frage weniger leidenschaftlich und verblendet, so würde man... erkennen, daß eine Gesellschaft nicht neu werden kann, solange Diejenigen, welche sie ausmachen und konstituieren, die Alten bleiben."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '195'
- id: AT6.94.1
  kind: p
  original: '"Stirner" glaubt hier, daß die kommunistischen Proletarier, die die Gesellschaft revolutionieren, die Produktionsverhältnisse und die Form des Verkehrs auf eine neue Basis, d.h. auf sich als die Neuen, auf ihre neue Lebensweise setzen, "die Alten" bleiben.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '195'
- id: AT6.94.2
  kind: p
  original: Die unermüdliche Propaganda, die diese Proletarier machen, die Diskussionen, die sie täglich unter sich führen, beweisen hinlänglich, wie wenig sie selbst "die Alten" bleiben wollen und wie wenig sie überhaupt wollen, daß die Menschen "die Alten" bleiben sollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '195'
- id: AT6.94.3
  kind: p
  original: Die Alten" würden sie nur dann bleiben, wenn sie mit Sankt Sancho "die Schuld in sich suchten; sie wissen aber zu gut, daß sie nur unter veränderten Umständen aufhören werden, "die Alten" zu sein, und darum sind sie entschlossen, diese Umstände bei der ersten Gelegenheit zu verändern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '195'
- id: AT6.94.4
  kind: p
  original: In der revolutionären Tätigkeit fällt das Sich-Verändern mit dem Verändern der Umstände zusammen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '195'
- id: AT6.94.5
  kind: p
  original: '- Dieser große Spruch wird durch ein ebenso großes Exempel erläutert, das natürlich wieder aus der Welt "des Heiligen" genommen ist.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '195'
- id: AT6.95.1
  kind: p
  original: '"Sollte z.B. aus dem jüdischen Volk eine Gesellschaft entstehen, welche einen neuen Glauben über die Erde verbreitete, so durften diese Apostel doch keine Pharisäer bleiben."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '195'
- id: AT6.96.1
  kind: p
  original: Die ersten Christen = eine Gesellschaft zur Verbreitung des Glaubens (gestiftet Anno I). = Congregatio de propaganda fide (gestiftet 1640)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '195'
- id: AT6.97.1
  kind: p
  original: Anno I = Anno 1640
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '195'
- id: AT6.98.1
  kind: p
  original: Diese entstehen sollende Gesellschaft = Diese Apostel
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '195'
- id: AT6.99.1
  kind: p
  original: Das jüdische Volk = Pharisäer
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '195'
- id: AT6.100.1
  kind: p
  original: Christen = Nichtpharisäer = Nicht das jüdische Volk
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '195'
- id: AT6.101.1
  kind: p
  original: Was kann einfacher aussehen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '195'
- id: AT6.102.1
  kind: p
  original: 'Durch diese Gleichungen gestärkt, spricht Sankt Max das große historische Wort gelassen aus:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '195'
- id: AT6.103.1
  kind: p
  original: '"Die Menschen, weit entfernt, sich zur Entwicklung kommen zu lassen, wollten immer eine Gesellschaft bilden."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.104.1
  kind: p
  original: Die Menschen, immer weit entfernt, eine Gesellschaft bilden zu wollen, ließen dennoch nur die Gesellschaft zu einer Entwicklung kommen, weil sie sich fortwährend nur als Vereinzelte entwickeln wollten, und kamen deshalb nur in und durch die Gesellschaft zu ihrer eignen Entwicklung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.104.2
  kind: p
  original: Übrigens kann es nur einem Heiligen vom Gepräge unsres Sancho einfallen, die Entwicklung "der Menschen" von der Entwicklung "der Gesellschaft", in der diese Menschen leben, zu trennen und von dieser phantastischen Grundlage aus weiterzuphantasieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.104.3
  kind: p
  original: Er hat übrigens seinen ihm von Sankt Bruno eingegebenen Satz vergessen, in dem er gleich vorher die moralische Forderung an die Menschen stellte, sich selbst zu ändern und dadurch ihre Gesellschaft - worin er also die Entwicklung der Menschen mit der Entwicklung ihrer Gesellschaft identifizierte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.105.1
  kind: p
  original: Vierte logische Konstruktion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.106.1
  kind: p
  original: 'Er läßt den Kommunismus, im Gegensatz zu den Staatsbürgern, p. 156 sagen:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.107.1
  kind: p
  original: '"Nicht darin besteht Unser Wesen" (!), "daß wir Alle die gleichen Kinder des Staats" (!) "sind, sondern darin, daß wir Alle füreinander da sind.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.107.2
  kind: p
  original: Darin sind Wir Alle gleich, daß Wir Alle füreinander da sind, daß jeder für den Andern arbeitet, daß Jeder von Uns ein Arbeiter ist."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.107.3
  kind: p
  original: Er setzt nun "als Arbeiter existieren" = "Jeder von uns nur durch den Andern existieren", wo also der Andere "z.B. für meine Kleidung, Ich für sein Vergnügungsbedürfnis, er für meine Nahrung, Ich für seine Belehrung arbeite.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.107.4
  kind: p
  original: Also das Arbeitertum ist unsere Würde und unsere Gleichheit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.107.5
  kind: p
  original: '- Welchen Vorteil bringt Uns das Bürgertum?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.107.6
  kind: p
  original: Lasten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.107.7
  kind: p
  original: Und wie hoch schlägt man unsere Arbeit an?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.107.8
  kind: p
  original: So niedrig als möglich. - - Was könnt Ihr uns entgegenstellen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.107.9
  kind: p
  original: Doch auch nur Arbeit!"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.107.10
  kind: p
  original: '"Nur für Arbeit sind wir Euch einen Recom[pe]nse <Belohnung, Entschädigung> schuldig"; "nur durch Das, was Ihr [Uns] Nützliches leistet", "habt Ihr [ei]nen Anspruch auf Uns".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.107.11
  kind: p
  original: '"Wir wollen Euch nur, so viel wert sein, als Wir Euch leisten; Ihr aber sollt desgleichen von Uns gehalten sein."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.107.12
  kind: p
  original: '"Die Leistungen, die Uns etwas wert sind, also die gemeinnützigen Arbeiten, bestimmen den Wert. -- Wer Nützliches verrichtet, der stehe Keinem nach, oder - alle (gemeinnützigen) Arbeiter sind gleich.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.107.13
  kind: p
  original: Da aber der Arbeiter seines Lohnes wert ist, so sei auch der Lohn gleich." p. 157,158.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.108.1
  kind: p
  original: Bei "Stirner" fängt "der Kommunismus" damit an, sich nach "dem Wesen" umzusehen; er will wieder, als guter "Jüngling", nur "hinter die Dinge kommen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '196'
- id: AT6.108.2
  kind: p
  original: Daß der Kommunismus eine höchst praktische Bewegung ist, die praktische Zwecke mit praktischen Mitteln verfolgt und die sich höchstens in Deutschland, den deutschen Philosophen gegenüber, einen Augenblick auf "das Wesen" einlassen kann, das geht unsern Heiligen natürlich Nichts an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 196-197
- id: AT6.108.3
  kind: p
  original: Dieser Stirnersche "Kommunismus", der so sehr nach "dem Wesen" schmachtet, kommt daher auch nur zu einer philosophischen Kategorie, dem "Füreinandersein", die dann vermittelst einiger gewaltsamen Gleichungen
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '197'
- id: AT6.109.1
  kind: p
  original: Füreinandersein = Nur durch den Andern existieren = Als Arbeiter existieren = allgemeines Arbeitertum
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '197'
- id: AT6.110.1
  kind: p
  original: der empirischen Welt etwas näher gerückt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '197'
- id: AT6.110.2
  kind: p
  original: Übrigens wird der heilige Sancho aufgefordert, z.B. in Owen (der doch als Repräsentant des englischen Kommunismus ebensowohl für "den Kommunismus" gelten kann wie z.B der nichtkommunistische Proudhon, aus dem er sich das meiste der obigen Sätze abstrahiert und zurechtgestellt) eine Stelle nachzuweisen, in der irgend etwas von den obigen Sätzen über "Wesen", allgemeines Arbeitertum etc. sich findet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - AT6.N3
  mew_page: '197'
- id: AT6.110.3
  kind: p
  original: Übrigens brauchen wir so weit gar nicht einmal zurückzugehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '197'
- id: AT6.110.4
  kind: p
  original: 'Die schon oben zitierte deutsche kommunistische Zeitschrift "Die Stimme des Volks" spricht sich im dritten Heft dahin aus:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '197'
- id: AT6.111.1
  kind: p
  original: '"Was heute Arbeit heißt, ist nur ein winzig elendes Stück des gewaltigen, großmächtigen Produzierens; nämlich nur dasjenige Produzieren, welches widerlich und gefährlich, beehrt die Religion und Moral, Arbeit zu taufen, und unterfängt sich noch obendrein, allerlei Sprüche, gleichsam Segenssprüche (oder Hexensprüche) drüber zu streuen: ''Arbeiten im Schweiß des Angesichts'' als Prüfung Gottes; ''Arbeit macht das Leben süß'' zur Ermunterung usw. Die Moral der Welt, in der wir leben, hütet sich sehr weislich, das Verkehren der Menschen von den amüsanten und freien Seiten auch Arbeit zu nennen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '197'
- id: AT6.111.2
  kind: p
  original: Das schmäht sie, obschon es auch Produzieren ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '197'
- id: AT6.111.3
  kind: p
  original: Das schimpft sie gern Eitelkeit, eitle Lust, Wollust.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '197'
- id: AT6.111.4
  kind: p
  original: Der Kommunismus hat diese heuchlerische Predigerin, die elende Moral, entlarvt."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '197'
- id: AT6.112.1
  kind: p
  original: 'Als allgemeines Arbeitertum hat nun Sankt Max den ganzen Kommunismus auf gleichen Arbeitslohn reduziert, eine Entdeckung, die sich in folgenden drei "Brechungen" wiederholt: p. 351: "Gegen die Konkurrenz erhebt sich das Prinzip der Lumpengesellschaft - die Verteilung.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '197'
- id: AT6.112.2
  kind: p
  original: Soll Ich nun etwa, der Vielvermögende, vor dem Unvermögenden Nichts voraushaben?"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '197'
- id: AT6.112.3
  kind: p
  original: Ferner p. 363 spricht er von einer "allgemeinen Taxe für die menschliche Tätigkeit in der kommunistischen Gesellschaft".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 197-198
- id: AT6.112.4
  kind: p
  original: Und endlich p. 350, wo er den Kommunisten unterschiebt, sie hielten "die Arbeit" für "das einzige Vermögen" der Menschen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.112.5
  kind: p
  original: Sankt Max bringt also das Privateigentum in seiner doppelten Gestalt, als Verteilung und Lohnarbeit, wieder in den Kommunismus herein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.112.6
  kind: p
  original: Wie schon früher beim "Raub", manifestiert Sankt Max hier wieder die allergewöhnlichsten und borniertesten Bourgeoisvorstellungen als seine "eignen" "Durchschauungen" des Kommunismus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.112.7
  kind: p
  original: Er macht sich ganz der Ehre würdig, von Bluntschli unterrichtet worden zu sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.112.8
  kind: p
  original: Als echter Kleinbürger hat er dann auch Furcht, er, "der Vielvermögende", "solle Nichts vor dem Unvermögenden voraushaben" - obwohl er Nichts mehr zu fürchten hätte, als seinem eignen "Vermögen" überlassen zu bleiben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.113.1
  kind: p
  original: Nebenbei bildet sich "der Vielvermögende" ein, das Staatsbürgertum sei den Proletariern gleichgültig, nachdem er zuerst vorausgesetzt hat, sie hätten es.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.113.2
  kind: p
  original: Gerade wie er oben sich einbildete, dem Bourgeois sei die Regierungsform gleichgültig.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.113.3
  kind: p
  original: Den Arbeitern liegt so viel am Staatsbürgertum, d.h. dem aktiven Staatsbürgertum, daß sie da, wo sie es haben, wie in Amerika, es gerade "verwerten", und wo sie es nicht haben, es erwerben wollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.113.4
  kind: p
  original: Vergleiche die Verhandlungen der nordamerikanischen Arbeiter in zahllosen Meetings, die ganze Geschichte des englischen Chartismus und des französischen Kommunismus und Reformismus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.114.1
  kind: p
  original: Erstes Korollar.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.115.1
  kind: p
  original: '"Der Arbeiter hält sich, in seinem Bewußtsein, daß das Wesentliche an ihm der Arbeiter sei, vom Egoismus fern und unterwirft sich der Oberhoheit einer Arbeitergesellschaft, wie der Bürger mit Hingebung" (!) "am Konkurrenzstaate hing." p. 162.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.116.1
  kind: p
  original: Der Arbeiter hält sich höchstens an dem Bewußtsein, daß das Wesentliche an ihm für den Bourgeois der Arbeiter sei, der sich darum auch gegen den Bourgeois als solchen geltend machen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.116.2
  kind: p
  original: Die beiden Entdeckungen Sankt Sanchos, die "Hingebung des Bürgers" und den "Konkurrenzstaat ", kann man nur als neue "Vermögens "-Beweise des "Vielvermögenden" registrieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.117.1
  kind: p
  original: Zweites Korollar.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.118.1
  kind: p
  original: '"Der Kommunismus soll das ''Wohl Aller'' bezwecken.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.118.2
  kind: p
  original: Das sieht doch wirklich so aus, als brauchte dabei Keiner zurückzustehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.118.3
  kind: p
  original: Welches wird denn aber dieses Wohl sein?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.118.4
  kind: p
  original: Haben Alle ein und dasselbe Wohl? ist Allen gleich wohl bei Einem und Demselben?...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.118.5
  kind: p
  original: Ist dem so, so handelt sichs vom 'wahren Wohl'.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '198'
- id: AT6.118.6
  kind: p
  original: Kommen Wir damit nicht gerade bei dem Punkte an, wo die Religion ihre Gewaltherrschaft beginnt? --- Die Gesellschaft hat ein Wohl als das 'wahre Wohl' dekretiert, und hieße dies Wohl z.B. redlicher erarbeiteter Genuß, Du aber zögest die genußreiche Faulheit vor, so würde die Gesellschaft -- für das, wobei Dir wohl ist, zu sorgen sich weislich hüten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 198-199
- id: AT6.118.7
  kind: p
  original: Indem der Kommunismus das Wohl Aller proklamiert, vernichtet er gerade das Wohlsein Derer, welche bisher von Renten lebten etc." p.411, 412.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '199'
- id: AT6.119.1
  kind: p
  original: '"Ist dem so", so ergeben sich hieraus folgende Gleichungen:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '199'
- id: AT6.120.1
  kind: p
  original: Das Wohl Aller = Kommunismus = Ist dem so = Ein und dasselbe Wohl Aller = Das Gleichwohlsein Aller bei Einem und Demselben = Das Wahre Wohl = [Das heilige Wohl, das Heilige, Herrschaft des Heiligen, Hierarchie] <Die eckigen Klammern stammen von Marx> = Gewaltherrschaft der Religion
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '199'
- id: AT6.121.1
  kind: p
  original: Kommunismus = Gewaltherrschaft der Religion
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '199'
- id: AT6.122.1
  kind: p
  original: '"Das sieht doch wirklich so aus", als ob "Stirner" hier vom Kommunismus dasselbe gesagt hätte, was er bisher von allen andern Sachen sagte.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '199'
- id: AT6.123.1
  kind: p
  original: Wie tief unser Heiliger den Kommunismus "durchschaut" hat, geht wieder daraus hervor, daß er ihm zumutet, den "redlich erarbeiteten Genuß" als "wahres Wohl" durchsetzen zu wollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '199'
- id: AT6.123.2
  kind: p
  original: Wer außer "Stirner" und einigen Berliner Schuster- und Schneidermeistern denkt an "redlich erarbeiteten Genuß"!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - AT6.N4
  mew_page: '199'
- id: AT6.123.3
  kind: p
  original: Und nun gar den Kommunisten dies in den Mund zu legen, bei denen die Grundlage dieses ganzen Gegensatzes von Arbeit und Genuß wegfällt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '199'
- id: AT6.123.4
  kind: p
  original: Der moralische Heilige mag sich darüber beruhigen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '199'
- id: AT6.123.5
  kind: p
  original: Das "redliche Erarbeiten" wird man ihm und Denen überlassen, die er, ohne es zu wissen, vertritt - seinen kleinen, von der Gewerbfreiheit ruinierten und moralisch "empörten" Handwerksmeistern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '199'
- id: AT6.123.6
  kind: p
  original: Auch die "genußreiche Faulheit" gehört ganz der trivialsten Bürgeranschauung an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '199'
- id: AT6.123.7
  kind: p
  original: 'Die Krone des ganzen Satzes ist aber das pfiffige Bürgerbedenken, das er den Kommunisten macht: sie wollten das "Wohlsein" der Rentiers vernichten und sprächen doch vom "Wohlsein Aller".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '199'
- id: AT6.123.8
  kind: p
  original: Er glaubt also, daß in der kommunistischen Gesellschaft noch Rentiers vorkommen, deren "Wohlsein" zu vernichten wäre.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '199'
- id: AT6.123.9
  kind: p
  original: Er behauptet, daß das "Wohlsein" als Rentier ein den Individuen, die jetzt Rentiers sind, inhärentes, von ihrer Individualität nicht zu trennendes sei; er bildet sich ein, daß für diese Individuen gar kein anderes "Wohlsein" existieren könne als das, was durch ihr Rentier-Sein bedingt ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 199-200
- id: AT6.123.10
  kind: p
  original: Er glaubt ferner, die Gesellschaft sei schon kommunistisch eingerichtet, solange sie noch gegen Rentiers und dergleichen zu kämpfen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - AT6.N5
  mew_page: '200'
- id: AT6.123.11
  kind: p
  original: Die Kommunisten machen sich allerdings kein Gewissen daraus, die Herrschaft der Bourgeois zu stürzen und ihr "Wohlsein" zu zerstören, sobald sie die Macht dazu haben werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - AT6.N6
  mew_page: '200'
- id: AT6.123.12
  kind: p
  original: Es liegt ihnen keineswegs daran, ob dies ihren Feinden gemeinsame, durch die Klassenverhältnisse bedingte "Wohlsein" auch als persönliches "Wohlsein" sich an eine bornierterweise vorausgesetzte Sentimentalität adressiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '200'
- id: AT6.124.1
  kind: p
  original: Drittes Korollar.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '200'
- id: AT6.125.1
  kind: p
  original: p. 190 "ersteht" in der kommunistischen Gesellschaft "die Sorge wieder als Arbeit".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '200'
- id: AT6.126.1
  kind: p
  original: Der gute Bürger "Stirner", der sich bereits freut, im Kommunismus seine geliebte "Sorge" wiederzufinden, hat sich diesmal doch verrechnet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '200'
- id: AT6.126.2
  kind: p
  original: Die "Sorge" ist nichts anderes als die gedrückte und geängstigte Gemütsstimmung, die im Bürgertum die notwendige Begleiterin der Arbeit, der lumpenhaften Tätigkeit des notdürftigen Erwerbes ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '200'
- id: AT6.126.3
  kind: p
  original: Die "Sorge" floriert in ihrer reinsten Gestalt beim deutschen guten Bürger, wo sie chronisch und "immer sich selbst gleich", miserabel und verächtlich ist, während die Not des Proletariers eine akute, heftige Form annimmt, ihn zum Kampf um Leben und Tod treibt, ihn revolutionär macht und deshalb keine "Sorge", sondern Leidenschaft produziert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '200'
- id: AT6.126.4
  kind: p
  original: Wenn der Kommunismus nun sowohl die "Sorge" des Bürgers wie die Not des Proletariers aufheben will, so versteht es sich doch wohl von selbst, daß er dies nicht tun kann, ohne die Ursache Beider, die "Arbeit", aufzuheben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '200'
- id: AT6.127.1
  kind: p
  original: Wir kommen jetzt zu den historischen Konstruktionen des Kommunismus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '200'
- id: AT6.128.1
  kind: p
  original: Erste historische Konstruktion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '200'
- id: AT6.129.1
  kind: p
  original: '"Solange der Glaube für die Ehre und Würde der Menschen ausreichte, ließ sich gegen keine auch noch so anstrengende Arbeit etwas einwenden."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '201'
- id: AT6.129.2
  kind: p
  original: '- "All ihr Elend konnten die unterdrückten Klassen nur so lange ertragen, als sie Christen waren" (höchstens waren sie so lange Christen, als sie ihr Elend ertrugen) "denn das Christentum" (das mit dem Stock hinter ihnen steht) "läßt ihr Murren und ihre Empörung nicht aufkommen." p. 158.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '201'
- id: AT6.130.1
  kind: p
  original: '"Woher nur ''Stirner'' alles Dies weiß", was die unterdrückten Klassen konnten, erfahren wir aus Heft I der "Allg[emeinen] Literat[ur]-Z[ei]t[un]g", wo "die Kritik in Buchbindermeistergestalt" folgende Stelle eines unbedeutenden Buchs zitiert:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '201'
- id: AT6.131.1
  kind: p
  original: '"Der moderne Pauperismus hat einen politischen Charakter angenommen; während der alte Bettler sein Los mit Ergebenheit trug und es als eine göttliche Schickung ansah, frägt der neue Lump, ob er gezwungen sei, armselig durchs Leben zu wandern, weil er zufällig in Lumpen geboren wurde."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '201'
- id: AT6.132.1
  kind: p
  original: Wegen dieser Macht des Christentums fanden bei der Emanzipation der Leibeignen gerade die blutigsten und erbittertsten Kämpfe gegen die geistlichen Feudalherren statt und setzte sie sich durch trotz alles Murrens und aller Empörung des in den Pfaffen inkorporierten Christentums (vergl. Eden, "History of the Poor", Book I; Guizot, "Histoire de la civilisation en France"; Monteil, "Histoire des Français des divers états" ppp.), während andrerseits die kleinen Pfaffen, namentlich im Anfange des Mittelalters, die Leibeigenen zum "Murren" und zur "Empörung" gegen die weltlichen Feudalherren aufreizten (vergl. u.a. schon das bekannte Kapitular Karls des Großen).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '201'
- id: AT6.132.2
  kind: p
  original: Vergleiche auch, was oben bei Gelegenheit der "hie und da auftauchenden Arbeiterunruhen" über die "unterdrückten Klassen" und ihre Aufstände im 14. Jahrhundert gesagt wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '201'
- id: AT6.133.1
  kind: p
  original: Die früheren Formen der Arbeiteraufstände hingen mit der jedesmaligen Entwicklung der Arbeit und der dadurch gegebenen Gestalt des Eigentums zusammen; die direkt oder in[dir]ekt kommunistische Insurrek[tio]n mit der großen Industrie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '201'
- id: AT6.133.2
  kind: p
  original: '[Sta]tt auf diese weitläuftige Geschichte einzugehen, veranstaltet Sankt Max einen heiligen Übergang von den duldenden unterdrückten Klassen zu den ungeduldigen unterdrückten Klassen:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '201'
- id: AT6.134.1
  kind: p
  original: '"Jetzt, wo Jeder sich zum Menschen ausbilden soll " ("woher nur" z.B. die katalonischen Arbeiter "wissen", daß "Jeder sich zum Menschen ausbilden soll"?), "fällt die Bannung des Menschen an maschinenmäßige Arbeit zusammen mit der Sklaverei" p. 158.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '201'
- id: AT6.135.1
  kind: p
  original: Vor Spartakus und dem Sklavenkriege war es also das Christentum, das die "Bannung des Menschen an maschinenmäßige Arbeit" nicht "mit der Sklaverei zusammenfallen" ließ; und zu Spartakus' Zeit war es der Begriff Mensch, der dies Verhältnis aufhob und die Sklaverei erst erzeugte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '202'
- id: AT6.135.2
  kind: p
  original: '"Oder sollte" Stirner "gar" etwas von dem Zusammenhange der modernen Arbeiterunruhen mit der Maschinerie gehört haben und hier haben andeuten wollen?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '202'
- id: AT6.135.3
  kind: p
  original: In diesem Falle hat nicht die Einführung der Maschinenarbeit die Arbeiter in Rebellen, sondern die Einführung des Begriffes "Mensch" die Maschinenarbeit in Sklaverei verwandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '202'
- id: AT6.135.4
  kind: p
  original: '- "Ist dem so", so "sieht das doch wirklich so aus", als wäre dies eine "einzige" Geschichte der Arbeiterbewegungen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '202'
- id: AT6.136.1
  kind: p
  original: Zweite geschichtliche Konstruktion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '202'
- id: AT6.137.1
  kind: p
  original: '"Die Bourgeoisie hat das Evangelium des materiellen Genusses verkündet und wundert sich nun, daß diese Lehre unter Uns Proletariern Anhänger findet." p. 159.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '202'
- id: AT6.138.1
  kind: p
  original: Eben wollten die Arbeiter den Begriff "des Menschen", das Heilige verwirklichen, jetzt den "materiellen Genuß", das Weltliche; oben die "Plackerei" der Arbeit, jetzt nur noch die Arbeit des Genießens.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '202'
- id: AT6.138.2
  kind: p
  original: Sankt Sancho schlägt sich hier auf ambas sus valientes posaderas <seine beiden mächtigen Sitzfleischhälften>, zuerst auf die materielle Geschichte, dann auf die Stirnersche, heilige.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '202'
- id: AT6.138.3
  kind: p
  original: Nach der materiellen Geschichte war es die Aristokratie, welche zuerst das Evangelium des Weltgenusses an die Stelle des Genusses des Evangeliums setzte, für welche die nüchterne Bourgeoisie sich zunächst aufs Arbeiten legte und ihr mit vieler Schlauheit den Genuß überließ, der ihr selbst durch eigne Gesetze untersagt wurde (bei welcher Gelegenheit die Macht der Aristokratie in der Gestalt des Geldes in die Taschen der Bourgeois rückte).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '202'
- id: AT6.139.1
  kind: p
  original: Nach der Stirnerschen Geschichte hat die Bourgeoisie sich damit begnügt, "das Heilige" zu suchen, den Staatskultus zu betreiben und "alle existierenden Objekte in vorgestellte zu verwandeln", und es bedurfte der Jesuiten, um "die Sinnlichkeit vor dem gänzlichen Verkommen zu retten".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '202'
- id: AT6.139.2
  kind: p
  original: Nach derselben Stirnerschen Geschichte hat die Bourgeoisie durch die Revolution alle Macht an sich gerissen, also auch ihr Evangelium, das des materiellen Genusses, obgleich wir nach derselben Stirnerschen Geschichte jetzt so weit sind, daß "in der Welt nur Gedanken herrschen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '202'
- id: AT6.139.3
  kind: p
  original: Die Stirnersche Hierarchie sitzt jetzt also "entre ambas posaderas " <zwischen den beiden Sitzfleischhälften>.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '202'
- id: AT6.140.1
  kind: p
  original: Dritte historische Konstruktion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '202'
- id: AT6.141.1
  kind: p
  original: p. 159.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '202'
- id: AT6.141.2
  kind: p
  original: '"Nachdem das Bürgertum von Befehl und Willkür Einzelner befreit hatte, blieb jene Willkür übrig, welche aus der Konjunktur der Verhältnisse entspringt und die Zufälligkeit der Umstände genannt werden kann.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 202-203
- id: AT6.141.3
  kind: p
  original: Das Glück und die vom Glück begünstigten blieben übrig."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '203'
- id: AT6.142.1
  kind: p
  original: 'Sankt Sancho läßt dann die Kommunisten "ein Gesetz und eine neue Ordnung finden, die diesen Schwankungen" (dem Dings da) "ein Ende macht" - von der er so viel weiß, daß die Kommunisten nun ausrufen sollen: "Diese Ordnung sei dann heilig!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '203'
- id: AT6.142.2
  kind: p
  original: '(wo er vielmehr nun ausrufen müßte: Die Unordnung meiner Einbildungen sei die heilige Ordnung der Kommunisten).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '203'
- id: AT6.142.3
  kind: p
  original: '- "Hier ist Weisheit" (Offenb[arung] Joh[annis] 13, 18).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '203'
- id: AT6.142.4
  kind: p
  original: '"Wer Verstand hat, der überlege die Zahl" des Unsinns, den der sonst so weitläuftige, sich stets wieder von sich gebende Stirner [hi]er in wenige [Zeilen] zusammendrängt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '203'
- id: AT6.143.1
  kind: p
  original: 'In allgemeinster Fassung heißt der erste Satz: Nachdem das Bürgertum die Feudalität abgeschafft hatte, blieb das Bürgertum übrig.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '203'
- id: AT6.143.2
  kind: p
  original: Oder nachdem in "Stirners" Einbildung die Herrschaft der Personen abgeschafft worden war, blieb grade das Umgekehrte zu tun übrig.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '203'
- id: AT6.143.3
  kind: p
  original: '"Das sieht denn doch wirklich so aus", als könnte man die zwei entlegensten Geschichtsepochen in einen Zusammenhang bringen, der der heilige Zusammenhang, der Zusammenhang als Das Heilige, der Zusammenhang im Himmel ist.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '203'
- id: AT6.144.1
  kind: p
  original: Dieser Satz Sankt Sanchos ist übrigens nicht mit dem obigen mode simple <der einfachen Art> Unsinns zufrieden, er muß es bis zum mode composé und bicomposé <zur zusammengesetzten und zweifach zusammengesetzten Art> des Unsinns bringen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '203'
- id: AT6.144.2
  kind: p
  original: Nämlich erstens glaubt Sankt Max den sich befreienden Bourgeois, daß sie, indem sie sich von Befehl und Willkür Einzelner befreiten, die Masse der Gesellschaft überhaupt von Befehl und Willkür Einzelner befreiten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '203'
- id: AT6.144.3
  kind: p
  original: Zweitens befreiten sie sich realiter nicht von "Befehl und Willkür der Einzelnen", sondern von der Herrschaft der Korporation, Zunft, der Stände, und konnten daher nun erst als wirkliche einzelne Bourgeois dem Arbeiter gegenüber "Befehl und Willkür" ausüben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '203'
- id: AT6.144.4
  kind: p
  original: Drittens hoben sie nur den plus ou moins <mehr oder weniger> idealistischen Schein des bisherigen Befehls und der bisherigen Willkür der Einzelnen auf, um an seine Stelle diesen Befehl und diese Willkür in ihrer materiellen Grobheit herzustellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '203'
- id: AT6.144.5
  kind: p
  original: Er, Bourgeois, wollte seinen "Befehl und Willkür" nicht mehr durch den bisherigen "Befehl und Willkür" der im Monarchen, im Adel und in der Korporation konzentrierten politischen Macht beschränkt wissen, sondern höchstens durch die in Gesetzen von Bourgeois ausgesprochnen Gesamtinteressen der ganzen Bourgeoisklasse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '203'
- id: AT6.144.6
  kind: p
  original: Er tat nichts als den Befehl und die Willkür über den Befehl und die Willkür der einzelnen Bourgeois aufheben (siehe Politischen Liberalismus).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '203'
- id: AT6.145.1
  kind: p
  original: Indem Sankt Sancho nun die Konjunktur der Verhältnisse, welche mit der Herrschaft der Bourgeoisie eine ganz andre Konjunktur ganz andrer Verhältnisse wurde, statt sie wirklich zu analysieren, als die allgemeine Kategorie "Konjunktur pp." übrigbleiben läßt und sie mit dem noch unbestimmteren Namen "Zufälligkeit der Umstände" beschenkt - als ob der "Befehl und die Willkür Einzelner" nicht selbst eine "Konjunktur der Verhältnisse" sei - indem er also so die reale Grundlage des Kommunismus, nämlich die bestimmte Konjunktur der Verhältnisse unter dem Bourgeoisregime beseitigt, kann er nun auch den so luftig gemachten Kommunismus in seinen heiligen Kommunismus verwandeln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '204'
- id: AT6.145.2
  kind: p
  original: '"Das sieht denn doch wirklich so aus", als ob "Stirner" ein "Mensch von nur ideellem", eingebildetem historischem "Reichtum" sei - der "vollendete Lump".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '204'
- id: AT6.145.3
  kind: p
  original: Siehe "das Buch", p. 362.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '204'
- id: AT6.146.1
  kind: p
  original: 'Diese große Konstruktion, oder vielmehr ihr Vordersatz, wird uns p. 189 noch einmal mit vieler Emphase in folgender Form wiederholt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '204'
- id: AT6.147.1
  kind: p
  original: '"Der politische Liberalismus hob die Ungleichheit der Herren und Diener auf; er machte herrenlos, anarchisch" (!); "der Herr wurde nun vom Einzelnen, dem Egoisten, entfernt, um ein Gespenst zu werden, das Gesetz oder der Staat."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '204'
- id: AT6.148.1
  kind: p
  original: Gespensterherrschaft = (Hierarchie) = Herrenlosigkeit, gleich Herrschaft der "allmächtigen" Bourgeois.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '204'
- id: AT6.148.2
  kind: p
  original: Wie wir sehen, ist diese Gespensterherrschaft vielmehr die Herrschaft der vielen wirklichen Herren; also konnte der Kommunismus mit gleichem Recht als die Befreiung von dieser Herrschaft der Vielen gefaßt werden, was Sankt Sancho aber nicht durfte, weil sonst sowohl seine logischen Konstruktionen des Kommunismus wie auch die ganze Konstruktion der "Freien" umgeworfen worden wären.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '204'
- id: AT6.148.3
  kind: p
  original: So geht's aber im ganzen "Buche".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '204'
- id: AT6.148.4
  kind: p
  original: Ein einziger Schluß aus den eignen Prämissen unsres Heiligen, ein einziges historisches Faktum wirft ganze Reihen von Durchschauungen und Resultaten zu Boden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '204'
- id: AT6.149.1
  kind: p
  original: Vierte geschichtliche Konstruktion. p. 350 leitet Sankt Sancho den Kommunismus direkt aus der Abschaffung der Leibeigenschaft her.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '204'
- id: AT6.150.1
  kind: p
  original: 'I. Vordersatz:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '204'
- id: AT6.151.1
  kind: p
  original: Es war außerordentlich viel damit gewonnen, als man es durchsetzte, als Inhaber betrachtet " (!) zu werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '204'
- id: AT6.151.2
  kind: p
  original: Die Leibeigenschaft wurde damit aufgehoben und jeder, der bis dahin selbst Eigentum gewesen, ward nun ein Herr."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '204'
- id: AT6.152.1
  kind: p
  original: '(In dem mode simple des Unsinns heißt dies wieder: Die Leibeigenschaft wurde aufgehoben, sobald sie aufgehoben ward.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '204'
- id: AT6.152.2
  kind: p
  original: Der mode composé dieses Unsinns ist, daß Sankt Sancho glaubt, vermittelst der heiligen Kontemplation, des "Betrachtens" und "Betrachtetwerdens" sei man zum "Inhaber" geworden, während die Schwierigkeit darin bestand, "Inhaber" zu werden und die Betrachtung sich dann nachher von selbst hinzusetzte; und der mode bicomposé ist, daß, nachdem die anfangs noch partikuläre Aufhebung der Leibeigenschaft angefangen hatte, ihre Konsequenzen zu entwickeln, und dadurch allgemein geworden war, man aufhörte, "durchsetzen" [z]u können, als [des] Innehabens wert "betrachtet" zu werden (dem Inhaber wurden die Innegehabten zu kostspielig); daß also die größte Masse, "die bisher selbst Eigentum", d.h. gezwungene Arbeiter "gewesen waren", dadurch keine "Herren", sondern freie Arbeiter wurden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 204-205
- id: AT6.153.1
  kind: p
  original: II. Historischer Untersatz, der zirka acht Jahrhunderte umfaßt und dem man "freilich nicht ansehen wird, wie inhaltsschwer" er ist (vgl. Wigand, p. 194).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '205'
- id: AT6.154.1
  kind: p
  original: '"Allein forthin reicht Dein Haben und Deine Habe nicht mehr aus und wird nicht mehr anerkannt; dagegen steigt Dein Arbeiten und Deine Arbeit im Werte.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '205'
- id: AT6.154.2
  kind: p
  original: Wir achten nun Deine Bewältigung der Dinge wie vorher" (?)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '205'
- id: AT6.154.3
  kind: p
  original: '"Dein Innehaben derselben.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '205'
- id: AT6.154.4
  kind: p
  original: Deine Arbeit ist Dein Vermögen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '205'
- id: AT6.154.5
  kind: p
  original: Du bist nun Herr oder Inhaber des Erarbeiteten, nicht des Ererbten." (ibid.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '205'
- id: AT6.155.1
  kind: p
  original: '"Forthin" "nicht mehr" - "dagegen" - "nun - "wie vorher" - "nun - "oder" - "nicht" - das ist der Inhalt dieses Satzes.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '205'
- id: AT6.156.1
  kind: p
  original: Obgleich "Stirner" "nun" dahin gekommen ist, daß Du (nämlich Szeliga) Herr des Erarbeiteten, nicht des Ererbten, bist, so fällt ihm "nun" vielmehr ein, daß derzeit gerade das Gegenteil stattfindet - und dies läßt ihn den Kommunismus als Wechselbalg aus diesen beiden Mißgeburten von Vordersätzen gebären.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '205'
- id: AT6.157.1
  kind: p
  original: III. Kommunistischer Schluß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '205'
- id: AT6.158.1
  kind: p
  original: '"Da aber DERZEIT Alles ein Ererbtes ist und jeder Groschen, den Du besitzest, nicht ein Arbeits-, sondern Erbgepräge trägt" (kulminierender Unsinn), "SO muß Alles umgeschmolzen werden."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '205'
- id: AT6.159.1
  kind: p
  original: Woraus Szeliga nun sowohl beim Auf- und Untergang der mittelaltrigen Kommunen wie beim Kommunismus des neunzehnten Jahrhunderts angelangt zu sein sich einbilden kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '205'
- id: AT6.159.2
  kind: p
  original: Und womit Sankt Max trotz alles "Ererbten" und "Erarbeiteten" zu keiner "Bewältigung der Dinge", sondern höchstens zur "Habe" des Unsinns gekommen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '205'
- id: AT6.160.1
  kind: p
  original: Liebhaber von Konstruktionen können nun noch p. 421 nachsehen, wie Sankt Max, nachdem er den Kommunismus aus der Leibeigenschaft konstruiert hat, ihn nun noch als Leibeigenschaft unter einem Lehnsherrn, der Gesellschaft, konstruiert - nach demselben Muster, wie er schon oben das Mittel, wodurch wir etwas erwerben, zu dem "Heiligen" macht, durch dessen "Gnade" uns etwas gegeben wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 205-206
- id: AT6.160.2
  kind: p
  original: Jetzt nur noch schließlich einige "Durchschauungen" des Kommunismus, die sich aus den obigen Prämissen ergeben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '206'
- id: AT6.161.1
  kind: p
  original: Zuerst gibt "Stirner" eine neue Theorie der Exploitation, die darin besteht, daß
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '206'
- id: AT6.162.1
  kind: p
  original: '"der Arbeiter in einer Stecknadelfabrik nur ein einzelnes Stück arbeitet, nur einem Andern in die Hand arbeitet, und von diesem Andern benutzt, exploitiert wird". p. 158.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '206'
- id: AT6.163.1
  kind: p
  original: Hier entdeckt also "Stirner", daß die Arbeiter einer Fabrik sich wechselseitig exploitieren, weil sie einander "in die Hand arbeiten", während der Fabrikant, dessen Hände gar nicht arbeiten, auch nicht imstande ist, die Arbeiter zu exploitieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '206'
- id: AT6.163.2
  kind: p
  original: '"Stirner" gibt hier ein schlagendes Exempel von der betrübten Lage, in die die deutschen Theoretiker durch den Kommunismus versetzt worden sind.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '206'
- id: AT6.163.3
  kind: p
  original: Sie müssen sich jetzt auch mit profanen Dingen wie Stecknadelfabriken usw. beschäftigen, bei denen sie sich wie wahre Barbaren wie Ojibbeway-Indianer und Neuseeländer benehmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '206'
- id: AT6.164.1
  kind: p
  original: '"Dagegen heißt es nun "im Stirnerschen Kommunismus" l. c.:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '206'
- id: AT6.165.1
  kind: p
  original: '"Jede Arbeit soll den Zweck haben, daß der "Mensch" befriedigt werde.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '206'
- id: AT6.165.2
  kind: p
  original: Deshalb muß er" ("der" Mensch) "auch in ihr Meister werden, d.h. sie als eine Totalität schaffen können."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '206'
- id: AT6.166.1
  kind: p
  original: '" Der Mensch" muß Meister werden!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '206'
- id: AT6.166.2
  kind: p
  original: '- " Der Mensch" bleibt Stecknadelknopfmacher, hat aber das beruhigende Bewußtsein, daß Nadelknöpfe zur Nadel gehören und daß er die ganze Nadel machen kann.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '206'
- id: AT6.166.3
  kind: p
  original: Die Ermüdung und der Ekel, den die ewige Wiederholung des Nadelknopfmachens hervorbringt, verwandelt sich durch dies Bewußtsein in "Befriedigung des Menschen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '206'
- id: AT6.166.4
  kind: p
  original: '[O, P]roudhon!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '206'
- id: AT6.167.1
  kind: p
  original: Weitere Durchschauung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '206'
- id: AT6.168.1
  kind: p
  original: '"Da die Kommunisten erst die freie Tätigkeit für das Wesen" (iterum Crispinus) <(wiederum Crispinus)> "des Menschen erklären, bedürfen sie, wie alle werkeltägige Gesinnung, eines Sonntags, einer Erhebung und Erbauung neben ihrer geistlosen Arbeit."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '206'
- id: AT6.169.1
  kind: p
  original: Abgesehen von dem hier eingeschobenen "Wesen des Menschen" muß der unglückliche Sancho die "freie Tätigkeit", d.h. bei den Kommunisten die aus der freien Entwicklung aller Fähigkeiten hervorgehende, schöpferische Lebensäußerung, um "Stirner" verständlich zu sein, des "ganzen Kerls", in "geistlose Arbeit" verwandeln, weil nämlich der Berliner merkt, daß es sich hier nicht um die "saure Arbeit des Gedankens" handelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '206'
- id: AT6.169.2
  kind: p
  original: Durch diese einfache Verwandlung können nun auch die Kommunisten in die "werkeltägige Gesinnung" umgesetzt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 206-207
- id: AT6.169.3
  kind: p
  original: Mit dem Werkeltage des Bürgers findet sich dann natürlich auch sein Sonntag im Kommunismus wieder.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '207'
- id: AT6.170.1
  kind: p
  original: p 161.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '207'
- id: AT6.170.2
  kind: p
  original: '"Die sonntägliche Seite des Kommunismus ist, daß der Kommunist in Dir den Menschen, den Bruder erblickt."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '207'
- id: AT6.171.1
  kind: p
  original: Der Kommunist erscheint hier also als "Mensch" und als "Arbeiter".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '207'
- id: AT6.171.2
  kind: p
  original: 'Dies nennt Sankt Sancho 1. c.: "eine zwiefache Anstellung des Menschen durch den Kommunisten" ein Amt des materiellen Erwerbs und eins des geistigen".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '207'
- id: AT6.172.1
  kind: p
  original: Hier bringt er also sogar den "Erwerb" und die Bürokratie wieder in den Kommunismus herein, der dadurch freilich "sein letztes Absehen erreicht" und aufhört, Kommunismus zu sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '207'
- id: AT6.172.2
  kind: p
  original: Er muß dies übrigens tun, weil nachher in seinem "Verein" Jeder ebenfalls "eine zwiefache Anstellung" als Mensch und als "Einziger" erhält.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '207'
- id: AT6.172.3
  kind: p
  original: Diesen Dualismus legitimiert er vorläufig dadurch, daß er ihn dem Kommunismus in die Schuhe schiebt, eine Methode, die wir bei seinem Lehnswesen und seiner Verwertung wiederfinden werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '207'
- id: AT6.173.1
  kind: p
  original: p. 344 glaubt "Stirner", die "Kommunisten" wollten "die Eigentumsfrage gütlich lösen", und p. 413 sollen sie gar an die Aufopferung der Menschen [und an] die selbstverleugnende Gesinnung der Kapitalisten appellieren!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - AT6.N7
  mew_page: '207'
- id: AT6.173.2
  kind: p
  original: Die wenigen seit Babeufs Zeit aufgetretenen kommunistischen Bourgeois, die nicht revolutionär waren, sind sehr dünne gesät; die große Masse der Kommunisten ist in allen Ländern revolutionär.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '207'
- id: AT6.173.3
  kind: p
  original: Was die Ansicht der Kommunisten über die "selbstverleugnende Gesinnung der Reichen" und die "Aufopferung der Menschen" ist, mag Sankt Max aus ein paar Stellen Cabets, gerade des Kommunisten ersehen, der noch am meisten den Schein haben kann, als appelliere er an das dévoûment, die Aufopferung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - AT6.N8
  mew_page: '207'
- id: AT6.173.4
  kind: p
  original: 'Diese Stellen sind gegen die Republikaner und namentlich gegen Herrn Buchez'' Angriff auf den Kommunismus gerichtet, der in Paris noch eine sehr kleine Zahl Arbeiter unter seinem Kommando hat:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '207'
- id: AT6.174.1
  kind: p
  original: '"Ebenso mit der Aufopferung (dévoûment); es ist dies die Doktrin des Herrn Buchez, diesmal ihrer katholischen Form entkleidet, weil Herr Buchez ohne Zweifel fürchtet, daß seine Katholizität die Masse der Arbeiter anwidert und zurückstößt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.174.2
  kind: p
  original: '''Um würdig seine Pflicht (devoir) zu erfüllen (sagt Buchez), bedarf es der Aufopferung (dévoûment).'''
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.174.3
  kind: p
  original: '- Begreife, wer kann, welcher Unterschied zwischen devoir und dévoûment.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.174.4
  kind: p
  original: '- ''Wir fordern Aufopferung von Allen, sowohl für die große nationale Einheit als für die Arbeiterassoziation... es ist notwendig, daß wir vereint seien, immer hingegeben (dévoués), die Einen für die Andern.'''
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.174.5
  kind: p
  original: '- Es ist notwendig, es ist notwendig - das ist leicht zu sagen, und man sagt es seit sehr langer Zeit, und man wird es noch sehr lange Zeit ohne mehr Erfolg sagen, wenn man nicht auf andere Mittel sinnt!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.174.6
  kind: p
  original: Buchez beklagt sich über die Selbstsucht der Reichen; aber wozu dienen solche Klagen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.174.7
  kind: p
  original: Buchez erklärt alle die für Feinde, welche sich nicht devouieren <aufopfern> wollen."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.1
  kind: p
  original: '"''Wenn'', sagt er, ''durch den Egoismus getrieben, sich ein Mensch weigert, für die Andern sich hinzugeben, was muß man tun?...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.2
  kind: p
  original: 'Wir werden keinen Augenblick anstehen zu antworten: Die Gesellschaft hat immer das Recht, uns Das zu nehmen, was die eigne Pflicht uns gebietet, ihr aufzuopfern...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.3
  kind: p
  original: Die Aufopferung ist das [e]inzige Mittel, seine Pflicht zu erfüllen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.4
  kind: p
  original: '[Je]der von uns muß sich aufopfern, [ü]berall und immer.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.5
  kind: p
  original: Der, welcher aus Egoismus seine Pflicht der [Hi]ngebung zu erfüllen sich weigert, muß hierzu gezwungen werden.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.6
  kind: p
  original: '- So schreit Buchez allen Menschen zu: Opfert Euch, opfert Euch!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.7
  kind: p
  original: Denkt nur daran, Euch zu opfern!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.8
  kind: p
  original: Heißt das nicht die menschliche Natur verkennen und mit Füßen treten?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.9
  kind: p
  original: Ist das nicht eine falsche Anschauung?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.10
  kind: p
  original: Wir möchten fast sagen, eine kindische, eine abgeschmackte Anschauung?"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.11
  kind: p
  original: ("Réfutation des doctrines de l'Atelier", par Cabet, p. 19, 20.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.12
  kind: p
  original: '- Cabet zeigt nun p. 22 dem Republikaner Buchez nach, daß er notwendig auf eine "Aristokratie der Aufopferung" mit verschiedenen Stufen kommt, und fragt dann ironisch: "Was wird nun aus dem dévoûment?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.13
  kind: p
  original: Wo bleibt das dévoûment, wenn man nur deswegen sich devouiert, um zu den höchsten Spitzen der Hierarchie zu gelangen?...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.14
  kind: p
  original: Ein solches System könnte aufkommen in dem Kopfe von Einem, der es zum Papst oder Kardinal bringen wollte - aber in den Köpfen von Arbeitern!!!"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.15
  kind: p
  original: '- "Herr Buchez will nicht, daß die Arbeit eine angenehme Zerstreuung werde, noch daß der Mensch für sein eignes Wohlsein arbeite und sich neue Genüsse schaffe.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.16
  kind: p
  original: Er behauptet... 'daß der Mensch nur auf die Erde gesetzt worden ist, um einen Beruf, eine Pflicht (une fonction, un devoir) zu erfüllen'.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.17
  kind: p
  original: '''Nein'', predigt er den Kommunisten, ''der Mensch, diese große Macht, ist nicht für sich selbst erschaffen (n''a point été fait pour lui-même)...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.18
  kind: p
  original: Das ist ein roher Gedanke.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.19
  kind: p
  original: Der Mensch ist ein Werkmann (ouvrier) in der Welt, er muß das Werk (œuvre) vollbringen, welches die Moral seiner Tätigkeit auferlegt, das ist seine Pflicht...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.20
  kind: p
  original: Verlieren wir niemals aus dem Gesicht, daß wir einen hohen Beruf (une haute fonction) zu erfüllen haben, einen Beruf, der mit dem ersten Tage des Menschen begonnen hat und nur mit der Menschheit zugleich [endig]en wird.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.21
  kind: p
  original: '- Aber wer hat dem [Herrn] Buchez alle diese schönen Sachen enthüllt?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.22
  kind: p
  original: '(Mais qui a révelé toutes ces belles choses à M. Buchez lui-même", wo Stirner übersetzen würde: Woher nur Buchez alles das weiß, was der Mensch soll?)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '208'
- id: AT6.175.23
  kind: p
  original: '- "Du reste, comprenne qui pourra. <Im übrigen begreife das, wird kann> - Buchez fährt fort: ''Wie!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 208-209
- id: AT6.175.24
  kind: p
  original: Der Mensch hätte Tausende von Jahrhunderten warten müssen, um von Euch Kommunisten zu lernen, daß er für sich selbst gemacht ist und keinen andren Zweck hat als in allen möglichen Genüssen zu leben?...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.175.25
  kind: p
  original: Aber man darf sich so nicht verirren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.175.26
  kind: p
  original: Man darf nicht vergessen, daß wir geschaffen sind, um zu arbeiten (faits pour travailler), um immer zu arbeiten, und daß die einzige Sache, die wir fordern können, das zum Leben Nötige (la suffisante vie) ist, d.h. ein Wohlsein, welches dazu hinreicht, daß wir angemessen unsern Beruf erfüllen können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.175.27
  kind: p
  original: Außerhalb dieses Kreises ist alles absurd und gefährlich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.175.28
  kind: p
  original: ''' - Aber so beweisen Sie doch!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.175.29
  kind: p
  original: Beweisen Sie!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.175.30
  kind: p
  original: Und begnügen Sie sich nicht damit, wie ein Prophet zu orakeln!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.175.31
  kind: p
  original: Gleich von vornherein sprechen Sie von Tausenden von Jahrhunderten!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.175.32
  kind: p
  original: Und dann, wer behauptet, daß man uns in allen Jahrhunderten erwartet hat?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.175.33
  kind: p
  original: Aber Euch hat man wohl erwartet mit allen Euren Theorien von dévoûment, devoir, nationalité française, association ouvrière <Aufopferung, Pflicht, französische Nationalität, Arbeiterassoziation>?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.175.34
  kind: p
  original: '''Schließlich'', sagt Buchez, ''bitten wir Euch, nicht von dem, was wir gesagt haben, Euch verletzt zu fühlen.'''
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.175.35
  kind: p
  original: '- Wir sind ebenso höfliche Franzosen, wir bitten Euch ebenfalls, nicht verletzt zu sein." (p. 31.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.175.36
  kind: p
  original: '- '' Glaubt uns '', sagt Buchez, ''es existiert communauté <Gemeinschaft>, die seit langer Zeit errichtet ist und wovon Ihr auch Mitglieder seid.'''
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.175.37
  kind: p
  original: '- Glaubt uns, Buchez", schließt Cabet, "werdet Kommunist!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.176.1
  kind: p
  original: '"Aufopferung", "Pflicht", "Sozialpflicht", "Recht der Gesellschaft", "der Beruf, die Bestimmung des Menschen", "Arbeiter der Beruf des Menschen", moralisches Werk", "Arbeiterassoziation", "Schaffen des zum Leben Unentbehrlichen" sind das nicht dieselben Dinge, die Sankt Sancho den Kommunisten vorwirft, deren Mangel Herr Buchez den Kommunisten vorwirft und dessen feierliche Vorwürfe Cabet verhöhnt?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.176.2
  kind: p
  original: Ist nicht selbst Stirners Hierarchie" hier [sch]on vorhanden?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.177.1
  kind: p
  original: 'Schließlich gibt Sankt Sancho dem Kommunismus p. 169 den Gnadenstoß, indem er folgenden Satz ausstößt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.178.1
  kind: p
  original: '"Indem die Sozialisten auch das Eigentum wegnehmen" (!), "beachten sie nicht, daß dies sich in der Eigenheit eine Fortdauer sichert.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.178.2
  kind: p
  original: Ist denn bloß Geld und Gut ein Eigentum, oder ist jede Meinung ein Mein, ein Eigenes?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.178.3
  kind: p
  original: Es muß also jede Meinung aufgehoben oder unpersönlich gemacht werden."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.179.1
  kind: p
  original: Oder ist Sankt Sanchos Meinung, insofern sie nicht auch zur Meinung Anderer wird, ein Kommando über irgend etwas, selbst über die fremde Meinung?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.179.2
  kind: p
  original: Indem Sankt Max hier das Kapital seiner Meinung gegen den Kommunismus geltend macht, tut er wieder Nichts Andres, als daß er die ältesten und trivialsten Bourgeoiseinwürfe gegen ihn vorbringt, und glaubt etwas Neues gesagt zu haben, weil ihm, dem jebildeten Berliner, diese Abgedroschenheiten neu sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '209'
- id: AT6.179.3
  kind: p
  original: Unter und nach vielen Andern hat Destutt de Tracy vor ungefähr dreißig Jahren und später in dem hier zitierten Buche dasselbe viel besser gesagt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 209-210
- id: AT6.179.4
  kind: p
  original: 'Z.B.:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '210'
- id: AT6.180.1
  kind: p
  original: '"Man hat förmlich den Prozeß des Eigentums instruiert und Gründe für und wider vorgebracht, als wenn es von uns abhinge zu beschließen, daß es Eigentum gebe oder nicht gebe in dieser Welt; aber das heißt durchaus unsre Natur verkennen." ("Traité de la volonté", Paris, 1826, p. 18.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '210'
- id: AT6.181.1
  kind: p
  original: Und nun gibt sich Herr Destutt de Tracy daran zu beweisen, daß propriété, individualité und personalité <Eigentum, Individuum und Persönlichkeit> identisch sind, daß in dem moi <Ich> auch das mien <Mein> liege, und er findet darin eine Naturgrundlage für das Privateigentum, daß
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '210'
- id: AT6.182.1
  kind: p
  original: '"die Natur den Menschen mit einem unvermeidlichen und unveräußerlichen Eigentum begabt hat, dem seines Individuums". (p. 17.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '210'
- id: AT6.182.2
  kind: p
  original: '- Das Individuum "sieht klar, daß dieses Ich exklusiver Eigentümer des Körpers ist, den es beseelt, der Organe, die es bewegt, aller ihrer Fähigkeiten, aller ihrer Kräfte, aller Wirkungen, die sie produzieren, aller ihrer Leidenschaften und Handlungen; denn Alles dies endet und beginnt mit diesem Ich, existiert nur durch es, ist nur bewegt durch seine Aktion; und keine andre Person kann diese selben Instrumente anwenden, noch in derselben Weise von ihnen affiziert sein." (p. 16.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '210'
- id: AT6.182.3
  kind: p
  original: '- "Das Eigentum existiert, wenn nicht gerade überall, wo ein empfindendes Individuum existiert, mindestens überall, wo ein wollendes Individuum existiert." (p. 19.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '210'
- id: AT6.183.1
  kind: p
  original: 'Nachdem er so Privateigentum und Persönlichkeit identifiziert hat, gibt sich nun wie bei "Stirner" vermittelst des Wortspiels mit Mein und Meinung, Eigentum und Eigenheit bei Destutt de Tracy aus propriété <Eigentum> und propre <eigen> folgender Schluß:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '210'
- id: AT6.184.1
  kind: p
  original: '"Es ist also durchaus unnütz, darüber zu streiten, ob es nicht besser sei, daß Jedem von uns Nichts eigen wäre (de discuter s''il ne vaudrait pas mieux que rien ne fût propre à chacun de nous) - - in allen Fällen heißt das fragen. ob es nicht wünschenswert sei, daß wir ganz andre wären als wir sind, und selbst untersuchen, ob es nicht besser wäre, daß wir gar nicht seien." (p. 22.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '210'
- id: AT6.185.1
  kind: p
  original: '"Das sind höchst populäre", bereits traditionell gewordene Einwürfe gegen den Kommunismus, "und es ist" ebendeswegen nicht "zu verwundern, daß Stirner" sie wiederholt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '210'
- id: AT6.186.1
  kind: p
  original: 'Wenn der bornierte Bourgeois zu den Kommunisten sagt: Indem Ihr das Eigentum, d.h. meine Existenz als Kapitalist, als Grundbesitzer, als Fabrikant, und Eure Existenz als Arbeiter aufhebt, hebt Ihr meine und Eure Individualität auf; indem Ihr es mir unmöglich macht, Euch Arbeiter zu exploitieren, meine Profite, Zinsen oder Renten einzustreichen, macht Ihr es mir unmöglich, als Individuum zu existieren.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '210'
- id: AT6.186.2
  kind: p
  original: '- Wenn also der Bourgeois den Kommunisten erklärt: Indem Ihr meine Existenz als Bourgeois aufhebt, hebt Ihr meine Existenz als Individuum auf, wenn er so sich als Bourgeois mit sich als Individuum identifiziert, so ist daran wenigstens die Offenherzigkeit und Unverschämtheit anzuerkennen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 210-211
- id: AT6.186.3
  kind: p
  original: Für den Bourgeois ist dies wirklich der Fall; er glaubt nur insofern Individuum zu sein, als er Bourgeois ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '211'
- id: AT6.187.1
  kind: p
  original: Sobald aber die Theoretiker der Bourgeoisie hereinkommen und dieser Behauptung einen allgemeinen Ausdruck geben, das Eigentum des Bourgeois mit der Individualität auch theoretisch identifizieren und diese Identifizierung logisch rechtfertigen wollen, fängt der Unsinn erst an, feierlich und heilig zu werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '211'
- id: AT6.188.1
  kind: p
  original: '"Stirner" widerlegte oben die kommunistische Aufhebung des Privateigentums dadurch, daß er das Privateigentum in das "Haben" verwandelte und dann das Zeitwort "Haben" für ein unentbehrliches Wort, für eine ewige Wahrheit erklärte, weil es auch in der kommunistischen Gesellschaft vorkommen könne, daß er Leibschmerzen "habe".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '211'
- id: AT6.188.2
  kind: p
  original: Geradeso begründet er hier die Unabschaffbarkeit des Privateigentums darauf, daß er es in den Begriff des Eigentums verwandelt, den etymologischen Zusammenhang zwischen "Eigentum" und "eigen" exploitiert und das Wort "eigen" für eine ewige Wahrheit erklärt, weil es doch auch unter dem kommunistischen Regime vorkommen kann, daß ihm Leibschmerzen "eigen" sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '211'
- id: AT6.188.3
  kind: p
  original: Dieser ganze theoretische Unsinn, der sein Asyl in der Etymologie sucht, wäre unmöglich, wenn nicht das wirkliche Privateigentum, das die Kommunisten aufheben wollen, in den abstrakten Begriff "das Eigentum" verwandelt würde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '211'
- id: AT6.188.4
  kind: p
  original: Hiermit erspart man sich einerseits die Mühe, über das wirkliche Privateigentum etwas zu sagen oder auch nur zu wissen, und kann andrerseits leicht dahin kommen, im Kommunismus einen Widerspruch zu entdecken, indem man in ihm, nach der Aufhebung des (wirklichen) Eigentums, allerdings leicht noch allerlei Dinge entdecken kann, die sich unter "das Eigentum" subsumieren lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '211'
- id: AT6.188.5
  kind: p
  original: In der Wirklichkeit verhält sich die Sache freilich gerade umgekehrt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - AT6.N9
  mew_page: '211'
- id: AT6.188.6
  kind: p
  original: In der Wirklichkeit habe ich nur insoweit Privateigentum, als ich Verschacherbares habe, während meine Eigenheit durchaus unverschacherbar sein kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '211'
- id: AT6.188.7
  kind: p
  original: An meinem Rock habe ich nur so lange Privateigentum, als ich ihn wenigstens verschachern, versetzen oder verkaufen kann, [als er verschach]erbar ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '211'
- id: AT6.188.8
  kind: p
  original: Verliert er diese Eigenschaft, wird er zerlumpt, so kann er für mich noch allerlei Eigenschaften haben, die ihn mir wertvoll machen, er kann sogar zu meiner Eigenschaft werden und mich zu einem zerlumpten Individuum machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 211-212
- id: AT6.188.9
  kind: p
  original: Aber es wird keinem Ökonomen einfallen, ihn als mein Privateigentum zu rangieren, da er mir über kein auch noch so geringes Quantum fremder Arbeit noch ein Kommando gibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '212'
- id: AT6.188.10
  kind: p
  original: Der Jurist, der Ideologe des Privateigentums, kann vielleicht noch so etwas faseln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '212'
- id: AT6.188.11
  kind: p
  original: Das Privateigentum entfremdet nicht nur die Individualität der Menschen, sondern auch die der Dinge.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '212'
- id: AT6.188.12
  kind: p
  original: Der Grund und Boden hat Nichts mit der Grundrente, die Maschine Nichts mit dem Profit zu tun.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '212'
- id: AT6.188.13
  kind: p
  original: Für den Grundbesitzer hat der Grund und Boden nur die Bedeutung der Grundrente, er verpachtet seine Grundstücke und zieht die Rente ein; eine Eigenschaft, die der Boden verlieren kann, ohne irgendeine seiner inhärenten Eigenschaften, ohne z.B. einen Teil seiner Fruchtbarkeit zu verlieren, eine Eigenschaft, deren Maß, ja deren Existenz von gesellschaftlichen Verhältnissen abhängt, die ohne Zutun des einzelnen Grundbesitzers gemacht und aufgehoben werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '212'
- id: AT6.188.14
  kind: p
  original: Ebenso mit der Maschine.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '212'
- id: AT6.188.15
  kind: p
  original: 'Wie wenig das Geld, die allgemeinste Form des Eigentums, mit der persönlichen Eigentümlichkeit zu tun hat, wie sehr es ihr geradezu entgegengesetzt ist, wußte bereits Shakespeare besser als unser theoretisierender Kleinbürger:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '212'
- id: AT6.189.1
  kind: p
  original: Soviel hievon macht schwarz weiß, häßlich schön, Schlecht gut, alt jung, feig tapfer, niedrig edel, Ja dieser rote Sklave - - Er macht den Aussatz lieblich - - - - dieser führt Der überjähr'gen Witwe Freier zu; Die, von Spital und Wunden giftig eiternd, Mit Ekel fortgeschickt, verjüngt balsamisch Zu Maienjugend dies - - - - sichtbare Gottheit, Die du Unmöglichkeiten eng verbrüderst, Zum Kuß sie zwingst!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '212'
- id: AT6.190.1
  kind: p
  original: Mit einem Wort, Grundrente, Profit etc., die wirklichen Daseinsweisen des Privateigentums, sind gesellschaftliche, einer bestimmten Produktionsstufe entsprechende Verhältnisse und "individuelle" nur so lange, als sie noch nicht zur Fessel der vorhandenen Produktivkräfte geworden sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '212'
- id: AT6.191.1
  kind: p
  original: Nach Destutt de Tracy muß die Majorität der Menschen, die Proletarier, längst alle Individualität verloren haben, obgleich es heutzutage so aussieht, als entwickle sich unter ihnen noch gerade am meisten Individualität.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '212'
- id: AT6.191.2
  kind: p
  original: Der Bourgeois hat es um so leichter, aus seiner Sprache die Identität merkantilischer und individueller oder auch allgemein menschlicher Beziehungen zu beweisen, als diese Sprache selbst ein Produkt der Bourgeoisie ist und daher wie in der Wirklichkeit, so in der Sprache die Verhältnisse des Schachers zur Grundlage aller andern gemacht worden sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 212-213
- id: AT6.191.3
  kind: p
  original: Z.B. propriété Eigentum und Eigenschaft, property Eigentum und Eigentümlichkeit, "eigen" im merkantilischen Sinn und im individuellen Sinn, valeur, value, Wert - commerce, Verkehr - échange, exchange, Austausch usw., die sowohl für kommerzielle Verhältnisse wie für Eigenschaften und Beziehungen von Individuen als solchen gebraucht werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: AT6.191.4
  kind: p
  original: In den übrigen modernen Sprachen ist dies ganz ebenso der Fall.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: AT6.191.5
  kind: p
  original: Wenn Sankt Max sich ernstlich darauf legt, diese Zweideutigkeit zu exploitieren, so kann er es leicht dahin bringen, eine glänzende Reihe neuer ökonomischer Entdeckungen zu machen, ohne ein Wort von der Ökonomie zu wissen; wie denn auch seine später zu registrierenden neuen ökonomischen Fakta sich ganz innerhalb dieses Kreises der Synonymik halten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: AT6.192.1
  kind: p
  original: Der gutmütige und leichtgläubige Jacques nimmt den Wortwitz des Bourgeois mit Eigentum und Eigenschaft so genau, in so heiligem Ernst, daß er sich sogar bestrebt, sich als Privateigentümer zu seinen eignen Eigenschaften zu verhalten, wie wir später sehen werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: AT6.193.1
  kind: p
  original: p. 421 endlich belehrt "Stirner" den Kommunismus darüber, daß "man" (nämlich der Kommunismus)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: AT6.194.1
  kind: p
  original: '" in Wahrheit nicht das Eigentum angreift, sondern die Entfremdung des Eigentums".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: AT6.195.1
  kind: p
  original: Sankt Max wiederholt uns in dieser neuen Offenbarung nur einen alten Witz, den z.B. bereits die Saint-Simonisten vielfach ausgebeutet haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: AT6.195.2
  kind: p
  original: 'Vgl. z.B. "Leçons sur l''industrie et les finances", Paris 1832, wo es u.a. heißt:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: AT6.196.1
  kind: p
  original: '"Das Eigentum wird nicht abgeschafft, sondern seine Form wird verwandelt, - -, es wird erst zur wahren Personifikation werden, - - es wird erst seinen wirklichen individuellen Charakter erhalten." (p. 42, 43.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: AT6.197.1
  kind: p
  original: Da diese von den Franzosen aufgebrachte und namentlich von Pierre Leroux outrierte Phrase von den deutschen spekulativen Sozialisten mit vielem Wohlgefallen aufgenommen worden und weiter ausspekuliert ist und zuletzt zu reaktionären Umtrieben und praktischen Beutelschneidereien Anlaß gegeben hat, so werden wir sie hier, wo sie nichtssagend ist, auch nicht behandeln, sondern weiter unten, bei Gelegenheit des wahren Sozialismus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: AT6.198.1
  kind: p
  original: Sankt Sancho gefällt sich darin, [nach dem] Vorbilde des von Reichardt [exploitierten] Wönigers die Proletarier [und damit] auch die Kommunisten zu "Lum [ pen" zu] machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: AT6.198.2
  kind: p
  original: Er definiert seinen "Lumpen" p. 362 dahin, daß er ein Mensch von nur idealem Reichtum" ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: AT6.198.3
  kind: p
  original: Wenn die Stirnerschen "Lumpen" einmal, wie im fünfzehnten Jahrhundert die Pariser Bettler, ein Lumpenkönigreich stiften, so wird Sankt Sancho Lumpenkönig, da er der "vollendete" Lump, ein Mensch von nicht einmal idealem Reichtum ist und daher auch von den Zinsen des Kapitals seiner Meinung zehrt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 213-214
- id: AT6.199.1
  kind: heading
  original: C) Der humane Liberalismus
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
- id: AT6.200.1
  kind: p
  original: Nach dem Sankt Max den Liberalismus und Kommunismus als unvollendete Existenzweisen des philosophischen "Menschen" und damit der neueren deutschen Philosophie überhaupt sich zurechtgemacht hat (wozu er insoweit berechtigt war, als nicht nur der Liberalismus, sondern auch der Kommunismus in Deutschland eine kleinbürgerliche und zugleich überschwenglich-ideologische Gestalt erhalten hat), ist es ihm nunmehr leicht, die neuesten Formen der deutschen Philosophie, den von ihm so genannten "humanen Liberalismus" als vollendeten Liberalismus und Kommunismus und zugleich als Kritik dieser beiden darzustellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
- id: AT6.201.1
  kind: p
  original: 'Durch diese heilige Konstruktion ergeben sich nun folgende drei ergötzliche Wandlungen - (vgl. auch die Ökonomie des Alten Bundes):'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
- id: AT6.202.1
  kind: p
  original: '1. Der Einzelne ist nicht der Mensch, darum gilt er nichts - kein persönlicher Wille, Ordonnanz - "dessen Namen wird man nennen": "Herrenlos" - politischer Liberalismus, den wir schon oben behandelt haben.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
- id: AT6.203.1
  kind: p
  original: '2. Der Einzelne hat nichts Menschliches, darum gilt kein Mein und Dein oder Eigentum: "besitzlos" - Kommunismus, den wir ebenfalls schon behandelt haben.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
- id: AT6.204.1
  kind: p
  original: '3. Der Einzelne soll in der Kritik dem jetzt erst gefundenen Menschen Platz machen: "gottlos" = Identität von "Herrenlos" und "besitzlos" - humaner Liberalismus. p. 180, 181.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
- id: AT6.204.2
  kind: p
  original: '- In der näheren Ausführung dieser letzteren negativen Einheit faßt sich die unerschütterliche Rechtgläubigkeit Jacques'' zu folgender Spitze zusammen: p. 189:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
- id: AT6.205.1
  kind: p
  original: '"Der Egoismus des Eigentums hat sein Letztes eingebüßt, wenn auch das ''Mein Gott'' sinnlos geworden ist, denn " (allergrößtes Denn!)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
- id: AT6.205.2
  kind: p
  original: '"Gott ist nur, wenn ihm das Heil des Einzelnen am Herzen liegt, wie dieser in ihm sein Heil sucht."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
- id: AT6.206.1
  kind: p
  original: Hiernach hätte der französische Bourgeois erst dann sein "letztes" "Eigentum eingebüßt", wenn das Wort adieu aus der Sprache verbannt [wäre].
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
- id: AT6.206.2
  kind: p
  original: Ganz im Einklang mit der bis[herigen] Konstruktion wird hier das Eigentum an Gott, das heilige Eigentum im Himmel, das Eigentum der Phantasie, die Phantasie des Eigentums für das höchste Eigentum und den letzten Notanker des Eigentums erklärt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
- id: AT6.207.1
  kind: p
  original: Aus diesen drei Illusionen über Liberalismus, Kommunismus und deutsche Philosophie braut er sich nun seinen neuen - diesmal, dem "Heiligen" sei Dank, den letzten - Übergang zum "Ich".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 214-215
- id: AT6.207.2
  kind: p
  original: Ehe wir ihm dahin folgen, wollen wir noch einen Blick auf seinen letzten "sauren Lebenskampf" mit dem "humanen Liberalismus" werfen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: AT6.208.1
  kind: p
  original: Nachdem unser Biedermann Sancho in seiner neuen Rolle als caballero andante <fahrender Ritter>, und zwar als caballero de la tristisima figura <Ritter von der traurigen Gestalt> die ganze Geschichte durchzogen, überall die Geister und Gespenster, die "Drachen und Straußen, Feldteufel und Kobolde, Marder und Geier, Rohrdommeln und Igel" (vgl. Jes[aia] 34, 11-14) bekämpft und "umgeblasen" hat, wie wohl muß ihm jetzt werden, wenn er nun endlich aus allen diesen verschiedenen Ländern auf seine Insel Barataria, in "das Land" als solches kommt, wo " der Mensch" in puris naturalibus <im reinen Naturzustand> herumläuft!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: AT6.208.2
  kind: p
  original: 'Rufen wir uns noch einmal seinen Großen Satz, das ihm aufgebundene Dogma ins Gedächtnis, worauf seine ganze Geschichtskonstruktion beruht: daß'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: AT6.209.1
  kind: p
  original: '"die Wahrheiten, die sich aus dem Begriffe des Menschen ergeben, als Offenbarungen eben dieses Begriffes verehrt und - heilig gehalten werden"; den Offenbarungen dieses heiligen Begriffs" werde selbst "durch Abschaffung mancher durch diesen Begriff manifestierten Wahrheiten nicht ihre Heiligkeit genommen". (p. 51.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: AT6.210.1
  kind: p
  original: Wir brauchen kaum zu wiederholen, was wir dem heiligen Schriftsteller an allen seinen Beispielen nachgewiesen haben, daß man hinterher als Offenbarung des Begriffs "Mensch" konstruiert, darstellt, sich vorstellt, befestigt und rechtfertigt, was empirische, von den wirklichen Menschen in ihrem wirklichen Verkehr, keineswegs vom heiligen Begriff des Men[schen] geschaffene Verhältnisse sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: AT6.210.2
  kind: p
  original: '[Man] rufe sich auch seine Hierarchie [in das] Gedächtnis.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: AT6.210.3
  kind: p
  original: Nun zum humanen [Liber]alismus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: AT6.211.1
  kind: p
  original: '[p. 4]4, wo Sankt Max "in Kürze" ["die theo]logische Ansicht Feuerbachs und Unsere [einander] gegenüberstellt", wird Feuerbach zunächst Nichts entgegengestellt als eine Redensart.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: AT6.211.2
  kind: p
  original: 'Wie wir schon bei der Geisterfabrikation sahen, wo "Stirner" seinen Magen unter die Sterne versetzt (dritter Dioskur), Schutzpatron gegen die Seekrankheit), weil er und sein Magen "verschiedene Namen für völlig Verschiedenes" sind (p. 42) so erscheint das Wesen hier zunächst auch als existierendes Ding, und "so heißt es nun" p. 44:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: AT6.212.1
  kind: p
  original: '"Das höchste Wesen ist allerdings das Wesen des Menschen, aber eben weil es sein Wesen und nicht er selbst ist, so bleibt es sich ganz gleich, ob wir es außer ihm sehen und als ''Gott'' anschauen oder in ihm finden und ''Wesen des Menschen'' oder '' der Mensch'' nennen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: AT6.212.2
  kind: p
  original: Ich bin weder Gott noch der Mensch, weder das höchste Wesen noch Mein Wesen, und darum ist's in der Hauptsache einerlei, ob Ich das Wesen in Mir oder außer Mir denke."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: AT6.213.1
  kind: p
  original: Das "Wesen des Menschen" ist also hier als ein existierendes Ding vorausgesetzt, es ist "das höchste Wesen", es ist nicht "Ich", und Sankt Max, statt über "das Wesen" etwas zu sagen, beschränkt sich auf die einfache Erklärung, daß es jleichjültig ist, "ob Ich es in Mir oder außer Mir", ob ich es in dieser oder jener Lokalität "denke".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: AT6.213.2
  kind: p
  original: Daß diese Gleichgültigkeit gegen das Wesen durchaus keine bloße Nachlässigkeit des Stils ist, geht schon daraus hervor, daß er selbst die Unterscheidung zwischen wesentlich und unwesentlich macht, daß bei ihm selbst sogar "das edle Wesen des Egoismus" p. 71 figurieren kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: AT6.213.3
  kind: p
  original: Was übrigens bisher von deutschen Theoretikern über Wesen und Unwesen gesagt worden ist, findet sich Alles schon viel besser bei Hegel in der "Logik".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: AT6.214.1
  kind: p
  original: Wir fanden die grenzenlose Rechtgläubigkeit "Stirners" an die Illusionen der deutschen Philosophie darin konzentriert, daß er fortwährend der Geschichte als einzig handelnde Person " den Menschen" unterschiebt und glaubt, " der Mensch" habe die Geschichte gemacht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: AT6.214.2
  kind: p
  original: Wir werden dies jetzt auch wieder bei Feuerbach finden, dessen Illusionen er getreulichst akzeptiert, um darauf weiter fortzubauen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: AT6.215.1
  kind: p
  original: p. 77. "Überhaupt bewirkt Feuerbach nur eine Umstellung von Subjekt und Prädikat, eine Bevorzugung des Letzteren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: AT6.215.2
  kind: p
  original: 'Da er aber selbst sagt: ''Die Liebe ist nicht dadurch heilig (und hat den Menschen niemals dadurch für heilig gegolten), daß sie ein Prädikat Gottes, sondern sie ist ein Prädikat Gottes, weil sie durch und für sich selbst göttlich ist'', so konnte er finden, daß der Kampf gegen die Prädikate selbst eröffnet werden mußte, gegen die Liebe und alle Heiligkeiten.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: AT6.215.3
  kind: p
  original: Wie durfte er hoffen, die Menschen von Gott abzuwenden, wenn er ihnen das Göttliche ließ?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: AT6.215.4
  kind: p
  original: Und ist ihnen, wie Feuerbach sagt, Gott selbst nie die Hauptsache gewesen, sondern nur seine Prädikate, so konnte er ihnen immerhin den Flitter noch länger lassen, da ja die Puppe doch blieb, der eigentliche Kern."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: AT6.216.1
  kind: p
  original: Weil Feuerbach also "selbst" das sagt, so ist das Grund genug für Jacques le bonhomme, ihm zu glauben, daß den Menschen die Liebe gegolten habe, - weil sie "durch und für sich selbst göttlich ist".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: AT6.216.2
  kind: p
  original: Wenn nun gerade das Umgekehrte von dem, was Feuerbach sagt, stattfand - und wir "erkühnen uns, dies zu sagen" (Wigand, p. 157) -, wenn den Menschen weder Gott noch seine Prädikate jemals die Hauptsache gewesen sind, wenn dies selbst nur die religiöse Illusion der deutschen Theorie ist - so passiert also unsrem Sancho dasselbe, was ihm bereits bei Cervantes passierte, als man ihm vier Pfähle unter seinen Sattel stellte, da er schlief, und seinen Grauen unter ihm wegzog.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: AT6.217.1
  kind: p
  original: Auf diese Aussagen Feuerbachs gestützt, beginnt Sancho den Kampf, der ebenfalls bereits bei Cervantes am neunzehnten vorgezeichnet steht, da der ingenioso hidalgo <scharfsinnige Adlige> gegen die Prädikate kämpft, die Vermummten, so den Leichnam der Welt zu Grabe tragen, und die, in ihren Talaren und Leichenmänteln verwickelt, sich nicht regen können und es unsrem Hidalgo leicht machen, sie mit seiner Stange umzurennen und weidlich abzuprügeln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 216-217
- id: AT6.217.2
  kind: p
  original: Der letzte Versuch, die nun bis zur Ermüdung durchgepeitschte Kritik der Religion als einer eignen Sphäre weiter auszubeuten, innerhalb der Voraussetzungen der deutschen Theorie stehenzubleiben und doch sich den Schein zu geben, als trete man heraus, aus diesem bis zur letz[ten] Faser abgenagten Knochen noch [eine Ru]mfordsche breite Bettelsuppe [für "das] Buch" zu kochen, bestand darin, die materiellen Verhältnisse nicht in ihrer wirklichen Gestalt, nicht einmal in der profanen Illusion der in der heutigen Welt praktisch Befangenen, sondern in dem himmlischen Extrakt ihrer profanen Gestalt als Prädikate, als Emanationen Gottes, als Engel zu bekämpfen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
- id: AT6.217.3
  kind: p
  original: So war nun das Himmelreich wieder bevölkert und der alten Manier der Exploitation dieses Himmelreichs wieder neues Material in Masse geschaffen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
- id: AT6.217.4
  kind: p
  original: So war der Kampf mit der religiösen Illusion, mit Gott, wieder dem wirklichen Kampf untergeschoben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
- id: AT6.217.5
  kind: p
  original: 'Sankt Bruno, dessen Broterwerb die Theologie ist, macht in seinen "sauren Lebenskämpfen" gegen die Substanz denselben Versuch pro aris et focis <wörtlich: für Altar und Herd; hier: für die eigne Denkweise und die eigne Stellung>, als Theologe aus der Theologie herauszutreten.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
- id: AT6.217.6
  kind: p
  original: Seine "Substanz" ist Nichts als die in Einem Namen zusammengefaßten Prädikate Gottes; mit Ausschluß der Persönlichkeit, die er sich vorbehält - der Prädikate Gottes, die wieder nichts sind als die verhimmelten Namen von Vorstellungen der Menschen von ihren bestimmten empirischen Verhältnissen, Vorstellungen, die sie später aus praktischen Gründen heuchlerisch festhalten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
- id: AT6.217.7
  kind: p
  original: Das empirische, materielle Verhalten dieser Menschen kann natürlich mit dem von Hegel ererbten theoretischen Rüstzeug auch nicht einmal verstanden werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
- id: AT6.217.8
  kind: p
  original: 'Indem Feuerbach die religiöse Welt als die Illusion der bei ihm selbst nur noch als Phrase vorkommenden irdischen Welt aufzeigte, ergab sich von selbst auch für die deutsche Theorie die von ihm nicht beantwortete Frage: Wie kam es, daß die Menschen sich diese Illusionen "in den Kopf setzten"?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
- id: AT6.217.9
  kind: p
  original: Diese Frage bahnte selbst für die deutschen Theoretiker den Weg zur materialistischen, nicht voraussetzungslosen, sondern die wirklichen materiellen Voraussetzungen als solche empirisch beobachtenden und darum erst wirklich kritischen Anschauung der Welt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
- id: AT6.217.10
  kind: p
  original: Dieser Gang war schon angedeutet in den "Deutsch-Französischen Jahrbüchern" in der "Einleitung zur Kritik der Hegelschen Rechtsphilosophie" und "Zur Judenfrage".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
- id: AT6.217.11
  kind: p
  original: Da dies damals noch in philosophischer Phraseologie geschah, so gaben die hier traditionell unterlaufenden philosophischen Ausdrücke wie "menschliches Wesen", "Gattung" pp. den deutschen Theoretikern die erwünschte Veranlassung, die wirkliche Entwicklung zu mißverstehen und zu glauben, es handle sich hier wieder nur um eine neue Wendung ihrer abgetragenen theoretischen Röcke - wie denn auch der Dottore Graziano der deutschen Philosophie, der Doktor Arnold Ruge, glaubte, er dürfe hier noch fortwährend mit seinen unbeholfenen Gliedmaßen um sich schlagen und seine pedantisch-burleske Maske zur Schau tragen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 217-218
- id: AT6.217.12
  kind: p
  original: Man muß "die Philosophie beiseite liegenlassen" (Wig[and,] p. 187, vgl. Heß, "Die letzten Philosophen", p. 8), man muß aus ihr herausspringen und sich als ein gewöhnlicher Mensch an das Studium der Wirklichkeit geben, wozu auch literarisch ein ungeheures, den Philosophen natürlich unbekanntes Material vorliegt; und wenn man dann einmal wieder Leute wie Krummacher oder " Stirner " vor sich bekommt, so findet man, daß man sie längst "hinter" und unter sich hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
- id: AT6.217.13
  kind: p
  original: Philosophie und Studium der wirklichen Welt verhalten sich zueinander wie Onanie und Geschlechtsliebe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
- id: AT6.217.14
  kind: p
  original: Sankt Sancho, der trotz seiner von uns mit Geduld und von ihm mit Emphase konstatierten Gedankenlosigkeit innerhalb der Welt der reinen Gedanken stehenbleibt, kann natürlich nur durch ein moralisches Postulat, durch das Postulat der "Gedankenlosigkeit", sich vor ihr retten (p. 196 des "Buchs").
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
- id: AT6.217.15
  kind: p
  original: Er ist der Bürger, der sich durch die banqueroute cochonne <schludrigen Bankrott> vor dem Handel rettet, wodurch er natürlich kein Proletarier, sondern unbemittelter bankerutter Bürger wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
- id: AT6.217.16
  kind: p
  original: Er wird nicht Weltmann, sondern gedankenloser, bankerutter Philosoph.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
- id: AT6.218.1
  kind: p
  original: Die von Feuerbach überlieferten Prädikate Gottes als wirkliche Mächte über die Menschen, als Hierarchen, sind der der empirischen Welt untergeschobne Wechselbalg, den "Stirner" vorfindet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
- id: AT6.218.2
  kind: p
  original: So sehr beruht seine ganze "Eigenheit" nur auf "Eingegebnem".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
- id: AT6.218.3
  kind: p
  original: Wenn "Stirner" (s. auch p. 63) Feuerbach vorwirft, er komme zu Nichts, weil er das Prädikat zum Subjekt mache und umgekehrt, [so] kann er nur noch zu viel weniger kommen, [weil] er diese Feuerbachschen, zu Subjekten gemachten Prädikate als wirkliche [die Welt behe]rrschende Persönlichkeiten, diese Phrasen über die Verhältnisse als die wirklichen Verhältnisse treulichst akzeptiert, ihnen das Prädikat heilig beilegt, dies Prädikat in ein Subjekt, "das Heilige", verwandelt, also ganz dasselbe tut, was er Feuerbach zum Vorwurf macht, und nun, nachdem er hierdurch den bestimmten Inhalt, um den es sich handelte, gänzlich losgeworden ist, gegen dies "Heilige", das natürlich immer dasselbe bleibt, seinen Kampf, d.h. seinen "Widerwillen" eröffnet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
- id: AT6.218.4
  kind: p
  original: Bei Feuerbach ist noch das Bewußtsein, was ihm Sankt Max zum Vorwurf macht, "daß es sich bei ihm 'nur um die Vernichtung einer Illusion handelt'" (p. 77 "des Buchs") - obgleich Feuerbach dem Kampfe gegen diese Illusion noch viel zu große Wichtigkeit beilegt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
- id: AT6.218.5
  kind: p
  original: Bei "Stirner" ist auch dies Bewußtsein "alle jeworden", er glaubt wirklich an die Herrschaft der abstrakten Gedanken der Ideologie in der heutigen Welt, er glaubt, in seinem Kampfe gegen die "Prädikate", die Begriffe, nicht mehr eine Illusion, sondern die wirklichen Herrschermächte der Welt anzugreifen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 218-219
- id: AT6.218.6
  kind: p
  original: Daher seine Manier, alles auf den Kopf zu stellen, daher seine enorme Leichtgläubigkeit, mit der er alle scheinheiligen Illusionen, alle heuchlerischen Beteuerungen der Bourgeoisie für bare Münze nimmt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: AT6.218.7
  kind: p
  original: Wie wenig übrigens "die Puppe" "der eigentliche Kern" "des Flitters" und wie lahm dies schöne Gleichnis ist, zeigt sich am besten an "Stirners" eigner "Puppe" - "dem Buch" -, an dem gar kein, weder "eigentlicher" noch un-"eigentlicher" "Kern" vorhanden ist und wo selbst das Wenige, was auf den 491 Seiten vorhanden ist, kaum den Namen "Flitter" verdient.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: AT6.218.8
  kind: p
  original: '- Sollen wir aber einmal einen "Kern" darin finden, so ist dieser Kern - der deutsche Kleinbürger.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: AT6.219.1
  kind: p
  original: Woher übrigens Sankt Maxens Haß gegen die "Prädikate" stammt, darüber gibt er selbst im apologetischen Kommentar einen höchst naiven Aufschluß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: AT6.219.2
  kind: p
  original: 'Er zitiert folgende Stelle aus dem "Wesen des Christenthums", p. 31: "Ein wahrer Atheist ist nur der, welchem die Prädikate des göttlichen Wesens, wie z.B. die Liebe, die Weisheit, die Gerechtigkeit Nichts sind, aber nicht der, welchem nur das Subjekt dieser Prädikate Nichts ist" - und ruft dann triumphierend aus: "Trifft dies nicht bei Stirner ein?"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: AT6.219.3
  kind: p
  original: '- "Hier ist Weisheit."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: AT6.219.4
  kind: p
  original: Sankt Max fand in obiger Stelle einen Wink, wie man es anfangen müsse, um "am Allerweitesten " zu gehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: AT6.219.5
  kind: p
  original: Er glaubt Feuerbach, daß dies Obige das "Wesen" des "wahren Atheisten" sei und läßt sich nun von ihm die "Aufgabe" stellen, der "wahre Atheist" zu werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: AT6.219.6
  kind: p
  original: Der "Einzige" ist "der wahre Atheist ".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: AT6.220.1
  kind: p
  original: Noch viel leichtgläubiger als gegen Feuerbach "machiniert" er gegen Sankt Bruno oder "die Kritik".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: AT6.220.2
  kind: p
  original: Was er sich alles von "der Kritik" aufbinden läßt, wie er sich unter ihre Polizeiaufsicht stellt, wie sie ihm seine Lebensart, seinen "Beruf" eingibt - wir werden das allgemach sehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: AT6.220.3
  kind: p
  original: Einstweilen genügt als Probe seines Glaubens an die Kritik, daß er p. 186 "Kritik" und "Masse" als zwei Personen behandelt, die gegeneinander kämpfen und "sich vom Egoismus zu befreien suchen", und p. 187 Beide "für das nimmt, wofür sie sich - ausgeben ".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: AT6.221.1
  kind: p
  original: Mit dem Kampf gegen den humanen Liberalismus ist der lange Kampf des Alten Bundes, wo der Mensch ein Zuchtmeister auf den Einzigen war, beendigt; die Zeit ist erfüllet und das Evangelium der Gnade und Freude bricht herein über die sündige Menschheit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: AT6.222.1
  kind: p
  original: Der Kampf um "den Menschen" ist die Erfüllung des Wortes, das da geschrieben steht bei Cervantes am einundzwanzigsten, "welches von dem hohen Abenteuer und reichen Gewinnung des Helmes Mambrins handelt".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: AT6.222.2
  kind: p
  original: Unser Sancho, der seinem ehemaligen Herrn und jetzigen Knecht Alles nachmacht, hat "den Schwur getan, den Helm Mambrins" - den Menschen - für sich "zu erobern".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: AT6.222.3
  kind: p
  original: 'Nachdem er in seinen verschiedenen "Auszügen" den ersehnten Helm bei den Alten und Neuen, Liberalen und Kommunisten vergebens gesucht hat, "sieht er einen Menschen zu Pferde, der auf seinem Kopfe etwas trägt, welches leuchtet, als wenn es von Gold wäre", und spricht zu Don Quijote-Szeliga: "Wenn Ich mich nicht täusche, so kommt Einer dort zu uns heran, der auf seinem Haupte den Helm Mambrins trägt, wegen dessen Ich den Schwur getan habe, so du weißest."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: AT6.222.4
  kind: p
  original: '"Nehme sich Eure Herrlichkeit wohl in Acht, was sie sagen und noch mehr, was sie tun", erwidert der im Laufe der Zeit klug gewordene Don Quijote.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: AT6.222.5
  kind: p
  original: '"Sage Mir, siehst du nicht jenen Ritter, der zu uns herankommt auf einem graugefleckten Roß, und hat auf seinem Haupte einen goldenen Helm?"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: AT6.222.6
  kind: p
  original: '- "Was Ich sehe und gewahre", erwidert Don Quijote, "ist nur ein Kerl auf einem grauen Esel wie der Eurige, welcher auf seinem Kopfe etwas trägt, was glänzt."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: AT6.222.7
  kind: p
  original: '- "Also nun das ist der Helm des Mambrin", sagt Sancho.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: AT6.223.1
  kind: p
  original: Unterdessen kam der heilige Barbier Bruno auf seinem Eselein, der Kritik, ruhig herangetrabt, mit seinem Barbierbecken auf dem Kopfe; Sankt Sancho legt seine Lanze auf ihn ein, Sankt Bruno springt von seinem Esel, läßt das Becken liegen (wie wir ihn denn auch hier im Konzil ohne dies Becken auftreten sahen) und läuft querfeldein, "weil er der Kritiker selber ist".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: AT6.223.2
  kind: p
  original: 'Sankt Sancho nimmt hocherfreut den Mambrinshelm auf, und als Don Quijote bemerkt: er sehe einem Barbierbecken vollkommen ähnlich, antwortet Sancho:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: AT6.224.1
  kind: p
  original: '"Ohne Zweifel ist dieses famose Stück des verzauberten, ''spukhaft'' gewordenen Helmes in die Hand eines Menschen gefallen, der seinen Wert nicht zu schätzen wußte, die eine Hälfte einschmolz und die andre so zurechtgehämmert, daß sie, wie du sagst, ein Barbierbecken zu sein scheint; er möge übrigens für profane Augen aussehen, wie er wolle, für Mich, der Ich seinen Wert kenne, ist das einerlei."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: AT6.225.1
  kind: p
  original: '"Die zweite Herrlichkeit, das zweite Eigentum ist nun erworben!"'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: AT6.226.1
  kind: p
  original: Jetzt, nachdem er "den Menschen", seinen Helm, erworben hat, stellt er sich ihm gegenüber, verhält sich zu ihm wie zu seinem "unversöhnlichsten Feind" und erklärt ihm rundheraus (warum, werden wir später sehen), daß Er (Sankt Sancho) nicht "der Mensch", sondern "der Unmensch, das Unmenschliche" sei.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: AT6.226.2
  kind: p
  original: Als dieses "Unmenschliche" zieht er nun auf die Sierra Morena, um sich durch Büßungen auf die Herrlichkeit des Neuen Bundes vorzubereiten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 220-221
- id: AT6.226.3
  kind: p
  original: 'Dort zieht er sich "splitternackt" aus (p. 184), um seine Eigenheit zu erlangen und um Das zu übertreffen, was sein Vorläufer bei Cervantes am fünfundzwanzigsten tut: "Und sich mit aller Eile der Hosen entkleidend, blieb er halbnackt im Hemde und machte, ohne sich zu besinnen, zwei Bocksprünge in der Luft, den Kopf nach unten, die Beine nach oben, Dinge enthüllend, die seinen getreuen Schildknappen veranlaßten, Rozinante herumzuwerfen, um sie nicht zu sehen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '221'
- id: AT6.226.4
  kind: p
  original: '- "Das Unmenschliche" übertrifft sein profanes Vorbild bei weitem.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '221'
- id: AT6.226.5
  kind: p
  original: Es " kehrt entschloßnen Mutes sich selbst den Rücken und wendet sich dadurch auch von dem beunruhigenden Kritiker ab" und "läßt ihn stehen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '221'
- id: AT6.226.6
  kind: p
  original: '"Das Unmenschliche" läßt sich dann mit der "stehengelassenen" Kritik in eine Disputation ein, es "verachtet sich selbst", es "denkt sich im Vergleich zu einem Andern", es "befiehlt Gott", es "sucht sein besseres Selbst außer sich", es tut Buße dafür, daß es noch nicht einzig war, es erklärt sich für das Einzige, "das Egoistische und das Einzige " - obwohl es dies kaum noch zu erklären brauchte, nachdem es sich selbst entschloßnen Muts den Rücken gekehrt hat.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '221'
- id: AT6.226.7
  kind: p
  original: Alles dies hat "das Unmenschliche" aus sich selbst vollbracht (siehe Pfister, "Geschichte der Teutschen"), und nun reitet Es auf seinem Grauen geläutert und triumphierend in das Reich des Einzigen ein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '221'
- id: AT6.227.1
  kind: signature
  original: Ende des Alten Testaments.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '221'
- id: AT6.N1.1.1
  kind: note
  original: In den Deutsch.Franz[ösischen] Jahrb[üchern]" geschah dies, dem Zusammenhange gemäß, nur in Beziehung auf die Menschenrechte der französischen Revolution.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: AT6.N1.1.2
  kind: note
  original: Man kann übrigens diese ganze Auffassung der Konkurrenz als "der Menschenrechte" schon Ein Jahrhundert früher bei den Repräsentanten der Bourgeoisie nachweisen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: AT6.N1.1.3
  kind: note
  original: (John Hamp[den], Petty, Boisguillebert, Child pp.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: AT6.N1.1.4
  kind: note
  original: Über das Verhält[nis] der theoretischen Liberalen zu den Bourgeois vergleiche [oben] über das Verhältnis der Ideologen einer Klasse zu dieser Klasse selbst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: AT6.N2.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] womit für ihn alle Kritik "ihr letztes Absehen erreicht" und alle Kühe grau werden, womit er zugleich seine Unwissenheit über die wirkliche Grundlage und den wirklichen Inhalt der Bourgeoisieherrschaft gesteht.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: AT6.N3.1.1
  kind: note
  original: '[Durchgestrichene Fußnote:] Proudhon, den das kommunistische Arbeiterjournal "La Fraternité"'' bereits 1841 wegen des gleichen Arbeitslohns, des Arbeitertums überhaupt und der sonstigen ökonomischen Befangenheiten, die sich bei diesem ausgezeichneten Schriftsteller vorfanden, scharf kritisierte, und von dem die Kommunisten Nichts akzeptiert haben als seine Kritik des Eigentums.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: AT6.N4.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Wer außer Stirner ist imstande, den unmoralischen revolutionären Proletariern dergleichen moralische Albernheiten in den Mund zu legen? - den Proletariern die, wie man in der ganzen zivilisierten Welt weiß (wozu Berlin, das bloß jebildet ist, freilich nicht gehört), die verruchte Absicht haben, ihren "Genuß" nicht "redlich zu erarbeiten", sondern zu erobern!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: AT6.N5.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Und schließ[lich] stellt er an die Kommunisten [die] moralische Zumutung, sie sollen sich von den Rentiers, Kaufleuten, Industriellen etc. in alle Ewigkeit ruhig exploitieren lassen, weil sie diese Exploitation nicht aufheben können, ohne zugleich das "Wohlsein" dieser Herren zu vernichten!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: AT6.N5.1.2
  kind: note
  original: Jacques le bonhomme, der sich hier zum Champion der gros-bourgeois aufwirft, kann sich die Mühe ersparen, den Kommunisten Sittenpredigten zu halten, die sie täglich von seinen "guten Bürgern" viel besser hören können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: AT6.N6.1.1
  kind: note
  original: '[Im Manuskript gestrichen:]... und gerade darum machen sie sich kein Gewissen daraus, weil ihnen das "Wohl Aller" als "leibhaftiger Individuen" über das "Wohlsein" der bisherigen gesellschaftlichen Klassen geht.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: AT6.N6.1.2
  kind: note
  original: Das "Wohlsein", das der Rentier als Rentier genießt, ist nicht das "Wohlsein" des Individuums als solchen, sondern das des Rentiers, kein individuelles, sondern ein innerhalb der Klasse allgemeines Wohlsein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: AT6.N7.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Sankt Max schreibt sich hier wieder die Weisheit des Zugreifens und Zuschlagens zu, als ob nicht seine ganze Pauke des sich empörenden Proletariats eine verunglückte Travestie Weitlings und seines stehlenden Proletariats sei - Weitlings, eines der wenigen Kommunisten, die er durch die Gnade Bluntschlis kennt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: AT6.N8.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] In Frankreich machen sämtliche Kommunisten den Saint-Simonisten und Fourieristen den Vorwurf der Friedlichkeit und unterscheiden sich hauptsächlich durch ihr Aufgeben aller "gütlichen Lösung" von diesen, wie in England sich die Chartisten hauptsächlich durch dasselbe Kriterium von den Sozialisten unterscheiden.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: AT6.N9.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Das wirkliche Privateigentum ist gerade das Allerallgemeinste, was mit der Individualität gar nichts zu tun hat, ja was sie geradezu umstößt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: AT6.N9.1.2
  kind: note
  original: Soweit ich als Privateigentümer gelte, soweit gelte ich nicht als Individuum - ein Satz, den die Geldheiraten täglich beweisen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
