verses:
- id: P1846.0.1
  kind: heading
  original: Vorrede
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: P1846.1.1
  kind: p
  original: Die Menschen haben sich bisher stets falsche Vorstellungen über sich selbst gemacht, von dem, was sie sind oder sein sollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: P1846.1.2
  kind: p
  original: Nach ihren Vorstellungen von Gott, von dem Normalmenschen usw. haben sie ihre Verhältnisse eingerichtet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: P1846.1.3
  kind: p
  original: Die Ausgeburten ihres Kopfes sind ihnen über den Kopf gewachsen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: P1846.1.4
  kind: p
  original: Vor ihren Geschöpfen haben sie, die Schöpfer, sich gebeugt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: P1846.1.5
  kind: p
  original: Befreien wir sie von den Hirngespinsten, den Ideen, den Dogmen, den eingebildeten Wesen, unter deren Joch sie verkümmern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: P1846.1.6
  kind: p
  original: Rebellieren wir gegen diese Herrschaft der Gedanken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: P1846.1.7
  kind: p
  original: Lehren wir sie, diese Einbildungen mit Gedanken vertauschen, die dem Wesen des Menschen entsprechen, sagt der Eine, sich kritisch zu ihnen verhalten, sagt der Andere, sie sich aus dem Kopf schlagen, sagt der Dritte, und - die bestehende Wirklichkeit wird zusammenbrechen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: P1846.2.1
  kind: p
  original: Diese unschuldigen und kindlichen Phantasien bilden den Kern der neuern junghegelschen Philosophie, die in Deutschland nicht nur von dem Publikum mit Entsetzen und Ehrfurcht empfangen, sondern auch von den philosophischen Heroen selbst mit dem feierlichen Bewußtsein der weltumstürzenden Gefährlichkeit und der verbrecherischen Rücksichtslosigkeit ausgegeben wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: P1846.2.2
  kind: p
  original: Der erste Band dieser Publikation hat den Zweck, diese Schafe, die sich für Wölfe halten und dafür gehalten werden, zu entlarven, zu zeigen, wie sie die Vorstellungen der deutschen Bürger nur philosophisch nachblöken, wie die Prahlereien dieser philosophischen Ausleger nur die Erbärmlichkeit der wirklichen deutschen Zustände widerspiegeln.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: P1846.2.3
  kind: p
  original: Sie hat den Zweck, den philosophischen Kampf mit den Schatten der Wirklichkeit, der dem träumerischen und duseligen deutschen Volk zusagt, zu blamieren und um den Kredit zu bringen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: P1846.3.1
  kind: p
  original: Ein wackrer Mann bildete sich einmal ein, die Menschen ertränken nur im Wasser, weil sie vom Gedanken der Schwere besessen wären.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: P1846.3.2
  kind: p
  original: Schlügen sie sich diese Vorstellung aus dem Kopfe, etwa indem sie dieselbe für eine abergläubige, für eine religiöse Vorstellung erklärten, so seien sie über alle Wassersgefahr erhaben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 13-14
- id: P1846.3.3
  kind: p
  original: Sein Leben lang bekämpfte er die Illusion der Schwere, von deren schädlichen Folgen jede Statistik ihm neue und zahlreiche Beweise lieferte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '14'
- id: P1846.3.4
  kind: p
  original: Der wackre Mann war der Typus der neuen deutschen revolutionären Philosophen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - P1846.N1
  mew_page: '14'
- id: P1846.N1.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Der deutsche Idealismus sondert sich durch keinen spezifischen Unterschied von der Ideologie aller andern Völker ab.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: P1846.N1.1.2
  kind: note
  original: Auch diese betrachtet die Welt als durch Ideen beherrscht, die Ideen u[nd] Begriffe als bestimmende Prinzipien, bestimmte Gedanken als das den Philosophen zugängliche Mysterium der materiellen Welt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: P1846.N1.2.1
  kind: note
  original: Hegel hatte den positiven Idealismus vollendet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: P1846.N1.2.2
  kind: note
  original: Nicht nur hatte sich ihm d[ie] ganze materielle Welt in eine Gedankenwelt u[nd] d[ie] ganze Geschichte in eine Geschichte von Gedanken verwandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: P1846.N1.2.3
  kind: note
  original: Er begnügt sich nicht, die Gedankendinge einzuregistrieren, er sucht auch den Produktionsakt darzustellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: P1846.N1.3.1
  kind: note
  original: Die deutschen Philosophen, aus ihrer Traumwelt aufgerüttelt, protestieren gegen d[ie] Gedankenwelt, der sie die Vorstellung der wirklichen, leib[haftigen...]
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: P1846.N1.4.1
  kind: note
  original: Die deutschen philosophischen Kritiker behaupten sämtlich, daß Ideen, Vorstellungen, Begriffe bisher d[ie] wirklichen Menschen beherrscht u[nd] bestimmt haben, daß d[ie] wirkliche Welt ein Produkt d[er] ideellen Welt ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: P1846.N1.4.2
  kind: note
  original: Das findet bis auf diesen Augenblick statt, das soll aber anders werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: P1846.N1.4.3
  kind: note
  original: Sie unterscheiden sich in der Art, wie sie die nach ihrer Ansicht so unter d[er] Macht ihrer eignen fixen Gedanken seufzende Menschenwelt erlösen wollen; sie unterscheiden sich in dem, was sie für fixe Gedanken erklären; sie stimmen überein in d[em] Glauben dieser Gedankenherrschaft, sie stimmen überein in dem Glauben, daß ihr kritischer Denkakt d[en] Untergang d[es] Bestehenden herbeiführen müsse, sei es nun, daß sie ihre isolierte Denktätigkeit für zureichender halten od[er] das allgemeine Bewußtsein erobern wollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: P1846.N1.5.1
  kind: note
  original: Der Glaube, daß die reelle Welt d[as} Produkt der ideellen Welt sei, daß die Welt der Ideen [...]
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: P1846.N1.6.1
  kind: note
  original: An ihrer Hegelschen Gedankenwelt irre geworden, protestieren d[ie] deutschen Philosophen gegen d[ie] Herrschaft d[er] Gedanken, Ideen, Vorstellungen, die bisher nach ihrer Ansicht, d.h. nach der Illusion Hegels, die wirkliche Welt produzierten, bestimmten, beherrschten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: P1846.N1.6.2
  kind: note
  original: Sie legen Protest ein u[nd] verenden [...]
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: P1846.N1.7.1
  kind: note
  original: Nach dem Hegelschen System hatten Ideen, Gedanken, Begriffe das wirkliche Leben d[er] Menschen, ihre materielle Welt, ihre reellen Verhältnisse produziert, bestimmt, beherrscht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: P1846.N1.7.2
  kind: note
  original: Seine rebellischen Schüler nehmen dies von ihm [...]
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
