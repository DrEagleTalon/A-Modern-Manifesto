  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '17'
- id: I.1.1
  kind: p
  original: Wie deutsche Ideologen melden, hat Deutschland in den letzten Jahren eine Umwälzung ohnegleichen durchgemacht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '17'
- id: I.1.2
  kind: p
  original: Der Verwesungsprozeß des Hegelschen Systems, der mit Strauß begann, hat sich zu einer Weltgärung entwickelt, in welche alle "Mächte der Vergangenheit" hineingerissen sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '17'
- id: I.1.3
  kind: p
  original: In dem allgemeinen Chaos haben sich gewaltige Reiche gebildet, um alsbald wieder unterzugehen, sind Heroen momentan aufgetaucht, um von kühneren und mächtigeren Nebenbuhlern wieder in die Finsternis zurückgeschleudert zu werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '17'
- id: I.1.4
  kind: p
  original: Es war eine Revolution, wogegen die französische ein Kinderspiel ist, ein Weltkampf, vor dem die Kämpfe der Diadochen kleinlich erscheinen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '17'
- id: I.1.5
  kind: p
  original: Die Prinzipien verdrängten, die Gedankenhelden überstürzten einander mit unerhörter Hast, und in den drei Jahren 1842-[18]45 wurde in Deutschland mehr aufgeräumt als sonst in drei Jahrhunderten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '17'
- id: I.2.1
  kind: p
  original: Alles dies soll sich im reinen Gedanken zugetragen haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '17'
- id: I.2.2
  kind: p
  original: 'Es handelt sich allerdings um ein interessantes Ereignis: um den Verfaulungsprozeß des absoluten Geistes.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '17'
- id: I.2.3
  kind: p
  original: 'Nach Erlöschen des letzten Lebensfunkens traten die verschiedenen Bestandteile dieses caput mortuum<wörtlich: toter Kopf, in der Chemie gebräuchliche Ausdruck für einen Destillationsrückstand, hier: Rückstände, Überreste> in Dekomposition, gingen neue Verbindungen ein und bildeten neue Substanzen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '17'
- id: I.2.4
  kind: p
  original: Die philosophischen Industriellen, die bisher von der Exploitation des absoluten Geistes gelebt hatten, warfen sich jetzt auf die neuen Verbindungen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '17'
- id: I.2.5
  kind: p
  original: Jeder betrieb den Verschleiß des ihm zugefallenen Anteils mit möglichster Emsigkeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '17'
- id: I.2.6
  kind: p
  original: Es konnte dies nicht abgehen ohne Konkurrenz.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '17'
- id: I.2.7
  kind: p
  original: Sie wurde anfangs ziemlich bürgerlich und solide geführt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '17'
- id: I.2.8
  kind: p
  original: Später, als der deutsche Markt überführt war und die Ware trotz aller Mühe auf dem Weltmarkt keinen Anklang fand, wurde das Geschäft nach gewöhnlicher deutscher Manier verdorben durch fabrikmäßige und Scheinproduktion, Verschlechterung der Qualität, Sophistikation des Rohstoffs, Verfälschung der Etiketten, Scheinkäufe, Wechselreiterei und ein aller reellen Grundlage entbehrendes Kreditsystem.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 17-18
- id: I.2.9
  kind: p
  original: Die Konkurrenz lief in einen erbitterten Kampf aus, der uns jetzt als welthistorischer Umschwung, als Erzeuger der gewaltigsten Resultate und Errungenschaften angepriesen und konstruiert wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '18'
- id: I.3.1
  kind: p
  original: Um diese philosophische Marktschreierei, die selbst in der Brust des ehrsamen deutschen Bürgers ein wohltätiges Nationalgefühl erweckt, richtig zu würdigen, um die Kleinlichkeit, die lokale Borniertheit dieser ganzen junghegelschen Bewegung, um namentlich den tragikomischen Kontrast zwischen den wirklichen Leistungen dieser Helden und den Illusionen über diese Leistungen anschaulich zu machen, ist es nötig, sich den ganzen Spektakel einmal von einem Standpunkte anzusehen, der außerhalb Deutschland liegt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N1
  mew_page: '18'
- id: I.4.1
  kind: heading
  original: A. Die Ideologie überhaupt, namentlich die deutsche
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '18'
- id: I.5.1
  kind: p
  original: Die deutsche Kritik hat bis auf ihre neuesten Efforts den Boden der Philosophie nicht verlassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '18'
- id: I.5.2
  kind: p
  original: Weit davon entfernt, ihre allgemein-philosophischen Voraussetzungen zu untersuchen, sind ihre sämtlichen Fragen sogar auf dem Boden eines bestimmten philosophischen Systems, des Hegelschen, gewachsen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 18-19
- id: I.5.3
  kind: p
  original: Nicht nur in ihren Antworten, schon in den Fragen selbst lag eine Mystifikation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '19'
- id: I.5.4
  kind: p
  original: Diese Abhängigkeit von Hegel ist der Grund, warum keiner dieser neueren Kritiker eine umfassende Kritik des Hegelschen Systems auch nur versuchte, sosehr Jeder von ihnen behauptet, über Hegel hinaus zu sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '19'
- id: I.5.5
  kind: p
  original: Ihre Polemik gegen Hegel und gegeneinander beschränkt sich darauf, daß Jeder eine Seite des Hegelschen Systems herausnimmt und diese sowohl gegen das ganze System wie gegen die von den Andern herausgenommenen Seiten wendet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '19'
- id: I.5.6
  kind: p
  original: Im Anfange nahm man reine, unverfälschte Hegelsche Kategorien heraus, wie Substanz und Selbstbewußtsein, später profanierte man diese Kategorien durch weltlichere Namen, wie Gattung, der Einzige, der Mensch etc.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '19'
- id: I.6.1
  kind: p
  original: Die gesamte deutsche philosophische Kritik von Strauß bis Stirner beschränkt sich auf Kritik der religiösen Vorstellungen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N2
  mew_page: '19'
- id: I.6.2
  kind: p
  original: Man ging aus von der wirklichen Religion und eigentlichen Theologie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '19'
- id: I.6.3
  kind: p
  original: Was religiöses Bewußtsein, religiöse Vorstellung sei, wurde im weiteren Verlauf verschieden bestimmt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '19'
- id: I.6.4
  kind: p
  original: Der Fortschritt bestand darin, die angeblich herrschenden metaphysischen, politischen, rechtlichen, moralischen und andern Vorstellungen auch unter die Sphäre der religiösen oder theologischen Vorstellungen zu subsumieren; ebenso das politische, rechtliche, moralische Bewußtsein für religiöses oder theologisches Bewußtsein, und den politischen, rechtlichen, moralischen Menschen, in letzter Instanz " den Menschen", für religiös zu erklären.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '19'
- id: I.6.5
  kind: p
  original: Die Herrschaft der Religion wurde vorausgesetzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '19'
- id: I.6.6
  kind: p
  original: Nach und nach wurde jedes herrschende Verhältnis für ein Verhältnis der Religion erklärt und in Kultus verwandelt, Kultus des Rechts, Kultus des Staats pp. Überall hatte man es nur mit Dogmen und dem Glauben an Dogmen zu tun.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '19'
- id: I.6.7
  kind: p
  original: Die Welt wurde in immer größerer Ausdehnung kanonisiert, bis endlich der ehrwürdige Sankt Max sie en bloc heiligsprechen und damit ein für allemal abfertigen konnte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '19'
- id: I.7.1
  kind: p
  original: Die Althegelianer hatten Alles begriffen, sobald es auf eine Hegelsche logische Kategorie zurückgeführt war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '19'
- id: I.7.2
  kind: p
  original: Die Junghegelianer kritisierten Alles, indem sie ihm religiöse Vorstellungen unterschoben oder es für theologisch erklärten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '19'
- id: I.7.3
  kind: p
  original: Die Junghegelianer stimmen mit den Althegelianern überein in dem Glauben an die Herrschaft der Religion, der Begriffe, des Allgemeinen in der bestehenden Welt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '19'
- id: I.7.4
  kind: p
  original: Nur bekämpfen die Einen die Herrschaft als Usurpation, welche die Andern als legitim feiern,
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '19'
- id: I.8.1
  kind: p
  original: Da bei diesen Junghegelianern die Vorstellungen, Gedanken, Begriffe, überhaupt die Produkte des von ihnen verselbständigten Bewußtseins für die eigentlichen Fesseln der Menschen gelten, gerade wie sie bei den Althegelianern für die wahren Bande der menschlichen Gesellschaft erklärt werden, so versteht es sich, daß die Junghegelianer auch nur gegen diese Illusionen des Bewußtseins zu kämpfen haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 19-20
- id: I.8.2
  kind: p
  original: Da nach ihrer Phantasie die Verhältnisse der Menschen, ihr ganzes Tun und Treiben, ihre Fesseln und Schranken Produkte ihres Bewußtseins sind, so stellen die Junghegelianer konsequenterweise das moralische Postulat an sie, ihr gegenwärtiges Bewußtsein mit dem menschlichen, kritischen oder egoistischen Bewußtsein zu vertauschen und dadurch ihre Schranken zu beseitigen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '20'
- id: I.8.3
  kind: p
  original: Diese Forderung, das Bewußtsein zu verändern, läuft auf die Forderung hinaus, das Bestehende anders zu interpretieren, d.h. es vermittelst einer andren Interpretation anzuerkennen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '20'
- id: I.8.4
  kind: p
  original: Die junghegelschen Ideologen sind trotz ihrer angeblich "welterschütternden" Phrasen die größten Konservativen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '20'
- id: I.8.5
  kind: p
  original: Die jüngsten von ihnen haben den richtigen Ausdruck für ihre Tätigkeit gefunden, wenn sie behaupten, nur gegen "Phrasen" zu kämpfen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '20'
- id: I.8.6
  kind: p
  original: Sie vergessen nur, daß sie diesen Phrasen selbst nichts als Phrasen entgegensetzen, und daß sie die wirkliche bestehende Welt keineswegs bekämpfen, wenn sie nur die Phrasen dieser Welt bekämpfen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '20'
- id: I.8.7
  kind: p
  original: Die einzigen Resultate, wozu diese philosophische Kritik es bringen konnte, waren einige und noch dazu einseitige religionsgeschichtliche Aufklärungen über das Christentum; ihre sämtlichen sonstigen Behauptungen sind nur weitere Ausschmückungen ihres Anspruchs, mit diesen unbedeutenden Aufklärungen welthistorische Entdeckungen geliefert zu haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '20'
- id: I.9.1
  kind: p
  original: Keinem von diesen Philosophen ist es eingefallen, nach dem Zusammenhange der deutschen Philosophie mit der deutschen Wirklichkeit, nach dem Zusammenhange ihrer Kritik mit ihrer eignen materiellen Umgebung zu fragen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '20'
- id: I.10.1
  kind: p
  original: Die Voraussetzungen, mit denen wir beginnen, sind keine willkürlichen, keine Dogmen, es sind wirkliche Voraussetzungen, von denen man nur in der Einbildung abstrahieren kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '20'
- id: I.10.2
  kind: p
  original: Es sind die wirklichen Individuen, ihre Aktion und ihre materiellen Lebensbedingungen, sowohl die vorgefundenen wie die durch ihre eigne Aktion erzeugten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '20'
- id: I.10.3
  kind: p
  original: Diese Voraussetzungen sind also auf rein empirischem Wege konstatierbar.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '20'
- id: I.11.1
  kind: p
  original: Die erste Voraussetzung aller Menschengeschichte ist natürlich die Existenz lebendiger menschlicher Individuen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N3
  mew_page: '20'
- id: I.11.2
  kind: p
  original: Der erste zu konstatierende Tatbestand ist also die körperliche Organisation dieser Individuen und ihr dadurch gegebenes Verhältnis zur übrigen Natur.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 20-21
- id: I.11.3
  kind: p
  original: Wir können hier natürlich weder auf die physische Beschaffenheit der Menschen selbst noch auf die von den Menschen vorgefundenen Naturbedingungen, die geologischen, orohydrographischen, klimatischen und andern Verhältnisse, eingehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N4
  mew_page: '21'
- id: I.11.4
  kind: p
  original: Alle Geschichtschreibung muß von diesen natürlichen Grundlagen und ihrer Modifikation im Lauf der Geschichte durch die Aktion der Menschen ausgehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '21'
- id: I.12.1
  kind: p
  original: Man kann die Menschen durch das Bewußtsein, durch die Religion, durch was man sonst will, von den Tieren unterscheiden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '21'
- id: I.12.2
  kind: p
  original: Sie selbst fangen an, sich von den Tieren zu unterscheiden, sobald sie anfangen, ihre Lebensmittel zu produzieren, ein Schritt, der durch ihre körperliche Organisation bedingt ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '21'
- id: I.12.3
  kind: p
  original: Indem die Menschen ihre Lebensmittel produzieren, produzieren sie indirekt ihr materielles Leben selbst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '21'
- id: I.13.1
  kind: p
  original: Die Weise, in der die Menschen ihre Lebensmittel produzieren, hängt zunächst von der Beschaffenheit der vorgefundenen und zu reproduzierenden Lebensmittel selbst ab.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '21'
- id: I.13.2
  kind: p
  original: Diese Weise der Produktion ist nicht bloß nach der Seite hin zu betrachten, daß sie die Reproduktion der physischen Existenz der Individuen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '21'
- id: I.13.3
  kind: p
  original: Sie ist vielmehr schon eine bestimmte Art der Tätigkeit dieser Individuen, eine bestimmte Art, ihr Leben zu äußern, eine bestimmte Lebensweise derselben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '21'
- id: I.13.4
  kind: p
  original: Wie die Individuen ihr Leben äußern, so sind sie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '21'
- id: I.13.5
  kind: p
  original: Was sie sind, fällt also zusammen mit ihrer Produktion, sowohl damit, was sie produzieren, als auch damit, wie sie produzieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '21'
- id: I.13.6
  kind: p
  original: Was die Individuen also sind, das hängt ab von den materiellen Bedingungen ihrer Produktion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '21'
- id: I.14.1
  kind: p
  original: Diese Produktion tritt erst ein mit der Vermehrung der Bevölkerung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '21'
- id: I.14.2
  kind: p
  original: Sie setzt selbst wieder einen Verkehr der Individuen untereinander voraus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '21'
- id: I.14.3
  kind: p
  original: Die Form dieses Verkehrs ist wieder durch die Produktion bedingt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '21'
- id: I.15.1
  kind: p
  original: Die Beziehungen verschiedener Nationen untereinander hängen davon ab, wie weit jede von ihnen ihre Produktivkräfte, die Teilung der Arbeit und den innern Verkehr entwickelt hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '21'
- id: I.15.2
  kind: p
  original: Dieser Satz ist allgemein anerkannt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '21'
- id: I.15.3
  kind: p
  original: Aber nicht nur die Beziehung einer Nation zu anderen, sondern auch die ganze innere Gliederung dieser Nation selbst hängt von der Entwicklungsstufe ihrer Produktion und ihres innern und äußern Verkehrs ab.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '21'
- id: I.15.4
  kind: p
  original: Wie weit die Produktionskräfte einer Nation entwickelt sind, zeigt am augenscheinlichsten der Grad, bis zu dem die Teilung der Arbeit entwickelt ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 21-22
- id: I.15.5
  kind: p
  original: Jede neue Produktivkraft, sofern sie nicht eine bloß quantitative Ausdehnung der bisher schon bekannten Produktivkräfte ist (z.B. Urbarmachung von Ländereien), hat eine neue Ausbildung der Teilung der Arbeit zur Folge.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '22'
- id: I.16.1
  kind: p
  original: Die Teilung der Arbeit innerhalb einer Nation führt zunächst die Trennung der industriellen und kommerziellen von der ackerbauenden Arbeit und damit die Trennung von Stadt und Land und den Gegensatz der Interessen Beider herbei.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '22'
- id: I.16.2
  kind: p
  original: Ihre weitere Entwicklung führt zur Trennung der kommerziellen Arbeit von der industriellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '22'
- id: I.16.3
  kind: p
  original: Zu gleicher Zeit entwickeln sich durch die Teilung der Arbeit innerhalb dieser verschiednen Branchen wieder verschiedene Abteilungen unter den zu bestimmten Arbeiten zusammenwirkenden Individuen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '22'
- id: I.16.4
  kind: p
  original: Die Stellung dieser einzelnen Abteilungen gegeneinander ist bedingt durch die Betriebsweise der ackerbauenden, industriellen und kommerziellen Arbeit (Patriarchalismus, Sklaverei, Stände, Klassen).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '22'
- id: I.16.5
  kind: p
  original: Dieselben Verhältnisse zeigen sich bei entwickelterem Verkehr in den Beziehungen verschiedner Nationen zueinander.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '22'
- id: I.16.6
  kind: p
  original: Die verschiedenen Entwicklungsstufen der Teilung der Arbeit sind ebensoviel verschiedene Formen des Eigentums; d.h., die jedesmalige Stufe der Teilung der Arbeit bestimmt auch die Verhältnisse der Individuen zueinander in Beziehung auf das Material, Instrument und Produkt der Arbeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '22'
- id: I.17.1
  kind: p
  original: Die erste Form des Eigentums ist das Stammeigentum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '22'
- id: I.17.2
  kind: p
  original: Es entspricht der unentwickelten Stufe der Produktion, auf der ein Volk von Jagd und Fischfang, von Viehzucht oder höchstens vom Ackerbau sich nährt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '22'
- id: I.17.3
  kind: p
  original: Es setzt in diesem letzteren Falle eine große Masse unbebauter Ländereien voraus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '22'
- id: I.17.4
  kind: p
  original: Die Teilung der Arbeit ist auf dieser Stufe noch sehr wenig entwickelt und beschränkt sich auf eine weitere Ausdehnung der in der Familie gegebenen naturwüchsigen Teilung der Arbeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '22'
- id: I.17.5
  kind: p
  original: 'Die gesellschaftliche Gliederung beschränkt sich daher auf eine Ausdehnung der Familie: patriarchalische Stammhäupter, unter ihnen die Stammitglieder, endlich Sklaven.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '22'
- id: I.17.6
  kind: p
  original: Die in der Familie latente Sklaverei entwickelt sich erst allmählich mit der Vermehrung der Bevölkerung und der Bedürfnisse und mit der Ausdehnung des äußern Verkehrs, sowohl des Kriegs wie des Tauschhandels.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '22'
- id: I.18.1
  kind: p
  original: Die zweite Form ist das antike Gemeinde- und Staatseigentum, das namentlich aus der Vereinigung mehrerer Stämme zu einer Stadt durch Vertrag oder Eroberung hervorgeht und bei dem die Sklaverei fortbestehen bleibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '22'
- id: I.18.2
  kind: p
  original: Neben dem Gemeindeeigentum entwickelt sich schon das mobile und später auch das immobile Privateigentum, aber als eine abnorme, dem Gemeindeeigentum untergeordnete Form.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '22'
- id: I.18.3
  kind: p
  original: Die Staatsbürger besitzen nur in ihrer Gemeinschaft die Macht über ihre arbeitenden Sklaven und sind schon deshalb an die Form des Gemeindeeigentums gebunden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 22-23
- id: I.18.4
  kind: p
  original: Es ist das gemeinschaftliche Privateigentum der aktiven Staatsbürger, die den Sklaven gegenüber gezwungen sind, in dieser naturwüchsigen Weise der Assoziation zu bleiben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '23'
- id: I.18.5
  kind: p
  original: Daher verfällt die ganze hierauf basierende Gliederung der Gesellschaft und mit ihr die Macht des Volks in demselben Grade, in dem namentlich das immobile Privateigentum sich entwickelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '23'
- id: I.18.6
  kind: p
  original: Die Teilung der Arbeit ist schon entwickelter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '23'
- id: I.18.7
  kind: p
  original: Wir finden schon den Gegensatz von Stadt und Land, später den Gegensatz zwischen Staaten, die das städtische und die das Landinteresse repräsentieren, und innerhalb der Städte selbst den Gegensatz zwischen Industrie und Seehandel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '23'
- id: I.18.8
  kind: p
  original: Das Klassenverhältnis zwischen Bürgern und Sklaven ist vollständig ausgebildet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '23'
- id: I.19.1
  kind: p
  original: Dieser ganzen Geschichtsauffassung scheint das Faktum der Eroberung zu widersprechen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '23'
- id: I.19.2
  kind: p
  original: Man hat bisher die Gewalt, den Krieg, Plünderung, Raubmord pp. zur treibenden Kraft der Geschichte gemacht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '23'
- id: I.19.3
  kind: p
  original: Wir können uns hier nur auf die Hauptpunkte beschränken und nehmen daher nur das frappanteste Beispiel, die Zerstörung einer alten Zivilisation durch ein barbarisches Volk und die sich daran anknüpfende, von vorn anfangende Bildung einer neuen Gliederung der Gesellschaft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '23'
- id: I.19.4
  kind: p
  original: (Rom und Barbaren, Feudalität und Gallien, oströmisches Reich und Türken.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '23'
- id: I.19.5
  kind: p
  original: Bei dem erobernden Barbarenvolke ist der Krieg selbst noch, wie schon oben angedeutet, eine regelmäßige Verkehrsform, die um so eifriger exploitiert wird, je mehr der Zuwachs der Bevölkerung bei der hergebrachten und für sie einzig möglichen rohen Produktionsweise das Bedürfnis neuer Produktionsmittel schafft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '23'
- id: I.19.6
  kind: p
  original: In Italien dagegen war durch die Konzentration des Grundeigentums (verursacht außer durch Aufkauf und Verschuldung auch noch durch Erbschaft, indem bei der großen Liederlichkeit und den seltnen Heiraten die alten Geschlechter allmählich ausstarben und ihr Besitz Wenigen zufiel) und Verwandlung desselben in Viehweiden (die außer durch die gewöhnlichen, noch heute gültigen ökonomischen Ursachen durch die Einfuhr geraubten und Tributgetreides und den hieraus folgenden Mangel an Konsumenten für italisches Korn verursacht wurde) die freie Bevölkerung fast verschwunden, die Sklaven selbst starben immer wieder aus und mußten stets durch neue ersetzt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '23'
- id: I.19.7
  kind: p
  original: Die Sklaverei blieb die Basis der gesamten Produktion.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '23'
- id: I.19.8
  kind: p
  original: Die Plebejer, zwischen Freien und Sklaven stehend, brachten es nie über ein Lumpenproletariat hinaus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '23'
- id: I.19.9
  kind: p
  original: Überhaupt kam Rom nie über die Stadt hinaus und stand mit den Provinzen in einem fast nur politischen Zusammenhange, der natürlich auch wieder durch politische Ereignisse unterbrochen werden konnte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '23'
- id: I.20.1
  kind: p
  original: Mit der Entwicklung des Privateigentums treten hier zuerst dieselben Verhältnisse ein, die wir beim modernen Privateigentum, nur in ausgedehnterem Maßstabe, wiederfinden werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '24'
- id: I.20.2
  kind: p
  original: Einerseits die Konzentration des Privateigentums, die in Rom sehr früh anfing (Beweis das licinische Ackergesetz), seit den Bürgerkriegen und namentlich unter den Kaisern sehr rasch vor sich ging; andrerseits im Zusammenhange hiermit die Verwandlung der plebejischen kleinen Bauern in ein Proletariat, das aber bei seiner halben Stellung zwischen besitzenden Bürgern und Sklaven zu keiner selbständigen Entwicklung kam.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '24'
- id: I.21.1
  kind: p
  original: Die dritte Form ist das feudale oder ständische Eigentum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '24'
- id: I.21.2
  kind: p
  original: Wenn das Altertum von der Stadt und ihrem kleinen Gebiet ausging, so ging das Mittelalter vom Lande aus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '24'
- id: I.21.3
  kind: p
  original: Die vorgefundene dünne, über eine große Bodenfläche zersplitterte Bevölkerung, die durch die Eroberer keinen großen Zuwachs erhielt, bedingte diesen veränderten Ausgangspunkt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '24'
- id: I.21.4
  kind: p
  original: Im Gegensatz zu Griechenland und Rom beginnt die feudale Entwicklung daher auf einem viel ausgedehnteren, durch die römischen Eroberungen und die anfangs damit verknüpfte Ausbreitung der Agrikultur vorbereiteten Terrain.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '24'
- id: I.21.5
  kind: p
  original: Die letzten Jahrhunderte des verfallenden römischen Reichs und die Eroberung durch die Barbaren selbst zerstörten eine Masse von Produktivkräften; der Ackerbau war gesunken, die Industrie aus Mangel an Absatz verfallen, der Handel eingeschlafen oder gewaltsam unterbrochen, die ländliche und städtische Bevölkerung hatte abgenommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '24'
- id: I.21.6
  kind: p
  original: Diese vorgefundenen Verhältnisse und die dadurch bedingte Weise der Organisation der Eroberung entwickelten unter dem Einflusse der germanischen Heerverfassung das feudale Eigentum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '24'
- id: I.21.7
  kind: p
  original: Es beruht, wie das Stamm- und Gemeindeeigentum, wieder auf einem Gemeinwesen, dem aber nicht wie dem antiken die Sklaven, sondern die leibeignen kleinen Bauern als unmittelbar produzierende Klasse gegenüberstehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '24'
- id: I.21.8
  kind: p
  original: Zugleich mit der vollständigen Ausbildung des Feudalismus tritt noch der Gegensatz gegen die Städte hinzu.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '24'
- id: I.21.9
  kind: p
  original: Die hierarchische Gliederung des Grundbesitzes und die damit zusammenhängenden bewaffneten Gefolgschaften gaben dem Adel die Macht über die Leibeignen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '24'
- id: I.21.10
  kind: p
  original: Diese feudale Gliederung war ebensogut wie das antike Gemeindeeigentum eine Assoziation gegenüber der beherrschten produzierenden Klasse; nur war die Form der Assoziation und das Verhältnis zu den unmittelbaren Produzenten verschieden, weil verschiedene Produktionsbedingungen vorlagen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '24'
- id: I.22.1
  kind: p
  original: Dieser feudalen Gliederung des Grundbesitzes entsprach in den Städten das korporative Eigentum, die feudale Organisation des Handwerks.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '24'
- id: I.22.2
  kind: p
  original: Das Eigentum bestand hier hauptsächlich in der Arbeit jedes Einzelnen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '24'
- id: I.22.3
  kind: p
  original: Die Notwendigkeit der Assoziation gegen den assoziierten Raubadel, das Bedürfnis gemeinsamer Markthallen in einer Zeit, wo der Industrielle zugleich Kaufmann war, die wachsende Konkurrenz der den aufblühenden Städten zuströmenden entlaufnen Leibeignen, die feudale Gliederung des ganzen Landes führten die Zünfte herbei; die allmählich ersparten kleinen Kapitalien einzelner Handwerker und ihre stabile Zahl bei der wachsenden Bevölkerung entwickelten das Gesellen- und Lehrlingsverhältnis, das in den Städten eine ähnliche Hierarchie zustande brachte wie die auf dem Lande.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 24-25
- id: I.23.1
  kind: p
  original: Das Haupteigentum bestand während der Feudalepoche also in Grundeigentum mit daran geketteter Leibeignenarbeit einerseits und eigner Arbeit mit kleinem, die Arbeit von Gesellen beherrschendem Kapital andrerseits.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '25'
- id: I.23.2
  kind: p
  original: Die Gliederung von Beiden war durch die bornierten Produktionsverhältnisse - die geringe und rohe Bodenkultur und die handwerksmäßige Industrie - bedingt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '25'
- id: I.23.3
  kind: p
  original: Teilung der Arbeit fand in der Blüte des Feudalismus wenig statt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '25'
- id: I.23.4
  kind: p
  original: Jedes Land hatte den Gegensatz von Stadt und Land in sich; die Ständegliederung war allerdings sehr scharf ausgeprägt, aber außer der Scheidung von Fürsten, Adel, Geistlichkeit und Bauern auf dem Lande und Meistern, Gesellen, Lehrlingen und bald auch Taglöhnerpöbel in den Städten fand keine bedeutende Teilung statt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '25'
- id: I.23.5
  kind: p
  original: Im Ackerbau war sie durch die parzellierte Bebauung erschwert, neben der die Hausindustrie der Bauern selbst aufkam, in der Industrie war die Arbeit in den einzelnen Handwerken selbst gar nicht, unter ihnen sehr wenig geteilt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '25'
- id: I.23.6
  kind: p
  original: Die Teilung von Industrie und Handel wurde in älteren Städten vorgefunden, entwickelte sich in den neueren erst später, als die Städte unter sich in Beziehung traten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '25'
- id: I.24.1
  kind: p
  original: Die Zusammenfassung größerer Länder zu feudalen Königreichen war für den Grundadel wie für die Städte ein Bedürfnis.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '25'
- id: I.24.2
  kind: p
  original: Die Organisation der herrschenden Klasse, des Adels, hatte daher überall einen Monarchen an der Spitze.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '25'
- id: I.25.1
  kind: p
  original: 'Die Tatsache ist also die: bestimmte Individuen, die auf bestimmte Weise produktiv tätig sind, gehen diese bestimmten gesellschaftlichen und politischen Verhältnisse ein.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '25'
- id: I.25.2
  kind: p
  original: Die empirische Beobachtung muß in jedem einzelnen Fall den Zusammenhang der gesellschaftlichen und politischen Gliederung mit der Produktion empirisch und ohne alle Mystifikation und Spekulation aufweisen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '25'
- id: I.25.3
  kind: p
  original: Die gesellschaftliche Gliederung und der Staat gehen beständig aus dem Lebensprozeß bestimmter Individuen hervor; aber dieser Individuen, nicht wie sie in der eignen oder fremden Vorstellung erscheinen mögen, sondern wie sie wirklich sind, d.h. wie sie wirken, materiell produzieren, also wie sie unter bestimmten materiellen und von ihrer Willkür unabhängigen Schranken, Voraussetzungen und Bedingungen tätig sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N5
  mew_page: '25'
- id: I.26.1
  kind: p
  original: Die Produktion der Ideen, Vorstellungen, des Bewußtseins ist zunächst unmittelbar verflochten in die materielle Tätigkeit und den materiellen Verkehr der Menschen, Sprache des wirklichen Lebens.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: I.26.2
  kind: p
  original: Das Vorstellen, Denken, der geistige Verkehr der Menschen erscheinen hier noch als direkter Ausfluß ihres materiellen Verhaltens.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: I.26.3
  kind: p
  original: Von der geistigen Produktion, wie sie in der Sprache der Politik, der Gesetze, der Moral, der Religion, Metaphysik usw. eines Volkes sich darstellt, gilt dasselbe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: I.26.4
  kind: p
  original: Die Menschen sind die Produzenten ihrer Vorstellungen, Ideen pp., aber die wirklichen, wirkenden Menschen, wie sie bedingt sind durch eine bestimmte Entwicklung ihrer Produktivkräfte und des denselben entsprechenden Verkehrs bis zu seinen weitesten Formationen hinauf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: I.26.5
  kind: p
  original: Das Bewußtsein kann nie etwas Andres sein als das bewußte Sein, und das Sein der Menschen ist ihr wirklicher Lebensprozeß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: I.26.6
  kind: p
  original: Wenn in der ganzen Ideologie die Menschen und ihre Verhältnisse wie in einer Camera obscura auf den Kopf gestellt erscheinen, so geht dies Phänomen ebensosehr aus ihrem historischen Lebensprozeß hervor, wie die Umdrehung der Gegenstände auf der Netzhaut aus ihrem unmittelbar physischen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: I.27.1
  kind: p
  original: Ganz im Gegensatz zur deutschen Philosophie, welche vom Himmel auf die Erde herabsteigt, wird hier von der Erde zum Himmel gestiegen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: I.27.2
  kind: p
  original: D.h., es wird nicht ausgegangen von dem, was die Menschen sagen, sich einbilden, sich vorstellen, auch nicht von den gesagten, gedachten, eingebildeten, vorgestellten Menschen, um davon aus bei den leibhaftigen Menschen anzukommen; es wird von den wirklich tätigen Menschen ausgegangen und aus ihrem wirklichen Lebensprozeß auch die Entwicklung der ideologischen Reflexe und Echos dieses Lebensprozesses dargestellt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: I.27.3
  kind: p
  original: Auch die Nebelbildungen im Gehirn der Menschen sind notwendige Sublimate ihres materiellen, empirisch konstatierbaren und an materielle Voraussetzungen geknüpften Lebensprozesses.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: I.27.4
  kind: p
  original: Die Moral, Religion, Metaphysik und sonstige Ideologie und die ihnen entsprechenden Bewußtseinsformen behalten hiermit nicht länger den Schein der Selbständigkeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 26-27
- id: I.27.5
  kind: p
  original: Sie haben keine Geschichte, sie haben keine Entwicklung, sondern die ihre materielle Produktion und ihren materiellen Verkehr entwickelnden Menschen ändern mit dieser ihrer Wirklichkeit auch ihr Denken und die Produkte ihres Denkens.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.27.6
  kind: p
  original: Nicht das Bewußtsein bestimmt das Leben, sondern das Leben bestimmt das Bewußtsein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.27.7
  kind: p
  original: In der ersten Betrachtungsweise geht man von dem Bewußtsein als dem lebendigen Individuum aus, in der zweiten, dem wirklichen Leben entsprechenden, von den wirklichen lebendigen Individuen selbst und betrachtet das Bewußtsein nur als ihr Bewußtsein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.28.1
  kind: p
  original: Diese Betrachtungsweise ist nicht voraussetzungslos.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.28.2
  kind: p
  original: Sie geht von den wirklichen Voraussetzungen aus, sie verläßt sie keinen Augenblick.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.28.3
  kind: p
  original: Ihre Voraussetzungen sind die Menschen nicht in irgendeiner phantastischen Abgeschlossenheit und Fixierung, sondern in ihrem wirklichen, empirisch anschaulichen Entwicklungsprozeß unter bestimmten Bedingungen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.28.4
  kind: p
  original: Sobald dieser tätige Lebensprozeß dargestellt wird, hört die Geschichte auf, eine Sammlung toter Fakta zu sein, wie bei den selbst noch abstrakten Empirikern, oder eine eingebildete Aktion eingebildeter Subjekte, wie bei den Idealisten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.29.1
  kind: p
  original: Da, wo die Spekulation aufhört, beim wirklichen Leben, beginnt also die wirkliche, positive Wissenschaft, die Darstellung der praktischen Betätigung, des praktischen Entwicklungsprozesses der Menschen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.29.2
  kind: p
  original: Die Phrasen vom Bewußtsein hören auf, wirkliches Wissen muß an ihre Stelle treten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.29.3
  kind: p
  original: Die selbständige Philosophie verliert mit der Darstellung der Wirklichkeit ihr Existenzmedium.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.29.4
  kind: p
  original: An ihre Stelle kann höchstens eine Zusammenfassung der allgemeinsten Resultate treten, die sich aus der Betrachtung der historischen Entwicklung der Menschen abstrahieren lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.29.5
  kind: p
  original: Diese Abstraktionen haben für sich, getrennt von der wirklichen Geschichte, durchaus keinen Wert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.29.6
  kind: p
  original: Sie können nur dazu dienen, die Ordnung des geschichtlichen Materials zu erleichtern, die Reihenfolge seiner einzelnen Schichten anzudeuten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.29.7
  kind: p
  original: Sie geben aber keineswegs, wie die Philosophie, ein Rezept oder Schema, wonach die geschichtlichen Epochen zurechtgestutzt werden können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.29.8
  kind: p
  original: Die Schwierigkeit beginnt im Gegenteil erst da, wo man sich an die Betrachtung und Ordnung des Materials, sei es einer vergangnen Epoche oder der Gegenwart, an die wirkliche Darstellung gibt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.29.9
  kind: p
  original: Die Beseitigung dieser Schwierigkeiten ist durch Voraussetzungen bedingt, die keineswegs hier gegeben werden können, sondern die erst aus dem Studium des wirklichen Lebensprozesses und der Aktion der Individuen jeder Epoche sich ergeben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.29.10
  kind: p
  original: Wir nehmen hier einige dieser Abstraktionen heraus, die wir gegenüber der Ideologie gebrauchen, und werden sie an historischen Beispielen erläutern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.30.1
  kind: heading
  original: '[1.] Geschichte'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: I.31.1
  kind: p
  original: Wir müssen bei den voraussetzungslosen Deutschen damit anfangen, daß wir die erste Voraussetzung aller menschlichen Existenz, also auch aller Geschichte konstatieren, nämlich die Voraussetzung, daß die Menschen imstande sein müssen zu leben, um "Geschichte machen" zu können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N6
  mew_page: '28'
- id: I.31.2
  kind: p
  original: Zum Leben aber gehört vor Allem Essen und Trinken, Wohnung, Kleidung und noch einiges Andere.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '28'
- id: I.31.3
  kind: p
  original: Die erste geschichtliche Tat ist also die Erzeugung der Mittel zur Befriedigung dieser Bedürfnisse, die Produktion des materiellen Lebens selbst, und zwar ist dies eine geschichtliche Tat, eine Grundbedingung aller Geschichte, die noch heute, wie vor Jahrtausenden, täglich und stündlich erfüllt werden muß, um die Menschen nur am Leben zu erhalten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '28'
- id: I.31.4
  kind: p
  original: Selbst wenn die Sinnlichkeit, wie beim heiligen Bruno, auf einen Stock, auf das Minimum reduziert ist, setzt sie die Tätigkeit der Produktion dieses Stockes voraus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '28'
- id: I.31.5
  kind: p
  original: Das Erste also bei aller geschichtlichen Auffassung ist, daß man diese Grundtatsache in ihrer ganzen Bedeutung und ihrer ganzen Ausdehnung beobachtet und zu ihrem Rechte kommen läßt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '28'
- id: I.31.6
  kind: p
  original: Dies haben die Deutschen bekanntlich nie getan, daher nie eine irdische Basis für die Geschichte und folglich nie einen Historiker gehabt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '28'
- id: I.31.7
  kind: p
  original: Die Franzosen und Engländer, wenn sie auch den Zusammenhang dieser Tatsache mit der sogenannten Geschichte nur höchst einseitig auffaßten, namentlich solange sie in der politischen Ideologie befangen waren, so haben sie doch immerhin die ersten Versuche gemacht, der Geschichtschreibung eine materialistische Basis zu geben, indem sie zuerst Geschichten der bürgerlichen Gesellschaft, des Handels und der Industrie schrieben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '28'
- id: I.32.1
  kind: p
  original: Das Zweite ist, daß das befriedigte erste Bedürfnis selbst, die Aktion der Befriedigung und das schon erworbene Instrument der Befriedigung zu neuen Bedürfnissen führt - und diese Erzeugung neuer Bedürfnisse ist die erste geschichtliche Tat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '28'
- id: I.32.2
  kind: p
  original: Hieran zeigt sich sogleich, wes Geistes Kind die große historische Weisheit der Deutschen ist, die da, wo ihnen das positive Material ausgeht und wo weder theologischer noch politischer noch literarischer Unsinn verhandelt wird, gar keine Geschichte, sondern die "vorgeschichtliche Zeit" sich ereignen lassen, ohne uns indes darüber aufzuklären, wie man aus diesem Unsinn der "Vorgeschichte" in die eigentliche Geschichte kommt - obwohl auf der andern Seite ihre historische Spekulation sich ganz besonders auf diese "Vorgeschichte" wirft, weil sie da sicher zu sein glaubt vor den Eingriffen des "rohen Faktums" und zugleich, weil sie hier ihrem spekulierenden Triebe alle Zügel schießen lassen und Hypothesen zu Tausenden erzeugen und umstoßen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 28-29
- id: I.33.1
  kind: p
  original: Das dritte Verhältnis, was hier gleich von vornherein in die geschichtliche Entwicklung eintritt, ist das, daß die Menschen, die ihr eignes Leben täglich neu machen, anfangen, andre Menschen zu machen, sich fortzupflanzen das Verhältnis zwischen Mann und Weib, Eltern und Kindern, die Familie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '29'
- id: I.33.2
  kind: p
  original: Diese Familie, die im Anfange das einzige soziale Verhältnis ist, wird späterhin, wo die vermehrten Bedürfnisse neue gesellschaftliche Verhältnisse, und die vermehrte Menschenzahl neue Bedürfnisse erzeugen, zu einem untergeordneten (ausgenommen in Deutschland) und muß alsdann nach den existierenden empirischen Daten, nicht nach dem "Begriff der Familie", wie man in Deutschland zu tun pflegt, behandelt und entwickelt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N7
  mew_page: '29'
- id: I.33.3
  kind: p
  original: Übrigens sind diese drei Seiten der sozialen Tätigkeit nicht als drei verschiedene Stufen zu fassen, sondern eben nur als drei Seiten, oder um für die Deutschen klar zu schreiben, drei "Momente", die vom Anbeginn der Geschichte an und seit den ersten Menschen zugleich existiert haben und sich noch heute in der Geschichte geltend machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '29'
- id: I.34.1
  kind: p
  original: Die Produktion des Lebens, sowohl des eignen in der Arbeit wie des fremden in der Zeugung, erscheint nun schon sogleich als ein doppeltes Verhältnis - einerseits als natürliches, andrerseits als gesellschaftliches Verhältnis -, gesellschaftlich in dem Sinne, als hierunter das Zusammenwirken mehrerer Individuen, gleichviel unter welchen Bedingungen, auf welche Weise und zu welchem Zweck, verstanden wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 29-30
- id: I.34.2
  kind: p
  original: Hieraus geht hervor, daß eine bestimmte Produktionsweise oder industrielle Stufe stets mit einer bestimmten Weise des Zusammenwirkens oder gesellschaftlichen Stufe vereinigt ist, und diese Weise des Zusammenwirkens ist selbst eine "Produktivkraft", daß die Menge der den Menschen zugänglichen Produktivkräfte den gesellschaftlichen Zustand bedingt und also die "Geschichte der Menschheit" stets im Zusammenhange mit der Geschichte der Industrie und des Austausches studiert und bearbeitet werden muß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: I.34.3
  kind: p
  original: Es ist aber auch klar, wie es in Deutschland unmöglich ist, solche Geschichte zu schreiben, da den Deutschen dazu nicht nur die Auffassungsfähigkeit und das Material, sondern auch die "sinnliche Gewißheit" abgeht und man jenseits des Rheins über diese Dinge keine Erfahrungen machen kann, weil dort keine Geschichte mehr vorgeht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: I.34.4
  kind: p
  original: Es zeigt sich also schon von vornherein ein materialistischer Zusammenhang der Menschen untereinander, der durch die Bedürfnisse und die Weise der Produktion bedingt und so alt ist wie die Menschen selbst - ein Zusammenhang, der stets neue Formen annimmt und also eine "Geschichte" darbietet, auch ohne daß irgendein politischer oder religiöser Nonsens existiert, der die Menschen noch extra zusammenhalte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: I.35.1
  kind: p
  original: Jetzt erst, nachdem wir bereits vier Momente, vier Seiten der ursprünglichen, geschichtlichen Verhältnisse betrachtet haben, finden wir, daß der Mensch auch "Bewußtsein" hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N8
  mew_page: '30'
- id: I.35.2
  kind: p
  original: Aber auch dies nicht von vornherein, als "reines" Bewußtsein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: I.35.3
  kind: p
  original: Der "Geist" hat von vornherein den Fluch an sich, mit der Materie "behaftet" zu sein, die hier in der Form von bewegten Luftschichten, Tönen, kurz der Sprache auftritt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: I.35.4
  kind: p
  original: Die Sprache ist so alt wie das Bewußtsein - die Sprache ist das praktische, auch für andre Menschen existierende, also auch für mich selbst erst existierende wirkliche Bewußtsein, und die Sprache entsteht, wie das Bewußtsein, erst aus dem Bedürfnis, der Notdurft des Verkehrs mit andern Menschen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N9
  mew_page: '30'
- id: I.35.5
  kind: p
  original: Wo ein Verhältnis existiert, da existiert es für mich, das Tier "verhält" sich zu Nichts und überhaupt nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: I.35.6
  kind: p
  original: Für das Tier existiert sein Verhältnis zu andern nicht als Verhältnis.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: I.35.7
  kind: p
  original: Das Bewußtsein ist also von vornherein schon ein gesellschaftliches Produkt und bleibt es, solange überhaupt Menschen existieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 30-31
- id: I.35.8
  kind: p
  original: Das Bewußtsein ist natürlich zuerst bloß Bewußtsein über die nächste sinnliche Umgebung und Bewußtsein des bornierten Zusammenhanges mit andern Personen und Dingen außer dem sich bewußt werdenden Individuum; es ist zu gleicher Zeit Bewußtsein der Natur, die den Menschen anfangs als eine durchaus fremde, allmächtige und unangreifbare Macht gegenübertritt, zu der sich die Menschen rein tierisch verhalten, von der sie sich imponieren lassen wie das Vieh; und also ein rein tierisches Bewußtsein der Natur (Naturreligion).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: I.36.1
  kind: p
  original: 'Man sieht hier sogleich: Diese Naturreligion oder dies bestimmte Verhalten zur Natur ist bedingt durch die Gesellschaftsform und umgekehrt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: I.36.2
  kind: p
  original: Hier wie überall tritt die Identität von Natur und Mensch auch so hervor, daß das bornierte Verhalten der Menschen zur Natur ihr borniertes Verhalten zueinander, und ihr borniertes Verhalten zueinander ihr borniertes Verhältnis zur Natur bedingt, eben weil die Natur noch kaum geschichtlich modifiziert ist, und andrerseits Bewußtsein der Notwendigkeit, mit den umgebenden Individuen in Verbindung zu treten, der Anfang des Bewußtseins darüber, daß er überhaupt in einer Gesellschaft lebt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: I.36.3
  kind: p
  original: Dieser Anfang ist so tierisch wie das gesellschaftliche Leben dieser Stufe selbst, er ist bloßes Herdenbewußtsein, und der Mensch unterscheidet sich hier vom Hammel nur dadurch, daß sein Bewußtsein ihm die Stelle des Instinkts vertritt, oder daß sein Instinkt ein bewußter ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: I.36.4
  kind: p
  original: Dieses Hammel- oder Stammbewußtsein erhält seine weitere Entwicklung und Ausbildung durch die gesteigerte Produktivität, die Vermehrung der Bedürfnisse und die Beiden zum Grunde liegende Vermehrung der Bevölkerung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: I.36.5
  kind: p
  original: Damit entwickelt sich die Teilung der Arbeit, die ursprünglich nichts war als die Teilung der Arbeit im Geschlechtsakt, dann Teilung der Arbeit, die sich vermöge der natürlichen Anlage (z.B. Körperkraft), Bedürfnisse, Zufälle etc. etc. von selbst oder "naturwüchsig" macht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: I.36.6
  kind: p
  original: Die Teilung der Arbeit wird erst wirklich Teilung von dem Augenblicke an, wo eine Teilung der materiellen und geistigen Arbeit eintritt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N10
  mew_page: '31'
- id: I.36.7
  kind: p
  original: Von diesem Augenblicke an kann sich das Bewußtsein wirklich einbilden, etwas Andres als das Bewußtsein der bestehenden Praxis zu sein, wirklich etwas vorzustellen, ohne etwas Wirkliches vorzustellen - von diesem Augenblicke an ist das Bewußtsein imstande, sich von der Welt zu emanzipieren und zur Bildung der "reinen" Theorie, Theologie, Philosophie, Moral etc. überzugehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: I.36.8
  kind: p
  original: Aber selbst wenn diese Theorie, Theologie, Philosophie, Moral etc. in Widerspruch mit den bestehenden Verhältnissen treten, so kann dies nur dadurch geschehen, daß die bestehenden gesellschaftlichen Verhältnisse mit der bestehenden Produktionskraft in Widerspruch getreten sind - was übrigens in einem bestimmten nationalen Kreise von Verhältnissen auch dadurch geschehen kann, daß der Widerspruch nicht in diesem nationalen Umkreis, sondern zwischen diesem nationalen Bewußtsein und der Praxis der anderen Nationen, d.h. zwischen dem nationalen und allgemeinen Bewußtsein einer Nation sich einstellt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N11
  mew_page: 31-32
- id: I.37.1
  kind: p
  original: Übrigens ist es ganz einerlei, was das Bewußtsein alleene anfängt, wir erhalten aus diesem ganzen Dreck nur das eine Resultat, daß diese drei Momente, die Produktionskraft, der gesellschaftliche Zustand und das Bewußtsein, in Widerspruch untereinander geraten können und müssen, weil mit der Teilung der Arbeit die Möglichkeit, ja die Wirklichkeit gegeben ist, daß die geistige und materielle Tätigkeit - daß der Genuß und die Arbeit, Produktion und Konsumtion, verschiedenen Individuen zufallen, und die Möglichkeit, daß sie nicht in Widerspruch geraten, nur darin liegt, daß die Teilung der Arbeit wieder aufgehoben wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '32'
- id: I.37.2
  kind: p
  original: Es versteht sich übrigens von selbst, daß die "Gespenster", "Bande", "höheres Wesen", "Begriff", "Bedenklichkeit" bloß der idealistische geistliche Ausdruck, die Vorstellung scheinbar des vereinzelten Individuums sind, die Vorstellung von sehr empirischen Fesseln und Schranken, innerhalb deren sich die Produktionsweise des Lebens und die damit zusammenhängende Verkehrsform bewegt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '32'
- id: I.38.1
  kind: p
  original: Mit der Teilung der Arbeit, in welcher alle diese Widersprüche gegeben sind und welche ihrerseits wieder auf der naturwüchsigen Teilung der Arbeit in der Familie und der Trennung der Gesellschaft in einzelne, einander entgegengesetzte Familien beruht, ist zu gleicher Zeit auch die Verteilung, und zwar die ungleiche, sowohl quantitative wie qualitative Verteilung der Arbeit und ihrer Produkte gegeben, also das Eigentum, das in der Familie, wo die Frau und die Kinder die Sklaven des Mannes sind, schon seinen Keim, seine erste Form hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '32'
- id: I.38.2
  kind: p
  original: Die freilich noch sehr rohe, latente Sklaverei in der Familie ist das erste Eigentum, das übrigens hier schon vollkommen der Definition der modernen Ökonomen entspricht, nach der es die Verfügung über fremde Arbeitskraft ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '32'
- id: I.38.3
  kind: p
  original: Übrigens sind Teilung der Arbeit und Privateigentum identische Ausdrücke - in dem Einen wird in Beziehung auf die Tätigkeit dasselbe ausgesagt, was in dem Andern in bezug auf das Produkt der Tätigkeit ausgesagt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '32'
- id: I.39.1
  kind: p
  original: Ferner ist mit der Teilung der Arbeit zugleich der Widerspruch zwischen dem Interesse des einzelnen Individuums oder der einzelnen Familie und dem gemeinschaftlichen Interesse aller Individuen, die miteinander verkehren, gegeben; und zwar existiert dies gemeinschaftliche Interesse nicht bloß in der Vorstellung, als "Allgemeines", sondern zuerst in der Wirklichkeit als gegenseitige Abhängigkeit der Individuen, unter denen die Arbeit geteilt ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 32-33
- id: I.39.2
  kind: p
  original: Und endlich bietet uns die Teilung der Arbeit gleich das erste Beispiel davon dar, daß, solange die Menschen sich in der naturwüchsigen Gesellschaft befinden, solange also die Spaltung zwischen dem besondern und gemeinsamen Interesse existiert, solange die Tätigkeit also nicht freiwillig, sondern naturwüchsig geteilt ist, die eigne Tat des Menschen ihm zu einer fremden, gegenüberstehenden Macht wird, die ihn unterjocht, statt daß er sie beherrscht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '33'
- id: I.39.3
  kind: p
  original: Sowie nämlich die Arbeit verteilt zu werden anfängt, hat Jeder einen bestimmten ausschließlichen Kreis der Tätigkeit, der ihm aufgedrängt wird, aus dem er nicht heraus kann; er ist Jäger, Fischer oder Hirt oder kritischer Kritiker und muß es bleiben, wenn er nicht die Mittel zum Leben verlieren will - während in der kommunistischen Gesellschaft, wo Jeder nicht einen ausschließlichen Kreis der Tätigkeit hat, sondern sich in jedem beliebigen Zweige ausbilden kann, die Gesellschaft die allgemeine Produktion regelt und mir eben dadurch möglich macht, heute dies, morgen jenes zu tun, morgens zu jagen, nachmittags zu fischen, abends Viehzucht zu treiben, nach dem Essen zu kritisieren, wie ich gerade Lust habe, ohne je Jäger, Fischer, Hirt oder Kritiker zu werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '33'
- id: I.39.4
  kind: p
  original: Dieses Sichfestsetzen der sozialen Tätigkeit, diese Konsolidation unsres eignen Produkts zu einer sachlichen Gewalt über uns, die unsrer Kontrolle entwächst, unsre Erwartungen durchkreuzt, unsre Berechnungen zunichte macht, ist eines der Hauptmomente in der bisherigen geschichtlichen Entwicklung, und eben aus diesem Widerspruch des besondern und gemeinschaftlichen Interesses nimmt das gemeinschaftliche Interesse als Staat eine selbständige Gestaltung, getrennt von den wirklichen Einzel- und Gesamtinteressen, an, und zugleich als illusorische Gemeinschaftlichkeit, aber stets auf der realen Basis der in jedem Familien- und Stamm-Konglomerat vorhandenen Bänder, wie Fleisch und Blut, Sprache, Teilung der Arbeit im größeren Maßstabe und sonstigen Interessen - und besonders, wie wir später entwickeln werden, der durch die Teilung der Arbeit bereits bedingten Klassen, die in jedem derartigen Menschenhaufen sich absondern und von denen eine alle andern beherrscht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '33'
- id: I.39.5
  kind: p
  original: Hieraus folgt, daß alle Kämpfe innerhalb des Staats, der Kampf zwischen Demokratie, Aristokratie und Monarchie, der Kampf um das Wahlrecht etc. etc., nichts als die illusorischen Formen sind, in denen die wirklichen Kämpfe der verschiednen Klassen untereinander geführt werden (wovon die deutschen Theoretiker nicht eine Silbe ahnen, trotzdem daß man ihnen in den "Deutsch-Französischen Jahrbüchern" und der "Heiligen Familie" dazu Anleitung genug gegeben hatte), und ferner, daß jede nach der Herrschaft strebende Klasse, wenn ihre Herrschaft auch, wie dies beim Proletariat der Fall ist, die Aufhebung der ganzen alten Gesellschaftsform und der Herrschaft überhaupt bedingt, sich zuerst die politische Macht erobern muß, um ihr Interesse wieder als das Allgemeine, wozu sie im ersten Augenblick gezwungen ist, darzustellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 33-34
- id: I.39.6
  kind: p
  original: Eben weil die Individuen nur ihr besondres, für sie nicht mit ihrem gemeinschaftlichen Interesse zusammenfallendes suchen, überhaupt das Allgemeine illusorische Form der Gemeinschaftlichkeit, wird dies als ein ihnen "fremdes" und von ihnen "unabhängiges", als ein selbst wieder besonderes und eigentümliches "Allgemein "-Interesse geltend gemacht, oder sie selbst müssen sich in diesem Zwiespalt bewegen" wie in der Demokratie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '34'
- id: I.39.7
  kind: p
  original: Andrerseits macht denn auch der praktische Kampf dieser beständig wirklich den gemeinschaftlichen und illusorischen gemeinschaftlichen Interessen entgegentretenden Sonderinteressen die praktische Dazwischenkunft und Zügelung durch das illusorische "Allgemein"-Interesse als Staat nötig.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '34'
- id: I.39.8
  kind: p
  original: Die soziale Macht, d.h. die vervielfachte Produktionskraft, die durch das in der Teilung der Arbeit bedingte Zusammenwirken der verschiedenen Individuen entsteht, erscheint diesen Individuen, weil das Zusammenwirken selbst nicht freiwillig, sondern naturwüchsig ist, nicht als ihre eigne, vereinte Macht, sondern als eine fremde, außer ihnen stehende Gewalt, von der sie nicht wissen woher und wohin, die sie also nicht mehr beherrschen können, die im Gegenteil nun eine eigentümliche, vom Wollen und Laufen der Menschen unabhängige, ja dies Wollen und Laufen erst dirigierende Reihenfolge von Phasen und Entwicklungsstufen durchläuft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '34'
- id: I.40.1
  kind: p
  original: Diese "Entfremdung", um den Philosophen verständlich zu bleiben, kann natürlich nur unter zwei praktischen Voraussetzungen aufgehoben werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '34'
- id: I.40.2
  kind: p
  original: Damit sie eine "unerträgliche" Macht werde, d.h. eine Macht, gegen die man revolutioniert, dazu gehört, daß sie die Masse der Menschheit als durchaus "Eigentumslos" erzeugt hat und zugleich im Widerspruch zu einer vorhandnen Welt des Reichtums und der Bildung, was beides eine große Steigerung der Produktivkraft, einen hohen Grad ihrer Entwicklung voraussetzt - und andrerseits ist diese Entwicklung der Produktivkräfte (womit zugleich schon die in weltgeschichtlichem, statt der in lokalem Dasein der Menschen vorhandne empirische Existenz gegeben ist) auch deswegen eine absolut notwendige praktische Voraussetzung, weil ohne sie nur der Mangel verallgemeinert, also mit der Notdurft auch der Streit um das Notwendige wieder beginnen und die ganze alte Scheiße sich herstellen müßte, weil ferner nur mit dieser universellen Entwicklung der Produktivkräfte ein universeller Verkehr der Menschen gesetzt ist, daher einerseits das Phänomen der "Eigentumslosen" Masse in Allen Völkern gleichzeitig erzeugt (allgemeine Konkurrenz), jedes derselben von den Umwälzungen der andern abhängig macht, und endlich weltgeschichtliche, empirisch universelle Individuen an die Stelle der lokalen gesetzt hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 34-35
- id: I.40.3
  kind: p
  original: Ohne dies könnte 1. der Kommunismus nur als eine Lokalität existieren, 2. die Mächte des Verkehrs selbst hätten sich als universelle, drum unerträgliche Mächte nicht entwickeln können, sie wären heimisch-abergläubige "Umstände" geblieben, und 3. würde jede Erweiterung des Verkehrs den lokalen Kommunismus aufheben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '35'
- id: I.40.4
  kind: p
  original: Der Kommunismus ist empirisch nur als die Tat der herrschenden Völker "auf einmal" und gleichzeitig möglich, was die universelle Entwicklung der Produktivkraft und den mit ihm zusammenhängenden Weltverkehr voraussetzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '35'
- id: I.40.5
  kind: p
  original: Wie hätte sonst z.B. das Eigentum überhaupt eine Geschichte haben, verschiedene Gestalten annehmen, und etwa das Grundeigentum je nach der verschiedenen vorliegende Voraussetzung in Frankreich aus der Parzellierung zur Zentralisation in wenigen Händen, in England aus der Zentralisation in wenigen Händen zur Parzellierung drängen können, wie dies heute wirklich der Fall ist?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '35'
- id: I.40.6
  kind: p
  original: Oder wie kommt es, daß der Handel, der doch weiter nichts ist als der Austausch der Produkte verschiedner Individuen und Länder, durch das Verhältnis von Nachfrage und Zufuhr die ganze Welt beherrscht - ein Verhältnis, das, wie ein englischer Ökonom sagt, gleich dem antiken Schicksal über der Erde schwebt und mit unsichtbarer Hand Glück und Unglück an die Menschen verteilt, Reiche stiftet und Reiche zertrümmert, Völker entstehen und verschwinden macht -, während mit der Aufhebung der Basis, des Privateigentums, mit der kommunistischen Regelung der Produktion und der darin liegenden Vernichtung der Fremdheit, mit der sich die Menschen zu ihrem eignen Produkt verhalten, die Macht des Verhältnisses von Nachfrage und Zufuhr sich in Nichts auflöst und die Menschen den Austausch, die Produktion, die Weise ihres gegenseitigen Verhaltens wieder in ihre Gewalt bekommen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '35'
- id: I.41.1
  kind: p
  original: Der Kommunismus ist für uns nicht ein Zustand, der hergestellt werden soll, ein Ideal, wonach die Wirklichkeit sich zu richten haben [wird].
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '35'
- id: I.41.2
  kind: p
  original: Wir nennen Kommunismus die wirkliche Bewegung, welche den jetzigen Zustand aufhebt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '35'
- id: I.41.3
  kind: p
  original: Die Bedingungen dieser Bewegung ergeben sich aus der jetzt bestehenden Voraussetzung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '35'
- id: I.41.4
  kind: p
  original: Übrigens setzt die Masse von bloßen Arbeitern - massenhafte, von Kapital oder von irgendeiner bornierten Befriedigung abgeschnittne Arbeiterkraft - und darum auch der nicht mehr temporäre Verlust dieser Arbeit selbst als einer gesicherten Lebensquelle durch die Konkurrenz den Weltmarkt voraus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 35-36
- id: I.41.5
  kind: p
  original: Das Proletariat kann also nur weltgeschichtlich existieren, wie der Kommunismus, seine Aktion, nur als "weltgeschichtliche" Existenz überhaupt vorhanden sein kann; weltgeschichtliche Existenz der Individuen; d.h. Existenz der Individuen, die unmittelbar mit der Weltgeschichte verknüpft ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
- id: I.42.1
  kind: p
  original: Die durch die auf allen bisherigen geschichtlichen Stufen vorhandenen Produktionskräfte bedingte und sie wiederum bedingende Verkehrsform ist die bürgerliche Gesellschaft, die, wie schon aus dem Vorhergehenden hervorgeht, die einfache Familie und die zusammengesetzte Familie, das sogenannte Stammwesen zu ihrer Voraussetzung und Grundlage hat, und deren nähere Bestimmungen im Vorhergehenden enthalten sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
- id: I.42.2
  kind: p
  original: Es zeigt sich schon hier, daß diese bürgerliche Gesellschaft der wahre Herd und Schauplatz aller Geschichte ist, und wie widersinnig die bisherige, die wirklichen Verhältnisse vernachlässigende Geschichtsauffassung mit ihrer Beschränkung auf hochtönende Haupt- und Staatsaktionen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N12
  mew_page: '36'
- id: I.43.1
  kind: p
  original: Die bürgerliche Gesellschaft umfaßt den gesamten materiellen Verkehr der Individuen innerhalb einer bestimmten Entwicklungsstufe der Produktivkräfte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
- id: I.43.2
  kind: p
  original: Sie umfaßt das gesamte kommerzielle und industrielle Leben einer Stufe und geht insofern über den Staat und die Nation hinaus, obwohl sie andrerseits wieder nach Außen hin als Nationalität sich geltend machen, nach Innen als Staat sich gliedern muß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
- id: I.43.3
  kind: p
  original: Das Wort bürgerliche Gesellschaft kam auf im achtzehnten Jahrhundert, als die Eigentumsverhältnisse bereits aus dem antiken und mittelalterlichen Gemeinwesen sich herausgearbeitet hatten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
- id: I.43.4
  kind: p
  original: Die bürgerliche Gesellschaft als solche entwickelt sich erst mit der Bourgeoisie; die unmittelbar aus der Produktion und dem Verkehr sich entwickelnde gesellschaftliche Organisation, die zu allen Zeiten die Basis des Staats und der sonstigen idealistischen Superstruktur bildet, ist indes fortwährend mit demselben Namen bezeichnet worden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
- id: I.44.1
  kind: heading
  original: '[2.] Über die Produktion des Bewußtseins'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
- id: I.45.1
  kind: p
  original: In der bisherigen Geschichte ist es allerdings ebensosehr eine empirische Tatsache, daß die einzelnen Individuen mit der Ausdehnung der Tätigkeit zur Weltgeschichtlichen immer mehr unter einer ihnen fremden Macht geknechtet worden sind (welchen Druck sie sich denn auch als Schikane des sogenannten Weltgeistes etc. vorstellten), einer Macht, die immer massenhafter geworden ist und sich in letzter Instanz als Weltmarkt ausweist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: I.45.2
  kind: p
  original: Aber ebenso empirisch begründet ist es, daß durch den Umsturz des bestehenden gesellschaftlichen Zustandes durch die kommunistische Revolution (wovon weiter unten) und die damit identische Aufhebung des Privateigentums diese den deutschen Theoretikern so mysteriöse Macht aufgelöst wird und alsdann die Befreiung jedes einzelnen Individuums in demselben Maße durchgesetzt wird, in dem die Geschichte sich vollständig in Weltgeschichte verwandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: I.45.3
  kind: p
  original: Daß der wirkliche geistige Reichtum des Individuums ganz von dem Reichtum seiner wirklichen Beziehungen abhängt, ist nach dem Obigen klar.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: I.45.4
  kind: p
  original: Die einzelnen Individuen werden erst hierdurch von den verschiedenen nationalen und lokalen Schranken befreit, mit der Produktion (auch mit der geistigen) der ganzen Welt in praktische Beziehung gesetzt und in den Stand gesetzt, sich die Genußfähigkeit für diese allseitige Produktion der ganzen Erde (Schöpfungen der Menschen) zu erwerben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: I.45.5
  kind: p
  original: Die allseitige Abhängigkeit, diese naturwüchsige Form des weltgeschichtlichen Zusammenwirkens der Individuen, wird durch diese kommunistische Revolution verwandelt in die Kontrolle und bewußte Beherrschung dieser Mächte, die, aus dem Aufeinander-Wirken der Menschen erzeugt, ihnen bisher als durchaus fremde Mächte imponiert und sie beherrscht haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: I.45.6
  kind: p
  original: Diese Anschauung kann nun wieder spekulativ-idealistisch, d.h. phantastisch als "Selbsterzeugung der Gattung" (die "Gesellschaft als Subjekt") gefaßt und dadurch die aufeinanderfolgende Reihe von im Zusammenhange stehenden Individuen als ein einziges Individuum vorgestellt werden, das das Mysterium vollzieht, sich selbst zu erzeugen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: I.45.7
  kind: p
  original: Es zeigt sich hier, daß die Individuen allerdings einander machen, physisch und geistig, aber nicht sich machen, weder im Unsinn des heiligen Bruno, noch im Sinne des "Einzigen", des "gemachten" Mannes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: I.46.1
  kind: p
  original: Diese Geschichtsauffassung beruht also darauf, den wirklichen Produktionsprozeß, und zwar von der materiellen Produktion des unmittelbaren Lebens ausgehend, zu entwickeln und die mit dieser Produktionsweise zusammenhängende und von ihr erzeugte Verkehrsform, also die bürgerliche Gesellschaft in ihren verschiedenen Stufen, als Grundlage der ganzen Geschichte aufzufassen und sie sowohl in ihrer Aktion als Staat darzustellen, wie die sämtlichen verschiedenen theoretischen Erzeugnisse und Formen des Bewußtseins, Religion, Philosophie, Moral etc. etc., aus ihr zu erklären und ihren Entstehungsprozeß aus ihnen zu verfolgen, wo dann natürlich auch die Sache in ihrer Totalität (und darum auch die Wechselwirkung dieser verschiednen Seiten aufeinander) dargestellt werden kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 37-38
- id: I.46.2
  kind: p
  original: Sie hat in jeder Periode nicht, wie die idealistische Geschichtsanschauung, nach einer Kategorie zu suchen, sondern bleibt fortwährend auf dem wirklichen Geschichtsboden stehen, erklärt nicht die Praxis aus der Idee, erklärt die Ideenformationen aus der materiellen Praxis und kommt demgemäß auch zu dem Resultat, daß alle Formen und Produkte des Bewußtseins nicht durch geistige Kritik, durch Auflösung ins "Selbstbewußtsein" oder Verwandlung in "Spuk", "Gespenster", "Sparren" etc., sondern nur durch den praktischen Umsturz der realen gesellschaftlichen Verhältnisse, aus denen diese idealistischen Flausen hervorgegangen sind, aufgelöst werden können - daß nicht die Kritik, sondern die Revolution die treibende Kraft der Geschichte auch der Religion, Philosophie und sonstigen Theorie ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '38'
- id: I.46.3
  kind: p
  original: Sie zeigt, daß die Geschichte nicht damit endigt, sich ins "Selbstbewußtsein" als "Geist vom Geist" aufzulösen, sondern daß in ihr auf jeder Stufe ein materielles Resultat, eine Summe von Produktionskräften, ein historisch geschaffnes Verhältnis zur Natur und der Individuen zueinander sich vorfindet, die jeder Generation von ihrer Vorgängerin überliefert wird, eine Masse von Produktivkräften, Kapitalien und Umständen, die zwar einerseits von der neuen Generation modifiziert wird, ihr aber auch andrerseits ihre eignen Lebensbedingungen vorschreibt und ihr eine bestimmte Entwicklung, einen speziellen Charakter gibt - daß also die Umstände ebensosehr die Menschen, wie die Menschen die Umstände machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '38'
- id: I.46.4
  kind: p
  original: Diese Summe von Produktionskräften, Kapitalien und sozialen Verkehrsformen, die jedes Individuum und jede Generation als etwas Gegebenes vorfindet, ist der reale Grund dessen, was sich die Philosophen als "Substanz" und "Wesen des Menschen" vorgestellt, was sie apotheosiert und bekämpft haben, ein realer Grund, der dadurch nicht im Mindesten in seinen Wirkungen und Einflüssen auf die Entwicklung der Menschen gestört wird, daß diese Philosophen als "Selbstbewußtsein" und "Einzige" dagegen rebellieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '38'
- id: I.46.5
  kind: p
  original: Diese vorgefundenen Lebensbedingungen der verschiedenen Generationen entscheiden auch, ob die periodisch in der Geschichte wiederkehrende revolutionäre Erschütterung stark genug sein wird oder nicht, die Basis alles Bestehenden umzuwerfen, und wenn diese materiellen Elemente einer totalen Umwälzung, nämlich einerseits die vorhandnen Produktivkräfte, andrerseits die Bildung einer revolutionären Masse, die nicht nur gegen einzelne Bedingungen der bisherigen Gesellschaft, sondern gegen die bisherige "Lebensproduktion" selbst, die "Gesamttätigkeit'., worauf sie basierte, revolutioniert - nicht vorhanden sind, so ist es ganz gleichgültig für die praktische Entwicklung, ob die Idee dieser Umwälzung schon hundertmal ausgesprochen ist - wie die Geschichte des Kommunismus dies beweist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 38-39
- id: I.47.1
  kind: p
  original: Die ganze bisherige Geschichtsauffassung hat diese wirkliche Basis der Geschichte entweder ganz und gar unberücksichtigt gelassen oder sie nur als eine Nebensache betrachtet, die mit dem geschichtlichen Verlauf außer allem Zusammenhang steht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '39'
- id: I.47.2
  kind: p
  original: Die Geschichte muß daher immer nach einem außer ihr liegenden Maßstab geschrieben werden; die wirkliche Lebensproduktion erscheint als Urgeschichtlich, während das Geschichtliche als das vom gemeinen Leben Getrennte, Extra-Überweltliche erscheint.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '39'
- id: I.47.3
  kind: p
  original: Das Verhältnis der Menschen zur Natur ist hiermit von der Geschichte ausgeschlossen, wodurch der Gegensatz von Natur und Geschichte erzeugt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '39'
- id: I.47.4
  kind: p
  original: Sie hat daher in der Geschichte nur politische Haupt- und Staatsaktionen und religiöse und überhaupt theoretische Kämpfe sehen können und speziell bei jeder geschichtlichen Epoche die Illusion dieser Epoche teilen müssen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '39'
- id: I.47.5
  kind: p
  original: Z.B. bildet sich eine Epoche ein, durch rein "politische" oder "religiöse" Motive bestimmt zu werden, obgleich "Religion" und "Politik" nur Formen ihrer wirklichen Motive sind, so akzeptiert ihr Geschichtschreiber diese Meinung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '39'
- id: I.47.6
  kind: p
  original: Die "Einbildung", die "Vorstellung" dieser bestimmten Menschen über ihre wirkliche Praxis wird in die einzig bestimmende und aktive Macht verwandelt, welche die Praxis dieser Menschen beherrscht und bestimmt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '39'
- id: I.47.7
  kind: p
  original: Wenn die rohe Form, in der die Teilung der Arbeit bei den Indern und Ägyptern vorkommt, das Kastenwesen bei diesen Völkern in ihrem Staat und ihrer Religion hervorruft, so glaubt der Historiker, das Kastenwesen sei die Macht, welche diese rohe gesellschaftliche Form erzeugt habe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '39'
- id: I.47.8
  kind: p
  original: Während die Franzosen und Engländer wenigstens an der politischen Illusion, die der Wirklichkeit noch am nächsten steht, halten, bewegen sich die Deutschen im Gebiete des "reinen Geistes" und machen die religiöse Illusion zur treibenden Kraft der Geschichte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '39'
- id: I.47.9
  kind: p
  original: Die Hegelsche Geschichtsphilosophie ist die letzte, auf ihren "reinsten Ausdruck" gebrachte Konsequenz dieser gesamten Deutschen Geschichtschreibung, in der es sich nicht um wirkliche, nicht einmal um politische Interessen, sondern um reine Gedanken handelt, die dann auch dem heiligen Bruno als eine Reihe von "Gedanken" erscheinen muß, von denen einer den andren auffrißt und in dem "Selbstbewußtsein" schließlich untergeht, und noch konsequenter dem heiligen Max Stirner, der von der ganzen wirklichen Geschichte nichts weiß, dieser historische Verlauf als eine bloße "Ritter"-, Räuber- und Gespenstergeschichte erscheinen mußte, vor deren Visionen er sich natürlich nur durch die "Heillosigkeit" zu retten weiß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N13
  mew_page: 39-40
- id: I.47.10
  kind: p
  original: Diese Auffassung ist wirklich religiös, sie unterstellt den religiösen Menschen als den Urmenschen, von dem alle Geschichte ausgeht, und setzt in ihrer Einbildung die religiöse Phantasien-Produktion an die Stelle der wirklichen Produktion der Lebensmittel und des Lebens selbst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '40'
- id: I.47.11
  kind: p
  original: 'Diese ganze Geschichtsauffassung samt ihrer Auflösung und den daraus entstehenden Skrupeln und Bedenken ist eine bloß nationale Angelegenheit der Deutschen und hat nur lokales Interesse für Deutschland, wie zum Exempel die wichtige, neuerdings mehrfach behandelte Frage: wie man denn eigentlich "aus dem Gottesreich in das Menschenreich komme", als ob dieses "Gottesreich" je anderswo existiert habe als in der Einbildung und die gelahrten Herren nicht fortwährend, ohne es zu wissen, in dem "Menschenreich" lebten, zu welchem sie jetzt den Weg suchen, und als ob das wissenschaftliche Amüsement, denn mehr als das ist es nicht, das Kuriosum dieser theoretischen Wolkenbildung zu erklären, nicht gerade umgekehrt darin läge, daß man ihre Entstehung aus den wirklichen irdischen Verhältnissen nachweist.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '40'
- id: I.47.12
  kind: p
  original: Überhaupt handelt es sich bei diesen Deutschen stets darum, den vorgefundenen Unsinn in irgendeine andre Marotte aufzulösen, d.h. vorauszusetzen, daß dieser ganze Unsinn überhaupt einen aparten Sinn habe, der herauszufinden sei, während es sich nur darum handelt, diese theoretischen Phrasen aus den bestehenden wirklichen Verhältnissen zu erklären.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '40'
- id: I.47.13
  kind: p
  original: Die wirkliche, praktische Auflösung dieser Phrasen, die Beseitigung dieser Vorstellungen aus dem Bewußtsein der Menschen wird, wie schon gesagt, durch veränderte Umstände, nicht durch theoretische Deduktionen bewerkstelligt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '40'
- id: I.47.14
  kind: p
  original: Für die Masse der Menschen, d.h. das Proletariat, existieren diese theoretischen Vorstellungen nicht, brauchen also für sie auch nicht aufgelöst zu werden, und wenn diese Masse je einige theoretische Vorstellungen, z.B. Religion hatte, so sind diese jetzt schon längst durch die Umstände aufgelöst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '40'
- id: I.48.1
  kind: p
  original: Das rein Nationale dieser Fragen und Lösungen zeigt sich auch noch darin, daß diese Theoretiker alles Ernstes glauben, Hirngespinste wie "der Gottmensch", "der Mensch" etc. hätten den einzelnen Epochen der Geschichte präsidiert - der heilige Bruno geht sogar soweit, zu behaupten, nur "die Kritik und die Kritiker hätten die Geschichte gemacht" - und, wenn sie sich selbst an geschichtliche Konstruktionen geben, über alles Frühere in der größten Eile hinwegspringen und vom "Mongolentum" sogleich auf die eigentliche "inhaltsvolle Geschichte, nämlich die Geschichte der "Hallischen" und "Deutschen Jahrbücher" und der Auflösung der Hegelschen Schule in eine allgemeine Zänkerei übergehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 40-41
- id: I.48.2
  kind: p
  original: Alle andern Nationen, alle wirklichen Ereignisse werden vergessen, das Theatrum mundi <Welttheater> beschränkt sich auf die Leipziger Büchermesse und die gegenseitigen Streitigkeiten der "Kritik", des "Menschen" und des Einzigen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
- id: I.48.3
  kind: p
  original: Wenn sich die Theorie vielleicht einmal daran gibt, wirklich historisch Themata zu behandeln, wie z.B. das achtzehnte Jahrhundert, so geben sie nur die Geschichte der Vorstellungen, losgerissen von den Tatsachen und praktischen Entwicklungen, die ihnen zum Grunde liegen, und auch diese nur in der Absicht, um diese Zeit als eine unvollkommene Vorstufe, als den noch bornierten Vorläufer der wahren geschichtlichen Zeit, d.h. der Zeit des deutschen Philosophenkampfes von 1840/44 darzustellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
- id: I.48.4
  kind: p
  original: Diesem Zwecke, eine frühere Geschichte zu schreiben, um den Ruhm einer ungeschichtlichen Person und ihrer Phantasien desto heller leuchten zu lassen, entspricht es denn, daß man alle wirklich historischen Ereignisse, selbst die wirklich historischen Eingriffe der Politik in die Geschichte, nicht erwähnt und dafür eine nicht auf Studien, sondern Konstruktionen und literarischen Klatschgeschichten beruhende Erzählung gibt - wie dies vom heiligen Bruno in seiner nun vergessenen "Geschichte des 18ten Jahrhunderts" geschehen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
- id: I.48.5
  kind: p
  original: Diese hochtrabenden und hochfahrenden Gedankenkrämer, die unendlich weit über alle nationalen Vorurteile erhaben zu sein glauben, sind also in der Praxis noch viel nationaler als die Bierphilister, die von Deutschlands Einheit träumen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
- id: I.48.6
  kind: p
  original: Sie erkennen die Taten andrer Völker gar nicht für historisch an, sie leben in Deutschland zu Deutschland und für Deutschland, sie verwandeln das Rheinlied in ein geistliches Lied und erobern Elsaß und Lothringen, indem sie statt des französischen Staats die französische Philosophie bestehlen, statt französischer Provinzen französische Gedanken germanisieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
- id: I.48.7
  kind: p
  original: Herr Venedey ist ein Kosmopolit gegen die Heiligen Bruno und Max, die in der Weltherrschaft der Theorie die Weltherrschaft Deutschlands proklamieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
- id: I.49.1
  kind: p
  original: Es zeigt sich aus diesen Auseinandersetzungen auch, wie sehr Feuerbach sich täuscht, wenn er ("Wigand's Vierteljahrsschrift", 1845, Bd. 2) sich vermöge der Qualifikation "Gemeinmensch" für einen Kommunisten erklärt, in ein Prädikat "des" Menschen verwandelt, also das Wort Kommunist, das in der bestehenden Welt den Anhänger einer bestimmten revolutionären Partei bezeichnet, wieder in eine bloße Kategorie verwandeln zu können glaubt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
- id: I.49.2
  kind: p
  original: Feuerbachs ganze Deduktion in Beziehung auf das Verhältnis der Menschen zueinander geht nur dahin, zu beweisen, daß die Menschen einander nötig haben und immer gehabt haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: I.49.3
  kind: p
  original: Er will das Bewußtsein über diese Tatsache etablieren, er will also, wie die übrigen Theoretiker, nur ein richtiges Bewußtsein über ein bestehendes Faktum hervorbringen, während es dem wirklichen Kommunisten darauf ankommt, dies Bestehende umzustürzen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: I.49.4
  kind: p
  original: Wir erkennen es übrigens vollständig an, daß Feuerbach, indem er das Bewußtsein gerade dieser Tatsache zu erzeugen strebt, so weit geht, wie ein Theoretiker überhaupt gehen kann, ohne aufzuhören, Theoretiker und Philosoph zu sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: I.49.5
  kind: p
  original: Charakteristisch ist es aber, daß die Heiligen Bruno und Max die Vorstellung Feuerbachs vom Kommunisten sogleich an die Stelle des wirklichen Kommunisten setzen, was teilweise schon deswegen geschieht, damit sie auch den Kommunismus als "Geist vom Geist", als philosophische Kategorie, als ebenbürtigen Gegner bekämpfen können - und von seiten des heiligen Bruno auch noch aus pragmatischen Interessen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: I.49.6
  kind: p
  original: Als Beispiel von der Anerkennung und zugleich Verkennung des Bestehenden, die Feuerbach noch immer mit unsern Gegnern teilt, erinnern wir an die Stelle der "Philosophie der Zukunft", wo er entwickelt, daß das Sein eines Dinges oder Menschen zugleich sein Wesen sei, daß die bestimmten Existenzverhältnisse, Lebensweise und Tätigkeit eines tierischen oder menschlichen Individuums dasjenige sei, worin sein "Wesen" sich befriedigt fühle.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: I.49.7
  kind: p
  original: Hier wird ausdrücklich jede Ausnahme als ein unglücklicher Zufall, als eine Abnormität, die nicht zu ändern ist, aufgefaßt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: I.49.8
  kind: p
  original: Wenn also Millionen von Proletariern sich in ihren Lebensverhältnissen keineswegs befriedigt fühlen, wenn ihr "Sein" ihrem [...] <Im Manuskript befindet sich hier eine Lücke>
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: I.50.1
  kind: p
  original: '[...] sich in Wirklichkeit und für den praktischen Materialisten, d.h. Kommunisten, darum handelt, die bestehende Welt zu revolutionieren, die vorgefundnen Dinge praktisch anzugreifen und zu verändern.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: I.50.2
  kind: p
  original: Wenn bei Feuerbach sich zuweilen derartige Anschauungen finden, so gehen sie doch nie über vereinzelte Ahnungen hinaus und haben auf seine allgemeine Anschauungsweise viel zuwenig Einfluß, als daß sie hier anders denn als entwicklungsfähige Keime in Betracht kommen könnten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: I.50.3
  kind: p
  original: Feuerbachs "Auffassung" der sinnlichen Welt beschränkt sich einerseits auf die bloße Anschauung derselben und andrerseits auf die bloße Empfindung, er sagt " den Menschen" statt d[ie] "wirklichen historischen Menschen".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: I.50.4
  kind: p
  original: '" Der Mensch" ist realiter <in Wirklichkeit> "der Deutsche".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: I.50.5
  kind: p
  original: Im ersten Falle, in der Anschauung der sinnlichen Welt, stößt er notwendig auf Dinge, die seinem Bewußtsein und seinem Gefühl widersprechen, die die von ihm vorausgesetzte Harmonie aller Teile der sinnlichen Welt und namentlich des Menschen mit der Natur stören.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N14
  mew_page: 42-43
- id: I.50.6
  kind: p
  original: Um diese zu beseitigen, muß er dann zu einer doppelten Anschauung seine Zuflucht nehmen, zwischen einer profanen, die nur das "auf platter Hand Liegende", und einer höheren, philosophischen, die das "wahre Wesen" der Dinge erschaut.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
- id: I.50.7
  kind: p
  original: Er sieht nicht, wie die ihn umgebende sinnliche Welt nicht ein unmittelbar von Ewigkeit her gegebenes, sich stets gleiches Ding ist, sondern das Produkt der Industrie und des Gesellschaftszustandes, und zwar in dem Sinne, daß sie ein geschichtliches Produkt ist, das Resultat der Tätigkeit einer ganzen Reihe von Generationen, deren Jede auf den Schultern der vorhergehenden stand, ihre Industrie und ihren Verkehr weiter ausbildete, ihre soziale Ordnung nach den veränderten Bedürfnissen modifizierte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
- id: I.50.8
  kind: p
  original: Selbst die Gegenstände der einfachsten "sinnlichen Gewißheit" sind ihm nur durch die gesellschaftliche Entwicklung, die Industrie und den kommerziellen Verkehr gegeben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
- id: I.50.9
  kind: p
  original: Der Kirschbaum ist, wie fast alle Obstbäume, bekanntlich erst vor wenig Jahrhunderten durch den Handel in unsre Zone verpflanzt worden und wurde deshalb erst durch diese Aktion einer bestimmten Gesellschaft in einer bestimmten Zeit der "sinnlichen Gewißheit" Feuerbachs gegeben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
- id: I.51.1
  kind: p
  original: Übrigens löst sich in dieser Auffassung der Dinge, wie sie wirklich sind und geschehen sind, wie sich weiter unten noch deutlicher zeigen wird, jedes tiefsinnige philosophische Problem ganz einfach in ein empirisches Faktum auf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
- id: I.51.2
  kind: p
  original: Z.B. die wichtige Frage über das Verhältnis des Menschen zur Natur (oder gar, wie Bruno sagt (p. 110), die "Gegensätze in Natur und Geschichte", als ob das zwei voneinander getrennte "Dinge" seien, der Mensch nicht immer eine geschichtliche Natur und eine natürliche Geschichte vor sich habe), aus der alle die "unergründlich hohen Werke" über "Substanz" und "Selbstbewußtsein" hervorgegangen sind, zerfällt von selbst in der Einsicht, daß die vielberühmte "Einheit des Menschen mit der Natur" in der Industrie von jeher bestanden und in jeder Epoche je nach der geringeren oder größeren Entwicklung der Industrie anders bestanden hat, ebenso wie der "Kampf" des Menschen mit der Natur, bis zur Entwicklung seiner Produktivkräfte auf einer entsprechenden Basis.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
- id: I.51.3
  kind: p
  original: Die Industrie und der Handel, die Produktion und der Austausch der Lebensbedürfnisse bedingen ihrerseits und werden wiederum in der Art ihres Betriebes bedingt durch die Distribution, die Gliederung der verschiedenen gesellschaftlichen Klassen - und so kommt es denn, daß Feuerbach in Manchester z.B. nur Fabriken und Maschinen sieht, wo vor hundert Jahren nur Spinnräder und Webstühle zu sehen waren, oder in der Campagna di Roma nur Viehweiden und Sümpfe entdeckt, wo er zur Zeit des Augustus nichts als Weingärten und Villen römischer Kapitalisten gefunden hätte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 43-44
- id: I.51.4
  kind: p
  original: Feuerbach spricht namentlich von der Anschauung der Naturwissenschaft, er erwähnt Geheimnisse, die nur dem Auge des Physikers und Chemikers offenbar werden; aber wo wäre ohne Industrie und Handel die Naturwissenschaft?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '44'
- id: I.51.5
  kind: p
  original: Selbst diese "reine" Naturwissenschaft erhält ja ihren Zweck sowohl wie ihr Material erst durch Handel und Industrie, durch sinnliche Tätigkeit der Menschen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '44'
- id: I.51.6
  kind: p
  original: So sehr ist diese Tätigkeit, dieses fortwährende sinnliche Arbeiten und Schaffen, diese Produktion die Grundlage der ganzen sinnlichen Welt, wie sie jetzt existiert, daß, wenn sie auch nur für ein Jahr unterbrochen würde, Feuerbach eine ungeheure Veränderung nicht nur in der natürlichen Welt vorfinden, sondern auch die ganze Menschenwelt und sein eignes Anschauungsvermögen, ja seine Eigne Existenz sehr bald vermissen würde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '44'
- id: I.51.7
  kind: p
  original: Allerdings bleibt dabei die Priorität der äußeren Natur bestehen, und allerdings hat dies Alles keine Anwendung auf die ursprünglichen, durch generatio aequivoca <Urzeugung> erzeugten Menschen; aber diese Unterscheidung hat nur insofern Sinn, als man den Menschen als von der Natur unterschieden betrachtet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '44'
- id: I.51.8
  kind: p
  original: Übrigens ist diese der menschlichen Geschichte vorhergehende Natur ja nicht die Natur, in der Feuerbach lebt, nicht die Natur, die heutzutage, ausgenommen etwa auf einzelnen australischen Koralleninseln neueren Ursprungs, nirgends mehr existiert, also auch für Feuerbach nicht existiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '44'
- id: I.52.1
  kind: p
  original: Feuerbach hat allerdings den großen Vorzug vor den "reinen" Materialisten, daß er einsieht, wie auch der Mensch "sinnlicher Gegenstand" ist; aber abgesehen davon, daß er ihn nur als "sinnlichen Gegenstand", nicht als "sinnliche Tätigkeit" faßt, da er sich auch hierbei in der Theorie hält, die Menschen nicht in ihrem gegebenen gesellschaftlichen Zusammenhange, nicht unter ihren vorliegenden Lebensbedingungen, die sie zu Dem gemacht haben, was sie sind, auffaßt, so kommt er nie zu den wirklich existierenden, tätigen Menschen, sondern bleibt bei dem Abstraktum "der Mensch" stehen und bringt es nur dahin, den "wirklichen, individuellen, leibhaftigen Menschen" in der Empfindung anzuerkennen, d.h., er kennt keine andern "menschlichen Verhältnisse" "des Menschen zum Menschen", als Liebe und Freundschaft, und zwar idealisiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '44'
- id: I.52.2
  kind: p
  original: Gibt keine Kritik der jetzigen Lebensverhältnisse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '44'
- id: I.52.3
  kind: p
  original: Er kommt also nie dazu, die sinnliche Welt als die gesamte lebendige sinnliche Tätigkeit der sie ausmachenden Individuen aufzufassen, und ist daher gezwungen, wenn er z.B. statt gesunder Menschen einen Haufen skrofulöser, überarbeiteter und schwindsüchtiger Hungerleider sieht, da zu der "höheren Anschauung" und zur ideellen "Ausgleichung in der Gattung" seine Zuflucht zu nehmen, also gerade da in den Idealismus zurückzufallen, wo der kommunistische Materialist die Notwendigkeit und zugleich die Bedingung einer Umgestaltung sowohl der Industrie wie der gesellschaftlichen Gliederung sieht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 44-45
- id: I.53.1
  kind: p
  original: Soweit Feuerbach Materialist ist, kommt die Geschichte bei ihm nicht vor, und soweit er die Geschichte in Betracht zieht, ist er kein Materialist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '45'
- id: I.53.2
  kind: p
  original: Bei ihm fallen Materialismus und Geschichte ganz auseinander, was sich übrigens schon aus dem Gesagten erklärt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N15
  mew_page: '45'
- id: I.54.1
  kind: p
  original: 'Die Geschichte ist nichts als die Aufeinanderfolge der einzelnen Generationen, von denen Jede die ihr von allen vorhergegangenen übermachten Materiale, Kapitalien, Produktionskräfte exploitiert, daher also einerseits unter ganz veränderten Umständen die überkommene Tätigkeit fortsetzt und andrerseits mit einer ganz veränderten Tätigkeit die alten Umstände modifiziert, was sich nun spekulativ so verdrehen läßt, daß die spätere Geschichte zum Zweck der früheren gemacht wird, z.B., daß der Entdeckung Amerikas der Zweck zugrunde gelegt wird, der französischen Revolution zum Durchbruch zu verhelfen, wodurch dann die Geschichte ihre aparten Zwecke erhält und eine "Person neben anderen Personen" (als da sind: "Selbstbewußtsein, Kritik, Einziger" etc.) wird, während das, was man mit den Worten "Bestimmung", "Zweck", "Keim", "Idee" der früheren Geschichte bezeichnet, weiter nichts ist als eine Abstraktion von der späteren Geschichte, eine Abstraktion von dem aktiven Einfluß, den die frühere Geschichte auf die spätere ausübt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '45'
- id: I.55.1
  kind: p
  original: Je weiter sich im Laufe dieser Entwicklung nun die einzelnen Kreise, die aufeinander einwirken, ausdehnen, je mehr die ursprüngliche Abgeschlossenheit der einzelnen Nationalitäten durch die ausgebildete Produktionsweise, Verkehr und dadurch naturwüchsig hervorgebrachte Teilung der Arbeit zwischen verschiednen Nationen vernichtet wird, desto mehr wird die Geschichte zur Weltgeschichte, so daß z.B., wenn in England eine Maschine erfunden wird, die in Indien und China zahllose Arbeiter außer Brot setzt und die ganze Existenzform dieser Reiche umwälzt, diese Erfindung zu einem weltgeschichtlichen Faktum wird; oder daß der Zucker und Kaffee ihre weltgeschichtliche Bedeutung im neunzehnten Jahrhundert dadurch bewiesen, daß der durch das napoleonische Kontinentalsystem erzeugte Mangel an diesen Produkten die Deutschen zum Aufstande gegen Napoleon brachte und so die reale Basis der glorreichen Befreiungskriege von 1813 wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 45-46
- id: I.55.2
  kind: p
  original: Hieraus folgt, daß diese Umwandlung der Geschichte in Weltgeschichte nicht etwa eine bloße abstrakte Tat des "Selbstbewußtseins", Weltgeistes oder sonst eines metaphysischen Gespenstes ist, sondern eine ganz materielle, empirisch nachweisbare Tat, eine Tat, zu der jedes Individuum, wie es geht und steht, ißt, trinkt und sich kleidet, den Beweis liefert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '46'
- id: I.56.1
  kind: p
  original: Die Gedanken der herrschenden Klasse sind in jeder Epoche die herrschenden Gedanken, d.h. die Klasse, welche die herrschende materielle Macht der Gesellschaft ist, ist zugleich ihre herrschende geistige Macht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '46'
- id: I.56.2
  kind: p
  original: Die Klasse, die die Mittel zur materiellen Produktion zu ihrer Verfügung hat, disponiert damit zugleich über die Mittel zur geistigen Produktion, so daß ihr damit zugleich im Durchschnitt die Gedanken derer, denen die Mittel zur geistigen Produktion abgehen, unterworfen sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '46'
- id: I.56.3
  kind: p
  original: Die herrschenden Gedanken sind weiter Nichts als der ideelle Ausdruck der herrschenden materiellen Verhältnisse, die als Gedanken gefaßten herrschenden materiellen Verhältnisse; also der Verhältnisse, die eben die eine Klasse zur herrschenden machen, also die Gedanken ihrer Herrschaft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '46'
- id: I.56.4
  kind: p
  original: Die Individuen, welche die herrschende Klasse ausmachen, haben unter Anderm auch Bewußtsein und denken daher; insofern sie also als Klasse herrschen und den ganzen Umfang einer Geschichtsepoche bestimmen, versteht es sich von selbst, daß sie dies in ihrer ganzen Ausdehnung tun, also unter Andern auch als Denkende, als Produzenten von Gedanken herrschen, die Produktion und Distribution der Gedanken ihrer Zeit regeln; daß also ihre Gedanken die herrschenden Gedanken der Epoche sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '46'
- id: I.56.5
  kind: p
  original: Zu einer Zeit z.B. und in einem Lande, wo königliche Macht, Aristokratie und Bourgeoisie sich um die Herrschaft streiten, wo also die Herrschaft geteilt ist, zeigt sich als herrschender Gedanke die Doktrin von der Teilung der Gewalten, die nun als ein "ewiges Gesetz" ausgesprochen wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '46'
- id: I.57.1
  kind: p
  original: Die Teilung der Arbeit, die wir schon oben (p. [31-33]) als eine der Hauptmächte der bisherigen Geschichte vorfanden, äußert sich nun auch in der herrschenden Klasse als Teilung der geistigen und materiellen Arbeit, so daß innerhalb dieser Klasse der eine Teil als die Denker dieser Klasse auftritt (die aktiven konzeptiven Ideologen derselben, welche die Ausbildung der Illusion dieser Klasse über sich selbst zu ihrem Hauptnahrungszweige machen), während die Andern sich zu diesen Gedanken und Illusionen mehr passiv und rezeptiv verhalten, weil sie in der Wirklichkeit die aktiven Mitglieder dieser Klasse sind und weniger Zeit dazu haben, sich Illusionen und Gedanken über sich selbst zu machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 46-47
- id: I.57.2
  kind: p
  original: Innerhalb dieser Klasse kann diese Spaltung derselben sich sogar zu einer gewissen Entgegensetzung und Feindschaft beider Teile entwickeln, die aber bei jeder praktischen Kollision, wo die Klasse selbst gefährdet ist, von selbst wegfällt, wo denn auch der Schein verschwindet, als wenn die herrschenden Gedanken nicht die Gedanken der herrschenden Klasse wären und eine von der Macht dieser Klasse unterschiedene Macht hätten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '47'
- id: I.57.3
  kind: p
  original: Die Existenz revolutionärer Gedanken in einer bestimmten Epoche setzt bereits die Existenz einer revolutionären Klasse voraus, über deren Voraussetzungen bereits oben (p. [33-36]) das Nötige gesagt ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '47'
- id: I.58.1
  kind: p
  original: Löst man nun bei der Auffassung des geschichtlichen Verlaufs die Gedanken der herrschenden Klasse von der herrschenden Klasse los, verselbständigt man sie, bleibt dabei stehen, daß in einer Epoche diese und jene Gedanken geherrscht haben, ohne sich um die Bedingungen der Produktion und um die Produzenten dieser Gedanken zu bekümmern, läßt man also die den Gedanken zugrunde liegenden Individuen und Weltzustände weg, so kann man z.B. sagen, daß während der Zeit, in der die Aristokratie herrschte, die Begriffe Ehre, Treue etc., während der Herrschaft der Bourgeoisie die Begriffe Freiheit, Gleichheit etc. herrschten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N16
  mew_page: '47'
- id: I.58.2
  kind: p
  original: Die herrschende Klasse selbst bildet sich dies im Durchschnitt ein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '47'
- id: I.58.3
  kind: p
  original: Diese Geschichtsauffassung, die allen Geschichtschreibern vorzugsweise seit dem achtzehnten Jahrhundert gemeinsam ist, wird notwendig auf das Phänomen stoßen, daß immer abstraktere Gedanken herrschen, d.h. Gedanken, die immer mehr die Form der Allgemeinheit annehmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '47'
- id: I.58.4
  kind: p
  original: 'Jede neue Klasse nämlich, die sich an die Stelle einer vor ihr herrschenden setzt, ist genötigt, schon um ihren Zweck durchzuführen, ihr Interesse als das gemeinschaftliche Interesse aller Mitglieder der Gesellschaft darzustellen, d.h. ideell ausgedrückt: ihren Gedanken die Form der Allgemeinheit zu geben, sie als die einzig vernünftigen, allgemein gültigen darzustellen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '47'
- id: I.58.5
  kind: p
  original: Die revolutionierende Klasse tritt von vornherein, schon weil sie einer Klasse gegenübersteht, nicht als Klasse, sondern als Vertreterin der ganzen Gesellschaft auf, sie erscheint als die ganze Masse der Gesellschaft gegenüber der einzigen, herrschenden Klasse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N17
  mew_page: 47-48
- id: I.58.6
  kind: p
  original: Sie kann dies, weil im Anfange ihr Interesse wirklich noch mehr mit dem gemeinschaftlichen Interesse aller übrigen nichtherrschenden Klassen zusammenhängt, sich unter dem Druck der bisherigen Verhältnisse noch nicht als besonderes Interesse einer besonderen Klasse entwickeln konnte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '48'
- id: I.58.7
  kind: p
  original: Ihr Sieg nutzt daher auch vielen Individuen der übrigen, nicht zur Herrschaft kommenden Klassen, aber nur insofern, als er diese Individuen jetzt in den Stand setzt, sich in die herrschende Klasse zu erheben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '48'
- id: I.58.8
  kind: p
  original: Als die französische Bourgeoisie die Herrschaft der Aristokratie stürzte, machte sie es dadurch vielen Proletariern möglich, sich über das Proletariat zu erheben, aber nur, insofern sie Bourgeois wurden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '48'
- id: I.58.9
  kind: p
  original: Jede neue Klasse bringt daher nur auf einer breiteren Basis als die der bisher herrschenden ihre Herrschaft zustande, wogegen sich dann später auch der Gegensatz der nichtherrschenden gegen die nun herrschende Klasse um so schärfer und tiefer entwickelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '48'
- id: I.58.10
  kind: p
  original: Durch Beides ist bedingt, daß der gegen diese neue herrschende Klasse zu führende Kampf wiederum auf eine entschiedenere, radikalere Negation der bisherigen Gesellschaftszustände hinarbeitet, als alle bisherigen die Herrschaft anstrebenden Klassen dies tun konnten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '48'
- id: I.59.1
  kind: p
  original: Dieser ganze Schein, als ob die Herrschaft einer bestimmten Klasse nur die Herrschaft gewisser Gedanken sei, hört natürlich von selbst auf, sobald die Herrschaft von Klassen überhaupt aufhört, die Form der gesellschaftlichen Ordnung zu sein, sobald es also nicht mehr nötig ist, ein besonderes Interesse als allgemeines oder "das Allgemeine" als herrschend darzustellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '48'
- id: I.60.1
  kind: p
  original: Nachdem einmal die herrschenden Gedanken von den herrschenden Individuen und vor allem von den Verhältnissen, die aus einer gegebnen Stufe der Produktionsweise hervorgehn, getrennt sind und dadurch das Resultat zustande gekommen ist, daß in der Geschichte stets Gedanken herrschen, ist es sehr leicht, aus diesen verschiedenen Gedanken sich " den Gedanken", die Idee etc. als das in der Geschichte Herrschende zu abstrahieren und damit alle diese einzelnen Gedanken und Begriffe als "Selbstbestimmungen" des sich in der Geschichte entwickelnden Begriffs zu fassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '48'
- id: I.60.2
  kind: p
  original: Es ist dann auch natürlich, daß alle Verhältnisse der Menschen aus dem Begriff des Menschen, dem vorgestellten Menschen, dem Wesen des Menschen, dem Menschen abgeleitet werden können.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '48'
- id: I.60.3
  kind: p
  original: Dies hat die spekulative Philosophie getan.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '48'
- id: I.60.4
  kind: p
  original: Hegel gesteht selbst am Ende der "Geschichtsphilosophie", daß er "den Fortgang des Begriffs allein betrachtet" und in der Geschichte die "wahrhafte Theodizee " dargestellt habe (p. 446).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 48-49
- id: I.60.5
  kind: p
  original: Man kann nun wieder auf die Produzenten "des Begriffs" zurückgehen, auf die Theoretiker, Ideologen und Philosophen, und kommt dann zu dem Resultate, daß die Philosophen, die Denkenden als solche, von jeher in der Geschichte geherrscht haben - ein Resultat, was, wie wir sehen, auch schon von Hegel ausgesprochen wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: I.60.6
  kind: p
  original: Das ganze Kunststück also, in der Geschichte die Oberherrlichkeit des Geistes (Hierarchie bei Stirner) nachzuweisen, beschränkt sich auf folgende drei Efforts.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: I.61.1
  kind: p
  original: Nr. 1. Man muß die Gedanken der aus empirischen Gründen, unter empirischen Bedingungen und als materielle Individuen Herrschenden von diesen Herrschenden trennen und somit die Herrschaft von Gedanken oder Illusionen in der Geschichte anerkennen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: I.62.1
  kind: p
  original: Nr. 2. Man muß in diese Gedankenherrschaft eine Ordnung bringen, einen mystischen Zusammenhang unter den aufeinanderfolgenden herrschenden Gedanken nachweisen, was dadurch zustande gebracht wird, daß man sie als "Selbstbestimmungen des Begriffs" faßt (dies ist deshalb möglich, weil diese Gedanken vermittelst ihrer empirischen Grundlage wirklich miteinander zusammenhängen und weil sie als bloße Gedanken gefaßt zu Selbstunterscheidungen, vom Denken gemachten Unterschieden, werden).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: I.63.1
  kind: p
  original: Nr. 3. Um das mystische Aussehen dieses "sich selbst bestimmenden Begriffs" zu beseitigen, verwandelt man ihn in eine Person - "das Selbstbewußtsein" - oder, um recht materialistisch zu erscheinen, in eine Reihe von Personen, die "den Begriff" in der Geschichte repräsentieren, in "die Denkenden", die "Philosophen" die Ideologen, die nun wieder als die Fabrikanten der Geschichte, als "der Rat der Wächter", als die Herrschenden gefaßt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N18
  mew_page: '49'
- id: I.63.2
  kind: p
  original: Hiermit hat man sämtliche materialistischen Elemente aus der Geschichte beseitigt und kann nun seinem spekulativen Roß ruhig die Zügel schießen lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: I.64.1
  kind: p
  original: Während im gewöhnlichen Leben jeder Shopkeeper <Krämer> sehr wohl zwischen Dem zu unterscheiden weiß, was Jemand zu sein vorgibt, und dem, was er wirklich ist, so ist unsre Geschichtschreibung noch nicht zu dieser trivialen Erkenntnis gekommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: I.64.2
  kind: p
  original: Sie glaubt jeder Epoche aufs Wort, was sie von sich selbst sagt und sich einbildet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: I.65.1
  kind: p
  original: Es muß diese Geschichtsmethode, die in Deutschland, und warum vorzüglich, herrschte, entwickelt werden aus dem Zusammenhang mit der Illusion der Ideologen überhaupt, z.B. den Illusionen der Juristen, Politiker (auch der praktischen Staatsmänner darunter), aus den dogmatischen Träumereien und Verdrehungen dieser Kerls, die sich ganz einfach erklärt aus ihrer praktischen Lebensstellung, ihrem Geschäft und der Teilung der Arbeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 49-50
- id: I.66.1
  kind: heading
  original: '[B. Die wirkliche Basis der Ideologie] [1.] Verkehr und Produktivkraft'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: I.67.1
  kind: p
  original: Die größte Teilung der materiellen und geistigen Arbeit ist die Trennung von Stadt und Land.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: I.67.2
  kind: p
  original: Der Gegensatz zwischen Stadt und Land fängt an mit dem Übergange aus der Barbarei in die Zivilisation, aus dem Stammwesen in den Staat, aus der Lokalität in die Nation, und zieht sich durch die ganze Geschichte der Zivilisation bis auf den heutigen Tag (die Anti-Corn-Law League) hindurch.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: I.67.3
  kind: p
  original: '- Mit der Stadt ist zugleich die Notwendigkeit der Administration, der Polizei, der Steuern usw., kurz des Gemeindewesens und damit der Politik überhaupt gegeben.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: I.67.4
  kind: p
  original: Hier zeigte sich zuerst die Teilung der Bevölkerung in zwei große Klassen, die direkt auf der Teilung der Arbeit und den Produktionsinstrumenten beruht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: I.67.5
  kind: p
  original: Die Stadt ist bereits die Tatsache der Konzentration der Bevölkerung, der Produktionsinstrumente, des Kapitals, der Genüsse, der Bedürfnisse, während das Land gerade die entgegengesetzte Tatsache, die Isolierung und Vereinzelung, zur Anschauung bringt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: I.67.6
  kind: p
  original: Der Gegensatz zwischen Stadt und Land kann nur innerhalb des Privateigentums existieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: I.67.7
  kind: p
  original: Er ist der krasseste Ausdruck der Subsumtion des Individuums unter die Teilung der Arbeit, unter eine bestimmte, ihm aufgezwungene Tätigkeit, eine Subsumtion, die den Einen zum bornierten Stadttier, den Andern zum bornierten Landtier macht und den Gegensatz der Interessen Beider täglich neu erzeugt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: I.67.8
  kind: p
  original: Die Arbeit ist hier wieder die Hauptsache, die Macht über den Individuen, und solange diese existiert, solange muß das Privateigentum existieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: I.67.9
  kind: p
  original: Die Aufhebung des Gegensatzes von Stadt und Land ist eine der ersten Bedingungen der Gemeinschaft, eine Bedingung, die wieder von einer Masse materieller Voraussetzungen abhängt und die der bloße Wille nicht erfüllen kann, wie Jeder auf den ersten Blick sieht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: I.67.10
  kind: p
  original: (Diese Bedingungen müssen noch entwickelt werden.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: I.67.11
  kind: p
  original: Die Trennung von Stadt und Land kann auch gefaßt werden als die Trennung von Kapital und Grundeigentum, als der Anfang einer vom Grundeigentum unabhängigen Existenz und Entwicklung des Kapitals, eines Eigentums, das bloß in der Arbeit und im Austausch seine Basis hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: I.68.1
  kind: p
  original: In den Städten, welche im Mittelalter nicht aus der früheren Geschichte fertig überliefert waren, sondern sich neu aus den freigewordnen Leibeignen bildeten, war die besondre Arbeit eines Jeden sein einziges Eigentum außer dem kleinen, fast nur im nötigsten Handwerkszeug bestehenden Kapital, das er mitbrachte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 50-51
- id: I.68.2
  kind: p
  original: Die Konkurrenz der fortwährend in die Stadt kommenden entlaufenen Leibeigenen, der fortwährende Krieg des Landes gegen die Städte und damit die Notwendigkeit einer organisierten städtischen Kriegsmacht, das Band des gemeinsamen Eigentums an einer bestimmten Arbeit, die Notwendigkeit gemeinsamer Gebäude zum Verkauf ihrer Waren zu einer Zeit, wo die Handwerker zugleich commerçants <Kaufleute>, und die damit gegebene Ausschließung Unberufener von diesen Gebäuden, der Gegensatz der Interessen der einzelnen Handwerke unter sich, die Notwendigkeit eines Schutzes der mit Mühe erlernten Arbeit und die feudale Organisation des ganzen Landes waren die Ursachen der Vereinigung der Arbeiter eines jeden Handwerks in Zünften.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
- id: I.68.3
  kind: p
  original: Wir haben hier auf die vielfachen Modifikationen des Zunftwesens, die durch spätere historische Entwicklungen hereinkommen, nicht weiter einzugehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
- id: I.68.4
  kind: p
  original: Die Flucht der Leibeignen in die Städte fand während des ganzen Mittelalters ununterbrochen statt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
- id: I.68.5
  kind: p
  original: Diese Leibeignen, auf dem Lande von ihren Herren verfolgt, kamen einzeln in die Städte, wo sie eine organisierte Gemeinde vorfanden, gegen die sie machtlos waren und worin sie sich der Stellung unterwerfen mußten, die ihnen das Bedürfnis nach ihrer Arbeit und das Interesse ihrer organisierten städtischen Konkurrenten anwies.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
- id: I.68.6
  kind: p
  original: Diese einzeln hereinkommenden Arbeiter konnten es nie zu einer Macht bringen, da, wenn ihre Arbeit eine zunftmäßige war, die erlernt werden mußte, die Zunftmeister sie sich unterwarfen und nach ihrem Interesse organisierten, oder, wenn ihre Arbeit nicht erlernt werden mußte, daher keine zunftmäßige, sondern Taglöhnerarbeit war, nie zu einer Organisation kamen, sondern unorganisierter Pöbel blieben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
- id: I.68.7
  kind: p
  original: Die Notwendigkeit der Taglöhnerarbeit in den Städten schuf den Pöbel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
- id: I.69.1
  kind: p
  original: Diese Städte waren wahre "Vereine", hervorgerufen durch das unmittelbare Bedürfnis, die Sorge um den Schutz des Eigentums, und um die Produktionsmittel und Verteidigungsmittel der einzelnen Mitglieder zu multiplizieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
- id: I.69.2
  kind: p
  original: Der Pöbel dieser Städte war dadurch, daß er aus einander fremden, vereinzelt hereingekommenen Individuen bestand, die einer organisierten, kriegsmäßig gerüsteten, sie eifersüchtig überwachenden Macht unorganisiert gegenüberstanden, aller Macht beraubt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
- id: I.69.3
  kind: p
  original: Die Gesellen und Lehrlinge waren in jedem Handwerk so organisiert, wie es dem Interesse der Meister am besten entsprach; das patriarchalische Verhältnis, in dem sie zu ihren Meistern standen, gab diesen eine doppelte Macht, einerseits in ihrem direkten Einfluß auf das ganze Leben der Gesellen und dann, weil es für die Gesellen, die bei demselben Meister arbeiteten, ein wirkliches Band war, das sie gegenüber den Gesellen der übrigen Meister zusammenhielt und sie von diesen trennte; und endlich waren die Gesellen schon durch das Interesse, das sie hatten, selbst Meister zu werden, an die bestehende Ordnung geknüpft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 51-52
- id: I.69.4
  kind: p
  original: Während daher der Pöbel es wenigstens zu Emeuten gegen die ganze städtische Ordnung brachte, die indes bei seiner Machtlosigkeit ohne alle Wirkung blieben, kamen die Gesellen nur zu kleinen Widersetzlichkeiten innerhalb einzelner Zünfte, wie sie zur Existenz des Zunftwesens selbst gehören.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: I.69.5
  kind: p
  original: Die großen Aufstände des Mittelalters gingen alle vom Lande aus, blieben aber ebenfalls wegen der Zersplitterung und der daraus folgenden Roheit der Bauern total erfolglos.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: I.70.1
  kind: p
  original: Die Teilung der Arbeit war in den Städten zwischen den einzelnen Zünften noch [ganz naturwüchsig] und in den Zünften selbst zwischen den einzelnen Arbeitern gar nicht durchgeführt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: I.70.2
  kind: p
  original: Jeder Arbeiter mußte in einem ganzen Kreise von Arbeiten bewandert sein, mußte Alles machen können, was mit seinen Werkzeugen zu machen war; der beschränkte Verkehr und die geringe Verbindung der einzelnen Städte unter sich, der Mangel an Bevölkerung und die Beschränktheit der Bedürfnisse ließen keine weitere Teilung der Arbeit aufkommen, und daher mußte Jeder, der Meister werden wollte, seines ganzen Handwerks mächtig sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: I.70.3
  kind: p
  original: Daher findet sich bei den mittelalterlichen Handwerkern noch ein Interesse an ihrer speziellen Arbeit und an der Geschicklichkeit darin, das sich bis zu einem gewissen bornierten Kunstsinn steigern konnte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: I.70.4
  kind: p
  original: Daher ging aber auch jeder mittelalterliche Handwerker ganz in seiner Arbeit auf, hatte ein gemütliches Knechtschaftsverhältnis zu ihr und war viel mehr als der moderne Arbeiter, dem seine Arbeit gleichgültig ist, unter sie subsumiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: I.71.1
  kind: p
  original: Das Kapital in diesen Städten war ein naturwüchsiges Kapital, das in der Wohnung, den Handwerkszeugen und der naturwüchsigen, erblichen Kundschaft bestand und sich wegen des unentwickelten Verkehrs und der mangelnden Zirkulation als unrealisierbar vom Vater auf den Sohn forterben mußte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: I.71.2
  kind: p
  original: Dies Kapital war nicht, wie das moderne, ein in Geld abzuschätzendes, bei. dem es gleichgültig ist, ob es in dieser oder jener Sache steckt, sondern ein unmittelbar mit der bestimmten Arbeit des Besitzers zusammenhängendes, von ihr gar nicht zu trennendes, und insofern ständisches Kapital.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: I.72.1
  kind: p
  original: Die nächste Ausdehnung der Teilung der Arbeit war die Trennung von Produktion und Verkehr, die Bildung einer besondern Klasse von Kaufleuten, eine Trennung, die in den historisch überlieferten Städten (u. a. mit den Juden) mit überkommen war und in den neugebildeten sehr bald eintrat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: I.72.2
  kind: p
  original: Hiermit war die Möglichkeit einer über den nächsten Umkreis hinausgehenden Handelsverbindung gegeben, eine Möglichkeit, deren Ausführung von den bestehenden Kommunikationsmitteln, dem durch die politischen Verhältnisse bedingten Stande der öffentlichen Sicherheit auf dem Lande (im ganzen Mittelalter zogen bekanntlich die Kaufleute in bewaffneten Karawanen herum) und von den durch die jedesmalige Kulturstufe bedingten roheren oder entwickelteren Bedürfnissen des dem Verkehr zugänglichen Gebietes abhing.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
- id: I.73.1
  kind: p
  original: Mit dem in einer besonderen Klasse konstituierten Verkehr, mit der Ausdehnung des Handels durch die Kaufleute über die nächste Umgebung der Stadt hinaus, tritt sogleich eine Wechselwirkung zwischen der Produktion und dem Verkehr ein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
- id: I.73.2
  kind: p
  original: Die Städte treten miteinander in Verbindung, es werden neue Werkzeuge aus einer Stadt in die andre gebracht, und die Teilung zwischen Produktion und Verkehr ruft bald eine neue Teilung der Produktion zwischen den einzelnen Städten hervor, deren Jede bald einen vorherrschenden Industriezweig exploitiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
- id: I.73.3
  kind: p
  original: Die anfängliche Beschränkung auf die Lokalität fängt an, allmählich aufgelöst zu werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
- id: I.74.1
  kind: p
  original: Die Bürger in jeder Stadt waren im Mittelalter gezwungen, sich gegen den Landadel zu vereinigen, um sich ihrer Haut zu wehren; die Ausdehnung des Handels, die Herstellung der Kommunikationen führte die einzelnen Städte dazu, andere Städte kennenzulernen, die dieselben Interessen im Kampfe mit demselben Gegensatz durchgesetzt hatten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
- id: I.74.2
  kind: p
  original: Aus den vielen lokalen Bürgerschaften der einzelnen Städte entstand erst sehr allmählich die Bürgerklasse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
- id: I.74.3
  kind: p
  original: Die Lebensbedingungen der einzelnen Bürger wurden durch den Gegensatz gegen die bestehenden Verhältnisse und durch die davon bedingte Art der Arbeit zugleich zu Bedingungen, welche ihnen allen gemeinsam und von jedem einzelnen unabhängig waren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
- id: I.74.4
  kind: p
  original: Die Bürger hatten diese Bedingungen geschaffen, insofern sie sich von dem feudalen Verbande losgerissen hatten, und waren von ihnen geschaffen, insofern sie durch ihren Gegensatz gegen die Feudalität, die sie vorfanden, bedingt waren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
- id: I.74.5
  kind: p
  original: Mit dem Eintreten der Verbindung zwischen den einzelnen Städten entwickelten sich diese gemeinsamen Bedingungen zu Klassenbedingungen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
- id: I.74.6
  kind: p
  original: Dieselben Bedingungen, derselbe Gegensatz, dieselben Interessen mußten im Ganzen und Großen auch überall gleiche Sitten hervorrufen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
- id: I.74.7
  kind: p
  original: Die Bourgeoisie selbst entwickelt sich erst mit ihren Bedingungen allmählich, spaltet sich nach der Teilung der Arbeit wieder in verschiedene Fraktionen und absorbiert endlich alle vorgefundenen besitzenden Klassen in sich (während sie die Majorität der vorgefundenen besitzlosen und einen Teil der bisher besitzenden Klassen zu einer neuen Klasse, dem Proletariat, entwickelt), in dem Maße, als alles vorgefundene Eigentum in industrielles oder kommerzielles Kapital umgewandelt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N19
  mew_page: 53-54
- id: I.74.8
  kind: p
  original: Die einzelnen Individuen bilden nur insofern eine Klasse, als sie einen gemeinsamen Kampf gegen eine andre Klasse zu führen haben; im übrigen stehen sie einander selbst in der Konkurrenz wieder feindlich gegenüber.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: I.74.9
  kind: p
  original: Auf der andern Seite verselbständigt sich die Klasse wieder gegen die Individuen, so daß diese ihre Lebensbedingungen prädestiniert vorfinden, von der Klasse ihre Lebensstellung und damit ihre Persönliche Entwicklung angewiesen bekommen, unter sie subsumiert werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: I.74.10
  kind: p
  original: Dies ist dieselbe Erscheinung wie die Subsumtion der einzelnen Individuen unter die Teilung der Arbeit und kann nur durch die Aufhebung des Privateigentums und der Arbeit selbst beseitigt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: I.74.11
  kind: p
  original: Wie diese Subsumtion der Individuen unter die Klasse sich zugleich zu einer Subsumtion unter allerlei Vorstellungen pp. entwickelt, haben wir bereits mehrere Male angedeutet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: I.75.1
  kind: p
  original: Es hängt lediglich von der Ausdehnung des Verkehrs ab, ob die in einer Lokalität gewonnenen Produktivkräfte, namentlich Erfindungen, für die spätere Entwicklung verlorengehen oder nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: I.75.2
  kind: p
  original: Solange noch kein über die unmittelbare Nachbarschaft hinausgehender Verkehr existiert, muß jede Erfindung in jeder Lokalität besonders gemacht werden, und bloße Zufälle, wie Irruptionen barbarischer Völker, selbst gewöhnliche Kriege, reichen hin, ein Land mit entwickelten Produktivkräften und Bedürfnissen dahin zu bringen, daß es wieder von vorne anfangen muß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: I.75.3
  kind: p
  original: In der anfänglichen Geschichte mußte jede Erfindung täglich neu und in jeder Lokalität unabhängig gemacht werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: I.75.4
  kind: p
  original: Wie wenig ausgebildete Produktivkräfte selbst bei einem verhältnismäßig sehr ausgedehnten Handel vor dem gänzlichen Untergange sicher sind, beweisen die Phönizier, deren Erfindungen zum größten Teil durch die Verdrängung dieser Nation aus dem Handel, die Eroberung Alexanders und den daraus folgenden Verfall auf lange Zeit verlorengingen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: I.75.5
  kind: p
  original: Ebenso im Mittelalter die Glasmalerei z.B. Erst wenn der Verkehr zum Weltverkehr geworden ist und die große Industrie zur Basis hat, alle Nationen in den Konkurrenzkampf hereingezogen sind, ist die Dauer der gewonnenen Produktivkräfte gesichert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: I.76.1
  kind: p
  original: Die Teilung der Arbeit zwischen den verschiedenen Städten hatte zur nächsten Folge das Entstehen der Manufakturen, der dem Zunftwesen entwachsenen Produktionszweige.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: I.76.2
  kind: p
  original: Das erste Aufblühen der Manufakturen - in Italien und später in Flandern - hatte den Verkehr mit auswärtigen Nationen zu seiner historischen Voraussetzung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 54-55
- id: I.76.3
  kind: p
  original: In andern Ländern - England und Frankreich z.B. - beschränkten die Manufakturen sich anfangs auf den inländischen Markt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
- id: I.76.4
  kind: p
  original: Die Manufakturen haben außer den angegebenen Voraussetzungen noch eine schon fortgeschrittene Konzentration der Bevölkerung - namentlich auf dem Lande - und des Kapitals, das sich teils in den Zünften trotz der Zunftgesetze, teils bei den Kaufleuten in einzelnen Händen zu sammeln anfing, zur Voraussetzung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
- id: I.77.1
  kind: p
  original: Diejenige Arbeit, die von vornherein eine Maschine, wenn auch noch in der rohsten Gestalt, voraussetzte, zeigte sich sehr bald als die entwicklungsfähigste.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
- id: I.77.2
  kind: p
  original: Die Weberei, bisher auf dem Lande von den Bauern nebenbei betrieben, um sich ihre nötige Kleidung zu verschaffen, war die erste Arbeit, welche durch die Ausdehnung des Verkehrs einen Anstoß und eine weitere Ausbildung erhielt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
- id: I.77.3
  kind: p
  original: Die Weberei war die erste und blieb die hauptsächlichste Manufaktur.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
- id: I.77.4
  kind: p
  original: Die mit der steigenden Bevölkerung steigende Nachfrage nach Kleidungsstoffen, die beginnende Akkumulation und Mobilisation des naturwüchsigen Kapitals durch die beschleunigte Zirkulation, das hierdurch hervorgerufene und durch die allmähliche Ausdehnung des Verkehrs überhaupt begünstigte Luxusbedürfnis gaben der Weberei quantitativ und qualitativ einen Anstoß, der sie aus der bisherigen Produktionsform herausriß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
- id: I.77.5
  kind: p
  original: Neben den zum Selbstgebrauch webenden Bauern, die fortbestehen blieben und noch fortbestehen, kam eine neue Klasse von Webern in den Städten auf, deren Gewebe für den ganzen heimischen Markt und meist auch für auswärtige Märkte bestimmt waren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
- id: I.78.1
  kind: p
  original: Die Weberei, eine in den meisten Fällen wenig Geschicklichkeit erfordernde und bald in unendlich viele Zweige zerfallende Arbeit, widerstrebte ihrer ganzen Beschaffenheit nach den Fesseln der Zunft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
- id: I.78.2
  kind: p
  original: Die Weberei wurde daher auch meist in Dörfern und Marktflecken ohne zünftige Organisation betrieben, die allmählich zu Städten, und zwar bald zu den blühendsten Städten jedes Landes wurden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
- id: I.79.1
  kind: p
  original: Mit der zunftfreien Manufaktur veränderten sich sogleich auch die Eigentumsverhältnisse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
- id: I.79.2
  kind: p
  original: Der erste Fortschritt über das naturwüchsig-ständische Kapital hinaus war durch das Aufkommen der Kaufleute gegeben, deren Kapital von vornherein mobil, Kapital im modernen Sinne war, soweit davon unter den damaligen Verhältnissen die Rede sein kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
- id: I.79.3
  kind: p
  original: Der zweite Fortschritt kam mit der Manufaktur, die wieder eine Masse des naturwüchsigen Kapitals mobilisierte und überhaupt die Masse des mobilen Kapitals gegenüber der des naturwüchsigen vermehrte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
- id: I.80.1
  kind: p
  original: Die Manufaktur wurde zugleich eine Zuflucht der Bauern gegen die sie ausschließenden oder schlecht bezahlenden Zünfte, wie früher die Zunftstädte den Bauern als Zuflucht gegen [den sie bedrückenden Landadel gedient] hatten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 55-56
- id: I.81.1
  kind: p
  original: Mit dem Anfange der Manufakturen gleichzeitig war eine Periode des Vagabundentums, veranlaßt durch das Aufhören der feudalen Gefolgschaften, die Entlassung der zusammengelaufenen Armeen, die den Königen gegen die Vasallen gedient hatten, durch verbesserten Ackerbau und Verwandlung von großen Streifen Ackerlandes in Viehweiden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: I.81.2
  kind: p
  original: Schon hieraus geht hervor, wie dies Vagabundentum genau mit der Auflösung der Feudalität zusammenhängt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: I.81.3
  kind: p
  original: Schon im dreizehnten Jahrhundert kommen einzelne Epochen dieser Art vor, allgemein und dauernd tritt dies Vagabundentum erst mit dem Ende des 15. und Anfang des 16. Jahrhunderts hervor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: I.81.4
  kind: p
  original: Diese Vagabunden, die so zahlreich waren, daß u.a.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: I.81.5
  kind: p
  original: Heinrich VIII. von England ihrer 72 000 hängen ließ, wurden nur mit den größten Schwierigkeiten und durch die äußerste Not und erst nach langem Widerstreben dahin gebracht, daß sie arbeiteten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: I.81.6
  kind: p
  original: Das rasche Aufblühen der Manufakturen, namentlich in England, absorbierte sie allmählich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: I.82.1
  kind: p
  original: Mit der Manufaktur traten die verschiedenen Nationen in ein Konkurrenzverhältnis, in den Handelskampf, der in Kriegen, Schutzzöllen und Prohibitionen durchgekämpft wurde, während früher die Nationen, soweit sie in Verbindung waren, einen harmlosen Austausch miteinander verführt hatten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: I.82.2
  kind: p
  original: Der Handel hat von nun an politische Bedeutung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: I.83.1
  kind: p
  original: Mit der Manufaktur war zugleich ein verändertes Verhältnis des Arbeiters zum Arbeitgeber gegeben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: I.83.2
  kind: p
  original: In den Zünften existierte das patriarchalische Verhältnis zwischen Gesellen und Meister fort; in der Manufaktur trat an seine Stelle das Geldverhältnis zwischen Arbeiter und Kapitalist; ein Verhältnis, das auf dem Lande und in kleinen Städten patriarchalisch tingiert blieb, in den größeren, eigentlichen Manufakturstädten jedoch schon früh fast alle patriarchalische Färbung verlor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: I.84.1
  kind: p
  original: Die Manufaktur und überhaupt die Bewegung der Produktion erhielt einen enormen Aufschwung durch die Ausdehnung des Verkehrs, welche mit der Entdeckung Amerikas und des Seeweges nach Ostindien eintrat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: I.84.2
  kind: p
  original: Die neuen, von dort importierten Produkte, namentlich die Massen von Gold und Silber, die in Zirkulation kamen, die Stellung der Klassen gegeneinander total veränderten und dem feudalen Grundeigentum und den Arbeitern einen harten Stoß gaben, die Abenteurerzüge, Kolonisation und vor Allem die jetzt möglich gewordene und täglich sich mehr und mehr herstellende Ausdehnung der Märkte zum Weltmarkt riefen eine neue Phase der geschichtlichen Entwicklung hervor, auf welche im Allgemeinen hier nicht weiter einzugehen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 56-57
- id: I.84.3
  kind: p
  original: Durch die Kolonisation der neuentdeckten Länder erhielt der Handelskampf der Nationen gegeneinander neue Nahrung und demgemäß größere Ausdehnung und Erbitterung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: I.85.1
  kind: p
  original: Die Ausdehnung des Handels und der Manufaktur beschleunigten die Akkumulation des mobilen Kapitals, während in den Zünften, die keinen Stimulus zur erweiterten Produktion erfuhren, das naturwüchsige Kapital stabil blieb oder gar abnahm.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: I.85.2
  kind: p
  original: Handel und Manufaktur schufen die große Bourgeoisie, in den Zünften konzentrierte sich die Kleinbürgerschaft, die nun nicht mehr wie früher in den Städten herrschte, sondern der Herrschaft der großen Kaufleute und Manufacturiers sich beugen mußte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N20
  mew_page: '57'
- id: I.85.3
  kind: p
  original: Daher der Verfall der Zünfte, sobald sie mit der Manufaktur in Berührung kam[en].
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: I.86.1
  kind: p
  original: Das Verhältnis der Nationen untereinander in ihrem Verkehr nahm während der Epoche, von der wir gesprochen haben, zwei verschiedene Gestalten an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: I.86.2
  kind: p
  original: Im Anfange bedingte die geringe zirkulierende Quantität des Goldes und Silbers das Verbot der Ausfuhr dieser Metalle; und die durch die Notwendigkeit der Beschäftigung für die wachsende städtische Bevölkerung nötig gewordene, meist vom Auslande importierte Industrie konnte der Privilegien nicht entbehren, die natürlich nicht nur gegen inländische, sondern hauptsächlich gegen auswärtige Konkurrenz gegeben werden konnten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: I.86.3
  kind: p
  original: Das lokale Zunftprivilegium wurde in diesen ursprünglichen Prohibitionen auf die ganze Nation erweitert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: I.86.4
  kind: p
  original: Die Zölle entstanden aus den Abgaben, die die Feudalherren den ihr Gebiet durchziehenden Kaufleuten als Abkauf der Plünderung auflegten, Abgaben, die später von den Städten ebenfalls auferlegt wurden und die beim Aufkommen der modernen Staaten das zunächstliegende Mittel für den Fiskus waren, um Geld zu bekommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: I.87.1
  kind: p
  original: Die Erscheinung des amerikanischen Goldes und Silbers auf den europäischen Märkten, die allmähliche Entwicklung der Industrie, der rasche Aufschwung des Handels und das hierdurch hervorgerufene Aufblühen der nichtzünftigen Bourgeoisie und des Geldes gab diesen Maßregeln eine andre Bedeutung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: I.87.2
  kind: p
  original: Der Staat, der des Geldes täglich weniger entbehren konnte, behielt nun das Verbot der Gold- und Silberausfuhr aus fiskalischen Rücksichten bei; die Bourgeois, für die diese neu auf den Markt geschleuderten Geldmassen der Hauptgegenstand des Akkaparements <wucherischen Ankaufs> war, waren damit vollständig zufrieden; die bisherigen Privilegien wurden eine Einkommenquelle für die Regierung und für Geld verkauft; in der Zollgesetzgebung kamen die Ausfuhrzölle auf, die, der Industrie nur ein Hindernis in den Weg [legend), einen rein fiskalischen Zweck hatten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 57-58
- id: I.88.1
  kind: p
  original: Die zweite Periode trat mit der Mitte des siebzehnten Jahrhunderts ein und dauerte fast bis zum Ende des achtzehnten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: I.88.2
  kind: p
  original: Der Handel und die Schiffahrt hatten sich rascher ausgedehnt als die Manufaktur, die eine sekundäre Rolle spielte; die Kolonien fingen an, starke Konsumenten zu werden, die einzelnen Nationen teilten sich durch lange Kämpfe in den sich öffnenden Weltmarkt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: I.88.3
  kind: p
  original: Diese Periode beginnt mit den Navigationsgesetzen und Kolonialmonopolen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: I.88.4
  kind: p
  original: Die Konkurrenz der Nationen untereinander wurde durch Tarife, Prohibitionen, Traktate möglichst ausgeschlossen; und in letzter Instanz wurde der Konkurrenzkampf durch Kriege (besonders Seekriege) geführt und entschieden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: I.88.5
  kind: p
  original: Die zur See mächtigste Nation, die Engländer, behielten das Übergewicht im Handel und der Manufaktur.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: I.88.6
  kind: p
  original: Schon hier die Konzentration auf Ein Land.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: I.89.1
  kind: p
  original: Die Manufaktur war fortwährend durch Schutzzölle im heimischen Markte, im Kolonialmarkte durch Monopole und im auswärtigen möglichst viel durch Differentialzölle geschützt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: I.89.2
  kind: p
  original: Die Bearbeitung des im Lande selbst erzeugten Materials wurde begünstigt (Wolle und Leinen in England, Seide in Frankreich), die Ausfuhr des im Inlande erzeugten Rohmaterials verboten (Wolle in England) und die [Bearbeitung] des importierten vernachlässigt oder unterdrückt (Baumwolle in England).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: I.89.3
  kind: p
  original: Die im Seehandel und der Kolonialmacht vorherrschende Nation sicherte sich natürlich auch die größte quantitative und qualitative Ausdehnung der Manufaktur.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: I.89.4
  kind: p
  original: Die Manufaktur konnte überhaupt des Schutzes nicht entbehren, da sie durch die geringste Veränderung, die in andern Ländern vorgeht, ihren Markt verlieren und ruiniert werden kann; sie ist leicht in einem Lande unter einigermaßen günstigen Bedingungen eingeführt und ebendeshalb leicht zerstört.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: I.89.5
  kind: p
  original: Sie ist zugleich durch die Art, wie sie, namentlich im 18. Jahrhundert auf dem Lande, betrieben wurde, mit den Lebensverhältnissen einer großen Masse von Individuen so verwachsen, daß kein Land wagen darf, ihre Existenz durch Zulassung der freien Konkurrenz aufs Spiel zu setzen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: I.89.6
  kind: p
  original: Sie hängt daher, insofern sie es bis zum Export bringt, ganz von der Ausdehnung oder Beschränkung des Handels ab und übt eine verhältnis[mäßig] sehr geringe Rückwirkung [auf ihn] aus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: I.89.7
  kind: p
  original: Daher ihre sekundäre [Bedeutung] und daher der Einfluß [der Kauf]leute im achtzehnten Jahrhundert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: I.89.8
  kind: p
  original: Die Kaufleute und besonders die Reeder waren es, die vor allen Andern auf Staatsschutz und Monopolien drangen; die Manufacturiers verlangten und erhielten zwar auch Schutz, standen aber fortwährend hinter den Kaufleuten an politischer Bedeutung zurück.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: I.89.9
  kind: p
  original: Die Handelsstädte, speziell die Seestädte, wurden einigermaßen zivilisiert und großbürgerlich, während in den Fabrikstädten die größte Kleinbürgerei bestehen blieb.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 58-59
- id: I.89.10
  kind: p
  original: Vgl. Aikin pp. Das achtzehnte Jahrhundert war das des Handels.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: I.89.11
  kind: p
  original: 'Pinto sagt dies ausdrücklich: "Le commerce fait la marotte du siècle" <"Der Handel ist das Steckenpferd des Jahrhunderts">, und: "Depuis quelque temps il n''est plus question que de commerce, de navigation et de marine." <"Seit einiger Zeit ist nur noch von Handel, Seefahrt und Marine die Rede.">'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N21
  mew_page: '59'
- id: I.90.1
  kind: p
  original: Diese Periode ist auch bezeichnet durch das Aufhören der Gold- und Silberausfuhrverbote, das Entstehen des Geldhandels, der Banken, der Staatsschulden, des Papiergeldes, der Aktien- und Fondsspekulation, der Agiotage in allen Artikeln und der Ausbildung des Geldwesens überhaupt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: I.90.2
  kind: p
  original: Das Kapital verlor wieder einen großen Teil der ihm noch anklebenden Naturwüchsigkeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: I.91.1
  kind: p
  original: Die im siebzehnten Jahrhundert unaufhaltsam sich entwickelnde Konzentration des Handels und der Manufaktur auf ein Land, England, schuf für dieses Land allmählich einen relativen Weltmarkt und damit eine Nachfrage für die Manufakturprodukte dieses Landes, die durch die bisherigen industriellen Produktivkräfte nicht mehr befriedigt werden konnte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: I.91.2
  kind: p
  original: Diese den Produktionskräften über den Kopf wachsende Nachfrage war die treibende Kraft, welche die dritte Periode des Privateigentums seit dem Mittelalter hervorrief, indem sie die große Industrie - die Anwendung von Elementarkräften zu industriellen Zwecken, die Maschinerie und die ausgedehnteste Teilung der Arbeit - erzeugte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: I.91.3
  kind: p
  original: Die übrigen Bedingungen dieser neuen Phase - die Freiheit der Konkurrenz innerhalb der Nation, die Ausbildung der theoretischen Mechanik (die durch Newton vollendete Mechanik war überhaupt im 18. Jahrhundert in Frankreich und England die populärste Wissenschaft) pp. - existierten in England bereits.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: I.91.4
  kind: p
  original: (Die freie Konkurrenz in der Nation selbst mußte überall durch eine Revolution erobert werden - 1640 und 1688 in England, 1789 in Frankreich.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: I.91.5
  kind: p
  original: Die Konkurrenz zwang bald jedes Land, das seine historische Rolle behalten wollte, seine Manufakturen durch erneuerte Zollmaßregeln zu schützen (die alten Zölle halfen gegen die große Industrie nicht mehr) und bald darauf die große Industrie unter Schutzzöllen einzuführen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 59-60
- id: I.91.6
  kind: p
  original: Die große Industrie universalisierte trotz dieser Schutzmittel die Konkurrenz (sie ist die praktische Handelsfreiheit, der Schutzzoll ist in ihr nur ein Palliativ, eine Gegenwehr in der Handelsfreiheit), stellte die Kommunikationsmittel und den modernen Weltmarkt her, unterwarf sich den Handel, verwandelte alles Kapital in industrielles Kapital und erzeugte damit die rasche Zirkulation (die Ausbildung des Geldwesens) und Zentralisation der Kapitalien.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: I.91.7
  kind: p
  original: Sie zwang durch die universelle Konkurrenz alle Individuen zur äußersten Anspannung ihrer Energie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: I.91.8
  kind: p
  original: Sie vernichtete möglichst die Ideologie, Religion, Moral etc., und wo sie dies nicht konnte, machte sie sie zur handgreiflichen Lüge.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: I.91.9
  kind: p
  original: Sie erzeugte insoweit erst die Weltgeschichte, als sie jede zivilisierte Nation und jedes Individuum darin in der Befriedigung seiner Bedürfnisse von der ganzen Welt abhängig machte und die bisherige naturwüchsige Ausschließlichkeit einzelner Nationen vernichtete.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: I.91.10
  kind: p
  original: Sie subsumierte die Naturwissenschaft unter das Kapital und nahm der Teilung der Arbeit den letzten Schein der Naturwüchsigkeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: I.91.11
  kind: p
  original: Sie vernichtete überhaupt die Naturwüchsigkeit, soweit dies innerhalb der Arbeit möglich ist, und löste alle naturwüchsigen Verhältnisse in Geldverhältnisse auf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: I.91.12
  kind: p
  original: Sie schuf an der Stelle der naturwüchsigen Städte die modernen, großen Industriestädte, die über Nacht entstanden sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: I.91.13
  kind: p
  original: Sie zerstörte, wo sie durchdrang, das Handwerk und überhaupt alle früheren Stufen der Industrie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: I.91.14
  kind: p
  original: Sie vollendete den Sieg [der] Handelsstadt über das Land.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: I.91.15
  kind: p
  original: '[Ihre erste Voraussetzung] ist das automatische System.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: I.91.16
  kind: p
  original: '[Ihre Entwicklung er]zeugte eine Masse von Pro[duktivkr]äften, für die das Privat[eigentum] ebensosehr eine Fessel wurde wie die Zunft für die Manufaktur und der kleine, ländliche Betrieb für das sich ausbildende Handwerk.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: I.91.17
  kind: p
  original: Diese Produktivkräfte erhalten unter dem Privateigentum eine nur einseitige Entwicklung, werden für die Mehrzahl zu Destruktivkräften, und eine Menge solcher Kräfte können im Privateigentum gar nicht zur Anwendung kommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: I.91.18
  kind: p
  original: Sie erzeugte im Allgemeinen überall dieselben Verhältnisse zwischen den Klassen der Gesellschaft und vernichtete dadurch die Besonderheit der einzelnen Nationalitäten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: I.91.19
  kind: p
  original: Und endlich, während die Bourgeoisie jeder Nation noch aparte nationale Interessen behält, schuf die große Industrie eine Klasse, die bei allen Nationen dasselbe Interesse hat und bei der die Nationalität schon vernichtet ist, eine Klasse, die wirklich die ganze alte Welt los ist und zugleich ihr gegenübersteht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: I.91.20
  kind: p
  original: Sie macht dem Arbeiter nicht bloß das Verhältnis zum Kapitalisten, sondern die Arbeit selbst unerträglich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: I.92.1
  kind: p
  original: Es versteht sich, daß die große Industrie nicht in jeder Lokalität eines Landes zu derselben Höhe der Ausbildung kommt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: I.92.2
  kind: p
  original: Dies hält indes die Klassenbewegung des Proletariats nicht auf, da die durch die große Industrie erzeugten Proletarier an die Spitze dieser Bewegung treten und die ganze Masse mit sich fortreißen, und da die von der großen Industrie ausgeschlossenen Arbeiter durch diese große Industrie in eine noch schlechtere Lebenslage versetzt werden als die Arbeiter der großen Industrie selbst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: I.92.3
  kind: p
  original: Ebenso wirken die Länder, in denen eine große Industrie entwickelt ist, auf die plus ou moins <mehr oder weniger> nichtindustriellen Länder, sofern diese durch den Weltverkehr in den universellen Konkurrenzkampf hereingerissen sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N22
  mew_page: '61'
- id: I.93.1
  kind: p
  original: Diese verschiedenen Formen sind ebensoviel Formen der Organisation der Arbeit und damit des Eigentums.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: I.93.2
  kind: p
  original: In jeder Periode fand eine Vereinigung der existierenden Produktivkräfte statt, soweit sie durch die Bedürfnisse notwendig geworden war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: I.94.1
  kind: heading
  original: '[2.] Verhältnis von Staat und Recht zum Eigentum'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: I.95.1
  kind: p
  original: Die erste Form des Eigentums ist sowohl in der antiken Welt wie im Mittelalter das Stammeigentum, bedingt bei den Römern hauptsächlich durch den Krieg, bei den Germanen durch die Viehzucht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: I.95.2
  kind: p
  original: Bei den antiken Völkern erscheint, weil in einer Stadt mehrere Stämme zusammenwohnen, das Stammeigentum als Staatseigentum und das Recht des Einzelnen daran als bloße Possessio <Besitz>, die sich indes, wie das Stammeigentum überhaupt, nur auf das Grundeigentum beschränkt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: I.95.3
  kind: p
  original: Das eigentliche Privateigentum fängt bei den Alten, wie bei den modernen Völkern, mit dem Mobiliareigentum an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: I.95.4
  kind: p
  original: '- (Sklaverei und Gemeinwesen) (dominium ex jure Quiritum <Eigentum eines altrömischen Vollbürgers>).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: I.95.5
  kind: p
  original: Bei den aus dem Mittelalter hervorgehenden Völkern entwickelt sich das Stammeigentum so durch verschiedene Stufen - feudales Grundeigentum, korporatives Mobiliareigentum, Manufakturkapital - bis zum modernen, durch die große Industrie und universelle Konkurrenz bedingten Kapital, dem reinen Privateigentum, das allen Schein des Gemeinwesens abgestreift und alle Einwirkung des Staats auf die Entwicklung des Eigentums ausgeschlossen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 61-62
- id: I.95.6
  kind: p
  original: Diesem modernen Privateigentum entspricht der moderne Staat, der durch die Steuern allmählich von den Privateigentümern an sich gekauft, durch das Staatsschuldenwesen ihnen vollständig verfallen und dessen Existenz in dem Steigen und Fallen der Staatspapiere auf der Börse gänzlich von dem kommerziellen Kredit abhängig geworden ist, den ihm die Privateigentümer, die Bourgeois, geben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: I.95.7
  kind: p
  original: Die Bourgeoisie ist schon, weil sie eine Klasse, nicht mehr ein Stand ist, dazu gezwungen, sich national, nicht mehr lokal zu organisieren und ihrem Durchschnittsinteresse eine allgemeine Form zu geben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: I.95.8
  kind: p
  original: Durch die Emanzipation des Privateigentums vom Gemeinwesen ist der Staat zu einer besonderen Existenz neben und außer der bürgerlichen Gesellschaft geworden; er ist aber weiter Nichts als die Form der Organisation, welche sich die Bourgeois sowohl nach Außen als nach innen hin zur gegenseitigen Garantie ihres Eigentums und ihrer Interessen notwendig geben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: I.95.9
  kind: p
  original: Die Selbständigkeit des Staats kommt heutzutage nur noch in solchen Ländern vor, wo die Stände sich nicht vollständig zu Klassen entwickelt haben, wo die in den fortgeschrittneren Ländern beseitigten Stände noch eine Rolle spielen und ein Gemisch existiert; in denen daher kein Teil der Bevölkerung es zur Herrschaft über die übrigen bringen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: I.95.10
  kind: p
  original: Dies ist namentlich in Deutschland der Fall.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: I.95.11
  kind: p
  original: Das vollendetste Beispiel des modernen Staats ist Nordamerika.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: I.95.12
  kind: p
  original: Die neueren französischen, englischen und amerikanischen Schriftsteller sprechen sich Alle dahin aus, daß der Staat nur um des Privateigentums willen existiere, so daß dies auch in das gewöhnliche Bewußtsein übergegangen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: I.96.1
  kind: p
  original: Da der Staat die Form ist, in welcher die Individuen einer herrschenden Klasse ihre gemeinsamen Interessen geltend machen und die ganze bürgerliche Gesellschaft einer Epoche sich zusammenfaßt, so folgt, daß alle gemeinsamen Institutionen durch den Staat vermittelt werden, eine politische Form erhalten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: I.96.2
  kind: p
  original: Daher die Illusion, als ob das Gesetz auf dem Willen, und zwar auf dem von seiner realen Basis losgerissenen, dem freien Willen beruhe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: I.96.3
  kind: p
  original: Ebenso wird das Recht dann wieder auf das Gesetz reduziert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: I.97.1
  kind: p
  original: Das Privatrecht entwickelt sich zu gleicher Zeit mit dem Privateigentum aus der Auflösung des naturwüchsigen Gemeinwesens.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: I.97.2
  kind: p
  original: Bei den Römern blieb die Entwicklung des Privateigentums und Privatrechts ohne weitere industrielle und kommerzielle Folgen, weil ihre ganze Produktionsweise dieselbe blieb.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N23
  mew_page: 62-63
- id: I.97.3
  kind: p
  original: Bei den modernen Völkern, wo das feudale Gemeinwesen durch die Industrie und den Handel aufgelöst wurde, begann mit dem Entstehen des Privateigentums und Privatrechts eine neue Phase, die einer weiteren Entwicklung fähig war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
- id: I.97.4
  kind: p
  original: Gleich die erste Stadt, die im Mittelalter einen ausgedehnten Seehandel führte, Amalfi, bildete auch das Seerecht aus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
- id: I.97.5
  kind: p
  original: Sobald, zuerst in Italien und später in anderen Ländern, die Industrie und der Handel das Privateigentum weiterentwickelten, wurde gleich das ausgebildete römische Privatrecht wieder aufgenommen und zur Autorität erhoben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
- id: I.97.6
  kind: p
  original: Als später die Bourgeoisie so viel Macht erlangt hatte, daß die Fürsten sich ihrer Interessen annahmen, um vermittelst der Bourgeoisie den Feudaladel zu stürzen, begann in allen Ländern - in Frankreich im 16. Jahrhundert - die eigentliche Entwicklung des Rechts, die in allen Ländern, ausgenommen England, auf der Basis des römischen Kodex vor sich ging.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
- id: I.97.7
  kind: p
  original: Auch in England mußten römische Rechtsgrundsätze zur weiteren Ausbildung des Privatrechts (besonders beim Mobiliareigentum) hereingenommen werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
- id: I.97.8
  kind: p
  original: (Nicht zu vergessen, daß das Recht ebensowenig eine eigene Geschichte hat wie die Religion.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
- id: I.98.1
  kind: p
  original: Im Privatrecht werden die bestehenden Eigentumsverhältnisse als Resultat des allgemeinen Willens ausgesprochen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
- id: I.98.2
  kind: p
  original: 'Das jus utendi et abutendi <das Recht, das Seinige zu gebrauchen und zu verbrauchen (auch: mißbrauchen)> selbst spricht einerseits die Tatsache aus, daß das Privateigentum vom Gemeinwesen durchaus unabhängig geworden ist, und andererseits die Illusion, als ob das Privateigentum selbst auf dem bloßen Privatwillen, der willkürlichen Disposition über die Sache beruhe.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
- id: I.98.3
  kind: p
  original: 'In der Praxis hat das abuti <verbrauchen, (auch: Mißbrauchen)> sehr bestimmte ökonomische Grenzen für den Privateigentümer, wenn er nicht sein Eigentum und damit sein jus abutendi in andre Hände übergehn sehen will, da überhaupt die Sache, bloß in Beziehung auf seinen Willen betrachtet, gar keine Sache ist, sondern erst im Verkehr und unabhängig vom Recht zu einer Sache, zu wirklichem Eigentum wird (ein Verhältnis, was die Philosophen eine Idee nennen).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N24
  mew_page: '63'
- id: I.99.1
  kind: p
  original: Diese juristische Illusion, die das Recht auf den bloßen Willen reduziert, führt in der weiteren Entwicklung der Eigentumsverhältnisse notwendig dahin, daß Jemand einen juristischen Titel auf eine Sache haben kann, ohne die Sache wirklich zu haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 63-64
- id: I.99.2
  kind: p
  original: Wird z.B. durch die Konkurrenz die Rente eines Grundstückes beseitigt, so hat der Eigentümer desselben zwar seinen juristischen Titel daran, samt dem jus utendi et abutendi.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: I.99.3
  kind: p
  original: Aber er kann nichts damit anfangen, er besitzt nichts als Grundeigentümer, falls er nicht sonst noch Kapital genug besitzt, um seinen Boden zu bebauen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: I.99.4
  kind: p
  original: Aus derselben Illusion der Juristen erklärt es sich, daß es für sie und für jeden Kodex überhaupt zufällig ist, daß Individuen in Verhältnisse untereinander treten, z.B. Verträge, und daß ihm diese Verhältnisse für solche gelten, die man nach Belieben eingehen oder nicht eingehen [kann] und deren Inhalt ganz auf der individuellen [Will]kür der Kontrahenten [ber]uht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: I.100.1
  kind: p
  original: Sooft sich durch die Entwick[lung] der Industrie und des Handels neue [Ve]rkehrsformen gebildet haben, [z.] B. Assekuranz-etc.-Kompanien, war das Recht jedesmal genötigt, sie unter die Eigentumserwerbsarten aufzunehmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: I.101.1
  kind: p
  original: Es ist nichts gewöhnlicher als die Vorstellung, in der Geschichte sei es bisher nur auf das Nehmen angekommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: I.101.2
  kind: p
  original: Die Barbaren nehmen das römische Reich, und mit der Tatsache dieses Nehmens erklärt man den Übergang aus der alten Welt in die Feudalität.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: I.101.3
  kind: p
  original: Bei dem Nehmen durch Barbaren kommt es aber darauf an, ob die Nation, die eingenommen wird, industrielle Produktivkräfte entwickelt hat, wie dies bei den modernen Völkern der Fall ist, oder ob ihre Produktivkräfte hauptsächlich bloß auf ihrer Vereinigung und dem Gemeinwesen beruhen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: I.101.4
  kind: p
  original: Das Nehmen ist ferner bedingt durch den Gegenstand, der genommen wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: I.101.5
  kind: p
  original: Das in Papier bestehende Vermögen eines Bankiers kann gar nicht genommen werden, ohne daß der Nehmende sich den Produktions- und Verkehrsbedingungen des genommenen Landes unterwirft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: I.101.6
  kind: p
  original: Ebenso das gesamte industrielle Kapital eines modernen Industrielandes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: I.101.7
  kind: p
  original: Und endlich hat das Nehmen überall sehr bald ein Ende, und wenn nichts mehr zu nehmen ist, muß man anfangen zu produzieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: I.101.8
  kind: p
  original: Aus dieser sehr bald eintretenden Notwendigkeit des Produzierens folgt, daß die von den sich niederlassenden Eroberern angenommene Form des Gemeinwesens der Entwicklungsstufe der vorgefundnen Produktivkräfte entsprechen, oder, wenn dies nicht von vornherein der Fall ist, sich nach den Produktivkräften ändern muß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: I.101.9
  kind: p
  original: Hieraus erklärt sich auch das Faktum, das man in der Zeit nach der Völkerwanderung überall bemerkt haben will, daß nämlich der Knecht der Herr war, und die Eroberer von den Eroberten Sprache, Bildung und Sitten sehr bald annahmen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: I.102.1
  kind: p
  original: Die Feudalität wurde keineswegs aus Deutschland fertig mitgebracht, sondern sie hatte ihren Ursprung von seiten der Eroberer in der kriegerischen Organisation des Heerwesens während der Eroberung selbst, und diese entwickelte sich nach derselben durch die Einwirkung der in den eroberten Ländern vorgefundnen Produktivkräfte erst zur eigentlichen Feudalität.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 64-65
- id: I.102.2
  kind: p
  original: Wie sehr diese Form durch die Produktivkräfte bedingt war, zeigen die gescheiterten Versuche, andre aus altrömischen Reminiszenzen entspringende Formen durchzusetzen (Karl der Große pp.).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: I.103.1
  kind: heading
  original: '[3.] Naturwüchsige und zivilisierte Produktionsinstrumente und Eigentumsformen'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: I.104.1
  kind: p
  original: '[...] <Hier fehlen in der Handschrift vier Seiten> funden wird.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: I.104.2
  kind: p
  original: Aus dem ersteren ergibt sich die Voraussetzung einer ausgebildeten Teilung der Arbeit und eines ausgedehnten Handels, aus dem zweiten die Lokalität.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: I.104.3
  kind: p
  original: Bei dem ersten müssen die Individuen zusammengebracht sein, bei dem zweiten finden sie sich neben dem gegebenen Produktionsinstrument selbst als Produktionsinstrumente vor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: I.104.4
  kind: p
  original: Hier tritt also der Unterschied zwischen den naturwüchsigen und den durch die Zivilisation geschaffenen Produktionsinstrumenten hervor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: I.104.5
  kind: p
  original: Der Acker (das Wasser etc.) kann als naturwüchsiges Produktionsinstrument betrachtet werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: I.104.6
  kind: p
  original: Im ersten Fall, beim naturwüchsigen Produktionsinstrument, werden die Individuen unter die Natur subsumiert, im zweiten Falle unter ein Produkt der Arbeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: I.104.7
  kind: p
  original: Im ersten Falle erscheint daher auch das Eigentum (Grundeigentum) als unmittelbare, naturwüchsige Herrschaft, im zweiten als Herrschaft der Arbeit, speziell der akkumulierten Arbeit, des Kapitals.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: I.104.8
  kind: p
  original: Der erste Fall setzt voraus, daß die Individuen durch irgendein Band, sei es Familie, Stamm, der Boden selbst pp. zusammengehören, der zweite Fall, daß sie unabhängig voneinander sind und nur durch den Austausch zusammengehalten werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: I.104.9
  kind: p
  original: Im ersten Fall ist der Austausch hauptsächlich ein Austausch zwischen den Menschen und der Natur, ein Austausch, in dem die Arbeit der Einen gegen die Produkte der Andern eingetauscht wird; im zweiten Falle ist er vorherrschend Austausch der Menschen unter sich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: I.104.10
  kind: p
  original: Im ersten Falle reicht der durchschnittliche Menschenverstand hin, körperliche und geistige Tätigkeit sind noch gar nicht getrennt; im zweiten Falle muß bereits die Teilung zwischen geistiger und körperlicher Arbeit praktisch vollzogen sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: I.104.11
  kind: p
  original: Im ersten Falle kann die Herrschaft des Eigentümers über die Nichteigentümer auf persönlichen Verhältnissen, auf einer Art von Gemeinwesen beruhen, im zweiten Falle muß sie in einem Dritten, dem Geld, eine dingliche Gestalt angenommen haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: I.104.12
  kind: p
  original: Im ersten Falle existiert die kleine Industrie, aber subsumiert unter die Benutzung des naturwüchsigen Produktionsinstruments, und daher ohne Verteilung der Arbeit an verschiedene Individuen; im zweiten Falle besteht die Industrie nur in und durch die Teilung der Arbeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 65-66
- id: I.105.1
  kind: p
  original: Wir gingen bisher von den Produktionsinstrumenten aus, und schon hier zeigte sich die Notwendigkeit des Privateigentums für gewisse industrielle Stufen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: I.105.2
  kind: p
  original: In der industrie extractive <auf die Gewinnung von Rohstoffen gerichteten Industrie> fällt das Privateigentum mit der Arbeit noch ganz zusammen; in der kleinen Industrie und aller bisherigen Agrikultur ist das Eigentum notwendige Konsequenz der vorhandenen Produktionsinstrumente; in der großen Industrie ist der Widerspruch zwischen dem Produktionsinstrument und Privateigentum erst ihr Produkt, zu dessen Erzeugung sie bereits sehr entwickelt sein muß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: I.105.3
  kind: p
  original: Mit ihr ist also auch die Aufhebung des Privateigentums erst möglich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: I.106.1
  kind: p
  original: 'In der großen Industrie und Konkurrenz sind die sämtlichen Existenzbedingungen, Bedingtheiten, Einseitigkeiten der Individuen zusammengeschmolzen in die beiden einfachsten Formen: Privateigentum und Arbeit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: I.106.2
  kind: p
  original: Mit dem Gelde ist jede Verkehrsform und der Verkehr selbst für die Individuen als zufällig gesetzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: I.106.3
  kind: p
  original: Also liegt schon im Gelde, daß aller bisherige Verkehr nur Verkehr der Individuen unter bestimmten Bedingungen, nicht der Individuen als Individuen war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: I.106.4
  kind: p
  original: Diese Bedingungen sind auf zwei - akkumulierte Arbeit oder Privateigentum, oder wirkliche Arbeit - reduziert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: I.106.5
  kind: p
  original: Hört diese oder eine von ihnen auf, so stockt der Verkehr.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: I.106.6
  kind: p
  original: Die modernen Ökonomen selbst, z. B. Sismondi, Cherbuliez etc., stellen die association des individus <Vereinigung der Individuen> der association des capitaux <Vereinigung des Kapitals> entgegen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: I.106.7
  kind: p
  original: Andererseits sind die Individuen selbst vollständig unter die Teilung der Arbeit subsumiert und dadurch in die vollständigste Abhängigkeit voneinander gebracht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: I.106.8
  kind: p
  original: Das Privateigentum, soweit es, innerhalb der Arbeit, der Arbeit gegenübertritt, entwickelt sich aus der Notwendigkeit der Akkumulation und hat im Anfange immer noch mehr die Form des Gemeinwesens, nähert sich aber in der weiteren Entwicklung immer mehr der modernen Form des Privateigentums.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: I.106.9
  kind: p
  original: Durch die Teilung der Arbeit ist schon von vornherein die Teilung auch der Arbeitsbedingungen, Werkzeuge und Materialien gegeben und damit die Zersplitterung des akkumulierten Kapitals an verschiedne Eigentümer, und damit die Zersplitterung zwischen Kapital und Arbeit, und die verschiedenen Formen des Eigentums selbst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: I.106.10
  kind: p
  original: Je mehr sich die Teilung der Arbeit ausbildet und je mehr die Akkumulation wächst, desto schärfer bildet sich auch diese Zersplitterung aus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: I.106.11
  kind: p
  original: Die Arbeit selbst kann nur bestehen unter der Voraussetzung dieser Zersplitterung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: I.107.1
  kind: p
  original: Es zeigen sich hier also zwei Fakta.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N25
  mew_page: '67'
- id: I.107.2
  kind: p
  original: Erstens erscheinen die Produktivkräfte als ganz unabhängig und losgerissen von den Individuen, als eine eigne Welt neben den Individuen, was darin seinen Grund hat, daß die Individuen, deren Kräfte sie sind, zersplittert und im Gegensatz gegeneinander existieren, während diese Kräfte andererseits nur im Verkehr und Zusammenhang dieser Individuen wirkliche Kräfte sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: I.107.3
  kind: p
  original: Also auf der einen Seite eine Totalität von Produktivkräften, die gleichsam eine sachliche Gestalt angenommen haben und für die Individuen selbst nicht mehr die Kräfte der Individuen, sondern des Privateigentums [sind], und daher der Individuen nur, insofern sie Privateigentümer sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: I.107.4
  kind: p
  original: In keiner früheren Periode hatten die Produktivkräfte diese gleichgültige Gestalt für den Verkehr der Individuen als Individuen angenommen, weil ihr Verkehr selbst noch ein bornierter war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: I.107.5
  kind: p
  original: Auf der andern Seite steht diesen Produktivkräften die Majorität der Individuen gegenüber, von denen diese Kräfte losgerissen sind und die daher alles wirklichen Lebensinhalts beraubt, abstrakte Individuen geworden sind, die aber dadurch erst in den Stand gesetzt werden, als Individuen miteinander in Verbindung zu treten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: I.108.1
  kind: p
  original: Der einzige Zusammenhang, in dem sie noch mit den Produktivkräften und mit ihrer eignen Existenz stehen, die Arbeit, hat bei ihnen allen Schein der Selbstbetätigung verloren und erhält ihr Leben nur, indem sie es verkümmert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: I.108.2
  kind: p
  original: Während in den früheren Perioden Selbstbetätigung und Erzeugung des materiellen Lebens dadurch getrennt waren, daß sie an verschiedene Personen fielen und die Erzeugung des materiellen Lebens wegen der Borniertheit der Individuen selbst noch als eine untergeordnete Art der Selbstbetätigung galt, fallen sie jetzt so auseinander, daß überhaupt das materielle Leben als Zweck, die Erzeugung dieses materiellen Lebens, die Arbeit (welche die jetzt einzig mögliche, aber wie wir sehn, negative Form der Selbstbetätigung ist), als Mittel erscheint.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: I.109.1
  kind: p
  original: Es ist also jetzt so weit gekommen, daß die Individuen sich die vorhandene Totalität von Produktivkräften aneignen müssen, nicht nur um zu ihrer Selbstbetätigung zu kommen, sondern schon überhaupt um ihre Existenz sicherzustellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: I.109.2
  kind: p
  original: Diese Aneignung ist zuerst bedingt durch den anzueignenden Gegenstand - die zu einer Totalität entwickelten und nur innerhalb eines universellen Verkehrs existierenden Produktivkräfte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: I.109.3
  kind: p
  original: Diese Aneignung muß also schon von dieser Seite her einen den Produktivkräften und dem Verkehr entsprechenden universellen Charakter haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: I.109.4
  kind: p
  original: Die Aneignung dieser Kräfte hat selbst weiter nichts als die Entwicklung der den materiellen Produktionsinstrumenten entsprechenden individuellen Fähigkeiten Die Aneignung einer Totalität von Produktionsinstrumenten ist schon deshalb die Entwicklung einer Totalität von Fähigkeiten in den Individuen selbst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 67-68
- id: I.109.5
  kind: p
  original: Diese Aneignung ist ferner bedingt durch die aneignenden Individuen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: I.109.6
  kind: p
  original: Nur die von aller Selbstbetätigung vollständig ausgeschlossenen Proletarier der Gegenwart sind imstande, ihre vollständige, nicht mehr bornierte Selbstbetätigung, die in der Aneignung einer Totalität von Produktivkräften und der damit gesetzten Entwicklung einer Totalität von Fähigkeiten besteht, durchzusetzen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: I.109.7
  kind: p
  original: Alle früheren revolutionären Aneignungen waren borniert; Individuen, deren Selbstbetätigung durch ein beschränktes Produktionsinstrument und einen beschränkten Verkehr borniert war, eigneten sich dies beschränkte Produktionsinstrument an und brachten es daher nur zu einer neuen Beschränktheit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: I.109.8
  kind: p
  original: Ihr Produktionsinstrument wurde ihr Eigentum, aber sie selbst blieben unter die Teilung der Arbeit und unter ihr eignes Produktionsinstrument subsumiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: I.109.9
  kind: p
  original: Bei allen bisherigen Aneignungen blieb eine Masse von Individuen unter ein einziges Produktionsinstrument subsumiert; bei der Aneignung der Proletarier müssen eine Masse von Produktionsinstrumenten unter jedes Individuum und das Eigentum unter Alle subsumiert werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: I.109.10
  kind: p
  original: Der moderne universelle Verkehr kann nicht anders unter die Individuen subsumiert werden, als dadurch, daß er unter Alle subsumiert wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: I.110.1
  kind: p
  original: Die Aneignung ist ferner bedingt durch die Art und Weise, wie sie vollzogen werden muß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: I.110.2
  kind: p
  original: Sie kann nur vollzogen werden durch eine Vereinigung, die durch den Charakter des Proletariats selbst wieder nur eine universelle sein kann, und durch eine Revolution, in der einerseits die Macht der bisherigen Produktions- und Verkehrsweise und gesellschaftlichen Gliederung gestürzt wird und andererseits der universelle Charakter und die zur Durchführung der Aneignung nötige Energie des Proletariats sich entwickelt, ferner das Proletariat alles abstreift, was ihm noch aus seiner bisherigen Gesellschaftsstellung geblieben ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: I.111.1
  kind: p
  original: Erst auf dieser Stufe fällt die Selbstbetätigung mit dem materiellen Leben zusammen, was der Entwicklung der Individuen zu totalen Individuen und der Abstreifung aller Naturwüchsigkeit entspricht; und dann entspricht sich die Verwandlung der Arbeit in Selbstbetätigung und die Verwandlung des bisherigen bedingten Verkehrs in den Verkehr der Individuen als solcher.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: I.111.2
  kind: p
  original: Mit der Aneignung der totalen Produktivkräfte durch die vereinigten Individuen hört das Privateigentum auf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: I.111.3
  kind: p
  original: Während in der bisherigen Geschichte immer eine besondere Bedingung als zufällig erschien, ist jetzt die Absonderung der Individuen selbst, der besondre Privaterwerb eines Jeden selbst zufällig geworden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: I.112.1
  kind: p
  original: Die Individuen, die nicht mehr unter die Teilung der Arbeit subsumiert werden, haben die Philosophen sich als Ideal unter dem Namen "der Mensch" vorgestellt, und den ganzen, von uns entwickelten Prozeß als den Entwicklungsprozeß "des Menschen" gefaßt, so daß den bisherigen Individuen auf jeder geschichtlichen Stufe "der Mensch" untergeschoben und als die treibende Kraft der Geschichte dargestellt wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '69'
- id: I.112.2
  kind: p
  original: Der ganze Prozeß wurde so als Selbstentfremdungsprozeß "des Menschen" gefaßt, und dies kommt wesentlich daher, daß das Durchschnittsindividuum der späteren Stufe immer der früheren und das spätere Bewußtsein den früheren Individuen untergeschoben [wurde].
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '69'
- id: I.112.3
  kind: p
  original: Durch diese Umkehrung, die von vornherein von den wirklichen Bedingungen abstrahiert, war es möglich, die ganze Geschichte in einen Entwicklungsprozeß des Bewußtseins zu verwandeln,
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '69'
- id: I.113.1
  kind: p
  original: 'Schließlich erhalten wir noch folgende Resultate aus der entwickelten Geschichtsauffassung: 1. In der Entwicklung der Produktivkräfte tritt eine Stufe ein, auf welcher Produktionskräfte und Verkehrsmittel hervorgerufen werden, welche unter den bestehenden Verhältnissen nur Unheil anrichten, welche keine Produktionskräfte mehr sind, sondern Destruktionskräfte (Maschinerie und Geld) - und was damit zusammenhängt, daß eine Klasse hervorgerufen wird, welche alle Lasten der Gesellschaft zu tragen hat, ohne ihre Vorteile zu genießen, welche aus der Gesellschaft herausgedrängt, in den entschiedensten Gegensatz zu allen andern Klassen forciert wird; eine Klasse, die die Majorität aller Gesellschaftsmitglieder bildet und von der das Bewußtsein über die Notwendigkeit einer gründlichen Revolution, das kommunistische Bewußtsein, ausgeht, das sich natürlich auch unter den andern Klassen vermöge der Anschauung der Stellung dieser Klasse bilden kann; 2 daß die Bedingungen, innerhalb deren bestimmte Produktionskräfte angewandt werden können, die Bedingungen der Herrschaft einer bestimmten Klasse der Gesellschaft sind, deren soziale, aus ihrem Besitz hervorgehende Macht in der jedesmaligen Staatsform ihren praktisch-idealistischen Ausdruck hat, und deshalb jeder revolutionäre Kampf gegen eine Klasse, die bisher geherrscht hat, sich richtet; 3, daß in allen bisherigen Revolutionen die Art der Tätigkeit stets unangetastet blieb und es sich nur um eine andre Distribution dieser Tätigkeit, um eine neue Verteilung der Arbeit an andre Personen handelte, während die kommunistische Revolution sich gegen die bisherige Art der Tätigkeit richtet, die Arbeit beseitigt und die Herrschaft aller Klassen mit den Klassen selbst aufhebt, weil sie durch die Klasse bewirkt wird, die in der Gesellschaft für keine Klasse mehr gilt, nicht als Klasse anerkannt wird, schon der Ausdruck der Auflösung aller Klassen, Nationalitäten etc. innerhalb der jetzigen Gesellschaft ist; und 4. daß sowohl zur massenhaften Erzeugung dieses kommunistischen Bewußtseins wie zur Durchsetzung der Sache selbst eine massenhafte Veränderung der Menschen nötig ist, die nur in einer praktischen Bewegung, in einer Revolution vor sich gehen kann; daß also die Revolution nicht nur nötig ist, weil die herrschende Klasse auf keine andre Weise gestürzt werden kann, sondern auch, weil die stürzende Klasse nur in einer Revolution dahin kommen kann, sich den ganzen alten Dreck vom Halse zu schaffen und zu einer neuen Begründung der Gesellschaft befähigt zu werden.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N26
  - I.N27
  - I.N28
  mew_page: 69-70
- id: I.114.1
  kind: heading
  original: '[C.] Kommunismus. - Produktion der Verkehrsform selbst'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '70'
- id: I.115.1
  kind: p
  original: Der Kommunismus unterscheidet sich von allen bisherigen Bewegungen dadurch, daß er die Grundlage aller bisherigen Produktions- und Verkehrsverhältnisse umwälzt und alle naturwüchsigen Voraussetzungen zum ersten Mal mit Bewußtsein als Geschöpfe der bisherigen Menschen behandelt, ihrer Naturwüchsigkeit entkleidet und der Macht der vereinigten Individuen unterwirft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '70'
- id: I.115.2
  kind: p
  original: Seine Einrichtung ist daher wesentlich ökonomisch, die materielle Herstellung der Bedingungen dieser Vereinigung; sie macht die vorhandenen Bedingungen zu Bedingungen der Vereinigung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '70'
- id: I.115.3
  kind: p
  original: Das Bestehende, was der Kommunismus schafft, ist eben die wirkliche Basis zur Unmöglichmachung alles von den Individuen unabhängig Bestehenden, sofern dies Bestehende dennoch nichts als ein Produkt des bisherigen Verkehrs der Individuen selbst ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 70-71
- id: I.115.4
  kind: p
  original: Die Kommunisten behandeln also praktisch die durch die bisherige Produktion und Verkehr erzeugten Bedingungen als unorganische, ohne indes sich einzubilden, es sei der Plan oder die Bestimmung der bisherigen Generationen gewesen, ihnen Material zu liefern, und ohne zu glauben, daß diese Bedingungen für die sie schaffenden Individuen unorganisch waren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '71'
- id: I.115.5
  kind: p
  original: Der Unterschied zwischen persönlichem Individuum und zufälligem Individuum ist keine Begriffsunterscheidung, sondern ein historisches Faktum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '71'
- id: I.115.6
  kind: p
  original: Diese Unterscheidung hat zu verschiedenen Zeiten einen verschiedenen Sinn, z.B. der Stand als etwas dem Individuum Zufälliges im 18. Jahrhundert, plus ou moins <mehr oder weniger> auch die Familie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '71'
- id: I.115.7
  kind: p
  original: Es ist eine Unterscheidung, die nicht wir für jede Zeit zu machen haben, sondern die jede Zeit unter den verschiedenen Elementen, die sie vorfindet, selbst macht, und zwar nicht nach dem Begriff, sondern durch materielle Lebenskollisionen gezwungen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '71'
- id: I.115.8
  kind: p
  original: Was als zufällig der späteren Zeit im Gegensatz zur früheren erscheint, also auch unter den ihr von der früheren überkommenen Elementen, ist eine Verkehrsform, die einer bestimmten Entwicklung der Produktivkräfte entsprach.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '71'
- id: I.115.9
  kind: p
  original: Das Verhältnis der Produktionskräfte zur Verkehrsform ist das Verhältnis der Verkehrsform zur Tätigkeit oder Betätigung der Individuen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '71'
- id: I.115.10
  kind: p
  original: (Die Grundform dieser Betätigung ist natürlich die materielle, von der alle andre geistige, politische, religiöse etc. abhängt. Die verschiedene Gestaltung des materiellen Lebens ist natürlich jedesmal abhängig von den schon entwickelten Bedürfnissen, und sowohl die Erzeugung wie die Befriedigung dieser Bedürfnisse ist selbst ein historischer Prozeß, der sich bei keinem Schafe oder Hunde findet (widerhaariges Hauptargument Stirners adversus hominem <gegen den Menschen>), obwohl Schafe und Hunde in ihrer jetzigen Gestalt allerdings, aber malgré eux <gegen ihren Willen>, Produkte eines historischen Prozesses sind.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '71'
- id: I.115.11
  kind: p
  original: Die Bedingungen, unter denen die Individuen, solange der Widerspruch noch nicht eingetreten ist, miteinander verkehren, sind zu ihrer Individualität gehörige Bedingungen, nichts Äußerliches für sie, Bedingungen, unter denen diese bestimmten, unter bestimmten Verhältnissen existierenden Individuen allein ihr materielles Leben und was damit zusammenhängt produzieren können, sind also die Bedingungen ihrer Selbstbetätigung und werden von dieser Selbstbetätigung produziert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N29
  mew_page: 71-72
- id: I.115.12
  kind: p
  original: Die bestimmte Bedingung, unter der sie produzieren, entspricht also, solange der Widerspruch noch nicht eingetreten ist, ihrer wirklichen Bedingtheit, ihrem einseitigen Dasein, dessen Einseitigkeit sich erst durch den Eintritt des Widerspruchs zeigt und also für die Späteren existiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '72'
- id: I.115.13
  kind: p
  original: Dann erscheint diese Bedingung als eine zufällige Fessel, und dann wird das Bewußtsein, daß sie eine Fessel sei, auch der früheren Zeit untergeschoben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '72'
- id: I.116.1
  kind: p
  original: Diese verschiedenen Bedingungen, die zuerst als Bedingungen der Selbstbetätigung, später als Fesseln derselben erschienen, bilden in der ganzen geschichtlichen Entwicklung eine zusammenhängende Reihe von Verkehrsformen, deren Zusammenhang darin besteht, daß an die Stelle der früheren, zur Fessel gewordenen Verkehrsform eine neue, den entwickelteren Produktivkräften und damit der fortgeschrittenen Art der Selbstbetätigung der Individuen entsprechende gesetzt wird, die à son tour <ihrerseits> wieder zur Fessel und dann durch eine andre ersetzt wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '72'
- id: I.116.2
  kind: p
  original: Da diese Bedingungen auf jeder Stufe der gleichzeitigen Entwicklung der Produktivkräfte entsprechen, so ist ihre Geschichte zugleich die Geschichte der sich entwickelnden und von jeder neuen Generation übernommenen Produktivkräfte und damit die Geschichte der Entwicklung der Kräfte der Individuen selbst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '72'
- id: I.117.1
  kind: p
  original: Da diese Entwicklung naturwüchsig vor sich geht, d.h. nicht einem Gesamtplan frei vereinigter Individuen subordiniert ist, so geht sie von verschiedenen Lokalitäten, Stämmen, Nationen, Arbeitszweigen etc. aus, deren Jede anfangs sich unabhängig von den anderen entwickelt und erst nach und nach mit den andern in Verbindung tritt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '72'
- id: I.117.2
  kind: p
  original: Sie geht ferner nur sehr langsam vor sich; die verschiedenen Stufen und Interessen werden nie vollständig überwunden, sondern nur dem siegenden Interesse untergeordnet und schleppen sich noch jahrhundertelang neben diesem fort.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '72'
- id: I.117.3
  kind: p
  original: Hieraus folgt, daß selbst innerhalb einer Nation die Individuen auch abgesehen von ihren Vermögensverhältnissen ganz verschiedene Entwicklungen haben, und daß ein früheres Interesse, dessen eigentümliche Verkehrsform schon durch die einem späteren angehörige verdrängt ist, noch lange im Besitz einer traditionellen Macht in der den Individuen gegenüber verselbständigten scheinbaren Gesellschaft (Staat, Recht) bleibt, einer Macht, die in letzter Instanz nur durch eine Revolution zu brechen ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 72-73
- id: I.117.4
  kind: p
  original: Hieraus erklärt sich auch, warum in Beziehung auf einzelne Punkte, die eine allgemeinere Zusammenfassung erlauben, das Bewußtsein zuweilen weiter vorgerückt scheinen kann als die gleichzeitigen empirischen Verhältnisse, so daß man in den Kämpfen einer späteren Epoche sich auf frühere Theoretiker als auf Autoritäten stützen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
- id: I.118.1
  kind: p
  original: Dagegen geht die Entwicklung in Ländern, die, wie Nordamerika, in einer schon entwickelten Geschichtsepoche von vorn anfangen, sehr rasch vor sich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
- id: I.118.2
  kind: p
  original: Solche Länder haben keine andern naturwüchsigen Voraussetzungen außer den Individuen, die sich dort ansiedeln und die hierzu durch die ihren Bedürfnissen nicht entsprechenden Verkehrsformen der alten Länder veranlaßt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
- id: I.118.3
  kind: p
  original: Sie fangen also mit den fortgeschrittensten Individuen der alten Länder und daher mit der diesen Individuen entsprechenden entwickeltsten Verkehrsform an, noch ehe diese Verkehrsform in den alten Ländern sich durchsetzen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N30
  mew_page: '73'
- id: I.118.4
  kind: p
  original: Dies ist der Fall mit allen Kolonien, sofern sie nicht bloße Militär- oder Handelsstationen sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
- id: I.118.5
  kind: p
  original: Karthago, die griechischen Kolonien und Island im 11. und 12. Jahrhundert liefern Beispiele dazu.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
- id: I.118.6
  kind: p
  original: Ein ähnliches Verhältnis findet statt bei der Eroberung, wenn dem eroberten Lande die auf einem andern Boden entwickelte Verkehrsform fertig herübergebracht wird; während sie in ihrer Heimat noch mit Interessen und Verhältnissen aus früheren Epochen behaftet war, kann und muß sie hier vollständig und ohne Hindernis durchgesetzt werden, schon um den Eroberern dauernde Macht zu sichern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
- id: I.118.7
  kind: p
  original: (England und Neapel nach der normännischen Eroberung, wo sie die vollendetste Form der feudalen Organisation erhielten.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
- id: I.119.1
  kind: p
  original: Alle Kollisionen der Geschichte haben also nach unsrer Auffassung ihren Ursprung in dem Widerspruch zwischen den Produktivkräften und der Verkehrsform.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
- id: I.119.2
  kind: p
  original: Es ist übrigens nicht nötig, daß dieser Widerspruch, um zu Kollisionen in einem Lande zu führen, in diesem Lande selbst auf die Spitze getrieben ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
- id: I.119.3
  kind: p
  original: Die durch einen erweiterten internationalen Verkehr hervorgerufene Konkurrenz mit industriell entwickelteren Ländern ist hinreichend, um auch in den Ländern mit weniger entwickelter Industrie einen ähnlichen Widerspruch zu erzeugen (z.B. das latente Proletariat in Deutschland, durch die Konkurrenz der englischen Industrie zur Erscheinung gebracht).
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
- id: I.120.1
  kind: p
  original: Dieser Widerspruch zwischen den Produktivkräften und der Verkehrsform, der, wie wir sahen, schon mehreremal in der bisherigen Geschichte vorkam, ohne jedoch die Grundlage derselben zu gefährden, mußte jedesmal in einer Revolution eklatieren, wobei er zugleich verschiedene Nebengestalten annahm, als Totalität von Kollisionen, als Kollisionen verschiedener Klassen, als Widerspruch des Bewußtseins, Gedankenkampf etc., politischer Kampf etc. Von einem bornierten Gesichtspunkte aus kann man nun eine dieser Nebengestalten herausnehmen und sie als die Basis dieser Revolutionen betrachten, was um so leichter ist, als die Individuen, von denen die Revolutionen ausgingen, sich je nach ihrem Bildungsgrad und der Stufe der historischen Entwicklung über ihre eigne Tätigkeit selbst Illusionen machten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: I.121.1
  kind: p
  original: Die Verwandlung der persönlichen Mächte (Verhältnisse) in sachliche durch die Teilung der Arbeit kann nicht dadurch wieder aufgehoben werden, daß man sich die allgemeine Vorstellung davon aus dem Kopfe schlägt, sondern nur dadurch, daß die Individuen diese sachlichen Mächte wieder unter sich subsumieren und die Teilung der Arbeit aufheben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N31
  mew_page: '74'
- id: I.121.2
  kind: p
  original: Dies ist ohne die Gemeinschaft nicht möglich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: I.121.3
  kind: p
  original: Erst in der Gemeinschaft [mit Andern hat jedes] Individuum die Mittel, seine Anlagen nach allen Seiten hin auszubilden; erst in der Gemeinschaft wird also die persönliche Freiheit möglich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: I.121.4
  kind: p
  original: In den bisherigen Surrogaten der Gemeinschaft, im Staat usw. existierte die persönliche Freiheit nur für die in den Verhältnissen der herrschenden Klasse entwickelten Individuen und nur, insofern sie Individuen dieser Klasse waren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: I.121.5
  kind: p
  original: Die scheinbare Gemeinschaft, zu der sich bisher die Individuen vereinigten, verselbständigte sich stets ihnen gegenüber und war zugleich, da sie eine Vereinigung einer Klasse gegenüber einer andern war, für die beherrschte Klasse nicht nur eine ganz illusorische Gemeinschaft, sondern auch eine neue Fessel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: I.121.6
  kind: p
  original: In der wirklichen Gemeinschaft erlangen die Individuen in und durch ihre Assoziation zugleich ihre Freiheit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: I.122.1
  kind: p
  original: Es geht aus der ganzen bisherigen Entwicklung hervor, daß das gemeinschaftliche Verhältnis, in das die Individuen einer Klasse traten und das durch ihre gemeinschaftlichen Interessen gegenüber einem Dritten bedingt war, stets eine Gemeinschaft war, der diese Individuen nur als Durchschnittsindividuen angehörten, nur soweit sie in den Existenzbedingungen ihrer Klasse lebten, ein Verhältnis, an dem sie nicht als Individuen, sondern als Klassenmitglieder teilhatten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: I.122.2
  kind: p
  original: Bei der Gemeinschaft der revolutionären Proletarier dagegen, die ihre und aller Gesellschaftsmitglieder Existenzbedingungen unter ihre Kontrolle nehmen, ist es gerade umgekehrt; an ihr nehmen die Individuen als Individuen Anteil.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 74-75
- id: I.122.3
  kind: p
  original: Es ist eben die Vereinigung der Individuen (innerhalb der Voraussetzung der jetzt entwickelten Produktivkräfte natürlich), die die Bedingungen der freien Entwicklung und Bewegung der Individuen unter ihre Kontrolle gibt, Bedingungen, die bisher dem Zufall überlassen waren und sich gegen die einzelnen Individuen eben durch ihre Trennung als Individuen, durch ihre notwendige Vereinigung, die mit der Teilung der Arbeit gegeben, und durch ihre Trennung zu einem ihnen fremden Bande geworden war, verselbständigt hatten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: I.122.4
  kind: p
  original: Die bisherige Vereinigung war nur eine (keineswegs willkürliche, wie sie z. B. im "Contrat social" dargestellt wird, sondern notwendige) Vereinigung (vergleiche z. B. die Bildung des nordamerikanischen Staats und die südamerikanischen Republiken) über diese Bedingungen, innerhalb deren dann die Individuen den Genuß der Zufälligkeit hatten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: I.122.5
  kind: p
  original: Dieses Recht, innerhalb gewisser Bedingungen ungestört der Zufälligkeit sich erfreuen zu dürfen, nannte man bisher persönliche Freiheit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: I.122.6
  kind: p
  original: '- Diese Existenzbedingungen sind natürlich nur die jedesmaligen Produktionskräfte und Verkehrsformen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: I.123.1
  kind: p
  original: Wenn man diese Entwicklung der Individuen in den gemeinsamen Existenzbedingungen der geschichtlich aufeinanderfolgenden Stände und Klassen und den ihnen damit aufgedrängten allgemeinen Vorstellungen philosophisch betrachtet, so kann man sich allerdings leicht einbilden, in diesen Individuen habe sich die Gattung oder der Mensch, oder sie haben den Menschen entwickelt; eine Einbildung, womit der Geschichte einige starke Ohrfeigen gegeben werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N32
  mew_page: '75'
- id: I.123.2
  kind: p
  original: Man kann dann diese verschiedenen Stände und Klassen als Spezifikationen des allgemeinen Ausdrucks, als Unterarten der Gattung, als Entwicklungsphasen des Menschen fassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: I.124.1
  kind: p
  original: Diese Subsumtion der Individuen unter bestimmte Klassen kann nicht eher aufgehoben werden, als bis sich eine Klasse gebildet hat, die gegen die herrschende Klasse kein besonderes Klasseninteresse mehr durchzusetzen hat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: I.125.1
  kind: p
  original: Die Individuen gingen immer von sich aus, natürlich aber von sich innerhalb ihrer gegebenen historischen Bedingungen und Verhältnisse, nicht vom "reinen" Individuum im Sinne der Ideologen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: I.125.2
  kind: p
  original: Aber im Lauf der historischen Entwicklung und gerade durch die innerhalb der Teilung der Arbeit unvermeidliche Verselbständigung der gesellschaftlichen Verhältnisse tritt ein Unterschied heraus zwischen dem Leben jedes Individuums, soweit es persönlich ist und insofern es unter irgendeinen Zweig der Arbeit und die dazugehörigen Bedingungen subsumiert ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 75-76
- id: I.125.3
  kind: p
  original: (Dies ist nicht so zu verstehen, als ob z.B. der Rentier, der Kapitalist pp. aufhörten, Personen zu sein; sondern ihre Persönlichkeit ist durch ganz bestimmte Klassenverhältnisse bedingt und bestimmt, und der Unterschied tritt erst im Gegensatz zu einer andern Klasse und für sie selbst erst dann hervor, wenn sie Bankerott machen.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: I.125.4
  kind: p
  original: Im Stand (mehr noch im Stamm) ist dies noch verdeckt, z.B. ein Adliger bleibt stets ein Adliger, ein Roturier <Nichtadliger, Bürgerlicher> stets ein Roturier, abgesehn von seinen sonstigen Verhältnissen, eine von seiner Individualität unzertrennliche Qualität.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: I.125.5
  kind: p
  original: Der Unterschied des persönlichen Individuums gegen das Klassenindividuum, die Zufälligkeit der Lebensbedingungen für das In[dividuum] tritt erst mit dem Auftreten der Klasse [ein], die selbst ein Produkt der Bourgeoisie ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: I.125.6
  kind: p
  original: Die Konkurrenz und der Kampf [der] Individuen untereinander erz[eugt und en]twickelt erst diese Zufälligkeit als solche.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: I.125.7
  kind: p
  original: In der Vorstellung sind daher die Individuen unter der Bourgeoisieherrschaft freier als früher, weil ihnen ihre Lebensbedingungen zufällig sind; in der Wirklichkeit sind sie natürlich unfreier, weil mehr unter sachliche Gewalt subsumiert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: I.125.8
  kind: p
  original: Der Unterschied vom Stand tritt namentlich heraus im Gegensatz der Bourgeoisie gegen das Proletariat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: I.125.9
  kind: p
  original: Als der Stand der städtischen Bürger, die Korporationen pp. gegenüber dem Landadel aufkamen, erschien ihre Existenzbedingung, das Mobileigentum und die Handwerksarbeit, die schon vor ihrer Trennung vom Feudalverbande latent existiert hatten, als etwas Positives, das gegen das feudale Grundeigentum geltend gemacht wurde, und nahm daher auch zunächst wieder die feudale Form in ihrer Weise an.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: I.125.10
  kind: p
  original: Allerdings behandelten die entlaufenden Leibeignen ihre bisherige Leibeigenschaft als etwas ihrer Persönlichkeit Zufälliges.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: I.125.11
  kind: p
  original: Hierin aber taten sie nur dasselbe, was jede sich von einer Fessel befreiende Klasse tut, und dann befreiten sie sich nicht als Klasse, sondern vereinzelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: I.125.12
  kind: p
  original: Sie traten ferner nicht aus dem Bereich des Ständewesens heraus, sondern bildeten nur einen neuen Stand und behielten ihre bisherige Arbeitsweise auch in der neuen Stellung bei und bildeten sie weiter aus, indem sie sie von ihren bisherigen, ihrer schon erreichten Entwicklung nicht [mehr] entsprechenden Fesseln befreiten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N33
  mew_page: '76'
- id: I.126.1
  kind: p
  original: Bei den Proletariern dagegen ist ihre eigne Lebensbedingung, die Arbeit, und damit sämtliche Existenzbedingungen der heutigen Gesellschaft, für sie zu etwas Zufälligem geworden, worüber die einzelnen Proletarier keine Kontrolle haben und worüber ihnen keine gesellschaftliche Organisation eine Kontrolle geben kann, und der Widerspruch zwischen der Persönlichkeit des einzelnen Proletariers und seiner ihm aufgedrängten Lebensbedingung, der Arbeit, tritt für ihn selbst hervor, namentlich da er schon von Jugend auf geopfert wird und da ihm die Chance fehlt, innerhalb seiner Klasse zu den Bedingungen zu kommen, die ihn in die andre stellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: I.127.1
  kind: p
  original: Während also die entlaufenden Leibeignen nur ihre bereits vorhandenen Existenzbedingungen frei entwickeln und zur Geltung bringen wollten und daher in letzter Instanz nur bis zur freien Arbeit kamen, müssen die Proletarier, um persönlich zur Geltung zu kommen, ihre eigne bisherige Existenzbedingung, die zugleich die der ganzen bisherigen Gesellschaft ist, die Arbeit, aufheben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: I.127.2
  kind: p
  original: Sie befinden sich daher auch im direkten Gegensatz zu der Form, in der die Individuen der Gesellschaft sich bisher einen Gesamtausdruck gaben, zum Staat, und müssen den Staat stürzen, um ihre Persönlichkeit durchzusetzen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: I.N1.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Wir schicken daher der speziellen Kritik der einzelnen Repräsentanten dieser Bewegung einige allgemeine Bemerkungen voraus (. Diese Bemerkungen werden hinreichen, um den Standpunkt unsrer Kritik so weit zu bezeichnen, als es zum Verständnis und zur Begründung der nachfolgenden Einzelkritiken nötig ist. Wir stellen diese Bemerkungen gerade Feuerbach gegenüber, weil er der Einzige ist, der wenigstens einen Fortschritt gemacht hat und auf dessen Sachen man de bonne foi <in gutem Glauben> eingehen kann), welche die ihnen allen gemeinsamen ideologischen Voraussetzungen näher beleuchten werden.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N1.2.1
  kind: note
  original: 1. Die Ideologie überhaupt, speziell die deutsche Philosophie
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N1.3.1
  kind: note
  original: Wir kennen nur eine einzige Wissenschaft, die Wissenschaft der Geschichte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N1.3.2
  kind: note
  original: Die Geschichte kann von zwei Seiten aus betrachtet, in die Geschichte der Natur und die Geschichte der Menschen aufgeteilt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N1.3.3
  kind: note
  original: Beide Seiten sind indes nicht zu trennen; solange Menschen existieren, bedingen sich Geschichte der Natur und Geschichte der Menschen gegenseitig.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N1.3.4
  kind: note
  original: Die Geschichte der Natur, die sogenannte Naturwissenschaft, geht uns hier nicht an; auf die Geschichte der Menschen werden wir indes einzugehen haben, da fast die ganze Ideologie sich entweder auf eine verdrehte Auffassung dieser Geschichte oder auf eine gänzliche Abstraktion von ihr reduziert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N1.3.5
  kind: note
  original: Die Ideologie selbst ist nur eine der Seiten dieser Geschichte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N2.1.1
  kind: note
  original: '[Im Manuskript gestrichen:]... die mit dem Anspruche auftrat, die absolute Erlöserin der Welt von allem Übel zu sein.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N2.1.2
  kind: note
  original: Die Religion wurde fortwährend als letzte Ursache aller diesen Philosophen widerwärtigen Verhältnisse, als Erzfeind angesehen und behandelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N3.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Der erste geschichtliche Akt dieser Individuen, wodurch sie sich von den Tieren unterscheiden, ist nicht, daß sie denken, sondern, daß sie anfangen, ihre Lebensmittel zu produzieren.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N4.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Diese Verhältnisse bedingen aber nicht nur die ursprüngliche, naturwüchsige Organisation der Menschen, namentlich die Rassenunterschiede, sondern auch ihre ganze weitere Entwicklung oder Nicht-Entwicklung bis auf den heutigen Tag.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N5.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Die Vorstellungen, die sich diese Individuen machen, sind Vorstellungen entweder über ihr Verhältnis zur Natur oder über ihr Verhältnis untereinander, oder über ihre eigne Beschaffenheit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N5.1.2
  kind: note
  original: Es ist einleuchtend, daß in allen diesen Fällen diese Vorstellungen der - wirkliche oder illusorische - bewußte Ausdruck ihrer wirklichen Verhältnisse und Betätigung, ihrer Produktion, ihres Verkehrs, ihrer gesellschaftlichen und politischen Organisation sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N5.1.3
  kind: note
  original: Die entgegengesetzte Annahme ist nur dann möglich, wenn man außer dem Geist der wirklichen, materiell bedingten Individuen noch einen aparten Geist voraussetzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N5.1.4
  kind: note
  original: Ist der bewußte Ausdruck der wirklichen Verhältnisse dieser Individuen illusorisch, stellen sie in ihren Vorstellungen ihre Wirklichkeit auf den Kopf, so ist dies wiederum eine Folge ihrer bornierten materiellen Betätigungsweise und ihrer daraus entspringenden bornierten gesellschaftlichen Verhältnisse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N6.1.1
  kind: note
  original: '[Randbemerkung von Marx:] Hegel.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N6.1.2
  kind: note
  original: Geologische, hydrographische etc. Verhältnisse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N6.1.3
  kind: note
  original: Die menschlichen Leiber.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N6.1.4
  kind: note
  original: Bedürfnis, Arbeit.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N7.1.1
  kind: note
  original: Häuserbau.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N7.1.2
  kind: note
  original: Bei den Wilden versteht es sich von selbst, daß jede Familie ihre eigne Höhle oder Hütte hat, wie bei den Nomaden das separate Zelt jeder Familie.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N7.1.3
  kind: note
  original: Diese getrennte Hauswirtschaft wird durch die weitere Entwicklung des Privateigentums nur noch nötiger gemacht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N7.1.4
  kind: note
  original: Bei den Agrikulturvölkern ist die gemeinsame Hauswirtschaft ebenso unmöglich wie die gemeinsame Bodenkultur.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N7.1.5
  kind: note
  original: Ein großer Fortschritt war die Erbauung von Städten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N7.1.6
  kind: note
  original: In allen bisherigen Perioden war indes die Aufhebung der getrennten Wirtschaft, die von der Aufhebung des Privateigentums nicht zu trennen ist, schon deswegen unmöglich, weil die materiellen Bedingungen dazu nicht vorhanden waren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N7.1.7
  kind: note
  original: Die Einrichtung einer gemeinsamen Hauswirtschaft setzt die Entwicklung der Maschinerie, der Benutzung der Naturkräfte und vieler andern Produktivkräfte voraus - z.B. der Wasserleitungen, der Gasbeleuchtung, der Dampfheizung etc., Aufhebung [des Gegensatzes] von Stadt und Land.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N7.1.8
  kind: note
  original: Ohne diese Bedingungen würde die gemeinsame Wirtschaft nicht selbst wieder eine neue Produktionskraft sein, aller materiellen Basis entbehren, auf einer bloß theoretischen Grundlage beruhen, d.h. eine bloße Marotte sein und es nur zur Klosterwirtschaft bringen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N7.1.9
  kind: note
  original: '- Was möglich war, zeigt sich in der Zusammenrückung zu Städten und in der Erbauung gemeinsamer Häuser zu einzelnen bestimmten Zwecken (Gefängnisse, Kasernen pp.)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N7.1.10
  kind: note
  original: Daß die Aufhebung der getrennten Wirtschaft von der Aufhebung der Familie nicht zu trennen ist, versteht sich von selbst.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N8.1.1
  kind: note
  original: 'Die Menschen haben Geschichte, weil sie ihr Leben produzieren müssen, und zwar müssen auf bestimmte Weise: dies ist durch ihre physische Organisation gegeben; ebenso wie ihr Bewußtsein.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N9.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Mein Verhältnis zu meiner Umgebung ist mein Bewußtsein.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N10.1.1
  kind: note
  original: '[Randbemerkung von Marx:] Erste Form der Ideologen, Pfaffen, fällt zusammen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N11.1.1
  kind: note
  original: '[Randbemerkung von Marx:] Religion.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N11.1.2
  kind: note
  original: Die Deutschen mit der Ideologie als solcher.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N12.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Bisher haben wir hauptsächlich nur die eine Seite der menschlichen Tätigkeit, die Bearbeitung der Natur durch die Menschen betrachtet.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N12.1.2
  kind: note
  original: Die andre Seite, die Bearbeitung der Menschen durch die Menschen...
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N12.1.3
  kind: note
  original: Ursprung des Staats und das Verhältnis des Staats zur bürgerlichen Gesellschaft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N13.1.1
  kind: note
  original: '[Randbemerkung von Marx:] Die sogenannte objektive Geschichtschreibung bestand eben darin, die geschichtlichen Verhältnisse getrennt von der Tätigkeit aufzufassen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N13.1.2
  kind: note
  original: Reaktionärer Charakter.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N14.1.1
  kind: note
  original: N.B. Nicht daß Feuerbach das auf platter Hand Liegende, den sinnlichen Schein der durch genauere Untersuchung des sinnlichen Tatbestandes konstatierten sinnlichen Wirklichkeit unterordnet, ist der Fehler, sondern daß er in letzter Instanz nicht mit der Sinnlichkeit fertig werden kann, ohne sie mit den "Augen", d.h. durch die "Brille" des Philosophen zu betrachten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N15.1.1
  kind: note
  original: '[im Manuskript gestrichen:] Wenn wir nun dennoch auf die Geschichte hier näher eingehen, so geschieht es deshalb, weil die Deutschen gewohnt sind, bei den Worten Geschichte und geschichtlich sich alles Mögliche, nur nicht das Wirkliche vorzustellen, wovon namentlich der "kanzelberedsamkeitliche" Sankt Bruno ein glänzendes Exempel ablegt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N16.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Diese "herrschenden Begriffe" werden eine um so allgemeinere und umfassendere Form haben, je mehr die herrschende Klasse genötigt ist, ihr Interesse als das aller Mitglieder der Gesellschaft darzustellen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N16.1.2
  kind: note
  original: Die herrschende Klasse selbst hat im Durchschnitt die Vorstellung, daß diese ihre Begriffe herrschten und unterscheidet sie nur dadurch von herrschenden Vorstellungen früherer Epochen, daß sie sie als ewige Wahrheiten darstellt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N17.1.1
  kind: note
  original: '[Randbemerkung von Marx:] Die Allgemeinheit entspricht 1. der Klasse contra Stand, 2. der Konkurrenz, Weltverkehr, etc., 3. der großen Zahlreichheit der herrschenden Klasse, 4. der Illusion der gemeinschaftlichen Interessen (im Anfang diese Illusion wahr), 5. der Täuschung der Ideologen und der Teilung der Arbeit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N18.1.1
  kind: note
  original: '[Randbemerkung von Marx:] Der Mensch = dem "denkenden Menschengeist".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N19.1.1
  kind: note
  original: '[Randbemerkung von Marx:] Sie absorbiert zunächst die dem Staat direkt angehörigen Arbeitszweige, dann alle ± [mehr oder weniger] ideologischen Stände'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N20.1.1
  kind: note
  original: '[Randbemerkung von Marx:] Kleinbürger - Mittelstand - Große Bourgeoisie.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N21.1.1
  kind: note
  original: Die Bewegung des Kapitals, obwohl bedeutend beschleunigt, blieb doch noch stets verhältnismäßig langsam.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N21.1.2
  kind: note
  original: Die Zersplitterung des Weltmarktes in einzelne Teile, deren Jeder von einer besondern Nation ausgebeutet wurde, die Ausschließung der Konkurrenz der Nationen unter sich, die Unbehülflichkeit der Produktion selbst und das aus den ersten Stufen sich erst entwickelnde Geldwesen hielten die Zirkulation sehr auf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N21.1.3
  kind: note
  original: Die Folge davon war ein krämerhafter, schmutzig-kleinlicher Geist, der allen Kaufleuten und der ganzen Weise des Handelsbetriebs noch anhaftete.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N21.1.4
  kind: note
  original: Im Vergleich mit den Manufacturiers und vollends den Handwerkern waren sie allerdings Großbürger, Bourgeois, im Vergleich zu den Kaufleuten und Industriellen der nächsten Periode bleiben sie Kleinbürger.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N21.1.5
  kind: note
  original: Vgl. A. Smith.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N22.1.1
  kind: note
  original: Die Konkurrenz isoliert die Individuen, nicht nur die Bourgeois, sondern noch mehr die Proletarier gegeneinander, trotzdem daß sie sie zusammenbringt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N22.1.2
  kind: note
  original: Daher dauert es lange Zeit, bis diese Individuen sich vereinigen können, abgesehn davon, daß zu dieser Vereinigung - wenn sie nicht bloß lokal sein soll - die nötigen Mittel, die großen Industriestädte und die wohlfeilen und schnellen Kommunikationen durch die große Industrie erst hergestellt sein müssen, und daher ist jede organisierte Macht gegenüber diesen isolierten und in Verhältnissen, die die Isolierung täglich reproduzieren, lebenden Individuen erst nach langen Kämpfen zu besiegen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N22.1.3
  kind: note
  original: Das Gegenteil verlangen, hieße ebensoviel wie zu verlangen, daß die Konkurrenz in dieser bestimmten Geschichtsepoche nicht existieren soll oder daß die Individuen Verhältnisse, über die sie als Isolierte keine Kontrolle haben, sich aus dem Kopf schlagen sollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N23.1.1
  kind: note
  original: '[Randbemerkung von Engels:] (Wucher!)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N24.1.1
  kind: note
  original: Verhältnis für die Philosophen = Idee.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N24.1.2
  kind: note
  original: Sie kennen bloß das Verhältnis " des Menschen" zu sich selbst, und darum werden alle wirklichen Verhältnisse ihnen zu Ideen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N25.1.1
  kind: note
  original: '[Randbemerkung von Engels:] Sismondi'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N26.1.1
  kind: note
  original: '[Randbemerkung von Marx:] Daß die Leute interessiert sind, den jetzigen Produktionszustand zu erhalten.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N27.1.1
  kind: note
  original: '[Im Manuskript gestrichen:]... die moder[ne] Form der Tätigkeit unter der die Herrschaft der...'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N28.1.1
  kind: note
  original: '[Im Manuskript gestrichen:] Während über diese Notwendigkeit der Revolution sämtliche Kommunisten sowohl in Frankreich, wie in England und Deutschland seit geraumer Zeit einverstanden sind, träumt der heilige Bruno ruhig weiter fort, und meint, der "Reale Humanismus", d.h. Kommunismus, werde nur deswegen "an die Stelle des Spiritualismus" (der keine Stelle hat) gesetzt, damit er Verehrung gewinne.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N28.1.2
  kind: note
  original: Dann, träumt er fort, müsse wohl "das Heil gekommen, die Erde zum Himmel und der Himmel zur Erde gemacht sein".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N28.1.3
  kind: note
  original: (Der Gottesgelahrte kann den Himmel noch immer nicht verschmerzen.)
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N28.1.4
  kind: note
  original: '"Dann tönt in himmlischen Harmonien Freud und Wonne von Ewigkeit zu Ewigkeit" (p. 140).'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N28.1.5
  kind: note
  original: Der heilige Kirchenvater wird sich doch sehr wundern, wenn der jüngste Tag, an dem sich dies alles erfüllet über ihn hereinbricht - ein Tag, dessen Morgenrot der Widerschein brennender Städte am Himmel ist, wenn unter diesen "himmlischen Harmonien" die Melodie der Marseillaise und Carmagnole mit obligatem Kanonendonner an sein Ohr hallt, und die Guillotine dazu den Takt schlägt; wenn die verruchte "Masse" ça ira, ça ira brüllt und das "Selbstbewußtsein" vermittelst der Laterne aufhebt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N28.1.6
  kind: note
  original: Der heilige Bruno hat am allerwenigsten Ursache, sich von der "Freud und Wonne von Ewigkeit zu Ewigkeit", ein erbauliches Gemälde zu entwerfen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N28.1.7
  kind: note
  original: Wir enthalten uns des Vergnügens, das Verhalten Sankt Brunos am jüngsten Tage a priori zu konstruieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N28.1.8
  kind: note
  original: Es ist auch schwer zu entscheiden, ob die prolétaires en révolution als "Substanz", als "Masse", die die Kritik stürzen will, oder als "Emanation" des Geistes, der indessen noch die zur Verdauung Bauerscher Gedanken nötige Konsistenz abgeht, gefaßt werden müßten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N29.1.1
  kind: note
  original: '[Randbemerkung von Marx:] Produktion der Verkehrsform selbst.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N30.1.1
  kind: note
  original: Persönliche Energie der Individuen einzelner Nationen - Deutsche und Amerikaner - Energie schon durch Rassenkreuzung - daher die Deutschen kretinmäßig - in Frankreich, England etc. fremde Völker auf einen schon entwickelten, in Amerika auf einen ganz neuen Boden verpflanzt, in Deutschland die naturwüchsige Bevölkerung ruhig sitzengeblieben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N31.1.1
  kind: note
  original: '[Randbemerkung von Engels:] (Feuerbach: Sein und Wesen)'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N32.1.1
  kind: note
  original: Der bei Sankt Max häufig vorkommende Satz, daß Jeder Alles, was er ist, durch den Staat ist, ist im Grunde derselbe wie der, daß der Bourgeois nur ein Exemplar der Bourgeoisgattung sei; ein Satz, der voraussetzt, daß die Klasse der Bourgeois schon vor den sie konstituierenden Individuen existiert habe.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N32.1.2
  kind: note
  original: '[Zu diesem Satz Randbemerkung von Marx:] Präexistenz der Klasse bei den Philosophen'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N33.1.1
  kind: note
  original: N.B. Nicht zu vergessen, daß schon die Notwendigkeit der Leibeignen, zu existieren, und die Unmöglichkeit der großen Wirtschaft, die die Verteilung der allotments <Parzellen> an die Leibeignen mit sich führte, sehr bald die Verpflichtungen der Leibeignen gegen den Feudalherrn auf einen Durchschnitt von Naturallieferungen und Fronleistungen reduzierte, der dem Leibeignen die Akkumulation von Mobiliareigentum möglich machte und damit sein Entfliehen von dem Besitztum seines Herrn erleichterte und ihm Aussicht auf sein Fortkommen als Stadtbürger gab, auch Abstufungen unter den Leibeignen erzeugte, so daß die weglaufenden Leibeignen schon halbe Bürger sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N33.1.2
  kind: note
  original: Wobei es ebenfalls einleuchtet, daß die eines Handwerks kundigen leibeignen Bauern am meisten Chance hatten, sich Mobiliareigentum zu erwerben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
