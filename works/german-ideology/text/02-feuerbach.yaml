section: I
title_original: I Feuerbach Gegensatz von materialistischer und idealistischer Anschauung [Einleitung]
title_en: I. Feuerbach
author: Karl Marx, Friedrich Engels
date: 1845-1846
original_language: de
anchor_language: de
source_original: MEW 3, S. 17-77 (Dietz, Berlin 1969) via mlwerke.de; written 1845-1846, first printed in full 1932; the authors' footnotes from mlwerke's me03_anm.htm
source_en: 'None: no public-domain English translation'
verses:
