- id: VIII.11.27
  kind: p
  original: Jetzt wurde das Komitee verhaftet, die Untersuchung begonnen und infolge derselben der Präsident und die Hauptmitglieder der Teilnahme an ungesetzlichen Verbindungen, der Mißhandlung der Knobsticks und der Brandstiftung in der Fabrik von James und Francis Wood schuldig befunden und für 7 Jahre transportiert.
  en: The committee was now arrested, an investigation begun, and the leading members found guilty of participation in conspiracies, maltreatment of knobsticks, and incendiarism in the mill of James and Francis Wood, and they were transported for seven years.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 438-439
- id: VIII.11.28
  kind: p
  original: '- Was sagen unsere guten Deutschen zu dieser Geschichte?'
  en: What do our good Germans say to this story?
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VIII.N2
  mew_page: '439'
- id: VIII.12.1
  kind: p
  original: Die besitzende Klasse und namentlich der fabrizierende Teil derselben, der unmittelbar mit den Arbeitern in Berührung kommt, eifert mit der größten Heftigkeit gegen diese Verbindungen und sucht den Arbeitern fortwährend die Nutzlosigkeit derselben mit Gründen zu beweisen, die national-ökonomisch ganz richtig, aber eben deswegen teilweise falsch und für einen Arbeiterverstand ganz und gar wirkungslos sind.
  en: The property-holding class, and especially the manufacturing portion of it which comes into direct contact with the working-men, declaims with the greatest violence against these Unions, and is constantly trying to prove their uselessness to the working-men upon grounds which are economically perfectly correct, but for that very reason partially mistaken, and for the working-man's understanding totally without effect.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '439'
- id: VIII.12.2
  kind: p
  original: Schon der Eifer der Bourgeoisie beweist, daß sie nicht uninteressiert bei der Sache ist, und abgesehen von dem unmittelbaren Schaden eines Turnouts stehen die Sachen hier so, daß das, was in die Taschen des Fabrikanten geht, notwendig aus der des Arbeiters gehen muß.
  en: The very zeal of the bourgeoisie shows that it is not disinterested in the matter; and apart from the indirect loss involved in a turnout, the state of the case is such that whatever goes into the pockets of the manufacturers comes of necessity out of those of the worker.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '439'
- id: VIII.12.3
  kind: p
  original: Und wußten selbst die Arbeiter nicht zu gut, daß die Verbindungen die wetteifernde Lohnkürzungslust ihrer Brotherrn wenigstens einigermaßen im Zaume halten, so würden sie schon deshalb dabeibleiben, weil sie den Fabrikanten, ihren Gegnern, dadurch schaden.
  en: So that even if the working-men did not know that the Unions hold the emulation of their masters in the reduction of wages, at least in a measure, in check, they would still stand by the Unions, simply to the injury of their enemies, the manufacturers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '439'
- id: VIII.12.4
  kind: p
  original: Im Kriege ist der Schaden einer Partei der Nutzen der andern, und da die Arbeiter gegen ihre Fabrikherrn auf dem Kriegsfuße stehen, so ist das nur dasselbe, was die hohen Potentaten auch tun, wenn sie sich gegenseitig in die Haare geraten.
  en: In war the injury of one party is the benefit of the other, and since the working-men are on a war-footing towards their employers, they do merely what the great potentates do when they get into a quarrel.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '439'
- id: VIII.12.5
  kind: p
  original: '- Vor allen andern Bourgeois ist wieder unser Freund, der Doktor Ure, der wütendste Feind aller Arbeiterverbindungen.'
  en: Beyond all other bourgeois is our friend Dr. Ure, the most furious enemy of the Unions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '439'
- id: VIII.12.6
  kind: p
  original: Er schäumt vor Entrüstung über die "geheimen Tribunale" der Baumwollspinner, der mächtigsten Arbeitersektion, Tribunale, die sich rühmen, jeden ungehorsamen Fabrikanten paralysieren zu können, "und so den Mann ruinieren, der ihnen jahrelang Unterhalt gab".
  en: He foams with indignation at the "secret tribunals" of the cotton-spinners, the most powerful section of the workers, tribunals which boast their ability to paralyse every disobedient manufacturer, "and so bring ruin on the man who had given them profitable employment for many a year."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '439'
  en_note: 'English note {222a}: Dr. Ure, "Philosophy of Manufacture," p. 282.'
- id: VIII.12.7
  kind: p
  original: 'Er spricht von einer Zeit, "wo das erfinderische Haupt und das belebende Herz der Industrie durch die unruhigen unteren Glieder in Knechtschaft erhalten wurden" - schade, daß die englischen Arbeiter sich nicht so leicht durch deine Fabel beschwichtigen lassen wie die römischen Plebejer, neuer Menenius Agrippa! -, und erzählt endlich folgende schöne Geschichte: Die Mule-Grobspinner hätten auch einmal ihre Kräfte bis zur Unerträglichkeit gemißbraucht.'
  en: 'He speaks of a time "when the inventive head and the sustaining heart of trade were held in bondage by the unruly lower members." A pity that the English working-men will not let themselves be pacified so easily with thy fable as the Roman Plebs, thou modern Menenius Agrippa! Finally, he relates the following: At one time the coarse mule-spinners had misused their power beyond all endurance.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 439-440
  en_note: 'English note {222b}: Ibid., p. 282.'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VIII.12.8
  kind: p
  original: Hoher Lohn, anstatt zu dankbarem Sinne gegen den Fabrikanten und geistiger Ausbildung (in unschädlichen, der Bourgeoisie wohl gar nützlichen Wissenschaften, versteht sich) zu führen, habe in vielen Fällen Stolz hervorgebracht und Gelder zur Unterstützung des widerspenstigen Geistes in Strikes herbeigeschafft, mit denen eine Anzahl von Fabrikanten nach der andern ganz willkürlich heimgesucht worden sei.
  en: High wages, instead of awakening thankfulness towards the manufacturers and leading to intellectual improvement (in harmless study of sciences useful to the bourgeoisie, of course), in many cases produced pride and supplied funds for supporting rebellious spirits in strikes, with which a number of manufacturers were visited one after the other in a purely arbitrary manner.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '440'
- id: VIII.12.9
  kind: p
  original: Während eines unglückseligen Lärms dieser Art in Hyde, Dukinfield und den umliegenden Ortschaften hätten sich die Fabrikanten der Gegend, besorgt, von den Franzosen, Belgiern und Amerikanern aus dem Markte vertrieben zu werden, an die Maschinenfabrik von Sharp, Roberts und Comp. mit der Bitte gewandt, das erfinderische Talent des Herrn Sharp auf die Konstruktion einer automatischen Mule zu lenken, um "das Geschäft von vergällender Sklaverei und drohendem Ruin zu retten".
  en: During an unhappy disturbance of this sort in Hyde, Dukinfield, and the surrounding neighbourhood, the manufacturers of the district, anxious lest they should be driven from the market by the French, Belgians, and Americans, addressed themselves to the machine-works of Sharp, Roberts & Co., and requested Mr. Sharp to turn his inventive mind to the construction of an automatic mule in order "to emancipate the trade from galling slavery and impending ruin."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '440'
- id: VIII.13.1
  kind: p
  original: '"In wenig Monaten war eine Maschine fertig, die dem Anscheine nach mit dem Denkvermögen, Gefühl und Takt des erfahrnen Arbeiters begabt war.'
  en: '"He produced in the course of a few months a machine apparently instinct with the thought, feeling, and tact of the experienced workman--which even in its infancy displayed a new principle of regulation, ready in its mature state to fulfil the functions of a finished spinner.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '440'
  review: true
