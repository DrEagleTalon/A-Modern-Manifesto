- id: VIII.11.26
  kind: p
  original: 1837 endlich, im Mai, fielen infolge eines Turnouts bei den Oatbank- und Mile-End-Fabriken Unruhen vor, wobei etwa ein Dutzend Knobsticks mißhandelt wurden; im Juli desselben Jahres dauerten die Unruhen noch fort, und ein gewisser Smith, ein Knobstick, wurde so mißhandelt, daß er starb.
  en: Finally, in 1837, in May, disturbances occurred in consequence of a turnout in the Oatbank and Mile End factories, in which perhaps a dozen knobsticks were maltreated. In July, of the same year, the disturbances still continued, and a certain Smith, a knobstick, was so maltreated that he died.
  modern: ''
