section: VIII
title_original: Arbeiterbewegungen
title_en: Labour Movements
author: Friedrich Engels
date: 1844-11/1845-03
original_language: de
anchor_language: de
source_original: MEW 2, S. 225-506 (Dietz, Berlin 1972) via mlwerke.de; text of the first edition (Leipzig 1845), readings of the second edition (Stuttgart 1892) as variants
source_en: Florence Kelley Wischnewetzky's translation (New York 1887) in the London edition of 1892 (Swan Sonnenschein), Project Gutenberg ebook 17306 (public domain)
verses:
- id: VIII.0.1
  kind: heading
  original: Arbeiterbewegungen
  en: LABOUR MOVEMENTS.
  modern: ''
  modern_status: empty
  notes: ''
- id: VIII.1.1
  kind: p
  original: Man wird mir zugehen, selbst wenn ich es nicht so oft im einzelnen nachgewiesen hätte, daß die englischen Arbeiter sich in dieser Lage nicht glücklich fühlen können; daß die ihrige keine Lage ist, in der ein Mensch oder eine ganze Klasse von Menschen menschlich denken, fühlen und leben können.
  en: It must be admitted, even if I had not proved it so often in detail, that the English workers cannot feel happy in this condition; that theirs is not a state in which a man or a whole class of men can think, feel, and live as human beings.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T1
    editions: '1892'
    reading: kann
    base_text: … fühlen und leben können ‸ . …
  mew_page: '430'
- id: VIII.1.2
  kind: p
  original: 'Die Arbeiter müssen sich also bestreben, aus dieser vertierenden Lage herauszukommen, sich eine bessere, menschlichere Stellung zu verschaffen, und dies können sie nicht tun, ohne gegen das Interesse der Bourgeoisie als solcher, das eben in der Ausbeutung der Arbeiter besteht, anzukämpfen: die Bourgeoisie aber verteidigt ihr Interesse mit allen Kräften, die sie durch den Besitz und die ihr zu Gebote stehende Staatsmacht aufzuwenden imstande ist.'
  en: The workers must therefore strive to escape from this brutalizing condition, to secure for themselves a better, more human position; and this they cannot do without attacking the interest of the bourgeoisie which consists in exploiting them. But the bourgeoisie defends its interests with all the power placed at its disposal by wealth and the might of the State.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '430'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.1.3
  kind: p
  original: Sowie der Arbeiter sich aus der jetzigen Lage der Dinge herausarbeiten will, wird der Bourgeois sein erklärter Feind.
  en: In proportion as the working-man determines to alter the present state of things, the bourgeois becomes his avowed enemy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '430'
- id: VIII.2.1
  kind: p
  original: Der Arbeiter merkt es aber außerdem jeden Augenblick, daß die Bourgeoisie ihn wie eine Sache, wie ihr Eigentum behandelt, und schon deshalb tritt er als Feind der Bourgeoisie auf.
  en: Moreover, the working-man is made to feel at every moment that the bourgeoisie treats him as a chattel, as its property, and for this reason, if for no other, he must come forward as its enemy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '430'
- id: VIII.2.2
  kind: p
  original: Ich habe oben an hundert Beispielen nachgewiesen und hätte an hundert andern nachweisen können, daß unter den jetzigen Verhältnissen der Arbeiter seine Menschheit nur durch den Haß und die Empörung gegen die Bourgeoisie retten kann.
  en: I have shown in a hundred ways in the foregoing pages, and could have shown in a hundred others, that, in our present society, he can save his manhood only in hatred and rebellion against the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '430'
- id: VIII.2.3
  kind: p
  original: Und daß er mit der heftigsten Leidenschaft gegen die Tyrannei der Besitzenden protestieren kann, dafür sorgt seine Erziehung oder vielmehr Erziehungslosigkeit und das viele heiße irische Blut, das in die englische Arbeiterklasse übergegangen ist.
  en: And he can protest with most violent passion against the tyranny of the propertied class, thanks to his education, or rather want of education, and to the abundance of hot Irish blood that flows in the veins of the English working-class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '430'
- id: VIII.2.4
  kind: p
  original: Der englische Arbeiter ist kein Engländer mehr, kein kalkulierender Geldmensch wie sein besitzender Nachbar, er hat voller entwickelte Gefühle, seine angeborne nordische Kälte wird durch die Ungebundenheit, in der seine Leidenschaften sich ausbilden und die Herrschaft über ihn erringen konnten, aufgewogen.
  en: The English working-man is no Englishman nowadays; no calculating money-grabber like his wealthy neighbour. He possesses more fully developed feelings, his native northern coldness is overborne by the unrestrained development of his passions and their control over him.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '430'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.2.5
  kind: p
  original: Die Verstandesbildung, die die selbstsüchtige Anlage des englischen Bourgeois so bedeutend entwickelt, die die Selbstsucht zu seiner herrschenden Leidenschaft gemacht und alle Gefühlskraft auf den einen Punkt der Geldgier konzentriert hat, fehlt dem Arbeiter, und dafür sind seine Leidenschaften stark und mächtig wie beim Ausländer.
  en: The cultivation of the understanding which so greatly strengthens the selfish tendency of the English bourgeois, which has made selfishness his predominant trait and concentrated all his emotional power upon the single point of money-greed, is wanting in the working-man, whose passions are therefore strong and mighty as those of the foreigner.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 430-431
- id: VIII.2.6
  kind: p
  original: Die englische Nationalität ist im Arbeiter vernichtet.
  en: English nationality is annihilated in the working-man.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '431'
- id: VIII.3.1
  kind: p
  original: Wenn, wie wir sahen, dem Arbeiter kein einziges Feld für die Betätigung seiner Menschheit gelassen ist als die Opposition gegen seine ganze Lebenslage, so ist es natürlich, daß gerade in dieser Opposition die Arbeiter am liebenswürdigsten, am edelsten, am menschlichsten erscheinen müssen.
  en: Since, as we have seen, no single field for the exercise of his manhood is left him, save his opposition to the whole conditions of his life, it is natural that exactly in this opposition he should be most manly, noblest, most worthy of sympathy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '431'
- id: VIII.3.2
  kind: p
  original: Wir werden sehen, daß alle Kraft, alle Tätigkeit der Arbeiter sich auf diesen einen Punkt richtet und daß selbst die Bemühungen, sich sonstige humane Bildung zu erwerben, alle in direkter Verbindung mit ihm stehen.
  en: We shall see that all the energy, all the activity of the working-men is directed to this point, and that even their attempts to attain general education all stand in direct connection with this.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '431'
- id: VIII.3.3
  kind: p
  original: Wir werden allerdings von einzelnen Gewaltsamkeiten und selbst Brutalitäten zu berichten haben, aber es ist immer zu bedenken, daß der soziale Krieg in England offen besteht und daß, wenn es das Interesse der Bourgeoisie ist, diesen Krieg heuchlerisch, unter dem Scheine des Friedens und selbst der Philanthropie zu führen, dem Arbeiter nur eine Offenlegung der wahren Verhältnisse, eine Zerstörung dieser Heuchelei dienen kann; daß also selbst die gewaltsamsten Feindseligkeiten der Arbeiter gegen die Bourgeoisie und ihre Diener nur der offene, unverhohlene Ausdruck dessen sind, was die Bourgeoisie den Arbeitern verstohlen und heimtückisch antut.
  en: True, we shall have single acts of violence and even of brutality to report, but it must always be kept in mind that the social war is avowedly raging in England; and that, whereas it is in the interest of the bourgeoisie to conduct this war hypocritically, under the disguise of peace and even of philanthropy, the only help for the working-men consists in laying bare the true state of things and destroying this hypocrisy; that the most violent attacks of the workers upon the bourgeoisie and its servants are only the open, undisguised expression of that which the bourgeoisie perpetrates secretly, treacherously against the workers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '431'
- id: VIII.4.1
  kind: p
  original: Die Empörung der Arbeiter gegen die Bourgeoisie hat bald nach der industriellen Entwicklung angefangen und verschiedene Phasen durchgemacht.
  en: The revolt of the workers began soon after the first industrial development, and has passed through several phases.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '431'
- id: VIII.4.2
  kind: p
  original: Es ist hier nicht der Ort, die historische Bedeutung dieser Phasen für die Entwicklung des englischen Volks näher darzulegen; dies muß ich mir für eine spätere Arbeit vorbehalten und mich einstweilen auf die bloßen Tatsachen, soweit sie zur Charakteristik der Lage des englischen Proletariats dienen, beschränken.
  en: The investigation of their importance in the history of the English people I must reserve for separate treatment, limiting myself meanwhile to such bare facts as serve to characterise the condition of the English proletariat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '431'
- id: VIII.5.1
  kind: p
  original: Die erste, rohste und unfruchtbarste Form dieser Empörung war das Verbrechen.
  en: The earliest, crudest, and least fruitful form of this rebellion was that of crime.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '431'
- id: VIII.5.2
  kind: p
  original: Der Arbeiter lebte in Not und Elend und sah, daß andere Leute es besser hatten als er.
  en: The working-man lived in poverty and want, and saw that others were better off than he.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '431'
- id: VIII.5.3
  kind: p
  original: Seinem Verstande leuchtete nicht ein, weshalb er grade, der doch mehr für die Gesellschaft tat als der reiche Faulenzer, unter diesen Umständen leiden sollte.
  en: It was not clear to his mind why he, who did more for society than the rich idler, should be the one to suffer under these conditions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '431'
- id: VIII.5.4
  kind: p
  original: Die Not besiegte noch dazu den angestammten Respekt vor dem Eigentum - er stahl.
  en: Want conquered his inherited respect for the sacredness of property, and he stole.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '431'
- id: VIII.5.5
  kind: p
  original: Wir sahen, wie mit der Ausdehnung der Industrie das Verbrechen zunahm, wie die jährliche Zahl der Verhaftungen im steten Verhältnis zu der der konsumierten Baumwollballen steht.
  en: We have seen how crime increased with the extension of manufacture; how the yearly number of arrests bore a constant relation to the number of bales of cotton annually consumed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '431'
- id: VIII.6.1
  kind: p
  original: Aber die Arbeiter sahen bald ein, daß dies nichts half.
  en: The workers soon realised that crime did not help matters.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '431'
- id: VIII.6.2
  kind: p
  original: Die Verbrecher konnten nur einzeln, nur als Individuen durch ihren Diebstahl gegen die bestehende Gesellschaftsordnung protestieren; die ganze Macht der Gesellschaft warf sich auf jeden einzeln und erdrückte ihn mit einer ungeheuren Übermacht.
  en: The criminal could protest against the existing order of society only singly, as one individual; the whole might of society was brought to bear upon each criminal, and crushed him with its immense superiority.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 431-432
- id: VIII.6.3
  kind: p
  original: Zudem war der Diebstahl die ungebildetste, bewußtloseste Form der Protestation und schon deshalb nie der allgemeine Ausdruck für die öffentliche Meinung der Arbeiter, obwohl sie ihn im stillen billigen mochte.
  en: Besides, theft was the most primitive form of protest, and for this reason, if for no other, it never became the universal expression of the public opinion of the working-men, however much they might approve of it in silence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '432'
- id: VIII.6.4
  kind: p
  original: Die Arbeiterklasse ergriff erst Opposition gegen die Bourgeoisie, als sie sich gewaltsam der Einführung von Maschinerie widersetzte, wie dies gleich im Anfange der industriellen Bewegung geschah.
  en: As a class, they first manifested opposition to the bourgeoisie when they resisted the introduction of machinery at the very beginning of the industrial period.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '432'
- id: VIII.6.5
  kind: p
  original: Die ersten Erfinder, Arkwright usw., wurden schon auf diese Weise verfolgt und ihre Maschinen zerschlagen; später kamen eine Menge von Aufständen gegen Maschinerie vor, bei denen es fast genauso zuging wie bei den böhmischen Druckerunruhen im Juni 1844; die Fabriken wurden demoliert und die Maschinen zertrümmert.
  en: The first inventors, Arkwright and others, were persecuted in this way and their machines destroyed. Later, there took place a number of revolts against machinery, in which the occurrences were almost precisely the same as those of the printers' disturbances in Bohemia in 1844; factories were demolished and machinery destroyed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '432'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.7.1
  kind: p
  original: Auch diese Art der Opposition war nur vereinzelt, auf gewisse Lokalitäten beschränkt und richtete sich nur gegen eine einzige Seite der jetzigen Verhältnisse.
  en: This form of opposition also was isolated, restricted to certain localities, and directed against one feature only of our present social arrangements.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '432'
- id: VIII.7.2
  kind: p
  original: War der augenblickliche Zweck erreicht, so fiel die volle Wucht der gesellschaftlichen Macht auf die wieder wehrlosen Übeltäter und züchtigte sie nach Herzenslust, während die Maschinerie dennoch eingeführt wurde.
  en: When the momentary end was attained, the whole weight of social power fell upon the unprotected evil-doers and punished them to its heart's content, while the machinery was introduced none the less.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '432'
- id: VIII.7.3
  kind: p
  original: Man mußte eine neue Form für die Opposition finden.
  en: A new form of opposition had to be found.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '432'
- id: VIII.8.1
  kind: p
  original: Hierzu half ein Gesetz, das vom alten, unreformierten, oligarchisch-torystischen Parlament erlassen wurde, ein Gesetz, das später, als durch die Reformbill der Gegensatz zwischen Bourgeoisie und Proletariat gesetzlich sanktioniert und die Bourgeoisie zur herrschenden Klasse erhoben wurde, nie mehr das Unterhaus passiert hätte.
  en: At this point help came in the shape of a law enacted by the old, unreformed, oligarchic-Tory parliament, a law which never could have passed the House of Commons later, when the Reform Bill had legally sanctioned the distinction between bourgeoisie and proletariat, and made the bourgeoisie the ruling class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '432'
- id: VIII.8.2
  kind: p
  original: Dies Gesetz ging im Jahre 1824 durch und hob alle Akte auf, durch welche bisher Verbindungen zwischen Arbeitern zu Arbeiterzwecken verboten gewesen waren.
  en: This was enacted in 1824, and repealed all laws by which coalitions between working-men for labour purposes had hitherto been forbidden.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '432'
- id: VIII.8.3
  kind: p
  original: Die Arbeiter bekamen das bis her nur der Aristokratie und Bourgeoisie gehörende Recht der freien Assoziation.
  en: The working-men obtained a right previously restricted to the aristocracy and bourgeoisie, the right of free association.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '432'
- id: VIII.8.4
  kind: p
  original: Geheime Verbindungen hatten zwar schon bisher immer unter den Arbeitern bestanden, hatten es aber nie zu großen Resultaten bringen können.
  en: Secret coalitions had, it is true, previously existed, but could never achieve great results.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '432'
- id: VIII.8.5
  kind: p
  original: In Schottland hatte unter andern, wie Symons ("Arts and Artizans", p. 137 ff.) erzählt, schon 1812 unter den Webern in Glasgow eine allgemeine Arbeitseinstellung stattgefunden, die durch eine geheime Assoziation zustandegebracht wurde.
  en: In Glasgow, as Symonds relates, a general strike of weavers had taken place in 1812, which was brought about by a secret association.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '432'
  en_note: 'English note {214}: "Arts and Artisans," p. 137, et seq.'
- id: VIII.8.6
  kind: p
  original: Sie wiederholte sich 1822, und bei dieser Gelegenheit wurde zweien Arbeitern, die sich der Assoziation nicht anschließen wollten und infolgedessen von den Assoziierten als Verräter an ihrer Klasse betrachtet wurden, Vitriolöl ins Gesicht geschüttet, wodurch sie den Gebrauch der Augen verloren.
  en: It was repeated in 1822, and on this occasion vitriol was thrown into the faces of the two working-men who would not join the association, and were therefore regarded by the members as traitors to their class. Both the assaulted lost the use of their eyes in consequence of the injury.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '432'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.8.7
  kind: p
  original: Ebenso war 1818 die Assoziation der schottischen Grubenarbeiter mächtig genug, um eine allgemeine Arbeitseinstellung durchsetzen zu können.
  en: So, too, in 1818, the association of Scottish miners was powerful enough to carry on a general strike.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '432'
- id: VIII.8.8
  kind: p
  original: Diese Assoziationen ließen ihre Mitglieder einen Eid der Treue und Verschwiegenheit ablegen, hatten regelmäßige Listen, Kassen, Buchführung und lokale Verzweigungen.
  en: These associations required their members to take an oath of fidelity and secrecy, had regular lists, treasurers, bookkeepers, and local branches.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 432-433
- id: VIII.8.9
  kind: p
  original: Aber die Heimlichkeit, mit der alles getrieben wurde, lähmte ihre Entwicklung.
  en: But the secrecy with which everything was conducted crippled their growth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '433'
- id: VIII.8.10
  kind: p
  original: Als dagegen die Arbeiter 1824 das freie Assoziationsrecht erhielten, wurden diese Verbindungen sehr bald über ganz England ausgedehnt und mächtig.
  en: When, on the other hand, the working-man received in 1824 the right of free association, these combinations were very soon spread over all England and attained great power.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '433'
- id: VIII.8.11
  kind: p
  original: In allen Arbeitszweigen bildeten sich solche Vereine (trades unions) mit der unverhohlenen Absicht, den einzelnen Arbeiter gegen die Tyrannei und Vernachlässigung der Bourgeoisie zu schützen.
  en: In all branches of industry Trades Unions were formed with the outspoken intention of protecting the single working-man against the tyranny and neglect of the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '433'
- id: VIII.8.12
  kind: p
  original: 'Ihre Zwecke waren: den Lohn festzustellen und en masse, als Macht mit den Arbeitgebern zu unterhandeln, den Lohn nach dem Nutzen des Arbeitgebers zu regulieren, ihn zu erhöhen, wenn gelegene Zeit kam, und ihn in jedem einzelnen Handwerke überall gleich hoch zu erhalten; deshalb pflegten sie mit den Kapitalisten wegen einer allgemein zu beobachtenden Lohnskala zu unterhandeln und jedem einzelnen, der sich weigerte, dieser Skala beizutreten, die Arbeit aufzukündigen.'
  en: Their objects were to deal, en masse, as a power, with the employers; to regulate the rate of wages according to the profit of the latter, to raise it when opportunity offered, and to keep it uniform in each trade throughout the country. Hence they tried to settle with the capitalists a scale of wages to be universally adhered to, and ordered out on strike the employees of such individuals as refused to accept the scale.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T2
    editions: '1892'
    reading: Profit
    base_text: … Lohn nach dem Nutzen ‸ des Arbeitgebers zu regulieren, …
  mew_page: '433'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.8.13
  kind: p
  original: Ferner, durch Beschränkung der Annahme von Lehrlingen die Nachfrage nach Arbeitern immer lebhaft und dadurch den Lohn hochzuhalten, der hinterlistigen Lohnverkürzung der Fabrikanten durch Einführung von neuen Maschinen und Werkzeugen etc. soviel wie möglich entgegenzuarbeiten; und endlich, brotlose Arbeiter durch Geldmittel zu unterstützen.
  en: They aimed further to keep up the demand for labour by limiting the number of apprentices, and so to keep wages high; to counteract, as far as possible, the indirect wages reductions which the manufacturers brought about by means of new tools and machinery; and finally, to assist unemployed working-men financially.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '433'
- id: VIII.8.14
  kind: p
  original: Dies geschieht entweder direkt aus der Vereinskasse oder durch eine Karte, worauf die nötige Legitimation verzeichnet steht und auf die hin der Arbeiter von einem Orte zum andern wandert, von seinen Gewerbsgenossen unterstützt und über die beste Gelegenheit, Arbeit zu erhalten, unterrichtet wird.
  en: This they do either directly or by means of a card to legitimate the bearer as a "society man," and with which the working-man wanders from place to place, supported by his fellow-workers, and instructed as to the best opportunity for finding employment.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '433'
- id: VIII.8.15
  kind: p
  original: Diese Wanderschaft heißt bei den Arbeitern the tramp, und der so Wandernde ein tramper.
  en: This is tramping, and the wanderer a tramp.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '433'
- id: VIII.8.16
  kind: p
  original: Um diese Zwecke zu erreichen, wird ein Präsident und Sekretär mit Gehalt - da zu erwarten steht, daß kein Fabrikant solche Leute beschäftigen werde - sowie ein Komitee ernannt, das die wöchentlichen Beiträge erhebt und über deren Verwendung zu den Zwecken der Assoziation wacht.
  en: To attain these ends, a President and Secretary are engaged at a salary (since it is to be expected that no manufacturer will employ such persons), and a committee collects the weekly contributions and watches over their expenditure for the purposes of the association.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '433'
- id: VIII.8.17
  kind: p
  original: Wenn es möglich war und sich vorteilhaft erwies, so vereinigten sich die Handwerksgenossen einzelner Distrikte auch wohl zu einer föderierten Verbindung und hielten zu bestimmten Zeiten Versammlungen von Delegierten.
  en: When it proved possible and advantageous, the various trades of single districts united in a federation and held delegate conventions at set times.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '433'
- id: VIII.8.18
  kind: p
  original: In einzelnen Fällen ist es versucht worden, die Genossen eines Gewerks über ganz England zu einer großen Verbindung zu vereinigen und mehrere Male - zuerst 1830 - eine allgemeine Arbeiterassoziation des ganzen Reichs, mit besonderer Organisation jedes Gewerks in sich, zu vereinigen.
  en: The attempt has been made in single cases to unite the workers of one branch over all England in one great Union; and several times (in 1830 for the first time) to form one universal trades association for the whole United Kingdom, with a separate organisation for each trade.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '433'
- id: VIII.8.19
  kind: p
  original: Diese Assoziationen hielten sich indes nie lange und kamen selten auch nur für den Augenblick zustande, da nur eine außerordentliche allgemeine Aufregung imstande ist, eine solche Verbindung möglich und wirksam zu machen.
  en: These associations, however, never held together long, and were seldom realised even for the moment, since an exceptionally universal excitement is necessary to make such a federation possible and effective.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '433'
- id: VIII.9.1
  kind: p
  original: Die Mittel, die diese Verbindungen zur Erreichung ihrer Zwecke anzuwenden pflegen, sind folgende.
  en: 'The means usually employed by these Unions for attaining their ends are the following: If one or more employers refuse to pay the wage specified by the Union, a deputation is sent or a petition forwarded (the working-men, you see, know how to recognise the absolute power of the lord of the factory in his little State); if this proves unavailing, the Union commands the employees to stop work, and all hands go home.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '434'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VIII.9.2
  kind: p
  original: Weigert sich ein einzelner oder mehrere Meister, den von der Assoziation festgesetzten Lohn zu bezahlen, so wird ihm eine Deputation geschickt oder eine Petition (man sieht, die Arbeiter wissen die Gewalt des absoluten Fabrikherrn in seinem kleinen Staate anzuerkennen) eingereicht; hilft das nicht, so befiehlt die Assoziation, die Arbeit einzustellen, und alle Arbeiter gehen nach Hause.
  en: ''
  joined_to: VIII.9.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '434'
- id: VIII.9.3
  kind: p
  original: Diese Arbeitseinstellung (turn-out oder strike) ist entweder partial, wenn einer oder einige, oder allgemein, wenn sämtliche Arbeitgeber des Gewerks sich weigern, den Lohn nach den Vorschlägen der Assoziation zu regeln.
  en: This strike is either partial when one or several, or general when all employers in the trade refuse to regulate wages according to the proposals of the Union.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '434'
- id: VIII.9.4
  kind: p
  original: So weit gehen die gesetzlichen Mittel der Verbindung, falls nämlich die Arbeitseinstellung, was nicht immer der Fall ist, unter vorheriger Kündigung geschieht.
  en: So far go the lawful means of the Union, assuming the strike to take effect after the expiration of the legal notice, which is not always the case.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '434'
- id: VIII.9.5
  kind: p
  original: Aber diese gesetzlichen Mittel sind eben sehr schwach, sobald es noch Arbeiter gibt, die außer der Assoziation stehen oder sich von ihr durch augenblickliche, vom Bourgeois gebotene Vorteile trennen lassen.
  en: But these lawful means are very weak when there are workers outside the Union, or when members separate from it for the sake of the momentary advantage offered by the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '434'
- id: VIII.9.6
  kind: p
  original: Namentlich bei partialen Arbeitseinstellungen kann sich der Fabrikant leicht aus diesen räudigen Schafen (Knobsticks genannt) rekrutieren und dadurch die Anstrengungen der vereinigten Arbeiter fruchtlos machen.
  en: Especially in the case of partial strikes can the manufacturer readily secure recruits from these black sheep (who are known as knobsticks), and render fruitless the efforts of the united workers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '434'
- id: VIII.9.7
  kind: p
  original: Gewöhnlich werden diese Knobsticks dann von den Verbindungsgliedern bedroht, gescholten, geschlagen oder sonst gemißhandelt, kurz, auf jede Weise eingeschüchtert; eine Klage folgt, und da die gesetzliebende Bourgeoisie bis jetzt noch die Macht hat, so ist die Kraft der Assoziation durch den ersten gesetzwidrigen Akt, durch die erste gerichtliche Klage gegen ihre Mitglieder fast jedesmal gebrochen.
  en: Knobsticks are usually threatened, insulted, beaten, or otherwise maltreated by the members of the Union; intimidated, in short, in every way. Prosecution follows, and as the law-abiding bourgeoisie has the power in its own hands, the force of the Union is broken almost every time by the first unlawful act, the first judicial procedure against its members.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '434'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.10.1
  kind: p
  original: Die Geschichte dieser Verbindungen ist eine lange Reihe von Niederlagen der Arbeiter, unterbrochen von wenigen einzelnen Siegen.
  en: The history of these Unions is a long series of defeats of the working-men, interrupted by a few isolated victories.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '434'
- id: VIII.10.2
  kind: p
  original: Es ist natürlich, daß alle diese Anstrengungen das Gesetz der Ökonomie nicht ändern können, daß sich der Lohn durch das Verhältnis der Nachfrage zum Angebot im Arbeitsmarkte richtet.
  en: All these efforts naturally cannot alter the economic law according to which wages are determined by the relation between supply and demand in the labour market.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T3
    editions: '1892'
    reading: bestimmt
    base_text: … Angebot im Arbeitsmarkte richtet ‸ . …
  mew_page: '434'
- id: VIII.10.3
  kind: p
  original: Daher sind diese Verbindungen gegen alle großen Ursachen, die auf dies Verhältnis wirken, ohnmächtig; in einer Handelskrisis muß die Assoziation den Lohn selbst herabsetzen oder sich gänzlich auflösen, und bei einer bedeutenden Steigerung der Nachfrage nach Arbeit kann sie den Lohn nicht höherstellen, als es ohnehin von selbst durch die Konkurrenz der Kapitalisten geschehen würde.
  en: Hence the Unions remain powerless against all great forces which influence this relation. In a commercial crisis the Union itself must reduce wages or dissolve wholly; and in a time of considerable increase in the demand for labour, it cannot fix the rate of wages higher than would be reached spontaneously by the competition of the capitalists among themselves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '434'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.10.4
  kind: p
  original: Aber gegen kleinere, einzeln wirkende Ursachen sind sie allerdings mächtig.
  en: But in dealing with minor, single influences they are powerful.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '434'
- id: VIII.10.5
  kind: p
  original: Hätte der Fabrikant von den Arbeitern keine konzentrierte, massenhafte Opposition zu erwarten, so würde er um seines Nutzens willen allmählich den Lohn immer mehr und mehr drücken; der Kampf der Konkurrenz, den er gegen die andern Fabrikanten zu bestehen hat, würde ihn sogar dazu zwingen und der Lohn bald auf sein Minimum sinken.
  en: If the employer had no concentrated, collective opposition to expect, he would in his own interest gradually reduce wages to a lower and lower point; indeed, the battle of competition which he has to wage against his fellow-manufacturers would force him to do so, and wages would soon reach the minimum.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 434-435
- id: VIII.10.6
  kind: p
  original: Diese Konkurrenz der Fabrikanten unter sich wird aber in Durchschnittsverhältnissen allerdings durch die Opposition der Arbeiter gehemmt.
  en: But this competition of the manufacturers among themselves is, under average conditions, somewhat restricted by the opposition of the working-men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '435'
- id: VIII.10.7
  kind: p
  original: Jeder Fabrikant weiß, daß die Folge einer nicht durch Umstände, denen auch seine Konkurrenten unterworfen sind, gerechtfertigten Lohnverkürzung ein Strike sein würde, der ihm sichern Schaden bringt, weil sein Kapital für die Dauer desselben müßig stehen, seine Maschinerie verrosten würde, während es in einem solchen Falle allerdings noch sehr ungewiß ist, ob er seine Lohnverkürzung durchsetzt und er die Gewißheit hat, daß, so wie es ihm gelingt, seine Konkurrenten ihm folgen, die Preise des Fabrikats drücken und ihm dadurch den Nutzen derselben wieder entziehen werden.
  en: Every manufacturer knows that the consequence of a reduction not justified by conditions to which his competitors also are subjected, would be a strike, which would most certainly injure him, because his capital would be idle as long as the strike lasted, and his machinery would be rusting, whereas it is very doubtful whether he could, in such a case, enforce his reduction. Then he has the certainty that if he should succeed, his competitors would follow him, reducing the price of the goods so produced, and thus depriving him of the benefit of his policy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '435'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.10.8
  kind: p
  original: Dann bringen die Verbindungen allerdings öfter eine schnellere Erhöhung des Lohnes nach einer Krisis hervor, als diese sonst eintreten würde; der Fabrikant hat ja das Interesse, den Lohn nicht früher zu erhöhen, als die Konkurrenz seiner Mitfabrikanten ihn dazu zwingt, während jetzt die Arbeiter selbst einen höheren Lohn fordern, wenn der Markt sich bessert und sie den Fabrikanten unter solchen Umständen wegen geringerer Auswahl von Arbeitern oft durch eine Arbeitseinstellung zur Lohnerhöhung zwingen können.
  en: Then, too, the Unions often bring about a more rapid increase of wages after a crisis than would otherwise follow. For the manufacturer's interest is to delay raising wages until forced by competition, but now the working-men demand an increased wage as soon as the market improves, and they can carry their point by reason of the smaller supply of workers at his command under such circumstances.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '435'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.10.9
  kind: p
  original: Aber wie gesagt, gegen bedeutendere Ursachen, die den Arbeitsmarkt verändern, sind die Verbindungen wirkungslos.
  en: But, for resistance to more considerable forces which influence the labour market, the Unions are powerless.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '435'
- id: VIII.10.10
  kind: p
  original: In solchen Fällen treibt der Hunger die Arbeiter allmählich dazu, zu jeden Bedingungen die Arbeit wieder anzutreten, und wenn erst einige wieder eingetreten sind, so ist die Macht der Assoziation gebrochen, weil diese wenigen Knobsticks mit den noch im Markte befindlichen Warenvorräten die Bourgeoisie in den Stand setzen, die schlimmsten Folgen der Geschäftsstörung zu beseitigen.
  en: In such cases hunger gradually drives the strikers to resume work on any terms, and when once a few have begun; the force of the Union is broken, because these few knobsticks, with the reserve supplies of goods in the market, enable the bourgeoisie to overcome the worst effects of the interruption of business.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '435'
- id: VIII.10.11
  kind: p
  original: Die Fonds der Assoziation werden durch die Menge der zu Unterstützenden bald erschöpft, der Kredit, den die Krämer gegen hohe Zinsen geben, wird auf die Dauer verweigert, und die Not zwingt die Arbeiter, in das Joch der Bourgeoisie zurückzukehren.
  en: The funds of the Union are soon exhausted by the great numbers requiring relief, the credit which the shopkeepers give at high interest is withdrawn after a time, and want compels the working-man to place himself once more under the yoke of the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '435'
- id: VIII.10.12
  kind: p
  original: Weil aber die Fabrikanten in ihrem eignen Interesse - freilich ist es nur durch die Opposition der Arbeiter ihr Interesse geworden - alle unnötigen Lohnverkürzungen vermeiden müssen, während die Arbeiter in jeder durch die Handelsverhältnisse bedingten Herabsetzung des Lohns eine Verschlechterung ihrer Lage fühlen, gegen die sie sich möglichst zu wahren haben, deshalb fallen die meisten Turnouts zum Nachteil der Arbeiter aus.
  en: But strikes end disastrously for the workers mostly, because the manufacturers, in their own interest (which has, be it said, become their interest only through the resistance of the workers), are obliged to avoid all useless reductions, while the workers feel in every reduction imposed by the state of trade a deterioration of their condition, against which they must defend themselves as far as in them lies.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '435'
- id: VIII.10.13
  kind: p
  original: Man wird fragen, weshalb denn die Arbeiter in solchen Fällen, wo doch die Nutzlosigkeit der Maßregel auf der Hand liegt, die Arbeit einstellen?
  en: It will be asked, "Why, then, do the workers strike in such cases, when the uselessness of such measures is so evident?"
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '435'
- id: VIII.10.14
  kind: p
  original: Einfach, weil sie gegen die Herabsetzung des Lohns und selbst gegen die Notwendigkeit dieser Herabsetzung protestieren müssen, weil sie erklären müssen, daß sie, als Menschen, nicht nach den Verhältnissen sich zu schicken, sondern daß die Verhältnisse sich nach ihnen, den Menschen, zu richten haben; weil ihr Stillschweigen eine Anerkennung dieser Verhältnisse, eine Anerkennung sein würde des Rechtes der Bourgeoisie, während guter Handelsperioden die Arbeiter auszubeuten und sie in schlechten Zeiten verhungern zu lassen.
  en: Simply because they must protest against every reduction, even if dictated by necessity; because they feel bound to proclaim that they, as human beings, shall not be made to bow to social circumstances, but social conditions ought to yield to them as human beings; because silence on their part would be a recognition of these social conditions, an admission of the right of the bourgeoisie to exploit the workers in good times and let them starve in bad ones.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 435-436
- id: VIII.10.15
  kind: p
  original: Die Arbeiter müssen dagegen protestieren, solange sie noch nicht alles menschliche Gefühl verloren haben, und daß sie so und nicht anders protestieren, kommt daher, weil sie Engländer, praktische Leute sind, die ihren Protest durch eine Tat einlegen, und nicht wie die deutschen Theoretiker ruhig schlafen gehen, sobald ihr Protest gehörig protokolliert und ad acta gelegt ist, um dort ebenso ruhig zu schlafen wie die Protestierenden.
  en: Against this the working-men must rebel so long as they have not lost all human feeling, and that they protest in this way and no other, comes of their being practical English people, who express themselves in action, and do not, like German theorists, go to sleep as soon as their protest is properly registered and placed ad acta, there to sleep as quietly as the protesters themselves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '436'
- id: VIII.10.16
  kind: p
  original: Der tatsächliche Protest des Engländers dagegen hat seine Wirkung, er hält die Geldgier der Bourgeoisie in gewissen Schranken und erhält die Opposition der Arbeiter gegen die gesellschaftliche und politische Allmacht der besitzenden Klasse lebendig, während er ihnen allerdings auch das Geständnis abzwingt, daß etwas mehr als Arbeiterverbindungen und Turnouts nötig ist, um die Herrschaft der Bourgeoisie zu brechen.
  en: The active resistance of the English working-men has its effect in holding the money greed of the bourgeoisie within certain limits, and keeping alive the opposition of the workers to the social and political omnipotence of the bourgeoisie, while it compels the admission that something more is needed than Trades Unions and strikes to break the power of the ruling class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '436'
- id: VIII.10.17
  kind: p
  original: Was aber diesen Assoziationen und den aus ihnen hervorgehenden Turnouts die eigentliche Wichtigkeit gibt, ist das, daß sie der erste Versuch der Arbeiter sind, die Konkurrenz aufzuheben.
  en: But what gives these Unions and the strikes arising from them their real importance is this, that they are the first attempt of the workers to abolish competition.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '436'
- id: VIII.10.18
  kind: p
  original: Sie setzen die Einsicht voraus, daß die Herrschaft der Bourgeoisie nur auf der Konkurrenz der Arbeiter unter sich beruht, d.h. auf der Zersplitterung des Proletariats, aus der Entgegensetzung der einzelnen Arbeiter gegeneinander.
  en: They imply the recognition of the fact that the supremacy of the bourgeoisie is based wholly upon the competition of the workers among themselves; i.e., upon their want of cohesion.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '436'
- id: VIII.10.19
  kind: p
  original: Und gerade weil sie sich, wenn auch nur einseitig, nur auf beschränkte Weise gegen die Konkurrenz, gegen den Lebensnerv der jetzigen sozialen Ordnung richten, gerade deshalb sind sie dieser sozialen Ordnung so gefährlich.
  en: And precisely because the Unions direct themselves against the vital nerve of the present social order, however one-sidedly, in however narrow a way, are they so dangerous to this social order.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '436'
- id: VIII.10.20
  kind: p
  original: Der Arbeiter kann die Bourgeoisie und mit ihr die ganze bestehende Einrichtung der Gesellschaft an keinem wunderen Fleck angreifen als an diesem.
  en: The working-men cannot attack the bourgeoisie, and with it the whole existing order of society, at any sorer point than this.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '436'
- id: VIII.10.21
  kind: p
  original: Ist die Konkurrenz der Arbeiter unter sich gestört, sind alle Arbeiter entschlossen, sich nicht mehr durch die Bourgeoisie ausbeuten zu lassen, so ist das Reich des Besitzes am Ende.
  en: If the competition of the workers among themselves is destroyed, if all determine not to be further exploited by the bourgeoisie, the rule of property is at an end.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '436'
- id: VIII.10.22
  kind: p
  original: Der Arbeitslohn ist ja bloß deshalb von dem Verhältnisse von Nachfrage und Angebot, von der zufälligen Lage des Arbeitsmarktes abhängig, weil die Arbeiter sich bisher gefallen ließen, als Sache, die man kauft und verkauft, behandelt zu werden.
  en: Wages depend upon the relation of demand to supply, upon the accidental state of the labour market, simply because the workers have hitherto been content to be treated as chattels, to be bought and sold.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '436'
- id: VIII.10.23
  kind: p
  original: Beschließen die Arbeiter, sich nicht mehr kaufen und verkaufen zu lassen, treten sie bei der Bestimmung, was denn eigentlich der Wert der Arbeit sei, als Menschen auf, die neben der Arbeitskraft auch einen Willen haben, so ist es aus mit der ganzen heutigen Nationalökonomie und den Gesetzen des Lohns.
  en: The moment the workers resolve to be bought and sold no longer, when in the determination of the value of labour, they take the part of men possessed of a will as well as of working-power, at that moment the whole Political Economy of to-day is at an end.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '436'
- id: VIII.10.24
  kind: p
  original: Die Gesetze des Lohns würden allerdings auf die Dauer sich wieder geltend machen, wenn die Arbeiter bei der Aufhebung der Konkurrenz unter sich selbst stehenbleiben; aber das können sie nicht, ohne ihre ganze bisherige Bewegung aufzugeben, ohne diese Konkurrenz der Arbeiter unter sich wiederherzustellen, d.h., sie können es überhaupt nicht.
  en: The laws determining the rate of wages would, indeed, come into force again in the long run, if the working-men did not go beyond this step of abolishing competition among themselves. But they must go beyond that unless they are prepared to recede again and to allow competition among themselves to reappear.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 436-437
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.10.25
  kind: p
  original: Die Notwendigkeit zwingt sie dazu, nicht nur einen Teil der Konkurrenz, sondern die Konkurrenz überhaupt aufzuheben - und das werden sie auch tun.
  en: Thus once advanced so far, necessity compels them to go farther; to abolish not only one kind of competition, but competition itself altogether, and that they will do.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '437'
- id: VIII.10.26
  kind: p
  original: Die Arbeiter sehen es schon jetzt täglich mehr ein, was sie an der Konkurrenz haben, sie sehen besser ein als die Bourgeois, daß auch die Konkurrenz der Besitzenden unter sich, indem sie die Handelskrisen hervorbringt, auf den Arbeiter drückt, und daß auch diese zu beseitigen ist.
  en: The workers are coming to perceive more clearly with every day how competition affects them; they see far more clearly than the bourgeois that competition of the capitalists among themselves presses upon the workers too, by bringing on commercial crises, and that this kind of competition; too, must be abolished.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '437'
- id: VIII.10.27
  kind: p
  original: Sie werden es bald einsehen, wie sie dies anzufangen haben.
  en: They will soon learn how they have to go about it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '437'
- id: VIII.11.1
  kind: p
  original: Daß diese Verbindungen sehr dazu beitragen, den Haß und die Erbitterung der Arbeiter gegen die besitzende Klasse zu nähren, braucht wohl nicht erst gesagt zu werden.
  en: That these Unions contribute greatly to nourish the bitter hatred of the workers against the property-holding class need hardly be said.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '437'
- id: VIII.11.2
  kind: p
  original: Von diesen Verbindungen gehen daher - mit oder ohne Mitwissen der leitenden Mitglieder - in Zeiten ungewöhnlicher Aufregung einzelne Handlungen aus, die nur durch einen bis zur Verzweiflung gesteigerten Haß, durch eine wilde, alle Schranken durchbrechende Leidenschaft zu erklären sind.
  en: From them proceed, therefore, with or without the connivance of the leading members, in times of unusual excitement, individual actions which can be explained only by hatred wrought to the pitch of despair, by a wild passion overwhelming all restraints.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '437'
- id: VIII.11.3
  kind: p
  original: Dieser Art sind die oben erwähnten Fälle von Übergießung mit Vitriolöl und eine Reihe anderer, von denen ich einige erzählen will.
  en: Of this sort are the attacks with vitriol mentioned in the foregoing pages, and a series of others, of which I shall cite several.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '437'
- id: VIII.11.4
  kind: p
  original: 1831 wurde während einer heftigen Arbeiterbewegung der junge Ashton, Fabrikant in Hyde bei Manchester, eines Abends, als er durch die Felder ging, erschossen, und nie eine Spur des Täters entdeckt.
  en: In 1831, during a violent labour movement, young Ashton, a manufacturer in Hyde, near Manchester, was shot one evening when crossing a field, and no trace of the assassin discovered.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '437'
- id: VIII.11.5
  kind: p
  original: Es ist kein Zweifel, daß es eine Tat der Rache von Arbeitern war.
  en: There is no doubt that this was a deed of vengeance of the working-men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '437'
- id: VIII.11.6
  kind: p
  original: '- Brandstiftungen und Sprengungsversuche sind sehr häufig.'
  en: Incendiarisms and attempted explosions are very common.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '437'
- id: VIII.11.7
  kind: p
  original: Freitag, den 29. September 1843 wurde ein Versuch gemacht, die Werkstatt des Sägenfabrikanten Padgin in Howard Street, Sheffield, in die Luft zu sprengen.
  en: On Friday, September 29th, 1843, an attempt was made to blow up the saw-works of Padgin, in Howard Street, Sheffield.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '437'
- id: VIII.11.8
  kind: p
  original: Eine eiserne, mit Pulver gefüllte und zugekeilte Röhre war das Mittel dazu - der Schade war beträchtlich.
  en: A closed iron tube filled with powder was the means employed, and the damage was considerable.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '437'
- id: VIII.11.9
  kind: p
  original: Am folgenden Tag, den 30. September, fiel ein ähnlicher Versuch in der Messer- und Feilenfabrik von Ibbetson, Shales Moor bei Sheffield, vor.
  en: On the following day, a similar attempt was made in Ibbetson's knife and file works at Shales Moor, near Sheffield.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '437'
- id: VIII.11.10
  kind: p
  original: Herr Ibbetson hatte sich durch tätige Teilnahme an Bourgeoisie-Bewegungen, durch niedrigen Lohn, ausschließliche Beschäftigung von Knobsticks und Ausbeutung der Armengesetze zu seinem Vorteil (indem er während der Krisis 1842 die Arbeiter dadurch zur Annahme niedrigen Lohnes zwang, daß er die Weigernden der Armenverwaltung als solche, die Arbeit bekommen könnten, aber nicht wollten, und also keine Unterstützung verdienten, namhaft machte) verhaßt gemacht.
  en: Mr. Ibbetson had made himself obnoxious by an active participation in bourgeois movements, by low wages, the exclusive employment of knobsticks, and the exploitation of the Poor Law for his own benefit. He had reported, during the crisis of 1842, such operatives as refused to accept reduced wages, as persons who could find work but would not take it, and were, therefore, not deserving of relief, so compelling the acceptance of a reduction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '437'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.11.11
  kind: p
  original: Ziemlicher Schaden wurde durch die Explosion angerichtet, und alle Arbeiter, die ihn zu besehen kamen, bedauerten nur, "daß nicht die ganze Geschichte in die Luft gesprengt sei".
  en: Considerable damage was inflicted by the explosion, and all the working-men who came to view it regretted only "that the whole concern was not blown into the air."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '437'
- id: VIII.11.12
  kind: p
  original: '- Freitag, den 6. Oktober 1843 ein Brandstiftungsversuch in der Fabrik von Ainsworth und Crompton in Bolton, richtete keinen Schaden an - es war der dritte oder vierte Versuch in einer sehr kurzen Zeit und in derselben Fabrik.'
  en: On Friday, October 6th, 1844, an attempt to set fire to the factory of Ainsworth and Crompton, at Bolton, did no damage; it was the third or fourth attempt in the same factory within a very short time.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '437'
- id: VIII.11.13
  kind: p
  original: '- In der Sitzung des Stadtrats von Sheffield am Mittwoch, den 10. Januar 1844 legte der Polizeikommissär eine eigens zum Sprengen gemachte Maschine von Gußeisen vor, die, mit vier Pfund Pulver gefüllt und mit einer angebrannten, aber erloschenen Lunte versehen, in der Fabrik des Herrn Kitchen, Earl Street, Sheffield, gefunden war.'
  en: In the meeting of the Town Council of Sheffield, on Wednesday, January 10th, 1844, the Commissioner of Police exhibited a cast-iron machine, made for the express purpose of producing an explosion, and found filled with four pounds of powder, and a fuse which had been lighted but had not taken effect, in the works of Mr. Kitchen, Earl Street, Sheffield.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 437-438
- id: VIII.11.14
  kind: p
  original: '- Sonntag, den 20. Januar 1844 fiel eine Explosion in der Sägemühle von Bentley und White, Bury, Lancashire, vor, die, durch hineingeworfene Pulverpakete verursacht, bedeutenden Schaden anrichtete.'
  en: On Sunday, January 20th, 1844, an explosion caused by a package of powder took place in the sawmill of Bently & White, at Bury, in Lancashire, and produced considerable damage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '438'
- id: VIII.11.15
  kind: p
  original: '- Donnerstag, den 1. Februar 1844 wurden die Soho Wheel Works in Sheffield in Brand gesteckt und ein Raub der Flammen.'
  en: On Thursday, February 1st, 1844, the Soho Wheel Works, in Sheffield, were set on fire and burnt up.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '438'
- id: VIII.11.16
  kind: p
  original: '- Das sind sechs derartige Fälle in vier Monaten, die alle nur in der Erbitterung der Arbeiter gegen die Arbeitgeber ihren Grund haben.'
  en: Here are six such cases in four months, all of which have their sole origin in the embitterment of the working-men against the employers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '438'
- id: VIII.11.17
  kind: p
  original: Welch ein sozialer Zustand derjenige sein muß, in dem solche Dinge nur möglich sind, brauche ich wohl nicht zu sagen.
  en: What sort of a social state it must be in which such things are possible I need hardly say.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '438'
- id: VIII.11.18
  kind: p
  original: Diese Tatsachen sind Beleg genug, daß in England, selbst in flotten Geschäftsperioden, wie Ende 1843, der soziale Krieg erklärt ist und offen gehandhabt wird - und doch besinnt sich die englische Bourgeoisie noch immer nicht!
  en: These facts are proof enough that in England, even in good business years, such as 1843, the social war is avowed and openly carried on, and still the English bourgeoisie does not stop to reflect!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '438'
- id: VIII.11.19
  kind: p
  original: '- Aber der Fall, der am lautesten spricht, ist der der Thugs von Glasgow, der vor den Assisen dieser Stadt vom 3. bis 11. Januar 1838 verhandelt wurde.'
  en: But the case which speaks most loudly is that of the Glasgow Thugs, which came up before the Assizes from the 3rd to the 11th of January, 1838.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VIII.N1
  mew_page: '438'
- id: VIII.11.20
  kind: p
  original: Aus den Verhandlungen ging hervor, daß die Assoziation der Baumwollspinner, die hier seit 1816 existierte, eine seltene Organisation und Kraft besaß.
  en: It appears from the proceedings that the Cotton-Spinners' Union, which existed here from the year 1816, possessed rare organisation and power.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '438'
- id: VIII.11.21
  kind: p
  original: Die Mitglieder waren durch Eid an die Beschlüsse der Majorität gebunden und hatten während jedes Turnouts ein geheimes Komitee, das der großen Menge der Mitglieder nicht bekannt war und unbeschränkt über die Gelder verfügen konnte.
  en: The members were bound by an oath to adhere to the decision of the majority, and had during every turnout a secret committee which was unknown to the mass of the members, and controlled the funds of the Union absolutely.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '438'
- id: VIII.11.22
  kind: p
  original: Das Komitee stellte Preise auf die Köpfe von Knobsticks, verhaßten Fabrikanten und auf Brandstiftungen in Fabriken.
  en: This committee fixed a price upon the heads of knobsticks and obnoxious manufacturers and upon incendiarisms in mills.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '438'
- id: VIII.11.23
  kind: p
  original: Eine Fabrik wurde so in Brand gesteckt, in welcher weibliche Knobsticks anstatt der Männer zum Spinnen beschäftigt wurden; eine Frau MacPherson, Mutter eines dieser Mädchen, ermordet, und die beiden Mörder für Rechnung der Assoziation nach Amerika geschafft.
  en: A mill was thus set on fire in which female knobsticks were employed in spinning in the place of men; a Mrs. M'Pherson, mother of one of these girls, was murdered, and both murderers sent to America at the expense of the association.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '438'
- id: VIII.11.24
  kind: p
  original: '- 1820 schon war auf einen Knobstick, namens MacQuarry, geschossen und dieser verwundet worden, wofür der Täter 15 Pfund Sterling von der Assoziation bekam.'
  en: As early as 1820, a knobstick named M'Quarry was shot at and wounded, for which deed the doer received twenty pounds from the Union, but was discovered and transported for life.
