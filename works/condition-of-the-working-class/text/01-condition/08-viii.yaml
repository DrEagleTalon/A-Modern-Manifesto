- id: VIII.13.2
  kind: p
  original: So sprang der eiserne Mann, wie die Arbeiter sie nennen, aus den Händen des modernen Prometheus auf das Gebot der Minerva - ein Geschöpf, bestimmt, unter den industriellen Klassen die Ordnung wiederherzustellen und den Engländern die Herrschaft der Industrie zu sichern.
  en: Thus the Iron Man, as the operatives fitly call it, sprung out of the hands of our modern Prometheus at the bidding of Minerva--a creation destined to restore order among the industrious classes, and to confirm to Great Britain the empire of art.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '440'
- id: VIII.13.3
  kind: p
  original: Die Nachricht von diesem herkulischen Wunder verbreitete Entsetzen in der Arbeiterverbindung, und selbst ehe es, sozusagen, die Wiege verließ, erwürgte es die Hydra der Anarchie."
  en: The news of this Herculean prodigy spread dismay through the Union, and even long before it left its cradle, so to speak, it strangled the Hydra of misrule."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '440'
  en_note: 'English note {223b}: Ibid., p. 366, et seq.'
- id: VIII.14.1
  kind: p
  original: So beweist Ure ferner, daß die Erfindung der Maschine, womit vier und fünf Farben zu gleicher Zeit gedruckt werden, eine Folge der Unruhen unter den Kattundruckern gewesen sei, daß Widersetzlichkeiten der Kettenschlichter in den Maschinenwebereien eine neue vervollkommnete Maschine zum Schlichten hervorgerufen hätten, und noch andere dergleichen Fälle.
  en: Ure proves further that the invention of the machine, with which four and five colours are printed at once, was a result of the disturbances among the calico printers; that the refractoriness of the yarn-dressers in the power-loom weaving mills gave rise to a new and perfected machine for warp-dressing, and mentions several other such cases.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VIII.N3
  mew_page: '440'
- id: VIII.14.2
  kind: p
  original: '- Derselbe Ure plagt sich kurz vorher, mehrere Bogen lang zu beweisen, daß Maschinerie den Arbeitern vorteilhaft sei!'
  en: A few pages earlier this same Ure gives himself a great deal of trouble to prove in detail that machinery is beneficial to the workers!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '440'
- id: VIII.14.3
  kind: p
  original: Ure ist übrigens nicht der einzige; im Fabrikbericht läßt Herr Ashworth, der Fabrikant, und mancher andre sich keine Gelegenheit entgehen, seinem Zorne über diese Assoziationen Luft zu machen.
  en: But Ure is not the only one; in the Factory Report, Mr. Ashworth, the manufacturer, and many another, lose no opportunity to express their wrath against the Unions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '440'
- id: VIII.14.4
  kind: p
  original: Diese weisen Bourgeois machen es gerade wie gewisse Regierungen und leiten alle Bewegungen, welche sie nicht verstehen, von dem Einflusse böswilliger Agitatoren, Übelgesinnter, Demagogen, Schreier und junger Leute her; sie behaupten, die bezahlten Agenten dieser Verbindungen seien bei der Agitation interessiert, weil sie von ihr lebten - als ob nicht die Bourgeoisie diese Bezahlung nötig machte, weil sie solche Leute nicht beschäftigen will!
  en: These wise bourgeois, like certain governments, trace every movement which they do not understand, to the influence of ill-intentioned agitators, demagogues, traitors, spouting idiots, and ill-balanced youth. They declare that the paid agents of the Unions are interested in the agitation because they live upon it, as though the necessity for this payment were not forced upon them by the bourgeois, who will give such men no employment!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 440-441
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.15.1
  kind: p
  original: Die unglaubliche Häufigkeit dieser Arbeitseinstellungen beweist es am besten, wieweit der soziale Krieg schon über England hereingebrochen ist.
  en: The incredible frequency of these strikes proves best of all to what extent the social war has broken out all over England.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '441'
- id: VIII.15.2
  kind: p
  original: Es vergeht keine Woche, ja fast kein Tag, wo nicht hier oder dort ein Strike vorkommt - bald wegen Lohnverkürzung, bald wegen verweigerter Lohnerhöhung, bald wegen Beschäftigung von Knobsticks, bald wegen verweigerter Abstellung von Mißbräuchen oder schlechten Einrichtungen, bald wegen neuer Maschinerie, bald aus hundert andern Ursachen.
  en: No week passes, scarcely a day, indeed, in which there is not a strike in some direction, now against a reduction, then against a refusal to raise the rate of wages, again by reason of the employment of knobsticks or the continuance of abuses, sometimes against new machinery, or for a hundred other reasons.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '441'
- id: VIII.15.3
  kind: p
  original: Diese Strikes sind allerdings erst Vorpostenscharmützel, zuweilen auch bedeutendere Gefechte; sie entscheiden nichts, aber sie sind der sicherste Beweis, daß die entscheidende Schlacht zwischen Proletariat und Bourgeoisie herannaht.
  en: These strikes, at first skirmishes, sometimes result in weighty struggles; they decide nothing, it is true, but they are the strongest proof that the decisive battle between bourgeoisie and proletariat is approaching.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '441'
- id: VIII.15.4
  kind: p
  original: Sie sind die Kriegsschule der Arbeiter, in der sie sich auf den großen Kampf vorbereiten, der nicht mehr zu vermeiden ist; sie sind die Pronunciamientos einzelner Arbeitszweige über ihren Anschluß an die große Arbeiterbewegung.
  en: They are the military school of the working-men in which they prepare themselves for the great struggle which cannot be avoided; they are the pronunciamentos of single branches of industry that these too have joined the labour movement.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '441'
- id: VIII.15.5
  kind: p
  original: Und wenn man einen Jahrgang des "Northern Star", des einzigen Blattes, das alle Bewegungen des Proletariats berichtet, vergleicht, so wird man finden, daß alle Arbeiter der Städte und der ländlichen Industrie sich zu Assoziationen vereinigt und von Zeit zu Zeit durch allgemeines Feiern gegen die Herrschaft der Bourgeoisie protestiert haben.
  en: And when one examines a year's file of the Northern Star, the only sheet which reports all the movements of the proletariat, one finds that all the proletarians of the towns and of country manufacture have united in associations, and have protested from time to time, by means of a general strike, against the supremacy of the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '441'
- id: VIII.15.6
  kind: p
  original: Und als Kriegschule sind sie von unübertrefflicher Wirkung.
  en: And as schools of war, the Unions are unexcelled.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '441'
- id: VIII.15.7
  kind: p
  original: In ihnen entwickelt sich die eigentümliche Tapferkeit des Engländers.
  en: In them is developed the peculiar courage of the English.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '441'
- id: VIII.15.8
  kind: p
  original: Es heißt auf dem Kontinent, die Engländer und besonders die Arbeiter seien feig, sie könnten keine Revolution machen, weil sie nicht gleich den Franzosen jeden Augenblick Emeuten machen, weil sie sich das Bourgeoisie-Regime so scheinbar ruhig gefallen lassen.
  en: It is said on the Continent that the English, and especially the working-men, are cowardly, that they cannot carry out a revolution because, unlike the French, they do not riot at intervals, because they apparently accept the bourgeois regime so quietly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '441'
- id: VIII.15.9
  kind: p
  original: Dies ist ganz falsch.
  en: This is a complete mistake.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '441'
- id: VIII.15.10
  kind: p
  original: Die englischen Arbeiter geben keiner Nation an Mut etwas nach, sie sind ebenso unruhig wie die Franzosen, aber sie kämpfen anders.
  en: The English working-men are second to none in courage; they are quite as restless as the French, but they fight differently.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '441'
- id: VIII.15.11
  kind: p
  original: Die Franzosen, die durchaus politischer Natur sind, kämpfen auch gegen soziale Übel auf politischem Wege; die Engländer, für die die Politik nur um des Interesses, um der bürgerlichen Gesellschaft willen existiert, kämpfen, statt gegen die Regierung, direkt gegen die Bourgeoisie, und dies kann mit Effekt einstweilen nur auf friedlichem Wege geschehen.
  en: The French, who are by nature political, struggle against social evils with political weapons; the English, for whom politics exist only as a matter of interest, solely in the interest of bourgeois society, fight, not against the Government, but directly against the bourgeoisie; and for the time, this can be done only in a peaceful manner.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '441'
- id: VIII.15.12
  kind: p
  original: Die Geschäftsstockung und das ihr folgende Elend erzeugte 1834 zu Lyon den Aufstand für die Republik, 1842 zu Manchester den allgemeinen Turnout für die Volkscharte und hohen Lohn.
  en: 'Stagnation in business, and the want consequent upon it, engendered the revolt at Lyons, in 1834, in favour of the Republic: in 1842, at Manchester, a similar cause gave rise to a universal turnout for the Charter and higher wages.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '441'
- id: VIII.15.13
  kind: p
  original: Daß aber zu einem Turnout auch Mut und das bedeutender, ja oft ein viel höherer Mut, eine viel kühnere, festere Entschlossenheit gehört als zu einer Emeute, das versteht sich von selbst.
  en: That courage is required for a turnout, often indeed much loftier courage, much bolder, firmer determination than for an insurrection, is self-evident.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '441'
- id: VIII.15.14
  kind: p
  original: Es ist wahrhaft keine Kleinigkeit für einen Arbeiter, der das Elend aus Erfahrung kennt, ihm mit Frau und Kindern entgegenzugehen, Hunger und Not monatelang zu ertragen und dabei fest und unerschütterlich zu bleiben.
  en: It is, in truth, no trifle for a working-man who knows want from experience, to face it with wife and children, to endure hunger and wretchedness for months together, and stand firm and unshaken through it all.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 441-442
- id: VIII.15.15
  kind: p
  original: Was ist der Tod, was sind die Galeeren, die dem französischen Revolutionär bevorstehen, gegen das langsame Verhungern, gegen den täglichen Anblick der verhungernden Familie, gegen die Gewißheit der dereinstigen Rache der Bourgeoisie, die der englische Arbeiter der Unterwerfung unter das Joch der besitzenden Klasse vorzieht?
  en: What is death, what the galleys which await the French revolutionist, in comparison with gradual starvation, with the daily sight of a starving family, with the certainty of future revenge on the part of the bourgeoisie, all of which the English working-man chooses in preference to subjection under the yoke of the property-holding class?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '442'
- id: VIII.15.16
  kind: p
  original: Wir werden unten ein Beispiel von diesem hartnäckigen, unüberwindlichen Mute des englischen Arbeiters sehen, der sich erst dann der Gewalt ergibt, wenn aller Widerstand zwecklos und unsinnig wäre.
  en: We shall meet later an example of this obstinate, unconquerable courage of men who surrender to force only when all resistance would be aimless and unmeaning.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '442'
- id: VIII.15.17
  kind: p
  original: Und gerade in dieser ruhigen Ausdauer, in dieser lang anhalten den Entschlossenheit, die täglich hundert Proben zu bestehen hat, gerade hier entwickelt der englisch Arbeiter die achtunggebietendste Seite seines Charakters.
  en: And precisely in this quiet perseverance, in this lasting determination which undergoes a hundred tests every day, the English working-man develops that side of his character which commands most respect.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '442'
- id: VIII.15.18
  kind: p
  original: Leute, die so viel erdulden, um einen einzigen Bourgeois zu beugen, werden auch imstande sein, die Macht der ganzen Bourgeoisie zu brechen.
  en: People who endure so much to bend one single bourgeois will be able to break the power of the whole bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '442'
- id: VIII.15.19
  kind: p
  original: Aber auch abgesehen davon hat der englische Arbeiter oft genug Mut gezeigt.
  en: But apart from that, the English working-man has proved his courage often enough.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '442'
- id: VIII.15.20
  kind: p
  original: Daß der Turnout von 1842 keine weiteren Folgen hatte, lag daran, daß teils die Arbeiter durch die Bourgeoisie in ihn hineingejagt, teils selbst über ihren Zweck weder klar noch einig waren.
  en: That the turnout of 1842 had no further results came from the fact that the men were in part forced into it by the bourgeoisie, in part neither clear nor united as to its object.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '442'
- id: VIII.15.21
  kind: p
  original: Aber sonst haben sie ihren Mut da, wo es sich um bestimmte soziale Zwecke handelte, oft genug bewiesen.
  en: But aside from this, they have shown their courage often enough when the matter in question was a specific social one.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '442'
- id: VIII.15.22
  kind: p
  original: Von der wälschen Insurrektion 1839 nicht zu reden, wurde während meiner Anwesenheit in Manchester (im Mai 1843) dort ein vollständiges Gefecht geliefert.
  en: Not to mention the Welsh insurrection of 1839, a complete battle was waged in Manchester in May, 1843, during my residence there.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T4
    editions: MEW
    reading: so bei Engels für walisisch
    base_text: … Von der wälschen ‸ Insurrektion 1839 nicht zu …
  mew_page: '442'
- id: VIII.15.23
  kind: p
  original: Eine Ziegelfabrik (Pauling & Henfrey) hatte nämlich die Form der Ziegel vergrößert, ohne den Lohn zu erhöhen, und verkaufte die größeren Ziegel natürlich zu höherem Preise.
  en: Pauling & Henfrey, a brick firm, had increased the size of the bricks without raising wages, and sold the bricks, of course, at a higher price.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '442'
- id: VIII.15.24
  kind: p
  original: Die Arbeiter, denen höherer Lohn abgeschlagen wurde, gingen fort, und die Assoziation der Ziegelmacher erklärte die Firma in die Acht.
  en: The workers, to whom higher wages were refused, struck work, and the Brickmakers' Union declared war upon the firm.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '442'
- id: VIII.15.25
  kind: p
  original: Mit vieler Mühe gelang es dieser indes, sich aus der Umgegend und den Knobsticks Arbeiter zu verschaffen, gegen die zuerst Intimidation gebraucht wurde.
  en: The firm, meanwhile, succeeded with great difficulty in securing hands from the neighbourhood, and among the knobsticks, against whom in the beginning intimidation was used, the proprietors set twelve men to guard the yard, all ex-soldiers and policemen, armed with guns.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '442'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VIII.15.26
  kind: p
  original: Die Firma stellte zur Bewachung des Hofes zwölf Männer, alles ehemalige Soldaten und Polizeidiener, auf und bewaffnete sie mit Flinten.
  en: ''
  joined_to: VIII.15.25
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '442'
- id: VIII.15.27
  kind: p
  original: Als nun die Intimidation nichts half, überfiel eines Abends um zehn Uhr eine Schar Ziegelmacher, die in militärischer Ordnung, die ersten Glieder mit Flinten bewaffnet, heranzog, den Hof, der kaum vierhundert Schritt von einer Infanteriekaserne entfernt liegt Die Leute drangen ein, und sobald sie die Wächter gewahr wurden, feuerten sie auf diese, zerstampften die ausgebreiteten nassen Ziegel, rissen die aufgehäuften Reihen der schon getrockneten ein, demolierten alles, was ihnen in den Weg kam, und drangen in ein Gebäude ein, wo sie die Möbel zerschlugen und die Frau des dort wohnenden Aufsehers mißhandelten.
  en: When intimidation proved unavailing, the brick-yard, which lay scarcely a hundred paces from an infantry barracks, was stormed at ten o'clock one night by a crowd of brickmakers, who advanced in military order, the first ranks armed with guns. They forced their way in, fired upon the watchmen as soon as they saw them, stamped out the wet bricks spread out to dry, tore down the piled-up rows of those already dry, demolished everything which came in their way, pressed into a building, where they destroyed the furniture and maltreated the wife of the overlooker who was living there.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VIII.N4
  mew_page: 442-443
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.15.28
  kind: p
  original: Unterdes hatten die Wächter sich hinter eine Hecke postiert, von der aus sie sicher und ungehindert feuern konnten; die Eingedrungenen standen vor einem brennenden Ziegelofen, der sie hell beleuchtete, so daß jede Kugel ihrer Gegner traf, während jeder Schuß von ihrer Seite fehlging.
  en: The watchmen, meanwhile, had placed themselves behind a hedge, whence they could fire safely and without interruption. The assailants stood before a burning brick-kiln, which threw a bright light upon them, so that every ball of their enemies struck home, while every one of their own shots missed its mark.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '443'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.15.29
  kind: p
  original: Das Feuern wurde indes über eine halbe Stunde fortgesetzt, bis die Munition verschossen und der Zweck des Besuchs, die Zerstörung aller zerstörbaren Gegenstände im Hof, erreicht war.
  en: Nevertheless, the firing lasted half-an-hour, until the ammunition was exhausted, and the object of the visit--the demolition of all the destructible objects in the yard--was attained.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '443'
- id: VIII.15.30
  kind: p
  original: Dann kam Militär angerückt und die Ziegelmacher zogen sich nach Eccles (drei Meilen von Manchester) zurück.
  en: Then the military approached, and the brickmakers withdrew to Eccles, three miles from Manchester.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '443'
- id: VIII.15.31
  kind: p
  original: Kurz vor Eccles hielten sie Appell, wobei jeder Mann nach seiner Nummer in der Sektion aufgerufen wurde, und zerstreuten sich dann, natürlich nur um der von allen Seiten anrückenden Polizei desto sicherer in die Hände zu fallen.
  en: A short time before reaching Eccles they held roll-call, and each man was called according to his number in the section when they separated, only to fall the more certainly into the hands of the police, who were approaching from all sides.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '443'
- id: VIII.15.32
  kind: p
  original: Die Zahl der Verwundeten muß sehr bedeutend gewesen sein, doch wurden nur die bekannt, die nachher gefangen wurden.
  en: The number of the wounded must have been very considerable, but those only could be counted who were arrested.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '443'
- id: VIII.15.33
  kind: p
  original: Einer von ihnen hatte drei Kugeln erhalten, in den Schenkel, in die Wade und in die Schulter, und sich damit über vier Meilen weit geschleppt.
  en: One of these had received three bullets (in the thigh, the calf, and the shoulder), and had travelled in spite of them more than four miles on foot.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '443'
- id: VIII.15.34
  kind: p
  original: Diese Leute haben denn doch wohl bewiesen, daß sie auch revolutionären Mut haben und einen Kugelregen nicht scheuen; wenn aber unbewaffnete Massen, die selbst nicht wissen, was sie eigentlich wollen, auf abgeschlossenen Marktplätzen von ein paar Dragonern und Polizeidienern, die die Zugänge besetzen, im Zaum gehalten werden, wie dies 1842 geschah, so ist das durchaus kein Mangel an Mut, sondern die Masse würde sich ebensowenig gerührt haben, wären die Diener der öffentlichen, d.h. Bourgeoisgewalt nicht dagewesen.
  en: These people have proved that they, too, possess revolutionary courage, and do not shun a rain of bullets. And when an unarmed multitude, without a precise aim common to them all, are held in check in a shut-off market-place, whose outlets are guarded by a couple of policemen and dragoons, as happened in 1842, this by no means proves a want of courage. On the contrary, the multitude would have stirred quite as little if the servants of public (i.e., of the bourgeois) order had not been present.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '443'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VIII.15.35
  kind: p
  original: Wo das Volk bestimmte Zwecke im Auge hatte, da zeigte es Mut genug, z.B. bei dem Angriff auf Birleys Fabrik, die später durch Auffahrung von Artillerie geschützt werden mußte.
  en: Where the working-people have a specific end in view, they show courage enough; as, for instance, in the attack upon Birley's mill, which had later to be protected by artillery.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '443'
- id: VIII.16.1
  kind: p
  original: Bei dieser Gelegenheit ein paar Worte über die Heilighaltung des Gesetzes in England.
  en: In this connection, a word or two as to the respect for the law in England.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '443'
- id: VIII.16.2
  kind: p
  original: Allerdings, dem Bourgeois ist das Gesetz heilig, denn es ist sein eigen Machwerk, mit seiner Einwilligung und zu seinem Schutz und Vorteil erlassen.
  en: True, the law is sacred to the bourgeois, for it is his own composition, enacted with his consent, and for his benefit and protection.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '443'
- id: VIII.16.3
  kind: p
  original: Er weiß, daß, wenn auch ein einzelnes Gesetz ihm speziell schaden sollte, doch der ganze Komplex der Gesetzgebung seine Interessen schützt und vor allem die Heiligkeit des Gesetzes, die Unantastbarkeit der durch die aktive Willensäußerung des einen und die passive des andern Teils der Gesellschaft einmal festgestellten Ordnung die stärkste Stütze seiner sozialen Stellung ist.
  en: He knows that, even if an individual law should injure him, the whole fabric protects his interests; and more than all, the sanctity of the law, the sacredness of order as established by the active will of one part of society, and the passive acceptance of the other, is the strongest support of his social position.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '443'
- id: VIII.16.4
  kind: p
  original: Weil der englische Bourgeois in dem Gesetze, wie in seinem Gott, sich selbst wiederfindet, deshalb hält er es heilig, deshalb hat für ihn der Stock des Polizeidieners, der ja eigentlich sein eigner Stock ist, eine wunderbar beschwichtigende Macht.
  en: Because the English bourgeois finds himself reproduced in his law, as he does in his God, the policeman's truncheon which, in a certain measure, is his own club, has for him a wonderfully soothing power.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 443-444
- id: VIII.16.5
  kind: p
  original: Aber für den Arbeiter wahrhaftig nicht.
  en: But for the working-man quite otherwise!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '444'
- id: VIII.16.6
  kind: p
  original: Der Arbeiter weiß zu gut und hat zu oft erfahren, daß das Gesetz für ihn eine Rute ist, die ihm der Bourgeois gebunden hat, und wenn er nicht muß, so kehrt er sich nicht ans Gesetz.
  en: The working-man knows too well, has learned from too oft-repeated experience, that the law is a rod which the bourgeois has prepared for him; and when he is not compelled to do so, he never appeals to the law.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '444'
- id: VIII.16.7
  kind: p
  original: Es ist lächerlich, zu behaupten, der englische Arbeiter habe vor der Polizei Furcht, wo doch in Manchester die Polizei alle Wochen Prügel erhält und voriges Jahr sogar einmal ein Sturm auf ein mit eisernen Türen und schweren Fensterladen gesichertes Stationshaus versucht wurde.
  en: It is ridiculous to assert that the English working-man fears the police, when every week in Manchester policemen are beaten, and last year an attempt was made to storm a station-house secured by iron doors and shutters.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '444'
- id: VIII.16.8
  kind: p
  original: Die Macht der Polizei im Turnout 1842 lag, wie gesagt, nur in der Ratlosigkeit der Arbeiter selbst.
  en: The power of the police in the turnout of 1842 lay, as I have already said, in the want of a clearly defined object on the part of the working-men themselves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '444'
- id: VIII.17.1
  kind: p
  original: Da nun die Arbeiter das Gesetz nicht respektieren, sondern bloß seine Macht gelten lassen, wo sie nicht die Macht haben, es zu ändern, so ist das allernatürlichste, daß sie wenigstens Vorschläge zur Änderung des Gesetzes haben, daß sie an die Stelle des Bourgeoisie-Gesetzes ein Proletariergesetz stellen wollen.
  en: Since the working-men do not respect the law, but simply submit to its power when they cannot change it, it is most natural that they should at least propose alterations in it, that they should wish to put a proletarian law in the place of the legal fabric of the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T5
    editions: '1892'
    reading: machen
    base_text: … Änderung des Gesetzes haben ‸ , daß sie an …
  mew_page: '444'
- id: VIII.17.2
  kind: p
  original: Dies vorgeschlagene Gesetz des Proletariats ist die Volkscharte (people's charter), die der Form nach rein politisch ist und eine demokratische Basis für das Unterhaus verlangt.
  en: This proposed law is the People's Charter, which in form is purely political, and demands a democratic basis for the House of Commons.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '444'
- id: VIII.17.3
  kind: p
  original: Der Chartismus ist die kompakte Form der Opposition gegen die Bourgeoisie.
  en: Chartism is the compact form of their opposition to the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '444'
- id: VIII.17.4
  kind: p
  original: In den Verbindungen und Turnouts blieb die Opposition immer einzeln, es waren einzelne Arbeiter oder Arbeitersektionen, die gegen einzelne Bourgeois kämpften; wurde der Kampf allgemein, so war dies wenig Absicht von seiten der Arbeiter, und wenn es absichtlich geschah, so lag der Absicht der Chartismus zugrunde.
  en: 'In the Unions and turnouts opposition always remained isolated: it was single working-men or sections who fought a single bourgeois. If the fight became general, this was scarcely by the intention of the working-men; or, when it did happen intentionally, Chartism was at the bottom of it.'
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T6
    editions: '1892'
    reading: selten
    base_text: … so war dies wenig ‸ Absicht von seiten der …
  mew_page: '444'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.17.5
  kind: p
  original: Aber im Chartismus ist es die ganze Arbeiterklasse, die gegen die Bourgeoisie aufsteht und vor allem die politische Gewalt derselben, die gesetzliche Mauer, mit der sie sich umgeben hat, angreift.
  en: But in Chartism it is the whole working class which arises against the bourgeoisie, and attacks, first of all, the political power, the legislative rampart with which the bourgeoisie has surrounded itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '444'
- id: VIII.17.6
  kind: p
  original: Der Chartismus ist hervorgegangen aus der demokratischen Partei, die sich in den achtziger Jahren des vorigen Jahrhunderts, zugleich mit und in dem Proletariat, entwickelte, während der französischen Revolution an Stärke gewann, nach dem Frieden als "radikale" Partei auftrat, damals in Birmingham und Manchester, wie früher in London, ihren Hauptsitz hatte, den Oligarchen des alten Parlaments durch Vereinigung mit der liberalen Bourgeoisie die Reformbill abnötigte und sich seitdem immer schärfer als Arbeiterpartei gegenüber der Bourgeoisie konsolidierte.
  en: 'Chartism has proceeded from the Democratic party which arose between 1780 and 1790 with and in the proletariat, gained strength during the French Revolution, and came forth after the peace as the Radical party. It had its headquarters then in Birmingham and Manchester, and later in London; extorted the Reform Bill from the Oligarchs of the old Parliament by a union with the Liberal bourgeoisie, and has steadily consolidated itself, since then, as a more and more pronounced working-men''s party in opposition to the bourgeoisie In 1835 a committee of the General Working-men''s Association of London, with William Lovett at its head, drew up the People''s Charter, whose six points are as follows: (1) Universal suffrage for every man who is of age, sane and unconvicted of crime; (2) Annual Parliaments; (3) Payment of members of Parliament, to enable poor men to stand for election; (4) Voting by ballot to prevent bribery and intimidation by the bourgeoisie; (5) Equal electoral districts to secure equal representation; and (6) Abolition of the even now merely nominal property qualification of 300 pounds in land for candidates in order to make every voter eligible.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '444'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: VIII.17.7
  kind: p
  original: '1838 entwarf ein Komitee der allgemeinen Londoner Arbeitergesellschaft (Working Man''s Association), William Levett an der Spitze, die Volkscharte, deren "sechs Punkte" folgende sind: 1. Allgemeines Stimmrecht für jeden mündigen Mann, der bei gesundem Verstande und keines Verbrechens überführt ist; 2. jährlich zu erneuernde Parlamente; 3. Diäten für die Parlamentsmitglieder, damit auch Unbemittelte eine Wahl annehmen können; 4. Wahlen durch Ballotage, um Bestechung und Einschüchterung durch die Bourgeoisie zu vermeiden; 5. gleiche Wahldistrikte, um gleich billige Repräsentation zu sichern, und 6. Abschaffung der - ohnehin illusorischen - ausschließlichen Wählbarkeit derjenigen, die 300 Pfd. Sterling in Grundbesitz haben, so daß jeder Wähler auch wählbar ist.'
  en: ''
  joined_to: VIII.17.6
  modern: ''
  modern_status: joined
  notes: ''
  variants:
  - ref: T7
    editions: 1845 and 1892
    reading: 'irrtümlich: 1835'
    base_text: … 1838 ‸ entwarf ein Komitee der …
  mew_page: 444-445
- id: VIII.17.8
  kind: p
  original: '- Diese sechs Punkte, die sich alle auf die Konstituierung des Unterhauses beschränken, sind, so unschuldig sie aussehen, dennoch hinreichend, die englische Verfassung samt Königin und Oberhaus zu zertrümmern.'
  en: These six points, which are all limited to the reconstitution of the House of Commons, harmless as they seem, are sufficient to overthrow the whole English Constitution, Queen and Lords included.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: VIII.17.9
  kind: p
  original: Das sogenannte monarchische und aristokratische Element der Verfassung kann sich nur deshalb halten, weil die Bourgeoisie ein Interesse an seiner scheinbaren Erhaltung hat; und eine andere als eine bloße Scheinexistenz hat beides nicht mehr.
  en: The so-called monarchical and aristocratic elements of the Constitution can maintain themselves only because the bourgeoisie has an interest in the continuance of their sham existence; and more than a sham existence neither possesses to-day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: VIII.17.10
  kind: p
  original: Aber wenn erst die ganze öffentliche Meinung hinter dem Unterhause steht, wenn dies den Willen nicht mehr bloß der Bourgeoisie, sondern der ganzen Nation ausdrückt, so wird es alle Macht so vollständig in sich absorbieren, daß auch der letzte Heiligenschein von dem Haupte des Monarchen und der Aristokratie fällt.
  en: But as soon as real public opinion in its totality backs the House of Commons, as soon as the House of Commons incorporates the will, not of the bourgeoisie alone, but of the whole nation, it will absorb the whole power so completely that the last halo must fall from the head of the monarch and the aristocracy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: VIII.17.11
  kind: p
  original: Der englische Arbeiter respektiert weder Lords noch Königin, während diese von der Bourgeoisie zwar der Sache nach wenig gefragt, aber der Person nach vergöttert werden.
  en: The English working-man respects neither Lords nor Queen. The bourgeois, while in reality allowing them but little influence, yet offers to them personally a sham worship.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.17.12
  kind: p
  original: Der englische Chartist ist politisch Republikaner, obgleich er das Wort nie oder doch selten in den Mund nimmt; während er allerdings mit den republikanischen Parteien aller Länder sympathisiert und sich lieber einen Demokraten nennt.
  en: The English Chartist is politically a republican, though he rarely or never mentions the word, while he sympathises with the republican parties of all countries, and calls himself in preference a democrat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: VIII.17.13
  kind: p
  original: Aber er ist mehr als bloßer Republikaner; seine Demokratie ist keine bloß politische.
  en: But he is more than a mere republican, his democracy is not simply political.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: VIII.18.1
  kind: p
  original: Der Chartismus war allerdings von seinem Anfange 1835 an hauptsächlich eine Bewegung unter den Arbeitern, aber noch nicht scharf von der radikalen kleinen Bourgeoisie getrennt.
  en: Chartism was from the beginning in 1835 chiefly a movement among the working-men, though not yet sharply separated from the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: VIII.18.2
  kind: p
  original: Der Arbeiterradikalismus ging Hand in Hand mit dem Radikalismus der Bourgeoisie; die Charte war das Schibboleth beider, sie hatten ihre "Nationalkonvente" jedes Jahr zusammen, es schien eine Partei zu sein.
  en: The Radicalism of the workers went hand in hand with the Radicalism of the bourgeoisie; the Charter was the shibboleth of both. They held their National Convention every year in common, seeming to be one party.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.18.3
  kind: p
  original: Die kleine Bourgeoisie war damals gerade infolge der Enttäuschung über die Resultate der Reformbill und wegen der schlechten Geschäftsjahre 1837 bis 1839 sehr kriegerisch und mordlustig gestimmt, sie ließ sich also die heftige Chartistenagitation sehr gut gefallen.
  en: The lower middle-class was just then in a very bellicose and violent state of mind in consequence of the disappointment over the Reform Bill and of the bad business years of 1837-1839, and viewed the boisterous Chartist agitation with a very favourable eye.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: VIII.18.4
  kind: p
  original: Von der Heftigkeit dieser Agitation hat man in Deutschland keine Vorstellung.
  en: Of the vehemence of this agitation no one in Germany has any idea.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: VIII.18.5
  kind: p
  original: 'Das Volk wurde aufgefordert, sich zu bewaffnen, oft auch geradezu, sich zu empören; man fabrizierte Piken, wie früher zur Zeit der französischen Revolution, und 1838 war unter andern ein gewisser Stephens, ein methodistischer Geistlicher, in Bewegung, der dem versammelten Volke von Manchester sagte:'
  en: 'The people were called upon to arm themselves, were frequently urged to revolt; pikes were got ready, as in the French Revolution, and in 1838, one Stephens, a Methodist parson, said to the assembled working-people of Manchester:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '445'
- id: VIII.19.1
  kind: p
  original: '"Ihr braucht euch nicht zu fürchten vor der Macht der Regierung. vor den Soldaten, Bajonetten und Kanonen, die euren Unterdrückern zu Gebote stehen; ihr habt ein Mittel, das ist viel mächtiger als alles das, eine Waffe, gegen welche Bajonette und Kanonen nichts ausrichten; und ein zehnjährig Kind kann diese Waffe schwingen - ihr braucht bloß ein paar Zündhölzchen zu nehmen und ein Bündel Stroh, das in Pech getränkt ist, und ich will sehen, was die Regierung und ihre Hunderttausende von Soldaten gegen diese eine Waffe ausrichten, wenn sie kühn gebraucht wird."'
  en: '"You have no need to fear the power of Government, the soldiers, bayonets, and cannon that are at the disposal of your oppressors; you have a weapon that is far mightier than all these, a weapon against which bayonets and cannon are powerless, and a child of ten years can wield it. You have only to take a couple of matches and a bundle of straw dipped in pitch, and I will see what the Government and its hundreds of thousands of soldiers will do against this one weapon if it is used boldly."'
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VIII.N5
  mew_page: 445-446
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.20.1
  kind: p
  original: Zu gleicher Zeit aber zeigte sich schon jetzt der eigentümliche, soziale Charakter des Arbeiter-Chartismus.
  en: As early as that year the peculiarly social character of the working-men's Chartism manifested itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: VIII.20.2
  kind: p
  original: 'Derselbe Stephens sagte in einer Versammlung von 200 000 Menschen auf Kersall Moor, dem erwähnten Mons sacer von Manchester:'
  en: 'The same Stephens said, in a meeting of 200,000 men on Kersall Moor, the Mons Sacer of Manchester:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: VIII.21.1
  kind: p
  original: '"Der Chartismus, meine Freunde, ist keine politische Frage, wobei es sich darum handelt, daß ihr das Wahlrecht bekommt usw.; sondern der Chartismus, das ist eine Messer- und Gabel-Frage, die Charte, das heißt gute Wohnung, gutes Essen und Trinken, gutes Auskommen und kurze Arbeitszeit."'
  en: '"Chartism, my friends, is no political movement, where the main point is your getting the ballot. Chartism is a knife and fork question: the Charter means a good house, good food and drink, prosperity, and short working-hours."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.22.1
  kind: p
  original: So waren auch schon zu jener Zeit die Bewegungen gegen das neue Armengesetz und für die Zehnstundenbill in der engsten Verbindung mit dem Chartismus.
  en: The movements against the new Poor Law and for the Ten Hours' Bill were already in the closest relation to Chartism.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: VIII.22.2
  kind: p
  original: Bei allen Meetings dieser Epoche war der Tory Oastler mittätig, und neben der in Birmingham adoptierten Nationalpetition für die Volkscharte wurden Hunderte von Petitionen für soziale Verbesserung der Lage der Arbeiter adoptiert; 1839 ging die Agitation ebenso lebhaft fort, und als sie am Ende des Jahres anfing etwas nachzulassen, beeilten sich Bussey, Taylor und Frost, zu gleicher Zeit im Norden von England, in Yorkshire und in Wales eine Emeute ausbrechen zu lassen.
  en: In all the meetings of that time the Tory Oastler was active, and hundreds of petitions for improvements of the social condition of the workers were circulated along with the national petition for the People's Charter adopted in Birmingham. In 1839 the agitation continued as vigorously as ever, and when it began to relax somewhat at the end of the year, Bussey, Taylor, and Frost hastened to call forth uprisings simultaneously in the North of England, in Yorkshire, and Wales.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.22.3
  kind: p
  original: Frost mußte, da seine Sache verraten wurde, zu früh losbrechen, und hierdurch verunglückte sein Unternehmen; die im Norden erfuhren den unglücklichen Ausgang desselben noch früh genug, um zurückziehen zu können; zwei Monat später, im Januar 1840, brachen in Yorkshire mehrere sogenannte Polizei-Emeuten (spy outbreaks) los, z.B. in Sheffield und Bradford, und die Aufregung ließ allmählich nach.
  en: Frost's plan being betrayed, he was obliged to open hostilities prematurely. Those in the North heard of the failure of his attempt in time to withdraw. Two months later, in January, 1840, several so-called spy outbreaks took place in Sheffield and Bradford, in Yorkshire, and the excitement gradually subsided.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VIII.22.4
  kind: p
  original: Inzwischen warf sich die Bourgeoisie auf praktischere, ihr vorteilhaftere Projekte, namentlich auf die Korngesetze; die Antikorngesetzassoziation wurde in Manchester gebildet, und die Folge war eine Lockerung des Verbandes zwischen der radikalen Bourgeoisie und dem Proletariat.
  en: Meanwhile the bourgeoisie turned its attention to more practical projects, more profitable for itself, namely the Corn Laws. The Anti-Corn Law Association was formed in Manchester, and the consequence was a relaxation of the tie between the Radical bourgeoisie and the proletariat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.22.5
  kind: p
  original: Die Arbeiter sahen bald ein, daß ihnen eine Abschaffung der Korngesetze wenig nutzen könne, während sie der Bourgeoisie allerdings sehr vorteilhaft sei, und waren daher nicht für dies Projekt zu gewinnen.
  en: The working-men soon perceived that for them the abolition of the Corn Laws could be of little use, while very advantageous to the bourgeoisie; and they could therefore not be won for the project.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: VIII.22.6
  kind: p
  original: Die Krisis von 1842 brach herein.
  en: The crisis of 1842 came on.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: VIII.22.7
  kind: p
  original: Die Agitation wurde wieder ebenso lebhaft wie 1839.
  en: Agitation was once more as vigorous as in 1839.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: VIII.22.8
  kind: p
  original: Diesmal nahm aber auch die reiche, fabrizierende Bourgeoisie daran teil, die gerade unter dieser Krisis sehr schwer litt.
  en: But this time the rich manufacturing bourgeoisie, which was suffering severely under this particular crisis, took part in it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '446'
- id: VIII.22.9
  kind: p
  original: Die Antikorngesetzligue, so hieß die von den Fabrikanten von Manchester ausgegangen Verbindung jetzt, nahm eine sehr radikale, gewaltsame Tendenz an.
  en: The Anti-Corn Law League, as it was now called, assumed a decidedly revolutionary tone.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 446-447
- id: VIII.22.10
  kind: p
  original: Ihre Journale und Agitatoren führten eine unverhohlen revolutionäre Sprache, die auch darin ihren Grund hatte, daß seit 1841 die konservative Partei am Ruder war.
  en: Its journals and agitators used undisguisedly revolutionary language, one very good reason for which was the fact that the Conservative party had been in power since 1841.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: VIII.22.11
  kind: p
  original: Wie früher die Chartisten, forderten jetzt sie direkt zur Empörung auf, und die Arbeiter, die von der Krisis am meisten zu leiden hatten, waren ebenfalls nicht untätig, wie die Nationalpetition dieses Jahres mit ihren 3 1/2 Millionen Unterschriften beweist.
  en: As the Chartists had previously done, these bourgeois leaders called upon the people to rebel; and the working-men who had most to suffer from the crisis were not inactive, as the year's national petition for the charter with its three and a half million signatures proves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: VIII.22.12
  kind: p
  original: Kurz, wenn die beiden radikalen Parteien sich etwas entfremdet worden waren, so alliierten sie sich jetzt wieder; am 15. Februar 1842 wurde in Manchester bei einer Zusammenkunft von Liberalen und Chartisten eine Petition entworfen, die sowohl auf Abschaffung der Korngesetze wie auf Einführung der Charte drang und am folgenden Tag von beiden Parteien adoptiert wurde.
  en: In short, if the two Radical parties had been somewhat estranged, they allied themselves once more. At a meeting of Liberals and Chartists held in Manchester, February 15th, 1842, a petition urging the repeal of the Corn Laws and the adoption of the Charter was drawn up. The next day it was adopted by both parties.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VIII.22.13
  kind: p
  original: Frühling und Sommer verstrich unter heftiger Agitation und zunehmendem Elend.
  en: The spring and summer passed amidst violent agitation and increasing distress.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: VIII.22.14
  kind: p
  original: Die Bourgeoisie war entschlossen, die Abschaffung der Korngesetze mit Hülfe der Krisis, der ihr folgenden Not und der allgemeinen Aufregung durchzusetzen.
  en: The bourgeoisie was determined to carry the repeal of the Corn Laws with the help of the crisis, the want which it entailed, and the general excitement.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T8
    editions: '1892'
    reading: '... mit Hülfe der Krisis, der Not und...'
    base_text: … der ihr folgenden Not ‸ und der allgemeinen Aufregung …
  mew_page: '447'
- id: VIII.22.15
  kind: p
  original: Diesmal, als die Tories am Ruder waren, gab sie sogar ihre Gesetzlichkeit halb auf; sie wollte revolutionieren, aber mit Hülfe der Arbeiter.
  en: At this time, the Conservatives being in power, the Liberal bourgeoisie half abandoned their law-abiding habits; they wished to bring about a revolution with the help of the workers.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T9
    editions: '1892'
    reading: da
    base_text: … Diesmal, als ‸ die Tories am Ruder …
  mew_page: '447'
- id: VIII.22.16
  kind: p
  original: Die Arbeiter sollten ihr die Kastanien aus dem Feuer holen und zum Besten der Bourgeoisie ihre Finger verbrennen.
  en: The working-men were to take the chestnuts from the fire to save the bourgeoisie from burning their own fingers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: VIII.22.17
  kind: p
  original: Schon wurde von vielen Seiten die schon früher (1839) von den Chartisten angeregte Idee eines "heiligen Monats", eines allgemeinen Feierns aller Arbeiter, wieder aufgenommen; aber diesmal waren es nicht die Arbeiter, die feiern wollten, sondern die Fabrikanten, die ihre Fabriken schließen, die Arbeiter in die Landgemeinden, auf das Besitztum der Aristokratie schicken und dadurch das torystische Parlament und die Regierung zur Aufhebung der Kornzölle zwingen wollten.
  en: The old idea of a "holy month," a general strike, broached in 1839 by the Chartists, was revived. This time, however, it was not the working-men who wished to quit work, but the manufacturers who wished to close their mills and send the operatives into the country parishes upon the property of the aristocracy, thus forcing the Tory Parliament and the Tory Ministry to repeal the Corn Laws.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.22.18
  kind: p
  original: Natürlich wäre eine Empörung die Folge davon gewesen, aber die Bourgeoisie stand sicher im Hintergrunde und konnte den Erfolg abwarten, ohne sich, schlimmstenfalls, zu kompromittieren.
  en: A revolt would naturally have followed, but the bourgeoisie stood safely in the background and could await the result without compromising itself if the worst came to the worst.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: VIII.22.19
  kind: p
  original: Ende Juli fing das Geschäft an, sich zu bessern; es war die höchste Zeit, und um die Gelegenheit nicht unbenutzt vorübergehen zu lassen, setzten jetzt, bei steigender Konjunktur (vgl. die Handelsberichte aus Manchester und Leeds, Ende Juli und Anfang August) drei Firmen in Salybridge den Lohn herunter - ob auf eigne Hand oder im Einverständnis mit den übrigen Fabrikanten und besonders der Ligue, will ich nicht entscheiden.
  en: At the end of July business began to improve; it was high time. In order not to lose the opportunity, three firms in Staleybridge reduced wages in spite of the improvement. Whether they did so of their own motion or in agreement with other manufacturers, especially those of the League, I do not know.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
  en_note: 'English note {232}: Compare Report of Chambers of Commerce of Manchester and Leeds at the end of July and beginning of August.'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VIII.22.20
  kind: p
  original: Zwei zogen indes wieder zurück; die dritte, William Bailey und Brüder, blieb fest und sagte den sich beschwerenden Arbeitern, wenn dies ihnen nicht zusage, so täten sie vielleicht besser daran, eine Zeitlang zu spielen.
  en: Two withdrew after a time, but the third, William Bailey & Brothers, stood firm, and told the objecting operatives that "if this did not please them, they had better go and play a bit."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '447'
- id: VIII.22.21
  kind: p
  original: Diese spöttische Äußerung nahmen die Arbeiter mit Hurrarufen auf, verließen die Fabrik, durchzogen den Ort und riefen alle Arbeiter zum Feiern auf.
  en: This contemptuous answer the hands received with cheers. They left the mill, paraded through the town, and called upon all their fellows to quit work.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 447-448
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.22.22
  kind: p
  original: In wenig Stunden stand jede Fabrik still, und die Arbeiter zogen in Prozession nach Mottram Moor, um ein Meeting zu halten.
  en: In a few hours every mill stood idle, and the operatives marched to Mottram Moor to hold a meeting.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: VIII.22.23
  kind: p
  original: Dies war am 5. August.
  en: This was on August 5th.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: VIII.22.24
  kind: p
  original: Am 8. August zogen sie nach Ashton und Hyde, fünftausend Mann stark, setzten alle Fabriken und Kohlengruben still und hielten Meetings, in denen aber nicht von Abschaffung der Korngesetze, wie die Bourgeoisie gehofft hatte, sondern von "ehrlichem Tagelohn für ehrliche Tagesarbeit" (a fair day's wage for a fair day's work) die Rede war.
  en: August 8th they proceeded to Ashton and Hyde five thousand strong, closed all the mills and coal-pits, and held meetings, in which, however, the question discussed was not, as the bourgeoisie had hoped, the repeal of the Corn Laws, but, "a fair day's wages for a fair day's work."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: VIII.22.25
  kind: p
  original: Am 9. August zogen sie nach Manchester, wurden von den Behörden, die alle Liberale waren, zugelassen und stellten die Fabriken still; am 11. waren sie in Stockport, wo ihnen erst, als sie das Armenhaus, dies Lieblingskind der Bourgeoisie, erstürmten, Widerstand geleistet wurde; am selben Tage war in Bolton allgemeines Feiern und Unruhen, denen sich die Behörden ebenfalls nicht widersetzten; bald war der Aufstand über alle Industriebezirke verbreitet, und alle Arbeiten, mit Ausnahme der Einsammlung der Ernte und der Zubereitung von Lebensmitteln, standen still.
  en: August 9th they proceeded to Manchester, unresisted by the authorities (all Liberals), and closed the mills; on the 11th they were in Stockport, where they met with the first resistance as they were storming the workhouse, the favourite child of the bourgeoisie. On the same day there was a general strike and disturbance in Bolton, to which the authorities here, too, made no resistance. Soon the uprising spread throughout the whole manufacturing district, and all employments, except harvesting and the production of food, came to a standstill.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VIII.22.26
  kind: p
  original: Aber auch die empörten Arbeiter blieben ruhig.
  en: But the rebellious operatives were quiet.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: VIII.22.27
  kind: p
  original: Sie waren in diesen Aufstand hineingejagt, ohne es zu wollen; die Fabrikanten hatten sich mit Ausnahme eines einzigen - des Tory Birley in Manchester - der Arbeitseinstellung ganz gegen ihre Sitte nicht widersetzt; die Sache hatte angefangen, ohne daß die Arbeiter einen bestimmten Zweck hatten.
  en: They were driven into this revolt without wishing it. The manufacturers, with the single exception of the Tory Birley, in Manchester, had, contrary to their custom, not opposed it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.22.28
  kind: p
  original: Daher waren zwar alle darüber einig, daß sie sich nicht zum Besten ihrer korngesetzabschaffenden Fabrikanten wollten erschießen lassen, im übrigen aber wollten einige die Volkscharte durchsetzen, andere, die dies für zu frühzeitig hielten, bloß die Lohnsätze von 1840 erzwingen.
  en: The thing had begun without the working-men's having any distinct end in view, for which reason they were all united in the determination not to be shot at for the benefit of the Corn Law repealing bourgeoisie. For the rest, some wanted to carry the Charter, others who thought this premature wished merely to secure the wages rate of 1840.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.22.29
  kind: p
  original: Daran scheiterte die ganze Insurrektion.
  en: On this point the whole insurrection was wrecked.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: VIII.22.30
  kind: p
  original: Wäre sie von Anbeginn eine absichtliche, bewußte Arbeiterinsurrektion gewesen, sie wäre wahrlich durchgedrungen; aber diese Massen, die von ihren Brotherren auf die Straße gejagt waren, ohne es zu wollen, die gar keine bestimmte Absicht hatten, konnten nichts tun.
  en: If it had been from the beginning an intentional, determined working-men's insurrection, it would surely have carried its point; but these crowds who had been driven into the streets by their masters, against their own will, and with no definite purpose, could do nothing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
- id: VIII.22.31
  kind: p
  original: Inzwischen sah die Bourgeoisie, die keinen Finger gerührt hatte, um die Allianz vom 15. Februar zu betätigen, sehr bald ein, daß die Arbeiter sich nicht zu ihren Werkzeugen hergeben wollten und daß die Inkonsequenz, mit der sie sich von ihrem "gesetzlichen" Standpunkte entfernt hatte, ihr selbst Gefahr drohe; sie nahm daher ihre alte Gesetzlichkeit wieder vor und trat auf die Seite der Regierung gegen die Arbeiter, die sie selbst zum Aufstand erst gereizt und später forciert hatte.
  en: Meanwhile the bourgeoisie, which had not moved a finger to carry the alliance of February 10th into effect, soon perceived that the working-men did not propose to become its tools, and that the illogical manner in which it had abandoned its law-abiding standpoint threatened danger. It therefore resumed its law-abiding attitude, and placed itself upon the side of Government as against the working-men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '448'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.22.32
  kind: p
  original: Sie ließ sich und ihre getreuen Diener zu Spezialkonstablen einschwören - auch die deutschen Kaufleute in Manchester nahmen daran teil und paradierten höchst unnützerweise mit ihren dicken Stöcken, die Zigarre im Munde, durch die Stadt - sie ließ in Preston auf das Volk feuern, und so stand dem absichtslosen Volksaufstand auf einmal nicht nur die Militärmacht der Regierung, sondern auch die ganze besitzende Klasse gegenüber.
  en: It swore in trusty retainers as special constables (the German merchants in Manchester took part in this ceremony, and marched in an entirely superfluous manner through the city with their cigars in their mouths and thick truncheons in their hands). It gave the command to fire upon the crowd in Preston, so that the unintentional revolt of the people stood all at once face to face, not only with the whole military power of the Government, but with the whole property-holding class as well.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 448-449
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.22.33
  kind: p
  original: Die Arbeiter, die ohnehin keinen Zweck hatten, gingen allmählich auseinander, und die Insurrektion verlief ohne schlimme Folgen.
  en: The working-men, who had no especial aim, separated gradually, and the insurrection came to an end without evil results.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: VIII.22.34
  kind: p
  original: Nachträglich beging die Bourgeoisie noch eine Schändlichkeit auf die andere, suchte sich durch einen Abscheu vor gewaltsamem Einschreiten des Volks, der schlecht zu ihrer revolutionären Sprache vom Frühjahr paßte, weißzuwaschen, schob die Schuld des Aufstandes auf chartistische "Aufwiegler" etc., während sie selbst weit mehr als diese getan hatte, den Aufstand zuwege zu bringen, und nahm ihren alten Standpunkt der Heilighaltung des Gesetzes mit einer Unverschämtheit ohnegleichen wieder ein.
  en: Later, the bourgeoisie was guilty of one shameful act after another, tried to whitewash itself by expressing a horror of popular violence by no means consistent with its own revolutionary language of the spring; laid the blame of insurrection upon Chartist instigators, whereas it had itself done more than all of them together to bring about the uprising; and resumed its old attitude of sanctifying the name of the law with a shamelessness perfectly unequalled.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: VIII.22.35
  kind: p
  original: Die Chartisten, die fast gar nichts zum Aufstande beigetragen, die nur dasselbe tun, was auch die Bourgeoisie vorhatte, nämlich die Gelegenheit benutzen - diese wurden vor Gericht gestellt und verurteilt, während die Bourgeoisie ohne Schaden davonkam und während der Arbeitsstockung ihre Vorräte mit Nutzen verkauft hatte.
  en: The Chartists, who were all but innocent of bringing about this uprising, who simply did what the bourgeoisie meant to do when they made the most of their opportunity, were prosecuted and convicted, while the bourgeoisie escaped without loss, and had, besides, sold off its old stock of goods with advantage during the pause in work.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T10
    editions: '1892'
    reading: taten
    base_text: … die nur dasselbe tun ‸ , was auch die …
  mew_page: '449'
- id: VIII.23.1
  kind: p
  original: Die Frucht des Aufstandes war die ganz entschiedene Trennung des Proletariats von der Bourgeoisie.
  en: The fruit of the uprising was the decisive separation of the proletariat from the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: VIII.23.2
  kind: p
  original: Die Chartisten hatten es bisher wenig verhehlt, daß sie durch jedes Mittel ihre Charte durchsetzen würden, selbst durch eine Revolution; die Bourgeoisie, die jetzt mit einem Male die Gefährlichkeit jeder gewaltsamen Umwälzung für ihre Stellung einsah, wollte nichts mehr von "physischer Gewalt" wissen und bloß durch "moralische Gewalt" - als ob diese etwas anderes sei, als die direkte oder indirekte Drohung der physischen Gewalt - ihre Zwecke ins Leben rufen.
  en: The Chartists had not hitherto concealed their determination to carry the Charter at all costs, even that of a revolution; the bourgeoisie, which now perceived, all at once, the danger with which any violent change threatened its position, refused to hear anything further of physical force, and proposed to attain its end by moral force, as though this were anything else than the direct or indirect threat of physical force.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: VIII.23.3
  kind: p
  original: Dies war der eine Streitpunkt, der indes durch das spätere Vorgehen der Chartisten - die doch ebenso glaubwürdig sind wie die liberale Bourgeoisie - daß auch sie nicht an die physische Gewalt appellierten - der Sache nach weggeräumt wurde.
  en: This was one point of dissension, though even this was removed later by the assertion of the Chartists (who are at least as worthy of being believed as the bourgeoisie) that they, too, refrained from appealing to physical force.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: VIII.23.4
  kind: p
  original: Der zweite, hauptsächlichste Streitpunkt aber, der gerade den Chartismus in seiner Reinheit zur Erscheinung brachte, war die Korngesetzfrage.
  en: The second point of dissension and the main one, which brought Chartism to light in its purity, was the repeal of the Corn Laws.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: VIII.23.5
  kind: p
  original: In dieser war die radikale Bourgeoisie interessiert, das Proletariat aber nicht.
  en: In this the bourgeoisie was directly interested, the proletariat not.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: VIII.23.6
  kind: p
  original: Die bisherige chartistische Partei spaltete sich daher in zwei Parteien, deren politische, ausgesprochene Prinzipien gänzlich übereinstimmen, die aber durchaus verschieden und unvereinbar sind.
  en: The Chartists therefore divided into two parties whose political programmes agreed literally, but which were nevertheless thoroughly different and incapable of union.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '449'
- id: VIII.23.7
  kind: p
  original: Auf dem Birminghamer Nationalkonvent im Januar 1843 schlug Sturge, der Repräsentant der radikalen Bourgeoisie, die Weglassung des Namens der Charte aus den Statuten der chartistischen Assoziation vor, angeblich, weil dieser Name durch die Insurrektion mit gewaltsamen revolutionären Erinnerungen verknüpft sei - eine Verknüpfung, die übrigens schon seit Jahren stattgefunden und gegen die Herr Sturge bis dahin nichts einzuwenden gehabt hatte.
  en: At the Birmingham National Convention, in January, 1843, Sturge, the representative of the Radical bourgeoisie, proposed that the name of the Charter be omitted from the rules of the Chartist Association, nominally because this name had become connected with recollections of violence during the insurrection, a connection, by the way, which had existed for years, and against which Mr. Sturge had hitherto advanced no objection.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 449-450
- id: VIII.23.8
  kind: p
  original: Die Arbeiter wollten den Namen nicht fallenlassen, und als Sturge überstimmt wurde, wanderte der auf einmal loyal gewordene Quäker mit der Minorität aus dem Saale und konstituierte eine "Complete Suffrage Association" aus der radikalen Bourgeoisie.
  en: The working-men refused to drop the name, and when Mr. Sturge was outvoted, that worthy Quaker suddenly became loyal, betook himself out of the hall, and founded a "Complete Suffrage Association" within the Radical bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: VIII.23.9
  kind: p
  original: 'So widerwärtig waren dem noch vor kurzem jakobinischen Bourgeois diese Erinnerungen geworden, daß er selbst den Namen allgemeines Stimmrecht (universal suffrage) in den lächerlichen: komplettes Stimmrecht (complete suffrage) abänderte!'
  en: So repugnant had these recollections become to the Jacobinical bourgeoisie, that he altered even the name Universal Suffrage into the ridiculous title, Complete Suffrage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: VIII.23.10
  kind: p
  original: Die Arbeiter lachten ihn aus und gingen ihren Weg ruhig weiter.
  en: The working-men laughed at him and quietly went their way.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: VIII.24.1
  kind: p
  original: Von diesem Augenblicke an war der Chartismus eine reine, von allen Bourgeoisie-Elementen befreite etc. Arbeitersache.
  en: From this moment Chartism was purely a working-man's cause freed from all bourgeois elements.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: VIII.24.2
  kind: p
  original: Die "kompletten" Journale - "Weekly Dispatch", "Weekly Chronicle", "Examiner" etc. - fielen allmählich in die schläfrige Manier der übrigen liberalen Blätter, verteidigten die Handelsfreiheit, griffen die Zehnstundenbill und alle ausschließlichen Arbeitermotionen an und ließen den Radikalismus im ganzen wenig hervortreten.
  en: The "Complete" journals, the Weekly Dispatch, Weekly Chronicle, Examiner, etc., fell gradually into the sleepy tone of the other Liberal sheets, espoused the cause of Free Trade, attacked the Ten Hours' Bill and all exclusively working-men's demands, and let their Radicalism as a whole fall rather into the background.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: VIII.24.3
  kind: p
  original: Die radikale Bourgeoisie schloß sich in allen Kollisionen den Liberalen gegen die Chartisten an und machte überhaupt die Korngesetzfrage, die für den Engländer die Frage der freien Konkurrenz ist, zu ihrer Hauptaufgabe.
  en: The Radical bourgeoisie joined hands with the Liberals against the working-men in every collision, and in general made the Corn Law question, which for the English is the Free Trade question, their main business.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: VIII.24.4
  kind: p
  original: Dadurch geriet sie unter die Botmäßigkeit der liberalen Bourgeoisie und spielt jetzt eine höchst jämmerliche Rolle.
  en: They thereby fell under the dominion of the Liberal bourgeoisie, and now play a most pitiful role.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: VIII.25.1
  kind: p
  original: Die chartistischen Arbeiter dagegen nahmen sich mit doppeltem Eifer aller Kämpfe des Proletariats gegen die Bourgeoisie an.
  en: The Chartist working-men, on the contrary, espoused with redoubled zeal all the struggles of the proletariat against the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: VIII.25.2
  kind: p
  original: Die freie Konkurrenz hat den Arbeitern Leiden genug gemacht, um ihnen verhaßt zu werden; ihre Vertreter, die Bourgeois, sind ihre erklärten Feinde.
  en: Free competition has caused the workers suffering enough to be hated by them; its apostles, the bourgeoisie, are their declared enemies.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: VIII.25.3
  kind: p
  original: Der Arbeiter hat von der vollständigen Befreiung der Konkurrenz nur Nachteil zu erwarten.
  en: The working-man has only disadvantages to await from the complete freedom of competition.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: VIII.25.4
  kind: p
  original: Seine bisherigen Forderungen, die Zehnstundenbill, Schutz des Arbeiters gegen den Kapitalisten, guter Lohn, garantierte Stellung, Abschaffung des neuen Armengesetzes, alles Dinge, die mindestens ebenso wesentlich zum Chartismus gehören wie die "sechs Punkte", gehen direkt gegen die freie Konkurrenz und Handelsfreiheit.
  en: The demands hitherto made by him, the Ten Hours' Bill, protection of the workers against the capitalist, good wages, a guaranteed position, repeal of the new Poor Law, all of the things which belong to Chartism quite as essentially as the "Six Points," are directly opposed to free competition and Free Trade.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: VIII.25.5
  kind: p
  original: Kein Wunder also, daß die Arbeiter, was die ganze englische Bourgeoisie nicht begreifen kann, von der freien Konkurrenz, Handelsfreiheit und Abschaffung der Korngesetze nichts wissen wollen und gegen letztere mindestens höchst gleichgültig, gegen ihre Verteidiger aber im höchsten Grade erbittert sind.
  en: No wonder, then, that the working-men will not hear of Free Trade and the repeal of the Corn Laws (a fact incomprehensible to the whole English bourgeoisie), and while at least wholly indifferent to the Corn Law question, are most deeply embittered against its advocates.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: VIII.25.6
  kind: p
  original: Diese Frage ist gerade der Punkt, an dem sich das Proletariat von der Bourgeoisie, der Chartismus vom Radikalismus scheidet, und ein Bourgeoisverstand kann das nicht begreifen, weil er das Proletariat nicht begreifen kann.
  en: This question is precisely the point at which the proletariat separates from the bourgeoisie, Chartism from Radicalism; and the bourgeois understanding cannot comprehend this, because it cannot comprehend the proletariat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: VIII.26.1
  kind: p
  original: Darin liegt aber auch der Unterschied der chartistischen Demokratie von aller bisherigen, politischen Bourgeoisie-Demokratie.
  en: Therein lies the difference between Chartist democracy and all previous political bourgeois democracy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '450'
- id: VIII.26.2
  kind: p
  original: Der Chartismus ist wesentlich sozialer Natur.
  en: Chartism is of an essentially social nature, a class movement.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 450-451
- id: VIII.26.3
  kind: p
  original: Die "sechs Punkte", die dem radikalen Bourgeois eins und alles sind, höchstens noch einige Reformen der Konstitution hervorrufen sollen, sind dem Proletarier nur das Mittel.
  en: The "Six Points" which for the Radical bourgeois are the beginning and end of the matter, which are meant, at the utmost, to call forth certain further reforms of the Constitution, are for the proletarian a mere means to further ends.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: VIII.26.4
  kind: p
  original: '"Politische Macht unser Mittel, soziale Glückseligkeit unser Zweck", das ist jetzt der deutlich ausgesprochene Wahlspruch der Chartisten.'
  en: '"Political power our means, social happiness our end," is now the clearly formulated war-cry of the Chartists.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: VIII.26.5
  kind: p
  original: Die "Messer- und Gabel-Frage" des Predigers Stephens war nur für einen Teil der Chartisten von 1838 eine Wahrheit; sie ist es 1845 für alle.
  en: The "knife and fork question" of the preacher Stephens was a truth for a part of the Chartists only, in 1838, it is a truth for all of them in 1845.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: VIII.26.6
  kind: p
  original: Es gibt keinen bloßen Politiker mehr unter den Chartisten.
  en: There is no longer a mere politician among the Chartists, and even though their Socialism is very little developed, though their chief remedy for poverty has hitherto consisted in the land-allotment system, which was superseded by the introduction of manufacture, though their chief practical propositions are apparently of a reactionary nature, yet these very measures involve the alternative that they must either succumb to the power of competition once more and restore the old state of things, or they must themselves entirely overcome competition and abolish it. On the other hand, the present indefinite state of Chartism, the separation from the purely political party, involves that precisely the characteristic feature, its social aspect, will have to be further developed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
  en_note: 'English note {235}: See Introduction.'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: VIII.26.7
  kind: p
  original: Und wenn auch ihr Sozialismus noch sehr wenig entwickelt ist, wenn bis jetzt ihr Hauptmittel gegen das Elend in der Parzellierung des Grundbesitzes (allotment-system) besteht, die doch schon durch die Industrie überwunden wurde (siehe Einleitung), wenn überhaupt ihre meisten praktischen Vorschläge (Schutz für den Arbeiter etc.) dem Scheine nach reaktionärer Natur sind, so ist einesteils schon in diesen Maßregeln selbst die Notwendigkeit begründet, daß sie entweder der Macht der Konkurrenz wieder fallen und den alten Zustand erneuern - oder aber die Aufhebung der Konkurrenz selbst herbeiführen müssen; und andernteils bestimmt es der jetzige unklare Zustand des Chartismus, die Lostrennung von der rein politischen Partei, daß gerade die unterscheidenden Merkmale des Chartismus, die in seiner sozialen Seite liegen, weiterentwickelt werden müssen.
  en: ''
  joined_to: VIII.26.6
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '451'
- id: VIII.26.8
  kind: p
  original: Die Annäherung an den Sozialismus kann nicht ausbleiben, besonders wenn die nächste Krisis, die auf den jetzigen lebhaften Zustand der Industrie und des Handels allerspätestens bis 1847, wahrscheinlich aber schon im nächsten Jahre folgen muß, eine Krisis, die alle früheren an Heftigkeit und Wut weit übertreffen wird, durch die Not die Arbeiter immer mehr auf soziale statt auf politische Hülfsmittel verweisen wird.
  en: The approach to Socialism cannot fail, especially when the next crisis directs the working-men by force of sheer want to social instead of political remedies. And a crisis must follow the present active state of industry and commerce in 1847 at the latest, and probably in 1846; one, too, which will far exceed in extent and violence all former crises.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VIII.N6
  mew_page: '451'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.26.9
  kind: p
  original: Die Arbeiter werden ihre Charte durchsetzen, das ist natürlich; aber bis dahin werden sie noch über vieles klarwerden, was sie durch die Charte durchsetzen können und wovon sie jetzt noch wenig wissen.
  en: The working-men will carry their Charter, naturally; but meanwhile they will learn to see clearly with regard to many points which they can make by means of it and of which they now know very little.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: VIII.27.1
  kind: p
  original: Inzwischen geht auch die sozialistische Agitation vorwärts.
  en: Meanwhile the socialist agitation also goes forward.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: VIII.27.2
  kind: p
  original: Der englische Sozialismus kommt hier nur insofern in Betracht, als er auf die Arbeiterklasse influiert.
  en: English Socialism comes under our consideration so far only as it affects the working-class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: VIII.27.3
  kind: p
  original: Die englischen Sozialisten verlangen allmähliche Einführung der Gütergemeinschaft in "Heimatskolonien" von 2 000 bis 3 000 Menschen, welche Industrie und Ackerbau treiben, gleiche Rechte und gleiche Erziehung genießen - Erleichterung der Ehescheidung und Einführung einer vernünftigen Regierung mit vollständiger Meinungsfreiheit und Abschaffung der Strafen, die durch vernünftige Behandlung des Verbrechers ersetzt werden sollen.
  en: The English Socialists demand the gradual introduction of possession in common in home colonies embracing two to three thousand persons who shall carry on both agriculture and manufacture and enjoy equal rights and equal education. They demand greater facility of obtaining divorce, the establishment of a rational government, with complete freedom of conscience and the abolition of punishment, the same to be replaced by a rational treatment of the offender.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.27.4
  kind: p
  original: Dies sind ihre praktischen Vorschläge - die theoretischen Prinzipien gehen uns hier nichts an.
  en: These are their practical measures, their theoretical principles do not concern us here.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '451'
- id: VIII.27.5
  kind: p
  original: Der Sozialismus ging von Owen, einem Fabrikanten, aus und verfährt deshalb, während er der Sache nach über den Gegensatz von Bourgeoisie und Proletariat hinausgeht, in seiner Form dennoch mit vieler Nachsicht gegen die Bourgeoisie und vieler Ungerechtigkeit gegen das Proletariat.
  en: English Socialism arose with Owen, a manufacturer, and proceeds therefore with great consideration toward the bourgeoisie and great injustice toward the proletariat in its methods, although it culminates in demanding the abolition of the class antagonism between bourgeoisie and proletariat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 451-452
- id: VIII.27.6
  kind: p
  original: Die Sozialisten sind durchaus zahm und friedfertig, erkennen die bestehenden Verhältnisse, so schlecht sie sind, insofern als gerechtfertigt an, als sie jeden andern Weg als den der öffentlichen Überzeugung verwerfen, und sind doch zu gleicher Zeit so abstrakt, daß sie in der jetzigen Form ihrer Prinzipien diese öffentliche Überzeugung nie gewinnen würden.
  en: The Socialists are thoroughly tame and peaceable, accept our existing order, bad as it is, so far as to reject all other methods but that of winning public opinion. Yet they are so dogmatic that success by this method is for them, and for their principles as at present formulated, utterly hopeless.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.27.7
  kind: p
  original: Dabei klagen sie fortwährend über die Demoralisation der unteren Klassen, sind blind gegen das Fortschrittselement in dieser Auflösung der gesellschaftlichen Ordnung und bedenken nicht, daß die Demoralisation des Privatinteresses und der Heuchelei unter den besitzenden Klassen bei weitem schlimmer ist.
  en: While bemoaning the demoralisation of the lower classes, they are blind to the element of progress in this dissolution of the old social order, and refuse to acknowledge that the corruption wrought by private interests and hypocrisy in the property-holding class is much greater.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
- id: VIII.27.8
  kind: p
  original: Sie erkennen keine historische Entwicklung an und wollen daher die Nation ohne weiteres, ohne Fortführung der Politik bis zu dem Ziele, wo sie sich selbst auflöst, sogleich in den kommunistischen Zustand versetzen.
  en: They acknowledge no historic development, and wish to place the nation in a state of Communism at once, overnight, not by the unavoidable march of its political development up to the point at which this transition becomes both possible and necessary.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T11
    editions: English 1887 and 1892
    reading: In den englischen Ausgaben von 1887 und 1892 lautet dieser Teil des Satzes:,...up to the point at which this transition becomes both possible and necessary [... bis zu dem Punkt, an welchem die Umwandlung sowohl möglich als auch notwendig wird].
    base_text: … sie sich selbst auflöst ‸ , sogleich in den …
  mew_page: '452'
- id: VIII.27.9
  kind: p
  original: Sie begreifen zwar, weshalb der Arbeiter gegen den Bourgeois aufgebracht ist, sehen aber diese Erbitterung, die doch das einzige Mittel ist, die Arbeiter weiterzuführen, für unfruchtbar an und predigen eine für die englische Gegenwart noch viel fruchtlosere Philanthropie und allgemeine Liebe.
  en: They understand, it is true, why the working-man is resentful against the bourgeois, but regard as unfruitful this class hatred, which is, after all, the only moral incentive by which the worker can be brought nearer the goal. They preach instead, a philanthropy and universal love far more unfruitful for the present state of England.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.27.10
  kind: p
  original: Sie erkennen nur die psychologische Entwicklung an, die Entwicklung des abstrakten Menschen, der außer aller Verbindung mit der Vergangenheit steht, wo doch die ganze Welt auf dieser Vergangenheit beruht und der einzelne Mensch mit ihr.
  en: They acknowledge only a psychological development, a development of man in the abstract, out of all relation to the Past, whereas the whole world rests upon that Past, the individual man included.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
- id: VIII.27.11
  kind: p
  original: Daher sind sie zu gelehrt, zu metaphysisch, und richten wenig aus.
  en: Hence they are too abstract, too metaphysical, and accomplish little.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
- id: VIII.27.12
  kind: p
  original: Sie rekrutieren sich teilweise aus der Arbeiterklasse, von der sie aber nur einen sehr kleinen Teil, freilich die Gebildetsten und Charakterfestesten, herübergezogen haben.
  en: They are recruited in part from the working-class, of which they have enlisted but a very small fraction representing, however, its most educated and solid elements.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '452'
- id: VIII.27.13
  kind: p
  original: In seiner jetzigen Gestalt wird der Sozialismus nie Gemeingut der Arbeiterklasse werden können; er wird sich sogar erniedrigen müssen, einen Augenblick auf den chartistischen Standpunkt zurückzutreten; aber der durch den Chartismus hindurchgegangene, von seinen Bourgeoisie-Elementen gereinigte, echt proletarische Sozialismus, wie er sich schon jetzt bei vielen Sozialisten und bei vielen Chartistenführern, die fast alle Sozialisten sind, entwickelt, wird allerdings, und das in kurzem, eine bedeutende Rolle in der Entwicklungsgeschichte des englischen Volkes übernehmen.
  en: In its present form, Socialism can never become the common creed of the working-class; it must condescend to return for a moment to the Chartist standpoint. But the true proletarian Socialism having passed through Chartism, purified of its bourgeois elements, assuming the form which it has already reached in the minds of many Socialists and Chartist leaders (who are nearly all Socialists), must, within a short time, play a weighty part in the history of the development of the English people.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VIII.N7
  mew_page: '452'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.27.14
  kind: p
  original: Der englische Sozialismus, der in seiner Basis weit über den französischen Kommunismus hinausgeht, in der Entwicklung aber hinter ihm zurückbleibt, wird einen Augenblick auf den französischen Standpunkt zurückgehen müssen, um später über ihn hinauszugehen.
  en: English Socialism, the basis of which is much more ample than that of the French, is behind it in theoretical development, will have to recede for a moment to the French standpoint in order to proceed beyond it later.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T12
    editions: English 1887 and 1892
    reading: 'In den englischen Ausgaben von 1887 und 1892: theoretical development [theoretischen Entwicklung].'
    base_text: … hinausgeht, in der Entwicklung ‸ aber hinter ihm zurückbleibt, …
  mew_page: 452-453
- id: VIII.27.15
  kind: p
  original: Bis dahin werden sich freilich die Franzosen auch wohl weiterentwickeln.
  en: Meanwhile the French, too, will develop farther.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: VIII.27.16
  kind: p
  original: Der Sozialismus ist zu gleicher Zeit der entschiedenste Ausdruck der unter den Arbeitern herrschenden Irreligiosität, und darin so entschieden, daß die bewußtlos, bloß praktisch irreligiösen Arbeiter oft vor der Schärfe dieses Ausdrucks zurückschrecken.
  en: English Socialism affords the most pronounced expression of the prevailing absence of religion among the working-men, an expression so pronounced indeed that the mass of the working-men, being unconsciously and merely practically irreligious, often draw back before it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: VIII.27.17
  kind: p
  original: Aber auch hier wird die Not die Arbeiter zwingen, einen Glauben aufzugeben, von dem sie mehr und mehr einsehen, daß er nur dazu dient, sie schwach und ergeben in ihr Schicksal, gehorsam und treu gegen die sie aussaugende besitzende Klasse machen.
  en: But here, too, necessity will force the working-men to abandon the remnants of a belief which, as they will more and more clearly perceive, serves only to make them weak and resigned to their fate, obedient and faithful to the vampire property-holding class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: VIII.28.1
  kind: p
  original: Wir sehen also, daß die Arbeiterbewegung in zwei Sektionen gespalten ist, in die Chartisten und Sozialisten.
  en: Hence it is evident that the working-men's movement is divided into two sections, the Chartists and the Socialists.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: VIII.28.2
  kind: p
  original: Die Chartisten sind am weitesten zurück, am wenigsten entwickelt, dafür aber echte, leibhaftige Proletarier, die Repräsentanten des Proletariats.
  en: The Chartists are theoretically the more backward, the less developed, but they are genuine proletarians all over, the representatives of their class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: VIII.28.3
  kind: p
  original: Die Sozialisten weiterblickend, praktische Mittel gegen die Not. vorschlagend, aber ursprünglich von der Bourgeoisie ausgegangen und dadurch nicht imstande, sich mit der Arbeiterklasse zu amalgamieren.
  en: The Socialists are more far-seeing, propose practical remedies against distress, but, proceeding originally from the bourgeoisie, are for this reason unable to amalgamate completely with the working-class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: VIII.28.4
  kind: p
  original: Die Verschmelzung des Sozialismus mit dem Chartismus, die Reproduktion des französischen Kommunismus auf englische Weise wird das nächste sein und hat teilweise schon angefangen.
  en: The union of Socialism with Chartism, the reproduction of French Communism in an English manner, will be the next step, and has already begun.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: VIII.28.5
  kind: p
  original: Dann erst, wenn dies bewerkstelligt, wird die Arbeiterklasse wirklich die Herrscherin von England sein - die politische und soziale Entwicklung wird inzwischen vorwärtsgehen und diese neuentspringende Partei, diesen Fortschritt des Chartismus begünstigen.
  en: Then only, when this has been achieved, will the working-class be the true intellectual leader of England. Meanwhile, political and social development will proceed, and will foster this new party, this new departure of Chartism.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.29.1
  kind: p
  original: Diese verschiedenen, oft zusammenfallenden, oft getrennten Sektionen von Arbeitern - Mitglieder der Verbindungen, Chartisten und Sozialisten - haben auf ihre eigene Faust eine Menge Schulen und Lesezimmer zur Hebung der geistigen Bildung gegründet.
  en: These different sections of working-men, often united, often separated, Trades Unionists, Chartists, and Socialists, have founded on their own hook numbers of schools and reading-rooms for the advancement of education.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: VIII.29.2
  kind: p
  original: Jede sozialistische und fast jede chartistische Institution hat eine solche Anstalt, ebenso viele einzelne Handwerke.
  en: Every Socialist, and almost every Chartist institution, has such a place, and so too have many trades.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: VIII.29.3
  kind: p
  original: Hier wird den Kindern eine echt proletarische Erziehung gegeben, frei von allen Einflüssen der Bourgeoisie, und in den Lesezimmern liegen nur oder fast nur proletarische Journale und Bücher auf.
  en: Here the children receive a purely proletarian education, free from all the influences of the bourgeoisie; and, in the reading-rooms, proletarian journals and books alone, or almost alone, are to be found.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '453'
- id: VIII.29.4
  kind: p
  original: Diese Anstalten sind sehr gefährlich für die Bourgeoisie, der es gelang, eine Anzahl ähnlicher Institute, die "Mechanics' Institutions", dem proletarischen Einflusse zu entziehen und sie in Organe zur Verbreitung der für die Bourgeoisie nützlichen Wissenschaften unter den Arbeitern zu verwandeln.
  en: These arrangements are very dangerous for the bourgeoisie, which has succeeded in withdrawing several such institutes, "Mechanics' Institutes," from proletarian influences, and making them organs for the dissemination of the sciences useful to the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 453-454
- id: VIII.29.5
  kind: p
  original: Hier werden jetzt die Naturwissenschaften gelehrt, die die Arbeiter von der Opposition gegen die Bourgeoisie abziehen und ihnen vielleicht die Mittel an die Hand geben zu Erfindungen, die der Bourgeoisie Geld einbringen - während dem Arbeiter jetzt die Naturkenntnis wahrhaftig ganz nutzlos ist, da er oft gar nicht einmal die Natur zu sehen bekommt in seiner großen Stadt und bei seiner langen Arbeit; hier wird die Nationalökonomie gepredigt, deren Abgott die freie Konkurrenz und deren einziges Resultat für den Arbeiter das ist, daß er nichts Vernünftigeres tun kann, als in stiller Resignation zu verhungern; hier ist alle Bildung zahm, geschmeidig, dienstfertig gegen die herrschende Politik und Religion eingerichtet, so daß sie eigentlich für den Arbeiter nur eine fortwährende Predigt des ruhigen Gehorsams und der Passivität, der Ergebung in sein Schicksal ist.
  en: Here the natural sciences are now taught, which may draw the working-men away from the opposition to the bourgeoisie, and perhaps place in their hands the means of making inventions which bring in money for the bourgeoisie; while for the working-man the acquaintance with the natural sciences is utterly useless now when it too often happens that he never gets the slightest glimpse of Nature in his large town with his long working-hours. Here Political Economy is preached, whose idol is free competition, and whose sum and substance for the working-man is this, that he cannot do anything more rational than resign himself to starvation. Here all education is tame, flabby, subservient to the ruling politics and religion, so that for the working-man it is merely a constant sermon upon quiet obedience, passivity, and resignation to his fate.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VIII.29.6
  kind: p
  original: Natürlich will die Masse der Arbeiter von diesen Instituten nichts wissen und wendet sich den proletarischen Lesezimmern, den Diskussionen von Verhältnissen zu, welche unmittelbar ihre eignen Interessen betreffen - und dann sagt die selbstgenügsame Bourgeoisie ihr Dixi et Salvavi [Ich habe gesprochen und mich gerettet] und wendet sich mit Verachtung von einer Klasse weg, welche die "leidenschaftlichen Wutausbrüche böswilliger Demagogen einer soliden Bildung vorzieht".
  en: The mass of working-men naturally have nothing to do with these institutes, and betake themselves to the proletarian reading-rooms and to the discussion of matters which directly concern their own interests, whereupon the self-sufficient bourgeoisie says its Dixi et Salvavi, and turns with contempt from a class which "prefers the angry ranting of ill-meaning demagogues to the advantages of solid education."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: VIII.29.7
  kind: p
  original: Daß übrigens die Arbeiter auch für "solide Bildung", wenn sie unvermischt mit der interessierten Weisheit der Bourgeoisie vorgetragen wird, Sinn haben, beweisen die häufigen Vorlesungen über naturwissenschaftliche, ästhetische und nationalökonomische Themata, die an allen proletarischen Instituten, besonders den sozialistischen, häufig gehalten und sehr gut besucht werden.
  en: That, however, the working-men appreciate solid education when they can get it unmixed with the interested cant of the bourgeoisie, the frequent lectures upon scientific, aesthetic, and economic subjects prove which are delivered especially in the Socialist institutes, and very well attended.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: VIII.29.8
  kind: p
  original: Ich habe manchmal Arbeiter, deren Samtröcke nicht mehr zusammenhalten wollten, mit mehr Kenntnis über geologische, astronomische und andre Gegenstände sprechen hören, als mancher gebildete Bourgeois in Deutschland davon besitzt.
  en: I have often heard working-men, whose fustian jackets scarcely held together, speak upon geological, astronomical, and other subjects, with more knowledge than most "cultivated" bourgeois in Germany possess.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: VIII.29.9
  kind: p
  original: Und wie sehr es dem englischen Proletariat gelungen ist, sich eine selbständige Bildung zu erwerben, zeigt sich besonders darin, daß die epochemachenden Erzeugnisse der neueren philosophischen, politischen und poetischen Literatur fast nur von den Arbeitern gelesen werden.
  en: And in how great a measure the English proletariat has succeeded in attaining independent education is shown especially by the fact that the epoch-making products of modern philosophical, political, and poetical literature are read by working-men almost exclusively.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: VIII.29.10
  kind: p
  original: Der Bourgeois, der Knecht des sozialen Zustandes und der mit ihm verbundenen Vorurteile ist, fürchtet, segnet und kreuzigt sich vor allem, was wirklich einen Fortschritt begründet; der Proletarier hat offne Augen dafür und studiert es mit Genuß und Erfolg.
  en: The bourgeois, enslaved by social conditions and the prejudices involved in them, trembles, blesses, and crosses himself before everything which really paves the way for progress; the proletarian has open eyes for it, and studies it with pleasure and success.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '454'
- id: VIII.29.11
  kind: p
  original: In dieser Beziehung haben besonders die Sozialisten Unendliches zur Bildung des Proletariats getan, sie haben die französischen Materialisten, Helvetius, Holbach, Diderot usw., übersetzt und nebst den besten englischen Sachen in billigen Ausgaben verbreitet.
  en: In this respect the Socialists, especially, have done wonders for the education of the proletariat. They have translated the French materialists, Helvetius, Holbach, Diderot, etc., and disseminated them, with the best English works, in cheap editions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 454-455
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.29.12
  kind: p
  original: Strauß' "Leben Jesu" und Proudhons "Eigentum" zirkulieren ebenfalls nur unter Proletariern.
  en: Strauss' "Life of Jesus" and Proudhon's "Property" also circulate among the working-men only.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: VIII.29.13
  kind: p
  original: Shelley, der geniale prophetische Shelley und Byron mit seiner sinnlichen Glut und seiner bittern Satire der bestehenden Gesellschaft haben ihre meisten Leser unter den Arbeitern; die Bourgeois besitzen nur kastrierte Ausgaben, "family editions", die nach der heuchlerischen Moral von heute zurechtgestutzt sind.
  en: Shelley, the genius, the prophet, Shelley, and Byron, with his glowing sensuality and his bitter satire upon our existing society, find most of their readers in the proletariat; the bourgeoisie owns only castrated editions, family editions, cut down in accordance with the hypocritical morality of to-day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: VIII.29.14
  kind: p
  original: Die beiden größten praktischen Philosophen der letzten Zeit, Bentham und Godwin, sind, namentlich letzterer, ebenfalls fast ausschließliches Eigentum des Proletariats; wenn auch Bentham unter der radikalen Bourgeoisie eine Schule besitzt, so ist es doch nur dem Proletariat und den Sozialisten gelungen, aus ihm einen Fortschritt zu entwickeln.
  en: The two great practical philosophers of latest date, Bentham and Godwin, are, especially the latter, almost exclusively the property of the proletariat; for though Bentham has a school within the Radical bourgeoisie, it is only the proletariat and the Socialists who have succeeded in developing his teachings a step forward.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: VIII.29.15
  kind: p
  original: Das Proletariat hat sich auf diesen Grundlagen eine eigene Literatur gebildet, die meist aus Journalen und Broschüren besteht und an Gehalt der ganzen Bourgeoisie-Literatur bei weitem voraus ist.
  en: The proletariat has formed upon this basis a literature, which consists chiefly of journals and pamphlets, and is far in advance of the whole bourgeois literature in intrinsic worth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: VIII.29.16
  kind: p
  original: Hierüber ein andermal.
  en: On this point more later.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: VIII.30.1
  kind: p
  original: 'Eins ist noch zu bemerken: Die Fabrikarbeiter, und unter ihnen besonders die der Baumwollenbezirke, bilden den Kern der Arbeiterbewegungen.'
  en: One more point remains to be noticed. The factory operatives, and especially those of the cotton district, form the nucleus of the labour movement.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VIII.30.2
  kind: p
  original: Lancashire und speziell Manchester ist der Sitz der stärksten Arbeiterverbindungen, der Zentralpunkt des Chartismus, der Ort, der die meisten Sozialisten zählt.
  en: Lancashire, and especially Manchester, is the seat of the most powerful Unions, the central point of Chartism, the place which numbers most Socialists.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: VIII.30.3
  kind: p
  original: Je weiter das Fabriksystem in einen Arbeitszweig eingedrungen, desto mehr nehmen die Arbeiter an der Bewegung teil; je schärfer der Gegensatz zwischen Arbeitern und Kapitalisten, desto entwickelter, desto schärfer das proletarische Bewußtsein im Arbeiter.
  en: The more the factory system has taken possession of a branch of industry, the more the working-men employed in it participate in the labour movement; the sharper the opposition between working-men and capitalists, the clearer the proletarian consciousness in the working-men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: VIII.30.4
  kind: p
  original: Die kleinen Meister von Birmingham, obwohl sie bei den Krisen mit leiden, stehen doch auf einer unglücklichen Mitte zwischen proletarischem Chartismus und krämerhaftem Radikalismus.
  en: The small masters of Birmingham, though they suffer from the crises, still stand upon an unhappy middle ground between proletarian Chartism and shopkeepers' Radicalism.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: VIII.30.5
  kind: p
  original: Im allgemeinen aber sind alle Arbeiter der Industrie für eine oder die andere Form der Auflehnung gegen das Kapital und die Bourgeoisie gewonnen, und darin sind alle einig, daß sie, als "Working Men" - ein Titel, auf den sie stolz sind und der die gewöhnliche Anrede in Chartistenversammlungen ist - eine eigne Klasse mit eignen Interessen und Prinzipien, mit eigner Anschauungsweise gegenüber allen Besitzenden bilden, und zugleich - daß in ihnen die Kraft und die Entwicklungsfähigkeit der Nation ruht.
  en: But, in general, all the workers employed in manufacture are won for one form or the other of resistance to capital and bourgeoisie; and all are united upon this point, that they, as working-men, a title of which they are proud, and which is the usual form of address in Chartist meetings, form a separate class, with separate interests and principles, with a separate way of looking at things in contrast with that of all property owners; and that in this class reposes the strength and the capacity of development of the nation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '455'
- id: VIII.N1.1.1
  kind: note
  original: Thugs wurden diese Arbeiter nach dem ostindischen, bekannten Volksstamm genannt, dessen einziges Gewerbe der Meuchelmord aller Fremden ist, die ihm in die Hände fallen.
  en: So called from the East Indian tribe, whose only trade is the murder of all the strangers who fall into its hands.
  modern: ''
  modern_status: empty
  notes: ''
  en_note: English note {221a}.
- id: VIII.N2.1.1
  kind: note
  original: '"Was für eine Art ''wilder Gerechtigkeit'' (wild-justice) muß es gewesen sein in den Herzen dieser Männer, die sie antreibt, mit kalter Überlegung, im Konklave versammelt, ihren arbeitenden Mitbruder als Deserteur von seinem Stande und von der Sache seines Standes zum Tode eines Verräters und Deserteurs zu verurteilen, ihn hinzurichten, da ein öffentlicher Richter und Henker es nicht tut, durch einen heimlichen Henker, gleich dem alten Femgericht und geheimen Tribunal der Ritterzeit, das plötzlich in dieser Weise sich erneuert, mehr als einmal plötzlich vor das erstaunte Auge der Leute tritt, nicht in Panzerhemden, sondern in Samtjacken gekleidet, nicht in westfälischen Wäldern sich versammelnd, sondern im gepflasterten Gallowgate von Glasgow! - - Solch ein Gefühl muß weit verbreitet sein, und stark unter der Menge, wenn es auch nur in seiner höchsten Spitze eine solche Gestalt in wenigen annehmen kann!"'
  en: '"What kind of wild justice must it be in the hearts of these men that prompts them, with cold deliberation, in conclave assembled, to doom their brother workman, as the deserter of his order and his order''s cause, to die a traitor''s and a deserter''s death, have him executed, in default of any public judge and hangman, then by a secret one; like your old Chivalry Fehmgericht and Secret Tribunal, suddenly revived in this strange guise; suddenly rising once more on the astonished eye, dressed not now in mail shirts, but in fustian jackets, meeting not in Westphalian forests, but in the paved Gallowgate of Glasgow! Such a temper must be widespread virulent among the many when, even in its worst acme, it can take such form in the few."--Carlyle.'
  modern: ''
  modern_status: empty
  notes: ''
  en_note: English note {221b}.
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
