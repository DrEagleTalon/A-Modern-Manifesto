- id: VI.57.2
  kind: p
  original: Statt dessen hätten die Arbeiter sich durch Fleiß und Aufmerksamkeit empfehlen und über den Nutzen ihrer Herren freuen sollen, dann wären sie auch Aufseher, Geschäftsführer und endlich Associés geworden und hätten dadurch (o Weisheit, du sprichst wie eine Taube!)
  en: Instead of this, the working-men should have striven to recommend themselves by attention and industry, and should have rejoiced in the prosperity of their masters. They would then become overseers, superintendents, and finally partners, and would thus--(Oh! Wisdom, thou speakest as the dove!)--"have increased at the same time the demand for their companions' labour in the market!"
  modern: ''
