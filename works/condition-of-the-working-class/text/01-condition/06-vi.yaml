- id: VI.60.2
  kind: p
  original: Sie schienen alle heiter (cheerful) und alert, an dem leichten Spiel ihrer Muskel sich erfreuend (taking pleasure), die ihrem Alter natürliche Beweglichkeit in vollem Maße genießend.
  en: ''
  joined_to: VI.60.1
