- id: VI.60.1
  kind: p
  original: '"Ich habe manche Fabrik besucht, in Manchester und der Umgegend, und nie Kinder mißhandelt, körperlich gezüchtigt oder nur übel gelaunt gesehen.'
  en: '"I have visited many factories, both in Manchester and in the surrounding districts, during a period of several months, entering the spinning-rooms unexpectedly, and often alone, at different times of the day, and I never saw a single instance of corporal chastisement inflicted on a child; nor, indeed, did I ever see children in ill-humour. They seemed to be always cheerful and alert; taking pleasure in the light play of their muscles, enjoying the mobility natural to their age.'
