- id: VI.57.1
  kind: p
  original: Man habe, erzählt dieser in seiner "Philosophy of Manufactures", p. 277 u. folg., den Arbeitern vorgesagt, ihr Lohn stehe in keinem Verhältnis zu ihren Opfern und habe dadurch das gute Vernehmen zwischen Herren und Arbeitern gestört.
