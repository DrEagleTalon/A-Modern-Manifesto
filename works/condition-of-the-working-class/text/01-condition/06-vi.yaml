- id: VI.61.2
  kind: p
  original: Was die Gesundheit der Arbeiter betrifft, so hat der Bourgeois die grenzenlose Frechheit, den eben an tausend Stellen zitierten und exzerpierten Bericht von 1833 als Zeugnis für die ausgezeichnete Gesundheit dieser Leute anzuführen, durch einzelne herausgerissene Zitate beweisen zu wollen, daß sich bei ihnen keine Spur von Skrofeln finde und, was ganz richtig ist, das Fabriksystem sie von allen akuten Krankheiten befreie (daß sie dafür alle chronischen an den Hals bekommen, verschweigt er natürlich).
  en: As to the health of the operatives, the bourgeois has the boundless impudence to cite the report of 1833 just quoted in a thousand places, as testimony for the excellent health of these people; to try to prove by detached and garbled quotations that no trace of scrofula can be found among them, and, what is quite true, that the factory system frees them from all acute diseases, (that they have every variety of chronic affection instead he naturally conceals).
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: VI.61.3
  kind: p
  original: Man muß wissen, daß der Bericht aus drei dicken Foliobänden besteht, die durchzustudieren einem englischen wohlgenährten Bourgeois nicht einfällt, um die Frechheit begreifen zu können, mit der unser Freund Ure dem englischen Publikum die gröbsten Lügen aufheftet.
  en: To explain the impudence with which our friend Ure palms off the grossest falsehoods upon the English public, it must be known that the report consists of three large folio volumes, which it never occurs to a well-fed English bourgeois to study through.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: VI.61.4
  kind: p
  original: Hören wir noch, wie er sich über das Fabrikgesetz von 1833 ausspricht, das von der liberalen Bourgeoisie gegeben wurde und dem Fabrikanten nur die notdürftigsten Beschränkungen auflegt, wie wir sehen werden.
  en: Let us hear further how he expresses himself as to the Factory Act of 1834, passed by the Liberal bourgeoisie, and imposing only the most meagre limitations upon the manufacturers, as we shall see.
  modern: ''
  modern_status: empty
  notes: ''
