- id: VI.52.1
  kind: p
  original: Und so geht es in fast allen Fabriken.
  en: And so it goes on in almost all the factories.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: VI.52.2
  kind: p
  original: Die Arbeit junger Mädchen bringt in der Entwicklungsperiode derselben noch eine Menge sonstiger Unregelmäßigkeiten hervor.
  en: The employment of young girls produces all sorts of irregularities during the period of development.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 384-385
- id: VI.52.3
  kind: p
  original: Bei einigen, besonders den bessergenährten, treibt die Hitze der Fabriken die Entwicklung rascher voran als gewöhnlich, so daß einzelne Mädchen von 12 bis 14 Jahren vollkommen ausgebildet sind; Roberton, der schon erwähnte, wie der Fabrikbericht sagt, "eminente" Geburtshelfer in Manchester, erzählt im "North of England Medical and Surgical Journal", daß ihm ein elfjähriges Mädchen vorgekommen, die nicht nur ein vollkommen ausgebildetes Weib, sondern sogar schwanger gewesen sei und daß es gar nichts Seltnes in Manchester sei, wenn Frauenzimmer von 15 Jahren niederkämen.
  en: In some, especially those who are better fed, the heat of the factories hastens this process, so that in single cases, girls of thirteen and fourteen are wholly mature. Robertson, whom I have already cited (mentioned in the Factories' Inquiry Commission's Report as the "eminent" gynaecologist of Manchester), relates in the North of England Medical and Surgical Journal, that he had seen a girl of eleven years who was not only a wholly developed woman, but pregnant, and that it was by no means rare in Manchester for women to be confined at fifteen years of age.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.52.4
  kind: p
  original: In solchen Fällen wirkt die Wärme der Fabriken gerade wie die Hitze tropischer Klimate, und wie in solchen Klimaten rächt sich die übermäßig frühe Entwicklung auch durch früh eintretendes Alter und Erschlaffung.
  en: In such cases, the influence of the warmth of the factories is the same as that of a tropical climate, and, as in such climates, the abnormally early development revenges itself by correspondingly premature age and debility.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: VI.52.5
  kind: p
  original: Oft jedoch findet sich eine zurückgehaltene sexuale Entwicklung des weiblichen Körpers; die Brüste bilden sich spät oder gar nicht aus, wovon Cowell, p. 35, Beispiele gibt, die Menstruation tritt in vielen Fällen erst mit dem siebzehnten oder achtzehnten, zuweilen erst mit dem zwanzigsten Jahre ein und bleibt oft ganz aus (Dr. Hawkins, evid. p. 11, Dr. Loudon, p. 14 etc., Sir D. Barry, p. 5 etc.).
  en: On the other hand, retarded development of the female constitution occurs, the breasts mature late or not at all. Menstruation first appears in the seventeenth or Eighteenth, sometimes in the twentieth year, and is often wholly wanting.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
  en_note: 'English note {162c}: Cowell, p. 35. English note {163a}: Dr. Hawkins Evidence, p. 11; Dr. Loudon, p. 14, etc.; Sir D. Barry, p. 5, etc.'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.52.6
  kind: p
  original: Unregelmäßige Menstruation, mit vielen Schmerzen und Übeln verbunden, namentlich Bleichsucht ist sehr häufig, worüber die medizinischen Berichte einstimmig sind.
  en: Irregular menstruation, coupled with great pain and numerous affections, especially with anaemia, is very frequent, as the medical reports unanimously state.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: VI.53.1
  kind: p
  original: Die von solchen Frauen, besonders wenn sie während der Schwangerschaft arbeiten müssen, gebornen Kinder können nicht stark sein.
  en: Children of such mothers, particularly of those who are obliged to work during pregnancy, cannot be vigorous.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: VI.53.2
  kind: p
  original: Im Gegenteil, namentlich von Manchester aus werden sie im Bericht als sehr schwächlich geschildert, und nur Barry behauptet, daß sie gesund seien sagt aber auch, daß in Schottland, wo er inspizierte, fast gar keine verheirateten Frauen arbeiteten; dazu liegen die meisten Fabriken dort, mit Ausnahme von Glasgow, auf dem Lande, und das trägt sehr viel zur Stärkung der Kinder bei.
  en: They are, on the contrary, described in the report, especially in Manchester, as very feeble; and Barry alone asserts that they are healthy, but says further, that in Scotland, where his inspection lay, almost no married women worked in factories. Moreover, most of the factories there are in the country (with the exception of Glasgow), a circumstance which contributes greatly to the invigoration of the children.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.53.3
  kind: p
  original: 'Die Arbeiterkinder in der nächsten Umgebung von Manchester sind fast alle blühend und frisch, während sie in der Stadt bleich und skrofulös aussehen: aber mit dem neunten Jahre verliert sich die Farbe plötzlich, weil sie dann in die Fabrik geschickt werden, und bald kann man sie nicht mehr von Stadtkindern unterscheiden.'
  en: The operatives' children in the neighbourhood of Manchester are nearly all thriving and rosy, while those within the city look pale and scrofulous; but with the ninth year the colour vanishes suddenly, because all are then sent into the factories, when it soon becomes impossible to distinguish the country from the city children.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: VI.54.1
  kind: p
  original: Außerdem aber gibt es noch einige Zweige in der Fabrikarbeit, die besonders nachteilige Folgen haben.
  en: But besides all this, there are some branches of factory-work which have an especially injurious effect.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: VI.54.2
  kind: p
  original: In vielen Zimmern der Baumwoll- und Flachsspinnereien fliegt eine Menge faseriger Staub umher, der namentlich in den Kardier- und Hechelzimmern Brustbeschwerden. erzeugt.
  en: In many rooms of the cotton and flax-spinning mills, the air is filled with fibrous dust, which produces chest affections, especially among workers in the carding and combing-rooms.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.54.3
  kind: p
  original: Einige Konstitutionen können ihn ertragen, andere nicht.
  en: ''
  joined_to: VI.54.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '385'
- id: VI.54.4
  kind: p
  original: Aber der Arbeiter hat keine Wahl, er muß das Zimmer nehmen, wo er Arbeit findet, seine Brust mag gut sein oder nicht.
  en: Some constitutions can bear it, some cannot; but the operative has no choice.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '385'
- id: VI.54.5
  kind: p
  original: Die gewöhnlichsten Folgen dieses eingeatmeten Staubes sind Blutspeien, schwerer, pfeifender Atem, Schmerzen in der Brust, Husten, Schlaflosigkeit, kurz alle Symptome von Asthma, die im schlimmsten Falle in der Auszehrung endigen (vergl. Stuart, p. 13, 70, 101, Mackintosh, p. 24 etc., Power Rept. on Nottingham, on Leeds, Cowell, p. 33 etc., Barry, p.12 {fünf in einer Fabrik}, p. 17, 44, 52, 60 etc.; ebenso in dessen Bericht; Loudon, p. 13 etc. etc.).
  en: He must take the room in which he finds work, whether his chest is sound or not. The most common effects of this breathing of dust are blood-spitting, hard, noisy breathing, pains in the chest, coughs, sleeplessness--in short, all the symptoms of asthma ending in the worst cases in consumption.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 385-386
  en_note: 'English note {163b}: Compare Stuart, pp. 13, 70, 101; Mackintosh, p. 24, etc.; Power Report on Nottingham, on Leeds; Cowell, p. 33, etc.; Barry, p. 12; (five cases in one factory), pp. 17, 44, 52, 60, etc.; Loudon, p. 13.'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.54.6
  kind: p
  original: Besonders ungesund ist aber das Naßspinnen des Leinengarns, das von jungen Mädchen und Kindern getan wird.
  en: Especially unwholesome is the wet spinning of linen-yarn which is carried on by young girls and boys.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: VI.54.7
  kind: p
  original: Das Wasser spritzt ihnen von den Spindeln auf den Leib, so daß die vordere Seite ihrer Kleider fortwährend bis auf die Haut durchnäßt ist und fortwährend Wasser auf dem Boden steht.
  en: The water spirts over them from the spindle, so that the front of their clothing is constantly wet through to the skin; and there is always water standing on the floor.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: VI.54.8
  kind: p
  original: In geringerem Maße findet das auch in den Dublierzimmern der Baumwollfabriken statt, und die Folge davon sind fortwährende Erkältungen und Affektionen der Brust.
  en: This is the case to a less degree in the doubling-rooms of the cotton mills, and the result is a constant succession of colds and affections of the chest.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: VI.54.9
  kind: p
  original: Eine heisere, rauhe Sprache ist allen Fabrikarbeitern gemein, vor allen aber den Naßspinnern und Dublierern.
  en: A hoarse, rough voice is common to all operatives, but especially to wet spinners and doublers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: VI.54.10
  kind: p
  original: Stuart, Mackintosh und Sir D. Barry sprechen sich in den stärksten Ausdrücken über die Ungesundheit dieser Arbeit und die geringe Rücksicht der meisten Fabrikanten für die Gesundheit der diese Arbeit verrichtenden Mädchen aus.
  en: Stuart, Mackintosh, and Sir D. Barry express themselves in the most vigorous terms as to the unwholesomeness of this work, and the small consideration shown by most of the manufacturers for the health of the girls who do it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: VI.54.11
  kind: p
  original: Eine andre Wirkung des Flachsspinnens sind eigentümliche Verdrehungen der Schulter, namentlich Vorspringen des rechten Schulterblatts, die aus der Natur der Arbeit folgen.
  en: Another effect of flax-spinning is a peculiar deformity of the shoulder, especially a projection of the right shoulder-blade, consequent upon the nature of the work.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: VI.54.12
  kind: p
  original: Diese Art zu spinnen sowie das Throstlespinnen der Baumwolle bringen oft auch Krankheiten der Kniescheibe hervor, die zum Aufhalten der Spindel während der Anheftung zerrissener Fäden angewandt wird.
  en: This sort of spinning and the throstle-spinning of cotton frequently produce diseases of the knee-pan, which is used to check the spindle during the joining of broken threads.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: VI.54.13
  kind: p
  original: Das häufige Bücken bei diesen beiden Arbeitszweigen und die Niedrigkeit der Maschinen haben überhaupt einen mangelhaften Wuchs zur Folge.
  en: The frequent stooping and the bending to the low machines common to both these branches of work have, in general, a stunting effect upon the growth of the operative.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: VI.54.14
  kind: p
  original: In dem Throstlezimmer der Baumwollfabrik zu Manchester, in welcher ich beschäftigt war, erinnere ich mich nicht, ein einziges gut und schlank gewachsenes Mädchen gesehen zu haben; sie waren alle klein, schlecht gewachsen und eigentümlich gedrängten Baus, entschieden häßlich in ihrer ganzen Körperbildung.
  en: In the throstle-room of the cotton mill at Manchester, in which I was employed, I do not remember to have seen one single tall, well-built girl; they were all short, dumpy, and badly-formed, decidedly ugly in the whole development of the figure.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: VI.54.15
  kind: p
  original: Außer allen diesen Krankheiten und Verkrüppelungen haben die Arbeiter aber noch auf eine andere Weise an ihren Gliedern Schaden zu leiden.
  en: But apart from all these diseases and malformations, the limbs of the operatives suffer in still another way.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: VI.54.16
  kind: p
  original: Die Arbeit zwischen den Maschinen veranlaßt eine Menge Unglücksfälle, die mehr oder weniger ernster Natur sind und für den Arbeiter noch dazu die Folge haben, daß sie ihn teilweise oder ganz zu seiner Arbeit unfähig machen.
  en: The work between the machinery gives rise to multitudes of accidents of more or less serious nature, which have for the operative the secondary effect of unfitting him for his work more or less completely.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: VI.54.17
  kind: p
  original: Am häufigsten kommt es vor, daß ein einzelnes Glied von einem Finger abgequetscht wird, seltner schon, daß ganze Finger, eine halbe oder ganze Hand, ein Arm usw. von den Rädern ergriffen und zermalmt wird.
  en: The most common accident is the squeezing off of a single joint of a finger, somewhat less common the loss of the whole finger, half or a whole hand, an arm, etc., in the machinery.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: VI.54.18
  kind: p
  original: Sehr häufig tritt nach diesen, selbst den geringeren Unfällen Maulsperre ein und zieht den Tod nach sich.
  en: Lockjaw very often follows, even upon the lesser among these injuries, and brings death with it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '386'
- id: VI.54.19
  kind: p
  original: Man sieht in Manchester außer den vielen Krüppeln auch eine große Anzahl Verstümmelter umhergehen; dem einen fehlt der ganze oder halbe Arm, dem andern der Fuß, dem dritten das halbe Bein; man glaubt unter einer Armee zu leben, die eben aus dem Feldzuge zurückkommt.
  en: Besides the deformed persons, a great number of maimed ones may be seen going about in Manchester; this one has lost an arm or a part of one, that one a foot, the third half a leg; it is like living in the midst of an army just returned from a campaign.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 386-387
- id: VI.54.20
  kind: p
  original: Die gefährlichsten Stellen der Maschinerie sind aber die Riemen, welche die Triebkraft vom Schaft auf die einzelnen Maschinen leiten, besonders wenn sie Schnallen haben, die man indes selten mehr findet.
  en: But the most dangerous portion of the machinery is the strapping which conveys motive power from the shaft to the separate machines, especially if it contains buckles, which, however, are rarely used now.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: VI.54.21
  kind: p
  original: Wer von diesen Riemen ergriffen wird, den reißt die treibende Kraft pfeilschnell mit sich herum, schlägt ihn oben gegen die Decke und unten gegen den Fußboden mit solcher Gewalt, daß selten ein Knochen am Körper ganz bleibt und augenblicklicher Tod erfolgt.
  en: Whoever is seized by the strap is carried up with lightning speed, thrown against the ceiling above and floor below with such force that there is rarely a whole bone left in the body, and death follows instantly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: VI.54.22
  kind: p
  original: 'Zwischen dem 12. Juni und 3. August 1844 berichtet der "Manchester Guardian" über folgende ernstliche Unglücksfälle - die leichtern erwähnt er gar nicht: 12. Juni, ein Knabe starb in Manchester an der Mundklemme infolge einer zwischen Rädern zerquetschten Hand.'
  en: 'Between June 12th and August 3rd, 1843, the Manchester Guardian reported the following serious accidents (the trifling ones it does not notice): June 12th, a boy died in Manchester of lockjaw, caused by his hand being crushed between wheels.'
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T9
    editions: 1845 and 1892
    reading: 'irrtümlich: 1843'
    base_text: … und 3. August 1844 ‸ berichtet der "Manchester Guardian" …
  mew_page: '387'
- id: VI.54.23
  kind: p
  original: '- 15. Juni, ein Junge in Saddleworth, von einem Rade ergriffen und mitgerissen, starb, ganz zerschmettert.'
  en: June 16th, a youth in Saddleworth seized by a wheel and carried away with it; died, utterly mangled.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T10
    editions: 1845 and 1892
    reading: 'irrtümlich: 16. Juni'
    base_text: … - 15. Juni ‸ , ein Junge in …
  mew_page: '387'
- id: VI.54.24
  kind: p
  original: '- 29. Juni, ein junger Mann in Greenacres Moor bei Manchester, der in einer Maschinenfabrik arbeitete, geriet unter einen Schleifstein, der ihm zwei Rippen zerbrach und ihn sehr zerfleischte.'
  en: June 29th, a young man at Green Acres Moor, near Manchester, at work in a machine shop, fell under the grindstone, which broke two of his ribs and lacerated him terribly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: VI.54.25
  kind: p
  original: '- 24. Juli, ein Mädchen in Oldham starb, von einem Riemen fünfzigmal mit herumgerissen, kein Knochen blieb ganz.'
  en: July 24th, a girl in Oldham died, carried around fifty times by a strap; no bone unbroken.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: VI.54.26
  kind: p
  original: '- 27. Juli, in Manchester geriet ein Mädchen in den Blower [die erste Maschine, welche die rohe Baumwolle aufnimmt] und starb an den erlittenen Verstümmelungen.'
  en: July 27th, a girl in Manchester seized by the blower (the first machine that receives the raw cotton), and died of injuries received.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: VI.54.27
  kind: p
  original: '- 3. August, ein Spulendrechsler starb, von einem Riemen fortgerissen, in Dukinfield - alle Rippen waren zerbrochen.'
  en: August 3rd, a bobbins turner died in Dukenfield, caught in a strap, every rib broken.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: VI.54.28
  kind: p
  original: '- Das Krankenhaus von Manchester hatte im Jahre 1843 allein 962 Verwundungen und Verstümmelungen durch Maschinerie zu heilen, während die Anzahl aller übrigen Unglücksfälle im Bereich des Krankenhauses auf 2 426 sich beliefen, so daß auf fünf Unglücksfälle aus allen andern Ursachen zwei durch Maschinerie kamen.'
  en: In the year 1843, the Manchester Infirmary treated 962 cases of wounds and mutilations caused by machinery, while the number of all other accidents within the district of the hospital was 2,426, so that for five accidents from all other causes, two were caused by machinery.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: VI.54.29
  kind: p
  original: Die in Salford vorgekommenen Unfälle sind hier nicht eingeschlossen, ebensowenig die, welche von Privatärzten geheilt wurden.
  en: The accidents which happened in Salford are not included here, nor those treated by surgeons in private practice.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: VI.54.30
  kind: p
  original: Die Fabrikanten bezahlen bei solchen Unglücken, sie mögen arbeitsunfähig machen oder nicht, höchstens den Arzt und, wenn es sehr hoch kommt, den Lohn während der Dauer der Kur - wohin der Arbeiter später gerät, wenn er nicht arbeiten kann, ist ihnen gleichgültig.
  en: In such cases, whether or not the accident unfits the victim for further work, the employer, at best, pays the doctor, or, in very exceptional cases, he may pay wages during treatment; what becomes of the operative afterwards, in case he cannot work, is no concern of the employer.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: VI.55.1
  kind: p
  original: 'Der Fabrikbericht sagt über diesen Gegenstand: In allen Fällen müsse der Fabrikant verantwortlich gemacht werden: denn Kinder könnten sich nicht in acht nehmen und Erwachsene würden sich in ihrem eignen Interesse schon in acht nehmen.'
  en: The Factory Report says on this subject, that employers must be made responsible for all cases, since children cannot take care, and adults will take care in their own interest.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '387'
- id: VI.55.2
  kind: p
  original: Aber es sind Bourgeois, die den Bericht schreiben, und daher müssen sie sich widersprechen und nachher allerlei Salbaderei über "sündliche Verwegenheit" (culpable temerity) der Arbeiter vorführen.
  en: But the gentlemen who write the report are bourgeois, and so they must contradict themselves and bring up later all sorts of bosh on the subject of the culpable temerity of the operatives.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 387-388
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.55.3
  kind: p
  original: Einerlei.
  en: ''
  joined_to: VI.55.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '388'
- id: VI.55.4
  kind: p
  original: 'Die Sache ist diese: Wenn Kinder sich nicht in acht nehmen können, so muß die Arbeit von Kindern verboten werden.'
  en: 'The state of the case is this: If children cannot take care, the employment of children must be forbidden.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: VI.55.5
  kind: p
  original: Wenn Erwachsene sich nicht gehörig in acht nehmen, so müssen sie entweder Kinder sein, auf einer Bildungsstufe stehen, die ihnen nicht erlaubt die Gefahr in ihrer ganzen Größe zu erkennen - und wer ist daran schuld als die Bourgeoisie, die sie in einer Lage erhält, in der sie sich nicht bilden können? - oder die Maschinen sind schlecht arrangiert und müssen mit Brustwehren oder Verschlägen umgeben werden, was auch dem Bourgeois zur Last fällt - oder der Arbeiter hat Motive, die die drohende Gefahr überwiegen, er muß rasch arbeiten, um Geld zu verdienen, und hat keine Zeit, sich in acht zu nehmen etc. auch daran ist der Bourgeois schuld.
  en: If adults are reckless, they must be mere over-grown children on a plane of intelligence which does not enable them to appreciate the danger in its full scope; and who is to blame for this but the bourgeoisie which keeps them in a condition in which their intelligence cannot develop? Or the machinery is ill-arranged, and must be surrounded with fencing, to supply which falls to the share of the bourgeoisie. Or the operative is under inducements which outweigh the threatened danger; he must work rapidly to earn his wages, has no time to take care, and for this, too, the bourgeoisie is to blame.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VI.55.6
  kind: p
  original: Viele Unglücksfälle kommen z.B. vor, wenn die Arbeiter Maschinen reinigen wollen, während diese in Bewegung sind.
  en: Many accidents happen, for instance, while the operatives are cleaning machinery in motion.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: VI.55.7
  kind: p
  original: Weshalb?
  en: Why?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: VI.55.8
  kind: p
  original: Weil der Bourgeois die Arbeiter zwingt, während der Freistunden, wenn sie stillstehen, die Maschinen zu putzen, und der Arbeiter natürlich keine Lust hat, sich von seiner freien Zeit etwas abnagen zu lassen.
  en: Because the bourgeois would otherwise oblige the worker to clean the machinery during the free hours while it is not going, and the worker naturally is not disposed to sacrifice any part of his free time.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: VI.55.9
  kind: p
  original: So viel ist dem Arbeiter jede freie Stunde wert, daß er sich oft lieber zweimal wöchentlich in Lebensgefahr begibt, als sie dem Bourgeois opfert.
  en: Every free hour is so precious to the worker that he often risks his life twice a week rather than sacrifice one of them to the bourgeois.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: VI.55.10
  kind: p
  original: Laßt die Fabrikanten die zum Putzen der Maschinen nötige Zeit von der Arbeitszeit nehmen, und es wird keinem Arbeiter mehr einfallen, laufende Maschinerie zu putzen.
  en: Let the employer take from working-hours the time required for cleaning the machinery, and it will never again occur to an operative to clean machinery in motion.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: VI.55.11
  kind: p
  original: Kurz, in allen Fällen fällt die letzte Schuld auf den Fabrikanten, von dem im gelindesten Falle die lebenslängliche Unterstützung des arbeitsunfähig gewordenen Arbeiters oder bei Todesfällen seiner Familie zu verlangen wäre.
  en: In short, from whatever point of view, the blame falls ultimately on the manufacturer, and of him should be required, at the very least, life-long support of the incapacitated operative, and support of the victim's family in case death follows the accident.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: VI.55.12
  kind: p
  original: In den ersten Zeiten der Industrie waren die Unfälle verhältnismäßig viel zahlreicher als jetzt, weil die Maschinen schlechter, kleiner, gedrängter und fast gar nicht verschlagen waren.
  en: In the earliest period of manufacture, the accidents were much more numerous in proportion than now, for the machinery was inferior, smaller, more crowded, and almost never fenced.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: VI.55.13
  kind: p
  original: Wie aber obige Angaben beweisen, ist ihre Zahl noch immer groß genug, um ernste Bedenken über einen Zustand rege zu machen, der erlaubt, daß so viele Verstümmelungen und Verwundungen zum Besten einer einzigen Klasse vorkommen und so mancher fleißige Arbeiter durch ein Unglück, das er im Dienst und durch Verschulden der Bourgeoisie erlitt, der Not und dem Hunger preisgegeben wird.
  en: But the number is still large enough, as the foregoing cases prove, to arouse grave question as to a state of things which permits so many deformities and mutilations for the benefit of a single class, and plunges so many industrious working-people into want and starvation by reason of injuries undergone in the service and through the fault of the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: VI.56.1
  kind: p
  original: Eine schöne Reihe Krankheiten, bloß durch die scheußliche Geldgier der Bourgeoisie erzeugt!
  en: A pretty list of diseases engendered purely by the hateful money greed of the manufacturers!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: VI.56.2
  kind: p
  original: Weiber zum Gebären unfähig gemacht, Kinder verkrüppelt, Männer geschwächt, Glieder zerquetscht, ganze Generationen verdorben, mit Schwäche und Siechtum infiziert, bloß um der Bourgeoisie die Beutel zu füllen!
  en: Women made unfit for childbearing, children deformed, men enfeebled, limbs crushed, whole generations wrecked, afflicted with disease and infirmity, purely to fill the purses of the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '388'
- id: VI.56.3
  kind: p
  original: Und wenn man erst die Barbarei der einzelnen Fälle liest, wie die Kinder von den Aufsehern nackt aus dem Bette geholt, mit den Kleidern auf dem Arm unter Schlägen und Tritten in die Fabriken gejagt (z. B. Stuart p. 39 und sonst) wurden, wie ihnen der Schlaf mit Schlägen vertrieben, wie sie trotzdem über der Arbeit eingeschlafen, wie ein armes Kind noch im Schlaf, und nachdem die Maschine stillgesetzt war, auf den Zuruf des Aufsehers aufsprang und mit geschlossenen Augen die Handgriffe seiner Arbeit durchmachte, wenn man liest, wie die Kinder, zu müde, nach Hause zu gehen, sich im Trockenzimmer unter der Wolle verbargen, um dort zu schlafen, und nur mit dem Riemen aus der Fabrik getrieben werden konnten, wie viele Hunderte jeden Abend so müde nach Hause kamen, daß sie vor Schläfrigkeit und Mangel an Appetit ihr Abendbrot nicht verzehren konnten, daß ihre Eltern sie kniend vor dem Bette fanden, wo sie während des Gebets eingeschlafen waren; wenn man das alles und noch hundert andere Infamien und Schändlichkeiten in diesem einen Berichte liest, alle auf den Eid bezeugt, durch mehrere Zeugen bestätigt, von Männern ausgesagt, die die Kommissäre selbst für glaubwürdig erklären, wenn man bedenkt, daß es ein "liberaler" Bericht ist, ein Bourgeoisiebericht, um den früheren der Tories umzustoßen und die Herzensreinheit der Fabrikanten herzustellen, daß die Kommissäre selbst auf seiten der Bourgeoisie sind und alles das wider Willen berichten - so soll man nicht entrüstet, nicht ingrimmig werden über diese Klasse, die sich mit Menschenfreundlichkeit und Aufopferung brüstet, während es ihr einzig auf die Füllung ihrer Börsen à tout prix [um jeden Preis] ankommt?
  en: And when one reads of the barbarism of single cases, how children are seized naked in bed by the overlookers, and driven with blows and kicks to the factory, their clothing over their arms, how their sleepiness is driven off with blows, how they fall asleep over their work nevertheless, how one poor child sprang up, still asleep, at the call of the overlooker, and mechanically went through the operations of its work after its machine was stopped; when one reads how children, too tired to go home, hide away in the wool in the drying-room to sleep there, and could only be driven out of the factory with straps; how many hundreds came home so tired every night, that they could eat no supper for sleepiness and want of appetite, that their parents found them kneeling by the bedside, where they had fallen asleep during their prayers; when one reads all this and a hundred other villainies and infamies in this one report, all testified to on oath, confirmed by several witnesses, deposed by men whom the commissioners themselves declare trustworthy; when one reflects that this is a Liberal report, a bourgeois report, made for the purpose of reversing the previous Tory report, and rehabilitating the pureness of heart of the manufacturers, that the commissioners themselves are on the side of the bourgeoisie, and report all these things against their own will, how can one be otherwise than filled with wrath and resentment against a class which boasts of philanthropy and self-sacrifice, while its one object is to fill its purse a tout prix?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 388-389
  en_note: 'English note {167a}: Stuart, p. 39.'
- id: VI.56.4
  kind: p
  original: 'Hören wir indes die Bourgeoisie, wie sie durch den Mund ihres auserwählten Knechts, des Doktor Ure, spricht:'
  en: Meanwhile, let us listen to the bourgeoisie speaking through the mouth of its chosen apostle, Dr. Ure, who relates in his "Philosophy of Manufactures" that the workers have been told that their wages bore no proportion to their sacrifices, the good understanding between masters and men being thus disturbed.
  modern: ''
