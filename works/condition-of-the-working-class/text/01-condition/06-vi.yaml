- id: VI.N8.1.1
  kind: note
  original: 'Wie zahlreich die in Fabriken arbeitenden verheirateten Frauen sind, geht aus einer von den Fabrikanten selbst gemachten Angabe hervor: In 412 Fabriken in Lancashire arbeiteten ihrer 10 721; von ihren Männern hatten nur 5 314 gleichfalls in Fabriken Arbeit, 3 927 waren sonst beschäftigt, 821 arbeitslos und über 659 fehlten die Notizen.'
  en: 'How numerous married women are in the factories is seen from information furnished by a manufacturer: In 412 factories in Lancashire, 10,721 of them were employed; of the husbands of these women, but 5,314 were also employed in the factories, 3,927 were otherwise employed, 821 were unemployed, and information was wanting as to 659; or two, if not three men for each factory, are supported by the work of their wives.'
  modern: ''
  modern_status: empty
  notes: ''
  en_note: English note {147a}.
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
