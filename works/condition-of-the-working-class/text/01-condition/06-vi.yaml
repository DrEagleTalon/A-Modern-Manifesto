- id: VI.74.8
  kind: p
  original: Aber wo sein Sie jetz aber Es ist etwas Anderes unser trukVabrikand gehörd zu die Vromme Vreihandels Leute Er get 2 mal in Die kirge Jeden sondag Und sagd Dem pfaven Andegtig Nag wir Haben unter Laßen Die Dinge so wir Haten tun solen Und wir Haben getan Die dinge so Wir heten unter Lasen solen und in Uns ist kein gut Aber schohne unser guter Gott" (Worte der anglikanischen Litanei) "ja schohne unser biß Morgen so bezalen wir wider Unsern Webern in vaule Waren."
  en: 'Our truck manufacturer belongs to the pious Free Trade lot; he goes to church twice every Sunday, and repeats devotedly after the parson: ''We have left undone the things we ought to have done, and we have done the things we ought not to have done, and there is no good in us; but, good Lord, deliver us.'' Yes, deliver us till to-morrow, and we will pay our weavers again in rotten goods."'
  modern: ''
