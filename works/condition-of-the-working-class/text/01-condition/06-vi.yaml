  mew_page: '384'
- id: VI.49.11
  kind: p
  original: Jene da pflegt nur drei Tage zu Hause zu bleiben.
  en: That one over there only stays three days."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: VI.49.12
  kind: p
  original: '- Natürlich; die Furcht, entlassen zu werden, die Furcht vor der Brotlosigkeit treibt sie, trotz ihrer Schwäche, trotz ihrer Schmerzen in die Fabrik; das Interesse des Fabrikanten leidet es nicht, daß seine Arbeiter krankheitswegen zu Hause bleiben, sie dürfen nicht krank werden, sie dürfen sich nicht unterstehen, ins Wochenbett zu kommen - sonst müßte er ja seine Maschinen stillsetzen oder seinen allerhöchsten Kopf mit der Einrichtung einer temporären Abänderung plagen; und ehe er das tut, entläßt er seine Leute, wenn sie sich unterfangen, unwohl zu sein.'
  en: Naturally, fear of being discharged, dread of starvation drives her to the factory in spite of her weakness, in defiance of her pain. The interest of the manufacturer will not brook that his employees stay at home by reason of illness; they must not be ill, they must not venture to lie still through a long confinement, or he must stop his machinery or trouble his supreme head with a temporary change of arrangements, and rather than do this, he discharges his people when they begin to be ill.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.49.13
  kind: p
  original: 'Hört (Cowell, evid. p. 77):'
  en: 'Listen:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
  en_note: 'English note {162a}: Cowell Evidence, p. 77.'
- id: VI.50.1
  kind: p
  original: '"Ein Mädchen fühlt sich sehr krank, kann kaum ihre Arbeit tun.'
  en: '"A girl feels very ill, can scarcely do her work.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: VI.50.2
  kind: p
  original: '- Warum sie nicht um Erlaubnis frage, nach Hause zu gehen?'
  en: Why does she not ask permission to go home?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: VI.50.3
  kind: p
  original: '- Ach, Herr, der "Herr" ist sehr eigen darin, wenn wir einen Vierteltag abwesend sind, so riskieren wir, weggeschickt zu werden."'
  en: Ah! the master is very particular, and if we are away half a day, we risk being sent away altogether."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: VI.51.1
  kind: p
  original: 'Oder (Sir D. Barry, evid. p. 44): Thomas MacDurt, Arbeiter, hat gelindes Fieber, "kann nicht zu Hause bleiben, wenigstens nicht länger als vier Tage, weil er sonst fürchten muß, seine Arbeit zu verlieren."'
  en: 'Or Sir D. Barry: "Thomas McDurt, workman, has slight fever. Cannot stay at home longer than four days, because he would fear of losing his place."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
  en_note: 'English note {162b}: Sir D. Barry Evidence, p. 44.'
  align: '1:3'
