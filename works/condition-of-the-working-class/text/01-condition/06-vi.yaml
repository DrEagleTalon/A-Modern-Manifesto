  mew_page: '390'
- id: VI.61.5
  kind: p
  original: Dies Gesetz, namentlich der Schulzwang, sei eine absurde und despotische Maßregel gegen die Fabrikanten.
  en: This law, especially its compulsory education clause, he calls an absurd and despotic measure directed against the manufacturers, through which all children under twelve years of age have been thrown out of employment; and with what results?
  modern: ''
