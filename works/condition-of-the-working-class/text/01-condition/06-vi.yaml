- id: VI.N6.1.1
  kind: note
  original: '"Der Stand der Dinge in Beziehung auf Arbeitslohn ist augenblicklich sehr verdreht in einigen Zweigen der Baumwollfabrikation in Lancashire; es gibt Hunderte von jungen Männern, zwischen 20 und 30 Jahren, die als Piecer und sonst beschäftigt sind und nicht mehr als 8 oder 9 Shilling wöchentlich erhalten, während unter demselben Dach Kinder von 13 Jahren 5 sh. und junge Mädchen zwischen 16 und 20 Jahren 10 bis 12 sh. wöchentlich verdienen."'
  en: 'Report of Factory Inspector, L. Homer, October, 1844: "The state of things in the matter of wages is greatly perverted in certain branches of cotton manufacture in Lancashire; there are hundreds of young men, between twenty and thirty, employed as piecers and otherwise, who do not get more than 8 or 9 shillings a week, while children under thirteen years, working under the same roof, earn 5 shillings, and young girls, from sixteen to twenty years, 10-12 shillings per week."'
  modern: ''
  modern_status: empty
  notes: ''
  en_note: English note {141}.
