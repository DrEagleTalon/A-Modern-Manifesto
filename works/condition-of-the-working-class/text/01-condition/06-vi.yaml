  modern_status: joined
  notes: ''
  mew_page: '390'
- id: VI.60.3
  kind: p
  original: Die Szene der Industrie, weit entfernt, traurige Emotionen in meinem Gemüt hervorzubringen, war mir stets aufheiternd.
  en: The scene of industry, so far from exciting sad emotions, in my mind, was always exhilerating.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: VI.60.4
  kind: p
  original: Es war entzückend (delightful), die Hurtigkeit zu beobachten, mit der sie die zerrissenen Fäden wieder vereinigten, sowie der Mule-Wagen zurückging, und sie in Muße zu sehen, wie sie, nachdem ihre zarten Fingerchen ein paar Sekunden in Tätigkeit gewesen waren, sich in allen erdenklichen Stellungen amüsierten, bis das Ausziehen und Aufwinden wieder fertig war.
  en: It was delightful to observe the nimbleness with which they pieced broken ends, as the mule carriage began to recede from the fixed roller beam, and to see them at leisure, after a few seconds' exercise of their tiny fingers, to amuse themselves in any attitude they chose, till the stretch and winding on were once more completed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: VI.60.5
  kind: p
  original: Die Arbeit dieser flüchtigen (lively) Elfen schien einem Spiel zu gleichen, worin ihnen ihre Übung eine gefällige Gewandtheit gab.
  en: The work of these lively elves seemed to resemble a sport, in which habit gave them a pleasing dexterity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: VI.60.6
  kind: p
  original: Ihrer Geschicklichkeit sich bewußt, freuten sie sich, sie vor jedem Fremden zu zeigen.
  en: Conscious of their skill, they were delighted to show it off to any stranger.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '390'
- id: VI.60.7
  kind: p
  original: Von Erschöpfung keine Spur, denn wenn sie aus der Fabrik kamen, fingen sie auf dem nächsten Spielplatz sogleich an, sich herumzutummeln mit derselben Lebhaftigkeit wie Jungen, die eben aus der Schule kommen."
  en: As to exhaustion by the day's work, they evinced no trace of it on emerging from the mill in the evening; for they immediately began to skip about any neighbouring playground, and to commence their little games with the same alacrity as boys issuing from a school."
  modern: ''
  modern_status: empty
  notes: ''
