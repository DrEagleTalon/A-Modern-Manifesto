- id: VI.58.1
  kind: p
  original: '"Ja, es war ihr hoher Lohn, der es ihnen möglich machte, ein besoldetes Komitee zu halten und sich in nervöse Hypertrophie durch eine Diät hineinzumästen, die für ihre Arbeit viel zu kräftig und aufregend war!"'
  en: '"In fact, it was their high wages which enabled them to maintain a stipendiary committee in affluence, and to pamper themselves into nervous ailments, by a diet too rich and exciting for their indoor employments."'
