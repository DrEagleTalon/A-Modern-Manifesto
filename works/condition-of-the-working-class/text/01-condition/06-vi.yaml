- id: VI.74.7
  kind: p
  original: Das Ist vreyer Handel. lord Brohom (Brougham) sagd wir Solden Edwas zu Rüklegen in unseren Junge Täge Auff Das wir Nigt die armen Casse bedürven wen wir Ald sein sollen wir Die vaule waren zu Rüklegen. wen dis Nigt keme von einen Lordso solte Mann sagen Das sein geHirn Eben So vaul were Als Die waren wo mit wir unsere arbeid bezald krigen. alS die Ungestempelden Zeitungen Aufkamen taten Da war Ein Menge so dis Der polizei anzeigden in Holmfirth Da waren die Blyths, die Eatwoods Und s. w. etcet.
  en: If this did not come from a lord, one would say his brains were as rotten as the goods that our work is paid in. When the unstamped papers came out "illegally," there was a lot of them to report it to the police in Holmfirth, the Blythes, the Edwards, etc.; but where are they now? But this is different.
  modern: ''
