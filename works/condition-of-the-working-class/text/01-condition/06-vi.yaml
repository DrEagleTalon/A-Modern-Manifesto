- id: VI.61.6
  kind: p
  original: Alle Kinder unter zwölf Jahren seien dadurch arbeitslos geworden, und was sei die Folge?
  en: ''
  joined_to: VI.61.5
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '390'
- id: VI.61.7
  kind: p
  original: Die Kinder, so von ihrer leichten und nützlichen Arbeit entlassen, bekämen nun gar keine Erziehung; aus dem warmen Spinnsaal in die kalte Welt hinausgestoßen, existierten sie nur durch Betteln und Stehlen - ein Leben, traurig kontrastierend mit ihrer stets sich verbessernden Lage in der Fabrik und ihrer Sonntagsschule!
  en: The children thus discharged from their light and useful occupation receive no education whatsoever; cast out from the warm spinning-room into a cold world, they subsist only by begging and stealing, a life in sad contrast with their steadily improving condition in the factory and in Sunday school.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 390-391
- id: VI.61.8
  kind: p
  original: Dies Gesetz erschwere unter der Maske Philanthropie die Leiden der Armen und werde den gewissenhaften Fabrikanten in seiner nützlichen Arbeit äußerst hemmen, wo nicht ganz aufhalten (p. 405, 406 ff.).
  en: Under the mask of philanthropy, this law intensifies the sufferings of the poor, and will greatly restrict the conscientious manufacturer in his useful work, if, indeed, it does not wholly stop him.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
  en_note: 'English note {169}: Dr. Andrew Ure. "Philosophy of Manufactures," pp. 405, 406, et seq.'
- id: VI.62.1
  kind: p
  original: Die zerstörenden Wirkungen des Fabriksystems fingen schon früh an, allgemeine Aufmerksamkeit auf sich zu ziehen.
  en: The ruinous influence of the factory system began at an early day to attract general attention.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
- id: VI.62.2
  kind: p
  original: Von dem Lehrlingsgesetz von 1802 sprachen wir schon.
  en: We have already alluded to the Apprentices' Act of 1802.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
- id: VI.62.3
  kind: p
  original: Später, gegen 1817, fing der nachherige Stifter des englischen Sozialismus, damals Fabrikant in Neu-Lanark (Schottland), Robert Owen, an, durch Petitionen und Denkschriften der vollziehenden Gewalt die Notwendigkeit gesetzlicher Garantien für die Gesundheit der Arbeiter, besonders der Kinder, vorzuhalten.
  en: Later, towards 1817, Robert Owen, then a manufacturer in New Lanark, in Scotland, afterwards founder of English Socialism, began to call the attention of the Government, by memorials and petitions, to the necessity of legislative guarantees for the health of the operatives, and especially of children.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
- id: VI.62.4
  kind: p
  original: Der verstorbene Sir R. Peel sowie andere Philanthropen schlossen sich ihm an und erwirkten nacheinander die Fabrikgesetze von 1819, 1825 und 1831, von denen die beiden ersten gar nicht, das letzte nur hier und da befolgt wurden.
  en: The late Sir Robert Peel and other philanthropists united with him, and gradually secured the Factory Acts of 1818, 1825, and 1831, of which the first two were never enforced, and the last only here and there.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T12
    editions: 1845 and 1892
    reading: 'Bei Engels irrtümlich: 1818'
    base_text: … die Fabrikgesetze von 1819 ‸ , 1825 und 1831, …
  mew_page: '391'
- id: VI.62.5
  kind: p
  original: Dies Gesetz von 831, auf den Antrag von Sir J. C. Hobhouse basiert, setzte fest, daß in keiner Baumwollenfabrik Leute unter 21 Jahren nachts, d.h. zwischen halb acht und morgens halb sechs Uhr, arbeiten, und in allen Fabriken junge Leute unter 18 Jahren höchstens 12 Stunden täglich und 9 Stunden sonnabends arbeiten sollten.
  en: This law of 1831, based upon the motion of Sir J. C. Hobhouse, provided that in cotton mills no one under twenty-one should be employed between half-past seven at night and half-past five in the morning; and that in all factories young persons under eighteen should work no longer than twelve hours daily, and nine hours on Saturday.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
- id: VI.62.6
  kind: p
  original: Da aber die Arbeiter nicht gegen ihre Brotherren zeugen durften, ohne entlassen zu werden, so half dies Gesetz wenig.
  en: But since operatives could not testify against their masters without being discharged, this law helped matters very little.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
- id: VI.62.7
  kind: p
  original: In großen Städten, wo die Arbeiter unruhiger waren, kam allenfalls eine Übereinkunft der bedeutenderen Fabrikanten zustande, sich dem Gesetz fügen zu wollen, aber selbst hier gab es viele, die sich, wie die Fabrikanten auf dem Lande, gar nicht um das Gesetz kümmerten.
  en: In the great cities, where the operatives were more restive, the larger manufacturers came to an agreement among themselves to obey the law; but even there, there were many who, like the employers in the country, did not trouble themselves about it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
- id: VI.62.8
  kind: p
  original: Unterdes war unter den Arbeitern das Verlangen nach einer Zehnstundenbill rege geworden, d.h. einem Gesetz, das allen jungen Leuten unter dem achtzehnten Jahre verböte, länger als zehn Stunden zu arbeiten; die Arbeiterassoziationen erhoben diesen Wunsch durch Agitation zum allgemeinen der Fabrikbevölkerung, die humane Sektion der Torypartei, damals von Michael Sadler angeführt, griff diesen Plan auf und brachte ihn vor das Parlament.
  en: Meanwhile, the demand for a ten hours' law had become lively among the operatives; that is, for a law which should forbid all operatives under eighteen years of age to work longer than ten hours daily; the Trades Unions, by their agitation, made this demand general throughout the manufacturing population; the philanthropic section of the Tory party, then led by Michael Sadler, seized upon the plan, and brought it before Parliament.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
- id: VI.62.9
  kind: p
  original: Sadler erhielt ein Parlamentskomitee zur Untersuchung des Fabriksystems bewilligt, und dies gab in der Session von 1832 seinen Bericht ab.
  en: Sadler obtained a parliamentary committee for the investigation of the factory system, and this committee reported in 1832.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
- id: VI.62.10
  kind: p
  original: Dieser Bericht war entschieden parteiisch, von lauter Feinden des Fabriksystems und zu einem Parteizweck verfaßt.
  en: Its report was emphatically partisan, composed by strong enemies of the factory system, for party ends.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '391'
- id: VI.62.11
  kind: p
  original: Sadler ließ sich durch seine edle Leidenschaft zu den schiefsten und unrichtigsten Behauptungen verleiten, er lockte schon durch die Art seiner Fragen den Zeugen Antworten ab, die zwar Wahres, aber in verkehrter, schiefer Form enthielten.
  en: Sadler permitted himself to be betrayed by his noble enthusiasm into the most distorted and erroneous statements, drew from his witnesses by the very form of his questions, answers which contained the truth, but truth in a perverted form.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 391-392
- id: VI.62.12
  kind: p
  original: Die Fabrikanten, über einen Bericht entsetzt, der sie als Ungeheuer schilderte, baten nun selbst um eine offizielle Untersuchung; sie wußten, daß ein genauer Bericht ihnen jetzt nur nützen könne, sie wußten, daß Whigs, echte Bourgeois am Staatsruder saßen, mit denen sie sich gut standen, deren Prinzipien einer Beschränkung der Industrie entgegen waren; sie erhielten richtig eine Kommission von lauter liberalen Bourgeois, deren Bericht derselbe war, den ich bisher so häufig zitierte.
  en: The manufacturers themselves, incensed at a report which represented them as monsters, now demanded an official investigation; they knew that an exact report must, in this case, be advantageous to them; they knew that Whigs, genuine bourgeois, were at the helm, with whom they were upon good terms, whose principles were opposed to any restriction upon manufacture. They obtained a commission, in due order, composed of Liberal bourgeois, whose report I have so often cited.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.62.13
  kind: p
  original: Der Bericht kommt der Wahrheit etwas näher als der des Sadlerschen Komitees, seine Abweichungen von ihr sind aber auf der entgegengesetzten Seite.
  en: This comes somewhat nearer the truth than Sadler's, but its deviations therefrom are in the opposite direction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: VI.62.14
  kind: p
  original: Er zeigt auf jeder Seite Sympathie für die Fabrikanten, Mißtrauen gegen den Sadlerschen Bericht, Abneigung gegen die selbsttätigen Arbeiter und die Unterstützer der Zehnstundenbill; er erkennt nirgends das Recht der Arbeiter zu einer menschlichen Existenz, zu eigner Tätigkeit und eignen Meinungen an; er macht es ihnen zum Vorwurf, daß sie bei der Zehnstundenbill nicht nur an die Kinder, sondern auch an sich selbst dächten, er nennt die agitierenden Arbeiter Demagogen, Böswillige, Übelgesinnte usw., kurz, er steht auf seiten der Bourgeoisie - und doch kann er die Fabrikanten nicht weißwaschen, und doch bleibt eine solche Menge von Schändlichkeiten nach seinem eignen Geständnis auf den Schultern der Fabrikanten lasten, daß selbst nach diesem Bericht die Zehnstundenbill-Agitation, der Haß der Arbeiter gegen die Fabrikanten und die härtesten Bezeichnungen des Komitees gegen die letzteren vollständig gerechtfertigt sind.
  en: On every page it betrays sympathy with the manufacturers, distrust of the Sadler report, repugnance to the working-men agitating independently and the supporters of the Ten Hours' Bill. It nowhere recognises the right of the working-man to a life worthy of a human being, to independent activity, and opinions of his own. It reproaches the operatives that in sustaining the Ten Hours' Bill they thought, not of the children only, but of themselves as well; it calls the working-men engaged in the agitation demagogues, ill-intentioned, malicious, etc., is written, in short, on the side of the bourgeoisie; and still it cannot whitewash the manufacturers, and still it leaves such a mass of infamies upon the shoulders of the employers, that even after this report, the agitation for the Ten Hours' Bill, the hatred against the manufacturers, and the committee's severest epithets applied to them are all fully justified.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VI.62.15
  kind: p
  original: Nur mit dem Unterschiede, daß, während der Sadlersche Bericht den Fabrikanten offne, unverhüllte Brutalität vorwirft, es sich jetzt zeigte, daß diese Brutalität meist unter der Maske der Zivilisation und Menschlichkeit betrieben wurde.
  en: But there was the one difference, that whereas the Sadler report accuses the manufacturers of open, undisguised brutality, it now became evident that this brutality was chiefly carried on under the mask of civilisation and humanity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
- id: VI.62.16
  kind: p
  original: Erklärt sich doch Dr. Hawkins, der medizinische Kommissär für Lancashire, selbst entschieden für die Zehnstundenbill, gleich in der ersten Zeile seines Berichts!
  en: Yet Dr. Hawkins, the medical commissioner for Lancashire, expresses himself decidedly in favour of the Ten Hours' Bill in the opening lines of his report, and Commissioner Mackintosh explains that his own report does not contain the whole truth, because it is very difficult to induce the operatives to testify against their employers, and because the manufacturers, besides being forced into greater concessions towards their operatives by the excitement among the latter, are often prepared for the inspection of the factories, have them swept, the speed of the machinery reduced, etc. In Lancashire especially they resorted to the device of bringing the overlookers of workrooms before the commissioners, and letting them testify as working-men to the humanity of the employers, the wholesome effects of the work, and the indifference, if not the hostility of the operatives, towards the Ten Hours' Bill.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '392'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.62.17
  kind: p
  original: Und der Kommissär Mackintosh erklärt selbst, daß sein Bericht nicht die volle Wahrheit enthalte, da die Arbeiter nur sehr schwer dahin zu bringen seien, gegen ihre Brotherren zu zeugen, und die Fabrikanten - ohnehin schon durch die Aufregung unter den Arbeitern zu größerer Nachgiebigkeit gegen diese gezwungen - oft genug sich auf den Besuch der Kommission präpariert, die Fabriken gefegt, die Schnelligkeit der Maschinenbewegung verringert hätten etc. Namentlich in Lancashire brauchten sie den Kniff, der Kommission die Aufseher der Arbeitssäle als "Arbeiter" vorzuführen, um diese für die Humanität der Fabrikanten, die gesunde Wirkung der Arbeit und die Gleichgültigkeit, ja Abneigung der Arbeiter gegen die Zehnstundenbill zeugen zu lassen.
  en: ''
  joined_to: VI.62.16
  modern: ''
  modern_status: joined
  notes: ''
  variants:
  - ref: T13
    editions: '1845'
    reading: 'irrtümlich: Besuch der Fabrikanten'
    base_text: … den Besuch der Kommission ‸ präpariert, die Fabriken gefegt, …
  mew_page: 392-393
- id: VI.62.18
  kind: p
  original: Aber diese Aufseher sind keine echten Arbeiter mehr, sie sind Deserteure ihrer Klasse, die sich für höheren Lohn in den Dienst der Bourgeoisie begeben haben und im Interesse der Kapitalisten gegen die Arbeiter kämpfen.
  en: But these are not genuine working-men; they are deserters from their class, who have entered the service of the bourgeoisie for better pay, and fight in the interests of the capitalists against the workers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: VI.62.19
  kind: p
  original: Ihr Interesse ist das der Bourgeoisie, und daher sind sie den Arbeitern fast mehr verhaßt wie die Fabrikanten selbst.
  en: Their interest is that of the capitalists, and they are, therefore, almost more hated by the workers than the manufacturers themselves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: VI.62.20
  kind: p
  original: Und dennoch ist der Bericht vollkommen genügend, um die schändlichste Rücksichtslosigkeit der fabrizierenden Bourgeoisie gegen ihre Arbeiter, die ganze Infamie des industriellen Ausbeutungssystems in ihrer vollen Unmenschlichkeit zu zeigen.
  en: And yet this report suffices wholly to exhibit the most shameful recklessness of the manufacturing bourgeoisie towards its employees, the whole infamy of the industrial exploiting system in its full inhumanity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: VI.62.21
  kind: p
  original: Nichts ist empörender, als hier in diesem Bericht auf der einen Seite die langen Register von Krankheiten und Verkrüppelungen durch Überarbeitung der kalten, berechnenden Nationalökonomie des Fabrikanten auf der andern gegenübergestellt zu sehen, wo dieser mit Zahlen zu beweisen sucht, daß er und ganz England mit ihm zugrunde gehen müßte, wenn man ihm nicht mehr erlaube, jährlich soundso viele Kinder zu Krüppeln zu machen - nur die schamlose Sprache des Herrn Ure, die ich eben angeführt habe, würde noch empörender sein, wenn sie nicht zu lächerlich wäre.
  en: Nothing is more revolting than to compare the long register of diseases and deformities engendered by overwork, in this report, with the cold, calculating political economy of the manufacturers, by which they try to prove that they, and with them all England, must go to ruin, if they should be forbidden to cripple so and so many children every year. The language of Dr. Ure alone, which I have quoted, would be yet more revolting if it were not so preposterous.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.63.1
  kind: p
  original: Die Folge dieses Berichts war das Fabrikgesetz von 1833, das die Arbeit von Kindern unter neun Jahren verbot (mit Ausnahme der Seidenfabriken), die Arbeitszeit der Kinder zwischen 9 und 13 Jahren auf 48 Stunden wöchentlich oder höchstens 9 an einem Tage, die von jungen Leuten zwischen dem 14. und 18. Lebensjahre auf 69 wöchentlich oder 12 höchstens an einem Tage beschränkte, ein Minimum von 1 1/2 Stunden Zwischenzeit für Mahlzeiten festsetzte und das Nachtarbeiten für alle unter 18 Jahren nochmals verbot.
  en: The result of this report was the Factory Act of 1834, which forbade the employment of children under nine years of age (except in silk mills), limited the working-hours of children between 9-13 years to 48 per week, or 9 hours in any one day at the utmost; that of young persons from 14-18 years of age to 69 per week, or 12 on any one day as the maximum, provided for an hour and a half as the minimum interval for meals, and repeated the total prohibition of night-work for persons under eighteen years of age.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: VI.63.2
  kind: p
  original: Zugleich wurde ein täglich zweistündiger zwangsmäßiger Schulbesuch für alle Kinder unter 14 Jahren eingeführt und der Fabrikant für straffällig erklärt, wenn er Kinder ohne Alterszertifikat vom Fabrikarzte oder ohne Schulbesuchszertifikat vom Lehrer beschäftige.
  en: Compulsory school attendance two hours daily was prescribed for all children under fourteen years, and the manufacturer declared punishable in case of employing children without a certificate of age from the factory surgeon, and a certificate of school attendance from the teacher.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: VI.63.3
  kind: p
  original: Dafür durfte er wöchentlich einen Penny für den Lehrer vom Lohne des Kindes zurückbehalten.
  en: As recompense, the employer was permitted to withdraw one penny from the child's weekly earnings to pay the teacher.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: VI.63.4
  kind: p
  original: Außerdem wurden Fabrikärzte und Inspektoren ernannt, die zu jeder Zeit in die Fabrik gehen, die Arbeiter eidlich verhören durften und auf die Beachtung des Gesetzes durch Klage beim Friedensgericht zu halten hatten Das ist das Gesetz, worüber Dr. Ure so grenzenlos schimpft!
  en: Further, surgeons and inspectors were appointed to visit the factories at all times, take testimony of operatives on oath, and enforce the law by prosecution before a Justice of the Peace. This is the law against which Dr. Ure inveighs in such unmeasured terms!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.64.1
  kind: p
  original: Die Folge des Gesetzes und namentlich der Ernennung von Inspektoren war, daß die Arbeitszeit durchschnittlich auf zwölf bis dreizehn Stunden herabgesetzt und die Kinder so gut ersetzt wurden, als es ging.
  en: The consequence of this law, and especially of the appointment of inspectors, was the reduction of working-hours to an average of twelve to thirteen, and the superseding of children as far as possible.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '393'
- id: VI.64.2
  kind: p
  original: Damit verschwanden einige der schreiendsten Übel fast gänzlich; Verkrüppelungen kamen nur noch bei sehr schwachen Konstitutionen vor die Wirkungen der Arbeit traten weniger eklatant ans Tageslicht.
  en: Hereupon some of the most crying evils disappeared almost wholly. Deformities arose now only in cases of weak constitution, and the effects of overwork became much less conspicuous.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 393-394
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.64.3
  kind: p
  original: Indes haben wir im Fabrikbericht Zeugnisse genug, daß die gelinderen Übel, Anschwellung der Fußgelenke, Schwache und Schmerzen in Beinen, Hüften und Rückgrat, varikose Adern, Geschwüre an den unteren Extremitäten, allgemeine Schwäche, besonders Schwächung des Unterleibs, Neigung zum Erbrechen, Mangel an Appetit abwechselnd mit Heißhunger, schlechte Verdauung, Hypochondrie, dann die Brustübel infolge des Staubes und der schlechten Atmosphäre der Fabriken usw. usw., alle auch in den Fabriken und bei denjenigen Individuen vorkamen, die nach den Vorschriften von Sir J. C. Hobhouses Gesetz - also zwölf bis höchstens dreizehn Stunden arbeiteten.
  en: Nevertheless, enough testimony remains to be found in the Factory Report, that the lesser evils, swelling of the ankles, weakness and pain in the legs, hips, and back, varicose veins, ulcers on the lower extremities, general weakness, especially of the pelvic region, nausea, want of appetite alternating with unnatural hunger, indigestion, hypochondria, affections of the chest in consequence of the dust and foul atmosphere of the factories, etc. etc., all occur among employees subject to the provisions of Sir J. C. Hobhouse's law (of 1831), which prescribes twelve to thirteen hours as the maximum.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: VI.64.4
  kind: p
  original: Die Berichte aus Glasgow und Manchester sind hier namentlich zu vergleichen.
  en: The reports from Glasgow and Manchester are especially worthy of attention in this respect.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: VI.64.5
  kind: p
  original: Diese Übel sind auch nach dem Gesetz von 1833 geblieben und fahren bis auf den heutigen Tag fort, die Gesundheit der arbeitenden Klasse zu untergraben.
  en: These evils remained too, after the law of 1834, and continue to undermine the health of the working-class to this day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: VI.64.6
  kind: p
  original: Man hat dafür gesorgt, daß die brutale Gewinnsucht der Bourgeoisie eine heuchlerische, zivilisierte Form annahm, daß die Fabrikanten, durch den Arm des Gesetzes von allzu krassen Niederträchtigkeiten abgehalten, desto mehr scheinbaren Grund haben, ihre erlogene Humanität selbstgefällig auszukramen - das ist alles.
  en: Care has been taken to give the brutal profit-greed of the bourgeoisie a hypocritical, civilised form, to restrain the manufacturers through the arm of the law from too conspicuous villainies, and thus to give them a pretext for self-complacently parading their sham philanthropy. That is all.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.64.7
  kind: p
  original: Wenn heute eine neue Fabrikkommission ausginge, sie würde das meiste beim alten finden.
  en: If a new commission were appointed to-day, it would find things pretty much as before.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: VI.64.8
  kind: p
  original: Was den extemporierten Schulzwang betrifft, so blieb dieser ganz wirkungslos, da die Regierung nicht zu gleicher Zeit für gute Schulen sorgte.
  en: As to the extemporised compulsory attendance at school, it remained wholly a dead letter, since the Government failed to provide good schools.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: VI.64.9
  kind: p
  original: Die Fabrikanten stellten ausgediente Arbeiter an, zu denen sie die Kinder zwei Stunden täglich schickten und so dem Buchstaben des Gesetzes genügten - die Kinder lernten nichts.
  en: The manufacturers employed as teachers worn-out operatives, to whom they sent the children two hours daily, thus complying with the letter of the law; but the children learned nothing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: VI.64.10
  kind: p
  original: Und selbst die Berichte der Fabrikinspektoren, die sich nur auf das beschränken, was ihres Amts ist, nämlich die Befolgung des Fabrikgesetzes, geben Material genug, um daraus das notwendige Fortbestehen der erwähnten Übel schließen zu können.
  en: And even the reports of the factory inspectors, which are limited to the scope of the inspector's duties, i.e., the enforcement of the Factory Act, give data enough to justify the conclusion that the old evils inevitably remain.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: VI.64.11
  kind: p
  original: Inspektoren Horner und Saunders, in ihren Berichten vom Oktober und Dezember 1843, erzählen, daß eine Menge Fabrikanten in denjenigen Arbeitszweigen, wo die Arbeit von Kindern entbehrt oder durch sonst brotlos gewordene Erwachsene ersetzt werden kann, 14 bis 16 Stunden und drüber arbeiten lassen.
  en: Inspectors Horner and Saunders, in their reports for October and December, 1844, state that, in a number of branches in which the employment of children can be dispensed with or superseded by that of adults, the working-day is still fourteen to sixteen hours, or even longer.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: VI.64.12
  kind: p
  original: Darunter seien namentlich viele junge Leute, die eben dem Gesetz entwachsen seien.
  en: Among the operatives in these branches they found numbers of young people who had just outgrown the provisions of the law.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: VI.64.13
  kind: p
  original: Andere verletzen das Gesetz geradezu, verkürzen die Freistunden, lassen Kinder länger arbeiten, als erlaubt ist, und lassen es auf eine Anklage ankommen, da die etwaige Strafe doch sehr gering ist gegen den Nutzen, den sie von der Übertretung haben.
  en: Many employers disregard the law, shorten the meal times, work children longer than is permitted, and risk prosecution, knowing that the possible fines are trifling in comparison with the certain profits derivable from the offence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: VI.64.14
  kind: p
  original: Namentlich jetzt, wo das Geschäft besonders gut geht, haben die Fabrikanten große Versuchung dazu.
  en: Just at present especially, while business is exceptionally brisk, they are under great temptation in this respect.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '394'
- id: VI.65.1
  kind: p
  original: Unter den Arbeitern hörte indes die Zehnstunden-Agitation nicht auf; 1839 war sie wieder in vollem Zuge, und an des verstorbenen Sadlers Stelle trat im Unterhause Lord Ashley und außer demselben Richard Oastler, beide Tories.
  en: Meanwhile the agitation for the Ten Hours' Bill by no means died out among the operatives; in 1839 it was under full headway once more, and Sadler's place, he having died, was filled in the House of Commons by Lord Ashley and Richard Oastler, both Tories.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 394-395
  en_note: 'English note {174}: Afterwards Earl of Shaftesbury, died 1885.'
- id: VI.65.2
  kind: p
  original: Oastler namentlich, der fortwährend in den Arbeiterdistrikten agitierte und schon zu Sadlers Zeiten agitiert hatte, ward der spezielle Günstling der Arbeiter.
  en: Oastler especially, who carried on a constant agitation in the factory districts, and had been active in the same way during Sadler's life, was the particular favourite of the working-men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
- id: VI.65.3
  kind: p
  original: Sie nannten ihn nur ihren "guten alten König", den "König der Fabrikkinder", und in den ganzen Fabrikdistrikten ist kein Kind, das ihn nicht kennt und verehrt, das ihm nicht, wenn er in die Stadt kommt, mit den andern in Prozession entgegenzieht.
  en: They called him their "good old king," "the king of the factory children," and there is not a child in the factory districts that does not know and revere him, that does not join the procession which moves to welcome him when he enters a town.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
- id: VI.65.4
  kind: p
  original: Oastler opponierte auch sehr energisch gegen das neue Armengesetz und wurde deshalb von einem Herrn Thornhill, einem Whig, auf dessen Gut er Verwalter war und dem er eine Summe schuldete, wegen Schulden gefangengesetzt.
  en: Oastler vigorously opposed the New Poor Law also, and was therefore imprisoned for debt by a Mr. Thornley, on whose estate he was employed as agent, and to whom he owed money.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
- id: VI.65.5
  kind: p
  original: Die Whigs boten ihm mehrmals an, seine Schuld zu bezahlen, ihn sonst zu begünstigen, wenn er seine Opposition gegen das Armengesetz aufgeben wolle.
  en: The Whigs offered repeatedly to pay his debt and confer other favours upon him if he would only give up his agitation against the Poor Law.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
- id: VI.65.6
  kind: p
  original: Vergebens.
  en: But in vain; he remained in prison, whence he published his Fleet Papers against the factory system and the Poor Law.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.65.7
  kind: p
  original: Er blieb im Gefängnis und schickte von da aus seine "Fleet papers" gegen das Fabriksystem und das Armengesetz.
  en: ''
  joined_to: VI.65.6
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '395'
- id: VI.66.1
  kind: p
  original: Die Tory-Regierung von 1841 wandte wieder ihre Aufmerksamkeit auf die Fabrikgesetze.
  en: The Tory Government of 1841 turned its attention once more to the Factory Acts.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
- id: VI.66.2
  kind: p
  original: Der Minister des Innern, Sir James Graham, schlug 1843 eine Bill vor, wodurch die Arbeitszeit der Kinder auf 6 1/2 Stunden beschränkt und der Schulzwang verschärft wurde; die Hauptsache dabei war aber die Errichtung besserer Schulen.
  en: The Home Secretary, Sir James Graham, proposed, in 1843, a bill restricting the working-hours of children to six and one-half, and making the enactments for compulsory school attendance more effective; the principal point in this connection being a provision for better schools.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
- id: VI.66.3
  kind: p
  original: Diese Bill scheiterte indes an der Eifersucht der Dissenters [Andersdenkenden (der nicht zur anglikanischen Staatskirche gehörenden Protestanten)]; obwohl der Zwang für Dissenterkinder nicht auf den Religionsunterricht ausgedehnt wurde, so war doch die Schule überhaupt unter die Aufsicht der Staatskirche gestellt, und da die Bibel das allgemeine Lesebuch bilden, die Religion also dem ganzen Unterricht zugrunde liegen sollte, so fanden sich die Dissenter bedroht.
  en: This bill was, however, wrecked by the jealousy of the dissenters; for, although compulsory religious instruction was not extended to the children of dissenters, the schools provided for were to be placed under the general supervision of the Established Church, and the Bible made the general reading-book; religion being thus made the foundation of all instruction, whence the dissenters felt themselves threatened.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
- id: VI.66.4
  kind: p
  original: Die Fabrikanten und überhaupt die Liberalen schlugen sich zu ihnen, die Arbeiter waren wegen der kirchlichen Frage geteilt und deshalb untätig, die Opposition gegen die Bill brachte, obwohl sie in den großen Fabrikstädten, z.B. Salford und Stockport, geschlagen wurde und in andern, wie Manchester, nur einige Punkte der Bill aus Furcht vor den Arbeitern angreifen konnte, dennoch an zwei Millionen Unterschriften für ihre Petitionen zusammen, und Graham ließ sich so weit einschüchtern, daß er die ganze Bill zurücknahm.
  en: The manufacturers and the Liberals generally united with them, the working-men were divided by the Church question, and therefore inactive. The opponents of the bill, though outweighed in the great manufacturing towns, such as Salford and Stockport, and able in others, such as Manchester, to attack certain of its points only, for fear of the working-men, collected nevertheless nearly two million signatures for a petition against it, and Graham allowed himself to be so far intimidated as to withdraw the whole bill.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '395'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.66.5
  kind: p
  original: Im nächsten Jahre ließ er die Bestimmungen wegen der Schulen weg und schlug bloß vor, statt der bisherigen Vorschriften die Arbeit von Kindern zwischen acht und dreizehn Jahren auf 6 1/2 Stunden täglich und zwar so, daß sie entweder den Vormittag oder den Nachmittag ganz frei hätten, die von jungen Leuten zwischen dreizehn und achtzehn Jahren und die aller Weiber auf zwölf Stunden festzustellen und außerdem einige Beschränkungen der bisher häufigen Umgehung des Gesetzes einzuführen.
  en: The next year he omitted the school clauses, and proposed that, instead of the previous provisions, children between eight and thirteen years should be restricted to six and one-half hours, and so employed as to have either the whole morning or the whole afternoon free; that young people between thirteen and eighteen years, and all females, should be limited to twelve hours; and that the hitherto frequent evasions of the law should be prevented.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 395-396
- id: VI.66.6
  kind: p
  original: Kaum war er damit aufgetreten, so begann die Zehnstunden-Agitation heftiger als je.
  en: Hardly had he proposed this bill, when the ten hours' agitation was begun again more vigorously than ever.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: VI.66.7
  kind: p
  original: Oastler wurde frei, eine Anzahl seiner Freunde und eine Kollekte unter den Arbeitern hatten seine Schuld bezahlt - und mit voller Kraft warf er sich in die Bewegung.
  en: Oastler had just then regained his liberty; a number of his friends and a collection among the workers had paid his debt, and he threw himself into the movement with all his might.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: VI.66.8
  kind: p
  original: Die Vertreter der Zehnstundenbill im Unterhause hatten zugenommen, die Massen von Petitionen, die von allen Seiten für die Zehnstundenbill einkamen, führten ihnen neue Unterstützer zu - am 19. März 1844 setzte Lord Ashley durch eine Majorität von 179 gegen 170 den Beschluß durch, daß der Ausdruck "Nacht" in der Fabrikbill die Zeit zwischen sechs Uhr abends und sechs Uhr morgens ausdrücken solle, wodurch also bei dem Verbot der Nachtarbeit die Arbeitszeit inklusive Freistunden auf 12 und der Sache nach exklusive Freistunden auf 10 gesetzt wurde.
  en: The defenders of the Ten Hours' Bill in the House of Commons had increased in numbers, the masses of petitions supporting it which poured in from all sides brought them allies, and on March 19th, 1844, Lord Ashley carried, with a majority of 179 to 170, a resolution that the word "Night" in the Factory Act should express the time from six at night to six in the morning, whereby the prohibition of night-work came to mean the limitation of working-hours to twelve, including free hours, or ten hours of actual work a day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: VI.66.9
  kind: p
  original: Aber das Ministerium war damit nicht einverstanden.
  en: But the ministry did not agree to this.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: VI.66.10
  kind: p
  original: Sir James Graham begann mit einem Rücktritt des Kabinetts zu drohen - und bei der nächsten Abstimmung über einen Paragraphen der Bill verwarf das Haus mit kleinen Majoritäten sowohl zehn als zwölf Stunden!
  en: Sir James Graham began to threaten resignation from the Cabinet, and at the next vote on the bill the House rejected by a small majority both ten and twelve hours!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: VI.66.11
  kind: p
  original: Graham und Peel erklärten nun, daß sie eine neue Bill einbringen würden, und wenn diese nicht passierte, so würden sie abtreten; die neue Bill war genau die alte Zwölfstundenbill, nur mit Abänderungen der Form - und dasselbe Unterhaus, das im März diese Bill in ihren Hauptpunkten verworfen, nahm sie jetzt im Mai mit Haut und Haaren an!
  en: Graham and Peel now announced that they should introduce a new bill, and that if this failed to pass they should resign. The new bill was exactly the old Twelve Hours' Bill with some changes of form, and the same House of Commons which had rejected the principal points of this bill in March, now swallowed it whole.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.66.12
  kind: p
  original: Die Ursache davon war, daß die meisten Unterstützer der Zehnstundenbill Tories waren, die lieber die Bill als das Ministerium fallen ließen; aber mögen die Motive gewesen sein, welche sie wollen, das Unterhaus hat sich durch diese Abstimmungen, deren eine die andere umwirft, bei allen Arbeitern in die größte Verachtung gebracht und die von den Chartisten behauptete Notwendigkeit seiner Reform selbst aufs glänzendste bewiesen.
  en: The reason of this was that most of the supporters of the Ten Hours' Bill were Tories who let fall the bill rather than the ministry; but be the motives what they may, the House of Commons by its votes upon this subject, each vote reversing the last, has brought itself into the greatest contempt among all the workers, and proved most brilliantly the Chartists' assertion of the necessity of its reform.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: VI.66.13
  kind: p
  original: Drei Mitglieder, die früher gegen das Ministerium gestimmt hatten, stimmten später dafür und retteten es dadurch.
  en: Three members, who had formerly voted against the ministry, afterwards voted for it and rescued it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: VI.66.14
  kind: p
  original: Bei allen Abstimmungen stimmte die Masse der Opposition für und die Masse der Ministeriellen gegen das Kabinett.
  en: In all the divisions, the bulk of the opposition voted for and the bulk of its own party against the ministry.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N13
  mew_page: '396'
- id: VI.66.15
  kind: p
  original: Die obigen Vorschläge Grahams wegen respektive 6 1/2 stündiger und 12 stündiger Arbeit der beiden Arbeiterklassen sind also jetzt gesetzlich festgestellt und hierdurch sowie durch Beschränkung des Nachholens für verlorne Zeit (wenn Maschinerie zerbrach oder die Wasserkraft wegen Frost oder Dürre zu gering wurde) und andere kleinere Beschränkungen ist eine längere als zwölfstündige Arbeitszeit fast unmöglich gemacht.
  en: The foregoing propositions of Graham touching the employment of children six and one-half and of all other operatives twelve hours are now legislative provisions, and by them and by the limitation of overwork for making up time lost through breakdown of machinery or insufficient water-power by reason of frost or drought, a working-day of more than twelve hours has been made well-nigh impossible.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '396'
- id: VI.66.16
  kind: p
  original: Es unterliegt indes keinem Zweifel, daß in sehr kurzer Zeit die Zehnstundenbill wirklich durchgehen wird.
  en: There remains, however, no doubt that, in a very short time, the Ten Hours' Bill will really be adopted.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 396-397
- id: VI.66.17
  kind: p
  original: Die Fabrikanten sind natürlich fast alle dagegen, es gibt vielleicht keine zehn, die dafür sind; sie haben alle ehrlichen und unehrlichen Mittel gegen diesen ihnen verhaßten Vorschlag aufgeboten, aber das hilft ihnen zu nichts, als daß sie sich den Haß der Arbeiter immer mehr und mehr zuziehen.
  en: The manufacturers are naturally all against it, there are perhaps not ten who are for it; they have used every honourable and dishonourable means against this dreaded measure, but with no other result than that of drawing down upon them the ever deepening hatred of the working-men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: VI.66.18
  kind: p
  original: Die Bill geht doch durch, was die Arbeiter wollen, das können sie, und daß sie die Zehnstundenbill wollen, haben sie im vorigen Frühjahr bewiesen.
  en: The bill will pass. What the working-men will do they can do, and that they will have this bill they proved last spring.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.66.19
  kind: p
  original: Die nationalökonomischen Argumente der Fabrikanten, daß eine Zehnstundenbill die Produktionskosten steigere, daß sie dadurch die englische Industrie unfähig mache, gegen auswärtige Konkurrenz zu kämpfen, daß der Arbeitslohn notwendig fallen müsse usw., sind allerdings halb wahr, aber sie beweisen nichts, als daß die industrielle Größe Englands nur durch barbarische Behandlung der Arbeiter, nur durch Zerstörung der Gesundheit, durch soziale, physische und geistige Vernachlässigung ganzer Generationen aufrechterhalten werden kann.
  en: The economic arguments of the manufacturers that a Ten Hours' Bill would increase the cost of production and incapacitate the English producers for competition in foreign markets, and that wages must fall, are all half true; but they prove nothing except this, that the industrial greatness of England can be maintained only through the barbarous treatment of the operatives, the destruction of their health, the social, physical, and mental decay of whole generations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: VI.66.20
  kind: p
  original: Natürlich, wäre die Zehnstundenbill eine definitive Maßregel, so würde England dabei ruiniert; weil sie aber notwendig andere Maßregeln nach sich zieht, die England auf eine ganz andere als die bisher befolgte Bahn lenken müssen, deshalb wird sie ein Fort schritt sein.
  en: Naturally, if the Ten Hours' Bill were a final measure, it must ruin England; but since it must inevitably bring with it other measures which must draw England into a path wholly different from that hitherto followed, it can only prove an advance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: VI.67.1
  kind: p
  original: Wenden wir uns nun zu einer andern Seite des Fabriksystems, die weniger als die daraus folgenden Krankheiten durch gesetzliche Vorschriften zu beseitigen ist.
  en: Let us turn to another side of the factory system which cannot be remedied by legislative provisions so easily as the diseases now engendered by it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: VI.67.2
  kind: p
  original: Wir sprachen schon im allgemeinen von der Art der Arbeit, und wir sprachen ausführlich genug, um aus dem Gegebenen weitere Schlüsse ziehen zu können.
  en: We have already alluded in a general way to the nature of the employment, and enough in detail to be able to draw certain inferences from the facts given.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: VI.67.3
  kind: p
  original: Die Beaufsichtigung von Maschinen, das Anknüpfen zerrissener Fäden ist keine Tätigkeit, die das Denken des Arbeiters in Anspruch nimmt, und auf der andern Seite wieder derart, daß sie den Arbeiter hindert, seinen Geist mit andern Dingen zu beschäftigen.
  en: The supervision of machinery, the joining of broken threads, is no activity which claims the operative's thinking powers, yet it is of a sort which prevents him from occupying his mind with other things.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: VI.67.4
  kind: p
  original: Zu gleicher Zeit sahen wir, daß diese Arbeit ebenfalls den Muskeln, der körperlichen Tätigkeit keinen Spielraum bietet.
  en: We have seen, too, that this work affords the muscles no opportunity for physical activity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: VI.67.5
  kind: p
  original: Auf diese Weise ist es eigentlich keine Arbeit, sondern die reine Langeweile, das ertötendste, abmattendste, was es gibt - der Fabrikarbeiter ist dazu verurteilt, seine körperlichen und geistigen Kräfte gänzlich in dieser Langeweile verkommen zu lassen, er hat den Beruf, sich von seinem achten Jahre an den ganzen Tag zu langweilen.
  en: Thus it is, properly speaking, not work, but tedium, the most deadening, wearing process conceivable. The operative is condemned to let his physical and mental powers decay in this utter monotony, it is his mission to be bored every day and all day long from his eighth year.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.67.6
  kind: p
  original: Dazu kann er keinen Augenblick abkommen - die Dampfmaschine geht den ganzen Tag, die Räder, Riemen und Spindeln schnurren und rasseln ihm in einem fort in die Ohren, und wenn er nur einen Augenblick ruhen will, so hat er gleich den Aufseher mit dem Strafenbuch hinter sich.
  en: Moreover, he must not take a moment's rest; the engine moves unceasingly; the wheels, the straps, the spindles hum and rattle in his ears without a pause, and if he tries to snatch one instant, there is the overlooker at his back with the book of fines.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
- id: VI.67.7
  kind: p
  original: Diese Verdammung zum Lebendigbegrabenwerden in der Fabrik, zum steten Achtgeben auf die unermüdliche Maschine wird von den Arbeitern als die härteste Tortur empfunden.
  en: This condemnation to be buried alive in the mill, to give constant attention to the tireless machine is felt as the keenest torture by the operatives, and its action upon mind and body is in the long run stunting in the highest degree.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '397'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.67.8
  kind: p
  original: Sie wirkt aber auch im höchsten Grade abstumpfend, wie auf den Körper so auch auf den Geist des Arbeiters.
  en: ''
  joined_to: VI.67.7
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: 397-398
- id: VI.67.9
  kind: p
  original: Man kann wirklich keine bessere Methode zur Verdummung erfinden als die Fabrikarbeit, und wenn dennoch die Fabrikarbeiter nicht nur ihren Verstand gerettet, sondern auch mehr als andere ausgebildet und geschärft haben, so war dies wieder nur durch die Empörung gegen ihr Schicksal und gegen die Bourgeoisie möglich - das einzige, was sie allenfalls noch bei der Arbeit denken und fühlen konnten.
  en: There is no better means of inducing stupefaction than a period of factory work, and if the operatives have, nevertheless, not only rescued their intelligence, but cultivated and sharpened it more than other working-men, they have found this possible only in rebellion against their fate and against the bourgeoisie, the sole subject on which under all circumstances they can think and feel while at work.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: VI.67.10
  kind: p
  original: Und wenn diese Indignation gegen die Bourgeoisie nicht zum vorherrschenden Gefühl beim Arbeiter wird, so ist die notwendige Folge der Trunk und überhaupt alles das, was man gewöhnlich Demoralisation nennt.
  en: Or, if this indignation against the bourgeoisie does not become the supreme passion of the working-man, the inevitable consequence is drunkenness and all that is generally called demoralisation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: VI.67.11
  kind: p
  original: Schon die körperliche Abspannung und die infolge des Fabriksystems allgemein gewordenen Krankheiten waren dem offiziellen Kommissar Hawkins hinreichend, um aus ihnen die Notwendigkeit dieser Demoralisation abzuleiten - wieviel mehr noch, wenn auch die geistige Abspannung noch hinzutritt und die schon erwähnten Umstände, die jeden Arbeiter zur Demoralisation verlocken, hier auch ihre Einflüsse fühlbar machen!
  en: The physical enervation and the sickness, universal in consequence of the factory system, were enough to induce Commissioner Hawkins to attribute this demoralisation thereto as inevitable; how much more when mental lassitude is added to them, and when the influences already mentioned which tempt every working-man to demoralisation, make themselves felt here too!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: VI.67.12
  kind: p
  original: Wir dürfen uns daher auch gar nicht darüber wundern, daß namentlich in den Fabrikstädten die Trunksucht und die geschlechtliche Ausschweifung die Höhe erreicht hat, die ich früher schon geschildert habe.
  en: There is no cause for surprise, therefore, that in the manufacturing towns especially, drunkenness and sexual excesses have reached the pitch which I have already described.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N14
  mew_page: '398'
- id: VI.68.1
  kind: p
  original: Weiter.
  en: Further, the slavery in which the bourgeoisie holds the proletariat chained, is nowhere more conspicuous than in the factory system.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.68.2
  kind: p
  original: Die Sklaverei, in der die Bourgeoisie das Proletariat gefesselt hält, kommt nirgends deutlicher ans Tageslicht als im Fabriksystem.
  en: ''
  joined_to: VI.68.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '398'
- id: VI.68.3
  kind: p
  original: Hier hört alle Freiheit rechtlich und faktisch auf.
  en: Here ends all freedom in law and in fact.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '398'
- id: VI.68.4
  kind: p
  original: Der Arbeiter muß morgens um halb sechs in der Fabrik sein - kommt er ein paar Minuten zu spät, so wird er gestraft, kommt er zehn Minuten zu spät, so wird er gar nicht hineingelassen, bis das Frühstück vorüber ist, und verliert einen Vierteltag am Lohn (obgleich er nur 2 1/2 Stunden von 12 nicht arbeitet).
  en: The operative must be in the mill at half-past five in the morning; if he comes a couple of minutes too late, he is fined; if he comes ten minutes too late, he is not let in until breakfast is over, and a quarter of the day's wages is withheld, though he loses only two and one-half hours' work out of twelve.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 398-399
- id: VI.68.5
  kind: p
  original: Er muß auf Kommando essen, trinken und schlafen.
  en: He must eat, drink, and sleep at command.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: VI.68.6
  kind: p
  original: Er hat zur Befriedigung der allerdringendsten Bedürfnisse die allergeringste Zeit, die zu ihrer Abmachung nötig ist.
  en: For satisfying the most imperative needs, he is vouchsafed the least possible time absolutely required by them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: VI.68.7
  kind: p
  original: Ob seine Wohnung von der Fabrik eine halbe oder ganze Stunde weit abliegt, kümmert den Fabrikanten nicht.
  en: Whether his dwelling is a half-hour or a whole one removed from the factory does not concern his employer.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: VI.68.8
  kind: p
  original: Die despotische Glocke ruft ihn aus dem Bette, ruft ihn vom Frühstück und Mittagstisch.
  en: The despotic bell calls him from his bed, his breakfast, his dinner.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: VI.69.1
  kind: p
  original: Und wie geht es ihm gar erst in der Fabrik!
  en: What a time he has of it, too, inside the factory!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: VI.69.2
  kind: p
  original: Hier ist der Fabrikant absoluter Gesetzgeber.
  en: 'Here the employer is absolute law-giver; he makes regulations at will, changes and adds to his codex at pleasure, and even, if he inserts the craziest stuff, the courts say to the working-man: "You were your own master, no one forced you to agree to such a contract if you did not wish to; but now, when you have freely entered into it, you must be bound by it."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
  align: '3:1'
  review: true
  review_reason: 3 de sentence(s) matched to 1 en sentence(s)
- id: VI.69.3
  kind: p
  original: 'Er erläßt Fabrikregulationen, wie er Lust hat; er ändert und macht Zusätze an seinem Kodex, wie es ihm beliebt; und wenn er das tollste Zeug hineinsetzt, so sagen doch die Gerichte dem Arbeiter:'
  en: ''
  joined_to: VI.69.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '399'
- id: VI.70.1
  kind: p
  original: '"Ihr wart ja Euer eigner Herr, Ihr brauchtet ja einen solchen Kontrakt nicht einzugehen, wenn Ihr nicht Lust hattet; jetzt aber, da Ihr unter diesen Kontrakt Euch freiwillig begeben habt, jetzt müßt Ihr ihn auch befolgen."'
  en: ''
  joined_to: VI.69.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '399'
- id: VI.71.1
  kind: p
  original: Und so hat der Arbeiter noch den Spott des Friedensrichters, der selbst ein Bourgeois ist, und des Gesetzes, das von der Bourgeoisie gegeben wurde, in den Kauf.
  en: And so the working-man only gets into the bargain the mockery of the Justice of the Peace who is a bourgeois himself, and of the law which is made by the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: VI.71.2
  kind: p
  original: Solche Entscheidungen sind oft genug gegeben worden.
  en: Such decisions have been given often enough.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: VI.71.3
  kind: p
  original: Im Oktober 1844 stellten die Arbeiter des Fabrikanten Kennedy in Manchester die Arbeit ein.
  en: In October, 1844, the operatives of Kennedy's mill, in Manchester struck.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: VI.71.4
  kind: p
  original: 'Kennedy verklagte sie auf Grund einer in der Fabrik angeschlagenen Vorschrift: daß aus jedem Zimmer nie mehr als zwei Arbeiter auf einmal kündigen dürften!'
  en: Kennedy prosecuted them on the strength of a regulation placarded in the mill, that at no time more than two operatives in one room may quit work at once.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: VI.71.5
  kind: p
  original: Und das Gericht gab ihm recht und den Arbeitern die obige Antwort.
  en: And the court decided in his favour, giving the working-men the explanation cited above.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
  en_note: 'English note {179a}: Manchester Guardian, October 30th.'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.71.6
  kind: p
  original: ("Manchester Guardian", 30. Oktober.)
  en: ''
  joined_to: VI.71.5
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '399'
- id: VI.71.7
  kind: p
  original: Und wie sind diese Regeln gewöhnlich!
  en: And such rules as these usually are!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: VI.71.8
  kind: p
  original: 'Hört: 1. Die Fabriktüre wird 10 Minuten nach dem Anfange der Arbeit geschlossen und niemand bis zum Frühstück hereingelassen.'
  en: 'For instance: 1. The doors are closed ten minutes after work begins, and thereafter no one is admitted until the breakfast hour; whoever is absent during this time forfeits 3d. per loom.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.71.9
  kind: p
  original: Wer während dieser Zeit abwesend ist, verwirkt für jeden Webstuhl 3 d. Strafe.
  en: ''
  joined_to: VI.71.8
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '399'
- id: VI.71.10
  kind: p
  original: 2. Jeder (Maschinenstuhl-)Weber, der während einer andern Zeit, während die Maschine in Bewegung ist, abwesend gefunden wird, verwirkt für jede Stunde und jeden Webstuhl, den er zu beaufsichtigen hat, 3 d. Wer während der Arbeitszeit ohne Erlaubnis des Aufsehers das Zimmer verläßt, wird ebenfalls 3 d. gestraft.
  en: 2. Every power-loom weaver detected absenting himself at another time, while the machinery is in motion, forfeits for each hour and each loom, 3d. Every person who leaves the room during working-hours, without obtaining permission from the overlooker, forfeits 3d.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.71.11
  kind: p
  original: 3. Weber, die keine Schere bei sich haben, verwirken für jeden Tag 1 d. 4. Alle Weberschiffchen, Bürsten, Ölkannen, Räder, Fenster etc., die zerbrochen werden, müssen von dem Weber bezahlt werden.
  en: 3. Weavers who fail to supply themselves with scissors forfeit, per day, 1d. 4. All broken shuttles, brushes, oil-cans, wheels, window panes, etc., must be paid for by the weaver.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.71.12
  kind: p
  original: 5. Kein Weber darf ohne Aufkündigung, die eine Woche vorher geschehen muß, aus dem Dienst treten.
  en: 5. No weaver to stop work without giving a week's notice.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: VI.71.13
  kind: p
  original: Der Fabrikant kann jeden Arbeiter ohne Kündigung für schlechte Arbeit oder unziemliches Betragen entlassen.
  en: The manufacturer may dismiss any employee without notice for bad work or improper behaviour.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: VI.71.14
  kind: p
  original: 6. Jeder Arbeiter, der mit einem andern sprechend, der singend oder pfeifend betroffen wird, entrichtet 6 d. Strafe.
  en: 6. Every operative detected speaking to another, singing or whistling, will be fined 6d.; for leaving his place during working-hours, 6d.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '399'
- id: VI.71.15
  kind: p
  original: Wer während der Arbeit von seinem Platze geht, ebenfalls 6 d. - Mir liegt noch ein anderes Fabrikreglement vor, nach welchem jedem, der drei Minuten zu spät kommt, eine Viertelstunde, und jedem, der zwanzig Minuten zu spät kommt, ein Vierteltag am Lohn abgehalten wird.
  en: Another copy of factory regulations lies before me, according to which every operative who comes three minutes too late, forfeits the wages for a quarter of an hour, and every one who comes twenty minutes too late, for a quarter of a day.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N15
  mew_page: 399-400
- id: VI.71.16
  kind: p
  original: Wer vor dem Frühstück ganz weg bleibt, 1 sh. am Montag und 6 d. an jedem andern Tage etc. etc. Dies letztere ist das Reglement der Phoenix Works, in Jersey Street, Manchester.
  en: Every one who remains absent until breakfast forfeits a shilling on Monday, and sixpence every other day of the week, etc, etc. This last is the regulation of the Phoenix Works in Jersey Street, Manchester.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: VI.71.17
  kind: p
  original: '- Man wird mir sagen, solche Regeln seien notwendig, um in einer großen, geordneten Fabrik das nötige Ineinandergreifen der verschiedenen Manipulationen zu sichern; man wird sagen, eine solche strenge Disziplin sei hier ebenso notwendig wie bei der Armee - gut, es mag sein, aber was ist das für eine soziale Ordnung, die ohne solche schändliche Tyrannei nicht bestehen kann?'
  en: It may be said that such rules are necessary in a great, complicated factory, in order to insure the harmonious working of the different parts; it may be asserted that such a severe discipline is as necessary here as in an army. This may be so, but what sort of a social order is it which cannot be maintained without such shameful tyranny?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.71.18
  kind: p
  original: Entweder heiligt der Zweck das Mittel, oder der Schluß von der Schlechtigkeit des Mittels auf die Schlechtigkeit des Zwecks ist ganz gerechtfertigt.
  en: Either the end sanctifies the means, or the inference of the badness of the end from the badness of the means is justified.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: VI.71.19
  kind: p
  original: Und wer Soldat gewesen ist, weiß, was es heißt, auch nur für kurze Zeit unter militärischer Disziplin zu stehen; diese Arbeiter sind aber dazu verdammt, vom neunten Jahre an bis zu ihrem Tode unter der geistigen und körperlichen Fuchtel zu leben, sie sind ärgere Sklaven als die Schwarzen in Amerika, weil sie schärfer beaufsichtigt werden - und dabei wird noch verlangt, daß sie menschlich leben, menschlich denken und fühlen sollen!
  en: Every one who has served as a soldier knows what it is to be subjected even for a short time to military discipline. But these operatives are condemned from their ninth year to their death to live under the sword, physically and mentally. They are worse slaves than the negroes in America, for they are more sharply watched, and yet it is demanded of them that they shall live like human beings, shall think and feel like men!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VI.71.20
  kind: p
  original: Wahrlich, sie können es wieder nur im glühendsten Haß gegen ihre Unterdrücker und gegen die Ordnung der Dinge, die sie in eine solche Lage versetzt, die sie zu Maschinen herabwürdigt!
  en: Verily, this they can do only under glowing hatred towards their oppressors, and towards that order of things which place them in such a position, which degrades them to machines.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: VI.71.21
  kind: p
  original: Es ist aber noch viel schändlicher, daß es nach der allgemeinen Aussage der Arbeiter eine Menge Fabrikanten gibt, die die den Arbeitern auferlegten Geldstrafen mit der herzlosesten Strenge eintreiben, um aus den den besitzlosen Proletariern geraubten Pfennigen ihren Gewinn zu vergrößern.
  en: But it is far more shameful yet, that according to the universal testimony of the operatives, numbers of manufacturers collect the fines imposed upon the operatives with the most heartless severity, and for the purpose of piling up extra profits out of the farthings thus extorted from the impoverished proletarians.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: VI.71.22
  kind: p
  original: Auch Leach behauptet, daß die Arbeiter oft morgens die Uhr der Fabrik um eine Viertelstunde vorgerückt und infolgedessen bei ihrer Ankunft die Tür verschlossen finden, während der Schreiber mit dem Strafbuch drinnen durch die Zimmer geht und die große Menge der Fehlenden aufschreibt.
  en: Leach asserts, too, that the operatives often find the factory clock moved forward a quarter of an hour and the doors shut, while the clerk moves about with the fines-book inside, noting the many names of the absentees.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: VI.71.23
  kind: p
  original: Leach will selbst einmal 95 solcher ausgeschlossenen Arbeiter gezählt haben vor einer Fabrik, deren Uhr abends eine Viertelstunde hinter und morgens eine Viertelstunde vor den öffentlichen Uhren der Stadt ging.
  en: Leach claims to have counted ninety-five operatives thus shut out, standing before a factory, whose clock was a quarter of an hour slower than the town clocks at night, and a quarter of an hour faster in the morning.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: VI.71.24
  kind: p
  original: Der Fabrikbericht erzählt ähnliche Dinge.
  en: The Factory Report relates similar facts.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '400'
- id: VI.71.25
  kind: p
  original: In einer Fabrik wurde die Uhr während der Arbeitszeit zurückgesetzt, so daß länger gearbeitet wurde als die richtige Zeit und der Arbeiter doch nicht mehr Lohn bekam; in einer andern wurde geradezu eine Viertelstunde länger gearbeitet, in einer dritten war eine gewöhnliche Uhr und eine Maschinenuhr, welche die Anzahl der Umdrehungen des Hauptschafts anzeigte; ging die Maschinerie langsam, so wurde nach der Maschinenuhr gearbeitet, bis die für 12 Stunden berechnete Anzahl Umdrehungen voll war; ging die Arbeit gut, so daß diese Zahl vor der rechten Zeit voll war, so mußten die Arbeiter dennoch bis zum Ende der zwölften Stunde fortarbeiten.
  en: In one factory the clock was set back during working-hours, so that the operatives worked overtime without extra pay; in another, a whole quarter of an hour overtime was worked; in a third, there were two clocks, an ordinary one and a machine clock, which registered the revolutions of the main shaft; if the machinery went slowly, working-hours were measured by the machine clock until the number of revolutions due in twelve hours was reached; if work went well, so that the number was reached before the usual working-hours were ended, the operatives were forced to toil on to the end of the twelfth hour.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 400-401
- id: VI.71.26
  kind: p
  original: Der Zeuge fügt hinzu, er habe einige Mädchen gekannt, die in guter Arbeit waren und Extrastunden arbeiteten, die aber doch lieber sich der Prostitution in die Arme geworfen, als daß sie sich diese Tyrannei hätten gefallen lassen (DrinkW[ater] evid. p. 80).
  en: The witness adds that he had known girls who had good work, and who had worked overtime, who, nevertheless, betook themselves to a life of prostitution rather than submit to this tyranny.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
  en_note: 'English note {181a}: Drinkwater Evidence; p. 80.'
- id: VI.71.27
  kind: p
  original: Leach erzählt, um auf die Geldstrafen zurückzukommen, er habe zu wiederholten Malen gesehen, wie hochschwangere Frauen, die sich einen Augenblick bei ihrer Arbeit gesetzt hatten, um auszuruhen, für dies Vergehen um 6 d. gestraft wurden.
  en: To return to the fines, Leach relates having repeatedly seen women in the last period of pregnancy fined 6d. for the offence of sitting down a moment to rest.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: VI.71.28
  kind: p
  original: Die Strafen wegen schlechter Arbeit werden vollends willkürlich auferlegt; die Ware wird im Lager nachgesehen, und hier schreibt der nachsehende Lagermeister die Strafen auf eine Liste, ohne den Arbeiter auch nur herbeizurufen; dieser erfährt erst, daß er gestraft worden ist, wenn ihm der Aufseher den Lohn ausbezahlt und die Ware vielleicht schon verkauft und jedenfalls auf die Seite gebracht ist.
  en: Fines for bad work are wholly arbitrary; the goods are examined in the wareroom, and the supervisor charges the fines upon a list without even summoning the operative, who only learns that he has been fined when the overlooker pays his wages, and the goods have perhaps been sold, or certainly been placed beyond his reach.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: VI.71.29
  kind: p
  original: Leach besitzt eine solche Strafliste, die zusammengeheftet zehn Fuß lang ist und sich auf Pfd. St. 35-17-10 d. beläuft.
  en: Leach has in his possession such a fines list, ten feet long, and amounting to 35 pounds 17s. 10d.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: VI.71.30
  kind: p
  original: Er erzählt, daß in der Fabrik, wo diese Liste aufgesetzt, ein neuer Lagermeister entlassen worden sei, weil er zu wenig strafe und so dem Fabrikanten fünf Pfund (34 Taler) wöchentlich zu wenig einbringe ("Stubborn Facts", p. 13-17).
  en: He relates that in the factory where this list was made, a new supervisor was dismissed for fining too little, and so bringing in five pounds too little weekly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
  en_note: 'English note {181b}: "Stubborn Facts," pp. 13-17.'
- id: VI.71.31
  kind: p
  original: Und ich wiederhole nochmals, daß ich Leach als einen durchaus zuverlässigen und einer Lüge unfähigen Mann kenne.
  en: And I repeat that I know Leach to be a thoroughly trustworthy man incapable of a falsehood.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: VI.72.1
  kind: p
  original: Aber auch außerdem ist der Arbeiter der Sklave seines Brotherrn.
  en: But the operative is his employer's slave in still other respects.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: VI.72.2
  kind: p
  original: Wenn dem reichen Herrn die Frau oder Tochter des Arbeiters gefällt - so hat er nur zu verfügen, nur zu winken, und sie muß ihm ihre Reize opfern.
  en: If his wife or daughter finds favour in the eyes of the master, a command, a hint suffices, and she must place herself at his disposal.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: VI.72.3
  kind: p
  original: Wenn der Fabrikant eine Petition zum Schutz der Bourgeoisie-Interessen mit Unterschriften zu bedecken wünscht - er braucht sie nur in seine Fabrik zu schicken.
  en: When the employer wishes to supply with signatures a petition in favour of bourgeois interests, he need only send it to his mill.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: VI.72.4
  kind: p
  original: Will er eine Parlamentswahl durchsetzen - er schickt seine stimmfähigen Arbeiter in Reih und Glied an die Stimmbuden, und sie müssen wohl für den Bourgeois stimmen, sie mögen wollen oder nicht.
  en: If he wishes to decide a Parliamentary election, he sends his enfranchised operatives in rank and file to the polls, and they vote for the bourgeois candidate whether they will or no.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: VI.72.5
  kind: p
  original: Will er in einer öffentlichen Versammlung eine Majorität haben - er entläßt sie eine halbe Stunde früher als gewöhnlich und besorgt ihnen Plätze dicht an der Tribüne, wo er sie gehörig überwachen kann.
  en: If he desires a majority in a public meeting, he dismisses them half-an-hour earlier than usual, and secures them places close to the platform, where he can watch them to his satisfaction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: VI.73.1
  kind: p
  original: Dazu kommen aber noch zwei Einrichtungen, die ganz besonders dazu beitragen, den Arbeiter in die Botmäßigkeit des Fabrikanten zu zwingen - das Trucksystem und das Cottagesystem.
  en: Two further arrangements contribute especially to force the operative under the dominion of the manufacturer; the Truck system and the Cottage system.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: VI.73.2
  kind: p
  original: Truck heißt bei den Arbeitern das Bezahlen des Lohns in Waren, und dieser Zahlmodus war früher ganz allgemein in England.
  en: The truck system, the payment of the operatives in goods, was formerly universal in England.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '401'
- id: VI.73.3
  kind: p
  original: Der Fabrikant errichtete, "zur Bequemlichkeit der Arbeiter und um sie vor den hohen Preisen der Krämer zu schützen", einen Laden, in dem für seine Rechnung Waren aller Art verkauft wurden; und damit der Arbeiter nicht etwa in andere Läden gehe, wo er die Waren billiger haben konnte - die Truckwaren des "Tommy-Shop" pflegten 25 bis 30 Prozent teurer zu sein als anderswo -, gab man ihm auch wohl eine Anweisung auf den Laden für den Betrag seines Lohns anstatt des Geldes.
  en: The manufacturer opens a shop, "for the convenience of the operatives, and to protect them from the high prices of the petty dealers." Here goods of all sorts are sold to them on credit; and to keep the operatives from going to the shops where they could get their goods more cheaply--the "Tommy shops" usually charging twenty-five to thirty per cent. more than others--wages are paid in requisitions on the shop instead of money.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 401-402
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.73.4
  kind: p
  original: Der allgemeine Unwille über dies infame System veranlaßte 1831 den Truck-Akt, wodurch die Bezahlung in Waren für die meisten Arbeiter für ungültig und ungesetzlich erklärt und mit Strafen belegt wurde; indes hat dies Gesetz, wie die meisten englischen Gesetze, nur hier und da faktische Kraft erhalten.
  en: The general indignation against this infamous system led to the passage of the Truck Act in 1831, by which, for most employees, payment in truck orders was declared void and illegal, and was made punishable by fine; but, like most other English laws, this has been enforced only here and there.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T14
    editions: '1845'
    reading: 'irrtümlich: Lohn'
    base_text: … die Bezahlung in Waren ‸ für die meisten Arbeiter …
  mew_page: '402'
- id: VI.73.5
  kind: p
  original: In den Städten freilich ist es ziemlich genau durchgeführt, auf dem Lande aber ist das direkte und indirekte Trucksystem noch in voller Blüte.
  en: In the towns it is carried out comparatively efficiently; but in the country, the truck system, disguised or undisguised, flourishes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: VI.73.6
  kind: p
  original: Auch in der Stadt Leicester kommt es sehr häufig vor.
  en: In the town of Leicester, too, it is very common.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: VI.73.7
  kind: p
  original: Mir liegen ungefähr ein Dutzend Fälle von Verurteilungen wegen dieses Vergehens vor, die von November 1843 bis Juni 1844 vorkamen und teils im "Manchester Guardian", teils im "Northern Star" berichtet werden.
  en: There lie before me nearly a dozen convictions for this offence, dating from the period between November, 1843, and June, 1844, and reported, in part, in the Manchester Guardian and, in part, in the Northern Star.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: VI.73.8
  kind: p
  original: Natürlich wird dies System jetzt nicht mehr so offen getrieben; der Arbeiter bekommt sein Geld meistens ausbezahlt, aber der Fabrikant hat Mittel genug, ihn zu zwingen, daß er seine Waren in dem Truckladen und nirgends anderswo kauft.
  en: The system is, of course, less openly carried on at present; wages are usually paid in cash, but the employer still has means enough at command to force him to purchase his wares in the truck shop and nowhere else.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: VI.73.9
  kind: p
  original: Daher ist den Truckfabrikanten selten beizukommen, denn jetzt können sie ihr Unwesen unter dem Schutze des Gesetzes treiben, sobald sie nur dem Arbeiter das Geld wirklich in die Hände geben.
  en: Hence it is difficult to combat the truck system, because it can now be carried on under cover of the law, provided only that the operative receives his wages in money.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: VI.73.10
  kind: p
  original: 'Der "Northern Star" vom 27. April 1844 gibt einen Brief eines Arbeiters in Holmfirth bei Huddersfield in Yorkshire, dessen Orthographie ich wiedergeben will, soviel es möglich ist, und der sich auf einen Fabrikanten Bowers bezieht:'
  en: 'The Northern Star of April 27th, 1843, publishes a letter from an operative of Holmfirth, near Huddersfield, in Yorkshire, which refers to a manufacturer of the name of Bowers, as follows (retranslated from the German):'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '402'
- id: VI.74.1
  kind: p
  original: '"Es ist vast Befremdent Zu dencken, Daß Daß verflugte Truk Sistim Besteehn Solde in Solger ausDenung Alz Eß tbut zu Holmfirth Und niemannt gevunden Werden Der Die Kurrase Had Den Vabrickanden 1 stok Dafor zu Steken. hier Leyden 1 groose mengge erliger hand Weeber Durg Dißem Vervlugden Siststem Hier ist 1 probe auß fielen Der EdelMütigen Vrey Handelsklike Ist 1 vabrickand Welger had Auff im Den flug Der Gansen geegendt Wegen Seine Abscheulige bedragen gegen Seinen Armen weebern wen Sie ein stük Vertig Haben so 34 oder 36 Schiling Magt Gipd er Sie 20 Shi.'
  en: '"It is very strange to think that the accursed truck system should exist to such an extent as it does in Holmfirth, and nobody be found who has the pluck to make the manufacturer stop it. There are here a great many honest hand-weavers suffering through this damned system; here is one sample from a good many out of the noble-hearted Free Trade Clique. There is a manufacturer who has upon himself the curses of the whole district on account of his infamous conduct towards his poor weavers; if they have got a piece ready which comes to 34 or 36 shillings, he gives them 20s. in money and the rest in cloth or goods, and 40 to 50 per cent. dearer than at the other shops, and often enough the goods are rotten into the bargain.'
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N16
  mew_page: '402'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VI.74.2
  kind: p
  original: In gelt Und Das übrige in Tug Oder leyder Zeug Und 40 oder 50 pro Zend teuerer Alz bey Den andern Verkeuffern Und wie offt Sein Die waren oben Darein nog vaul. aber Wie sagd Der Frey Handels Merkur Sie sein Nigt fervligtet Sie an zu Nehmen Es Stet ganz in Irem beliben 0 Ja aber Sie Müsen Sie Endweder an Nemen oder ferHungeren.
  en: But, what says the Free Trade Mercury, the Leeds Mercury? They are not bound to take them; they can please themselves. Oh, yes, but they must take them or else starve. If they ask for another 20s. in money, they must wait eight or fourteen days for a warp; but if they take the 20s. and the goods, then there is always a warp ready for them.
  modern: ''
  modern_status: empty
