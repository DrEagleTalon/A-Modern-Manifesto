verses:
- id: VI.0.1
  kind: heading
  original: Die einzelnen Arbeitszweige
  en: SINGLE BRANCHES OF INDUSTRY.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.1.1
  kind: heading
  original: Die Fabrikarbeiter im engeren Sinne
  en: FACTORY HANDS.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.2.1
  kind: p
  original: Wenn wir jetzt auf die einzelnen wichtigeren Zweige des englischen Industrieproletariats näher eingehen sollen, so werden wir, dem oben (S. 253) aufgestellten Prinzip zufolge, mit den Fabrikarbeitern, d.h. denen, die unter dem Fabrikakt stehen, anzufangen haben.
  en: In dealing now with the more important branches of the English manufacturing proletariat, we shall begin, according to the principle already laid down, with the factory-workers, i.e., those who are comprised under the Factory Act.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: VI.2.2
  kind: p
  original: Dies Gesetz reguliert die Arbeitszeit der Fabriken, in denen Wolle, Seide, Baumwolle und Flachs mit Hülfe von Wasser- oder Dampfkraft gesponnen oder gewoben wird, und erstreckt sich deshalb auf die bedeutendsten Zweige der englischen Industrie.
  en: This law regulates the length of the working-day in mills in which wool, silk, cotton, and flax are spun or woven by means of water or steam-power, and embraces, therefore, the more important branches of English manufacture.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: VI.2.3
  kind: p
  original: Die von ihnen lebende Klasse ist die zahlreichste, älteste, intelligenteste und energischste, daher aber auch die unruhigste und der Bourgeoisie am meisten verhaßte von allen englischen Arbeitern; sie steht, und speziell die Baumwollfabrikarbeiter stehen an der Spitze der Arbeiterbewegung, wie ihre Brotherren, die Fabrikanten, namentlich von Lancashire, an der Spitze der Bourgeoisie-Agitation.
  en: The class employed by them is the most intelligent and energetic of all the English workers, and, therefore, the most restless and most hated by the bourgeoisie. It stands as a whole, and the cotton-workers pre-eminently stand, at the head of the labour movement, as their masters the manufacturers, especially those of Lancashire, take the lead of the bourgeois agitation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.3.1
  kind: p
  original: Wir sahen schon in der Einleitung, wie die in den genannten Artikeln arbeitende Bevölkerung auch zuerst durch neue Maschinen aus ihren bisherigen Verhältnissen gerissen wurde.
  en: We have already seen in the introduction how the population employed in working up the textile materials were first torn from their former way of life.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: VI.3.2
  kind: p
  original: Es darf uns daher nicht wundern, wenn der Fortschritt der mechanischen Erfindung auch in späteren Jahren gerade sie am meisten und anhaltendsten berührte.
  en: It is, therefore, not surprising that the progress of mechanical invention in later years also affected precisely these workers most deeply and permanently.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: VI.3.3
  kind: p
  original: Die Geschichte der Baumwollenfabrikation, wie wir sie bei Ure, Baines u.a. lesen, weiß auf jeder Seite von neuen Verbesserungen zu erzählen, und in den übrigen der genannten Industriezweige sind die meisten derselben ebenfalls eingebürgert worden.
  en: The history of cotton manufacture as related by Ure, Baines, and others is the story of improvements in every direction, most of which have become domesticated in the other branches of industry as well.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N1
  - VI.N2
  mew_page: '360'
- id: VI.3.4
  kind: p
  original: Fast überall ist die Handarbeit durch Maschinenarbeit ersetzt, fast alle Manipulationen werden durch die Kraft des Wassers oder Dampfs getan, und noch jedes Jahr bringt neue Verbesserungen.
  en: Hand-work is superseded by machine-work almost universally, nearly all manipulations are conducted by the aid of steam or water, and every year is bringing further improvements.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '360'
- id: VI.4.1
  kind: p
  original: In einem geordneten sozialen Zustande wären solche Verbesserungen nur erfreulich; im Zustande des Kriegs Aller gegen Alle reißen einzelne den Vorteil an sich und bringen dadurch die meisten um die Mittel der Existenz.
  en: In a well-ordered state of society, such improvements could only be a source of rejoicing; in a war of all against all, individuals seize the benefit for themselves, and so deprive the majority of the means of subsistence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: VI.4.2
  kind: p
  original: Jede Verbesserung der Maschinerie wirft Arbeiter außer Brot, und je bedeutender die Verbesserung, desto zahlreicher die arbeitslos gewordene Klasse; jede bringt demnach auf eine Anzahl Arbeiter die Wirkung einer Handelskrisis hervor, erzeugt Not, Elend und Verbrechen.
  en: Every improvement in machinery throws workers out of employment, and the greater the advance, the more numerous the unemployed; each great improvement produces, therefore, upon a number of workers the effect of a commercial crisis, creates want, wretchedness, and crime.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: VI.4.3
  kind: p
  original: Nehmen wir einige Beispiele.
  en: Take a few examples.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: VI.4.4
  kind: p
  original: Da gleich die erste Erfindung, die Jenny (siehe oben), von einem Arbeiter getrieben, wenigstens das Sechsfache von dem lieferte, was das Spinnrad in gleicher Zeit machen konnte, so wurden durch jede neue Jenny fünf Spinner brotlos.
  en: The very first invention, the jenny, worked by one man, produced at least sixfold what the spinning-wheel had yielded in the same time; thus every new jenny threw five spinners out of employment.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: VI.4.5
  kind: p
  original: Die Throstle, die wiederum bedeutend mehr lieferte, als die Jenny und ebenfalls nur einen Arbeiter brauchte, machte noch mehr brotlos.
  en: The throstle, which, in turn, produced much more than the jenny, and like it, was worked by one man, threw still more people out of employment.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: VI.4.6
  kind: p
  original: Die Mule, die wieder weniger Arbeiter im Verhältnis zum Produkt hatte, hatte dieselbe Wirkung, und jede Verbesserung der Mule, d.h. jede Vermehrung der Spindelzahl an der Mule, verminderte wiederum die Zahl der benötigten Arbeiter.
  en: The mule, which required yet fewer hands in proportion to the product, had the same effect, and every improvement in the mule, every multiplication of its spindles, diminished still further the number of workers employed.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T1
    editions: '1892'
    reading: machte
    base_text: … Verhältnis zum Produkt hatte ‸ , hatte dieselbe Wirkung, …
  mew_page: '361'
- id: VI.4.7
  kind: p
  original: Diese Vermehrung der Spindelzahl an der Mule ist aber so bedeutend, daß dadurch ganze Scharen von Arbeitern brotlos geworden sind; denn wenn früher ein "Spinner" mit ein paar Kindern (piecers) 600 Spindeln in Bewegung setzte, so konnte er nun 1 400 bis 2 000 Spindeln auf zwei Mules beaufsichtigen - zwei erwachsene Spinner und ein Teil der von ihnen beschäftigten Piecer wurden dadurch brotlos.
  en: But this increase of the number of spindles in the mule is so great that whole armies of workers have been thrown out of employment by it. For, whereas one spinner, with a couple of children for piecers, formerly set six hundred spindles in motion, he could now manage fourteen hundred to two thousand spindles upon two mules, so that two adult spinners and a part of the piecers whom they employed were thrown out.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.4.8
  kind: p
  original: Und seitdem bei einem sehr bedeutenden Teile der Mulespinnereien die self-actors eingeführt sind, fällt die Rolle des Spinners ganz weg und wird von der Maschine getan.
  en: And since self-acting mules have been introduced into a very large number of spinning-mills, the spinners' work is wholly performed by the machine.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: VI.4.9
  kind: p
  original: Mir liegt ein Buch vor, das von dem anerkannten Führer der Chartisten in Manchester, James Leach, herrührt.
  en: There lies before me a book from the pen of James Leach, one of the recognised leaders of the Chartists in Manchester.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N3
  mew_page: '361'
- id: VI.4.10
  kind: p
  original: Der Mann hat in verschiedenen Industriezweigen, in Fabriken und Kohlenbergwerken jahrelang gearbeitet und ist mir persönlich als brav, zuverlässig und tüchtig bekannt.
  en: The author has worked for years in various branches of industry, in mills and coal mines, and is known to me personally as an honest, trustworthy, and capable man.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: VI.4.11
  kind: p
  original: Ihm standen, seiner Parteistellung zufolge, die ausgedehntesten Details über die verschiedenen Fabriken, die von den Arbeitern selbst gesammelt wurden, zu Gebote, und er gibt nun Tabellen, aus denen hervorgeht, daß 1829 in 35 Fabriken 1 083 Mulespinner mehr angestellt waren als 1841, obwohl die Anzahl der Spindeln in diesen 35 Fabriken sich um 99 429 vermehrt hat.
  en: In consequence of his political position, he had at command extensive detailed information as to the different factories, collected by the workers themselves, and he publishes tables from which it is clear that in 1841, in 35 factories, 1,060 fewer mule spinners were employed than in 1829, though the number of spindles in these 35 factories had increased by 99,239.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '361'
- id: VI.4.12
  kind: p
  original: Er führt 5 Fabriken auf, in denen gar keine Spinner mehr sind, da diese Fabriken nur self-actors besitzen.
  en: He cites five factories in which no spinners whatever are employed, self-actors only being used.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 361-362
- id: VI.4.13
  kind: p
  original: Während die Zahl der Spindeln sich um 10 Prozent vermehrte, nahm die der Spinner um mehr als 60 Prozent ab.
  en: While the number of spindles increased by 10 per cent., the number of spinners diminished more than 60 per cent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: VI.4.14
  kind: p
  original: Und, fügt Leach hinzu, seit 1841 sind soviele Verbesserungen durch Verdopplung der Spindelreihen (double decking) und sonst eingeführt worden, daß in einigen der genannten Fabriken seit 1841 wieder die Hälfte der Spinner entlassen worden sind; in einer Fabrik allein, wo vor kurzem 80 Spinner waren, sind noch 20, die übrigen sind weggeschickt oder müssen Kinderarbeit für Kinderlohn tun.
  en: And Leach adds that since 1841, so many improvements have been introduced by double-decking and other means, that in some of the factories named, half the operatives have been discharged. In one factory alone, where eighty spinners were employed a short time ago, there are now but twenty left; the others having been discharged or set at children's work for children's wages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.4.15
  kind: p
  original: Gleiches berichtet Leach aus Stockport, wo 1835 800 Spinner und 1843 nur 140 Spinner beschäftigt gewesen seien, obwohl die Industrie Stockports in den letzten 8 bis 9 Jahren bedeutend zugenommen hat.
  en: Of Stockport Leach tells a similar story, that in 1835, 800 spinners were employed, and in 1840 but 140, though the manufacture of Stockport has greatly increased during the last eight or nine years.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: VI.4.16
  kind: p
  original: In der Kardiermaschinerie sind jetzt ähnliche Verbesserungen gemacht, wodurch die Hälfte der Arbeiter brotlos wird.
  en: Similar improvements have now been made in carding frames, by which one-half the operatives have been thrown out of employment.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: VI.4.17
  kind: p
  original: In einer Fabrik sind verbesserte Doublierstühle aufgesetzt, die von acht Mädchen vier brotlos machten - außerdem setzte der Fabrikant den Lohn der übrigen vier von 8 auf 7 sh. herab.
  en: In one factory improved frames have been set up, which have thrown four hands out of eight out of work, besides which the employer reduced the wages of the four retained from eight shillings to seven.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: VI.4.18
  kind: p
  original: Ähnlich ist es mit der Weberei gegangen.
  en: The same process has gone on in the weaving industry; the power-loom has taken possession of one branch of hand-weaving after another, and since it produces much more than the hand-loom, while one weaver can work two looms, it has superseded a multitude of working-people.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.4.19
  kind: p
  original: Der mechanische Webstuhl hat einen Zweig der Handweberei nach dem andern in Beschlag genommen, und da er viel mehr produziert als der Handwebstuhl und ein Arbeiter zwei mechanische Stühle beaufsichtigen kann, so sind eine Menge Arbeiter auch hier brotlos geworden.
  en: ''
  joined_to: VI.4.18
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '362'
- id: VI.4.20
  kind: p
  original: Und in allen Arten der Fabrikation, in der Flachs- und Wollenspinnerei, beim Tramieren der Seide ist es ebenso; selbst der mechanische Webstuhl fängt an, einzelne Zweige der Wollen- und Leinenweberei an sich zu reißen; in Rochdale allein sind mehr mechanische als Handwebstühle bei der Flanell- und sonstigen Wollenweberei beschäftigt.
  en: And in all sorts of manufacture, in flax and wool-spinning, in silk-twisting, the case is the same. The power-loom, too, is beginning to appropriate one branch after another of wool and linen-weaving; in Rochdale alone, there are more power than hand-looms in flannel and other wool-weaving branches.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.4.21
  kind: p
  original: Die Bourgeoisie pflegt hierauf zu antworten, daß Verbesserungen in den Maschinen, indem sie die Produktionskosten verringerten, die fertige Ware zu einem niedrigeren Preise liefern und daß durch diesen niedrigeren Preis eine solche Vermehrung der Konsumtion entsteht, daß die brotlos gewordenen Arbeiter bald wieder an den neuerstehenden Fabriken Beschäftigung vollauf fänden.
  en: The bourgeoisie usually replies to this, that improvements in machinery, by decreasing the cost of production, supply finished goods at lower prices, and that these reduced prices cause such an increase in consumption that the unemployed operatives soon find full employment in newly-founded factories.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
  en_note: 'English note {136}: Compare Factories'' Inquiry Commission''s Report.'
- id: VI.4.22
  kind: p
  original: Gewiß, die Bourgeoisie hat ganz recht darin, daß unter gewissen, für die allgemeine industrielle Entwicklung vorteilhaften Verhältnissen jede Preiserniedrigung einer solchen Ware, bei der das rohe Material wenig kostet, die Konsumtion sehr steigert und neue Fabriken hervorruft; aber sonst ist jedes Wort ihrer Behauptung eine Lüge.
  en: The bourgeoisie is so far correct that under certain conditions favourable for the general development of manufacture, every reduction in price of goods in which the raw material is cheap, greatly increases consumption, and gives rise to the building of new factories; but every further word of the assertion is a lie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '362'
- id: VI.4.23
  kind: p
  original: Sie schlägt es für nichts an, daß es jahrelang dauert, bis diese Folgen der Preiserniedrigung eingetreten, bis die neuen Fabriken gebaut sind; sie verschweigt uns, daß alle Verbesserungen der Maschinen die eigentliche, anstrengende Arbeit mehr und mehr auf die Maschine werfen und so die Arbeit erwachsener Männer in eine bloße Aufsicht verwandeln, die ein schwaches Weib oder gar ein Kind ebensogut tun kann und auch für halben oder Drittellohn tut; daß also die erwachsenen Männer immer mehr aus der Industrie verdrängt und durch die vermehrte Fabrikation nicht wieder beschäftigt werden; sie verschweigt uns, daß ganze Arbeitszweige dadurch wegfallen oder so verändert werden, daß sie neu gelernt werden müssen, und hütet sich wohl, hier das zu gestehen, worauf sie sonst pocht, wenn die Arbeit kleiner Kinder verboten werden soll - nämlich daß Fabrikarbeit in der frühesten Jugend und vor dem zehnten Jahre gelernt werden müsse, um sie ordentlich zu lernen (vgl. z.B. Factories Inq. Comm. Rept. an verschiedenen Stellen); sie sagt nicht dabei, daß der Prozeß der Maschinenverbesserung fortwährend vor sich geht und dem Arbeiter, sobald er sich, wenn es einmal wirklich der Fall wäre, in einem neuen Arbeitszweige eingebürgert hat, ihm auch dieser wieder genommen und dadurch der letzte Rest von Sicherheit der Lebensstellung entrissen wird, den er noch hatte.
  en: The bourgeoisie ignores the fact that it takes years for these results of the decrease in price to follow and for new factories to be built; it is silent upon the point that every improvement in machinery throws the real work, the expenditure of force, more and more upon the machine, and so transforms the work of full-grown men into mere supervision, which a feeble woman or even a child can do quite as well, and does for half or two-thirds wages; that, therefore, grown men are constantly more and more supplanted and not re-employed by the increase in manufacture; it conceals the fact that whole branches of industry fall away, or are so changed that they must be learned afresh; and it takes good care not to confess what it usually harps upon, whenever the question of forbidding the work of children is broached, that factory-work must be learned in earliest youth in order to be learned properly. It does not mention the fact that the process of improvement goes steadily on, and that as soon as the operative has succeeded in making himself at home in a new branch, if he actually does succeed in so doing, this, too, is taken from him, and with it the last remnant of security which remained to him for winning his bread.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 362-363
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.4.24
  kind: p
  original: Aber die Bourgeoisie zieht den Vorteil von der Verbesserung der Maschinerie, sie hat während der ersten Jahre, wo noch viele alte Maschinen arbeiten und die Verbesserung noch nicht allgemein durchgeführt ist, die schönste Gelegenheit zum Geldanhäufen, und es wäre zuviel verlangt, wenn sie auch für die Nachteile der verbesserten Maschinen Augen haben sollte.
  en: But the bourgeoisie gets the benefit of the improvements in machinery; it has a capital opportunity for piling up money during the first years while many old machines are still in use, and the improvement not yet universally introduced; and it would be too much to ask that it should have an open eye for the disadvantages inseparable from these improvements.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
- id: VI.5.1
  kind: p
  original: Daß die verbesserten Maschinen den Lohn herabdrücken, ist ebenfalls von der Bourgeoisie heftig bestritten worden, während die Arbeiter es fort und fort behauptet haben.
  en: The fact that improved machinery reduces wages has also been as violently disputed by the bourgeoisie, as it is constantly reiterated by the working-men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
- id: VI.5.2
  kind: p
  original: Die Bourgeoisie besteht darauf, daß, obwohl mit der erleichterten Produktion der Stücklohn gefallen, dennoch der Wochenlohn im ganzen eher gestiegen als gefallen sei und die Lage der Arbeiter sich eher verbessert als verschlimmert habe.
  en: The bourgeoisie insists that although the price of piece-work has been reduced, yet the total of wages for the week's work has rather risen than fallen, and the condition of the operatives rather improved than deteriorated.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
- id: VI.5.3
  kind: p
  original: Es ist schwer, der Sache auf den Grund zu kommen, da die Arbeiter sich meist auf den Fall des Stücklohns berufen; indessen ist so viel gewiß, daß auch der Wochenlohn in verschiedenen Arbeitszweigen durch die Maschinerie niedriger gestellt worden ist.
  en: It is hard to get to the bottom of the matter, for the operatives usually dwell upon the price of piece-work. But it is certain that the weekly wage, also, has, in many branches of work, been reduced by the improvement of machinery.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.5.4
  kind: p
  original: Die sogenannten Feinspinner (die feines Mule-Garn spinnen) beziehen allerdings hohen Lohn, 30 bis 40 sh. wöchentlich, weil sie eine starke Assoziation zur Aufrechterhaltung des Spinngeldes haben und ihre Arbeit mühsam erlernt werden muß; die Grobspinner aber, welche gegen die für feines Garn nicht anwendbaren selbsttätigen Maschinen (self-actors) zu konkurrieren haben und deren Assoziation durch die Einführung dieser Maschinen entkräftet wurde, haben dagegen sehr niedrigen Lohn.
  en: The so-called fine spinners (who spin fine mule yarn), for instance, do receive high wages, thirty to forty shillings a week, because they have a powerful association for keeping wages up, and their craft requires long training; but the coarse spinners who have to compete against self-actors (which are not as yet adapted for fine spinning), and whose association was broken down by the introduction of these machines, receive very low wages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
- id: VI.5.5
  kind: p
  original: Mir sagte ein Mulespinner, daß er nicht über 14 sh. wöchentlich verdiene, und damit stimmen die Aussagen von Leach, daß in verschiedenen Fabriken die Grobspinner unter 16 1/2 sh. wöchentlich verdienen und daß ein Spinner, der vor drei Jahren 30 sh. verdiente, jetzt kaum 12 1/2 sh. aufbringen könne und im letzten Jahre auch durchschnittlich nicht mehr verdient habe.
  en: A mule spinner told me that he does not earn more than fourteen shillings a week, and his statement agrees with that of Leach, that in various factories the coarse spinners earn less than sixteen shillings and sixpence a week, and that a spinner, who years ago earned thirty shillings, can now hardly scrape up twelve and a half, and had not earned more on an average in the past year.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '363'
- id: VI.5.6
  kind: p
  original: Der Lohn für Weiber und Kinder mag allerdings weniger gefallen sein, aber auch nur deshalb, weil er von Anfang an nicht hoch gestellt war.
  en: The wages of women and children may perhaps have fallen less, but only because they were not high from the beginning.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 363-364
- id: VI.5.7
  kind: p
  original: Ich kenne mehrere Frauen, die Witwen sind und Kinder haben, und mühsam genug 8 bis 9 sh. wöchentlich verdienen, und daß sie mit Familie davon nicht ordentlich leben können, wird mir jeder zugehen, der die Preise der nötigsten Lebensbedürfnisse in England kennt.
  en: I know several women, widows with children, who have trouble enough to earn eight to nine shillings a week; and that they and their families cannot live decently upon that sum, every one must admit who knows the price of the barest necessaries of life in England.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: VI.5.8
  kind: p
  original: Daß aber der Lohn überhaupt durch die verbesserte Maschinerie gedrückt worden sei, ist die einstimmige Aussage aller Arbeiter; daß die Behauptung der fabrizierenden Bourgeoisie, als habe sich die Lage der arbeitenden Klassen durch die Maschinenfabrikation verbessert, von dieser Klasse selbst aufs lauteste Lügen gestraft wird, kann man in jeder Arbeiterversammlung in den Fabrikdistrikten hören.
  en: That wages in general have been reduced by the improvement of machinery is the unanimous testimony of the operatives. The bourgeois assertion that the condition of the working-class has been improved by machinery is most vigorously proclaimed a falsehood in every meeting of working-men in the factory districts.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.5.9
  kind: p
  original: Und selbst wenn es wahr wäre, daß nur der relative Lohn, der Stücklohn gefallen und der absolute, die Summe des wöchentlich zu Erwerbenden stehengeblieben sei, was folgt daraus?
  en: And even if it were true that the relative wage, the price of piece-work only, has fallen, while the absolute wage, the sum to be earned in the week, remained unchanged, what would follow?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: VI.5.10
  kind: p
  original: Daß die Arbeiter es haben ruhig mit ansehen müssen, wie die Herren Fabrikanten ihre Beutel füllten und von jeder Verbesserung Nutzen zogen, ohne ihnen auch nur den kleinsten Teil davon abzugeben.
  en: That the operatives have had quietly to look on while the manufacturers filled their purses from every improvement without giving the hands the smallest share in the gain.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: VI.5.11
  kind: p
  original: Die Bourgeoisie vergißt, wenn sie gegen die Arbeiter kämpft, auch die gewöhnlichsten Prinzipien ihrer eignen Nationalökonomie.
  en: The bourgeois forgets, in fighting the working-man, the most ordinary principles of his own Political Economy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: VI.5.12
  kind: p
  original: 'Sie, die sonst auf Malthus schwört, wirft in ihrer Angst den Arbeitern ein: Woher hätten ohne Maschinerie die vielen Millionen, um die sich Englands Volkszahl vermehrt hat, Arbeit finden wollen?'
  en: 'He who at other times swears by Malthus, cries out in his anxiety before the workers: "Where could the millions by which the population of England has increased find work, without the improvements in machinery?"'
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N4
  mew_page: '364'
- id: VI.5.13
  kind: p
  original: Dummheit, als ob die Bourgeoisie nicht selbst gut genug wüßte, daß ohne die Maschinen und den durch diese hervorgebrachten Industrieaufschwung diese "Millionen" gar nicht erzeugt und herangewachsen wären!
  en: As though the bourgeois did not know well enough that without machinery and the expansion of industry which it produced, these "millions" would never have been brought into the world and grown up!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: VI.5.14
  kind: p
  original: Was die Maschinerie den Arbeitern genützt hat, ist einfach das, daß sie ihnen die Notwendigkeit einer sozialen Reform, durch die die Maschinen nicht mehr gegen, sondern für die Arbeiter arbeiten, beigebracht hat.
  en: 'The service which machinery has rendered the workers is simply this: that it has brought home to their minds the necessity of a social reform by means of which machinery shall no longer work against but for them.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: VI.5.15
  kind: p
  original: 'Die weisen Herren Bourgeois mögen einmal die Leute fragen, die in Manchester und anderswo Straßen kehren (das ist freilich jetzt vorbei, da auch hierfür Maschinen erfunden und eingeführt sind) oder Salz, Zündhölzchen, Apfelsinen und Schnürriemen auf den Straßen verkaufen oder betteln gehen müssen, was sie früher gewesen seien - und bei wie vielen wird die Antwort sein: durch Maschinerie brotlos gewordener Fabrikarbeiter.'
  en: 'Let the wise bourgeois ask the people who sweep the streets in Manchester and elsewhere (though even this is past now, since machines for the purpose have been invented and introduced), or sell salt, matches, oranges, and shoe-strings on the streets, or even beg, what they were formerly, and he will see how many will answer: "Mill-hands thrown out of work by machinery."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
- id: VI.5.16
  kind: p
  original: Die Folgen der Maschinenverbesserungen für den Arbeiter sind in den jetzigen sozialen Verhältnissen nur ungünstig und oft im äußersten Grade drückend; jede neue Maschine bringt Brotlosigkeit, Elend und Not hervor - und in einem Lande wie England, wo ohnehin fast immer "überzählige Bevölkerung", ist die Entlassung aus der Arbeit in den meisten Fällen das schlimmste, was den Arbeiter betreffen kann.
  en: The consequences of improvement in machinery under our present social conditions are, for the working-man, solely injurious, and often in the highest degree oppressive. Every new advance brings with it loss of employment, want, and suffering, and in a country like England where, without that, there is usually a "surplus population," to be discharged from work is the worst that can befall the operative.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '364'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.5.17
  kind: p
  original: Und auch abgesehen davon, welch einen erschlaffenden, entnervenden Einfluß muß diese Ungewißheit der Lebensstellung, die aus dem unaufhörlichen Fortschritt der Maschinerie und mit ihr der Brotlosigkeit hervorgeht, auf die ohnehin schon schwankend gestellten Arbeiter ausüben!
  en: And what a dispiriting, unnerving influence this uncertainty of his position in life, consequent upon the unceasing progress of machinery, must exercise upon the worker, whose lot is precarious enough without it!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 364-365
- id: VI.5.18
  kind: p
  original: 'Um der Verzweiflung zu entgehen, stehen auch hier dem Arbeiter nur zwei Wege offen: die innere und äußere Empörung gegen die Bourgeoisie - oder der Trunk, die Liederlichkeit überhaupt.'
  en: To escape despair, there are but two ways open to him; either inward and outward revolt against the bourgeoisie or drunkenness and general demoralisation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: VI.5.19
  kind: p
  original: Und zu beiden pflegen die englischen Arbeiter ihre Zuflucht zu nehmen.
  en: And the English operatives are accustomed to take refuge in both.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: VI.5.20
  kind: p
  original: Die Geschichte des englischen Proletariats erzählt von Hunderten von Erneuten gegen die Maschinen und die Bourgeoisie überhaupt, und von der Liederlichkeit haben wir schon gesprochen.
  en: The history of the English proletariat relates hundreds of uprisings against machinery and the bourgeoisie; we have already spoken of the moral dissolution which, in itself, is only another form of despair.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.5.21
  kind: p
  original: Diese ist selbst freilich nur eine andere Art der Verzweiflung.
  en: ''
  joined_to: VI.5.20
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '365'
- id: VI.6.1
  kind: p
  original: Am gedrücktesten leben diejenigen Arbeiter, die gegen eine sich bahnbrechende Maschine zu konkurrieren haben.
  en: The worst situation is that of those workers who have to compete against a machine that is making its way.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: VI.6.2
  kind: p
  original: Der Preis des von ihnen fabrizierten Artikels richtet sich nach dem des gleichen Maschinenfabrikats, und da die Maschine billiger arbeitet, so hat der mit ihr konkurrierende Arbeiter den schlechtesten Lohn.
  en: The price of the goods which they produce adapts itself to the price of the kindred product of the machine, and as the latter works more cheaply, its human competitor has but the lowest wages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: VI.6.3
  kind: p
  original: Dies Verhältnis tritt ein bei jedem Arbeiter, der an einer alten, mit späteren, verbesserten Maschinen konkurrierenden Maschine arbeitet.
  en: The same thing happens to every operative employed upon an old machine in competition with later improvements.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: VI.6.4
  kind: p
  original: Natürlich, wer anders sollte den Schaden tragen?
  en: And who else is there to bear the hardship?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: VI.6.5
  kind: p
  original: Der Fabrikant will seine Maschine nicht fortwerfen, er will auch den Schaden nicht tragen; an die tote Maschine hat er keinen Rekurs, also hält er sich an den lebenden Arbeiter, den allgemeinen Sündenbock der Gesellschaft.
  en: The manufacturer will not throw out his old apparatus, nor will he sustain the loss upon it; out of the dead mechanism he can make nothing, so he fastens upon the living worker, the universal scapegoat of society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: VI.6.6
  kind: p
  original: Von diesen mit Maschinen konkurrierenden Arbeitern sind die am meisten mißhandelten die Handweber der Baumwollenindustrie.
  en: Of all the workers in competition with machinery, the most ill-used are the hand-loom cotton weavers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: VI.6.7
  kind: p
  original: Diese Leute bekommen den geringsten Lohn und sind bei voller Arbeit nicht imstande, sich über 10 sh. wöchentlich zu verdienen.
  en: They receive the most trifling wages, and, with full work, are not in a position to earn more than ten shillings a week.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: VI.6.8
  kind: p
  original: Eine Gattung Weberei nach der andern wird ihnen von dem mechanischen Webstuhl streitig gemacht, und außerdem ist die Handweberei die letzte Zuflucht aller in andern Branchen brotlos gewordenen Arbeiter, so daß sie stets überfüllt ist.
  en: One class of woven goods after another is annexed by the power-loom, and hand-weaving is the last refuge of workers thrown out of employment in other branches, so that the trade is always overcrowded.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: VI.6.9
  kind: p
  original: Daher kommt es, daß in Durchschnittsperioden der Handweber sich glücklich schätzt, wenn er 6 bis 7 sh. wöchentlich verdienen kann, und selbst um diese Summe zu erringen, muß er 14 bis 18 Stunden täglich hinter seinem Webstuhl sitzen.
  en: Hence it comes that, in average seasons, the hand-weaver counts himself fortunate if he can earn six or seven shillings a week, while to reach this sum he must sit at his loom fourteen to eighteen hours a day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: VI.6.10
  kind: p
  original: Die meisten Gewebe erfordern ohnehin ein feuchtes Arbeitslokal, damit der Einschlagsfaden nicht jeden Augenblick reißt, und teils daher, teils wegen der Armut der Arbeiter, die keine bessere Wohnung bezahlen können, sind die Werkstätten der Handweber meist ohne bretternen oder gepflasterten Fußboden.
  en: Most woven goods require moreover a damp weaving-room, to keep the weft from snapping, and in part, for this reason, in part because of their poverty, which prevents them from paying for better dwellings, the workrooms of these weavers are usually without wooden or paved floors.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: VI.6.11
  kind: p
  original: Ich war in vielen Wohnungen von Handwebern - in abgelegenen, schlechten Höfen und Gassen, gewöhnlich in Kellern.
  en: I have been in many dwellings of such weavers, in remote, vile courts and alleys, usually in cellars.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: VI.6.12
  kind: p
  original: Oft wohnten ein halb Dutzend dieser Handweber, von denen einige verheiratet waren, in einer Cottage, die ein oder zwei Arbeitszimmer und ein großes Schlafzimmer für alle hatte, zusammen.
  en: Often half-a-dozen of these hand-loom weavers, several of them married, live together in a cottage with one or two workrooms, and one large sleeping-room.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '365'
- id: VI.6.13
  kind: p
  original: Ihre Nahrung besteht fast einzig aus Kartoffeln, vielleicht etwas Haferbrei, selten Milch und fast nie Fleisch; eine große Anzahl von ihnen sind Irländer oder irischer Abkunft.
  en: Their food consists almost exclusively of potatoes, with perhaps oatmeal porridge, rarely milk, and scarcely ever meat. Great numbers of them are Irish or of Irish descent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 365-366
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.6.14
  kind: p
  original: Und diese armen, von jeder Krisis am ersten erreichten und am letzten verlassenen Handweber müssen der Bourgeoisie zur Handhabe dienen, um gegen die Angriffe auf das Fabriksystem standhalten zu können!
  en: And these poor hand-loom weavers, first to suffer from every crisis, and last to be relieved from it, must serve the bourgeoisie as a handle in meeting attacks upon the factory system.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: VI.6.15
  kind: p
  original: Seht, ruft die Bourgeoisie triumphierend aus, seht, wie diese armen Weber darben müssen, während es den Fabrikarbeitern gut geht, und dann urteilt über das Fabriksystem!
  en: '"See," cries the bourgeois, triumphantly, "see how these poor creatures must famish, while the mill operatives are thriving, and then judge the factory system!"'
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N5
  mew_page: '366'
- id: VI.6.16
  kind: p
  original: Als ob nicht gerade das Fabriksystem und die dazugehörige Maschinerie die Handweber so schmählich tief herabgedrückt hätte - als ob die Bourgeoisie dies selbst nicht ebensogut wüßte wie wir!
  en: As though it were not precisely the factory system and the machinery belonging to it which had so shamefully crushed the hand-loom weavers, and as though the bourgeoisie did not know this quite as well as ourselves!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: VI.6.17
  kind: p
  original: Aber die Bourgeoisie ist interessiert, und da kommt es ihr auf ein paar Lügen und Heucheleien nicht an.
  en: But the bourgeoisie has interests at stake, and so a falsehood or two and a bit of hypocrisy won't matter much.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: VI.7.1
  kind: p
  original: Fassen wir die eine Tatsache, daß die Maschinerie die Arbeit des erwachsenen männlichen Arbeiters mehr und mehr verdrängt, etwas näher ins Auge.
  en: Let us examine somewhat more closely the fact that machinery more and more supersedes the work of men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: VI.7.2
  kind: p
  original: Die Arbeit an den Maschinen, sowohl beim Spinnen als Weben, besteht hauptsächlich im Zusammenknüpfen gebrochener Fäden, da sonst die Maschine alles tut; diese Arbeit erfordert keine Kraft, aber größere Gelenkigkeit der Finger.
  en: The human labour, involved in both spinning and weaving, consists chiefly in piecing broken threads, as the machine does all the rest. This work requires no muscular strength, but only flexibility of finger.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.7.3
  kind: p
  original: Männer sind dazu also nicht nur unnötig, sondern wegen der stärkeren Muskel- und Knochenentwicklung ihrer Hände sogar weniger geeignet als Weiber und Kinder und so natürlicherweise fast ganz von dieser Art Arbeit verdrängt.
  en: Men are, therefore, not only not needed for it, but actually, by reason of the greater muscular development of the hand, less fit for it than women and children, and are, therefore, naturally almost superseded by them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: VI.7.4
  kind: p
  original: Je mehr also die Tätigkeit der Arme, die Kraftanstrengung, durch Einführung von Maschinen auf die Wasser- oder Dampfkraft geworfen wird, desto weniger Männer brauchen beschäftigt zu werden - und da Weiber und Kinder ohnehin billiger und, wie gesagt, in diesen Arbeitszweigen besser als Männer arbeiten, so werden sie beschäftigt.
  en: Hence, the more the use of the arms, the expenditure of strength, can be transferred to steam or water-power, the fewer men need be employed; and as women and children work more cheaply, and in these branches better than men, they take their places.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: VI.7.5
  kind: p
  original: In den Spinnereien findet man bei den Throstles nur Weiber und Mädchen, bei den Mules einen Spinner, einen erwachsenen Mann (der bei den self-actors wegfällt) und mehrere Piecer zum Anknüpfen der Fäden, meist Kinder oder Weiber, zuweilen junge Männer von 18 bis 20 Jahren, hie und da einen alten, brotlos gewordenen Spinner.
  en: In the spinning-mills women and girls are to be found in almost exclusive possession of the throstles; among the mules one man, an adult spinner (with self-actors, he, too, becomes superfluous), and several piecers for tying the threads, usually children or women, sometimes young men of from eighteen to twenty years, here and there an old spinner thrown out of other employment.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N6
  mew_page: '366'
- id: VI.7.6
  kind: p
  original: Bei den mechanischen Webstühlen arbeiten meist Weiber von 15 bis 20 Jahren und drüber, auch einige Männer, die aber selten über ihr einundzwanzigstes Jahr bei dieser Beschäftigung bleiben.
  en: At the power-looms women, from fifteen to twenty years, are chiefly employed, and a few men; these, however, rarely remain at this trade after their twenty-first year.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: VI.7.7
  kind: p
  original: An den Vorspinnmaschinen findet man ebenfalls nur Weiber, allenfalls einige Männer zum Schärfen und Reinigen der Kardiermaschinen.
  en: Among the preparatory machinery, too, women alone are to be found, with here and there a man to clean and sharpen the carding-frames.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '366'
- id: VI.7.8
  kind: p
  original: Außer allen diesen beschäftigen die Fabriken eine Anzahl Kinder zum Aufnehmen und Aufsetzen der Spulen (doffers) und einige erwachsene Männer als Aufseher in den Zimmern, einen Mechaniker und einen Maschinisten für die Dampfmaschine, auch wohl Schreiner, Portier etc. Die eigentliche Arbeit aber wird von Weibern und Kindern getan.
  en: Besides all these, the factories employ numbers of children--doffers--for mounting and taking down bobbins, and a few men as overlookers, a mechanic and an engineer for the steam-engines, carpenters, porters, etc.; but the actual work of the mills is done by women and children.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 366-367
- id: VI.7.9
  kind: p
  original: Die Fabrikanten leugnen auch dies, und haben im vorigen Jahre bedeutende Tabellen veröffentlicht, welche beweisen sollten, daß die Maschinen die Männer nicht verdrängten.
  en: This the manufacturers deny. They published last year elaborate tables to prove that machinery does not supersede adult male operatives.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.7.10
  kind: p
  original: Aus diesen Tabellen geht hervor, daß von allen Fabrikarbeitern etwas über die Hälfte (52 Prozent) weiblichen und etwa 48 Prozent männlichen Geschlechts, und daß von diesen Arbeitern mehr als die Hälfte über 18 Jahre alt waren.
  en: According to these tables, rather more than half of all the factory-workers employed, viz., 52 per cent., were females and 48 per cent. males, and of those operatives more than half were over eighteen years old.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: VI.7.11
  kind: p
  original: Soweit ganz gut.
  en: So far, so good.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: VI.7.12
  kind: p
  original: Die Herren Fabrikanten hüteten sich aber wohl, uns zu sagen, wie viele der Erwachsenen männlichen und wie viele weiblichen Geschlechts waren.
  en: But the manufacturers are very careful not to tell us, how many of the adults were men and how many women.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: VI.7.13
  kind: p
  original: Das ist aber eben der Punkt.
  en: And this is just the point.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: VI.7.14
  kind: p
  original: Ohnehin haben sie offenbar Mechaniker, Schreiner und alle erwachsenen Männer, die irgendwie mit ihren Fabriken im Zusammhange standen, vielleicht gar Schreiber usw. mitgezählt, und doch haben sie nicht den Mut, den ganzen Tatbestand auszusprechen.
  en: Besides this, they have evidently counted the mechanics, engineers, carpenters, all the men employed in any way in the factories, perhaps even the clerks, and still they have not the courage to tell the whole truth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: VI.7.15
  kind: p
  original: Diese Angaben wimmeln überhaupt von Falschheiten und verdrehten, schiefen Auffassungen, Durchschnittsberechnungen, die für den Unkundigen viel, für den Kundigen nichts beweisen, von Verheimlichungen gerade der wichtigsten Punkte und beweisen nur die selbstsüchtige Verblendung und Unredlichkeit dieser Fabrikanten.
  en: These publications teem generally with falsehoods, perversions, crooked statements, with calculations of averages, that prove a great deal for the uninitiated reader and nothing for the initiated, and with suppressions of facts bearing on the most important points; and they prove only the selfish blindness and want of uprightness of the manufacturers concerned.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: VI.7.16
  kind: p
  original: Wir wollen der Rede, mit der Lord Ashley am 15. März 1844 im Unterhause die Zehnstunden-Motion machte, einige Angaben über das Verhältnis der Alter und Geschlechter entnehmen, die von den Fabrikanten, deren Data sich ohnehin nur auf einen Teil der englischen Fabrikindustrie beziehen, nicht widerlegt worden sind.
  en: Let us take some of the statements of a speech with which Lord Ashley introduced the Ten Hours' Bill, March 15th, 1844, into the House of Commons. Here he gives some data as to the relations of sex and age of the operatives, not yet refuted by the manufacturers, whose statements, as quoted above, cover moreover only a part of the manufacturing industry of England.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.7.17
  kind: p
  original: Von den 419 590 Fabrikarbeitern des britischen Reichs (1839) waren 192 887, also beinahe die Hälfte, unter 18 Jahren, und 242 296 weiblichen Geschlechts, von denen 112 192 unter 18 Jahren waren.
  en: Of 419,560 factory operatives of the British Empire in 1839, 192,887, or nearly half, were under eighteen years of age, and 242,296 of the female sex, of whom 112,192 were less than eighteen years old.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T2
    editions: 1845 and 1892
    reading: irrtümlich 419 560
    base_text: … Von den 419 590 ‸ Fabrikarbeitern des britischen Reichs …
  mew_page: '367'
- id: VI.7.18
  kind: p
  original: Sonach bleiben 80 695 männliche Arbeiter unter 18 Jahren und 95 599 männliche erwachsene Arbeiter oder 23 Prozent, also kein volles Viertel der ganzen Zahl.
  en: There remain, therefore, 80,695 male operatives under eighteen years, and 96,569 adult male operatives, or not one full quarter of the whole number.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T3
    editions: 1845 and 1892
    reading: irrtümlich 95 569
    base_text: … Jahren und 95 599 ‸ männliche erwachsene Arbeiter oder …
  mew_page: '367'
- id: VI.7.19
  kind: p
  original: In den Baumwollfabriken waren 56 1/4, in den Wollenfabriken 69 1/2, Seidenfabriken 70 1/2, Flachsspinnereien 70 1/2 Prozent sämtlicher Arbeiter weiblichen Geschlechts.
  en: In the cotton factories, 56.25 per cent.; in the woollen mills, 69.5 per cent.; in the silk mills, 70.5 per cent.; in the flax-spinning mills, 70.5 per cent. of all operatives are of the female sex.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: VI.7.20
  kind: p
  original: Diese Zahlen reichen hin, um die Verdrängung männlicher erwachsener Arbeiter nachzuweisen.
  en: These numbers suffice to prove the crowding out of adult males.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: VI.7.21
  kind: p
  original: Man braucht aber auch nur in die erste beste Fabrik zu gehen, um dies bestätigt sehen.
  en: But you have only to go into the nearest mill to see the fact confirmed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: VI.7.22
  kind: p
  original: Daraus folgt nun notwendig jene Umkehrung der bestehenden sozialen Ordnung, die eben, weil sie eine gezwungene ist, für die Arbeiter die verderblichsten Folgen hat.
  en: Hence follows of necessity that inversion of the existing social order which, being forced upon them, has the most ruinous consequences for the workers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '367'
- id: VI.7.23
  kind: p
  original: Die Arbeit der Weiber löst vor allen Dingen die Familie gänzlich auf; denn wenn die Frau den Tag über 12 bis 13 Stunden in der Fabrik zubringt und der Mann ebendaselbst oder an einem andern Orte arbeitet, was soll da aus den Kindern werden?
  en: The employment of women at once breaks up the family; for when the wife spends twelve or thirteen hours every day in the mill, and the husband works the same length of time there or elsewhere, what becomes of the children?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 367-368
- id: VI.7.24
  kind: p
  original: Sie wachsen wild auf wie Unkraut, sie werden zum Verwahren ausgemietet für einen oder anderthalb Shilling die Woche, und welch eine Behandlung ihnen da wird, läßt sich denken.
  en: They grow up like wild weeds; they are put out to nurse for a shilling or eighteenpence a week, and how they are treated may be imagined.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: VI.7.25
  kind: p
  original: Daher vermehren sich auch in den Fabrikdistrikten die Unglücksfälle, denen kleine Kinder wegen Mangels an Aufsicht zum Opfer fallen, auf eine schreckenerregende Weise.
  en: Hence the accidents to which little children fall victims multiply in the factory districts to a terrible extent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: VI.7.26
  kind: p
  original: Die Listen der Totenschaubeamten von Manchester hatten (laut Bericht des Fact. Inq. Comm., Rept. of Dr. Hawkins, p. 3) in 9 Monaten 69 durch Verbrennung, 56 durch Ertrinken, 23 durch Fallen, 67 durch andere Unglücksfälle Getötete, also im ganzen 215 Unglücksfälle aufzuweisen, während in dem nichtfabrizierenden Liverpool während zwölf Monaten nur 146 tödliche Unglücksfälle vorkamen.
  en: 'The lists of the Coroner of Manchester showed for nine months: 69 deaths from burning, 56 from drowning, 23 from falling, 77 from other causes, or a total of 225 deaths from accidents, while in non-manufacturing Liverpool during twelve months there were but 146 fatal accidents.'
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N7
  variants:
  - ref: T4
    editions: 1845 and 1892
    reading: irrtümlich 77
    base_text: … 23 durch Fallen, 67 ‸ durch andere Unglücksfälle Getötete, …
  - ref: T5
    editions: 1845 and 1892
    reading: irrtümlich 225
    base_text: … also im ganzen 215 ‸ Unglücksfälle aufzuweisen, während in …
  mew_page: '368'
  en_note: 'English note {143a}: Report of Factories'' Inquiry Commission. Testimony of Dr. Hawkins, p. 3.'
- id: VI.7.27
  kind: p
  original: Die Unglücksfälle in den Kohlengruben sind bei beiden Städten ausgeschlossen, und es ist zu bedenken, daß der Coroner [Leichenbeschauer (bei gewaltsamen oder plötzlichen Todesfällen)] von Manchester keine Autorität in Salford hat, so daß die Bevölkerung der beiden Distrikte ziemlich gleich ist.
  en: The mining accidents are excluded in both cases; and since the Coroner of Manchester has no authority in Salford, the population of both places mentioned in the comparison is about the same.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: VI.7.28
  kind: p
  original: Der "Manchester Guardian" berichtet fast in jeder Nummer von einer oder mehreren Verbrennungen.
  en: The Manchester Guardian reports one or more deaths by burning in almost every number.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: VI.7.29
  kind: p
  original: Daß die allgemeine Sterblichkeit kleiner Kinder ebenfalls durch die Arbeit der Mütter gehoben wird, versteht sich von selbst und ist durch Tatsachen außer allen Zweifel gesetzt.
  en: That the general mortality among young children must be increased by the employment of the mothers is self-evident, and is placed beyond all doubt by notorious facts.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T6
    editions: '1892'
    reading: gesteigert
    base_text: … Arbeit der Mütter gehoben ‸ wird, versteht sich von …
  mew_page: '368'
- id: VI.7.30
  kind: p
  original: Die Frauen kommen oft schon drei bis vier Tage nach der Niederkunft wieder in die Fabrik und lassen ihren Säugling natürlich zurück; in den Freistunden müssen sie eilig nach Hause laufen, um das Kind zu stillen und nebenbei selbst etwas zu genießen - was das für eine Stillung sein muß, ist klar.
  en: Women often return to the mill three or four days after confinement, leaving the baby, of course; in the dinner hour they must hurry home to feed the child and eat something, and what sort of suckling that can be is also evident.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: VI.7.31
  kind: p
  original: 'Lord Ashley gibt die Aussagen einiger Arbeiterinnen:'
  en: 'Lord Ashley repeats the testimony of several workwomen: "M. H., twenty years old, has two children, the youngest a baby, that is tended by the other, a little older. The mother goes to the mill shortly after five o''clock in the morning, and comes home at eight at night; all day the milk pours from her breasts, so that her clothing drips with it."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: VI.8.1
  kind: p
  original: '"M. H., zwanzig Jahre alt, hat zwei Kinder, das jüngste ein Säugling, das von dem andern, etwas älteren, verwahrt wird - sie geht morgens bald nach fünf Uhr in die Fabrik und kommt um acht Uhr abends zurück; den Tag über fließt die Milch aus ihrer Brust, daß ihr die Kleider triefen.'
  en: ''
  joined_to: VI.7.31
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '368'
- id: VI.8.2
  kind: p
  original: '- H. W. hat drei Kinder, geht um fünf Uhr montags von Hause und kommt erst Sonnabend abends um sieben wieder - hat dann so viel für ihre Kinder zu besorgen, daß sie vor drei Uhr morgens nicht zu Bett gehen kann.'
  en: '"H. W. has three children, goes away Monday morning at five o''clock, and comes back Saturday evening; has so much to do for the children then that she cannot get to bed before three o''clock in the morning; often wet through to the skin, and obliged to work in that state."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.8.3
  kind: p
  original: Oft förmlich bis auf die Haut vom Regen durchnäßt und genötigt, in dieser Lage zu arbeiten.
  en: ''
  joined_to: VI.8.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '368'
- id: VI.8.4
  kind: p
  original: '''Meine Brüste haben mir die schrecklichsten Schmerzen gemacht, und ich bin triefend naß von Milch gewesen.''"'
  en: 'She said: "My breasts have given me the most frightful pain, and I have been dripping wet with milk."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '368'
- id: VI.9.1
  kind: p
  original: Die Anwendung von narkotischen Arzneien, um die Kinder ruhig zu halten, wird durch dies infame System nur begünstigt und ist wirklich in den Fabrikdistrikten auf einen hohen Grad der Verbreitung gestiegen; Dr. Johns, Oberregistrator des Manchester-Distrikts, ist der Meinung, daß diese Sitte die Hauptursache der häufigen Todesfälle durch Krämpfe sei.
  en: The use of narcotics to keep the children still is fostered by this infamous system, and has reached a great extent in the factory districts. Dr. Johns, Registrar in Chief for Manchester, is of opinion that this custom is the chief source of the many deaths from convulsions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.9.2
  kind: p
  original: Die Beschäftigung der Frau in der Fabrik löst die Familie notwendig gänzlich auf, und diese Auflösung hat in dem heutigen Zustande der Gesellschaft, der auf der Familie beruht, die demoralisierendsten Folgen, sowohl für die Eheleute wie für die Kinder.
  en: The employment of the wife dissolves the family utterly and of necessity, and this dissolution, in our present society, which is based upon the family, brings the most demoralising consequences for parents as well as children.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: VI.9.3
  kind: p
  original: Eine Mutter, die nicht die Zeit hat, sich um ihr Kind zu bekümmern, ihm während der ersten Jahre die gewöhnlichsten Liebesdienste zu erweisen, eine Mutter, die ihr Kind kaum zu sehen bekommt, kann diesem Kinde keine Mutter sein, sie muß notwendig gleichgültig dagegen werden, es ohne Liebe, ohne Fürsorge behandeln wie ein ganz fremdes Kind; und Kinder, die in solchen Verhältnissen aufgewachsen, sind später für die Familie gänzlich verdorben, können nie in der Familie, die sie selber stiften, sich heimisch fühlen, weil sie nur ein isoliertes Leben kennengelernt haben, und müssen deshalb zur ohnehin schon allgemeinen Untergrabung der Familie bei den Arbeitern beitragen.
  en: A mother who has no time to trouble herself about her child, to perform the most ordinary loving services for it during its first year, who scarcely indeed sees it, can be no real mother to the child, must inevitably grow indifferent to it, treat it unlovingly like a stranger. The children who grow up under such conditions are utterly ruined for later family life, can never feel at home in the family which they themselves found, because they have always been accustomed to isolation, and they contribute therefore to the already general undermining of the family in the working-class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.9.4
  kind: p
  original: Eine ähnliche Auflösung der Familie wird durch die Arbeit der Kinder herbeigeführt.
  en: A similar dissolution of the family is brought about by the employment of the children.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: VI.9.5
  kind: p
  original: Wenn diese so weit sind, daß sie mehr verdienen, als ihren Eltern die Beköstigung zu stehen kommt, so fangen sie an, den Eltern ein Gewisses für Kost und Logis zu gehen und den Rest für sich selbst zu verbrauchen.
  en: When they get on far enough to earn more than they cost their parents from week to week, they begin to pay the parents a fixed sum for board and lodging, and keep the rest for themselves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: VI.9.6
  kind: p
  original: Dies geschieht oft schon mit dem vierzehnten und fünfzehnten Jahr.
  en: This often happens from the fourteenth or fifteenth year.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
  en_note: 'English note {144}: Factories'' Inquiry Commission''s Report, Power''s Report on Leeds: passim Tufnell Report on Manchester, p. 17. etc.'
- id: VI.9.7
  kind: p
  original: (Power, Rept. on Leeds, passim, Tufnell, Rept. on Manchester p. 17 etc. im Fabrikbericht.)
  en: In a word, the children emancipate themselves, and regard the paternal dwelling as a lodging-house, which they often exchange for another, as suits them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.9.8
  kind: p
  original: Mit einem Wort, die Kinder emanzipieren sich und betrachten das elterliche Haus als ein Kosthaus, das sie auch oft genug, wenn es ihnen nicht gefällt, mit einem andern vertauschen.
  en: ''
  joined_to: VI.9.7
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '369'
- id: VI.10.1
  kind: p
  original: In vielen Fällen wird die Familie durch das Arbeiten der Frau nicht ganz aufgelöst, sondern auf den Kopf gestellt.
  en: In many cases the family is not wholly dissolved by the employment of the wife, but turned upside down.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: VI.10.2
  kind: p
  original: Die Frau ernährt die Familie, der Mann sitzt zu Hause, verwahrt die Kinder, kehrt die Stuben und kocht.
  en: The wife supports the family, the husband sits at home, tends the children, sweeps the room and cooks.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: VI.10.3
  kind: p
  original: Dieser Fall kommt sehr, sehr häufig vor; in Manchester allein ließe sich manches Hundert solcher Männer, die zu häuslichen Arbeiten verdammt sind, zusammenbringen.
  en: This case happens very frequently; in Manchester alone, many hundred such men could be cited, condemned to domestic occupations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: VI.10.4
  kind: p
  original: Man kann sich denken, welche gerechte Entrüstung diese tatsächliche Kastration bei den Arbeitern hervorruft und welche Umkehrung aller Verhältnisse der Familie, während doch die übrigen gesellschaftlichen Verhältnisse dieselben bleiben, dadurch entsteht.
  en: It is easy to imagine the wrath aroused among the working-men by this reversal of all relations within the family, while the other social conditions remain unchanged.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '369'
- id: VI.10.5
  kind: p
  original: Mir liegt ein Brief eines englischen Arbeiters, Robert Pounder, Baron's Buildings, Woodhouse Moor-Side, in Leeds (die Bourgeoisie mag ihn da aufsuchen, um ihretwillen geb' ich die genaue Adresse), vor, den dieser an Oastler richtete, und dessen Naivität ich nur halb wiedergeben kann; die Orthographie läßt sich allenfalls, der Yorkshirer Dialekt aber gar nicht im Deutschen nachmachen.
  en: 'There lies before me a letter from an English working-man, Robert Pounder, Baron''s Buildings, Woodhouse, Moorside, in Leeds (the bourgeoisie may hunt him up there; I give the exact address for the purpose), written by him to Oastler:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 369-370
  en_note: 'English note {145}: This letter is re-translated from the German, no attempt being made to re-produce either the spelling or the original Yorkshire dialect.'
- id: VI.10.6
  kind: p
  original: Er erzählt darin, wie ein anderer Arbeiter seiner Bekanntschaft einmal auf einer Wanderung, um Arbeit zu suchen, in St. Helens in Lancashire einen alten Freund getroffen habe.
  en: He relates how another working-man, being on tramp, came to St. Helens, in Lancashire, and there looked up an old friend.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
- id: VI.11.1
  kind: p
  original: '"Nun, Herr, er fand ihn, und als er zu seiner Baracke kam, was war es, denkt Ihr, nun ein feuchter niedriger Keller, die Beschreibung, die er von den Möbeln gab, war wie folgt - zwei alte Stühle, ein runder 3Beiniger tisch eine Kiste Kein bett aber ein Hauffen Altes Stro in einem Eck mit ein paar schmuttzige bet Tücher oben drauf un 2 stücke Holtz an das Kamien Und als mein Arme freund herein ging da sas der Arme jack Am feuer auff das Holz und Was taht Er denckt Ir?'
  en: 'He found him in a miserable, damp cellar, scarcely furnished; and when my poor friend went in, there sat poor Jack near the fire, and what did he, think you? why he sat and mended his wife''s stockings with the bodkin; and as soon as he saw his old friend at the door-post, he tried to hide them. But Joe, that is my friend''s name, had seen it, and said: "Jack, what the devil art thou doing?'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s); regrouped by the ingest (see REALIGN)
- id: VI.11.2
  kind: p
  original: Er sas und Stoppfte seiner frau Ire strümfe mit der Stopf Natel und sobalt Er Sein alten Freund an den Tür-Posten Sahe, Versugte Er es zu Verberrgen Aber Joe so Heist Mein bekanter Hatte es Dog geseeen und Sachte jack Zum Teuffel was Magst Du doch wo Ist deine frau waß ist Daß deine Arbeid der Arme jack Schämde sig Und Sagde nein Ig weis daß Ist nig Mein arbbeid abber mein arme FFrau Is in der fabrikk sie mus Um 1/2 6 ur gen Und Arbeid biß 8 ur Abentz und Sieh ist so Ab Das Sie Nigtz Duhn Can Wen sie nag Hauße Komd so Mus ig alLes Führ Ir Duhn Waß ich Can Den ig hab Kein arBeid und Kein Gehapd Zeid Meer alz 3 Jar Und Ig krich Mein leeben Kein meer, und Dan Weinette Er ein Dike trehne nein Joe Sagte er Es ist arbeid Gnucht vor weibsLeute Und kindern Hir Inn der Gegent Aber Kein vor mannsLeut du Kanst eer Hunderd Fundt Auff der strase Finden Altz arbeid aber Ig Hette nig Geglaubed Das du Oderr Sonst jemandt mir Geseeen Hette Das ig Meiner frau Ire strümffe Stopde, Den es ist Schlegte arbeid Aber Sieh Can beiNa nig Meer auff Ire füse Steeen ig Bin Bange Sie wirt Gans Kranck Und Dan weis Ig nig Was sol Auß unz Werden Den sieh Ist schoon lange Der man Im hauß Geweßen.
  en: 'Where is the missus? Why, is that thy work?" and poor Jack was ashamed, and said: "No, I know this is not my work, but my poor missus is i'' th'' factory; she has to leave at half-past five and works till eight at night, and then she is so knocked up that she cannot do aught when she gets home, so I have to do everything for her what I can, for I have no work, nor had any for more nor three years, and I shall never have any more work while I live;" and then he wept a big tear. Jack again said: "There is work enough for women folks and childer hereabouts, but none for men; thou mayest sooner find a hundred pound on the road than work for men--but I should never have believed that either thou or any one else would have seen me mending my wife''s stockings, for, it is bad work.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s); regrouped by the ingest (see REALIGN)
- id: VI.11.3
  kind: p
  original: Und ig Die frau es Ist Schlime Arbeid joe Und weinde Biterlig Und Sagte es Ist nigt Imer soo Gewessen Nein Jack Sagte Joe Und Wen du Hast Kein arbeid Gehabt al Die zeid Wie hast du dir Am leben Erhalden ig wil dir Sagen Joe So gud alz Es gink Aber Es gink schlegt Gnucht du Weist alz Ig Heiratete Da Hate ig arbeid Gnucht Und du Weist ig Wahr Nicht Faul nein Daß warest du Nigt. -.und Wihr Haten ein Gutes Meblirtes Hauß Und Mary Braugte nicht zu arbeidn ig Konte Vor untz beiden Arbeidn aber Jetzd ist Die verKehrte weld Mary Muß arbeidn Und ig Mus Hirbleibben Die kinder ferwaren Und Keren und Waaschen Baken Und fliken Den wen Die arme frau Nag hauße Komd am abent Dan Ist Sieh müde Und Kapput du Weist joe Daß Ist Hard vor einem Der Anders Gewond wahr joe Sagte.
  en: But she can hardly stand on her feet; I am afraid she will be laid up, and then I don't know what is to become of us, for it's a good bit that she has been the man in the house and I the woman; it is bad work, Joe;" and he cried bitterly, and said, "It has not been always so." "No," said Joe; "but when thou hadn't no work, how hast thou not shifted?" "I'll tell thee, Joe, as well as I can, but it was bad enough; thou knowest when I got married I had work plenty, and thou knows I was not lazy." "No, that thou wert not." "And we had a good furnished house, and Mary need not go to work. I could work for the two of us; but now the world is upside down. Mary has to work and I have to stop at home, mind the childer sweep and wash, bake and mend; and, when the poor woman comes home at night, she is knocked up. Thou knows, Joe, it's hard for one that was used different."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
  align: '1:8'
  review: true
  review_reason: 1 de sentence(s) matched to 8 en sentence(s); regrouped by the ingest (see REALIGN)
- id: VI.11.4
  kind: p
  original: Ja junge Et is Hard Und Dan fienk Jack Wider ahn Zu weinen Und Er Wolde er Hete ni GeHeirad Und were Ni GeBoren aber Er hete nig Gedagd Altz er Die Mary Heiratten Das es Ihm So Ergeen werde. ig Hab offt Gnugt Drüber GeHeult Sagde Der jack nun herr Altz Joe Daß Hörete Sagde Er Mich Das Er Hätte Verflugd Und verDamd Die fabriken Und die Fabrikkandn und Die Regirung Mit allen flügen Die Er von jugent Auff in Der fabrikk Gelernd Hate,"
  en: '"Yes, boy, it is hard." And then Jack began to cry again, and he wished he had never married, and that he had never been born; but he had never thought, when he wed Mary, that it would come to this. "I have often cried over it," said Jack. Now when Joe heard this, he told me that he had cursed and damned the factories, and the masters, and the Government, with all the curses that he had learned while he was in the factory from a child.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '370'
  align: '1:4'
  review: true
  review_reason: 1 de sentence(s) matched to 4 en sentence(s); regrouped by the ingest (see REALIGN)
- id: VI.12.1
  kind: p
  original: Kann man sich einen verrückteren, unsinnigeren Zustand denken, als den in diesem Brief geschilderten?
  en: Can any one imagine a more insane state of things than that described in this letter?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: VI.12.2
  kind: p
  original: Und doch ist dieser Zustand, der den Mann entmannt und dem Weibe seine Weiblichkeit nimmt, ohne imstande zu sein, dem Manne wirkliche Weiblichkeit und dem Weibe wirkliche Männlichkeit zu geben, dieser, beide Geschlechter und in ihnen die Menschheit aufs schändlichste entwürdigende Zustand die letzte Folge unserer hochgelobten Zivilisation, das letzte Resultat aller der Anstrengungen, die Hunderte von Generationen zur Verbesserung ihrer eignen Lage und der ihrer Nachkommen gemacht haben!
  en: And yet this condition, which unsexes the man and takes from the woman all womanliness without being able to bestow upon the man true womanliness, or the woman true manliness--this condition which degrades, in the most shameful way, both sexes, and, through them, Humanity, is the last result of our much-praised civilisation, the final achievement of all the efforts and struggles of hundreds of generations to improve their own situation and that of their posterity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: VI.12.3
  kind: p
  original: Wir müssen entweder an der Menschheit und ihrem Wollen und Laufen geradezu verzweifeln, wenn wir alle unsre Mühe und Arbeit in den Resultaten selbst so zum Kinderspott gemacht sehen, oder wir müssen zugeben, daß die menschliche Gesellschaft ihr Glück bisher auf einem falschen Wege gesucht hat; wir müssen zugeben, daß eine so totale Umkehrung der Stellung der Geschlechter nur daher kommen kann, daß die Geschlechter von Anfang an falsch gegeneinandergestellt worden sind.
  en: We must either despair of mankind, and its aims and efforts, when we see all our labour and toil result in such a mockery, or we must admit that human society has hitherto sought salvation in a false direction; we must admit that so total a reversal of the position of the sexes can have come to pass only because the sexes have been placed in a false position from the beginning.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: VI.12.4
  kind: p
  original: Ist die Herrschaft der Frau über den Mann, wie sie durch das Fabriksystem notwendig hervorgerufen wird, unmenschlich, so muß auch die ursprüngliche Herrschaft des Mannes über die Frau unmenschlich sein.
  en: If the reign of the wife over the husband, as inevitably brought about by the factory system, is inhuman, the pristine rule of the husband over the wife must have been inhuman too.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: VI.12.5
  kind: p
  original: Kann jetzt die Frau, wie früher der Mann, seine Herrschaft darauf basieren, daß sie das meiste, ja alles in die Gütergemeinschaft der Familie legt, so folgt notwendig, daß diese Gütergemeinschaft keine wahre, vernünftige ist, weil ein Familienglied noch auf den größeren Betrag der Einlage pocht.
  en: If the wife can now base her supremacy upon the fact that she supplies the greater part, nay, the whole of the common possession, the necessary inference is that this community of possession is no true and rational one, since one member of the family boasts offensively of contributing the greater share.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: VI.12.6
  kind: p
  original: Wird die Familie der jetzigen Gesellschaft aufgelöst, so zeigt sich eben in dieser Auflösung, daß im Grunde nicht die Familienliebe, sondern das in der verkehrten Gütergemeinschaft notwendig konservierte Privatinteresse das haltende Band der Familie war.
  en: If the family of our present society is being thus dissolved, this dissolution merely shows that, at bottom, the binding tie of this family was not family affection, but private interest lurking under the cloak of a pretended community of possessions.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N8
  mew_page: '371'
- id: VI.12.7
  kind: p
  original: Dasselbe Verhältnis findet auch wohl bei den Kindern statt, die ihre arbeitslosen Eltern unterhalten, wenn sie nicht, wie oben erwähnt, den Eltern Kostgeld geben.
  en: The same relation exists on the part of those children who support unemployed parents when they do not directly pay board as already referred to.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: VI.12.8
  kind: p
  original: Dr. Hawkins bezeugt im Fabrikbericht, daß dies Verhältnis oft genug vorkommt, und es ist in Manchester überhaupt notorisch.
  en: Dr. Hawkins testified in the Factories' Inquiry Commission's Report that this relation is common enough, and in Manchester it is notorious.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
- id: VI.12.9
  kind: p
  original: Wie die Frau, so sind in diesem Fall die Kinder die Herren im Haus, wovon Lord Ashley in seiner Rede (Unterhaussitzung vom 15. März 1844) ein Beispiel gibt.
  en: 'In this case the children are the masters in the house, as the wife was in the former case, and Lord Ashley gives an example of this in his speech: A man berated his two daughters for going to the public house, and they answered that they were tired of being ordered about, saying, "Damn you, we have to keep you!" Determined to keep the proceeds of their work for themselves, they left the family dwelling, and abandoned their parents to their fate.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '371'
  en_note: 'English note {147b}: House of Commons, March 15th, 1844.'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: VI.12.10
  kind: p
  original: 'Ein Mann schalt seine beiden Töchter aus, weil sie in einem Wirtshaus gewesen waren, und diese erklärten, sie seien das Regiertwerden leid: Damn you, we have you to keep [Zum Teufel mit die, wir müssen dich erhalten], und wollten dann auch etwas von ihrer Arbeit haben; sie zogen aus dem elterlichen Hause und überließen Vater und Mutter ihrem Schicksal.'
  en: ''
  joined_to: VI.12.9
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: 371-372
- id: VI.13.1
  kind: p
  original: Die unverheirateten Frauenzimmer, die in Fabriken aufwachsen, sind nicht besser dran als die verheirateten.
  en: The unmarried women, who have grown up in mills, are no better off than the married ones.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: VI.13.2
  kind: p
  original: Es versteht sich ganz von selbst, daß ein Mädchen, das seit dem neunten Jahre in der Fabrik gearbeitet hat, nicht imstande war, sich mit häuslichen Arbeiten bekannt zu machen, und daher kommt es, daß alle Fabrikarbeiterinnen darin gänzlich unerfahren und durchaus nicht zu Hausfrauen geeignet sind.
  en: It is self-evident that a girl who has worked in a mill from her ninth year is in no position to understand domestic work, whence it follows that female operatives prove wholly inexperienced and unfit as housekeepers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: VI.13.3
  kind: p
  original: Sie können nicht nähen und stricken, kochen oder waschen, sie sind mit den gewöhnlichsten Verrichtungen einer Hausfrau unbekannt, und wie sie mit kleinen Kindern umzugehen haben, davon wissen sie vollends gar nichts.
  en: They cannot knit or sew, cook or wash, are unacquainted with the most ordinary duties of a housekeeper, and when they have young children to take care of, have not the vaguest idea how to set about it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: VI.13.4
  kind: p
  original: 'Der Bericht der Fact. Inq. Comm. gibt Dutzende von Beispielen für diese Tatsache, und Dr. Hawkins, der Kommissär für Lancashire, spricht seine Ansicht folgendermaßen aus (p. 4 des Berichts):'
  en: 'The Factories'' Inquiry Commission''s Report gives dozens of examples of this, and Dr. Hawkins, Commissioner for Lancashire, expresses his opinion as follows:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
  en_note: 'English note {147c}: Factories'' Inquiry Commission''s Report, p. 4.'
- id: VI.14.1
  kind: p
  original: '"Die Mädchen heiraten früh und unüberlegt, sie haben weder die Mittel noch die Zeit, noch die Gelegenheit, die gewöhnlichen Pflichten des häuslichen Lebens zu lernen, und wenn sie alles das hätten, so wurden sie in der Ehe keine Zeit zur Ausübung dieser Pflichten haben.'
  en: '"The girls marry early and recklessly; they have neither means, time, nor opportunity to learn the ordinary duties of household life; but if they had them all, they would find no time in married life for the performance of these duties.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: VI.14.2
  kind: p
  original: Die Mutter ist von ihrem Kinde über zwölf Stunden täglich abwesend; das Kind wird von einem Mädchen oder einer alten Frau, der es vermietet wird, verwahrt; dazu ist nur zu oft die Wohnung der Fabrikleute kein heimatlich Haus (home), oft ein Keller, der kein Koch- oder Waschgerät, nichts zum Nähen und Ausbessern enthält, dem alles fehlt, was das Leben angenehm und zivilisiert und den heimischen Herd anziehend machen könnte.
  en: The mother is more than twelve hours away from her child daily; the baby is cared for by a young girl or an old woman, to whom it is given to nurse. Besides this, the dwelling of the mill-hands is too often no home but a cellar, which contains no cooking or washing utensils, no sewing or mending materials, nothing which makes life agreeable and civilised, or the domestic hearth attractive.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.14.3
  kind: p
  original: Ich kann nach diesen und andern Gründen, besonders um der größeren Lebenschancen für kleine Kinder willen, nur wünschen und hoffen, daß eine Zeit kommen möge, in der die verheirateten Frauen von den Fabriken ausgeschlossen sind."
  en: For these and other reasons, and especially for the sake of the better chances of life for the little children, I can but wish and hope that a time may come in which married women will be shut out of the factories."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
  en_note: 'English note {148a}: For further examples and information compare Factories'' Inquiry Commission''s Report. Cowell Evidence, pp. 37, 38, 39, 72, 77, 59; Tufnell Evidence, pp. 9, 15, 45, 54, etc.'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.15.1
  kind: p
  original: Einzelne Beispiele und Aussagen vgl. Fact. Inq. Comm. Report, Cowell, evid. p. 37, 38, 39, 72, 77, 50. Tufnell, evid. p. 9, 15, 45, 54 etc.
  en: ''
  joined_to: VI.14.3
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '372'
- id: VI.16.1
  kind: p
  original: Das ist alles aber noch das wenigste.
  en: But that is the least of the evil.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: VI.16.2
  kind: p
  original: Die moralischen Folgen der Arbeit von Weibern in Fabriken sind noch viel schlimmer.
  en: The moral consequences of the employment of women in factories are even worse.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: VI.16.3
  kind: p
  original: Die Vereinigung beider Geschlechter und aller Alter in einem Arbeitssaale, die unvermeidliche Annäherung zwischen ihnen, die Anhäufung von Leuten, denen weder intellektuelle noch sittliche Bildung gegeben worden ist, auf einem engen Raume ist eben nicht geeignet, von günstigen Folgen für die Entwicklung des weiblichen Charakters zu sein.
  en: The collecting of persons of both sexes and all ages in a single workroom, the inevitable contact, the crowding into a small space of people, to whom neither mental nor moral education has been given, is not calculated for the favourable development of the female character.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '372'
- id: VI.16.4
  kind: p
  original: Der Fabrikant kann, selbst wenn er darauf sieht, nur dann einschreiten, wenn wirklich einmal etwas Skandalöses passiert; die dauernde, weniger auffallende Einwirkung lockerer Charaktere auf die moralischeren und namentlich die jüngeren kann er nicht erfahren, also auch nicht verhüten.
  en: The manufacturer, if he pays any attention to the matter, can interfere only when something scandalous actually happens; the permanent, less conspicuous influence of persons of dissolute character, upon the more moral, and especially upon the younger ones, he cannot ascertain, and consequently cannot prevent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 372-373
- id: VI.16.5
  kind: p
  original: Diese Einwirkung ist aber gerade die schädlichste.
  en: But precisely this influence is the most injurious.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: VI.16.6
  kind: p
  original: Die Sprache, die in den Fabriken geführt wird, ist den Fabrikkommissären von 1833 von vielen Seiten als "unanständig", "schlecht", "schmutzig" usw. geschildert worden (Cowell, evid. p. 35, 37, und an vielen andern Stellen).
  en: The language used in the mills is characterised by many witnesses in the report of 1833, as "indecent," "bad," "filthy," etc. It is the same process upon a small scale which we have already witnessed upon a large one in the great cities.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
  en_note: 'English note {148b}: Cowell Evidence, pp. 35, 37, and elsewhere.'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.16.7
  kind: p
  original: Die Sache ist dieselbe im kleinen, wie wir sie in den großen Städten im großen sahen.
  en: ''
  joined_to: VI.16.6
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '373'
- id: VI.16.8
  kind: p
  original: Die Zentralisation der Bevölkerung hat dieselben Wirkungen auf dieselben Leute, ob sie nun auf diese in einer großen Stadt oder in einer kleineren Fabrik wirken.
  en: The centralisation of population has the same influence upon the same persons, whether it affects them in a great city or a small factory.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: VI.16.9
  kind: p
  original: Ist die Fabrik kleiner, so ist die Annäherung größer und der Umgang unvermeidlicher.
  en: The smaller the mill the closer the packing, and the more unavoidable the contact; and the consequences are not wanting.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.16.10
  kind: p
  original: Die Folgen davon bleiben nicht aus.
  en: ''
  joined_to: VI.16.9
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '373'
- id: VI.16.11
  kind: p
  original: 'Ein Zeuge in Leicester sagt: Er würde seine Tochter lieber betteln als in die Fabrik gehen lassen- das seien wahre Höllenlöcher, die meisten Freudenmädchen in der Stadt hätten es den Fabriken zu verdanken (Power, evid. p. 8), ein andrer in Manchester "hat keinen Anstand, zu behaupten, daß drei Viertel der jungen Fabrikarbeiterinnen von 14 bis 20 Jahren unkeusch seien" (Cowell, evid. p. 57).'
  en: A witness in Leicester said that he would rather let his daughter beg than go into a factory; that they are perfect gates of hell; that most of the prostitutes of the town had their employment in the mills to thank for their present situation. Another, in Manchester, "did not hesitate to assert that three-fourths of the young factory employees, from fourteen to twenty years of age, were unchaste."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
  en_note: 'English note {148c}: Power Evidence, p. 8. English note {149a}: Cowell Evidence, p. 57'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.16.12
  kind: p
  original: 'Kommissär Cowell spricht sich überhaupt dahin aus, daß die Sittlichkeit der Fabrikarbeiter etwas unter dem Durchschnitt der arbeitenden Klasse stehe (p. 82), und Dr. Hawkins sagt (Rept. p. 4):'
  en: 'Commissioner Cowell expresses it as his opinion, that the morality of the factory operatives is somewhat below the average of that of the working-class in general. And Dr. Hawkins says:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
  en_note: 'English note {149b}: Cowell Evidence, p. 82. English note {149c}: Factories'' Inquiry Commission''s Report, p. 4, Hawkins.'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.17.1
  kind: p
  original: '"Eine Abschätzung der sexualen Sittlichkeit läßt sich nicht gut in Zahlen reduzieren, aber wenn ich meinen eignen Beobachtungen und der allgemeinen Ansicht derer, mit denen ich sprach, sowie der ganzen Haltung der mir abgelegten Zeugnisse trauen darf, so bietet sich eine höchst niederschlagende Ansicht von dem Einfluß des Fabriklebens auf die Sittlichkeit der weiblichen Jugend dar."'
  en: '"An estimate of sexual morality cannot readily be reduced to figures; but if I may trust my own observations and the general opinion of those with whom I have spoken, as well as the whole tenor of the testimony furnished me, the aspect of the influence of factory life upon the morality of the youthful female population is most depressing."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: VI.18.1
  kind: p
  original: Es versteht sich übrigens, daß die Fabrikdienstbarkeit wie jede andre, und noch mehr, dem Brotherrn das Jus primae noctis [Recht der ersten Nacht] erteilt.
  en: It is, besides, a matter of course that factory servitude, like any other, and to an even higher degree, confers the jus primae noctis upon the master.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: VI.18.2
  kind: p
  original: Der Fabrikant ist auch in dieser Beziehung Herr über den Leib und die Reize seiner Arbeiterinnen.
  en: In this respect also the employer is sovereign over the persons and charms of his employees.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: VI.18.3
  kind: p
  original: Die Entlassung ist Strafe genug, um in neun Fällen aus zehnen, wo nicht in neunundneunzig aus hundert, alles Widerstreben bei Mädchen, die ohnehin keine große Veranlassung zur Keuschheit haben, niederzuschlagen.
  en: The threat of discharge suffices to overcome all resistance in nine cases out of ten, if not in ninety-nine out of a hundred, in girls who, in any case, have no strong inducements to chastity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: VI.18.4
  kind: p
  original: Ist der Fabrikant gemein genug - und der Kommissionsbericht erzählt von mehreren Fällen - so ist seine Fabrik zugleich sein Harem; und daß nicht alle Fabrikanten Gebrauch von ihrem Rechte machen, verändert die Sache in Beziehung auf die Mädchen durchaus nicht.
  en: If the master is mean enough, and the official report mentions several such cases, his mill is also his harem; and the fact that not all manufacturers use their power, does not in the least change the position of the girls.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: VI.18.5
  kind: p
  original: Im Anfange der Fabrikindustrie, wo die meisten Fabrikanten Emporkömmlinge ohne Bildung und ohne Rücksicht auf die gesellschaftliche Heuchelei waren, ließen sie sich auch durch nichts in der Ausübung ihres "wohlerworbnen" Rechtes stören.
  en: In the beginning of manufacturing industry, when most of the employers were upstarts without education or consideration for the hypocrisy of society, they let nothing interfere with the exercise of their vested rights.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '373'
- id: VI.19.1
  kind: p
  original: Um die Folgen der Fabrikarbeit auf den physischen Zustand des weiblichen Geschlechts richtig zu beurteilen, wird es nötig sein, vorher die Arbeit der Kinder und die Art der Arbeit selbst in Betracht zu ziehen.
  en: To form a correct judgment of the influence of factory-work upon the health of the female sex, it is necessary first to consider the work of children, and then the nature of the work itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: VI.19.2
  kind: p
  original: Von Anfang der neuen Industrie an wurden Kinder in den Fabriken beschäftigt; anfangs wegen der Kleinheit der - später vergrößerten - Maschinen fast ausschließlich, und zwar nahm man die Kinder aus den Armenhäusern, die scharenweise als "Lehrlinge" bei den Fabrikanten auf längere Jahre vermietet wurden.
  en: From the beginning of manufacturing industry, children have been employed in mills, at first almost exclusively by reason of the smallness of the machines, which were later enlarged. Even children from the workhouses were employed in multitudes, being rented out for a number of years to the manufacturers as apprentices.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.19.3
  kind: p
  original: Sie wurden gemeinschaftlich logiert und bekleidet und waren natürlich die vollständigen Sklaven ihrer Brotherrn, von denen sie mit der größten Rücksichtslosigkeit und Barbarei behandelt wurden.
  en: They were lodged, fed, and clothed in common, and were, of course, completely the slaves of their masters, by whom they were treated with the utmost recklessness and barbarity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: VI.19.4
  kind: p
  original: Schon 1796 sprach sich der öffentliche Unwille über dies empörende System durch Dr. Percival und Sir R. Peel (Vater des jetzigen Ministers und selbst Baumwollfabrikant) so energisch aus, daß das Parlament 1802 eine Apprentice-bill (Lehrlingsgesetz) passierte, wodurch die schreiendsten Mißbräuche abgestellt wurden.
  en: As early as 1796, the public objection to this revolting system found such vigorous expression through Dr. Percival and Sir Robert Peel (father of the Cabinet Minister, and himself a cotton manufacturer), that in 1802 Parliament passed an Apprentices' Bill, by which the most crying evils were removed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: VI.19.5
  kind: p
  original: Allmählich trat die Konkurrenz freier Arbeiter ein und verdrängte das ganze Lehrlingssystem.
  en: Gradually the increasing competition of free workpeople crowded out the whole apprentice system; factories were built in cities, machinery was constructed on a larger scale, and workrooms were made more airy and wholesome; gradually, too, more work was found for adults and young persons. The number of children in the mills diminished somewhat, and the age at which they began to work rose a little; few children under eight or nine years were now employed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: VI.19.6
  kind: p
  original: Die Fabriken wurden allmählich mehr in den Städten errichtet, die Maschinen vergrößert und die Lokale luftiger und gesunder angelegt; allmählich fand sich auch mehr Arbeit für Erwachsene und junge Leute, und so nahm die relative Zahl der arbeitenden Kinder etwas ab, und das Alter, in dem die Arbeit angefangen wurde, stieg etwas.
  en: ''
  joined_to: VI.19.5
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '374'
- id: VI.19.7
  kind: p
  original: Man beschäftigte wenig Kinder unter 8 bis 9 Jahren mehr.
  en: Later, as we shall see, the power of the State intervened several times to protect them from the money-greed of the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.19.8
  kind: p
  original: Später trat, wie wir sehen werden, die gesetzgebende Gewalt noch mehrere Male zum Schutz der Kinder gegen die Geldwut der Bourgeoisie auf.
  en: ''
  joined_to: VI.19.7
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '374'
- id: VI.20.1
  kind: p
  original: Die große Sterblichkeit unter den Kindern der Arbeiter und speziell der Fabrikarbeiter ist Beweis genug von der Ungesundheit der Lage, in der sie ihre ersten Jahre verbringen.
  en: The great mortality among children of the working-class, and especially among those of the factory operatives, is proof enough of the unwholesome conditions under which they pass their first year.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: VI.20.2
  kind: p
  original: Diese Ursachen wirken auch auf diejenigen Kinder, welche am Leben bleiben, nur natürlich nicht ganz so stark wie auf die, welche ihnen zum Opfer fallen.
  en: These influences are at work, of course, among the children who survive, but not quite so powerfully as upon those who succumb.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: VI.20.3
  kind: p
  original: Die Wirkung derselben ist also im gelindesten Fall eine Krankheitsanlage oder eine gehemmte Entwicklung und daher eine geringere Körperstärke als die normale.
  en: The result in the most favourable case is a tendency to disease, or some check in development, and consequent less than normal vigour of the constitution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: VI.20.4
  kind: p
  original: Das neunjährige Kind eines Fabrikarbeiters, das unter Mangel, Entbehrung und wechselnden Verhältnissen, in Nässe, Kälte und ungenügender Kleidung und Wohnung aufgewachsen ist, hat bei weitem nicht die Arbeitsfähigkeit des in gesunderer Lebenslage erzogenen Kindes.
  en: A nine years old child of a factory operative that has grown up in want, privation, and changing conditions, in cold and damp, with insufficient clothing and unwholesome dwellings, is far from having the working force of a child brought up under healthier conditions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: VI.20.5
  kind: p
  original: Mit dem neunten Jahre wird es in die Fabrik geschickt, arbeitet täglich 6 1/2 Stunden (früher 8, noch früher 12 bis 14, ja 16 Stunden) bis zum dreizehnten Jahre, von da an bis zum achtzehnten Jahre 12 Stunden.
  en: At nine years of age it is sent into the mill to work 6.5 hours (formerly 8, earlier still, 12 to 14, even 16 hours) daily, until the thirteenth year; then twelve hours until the eighteenth year.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: VI.20.6
  kind: p
  original: Die schwächenden Ursachen dauern fort, und die Arbeit tritt noch hinzu.
  en: The old enfeebling influences continue, while the work is added to them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '374'
- id: VI.20.7
  kind: p
  original: Es ist allerdings nicht zu leugnen, daß ein neunjähriges Kind, allenfalls auch das eines Arbeiters, eine tägliche Arbeit von 6 1/2 Stunden aushalten könne, ohne daß sittlicher und offenbar hierauf zu reduzierender Schaden an seiner Entwicklung geschehe; aber keinenfalls trägt der Aufenthalt in der dumpfigen, feuchten, oft feuchtheißen Fabrikatmosphäre zu seiner Gesundheit bei.
  en: It is not to be denied that a child of nine years, even an operative's child, can hold out through 6.5 hours' daily work, without any one being able to trace visible bad results in its development directly to this cause; but in no case can its presence in the damp, heavy air of the factory, often at once warm and wet, contribute to good health; and, in any case, it is unpardonable to sacrifice to the greed of an unfeeling bourgeoisie the time of children which should be devoted solely to their physical and mental development, withdraw them from school and the fresh air, in order to wear them out for the benefit of the manufacturers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 374-375
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.20.8
  kind: p
  original: Unverantwortlich aber bleibt es unter allen Umständen, die Zeit von Kindern, die rein der körperlichen und geistigen Entwicklung gewidmet sein sollte, der Habgier einer gefühllosen Bourgeoisie zu opfern, die Kinder der Schule und der freien Luft zu entziehen, um sie zum Vorteil der Herren Fabrikanten auszubeuten.
  en: ''
  joined_to: VI.20.7
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '375'
- id: VI.20.9
  kind: p
  original: 'Allerdings sagt die Bourgeoisie: Wenn wir die Kinder nicht in den Fabriken beschäftigen, so bleiben sie in Verhältnissen, die ihrer Entwicklung nicht günstig sind - und das ist im ganzen richtig -, aber was heißt das, auf seinen wahren Wert reduziert, als: Erst setzt die Bourgeoisie die Arbeiterkinder in schlechte Verhältnisse und beutet dann diese schlechten Verhältnisse noch zu ihrem Vorteil aus - sie beruft sich auf etwas, was ebensowohl ihre Schuld ist wie das Fabriksystem, sie entschuldigt die Sünde, die sie heute tut durch die, welche sie gestern getan hat.'
  en: 'The bourgeoisie says: "If we do not employ the children in the mills, they only remain under conditions unfavourable to their development;" and this is true, on the whole. But what does this mean if it is not a confession that the bourgeoisie first places the children of the working-class under unfavourable conditions, and then exploits these bad conditions for its own benefit, appeals to that which is as much its own fault as the factory system, excuses the sin of to-day with the sin of yesterday?'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.20.10
  kind: p
  original: Und wenn das Fabrikgesetz nicht wenigstens einigermaßen ihnen die Hände fesselte, wie würden diese "wohlwollendenden", "humanen" Bourgeois, die ihre Fabriken eigentlich nur zum Wohl der Arbeiter errichtet haben, die Interessen dieser Arbeiter wahrnehmen!
  en: And if the Factory Act did not in some measure fetter their hands, how this "humane," this "benevolent" bourgeoisie, which has built its factories solely for the good of the working-class, would take care of the interests of these workers!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: VI.20.11
  kind: p
  original: Hören wir, wie sie es getrieben haben, ehe ihnen der Fabrikinspektor auf den Fersen saß; ihr eignes anerkanntes Zeugnis, der Bericht der Fabrikkommission von 1833, soll sie schlagen.
  en: Let us hear how they acted before the factory inspector was at their heels. Their own admitted testimony shall convict them in the report of the Factories' Inquiry Commission of 1833.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.21.1
  kind: p
  original: Der Bericht der Zentralkommission erzählt, daß die Fabrikanten Kinder selten mit fünf, häufig mit sechs, sehr oft mit sieben, meist mit acht bis neun Jahren zu beschäftigen anfingen, daß die Arbeitszeit oft 14 bis 16 Stunden (außer Freistunden zu Mahlzeiten) täglich daure, daß die Fabrikanten es zuließen, daß die Aufseher die Kinder schlugen und mißhandelten, ja oft selbst tätige Hand anlegten; ein Fall wird sogar erzählt, wo ein schottischer Fabrikant einem entlaufenen sechzehnjährigen Arbeiter nachritt, ihn zwang, so rasch, wie das Pferd trabte, vor ihm her zurückzulaufen, und fortwährend mit einer langen Peitsche auf ihn loshieb!
  en: The report of the Central Commission relates that the manufacturers began to employ children rarely of five years, often of six, very often of seven, usually of eight to nine years; that the working-day often lasted fourteen to sixteen hours, exclusive of meals and intervals; that the manufacturers permitted overlookers to flog and maltreat children, and often took an active part in so doing themselves. One case is related of a Scotch manufacturer, who rode after a sixteen years old runaway, forced him to return running after the employer as fast as the master's horse trotted, and beat him the whole way with a long whip.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
  en_note: 'English note {151}: Stuart Evidence, p. 35.'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: VI.21.2
  kind: p
  original: (Stuart, evid. p. 35.)
  en: ''
  joined_to: VI.21.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '375'
- id: VI.21.3
  kind: p
  original: In den großen Städten, wo die Arbeiter sich mehr widersetzten, fiel dergleichen allerdings weniger vor.
  en: In the large towns where the operatives resisted more vigorously, such things naturally happened less often.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: VI.21.4
  kind: p
  original: Aber selbst diese lange Arbeitszeit genügte der Habsucht der Kapitalisten nicht.
  en: But even this long working-day failed to satisfy the greed of the capitalists.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: VI.21.5
  kind: p
  original: Es galt, das in Gebäuden und Maschinen steckende Kapital mit allen möglichen Mitteln rentbar zu machen, es so stark wie möglich arbeiten zu lassen.
  en: Their aim was to make the capital invested in the building and machinery produce the highest return, by every available means, to make it work as actively as possible.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
- id: VI.21.6
  kind: p
  original: Die Fabrikanten führten daher das schändliche System des Nachtarbeitens ein; bei einigen waren zwei stehende Klassen von Arbeitern, jede so stark, um die ganze Fabrik besetzen zu können, und die eine Klasse arbeitete die zwölf Tages-, die andre die zwölf Nachtstunden.
  en: Hence the manufacturers introduced the shameful system of night-work. Some of them employed two sets of operatives, each numerous enough to fill the whole mill, and let one set work the twelve hours of the day, and the other twelve hours of the night.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '375'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.21.7
  kind: p
  original: Man kann sich leicht denken, welche Folgen eine solche dauernde Beraubung der Nachtruhe, die durch keinen Tagesschlaf zu ersetzen ist, auf die körperliche Lage namentlich kleiner und größerer Kinder und selbst Erwachsener, haben mußte.
  en: It is needless to picture the effect upon the frames of young children, and even upon the health of young persons and adults, produced by permanent loss of sleep at night, which cannot be made good by any amount of sleep during the day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 375-376
- id: VI.21.8
  kind: p
  original: Aufreizung des ganzen Nervensystems, verbunden mit allgemeiner Schwächung und Erschlaffung des ganzen Körpers, waren die notwendigen Resultate.
  en: Irritation of the whole nervous system, with general lassitude and enfeeblement of the entire frame, were the inevitable results, with the fostering of temptation to drunkenness and unbridled sexual indulgence. One manufacturer testifies that during the two years in which night-work was carried on in his factory, the number of illegitimate children born was doubled, and such general demoralisation prevailed that he was obliged to give up night-work.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
  en_note: 'English note {152a}: Tufnell Evidence, p. 91.'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: VI.21.9
  kind: p
  original: 'Dazu die Beförderung und Aufreizung der Trunksucht, des regellosen Geschlechtsverkehrs: ein Fabrikant bezeugt (Tufnell, evid. p. 91), daß während zwei Jahren, wo in seiner Fabrik nachts gearbeitet wurde, die doppelte Zahl unehelicher Kinder geboren und überhaupt eine solche Demoralisation produziert wurde, daß er das Nachtarbeiten habe aufgeben müssen.'
  en: ''
  joined_to: VI.21.8
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '376'
- id: VI.21.10
  kind: p
  original: Andre Fabrikanten verfuhren noch barbarischer, ließen viele Arbeiter 30 bis 40 Stunden durcharbeiten, und das wöchentlich mehrere Male, indem ihre Ersatzmannschaft nicht vollzählig war, sondern nur den Zweck hatte, immer einen Teil der Arbeiter zu ersetzen und ihm ein paar Stunden Schlaf zu erlauben.
  en: Other manufacturers were yet more barbarous, requiring many hands to work thirty to forty hours at a stretch, several times a week, letting them get a couple of hours sleep only, because the night-shift was not complete, but calculated to replace a part of the operatives only.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
- id: VI.21.11
  kind: p
  original: Die Berichte der Kommission über diese Barbarei und ihre Folge übertreffen alles, was mir sonst in diesem Fach bekannt ist.
  en: The reports of the Commission touching this barbarism surpass everything that is known to me in this line.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
- id: VI.21.12
  kind: p
  original: Solche Scheußlichkeiten, wie hier erzählt werden, finden sich nirgends wieder und wir werden sehen, daß die Bourgeoisie das Zeugnis der Kommission fortwährend als zu ihren Gunsten in Anspruch nimmt.
  en: Such infamies, as are here related, are nowhere else to be found--yet we shall see that the bourgeoisie constantly appeals to the testimony of the Commission as being in its own favour.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
- id: VI.21.13
  kind: p
  original: 'Die Folgen hiervon traten bald genug hervor: Die Kommissäre erzählen von einer Menge Krüppel, die ihnen vorgekommen seien und die entschieden der langen Arbeitszeit ihre Verkrüppelung zu verdanken hätten.'
  en: The consequences of these cruelties became evident quickly enough. The Commissioners mention a crowd of cripples who appeared before them, who clearly owed their distortion to the long working-hours.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.21.14
  kind: p
  original: 'Diese Verkrüppelung besteht gewöhnlich aus Verkrümmung des Rückgrats und der Beine und wird von Francis Sharp M. R. C. S. (Mitglied des königlichen Kollegiums der Wundärzte) in Leeds folgendermaßen beschrieben:'
  en: 'This distortion usually consists of a curving of the spinal column and legs, and is described as follows by Francis Sharp, M.R.C.S., of Leeds:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
  en_note: 'English note {152b}: Dr. Loudon Evidence, pp. 12, 13.'
- id: VI.22.1
  kind: p
  original: '"Ich sah die eigentümliche Verdrehung der untern Enden des Schenkelknochen nie, bevor ich nach Leeds kam.'
  en: '"I never saw the peculiar bending of the lower ends of the thigh bones before I came to Leeds.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
- id: VI.22.2
  kind: p
  original: Anfangs glaubte ich, es sei Rachitis, aber die Menge der sich im Spital präsentierenden Patienten und das Vorkommen der Krankheit in einem Alter (8 bis 14 Jahre), in welchem Kinder gewöhnlich nicht mehr der Rachitis unterworfen sind, sowie der Umstand, daß das Übel erst angefangen hatte, seitdem die Kinder in der Fabrik arbeiteten, bewogen mich bald, meine Meinung zu ändern.
  en: At first I thought it was rachitis, but I was soon led to change my opinion in consequence of the mass of patients who presented themselves at the hospital, and the appearances of the disease at an age (from the fourteenth to the eighteenth year) in which children are usually not subject to rachitis, as well as by the circumstance that the malady had first appeared after children began to work in the mills.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
- id: VI.22.3
  kind: p
  original: Ich habe bis jetzt ungefähr hundert solcher Fälle gesehen und kann aufs entschiedenste aussprechen, daß sie die Folge von Überarbeitung sind; soviel ich weiß, waren es alles Fabrikkinder, und sie selbst schreiben das Übel jener Ursache zu.
  en: Thus far I have seen about a hundred such cases, and can, most decidedly, express the opinion that they are the consequences of overwork. So far as I know they were all mill children, and themselves attributed the evil to this cause.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.22.4
  kind: p
  original: '- Die Anzahl der mir vorgekommenen Fälle von verkrümmtem Rückgrat, offenbar die Folge von zu langem Aufrechtstehen, wird nicht geringer als dreihundert sein" (Dr. Loudon, evid. p. 12, 13).'
  en: The number of cases of curvature of the spine which have fallen under my observation, and which were evidently consequent upon too protracted standing, was not less than three hundred."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
- id: VI.23.1
  kind: p
  original: 'Ebenso Dr. Hey in Leeds, 18 Jahre lang Arzt am Krankenhause:'
  en: 'Precisely similar is the testimony of Dr. Ray, for eighteen years physician in the hospital in Leeds:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '376'
  en_note: 'English note {153a}: Dr. Loudon Evidence, p. 16.'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.24.1
  kind: p
  original: '"Verbildungen des Rückgrats sehr häufig unter den Fabrikleuten.'
  en: ''
  joined_to: VI.23.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '376'
- id: VI.24.2
  kind: p
  original: Einige die Folgen bloßer Überarbeitung, andere die Wirkung von langer Arbeit auf eine ursprünglich schwache oder durch schlechte Nahrung geschwächte Konstitution."
  en: '"Malformations of the spine are very frequent among mill-hands; some of them consequent upon mere overwork, others the effect of long work upon constitutions originally feeble, or weakened by bad food.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 376-377
- id: VI.24.3
  kind: p
  original: '"Verkrüppelungen schienen häufiger zu sein als diese Krankheiten; die Knie waren nach innen gebeugt, die Bänder der Knöchel sehr häufig aufgelockert und erschlafft und die langen Knochen der Beine gebogen.'
  en: Deformities seem even more frequent than these diseases; the knees were bent inward, the ligaments very often relaxed and enfeebled, and the long bones of the legs bent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: VI.24.4
  kind: p
  original: Besonders waren die dicken Enden dieser langen Knochen verdreht und übermäßig entwickelt, und diese Patienten kamen von den Fabriken, in welchen häufig sehr lange gearbeitet wurde" (Dr. Loudon, evid. p. 16).
  en: The thick ends of these long bones were especially apt to be bent and disproportionately developed, and these patients came from the factories in which long work-hours were of frequent occurrence."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: VI.25.1
  kind: p
  original: Dasselbe sagen die Wundärzte Beaumont und Sharp von Bradford aus.
  en: Surgeons Beaumont and Sharp, of Bradford, bear the same testimony.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: VI.25.2
  kind: p
  original: Die Berichte der Kommissäre Drinkwater, Power und Dr. Loudon enthalten eine Menge, die von Tufnell und Dr. Sir David Barry, die sich weniger auf diesen Punkt richten, einzelne Beispiele solcher Verkrümmungen (Drinkwater, evid. p. 69 zwei Brüder, p. 72, 80, 146, 148, 150 zwei Brüder, 155 und viele andere; Power, evid. p. 63, 66, 67 zweimal, 68 dreimal, 69 zweimal; in Leeds p. 29, 31, 40, 43, 53 ff.; Dr. Loudon, evid. p. 4, 7 viermal, 8 mehrere Male etc.; Sir D. Barry, p. 6, 8, 13, 21, 22, 44, 55 dreimal etc.; Tufnell, p. S, 16 etc.).
  en: The reports of Drinkwater, Power, and Dr. Loudon contain a multitude of examples of such distortions, and those of Tufnell and Sir David Barry, which are less directed to this point, give single examples.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
  en_note: 'English note {153b}: Drinkwater Evidence, pp. 72, 80, 146, 148, 150 (two brothers); 69 (two brothers); 155, and many others. Power Evidence, pp. 63, 66, 67 (two cases); 68 (three cases); 69 (two cases); in Leeds, pp. 29, 31, 40, 43, 53, et seq. Loudon Evidence, pp. 4, 7 (four cases); 8 (several cases), etc. Sir D. Barry Evidence, pp. 6, 8, 13, 21, 22, 44, 55 (three cases), etc. Tufnell Evidence, pp. 5, 6, 16, etc.'
  review: true
  review_reason: length/anchor mismatch, check the match
- id: VI.25.3
  kind: p
  original: Die Kommissäre für Lancashire, Cowell, Tufnell und Dr. Hawkins, haben diese Seite der medizinischen Resultate des Fabriksystems fast ganz vernachlässigt, obwohl dieser Distrikt vollkommen mit Yorkshire in der Anzahl von Krüppeln wetteifern kann.
  en: The Commissioners for Lancashire, Cowell, Tufnell, and Hawkins, have almost wholly neglected this aspect of the physiological results of the factory system, though this district rivals Yorkshire in the number of cripples.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: VI.25.4
  kind: p
  original: Ich bin selten durch Manchester gegangen, ohne drei bis vier Krüppeln zu begegnen, die gerade an denselben Verkrümmungen des Rückgrats und der Beine litten wie die beschriebenen, und ich habe oft genug gerade hierauf geachtet und achten können.
  en: I have seldom traversed Manchester without meeting three or four of them, suffering from precisely the same distortions of the spinal columns and legs as that described, and I have often been able to observe them closely.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: VI.25.5
  kind: p
  original: Ich kenne selbst einen Krüppel, der genau der obigen Beschreibung von Dr. Hey entspricht und der sich seinen Zustand in der Fabrik des Herrn Douglas in Pendleton, die überhaupt bei den Arbeitern wegen der früheren langen, Nächte hindurch fortgesetzten Arbeitszeit noch im schönsten Rufe steht, geholt hat.
  en: I know one personally who corresponds exactly with the foregoing description of Dr. Ray, and who got into this condition in Mr. Douglas' factory in Pendleton, an establishment which enjoys an unenviable notoriety among the operatives by reason of the former long working periods continued night after night.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
- id: VI.25.6
  kind: p
  original: Man sieht es auch dieser Art von Krüppeln gleich an, woher ihre Verbildung kommt, sie sehen alle ganz gleich aus, die Knie sind einwärts und rückwärts, die Füße einwärts gebogen, die Gelenke mißgestaltet und dick und oft das Rückgrat vorwärts oder seitwärts gekrümmt.
  en: It is evident, at a glance, whence the distortions of these cripples come; they all look exactly alike. The knees are bent inward and backwards, the ankles deformed and thick, and the spinal column often bent forwards or to one side.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.25.7
  kind: p
  original: Am ärgsten aber scheinen es die menschenfreundlichen Fabrikanten im Seidendistrikt von Macclesfield getrieben zu haben, was mit daher kommt, daß in diesen Fabriken sehr junge Kinder, von fünf und sechs Jahren, arbeiteten.
  en: But the crown belongs to the philanthropic manufacturers of the Macclesfield silk district. They employed the youngest children of all, even from five to six years of age.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '377'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.25.8
  kind: p
  original: In den nachträglichen Zeugnissen des Kommissärs Tufnell finden wir die Aussagen eines Fabrikdirigenten Wright (p. 26), dessen beide Schwestern aufs schändlichste verkrüppelt wurden und der einmal die Anzahl von Krüppeln in mehreren Straßen, einige darunter die reinlichsten und nettesten von Macclesfield, gezählt hatte; er fand in Townley Street zehn, George Street fünf, Charlotte Street vier, Watercots fünfzehn, Bank Top drei, Lord Street sieben, Mill Lane zwölf, Great George Street zwei, im Armenhause zwei, Park Green einen, Pickford Street zwei Krüppel, deren Familien alle einstimmig erklärten, daß diese durch übermäßige Arbeit in den Seidentramierfabriken verwachsen seien.
  en: In the supplementary testimony of Commissioner Tufnell, I find the statement of a certain factory manager Wright, both of whose sisters were most shamefully crippled, and who had once counted the cripples in several streets, some of them the cleanest and neatest streets of Macclesfield. He found in Townley Street ten, George Street five, Charlotte Street four, Watercots fifteen, Bank Top three, Lord Street seven, Mill Lane twelve, Great George Street two, in the workhouse two, Park Green one, Peckford Street two, whose families all unanimously declared that the cripples had become such in consequence of overwork in the silk-twisting mills.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 377-378
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.25.9
  kind: p
  original: P. 27 wird ein Knabe vorgeführt, der so verwachsen war, daß er keine Treppe hinaufkommen konnte, und Beispiele von Mädchen erwähnt, die in Rücken und Hüften verkrüppelt seien.
  en: One boy is mentioned so crippled as not to be able to go upstairs, and girls deformed in back and hips.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: VI.26.1
  kind: p
  original: Andere Verbildungen sind ebenfalls aus dieser Überarbeitung hervorgegangen, besonders Plattfüßigkeit, die dem Sir D. Barry häufig vorkam (z.B. p. 21 zweimal ff.) und ebenfalls von den Ärzten und Wundärzten in Leeds (Loudon, p. 13, 16 etc.) als häufig vorkommend angegeben wird.
  en: Other deformities also have proceeded from this overwork, especially flattening of the foot, which Sir D. Barry frequently observed, as did the physicians and surgeons in Leeds.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
  en_note: 'English note {154a}: Factories'' Inquiry Commission''s Report, 1836, Sir D. Barry Evidence, p. 21 (two cases). English note {154b}: Factories'' Inquiry Commission''s Report, 1836, Loudon Evidence, pp. 13, 16, etc.'
- id: VI.26.2
  kind: p
  original: In den Fällen, wo eine stärkere Konstitution, eine bessere Nahrung und sonstige Umstände den jungen Arbeiter befähigten, diesen Einwirkungen einer barbarischen Ausbeutung zu widerstehen, finden wir wenigstens Schmerzen in Rücken, Hüften und Beinen, geschwollene Knöchel, varikose Adern oder große, hartnäckige Geschwüre an den Schenkeln und Waden.
  en: In cases, in which a stronger constitution, better food, and other more favourable circumstances enabled the young operative to resist this effect of a barbarous exploitation, we find, at least, pain in the back, hips, and legs, swollen joints, varicose veins, and large, persistent ulcers in the thighs and calves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: VI.26.3
  kind: p
  original: Diese Übel sind fast allgemein bei den Arbeitern gefunden worden; die Berichte Stuarts, Mackintoshs, Sir D. Barrys enthalten Hunderte von Beispielen, ja sie wissen fast von keinem, der nicht an irgendeinem dieser Übel litte; und in den übrigen Berichten wird das Vorkommen derselben Folgen wenigstens von vielen Ärzten bezeugt.
  en: These affections are almost universal among the operatives. The reports of Stuart, Mackintosh, and Sir D. Barry contain hundreds of examples; indeed, they know almost no operative who did not suffer from some of these affections; and in the remaining reports, the occurrence of the same phenomena is attested by many physicians.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.26.4
  kind: p
  original: Die Berichte über Schottland stellen es außer Zweifel durch zahllose Beispiele, daß dreizehnstündige Arbeit noch bei achtzehnbis zweiundzwanzigjährigen männlichen und weiblichen Arbeitern wenigstens diese Folgen hervorbringt, und zwar sowohl in den Flachsspinnereien von Dundee und Dunfermline wie in den Baumwollfabriken von Glasgow und Lanark.
  en: The reports covering Scotland place it beyond all doubt, that a working-day of thirteen hours, even for men and women from eighteen to twenty-two years of age, produces at least these consequences, both in the flax-spinning mills of Dundee and Dunfermline, and in the cotton mills of Glasgow and Lanark.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: VI.27.1
  kind: p
  original: Alle diese Übel erklären sich leicht aus der Natur der Fabrikarbeit, die allerdings, wie die Fabrikanten sagen, sehr "leicht" ist, aber eben wegen ihrer Leichtigkeit erschlaffender als irgendeine andere.
  en: All these affections are easily explained by the nature of factory-work, which is, as the manufacturers say, very "light," and precisely by reason of its lightness, more enervating than any other.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: VI.27.2
  kind: p
  original: Die Arbeiter haben wenig zu tun, müssen aber die ganze Zeit stehen, ohne sich setzen zu können.
  en: The operatives have little to do, but must stand the whole time.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: VI.27.3
  kind: p
  original: Wer sich etwa auf eine Fensterbank oder einen Korb setzt, wird gestraft; und diese dauernde aufrechte Stellung, dieser fortwährende mechanische Druck des Oberkörpers auf Rückgrat, Hüften und Beine bringt ganz notwendig die erwähnten Folgen hervor.
  en: Any one who sits down, say upon a window-ledge or a basket, is fined, and this perpetual upright position, this constant mechanical pressure of the upper portions of the body upon spinal column, hips, and legs, inevitably produces the results mentioned.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '378'
- id: VI.27.4
  kind: p
  original: Dies Stehen ist allerdings nicht notwendig zur Arbeit, wie denn auch in Nottingham in den Dublierzimmern wenigstens Sitze eingeführt sind (die Folge davon war die Abwesenheit jener Übel und folglich die Willigkeit der Arbeiterinnen, lange Arbeitszeit mitzumachen), aber in einer Fabrik, wo der Arbeiter nur für den Bourgeois arbeitet und wenig Interesse daran hat, seine Arbeit gut zu tun, würde er allerdings wahrscheinlich mehr Gebrauch davon machen, als dem Fabrikanten angenehm und vorteilhaft wäre - und damit dem Bourgeois etwas weniger rohes Material verdorben wird, müssen die Arbeiter die Gesundheit ihrer Glieder opfern.
  en: This standing is not required by the work itself, and at Nottingham chairs have been introduced, with the result that these affections disappeared, and the operatives ceased to object to the length of the working-day. But in a factory where the operative works solely for the bourgeois, and has small interest in doing his work well, he would probably use the seats more than would be agreeable and profitable to the manufacturer; and in order that somewhat less raw material may be spoiled for the bourgeois, the operative must sacrifice health and strength.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N9
  mew_page: 378-379
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.27.5
  kind: p
  original: Diese lang anhaltende aufrechte Stellung bringt aber außerdem noch in Verbindung mit der meist schlechten Atmosphäre der Fabriken eine bedeutende Erschlaffung aller Körperkräfte und in deren Gefolge allerlei andere weniger lokale als generelle Übel hervor.
  en: This long protracted upright position, with the bad atmosphere prevalent in the mills, entails, besides the deformities mentioned, a marked relaxation of all vital energies, and, in consequence, all sorts of other affections general rather than local.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '379'
- id: VI.27.6
  kind: p
  original: Die Atmosphäre der Fabriken ist gewöhnlich zu gleicher Zeit feucht und warm, meist wärmer als nötig ist, und bei nicht sehr guter Ventilation sehr unrein, dumpfig und von geringem Sauerstoffgehalt, angefüllt mit Staub und dem Dunst des Maschinenöls, das fast überall denn Boden beschmutzt, in ihn hereinzieht und ranzig wird; die Arbeiter selbst sind schon wegen der Wärme nicht zu dicht bekleidet und würden sich daher bei Ungleichmäßigkeit der Temperatur im Zimmer notwendig erkälten; der Luftzug ist ihnen in der Wärme unangenehm, die allmähliche Erschlaffung, die über alle körperlichen Funktionen schleicht, verringert die animalische Wärme, die von außenher aufrechterhalten werden muß, und so ist dem Arbeiter selbst nichts lieber, als wenn er bei gänzlich geschlossenen Fenstern in seiner warmen Fabrikluft bleiben kann.
  en: 'The atmosphere of the factories is, as a rule, at once damp and warm, unusually warmer than is necessary, and, when the ventilation is not very good, impure, heavy, deficient in oxygen, filled with dust and the smell of the machine oil, which almost everywhere smears the floor, sinks into it, and becomes rancid. The operatives are lightly clad by reason of the warmth, and would readily take cold in case of irregularity of the temperature; a draught is distasteful to them, the general enervation which gradually takes possession of all the physical functions diminishes the animal warmth: this must be replaced from without, and nothing is therefore more agreeable to the operative than to have all the doors and windows closed, and to stay in his warm factory-air.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '379'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.27.7
  kind: p
  original: Hierzu tritt dann noch die Wirkung häufigen plötzlichen Temperaturwechsels beim Herausgehen aus der heißen Fabrikatmosphäre in die frostkalte oder naßkalte freie Luft, die Unfähigkeit der Arbeiter, sich genügend gegen Regen zu schützen oder die nassen Kleider mit trocknen zu vertauschen, alles Umstände, die fortwährend Erkältungen produzieren.
  en: Then comes the sudden change of temperature on going out into the cold and wet or frosty atmosphere, without the means of protection from the rain, or of changing wet clothing for dry, a circumstance which perpetually produces colds.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '379'
- id: VI.27.8
  kind: p
  original: Und wenn man bedenkt, daß bei alledem fast kein einziger Muskel des Körpers wirklich angestrengt, wirklich in Tätigkeit gesetzt wird, außer etwa denen der Beine, daß der erschlaffenden, abspannenden Wirkung der genannten Umstände gar nichts entgegentritt, sondern daß alle Übung fehlt, die den Muskeln Kraft, den Fibern Elastizität und Konsistenz geben könnte, daß von Jugend auf den Arbeitern alle Zeit zur Bewegung in freier Luft abgeht, so wird man sich nicht mehr über die fast einstimmige Aussage der Mediziner im Fabrikbericht wundern, daß sie bei Fabrikarbeitern ganz besonders eine große Widerstandslosigkeit gegen Krankheitsanfälle, eine allgemeine Depression aller Lebenstätigkeiten, eine fortwährende Abspannung aller geistigen und körperlichen Kräfte gefunden hätten.
  en: And when one reflects that, with all this, not one single muscle of the body is really exercised, really called into activity, except perhaps those of the legs; that nothing whatsoever counteracts the enervating, relaxing tendency of all these conditions; that every influence is wanting which might give the muscles strength, the fibres elasticity and consistency; that from youth up, the operative is deprived of all fresh air recreation, it is impossible to wonder at the almost unanimous testimony of the physicians in the Factories' Report, that they find a great lack of ability to resist disease, a general depression in vital activity, a constant relaxation of the mental and physical powers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '379'
- id: VI.27.9
  kind: p
  original: 'Hören wir zuerst Sir D. Barry:'
  en: 'Let us hear Sir D. Barry first:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '379'
  en_note: 'English note {156}: General report by Sir D. Barry.'
- id: VI.28.1
  kind: p
  original: '"Die ungünstigen Einflüsse der Fabrikarbeit auf die Arbeiter sind folgende: 1. die umgängliche Notwendigkeit, ihre körperlichen und geistigen Anstrengungen zu einem gleichen Schritt mit den Bewegungen einer durch gleichmäßige und unaufhörliche Kraft bewegten Maschinerie zu zwingen; 2. die Ausdauer in einer aufrechten Stellung während unnatürlich langer und zu schnell aufeinanderfolgender Zeiträume; 3. Die Beraubung des Schlafs (durch lange Arbeitszeit, Schmerzen in den Beinen und allgemeineres körperliches Unwohlsein).'
  en: '"The unfavourable influences of mill-work upon the hands are the following: (1) The inevitable necessity of forcing their mental and bodily effort to keep pace with a machine moved by a uniform and unceasing motive power. (2) Continuance in an upright position during unnaturally long and quickly recurring periods. (3) Loss of sleep in consequence of too long working-hours, pain in the legs, and general physical derangement.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 379-380
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VI.28.2
  kind: p
  original: Hierzu kommen oft noch niedrige, gedrängte, staubige oder feuchte Arbeitszimmer, unreine Luft, erhitzte Atmosphäre, fortwährender Schweiß.
  en: To these are often added low, crowded, dusty, or damp workrooms, impure air, a high temperature, and constant perspiration.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: VI.28.3
  kind: p
  original: Daher verlieren besonders Knaben, mit sehr wenigen Ausnahmen, sehr bald die rosige Frische der Kindheit und werden blässer und dünner als andere Knaben.
  en: Hence the boys especially very soon and with but few exceptions, lose the rosy freshness of childhood, and become paler and thinner than other boys.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: VI.28.4
  kind: p
  original: Selbst der Schuljunge des Handwebers, der mit nackten Füßen auf dem Lehmfußboden seiner Webstube steht, behält ein besseres Aussehen, weil er zuweilen etwas an die freie Luft geht.
  en: Even the hand-weaver's bound boy, who sits before his loom with his bare feet resting upon the clay-floor, retains a fresher appearance, because he occasionally goes into the fresh air for a time.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: VI.28.5
  kind: p
  original: Aber das Fabrikkind hat keinen Augenblick frei, außer zum Essen, und kommt nie in die freie Luft, außer wenn es essen geht.
  en: But the mill child has not a moment free except for meals, and never goes into the fresh air except on its way to them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: VI.28.6
  kind: p
  original: Alle erwachsenen männlichen Spinner sind blaß und dünn, sie leiden an kapriziösem Appetit und Unverdaulichkeit, und da sie alle von Jugend auf in der Fabrik erzogen und wenig oder gar keine hochgewachsenen, athletischen Männer unter ihnen sind, so ist der Schluß gerechtfertigt, daß ihre Beschäftigung sehr ungünstig für die Entwicklung der männlichen Konstitution ist.
  en: All adult male spinners are pale and thin, suffer from capricious appetite and indigestion; and as they are all trained in the mills from their youth up, and there are very few tall, athletic men among them, the conclusion is justified that their occupation is very unfavourable for the development of the male constitution; females bear this work far better."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: VI.28.7
  kind: p
  original: Weiber ertragen die Arbeit weit besser" (ganz natürlich, wir werden aber sehen, daß auch sie ihre Krankheiten haben).
  en: (Very naturally. But we shall see that they have their own diseases.)
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: VI.28.8
  kind: p
  original: (General Report by Sir D. Barry.)
  en: 'So, too, Power:'
  modern: ''
