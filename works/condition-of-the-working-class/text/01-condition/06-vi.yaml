- id: VI.N10.1.1
  kind: note
  original: Die sogenannten Wundärzte (surgeons) sind studierte Mediziner, geradesogut wie die promovierten Ärzte (physicians), und haben deshalb auch allgemein sowohl ärztliche wie wundärztliche Praxis.
  en: The surgeons in England are scientifically educated as well as the physicians, and have, in general, medical as well as surgical practice.
  modern: ''
  modern_status: empty
  notes: ''
  en_note: English note {157b}.
- id: VI.N10.1.2
  kind: note
  original: Sie werden im allgemeinen aus verschiedenen Gründen sogar den physicians vorgezogen.
  en: They are in general, for various reasons, preferred to the physicians.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N11.1.1
  kind: note
  original: Diese Aussage ist nicht dem Fabrikbericht entnommen.
  en: This statement is not taken from the report.
  modern: ''
  modern_status: empty
  notes: ''
  en_note: English note {159a}.
- id: VI.N12.1.1
  kind: note
  original: Alles der Rede von Lord Ashley (Unterhaussitzung vom 15. März 1844) entnommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
