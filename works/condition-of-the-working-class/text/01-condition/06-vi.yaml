- id: VI.N19.1.1
  kind: note
  original: Ich habe weder Zeit noch Raum, mich weitläufig auf die Entgegnungen der Fabrikanten auf die gegen sie seit zwölf Jahren gerichteten Anklagen einzulassen.
  en: I have neither time nor space to deal in detail with the replies of the manufacturers to the charges made against them for twelve years past.
  modern: ''
  modern_status: empty
  notes: ''
  en_note: English note {186}.
- id: VI.N19.1.2
  kind: note
  original: Die Leute sind nun einmal nicht zu belehren, weil ihr vermeintliches Interesse sie blendet.
  en: These men will not learn because their supposed interest blinds them.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N19.1.3
  kind: note
  original: 'Da ohnehin in obigem manche ihrer Einwände schon gelegentlich beseitigt sind, so bleibt mir nur folgendes zu sagen:'
  en: 'As, moreover, many of their objections have been met in the foregoing, the following is all that it is necessary for me to add:'
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N19.2.1
  kind: note
  original: Ihr kommt nach Manchester, ihr wollt die englischen Zustände kennenlernen.
  en: You come to Manchester, you wish to make yourself acquainted with the state of affairs in England.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N19.2.2
  kind: note
  original: Ihr habt gute Empfehlungen an "respektable" Leute, natürlich.
  en: You naturally have good introductions to respectable people.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N19.2.3
  kind: note
  original: Ihr laßt einige Äußerungen über die Lage der Arbeiter fallen.
  en: You drop a remark or two as to the condition of the workers.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N19.2.4
  kind: note
  original: Man macht euch mit ein paar der ersten liberalen Fabrikanten bekannt, etwa Robert Hyde Greg, Edmund Ashworth, Thomas Ashton, oder so.
  en: You are made acquainted with a couple of the first Liberal manufacturers, Robert Hyde Greg, perhaps, Edmund Ashworth, Thomas Ashton, or others.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N19.2.5
  kind: note
  original: Ihr erzählt ihm von euren Absichten.
  en: They are told of your wishes.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T15
    editions: '1845'
    reading: Man erzählt ihnen von seinen...
    base_text: … erzählt ihm von euren ‸ Absichten. …
- id: VI.N19.2.6
  kind: note
  original: Der Fabrikant versteht euch, er weiß, was er zu tun hat.
  en: The manufacturer understands you, knows what he has to do.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N19.2.7
  kind: note
  original: Er fährt mit euch auf seine Fabrik auf dem Lande - Herr Greg nach Quarry-Bank in Cheshire, Herr Ashworth nach Turton bei Bolton, Herr Ashton nach Hyde.
  en: He accompanies you to his factory in the country; Mr. Greg to Quarrybank in Cheshire, Mr. Ashworth to Turton near Bolton, Mr. Ashton to Hyde.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N19.2.8
  kind: note
  original: Er führt euch durch ein prächtiges, wohleingerichtetes, vielleicht mit Ventilatoren versehenes Gebäude, er macht euch auf die hoben, luftigen Räume, die schönen Maschinen, hier und da auf gesundaussehende Arbeiter aufmerksam.
  en: He leads you through a superb, admirably arranged building, perhaps supplied with ventilators, he calls your attention to the lofty, airy rooms, the fine machinery, here and there a healthy-looking operative.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N19.2.9
  kind: note
  original: Er gibt euch ein gutes Frühstück und schlägt euch vor, die Wohnungen der Arbeiter zu besuchen - er führt euch an die Cottages, die neu, reinlich und nett aussehen, und geht mit euch in diese und jene selbst hinein.
  en: He gives you an excellent lunch, and proposes to you to visit the operatives' homes; he conducts you to the cottages, which look new, clean and neat, and goes with you into this one and that one, naturally only to overlookers, mechanics, etc., so that you may see "families who live wholly from the factory."
  modern: ''
  modern_status: empty
  notes: ''
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.N19.2.10
  kind: note
  original: Natürlich nur zu den Aufsehern, Mechanikern usw., damit ihr "Familien seht, die ganz von der Fabrik leben".
  en: ''
  joined_to: VI.N19.2.9
  modern: ''
  modern_status: joined
  notes: ''
- id: VI.N19.2.11
  kind: note
  original: Bei den andern dürftet ihr ja finden, daß nur Frau und Kinder arbeiten und der Mann Strümpfe stopft.
  en: Among other families you might find that only wife and children work, and the husband darns stockings.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N19.2.12
  kind: note
  original: Die Gegenwart des Fabrikanten hindert euch, indiskrete Fragen zu tun; ihr findet die Leute alle gut bezahlt, komfortabel, von wegen der Landluft verhältnismäßig gesund, ihr fangt an, euch von euren überspannten Ideen von Elend und Hungersnot zu bekehren.
  en: The presence of the employer keeps you from asking indiscreet questions; you find every one well-paid, comfortable, comparatively healthy by reason of the country air; you begin to be converted from your exaggerated ideas of misery and starvation.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N19.2.13
  kind: note
  original: Daß aber das Cottagesystem die Arbeiter zu Sklaven macht, daß vielleicht ein Truckladen in der Nähe ist, das erfahrt ihr nicht, daß die Leute den Fabrikanten hassen, das zeigen sie euch nicht, weil er dabei ist.
  en: But, that the cottage system makes slaves of the operatives, that there may be a truck shop in the neighbourhood, that the people hate the manufacturer, this they do not point out to you, because he is present.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N19.2.14
  kind: note
  original: Er hat wohl gar auch Schule, Kirche, Lesezimmer etc. errichtet.
  en: He has built a school, church, reading-room, etc. That he uses the school to train children to subordination, that he tolerates in the reading-room such prints only as represent the interests of the bourgeoisie, that he dismisses his employees if they read Chartist or Socialist papers or books, this is all concealed from you.
  modern: ''
  modern_status: empty
  notes: ''
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.N19.2.15
  kind: note
  original: Daß er die Schule dazu gebraucht, die Kinder an die Subordination zu gewöhnen, daß er im Lesezimmer nur solche Sachen duldet, in denen das Interesse der Bourgeoisie vertreten wird, daß er seine Leute wegschickt, wenn sie chartistische und sozialistische Blätter und Bücher lesen - das ist euch all verborgen.
  en: ''
  joined_to: VI.N19.2.14
  modern: ''
  modern_status: joined
  notes: ''
- id: VI.N19.2.16
  kind: note
  original: Ihr seht ein behagliches, patriarchalisches Verhältnis, ihr seht das Leben der Aufseher, ihr seht was die Bourgeoisie den Arbeitern verspricht, wenn sie auch geistig ihre Sklaven werden wollen.
  en: You see an easy, patriarchal relation, you see the life of the overlookers, you see what the bourgeoisie promises the workers if they become its slaves, mentally and morally.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N19.2.17
  kind: note
  original: Diese "ländliche Fabrikation" ist von jeher das Steckenpferd der Fabrikanten gewesen, weil hier die Nachteile des Fabriksystems, besonders die sanitären, teilweise durch die freie Luft und Umgebung aufgehoben werden und weil hier die patriarchalische Knechtschaft der Arbeiter sich am längsten erhält.
  en: This "country manufacture" has always been what the employers like to show, because in it the disadvantages of the factory system, especially from the point of view of health, are, in part, done away with by the free air and surroundings, and because the patriarchal servitude of the workers can here be longest maintained.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N19.2.18
  kind: note
  original: Dr. Ure singt einen Dithyrambus darauf.
  en: Dr. Ure sings a dithyramb upon the theme.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N19.2.19
  kind: note
  original: Aber wehe, wenn die Arbeiter sich einfallen lassen, selbst zu denken und Chartisten zu werden - da hört die väterliche Zuneigung des Fabrikanten mit einem Male auf.
  en: But woe to the operatives to whom it occurs to think for themselves and become Chartists! For them the paternal affection of the manufacturer comes to a sudden end.
  modern: ''
  modern_status: empty
  notes: ''
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.N19.2.20
  kind: note
  original: Übrigens, wollt ihr etwa durch die Arbeiterviertel von Manchester geführt werden, wollt ihr die Ausbildung des Fabriksystems in einer Fabrikstadt sehen ja, da könnt ihr lange warten, bis euch diese reichen Bourgeois dabei behülflich sind!
  en: Further, if you should wish to be accompanied through the working-people's quarters of Manchester, if you should desire to see the development of the factory system in a factory town, you may wait long before these rich bourgeoisie will help you!
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N19.2.21
  kind: note
  original: Die Herren wissen nicht, was ihre Arbeiter wollen und in welcher Lage sie sind, und sie wollen, sie dürfen es nicht wissen, weil sie immer fürchten müssen, Dinge zu erfahren, bei denen sie unruhig werden oder gar ihrem Interesse zuwiderhandeln müßten.
  en: These gentlemen do not know in what condition their employees are nor what they want, and they dare not know things which would make them uneasy or even oblige them to act in opposition to their own interests.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N19.2.22
  kind: note
  original: Ist auch höchst gleichgültig - was die Arbeiter durchzuführen haben, setzen sie schon allein durch.
  en: 'But, fortunately, that is of no consequence: what the working-men have to carry out, they carry out for themselves.'
  modern: ''
  modern_status: empty
  notes: ''
