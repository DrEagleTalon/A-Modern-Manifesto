- id: VI.75.1
  kind: p
  original: Das Cottagesystem sieht viel unschuldiger aus und ist auch auf eine viel unschuldigere Weise entstanden, obwohl es dieselben knechtenden Wirkungen für den Arbeiter hat.
  en: The Cottage system looks much more innocent and arose in a much more harmless way, though it has the same enslaving influence upon the employee.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '403'
- id: VI.75.2
  kind: p
  original: In der Nähe der Fabriken auf dem Lande fehlt es oft an Wohnungen für die Arbeiter; der Fabrikant ist oft genötigt, solche Wohnungen zu bauen, und tut es gern, da sie ihm reichlichen Nutzen auf sein ausgelegtes Kapital einbringen.
  en: In the neighbourhood of the mills in the country, there is often a lack of dwelling accommodation for the operatives. The manufacturer is frequently obliged to build such dwellings and does so gladly, as they yield great advantages, besides the interest upon the capital invested.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '403'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.75.3
  kind: p
  original: Wenn die Eigentümer von Arbeitertcottages etwa 6 Prozent jährlich von ihrem Kapital bekommen, so kann man rechnen, daß die Cottages dem Fabrikanten das Doppelte eintragen, da er, solange seine Fabrik nicht gänzlich stillsteht, immer Mieter hat, und zwar solche Mieter, die stets bezahlen.
  en: If any owner of working-men's dwellings averages about six per cent. on his invested capital, it is safe to calculate that the manufacturer's cottages yield twice this rate; for so long as his factory does not stand perfectly idle he is sure of occupants, and of occupants who pay punctually.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '403'
- id: VI.75.4
  kind: p
  original: 'Er ist also von den beiden Hauptnachteilen frei, die die übrigen Hausbesitzer treffen: Er hat nie Cottages leer stehen und läuft kein Risiko.'
  en: He is therefore spared the two chief disadvantages under which other house-owners labour; his cottages never stand empty, and he runs no risk.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '403'
- id: VI.75.5
  kind: p
  original: Die Miete einer Cottage ist aber darnach berechnet, daß sie diese Nachteile deckt, und wenn der Fabrikant also dieselbe Miete nimmt wie die übrigen, so macht er mit 12 bis 14 Prozent ein brillantes Geschäft auf Unkosten der Arbeiter.
  en: But the rent of the cottages is as high as though these disadvantages were in full force, and by obtaining the same rent as the ordinary house-owner, the manufacturer, at cost of the operatives, makes a brilliant investment at twelve to fourteen per cent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '403'
- id: VI.75.6
  kind: p
  original: Denn es ist offenbar unrecht, daß er, wenn er im Häuservermieten Geschäfte macht, einen größeren, ja den doppelten Nutzen bezieht wie seine Konkurrenten und zu gleicher Zeit ihnen alle Möglichkeit nimmt, mit ihm zu konkurrieren.
  en: For it is clearly unjust that he should make twice as much profit as other competing house-owners, who at the same time are excluded from competing with him.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '403'
- id: VI.75.7
  kind: p
  original: Doppeltes Unrecht aber ist es, daß er diesen Nutzen aus der Tasche der besitzlosen Klasse bezieht, die über jeden Pfennig haushalten muß - doch das ist er ja gewohnt, dessen ganzer Reichtum auf Unkosten seiner Arbeiter erworben ist.
  en: But it implies a double wrong, when he draws his fixed profit from the pockets of the non-possessing class, which must consider the expenditure of every penny. He is used to that, however, he whose whole wealth is gained at the cost of his employees.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '403'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.75.8
  kind: p
  original: Aber das Unrecht wird zur Infamie, wenn der Fabrikant, wie es oft genug geschieht, die Arbeiter, die bei Strafe der Entlassung in seinen Häusern wohnen müssen, zur Bezahlung einer höheren als der gewöhnlichen Miete oder gar dazu zwingt, Miete für ein Haus zu bezahlen, das sie gar nicht bewohnen!
  en: But this injustice becomes an infamy when the manufacturer, as often happens, forces his operatives, who must occupy his houses on pain of dismissal, to pay a higher rent than the ordinary one, or even to pay rent for houses in which they do not live!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '403'
- id: VI.75.9
  kind: p
  original: Der "Halifax Guardian", zitiert im liberalen "Sun", behauptet, daß Hunderte von Arbeitern in Ashton-under-Lyne, Oldham und Rochdale usw. von ihren Brotherren genötigt seien, Miete für Häuser zu bezahlen, gleichviel ob sie diese Häuser bewohnten oder nicht.
  en: The Halifax Guardian, quoted by the Liberal Sun, asserts that hundreds of operatives in Ashton-under-Lyne, Oldham, and Rochdale, etc., are forced by their employers to pay house-rent whether they occupy the house or not.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N18
  mew_page: 403-404
- id: VI.75.10
  kind: p
  original: Das Cottagesystem ist allgemein in den ländlichen Fabrikdistrikten; es hat ganze Ortschaften hervorgerufen, und meistens hat der Fabrikant wenig oder gar keine Konkurrenz mit seinen Häusern, so daß er seine Miete gar nicht nach den Forderungen andrer einzurichten braucht, sondern sie ansetzen kann, wie er will.
  en: The cottage system is universal in the country districts; it has created whole villages, and the manufacturer usually has little or no competition against his houses, so that he can fix his price regardless of any market rate, indeed at his pleasure.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '404'
- id: VI.75.11
  kind: p
  original: Und welche Macht gibt das Cottagesystem erst dem Fabrikanten bei Zerwürfnissen mit den Arbeitern!
  en: And what power does the cottage system give the employer over his operatives in disagreements between master and men?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '404'
- id: VI.75.12
  kind: p
  original: Stellen diese die Arbeit ein, so hat er ihnen nur die Miete zu kündigen, und die Kündigungsfrist ist nur eine Woche; nach Verlauf derselben sind die Arbeiter nicht nur brotlos, sondern auch obdachlos, Vagabunden, dem Gesetz verfallen, das sie ohne Gnade einen Monat auf die Tretmühle schickt.
  en: If the latter strike, he need only give them notice to quit his premises, and the notice need only be a week; after that time the operative is not only without bread but without a shelter, a vagabond at the mercy of the law which sends him, without fail, to the treadmill.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '404'
- id: VI.76.1
  kind: p
  original: Das ist das Fabriksystem, so ausführlich geschildert, wie es mein Raum erlaubt, und so unparteiisch, wie es die Heldentaten der Bourgeoisie gegen wehrlose Arbeiter, Taten, bei denen man unmöglich gleichgültig bleiben kann, bei denen Gleichgültigkeit ein Verbrechen wäre, erlauben.
  en: Such is the factory system sketched as fully as my space permits, and with as little partisan spirit as the heroic deeds of the bourgeoisie against the defenceless workers permit--deeds to wards which it is impossible to remain indifferent, towards which indifference were a crime.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '404'
- id: VI.76.2
  kind: p
  original: Vergleichen wir doch einmal die Lage des freien Engländers von 1845 mit der des leibeignen Sachsen unter der Geißel des normännischen Barons von 1145.
  en: Let us compare the condition of the free Englishman of 1845 with the Saxon serf under the lash of the Norman barons of 1145.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '404'
- id: VI.76.3
  kind: p
  original: Der Leibeigne war glebae adscriptus, an die Scholle gefesselt; der freie Arbeiter ist es auch - durch das Cottagesystem; der Leibeigne schuldete dem Brotherrn das jus primae noctis, das Recht der ersten Nacht - der freie Arbeiter schuldet seinem Herrn nicht nur das, sondern sogar das Recht jeder Nacht.
  en: The serf was glebae adscriptus, bound to the soil, so is the free working-man through the cottage system. The serf owed his master the jus primae noctis, the right of the first night--the free working-man must, on demand, surrender to his master not only that, but the right of every night.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '404'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s); regrouped by the ingest (see REALIGN)
- id: VI.76.4
  kind: p
  original: 'Der Leibeigne konnte kein Eigentum erwerben, alles, was er erwarb, durfte ihm der Grundherr nehmen - der freie Arbeiter hat ebenfalls kein Eigentum, kann keins erwerben durch den Druck der Konkurrenz, und was selbst der Normanne nicht tat, das tut der Fabrikant: durch das Trucksystem maßt er sich täglich die Verwaltung dessen an, wovon der Arbeiter seinen unmittelbaren Lebensunterhalt hat.'
  en: The serf could acquire no property; everything that he gained, his master could take from him; the free working-man has no property, can gain none by reason of the pressure of competition, and what even the Norman baron did not do, the modern manufacturer does. Through the truck system, he assumes every day the administration in detail of the things which the worker requires for his immediate necessities.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '404'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s); regrouped by the ingest (see REALIGN)
- id: VI.76.5
  kind: p
  original: Das Verhältnis des Leibeignen zum Grundherrn war durch Gesetze geregelt, die befolgt wurden, weil sie den Sitten entsprachen, sowie auch durch die Sitten selbst; des freien Arbeiters Verhältnis zu seinem Herrn ist durch Gesetze geregelt, die nicht befolgt werden, weil sie weder den Sitten noch dem Interesse des Herrn entsprechen.
  en: The relation of the lord of the soil to the serf was regulated by the prevailing customs and by-laws which were obeyed, because they corresponded to them. The free working-man's relation to his master is regulated by laws which are not obeyed, because they correspond neither with the interests of the employer nor with the prevailing customs.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '404'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s); regrouped by the ingest (see REALIGN)
- id: VI.76.6
  kind: p
  original: Der Grundherr konnte den Leibeignen nicht von der Scholle losreißen, ihn nicht ohne sie, und da fast alles Majorat und nirgends Kapital war, ihn überhaupt nicht verkaufen; die moderne Bourgeoisie zwingt den Arbeiter, sich selbst zu verkaufen.
  en: The lord of the soil could not separate the serf from the land, nor sell him apart from it, and since almost all the land was fief and there was no capital, practically could not sell him at all. The modern bourgeois forces the working-man to sell himself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '404'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s); regrouped by the ingest (see REALIGN)
- id: VI.76.7
  kind: p
  original: Der Leibeigne war Sklave des Grundstücks, auf dem er geboren war; der Arbeiter ist Sklave der notwendigsten Lebensbedürfnisse und des Geldes, mit dem er sie zu kaufen hat - beide sind Sklaven der Sache.
  en: The serf was the slave of the piece of land on which he was born, the working-man is the slave of his own necessaries of life and of the money with which he has to buy them--both are slaves of a thing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 404-405
- id: VI.76.8
  kind: p
  original: Der Leibeigne hat eine Garantie für seine Existenz an der feudalen Gesellschaftsordnung, in der jeder seine Stelle hat; der freie Arbeiter hat gar keine Garantie, weil er nur dann eine Stelle in der Gesellschaft hat, wenn die Bourgeoisie ihn braucht - sonst wird er ignoriert, als gar nicht vorhanden betrachtet.
  en: The serf had a guarantee for the means of subsistence in the feudal order of society in which every member had his own place. The free working-man has no guarantee whatsoever, because he has a place in society only when the bourgeoisie can make use of him; in all other cases he is ignored, treated as non-existent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s); regrouped by the ingest (see REALIGN)
- id: VI.76.9
  kind: p
  original: Der Leibeigne opfert sich seinem Herrn im Kriege - der Fabrikarbeiter im Frieden.
  en: The serf sacrificed himself for his master in war, the factory operative in peace.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: VI.76.10
  kind: p
  original: Der Herr des Leibeignen war ein Barbar, er betrachtete seinen Knecht wie ein Stück Vieh; der Herr des Arbeiters ist zivilisiert, er betrachtet diesen wie eine Maschine.
  en: The lord of the serf was a barbarian who regarded his villain as a head of cattle; the employer of operatives is civilised and regards his "hand" as a machine.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: VI.76.11
  kind: p
  original: Kurz, die beiden stehen sich in allem so ziemlich gleich, und wenn auf einer Seite Nachteil ist, so ist es auf der des freien Arbeiters.
  en: In short, the position of the two is not far from equal, and if either is at a disadvantage, it is the free working-man.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: VI.76.12
  kind: p
  original: Sklaven sind sie beide, nur daß die Knechtschaft des einen ungeheuchelt, offen, ehrlich ist und die des andern heuchlerisch, hinterlistig verheimlicht vor ihm selbst und allen andern, eine theologische Leibeigenschaft, die schlimmer ist als die alte.
  en: Slaves they both are, with the single difference that the slavery of the one is undissembled, open, honest; that of the other cunning, sly, disguised, deceitfully concealed from himself and every one else, a hypocritical servitude worse than the old.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: VI.76.13
  kind: p
  original: 'Die humanen Tories hatten recht, als sie den Fabrikarbeitern den Namen: white Slaves, weiße Sklaven, gaben.'
  en: The philanthropic Tories were right when they gave the operatives the name white slaves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: VI.76.14
  kind: p
  original: Aber die heuchlerische, sich versteckende Knechtschaft erkennt wenigstens das Recht auf Freiheit dem Scheine nach an; sie beugt sich der freiheitliebenden öffentlichen Meinung, und darin liegt der historische Fortschritt gegen die alte Sklaverei, daß wenigstens das Prinzip der Freiheit durchgesetzt ist - und die Unterdrückten werden schon dafür sorgen, daß dies Prinzip auch durchgeführt werde.
  en: But the hypocritical disguised slavery recognises the right to freedom, at least in outward form; bows before a freedom-loving public opinion, and herein lies the historic progress as compared with the old servitude, that the principle of freedom is affirmed, and the oppressed will one day see to it that this principle is carried out.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: VI.77.1
  kind: p
  original: Zum Schluß ein paar Strophen eines Gedichts, das die Ansicht der Arbeiter selbst über das Fabriksystem ausspricht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
  en_note: The English of 1887 and 1892 leaves out Mead's poem and the two sentences that introduce it (VI.77.1 to VI.86.1).
- id: VI.77.2
  kind: p
  original: Es ist von Edward P. Mead in Birmingham und der richtige Ausdruck der unter den Arbeitern herrschenden Gesinnung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: VI.78.1
  kind: p
  original: Ein König lebt, ein zorniger Fürst, / Nicht des Dichters geträumtes Königsbild, / Ein Tyrann, den der weiße Sklave kennt, / Und der Dampf ist der König wild.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: VI.79.1
  kind: p
  original: Er hat einen Arm, einen eisernen Arm, / Und obgleich er nur einen trägt; / In dem Arme schafft eine Zauberkraft, / Die Millionen schlägt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: VI.80.1
  kind: p
  original: Wie der Moloch grimm, sein Ahn, der einst / Im Tale Himmon saß, / Ist Feuersglut sein Eingeweid', / Und Kinder sind sein Fraß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '405'
- id: VI.81.1
  kind: p
  original: Seine Priesterschar, der Menschheit bar, / Voll Blutdurst, Stolz und Wut, / Sie lenken - O Schand'! - seine Riesenhand / Und zaubern Gold aus Blut.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '406'
- id: VI.82.1
  kind: p
  original: Sie treten in Staub das Menschenrecht / Für das schnöde Gold, ihren Gott, / Des Weibes Schmerz ist ihnen Scherz, / Des Mannes Trän' ihr Spott.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '406'
- id: VI.83.1
  kind: p
  original: Musik ist ihrem Ohr das Schrei'n / Des Armen im Todeskampf; / Skelette von Jungfrau'n und Knaben füll'n / Die Hüllen des König Dampf.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '406'
- id: VI.84.1
  kind: p
  original: Die Höll'n auf Erd'! sie verbreiten Tod, / Seit der Dampf herrscht, rings im Reich, / Denn des Menschen Leib und Seele wird / Gemordet d'rin zugleich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '406'
- id: VI.85.1
  kind: p
  original: Drum nieder den Dampf, den Moloch wild, / Arbeitende Tausende, all', / Bind't ihm die Rand, oder unser Land / Bringt er über Nacht zu Fall!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '406'
- id: VI.86.1
  kind: p
  original: Und seine Vögte grimm, die Mill-Lords stolz, / Goldstrotzend und blutigrot, / Stürzen muß sie des Volkes Zorn, / Wie das Scheusal, ihren Gott!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
