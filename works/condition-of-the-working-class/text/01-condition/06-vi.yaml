- id: VI.29.1
  kind: p
  original: 'Ebenso Power:'
  en: '"I can bear witness that the factory system in Bradford has engendered a multitude of cripples, and that the effect of long continued labour upon the physique is apparent, not alone in actual deformity, but also, and much more generally, in stunted growth, relaxation of the muscles, and delicacy of the whole frame."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.30.1
  kind: p
  original: '"Ich kann geradezu sagen, daß das Fabriksystem in Bradford eine sehr große Menge Knüppel erzeugt hat... und daß die Wirkung langanhaltender Arbeit auf den Körper nicht allein als wirkliche Verkrüppelung, sondern auch viel allgemeiner noch als unentwickeltes Wachstum, Erschlaffung der Muskeln und zarte Körperbildung hervortritt" (Power, Rept. p. 74).'
  en: ''
  joined_to: VI.29.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '380'
- id: VI.31.1
  kind: p
  original: 'Ferner der schon zitierte Wundarzt F. Sharp in Leeds:'
  en: 'So, too, F. Sharp, in Leeds, the surgeon already quoted:'
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N10
  mew_page: '380'
- id: VI.32.1
  kind: p
  original: '"Als ich von Scarborough nach Leeds hinüberzog, fiel es mir gleich auf, daß das allgemeine Aussehen der Kinder hier viel bleicher und die Fiber derselben weit weniger straff war als in Scarborough und der Umgegend.'
  en: '"When I moved from Scarborough to Leeds, I was at once struck by the fact that the general appearance of the children was much paler, and their fibre less vigorous here than in Scarborough and its environs.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: VI.32.2
  kind: p
  original: Ich fand ebenfalls, daß viele Kinder für ihr Alter ausnehmend klein waren...
  en: I saw, too, that many children were exceptionally small for their age.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: VI.32.3
  kind: p
  original: Mir sind zahllose Fälle von Skrofeln, Lungenkrankheiten, mesenterischen Affektionen und Unverdaulichkeit vorgekommen, bei denen ich als Mediziner nicht den geringsten Zweifel habe, daß sie durch Arbeiten in den Fabriken entstanden sind.
  en: I have met with numberless cases of scrofula, lung trouble, mesenteric affections, and indigestion, concerning which I, as a medical man, have no doubt that they arose from mill work.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: VI.32.4
  kind: p
  original: Ich bin der Ansicht, daß die nervöse Energie des Körpers durch die lange Arbeit geschwächt und der Grund vieler Krankheiten gelegt wird; wenn nicht fortwährend Leute vom Lande hereinzögen, so würde die Rasse der Fabrikarbeiter bald ganz ausarten."
  en: I believe that the nervous energy of the body is weakened by the long hours, and the foundation of many diseases laid. If people from the country were not constantly coming in, the race of mill-hands would soon be wholly degenerate."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.33.1
  kind: p
  original: 'Desgleichen Beaumont, Wundarzt in Bradford:'
  en: 'So, too, Beaumont, surgeon in Bradford:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '380'
- id: VI.34.1
  kind: p
  original: '"Meiner Ansicht nach bringt das System, nach dem hier in den Fabriken gearbeitet wird, eine eigentümliche Schlaffheit des ganzen Organismus hervor und macht dadurch Kinder im höchsten Grade für Epidemien sowohl wie für zufällige Krankheiten empfänglich...'
  en: '"To my thinking, the system, according to which work is done in the mills here, produces a peculiar relaxation of the whole organism, and thereby makes children in the highest degree susceptible to epidemic, as well as to incidental illness.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 380-381
- id: VI.34.2
  kind: p
  original: Ich halte die Abwesenheit aller geeigneten Vorschriften wegen Ventilation und Reinlichkeit in Fabriken ganz entschieden für eine Hauptursache jener eigentümlichen Tendenz oder Empfänglichkeit für krankhafte Affektionen, die ich in meiner Praxis sooft gefunden habe."
  en: I regard the absence of all appropriate regulations for ventilation and cleanliness in the mills very decidedly as the chief cause of that peculiar tendency or susceptibility to morbid affections which I have so frequently met in my practice."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: VI.35.1
  kind: p
  original: 'Ebenso William Sharp junior bezeugt:'
  en: 'Similar testimony is borne by Dr. Ray:'
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T7
    editions: '1845'
    reading: irrtümlich Dr. Hay (siehe "Factories Inquiry Commission", Second Report, 1833, C. 3, p. 23)
    base_text: '… Ebenso William Sharp junior ‸ bezeugt: …'
  mew_page: '381'
- id: VI.36.1
  kind: p
  original: '"1. daß ich Gelegenheit gehabt habe, die Wirkungen des Fabriksystems auf die Gesundheit von Kindern unter den vorteilhaftesten Umständen" (in der Fabrik von Wood in Bradford, der besteingerichteten des Orts, wo er Fabrikarzt war) "zu beobachten; 2. daß diese Wirkung ganz entschieden und in sehr ausgedehntem Maße selbst unter diesen günstigen Verhältnissen schädlich ist; 3. daß im Jahre 1832 drei Fünftel sämtlicher in Woods Fabrik beschäftigten Kinder von mir medizinisch behandelt wurden; 4. daß die schädlichste Wirkung nicht das Vorherrschen verkrüppelter, sondern geschwächter und krankhafter Konstitutionen ist; 5. daß sich das alles sehr gebessert hat, seit die Arbeitszeit der Kinder von Wood auf zehn Stunden herabgesetzt wurde."'
  en: (1) "I have had opportunity of observing the effects of the factory system upon the health of children under the most favourable circumstances (in Wood's mill, in Bradford, the best arranged of the district, in which he was factory surgeon). (2) These effects are decidedly, and to a very great extent, injurious, even under these most favourable circumstances. (3) In the year 1842, three-fifths of all the children employed in Wood's mill were treated by me. (4) The worst effect is not the predominance of deformities, but of enfeebled and morbid constitutions. (5) All this is greatly improved since the working-hours of children have been reduced at Wood's to ten."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
  align: '1:5'
  review: true
  review_reason: 1 de sentence(s) matched to 5 en sentence(s); regrouped by the ingest (see REALIGN)
- id: VI.37.1
  kind: p
  original: 'Der Kommissär Dr. Loudon selbst, der diese Zeugnisse anführt, sagt:'
  en: 'The Commissioner, Dr. Loudon himself, who cites these witnesses, says:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: VI.38.1
  kind: p
  original: '"Ich denke, es ist klar genug bewiesen worden, daß Kinder unvernünftig und unbarmherzig lange haben arbeiten und selbst Erwachsene ein Quantum Arbeit übernehmen müssen, das kaum irgendein menschliches Wesen aushalten kann.'
  en: '"In conclusion, I think it has been clearly proved that children have been worked a most unreasonable and cruel length of time daily, and that even adults have been expected to do a certain quantity of labour which scarcely any human being is able to endure.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: VI.38.2
  kind: p
  original: Die Folge davon ist, daß viele vor der Zeit gestorben, andere lebenslänglich mit einer fehlerhaften Konstitution behaftet worden sind, und die Befürchtung einer durch die erschütterten Konstitutionen der Überlebenden geschwächten Nachkommenschaft ist, physiologisch gesprochen, nur zu gegründet."
  en: The consequence is that many have died prematurely, and others are afflicted for life with defective constitutions, and the fear of a posterity enfeebled by the shattered constitution of the survivors is but too well founded, from a physiological point of view."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: VI.39.1
  kind: p
  original: 'Und endlich Dr. Hawkins über Manchester:'
  en: 'And, finally, Dr. Hawkins, in speaking of Manchester:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: VI.40.1
  kind: p
  original: '"Ich glaube, den meisten Reisenden fällt die Kleinheit und Zartheit der Statur und die Blässe auf, die man so allgemein in Manchester und vor allen bei den Fabrikarbeitern findet.'
  en: '"I believe that most travellers are struck by the lowness of stature, the leanness and the paleness which present themselves so commonly to the eye at Manchester, and above all, among the factory classes.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: VI.40.2
  kind: p
  original: Ich bin nie in irgendeiner Stadt Großbritanniens oder Europas gewesen, worin die Ausartung der Gestalt und Farbe vom nationalen Normalmaßstabe so augenscheinlich war.
  en: I have never been in any town in Great Britain, nor in Europe, in which degeneracy of form and colour from the national standard has been so obvious.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: VI.40.3
  kind: p
  original: Den verheirateten Weibern fehlen ganz auffallend alle charakteristischen Eigentümlichkeiten der englischen Frau usw....
  en: Among the married women all the characteristic peculiarities of the English wife are conspicuously wanting.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: VI.40.4
  kind: p
  original: Ich muß gestehen, daß die mir vorgeführten Knaben und Mädchen aus den Fabriken von Manchester allgemein ein gedrücktes Aussehen und eine bleiche Farbe hatten; in dem Ausdruck ihrer Gesichter lag nichts von der gewöhnlichen Beweglichkeit, Lebhaftigkeit und Heiterkeit der Jugend.
  en: I must confess that all the boys and girls brought before me from the Manchester mills had a depressed appearance, and were very pale. In the expression of their faces lay nothing of the usual mobility, liveliness, and cheeriness of youth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.40.5
  kind: p
  original: Viele erklärten mir, daß sie gar keinen Zug verspürten, Sonnabend abends und sonntags im Freien sich herumzutummeln, sondern daß sie vorzögen, ruhig zu Hause zu bleiben."
  en: Many of them told me that they felt not the slightest inclination to play out of doors on Saturday and Sunday, but preferred to be quiet at home."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: VI.41.1
  kind: p
  original: 'Fügen wir hier gleich eine andre Stelle aus Hawkins'' Bericht ein, die zwar nur halb hieher gehört, aber eben deshalb ebensogut hier als anderswo stehen kann:'
  en: 'I add, at once, another passage of Hawkins'' report, which only half belongs here, but may be quoted here as well as anywhere else:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '381'
- id: VI.42.1
  kind: p
  original: '"Unmäßigkeit, Ausschweifungen und Mangel an Vorsorge für die Zukunft sind die Hauptuntugenden der Fabrikbevölkerung, und diese Übelstände lassen sich leicht auf Sitten zurückführen, die unter dem heutigen System gebildet werden und beinahe unvermeidlich daraus entspringen.'
  en: '"Intemperance, excess, and want of providence are the chief faults of the factory population, and these evils may be readily traced to the habits which are formed under the present system, and almost inevitably arise from it.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: VI.42.2
  kind: p
  original: Es ist allgemein zugegeben, daß Unverdaulichkeit, Hypochondrie und generelle Schwäche diese Klasse in sehr großer Ausdehnung affizieren, nach zwölf Stunden monotoner Arbeit ist es nur zu natürlich, sich nach einem Reizmittel dieser oder jener Art umzusehen, aber wenn vollends die obigen Krankheitszustände hinzukommen, so wird man rasch und immer von neuem Zuflucht zu geistigen Getränken nehmen."
  en: It is universally admitted that indigestion, hypochondria, and general debility affect this class to a very great extent. After twelve hours of monotonous toil, it is but natural to look about for a stimulant of one sort or another; but when the above-mentioned diseased conditions are added to the customary weariness, people will quickly and repeatedly take refuge in spirituous liquors."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.43.1
  kind: p
  original: Für alle diese Aussagen der Ärzte und Kommissäre bietet der Bericht selbst Hunderte von Beweisfällen.
  en: For all this testimony of the physicians and commissioners, the report itself offers hundreds of cases of proof.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: VI.43.2
  kind: p
  original: Daß der Wuchs der jungen Arbeiter durch die Arbeit gehemmt wird, bezeugen Hunderte von Angaben desselben; unter andern gibt Cowell die Gewichte von 46 Knaben, alle 17 Jahre alt und aus einer Sonntagsschule, an, von denen 26 in Fabriken beschäftigte durchschnittlich 104,5 englische Pfund und 20 nicht in Fabriken arbeitende, aber der Arbeiterklasse angehörige durchschnittlich 117,7 englische Pfund wogen.
  en: That the growth of young operatives is stunted, by their work, hundreds of statements testify; among others, Cowell gives the weight of 46 youths of 17 years of age, from one Sunday school, of whom 26 employed in mills, averaged 104.5 pounds, and 20 not employed in mills, 117.7 pounds.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: VI.43.3
  kind: p
  original: Einer der bedeutendsten Fabrikanten von Manchester und Anführer der Opposition von seiten der Fabrikanten gegen die Arbeiter - ich glaube Robert Hyde Greg - sagt selbst einmal, wenn das so fortginge, so würden ist die Fabrikleute von Lancashire bald ein Geschlecht von Pygmäen werden.
  en: One of the largest manufacturers of Manchester, leader of the opposition against the working-men, I think Robert Hyde Greg himself, said, on one occasion, that if things went on as at present, the operatives of Lancashire would soon be a race of pigmies.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N11
  mew_page: '382'
- id: VI.43.4
  kind: p
  original: Ein Rekrutierungslieutenant (Tufnell, p. 59) sagt aus, daß die Fabrikarbeiter sich wenig für den Militärdienst eignen; sie sähen dünn und schwächlich aus und würden oft von den Ärzten als untauglich zurückgewiesen.
  en: A recruiting officer testified that operatives are little adapted for military service, looked thin and nervous, and were frequently rejected by the surgeons as unfit.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
  en_note: 'English note {159b}: Tufnell, p. 59.'
- id: VI.43.5
  kind: p
  original: In Manchester könne er kaum Leute von 5 Fuß 8 Zoll bekommen, die Leute hätten fast alle nur 6 bis 7 Zoll, während in den Ackerbaudistrikten die meisten Rekruten 8 Zoll hätten (der Unterschied des englischen Maßes gegen das preußische beträgt auf 5 Fuß etwa 2 Zoll, um die das englische kleiner ist).
  en: In Manchester he could hardly get men of five feet eight inches; they were usually only five feet six to seven, whereas in the agricultural districts, most of the recruits were five feet eight.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: VI.44.1
  kind: p
  original: Die Männer sind infolge dieser Einflüsse sehr bald aufgerieben.
  en: The men wear out very early in consequence of the conditions under which they live and work.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: VI.44.2
  kind: p
  original: Die meisten sind mit vierzig Jahren arbeitsunfähig, einige wenige halten sich bis zum fünfundvierzigsten, fast gar keine bis zum fünfzigsten Jahre.
  en: Most of them are unfit for work at forty years, a few hold out to forty-five, almost none to fifty years of age.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: VI.44.3
  kind: p
  original: Dies wird, außer durch allgemeine Körperschwäche, zum Teil auch noch durch eine Schwächung des Gesichts hervorgebracht, welche die Folge des Mulespinnens ist, wobei der Arbeiter seine Augen auf eine lange Reihe feiner, parallellaufender Fäden heften und sie dadurch sehr anstrengen muß.
  en: This is caused not only by the general enfeeblement of the frame, but also very often by a failure of the sight, which is a result of mule-spinning, in which the operative is obliged to fix his gaze upon a long row of fine, parallel threads, and so greatly to strain the sight.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: VI.44.4
  kind: p
  original: Aus 1 600 Arbeitern, die in mehreren Fabriken in Harpur und Lanark beschäftigt wurden, waren nur 10 über 45 Jahren; aus 22 094 Arbeitern in verschiedenen Fabriken in Stockport und Manchester nur 143 über 45 Jahren.
  en: Of 1,600 operatives employed in several factories in Harpur and Lanark, but 10 were over 45 years of age; of 22,094 operatives in diverse factories in Stockport and Manchester, but 143 were over 45 years old.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '382'
- id: VI.44.5
  kind: p
  original: Von diesen 143 wurden 16 aus besonderer Gunst noch beibehalten, und einer tat Kinderarbeit.
  en: Of these 143, 16 were retained as a special favour, and one was doing the work of a child.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 382-383
- id: VI.44.6
  kind: p
  original: Eine Liste von 131 Spinnern enthielt nur sieben über 45 Jahren, und doch waren alle 131 wegen "zu hohen Alters" von den Fabrikanten, bei welchen sie um Arbeit anhielten, abgewiesen.
  en: A list of 131 spinners contained but seven over 45 years, and yet the whole 131 were rejected by the manufacturers, to whom they applied for work, as "too old," and were without means of support by reason of old age!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.44.7
  kind: p
  original: Von 50 ausrangierten Spinnern in Bolton waren nur zwei über 50, und der Rest im Durchschnitt noch nicht 40 Jahre alt - und alle waren wegen zu hohen Alters brotlos!
  en: ''
  joined_to: VI.44.6
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '383'
- id: VI.44.8
  kind: p
  original: Herr Ashworth, ein bedeutender Fabrikant, gibt in einem Briefe an Lord Ashley selbst zu, daß gegen das 40. Lebensjahr die Spinner nicht mehr die gehörige Quantität Garn aufzubringen vermögen und deshalb "zuweilen" entlassen werden; er nennt die vierzigjährigen Arbeiter "alte Leute"!
  en: Mr. Ashworth, a large manufacturer, admits in a letter to Lord Ashley, that, towards the fortieth year, the spinners can no longer prepare the required quantity of yarn, and are therefore "sometimes" discharged; he calls operatives forty years of age "old people!"
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N12
  mew_page: '383'
- id: VI.44.9
  kind: p
  original: 'Ebenso spricht der Kommissär Mackintosh im Bericht von 1833:'
  en: 'Commissioner Mackintosh expresses himself in the same way in the report of 1833:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: VI.45.1
  kind: p
  original: '"Obgleich ich durch die Art, wie Kinder beschäftigt werden, schon vorbereitet war, so wurde es mir doch schwer, den ältern Arbeitern ihre Angaben wegen ihres Alters zu glauben, so sehr früh altern diese Leute."'
  en: '"Although I was prepared for it from the way the children are employed, I still found it difficult to believe the statements of the older hands as to their ages; they age so very early."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: VI.46.1
  kind: p
  original: Wundarzt Smellie in Glasgow, der hauptsächlich Fabrikarbeiter behandelt, sagt ebenfalls, daß bei ihnen vierzig Jahre schon ein hohes Alter (old age) seien (Stuart, evid. p. 101).
  en: Surgeon Smellie, of Glasgow, who treated operatives chiefly, says that forty years is old age for them. And similar evidence may be found elsewhere.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T8
    editions: '1892'
    reading: schon hohes Alter
    base_text: … schon ein hohes Alter ‸ (old age) seien (Stuart, …
  mew_page: '383'
  en_note: 'English note {160a}: Stuart Evidence, p. 101. English note {160b}: Tufnell Evidence, pp. 3, 9, 15.'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.46.2
  kind: p
  original: Gleichlautende Zeugnisse finden sich Tufnell. evid. p. 3, 9, 15, Hawkins, Rept. p. 4; evid. p. 14 etc. etc. In Manchester ist dies frühe Altern der Arbeiter so allgemein, daß man fast jeden Vierziger für zehn bis fünfzehn Jahre älter ansieht, während die wohlhabenden Klassen, sowohl Männer als Frauen, ihr Aussehen sehr gut konservieren, wenn sie nicht zuviel trinken.
  en: In Manchester, this premature old age among the operatives is so universal that almost every man of forty would be taken for ten to fifteen years older, while the prosperous classes, men as well as women, preserve their appearance exceedingly well if they do not drink too heavily.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: VI.47.1
  kind: p
  original: Die Wirkung der Fabrikarbeit auf den weiblichen Körper ist ebenfalls ganz eigner Art.
  en: The influence of factory-work upon the female physique also is marked and peculiar.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: VI.47.2
  kind: p
  original: Die Verbildungen, die die Folge langer Arbeitszeit sind, werden beim Weibe noch viel ernsthafter; Verbildungen des Beckens, teils durch unrichtige Lage und Entwicklung der Beckenknochen selbst, teils durch Verkrümmung des unteren Teils der Wirbelsäule werden häufig durch diese Ursache hervorgebracht.
  en: The deformities entailed by long hours of work are much more serious among women. Protracted work frequently causes deformities of the pelvis, partly in the shape of abnormal position and development of the hip bones, partly of malformation of the lower portion of the spinal column.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.48.1
  kind: p
  original: '"Obgleich", sagt Dr. Loudon in seinem Bericht, "kein Beispiel von einem verbildeten Becken und einigen andern Übeln mir vorkam, so sind doch diese Dinge derart, daß jeder Mediziner sie als wahrscheinliche Folge einer solchen Arbeitszeit bei Kindern hinstellen muß, und außerdem verbürgt von Männern von der höchsten medizinischen Glaubwürdigkeit."'
  en: '"Although," says Dr. Loudon, in his report, "no example of malformation of the pelvis and of some other affections came under my notice, these things are nevertheless so common, that every physician must regard them as probable consequences of such working-hours, and as vouched for besides by men of the highest medical credibility."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '383'
- id: VI.49.1
  kind: p
  original: Daß Fabrikarbeiterinnen schwerer gebären als andere Frauen, wird von mehreren Hebammen und Geburtshelfern bezeugt, ebenso, daß sie häufiger abortieren, z.B. Dr. Hawkins, evid. p. 11 et 13. Dazu kommt noch, daß die Weiber an der allen Fabrikarbeitern gemeinsamen allgemeinen Schwäche leiden und, wenn sie schwanger sind, bis zur Stunde der Entbindung in den Fabriken arbeiten - natürlich, wenn sie zu früh aufhören, so müssen sie fürchten, daß ihre Stellen besetzt und sie selbst entlassen werden - auch verlieren sie den Lohn.
  en: That factory operatives undergo more difficult confinement than other women is testified to by several midwives and accoucheurs, and also that they are more liable to miscarriage. Moreover, they suffer from the general enfeeblement common to all operatives, and, when pregnant, continue to work in the factory up to the hour of delivery, because otherwise they lose their wages and are made to fear that they may be replaced if they stop away too soon.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 383-384
  en_note: 'English note {161}: Hawkins Report, p. 4; Evidence, p. 14, etc. etc. Hawkins Evidence, pp. 11, 13.'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.49.2
  kind: p
  original: Es kommt sehr häufig vor, daß Frauen, die den Abend noch arbeiteten, den nächsten Morgen entbunden sind, ja es ist nicht allzu selten, daß sie in den Fabriken selbst, zwischen den Maschinen niederkommen.
  en: It frequently happens that women are at work one evening and delivered the next morning, and the case is none too rare of their being delivered in the factory among the machinery.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: VI.49.3
  kind: p
  original: Und wenn auch die Herren Bourgeois darin nichts Besondres finden, so werden mir doch ihre Frauen vielleicht zugeben, daß es eine Grausamkeit, eine infame Barbarei ist, ein schwangeres Weib indirekt zu zwingen, bis zum Tage ihrer Niederkunft täglich zwölf bis dreizehn (früher noch mehr) Stunden arbeitend, in stehender Positur, bei häufigem Bücken, zuzubringen.
  en: And if the gentlemen of the bourgeoisie find nothing particularly shocking in this, their wives will perhaps admit that it is a piece of cruelty, an infamous act of barbarism, indirectly to force a pregnant woman to work twelve or thirteen hours daily (formerly still longer), up to the day of her delivery, in a standing position, with frequent stoopings.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: VI.49.4
  kind: p
  original: Das ist aber noch nicht alles.
  en: But this is not all.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: VI.49.5
  kind: p
  original: Wenn die Frauen nach der Niederkunft vierzehn Tage nicht zu arbeiten brauchen, so sind sie froh und halten es für lange.
  en: If these women are not obliged to resume work within two weeks, they are thankful, and count themselves fortunate.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
- id: VI.49.6
  kind: p
  original: 'Manche kommen schon nach acht, ja nach drei bis vier Tagen wieder in die Fabrik, um die volle Arbeitszeit durchzumachen - ich hörte einmal, wie ein Fabrikant einen Aufseher frug: Ist die und die noch nicht wieder hier?'
  en: 'Many come back to the factory after eight, and even after three to four days, to resume full work. I once heard a manufacturer ask an overlooker: "Is so and so not back yet?"'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '384'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
