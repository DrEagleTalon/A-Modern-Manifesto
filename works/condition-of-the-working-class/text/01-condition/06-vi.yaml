- id: VI.57.5
  kind: p
  original: 'Darauf folgt denn eine lange Jeremiade über die vielen Widersetzlichkeiten der Arbeiter und bei Gelegenheit einer Arbeitseinstellung der bestbezahlten Arbeiter, der Feinspinner, folgender naive Ausspruch:'
  en: 'Hereupon follows a long Jeremiad upon the spirit of resistance of the operatives, and on the occasion of a strike of the best paid workers, the fine spinners, the following naive observation:'
