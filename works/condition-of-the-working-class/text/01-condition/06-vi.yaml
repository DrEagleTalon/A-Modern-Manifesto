- id: VI.N13.1.1
  kind: note
  original: Bekanntlich blamierte sich das Unterhaus in derselben Session noch einmal auf diese Weise in der Zuckerfrage, wo es zuerst gegen, später, nach Anwendung der "Regierungspeitsche", für die Minister entschied.
  en: It is notorious that the House of Commons made itself ridiculous a second time in the same session in the same way on the Sugar Question, when it first voted against the ministry and then for it, after an application of the ministerial whip.
  modern: ''
  modern_status: empty
  notes: ''
  en_note: English note {176}.
- id: VI.N14.1.1
  kind: note
  original: 'Hören wir noch einen kompetenten Richter: "Wenn das Beispiel der Irländer in Verbindung mit der unablässigen Arbeit der ganzen baumwollfabrizierenden Klasse betrachtet wird, so werden wir uns über ihre schreckliche Demoralisation weniger wundern.'
  en: 'Let us hear another competent judge: "If we consider the example of the Irish in connection with the ceaseless toil of the cotton operative class, we shall wonder less at their terrible demoralisation.'
  modern: ''
  modern_status: empty
  notes: ''
  en_note: English note {178}.
- id: VI.N14.1.2
  kind: note
  original: Anhaltende und erschöpfende Arbeit Tag für Tag, Jahr für Jahr fortgesetzt, ist nicht berechnet, die intellektuellen und moralischen Fähigkeiten des Menschen zu entwickeln.
  en: Continuous exhausting toil, day after day, year after year, is not calculated to develop the intellectual and moral capabilities of the human being.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N14.1.3
  kind: note
  original: Der trübselige Schlendrian einer endlosen Arbeitsqual (drudgery), worin derselbe mechanische Prozeß immer wieder durchgemacht wird, gleicht der Qual des Sisyphus; die Last der Arbeit, gleich dem Felsen, fällt immer wieder auf den abgematteten Arbeiter zurück.
  en: The wearisome routine of endless drudgery, in which the same mechanical process is ever repeated, is like the torture of Sisyphus; the burden of toil, like the rock, is ever falling back upon the worn-out drudge.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N14.1.4
  kind: note
  original: Der Geist erlangt weder Kenntnisse noch Denktätigkeit durch die ewige Arbeit derselben Muskeln; der Verstand schlummert ein in stumpfer Trägheit, aber der gröbere Teil unserer Natur erhält eine üppige Entwicklung.
  en: The mind attains neither knowledge nor the power of thought from the eternal employment of the same muscles. The intellect dozes off in dull indolence, but the coarser part of our nature reaches a luxuriant development.
  modern: ''
  modern_status: empty
  notes: ''
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.N14.1.5
  kind: note
  original: Den Menschen zu solcher Arbeit zu verdammen heißt die tierischen Anlagen in ihm kultivieren.
  en: To condemn a human being to such work is to cultivate the animal quality in him.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N14.1.6
  kind: note
  original: Er wird gleichgültig, er verschmäht die seine Gattung auszeichnenden Triebe und Sitten.
  en: He grows indifferent, he scorns the impulses and customs which distinguish his kind.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N14.1.7
  kind: note
  original: Er vernachlässigt die Bequemlichkeiten und feineren Freuden das Lebens, er lebt in schmutzigem Elend, bei magerer Nahrung und vergeudet den Rest seines Erwerbs in Ausschweifungen.
  en: He neglects the conveniences and finer pleasures of life, lives in filthy poverty with scanty nourishment, and squanders the rest of his earnings in debauchery."--Dr. J. Kay.
  modern: ''
  modern_status: empty
  notes: ''
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
