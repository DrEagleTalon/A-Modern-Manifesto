- id: VI.61.1
  kind: p
  original: (Natürlich, als ob nicht die Bewegung aller Muskeln ein unmittelbares Bedürfnis für den steif und zugleich schlaff gewordenen Körper wäre! Aber Ure hätte warten sollen, ob nicht diese augenblickliche Aufregung nach ein paar Minuten verschwunden sei. Und ohnehin konnte Ure dies doch nur mittags, nach fünf- bis sechsstündiger Arbeit, aber nicht abends sehen!)
  en: As though the immediate movement of every muscle were not an urgent necessity for frames grown at once stiff and relaxed! But Ure should have waited to see whether this momentary excitement had not subsided after a couple of minutes. And besides, Ure could see this whole performance only in the afternoon after five or six hours' work, but not in the evening!
  modern: ''
  modern_status: empty
