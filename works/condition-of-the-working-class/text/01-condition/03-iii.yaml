- id: III.N2.1.1
  kind: note
  original: '"Man hat gesagt, daß der Verschleiß eines Sklaven auf Kosten seines Herrn vor sich gehe, während der eines freien Arbeiters für Rechnung dieses Arbeiters geschehe.'
  en: '"Wealth of Nations" I., McCulloch''s edition in one volume, sect. 8, p. 36: "The wear and tear of a slave, it has been said, is at the expense of his master, but that of a free servant is at his own expense.'
  modern: ''
  modern_status: empty
  notes: ''
  en_note: English note {80}.
  align: '2:2'
  review: true
  review_reason: extra en sentence with no de counterpart; 2 de sentence(s) matched to 2 en sentence(s)
- id: III.N2.1.2
  kind: note
  original: Aber der Verschleiß des letzteren ist ebenfalls für Rechnung des Herrn.
  en: ''
  joined_to: III.N2.1.1
  modern: ''
  modern_status: joined
  notes: ''
- id: III.N2.1.3
  kind: note
  original: Der den Tagelöhnern, Dienern usw. von jeglicher Art bezahlte Lohn muß so hoch sein, daß er diese in den Stand setzt, die Rasse der Tagelöhner und Diener in der Weise fortzupflanzen, wie es die zunehmende, stationäre oder abnehmende Nachfrage der Gesellschaft nach solchen Leuten gerade verlangt.
  en: The wear and tear of the latter, however, is, in reality, as much at the expense of his master as that of the former. The wages paid to journeymen and servants of every kind, must be such as may enable them, one with another, to continue the race of journeymen and servants, according as the increasing, diminishing, or stationary demand of the society may happen to require.
  modern: ''
  modern_status: empty
  notes: ''
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: III.N2.1.4
  kind: note
  original: Aber obgleich der Verschleiß eines freien Arbeiters ebenfalls auf Kosten des Herrn vor sich geht, so kostet er ihm doch in der Regel viel weniger als der eines Sklaven.
  en: ''
  joined_to: III.N2.1.3
  modern: ''
  modern_status: joined
  notes: ''
- id: III.N2.1.5
  kind: note
  original: Der Fonds, der dazu bestimmt ist, den Verschleiß eines Sklaven zu reparieren oder zu ersetzen, wird gewöhnlich von einem nachlässigen Herrn oder unaufmerksamen Aufseher verwaltet etc."
  en: But though the wear and tear of a free servant be equally at the expense of his master, it generally costs him much less than that of a slave.
  modern: ''
  modern_status: empty
  notes: ''
- id: III.N2.1.6
  kind: note
  original: '- A. Smith, "Wealth of Nations" [Der Reichtum der Nationen], 1, 8, p. 134 der MacCullochschen vierbändigen Ausgabe.'
  en: The fund for replacing or repairing, if I may say so, the wear and tear of the slave, is commonly managed by a negligent master or careless overseer."
  modern: ''
  modern_status: empty
  notes: ''
