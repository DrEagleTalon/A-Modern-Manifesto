section: III
title_original: Die Konkurrenz
title_en: Competition
author: Friedrich Engels
date: 1844-11/1845-03
original_language: de
anchor_language: de
source_original: MEW 2, S. 225-506 (Dietz, Berlin 1972) via mlwerke.de; text of the first edition (Leipzig 1845), readings of the second edition (Stuttgart 1892) as variants
source_en: Florence Kelley Wischnewetzky's translation (New York 1887) in the London edition of 1892 (Swan Sonnenschein), Project Gutenberg ebook 17306 (public domain)
verses:
- id: III.0.1
  kind: heading
  original: Die Konkurrenz
  en: COMPETITION.
  modern: ''
  modern_status: empty
  notes: ''
- id: III.1.1
  kind: p
  original: Wir haben in der Einleitung gesehen, wie die Konkurrenz gleich im Anfange der industriellen Bewegung das Proletariat schuf, indem sie bei vermehrter Nachfrage nach gewebten Stoffen den Weblohn steigerte und dadurch die webenden Bauern veranlaßte, ihre Ackerwirtschaft dranzugeben, um am Webstuhl desto mehr verdienen zu können; wir haben gesehen, wie sie die kleinen Bauern durch das System der Bewirtschaftung im großen verdrängte, sie zu Proletariern herabsetzte und dann teilweise in die Städte zog; wie sie ferner die kleine Bourgeoisie zum größten Teil ruinierte und ebenfalls zu Proletariern herabdrückte, wie sie das Kapital in den Händen weniger und die Bevölkerung in den großen Städten zentralisierte.
  en: We have seen in the introduction how competition created the proletariat at the very beginning of the industrial movement, by increasing the wages of weavers in consequence of the increased demand for woven goods, so inducing the weaving peasants to abandon their farms and earn more money by devoting themselves to their looms. We have seen how it crowded out the small farmers by means of the large farm system, reduced them to the rank of proletarians, and attracted them in part into the towns; how it further ruined the small bourgeoisie in great measure and reduced its members also to the ranks of the proletariat; how it centralised capital in the hands of the few, and population in the great towns.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '306'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.1.2
  kind: p
  original: Das sind die verschiedenen Wege und Mittel, durch welche die Konkurrenz, wie sie in der modernen Industrie zur vollen Erscheinung und zur freien Entwicklung ihrer Konsequenzen kam, das Proletariat schuf und ausdehnte.
  en: Such are the various ways and means by which competition, as it reached its full manifestation and free development in modern industry, created and extended the proletariat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '306'
- id: III.1.3
  kind: p
  original: Wir werden jetzt ihren Einfluß auf das schon bestehende Proletariat zu betrachten haben.
  en: We shall now have to observe its influence on the working-class already created.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '306'
- id: III.1.4
  kind: p
  original: Und hier haben wir zuerst die Konkurrenz der einzelnen Arbeiter unter sich in ihren Folgen zu entwickeln.
  en: And here we must begin by tracing the results of competition of single workers with one another.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '306'
- id: III.2.1
  kind: p
  original: Die Konkurrenz ist der vollkommenste Ausdruck des in der modernen bürgerlichen Gesellschaft herrschenden Kriegs Aller gegen Alle.
  en: Competition is the completest expression of the battle of all against all which rules in modern civil society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '306'
- id: III.2.2
  kind: p
  original: Dieser Krieg, ein Krieg um das Leben, um die Existenz, um alles, also auch im Notfalle ein Krieg auf Leben und Tod, besteht nicht nur zwischen den verschiedenen Klassen der Gesellschaft, sondern auch zwischen den einzelnen Mitgliedern dieser Klassen; jeder ist dem andern im Wege, und jeder sucht daher auch alle, die ihm im Wege sind, zu verdrängen und sich an ihre Stelle zu setzen.
  en: This battle, a battle for life, for existence, for everything, in case of need a battle of life and death, is fought not between the different classes of society only, but also between the individual members of these classes. Each is in the way of the other, and each seeks to crowd out all who are in his way, and to put himself in their place.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '306'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.2.3
  kind: p
  original: Die Arbeiter konkurrieren unter sich, wie die Bourgeois unter sich konkurrieren.
  en: The workers are in constant competition among themselves as the members of the bourgeoisie among themselves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '306'
- id: III.2.4
  kind: p
  original: Der mechanische Weber konkurriert gegen den Handweber, der unbeschäftigte oder schlecht bezahlte Handweber gegen den beschäftigten oder besser bezahlten und sucht ihn zu verdrängen.
  en: The power-loom weaver is in competition with the hand-loom weaver, the unemployed or ill-paid hand-loom weaver with him who has work or is better paid, each trying to supplant the other.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '306'
- id: III.2.5
  kind: p
  original: Diese Konkurrenz der Arbeiter gegeneinander ist aber die schlimmste Seite der jetzigen Verhältnisse für den Arbeiter, die schärfste Waffe gegen das Proletariat in den Händen der Bourgeoisie.
  en: But this competition of the workers among themselves is the worst side of the present state of things in its effect upon the worker, the sharpest weapon against the proletariat in the hands of the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 306-307
- id: III.2.6
  kind: p
  original: Daher das Streben der Arbeiter, diese Konkurrenz durch Assoziationen aufzuheben, daher die Wut der Bourgeoisie gegen diese Assoziationen und ihr Triumph über jede diesen beigebrachte Schlappe.
  en: Hence the effort of the workers to nullify this competition by associations, hence the hatred of the bourgeoisie towards these associations, and its triumph in every defeat which befalls them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '307'
- id: III.3.1
  kind: p
  original: Der Proletarier ist hülflos; er kann für sich selbst nicht einen einzigen Tag leben.
  en: The proletarian is helpless; left to himself, he cannot live a single day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '307'
- id: III.3.2
  kind: p
  original: Die Bourgeoisie hat sich das Monopol aller Lebensmittel im weitesten Sinne des Worts angemaßt.
  en: The bourgeoisie has gained a monopoly of all means of existence in the broadest sense of the word.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '307'
- id: III.3.3
  kind: p
  original: Was der Proletarier braucht, kann er nur von dieser Bourgeoisie, die durch die Staatsgewalt in ihrem Monopol geschützt wird, erhalten.
  en: What the proletarian needs, he can obtain only from this bourgeoisie, which is protected in its monopoly by the power of the State.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '307'
- id: III.3.4
  kind: p
  original: Der Proletarier ist also rechtlich und tatsächlich der Sklave der Bourgeoisie; sie kann über sein Leben und seinen Tod verfügen.
  en: The proletarian is, therefore, in law and in fact, the slave of the bourgeoisie, which can decree his life or death.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '307'
- id: III.3.5
  kind: p
  original: Sie bietet ihm ihre Lebensmittel an, aber für ein "Äquivalent", für seine Arbeit; sie läßt ihm sogar noch den Schein, als ob er aus freiem Willen handelte, mit freier, zwangloser Einwilligung, als mündiger Mensch einen Vertrag mit ihr abschlösse.
  en: It offers him the means of living, but only for an "equivalent" for his work. It even lets him have the appearance of acting from a free choice, of making a contract with free, unconstrained consent, as a responsible agent who has attained his majority.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '307'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.3.6
  kind: p
  original: Schöne Freiheit, wo dem Proletarier keine andere Wahl bleibt, als die Bedingungen, die ihm die Bourgeoisie stellt, zu unterschreiben oder - zu verhungern, zu erfrieren, sich nackt bei den Tieren des Waldes zu betten!
  en: Fine freedom, where the proletarian has no other choice than that of either accepting the conditions which the bourgeoisie offers him, or of starving, of freezing to death, of sleeping naked among the beasts of the forests!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '307'
- id: III.3.7
  kind: p
  original: Schönes "Äquivalent", dessen Betrag ganz im Belieben der Bourgeoisie steht!
  en: A fine "equivalent" valued at pleasure by the bourgeoisie!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '307'
- id: III.3.8
  kind: p
  original: Und ist der Proletarier ein solcher Narr, lieber verhungern zu wollen, als sich in die "billigen" Vorschläge der Bourgeois, seiner "natürlichen Vorgesetzten" zu fügen - je nun, es findet sich leicht ein anderer, es gibt Proletarier genug in der Welt, und nicht alle sind so verrückt, nicht alle ziehen den Tod dem Leben vor.
  en: And if one proletarian is such a fool as to starve rather than agree to the equitable propositions of the bourgeoisie, his "natural superiors," another is easily found in his place; there are proletarians enough in the world, and not all so insane as to prefer dying to living.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - III.N1
  mew_page: '307'
- id: III.4.1
  kind: p
  original: Da haben wir die Konkurrenz der Proletarier untereinander.
  en: Here we have the competition of the workers among themselves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '307'
- id: III.4.2
  kind: p
  original: Wenn alle Proletarier nur den Willen aussprächen, lieber verhungern als für die Bourgeoisie arbeiten zu wollen, so würde diese schon von ihrem Monopol abstehen müssen; aber das ist nicht der Fall, das ist sogar ein ziemlich unmöglicher Fall, und daher ist die Bourgeoisie noch immer guter Dinge.
  en: If all the proletarians announced their determination to starve rather than work for the bourgeoisie, the latter would have to surrender its monopoly. But this is not the case--is, indeed, a rather impossible case--so that the bourgeoisie still thrives.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '307'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.4.3
  kind: p
  original: Nur eine Schranke hat diese Konkurrenz der Arbeiter - kein Arbeiter wird für weniger arbeiten wollen, als er zu seiner Existenz nötig hat; wenn er einmal verhungern soll, wird er lieber faul als arbeitend verhungern wollen.
  en: To this competition of the worker there is but one limit; no worker will work for less than he needs to subsist. If he must starve, he will prefer to starve in idleness rather than in toil.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '307'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.4.4
  kind: p
  original: Freilich ist diese Schranke relativ; der eine braucht mehr als der andere, der eine ist an mehr Bequemlichkeit gewöhnt als der andere - der Engländer, der noch etwas zivilisiert ist, braucht mehr als der Irländer, der in Lumpen geht, Kartoffeln ißt und in einem Schweinestall schläft.
  en: True, this limit is relative; one needs more than another, one is accustomed to more comfort than another; the Englishman who is still somewhat civilised, needs more than the Irishman who goes in rags, eats potatoes, and sleeps in a pig-sty.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '307'
- id: III.4.5
  kind: p
  original: Aber das hindert den Irländer nicht, gegen den Engländer zu konkurrieren und allmählich den Lohn und mit ihm den Zivilisationsgrad des englischen Arbeiters auf das Niveau des irischen herabzudrücken.
  en: But that does not hinder the Irishman's competing with the Englishman, and gradually forcing the rate of wages, and with it the Englishman's level of civilisation, down to the Irishman's level.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '307'
- id: III.4.6
  kind: p
  original: Gewisse Arbeiten erfordern einen bestimmten Zivilisationsgrad, und dahin gehören fast alle industriellen; daher muß der Lohn hier schon im Interesse der Bourgeoisie selbst so hoch sein, daß er dem Arbeiter möglich macht, sich in dieser Sphäre zu erhalten.
  en: Certain kinds of work require a certain grade of civilisation, and to these belong almost all forms of industrial occupation; hence the interest of the bourgeoisie requires in this case that wages should be high enough to enable the workman to keep himself upon the required plane.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 307-308
- id: III.4.7
  kind: p
  original: Der frischeingewanderte, im ersten besten Stalle kampierende Irländer, der selbst in einer erträglichen Wohnung jede Woche auf die Straße gesetzt wird, weil er alles versäuft und die Miete nicht bezahlen kann, der würde ein schlechter Fabrikarbeiter sein; daher muß den Fabrikarbeitern so viel gegeben werden, daß sie ihre Kinder zu regelmäßiger Arbeit erziehen können - aber auch nicht mehr, damit sie nicht den Lohn ihrer Kinder entbehren können und sie etwas anderes werden lassen als bloße Arbeiter.
  en: The newly immigrated Irishman, encamped in the first stable that offers, or turned out in the street after a week because he spends everything upon drink and cannot pay rent, would be a poor mill-hand. The mill-hand must, therefore, have wages enough to enable him to bring up his children to regular work; but no more, lest he should be able to get on without the wages of his children, and so make something else of them than mere working-men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '308'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.4.8
  kind: p
  original: Auch hier ist die Schranke, das Minimum des Lohns, relativ; wo jeder in der Familie arbeitet, braucht der einzelne um soviel weniger zu erhalten, und die Bourgeoisie hat die Gelegenheit zur Beschäftigung und Rentbarmachung der Weiber und Kinder, die ihr in der Maschinenarbeit gegeben wurde, zur Herabdrückung des Lohns weidlich benutzt.
  en: Here, too, the limit, the minimum wage, is relative. When every member of the family works, the individual worker can get on with proportionately less, and the bourgeoisie has made the most of the opportunity of employing and making profitable the labour of women and children afforded by machine-work.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '308'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.4.9
  kind: p
  original: Natürlich ist nicht in jeder Familie jeder arbeitsfähig, und eine solche Familie würde sich schlecht stehen, wenn sie zu dem auf eine ganz arbeitsfähige Familie berechneten Minimum des Lohns arbeiten wollte; daher stellt sich der Lohn hier auf einen Durchschnitt, bei dem es der ganz arbeitsfähigen Familie ziemlich gut, der weniger arbeitsfähige Mitglieder zählenden ziemlich schlecht geht.
  en: Of course it is not in every family that every member can be set to work, and those in which the case is otherwise would be in a bad way if obliged to exist upon the minimum wage possible to a wholly employed family. Hence the usual wages form an average according to which a fully employed family gets on pretty well, and one which embraces few members able to work, pretty badly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '308'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.4.10
  kind: p
  original: Aber im schlimmsten Falle wird jeder Arbeiter lieber das bißchen Luxus oder Zivilisation aufgeben, an das er gewöhnt war, um nur die nackte Existenz zu fristen; er wird lieber einen Schweinestall als gar kein Obdach, lieber Lumpen als gar keine Kleider, lieber nur Kartoffeln haben wollen als verhungern.
  en: But in the worst case, every working-man prefers surrendering the trifling luxury to which he was accustomed to not living at all; prefers a pig-pen to no roof, wears rags in preference to going naked, confines himself to a potato diet in preference to starvation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '308'
- id: III.4.11
  kind: p
  original: Er wird lieber, in Aussicht auf bessere Zeiten, mit halbem Lohn zufrieden sein, als sich still auf die Straße setzen und vor den Augen der Welt sterben, wie so mancher Brotlose es getan hat.
  en: He contents himself with half-pay and the hope of better times rather than be driven into the street to perish before the eyes of the world, as so many have done who had no work whatever.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '308'
- id: III.4.12
  kind: p
  original: Dies bißchen also, dies etwas mehr als nichts, ist das Minimum des Lohns.
  en: This trifle, therefore, this something more than nothing, is the minimum of wages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '308'
- id: III.4.13
  kind: p
  original: Und wenn mehr Arbeiter da sind, als die Bourgeoisie zu beschäftigen für gut hält, wenn also am Ende des Konkurrenzkampfs doch noch eine Zahl übrigbleibt, die keine Arbeit findet, so muß diese Zahl eben verhungern; denn der Bourgeois wird ihnen doch wahrscheinlich keine Arbeit geben, wenn er die Produkte ihrer Arbeit nicht mit Nutzen verkaufen kann.
  en: And if there are more workers at hand than the bourgeoisie thinks well to employ--if at the end of the battle of competition there yet remain workers who find nothing to do, they must simply starve; for the bourgeois will hardly give them work if he cannot sell the produce of their labour at a profit.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '308'
- id: III.5.1
  kind: p
  original: Wir sehen hieraus, was das Minimum des Lohns ist.
  en: From this it is evident what the minimum of wages is.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '308'
- id: III.5.2
  kind: p
  original: Das Maximum wird durch die Konkurrenz der Bourgeois gegeneinander festgestellt, denn wir sahen, wie auch diese konkurrieren.
  en: The maximum is determined by the competition of the bourgeoisie among themselves; for we have seen how they, too, must compete with each other.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '308'
- id: III.5.3
  kind: p
  original: Der Bourgeois kann sein Kapital nur durch Handel oder Industrie vergrößern, und zu beiden Zwecken braucht er Arbeiter.
  en: The bourgeois can increase his capital only in commerce and manufacture, and in both cases he needs workers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '308'
- id: III.5.4
  kind: p
  original: Selbst wenn er sein Kapital auf Zinsen legt, braucht er sie indirekt, denn ohne Handel und Industrie würde ihm niemand Zinsen dafür geben, würde niemand es benutzen können.
  en: Even if he invests his capital at interest, he needs them indirectly; for without commerce and manufacture, no one would pay him interest upon his capital, no one could use it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '308'
- id: III.5.5
  kind: p
  original: So braucht allerdings der Bourgeois den Proletarier, aber nicht zum unmittelbaren Leben - er könnte ja von seinem Kapitale zehren -, sondern wie man einen Handelsartikel oder ein Lasttier braucht, zur Bereicherung.
  en: So the bourgeois certainly needs workers, not indeed for his immediate living, for at need he could consume his capital, but as we need an article of trade or a beast of burden,--as a means of profit.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 308-309
- id: III.5.6
  kind: p
  original: Der Proletarier verarbeitet dem Bourgeois die Waren, die dieser mit Nutzen verkauft.
  en: The proletarian produces the goods which the bourgeois sells with advantage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '309'
- id: III.5.7
  kind: p
  original: Wenn also die Nachfrage nach diesen Waren wächst, so daß die gegeneinander konkurrierenden Arbeiter alle beschäftigt werden, vielleicht einige zu wenig da sind, so fällt die Konkurrenz der Arbeiter weg, und die Bourgeois fangen an, gegeneinander zu konkurrieren.
  en: When, therefore, the demand for these goods increases so that all the competing working-men are employed, and a few more might perhaps be useful, the competition among the workers falls away, and the bourgeoisie begin to compete among themselves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '309'
- id: III.5.8
  kind: p
  original: Der Arbeiter suchende Kapitalist weiß sehr wohl, daß er bei den infolge der vermehrten Nachfrage steigenden Preisen größeren Gewinn macht, also auch lieber etwas mehr Lohn bezahlt, als sich den ganzen Gewinn entgehen läßt; er wirft mit der Wurst nach dem Schinken, und wenn er nur diesen bekommt, gönnt er dem Proletarier gern die Wurst.
  en: The capitalist in search of workmen knows very well that his profits increase as prices rise in consequence of the increased demand for his goods, and pays a trifle higher wages rather than let the whole profit escape him. He sends the butter to fetch the cheese, and getting the latter, leaves the butter ungrudgingly to the workers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '309'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.5.9
  kind: p
  original: So jagt ein Kapitalist dem andern die Arbeiter ab, und der Lohn steigt.
  en: So one capitalist after another goes in chase of workers, and wages rise; but only as high as the increasing demand permits.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '309'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: III.5.10
  kind: p
  original: Aber nur so hoch, wie die steigende Nachfrage erlaubt.
  en: ''
  joined_to: III.5.9
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '309'
- id: III.5.11
  kind: p
  original: Wenn der Kapitalist, der wohl von seinem außerordentlichen Gewinn etwas aufopferte, auch von seinem ordentlichen, d.h. Durchschnittsgewinn etwas opfern sollte, so hütet er sich wohl, höheren als Durchschnittslohn zu zahlen.
  en: If the capitalist, who willingly sacrificed a part of his extraordinary profit, runs into danger of sacrificing any part of his ordinary average profit, he takes very good care not to pay more than average wages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '309'
- id: III.6.1
  kind: p
  original: Hieraus können wir den Durchschnittslohn bestimmen.
  en: From this we can determine the average rate of wages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '309'
- id: III.6.2
  kind: p
  original: Unter Durchschnittsverhältnissen, d. h. wenn weder Arbeiter noch Kapitalisten Grund haben, besonders gegeneinander zu konkurrieren, wenn gerade so viel Arbeiter da sind, als beschäftigt werden können, um die gerade verlangten Waren zu verfertigen, wird der Lohn etwas mehr als das Minimum betragen.
  en: Under average circumstances, when neither workers nor capitalists have reason to compete, especially among themselves, when there are just as many workers at hand as can be employed in producing precisely the goods that are demanded, wages stand a little above the minimum.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '309'
- id: III.6.3
  kind: p
  original: Wie sehr er das Minimum übersteigen wird, wird von den Durchschnittsbedürfnissen und dem Zivilisationsgrad der Arbeiter abhängen.
  en: How far they rise above the minimum will depend upon the average needs and the grade of civilisation of the workers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '309'
- id: III.6.4
  kind: p
  original: Wenn die Arbeiter gewohnt sind, wöchentlich mehrere Male Fleisch zu essen, so werden sich die Kapitalisten bequemen müssen, den Arbeitern so viel Lohn zu bezahlen, daß diesen eine solche Nahrung erschwinglich wird.
  en: If the workers are accustomed to eat meat several times in the week, the capitalists must reconcile themselves to paying wages enough to make this food attainable, not less, because the workers are not competing among themselves and have no occasion to content themselves with less; not more, because the capitalists, in the absence of competition among themselves, have no occasion to attract working-men by extraordinary favours.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '309'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: III.6.5
  kind: p
  original: Nicht weniger, weil die Arbeiter nicht unter sich konkurrieren, also auch keine Ursache haben, mit weniger vorliebzunehmen; nicht mehr, weil der Mangel der Konkurrenz unter den Kapitalisten diesen keine Veranlassung gibt, die Arbeiter durch außerordentliche Begünstigungen an sich zu ziehen.
  en: ''
  joined_to: III.6.4
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '309'
- id: III.7.1
  kind: p
  original: Dies Maß der durchschnittlichen Bedürfnisse und der durchschnittlichen Zivilisation der Arbeiter ist durch die komplizierten Verhältnisse der heutigen englischen Industrie ein sehr verwickeltes und für verschiedene Arbeiterklassen verschiedenes geworden, wie schon oben angedeutet wurde.
  en: This standard of the average needs and the average civilisation of the workers has become very complicated by reason of the complications of English industry, and is different for different sorts of workers, as has been pointed out.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '309'
- id: III.7.2
  kind: p
  original: Die meisten industriellen Arbeiten erfordern indes eine gewisse Geschicklichkeit und Regelmäßigkeit, und für diese, die dann auch einen gewissen Zivilisationsgrad erfordern, muß dann auch der Durchschnittslohn so sein, daß er den Arbeiter veranlaßt, sich diese Geschicklichkeit anzueignen und dieser Regelmäßigkeit der Arbeit sich zu unterwerfen.
  en: Most industrial occupations demand a certain skill and regularity, and for these qualities which involve a certain grade of civilisation, the rate of wages must be such as to induce the worker to acquire such skill and subject himself to such regularity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '309'
- id: III.7.3
  kind: p
  original: Daher kommt es, daß der Lohn der Industriearbeiter durchschnittlich höher ist als der der bloßen Lastträger, Tagelöhner usw., namentlich höher als der der Arbeiter auf dem Lande, wozu freilich noch die Verteurung der Lebensmittel in den Städten ihr Teil beiträgt.
  en: Hence it is that the average wages of industrial workers are higher than those of mere porters, day labourers, etc., higher especially than those of agricultural labourers, a fact to which the additional cost of the necessities of life in cities contributes somewhat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 309-310
- id: III.8.1
  kind: p
  original: 'Oder deutsch gesprochen: Der Arbeiter ist rechtlich und faktisch Sklave der besitzenden Klasse, der Bourgeoisie, so sehr ihr Sklave, daß er wie eine Ware verkauft wird, wie eine Ware im Preise steigt und fällt.'
  en: In other words, the worker is, in law and in fact, the slave of the property-holding class, so effectually a slave that he is sold like a piece of goods, rises and falls in value like a commodity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '310'
- id: III.8.2
  kind: p
  original: Steigt die Nachfrage nach Arbeitern, so steigen die Arbeiter im Preise; fällt sie, so fallen sie im Preise; fällt sie so sehr, daß eine Anzahl Arbeiter nicht verkäuflich sind, "auf Lager bleiben", so bleiben sie eben liegen, und da sie vom bloßen Liegen nicht leben können, so sterben sie Hungers.
  en: If the demand for workers increases, the price of workers rises; if it falls, their price falls. If it falls so greatly that a number of them become unsaleable, if they are left in stock, they are simply left idle; and as they cannot live upon that, they die of starvation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '310'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.8.3
  kind: p
  original: Denn, um in der Sprache der Nationalökonomen zu sprechen, die auf ihren Unterhalt verwendeten Kosten würden sich nicht "reproduzieren", würden weggeworfnes Geld sein, und dazu gibt kein Mensch sein Kapital her.
  en: For, to speak in the words of the economists, the expense incurred in maintaining them would not be reproduced, would be money thrown away, and to this end no man advances capital; and, so far, Malthus was perfectly right in his theory of population.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '310'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: III.8.4
  kind: p
  original: Und soweit hat Herr Malthus mit seiner Populationstheorie vollkommen recht.
  en: ''
  joined_to: III.8.3
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '310'
- id: III.8.5
  kind: p
  original: Der ganze Unterschied gegen die alte, offenherzige Sklaverei ist nur der, daß der heutige Arbeiter frei zu sein scheint, weil er nicht auf einmal verkauft wird, sondern stückweise, pro Tag, pro Woche, pro Jahr, und weil nicht ein Eigentümer ihn dem andern verkauft, sondern er sich selbst auf diese Weise verkaufen muß, da er ja nicht der Sklave eines einzelnen, sondern der ganzen besitzenden Klasse ist.
  en: The only difference as compared with the old, outspoken slavery is this, that the worker of to-day seems to be free because he is not sold once for all, but piecemeal by the day, the week, the year, and because no one owner sells him to another, but he is forced to sell himself in this way instead, being the slave of no particular person, but of the whole property-holding class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '310'
- id: III.8.6
  kind: p
  original: Für ihn bleibt die Sache im Grunde dieselbe, und wenn dieser Schein der Freiheit ihm auch einerseits einige wirkliche Freiheit geben muß, so hat er auf der andern Seite auch den Nachteil, daß ihm kein Mensch seinen Unterhalt garantiert, daß er von seinem Herrn, der Bourgeoisie, jeden Augenblick zurückgestoßen und dem Hungertode überlassen werden kann, wenn die Bourgeoisie kein Interesse mehr an seiner Beschäftigung, an seiner Existenz hat.
  en: For him the matter is unchanged at bottom, and if this semblance of liberty necessarily gives him some real freedom on the one hand, it entails on the other the disadvantage that no one guarantees him a subsistence, he is in danger of being repudiated at any moment by his master, the bourgeoisie, and left to die of starvation, if the bourgeoisie ceases to have an interest in his employment, his existence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '310'
- id: III.8.7
  kind: p
  original: Die Bourgeoisie dagegen steht sich bei dieser Einrichtung viel besser als bei der alten Sklaverei - sie kann ihre Leute abdanken, wenn sie Lust hat, ohne daß sie dadurch ein angelegtes Kapital verlöre, und bekommt überhaupt die Arbeit viel wohlfeiler getan, als es sich durch Sklaven tun läßt, wie dies Adam Smith ihr zu Troste vorrechnet.
  en: The bourgeoisie, on the other hand, is far better off under the present arrangement than under the old slave system; it can dismiss its employees at discretion without sacrificing invested capital, and gets its work done much more cheaply than is possible with slave labour, as Adam Smith comfortingly pointed out.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - III.N2
  mew_page: '310'
- id: III.9.1
  kind: p
  original: 'Hieraus folgt denn auch, daß Adam Smith ganz recht hat, wenn er (a. a. O. [p. 133]) den Satz aufstellt: daß die Nachfrage nach Arbeitern, gerade wie die Nachfrage nach irgendeinem andern Artikel, die Produktion von Arbeitern, die Quantität der erzeugten Menschen reguliert, diese Produktion beschleunigt, wenn sie zu langsam geht, sie aufhält, wenn sie zu rasch fortschreitet".'
  en: 'Hence it follows, too, that Adam Smith was perfectly right in making the assertion: "That the demand for men, like that for any other commodity, necessarily regulates the production of men, quickens it when it goes on too slowly, and stops it when it advances too fast." Just as in the case of any other commodity!'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 310-311
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.10.1
  kind: p
  original: Ganz wie mit jedem andern Handelsartikel - ist zuwenig da, so steigen die Preise, d.h. der Lohn, es geht den Arbeitern besser, die Heiraten vermehren sich, es werden mehr Menschen erzeugt, es wachsen mehr Kinder heran, bis genug Arbeiter produziert sind; ist zuviel da, so fallen die Preise, es tritt Brotlosigkeit, Elend, Hungersnot und infolge davon Seuchen ein, und raffen die "überflüssige Bevölkerung" weg.
  en: If there are too few labourers at hand, prices, i.e. wages, rise, the workers are more prosperous, marriages multiply, more children are born and more live to grow up, until a sufficient number of labourers has been secured. If there are too many on hand, prices fall, want of work, poverty, and starvation, and consequent diseases arise, and the "surplus population" is put out of the way.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '311'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.10.2
  kind: p
  original: Und Malthus, der obigen Smithschen Satz weiter ausführt, hat ebenfalls in seiner Weise recht, wenn er behauptet, es sei stets überflüssige Bevölkerung da, es seien immer zuviel Menschen in der Welt; er hat nur dann unrecht, wenn er behauptet, es seien mehr Menschen da, als von den vorhandenen Lebensmitteln ernährt werden könnten.
  en: And Malthus, who carried the foregoing proposition of Smith farther, was also right, in his way, in asserting that there are always more people on hand than can be maintained from the available means of subsistence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '311'
- id: III.10.3
  kind: p
  original: Die überflüssige Bevölkerung wird vielmehr durch die Konkurrenz der Arbeiter unter sich erzeugt, die jeden einzelnen Arbeiter zwingt, täglich so viel zu arbeiten, als seine Kräfte ihm nur eben gestatten.
  en: Surplus population is engendered rather by the competition of the workers among themselves, which forces each separate worker to labour as much each day as his strength can possibly admit.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '311'
- id: III.10.4
  kind: p
  original: Wenn ein Fabrikant täglich zehn Arbeiter neun Stunden lang beschäftigen kann, so kann er, wenn die Arbeiter zehn Stunden täglich arbeiten, nur neun beschäftigen, und der zehnte wird brotlos.
  en: If a manufacturer can employ ten hands nine hours daily, he can employ nine if each works ten hours, and the tenth goes hungry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '311'
- id: III.10.5
  kind: p
  original: Und wenn der Fabrikant zu einer Zeit, wo die Nachfrage nach Arbeitern nicht sehr groß ist, die neun Arbeiter durch die Drohung, sie zu entlassen, zwingen kann, für denselben Lohn täglich eine Stunde mehr, also zehn Stunden zu arbeiten, so entläßt er den zehnten und spart dessen Lohn.
  en: And if a manufacturer can force the nine hands to work an extra hour daily for the same wages by threatening to discharge them at a time when the demand for hands is not very great, he discharges the tenth and saves so much wages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '311'
- id: III.10.6
  kind: p
  original: Wie hier im kleinen, so geht es bei einer Nation im großen.
  en: This is the process on a small scale, which goes on in a nation on a large one.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '311'
- id: III.10.7
  kind: p
  original: Die durch die Konkurrenz der Arbeiter unter sich auf ihr Maximum gesteigerten Leistungen jedes einzelnen, die Teilung der Arbeit, die Einführung von Maschinerie, die Benutzung der Elementarkräfte werfen eine Menge Arbeiter außer Brot.
  en: The productiveness of each hand raised to the highest pitch by the competition of the workers among themselves, the division of labour, the introduction of machinery, the subjugation of the forces of nature, deprive a multitude of workers of bread.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '311'
- id: III.10.8
  kind: p
  original: Diese brotlosen Arbeiter kommen aber aus dem Markte; sie können nichts mehr kaufen, also die früher von ihnen verlangte Quantität Handelswaren wird jetzt nicht mehr verlangt, braucht also nicht mehr angefertigt zu werden, die früher mit deren Verfertigung beschäftigten Arbeiter werden also wieder brotlos, treten vom Markte ebenfalls ab, und so geht es immer weiter, immer denselben Kreislauf durch - oder vielmehr, so würde es gehen, wenn nicht andre Umstände dazwischenträten.
  en: These starving workers are then removed from the market, they can buy nothing, and the quantity of articles of consumption previously required by them is no longer in demand, need no longer be produced; the workers previously employed in producing them are therefore driven out of work, and are also removed from the market, and so it goes on, always the same old round, or rather, so it would go if other circumstances did not intervene.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 311-312
- id: III.10.9
  kind: p
  original: Die Einführung der oben angeführten industriellen Mittel, die Produktion zu vermehren, führt nämlich auf die Dauer niedrigere Preise der produzierten Artikel und infolge davon einen vermehrten Konsum herbei, so daß ein großer Teil der außer Brot gesetzten Arbeiter in neuen Arbeitszweigen und freilich nach langen Leiden endlich doch wieder unterkommt.
  en: The introduction of the industrial forces already referred to for increasing production leads, in the course of time, to a reduction of prices of the articles produced and to consequent increased consumption, so that a large part of the displaced workers finally, after long suffering, find work again.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '312'
- id: III.10.10
  kind: p
  original: Tritt hierzu noch, wie es in England während der letzten sechzig Jahre geschah, die Eroberung fremder Märkte, so daß die Nachfrage nach Manufakturwaren fortwährend und rasch steigt, so steigt auch die Nachfrage nach Arbeitern und mit ihr die Bevölkerung in demselben Verhältnisse.
  en: If, in addition to this, the conquest of foreign markets constantly and rapidly increases the demand for manufactured goods, as has been the case in England during the past sixty years, the demand for hands increases, and, in proportion to it, the population.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '312'
- id: III.10.11
  kind: p
  original: Statt also abzunehmen, hat sich die Einwohnerzahl des britischen Reichs reißend schnell vermehrt, vermehrt sich noch fortwährend - und bei all der steigenden Ausdehnung der Industrie, bei all der im ganzen und großen steigenden Nachfrage nach Arbeitern hat England, nach dem Geständnisse aller offiziellen Parteien (d.h. der Tories, Whigs und Radikalen), dennoch fortwährend überzählige und überflüssige Bevölkerung, ist dennoch fortwährend im ganzen die Konkurrenz unter den Arbeitern größer als die Konkurrenz um Arbeiter.
  en: Thus, instead of diminishing, the population of the British Empire has increased with extraordinary rapidity, and is still increasing. Yet, in spite of the extension of industry, in spite of the demand for working-men which, in general, has increased, there is, according to the confession of all the official political parties (Tory, Whig, and Radical), permanent surplus, superfluous population; the competition among the workers is constantly greater than the competition to secure workers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '312'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.11.1
  kind: p
  original: Woher kommt dieser Widerspruch?
  en: Whence comes this incongruity?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '312'
- id: III.11.2
  kind: p
  original: Aus dem Wesen der Industrie und Konkurrenz und den darin begründeten Handelskrisen.
  en: It lies in the nature of industrial competition and the commercial crises which arise from them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '312'
- id: III.11.3
  kind: p
  original: Bei der heutigen regellosen Produktion und Verteilung der Lebensmittel, die nicht um der unmittelbaren Befriedigung der Bedürfnisse, sondern um des Geldgewinns willen unternommen wird, bei dem System, wonach jeder auf eigne Faust arbeitet und sich bereichert, muß alle Augenblicke eine Stockung entstehen.
  en: In the present unregulated production and distribution of the means of subsistence, which is carried on not directly for the sake of supplying needs, but for profit, in the system under which every one works for himself to enrich himself, disturbances inevitably arise at every moment.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '312'
- id: III.11.4
  kind: p
  original: England z.B. versorgt eine Menge Länder mit den verschiedensten Waren.
  en: For example, England supplies a number of countries with most diverse goods.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '312'
- id: III.11.5
  kind: p
  original: Wenn nun auch der Fabrikant weiß, wieviel von jedem Artikel in jedem einzelnen Lande jährlich gebraucht wird, so weiß er doch nicht, wieviel zu jeder Zeit die Vorräte dort betragen, und noch viel weniger, wieviel seine Konkurrenten dorthin schicken.
  en: Now, although the manufacturer may know how much of each article is consumed in each country annually, he cannot know how much is on hand at every given moment, much less can he know how much his competitors export thither.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '312'
- id: III.11.6
  kind: p
  original: Er kann nur aus den ewig schwankenden Preisen einen unsichern Schluß auf den Stand der Vorräte und der Bedürfnisse machen, er muß aufs Geratewohl seine Waren hinausschicken; alles geschieht blindlings ins Blaue hinein, mehr oder weniger nur unter der Ägide des Zufalls.
  en: He can only draw most uncertain inferences from the perpetual fluctuations in prices, as to the quantities on hand and the needs of the moment. He must trust to luck in exporting his goods. Everything is done blindly, as guess-work, more or less at the mercy of accident.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '312'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: III.11.7
  kind: p
  original: Auf die geringsten günstigen Berichte hin schickt jeder, was er kann - und nicht lange, so ist ein solcher Markt überfüllt mit Waren, der Verkauf stockt, die Kapitalien bleiben aus, die Preise fallen, und die englische Industrie hat keine Beschäftigung für ihre Arbeiter mehr.
  en: Upon the slightest favourable report, each one exports what he can, and before long such a market is glutted, sales stop, capital remains inactive, prices fall, and English manufacture has no further employment for its hands.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T1
    editions: '1892'
    reading: Rückflüsse
    base_text: … Verkauf stockt, die Kapitalien ‸ bleiben aus, die Preise …
  mew_page: 312-313
- id: III.11.8
  kind: p
  original: Im Anfange der industriellen Entwicklung beschränkten sich diese Stockungen auf einzelne Fabrikationszweige und einzelne Märkte; aber durch die zentralisierende Wirkung der Konkurrenz, die die Arbeiter, die in einem Arbeitszweige brotlos werden, auf die am leichtesten erlernbaren aus den übrigen, und die in einem Markte nicht mehr unterzubringenden Waren auf die übrigen Märkte wirft und dadurch allmählich die einzelnen kleinen Krisen näher zusammenrückt, sind diese nach und nach in eine einzige Reihe von periodisch wiederkehrenden Krisen vereinigt worden.
  en: In the beginning of the development of manufacture, these checks were limited to single branches and single markets; but the centralising tendency of competition which drives the hands thrown out of one branch into such other branches as are most easily accessible, and transfers the goods which cannot be disposed of in one market to other markets, has gradually brought the single minor crises nearer together and united them into one periodically recurring crisis.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '313'
- id: III.11.9
  kind: p
  original: Eine solche Krisis pflegt alle fünf Jahre auf eine kurze Periode der Blüte und des allgemeinen Wohlbefindens zu folgen; der heimische Markt wie alle fremden Märkte liegen voll englischer Fabrikate und können diese letzteren nur langsam konsumieren; die industrielle Bewegung stockt in fast allen Zweigen; die kleineren Fabrikanten und Kaufleute, die das Ausbleiben ihrer Kapitalien nicht überstehen können, fallieren, die größeren hören während der Dauer der schlimmsten Epoche auf, Geschäfte zu machen, setzen ihre Maschinen still oder lassen nur "kurze Zeit" arbeiten, d.h. etwa nur halbe Tage; der Lohn fällt durch die Konkurrenz der Brotlosen, die Verringerung der Arbeitszeit und den Mangel an gewinnbringenden Warenverkäufen; allgemeines Elend verbreitet sich unter den Arbeitern, die etwaigen kleinen Ersparnisse einzelner sind rasch verzehrt, die wohltätigen Anstalten werden überlaufen, die Armensteuer verdoppelt, verdreifacht sich und reicht doch nicht aus, die Zahl der Verhungernden vermehrt sich, und auf einmal tritt die ganze Menge der "überflüssigen" Bevölkerung in schreckenerregender Anzahl hervor.
  en: Such a crisis usually recurs once in five years after a brief period of activity and general prosperity; the home market, like all foreign ones, is glutted with English goods, which it can only slowly absorb, the industrial movement comes to a standstill in almost every branch, the small manufacturers and merchants who cannot survive a prolonged inactivity of their invested capital fail, the larger ones suspend business during the worst season, close their mills or work short time, perhaps half the day; wages fall by reason of the competition of the unemployed, the diminution of working-time and the lack of profitable sales; want becomes universal among the workers, the small savings, which individuals may have made, are rapidly consumed, the philanthropic institutions are overburdened, the poor-rates are doubled, trebled, and still insufficient, the number of the starving increases, and the whole multitude of "surplus" population presses in terrific numbers into the foreground.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '313'
- id: III.11.10
  kind: p
  original: Das dauert dann eine Zeitlang; die "Überflüssigen" schlagen sich durch, so gut es geht, oder schlagen sich auch nicht durch; die Wohltätigkeit und die Armengesetze helfen vielen zu einer mühsamen Fristung ihrer Existenz; andre finden hier und da in solchen Arbeitszweigen, die der Konkurrenz weniger offengelegt worden sind, die der Industrie ferner stehen, eine kümmerliche Lebenserhaltung - und mit wie wenigem kann der Mensch sich nicht für eine Zeitlang durchschlagen!
  en: This continues for a time; the "surplus" exist as best they may, or perish; philanthropy and the Poor Law help many of them to a painful prolongation of their existence. Others find scant means of subsistence here and there in such kinds of work as have been least open to competition, are most remote from manufacture. And with how little can a human being keep body and soul together for a time!
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T2
    editions: '1892'
    reading: '"Überschüssigen"'
    base_text: … eine Zeitlang; die "Überflüssigen" ‸ schlagen sich durch, so …
  mew_page: '313'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s); regrouped by the ingest (see REALIGN)
- id: III.11.11
  kind: p
  original: '- Allmählich wird der Stand der Dinge günstiger; die aufgehäuften Warenvorräte werden konsumiert, die allgemeine Niedergeschlagenheit der Handels- und Industriemänner hindert ein zu rasches Auffüllen der Lücken, bis endlich steigende Preise und günstige Berichte von allen Seiten die Tätigkeit wieder herstellen.'
  en: Gradually the state of things improve; the accumulations of goods are consumed, the general depression among the men of commerce and manufacture prevents a too hasty replenishing of the markets, and at last rising prices and favourable reports from all directions restore activity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '313'
- id: III.11.12
  kind: p
  original: Die Märkte liegen meist weit entfernt; bis die ersten neuen Zufuhren hingelangen können, steigt die Nachfrage fortwährend und mit ihr die Preise; man reißt sich um die zuerst ankommenden Waren, die ersten Verkäufe beleben den Verkehr noch mehr, die noch erwarteten Zufuhren versprechen noch höhere Preise, man fängt in Erwartung eines ferneren Aufschlags an, auf Spekulation zu kaufen und so die für den Konsum bestimmten Waren gerade zur nötigsten Zeit dem Konsum zu entziehen - die Spekulation steigert die Preise noch mehr, da sie andre zum Kaufen ermutigt und neue Zufuhren vorwegnimmt - alles das wird nach England berichtet, die Fabrikanten fangen wieder flott an zu arbeiten, neue Fabriken werden errichtet, alle Mittel aufgeboten, um die günstige Epoche auszubeuten; die Spekulation tritt auch hier ein, ganz mit derselben Wirkung wie auf den fremden Märkten, die Preise steigernd, die Waren dem Konsum wegnehmend, durch beides die industrielle Produktion zur höchsten Kraftanstrengung treibend - dann kommen die "unsoliden" Spekulanten, die mit fiktivem Kapital arbeiten, vom Kredit leben, die ruiniert sind, wenn sie nicht gleich flott verkaufen können, und stürzen sich in dies allgemeine, unordentliche Wettrennen nach Geldgewinn, vermehren die Unordnung und Hast durch ihre eigne zügellose Leidenschaft, welche Preise und Produktion bis zum Wahnsinn steigert - es ist ein tolles Treiben, das auch den Ruhigsten und Erfahrensten ergreift, es wird gehämmert, gesponnen, gewoben, als gälte es, die ganze Menschheit neu zu equipieren, als wären ein paar Tausend Millionen neuer Konsumenten auf dem Monde entdeckt worden.
  en: Most of the markets are distant ones; demand increases and prices rise constantly while the first exports are arriving; people struggle for the first goods, the first sales enliven trade still more, the prospective ones promise still higher prices; expecting a further rise, merchants begin to buy upon speculation, and so to withdraw from consumption the articles intended for it, just when they are most needed. Speculation forces prices still higher, by inspiring others to purchase, and appropriating new importations at once. All this is reported to England, manufacturers begin to produce with a will, new mills are built, every means is employed to make the most of the favourable moment. Speculation arises here, too, exerting the same influence as upon foreign markets, raising prices, withdrawing goods from consumption, spurring manufacture in both ways to the highest pitch of effort. Then come the daring speculators working with fictitious capital, living upon credit, ruined if they cannot speedily sell; they hurl themselves into this universal, disorderly race for profits, multiply the disorder and haste by their unbridled passion, which drives prices and production to madness. It is a frantic struggle, which carries away even the most experienced and phlegmatic; goods are spun, woven, hammered, as if all mankind were to be newly equipped, as though two thousand million new consumers had been discovered in the moon.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 313-314
  align: '1:6'
  review: true
  review_reason: 1 de sentence(s) matched to 6 en sentence(s); regrouped by the ingest (see REALIGN)
- id: III.11.13
  kind: p
  original: Auf einmal fangen drüben die unsoliden Spekulanten, die Geld haben müssen, zu verkaufen an - unter dem Marktpreise, versteht sich, denn die Sache hat Eile - dem einen Verkauf folgen mehrere, die Preise wanken, die Spekulanten werfen erschreckt ihre Waren in den Markt, der Markt ist in Unordnung, der Kredit ist erschüttert, ein Haus nach dem andern stellt die Zahlungen ein, Bankerott folgt auf Bankerott, und man findet, daß dreimal mehr Ware im Platze und unterwegs ist, als der Konsum erfordern würde.
  en: All at once the shaky speculators abroad, who must have money, begin to sell, below market price, of course, for their need is urgent; one sale is followed by others, prices fluctuate, speculators throw their goods upon the market in terror, the market is disordered, credit shaken, one house after another stops payments, bankruptcy follows bankruptcy, and the discovery is made that three times more goods are on hand or under way than can be consumed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '314'
- id: III.11.14
  kind: p
  original: Die Nachrichten kommen nach England, wo in der Zwischenzeit noch immer mit aller Gewalt fabriziert worden - ein panischer Schrecken ergreift auch hier die Gemüter, die Fallissements von drüben ziehen andre in England nach sich, die Stockung stürzt dazu noch eine Menge Häuser, in der Angst werden auch hier alle Vorräte gleich an den Markt gebracht und der Schrecken dadurch noch übertrieben.
  en: The news reaches England, where production has been going on at full speed meanwhile, panic seizes all hands, failures abroad cause others in England, the panic crushes a number of firms, all reserves are thrown upon the market here, too, in the moment of anxiety, and the alarm is still further exaggerated.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '314'
- id: III.11.15
  kind: p
  original: Das ist der Anfang der Krisis, die dann wieder genau denselben Verlauf nimmt wie die vorige und später wieder in eine Periode der Blüte umschlägt.
  en: This is the beginning of the crisis, which then takes precisely the same course as its predecessor, and gives place in turn to a season of prosperity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '314'
- id: III.11.16
  kind: p
  original: So geht es in einem fort, Blüte, Krisis, Blüte, Krisis, und dieser ewige Kreislauf, in dem sich die englische Industrie bewegt, pflegt sich, wie gesagt, in je fünf oder sechs Jahren zu vollenden.
  en: So it goes on perpetually,--prosperity, crisis, prosperity, crisis, and this perennial round in which English industry moves is, as has been before observed, usually completed once in five or six years.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '314'
- id: III.12.1
  kind: p
  original: Hieraus geht hervor, daß zu allen Zeiten, ausgenommen in den kurzen Perioden höchster Blüte, die englische Industrie eine unbeschäftigte Reserve von Arbeitern haben muß, um eben während der am meisten belebten Monate die im Markte verlangten Massen von Waren produzieren zu können.
  en: From this it is clear that English manufacture must have, at all times save the brief periods of highest prosperity, an unemployed reserve army of workers, in order to be able to produce the masses of goods required by the market in the liveliest months.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 314-315
- id: III.12.2
  kind: p
  original: Diese Reserve ist mehr oder minder zahlreich, je nachdem die Lage des Marktes minder oder mehr die Beschäftigung eines Teiles derselben veranlaßt.
  en: This reserve army is larger or smaller, according as the state of the market occasions the employment of a larger or smaller proportion of its members.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '315'
- id: III.12.3
  kind: p
  original: Und wenn auch bei dem höchsten Blütenstande des Marktes wenigstens zeitweise die Ackerbaudistrikte, Irland und die weniger von dem Aufschwung ergriffenen Arbeitszweige eine Anzahl Arbeiter liefern können, so bilden diese einerseits doch eine Minderzahl und gehören andrerseits ebenfalls zur Reserve, nur mit dem Unterschiede, daß der jedesmalige Aufschwung es erst zeigt, daß sie dazu gehören.
  en: And if at the moment of highest activity of the market the agricultural districts and the branches least affected by the general prosperity temporarily supply to manufacture a number of workers, these are a mere minority, and these too belong to the reserve army, with the single difference that the prosperity of the moment was required to reveal their connection with it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '315'
- id: III.12.4
  kind: p
  original: Man schränkt sich, wenn sie zu den belebteren Arbeitszweigen übertreten, daheim ein, um den Ausfall weniger zu merken, arbeitet länger, beschäftigt Weiber und jüngere Leute, und wenn sie beim Eintritt der Krisis entlassen zurückkommen, finden sie, daß ihre Stellen besetzt und sie überflüssig sind - wenigstens großenteils.
  en: When they enter upon the more active branches of work, their former employers draw in somewhat, in order to feel the loss less, work longer hours, employ women and younger workers, and when the wanderers discharged at the beginning of the crisis return, they find their places filled and themselves superfluous--at least in the majority of cases.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '315'
- id: III.12.5
  kind: p
  original: Diese Reserve, zu der während der Krisis eine ungeheure Menge und während der Zeitabschnitte, die man als Durchschnitt von Blüte und Krisis annehmen kann, noch immer eine gute Anzahl gehören - das ist die "überzählige Bevölkerung" Englands, die durch Betteln und Stehlen, durch Straßenkehren, Einsammeln von Pferdemist, Fahren mit Schubkarren oder Eseln, Herumhökern oder einzelne gelegentliche kleine Arbeiten eine kümmerliche Existenz fristet.
  en: This reserve army, which embraces an immense multitude during the crisis and a large number during the period which may be regarded as the average between the highest prosperity and the crisis, is the "surplus population" of England, which keeps body and soul together by begging, stealing, street-sweeping, collecting manure, pushing handcarts, driving donkeys, peddling, or performing occasional small jobs.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '315'
- id: III.12.6
  kind: p
  original: Man sieht in allen großen Städten eine Menge solcher Leute, die so durch kleine gelegentliche Verdienste "Leib und Seele zusammenhalten", wie die Engländer sagen.
  en: In every great town a multitude of such people may be found.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '315'
- id: III.12.7
  kind: p
  original: Es ist merkwürdig, zu welchen Erwerbszweigen diese "überflüssige Bevölkerung" ihre Zuflucht nimmt.
  en: It is astonishing in what devices this "surplus population" takes refuge.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '315'
- id: III.12.8
  kind: p
  original: Die Londoner Straßenkehrer (cross sweeps) sind weltbekannt; bisher wurden aber nicht nur diese Kreuzwege, sondern auch in andern großen Städten die Hauptstraßen von Arbeitslosen gekehrt, die von der Armen- oder Straßenverwaltung dazu angenommen wurden - jetzt hat man eine Maschine, die täglich durch die Straßen rasselt und den Arbeitslosen diesen Erwerbszweig verdorben hat.
  en: The London crossing-sweepers are known all over the world; but hitherto the principal streets in all the great cities, as well as the crossings, have been swept by people out of other work, and employed by the Poor Law guardians or the municipal authorities for the purpose. Now, however, a machine has been invented which rattles through the streets daily, and has spoiled this source of income for the unemployed.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T3
    editions: '1892'
    reading: crossing sweeps
    base_text: … Londoner Straßenkehrer (cross sweeps) ‸ sind weltbekannt; bisher wurden …
  mew_page: '315'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s); regrouped by the ingest (see REALIGN)
- id: III.12.9
  kind: p
  original: Auf den großen Routen, die in die Städte führen und auf denen viel Wagenverkehr ist, sieht man eine Menge Leute mit kleinen Karren, die den frischgefallnen Pferdemist mit Lebensgefahr zwischen den vorbeirollenden Kutschen und Omnibussen wegscharren und zum Verkauf einsammeln - dafür müssen sie oft noch wöchentlich ein paar Shilling an die Straßenverwaltung bezahlen, und an vielen Orten ist es ganz verboten, weil sonst die Straßenverwaltung ihren zusammengekehrten Kot, der nicht den gehörigen Anteil Pferdemist enthielt, nicht als Dünger verkaufen konnte.
  en: Along the great highways leading into the cities, on which there is a great deal of waggon traffic, a large number of people may be seen with small carts, gathering fresh horse-dung at the risk of their lives among the passing coaches and omnibuses, often paying a couple of shillings a week to the authorities for the privilege. But this occupation is forbidden in many places, because the ordinary street-sweepings thus impoverished cannot be sold as manure.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '315'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s); regrouped by the ingest (see REALIGN)
- id: III.12.10
  kind: p
  original: Glücklich sind diejenigen " Überflüssigen", die sich eine Schubkarre verschaffen und damit Fuhren tun können, noch glücklicher diejenigen, denen es gelingt, Geld für einen Esel nebst Karre zu bekommen - der Esel muß sich sein Futter selbst suchen oder erhält ein wenig zusammengesuchten Abfall und kann doch einiges Geld einbringen.
  en: Happy are such of the "surplus" as can obtain a push-cart and go about with it. Happier still those to whom it is vouchsafed to possess an ass in addition to the cart. The ass must get his own food or is given a little gathered refuse, and can yet bring in a trifle of money.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 315-316
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: III.13.1
  kind: p
  original: Die meisten "Überflüssigen" werfen sich aufs Hökern.
  en: Most of the "surplus" betake themselves to huckstering.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '316'
- id: III.13.2
  kind: p
  original: Namentlich Samstag abends, wenn die ganze Arbeiterbevölkerung auf den Straßen ist, sieht man die Menge zusammen, die davon lebt.
  en: On Saturday afternoons, especially, when the whole working population is on the streets, the crowd who live from huckstering and peddling may be seen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '316'
- id: III.13.3
  kind: p
  original: Schnürriemen, Hosenträger, Litzen, Orangen, Kuchen, kurz alle möglichen Artikel werden von zahllosen Männern, Frauen und Kindern ausgeboten - und auch sonst sieht man alle Augenblicke solche Höker mit Orangen, Kuchen, Gingerbeer oder Nettlebeer in den Straßen stehen oder umherziehen.
  en: Shoe and corset laces, braces, twine, cakes, oranges, every kind of small articles are offered by men, women, and children; and at other times also, such peddlers are always to be seen standing at the street corners, or going about with cakes and ginger-beer or nettle-beer.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - III.N3
  mew_page: '316'
- id: III.13.4
  kind: p
  original: Zündhölzchen und derartige Dinge, Siegellack, Patent-Kompositionen zum Feueranzünden usw. bilden ebenfalls Handelsartikel für diese Leute.
  en: Matches and such things, sealing-wax, and patent mixtures for lighting fires are further resources of such venders.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '316'
- id: III.13.5
  kind: p
  original: Andre - sogenannte jobbers - gehen in den Straßen umher und sehen sich nach gelegentlichen kleinen Arbeiten um; manchem derselben gelingt es, sich ein Tagewerk zu verschaffen, viele sind nicht so glücklich.
  en: Others, so-called jobbers, go about the streets seeking small jobs. Many of these succeed in getting a day's work, many are not so fortunate.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '316'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.14.1
  kind: p
  original: '"An den Toren aller Londoner Docks", erzählt der Rev[eren]d W. Champney, Prediger im östlichen Distrikt von London, "erscheinen jeden Morgen im Winter schon vor Tagesanbruch Hunderte von Armen, die in der Hoffnung, ein Tagewerk zu erlangen, auf die Eröffnung der Tore warten, und wenn die jüngsten und stärksten und die am meisten bekannten engagiert worden sind, gehen noch Hunderte niedergeschlagen von getäuschter Hoffnung zu ihren ärmlichen Wohnungen zurück."'
  en: '"At the gates of all the London docks," says the Rev. W. Champney, preacher of the East End, "hundreds of the poor appear every morning in winter before daybreak, in the hope of getting a day''s work. They await the opening of the gates; and, when the youngest and strongest and best known have been engaged, hundreds cast down by disappointed hope, go back to their wretched homes."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '316'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.15.1
  kind: p
  original: Was bleibt diesen Leuten, wenn sie keine Arbeit finden und sich nicht gegen die Gesellschaft auflehnen wollen, anders übrig als zu betteln?
  en: When these people find no work and will not rebel against society, what remains for them but to beg?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '316'
- id: III.15.2
  kind: p
  original: Und da kann man sich nicht über die Menge von Bettlern, die meist arbeitsfähige Männer sind, wundern, mit denen die Polizei fortwährend zu kämpfen hat.
  en: And surely no one can wonder at the great army of beggars, most of them able-bodied men, with whom the police carries on perpetual war.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '316'
- id: III.15.3
  kind: p
  original: Die Bettelei dieser Männer hat aber einen eigentümlichen Charakter.
  en: But the beggary of these men has a peculiar character.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '316'
- id: III.15.4
  kind: p
  original: Solch ein Mann pflegt mit seiner Familie umherzuziehen, in den Straßen ein bittendes Lied zu singen oder in einem Vortrage die Mildtätigkeit der Nachbarn anzusprechen.
  en: Such a man usually goes about with his family singing a pleading song in the streets or appealing, in a speech, to the benevolence of the passers-by.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '316'
- id: III.15.5
  kind: p
  original: Und es ist auffallend, daß man diese Bettler fast nur in Arbeiterbezirken findet, daß es fast nur Gaben von Arbeitern sind, von denen sie sich erhalten.
  en: And it is a striking fact that these beggars are seen almost exclusively in the working-people's districts, that it is almost exclusively the gifts of the poor from which they live.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '316'
- id: III.15.6
  kind: p
  original: Oder die Familie stellt sich schweigend an eine belebte Straße und läßt, ohne ein Wort zu sagen, den bloßen Anblick der Hülflosigkeit wirken.
  en: Or the family takes up its position in a busy street, and without uttering a word, lets the mere sight of its helplessness plead for it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '316'
- id: III.15.7
  kind: p
  original: Auch hier rechnen sie nur auf die Teilnahme der Arbeiter, die aus Erfahrung wissen, wie der Hunger tut, und jeden Augenblick in die gleiche Lage kommen können; denn man findet diese stumme und doch so höchst ergreifende Ansprache fast nur an solchen Straßen, die von Arbeitern frequentiert, und zu solchen Stunden, in denen sie von Arbeitern passiert werden; namentlich aber Sonnabend abends, wo überhaupt die "Geheimnisse" der Arbeiterbezirke in den Hauptstraßen sich enthüllen und die Mittelklasse sich von diesen so verunreinigten Gegenden soviel wie möglich zurückzieht.
  en: In this case, too, they reckon upon the sympathy of the workers alone, who know from experience how it feels to be hungry, and are liable to find themselves in the same situation at any moment; for this dumb, yet most moving appeal, is met with almost solely in such streets as are frequented by working-men, and at such hours as working-men pass by; but especially on summer evenings, when the "secrets" of the working-people's quarters are generally revealed, and the middle-class withdraws as far as possible from the district thus polluted.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 316-317
- id: III.15.8
  kind: p
  original: Und wer von den Überflüssigen Mut und Leidenschaft genug hat, sich der Gesellschaft offen zu widersetzen und auf den versteckten Krieg, den die Bourgeoisie gegen ihn führt, mit dem offnen Krieg gegen die Bourgeoisie zu antworten, der geht hin, stiehlt und raubt und mordet.
  en: And he among the "surplus" who has courage and passion enough openly to resist society, to reply with declared war upon the bourgeoisie to the disguised war which the bourgeoisie wages upon him, goes forth to rob, plunder, murder, and burn!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '317'
- id: III.16.1
  kind: p
  original: Dieser Überflüssigen gibt es nach den Berichten der Armengesetzkommisäre durchschnittlich anderthalb Millionen in England und Wales, in Schottland läßt sich die Zahl wegen Mangel an Armengesetzen nicht bestimmen, und von Irland werden wir speziell zu sprechen haben.
  en: Of this surplus population there are, according to the reports of the Poor Law commissioners, on an average, a million and a half in England and Wales; in Scotland the number cannot be ascertained for want of Poor Law regulations, and with Ireland we shall deal separately.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '317'
- id: III.16.2
  kind: p
  original: Diese anderthalb Millionen schließen übrigens nur diejenigen ein, die wirklich die Armenverwaltung um Hülfe ansprechen; die große Menge, die sich, ohne dies letzte, so sehr gescheute Auskunftsmittel anzuwenden, forthilft, ist darin nicht eingeschlossen; dafür fällt aber auch ein guter Teil der obigen Zahl auf die Ackerbaudistrikte und kommt hier also nicht in Betracht.
  en: Moreover, this million and a half includes only those who actually apply to the parish for relief; the great multitude who struggle on without recourse to this most hated expedient, it does not embrace. On the other hand, a good part of the number belongs to the agricultural districts, and does not enter into the present discussion.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '317'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.16.3
  kind: p
  original: Während einer Krisis vermehrt sich diese Zahl natürlich um ein bedeutendes, und die Not steigt auf den höchsten Grad.
  en: During a crisis this number naturally increases markedly, and want reaches its highest pitch.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T4
    editions: '1892'
    reading: die
    base_text: … Krisis vermehrt sich diese ‸ Zahl natürlich um ein …
  mew_page: '317'
- id: III.16.4
  kind: p
  original: Nehmen wir z.B. die Krisis von 1842, die, weil die letzte, auch die heftigste war - denn die Intensität der Krisen wächst mit jeder Wiederholung, und die nächste, die wohl 1847 spätestens eintreten wird, wird allem Anscheine nach noch heftiger und dauernder sein.
  en: Take, for instance, the crisis of 1842, which, being the latest, was the most violent; for the intensity of the crisis increases with each repetition, and the next, which may be expected not later than 1847, will probably be still more violent and lasting.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - III.N4
  mew_page: '317'
- id: III.16.5
  kind: p
  original: Während dieser Krisis stieg die Armensteuer in allen Städten auf einen nie gekannten Höhepunkt.
  en: During this crisis the poor-rates rose in every town to a hitherto unknown height.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '317'
- id: III.16.6
  kind: p
  original: 'Unter andern mußten in Stockport von jedem Pfund, das an Hausmiete bezahlt wurde, acht Shilling Armensteuer bezahlt werden, so daß die Steuer allein 40 Prozent vom Mietbetrage der ganzen Stadt ausmachte; dazu standen ganze Straßen leer, so daß mindestens 20 000 Einwohner weniger als gewöhnlich da waren und man an die Türen der leerstehenden Häuser geschrieben fand: Stockport to let - Stockport zu vermieten.'
  en: 'In Stockport, among other towns, for every pound paid in house-rent, eight shillings of poor-rate had to be paid, so that the rate alone formed forty per cent. of the house-rent. Moreover, whole streets stood vacant, so that there were at least twenty thousand fewer inhabitants than usual, and on the doors of the empty houses might be read: "Stockport to let."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '317'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.16.7
  kind: p
  original: In Bolton, wo in gewöhnlichen Jahren der Armensteuer zahlende Mietertrag durchschnittlich 86 000 Pfd. St. betrug, sank er auf 36 000 Pfd. St.; dagegen stieg die Anzahl der zu unterstützenden Armen auf 14 000, also über 20 Prozent der ganzen Einwohnerzahl.
  en: In Bolton, where, in ordinary years, the rents from which rates are paid average 86,000 pounds, they sank to 36,000 pounds. The number of the poor to be supported rose, on the other hand, to 14,000, or more than twenty per cent. of the whole number of inhabitants.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '317'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.16.8
  kind: p
  original: In Leeds hatte die Armenverwaltung einen Reservefonds von 10 000 Pfd. St. - dieser, sowie eine Kollekte von 7 000 Pfd. St., wurde schon, ehe die Krisis ihren Höhepunkt erreichte, vollständig erschöpft.
  en: In Leeds, the Poor Law guardians had a reserve fund of 10,000 pounds. This, with a contribution of 7,000 pounds, was wholly exhausted before the crisis reached its height. So it was everywhere.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 317-318
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: III.16.9
  kind: p
  original: So war es überall; ein Bericht, den ein Komitee der Anti-Korngesetz-Ligue im Januar 1843 über den Zustand der Industriebezirke im Jahre 1842 erstattete und der auf ausführlichen Angaben der Fabrikanten beruhte, sagt aus, daß die Armensteuer durchschnittlich doppelt so hoch gewesen sei als 1839 und die Zahl der Unterstützungsbedürftigen sich seit jener Zeit verdreifacht, ja verfünffacht habe; daß eine Menge Applikanten einer Klasse angehörten, die bis jetzt nie um Unterstützung angehalten hätten usw.; daß die arbeitende Klasse über zwei Drittel weniger Lebensmittel zu verfügen habe als 1834/36; daß die Konsumtion von Fleisch bedeutend geringer gewesen sei - an einigen Orten 20 Prozent, an andern bis zu 60 Prozent; daß selbst die gewöhnlichen Handwerker, Schmiede, Maurer usw., die sonst in den gedrücktesten Perioden noch volle Beschäftigung hatten, ebenfalls viel an Mangel an Arbeit und Lohnherabsetzung gelitten hatten - und daß selbst jetzt, im Januar 1843, der Lohn noch fortwährend im Fallen sei.
  en: A report drawn up in January, 1843, by a committee of the Anti-Corn Law League, on the condition of the industrial districts in 1842, which was based upon detailed statements of the manufacturers, asserts that the poor-rate was, taking the average, twice as high as in 1839, and that the number of persons requiring relief has trebled, even quintupled, since that time; that a multitude of applicants belong to a class which had never before solicited relief; that the working-class commands more than two-thirds less of the means of subsistence than from 1834-1836; that the consumption of meat had been decidedly less, in some places twenty per cent., in others reaching sixty per cent. less; that even handicraftsmen, smiths, bricklayers, and others, who usually have full employment in the most depressed periods, now suffered greatly from want of work and reduction of wages; and that, even now, in January, 1843, wages are still steadily falling.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '318'
- id: III.16.10
  kind: p
  original: Und das sind Berichte von Fabrikanten!
  en: And these are the reports of manufacturers!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '318'
- id: III.17.1
  kind: p
  original: Die brotlosen Arbeiter, deren Fabriken stillstanden, deren Brotherren ihnen keine Arbeit geben konnten, standen überall auf den Straßen, bettelten einzeln oder in Haufen, belagerten scharenweise die Chausseen und sprachen die Vorüberkommenden um Unterstützung an - sie baten aber nicht kriechend, wie gewöhnliche Bettler, sondern drohend durch ihre Zahl, ihre Gebärden und Worte.
  en: The starving workmen, whose mills were idle, whose employers could give them no work, stood in the streets in all directions, begged singly or in crowds, besieged the sidewalks in armies, and appealed to the passers-by for help; they begged, not cringing like ordinary beggars, but threatening by their numbers, their gestures, and their words.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '318'
- id: III.17.2
  kind: p
  original: So sah es in allen Industriebezirken aus, von Leicester bis Leeds und von Manchester bis Birmingham.
  en: Such was the state of things in all the industrial districts, from Leicester to Leeds, and from Manchester to Birmingham.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '318'
- id: III.17.3
  kind: p
  original: Hier und da brachen einzelne Unruhen aus, so im Juli in den Töpfereien von Nord-Staffordshire; die fürchterlichste Gärung herrschte unter den Arbeitern, bis sie endlich im August in der allgemeinen Insurrektion der Fabrikdistrikte zum Ausbruche kam.
  en: Here and there disturbances arose, as in the Staffordshire potteries, in July. The most frightful excitement prevailed among the workers until the general insurrection broke out throughout the manufacturing districts in August.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '318'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.17.4
  kind: p
  original: Als ich Ende November 1842 nach Manchester kam, standen noch überall eine Menge Arbeitsloser an den Straßenecken, und viele Fabriken standen noch still; in den nächsten Monaten bis Mitte 1843 verloren sich die unfreiwilligen Eckensteher allmählich, und die Fabriken kamen wieder in Betrieb.
  en: When I came to Manchester in November, 1842, there were crowds of unemployed working-men at every street corner, and many mills were still standing idle. In the following months these unwilling corner loafers gradually vanished, and the factories came into activity once more.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '318'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.18.1
  kind: p
  original: Was hier für eine Masse von Elend und Not unter diesen Arbeitslosen während einer solchen Krisis herrscht, brauche ich wohl nicht erst zu sagen.
  en: To what extent want and suffering prevail among these unemployed during such a crisis, I need not describe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '318'
- id: III.18.2
  kind: p
  original: Die Armensteuer reicht nicht aus - bei weitem nicht; die Wohltätigkeit der Reichen ist ein Schlag ins Wasser, dessen Wirkung in einem Augenblick verschwunden ist; die Bettelei kann, wo so viele sind, nur wenigen helfen.
  en: The poor-rates are insufficient, vastly insufficient; the philanthropy of the rich is a rain-drop in the ocean, lost in the moment of falling, beggary can support but few among the crowds.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '318'
- id: III.18.3
  kind: p
  original: Wenn nicht die kleinen Krämer den Arbeitern zu solchen Zeiten auf Kredit verkauften, solange sie können - sie lassen sich freilich auch tüchtig dafür nachzahlen -, und wenn nicht die Arbeiter unter sich einander unterstützten, solange sie können, so würde jede Krisis allerdings Massen von "Überflüssigen" durch Hungersnot wegraffen.
  en: If the small dealers did not sell to the working-people on credit at such times as long as possible--paying themselves liberally afterwards, it must be confessed--and if the working-people did not help each other, every crisis would remove a multitude of the surplus through death by starvation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 318-319
- id: III.18.4
  kind: p
  original: So aber, da die gedrückteste Epoche doch nur kurz ist, ein Jahr, höchstens zwei oder dritthalb Jahre dauert, kommen die meisten doch noch mit dem nackten Leben und schweren Entbehrungen davon.
  en: Since, however, the most depressed period is brief, lasting, at worst, but one, two, or two and a half years, most of them emerge from it with their lives after dire privations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '319'
- id: III.18.5
  kind: p
  original: Daß indirekt, durch Krankheiten usw., in jeder Krisis eine Menge Opfer fallen, werden wir sehen.
  en: But indirectly by disease, etc., every crisis finds a multitude of victims, as we shall see.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '319'
- id: III.18.6
  kind: p
  original: Einstweilen wenden wir uns zu einer andern Ursache der Erniedrigung, der die englischen Arbeiter anheimgegeben sind, einer Ursache, die noch fortwährend daran arbeitet, jene Klasse immer tiefer und tiefer herabzudrücken.
  en: First, however, let us turn to another cause of abasement to which the English worker is exposed, a cause permanently active in forcing the whole class downwards.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '319'
