section: I
title_original: Das industrielle Proletariat
title_en: The Industrial Proletariat
author: Friedrich Engels
date: 1844-11/1845-03
original_language: de
anchor_language: de
source_original: MEW 2, S. 225-506 (Dietz, Berlin 1972) via mlwerke.de; text of the first edition (Leipzig 1845), readings of the second edition (Stuttgart 1892) as variants
source_en: Florence Kelley Wischnewetzky's translation (New York 1887) in the London edition of 1892 (Swan Sonnenschein), Project Gutenberg ebook 17306 (public domain)
verses:
- id: I.0.1
  kind: heading
  original: Das industrielle Proletariat
  en: THE INDUSTRIAL PROLETARIAT.
  modern: ''
  modern_status: empty
  notes: ''
- id: I.1.1
  kind: p
  original: Die Reihenfolge, nach der wir die verschiedenen Sektionen des Proletariats zu betrachten haben, ergibt sich von selbst aus der vorhergehenden Geschichte seiner Entstehung.
  en: The order of our investigation of the different sections of the proletariat follows naturally from the foregoing history of its rise.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: I.1.2
  kind: p
  original: Die ersten Proletarier gehörten der Industrie an und wurden direkt durch sie erzeugt; die industriellen Arbeiter, diejenigen, die sich mit der Verarbeitung von Rohstoffen beschäftigen, werden also zunächst unsre Aufmerksamkeit in Anspruch nehmen.
  en: The first proletarians were connected with manufacture, were engendered by it, and accordingly, those employed in manufacture, in the working up of raw materials, will first claim our attention.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: I.1.3
  kind: p
  original: 'Die Erzeugung des industriellen Materials, der Roh- und Brennstoffe selbst, wurde erst infolge des industriellen Umschwungs bedeutend und konnte so ein neues Proletariat hervorbringen: die Arbeiter in den Kohlengruben und Metallbergwerken.'
  en: The production of raw materials and of fuel for manufacture attained importance only in consequence of the industrial change, and engendered a new proletariat, the coal and metal miners.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: I.1.4
  kind: p
  original: In dritter Instanz wirkte die Industrie auf den Ackerbau und in vierter auf Irland zurück, und demgemäß ist auch den dahin gehörenden Fraktionen des Proletariats ihre Stelle anzuweisen.
  en: Then, in the third place, manufacture influenced agriculture, and in the fourth, the condition of Ireland; and the fractions of the proletariat belonging to each, will find their place accordingly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: I.1.5
  kind: p
  original: Wir werden auch finden, daß, etwa mit Ausnahme der Irländer, der Bildungsgrad der verschiedenen Arbeiter genau im Verhältnis zu ihrem Zusammenhange mit der Industrie steht und daß also die industriellen Arbeiter am meisten, die bergbauenden schon weniger und die ackerbauenden noch fast gar nicht über ihre Interessen aufgeklärt sind.
  en: We shall find, too, that with the possible exception of the Irish, the degree of intelligence of the various workers is in direct proportion to their relation to manufacture; and that the factory hands are most enlightened as to their own interests, the miners somewhat less so, the agricultural labourers scarcely at all.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: I.1.6
  kind: p
  original: Wir werden selbst unter den industriellen Proletariern diese Reihenfolge wiederfinden und sehn, wie die Fabrikarbeiter, diese ältesten Kinder der industriellen Revolution, von Anfang an bis jetzt der Kern der Arbeiterbewegung gewesen sind und wie die übrigen ganz in demselben Maße sich der Bewegung anschlossen, in welchem ihr Handwerk von dem Umschwung der Industrie ergriffen wurde; wir werden so an dem Beispiel Englands, an dem gleichen Schritt, den die Arbeiterbewegung mit der industriellen Bewegung hielt, die geschichtliche Bedeutung der Industrie verstehen lernen.
  en: We shall find the same order again among the industrial workers, and shall see how the factory hands, eldest children of the industrial revolution, have from the beginning to the present day formed the nucleus of the Labour Movement, and how the others have joined this movement just in proportion as their handicraft has been invaded by the progress of machinery. We shall thus learn from the example which England offers, from the equal pace which the Labour Movement has kept with the movement of industrial development, the historical significance of manufacture.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: I.2.1
  kind: p
  original: Da aber in diesem Augenblick so ziemlich das ganze industrielle Proletariat von der Bewegung ergriffen ist und die Lage der einzelnen Sektionen, eben weil sie alle industriell sind, viel Gemeinsames hat, so werden wir dies vorweg durchzunehmen haben, damit wir später jede einzelne Verzweigung desto schärfer in ihrer Eigentümlichkeit betrachten können.
  en: Since, however, at the present moment, pretty much the whole industrial proletariat is involved in the movement, and the condition of the separate sections has much in common, because they all are industrial, we shall have first to examine the condition of the industrial proletariat as a whole, in order later to notice more particularly each separate division with its own peculiarities.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '253'
- id: I.3.1
  kind: p
  original: Schon oben wurde angedeutet, wie die Industrie den Besitz in den Händen weniger zentralisiert.
  en: It has been already suggested that manufacture centralises property in the hands of the few.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: I.3.2
  kind: p
  original: Sie erfordert große Kapitalien, mit denen sie kolossale Etablissements errichtet und dadurch die kleine, handwerksmäßige Bourgeoisie ruiniert - und mit denen sie sich die Naturkräfte dienstbar macht, um den einzelnen Handarbeiter aus dem Markte zu schlagen.
  en: It requires large capital with which to erect the colossal establishments that ruin the petty trading bourgeoisie and with which to press into its service the forces of Nature, so driving the hand labour of the independent workman out of the market.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: I.3.3
  kind: p
  original: Die Teilung der Arbeit, die Benutzung der Wasser- und besonders der Dampfkraft und der Mechanismus der Maschinerie - das sind die drei großen Hebel, mit denen die Industrie seit der Mitte des vorigen Jahrhunderts daran arbeitet, die Welt aus ihren Fugen zu heben.
  en: The division of labour, the application of water and especially steam, and the application of machinery, are the three great levers with which manufacture, since the middle of the last century, has been busy putting the world out of joint.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: I.3.4
  kind: p
  original: Die kleine Industrie schuf die Mittelklasse, die große schuf die Arbeiterklasse und hob die wenigen Auserwählten der Mittelklasse auf den Thron, aber nur um sie einst desto sicherer zu stürzen.
  en: Manufacture, on a small scale, created the middle-class; on a large scale, it created the working-class, and raised the elect of the middle-class to the throne, but only to overthrow them the more surely when the time comes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: I.3.5
  kind: p
  original: Einstweilen indes ist es ein nicht geleugnetes und leicht erklärbares Faktum, daß die zahlreiche kleine Mittelklasse der "guten alten Zeit" durch die Industrie zerstört und in reiche Kapitalisten auf der einen und arme Arbeiter auf der andern Seite aufgelöst ist.
  en: Meanwhile, it is an undenied and easily explained fact that the numerous, petty middle-class of the "good old times" has been annihilated by manufacture, and resolved into rich capitalists on the one hand and poor workers on the other.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - I.N1
  mew_page: '254'
- id: I.4.1
  kind: p
  original: Die zentralisierende Tendenz der Industrie bleibt aber hierbei nicht stehen.
  en: The centralising tendency of manufacture does not, however, stop here.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: I.4.2
  kind: p
  original: Die Bevölkerung wird ebenso zentralisiert wie das Kapital; ganz natürlich, denn in der Industrie wird der Mensch, der Arbeiter, nur als ein Stück Kapital angesehen, dem der Fabrikant dafür, daß es ihm zur Benutzung sich hingibt, Zinsen, unter dem Namen Arbeitslohn, erstattet.
  en: Population becomes centralised just as capital does; and, very naturally, since the human being, the worker, is regarded in manufacture simply as a piece of capital for the use of which the manufacturer pays interest under the name of wages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: I.4.3
  kind: p
  original: Das industrielle große Etablissement erfordert viele Arbeiter, die zusammen in einem Gebäude arbeiten; sie müssen zusammen wohnen, sie bilden schon bei einer mäßigen Fabrik ein Dorf.
  en: A manufacturing establishment requires many workers employed together in a single building, living near each other and forming a village of themselves in the case of a good-sized factory.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: I.4.4
  kind: p
  original: Sie haben Bedürfnisse und zur Befriedigung derselben andere Leute nötig; Handwerker, Schneider, Schuster, Bäcker, Maurer und Schreiner ziehen sich hin.
  en: They have needs for satisfying which other people are necessary; handicraftsmen, shoemakers, tailors, bakers, carpenters, stonemasons, settle at hand.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: I.4.5
  kind: p
  original: Die Bewohner des Dorfs, namentlich die jüngere Generation, gewöhnt sich an die Fabrikarbeit, wird mit ihr vertraut, und wenn die erste Fabrik, wie sich versteht, nicht alle beschäftigen kann, so fällt der Lohn, und die Ansiedlung neuer Fabrikanten ist die Folge davon.
  en: The inhabitants of the village, especially the younger generation, accustom themselves to factory work, grow skilful in it, and when the first mill can no longer employ them all, wages fall, and the immigration of fresh manufacturers is the consequence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: I.4.6
  kind: p
  original: So wird aus dem Dorf eine kleine Stadt, aus der kleinen Stadt eine große.
  en: So the village grows into a small town, and the small town into a large one.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: I.4.7
  kind: p
  original: Je größer die Stadt, desto größer die Vorteile der Ansiedlung.
  en: The greater the town, the greater its advantages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '254'
- id: I.4.8
  kind: p
  original: Man hat Eisenbahnen, Kanäle und Landstraßen; die Auswahl zwischen den erfahrnen Arbeitern wird immer größer; man kann neue Etablissements wegen der Konkurrenz unter den Bauleuten und Maschinenfabrikanten, die man gleich bei der Hand hat, billiger anlegen als in einer entferntern Gegend, wohin Bauholz, Maschinerie, Bauleute und Fabrikarbeiter erst transportiert werden müssen; man hat einen Markt, eine Börse, an der sich die Käufer drängen; man steht in direkter Verbindung mit den Märkten, die das rohe Material liefern oder die fertige Ware abnehmen.
  en: It offers roads, railroads, canals; the choice of skilled labour increases constantly, new establishments can be built more cheaply because of the competition among builders and machinists who are at hand, than in remote country districts, whither timber, machinery, builders, and operatives must be brought; it offers a market to which buyers crowd, and direct communication with the markets supplying raw material or demanding finished goods.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 254-255
- id: I.4.9
  kind: p
  original: Daher die wunderbar schnelle Vermehrung der großen Fabrikstädte.
  en: Hence the marvellously rapid growth of the great manufacturing towns.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: I.4.10
  kind: p
  original: Allerdings hat das platte Land dagegen wieder den Vorteil, daß dort gewöhnlich der Lohn billiger ist; das platte Land und die Fabrikstadt bleiben so in fortwährender Konkurrenz, und wenn heute der Vorteil auf Seite der Stadt ist, so sinkt morgen draußen der Lohn wieder so viel, daß neue Anlagen auf dem Lande sich vorteilhafter anbringen lassen.
  en: The country, on the other hand, has the advantage that wages are usually lower than in town, and so town and country are in constant competition; and, if the advantage is on the side of the town to-day, wages sink so low in the country to-morrow, that new investments are most profitably made there.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: I.4.11
  kind: p
  original: Aber dabei bleibt die zentralisierende Tendenz der Industrie doch in voller Kraft, und jede neue Fabrik, die auf dem Lande angelegt wird, trägt den Keim zu einer Fabrikstadt in sich.
  en: But the centralising tendency of manufacture continues in full force, and every new factory built in the country bears in it the germ of a manufacturing town.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: I.4.12
  kind: p
  original: Wäre es möglich, daß dies tolle Treiben der Industrie noch einhundert Jahre so voranginge, so würde jeder der industriellen Bezirke Englands eine einzige große Fabrikstadt sein und Manchester und Liverpool bei Warrington oder Newton sich begegnen; denn auch im Handel wirkt diese Zentralisation der Bevölkerung ganz auf dieselbe Weise, und darum monopolisieren ein paar große Häfen wie Liverpool, Bristol, Hull und London fast ganz den Seehandel des britischen Reichs.
  en: If it were possible for this mad rush of manufacture to go on at this rate for another century, every manufacturing district of England would be one great manufacturing town, and Manchester and Liverpool would meet at Warrington or Newton; for in commerce, too, this centralisation of the population works in precisely the same way, and hence it is that one or two great harbours, such as Hull and Liverpool, Bristol, and London, monopolise almost the whole maritime commerce of Great Britain.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: I.5.1
  kind: p
  original: Da in diesen großen Städten die Industrie und der Handel am vollständigsten zu ihrer Entwicklung kommen, so treten also auch hier ihre Konsequenzen in bezug auf das Proletariat am deutlichsten und offensten hervor.
  en: Since commerce and manufacture attain their most complete development in these great towns, their influence upon the proletariat is also most clearly observable here.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: I.5.2
  kind: p
  original: Hier ist die Zentralisation des Besitzes auf den höchsten Punkt gekommen; hier sind die Sitten und Verhältnisse der guten alten Zeit am gründlichsten vernichtet, hier ist man weit genug gekommen, um sich bei dem Namen Old merry England [Altes glückliches England] gar nichts mehr denken zu können, weil man das Old England selbst nicht einmal aus der Erinnerung und den Erzählungen der Großeltern mehr kennt.
  en: Here the centralisation of property has reached the highest point; here the morals and customs of the good old times are most completely obliterated; here it has gone so far that the name Merry Old England conveys no meaning, for Old England itself is unknown to memory and to the tales of our grandfathers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: I.5.3
  kind: p
  original: Daher gibt es hier auch nur eine reiche und eine arme Klasse, denn die kleine Bourgeoisie verschwindet mit jedem Tage mehr.
  en: Hence, too, there exist here only a rich and a poor class, for the lower middle-class vanishes more completely with every passing day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: I.5.4
  kind: p
  original: Sie, die stabilste Klasse früher, ist jetzt die beweglichste geworden; sie besteht nur noch aus den wenigen Trümmern einer vergangenen Zeit und einer Anzahl von Leuten, die sich gern ein Vermögen machen wollen, kompletten Industrierittern und Spekulanten, von denen einer reich wird, wo neunundneunzig Bankerott machen und wo von diesen neunundneunzig mehr als die Hälfte nur vom Bankerottieren leben.
  en: Thus the class formerly most stable has become the most restless one. It consists to-day of a few remnants of a past time, and a number of people eager to make fortunes, industrial Micawbers and speculators of whom one may amass a fortune, while ninety-nine become insolvent, and more than half of the ninety-nine live by perpetually repeated failure.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: I.6.1
  kind: p
  original: Die ungeheure Mehrzahl in diesen Städten bilden aber die Proletarier, und wie es diesen ergeht, welchen Einfluß die große Stadt auf sie ausübt, werden wir jetzt untersuchen.
  en: But in these towns the proletarians are the infinite majority, and how they fare, what influence the great town exercises upon them, we have now to investigate.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '255'
- id: I.N1.1.1
  kind: note
  original: Vgl. hierüber meine "Umrisse zu einer Kritik der Nationalökonomie" in den "Deutsch-Französischen Jahrbüchern".
  en: Compare on this point my "Outlines for a Critique of Political Economy" in the Deutsch-Franzosische Jahrbucher.
  modern: ''
  modern_status: empty
  notes: ''
  en_note: English note {20}.
  align: '2:1'
  review: true
