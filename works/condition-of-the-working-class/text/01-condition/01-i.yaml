- id: I.N1.1.2
  kind: note
  original: In diesem Aufsatz wird von der "freien Konkurrenz" ausgegangen; aber die Industrie ist nur die Praxis der freien Konkurrenz und diese nur das Prinzip der Industrie.
  en: ''
  joined_to: I.N1.1.1
  modern: ''
