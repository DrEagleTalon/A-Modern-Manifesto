- id: V.15.4
  kind: p
  original: Die Parlamentsberichte enthalten noch eine Menge ähnlicher Tatsachen.
  en: The Parliamentary reports contain a mass of similar facts.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '336'
- id: V.16.1
  kind: p
  original: Die Sterblichkeitslisten werden hauptsächlich durch die vielen Todesfälle unter den kleinen Kindern der Arbeiterklasse so hoch gesteigert.
  en: The death-rate is kept so high chiefly by the heavy mortality among young children in the working-class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '336'
- id: V.16.2
  kind: p
  original: Der zarte Körper eines Kindes widersteht den ungünstigen Einflüssen einer niedrigen Lebenslage am wenigsten; die Vernachlässigung, der es oft ausgesetzt ist, wenn beide Eltern arbeiten oder einer von beiden tot ist, rächt sich sehr bald, und so darf man sich nicht wundern, wenn z.B. in Manchester, laut dem letzterwähnten Bericht, über 57 Prozent der Arbeiterkinder vor dem fünften Jahre sterben, während von den Kindern der höheren Klassen nur 20 Prozent und im Durchschnitt aller Klassen in Landdistrikten von allen Kindern unter dem fünften Jahre nicht volle 32 Prozent sterben.
  en: The tender frame of a child is least able to withstand the unfavourable influences of an inferior lot in life; the neglect to which they are often subjected, when both parents work or one is dead, avenges itself promptly, and no one need wonder that in Manchester, according to the report last quoted, more than fifty-seven per cent. of the children of the working-class perish before the fifth year, while but twenty per cent. of the children of the higher classes, and not quite thirty-two per cent. of the children of all classes in the country die under five years of age.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N9
  mew_page: '336'
- id: V.16.3
  kind: p
  original: 'Der mehrerwähnte Artikel des "Artizan" gibt uns hierüber genauere Nachweisungen, indem er die Proportionen der Sterbefälle bei einzelnen Kinderkrankheiten in den Städten denen auf dem Lande gegenüberstellt und so beweist, daß Epidemien im allgemeinen in Manchester und Liverpool dreimal tödlicher sind als in Landdistrikten; daß Krankheiten des Nervensystems in den Städten verfünffacht und Magenübel mehr als verdoppelt werden, während die Todesfälle infolge von Lungenkrankheiten in Städten sich zu denen auf dem Lande verhalten wie 2 1/2 zu 1. Todesfälle von kleinen Kindern infolge von Pocken, Masern, Stickhusten und Scharlachfieber vervierfachen sich: die infolge von Wasser im Gehirn verdreifachen und infolge von Krämpfen verzehnfachen sich in Städten, Um noch eine schlagende Autorität aufzuführen, gebe ich hier eine Tabelle, die Dr. Wade in seiner History of the Middle and Working Classes" (London, 1835, 3 rd ed.) nach dem Bericht des parlamentarischen Fabrikkomitees vom Jahre 1832 gibt. von 10 000 Menschen sterben unter 5 Jahren 5 bis 19 20 bis 39 40 bis 59 60 bis 69 70 bis 79 80 bis 89 90 bis 99 100 und darüber / in der Grafschaft Rutland - gesunder Agrikulturdistrikt 2865 891 1275 1299 1189 1428 938 112 3 / in der Grafschaft Essex - marschiger Agrikulturdistrikt 3159 1110 1526 1413 963 1019 630 77 3 / in der Stadt Carlisle 1779-1787, vor der Einführung der Fabriken 4408 911 1006 1201 940 826 533 153 22 / in der Stadt Carlisle nach Einführung der Fabriken 4738 930 1261 1134 677 727 452 80 1 / in der Stadt Preston, Fabrikstadt 4947 1136 1379 1114 553 532 298 38 3 / In der Stadt Leeds, Fabrikstadt 5286 927 1228 1198 593 512 225 29 2'
  en: The article of the Artisan, already several times referred to, furnishes exacter information on this point, by comparing the city death-rate in single diseases of children with the country death-rate, thus demonstrating that, in general, epidemics in Manchester and Liverpool are three times more fatal than in country districts; that affections of the nervous system are quintupled, and stomach troubles trebled, while deaths from affections of the lungs in cities are to those in the country as 2.5 to 1. Fatal cases of smallpox, measles, scarlet fever, and whooping cough, among small children, are four times more frequent; those of water on the brain are trebled, and convulsions ten times more frequent. To quote another acknowledged authority, I append the following table. Out of 10,000 persons, there die-- Under 5-19 20-39 40-59 60-69 70-79 80-89 90-99 100 x 5 years In Rutlandshire, a healthy agricultural district 2,865 891 1,275 1,299 1,189 1,428 938 112 3 Essex, marshy agricultural district 3,159 1,110 1,526 1,413 963 1,019 630 177 3 Town of Carlisle, 1779-1787, before introduction of mills 4,408 921 1,006 1,201 940 826 633 153 22 Town of Carlisle, after introduction of mills 4,738 930 l,201 1,134 677 727 452 80 1 Preston, factory town 4,947 1,136 1,379 1,114 553 532 298 38 3 Leeds, factory town 5,286 927 1,228 1,198 593 512 225 29 2
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 336-337
  en_note: 'English note {108b}: Quoted by Dr. Wade from the Report of the Parliamentary Factories'' Commission of 1832, in his "History of the Middle and Working-Classes." London, 1835, 3rd ed.'
  align: '1:4'
  review: true
  review_reason: 1 de sentence(s) matched to 4 en sentence(s)
- id: V.17.1
  kind: p
  original: Außer diesen verschiedenen Krankheiten, die die notwendige Folge der jetzigen Vernachlässigung und Unterdrückung der ärmeren Klasse sind, gibt es aber noch andere Einflüsse, die zur Vermehrung der Sterblichkeit unter kleinen Kindern beitragen.
  en: Apart from the divers diseases which are the necessary consequence of the present neglect and oppression of the poorer classes, there are other influences which contribute to increase the mortality among small children.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '337'
- id: V.17.2
  kind: p
  original: In vielen Familien arbeitet die Frau so gut wie der Mann außer dem Hause, und die Folge davon ist die gänzliche Vernachlässigung der Kinder, die entweder eingeschlossen oder zum Verwahren ausgemietet werden.
  en: In many families the wife, like the husband, has to work away from home, and the consequence is the total neglect of the children, who are either locked up or given out to be taken care of.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '337'
- id: V.17.3
  kind: p
  original: Da ist es denn kein Wunder, wenn Hunderte von solchen Kindern durch allerlei Unglücksfälle das Leben verlieren.
  en: It is, therefore, not to be wondered at if hundreds of them perish through all manner of accidents.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 337-338
- id: V.17.4
  kind: p
  original: Nirgends werden so viel Kinder überfahren und überritten, nirgends fallen so viele zu Tode, ertrinken oder verbrennen als in den großen Städten Englands.
  en: Nowhere are so many children run over, nowhere are so many killed by falling, drowning, or burning, as in the great cities and towns of England.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: V.17.5
  kind: p
  original: Namentlich sind Todesfälle infolge von Brandwunden oder Übergießung mit heißem Wasser häufig - in Manchester während der Wintermonate fast jede Woche einmal, in London ebenfalls häufig, doch sieht man dort selten etwas davon in den Blättern; mir ist nur eine Angabe im "Weekly Dispatch" vom 15. Dezember 1844 zur Hand, wonach in der Woche vom 1. bis 7. Dezember sechs derartige Fälle vorgekommen waren.
  en: Deaths from burns and scalds are especially frequent, such a case occurring nearly every week during the winter months in Manchester, and very frequently in London, though little mention is made of them in the papers. I have at hand a copy of the Weekly Despatch of December 15th, 1844, according to which, in the week from December 1st to December 7th inclusive, six such cases occurred.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.17.6
  kind: p
  original: Diese armen Kinder, die auf eine so fürchterliche Weise ums Leben kommen, sind rein die Opfer unserer gesellschaftlichen Unordnung und der bei der Erhaltung dieser Unordnung interessierten besitzenden Klasse - und doch weiß man nicht, ob nicht selbst dieser schreckliche, qualvolle Tod eine Wohltat für die Kinder war, indem er sie vor einem langen Leben voll Mühe und Elend, reich an Leiden und arm an Genüssen, bewahrte.
  en: These unhappy children, perishing in this terrible way, are victims of our social disorder, and of the property-holding classes interested in maintaining and prolonging this disorder. Yet one is left in doubt whether even this terribly torturing death is not a blessing for the children in rescuing them from a long life of toil and wretchedness, rich in suffering and poor in enjoyment.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.17.7
  kind: p
  original: So weit ist es gekommen in England - und die Bourgeoisie liest das alles täglich in den Zeitungen und kümmert sich nicht drum.
  en: So far has it gone in England; and the bourgeoisie reads these things every day in the newspapers and takes no further trouble in the matter.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: V.17.8
  kind: p
  original: Sie wird sich aber auch nicht beklagen können, wenn ich sie nach den angeführten offiziellen und nichtoffiziellen Zeugnissen, die sie kennen muß, geradezu des sozialen Mordes beschuldige.
  en: But it cannot complain if, after the official and non-official testimony here cited which must be known to it, I broadly accuse it of social murder.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: V.17.9
  kind: p
  original: Entweder sorge sie dafür, daß diesem entsetzlichen Zustande abgeholfen werde - oder sie trete die Verwaltung der allgemeinen Interessen an die arbeitende Klasse ab.
  en: Let the ruling class see to it that these frightful conditions are ameliorated, or let it surrender the administration of the common interests to the labouring-class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: V.17.10
  kind: p
  original: Und zu letzterem hat sie keine Lust, während sie zu ersterem - solange sie Bourgeoisie und in Bourgeoisievorurteilen befangen bleibt - nicht die Kraft besitzt; denn wenn sie jetzt endlich, nachdem Hunderttausende von Schlachtopfern gefallen sind, einige kleinliche Vorsorge für die Zukunft trifft, einen "Metropolitan Buildings Act" erläßt, wonach wenigstens die rücksichtsloseste Zusammendrängung von Wohnungen etwas beschränkt wird - wenn sie mit Maßregeln prunkt, die, weit entfernt, auf die Wurzel des Übels einzugehen, noch lange nicht an die Anordnungen der allgewöhnlichsten Gesundheitspolizei reichen, so wird sie sich dadurch doch nicht von der Anklage reinigen können.
  en: To the latter course it is by no means inclined; for the former task, so long as it remains the bourgeoisie crippled by bourgeois prejudice, it has not the needed power. For if, at last, after hundreds of thousands of victims have perished, it manifests some little anxiety for the future, passing a "Metropolitan Buildings Act," under which the most unscrupulous overcrowding of dwellings is to be, at least in some slight degree, restricted; if it points with pride to measures which, far from attacking the root of the evil, do not by any means meet the demands of the commonest sanitary policy, it cannot thus vindicate itself from the accusation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.17.11
  kind: p
  original: Die englische Bourgeoisie hat nur die Wahl, entweder mit der unwiderlegbaren Anklage des Mordes auf ihren Schultern und trotz dieser Anklage fortzuregieren - oder zugunsten der Arbeiterklasse abzudanken.
  en: The English bourgeoisie has but one choice, either to continue its rule under the unanswerable charge of murder and in spite of this charge, or to abdicate in favour of the labouring-class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: V.17.12
  kind: p
  original: Bis jetzt hat sie das erstere vorgezogen.
  en: Hitherto it has chosen the former course.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: V.18.1
  kind: p
  original: Gehen wir von der physischen auf die geistige Lage der Arbeiter über.
  en: Let us turn from the physical to the mental state of the workers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: V.18.2
  kind: p
  original: Wenn die Bourgeoisie ihnen vom Leben so viel läßt, als eben nötig ist, so dürfen wir uns nicht wundern, wenn sie ihnen auch nur so viel Bildung gibt, als im Interesse der Bourgeoisie liegt Und das ist so viel wahrlich nicht.
  en: Since the bourgeoisie vouchsafes them only so much of life as is absolutely necessary, we need not wonder that it bestows upon them only so much education as lies in the interest of the bourgeoisie; and that, in truth, is not much.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '338'
- id: V.18.3
  kind: p
  original: Die Bildungsmittel sind in England unverhältnismäßig gering gegen die Volkszahl.
  en: The means of education in England are restricted out of all proportion to the population.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 338-339
- id: V.18.4
  kind: p
  original: Die wenigen der arbeitenden Klasse zu Gebote stehenden Wochenschulen können nur von den wenigsten besucht werden und sind außerdem schlecht, die Lehrer - ausgediente Arbeiter und sonstige untaugliche Leute, die nur, um leben zu können, Schulmeister wurden - sind großenteils selbst in den notdürftigsten Elementarkenntnissen unerfahren, ohne die dem Lehrer so nötige sittliche Bildung und ohne alle öffentliche Kontrolle.
  en: The few day schools at the command of the working-class are available only for the smallest minority, and are bad besides. The teachers, worn-out workers, and other unsuitable persons who only turn to teaching in order to live, are usually without the indispensable elementary knowledge, without the moral discipline so needful for the teacher, and relieved of all public supervision.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.18.5
  kind: p
  original: Auch hier herrscht die freie Konkurrenz, und wie immer haben die Reichen den Nutzen, und die Armen, für die die Konkurrenz eben nicht frei ist, die nicht die gehörigen Kenntnisse haben, um urteilen zu können, haben den Schaden.
  en: Here, too, free competition rules, and, as usual, the rich profit by it, and the poor, for whom competition is not free, who have not the knowledge needed to enable them to form a correct judgment, have the evil consequences to bear.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: V.18.6
  kind: p
  original: Ein Schulzwang existiert nirgends, in den eigentlichen Fabriken, wie wir sehen werden, nur dem Namen nach, und als in der Session von 1843 die Regierung diesen scheinbaren Schulzwang in Kraft treten lassen wollte opponierte die fabrizierende Bourgeoisie aus Leibeskräften, obwohl die Arbeiter sich entschieden für den Schulzwang aussprachen.
  en: Compulsory school attendance does not exist. In the mills it is, as we shall see, purely nominal; and when in the session of 1843 the Ministry was disposed to make this nominal compulsion effective, the manufacturing bourgeoisie opposed the measure with all its might, though the working-class was outspokenly in favour of compulsory school attendance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.18.7
  kind: p
  original: Ohnehin arbeitet eine große Menge Kinder die ganze Woche über in Fabriken und zu Hause und kann deshalb die Schule nicht besuchen.
  en: Moreover, a mass of children work the whole week through in the mills or at home, and therefore cannot attend school.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: V.18.8
  kind: p
  original: Denn die Abendschulen, wohin diejenigen gehen sollen, die des Tages beschäftigt sind, werden fast gar nicht und ohne Nutzen besucht.
  en: The evening schools, supposed to be attended by children who are employed during the day, are almost abandoned or attended without benefit.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: V.18.9
  kind: p
  original: Es wäre auch wirklich gar zuviel verlangt, wenn junge Arbeiter, die sich zwölf Stunden lang abgeplagt haben, nun noch von acht bis zehn Uhr in die Schule gehen sollten.
  en: It is asking too much, that young workers who have been using themselves up twelve hours in the day, should go to school from eight to ten at night.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: V.18.10
  kind: p
  original: Und diejenigen, die es tun, schlafen dort meistens ein, wie durch den Children's Empl[oyment] Rep[or]t in Hunderten von Aussagen konstatiert ist.
  en: And those who try it usually fall asleep, as is testified by hundreds of witnesses in the Children's Employment Commission's Report.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: V.18.11
  kind: p
  original: Allerdings hat man Sonntagsschulen eingerichtet, die aber ebenfalls höchst mangelhaft mit Lehrern besetzt sind und nur denen, die schon in der Wochenschule etwas gelernt haben, nützen können.
  en: Sunday schools have been founded, it is true, but they, too, are most scantily supplied with teachers, and can be of use to those only who have already learnt something in the day schools.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: V.18.12
  kind: p
  original: Der Zeitraum von einem Sonntag zum andern ist zu lang, als daß ein ganz ungebildetes Kind in der zweiten Lektion das nicht wieder vergessen haben sollte, was es in der ersten, acht Tage früher, gelernt hat.
  en: The interval from one Sunday to the next is too long for an ignorant child to remember in the second sitting what it learned in the first, a week before.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: V.18.13
  kind: p
  original: Der Bericht der Children's Employment Commission liefert Tausende von Beweisen, und die Kommission selbst spricht sich aufs entschiedenste dahin aus, daß weder die Wochen- noch die Sonntagsschulen dem Bedürfnis der Nation auch nur im entferntesten entsprechen.
  en: The Children's Employment Commission's Report furnishes a hundred proofs, and the Commission itself most emphatically expresses the opinion, that neither the week-day nor the Sunday schools, in the least degree, meet the needs of the nation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: V.18.14
  kind: p
  original: Dieser Bericht liefert Beweise von Unwissenheit unter der arbeitenden Klasse Englands, die man nicht aus einem Lande wie Spanien und Italien erwarten sollte.
  en: This report gives evidence of ignorance in the working-class of England, such as could hardly be expected in Spain or Italy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
- id: V.18.15
  kind: p
  original: Es kann aber nicht anders sein; die Bourgeoisie hat wenig zu hoffen, aber manches zu fürchten von der Bildung der Arbeiter; die Regierung hat in ihrem ganzen kolossalen Budget von 55 000 000 Pfd. St. nur einen einzigen winzigen Posten von 40 000 Pfd. St. für öffentlichen Unterricht; und wenn nicht der Fanatismus der religiösen Sekten wäre, der wenigstens ebensoviel verdirbt, als er hier und da bessert, so würden die Unterrichtsmittel noch viel elender sein.
  en: It cannot be otherwise; the bourgeoisie has little to hope, and much to fear, from the education of the working-class. The Ministry, in its whole enormous budget of 55,000,000 pounds, has only the single trifling item of 40,000 pounds for public education, and, but for the fanaticism of the religious sects which does at least as much harm as good, the means of education would be yet more scanty.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '339'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.18.16
  kind: p
  original: Aber so errichtet die Hochkirche ihre National Schools [Volksschulen] und jede Sekte ihre Schulen, einzig in der Absicht, die Kinder ihrer Glaubensgenossen in ihrem Schoß zu behalten und womöglich hier und da den andern Sekten eine arme Kinderseele abzujagen.
  en: As it is, the State Church manages its national schools and the various sects their sectarian schools for the sole purpose of keeping the children of the brethren of the faith within the congregation, and of winning away a poor childish soul here and there from some other sect.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 339-340
- id: V.18.17
  kind: p
  original: Die Folge davon ist, daß die Religion und gerade die unfruchtbarste Seite der Religion, die Polemik, zum vorzüglichsten Unterrichtsgegenstande erhoben und das Gedächtnis der Kinder mit unverständlichen Dogmen und theologischen Distinktionen vollgepfropft, daß der Sektenhaß und die fanatische Bigotterie so früh wie möglich geweckt und alle vernünftige, geistige und sittliche Bildung schändlich vernachlässigt wird.
  en: The consequence is that religion, and precisely the most unprofitable side of religion, polemical discussion, is made the principal subject of instruction, and the memory of the children overburdened with incomprehensible dogmas and theological distinctions; that sectarian hatred and bigotry are awakened as early as possible, and all rational mental and moral training shamefully neglected.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: V.18.18
  kind: p
  original: Die Arbeiter haben oft genug eine rein weltliche öffentliche Erziehung, die Religion den Geistlichen jeder Sekte überlassend, vom Parlament gefordert - sie haben bis jetzt noch kein Ministerium gefunden, das ihnen etwas Ähnliches bewilligt hätte.
  en: The working class has repeatedly demanded of Parliament a system of strictly secular public education, leaving religion to the ministers of the sects; but, thus far, no Ministry has been induced to grant it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: V.18.19
  kind: p
  original: Natürlich.
  en: The Minister is the obedient servant of the bourgeoisie, and the bourgeoisie is divided into countless sects; but each would gladly grant the workers the otherwise dangerous education on the sole condition of their accepting, as an antidote, the dogmas peculiar to the especial sect in question.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.18.20
  kind: p
  original: Der Minister ist der gehorsame Knecht der Bourgeoisie, und diese teilt sich in zahllose Sekten; jede Sekte aber gönnt dem Arbeiter nur dann die sonst gefährliche Erziehung, wenn er das Gegengift der speziell dieser Sekte angehörigen Dogmen mit in den Kauf nehmen muß.
  en: ''
  joined_to: V.18.19
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '340'
- id: V.18.21
  kind: p
  original: Und da sich diese Sekten noch bis heute um die Oberherrschaft zanken, so bleibt die Arbeiterklasse einstweilen ohne Bildung.
  en: And as these sects are still quarrelling among themselves for supremacy, the workers remain for the present without education.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: V.18.22
  kind: p
  original: Zwar rühmen sich die Fabrikanten, der großen Mehrzahl das Lesen beigebracht zu haben, aber es ist auch ein Lesen danach - wie der Bericht der Children's Employment Commission zeigt.
  en: It is true that the manufacturers boast of having enabled the majority to read, but the quality of the reading is appropriate to the source of the instruction, as the Children's Employment Commission proves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: V.18.23
  kind: p
  original: Wer das Alphabet kennt, sagt, er könne lesen, und dabei beruhigen sich die Fabrikanten.
  en: According to this report, he who knows his letters can read enough to satisfy the conscience of the manufacturers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: V.18.24
  kind: p
  original: Und wenn man die konfuse englische Orthographie bedenkt, bei der das Lesen eine wahre Kunst ist und nur nach langem Unterricht gelernt werden kann, so findet man diese Unwissenheit begreiflich.
  en: And when one reflects upon the confused orthography of the English language which makes reading one of the arts, learned only under long instruction, this ignorance is readily understood.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: V.18.25
  kind: p
  original: Schreiben vollends können sehr wenige - orthographisch schreiben selbst sehr viele "Gebildete" nicht.
  en: Very few working-people write readily; and writing orthographically is beyond the powers even of many "educated" persons.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: V.18.26
  kind: p
  original: Die Sonntagsschulen der Hochkirche, der Quäker und ich glaube noch mehrerer andern Sekten lehren gar kein Schreiben, "weil dies eine zu weltliche Beschäftigung für den Sonntag sei".
  en: The Sunday schools of the State Church, of the Quakers, and, I think, of several other sects, do not teach writing, "because it is too worldly an employment for Sunday."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: V.18.27
  kind: p
  original: Wie es sonst mit der Bildung, die den Arbeitern geboten wird, steht, sollen ein paar Beispiele zeigen.
  en: 'The quality of the instruction offered the workers in other directions may be judged from a specimen or two, taken from the Children''s Employment Commission''s Report, which unfortunately does not embrace mill-work proper:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.18.28
  kind: p
  original: Sie sind aus dem Ch[ildren's] Empl[oyment] Commiss[ion's]-Bericht, der sich leider nicht auf die eigentliche Fabrikindustrie ausdehnt.
  en: ''
  joined_to: V.18.27
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '340'
- id: V.19.1
  kind: p
  original: '"In Birmingham", sagt Kommissär Grainger, "sind die von mir geprüften Kinder in ihrer Gesamtheit gänzlich ohne alles, was auch nur im entferntesten eine nützliche Erziehung genannt werden könnte.'
  en: '"In Birmingham," says Commissioner Grainger, "the children examined by me are, as a whole, utterly wanting in all that could be in the remotest degree called a useful education.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
- id: V.19.2
  kind: p
  original: Obwohl fast in allen Schulen nur Religionsunterricht gegeben wird, zeigten sie doch im allgemeinen auch hierüber die gröbste Unwissenheit."
  en: 'Although in almost all the schools religious instruction alone is furnished, the profoundest ignorance even upon that subject prevailed."--"In Wolverhampton," says Commissioner Horne, "I found, among others, the following example: A girl of eleven years had attended both day and Sunday school, ''had never heard of another world, of Heaven, or another life.'''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '340'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.19.3
  kind: p
  original: '- "In Wolverhampton", erzählt Kommissär Horne, "fand ich unter andern folgende Beispiele: Ein Mädchen, 11 Jahre, war in einer Wochen- und Sonntagsschule gewesen, ''hatte nie von einer andern Welt, vom Himmel oder einem andern Leben gehört''.'
  en: ''
  joined_to: V.19.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: 340-341
- id: V.19.4
  kind: p
  original: Ein andrer, 17 Jahre alt, wußte nicht, wieviel zwei mal zwei machten, wieviel Farthings" (1/4 Penny) "in 2 Pence seien, selbst als man das Geld ihm in die Hand legte.
  en: A boy, seventeen years old, did not know that twice two are four, nor how many farthings in two pence even when the money was placed in his hand.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
- id: V.19.5
  kind: p
  original: Einige Knaben hatten nie von London oder selbst von Willenhall gehört, obwohl letzteres nur eine Stunde von ihrem Wohnort entfernt liegt und fortwährend in Kommunikation mit Wolverhampton steht.
  en: Several boys had never heard of London nor of Willenhall, though the latter was but an hour's walk from their homes, and in the closest relations with Wolverhampton.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
- id: V.19.6
  kind: p
  original: Einige hatten nie den Namen der Königin oder Namen wie Nelson, Wellington, Bonaparte gehört.
  en: Several had never heard the name of the Queen nor other names, such as Nelson, Wellington, Bonaparte; but it was noteworthy that those who had never heard even of St. Paul, Moses, or Solomon, were very well instructed as to the life, deeds, and character of Dick Turpin, and especially of Jack Sheppard.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.19.7
  kind: p
  original: Aber es war bemerkenswert, daß diejenigen, die selbst von Sankt Paulus, Moses oder Salomon nie gehört hatten, über Leben, Taten und Charakter Dick Turpins, des Straßenräubers, und besonders Jack Sheppards, des Diebs und Gefängnisbrechers, sehr wohl unterrichtet waren.
  en: ''
  joined_to: V.19.6
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '341'
- id: V.19.8
  kind: p
  original: 'Ein Junge, 16 Jahre alt, wußte nicht, wieviel zwei mal zwei machten oder wieviel vier Farthings machten - ein Junge von 17 Jahren behauptete, zehn Farthings seien zehn halbe Pence, und ein dritter, 17 Jahre alt, antwortete kurz auf einige sehr einfache Fragen: ''Er wisse nichts von gar nichts (he was ne judge o'' nothin'')''" (Horne, Rept., App. Part II, Q. 18, No. 216, 217, 226, 233 etc.).'
  en: A youth of sixteen did not know how many twice two are, nor how much four farthings make. A youth of seventeen asserted that four farthings are four half pence; a third, seventeen years old, answered several very simple questions with the brief statement, that he 'was ne jedge o' nothin'.'"
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
  en_note: 'English note {112a}: Children''s Employment Commission''s Report. App. Part II. Q. 18, No. 216, 217, 226, 233, etc. Horne.'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.20.1
  kind: p
  original: Diese Kinder, die vier bis fünf Jahre hindurch mit religiösen Dogmen geplagt werden, wissen am Ende soviel wie vorher.
  en: These children who are crammed with religious doctrines four or five years at a stretch, know as little at the end as at the beginning.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
- id: V.21.1
  kind: p
  original: Ein Kind "ist fünf Jahrelang regelmäßig zur Sonntagsschule gegangen; weiß nicht, wer Jesus Christus war, hat den Namen aber gehört; hat nie von den zwölf Aposteln, Simson, Moses, Aaron usw. gehört" (ibid. Evid. p. q. 39, 1.33).
  en: One child "went to Sunday school regularly for five years; does not know who Jesus Christ is, but had heard the name; had never heard of the twelve Apostles, Samson, Moses, Aaron, etc."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
  en_note: 'English note {112b}: Ibid. evidence, p. 9, 39; 133.'
- id: V.21.2
  kind: p
  original: Ein andres "sechs Jahre regelmäßig zur Sonntagsschule gegangen.
  en: Another "attended Sunday school regularly six years; knows who Jesus Christ was; he died on the Cross to save our Saviour; had never heard of St. Peter or St. Paul."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
  en_note: 'English note {113a}: Ibid. p. 9, 36; 146.'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.21.3
  kind: p
  original: Weiß, wer Jesus Christus war, er starb am Kreuz, sein Blut zu vergießen, um unsern Erlöser zu erlösen; hat nie von St. Petrus oder Paulus gehört" (ibid. p. q. 36, 1.46).
  en: ''
  joined_to: V.21.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '341'
- id: V.21.4
  kind: p
  original: 'Ein drittes "sieben Jahre in verschiednen Sonntagsschulen gewesen, kann nur in den dünnen Büchern lesen, leichte einsilbige Wörter; hat von den Aposteln gehört, weiß nicht, ob St. Peter einer war oder St. Johann, es müßte denn Sankt Johann Wesley (Stifter der Methodisten) sein usw. (ibid p. q. 34, 1.58), auf die Frage, wer Jesus Christus sei, erhielt Horne u.a. noch folgende Antworten: "Er war Adam"; "er war ein Apostel"; "er war der Sohn des Herrn des Erlösers (he was the Saviour''s Lord''s Son)", und von einem sechzehnjährigen Jungen: "Er war ein König von London vor langer, langer Zeit,"'
  en: 'A third, "attended different Sunday schools seven years; can read only the thin, easy books with simple words of one syllable; has heard of the Apostles, but does not know whether St. Peter was one or St. John; the latter must have been St. John Wesley." To the question who Christ was, Horne received the following answers among others: "He was Adam," "He was an Apostle," "He was the Saviour''s Lord''s Son," and from a youth of sixteen: "He was a king of London long ago."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
  en_note: 'English note {113b}: Ibid. p. 34; 158.'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.22.1
  kind: p
  original: In Sheffield ließ Kommissär Symons die Sonntagsschüler lesen; sie waren nicht imstande zu sagen, was sie gelesen hatten oder was für Leute die Apostel gewesen seien, von denen sie soeben gelesen hatten.
  en: In Sheffield, Commissioner Symonds let the children from the Sunday school read aloud; they could not tell what they had read, or what sort of people the Apostles were, of whom they had just been reading.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
- id: V.22.2
  kind: p
  original: 'Nachdem er sie alle nach der Reihe wegen der Apostel befragt hatte, ohne eine richtige Antwort zu erhalten, rief ein kleiner schlau aussehender Junge mit großer Zuversicht aus:'
  en: 'After he had asked them all one after the other about the Apostles without securing a single correct answer, one sly-looking little fellow, with great glee, called out: "I know, mister; they were the lepers!"'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
  en_note: 'English note {113c}: Symonds'' Rep. App. Part I., pp. E, 22, et seq.'
  align: '3:1'
  review: true
  review_reason: 3 de sentence(s) matched to 1 en sentence(s)
- id: V.23.1
  kind: p
  original: '"Ich weiß es, Herr, es waren die Aussätzigen!"'
  en: ''
  joined_to: V.22.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '341'
- id: V.23.2
  kind: p
  original: (Symons, Rept., App. Part 1, pp. E 22 sqq.)
  en: ''
  joined_to: V.22.2
  modern: ''
  modern_status: joined
