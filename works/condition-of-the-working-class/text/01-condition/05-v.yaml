verses:
- id: V.0.1
  kind: heading
  original: Resultate
  en: RESULTS.
  modern: ''
  modern_status: empty
  notes: ''
- id: V.1.1
  kind: p
  original: Wenn wir jetzt die Verhältnisse, unter denen die englische Arbeiterklasse der Städte lebt, in ziemlicher Ausführlichkeit betrachtet haben, so wird es nun an der Zeit sein, aus diesen Tatsachen weitere Schlüsse zu ziehen und diese wiederum mit dem Tatbestande zu vergleichen.
  en: Having now investigated, somewhat in detail, the conditions under which the English working-class lives, it is time to draw some further inferences from the facts presented, and then to compare our inferences with the actual state of things.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '324'
- id: V.1.2
  kind: p
  original: Sehen wir denn zu, was unter solchen Umständen aus den Arbeitern selbst geworden ist, was für Leute wir an ihnen haben, wie ihr körperlicher, intellektueller und moralischer Zustand beschaffen ist.
  en: Let us see what the workers themselves have become under the given circumstances, what sort of people they are, what their physical, mental, and moral status.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '324'
- id: V.2.1
  kind: p
  original: Wenn ein einzelner einem andern körperlichen Schaden tut, und zwar solchen Schaden, der dem Beschädigten den Tod zuzieht, so nennen wir das Totschlag; wenn der Täter im voraus wußte, daß der Schaden tödlich sein würde, so nennen wir seine Tat einen Mord.
  en: When one individual inflicts bodily injury upon another, such injury that death results, we call the deed manslaughter; when the assailant knew in advance that the injury would be fatal, we call his deed murder.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '324'
- id: V.2.2
  kind: p
  original: Wenn aber die Gesellschaft Hunderte von Proletariern in eine solche Lage versetzt, daß sie notwendig einem vorzeitigen, unnatürlichen Tode verfallen, einem Tode, der ebenso gewaltsam ist wie der Tod durchs Schwert oder die Kugel; wenn sie Tausenden die nötigen Lebensbedingungen entzieht, sie in Verhältnisse stellt, in welchen sie nicht leben können; wenn sie sie durch den starken Arm des Gesetzes zwingt, in diesen Verhältnissen zu bleiben, bis der Tod eintritt, der die Folge dieser Verhältnisse sein muß; wenn sie weiß, nur zu gut weiß, daß diese Tausende solchen Bedingungen zum Opfer fallen müssen, und doch diese Bedingungen bestehen läßt - so ist das ebensogut Mord wie die Tat des einzelnen, nur versteckter, heimtückischer Mord, ein Mord, gegen den sich niemand wehren kann, der kein Mord zu sein scheint, weil man den Mörder nicht sieht, weil alle und doch wieder niemand dieser Mörder ist, weil der Tod des Schlachtopfers wie ein natürlicher aussieht und weil er weniger eine Begehungssünde als eine Unterlassungssünde ist.
  en: But when society places hundreds of proletarians in such a position that they inevitably meet a too early and an unnatural death, one which is quite as much a death by violence as that by the sword or bullet; when it deprives thousands of the necessaries of life, places them under conditions in which they cannot live--forces them, through the strong arm of the law, to remain in such conditions until that death ensues which is the inevitable consequence--knows that these thousands of victims must perish, and yet permits these conditions to remain, its deed is murder just as surely as the deed of the single individual; disguised, malicious murder, murder against which none can defend himself, which does not seem what it is, because no man sees the murderer, because the death of the victim seems a natural one, since the offence is more one of omission than of commission.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N1
  mew_page: 324-325
- id: V.2.3
  kind: p
  original: Aber er bleibt Mord.
  en: But murder it remains.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '325'
- id: V.2.4
  kind: p
  original: Ich werde nun zu beweisen haben, daß die Gesellschaft in England diesen von den englischen Arbeiterzeitungen mit vollem Rechte als solchen bezeichneten sozialen Mord täglich und stündlich begeht; daß sie die Arbeiter in eine Lage versetzt hat, in der diese nicht gesund bleiben und nicht lange leben können; daß sie so das Leben dieser Arbeiter stückweise, allmählich untergräbt und sie so vor der Zeit ins Grab bringt; ich werde ferner beweisen müssen, daß die Gesellschaft weiß, wie schädlich eine solche Lage der Gesundheit und dem Leben der Arbeiter ist, und daß sie doch nichts tut, um diese Lege zu verbessern.
  en: I have now to prove that society in England daily and hourly commits what the working-men's organs, with perfect correctness, characterise as social murder, that it has placed the workers under conditions in which they can neither retain health nor live long; that it undermines the vital force of these workers gradually, little by little, and so hurries them to the grave before their time. I have further to prove that society knows how injurious such conditions are to the health and the life of the workers, and yet does nothing to improve these conditions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '325'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.2.5
  kind: p
  original: Daß sie um die Folgen ihrer Einrichtungen weiß, daß ihre Handlungsweise also nicht bloßer Totschlag, sondern Mord ist, habe ich schon bewiesen, wenn ich offizielle Dokumente, Parlaments- und Regierungsberichte als Autorität für das Faktum des Totschlags anführen kann.
  en: That it knows the consequences of its deeds; that its act is, therefore, not mere manslaughter, but murder, I shall have proved, when I cite official documents, reports of Parliament and of the Government, in substantiation of my charge.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '325'
- id: V.3.1
  kind: p
  original: Daß eine Klasse, welche in den oben geschilderten Verhältnissen lebt und so schlecht mit den allernotwendigsten Lebensbedürfnissen versehen ist, nicht gesund sein und kein hohes Alter erreichen kann, versteht sich von vornherein von selbst.
  en: That a class which lives under the conditions already sketched and is so ill-provided with the most necessary means of subsistence, cannot be healthy and can reach no advanced age, is self-evident.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '325'
- id: V.3.2
  kind: p
  original: Gehen wir indes die einzelnen Umstände nochmals und in spezieller Beziehung auf den Gesundheitszustand der Arbeiter durch.
  en: Let us review the circumstances once more with especial reference to the health of the workers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '325'
- id: V.3.3
  kind: p
  original: Schon die Zentralisation der Bevölkerung in großen Städten äußert ungünstigen Einfluß; die Atmosphäre von London kann nie so rein, so sauerstoffhaltig sein wie die eines Landdistrikts; drittehalb Millionen Lungen und drittehalb hunderttausend Feuer, auf drei bis vier geographischen Quadratmeilen zusammengedrängt, verbrauchen eine ungeheure Menge Sauerstoff, der sich nur mit Schwierigkeit wieder ersetzt, da die städtische Bauart an und für sich die Ventilation erschwert.
  en: The centralisation of population in great cities exercises of itself an unfavourable influence; the atmosphere of London can never be so pure, so rich in oxygen, as the air of the country; two and a half million pairs of lungs, two hundred and fifty thousand fires, crowded upon an area three to four miles square, consume an enormous amount of oxygen, which is replaced with difficulty, because the method of building cities in itself impedes ventilation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '325'
- id: V.3.4
  kind: p
  original: Das durch Atmen und Brennen erzeugte kohlensaure Gas bleibt vermöge seiner spezifischen Schwere in den Straßen, und der Hauptzug des Windes streicht über den Dächern der Häuser hinweg.
  en: The carbonic acid gas, engendered by respiration and fire, remains in the streets by reason of its specific gravity, and the chief air current passes over the roofs of the city.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 325-326
- id: V.3.5
  kind: p
  original: Die Lungen der Einwohner erhalten nicht das volle Quantum Sauerstoff, und die Folge davon ist körperliche und geistige Erschlaffung und Niederhaltung der Lebenskraft.
  en: The lungs of the inhabitants fail to receive the due supply of oxygen, and the consequence is mental and physical lassitude and low vitality.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '326'
- id: V.3.6
  kind: p
  original: Aus diesem Grunde sind die Einwohner großer Städte zwar den akuten, besonders entzündlichen Krankheiten weit weniger ausgesetzt als die Landleute, die in einer freien, normalen Atmosphäre leben, leiden aber dafür desto mehr an chronischen Übeln.
  en: For this reason, the dwellers in cities are far less exposed to acute, and especially to inflammatory, affections than rural populations, who live in a free, normal atmosphere; but they suffer the more from chronic affections.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '326'
- id: V.3.7
  kind: p
  original: Und wenn schon das Leben in großen Städten an und für sich der Gesundheit nicht zuträglich ist, wie groß muß dieser nachteilige Einfluß einer abnormen Atmosphäre erst in den Arbeiterbezirken sein, wo, wie wir sahen, alles vereinigt ist, was die Atmosphäre verschlechtern kann.
  en: And if life in large cities is, in itself, injurious to health, how great must be the harmful influence of an abnormal atmosphere in the working-people's quarters, where, as we have seen, everything combines to poison the air.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '326'
- id: V.3.8
  kind: p
  original: Auf dem Lande mag es unschädlich genug sein, dicht neben dem Hause eine Mistpfütze zu haben, weil hier die Luft von allen Seiten freien Zutritt hat; aber mitten in einer großen Stadt, zwischen verbauten, allem Luftzuge abgeschnittenen Gassen und Höfen, ist es ganz etwas anderes.
  en: In the country, it may, perhaps, be comparatively innoxious to keep a dung-heap adjoining one's dwelling, because the air has free ingress from all sides; but in the midst of a large town, among closely built lanes and courts that shut out all movement of the atmosphere, the case is different.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '326'
- id: V.3.9
  kind: p
  original: Aller verfaulende animalische und vegetabilische Stoff entwickelt Gase, die der Gesundheit entschieden schädlich sind, und wenn diese Gase keinen freien Abzug haben, so müssen sie die Atmosphäre verpesten.
  en: All putrefying vegetable and animal substances give off gases decidedly injurious to health, and if these gases have no free way of escape, they inevitably poison the atmosphere.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '326'
- id: V.3.10
  kind: p
  original: Der Unrat und die stehenden Pfützen in den Arbeitervierteln der großen Städte sind daher von den schlimmsten Folgen für die öffentliche Gesundheit, weil sie gerade die krankheiterzeugenden Gase hervorbringen; ebenso die Ausdünstungen der verunreinigten Flüsse.
  en: The filth and stagnant pools of the working-people's quarters in the great cities have, therefore, the worst effect upon the public health, because they produce precisely those gases which engender disease; so, too, the exhalations from contaminated streams.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '326'
- id: V.3.11
  kind: p
  original: Aber das ist noch lange nicht alles.
  en: But this is by no means all.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '326'
- id: V.3.12
  kind: p
  original: Es ist wirklich empörend, wie die große Menge der Armen von der heutigen Gesellschaft behandelt wird.
  en: The manner in which the great multitude of the poor is treated by society to-day is revolting.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '326'
- id: V.3.13
  kind: p
  original: Man zieht sie in die großen Städte, wo sie eine schlechtere Atmosphäre als in ihrer ländlichen Heimat einatmen.
  en: They are drawn into the large cities where they breathe a poorer atmosphere than in the country; they are relegated to districts which, by reason of the method of construction, are worse ventilated than any others; they are deprived of all means of cleanliness, of water itself, since pipes are laid only when paid for, and the rivers so polluted that they are useless for such purposes; they are obliged to throw all offal and garbage, all dirty water, often all disgusting drainage and excrement into the streets, being without other means of disposing of them; they are thus compelled to infect the region of their own dwellings.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '326'
  align: '3:1'
  review: true
  review_reason: 3 de sentence(s) matched to 1 en sentence(s)
- id: V.3.14
  kind: p
  original: Man verweist sie in Bezirke, die nach ihrer Bauart schlechter ventiliert sind als alle übrigen.
  en: ''
  joined_to: V.3.13
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '326'
- id: V.3.15
  kind: p
  original: Man entzieht ihnen alle Mittel zur Reinlichkeit, man entzieht ihnen das Wasser, indem man nur gegen Bezahlung Röhren legt und die Flüsse so verunreinigt, daß sie zu Reinlichkeitszwecken nicht mehr taugen; man zwingt sie, allen Abfall und Kehricht, alles schmutzige Wasser, ja oft allen ekelhaften Unrat und Dünger auf die Straße zu schütten, indem man ihnen alle Mittel nimmt, sich seiner sonst zu entledigen; man zwingt sie dadurch, ihre eignen Distrikte zu verpesten.
  en: ''
  joined_to: V.3.13
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '326'
- id: V.3.16
  kind: p
  original: Damit noch nicht genug.
  en: Nor is this enough.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '326'
- id: V.3.17
  kind: p
  original: Alle möglichen Übel werden auf das Haupt der Armen gehäuft.
  en: All conceivable evils are heaped upon the heads of the poor.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '326'
- id: V.3.18
  kind: p
  original: Ist die Bevölkerung der Stadt überhaupt schon zu dicht, so werden sie erst recht auf einen kleinen Raum zusammengedrängt.
  en: If the population of great cities is too dense in general, it is they in particular who are packed into the least space.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '326'
- id: V.3.19
  kind: p
  original: Nicht damit zufrieden, die Atmosphäre in der Straße verdorben zu haben, sperrt man sie dutzendweise in ein einziges Zimmer, so daß die Luft, die sie nachts atmen, vollends zum Ersticken wird.
  en: As though the vitiated atmosphere of the streets were not enough, they are penned in dozens into single rooms, so that the air which they breathe at night is enough in itself to stifle them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '326'
- id: V.3.20
  kind: p
  original: Man gibt ihnen feuchte Wohnungen, Kellerlöcher, die von unten, oder Dachkammern, die von oben nicht wasserdicht sind.
  en: They are given damp dwellings, cellar dens that are not waterproof from below, or garrets that leak from above.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 326-327
- id: V.3.21
  kind: p
  original: Man baut ihre Häuser so, daß die dumpfige Luft nicht abziehen kann.
  en: Their houses are so built that the clammy air cannot escape.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '327'
- id: V.3.22
  kind: p
  original: Man gibt ihnen schlechte, zerlumpte oder zerlumpende Kleider und schlechte, verfälschte und schwerverdauliche Nahrungsmittel.
  en: They are supplied bad, tattered, or rotten clothing, adulterated and indigestible food.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '327'
- id: V.3.23
  kind: p
  original: Man setzt sie den aufregendsten Stimmungswechseln, den heftigsten Schwankungen von Angst und Hoffnung aus - man hetzt sie ab wie das Wild und läßt sie nicht zur Ruhe und zum ruhigen Lebensgenuß kommen.
  en: They are exposed to the most exciting changes of mental condition, the most violent vibrations between hope and fear; they are hunted like game, and not permitted to attain peace of mind and quiet enjoyment of life.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '327'
- id: V.3.24
  kind: p
  original: Man entzieht ihnen alle Genüsse außer dem Geschlechtsgenuß und dem Trunk, arbeitet sie dagegen täglich bis zur gänzlichen Abspannung aller geistigen und physischen Kräfte ab und reizt sie dadurch fortwährend zum tollsten Übermaß in den beiden einzigen Genüssen, die ihnen zu Gebote stehen.
  en: They are deprived of all enjoyments except that of sexual indulgence and drunkenness, are worked every day to the point of complete exhaustion of their mental and physical energies, and are thus constantly spurred on to the maddest excess in the only two enjoyments at their command.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '327'
- id: V.3.25
  kind: p
  original: Und wenn das alles nicht hilft, wenn sie das alles überstehen, so fallen sie der Brotlosigkeit einer Krisis zum Opfer, in der ihnen auch das wenige entzogen wird, was man ihnen bisher noch gelassen hatte.
  en: And if they surmount all this, they fall victims to want of work in a crisis when all the little is taken from them that had hitherto been vouchsafed them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '327'
- id: V.4.1
  kind: p
  original: Wie ist es möglich, daß unter solchen Umständen die ärmere Klasse gesund sein und lange leben kann?
  en: How is it possible, under such conditions, for the lower class to be healthy and long lived?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '327'
- id: V.4.2
  kind: p
  original: Was läßt sich da anderes erwarten als eine übermäßige Proportion von Sterbefällen, eine fortwährende Existenz von Epidemien, eine sicher fortschreitende körperliche Schwächung der arbeitenden Generation?
  en: What else can be expected than an excessive mortality, an unbroken series of epidemics, a progressive deterioration in the physique of the working population?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '327'
- id: V.4.3
  kind: p
  original: Sehn wir zu, wie die Tatsachen stehen.
  en: Let us see how the facts stand.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '327'
- id: V.5.1
  kind: p
  original: Daß die Wohnungen der Arbeiter in den schlechten Stadtteilen, vereinigt mit der sonstigen Lebenslage dieser Klasse, eine Menge Krankheiten hervorrufen, wird uns von allen Seiten her bezeugt.
  en: That the dwellings of the workers in the worst portions of the cities, together with the other conditions of life of this class, engender numerous diseases, is attested on all sides.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '327'
- id: V.5.2
  kind: p
  original: Der oben zitierte Artikel des "Artizan" behauptet mit vollem Recht, daß Lungenkrankheiten die notwendige Folge von solchen Einrichtungen sein müssen und wirklich besonders häufig unter den Arbeitern vorkämen.
  en: The article already quoted from the Artisan asserts with perfect truth, that lung diseases must be the inevitable consequence of such conditions, and that, indeed, cases of this kind are disproportionately frequent in this class.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T1
    editions: '1892'
    reading: vorkommen
    base_text: … unter den Arbeitern vorkämen ‸ . …
  mew_page: '327'
- id: V.5.3
  kind: p
  original: Daß die schlechte Atmosphäre Londons und besonders der Arbeitergegenden die Ausbildung der Schwindsucht im höchsten Grade begünstigt, zeigt das hektische Aussehen so vieler Leute, denen man auf der Straße begegnet.
  en: That the bad air of London, and especially of the working-people's districts, is in the highest degree favourable to the development of consumption, the hectic appearance of great numbers of persons sufficiently indicates.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '327'
- id: V.5.4
  kind: p
  original: Wenn man morgens früh um die Zeit, wo alles an die Arbeit geht, ein wenig durch die Straßen streicht, so erstaunt man über die Menge halb oder ganz schwindsüchtig aussehender Leute, denen man begegnet.
  en: If one roams the streets a little in the early morning, when the multitudes are on their way to their work, one is amazed at the number of persons who look wholly or half-consumptive.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '327'
- id: V.5.5
  kind: p
  original: Selbst in Manchester sehen die Menschen so nicht aus; diese bleichen, hochaufgeschossenen, engbrüstigen und hohläugigen Gespenster, an denen man jeden Augenblick vorüberkommt, diese schlaffen, kraftlosen, aller Energie unfähigen Gesichter hab' ich nur in London in so auffallender Menge gesehen - obwohl auch in den Fabrikstädten des Nordens die Schwindsucht eine Menge Opfer jährlich hinwegrafft.
  en: Even in Manchester the people have not the same appearance; these pale, lank, narrow-chested, hollow-eyed ghosts, whom one passes at every step, these languid, flabby faces, incapable of the slightest energetic expression, I have seen in such startling numbers only in London, though consumption carries off a horde of victims annually in the factory towns of the North.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '327'
- id: V.5.6
  kind: p
  original: Mit der Schwindsucht konkurriert noch, außer anderen Lungenkrankheiten und dem Scharlachfieber, vor allen die Krankheit, die die fürchterlichsten Verwüstungen unter den Arbeitern anrichtet - der Typhus.
  en: In competition with consumption stands typhus, to say nothing of scarlet fever, a disease which brings most frightful devastation into the ranks of the working-class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 327-328
- id: V.5.7
  kind: p
  original: Dies allgemein verbreitete Übel wird von dem offiziellen.
  en: Typhus, that universally diffused affliction, is attributed by the official report on the sanitary condition of the working-class, directly to the bad state of the dwellings in the matters of ventilation, drainage, and cleanliness.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '328'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.5.8
  kind: p
  original: Bericht über den Gesundheitszustand der Arbeiterklasse direkt aus dem schlechten Zustande der Wohnungen in Beziehung auf Ventilation, Trockenlegung und Reinlichkeit abgeleitet.
  en: ''
  joined_to: V.5.7
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '328'
- id: V.5.9
  kind: p
  original: Dieser Bericht - der, nicht zu vergessen, von den ersten Medizinern Englands auf die Angaben von anderen Medizinern hin ausgearbeitet ist - dieser Bericht behauptet, daß ein einziger schlechtventilierter Hof, eine einzige Sackgasse ohne Abzüge, besonders wenn die Bewohner gedrängt wohnen und organische Stoffe in der Nähe sich zersetzen, imstande ist, Fieber zu erzeugen, und es fast immer erzeugt.
  en: This report, compiled, it must not be forgotten, by the leading physicians of England from the testimony of other physicians, asserts that a single ill-ventilated court, a single blind alley without drainage, is enough to engender fever, and usually does engender it, especially if the inhabitants are greatly crowded.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '328'
- id: V.5.10
  kind: p
  original: Dies Fieber hat fast überall denselben Charakter und entwickelt sich beinahe in allen Fällen zum ausgebildeten Typhus.
  en: This fever has the same character almost everywhere, and develops in nearly every case into specific typhus.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '328'
- id: V.5.11
  kind: p
  original: In den Arbeiterbezirken aller großen Städte, selbst in einzelnen schlechtgebauten und -gehaltenen Straßen kleinerer Orte findet es sich, und seine größte Verbreitung erhält es in den schlechten Vierteln, obwohl es natürlich auch in den besseren Bezirken einzelne Opfer aufsucht.
  en: It is to be found in the working-people's quarters of all great towns and cities, and in single ill-built, ill-kept streets of smaller places, though it naturally seeks out single victims in better districts also.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '328'
- id: V.5.12
  kind: p
  original: In London hat es seit geraumer Zeit geherrscht; seine außerordentliche Heftigkeit im Jahre 1837 veranlaßte den erwähnten offiziellen Bericht.
  en: In London it has now prevailed for a considerable time; its extraordinary violence in the year 1837 gave rise to the report already referred to.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '328'
- id: V.5.13
  kind: p
  original: Nach dem Jahresbericht des Dr. Southwood Smith über das Londoner Fieberhospital im Jahre 1843 war die Zahl der verpflegten Kranken 1 462, um 418 höher als in irgendeinem frühern Jahr.
  en: According to the annual report of Dr. Southwood Smith on the London Fever Hospital, the number of patients in 1843 was 1,462, or 418 more than in any previous year.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '328'
- id: V.5.14
  kind: p
  original: In den feuchten und schmutzigen Gegenden des Ost-, Nord- und Süddistrikts von London hatte diese Krankheit außerordentlich heftig gewütet.
  en: In the damp, dirty regions of the north, south, and east districts of London, this disease raged with extraordinary violence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '328'
- id: V.5.15
  kind: p
  original: Viele der Patienten waren eingewanderte Arbeiter vom Lande, die unterwegs und nach ihrer Ankunft die härtesten Entbehrungen ausgestanden, an den Straßen halbnackt und halbverhungert geschlafen, keine Arbeit gefunden hatten und so dem Fieber verfallen waren.
  en: Many of the patients were working-people from the country, who had endured the severest privation while migrating, and, after their arrival, had slept hungry and half-naked in the streets, and so fallen victims to the fever.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '328'
- id: V.5.16
  kind: p
  original: Diese Leute wurden so schwach ins Hospital geliefert, daß eine ungewöhnlich große Quantität von Wein, Kognak, Ammoniumpräparaten und anderen stimulierenden Mitteln angewandt werden mußte.
  en: These people were brought into the hospital in such a state of weakness, that unusual quantities of wine, cognac, and preparations of ammonia and other stimulants were required for their treatment; 16.5 per cent. of all patients died.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '328'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.5.17
  kind: p
  original: Von sämtlichen Kranken starben 16 1/2 Prozent.
  en: ''
  joined_to: V.5.16
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '328'
- id: V.5.18
  kind: p
  original: Auch in Manchester ist dies bösartige Fieber zu finden; in den schlechteren Arbeitervierteln der Altstadt, Ancoats, Little Ireland usw., ist es fast nie exstinkt, doch herrscht es hier, wie überhaupt in den englischen Städten, nicht in der Ausdehnung, die man erwarten sollte.
  en: This malignant fever is to be found in Manchester; in the worst quarters of the Old Town, Ancoats, Little Ireland, etc., it is rarely extinct; though here, as in the English towns generally, it prevails to a less extent than might be expected.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '328'
- id: V.5.19
  kind: p
  original: In Schottland und Irland dagegen grassiert der Typhus mit einer Heftigkeit, die alle Begriffe übersteigt; in Edinburgh und Glasgow trat er 1817 nach der Teurung, 1826 und 1837 nach den Handelskrisen mit besonderer Wut auf und ließ jedesmal, nachdem er etwa drei Jahre lang gewütet, für eine Zeitlang etwas nach; in Edinburgh waren während der Epidemie von 1817 an 6 000, in der von 1837 an 10 000 Personen vom Fieber ergriffen worden, und nicht nur die Zahl der Kranken, sondern auch die Heftigkeit der Krankheit und die Proportion der Sterbefälle vermehrte sich mit jeder neuen Wiederholung der Epidemie.
  en: In Scotland and Ireland, on the other hand, it rages with a violence that surpasses all conception. In Edinburgh and Glasgow it broke out in 1817, after the famine, and in 1826 and 1837 with especial violence, after the commercial crisis, subsiding somewhat each time after having raged about three years. In Edinburgh about 6,000 persons were attacked by the fever during the epidemic of 1817, and about 10,000 in that of 1837, and not only the number of persons attacked but the violence of the disease increased with each repetition.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N2
  mew_page: 328-329
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: V.5.20
  kind: p
  original: Aber die Wut der Krankheit scheint in allen früheren Perioden ein Kinderspiel gegen ihr Auftreten nach der Krisis von 1842 gewesen zu sein.
  en: But the fury of the epidemic in all former periods seems to have been child's play in comparison with its ravages after the crisis of 1842.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '329'
- id: V.5.21
  kind: p
  original: Ein Sechstel aller Armen in ganz Schottland wurde vom Fieber ergriffen und das Übel durch wandernde Bettler mit reißender Schnelligkeit von einem Ort zum andern getragen; es erreichte die mittleren und höheren Klassen der Gesellschaft nicht - in zwei Monaten waren mehr Fieberkranke als in zwölf Jahren vorher.
  en: One-sixth of the whole indigent population of Scotland was seized by the fever, and the infection was carried by wandering beggars with fearful rapidity from one locality to another. It did not reach the middle and upper classes of the population, yet in two months there were more fever cases than in twelve years before.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '329'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.5.22
  kind: p
  original: In Glasgow erkrankten im Jahre 1843 zwölf Prozent der Bevölkerung, 32 000 Menschen, am Fieber, von denen 32 Prozent starben, während die Sterblichkeit in Manchester und Liverpool gewöhnlich nur acht Prozent beträgt.
  en: In Glasgow, twelve per cent. of the population were seized in the year 1843; 32,000 persons, of whom thirty-two per cent. perished, while this mortality in Manchester and Liverpool does not ordinarily exceed eight per cent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '329'
- id: V.5.23
  kind: p
  original: Die Krankheit hatte ihre Krisen am siebenten und fünfzehnten Tage; an diesem letzteren wurde der Patient gewöhnlich gelb, was unsere Autorität für einen Beweis hält, daß die Ursache des Übels auch in geistiger Aufregung und Angst zu suchen sei.
  en: The illness reached a crisis on the seventh and fifteenth days; on the latter, the patient usually became yellow, which our authority regards as an indication that the cause of the malady was to be sought in mental excitement and anxiety.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N3
  mew_page: '329'
  en_note: 'English note {100b}: Alison. "Principles of Population," vol. ii.'
- id: V.5.24
  kind: p
  original: In Irland sind diese epidemischen Fieber ebenfalls heimisch.
  en: In Ireland, too, these fever epidemics have become domesticated.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '329'
- id: V.5.25
  kind: p
  original: Während 21 Monaten der Jahre 1817/18 gingen 39 000 Fieberkranke und in einem späteren Jahr nach Sheriff Alison (im zweiten Bande der "Principles of Population") sogar 60 000 Fieberkranke durch das Dubliner Hospital.
  en: During twenty-one months of the years 1817-1818, 39,000 fever patients passed through the Dublin hospital; and in a more recent year, according to Sheriff Alison, 60,000.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '329'
- id: V.5.26
  kind: p
  original: In Cork hatte das Fieberspital 1817/18 den siebenten Teil der Bevölkerung aufzunehmen, in Limerick war zu derselben Zeit ein Viertel und im schlechten Viertel von Waterford neunzehn Zwanzigstel der Einwohner fieberkrank.
  en: In Cork the fever hospital received one-seventh of the population in 1817-1818, in Limerick in the same time one-fourth, and in the bad quarter of Waterford, nineteen-twentieths of the whole population were ill of the fever at one time.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N4
  mew_page: '329'
- id: V.6.1
  kind: p
  original: Wenn man sich die Umstände ins Gedächtnis zurückruft, unter denen die Arbeiter leben, wenn man bedenkt, wie gedrängt ihre Wohnungen sind, wie vollgepfropft jeder Winkel von Menschen ist, wie Kranke und Gesunde in einem Zimmer, auf einem Lager schlafen, so wird man sich noch wundern, daß eine ansteckende Krankheit, wie dies Fieber, sich nicht noch mehr verbreitet.
  en: When one remembers under what conditions the working-people live, when one thinks how crowded their dwellings are, how every nook and corner swarms with human beings, how sick and well sleep in the same room, in the same bed, the only wonder is that a contagious disease like this fever does not spread yet farther.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '329'
- id: V.6.2
  kind: p
  original: Und wenn man bedenkt, wie wenig medizinische Hülfe den Erkrankten zu Gebote steht, wie viele von allem ärztlichen Rate verlassen und mit den gewöhnlichsten diätarischen Vorschriften unbekannt bleiben, so erscheint die Sterblichkeit noch gering.
  en: And when one reflects how little medical assistance the sick have at command, how many are without any medical advice whatsoever, and ignorant of the most ordinary precautionary measures, the mortality seems actually small.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T2
    editions: '1892'
    reading: diätetischen
    base_text: … mit den gewöhnlichsten diätarischen ‸ Vorschriften unbekannt bleiben, so …
  mew_page: '329'
- id: V.6.3
  kind: p
  original: Dr. Alison, der diese Krankheit genau kennt, führt sie geradezu auf die Not und die elende Lage der Armen zurück, wie der zitierte Bericht; er behauptet, daß Entbehrungen und ungenügende Befriedigung der Lebensbedürfnisse den Körper für die Ansteckung zugänglich und überhaupt die Epidemie erst furchtbar mache und rasch verbreite.
  en: Dr. Alison, who has made a careful study of this disease, attributes it directly to the want and the wretched condition of the poor, as in the report already quoted. He asserts that privations and the insufficient satisfaction of vital needs are what prepare the frame for contagion and make the epidemic widespread and terrible.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 329-330
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.6.4
  kind: p
  original: Er beweist, daß jedesmal eine Periode der Entbehrung - eine Handelskrisis oder eine Mißernte - in Schottland wie in Irland das epidemische Auftreten des Typhus hervorgebracht hat und daß die Wut der Krankheit fast ausschließlich auf die arbeitende Klasse gefallen ist.
  en: He proves that a period of privation, a commercial crisis or a bad harvest, has each time produced the typhus epidemic in Ireland as in Scotland, and that the fury of the plague has fallen almost exclusively on the working-class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: V.6.5
  kind: p
  original: Es ist bemerkenswert, daß nach seiner Aussage die Mehrzahl der dem Typhus erliegenden Individuen Familienväter sind, also grade diejenigen, welche von den Ihrigen am wenigsten entbehrt werden können; dasselbe sagen mehrere von ihm zitierte irische Ärzte aus.
  en: It is a noteworthy fact, that according to his testimony, the majority of persons who perish by typhus are fathers of families, precisely the persons who can least be spared by those dependent upon them; and several Irish physicians whom he quotes bear the same testimony.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: V.7.1
  kind: p
  original: Eine andere Reihe von Krankheiten hat weniger in der Wohnung als in der Nahrung der Arbeiter ihre unmittelbare Ursache.
  en: Another category of diseases arises directly from the food rather than the dwellings of the workers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: V.7.2
  kind: p
  original: Die an und für sich schon schwerverdauliche Kost der Arbeiter ist vollends für kleine Kinder ungeeignet; und doch fehlen dem Arbeiter die Mittel und die Zeit, seinen Kindern passendere Nahrung zu verschaffen.
  en: The food of the labourer, indigestible enough in itself, is utterly unfit for young children, and he has neither means nor time to get his children more suitable food.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: V.7.3
  kind: p
  original: Dazu kommt noch die sehr sich verbreitete Sitte, den Kindern Branntwein oder gar Opium zu geben, und aus alledem entstehen unter Mitwirkung der übrigen für die körperliche Entwicklung schädlichen Lebensverhältnisse die verschiedensten Krankheiten der Verdauungsorgane, die ihre Spuren für das ganze Leben zurücklassen.
  en: Moreover, the custom of giving children spirits, and even opium, is very general; and these two influences, with the rest of the conditions of life prejudicial to bodily development, give rise to the most diverse affections of the digestive organs, leaving life-long traces behind them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: V.7.4
  kind: p
  original: Fast alle Arbeiter haben einen mehr oder weniger schwachen Magen und sind trotzdem gezwungen, fortwährend bei der Diät zu bleiben, die die Ursache ihres Übels war.
  en: Nearly all workers have stomachs more or less weak, and are yet forced to adhere to the diet which is the root of the evil.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: V.7.5
  kind: p
  original: Wie sollten sie's auch wissen, was daran schuld ist - und wenn sie's wüßten, wie sollten sie eine passendere Diät halten können, solange sie nicht in eine andere Lebenslage versetzt und anders gebildet werden?
  en: How should they know what is to blame for it? And if they knew, how could they obtain a more suitable regimen so long as they cannot adopt a different way of living and are not better educated?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.7.6
  kind: p
  original: Aber aus dieser schlechten Verdauung entwickeln sich schon während der Kindheit neue Krankheiten.
  en: But new disease arises during childhood from impaired digestion.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: V.7.7
  kind: p
  original: Skrofeln sind fast allgemein unter den die Arbeitern verbreitet, und skrofulöse Eltern haben skrofulöse Kinder, besonders wenn die ursprüngliche Ursache der Krankheit wiederum auf die geerbte skrofulöse Anlage dieser letzteren wirkt.
  en: Scrofula is almost universal among the working-class, and scrofulous parents have scrofulous children, especially when the original influences continue in full force to operate upon the inherited tendency of the children.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: V.7.8
  kind: p
  original: Eine zweite Folge dieser ungenügenden Ernährung des Körpers während der Entwicklung ist Rachitis (englische Krankheit, knotige Auswüchse an den Gelenken), die sich zur ebenfalls sehr häufig an den Kindern der Arbeiter findet.
  en: A second consequence of this insufficient bodily nourishment, during the years of growth and development, is rachitis, which is extremely common among the children of the working-class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: V.7.9
  kind: p
  original: Die Verhärtung der Knochen wird verzögert, der Knochenbau überhaupt in seiner Ausbildung gehemmt, und neben den gewöhnlichen rachitischen Affektionen findet man oft genug Verkrümmung der Beine und des Rückgrats.
  en: The hardening of the bones is delayed, the development of the skeleton in general is restricted, and deformities of the legs and spinal column are frequent, in addition to the usual rachitic affections.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: V.7.10
  kind: p
  original: Wie sehr alle diese Übel durch die Wechselfälle verschlimmert werden, denen die Arbeiter durch die Schwankungen des Handels, die Brotlosigkeit und den knappen Lohn der Krisen ausgesetzt sind, brauch' ich wohl nicht erst zu sagen.
  en: How greatly all these evils are increased by the changes to which the workers are subject in consequence of fluctuations in trade, want of work, and the scanty wages in time of crisis, it is not necessary to dwell upon.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '330'
- id: V.7.11
  kind: p
  original: Der temporäre Mangel an zureichender Nahrung, dem fast jeder Arbeiter wenigstens einmal in seinem Leben eine Zeitlang ausgesetzt wird, trägt nur dazu bei, die Folgen der schlechten, aber doch zureichenden Nahrung zu verschlimmern.
  en: Temporary want of sufficient food, to which almost every working-man is exposed at least once in the course of his life, only contributes to intensify the effects of his usual sufficient but bad diet.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 330-331
- id: V.7.12
  kind: p
  original: Kinder, die gerade zu der Zeit, wo sie die Nahrung am nötigsten hätten, nur halbsatt zu essen bekommen - und wie viele gibt es deren während jeder Krisis, ja noch in den besten Perioden des Verkehrs - solche Kinder müssen notwendig schwach, skrofulös und rachitisch in hohem Grade werden.
  en: Children who are half-starved, just when they most need ample and nutritious food--and how many such there are during every crisis and even when trade is at its best--must inevitably become weak, scrofulous and rachitic in a high degree.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: V.7.13
  kind: p
  original: Und daß sie's werden, zeigt der Augenschein.
  en: And that they do become so, their appearance amply shows.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: V.7.14
  kind: p
  original: Die Vernachlässigung, zu der die große Masse der Arbeiterkinder verurteilt wird, hinterläßt unvertilgbare Spuren und hat die Schwächung der ganzen arbeitenden Generation zur Folge.
  en: The neglect to which the great mass of working-men's children are condemned leaves ineradicable traces and brings the enfeeblement of the whole race of workers with it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: V.7.15
  kind: p
  original: Dazu noch die ungeeignete Kleidung dieser Klasse und die hier gesteigerte Unmöglichkeit, sich vor Erkältungen zu schützen, dann die Notwendigkeit zu arbeiten, solange die Unpäßlichkeit eben erlaubt, die im Krankheitsfall gesteigerte Not der Familie, die nur zu gewöhnliche Entbehrung alles ärztlichen Beistandes gerechnet - so wird man sich ungefähr vorstellen können, was der Gesundheitszustand der englischen Arbeiter ist.
  en: Add to this, the unsuitable clothing of this class, the impossibility of precautions against colds, the necessity of toiling so long as health permits, want made more dire when sickness appears, and the only too common lack of all medical assistance; and we have a rough idea of the sanitary condition of the English working-class.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T3
    editions: '1892'
    reading: '... noch gerechnet die ungeeignete'
    base_text: … Dazu noch die ungeeignete ‸ Kleidung dieser Klasse und …
  - ref: T4
    editions: '1892'
    reading: '... Beistands - so'
    base_text: … Beistandes gerechnet - so ‸ wird man sich ungefähr …
  mew_page: '331'
- id: V.7.16
  kind: p
  original: Die schädlichen Folgen, welche einzelnen Arbeitszweigen, wie sie jetzt betrieben werden, eigen sind, will ich hier noch gar nicht erwähnen.
  en: The injurious effects peculiar to single employments as now conducted, I shall not deal with here.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: V.8.1
  kind: p
  original: Dazu kommen noch andere Einflüsse, die die Gesundheit einer großen Zahl von Arbeitern schwächen.
  en: Besides these, there are other influences which enfeeble the health of a great number of workers, intemperance most of all.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.8.2
  kind: p
  original: Vor allem der Trunk.
  en: ''
  joined_to: V.8.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '331'
- id: V.8.3
  kind: p
  original: Alle Lockungen, alle möglichen Versuchungen vereinigen sich, um die Arbeiter zur Trunksucht zu bringen.
  en: All possible temptations, all allurements combine to bring the workers to drunkenness.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: V.8.4
  kind: p
  original: Der Branntwein ist ihnen fast die einzige Freudenquelle, und alles vereinigt sich, um sie ihnen recht nahezulegen.
  en: Liquor is almost their only source of pleasure, and all things conspire to make it accessible to them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '331'
- id: V.8.5
  kind: p
  original: Der Arbeiter kommt müde und erschlafft von seiner Arbeit heim; er findet eine Wohnung ohne alle Wohnlichkeit, feucht, unfreundlich und schmutzig; er bedarf dringend einer Aufheiterung, er muß etwas haben, das ihm die Arbeit der Mühe wert, die Aussicht auf den nächsten sauren Tag erträglich macht; seine abgespannte, unbehagliche und hypochondrische Stimmung, die schon aus seinem ungesunden Zustande, namentlich aus der Indigestion entsteht, wird durch seine übrige Lebenslage, durch die Unsicherheit seiner Existenz, durch seine Abhängigkeit von allen möglichen Zufällen und sein Unvermögen, selbst etwas zur Sicherstellung seiner Lage zu tun, bis zur Unerträglichkeit gesteigert; sein geschwächter Körper, geschwächt durch schlechte Luft und schlechte Nahrung, verlangt mit Gewalt nach einem Stimulus von außen her; sein geselliges Bedürfnis kann nur in einem Wirtshause befriedigt werden, er hat durchaus keinen andern Ort, wo er seine Freunde treffen könnte - und bei alledem sollte der Arbeiter nicht die stärkste Versuchung zur Trunksucht haben, sollte imstande sein, den Lockungen des Trunks zu widerstehen?
  en: The working-man comes from his work tired, exhausted, finds his home comfortless, damp, dirty, repulsive; he has urgent need of recreation, he must have something to make work worth his trouble, to make the prospect of the next day endurable. His unnerved, uncomfortable, hypochondriac state of mind and body arising from his unhealthy condition, and especially from indigestion, is aggravated beyond endurance by the general conditions of his life, the uncertainty of his existence, his dependence upon all possible accidents and chances, and his inability to do anything towards gaining an assured position. His enfeebled frame, weakened by bad air and bad food, violently demands some external stimulus; his social need can be gratified only in the public-house, he has absolutely no other place where he can meet his friends. How can he be expected to resist the temptation?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 331-332
  align: '1:4'
  review: true
  review_reason: 1 de sentence(s) matched to 4 en sentence(s)
- id: V.8.6
  kind: p
  original: Im Gegenteil, es ist die moralische und physische Notwendigkeit vorhanden, daß unter diesen Umständen eine sehr große Menge der Arbeiter dem Trunk verfallen muß.
  en: It is morally and physically inevitable that, under such circumstances, a very large number of working-men should fall into intemperance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: V.8.7
  kind: p
  original: Und abgesehen von den mehr physischen Einflüssen, die den Arbeiter zum Trunk antreiben, wirkt das Beispiel der großen Menge, die vernachlässigte Erziehung, die Unmöglichkeit, die jüngeren Leute vor der Versuchung zu schützen, in vielen Fällen der direkte Einfluß trunksüchtiger Eltern, die ihren Kindern selbst Branntwein geben, die Gewißheit, im Rausch wenigstens für ein paar Stunden die Not und den Druck des Lebens zu vergessen, und hundert andere Umstände so stark, daß man den Arbeitern ihre Vorliebe für den Branntwein wahrlich nicht verdenken kann.
  en: And apart from the chiefly physical influences which drive the working-man into drunkenness, there is the example of the great mass, the neglected education, the impossibility of protecting the young from temptation, in many cases the direct influence of intemperate parents, who give their own children liquor, the certainty of forgetting for an hour or two the wretchedness and burden of life, and a hundred other circumstances so mighty that the workers can, in truth, hardly be blamed for yielding to such overwhelming pressure.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: V.8.8
  kind: p
  original: Die Trunksucht hat hier aufgehört, ein Laster zu sein, für das man den Lasterhaften verantwortlich machen kann, sie wird ein Phänomen, die notwendige, unvermeidliche Folge gewisser Bedingungen auf ein, wenigstens diesen Bedingungen gegenüber, willenloses Objekt.
  en: Drunkenness has here ceased to be a vice, for which the vicious can be held responsible; it becomes a phenomenon, the necessary, inevitable effect of certain conditions upon an object possessed of no volition in relation to those conditions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: V.8.9
  kind: p
  original: Diejenigen, die den Arbeiter zum bloßen Objekt gemacht haben, mögen die Verantwortlichkeit tragen.
  en: They who have degraded the working-man to a mere object have the responsibility to bear.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: V.8.10
  kind: p
  original: Aber mit derselben Notwendigkeit, mit der eine große Menge der Arbeiter dem Trunk verfallen, mit derselben Notwendigkeit äußert der Trunk seine zerstörenden Wirkungen auf Geist und Körper seiner Opfer.
  en: But as inevitably as a great number of working-men fall a prey to drink, just so inevitably does it manifest its ruinous influence upon the body and mind of its victims.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: V.8.11
  kind: p
  original: Alle Krankheitsanlagen, die aus den Lebensverhältnissen der Arbeiter entspringen, werden durch ihn gefördert, die Entwicklung von Lungen- und Unterleibskrankheiten sowie die Entstehung und Verbreitung des Typhus werden im höchsten Grade durch ihn begünstigt.
  en: All the tendencies to disease arising from the conditions of life of the workers are promoted by it, it stimulates in the highest degree the development of lung and digestive troubles, the rise and spread of typhus epidemics.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: V.9.1
  kind: p
  original: Eine andere Ursache körperlicher Übel liegt für die arbeitende Klasse in der Unmöglichkeit, sich in Krankheitsfällen den Beistand geschickter Ärzte zu verschaffen.
  en: Another source of physical mischief to the working-class lies in the impossibility of employing skilled physicians in cases of illness.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: V.9.2
  kind: p
  original: Es ist wahr, daß eine Menge wohltätiger Anstalten diesem Mangel abzuhelfen suchen, daß z.B. das Krankenhaus in Manchester jährlich an 22 000 Kranke teils aufnimmt, teils mit ärztlichem Rat und Arznei unterstützt - aber was ist das alles in einer Stadt, wo nach Gaskells Berechnung drei Viertel der Einwohner jährlich ärztlicher Hülfe bedürfen?
  en: It is true that a number of charitable institutions strive to supply this want, that the infirmary in Manchester, for instance, receives or gives advice and medicine to 2,200 patients annually. But what is that in a city in which, according to Gaskell's calculation, three-fourths of the population need medical aid every year?
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N5
  mew_page: '332'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.9.3
  kind: p
  original: Die englischen Ärzte rechnen hohe Gebühren, und die Arbeiter sind nicht imstande, diese zu bezahlen.
  en: English doctors charge high fees, and working-men are not in a position to pay them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: V.9.4
  kind: p
  original: Sie können also entweder gar nichts tun, oder sie sind gezwungen, wohlfeile Quacksalber und Quackarzneien zu gebrauchen, mit denen sie sich auf die Dauer mehr schaden als nützen.
  en: They can therefore do nothing, or are compelled to call in cheap charlatans, and use quack remedies, which do more harm than good.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: V.9.5
  kind: p
  original: Eine überaus große Anzahl solcher Quacksalber treibt ihr Wesen in allen englischen Städten und verschafft sich durch Annoncen, Maueranschläge und sonstige Kniffe eine Kundschaft aus den ärmeren Klassen.
  en: An immense number of such quacks thrive in every English town, securing their clientele among the poor by means of advertisements, posters, and other such devices.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '332'
- id: V.9.6
  kind: p
  original: Außerdem aber werden noch eine Menge sogenannter Patent-Arzneien (patent medicines) für alle möglichen und unmöglichen Übel verkauft, Morrisons Pillen, Parrs Lebenspillen, Dr. Mainwarings Pillen und tausend andere Pillen, Essenzen und Balsame, die alle die Eigenschaft haben, sämtliche Krankheiten in der Welt zu kurieren.
  en: 'Besides these, vast quantities of patent medicines are sold, for all conceivable ailments: Morrison''s Pills, Parr''s Life Pills, Dr. Mainwaring''s Pills, and a thousand other pills, essences, and balsams, all of which have the property of curing all the ills that flesh is heir to.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 332-333
- id: V.9.7
  kind: p
  original: Diese Arzneien enthalten zwar selten geradezu schädliche Dinge, wirken aber doch sehr häufig, wenn oft und viel genossen, auf den Körper nachteilig, und da den unkundigen Arbeitern in allen Annoncen vorgepredigt wird, man könne nicht zuviel davon nehmen, so darf man sich nicht wundern, wenn diese fortwährend, mit und ohne sonstige Veranlassung, große Quantitäten verschlucken.
  en: These medicines rarely contain actually injurious substances, but, when taken freely and often, they affect the system prejudicially; and as the unwary purchasers are always recommended to take as much as possible, it is not to be wondered at that they swallow them wholesale whether wanted or not.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.9.8
  kind: p
  original: Es ist nichts Ungewöhnliches, daß der Verfertiger der Parrschen Lebenspillen in einer Woche 20 000 bis 25 000 Schachteln von diesen heilsamen Pillen verkauft - und sie werden eingenommen, von diesem gegen Verstopfung, von jenem gegen Diarrhöe, gegen Fieber, Schwäche und alle möglichen Übel.
  en: It is by no means unusual for the manufacturer of Parr's Life Pills to sell twenty to twenty-five thousand boxes of these salutary pills in a week, and they are taken for constipation by this one, for diarrhoea by that one, for fever, weakness, and all possible ailments.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.9.9
  kind: p
  original: Wie unsere deutschen Bauern zu gewissen Jahreszeiten sich schröpfen oder zur Ader ließen, so nehmen jetzt die englischen Arbeiter ihre Patentmedizin, um sich selbst dadurch zu schaden und dem Fabrikanten derselben ihr Geld in die Tasche zu jagen.
  en: As our German peasants are cupped or bled at certain seasons, so do the English working-people now consume patent medicines to their own injury and the great profit of the manufacturer.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.9.10
  kind: p
  original: Eins der schädlichsten von diesen Patentmitteln ist ein Trank, der von Opiaten, besonders Laudanum, bereitet und unter dem Namen "Godfrey's Cordial" verkauft wird.
  en: One of the most injurious of these patent medicines is a drink prepared with opiates, chiefly laudanum, under the name Godfrey's Cordial.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.9.11
  kind: p
  original: Frauen, die zu Hause arbeiten und eigne oder fremde Kinder zu verwahren haben, geben ihnen diesen Trank, damit sie ruhig sein und, wie viele meinen, kräftiger werden sollen.
  en: Women who work at home, and have their own and other people's children to take care of, give them this drink to keep them quiet, and, as many believe, to strengthen them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.9.12
  kind: p
  original: Sie fangen oft schon gleich nach der Geburt an zu medizinieren, ohne die schädlichen Folgen dieser "Herzstärkung" zu kennen, so lange bis die Kinder sterben.
  en: They often begin to give this medicine to newly-born children, and continue, without knowing the effects of this "heartsease," until the children die.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.9.13
  kind: p
  original: Je stumpfer der Organismus des Kindes gegen die Wirkungen des Opiums wird, desto größere Quantitäten werden ihm davon gegeben.
  en: The less susceptible the child's system to the action of the opium, the greater the quantities administered.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.9.14
  kind: p
  original: Wenn das "Cordial" nicht mehr zieht, wird auch wohl unvermischtes Laudanum gereicht, oft 15 bis 20 Tropfen auf einmal.
  en: When the cordial ceases to act, laudanum alone is given, often to the extent of fifteen to twenty drops at a dose.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.9.15
  kind: p
  original: Der Coroner von Nottingham bezeugte einer Regierungskommission, daß ein Apotheker nach eigner Aussage dreizehn Zentner Sirup in einem Jahre zu "Godfrey's Cordial" verarbeitet habe.
  en: The Coroner of Nottingham testified before a Parliamentary Commission that one apothecary had, according to his own statement, used thirteen hundredweight of laudanum in one year in the preparation of Godfrey's Cordial.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N6
  variants:
  - ref: T5
    editions: English 1887
    reading: In der englischen Ausgabe 1887:... thirteen hundredweight of laudanum... [dreizehn Zentner Laudanum]
    base_text: … Aussage dreizehn Zentner Sirup ‸ in einem Jahre zu …
  mew_page: '333'
- id: V.9.16
  kind: p
  original: Man kann sich leicht denken, was die Folgen für die so behandelten Kinder sind.
  en: The effects upon the children so treated may be readily imagined.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.9.17
  kind: p
  original: Sie werden blaß, welk und schwach und sterben meist, ehe sie zwei Jahre alt sind.
  en: They are pale, feeble, wilted, and usually die before completing the second year.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.9.18
  kind: p
  original: Die Anwendung dieser Medizin ist in allen großen Städten und Industriebezirken des Reichs sehr verbreitet.
  en: The use of this cordial is very extensive in all great towns and industrial districts in the kingdom.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.10.1
  kind: p
  original: Die Folge von allen diesen Einflüssen ist eine allgemeine Schwächung des Körpers bei den Arbeitern.
  en: The result of all these influences is a general enfeeblement of the frame in the working-class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.10.2
  kind: p
  original: Man findet wenig starke, wohlgebaute und gesunde Leute unter ihnen - wenigstens unter den Industriearbeitern, die meist in geschlossenen Räumen arbeiten, und von diesen nur ist hier die Rede.
  en: There are few vigorous, well-built, healthy persons among the workers, i.e., among the factory operatives, who are employed in confined rooms, and we are here discussing these only.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.10.3
  kind: p
  original: Sie sind fast alle schwächlich, von eckigem, aber nicht kräftigem Knochenbau, mager, bleich und mit Ausnahme der bei ihrer Arbeit besonders angestrengten Muskeln schlaff von Fieber.
  en: They are almost all weakly, of angular but not powerful build, lean, pale, and of relaxed fibre, with the exception of the muscles especially exercised in their work.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.10.4
  kind: p
  original: Fast alle leiden an schlechter Verdauung und sind infolgedessen mehr oder weniger hypochondrisch und von trüber, unbehaglicher Gemütsstimmung.
  en: Nearly all suffer from indigestion, and consequently from a more or less hypochondriac, melancholy, irritable, nervous condition.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.10.5
  kind: p
  original: Ihr geschwächter Körper ist nicht imstande, einer Krankheit Widerstand zu leisten, und wird daher bei jeder Gelegenheit davon ergriffen.
  en: Their enfeebled constitutions are unable to resist disease, and are therefore seized by it on every occasion.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.10.6
  kind: p
  original: Daher altern sie früh und sterben jung.
  en: Hence they age prematurely, and die early.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.10.7
  kind: p
  original: Die Sterblichkeitstabellen liefern dafür einen unwidersprechlichen Beweis.
  en: On this point the mortality statistics supply unquestionable testimony.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.11.1
  kind: p
  original: Nach dem Berichte des Generalregistrators G. Graham ist die Sterblichkeit von ganz England und Wales jährlich etwas unter 2 1/4 Prozent, d.h. aus 45 Menschen stirbt jedes Jahr einer.
  en: According to the Report of Registrar-General Graham, the annual death-rate of all England and Wales is something less than 2.25 per cent. That is to say, out of forty-five persons, one dies every year.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N7
  mew_page: '333'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.11.2
  kind: p
  original: Wenigstens war dies der Durchschnitt der Jahre 1 839/40 - im nächsten Jahre nahm die Sterblichkeit etwas ab und war nur einer aus 46. In den großen Städten aber stellt sich das Verhältnis ganz anders.
  en: This was the average for the year 1839-40. In 1840-41 the mortality diminished somewhat, and the death-rate was but one in forty-six. But in the great cities the proportion is wholly different.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.11.3
  kind: p
  original: 'Mir liegen (im "Manchester Guardian", 31. Juli 1844) offizielle Sterblichkeitstabellen vor, nach denen sich die Sterblichkeit einiger großer Städte so berechnet: In Manchester inklusive Salford und Chorlton 1 aus 32,72 und exklusive Salford und Chorlton 1 aus 30,75; in Liverpool inklusive West-Derby (Vorstadt) 31,90 und exklusive West-Derby 29,90, während der Durchschnitt sämtlicher angegebenen Distrikte von Cheshire, Lancashire und Yorkshire - und diese schließen eine Menge ganz oder halb ländlicher Distrikte ein, dazu viele kleine Städte - mit einer Bevölkerung von 2 172 506 Menschen eine Sterblichkeit von 1 aus 39,80 ergibt.'
  en: I have before me official tables of mortality (Manchester Guardian, July 31st, 1844), according to which the death-rate of several large towns is as follows:--In Manchester, including Chorlton and Salford, one in 32.72; and excluding Chorlton and Salford, one in 30.75. In Liverpool, including West Derby (suburb), 31.90, and excluding West Derby, 29.90; while the average of all the districts of Cheshire, Lancashire, and Yorkshire cited, including a number of wholly or partially rural districts and many small towns, with a total population of 2,172,506 for the whole, is one death in 39.80 persons.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '333'
- id: V.11.4
  kind: p
  original: Wie ungünstig die Arbeiter in den Städten gestellt sind, zeigt die Sterblichkeit von Prescot in Lancashire - einem von Kohlengrubenarbeitern bewohnten und, da die Arbeit in den Gruben keine sehr gesunde ist, an Gesundheit noch unter den Ackerbaubezirken stehenden Distrikt.
  en: 'How unfavourably the workers are placed in the great cities, the mortality for Prescott in Lancashire shows: a district inhabited by miners, and showing a lower sanitary condition than that of the agricultural districts, mining being by no means a healthful occupation.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 333-335
- id: V.11.5
  kind: p
  original: Aber die Arbeiter wohnen auf dem Lande, und die Sterblichkeit stellt sich auf 1 in 47,54, also beinahe 2 1/2 vorteilhafter als der Durchschnitt von ganz England.
  en: But these miners live in the country, and the death-rate among them is but one in 47.54, or nearly two-and-a-half per cent. better than that for all England.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '335'
- id: V.11.6
  kind: p
  original: Sämtliche Angaben beruhen auf den Sterblichkeitstabellen von 1843.
  en: All these statements are based upon the mortality tables for 1843.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '335'
- id: V.11.7
  kind: p
  original: Noch höher ist das Verhältnis der Sterblichkeit in den schottischen Städten; in Edinburgh 1838 39,1 aus 28, ja 1831 in der Altstadt allein 1 aus 22; in Glasgow nach Dr. Cowan (Vital Statistics of Glasgow); durchschnittlich seit 1830 1 aus 30, in einzelnen Jahren 1 aus 22 bis 24. Daß diese enorme Verkürzung der durchschnittlichen Lebensdauer hauptsächlich auf die arbeitende Klasse fällt, ja daß der Durchschnitt aller Klassen durch die geringere Sterblichkeit der höheren und mittleren Klassen noch verbessert wird, wird uns von allen Seiten bezeugt.
  en: Still higher is the death-rate in the Scotch cities; in Edinburgh, in 1838-39, one in 29; in 1831, in the Old Town alone, one in 22. In Glasgow, according to Dr. Cowen, the average has been, since 1830, one in 30; and in single years, one in 22 to 24. That this enormous shortening of life falls chiefly upon the working-class, that the general average is improved by the smaller mortality of the upper and middle-classes, is attested upon all sides.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '335'
  en_note: 'English note {106}: Dr. Cowen. "Vital Statistics of Glasgow."'
- id: V.11.8
  kind: p
  original: Eins der neuesten Zeugnisse ist das des Arztes P. H. Holland in Manchester, der in offiziellem Auftrage die Vorstadt von Manchester, Chorlton-on-Medlock, untersuchte.
  en: One of the most recent depositions is that of a physician, Dr. P. H. Holland, in Manchester, who investigated Chorlton-on-Medlock, a suburb of Manchester, under official commission.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N8
  mew_page: '335'
- id: V.11.9
  kind: p
  original: 'Er klassifiziert Häuser und Straßen in je drei Klassen und fand folgende Unterschiede der Sterblichkeit:'
  en: 'He divided the houses and streets into three classes each, and ascertained the following variations in the death-rate:'
  modern: ''
