  notes: ''
- id: V.N1.1.6
  kind: note
  original: Our German capitalists are fully up to the English level, in this respect at least, in the year of grace, 1886.
  en: If I were writing for the English bourgeoisie, the case would be different.
  modern: ''
  modern_status: empty
  notes: ''
- id: V.N1.1.7
  kind: note
  original: '[Und so ist es jetzt in Deutschland. Unsere deutschen Kapitalisten stehen, zumindest in dieser Beziehung, mit den Engländern auf völlig gleichem Niveau, im gesegneten Jahr 1886.] - (1892) Wie hat sich das alles seit 50 Jahren geändert!'
  en: (And so it is now in Germany. Our German capitalists are fully up to the English level, in this respect at least, in the year of grace, 1886.)
