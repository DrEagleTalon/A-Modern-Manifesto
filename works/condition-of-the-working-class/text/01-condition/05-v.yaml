  mew_page: '341'
- id: V.24.1
  kind: p
  original: Aus den Töpfereibezirken und aus Lancashire wird Ähnliches berichtet.
  en: From the pottery districts and from Lancashire the reports are similar.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '341'
- id: V.25.1
  kind: p
  original: Man sieht, was die Bourgeoisie und der Staat für die Erziehung und Ausbildung der arbeitenden Klasse getan haben.
  en: This is what the bourgeoisie and the State are doing for the education and improvement of the working-class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: V.25.2
  kind: p
  original: Glücklicherweise sind die Verhältnisse, in denen diese Klasse lebt, derart, daß sie ihr eine praktische Bildung geben, welche nicht nur den Schulkram ersetzt, sondern auch die mit ihm verbundenen verworrenen religiösen Vorstellungen unschädlich macht und die Arbeiter sogar an die Spitze der nationalen Bewegung Englands stellt.
  en: Fortunately the conditions under which this class lives are such as give it a sort of practical training, which not only replaces school cramming, but renders harmless the confused religious notions connected with it, and even places the workers in the vanguard of the national movement of England.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: V.25.3
  kind: p
  original: Not lehrt beten und, was mehr heißen will, denken und handeln.
  en: Necessity is the mother of invention, and what is still more important, of thought and action.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: V.25.4
  kind: p
  original: Der englische Arbeiter, der kaum lesen und noch weniger schreiben kann, weiß dennoch sehr gut, was sein eignes Interesse und das der ganzen Nation ist - er weiß auch, was das spezielle Interesse der Bourgeoisie ist und was er von dieser Bourgeoisie zu erwarten hat.
  en: The English working-man who can scarcely read and still less write, nevertheless knows very well where his own interest and that of the nation lies. He knows, too, what the especial interest of the bourgeoisie is, and what he has to expect of that bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.25.5
  kind: p
  original: Kann er nicht schreiben, so kann er doch sprechen, öffentlich sprechen; kann er nicht rechnen, so kann er doch mit nationalökonomischen Begriffen soviel kalkulieren, als dazu gehört, einen korngesetzabschaffenden Bourgeois zu durchschauen und zu widerlegen; bleiben ihm trotz aller Mühe der Pfaffen die himmlischen Fragen sehr unklar, so weiß er desto besser Bescheid in irdischen, politischen und sozialen Fragen.
  en: If he cannot write he can speak, and speak in public; if he has no arithmetic, he can, nevertheless, reckon with the Political Economists enough to see through a Corn-Law-repealing bourgeois, and to get the better of him in argument; if celestial matters remain very mixed for him in spite of all the effort of the preachers, he sees all the more clearly into terrestrial, political, and social questions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: V.25.6
  kind: p
  original: Wir werden davon noch weiter zu reden haben und gehen jetzt zur sittlichen Charakterisierung unserer Arbeiter über.
  en: We shall have occasion to refer again to this point; and pass now to the moral characteristics of our workers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: V.26.1
  kind: p
  original: Daß der Moralunterricht, der in allen Schulen Englands mit dem religiösen vereinigt ist, von keiner besseren Wirkung sein kann als dieser, ist ziemlich klar.
  en: It is sufficiently clear that the instruction in morals can have no better effect than the religious teaching, with which in all English schools it is mixed up.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: V.26.2
  kind: p
  original: Die einfachen Prinzipien, welche für den Menschen das Verhältnis des Menschen zum Menschen regulieren, Prinzipien, die schon durch den sozialen Zustand, den Krieg Aller gegen Alle, in die greulichste Verwirrung geraten, müssen dem ungebildeten Arbeiter vollends unklar und fremd bleiben, wenn sie mit religiösen, unverständlichen Lehrsätzen vermischt und in der religiösen Form eines willkürlichen, unbegründeten Befehls vorgetragen werden.
  en: The simple principles which, for plain human beings, regulate the relations of man to man, brought into the direst confusion by our social state, our war of each against all, necessarily remain confused and foreign to the working-man when mixed with incomprehensible dogmas, and preached in the religious form of an arbitrary and dogmatic commandment.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: V.26.3
  kind: p
  original: Die Schulen tragen nach dem Geständnis aller Autoritäten, namentlich der Child. Empl. Comm., zur Sittlichkeit der arbeitenden Klasse fast gar nichts bei.
  en: The schools contribute, according to the confession of all authorities, and especially of the Children's Employment Commission, almost nothing to the morality of the working-class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: V.26.4
  kind: p
  original: So rücksichtslos, so dumm borniert ist die englische Bourgeoisie in ihrem Egoismus, daß sie sich nicht einmal die Mühe gibt, den Arbeitern die heutige Moral einzuprägen, eine Moral, welche die Bourgeoisie sich doch in ihrem eignen Interesse und zu ihrem eignen Schutz zusammengestümpert hat!
  en: So short-sighted, so stupidly narrow-minded is the English bourgeoisie in its egotism, that it does not even take the trouble to impress upon the workers the morality of the day, which the bourgeoisie has patched together in its own interest for its own protection!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: V.26.5
  kind: p
  original: Selbst diese Sorge für sich selbst macht der schlaff werdenden, trägen Bourgeoisie zuviel Mühe, selbst das scheint ihr überflüssig.
  en: Even this precautionary measure is too great an effort for the enfeebled and sluggish bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: V.26.6
  kind: p
  original: Die Zeit wird freilich kommen, wo sie ihr Versäumnis zu spät bereuen wird.
  en: A time must come when it will repent its neglect, too late.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: V.26.7
  kind: p
  original: Aber beklagen darf sie sich nicht, wenn die Arbeiter von dieser Moral nichts wissen und sich nicht nach ihr richten.
  en: But it has no right to complain that the workers know nothing of its system of morals, and do not act in accordance with it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: V.27.1
  kind: p
  original: So sind die Arbeiter, wie körperlich und intellektuell, auch moralisch von der machthabenden Klasse ausgestoßen und vernachlässigt.
  en: Thus are the workers cast out and ignored by the class in power, morally as well as physically and mentally.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '342'
- id: V.27.2
  kind: p
  original: Die einzige Rücksicht, die man noch für sie hat, ist das Gesetz, das sich an sie anklammert, sobald sie der Bourgeoisie zu nahe treten - wie gegen die unvernünftigen Tiere wendet man nur ein Bildungsmittel auf sie an - die Peitsche, die brutale, nicht überzeugende, nur einschüchternde Gewalt.
  en: The only provision made for them is the law, which fastens upon them when they become obnoxious to the bourgeoisie. Like the dullest of the brutes, they are treated to but one form of education, the whip, in the shape of force, not convincing but intimidating.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 342-343
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.27.3
  kind: p
  original: Es ist also auch nicht zu verwundern, wenn die so wie Tiere behandelten Arbeiter entweder wirklich zu Tieren werden oder sich nur durch den glühendsten Haß, durch fortwährende innere Empörung gegen die machthabende Bourgeoisie das Bewußtsein und Gefühl ihrer Menschheit bewahren können.
  en: There is, therefore, no cause for surprise if the workers, treated as brutes, actually become such; or if they can maintain their consciousness of manhood only by cherishing the most glowing hatred, the most unbroken inward rebellion against the bourgeoisie in power.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: V.27.4
  kind: p
  original: Sie sind nur Menschen, solange sie den Zorn gegen die herrschende Klasse fühlen; sie werden Tiere, sobald sie sich geduldig in ihr Joch fügen und sich nur das Leben im Joch angenehm zu machen suchen, ohne das Joch selbst brechen zu wollen.
  en: They are men so long only as they burn with wrath against the reigning class. They become brutes the moment they bend in patience under the yoke, and merely strive to make life endurable while abandoning the effort to break the yoke.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.28.1
  kind: p
  original: Das ist also alles, was die Bourgeoisie zur Bildung der arbeitenden Klasse getan hat - und wenn wir die übrigen Umstände erwägen, in denen diese letztere lebt, so werden wir ihr den Ingrimm, den sie gegen die herrschende Klasse hegt, vollends nicht verübeln können.
  en: This, then, is all that the bourgeoisie has done for the education of the proletariat--and when we take into consideration all the circumstances in which this class lives, we shall not think the worse of it for the resentment which it cherishes against the ruling class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: V.28.2
  kind: p
  original: Die sittliche Bildung, die dem Arbeiter in der Schule nicht gereicht wird, wird ihm auch in seinen sonstigen Lebensverhältnissen nicht geboten - wenigstens die sittliche Bildung nicht, die in den Augen der Bourgeoisie etwas gilt.
  en: The moral training which is not given to the worker in school is not supplied by the other conditions of his life; that moral training, at least, which alone has worth in the eyes of the bourgeoisie; his whole position and environment involves the strongest temptation to immorality.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.28.3
  kind: p
  original: Seine ganze Stellung und Umgebung enthält die stärksten Neigungen zur Immoralität.
  en: ''
  joined_to: V.28.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '343'
- id: V.28.4
  kind: p
  original: Er ist arm, das Leben hat keinen Reiz für ihn, fast alle Genüsse sind ihm versagt, die Strafen des Gesetzes haben nichts Fürchterliches mehr für ihn - was soll er sich also in seinen Gelüsten genieren, weshalb soll er den Reichen im Genuß seiner Güter lassen, statt sich selbst einen Teil davon anzueignen?
  en: He is poor, life offers him no charm, almost every enjoyment is denied him, the penalties of the law have no further terrors for him; why should he restrain his desires, why leave to the rich the enjoyment of his birthright, why not seize a part of it for himself?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: V.28.5
  kind: p
  original: Was für Gründe hat der Proletarier, nicht zu stehlen?
  en: What inducement has the proletarian not to steal!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: V.28.6
  kind: p
  original: Es ist all recht schön und klingt den Bourgeois angenehm genug ins Ohr, wenn man von der "Heiligkeit des Eigentums" spricht - aber für den, der kein Eigentum hat, hört die Heiligkeit des Eigentums von selber auf.
  en: It is all very pretty and very agreeable to the ear of the bourgeois to hear the "sacredness of property" asserted; but for him who has none, the sacredness of property dies out of itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: V.28.7
  kind: p
  original: Das Geld ist der Gott dieser Welt.
  en: Money is the god of this world; the bourgeois takes the proletarian's money from him and so makes a practical atheist of him.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.28.8
  kind: p
  original: Der Bourgeois nimmt dem Proletarier sein Geld und macht ihn dadurch zum praktischen Atheisten.
  en: ''
  joined_to: V.28.7
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '343'
- id: V.28.9
  kind: p
  original: Kein Wunder also, wenn der Proletarier seinen Atheismus bewährt und die Heiligkeit und die Macht des irdischen Gottes nicht mehr respektiert.
  en: No wonder, then, if the proletarian retains his atheism and no longer respects the sacredness and power of the earthly God.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: V.28.10
  kind: p
  original: Und wenn die Armut des Proletariers bis zum wirklichen Mangel der nötigsten Lebensbedürfnisse, bis zum Elend und zur Brotlosigkeit gesteigert wird, so steigt der Reiz zur Nichtachtung aller gesellschaftlichen Ordnung noch mehr.
  en: And when the poverty of the proletarian is intensified to the point of actual lack of the barest necessaries of life, to want and hunger, the temptation to disregard all social order does but gain power.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: V.28.11
  kind: p
  original: Das wissen auch die Bourgeois großenteils selbst.
  en: This the bourgeoisie for the most part recognises.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '343'
- id: V.28.12
  kind: p
  original: Symons bemerkt, daß die Armut dieselbe zerrüttende Wirkung auf den Geist ausübe wie die Trunksucht auf den Körper, und vollends Sheriff Alison erzählt den Besitzenden ganz genau, was die Folgen der sozialen Unterdrückung für die Arbeiter sein müssen.
  en: Symonds observes that poverty exercises the same ruinous influence upon the mind which drunkenness exercises upon the body; and Dr. Alison explains to property-holding readers, with the greatest exactness, what the consequences of social oppression must be for the working-class.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N10
  - V.N11
  mew_page: 343-344
- id: V.28.13
  kind: p
  original: Das Elend läßt dem Arbeiter nur die Wahl, langsam zu verhungern, sich rasch zu töten oder sich zu nehmen, was er nötig hat, wo er es findet, auf deutsch, zu stehlen.
  en: Want leaves the working-man the choice between starving slowly, killing himself speedily, or taking what he needs where he finds it--in plain English, stealing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: V.28.14
  kind: p
  original: Und da werden wir uns nicht wundern dürfen, wenn die meisten den Diebstahl dem Hungertode oder dem Selbstmorde vorziehen.
  en: And there is no cause for surprise that most of them prefer stealing to starvation and suicide.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: V.28.15
  kind: p
  original: Es gibt freilich auch unter den Arbeitern eine Anzahl, die moralisch genug sind, um nicht zu stehlen, selbst wenn sie aufs Äußerste gebracht werden, und diese verhungern oder töten sich.
  en: True, there are, within the working-class, numbers too moral to steal even when reduced to the utmost extremity, and these starve or commit suicide.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: V.28.16
  kind: p
  original: Der Selbstmord, der sonst das beneidenswerte Privilegium der höheren Klassen war, ist in England auch unter den Proletariern Mode geworden, und eine Menge armer Leute töten sich, um dem Elend zu entgehen, aus dem sie sich sonst nicht zu retten wissen.
  en: For suicide, formerly the enviable privilege of the upper classes, has become fashionable among the English workers, and numbers of the poor kill themselves to avoid the misery from which they see no other means of escape.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: V.29.1
  kind: p
  original: Aber noch viel demoralisierender als die Armut wirkt auf die englischen Arbeiter die Unsicherheit der Lebensstellung, die Notwendigkeit, vom Lohn aus der Hand in den Mund zu leben, kurz das, was sie zu Proletariern macht, Unsre kleinen Bauern in Deutschland sind großenteils auch arm und leiden oft Mangel, aber sie sind weniger abhängig vom Zufall, sie haben wenigstens etwas Festes.
  en: But far more demoralising than his poverty in its influence upon the English working-man is the insecurity of his position, the necessity of living upon wages from hand to mouth, that in short which makes a proletarian of him. The smaller peasants in Germany are usually poor, and often suffer want, but they are less at the mercy of accident, they have at least something secure.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.29.2
  kind: p
  original: Aber der Proletarier, der gar nichts hat als seine beiden Hände, der heute verzehrt, was er gestern verdiente, der von allen möglichen Zufällen abhängt, der nicht die geringste Garantie für seine Fähigkeit, sich die nötigsten Lebensbedürfnisse zu erwerben, besitzt - jede Krisis, jede Laune seines Meisters kann ihn brotlos machen -, der Proletarier ist in die empörendste, unmenschlichste Lage versetzt, die ein Mensch sich denken kann.
  en: The proletarian, who has nothing but his two hands, who consumes to-day what he earned yesterday, who is subject to every possible chance, and has not the slightest guarantee for being able to earn the barest necessities of life, whom every crisis, every whim of his employer may deprive of bread, this proletarian is placed in the most revolting, inhuman position conceivable for a human being.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: V.29.3
  kind: p
  original: Dem Sklaven ist wenigstens seine Existenz durch den Eigennutz seines Herrn gesichert, der Leibeigne hat doch ein Stück Land, wovon er lebt, sie haben wenigstens für das nackte Leben eine Garantie - aber der Proletarier ist allein auf sich selbst angewiesen und doch zugleich außerstande gesetzt, seine Kräfte so anzuwenden, daß er auf sie rechnen kann.
  en: The slave is assured of a bare livelihood by the self-interest of his master, the serf has at least a scrap of land on which to live; each has at worst a guarantee for life itself. But the proletarian must depend upon himself alone, and is yet prevented from so applying his abilities as to be able to rely upon them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.29.4
  kind: p
  original: Alles, was der Proletarier zur Verbesserung seiner Lage selbst tun kann, verschwindet wie ein Tropfen am Eimer gegen die Fluten von Wechselfällen, denen er ausgesetzt ist und über die er nicht die geringste Macht hat.
  en: Everything that the proletarian can do to improve his position is but a drop in the ocean compared with the floods of varying chances to which he is exposed, over which he has not the slightest control.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
- id: V.29.5
  kind: p
  original: Er ist das willenlose Objekt aller möglichen Kombinationen von Umständen und kann vom Glück noch sagen, wenn er nur auf kurze Zeit das nackte Leben rettet.
  en: He is the passive subject of all possible combinations of circumstances, and must count himself fortunate when he has saved his life even for a short time; and his character and way of living are naturally shaped by these conditions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '344'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.29.6
  kind: p
  original: Und wie sich das von selbst versteht, richtet sich sein Charakter und seine Lebensweise wieder nach diesen Umständen.
  en: ''
  joined_to: V.29.5
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '344'
- id: V.29.7
  kind: p
  original: Entweder sucht er sich in diesem Strudel oben zu halten, seine Menschheit zu retten, und das kann er wieder nur in der Empörung gegen die Klasse, die ihn so schonungslos ausbeutet und dann seinem Schicksal überläßt, die ihn zu zwingen sucht, in dieser, eines Menschen unwürdigen Lage zu bleiben, gegen die Bourgeoisie - oder er gibt den Kampf gegen seine Lage als fruchtlos auf und sucht, soviel er kann, von den günstigen Momenten zu profitieren.
  en: Either he seeks to keep his head above water in this whirlpool, to rescue his manhood, and this he can do solely in rebellion against the class which plunders him so mercilessly and then abandons him to his fate, which strives to hold him in this position so demoralising to a human being; or he gives up the struggle against his fate as hopeless, and strives to profit, so far as he can, by the most favourable moment.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N12
  mew_page: 344-345
- id: V.29.8
  kind: p
  original: Sparen nützt ihm zu nichts, denn er kann sich höchstens soviel sammeln, als er braucht, um sich ein paar Wochen lang zu ernähren - und wird er einmal brotlos, so bleibt es nicht bei ein paar Wochen.
  en: To save is unavailing, for at the utmost he cannot save more than suffices to sustain life for a short time, while if he falls out of work, it is for no brief period.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: V.29.9
  kind: p
  original: Sich auf die Dauer Eigentum erwerben kann er nicht, und könnte er's, so müßte er dann ja aufhören, Arbeiter zu sein, und ein andrer träte an seine Stelle.
  en: To accumulate lasting property for himself is impossible; and if it were not, he would only cease to be a working-man and another would take his place.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: V.29.10
  kind: p
  original: Was kann er also Besseres tun, wenn er guten Lohn bekommt, als gut davon leben?
  en: What better thing can he do, then, when he gets high wages, than live well upon them?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: V.29.11
  kind: p
  original: Der englische Bourgeois wundert und skandalisiert sich aufs höchste über das flotte Leben der Arbeiter während der Zeit, daß der Lohn hoch ist - und doch ist es nicht nur ganz natürlich, sondern sogar ganz vernünftig von den Leuten, daß sie das Leben genießen, wenn sie können, statt Schätze zu sammeln, die ihnen nichts nützen und die am Ende doch wieder die Motten und der Rost, d.h. die Bourgeois fressen.
  en: The English bourgeoisie is violently scandalised at the extravagant living of the workers when wages are high; yet it is not only very natural but very sensible of them to enjoy life when they can, instead of laying up treasures which are of no lasting use to them, and which in the end moth and rust (i.e., the bourgeoisie) get possession of.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: V.29.12
  kind: p
  original: Aber solch ein Leben ist demoralisierend wie kein andres.
  en: Yet such a life is demoralising beyond all others.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: V.29.13
  kind: p
  original: 'Was Carlyle von Baumwollspinnern sagt, gilt von allen englischen Industriearbeitern:'
  en: 'What Carlyle says of the cotton spinners is true of all English industrial workers:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: V.30.1
  kind: p
  original: '"Bei ihnen ist das Geschäft heute blühend, morgen welk - ein fortwährendes Hasardspiel, und so leben sie auch wie Spieler, heute im Luxus, morgen im Hunger.'
  en: '"Their trade, now in plethoric prosperity, anon extenuated into inanition and ''short time,'' is of the nature of gambling; they live by it like gamblers, now in luxurious superfluity, now in starvation.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: V.30.2
  kind: p
  original: Schwarze meuterische Unzufriedenheit verzehrt sie, das elendeste Gefühl, das in des Menschen Brust wohnen kann.
  en: Black, mutinous discontent devours them; simply the miserablest feeling that can inhabit the heart of man.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: V.30.3
  kind: p
  original: Der englische Handel mit seinen weltweiten Konvulsionen und Schwankungen, mit seinem unermeßlichen Dampfproteus hat alle Pfade für sie unsicher gemacht wie ein Zauberbann; Nüchternheit, Festigkeit, ruhige Dauer, die ersten Segnungen des Menschen sind ihnen fremd...
  en: English commerce, with its world-wide, convulsive fluctuations, with its immeasurable Proteus Steam demon, makes all paths uncertain for them, all life a bewilderment; society, steadfastness, peaceable continuance, the first blessings of man are not theirs.--This world is for them no home, but a dingy prison-house, of reckless unthrift, rebellion, rancour, indignation against themselves and against all men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.30.4
  kind: p
  original: Diese Welt ist für sie kein heimatlich Haus, sondern ein dumpfiges Gefängnis voll toller, fruchtloser Plage, Rebellion, Groll, Ingrimm gegen sich selbst und alle Menschen.
  en: ''
  joined_to: V.30.3
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '345'
- id: V.30.5
  kind: p
  original: Ist es eine grüne, blumige Weit, gemacht und regiert von einem Gott - oder ist es ein düster-brodelndes Tophet von Vitriolrauch, Baumwollstaub, Schnapslärm, Wut und Arbeitsqual, gemacht und regiert von einem Teufel?"
  en: Is it a green, flowery world, with azure everlasting sky stretched over it, the work and government of a God; or a murky, simmering Tophet, of copperas fumes, cotton fuz, gin riot, wrath and toil, created by a Demon, governed by a Demon?"
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N13
  mew_page: '345'
- id: V.31.1
  kind: p
  original: 'Und weiter p.40:'
  en: 'And elsewhere:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
  en_note: 'English note {117b}: Ibid., p. 40.'
- id: V.32.1
  kind: p
  original: '"Wenn Ungerechtigkeit, Untreue gegen Wahrheit, Tatsache und Ordnung der Natur das einzige Übel unter der Sonne ist und das Bewußtsein, Unrecht, Ungerechtigkeit zu ertragen, das einzige unerträglich schmerzliche Gefühl, so wäre unsre große Frage wegen der Lage der Arbeiter diese: Ist dies gerecht?'
  en: '"Injustice, infidelity to truth and fact and Nature''s order, being properly the one evil under the sun, and the feeling of injustice the one intolerable pain under the sun, our grand question as to the condition of these working-men would be: Is it just?'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: V.32.2
  kind: p
  original: 'Und vor allem: Was halten sie selbst von der Gerechtigkeit der Sache?'
  en: And, first of all, what belief have they themselves formed about the justice of it?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: V.32.3
  kind: p
  original: '- Ihre Worte sind Antwort genug, ihre Taten noch mehr...'
  en: The words they promulgate are notable by way of answer; their actions are still more notable.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '345'
- id: V.32.4
  kind: p
  original: Empörung, plötzlicher rachelustiger Trieb zur Empörung gegen die höheren Klassen, abnehmende Achtung gegen die Befehle ihrer weltlichen Obern, abnehmender Glaube gegen die Lehren ihrer geistlichen Obern wird mehr und mehr die allgemeine Stimmung der niederen Klassen.
  en: Revolt, sullen, revengeful humour of revolt against the upper classes, decreasing respect for what their temporal superiors command, decreasing faith for what their spiritual superiors teach, is more and more the universal spirit of the lower classes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 345-346
- id: V.32.5
  kind: p
  original: Diese Stimmung mag getadelt, mag bestraft werden, aber alle müssen sie als dort wirklich existierend anerkennen, müssen wissen, daß es traurig ist und, wo nicht geändert, unheilbringend sein wird."
  en: Such spirit may be blamed, may be vindicated, but all men must recognise it as extant there, all may know that it is mournful, that unless altered it will be fatal."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: V.33.1
  kind: p
  original: Carlyle hat in den Tatsachen ganz recht und nur darin unrecht, daß er die wilde Leidenschaft der Arbeiter gegen die höheren Klassen tadelt.
  en: Carlyle is perfectly right as to the facts and wrong only in censuring the wild rage of the workers against the higher classes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: V.33.2
  kind: p
  original: Diese Leidenschaft, dieser Zorn ist vielmehr der Beweis, daß die Arbeiter das Unmenschliche ihrer Lage fühlen, daß sie sich nicht zum Tier herabdrängen lassen wollen und daß sie dereinst sich aus der Knechtschaft der Bourgeoisie befreien werden.
  en: This rage, this passion, is rather the proof that the workers feel the inhumanity of their position, that they refuse to be degraded to the level of brutes, and that they will one day free themselves from servitude to the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: V.33.3
  kind: p
  original: Wir sehen es ja an denen, die diesen Zorn nicht teilen - entweder unterwerfen sie sich in Demut dem Geschick, das sie trifft, leben als ehrliche Privatleute, so gut es geht, kümmern sich nicht um den Gang der Welt, helfen der Bourgeoisie die Ketten der Arbeiter fester zu schmieden und stehen auf dem geistig-toten Standpunkte der vorindustriellen Periode - oder sie lassen sich vom Schicksal werfen und spielen mit ihm, verlieren auch innerlich den festen Halt, den sie schon äußerlich verloren haben, leben in den Tag hinein, trinken Schnaps und laufen den Mädeln nach - in beiden Fällen sind sie Tiere.
  en: This may be seen in the case of those who do not share this wrath; they either bow humbly before the fate that overtakes them, live a respectful private life as well as they can, do not concern themselves as to the course of public affairs, help the bourgeoisie to forge the chains of the workers yet more securely, and stand upon the plane of intellectual nullity that prevailed before the industrial period began; or they are tossed about by fate, lose their moral hold upon themselves as they have already lost their economic hold, live along from day to day, drink and fall into licentiousness; and in both cases they are brutes.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T6
    editions: '1892'
    reading: '... fester schmieden'
    base_text: … Arbeiter fester zu schmieden ‸ und stehen auf dem …
  mew_page: '346'
- id: V.33.4
  kind: p
  original: Diese letzteren tragen denn auch hauptsächlich zu der "schnellen Vermehrung des Lasters" bei, über die die sentimentale Bourgeoisie so entsetzt ist, nachdem sie selbst die Ursachen derselben in Bewegung gesetzt hat.
  en: The last-named class contributes chiefly to the "rapid increase of vice," at which the bourgeoisie is so horrified after itself setting in motion the causes which give rise to it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: V.34.1
  kind: p
  original: Eine andre Quelle der Demoralisation unter den Arbeitern ist die Verdammung zur Arbeit.
  en: Another source of demoralisation among the workers is their being condemned to work.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: V.34.2
  kind: p
  original: Wenn die freiwillige produktive Tätigkeit der höchste Genuß ist, den wir kennen, so ist die Zwangsarbeit die härteste, entwürdigendste Qual.
  en: As voluntary, productive activity is the highest enjoyment known to us, so is compulsory toil the most cruel, degrading punishment.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: V.34.3
  kind: p
  original: Nichts ist fürchterlicher, als alle Tage von morgens bis abends etwas tun zu müssen, was einem widerstrebt.
  en: Nothing is more terrible than being constrained to do some one thing every day from morning until night against one's will.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: V.34.4
  kind: p
  original: Und je menschlicher der Arbeiter fühlt, desto mehr muß ihm seine Arbeit verhaßt sein, weil er den Zwang, die Zwecklosigkeit für ihn selbst fühlt, die in ihr liegen.
  en: And the more a man the worker feels himself, the more hateful must his work be to him, because he feels the constraint, the aimlessness of it for himself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: V.34.5
  kind: p
  original: Weshalb arbeitet er denn?
  en: Why does he work?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: V.34.6
  kind: p
  original: Aus Lust am Schaffen?
  en: For love of work?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: V.34.7
  kind: p
  original: Aus Naturtrieb?
  en: From a natural impulse?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: V.34.8
  kind: p
  original: Keineswegs.
  en: Not at all!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: V.34.9
  kind: p
  original: Er arbeitet um des Geldes, um einer Sache willen, die mit der Arbeit selbst gar nichts zu schaffen hat, er arbeitet, weil er muß, und arbeitet noch dazu so lange und so ununterbrochen einförmig, daß schon aus diesem Grunde allein ihm die Arbeit in den ersten Wochen zur Qual werden muß, wenn er noch irgend menschlich fühlt.
  en: He works for money, for a thing which has nothing whatsoever to do with the work itself; and he works so long, moreover, and in such unbroken monotony, that this alone must make his work a torture in the first weeks if he has the least human feeling left.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: V.34.10
  kind: p
  original: Die Teilung der Arbeit hat die vertierenden Wirkungen der Zwangsarbeit überhaupt noch vervielfacht.
  en: The division of labour has multiplied the brutalising influences of forced work.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '346'
- id: V.34.11
  kind: p
  original: In den meisten Arbeitszweigen ist die Tätigkeit des Arbeiters auf eine kleinliche, rein mechanische Manipulation beschränkt, die sich Minute für Minute wiederholt und jahraus, jahrein dieselbe bleibt.
  en: In most branches the worker's activity is reduced to some paltry, purely mechanical manipulation, repeated minute after minute, unchanged year after year.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N14
  mew_page: 346-347
- id: V.34.12
  kind: p
  original: Wer von Kindesbeinen an jeden Tag zwölf Stunden und drüber Nadelknöpfe gemacht oder Kammräder abgefeilt und außerdem in den Verhältnissen eines englischen Proletariers gelebt hat, wieviel menschliche Gefühle und Fähigkeiten mag der in sein dreißigstes Jahr hinüberretten?
  en: How much human feeling, what abilities can a man retain in his thirtieth year, who has made needle points or filed toothed wheels twelve hours every day from his early childhood, living all the time under the conditions forced upon the English proletarian?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: V.34.13
  kind: p
  original: Dasselbe ist's mit der Einführung der Dampfkraft und der Maschinen.
  en: It is still the same thing since the introduction of steam.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: V.34.14
  kind: p
  original: Die Tätigkeit des Arbeiters wird leicht, die Anstrengung der Muskel wird gespart und die Arbeit selbst unbedeutend, aber eintönig im höchsten Grade.
  en: The worker's activity is made easy, muscular effort is saved, but the work itself becomes unmeaning and monotonous to the last degree.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: V.34.15
  kind: p
  original: Sie gewährt ihm kein Feld für geistige Tätigkeit und nimmt doch seine Aufmerksamkeit gerade so viel in Anspruch, daß er, um sie gut zu besorgen, an nichts andres denken darf.
  en: It offers no field for mental activity, and claims just enough of his attention to keep him from thinking of anything else.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: V.34.16
  kind: p
  original: Und eine Verurteilung zu einer solchen Arbeit - einer Arbeit, die alle disponible Zeit des Arbeiters in Anspruch nimmt, ihm kaum Zeit zum Essen und Schlafen, nicht einmal zu körperlicher Bewegung in freier Luft, zum Genuß der Natur, geschweige zu geistiger Tätigkeit läßt -, eine solche Verurteilung soll den Menschen nicht zum Tier herabwürdigen!
  en: And a sentence to such work, to work which takes his whole time for itself, leaving him scarcely time to eat and sleep, none for physical exercise in the open air, or the enjoyment of Nature, much less for mental activity, how can such a sentence help degrading a human being to the level of a brute?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: V.34.17
  kind: p
  original: Der Arbeiter hat wieder nur die Alternative, sich in sein Schicksal zu ergeben, ein "guter Arbeiter" zu werden, das Interesse des Bourgeois "treulich" wahrzunehmen - und dann vertiert er ganz gewiß - oder sich zu sträuben, für seine Menschheit zu kämpfen, solange es geht, und das kann er nur im Kampf gegen die Bourgeoisie.
  en: Once more the worker must choose, must either surrender himself to his fate, become a "good" workman, heed "faithfully" the interest of the bourgeoisie, in which case he most certainly becomes a brute, or else he must rebel, fight for his manhood to the last, and this he can only do in the fight against the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: V.35.1
  kind: p
  original: Und wenn alle diese Ursachen eine Masse von Demoralisation unter der arbeitenden Klasse erzeugt haben, dann tritt eine neue Ursache hinzu, um diese Demoralisation weiter zu verbreiten und auf den höchsten Gipfel zu treiben - die Zentralisation der Bevölkerung.
  en: And when all these conditions have engendered vast demoralisation among the workers, a new influence is added to the old, to spread this degradation more widely and carry it to the extremest point. This influence is the centralisation of the population.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.35.2
  kind: p
  original: Die englischen Schriftsteller der Bourgeoisie schreien Zeter über die entsittlichenden Wirkungen der großen Städte - diese umgekehrten Jeremiasse weinen Klagelieder nicht über die Zerstörung, sondern über den Flor derselben.
  en: The writers of the English bourgeoisie are crying murder at the demoralising tendency of the great cities, like perverted Jeremiahs, they sing dirges, not over the destruction, but the growth of the cities.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: V.35.3
  kind: p
  original: Sheriff Alison schiebt fast alles und Dr. Vaughan, Verfasser eines Buches "The Age of Great Cities", noch viel mehr auf diese Ursache.
  en: Sheriff Alison attributes almost everything, and Dr. Vaughan, author of "The Age of Great Cities," still more to this influence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
- id: V.35.4
  kind: p
  original: Natürlich.
  en: And this is natural, for the propertied class has too direct an interest in the other conditions which tend to destroy the worker body and soul.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '347'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.35.5
  kind: p
  original: Bei den übrigen Ursachen, die auf Körper und Geist der Arbeiter zerstörend wirken, kommt das Interesse der besitzenden Klasse zu direkt ins Spiel.
  en: ''
  joined_to: V.35.4
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '347'
- id: V.35.6
  kind: p
  original: 'Sagten sie: die Armut, die Unsicherheit der Stellung, die Überarbeitung und Zwangsarbeit sei die Hauptursache - so würde jeder, so würden sie sich selbst antworten müssen: Also geben wir den Armen Eigentum, garantieren wir ihnen ihre Existenz, erlassen wir Gesetze gegen Überarbeitung - und das darf die Bourgeoisie nicht zugeben.'
  en: If they should admit that "poverty, insecurity, overwork, forced work, are the chief ruinous influences," they would have to draw the conclusion, "then let us give the poor property, guarantee their subsistence, make laws against overwork," and this the bourgeoisie dare not formulate.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 347-348
- id: V.35.7
  kind: p
  original: Aber die großen Städte sind so ganz von selbst herangewachsen, die Leute sind ganz freiwillig hineingezogen, und der Schluß, daß einzig die Industrie und die von ihr profitierende Mittelklasse diese großen Städte geschaffen habe, liegt so fern, daß es der herrschenden Klasse gar zu leicht einfallen muß, alles Unheil auf diese anscheinend unvermeidliche Ursache zu wälzen - wo doch die großen Städte nur dem wenigstens im Keime schon existierenden Unheil eine schnellere und reifere Entwicklung geben können.
  en: But the great cities have grown up so spontaneously, the population has moved into them so wholly of its own motion, and the inference that manufacture and the middle-class which profits from it alone have created the cities is so remote, that it is extremely convenient for the ruling class to ascribe all the evil to this apparently unavoidable source; whereas the great cities really only secure a more rapid and certain development for evils already existing in the germ.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: V.35.8
  kind: p
  original: Allison ist wenigstens noch so human, daß er dies anerkennt - er ist kein vollständig ausgebildeter, industrieller und liberaler, sondern nur ein halbentwickelter, torystischer Bourgeois und hat deshalb hie und da offne Augen, wo die wahren Bourgeois stockblind sind.
  en: Alison is humane enough to admit this; he is no thoroughbred Liberal manufacturer, but only a half developed Tory bourgeois, and he has, therefore, an open eye, now and then, where the full-fledged bourgeois is still stone blind.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: V.35.9
  kind: p
  original: 'Ihn wollen wir hier reden lassen:'
  en: 'Let us hear him:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: V.36.1
  kind: p
  original: '"Es ist in den großen Städten, daß das Laster seine Versuchungen, die Wollust ihre Netze ausbreiten, daß die Schuld durch die Hoffnung der Straflosigkeit und die Trägheit durch häufiges Beispiel angespornt wird.'
  en: '"It is in the great cities that vice has spread her temptations, and pleasure her seductions, and folly her allurements; that guilt is encouraged by the hope of impunity, and idleness fostered by the frequency of example.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: V.36.2
  kind: p
  original: Hieher zu diesen großen Stapelplätzen menschlicher Verdorbenheit fliehen die Schlechten und Liederlichen von der Einfachheit des Landlebens, hier finden sie Opfer für ihre Schlechtigkeit und Gewinn als Lohn für die Gefahren, in die sie sich begeben.
  en: It is to these great marts of human corruption that the base and the profligate resort from the simplicity of country life; it is here that they find victims whereon to practise their iniquity, and gains to reward the dangers that attend them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: V.36.3
  kind: p
  original: Die Tugend wird in Dunkelheit gehüllt und unterdrückt, die Schuld reift in der Schwierigkeit der Entdeckung, Ausschweifungen werden durch unverzüglichen Genuß belohnt.
  en: Virtue is here depressed from the obscurity in which it is involved. Guilt is matured from the difficulty of its detection; licentiousness is rewarded by the immediate enjoyment which it promises.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.36.4
  kind: p
  original: Wer bei Nacht durch St. Giles, durch die engen gedrängten Gäßchen von Dublin, die ärmeren Viertel von Glasgow geht, wird dies bestätigt finden, wird sich nicht wundern, daß soviel, sondern daß sowenig Verbrechen in der Welt ist...
  en: If any person will walk through St. Giles's, the crowded alleys of Dublin, or the poorer quarters of Glasgow by night, he will meet with ample proof of these observations; he will no longer wonder at the disorderly habits and profligate enjoyments of the lower orders; his astonishment will be, not that there is so much, but that there is so little crime in the world.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: V.36.5
  kind: p
  original: Die große Ursache der Verderbtheit der großen Städte ist die ansteckende Natur des bösen Beispiels und die Schwierigkeit, der Verführung des Lasters aus dem Wege zu gehen, wenn sie in nahe und tägliche Berührung mit der heranwachsenden Generation gebracht werden.
  en: The great cause of human corruption in these crowded situations is the contagious nature of bad example and the extreme difficulty of avoiding the seductions of vice when they are brought into close and daily proximity with the younger part of the people.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: V.36.6
  kind: p
  original: Die Reichen sind eo ipso [selbstverständlich] nicht besser, auch sie können in derselben Lage der Versuchung nicht widerstehen; das besondre Unglück der Armen ist, daß sie überall den verlockenden Gestalten des Lasters und den Verführungen verbotner Genüsse begegnen müssen...
  en: Whatever we may think of the strength of virtue, experience proves that the higher orders are indebted for their exemption from atrocious crime or disorderly habits chiefly to their fortunate removal from the scene of temptation; and that where they are exposed to the seductions which assail their inferiors, they are noways behind them in yielding to their influence. It is the peculiar misfortune of the poor in great cities that they cannot fly from these irresistible temptations, but that, turn where they will, they are met by the alluring forms of vice, or the seductions of guilty enjoyment.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s); regrouped by the ingest (see REALIGN)
- id: V.36.7
  kind: p
  original: Die erwiesene Unmöglichkeit, die Reize des Lasters vor dem jüngern Teile der Armen in großen Städten zu verbergen, ist die Ursache der Demoralisation."
  en: It is the experienced impossibility of concealing the attractions of vice from the younger part of the poor in great cities which exposes them to so many causes of demoralisation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: V.37.1
  kind: p
  original: 'Nach einer längeren Sittenschilderung fährt unser Autor fort:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
  en_note: Wischnewetzky's English goes straight on with Alison and has nothing for this sentence.
- id: V.38.1
  kind: p
  original: '"Alles das kommt nicht von außerordentlicher Depravation des Charakters, sondern von der fast unwiderstehlichen Natur der Versuchungen, denen die Armen ausgesetzt sind.'
  en: All this proceeds not from any unwonted or extraordinary depravity in the character of these victims of licentiousness, but from the almost irresistible nature of the temptations to which the poor are exposed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: V.38.2
  kind: p
  original: Die Reichen, die das Betragen der Armen tadeln, würden dem Einfluß ähnlicher Ursachen wohl ebenso rasch nachgeben.
  en: The rich, who censure their conduct, would in all probability yield as rapidly as they have done to the influence of similar causes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: V.38.3
  kind: p
  original: Es gibt einen Grad des Elends, ein Sich-Aufdrängen der Sünde, denen entgegenzutreten die Tugend selten fähig ist und der besonders die Jugend gewöhnlich nicht widerstehen kann.
  en: There is a certain degree of misery, a certain proximity to sin, which virtue is rarely able to withstand, and which the young, in particular, are generally unable to resist.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: V.38.4
  kind: p
  original: Der Fortschritt des Lasters in solchen Umständen ist fast so gewiß und oft ebenso rasch wie der der physischen Ansteckung."
  en: The progress of vice in such circumstances is almost as certain and often nearly as rapid as that of physical contagion."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '348'
- id: V.39.1
  kind: p
  original: 'Und an einer späteren Stelle:'
  en: 'And elsewhere:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: V.40.1
  kind: p
  original: '"Wenn die höheren Klassen die Arbeiter für ihren Vorteil in großen Massen auf einen engen Raum zusammengezogen haben, wird die Ansteckung des Verbrechens reißend schnell und unvermeidlich.'
  en: '"When the higher orders for their own profit have drawn the labouring-classes in great numbers into a small space, the contagion of guilt becomes rapid and unavoidable.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: V.40.2
  kind: p
  original: Die niederen Klassen, wie sie jetzt in Beziehung auf religiösen und moralischen Unterricht gestellt sind, sind häufig kaum mehr dafür zu tadeln, daß sie den auf sie eindringenden Versuchungen nachgeben, als dafür, daß sie dem Typhus zum Opfer fallen."
  en: The lower orders, situated as they are in so far as regards moral or religious instruction, are frequently hardly more to be blamed for yielding to the temptations which surround them than for falling victims to the typhus fever."
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N15
  mew_page: '349'
- id: V.41.1
  kind: p
  original: Genug!
  en: Enough!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: V.41.2
  kind: p
  original: Der Halbbourgeois Alison verrät uns, wenn auch in bornierter Ausdrucksweise, die schlimmen Folgen der großen Städte für die sittliche Entwicklung der Arbeiter.
  en: The half-bourgeois Alison betrays to us, however narrow his manner of expressing himself, the evil effect of the great cities upon the moral development of the workers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: V.41.3
  kind: p
  original: Ein anderer, ganzer Bourgeois, ein Mann nach dem Herzen der Antikorngesetzligue, der Doktor Andrew Ure, verrät uns die andre Seite.
  en: Another, a bourgeois pur sang, a man after the heart of the Anti-Corn Law League, Dr. Andrew Ure, betrays the other side.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N16
  mew_page: '349'
- id: V.41.4
  kind: p
  original: Er erzählt uns, daß das Leben in großen Städten Kabalen unter den Arbeitern erleichtere und dem Plebs Macht gebe.
  en: He tells us that life in great cities facilitates cabals among the workers and confers power on the Plebs.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: V.41.5
  kind: p
  original: Wenn hier die Arbeiter nicht erzogen (d.h. zum Gehorsam gegen die Bourgeoisie erzogen) seien, so würden sie die Dinge einseitig, vom Standpunkt einer sinistren Selbstsucht ansehen und sich leicht von schlauen Demagogen verführen lassen - ja, sie seien kapabel, ihren besten Wohltäter, den frugalen und unternehmenden Kapitalisten, mit einem eifersüchtigen und feindseligen Auge anzusehen.
  en: If here the workers are not educated (i.e., to obedience to the bourgeoisie), they may view matters one-sidedly, from the standpoint of a sinister selfishness, and may readily permit themselves to be hoodwinked by sly demagogues; nay, they might even be capable of viewing their greatest benefactors, the frugal and enterprising capitalists, with a jealous and hostile eye.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: V.41.6
  kind: p
  original: Hier könne nur gute Erziehung helfen, sonst müsse Nationalbankerott und andre Schrecken folgen, da eine Revolution der Arbeiter sonst nicht ausbleiben könne.
  en: Here proper training alone can avail, or national bankruptcy and other horrors must follow, since a revolution of the workers could hardly fail to occur.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: V.41.7
  kind: p
  original: Und unser Bourgeois hat ganz recht mit seinen Befürchtungen.
  en: And our bourgeois is perfectly justified in his fears.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: V.41.8
  kind: p
  original: Wenn die Zentralisation der Bevölkerung schon auf die besitzenden Klassen anregend und entwickelnd wirkt, so treibt sie die Entwicklung der Arbeiter noch weit rascher vorwärts.
  en: If the centralisation of population stimulates and develops the property-holding class, it forces the development of the workers yet more rapidly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: V.41.9
  kind: p
  original: Die Arbeiter fangen an, sich als Klasse in ihrer Gesamtheit zu fühlen, sie werden gewahr, daß sie, obwohl einzeln schwach, doch zusammen eine Macht sind; die Trennung von der Bourgeoisie, die Ausbildung den Arbeitern und ihrer Lebensstellung eigentümlicher Anschauungen und Ideen wird befördert, das Bewußtsein, unterdrückt zu werden, stellt sich ein, und die Arbeiter bekommen soziale und politische Bedeutung.
  en: The workers begin to feel as a class, as a whole; they begin to perceive that, though feeble as individuals, they form a power united; their separation from the bourgeoisie, the development of views peculiar to the workers and corresponding to their position in life, is fostered, the consciousness of oppression awakens, and the workers attain social and political importance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: V.41.10
  kind: p
  original: Die großen Städte sind der Herd der Arbeiterbewegung, in ihnen haben die Arbeiter zuerst angefangen, über ihre Lage nachzudenken und gegen sie anzukämpfen, in ihnen kam der Gegensatz zwischen Proletariat und Bourgeoisie zuerst zur Erscheinung, von ihnen sind Arbeiterverbindungen, Chartismus und Sozialismus ausgegangen.
  en: The great cities are the birthplaces of labour movements; in them the workers first began to reflect upon their own condition, and to struggle against it; in them the opposition between proletariat and bourgeoisie first made itself manifest; from them proceeded the Trades-Unions, Chartism, and Socialism.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '349'
- id: V.41.11
  kind: p
  original: Die großen Städte haben die Krankheit des sozialen Körpers, die auf dem Lande in chronischer Form auftritt, in eine akute verwandelt, und dadurch das eigentliche Wesen derselben und zugleich die rechte Art, sie zu heilen, an den Tag gebracht.
  en: The great cities have transformed the disease of the social body, which appears in chronic form in the country, into an acute one, and so made manifest its real nature and the means of curing it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 349-350
- id: V.41.12
  kind: p
  original: Ohne die großen Städte und ihren treibenden Einfluß auf die Entwicklung der öffentlichen Intelligenz wären die Arbeiter lange nicht so weit, als sie jetzt sind.
  en: Without the great cities and their forcing influence upon the popular intelligence, the working-class would be far less advanced than it is.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: V.41.13
  kind: p
  original: Dazu haben sie die letzte Spur des patriarchalischen Verhältnisses zwischen den Arbeitern und den Brotherren zerstört, wozu auch die große Industrie durch Vervielfachung der von einem einzigen Bourgeois abhängigen Arbeiter beitrug.
  en: Moreover, they have destroyed the last remnant of the patriarchal relation between working-men and employers, a result to which manufacture on a large scale has contributed by multiplying the employes dependent upon a single employer.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: V.41.14
  kind: p
  original: Die Bourgeoisie jammert freilich darüber, und sie hat recht - denn unter diesem Verhältnis war der Bourgeois ziemlich sicher vor einer Auflehnung der Arbeiter.
  en: The bourgeoisie deplores all this, it is true, and has good reason to do so; for, under the old conditions, the bourgeois was comparatively secure against a revolt on the part of his hands.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: V.41.15
  kind: p
  original: Er konnte sie nach Herzenslust ausbeuten und dominieren und erhielt noch Gehorsam, Dank und Zuneigung in den Kauf von dem dummen Volke, wenn er ihm außer dem Lohn etwas Freundlichkeit, die ihm nichts kostete, und vielleicht einige kleine Vorteile zukommen ließ - alles zusammen anscheinend aus purer überflüssiger, aufopfernder Herzensgüte, und doch noch lange nicht den zehnten Teil seiner Schuldigkeit.
  en: He could tyrannise over them and plunder them to his heart's content, and yet receive obedience, gratitude, and assent from these stupid people by bestowing a trifle of patronising friendliness which cost him nothing, and perhaps some paltry present, all apparently out of pure, self-sacrificing, uncalled-for goodness of heart, but really not one-tenth part of his duty.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: V.41.16
  kind: p
  original: Als einzelner Bourgeois, der in Verhältnisse gestellt war, die er selbst nicht geschaffen hatte, tat er allerdings seine Schuldigkeit wenigstens teilweise, aber als Mitglied der regierenden Klasse, die schon dadurch, daß sie regiert, für die Lage der ganzen Nation verantwortlich ist und die Wahrung des allgemeinen Interesses übernimmt, tat er gar nichts von dem, was er mit seiner Stellung übernahm, sondern beutete noch obendrein die ganze Nation zu seinem eignen Privatvorteil aus.
  en: As an individual bourgeois, placed under conditions which he had not himself created, he might do his duty at least in part; but, as a member of the ruling class, which, by the mere fact of its ruling, is responsible for the condition of the whole nation, he did nothing of what his position involved. On the contrary, he plundered the whole nation for his own individual advantage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.41.17
  kind: p
  original: In dem patriarchalischen Verhältnis, das die Sklaverei der Arbeiter heuchlerisch verdeckte, mußte der Arbeiter geistig tot, über seine eignen Interessen total unwissend, ein bloßer Privatmensch bleiben.
  en: In the patriarchal relation that hypocritically concealed the slavery of the worker, the latter must have remained an intellectual zero, totally ignorant of his own interest, a mere private individual.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: V.41.18
  kind: p
  original: Erst als er seinem Brotherrn entfremdet, als es offenbar wurde, daß er mit diesem nur durch das Privatinteresse, nur durch den Geldgewinn zusammenhänge, als die scheinbare Zuneigung, die nicht die geringste Probe aushielt, gänzlich wegfiel, erst da fing der Arbeiter an, seine Stellung und seine Interessen zu erkennen und sich selbständig zu entwickeln; erst da hörte er auf, auch in seinen Gedanken, Gefühlen und Willensäußerungen der Sklave der Bourgeoisie zu sein.
  en: Only when estranged from his employer, when convinced that the sole bond between employer and employe is the bond of pecuniary profit, when the sentimental bond between them, which stood not the slightest test, had wholly fallen away, then only did the worker begin to recognise his own interests and develop independently; then only did he cease to be the slave of the bourgeoisie in his thoughts, feelings, and the expression of his will.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: V.41.19
  kind: p
  original: Und dazu hat hauptsächlich die Industrie im großen Maßstabe und die großen Städte gewirkt.
  en: And to this end manufacture on a grand scale and in great cities has most largely contributed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: V.42.1
  kind: p
  original: Ein anderes Moment, das von bedeutendem Einfluß auf den Charakter der englischen Arbeiter war, bildet die irische Einwanderung, von der auch schon in diesem Sinn die Rede war.
  en: Another influence of great moment in forming the character of the English workers is the Irish immigration already referred to.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '350'
- id: V.42.2
  kind: p
  original: Sie hat allerdings, wie wir sehen, einerseits die englischen Arbeiter degradiert, sie der Zivilisation entrissen und ihre Lage verschlimmert - aber auch andrerseits dadurch zur Austiefung der Kluft zwischen Arbeitern und Bourgeoisie und so zur Beschleunigung der herannahenden Krisis beigetragen.
  en: On the one hand it has, as we have seen, degraded the English workers, removed them from civilisation, and aggravated the hardship of their lot; but, on the other hand, it has thereby deepened the chasm between workers and bourgeoisie, and hastened the approaching crisis.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T7
    editions: '1892'
    reading: sahen
    base_text: … allerdings, wie wir sehen ‸ , einerseits die englischen …
  mew_page: 350-351
- id: V.42.3
  kind: p
  original: Denn der Verlauf der sozialen Krankheit, an der England leidet, ist derselbe wie der einer physischen Krankheit; sie entwickelt sich nach gewissen Gesetzen und hat ihre Krisen, deren letzte und heftigste über das Schicksal des Kranken entscheidet.
  en: For the course of the social disease from which England is suffering is the same as the course of a physical disease; it develops, according to certain laws, has its own crisis, the last and most violent of which determines the fate of the patient.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: V.42.4
  kind: p
  original: Und da die englische Nation bei dieser letzten Krisis doch nicht untergehen kann, sondern erneut und wiedergeboren aus ihr hervorgehen muß, so kann man sich nur über alles freuen, was die Krankheit auf die Spitze treibt.
  en: And as the English nation cannot succumb under the final crises, but must go forth from it, born again, rejuvenated, we can but rejoice over everything which accelerates the course of the disease.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: V.42.5
  kind: p
  original: Und dazu trägt die irische Einwanderung außerdem noch bei durch das leidenschaftliche, lebendige irische Wesen, welches sie in England einbürgert und in die englische Arbeiterklasse bringt.
  en: And to this the Irish immigration further contributes by reason of the passionate, mercurial Irish temperament, which it imports into England and into the English working-class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: V.42.6
  kind: p
  original: Irländer und Engländer verhalten sich in vielen Beziehungen wie Franzosen und Deutsche, und die Mischung des leichteren, erregbaren, heißen irischen Temperaments mit dem ruhigen, ausdauernden, verständigen englischen kann auf die Dauer nur für beide Teile günstig sein.
  en: The Irish and English are to each other much as the French and the Germans; and the mixing of the more facile, excitable, fiery Irish temperament with the stable, reasoning, persevering English must, in the long run, be productive only of good for both.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: V.42.7
  kind: p
  original: Der schroffe Egoismus der englischen Bourgeoisie würde weit mehr in der Arbeiterklasse sitzen geblieben sein, wenn nicht das bis zur Wegwerfung großmütige, vorwiegend vom Gefühl beherrschte irische Wesen hinzugekommen und einerseits durch Stammverschmelzung, andrerseits durch den gewöhnlichen Verkehr den rein verständigen, kalten englischen Charakter gemildert hätte.
  en: The rough egotism of the English bourgeoisie would have kept its hold upon the working-class much more firmly if the Irish nature, generous to a fault, and ruled primarily by sentiment, had not intervened, and softened the cold, rational English character in part by a mixture of the races, and in part by the ordinary contact of life.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: V.43.1
  kind: p
  original: Wir werden uns nach alledem nicht mehr darüber wundern, daß die arbeitende Klasse allmählich ein ganz andres Volk geworden ist als die englische Bourgeoisie.
  en: In view of all this, it is not surprising that the working-class has gradually become a race wholly apart from the English bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: V.43.2
  kind: p
  original: Die Bourgeoisie hat mit allen andern Nationen der Erde mehr Verwandtes als mit den Arbeitern, die dicht neben ihr wohnen.
  en: The bourgeoisie has more in common with every other nation of the earth than with the workers in whose midst it lives.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: V.43.3
  kind: p
  original: Die Arbeiter sprechen andre Dialekte, haben andre Ideen und Vorstellungen, andre Sitten und Sittenprinzipien, andre Religion und Politik als die Bourgeoisie.
  en: The workers speak other dialects, have other thoughts and ideals, other customs and moral principles, a different religion and other politics than those of the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: V.43.4
  kind: p
  original: Es sind zwei ganz verschiedene Völker, so verschieden, wie sie der Unterschied der Rasse nur machen kann, und von denen wir bisher auf dem Kontinent nur das eine, die Bourgeoisie, gekannt haben.
  en: Thus they are two radically dissimilar nations, as unlike as difference of race could make them, of whom we on the Continent have known but one, the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '351'
- id: V.43.5
  kind: p
  original: Und doch ist gerade das andre, aus den Proletariern bestehende Volk das für die Zukunft Englands bei weitem wichtigste.
  en: Yet it is precisely the other, the people, the proletariat, which is by far the more important for the future of England.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N17
  mew_page: '351'
- id: V.44.1
  kind: p
  original: Von dem öffentlichen Charakter der englischen Arbeiter, wie er sich in Assoziationen und politischen Prinzipien ausspricht, werden wir noch weiter zu sprechen haben - hier wollen wir nur die Resultate der eben zusammengestellten Ursachen erwähnen, insofern diese auf den Privatcharakter der Arbeiter wirken.
  en: Of the public character of the English working-man, as it finds expression in associations and political principles, we shall have occasion to speak later; let us here consider the results of the influences cited above, as they affect the private character of the worker.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 351-352
- id: V.44.2
  kind: p
  original: Der Arbeiter ist bei weitem humaner im gewöhnlichen Leben als der Bourgeois.
  en: The workman is far more humane in ordinary life than the bourgeois.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: V.44.3
  kind: p
  original: Ich erwähnte schon oben, daß die Bettler fast nur an Arbeiter zu appellieren pflegen und überhaupt mehr von Seiten der Arbeiter für die Erhaltung der Armen getan wird als von seiten der Bourgeoisie.
  en: I have already mentioned the fact that the beggars are accustomed to turn almost exclusively to the workers, and that, in general, more is done by the workers than by the bourgeoisie for the maintenance of the poor.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: V.44.4
  kind: p
  original: 'Diese Tatsache - man kann sie übrigens alle Tage bestätigt sehen - bestätigt u, a. auch Herr Parkinson, Kanonikus von Manchester:'
  en: 'This fact, which any one may prove for himself any day, is confirmed, among others, by Dr. Parkinson, Canon of Manchester, who says:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: V.45.1
  kind: p
  original: '"Die Armen geben einander mehr, als die Reichen den Armen geben.'
  en: '"The poor give one another more than the rich give the poor.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: V.45.2
  kind: p
  original: Ich kann meine Versicherung durch das Zeugnis eines unserer ältesten, geschicktesten, beobachtendsten und humansten Ärzte, des Dr. Bardsley, bestätigen.
  en: I can confirm my statement by the testimony of one of our eldest, most skilful, most observant, and humane physicians, Dr. Bardsley, who has often declared that the total sum which the poor yearly bestow upon one another, surpasses that which the rich contribute in the same time."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.45.3
  kind: p
  original: Dieser hat öffentlich erklärt, daß die Gesamtsumme, welche die Armen jährlich einander geben, diejenige übertrifft, welche die Reichen in derselben Zeit beisteuern."
  en: ''
  joined_to: V.45.2
  modern: ''
  modern_status: joined
  notes: ''
  footnotes:
  - V.N18
  mew_page: '352'
- id: V.46.1
  kind: p
  original: Auch sonst tritt die Humanität der Arbeiter überall erfreulich hervor.
  en: In other ways, too, the humanity of the workers is constantly manifesting itself pleasantly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: V.46.2
  kind: p
  original: Sie haben selbst harte Schicksale erfahren und können daher für diejenigen Mitgefühl hegen, denen es schlecht geht; für sie ist jeder Mensch ein Mensch, während der Arbeiter dem Bourgeois weniger als ein Mensch ist; daher sind sie umgänglicher, freundlicher, und obwohl sie das Geld nötiger haben als die Besitzenden, dennoch weniger darauf erpicht, weil ihnen das Geld nur um dessentwillen Wert hat, was sie dafür kaufen, während es für den Bourgeois einen besondern, inhärenten Wert, den Wert eines Gottes hat und den Bourgeois so zum gemeinen, schmutzigen "Geldmenschen" macht.
  en: They have experienced hard times themselves, and can therefore feel for those in trouble, whence they are more approachable, friendlier, and less greedy for money, though they need it far more, than the property-holding class. For them money is worth only what it will buy, whereas for the bourgeois it has an especial inherent value, the value of a god, and makes the bourgeois the mean, low money-grabber that he is.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.46.3
  kind: p
  original: Der Arbeiter, der dies Gefühl der Ehrfurcht vor dem Gelde nicht kennt, ist daher nicht so habgierig wie der Bourgeois, der alles nur tut, um Geld zu verdienen, der seinen Lebenszweck im Anhäufen von Geldsäcken sieht.
  en: The working-man who knows nothing of this feeling of reverence for money is therefore less grasping than the bourgeois, whose whole activity is for the purpose of gain, who sees in the accumulations of his money-bags the end and aim of life.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: V.46.4
  kind: p
  original: Darum ist der Arbeiter auch viel unbefangener, hat viel offnere Augen für Tatsachen als der Bourgeois und sieht nicht alles durch die Brille des Eigennutzes an.
  en: Hence the workman is much less prejudiced, has a clearer eye for facts as they are than the bourgeois, and does not look at everything through the spectacles of personal selfishness.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: V.46.5
  kind: p
  original: Vor religiösen Vorurteilen schützt ihn seine mangelhafte Erziehung; er versteht nichts davon und plagt sich nicht damit herum, er kennt den Fanatismus nicht, der die Bourgeoisie befangen hält, und wenn er ja etwas Religion haben sollte, so ist sie nur nominell, nicht einmal theoretisch - praktisch lebt er nur für diese Welt und sucht sich in ihr einzubürgern.
  en: His faulty education saves him from religious prepossessions, he does not understand religious questions, does not trouble himself about them, knows nothing of the fanaticism that holds the bourgeoisie bound; and if he chances to have any religion, he has it only in name, not even in theory. Practically he lives for this world, and strives to make himself at home in it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.46.6
  kind: p
  original: Alle Schriftsteller der Bourgeoisie stimmen darin überein, daß die Arbeiter keine Religion haben und die Kirche nicht besuchen.
  en: All the writers of the bourgeoisie are unanimous on this point, that the workers are not religious, and do not attend church.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: V.46.7
  kind: p
  original: Allenfalls die Irländer sind auszunehmen und einige altere Leute, dann die Halbbourgeois, die Aufseher, Werkmeister und dergleichen.
  en: From the general statement are to be excepted the Irish, a few elderly people, and the half-bourgeois, the overlookers, foremen, and the like.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '352'
- id: V.46.8
  kind: p
  original: Aber unter der Masse findet man fast überall eine gänzliche Indifferenz gegen die Religion, und wenn es hoch kommt, ein bißchen Deismus, das zu unentwickelt ist, um zu etwas mehr als zu Redensarten dienen zu können oder etwas mehr als einen vagen Schrecken vor Ausdrücken wie infidel (Ungläubiger) und atheist hervorzurufen.
  en: But among the masses there prevails almost universally a total indifference to religion, or at the utmost, some trace of Deism too undeveloped to amount to more than mere words, or a vague dread of the words infidel, atheist, etc. The clergy of all sects is in very bad odour with the working-men, though the loss of its influence is recent.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T8
    editions: '1892'
    reading: '... Deismus, zu unentwickelt, um'
    base_text: … zu unentwickelt ist, um ‸ zu etwas mehr als …
  mew_page: 352-353
- id: V.46.9
  kind: p
  original: 'Die Geistlichlichkeit aller Sekten steht sehr schlecht bei den Arbeitern angeschrieben, obwohl sie ihren Einfluß auf diese erst in der letzten Zeit verloren hat; jetzt steht sie aber so, daß der bloße Ruf: he is a parson - er ist ein Pfaff! oft genug imstande ist, einen Geistlichen von der Tribüne öffentlicher Versammlungen zu verjagen.'
  en: 'At present, however, the mere cry: "He''s a parson!" is often enough to drive one of the clergy from the platform of a public meeting. And like the rest of the conditions under which he lives, his want of religious and other culture contributes to keep the working-man more unconstrained, freer from inherited stable tenets and cut-and-dried opinions, than the bourgeois who is saturated with the class prejudices poured into him from his earliest youth.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: V.46.10
  kind: p
  original: Und wie schon die Lebenslage überhaupt, so trägt auch der Mangel an religiöser und sonstiger Bildung dazu bei, die Arbeiter unbefangener, freier von überkommenen stabilen Grundsätzen und vorgefaßten Meinungen zu halten, als der Bourgeois dies ist.
  en: ''
  joined_to: V.46.9
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '353'
- id: V.46.11
  kind: p
  original: Dieser sitzt in seinen Klassenvorurteilen, in den ihm von Jugend auf eingetrichterten Prinzipien bis über die Ohren eingerammt; mit ihm ist nichts anzufangen, er ist wesentlich, wenn auch in liberaler Form, konservativ, sein Interesse mit dem Bestehenden verwachsen, er ist aller Bewegung abgestorben.
  en: There is nothing to be done with the bourgeois; he is essentially conservative in however liberal a guise, his interest is bound up with that of the property-holding class, he is dead to all active movement; he is losing his position in the forefront of England's historical development.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: V.46.12
  kind: p
  original: Er tritt ab von der Spitze der historischen Entwicklung, die Arbeiter treten erst rechtlich und dereinst auch faktisch an seine Stelle.
  en: The workers are taking his place, in rightful claim first, then in fact.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: V.47.1
  kind: p
  original: Dies und die daraus folgende öffentliche Tätigkeit der Arbeiter, die wir später erledigen werden, sind die günstigen Seiten des Charakters dieser Klasse; die ungünstigen sind ebenso rasch zusammengefaßt und folgen ebenso natürlich aus den angegebenen Ursachen.
  en: All this, together with the correspondent public action of the workers, with which we shall deal later, forms the favourable side of the character of this class; the unfavourable one may be quite as briefly summed up, and follows quite as naturally out of the given causes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: V.47.2
  kind: p
  original: Trunksucht, Regellosigkeit des geschlechtlichen Verkehrs, Roheit und Mangel an Achtung für das Eigentum sind die Hauptpunkte, die der Bourgeois ihr vorwirft.
  en: Drunkenness, sexual irregularities, brutality, and disregard for the rights of property are the chief points with which the bourgeois charges them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: V.47.3
  kind: p
  original: Daß die Arbeiter stark trinken, ist nicht anders zu erwarten.
  en: That they drink heavily is to be expected.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: V.47.4
  kind: p
  original: Sheriff Alison behauptet, daß in Glasgow jeden Sonnabendabend an dreißigtausend Arbeiter berauscht sind, und die Zahl ist gewiß nicht zu gering; daß in dieser Stadt 1830 auf zwölf Häuser und 1840 auf je zehn Häuser eine Branntweinschenke kam, daß in Schottland 1823 für 2 300 000 Gallonen, 1837 für 6 620 000 Gall., und in England 1823 für 1 976 000 Gall., 1837 für 7 875 000 Gall.
  en: Sheriff Alison asserts that in Glasgow some thirty thousand working-men get drunk every Saturday night, and the estimate is certainly not exaggerated; and that in that city in 1830, one house in twelve, and in 1840, one house in ten, was a public-house; that in Scotland, in 1823, excise was paid upon 2,300,000 gallons; in 1837, upon 6,620,000 gallons; in England, in 1823, upon 1,976,000 gallons, and in 1837, upon 7,875,000 gallons of spirits.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.47.5
  kind: p
  original: Branntwein Akziseabgabe bezahlt wurde.
  en: ''
  joined_to: V.47.4
  modern: ''
  modern_status: joined
  notes: ''
  footnotes:
  - V.N19
  mew_page: '353'
- id: V.47.6
  kind: p
  original: Die Bierakte von 1830, welche die Errichtung von Bierhäusern, sogenannten Jerry-Shops, erleichterte - deren Besitzer zum Verkauf von Bier, to be drunk on the premises (das im Hause selbst getrunken werden darf), konzessioniert ist - diese Akte erleichterte auch die Ausbreitung der Trunksucht, indem sie jedem die Schenke fast vor die Türe brachte.
  en: The Beer Act of 1830, which facilitated the opening of beerhouses (jerry shops), whose keepers are licensed to sell beer to be drunk on the premises, facilitated the spread of intemperance by bringing a beerhouse, so to say, to everybody's door.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '353'
- id: V.47.7
  kind: p
  original: Fast in jeder Straße findet man mehrere dieser Bierhäuser, und wo auf dem Lande zwei oder drei Häuser zusammenstehen, so ist ganz gewiß ein Jerry-Shop darunter.
  en: In nearly every street there are several such beerhouses, and among two or three neighbouring houses in the country one is sure to be a jerry shop.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 353-354
- id: V.47.8
  kind: p
  original: Außerdem gibt es noch Hush-Shops, d.h. heimliche Schenken, die nicht konzessioniert sind, in Menge und ebensoviele Branntweinbrennereien, die mitten in den großen Städten, in abgelegenen, von der Polizei selten besuchten Vierteln große Quantitäten dieses Getränks produzieren.
  en: Besides these, there are hush-shops in multitudes, i.e., secret drinking-places which are not licensed, and quite as many secret distilleries which produce great quantities of spirits in retired spots, rarely visited by the police, in the great cities.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: V.47.9
  kind: p
  original: Gaskell (a. a. 0.) schlägt die Zahl dieser letzteren in Manchester allein auf über hundert und ihre jährliche Produktion auf mindestens 156 000 Gallonen an.
  en: Gaskell estimates these secret distilleries in Manchester alone at more than a hundred, and their product at 156,000 gallons at the least.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: V.47.10
  kind: p
  original: In Manchester sind außerdem über tausend Schenken, also im Verhältnis zur Häuserzahl wenigstens ebensoviele als in Glasgow.
  en: In Manchester there are, besides, more than a thousand public-houses selling all sorts of alcoholic drinks, or quite as many in proportion to the number of inhabitants as in Glasgow.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: V.47.11
  kind: p
  original: In allen andern großen Städten sieht es ebenso aus.
  en: In all other great towns, the state of things is the same.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: V.47.12
  kind: p
  original: Und wenn man nun noch außer den gewöhnlichen Folgen der Trunksucht bedenkt, daß Männer und Weiber von jedem Alter, selbst Kinder, oft Mütter mit ihren Kleinen auf dem Arme, hier mit den am tiefsten gesunkenen Opfern des Bourgeoisieregimes, mit Dieben, Betrügern und prostituierten Mädchen zusammenkommen, wenn man bedenkt, daß manche Mutter dem Säugling, den sie auf den Armen trägt, Branntwein zu trinken gibt, so wird man die demoralisierende Wirkung des Besuchs solcher Orte allerdings zugeben.
  en: And when one considers, apart from the usual consequences of intemperance, that men and women, even children, often mothers with babies in their arms, come into contact in these places with the most degraded victims of the bourgeois regime, with thieves, swindlers, and prostitutes; when one reflects that many a mother gives the baby on her arm gin to drink, the demoralising effects of frequenting such places cannot be denied.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: V.47.13
  kind: p
  original: Namentlich Samstagabends, wenn der Lohn ausbezahlt ist und etwas früher als gewöhnlich Feierabend gemacht wird, wenn die ganze arbeitende Klasse aus ihren schlechten Vierteln sich in die Hauptstraßen ergießt, kann man die Trunkenheit in ihrer ganzen Brutalität sehen.
  en: On Saturday evenings, especially when wages are paid and work stops somewhat earlier than usual, when the whole working-class pours from its own poor quarters into the main thoroughfares, intemperance may be seen in all its brutality.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: V.47.14
  kind: p
  original: Ich bin selten an einem solchen Abend aus Manchester herausgekommen, ohne einer Menge schwankender oder in den Rinnsteinen liegender Betrunkener zu begegnen.
  en: I have rarely come out of Manchester on such an evening without meeting numbers of people staggering and seeing others lying in the gutter.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: V.47.15
  kind: p
  original: Am Sonntagabend pflegt sich dieselbe Szene, nur weniger lärmend, zu wiederholen.
  en: On Sunday evening the same scene is usually repeated, only less noisily.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: V.47.16
  kind: p
  original: Und wenn das Geld aus ist, so gehen die Trinker zum ersten besten Pfandhaus, deren in jeder großen Stadt eine Menge sind - Manchester über sechzig und in einer einzigen Straße von Salford (Chapel-Street) zehn bis zwölf-, und versetzen, was sie noch haben.
  en: And when their money is spent, the drunkards go to the nearest pawnshop, of which there are plenty in every city--over sixty in Manchester, and ten or twelve in a single street of Salford, Chapel Street--and pawn whatever they possess.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: V.47.17
  kind: p
  original: Möbel, Sonntagskleider, wo sie existieren, Geschirre werden jeden Sonnabendabend in Massen aus den Pfandhäusern abgeholt, um fast immer vor dem nächsten Mittwoch wieder hineinzuwandern, bis zuletzt irgendein Zufall die Einlösung unmöglich macht und ein Stück nach dem andern dem Wucherer verfällt oder bis dieser auf die verschlissene und ausgenutzte Ware keinen Heller mehr vorschießen will.
  en: Furniture, Sunday clothes where such exist, kitchen utensils in masses are fetched from the pawnbrokers on Saturday night only to wander back, almost without fail, before the next Wednesday, until at last some accident makes the final redemption impossible, and one article after another falls into the clutches of the usurer, or until he refuses to give a single farthing more upon the battered, used-up pledge.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '354'
- id: V.47.18
  kind: p
  original: Wenn man die Verbreitung der Trunksucht unter den Arbeitern in England selbst gesehen hat, so glaubt man gern der Behauptung Lord Ashleys, daß diese Klasse jährlich an fünfundzwanzig Millionen Pfund Sterling für geistige Getränke ausgibt, und welche Verschlechterung der äußeren Lage, welche furchtbare Zerrüttung der geistigen und körperlichen Gesundheit, welche Zerstörung aller häuslichen Verhältnisse daraus entsteht, kann sich jeder leicht denken.
  en: 'When one has seen the extent of intemperance among the workers in England, one readily believes Lord Ashley''s statement that this class annually expends something like twenty-five million pounds sterling upon intoxicating liquor: and the deterioration in external conditions, the frightful shattering of mental and physical health, the ruin of all domestic relations which follow may readily be imagined.'
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N20
  mew_page: 354-355
- id: V.47.19
  kind: p
  original: Die Mäßigkeitsvereine haben allerdings viel getan, aber was verschlagen ein paar Tausend "Teetotallers" ["Abstinezler"] auf die Millionen Arbeiter?
  en: True, the temperance societies have done much, but what are a few thousand teetotallers among the millions of workers?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '355'
- id: V.47.20
  kind: p
  original: Wenn Father Mathew, der irische Mäßigkeitsapostel, durch die englischen Städte reist, so nehmen oft dreißig- bis sechzigtausend Arbeiter die "pledge" (das Gelübde), aber nach vier Wochen ist das bei den meisten wieder vergessen.
  en: When Father Matthew, the Irish apostle of temperance, passes through the English cities, from thirty to sixty thousand workers take the pledge; but most of them break it again within a month.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '355'
- id: V.47.21
  kind: p
  original: Wenn man z.B. die Massen zusammenzählt, die in den letzten drei bis vier Jahren in Manchester das Mäßigkeitsgelübde abgelegt haben, so kommen mehr Laute heraus, als überhaupt in der Stadt wohnen - und doch merkt man nicht, daß der Trunk abnimmt.
  en: If one counts up the immense numbers who have taken the pledge in the last three or four years in Manchester, the total is greater than the whole population of the town--and still it is by no means evident that intemperance is diminishing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '355'
- id: V.48.1
  kind: p
  original: Neben der Zügellosigkeit im Genuß geistiger Getränke bildet die Zügellosigkeit des geschlechtlichen Verkehrs eine Hauptuntugend vieler englischer Arbeiter.
  en: Next to intemperance in the enjoyment of intoxicating liquors, one of the principal faults of English working-men is sexual licence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '355'
- id: V.48.2
  kind: p
  original: Auch diese folgt mit eiserner Konsequenz, mit unumgänglicher Notwendigkeit aus der Lage einer Klasse, die sich selbst überlassen wird, ohne die Mittel zu besitzen, von dieser Freiheit geeigneten Gebrauch zu machen.
  en: But this, too, follows with relentless logic, with inevitable necessity out of the position of a class left to itself, with no means of making fitting use of its freedom.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '355'
- id: V.48.3
  kind: p
  original: Die Bourgeoisie hat ihr nur diese beiden Genüsse gelassen, während sie ihr eine Menge von Mühen und Leiden auferlegt hat, und die Folge davon ist, daß die Arbeiter, um doch etwas vom Leben zu haben, alle Leidenschaft auf diese beiden Genüsse konzentrieren und sich ihnen im Übermaß und auf die regelloseste Weise ergeben.
  en: The bourgeoisie has left the working-class only these two pleasures, while imposing upon it a multitude of labours and hardships, and the consequence is that the working-men, in order to get something from life, concentrate their whole energy upon these two enjoyments, carry them to excess, surrender to them in the most unbridled manner.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '355'
- id: V.48.4
  kind: p
  original: Wenn man die Leute in eine Lage versetzt, die nur dem Tier zusagen kann, so bleibt ihnen nichts übrig, als sich zu empören oder in der Bestialität unterzugehen.
  en: When people are placed under conditions which appeal to the brute only, what remains to them but to rebel or to succumb to utter brutality?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '355'
- id: V.48.5
  kind: p
  original: Und wenn obendrein noch die Bourgeoisie selbst ihr redlich Teil zur direkten Hebung der Prostitution beiträgt - wieviele von den 40 000 Freudenmädchen, die jeden Abend die Straßen von London füllen, leben von der tugendhaften Bourgeoisie? - wie viele von ihnen haben es der Verführung eines Bourgeois zu danken, daß sie ihren Körper den Vorübergehenden feilbieten müssen, um zu leben? - so hat sie wahrlich am wenigsten das Recht, den Arbeitern ihre sexuale Brutalität vorzuwerfen.
  en: And when, moreover, the bourgeoisie does its full share in maintaining prostitution--and how many of the 40,000 prostitutes who fill the streets of London every evening live upon the virtuous bourgeoisie! How many of them owe it to the seduction of a bourgeois, that they must offer their bodies to the passers-by in order to live?--surely it has least of all a right to reproach the workers with their sexual brutality.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N21
  mew_page: '355'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.49.1
  kind: p
  original: Die Fehler der Arbeiter lassen sich überhaupt alle auf Zügellosigkeit der Genußsucht, Mangel an Vorhersicht und an Fügsamkeit in die soziale Ordnung, überhaupt auf die Unfähigkeit, den augenblicklichen Genuß dem entfernteren Vorteil aufzuopfern, zurückführen.
  en: The failings of the workers in general may be traced to an unbridled thirst for pleasure, to want of providence, and of flexibility in fitting into the social order, to the general inability to sacrifice the pleasure of the moment to a remoter advantage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '355'
- id: V.49.2
  kind: p
  original: Aber wie ist das zu verwundern?
  en: But is that to be wondered at?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '355'
- id: V.49.3
  kind: p
  original: Eine Klasse, die wenig und nur die sinnlichsten Genüsse sich für saure Arbeit erkaufen kann, muß sich die nicht toll und blind auf diese Genüsse werfen?
  en: When a class can purchase few and only the most sensual pleasures by its wearying toil, must it not give itself over blindly and madly to those pleasures?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '355'
- id: V.49.4
  kind: p
  original: Eine Klasse, um deren Bildung sich niemand kümmert, die allen möglichen Zufällen unterworfen ist, die gar keine Sicherheit der Lebenslage kennt, was für Gründe, was für ein Interesse hat die, Vorhersicht zu üben, ein "solides" Leben zu führen und, statt von der Gunst des Augenblicks zu profitieren, auf einen entfernteren Genuß zu denken, der gerade für sie und ihre ewig schwankende, sich überschlagende Stellung noch sehr ungewiß ist?
  en: A class about whose education no one troubles himself, which is a playball to a thousand chances, knows no security in life--what incentives has such a class to providence, to "respectability," to sacrifice the pleasure of the moment for a remoter enjoyment, most uncertain precisely by reason of the perpetually varying, shifting conditions under which the proletariat lives?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 355-356
- id: V.49.5
  kind: p
  original: Eine Klasse, die alle Nachteile der sozialen Ordnung zu tragen hat, ohne ihre Vorteile zu genießen, eine Klasse, der diese soziale Ordnung nur feindselig erscheint, von der verlangt man noch, daß sie diese soziale Ordnung respektieren soll?
  en: A class which bears all the disadvantages of the social order without enjoying its advantages, one to which the social system appears in purely hostile aspects--who can demand that such a class respect this social order?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: V.49.6
  kind: p
  original: Das ist wahrlich zuviel.
  en: Verily that is asking much!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: V.49.7
  kind: p
  original: Aber die Arbeiterklasse kann der sozialen Ordnung, solange diese besteht, nicht entrinnen, und wenn der einzelne Arbeiter gegen sie aufsteht, so fällt der größte Schaden auf ihn.
  en: But the working-man cannot escape the present arrangement of society so long as it exists, and when the individual worker resists it, the greatest injury falls upon himself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: V.49.8
  kind: p
  original: So macht die soziale Ordnung dem Arbeiter das Familienleben fast unmöglich; ein unwohnliches, schmutziges Haus, das kaum zum nächtlichen Obdach gut genug, schlecht möbliert und oft nicht regendicht und nicht geheizt ist, eine dumpfige Atmosphäre im menschengefüllten Zimmer erlaubt keine Häuslichkeit; der Mann arbeitet den ganzen Tag, vielleicht auch die Frau und die älteren Kinder, alle an verschiedenen Orten, sehen sich nur morgens und abends - dazu die stete Versuchung zum Branntweintrinken; wo kann dabei das Familienleben existieren?
  en: Thus the social order makes family life almost impossible for the worker. In a comfortless, filthy house, hardly good enough for mere nightly shelter, ill-furnished, often neither rain-tight nor warm, a foul atmosphere filling rooms overcrowded with human beings, no domestic comfort is possible. The husband works the whole day through, perhaps the wife also and the elder children, all in different places; they meet night and morning only, all under perpetual temptation to drink; what family life is possible under such conditions?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: V.49.9
  kind: p
  original: Dennoch kann der Arbeiter der Familie nicht entrinnen, er muß in der Familie leben, und die Folge davon sind fortwährende Familienzerrüttungen und häusliche Zwiste, die sowohl auf die Eheleute wie namentlich auf ihre Kinder im höchsten Grade demoralisierend wirken.
  en: Yet the working-man cannot escape from the family, must live in the family, and the consequence is a perpetual succession of family troubles, domestic quarrels, most demoralising for parents and children alike.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: V.49.10
  kind: p
  original: Vernachlässigung aller häuslichen Pflichten, Vernachlässigung besonders der Kinder ist nur zu häufig unter den englischen Arbeitern und wird nur zu sehr durch die bestehenden Einrichtungen der Gesellschaft hervorgebracht.
  en: Neglect of all domestic duties, neglect of the children, especially, is only too common among the English working-people, and only too vigorously fostered by the existing institutions of society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: V.49.11
  kind: p
  original: Und Kinder, die auf diese Weise wild, in der demoralisierendsten Umgebung, zu der oft genug die Eltern selbst gehören, heranwachsen, die sollen nachher noch fein moralisch werden?
  en: And children growing up in this savage way, amidst these demoralising influences, are expected to turn out goody-goody and moral in the end!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: V.49.12
  kind: p
  original: Es ist wirklich zu naiv, welche Forderungen der selbstzufriedene Bourgeois an den Arbeiter stellt.
  en: Verily the requirements are naive, which the self-satisfied bourgeois makes upon the working-man!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: V.50.1
  kind: p
  original: Die Nichtachtung der sozialen Ordnung tritt am deutlichsten in ihrem Extrem, im Verbrechen auf.
  en: The contempt for the existing social order is most conspicuous in its extreme form--that of offences against the law.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: V.50.2
  kind: p
  original: Wirken die Ursachen, die den Arbeiter demoralisieren, stärker, konzentrierter als gewöhnlich, so wird er mit derselben Gewißheit Verbrecher, mit der das Wasser bei 80 Grad Réaumur aus dem tropfbaren in den luftförmigen Aggregatzustand übergeht.
  en: If the influences demoralising to the working-man act more powerfully, more concentratedly than usual, he becomes an offender as certainly as water abandons the fluid for the vaporous state at 80 degrees, Reaumur.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: V.50.3
  kind: p
  original: Der Arbeiter wird durch die brutale und brutalisierende Behandlung der Bourgeoisie gerade ein so willenloses Ding wie das Wasser und ist gerade mit derselben Notwendigkeit den Gesetzen der Natur unterworfen - bei ihm hört auf einem gewissen Punkte alle Freiheit auf.
  en: Under the brutal and brutalising treatment of the bourgeoisie, the working-man becomes precisely as much a thing without volition as water, and is subject to the laws of nature with precisely the same necessity; at a certain point all freedom ceases.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '356'
- id: V.50.4
  kind: p
  original: Mit der Ausdehnung des Proletariats hat daher auch das Verbrechen in England zugenommen, und die britische Nation ist die verbrecherischste der Welt geworden.
  en: Hence with the extension of the proletariat, crime has increased in England, and the British nation has become the most criminal in the world.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 356-357
- id: V.50.5
  kind: p
  original: Aus den jährlich veröffentlichten "Kriminal-Tabellen" des Ministeriums des Innern geht hervor, daß in England die Vermehrung des Verbrechens mit unbegreiflicher Schnelligkeit vor sich gegangen ist.
  en: From the annual criminal tables of the Home Secretary, it is evident that the increase of crime in England has proceeded with incomprehensible rapidity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: V.50.6
  kind: p
  original: Die Anzahl der Verhaftungen für Kriminalverbrechen betrug im Jahre 1805 4605 / im Jahre 1810 5146 / im Jahre 1815 7818 / im Jahre 1820 13 710 / im Jahre 1825 14 437 / im Jahre 1830 18 107 / im Jahre 1835 20 731 / im Jahre 1840 27 187 / im Jahre 1841 27 760 / im Jahre 1842 31 309 in England und Wales allein; also versiebenfachten sich die Verhaftungen in 37 Jahren.
  en: 'The numbers of arrests for criminal offences reached in the years: 1805, 4,605; 1810, 5,146; 1815, 7,898; 1820, 13,710; 1825, 14,437; 1830,18,107; 1835, 20,731; 1840, 27,187; 1841, 27,760; 1842, 31,309 in England and Wales alone. That is to say, they increased sevenfold in thirty-seven years.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.50.7
  kind: p
  original: Von diesen Verhaftungen kommen allein auf Lancashire im Jahre 1842 4 497, also über 14 Prozent, und auf Middlesex (einschließlich London) 4 094, also über 13 Prozent.
  en: Of these arrests, in 1842, 4,497 were made in Lancashire alone, or more than 14 per cent. of the whole; and 4,094 in Middlesex, including London, or more than 13 per cent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: V.50.8
  kind: p
  original: So sehen wir, daß zwei Distrikte, die große Städte mit viel Proletariat einschließen, allein über den vierten Teil des gesamten Verbrechens hervorbringen, obgleich ihre Gesamtbevölkerung lange nicht den vierten Teil der des ganzen Landes ausmacht.
  en: So that two districts which include great cities with large proletarian populations, produced one-fourth of the total amount of crime, though their population is far from forming one-fourth of the whole.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: V.50.9
  kind: p
  original: Die Kriminaltabellen beweisen auch noch direkt, daß fast alles Verbrechen auf das Proletariat fällt, denn 1842 konnten von jeden 100 Verbrechern durchschnittlich 32,35 nicht lesen und schreiben, 58,32 unvollkommen lesen und schreiben, 6,77 gut lesen und schreiben, 0,22 hatten noch höhere Bildung genossen, und von 2,34 konnte die Bildung nicht angegeben werden.
  en: Moreover, the criminal tables prove directly that nearly all crime arises within the proletariat; for, in 1842, taking the average, out of 100 criminals, 32.35 could neither read nor write; 58.32 read and wrote imperfectly; 6.77 could read and write well; 0.22 had enjoyed a higher education, while the degree of education of 2.34 could not be ascertained.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: V.50.10
  kind: p
  original: In Schottland hat das Verbrechen noch viel schneller zugenommen.
  en: In Scotland, crime has increased yet more rapidly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: V.50.11
  kind: p
  original: Hier waren 1819 nur 89 und 1837 schon 3176, 1842 sogar 4189 Kriminalverhaftungen vorgekommen.
  en: There were but 89 arrests for criminal offences in 1819, and as early as 1837 the number had risen to 3,176, and in 1842 to 4,189.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: V.50.12
  kind: p
  original: In Lanarkshire, wo Sheriff Alison selbst den offiziellen Bericht abfaßte, hat sich die Bevölkerung in 30 Jahren, das Verbrechen alle 5 1/2 Jahre verdoppelt, also sechsmal rascher als die Bevölkerung zugenommen.
  en: In Lanarkshire, where Sheriff Alison himself made out the official report, population has doubled once in thirty years, and crime once in five and a half, or six times more rapidly than the population.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: V.50.13
  kind: p
  original: Die Verbrechen selbst sind, wie in allen zivilisierten Ländern, bei weitem der Mehrzahl nach Verbrechen gegen das Eigentum, also solche, die in Mangel dieser oder jener Art ihren Grund haben, denn was einer hat, stiehlt er nicht.
  en: The offences, as in all civilised countries, are, in the great majority of cases, against property, and have, therefore, arisen from want in some form; for what a man has, he does not steal.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '357'
- id: V.50.14
  kind: p
  original: 'Das Verhältnis der Verbrechen gegen Eigentum zur Volkszahl, das sich in den Niederlanden 1: 7140, in Frankreich wie 1:1804 stellt, stand zur Zeit, als Gaskell schrieb, in England wie 1: 799; das der Verbrechen gegen Personen zur Volkszahl in den Niederlanden wie 1: 28 904, in Frankreich wie 1: 17 573, in England wie 1: 23 395; das des Verbrechens überhaupt zur Volkszahl in Ackerbaudistrikten wie 1: 1 043, in Fabrikdistrikten wie l: 840; in ganz England stellt sich dies jetzt kaum auf 1: 660, und es sind kaum zehn Jahre, seit Gaskells Buch erschien!'
  en: 'The proportion of offences against property to the population, which in the Netherlands is as 1: 7,140, and in France, as 1: 1,804, was in England, when Gaskell wrote, as 1: 799. The proportion of offences against persons to the population is, in the Netherlands, 1: 28,904; in France, 1: 17,573; in England, 1: 23,395; that of crimes in general to the population in the agricultural districts, as 1: 1,043; in the manufacturing districts as 1: 840. In the whole of England to-day the proportion is 1: 660; though it is scarcely ten years since Gaskell''s book appeared!'
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - V.N22
  - V.N23
  mew_page: 357-358
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: V.51.1
  kind: p
  original: Diese Tatsachen sind wahrlich mehr als hinreichend, um jeden, selbst einen Bourgeois, zur Besinnung und zum Nachdenken über die Folgen eines solchen Zustandes zu bringen.
  en: These facts are certainly more than sufficient to bring any one, even a bourgeois, to pause and reflect upon the consequences of such a state of things.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: V.51.2
  kind: p
  original: Wenn sich die Demoralisation und die Verbrechen noch zwanzig Jahre lang in diesem Maße vermehren - und wenn die englische Industrie in diesen zwanzig Jahren weniger glücklich ist als bisher, so muß die Progression des Verbrechens sich nur noch beschleunigen - was wird dann das Resultat sein?
  en: If demoralisation and crime multiply twenty years longer in this proportion (and if English manufacture in these twenty years should be less prosperous than heretofore, the progressive multiplication of crime can only continue the more rapidly), what will the result be?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: V.51.3
  kind: p
  original: Wir sehen schon jetzt die Gesellschaft in voller Auflösung begriffen, wir können keine Zeitung in die Hand nehmen, ohne in den schlagendsten Tatsachen die Lockerung aller sozialen Bande lesen zu müssen.
  en: Society is already in a state of visible dissolution; it is impossible to pick up a newspaper without seeing the most striking evidence of the giving way of all social ties.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: V.51.4
  kind: p
  original: Ich greife aufs Geratewohl in den Haufen englischer Zeitungen, die vor mir liegen; da ist ein "Manchester Guardian" (30. Oktober 1844), der über drei Tage berichtet; er gibt sich gar nicht mehr die Mühe, über Manchester genaue Nachrichten zu geben und erzählt bloß die interessantesten Fälle, daß in einer Fabrik die Arbeiter, um höheren Lohn zu erlangen, die Arbeit eingestellt hätten und vom Friedensrichter zu ihrer Wiederaufnahme gezwungen seien; daß in Salford ein paar Knaben Diebstähle verübt und ein bankerotter Kaufmann seine Gläubiger habe betrügen wollen.
  en: 'I look at random into a heap of English journals lying before me; there is the Manchester Guardian for October 30, 1844, which reports for three days. It no longer takes the trouble to give exact details as to Manchester, and merely relates the most interesting cases: that the workers in a mill have struck for higher wages without giving notice, and been condemned by a Justice of the Peace to resume work; that in Salford a couple of boys had been caught stealing, and a bankrupt tradesman tried to cheat his creditors.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.51.5
  kind: p
  original: 'Ausführlicher sind die Nachrichten aus den Nebenorten: in Ashton zwei Diebstähle, ein Einbruch, ein Selbstmord, in Bury ein Diebstahl, in Bolton zwei Diebstähle, ein Akzisebetrug, in Leigh ein Diebstahl, in Oldham Arbeitseinstellung wegen Lohn, ein Diebstahl, eine Schlägerei zwischen Irländerinnen, ein nicht zur Arbeiterverbindung gehörender Hutmacher von den Mitgliedern der Verbindung mißhandelt, eine Mutter von ihrem Sohn geschlagen, in Rochdale eine Reihe Schlägereien, ein Angriff auf die Polizei, ein Kirchenraub, in Stockport Unzufriedenheit der Arbeiter mit dem Lohn, ein Diebstahl, ein Betrug, Schlägerei, ein Mann, der seine Frau mißhandelt, in Warrington ein Diebstahl und eine Schlägerei, in Wigan ein Diebstahl und ein Kirchenraub.'
  en: 'From the neighbouring towns the reports are more detailed: in Ashton, two thefts, one burglary, one suicide; in Bury, one theft; in Bolton, two thefts, one revenue fraud; in Leigh, one theft; in Oldham, one strike for wages, one theft, one fight between Irish women, one non-Union hatter assaulted by Union men, one mother beaten by her son, one attack upon the police, one robbery of a church; in Stockport, discontent of working-men with wages, one theft, one fraud, one fight, one wife beaten by her husband; in Warrington, one theft, one fight; in Wigan, one theft, and one robbery of a church.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: V.51.6
  kind: p
  original: Die Berichte der Londoner Zeitungen sind noch viel schlimmer; Betrügereien, Diebstähle, Raubanfälle, Familienzerwürfnisse drängen eins das andere; mir fällt gerade eine "Times" (12. September 1844), die nur die Vorfälle eines Tages berichtet, in die Hand, die von einem Diebstahl, einem Angriff auf die Polizei, einem Alimentationsurteil gegen den Vater eines unehelichen Kindes, der Aussetzung eines Kindes durch seine Eltern und der Vergiftung eines Mannes durch seine Frau erzählt.
  en: The reports of the London papers are much worse; frauds, thefts, assaults, family quarrels crowd one another. A Times of September 12, 1844, falls into my hand, which gives a report of a single day, including a theft, an attack upon the police, a sentence upon a father requiring him to support his illegitimate son, the abandonment of a child by its parents, and the poisoning of a man by his wife.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 358-359
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.51.7
  kind: p
  original: Ähnliches ist in allen englischen Zeitungen zu finden.
  en: Similar reports are to be found in all the English papers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: V.51.8
  kind: p
  original: In diesem Lande ist der soziale Krieg vollständig ausgebrochen; jeder steht für sich selbst und kämpft für sich selbst gegen alle andern, und ob er allen andern, die seine erklärten Feinde sind, Schaden zufügen soll oder nicht, hängt nur von einer selbstsüchtigen Berechnung über das ab, was ihm am vorteilhaftesten ist.
  en: In this country, social war is under full headway, every one stands for himself, and fights for himself against all comers, and whether or not he shall injure all the others who are his declared foes, depends upon a cynical calculation as to what is most advantageous for himself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: V.51.9
  kind: p
  original: Es fällt keinem mehr ein, sich auf friedlichem Wege mit seinen Nebenmenschen zu verständigen; alle Differenzen werden durch Drohungen, Selbsthülfe oder die Gerichte abgemacht.
  en: It no longer occurs to any one to come to a peaceful understanding with his fellow-man; all differences are settled by threats, violence, or in a law-court.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: V.51.10
  kind: p
  original: Kurz, jeder sieht im andern einen Feind, den er aus dem Wege zu räumen, oder höchstens ein Mittel, das er zu seinen Zwecken auszubeuten hat.
  en: In short, every one sees in his neighbour an enemy to be got out of the way, or, at best, a tool to be used for his own advantage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: V.51.11
  kind: p
  original: 'Und dieser Krieg wird, wie die Kriminaltabellen beweisen, von Jahr zu Jahr heftiger, leidenschaftlicher, unversöhnlicher; die Feindschaft teilt sich allmählich in zwei große Lager, die gegeneinander streiten: die Bourgeoisie hier und das Proletariat dort.'
  en: And this war grows from year to year, as the criminal tables show, more violent, passionate, irreconcilable. The enemies are dividing gradually into two great camps--the bourgeoisie on the one hand, the workers on the other.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.51.12
  kind: p
  original: Dieser Krieg Aller gegen Alle und des Proletariats gegen die Bourgeoisie darf uns nicht wundern, denn er ist nur die konsequente Durchführung des schon in der freien Konkurrenz enthaltenen Prinzips; aber wohl darf es uns wundern, daß die Bourgeoisie, gegen die sich tagtäglich neue und drohende Gewitterwolken zusammenziehen, bei alledem so ruhig und gelassen bleibt, wie sie diese Sachen täglich in den Zeitungen lesen kann, ohne, wir wollen nicht sagen Indignation über den sozialen Zustand, sondern nur Furcht vor seinen Folgen, vor einem allgemeinen Ausbruch dessen, was im Verbrechen einzeln zutage kommt, zu empfinden.
  en: This war of each against all, of the bourgeoisie against the proletariat, need cause us no surprise, for it is only the logical sequel of the principle involved in free competition. But it may very well surprise us that the bourgeoisie remains so quiet and composed in the face of the rapidly gathering storm-clouds, that it can read all these things daily in the papers without, we will not say indignation at such a social condition, but fear of its consequences, of a universal outburst of that which manifests itself symptomatically from day to day in the form of crime.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.51.13
  kind: p
  original: Aber dafür ist sie gerade Bourgeoisie und kann von ihrem Standpunkte aus nicht einmal die Tatsachen, geschweige ihre Konsequenzen, wahrnehmen.
  en: But then it is the bourgeoisie, and from its standpoint cannot even see the facts, much less perceive their consequences.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: V.51.14
  kind: p
  original: Nur das ist staunenswert, daß Klassenvorurteile und eingetrommelte vorgefaßte Meinungen eine ganze Menschenklasse mit einem so hohen, ich möchte sagen so wahnsinnigen Grade von Blindheit schlagen können.
  en: One thing only is astounding, that class prejudice and preconceived opinions can hold a whole class of human beings in such perfect, I might almost say, such mad blindness.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: V.51.15
  kind: p
  original: Die Entwicklung der Nation geht indes ihren Gang, die Bourgeois mögen Augen für sie haben oder nicht, und wird eines schönen Morgens die besitzende Klasse mit Dingen überraschen, von denen sich ihre Weisheit nichts träumen läßt.
  en: Meanwhile, the development of the nation goes its way whether the bourgeoisie has eyes for it or not, and will surprise the property-holding class one day with things not dreamed of in its philosophy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: V.N1.1.1
  kind: note
  original: Wenn ich in dem Sinne wie hier und anderwärts von der Gesellschaft als einer verantwortlichen Gesamtheit spreche, die ihre Rechte und Pflichten hat, so versteht es sich, daß ich damit die Macht der Gesellschaft meine, diejenige Klasse also, die gegenwärtig die politische und soziale Herrschaft besitzt und damit zugleich auch die Verantwortlichkeit für die Lage derer trägt, denen sie keinen Teil an der Herrschaft gibt.
  en: When as here and elsewhere I speak of society as a responsible whole, having rights and duties, I mean, of course, the ruling power of society, the class which at present holds social and political control, and bears, therefore, the responsibility for the condition of those to whom it grants no share in such control.
  modern: ''
  modern_status: empty
  notes: ''
  en_note: English note {95}.
- id: V.N1.1.2
  kind: note
  original: Diese herrschende Klasse ist in England wie in allen andern zivilisierten Ländern die Bourgeoisie.
  en: This ruling class in England, as in all other civilised countries, is the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
- id: V.N1.1.3
  kind: note
  original: Daß aber die Gesellschaft und speziell die Bourgeoisie die Pflicht hat, jedes Gesellschaftsglied mindestens in seinem Leben zu schützen, dafür z.B. zu sorgen, daß niemand verhungert - diesen Satz brauch' ich meinen deutschen Lesern nicht erst zu beweisen.
  en: But that this society, and especially the bourgeoisie, is charged with the duty of protecting every member of society, at least, in his life, to see to it, for example, that no one starves, I need not now prove to my German readers.
  modern: ''
  modern_status: empty
  notes: ''
  align: '3:1'
  review: true
  review_reason: 3 de sentence(s) matched to 1 en sentence(s)
- id: V.N1.1.4
  kind: note
  original: Schrieb' ich für die englische Bourgeoisie, da wäre das freilich anders.
  en: ''
  joined_to: V.N1.1.3
  modern: ''
  modern_status: joined
  notes: ''
- id: V.N1.1.5
  kind: note
