  original: 'Sterblichkeit / Erste Straßenklasse: Häuser I. Klasse 1 aus 51 / II. Klasse 1 aus 45 / III. Klasse 1 aus 36 / Zweite Straßenklasse: Häuser I. Klasse 1 aus 55 / II. Klasse 1 aus 38 / III. Klasse 1 aus 35 / Dritte Straßenklasse: Häuser I. Klasse fehlen / II. Klasse 1 aus 35 / III. Klasse 1 aus 25'
  en: First class of Streets. Houses I. class. Mortality one in 51,,,,,, II.,,,,,, 45,,,,,, III.,,,,,, 36 Second,,,, I.,,,,,, 55,,,,,, II.,,,,,, 38,,,,,, III.,,,,,, 35 Third,,,, I.,, Wanting --- ----,,,,,, II.,, Mortality,, 35,,,,,, III.,,,,,, 25
  modern: ''
