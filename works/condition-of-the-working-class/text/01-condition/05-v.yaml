- id: V.13.1
  kind: p
  original: Aus mehreren andern von Holland gegebenen Tabellen geht hervor, daß die Sterblichkeit in den Straßen zweiter Klasse 18 Prozent und dritter Klasse 68 Prozent größer ist als in denen erster Klasse; daß die Sterblichkeit in den Häusern zweiter Klasse 31 Prozent und dritter Klasse 78 Prozent größer ist als in denen erster Klasse; daß die Sterblichkeit in den schlechten Straßen, die verbessert wurden, sich um 25 Prozent vermindert hat.
  en: It is clear from other tables given by Holland that the mortality in the streets of the second class is 18 per cent. greater, and in the streets of the third class 68 per cent. greater than in those of the first class; that the mortality in the houses of the second class is 31 per cent greater, and in the third class 78 per cent. greater than in those of the first class; that the mortality is those bad streets which were improved, decreased 25 per cent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 335-336
- id: V.13.2
  kind: p
  original: 'Er schließt mit der für einen englischen Bourgeois sehr offenen Bemerkung:'
  en: 'He closes with the remark, very frank for an English bourgeois:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '336'
- id: V.14.1
  kind: p
  original: '"Wenn wir finden, daß die Sterblichkeit in einigen Straßen viermal so hoch ist als in anderen und in ganzen Straßenklassen doppelt so hoch ist als in andern Klassen, wenn wir ferner finden, daß sie so gut wie unveränderlich hoch ist in den Straßen, die in schlechtem Zustande sind, und so gut wie unveränderlich niedrig in gutkonditionierten Straßen, so können wir dem Schluß nicht widerstehen, daß Massen unserer Mitmenschen, Hunderte unserer nächsten Nachbarn jährlich getötet (destroyed) werden aus Mangel an den allergewöhnlichsten Vorsichtsmaßregeln."'
  en: '"When we find the rate of mortality four times as high in some streets as in others, and twice as high in whole classes of streets as in other classes, and further find that it is all but invariably high in those streets which are in bad condition, and almost invariably low in those whose condition is good, we cannot resist the conclusion that multitudes of our fellow-creatures, hundreds of our immediate neighbours, are annually destroyed for want of the most evident precautions."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '336'
- id: V.15.1
  kind: p
  original: Der Bericht über den Gesundheitszustand der arbeitenden Klassen enthält eine Angabe, die dasselbe Faktum beweist.
  en: The Report on the Sanitary Condition of the Working-Class contains information which attests the same fact.
  modern: ''
  modern_status: empty
  notes: ''
