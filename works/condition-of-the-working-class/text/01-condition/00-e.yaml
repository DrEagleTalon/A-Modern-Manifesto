section: E
title_original: Einleitung
title_en: Introduction
author: Friedrich Engels
date: 1844-11/1845-03
original_language: de
anchor_language: de
source_original: MEW 2, S. 225-506 (Dietz, Berlin 1972) via mlwerke.de; text of the first edition (Leipzig 1845), readings of the second edition (Stuttgart 1892) as variants
source_en: Florence Kelley Wischnewetzky's translation (New York 1887) in the London edition of 1892 (Swan Sonnenschein), Project Gutenberg ebook 17306 (public domain)
verses:
- id: E.0.1
  kind: heading
  original: Einleitung
  en: Introduction
  modern: ''
  modern_status: empty
  notes: ''
- id: E.1.1
  kind: p
  original: Die Geschichte der arbeitenden Klasse in England beginnt mit der letzten Hälfte des vorigen Jahrhunderts, mit der Erfindung der Dampfmaschine und der Maschinen zur Verarbeitung der Baumwolle.
  en: The history of the proletariat in England begins with the second half of the last century, with the invention of the steam-engine and of machinery for working cotton.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '237'
- id: E.1.2
  kind: p
  original: Diese Erfindungen gaben bekanntlich den Anstoß zu einer industriellen Revolution, einer Revolution, die zugleich die ganze bürgerliche Gesellschaft umwandelte und deren weltgeschichtliche Bedeutung erst jetzt anfängt erkannt zu werden.
  en: These inventions gave rise, as is well known, to an industrial revolution, a revolution which altered the whole civil society; one, the historical importance of which is only now beginning to be recognised.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '237'
- id: E.1.3
  kind: p
  original: England ist der klassische Boden dieser Umwälzung, die um so gewaltiger war, je geräuschloser sie vor sich ging, und England ist darum auch das klassische Land für die Entwicklung ihres hauptsächlichsten Resultates, des Proletariats.
  en: England is the classic soil of this transformation, which was all the mightier, the more silently it proceeded; and England is, therefore, the classic land of its chief product also, the proletariat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '237'
- id: E.1.4
  kind: p
  original: Das Proletariat kann nur in England in allen seinen Verhältnissen und nach allen Seiten hin studiert werden.
  en: Only in England can the proletariat be studied in all its relations and from all sides.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '237'
- id: E.2.1
  kind: p
  original: Wir haben es hier einstweilen nicht mit der Geschichte dieser Revolution, nicht mit ihrer ungeheuren Bedeutung für die Gegenwart und Zukunft zu tun.
  en: We have not, here and now, to deal with the history of this revolution, nor with its vast importance for the present and the future.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '237'
- id: E.2.2
  kind: p
  original: Diese Darstellung muß einer künftigen, umfassenderen Arbeit vorbehalten bleiben.
  en: Such a delineation must be reserved for a future, more comprehensive work.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '237'
- id: E.2.3
  kind: p
  original: Für den Augenblick müssen wir uns auf das wenige beschränken, das zum Verständnis der nachfolgenden Tatsachen, zum Verständnis der gegenwärtigen Lage der englischen Proletarier notwendig ist.
  en: For the moment, we must limit ourselves to the little that is necessary for understanding the facts that follow, for comprehending the present state of the English proletariat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '237'
- id: E.3.1
  kind: p
  original: Vor der Einführung der Maschinen geschah die Verspinnung und Verwebung der Rohstoffe im Hause des Arbeiters.
  en: Before the introduction of machinery, the spinning and weaving of raw materials was carried on in the working-man's home.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '237'
- id: E.3.2
  kind: p
  original: Frau und Töchter spannen Garn, das der Mann verwebte oder das sie verkauften, wenn der Familienvater nicht selbst es verarbeitete.
  en: Wife and daughter spun the yarn that the father wove or that they sold, if he did not work it up himself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '237'
- id: E.3.3
  kind: p
  original: Diese Weberfamilien lebten meist auf dem Lande, in der Nähe der Städte, und konnten mit ihrem Lohn ganz gut auskommen, da der heimische Markt noch für die Nachfrage nach Stoffen entscheidend, ja fast der einzige Markt war und die mit der Eroberung fremder Märkte, mit der Ausdehnung des Handels später hereinbrechende Übermacht der Konkurrenz noch nicht fühlbar auf den Arbeitslohn drückte.
  en: These weaver families lived in the country in the neighbourhood of the towns, and could get on fairly well with their wages, because the home market was almost the only one, and the crushing power of competition that came later, with the conquest of foreign markets and the extension of trade, did not yet press upon wages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '237'
- id: E.3.4
  kind: p
  original: Dazu kam eine dauernde Steigerung der Nachfrage im heimischen Markt, die mit der langsamen Vermehrung der Bevölkerung Schritt hielt und also sämtliche Arbeiter beschäftigte, und dann die Unmöglichkeit einer heftigen Konkurrenz der Arbeiter gegeneinander, die aus der ländlichen Vereinzelung ihrer Wohnungen entstand.
  en: There was, further, a constant increase in the demand for the home market, keeping pace with the slow increase in population and employing all the workers; and there was also the impossibility of vigorous competition of the workers among themselves, consequent upon the rural dispersion of their homes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 237-238
- id: E.3.5
  kind: p
  original: So kam es, daß der Weber meist imstande war, etwas zurückzulegen und sich ein kleines Grundstück zu pachten, das er in seinen Mußestunden - und deren hatte er so viele als er wollte, da er weben konnte, wann und wielange er Lust verspürte - bearbeitete.
  en: So it was that the weaver was usually in a position to lay by something, and rent a little piece of land, that he cultivated in his leisure hours, of which he had as many as he chose to take, since he could weave whenever and as long as he pleased.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '238'
- id: E.3.6
  kind: p
  original: Freilich war er ein schlechter Bauer und betrieb seine Ackerwirtschaft nachlässig und ohne viel reellen Ertrag; aber er war doch wenigstens kein Proletarier, er hatte, wie die Engländer sagen, einen Pfahl in den Boden seines Vaterlandes eingeschlagen, er war ansässig und stand um eine Stufe höher in der Gesellschaft als der jetzige englische Arbeiter.
  en: True, he was a bad farmer and managed his land inefficiently, often obtaining but poor crops; nevertheless, he was no proletarian, he had a stake in the country, he was permanently settled, and stood one step higher in society than the English workman of to-day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '238'
- id: E.4.1
  kind: p
  original: Auf diese Weise vegetierten die Arbeiter in einer ganz behaglichen Existenz und führten ein rechtschaffenes und geruhiges Leben in aller Gottseligkeit und Ehrbarkeit, ihre materielle Stellung war bei weitem besser als die ihrer Nachfolger; sie brauchten sich nicht zu überarbeiten, sie machten nicht mehr, als sie Lust hatten, und verdienten doch, was sie brauchten, sie hatten Muße für gesunde Arbeit in ihrem Garten oder Felde, eine Arbeit, die ihnen selbst schon Erholung war, und konnten außerdem noch an den Erholungen und Spielen ihrer Nachbarn teilnehmen; und alle diese Spiele, Kegel, Ballspiel usw., trugen zur Erhaltung der Gesundheit und zur Kräftigung ihres Körpers bei.
  en: So the workers vegetated throughout a passably comfortable existence, leading a righteous and peaceful life in all piety and probity; and their material position was far better than that of their successors. They did not need to overwork; they did no more than they chose to do, and yet earned what they needed. They had leisure for healthful work in garden or field, work which, in itself, was recreation for them, and they could take part besides in the recreations and games of their neighbours, and all these games--bowling, cricket, football, etc., contributed to their physical health and vigour.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '238'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: E.4.2
  kind: p
  original: Sie waren meist starke, wohlgebaute Leute, in deren Körperbildung wenig oder gar kein Unterschied von ihren bäurischen Nachbarn zu entdecken war.
  en: They were, for the most part, strong, well-built people, in whose physique little or no difference from that of their peasant neighbours was discoverable.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '238'
- id: E.4.3
  kind: p
  original: Ihre Kinder wuchsen in der freien Landluft auf, und wenn sie ihren Eltern bei der Arbeit helfen konnten, so kam dies doch nur dann und wann vor, und von einer acht- oder zwölfstündigen täglichen Arbeitszeit war keine Rede.
  en: Their children grew up in the fresh country air, and, if they could help their parents at work, it was only occasionally; while of eight or twelve hours work for them there was no question.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '238'
- id: E.5.1
  kind: p
  original: Was der moralische und intellektuelle Charakter dieser Klasse war, läßt sich erraten.
  en: What the moral and intellectual character of this class was may be guessed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '238'
- id: E.5.2
  kind: p
  original: Abgeschlossen von den Städten, in die sie nie hineinkamen, da das Garn und Gewebe an reisende Agenten gegen Auszahlung des Lohns abgeliefert wurde, so abgeschlossen, daß alte Leute, die ganz in der Nähe von Städten wohnten, doch nie hingingen, bis sie endlich durch die Maschinen ihres Erwerbs beraubt und gezwungen wurden, in den Städten sich nach Arbeit umzusehen, standen sie auf der moralischen und intellektuellen Stufe der Landleute, mit denen sie ohnehin noch durch ihre kleine Pachtung meistens unmittelbar verknüpft waren.
  en: Shut off from the towns, which they never entered, their yarn and woven stuff being delivered to travelling agents for payment of wages--so shut off that old people who lived quite in the neighbourhood of the town never went thither until they were robbed of their trade by the introduction of machinery and obliged to look about them in the towns for work--the weavers stood upon the moral and intellectual plane of the yeomen with whom they were usually immediately connected through their little holdings.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '238'
- id: E.5.3
  kind: p
  original: Sie sahen ihren Squire - den bedeutendsten Grundherrn der Gegend - für ihren natürlichen Vorgesetzten an, sie frugen ihn um Rat, legten ihm ihre kleinen Zwiste zur Entscheidung vor und gaben ihm alle Ehre, die dies patriarchalische Verhältnis mit sich brachte.
  en: They regarded their squire, the greatest landholder of the region, as their natural superior; they asked advice of him, laid their small disputes before him for settlement, and gave him all honour, as this patriarchal relation involved.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '238'
- id: E.5.4
  kind: p
  original: Sie waren "respektable" Leute und gute Familienväter, lebten moralisch, weil sie keine Veranlassung hatten, unmoralisch zu sein, da keine Schenken und liederlichen Häuser in ihrer Nähe waren, und weil der Wirt, bei dem sie dann und wann ihren Durst löschten, auch ein respektabler Mann und meist ein größer Pächter war, der auf gutes Bier, gute Ordnung und frühen Feierabend hielt.
  en: They were "respectable" people, good husbands and fathers, led moral lives because they had no temptation to be immoral, there being no groggeries or low houses in their vicinity, and because the host, at whose inn they now and then quenched their thirst, was also a respectable man, usually a large tenant farmer who took pride in his good order, good beer, and early hours.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 238-239
- id: E.5.5
  kind: p
  original: Sie hatten ihre Kinder den Tag über im Hause bei sich und erzogen sie in Gehorsam und der Gottesfurcht; das patriarchalische Familienverhältnis blieb ungestört, solange die Kinder noch nicht selbst verheiratet waren; die jungen Leute wuchsen in idyllischer Einfalt und Vertraulichkeit mit ihren Gespielen heran, bis sie heirateten, und wenn auch geschlechtlicher Verkehr vor der Ehe fast durchgängig vorkam, geschah dies doch nur, wo die moralische Verpflichtung zur Ehe von beiden Seiten anerkannt war, und die nachfolgende Heirat brachte alles wieder ins gleiche.
  en: They had their children the whole day at home, and brought them up in obedience and the fear of God; the patriarchal relationship remained undisturbed so long as the children were unmarried. The young people grew up in idyllic simplicity and intimacy with their playmates until they married; and even though sexual intercourse before marriage almost unfailingly took place, this happened only when the moral obligation of marriage was recognised on both sides, and a subsequent wedding made everything good.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '239'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.5.6
  kind: p
  original: Kurz, die damaligen englischen Industriearbeiter lebten und dachten auf dieselbe Weise, wie man es in Deutschland noch hie und da findet, in Abgeschlossenheit und Zurückgezogenheit, ohne geistige Tätigkeit und ohne gewaltsame Schwankungen in ihrer Lebenslage.
  en: In short, the English industrial workers of those days lived and thought after the fashion still to be found here and there in Germany, in retirement and seclusion, without mental activity and without violent fluctuations in their position in life.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '239'
- id: E.5.7
  kind: p
  original: Sie konnten selten lesen und noch viel weniger schreiben, gingen regelmäßig in die Kirche, politisierten nicht, konspirierten nicht, dachten nicht, ergötzten sich an körperlichen Übungen, hörten die Bibel mit angestammter Andacht vorlesen und vertrugen sich bei ihrer anspruchslosen Demut mit den angeseheneren Klassen der Gesellschaft ganz vortrefflich.
  en: They could rarely read and far more rarely write; went regularly to church, never talked politics, never conspired, never thought, delighted in physical exercises, listened with inherited reverence when the Bible was read, and were, in their unquestioning humility, exceedingly well-disposed towards the "superior" classes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '239'
- id: E.5.8
  kind: p
  original: Dafür aber waren sie auch geistig tot, lebten nur für ihre kleinlichen Privatinteressen, für ihren Webstuhl und ihr Gärtchen und wußten nichts von der gewaltigen Bewegung, die draußen durch die Menschheit ging.
  en: But intellectually, they were dead; lived only for their petty, private interest, for their looms and gardens, and knew nothing of the mighty movement which, beyond their horizon, was sweeping through mankind.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '239'
- id: E.5.9
  kind: p
  original: Sie fühlten sich behaglich in ihrem stillen Pflanzenleben und wären ohne die industrielle Revolution nie herausgetreten aus dieser allerdings sehr romantisch-gemütlichen, aber doch eines Menschen unwürdigen Existenz.
  en: They were comfortable in their silent vegetation, and but for the industrial revolution they would never have emerged from this existence, which, cosily romantic as it was, was nevertheless not worthy of human beings.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '239'
- id: E.5.10
  kind: p
  original: Sie waren eben keine Menschen, sondern bloß arbeitende Maschinen im Dienst der wenigen Aristokraten, die bis dahin die Geschichte geleitet hatten; die industrielle Revolution hat auch nur die Konsequenz hiervon durchgesetzt, indem sie die Arbeiter vollends zu bloßen Maschinen machte und ihnen den letzten Rest selbständiger Tätigkeit unter den Händen wegnahm, sie aber eben dadurch zum Denken und zur Forderung einer menschlichen Stellung antrieb.
  en: In truth, they were not human beings; they were merely toiling machines in the service of the few aristocrats who had guided history down to that time. The industrial revolution has simply carried this out to its logical end by making the workers machines pure and simple, taking from them the last trace of independent activity, and so forcing them to think and demand a position worthy of men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '239'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.5.11
  kind: p
  original: Wie in Frankreich die Politik, so war es in England die Industrie und die Bewegung der bürgerlichen Gesellschaft überhaupt, die die letzten in der Apathie gegen allgemein menschliche Interessen versunkenen Klassen in den Strudel der Geschichte hineinriß.
  en: As in France politics, so in England manufacture, and the movement of civil society in general drew into the whirl of history the last classes which had remained sunk in apathetic indifference to the universal interests of mankind.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '239'
- id: E.6.1
  kind: p
  original: Die erste Erfindung, die in der bisherigen Lage der englischen Arbeiter eine durchgreifende Veränderung hervorbrachte, war die Jenny des Webers James Hargreaves zu Standhill bei Blackburn in Nord-Lancashire (1764).
  en: The first invention which gave rise to a radical change in the state of the English workers was the jenny, invented in the year 1764 by a weaver, James Hargreaves, of Standhill, near Blackburn, in North Lancashire.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 239-240
- id: E.6.2
  kind: p
  original: Diese Maschine war der rohe Anfang der späteren Mule und wurde mit der Hand in Bewegung gesetzt, hatte aber statt einer Spindel, wie das gewöhnliche Handspinnrad, deren sechzehn bis achtzehn, die von einem einzigen Arbeiter getrieben wurden.
  en: This machine was the rough beginning of the later invented mule, and was moved by hand. Instead of one spindle like the ordinary spinning-wheel, it carried sixteen or eighteen manipulated by a single workman.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '240'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.6.3
  kind: p
  original: Hierdurch wurde es möglich, bedeutend mehr Garn zu liefern als bisher; während früher, wo ein Weber immer drei Spinnerinnen beschäftigt hielt, nie genug Garn dagewesen war und der Weber oft auf Garn hatte warten müssen, war jetzt mehr Garn da, als von den vorhandenen Arbeitern verwebt werden konnte.
  en: This invention made it possible to deliver more yarn than heretofore. Whereas, though one weaver had employed three spinners, there had never been enough yarn, and the weaver had often been obliged to wait for it, there was now more yarn to be had than could be woven by the available workers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '240'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.6.4
  kind: p
  original: Die Nachfrage nach gewebten Zeugen, die ohnehin im Zuwachs war, stieg noch mehr durch den billigeren Preis dieser Zeuge, der aus den durch die neue Maschine erniedrigten Produktionskosten des Garns folgte; es waren mehr Weber nötig, und der Weblohn stieg.
  en: The demand for woven goods, already increasing, rose yet more in consequence of the cheapness of these goods, which cheapness, in turn, was the outcome of the diminished cost of producing the yarn. More weavers were needed, and weavers' wages rose.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '240'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.6.5
  kind: p
  original: Jetzt, da der Weber mehr an seinem Stuhl verdienen konnte, ließ er seine Ackerbaubeschäftigung allmählich fallen und legte sich ganz aufs Weben.
  en: Now that the weaver could earn more at his loom, he gradually abandoned his farming, and gave his whole time to weaving.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '240'
- id: E.6.6
  kind: p
  original: Um diese Zeit konnte eine Familie von vier Erwachsenen und zwei Kindern, die zum Spulen angehalten wurden, bei täglich zehnstündiger Arbeit vier Pfund Sterling - achtundzwanzig Taler preußisch Kurant - in der Woche verdienen, und oft noch mehr, wenn das Geschäft gut ging und die Arbeit drängte; es kam oft genug vor, daß ein einzelner Weber an seinem Stuhl wöchentlich zwei Pfund verdiente.
  en: At that time a family of four grown persons and two children (who were set to spooling) could earn, with eight hours' daily work, four pounds sterling in a week, and often more if trade was good and work pressed. It happened often enough that a single weaver earned two pounds a week at his loom.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '240'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.6.7
  kind: p
  original: Nach und nach verschwand so die Klasse der ackerbauenden Weber ganz und löste sich in die neuentstehende Klasse der bloßen Weber auf, die allein vom Arbeitslohn lebten, gar keinen Besitz, nicht einmal den Scheinbesitz einer Pachtung hatten und somit Proletarier (working men) wurden.
  en: By degrees the class of farming weavers wholly disappeared, and was merged in the newly arising class of weavers who lived wholly upon wages, had no property whatever, not even the pretended property of a holding, and so became working-men, proletarians.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '240'
- id: E.6.8
  kind: p
  original: Hierzu kam noch, daß auch das alte Verhältnis des Spinners zum Weber aufgehoben wurde.
  en: Moreover, the old relation between spinner and weaver was destroyed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '240'
- id: E.6.9
  kind: p
  original: Bisher war, soweit dies anging, unter einem Dach das Garn gesponnen und verwoben worden.
  en: Hitherto, so far as this had been possible, yarn had been spun and woven under one roof.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '240'
- id: E.6.10
  kind: p
  original: Jetzt, wo die Jenny ebensogut wie der Webstuhl eine kräftige Hand erforderte, fingen auch Männer an zu spinnen, und ganze Familien lebten von ihr allein, während andre wiederum das jetzt veraltete und überflügelte Spinnrad beiseite stellen und, wenn ihnen die Mittel zum Ankauf einer Jenny fehlten, allein von dem Webstuhl des Familienvaters leben mußten.
  en: Now that the jenny as well as the loom required a strong hand, men began to spin, and whole families lived by spinning, while others laid the antiquated, superseded spinning-wheel aside; and, if they had not means of purchasing a jenny, were forced to live upon the wages of the father alone.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '240'
- id: E.6.11
  kind: p
  original: Hiermit fing die in der späteren Industrie so unendlich ausgebildete Teilung der Arbeit beim Weben und Spinnen an.
  en: Thus began with spinning and weaving that division of labour which has since been so infinitely perfected.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '240'
- id: E.6.12
  kind: p
  original: Während so schon mit der ersten noch sehr unvollkommnen Maschine das industrielle Proletariat sich entwickelte, gab dieselbe Maschine Anlaß zur Entstehung auch des Ackerbauproletariats.
  en: While the industrial proletariat was thus developing with the first still very imperfect machine, the same machine gave rise to the agricultural proletariat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '240'
- id: E.6.13
  kind: p
  original: Bisher hatte es eine große Menge kleiner Grundeigentümer gegeben, die Yeomen genannt wurden und die in derselben Stille und Gedankenlosigkeit hinvegetiert hatten wie ihre Nachbarn, die ackerbauenden Weber.
  en: There had, hitherto, been a vast number of small landowners, yeomen, who had vegetated in the same unthinking quiet as their neighbours, the farming weavers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '240'
- id: E.6.14
  kind: p
  original: Sie bebauten ihre Fleckchen Land ganz in der alten nachlässigen Weise ihrer Väter und widersetzten sich jeder Neuerung mit der Hartnäckigkeit, die solchen durch eine Reihe von Generationen stabil gebliebenen Gewohnheitsmenschen eigentümlich ist.
  en: They cultivated their scraps of land quite after the ancient and inefficient fashion of their ancestors, and opposed every change with the obstinacy peculiar to such creatures of habit, after remaining stationary from generation to generation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 240-241
- id: E.6.15
  kind: p
  original: Unter ihnen gab es auch viele kleine Pächter, aber nicht Pächter im heutigen Sinne des Worts, sondern Leute, die entweder durch vertragsmäßige Erbpacht oder kraft alter Sitte ihr Fleckchen Land von ihren Vätern und Großvätern überkommen und darauf bisher so fest gesessen hatten, als ob es ihnen eigentümlich gehöre.
  en: Among them were many small holders also, not tenants in the present sense of the word, but people who had their land handed down from their fathers, either by hereditary lease, or by force of ancient custom, and had hitherto held it as securely as if it had actually been their own property.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '241'
- id: E.6.16
  kind: p
  original: Jetzt wurden, da sich die Industriearbeiter vom Ackerbau zurückzogen, eine Menge Grundstücke frei, und auf ihnen nistete sich die neue Klasse der großen Pächter ein, die fünfzig, hundert, zweihundert und mehr Morgen zusammen in Pacht nahmen, tenants-at-will waren, d.h. Pächter, deren Pacht jedes Jahr gekündigt werden konnte, und die nun durch besseren Ackerbau und großartigere Wirtschaft den Ertrag der Grundstücke zu steigern wußten.
  en: When the industrial workers withdrew from agriculture, a great number of small holdings fell idle, and upon these the new class of large tenants established themselves, tenants-at-will, holding fifty, one hundred, two hundred or more acres, liable to be turned out at the end of the year, but able by improved tillage and larger farming to increase the yield of the land.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '241'
- id: E.6.17
  kind: p
  original: Sie konnten ihre Produkte wohlfeiler verkaufen als der kleine Yeoman, und diesem blieb nun, da sein Grundstück ihn nicht mehr ernährte, nichts übrig, als es zu verkaufen und entweder eine Jenny oder einen Webstuhl anzuschaffen oder sich als Tagelöhner, Ackerbauproletarier, bei dem großen Pächter zu verdingen.
  en: They could sell their produce more cheaply than the yeomen, for whom nothing remained when his farm no longer supported him but to sell it, procure a jenny or a loom, or take service as an agricultural labourer in the employ of a large farmer.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '241'
- id: E.6.18
  kind: p
  original: Seine angestammte Trägheit und die nachlässige Art der Bebauung seines Grundstücks, die er von seinen Vorfahren überkommen hatte und über die er sich nicht erheben konnte, ließen ihm nichts andres übrig, als er in die Notwendigkeit gesetzt wurde, gegen Leute zu konkurrieren, die ihre Pacht nach vernünftigeren Prinzipien und mit allen Vorteilen betrieben, die eine große Wirtschaft und die Anlage von Kapitalien in der Verbesserung des Bodens in die Hand geben.
  en: His inherited slowness and the inefficient methods of cultivation bequeathed by his ancestors, and above which he could not rise, left him no alternative when forced to compete with men who managed their holdings on sounder principles and with all the advantages bestowed by farming on a large scale and the investment of capital for the improvement of the soil.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '241'
- id: E.7.1
  kind: p
  original: Die Bewegung der Industrie blieb indes hierbei nicht stehen.
  en: Meanwhile, the industrial movement did not stop here.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '241'
- id: E.7.2
  kind: p
  original: Einzelne Kapitalisten fingen an, Jennys in großen Gebäuden aufzustellen und durch Wasserkraft zu treiben, wodurch sie in den Stand gesetzt wurden, die Arbeiterzahl verringern und ihr Garn wohlfeiler zu verkaufen als die einzelnen Spinner, die bloß mit der Hand die Maschine bewegten.
  en: Single capitalists began to set up spinning jennies in great buildings and to use water-power for driving them, so placing themselves in a position to diminish the number of workers, and sell their yarn more cheaply than single spinners could do who moved their own machines by hand.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '241'
- id: E.7.3
  kind: p
  original: Es fielen fortwährend Verbesserungen der Jenny vor, so daß jeden Augenblick eine Maschine veraltet war und verändert oder gar beiseite geworfen werden mußte; und wenn der Kapitalist durch Anwendung der Wasserkraft selbst mit älteren Maschinen noch bestehen konnte, so war dies dem einzelnen Spinner auf die Dauer unmöglich.
  en: There were constant improvements in the jenny, so that machines continually became antiquated, and must be altered or even laid aside; and though the capitalists could hold out by the application of water-power even with the old machinery, for the single spinner this was impossible.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '241'
- id: E.7.4
  kind: p
  original: Und wenn schon hierin der Anfang des Fabriksystems lag, so erhielt dies durch die Spinning-Throstle, die Richard Arkwright, ein Barbier aus Preston in Nord-Lancashire, 1767 erfand, eine neue Ausdehnung.
  en: And the factory system, the beginning of which was thus made, received a fresh extension in 1767, through the spinning throstle invented by Richard Arkwright, a barber, in Preston, in North Lancashire.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '241'
- id: E.7.5
  kind: p
  original: Diese Maschine, im deutschen gewöhnlich Kettenstuhl genannt, ist neben der Dampfmaschine die wichtigste mechanische Erfindung des achtzehnten Jahrhunderts.
  en: After the steam-engine, this is the most important mechanical invention of the 18th century.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '241'
- id: E.7.6
  kind: p
  original: Sie ist von vorn herein auf eine mechanische Triebkraft berechnet und auf ganz neuen Prinzipien basiert.
  en: It was calculated from the beginning for mechanical motive power, and was based upon wholly new principles.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '241'
- id: E.7.7
  kind: p
  original: Durch die Vereinigung der Eigentümlichkeiten der Jenny und des Kettenstuhls brachte Samuel Crompton aus Firwood (Lancashire) 1785 die Mule zustande, und da Arkwright um dieselbe Zeit die Kardier - und Vorspinnmaschinen erfand, so war hierdurch für das Spinnen der Baumwolle das Fabriksystem zum allein herrschenden geworden.
  en: By the combination of the peculiarities of the jenny and throstle, Samuel Crompton, of Firwood, Lancashire, contrived the mule in 1785, and as Arkwright invented the carding engine, and preparatory ("slubbing and roving") frames about the same time, the factory system became the prevailing one for the spinning of cotton.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 241-242
- id: E.7.8
  kind: p
  original: Allmählich fing man an, diese Maschinen durch einige unbedeutende Veränderungen auf das Spinnen der Wolle und später (im ersten Jahrzehnt dieses Jahrhunderts) auch des Flachses anwendbar zu machen und dadurch auch hier die Handarbeit zu verdrängen.
  en: By means of trifling modifications these machines were gradually adapted to the spinning of flax, and so to the superseding of hand-work here, too. But even then, the end was not yet.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '242'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.7.9
  kind: p
  original: Auch hierbei blieb es nicht; in den letzten Jahren des vorigen Jahrhunderts hatte Dr. Cartwright, ein Landpfarrer, den mechanischen Webstuhl erfunden und gegen 1804 so weit gebracht, daß er erfolgreich gegen die Handweber konkurrieren konnte; und alle diese Maschinen erhielten doppelte Wichtigkeit durch James Watts Dampfmaschine, die um 1764 erfunden und seit 1785 zur Betreibung von Spinnmaschinen angewandt worden war.
  en: In the closing years of the last century, Dr. Cartwright, a country parson, had invented the power-loom, and about 1804 had so far perfected it, that it could successfully compete with the hand-weaver; and all this machinery was made doubly important by James Watt's steam-engine, invented in 1764, and used for supplying motive power for spinning since 1785.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '242'
- id: E.8.1
  kind: p
  original: Mit diesen Erfindungen, die seitdem noch jedes Jahr verbessert wurden, war der Sieg der Maschinenarbeit über die Handarbeit in den Hauptzweigen der englischen Industrie entschieden, und die ganze Geschichte dieser letzteren berichtet von nun an nur, wie die Handarbeiter aus einer Position nach der andern durch die Maschinen vertrieben wurden.
  en: With these inventions, since improved from year to year, the victory of machine-work over hand-work in the chief branches of English industry was won; and the history of the latter from that time forward simply relates how the hand-workers have been driven by machinery from one position after another.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '242'
- id: E.8.2
  kind: p
  original: Die Folgen hiervon waren auf der einen Seite rasches Fallen der Preise aller Manufakturwaren, Aufblühen des Handels und der Industrie, Eroberung fast aller unbeschützten fremden Märkte, rasche Vermehrung der Kapitalien und des Nationalreichtums; auf der andern eine noch viel raschere Vermehrung des Proletariats, Zerstörung alles Besitzes, aller Sicherheit des Erwerbs für die arbeitende Klasse, Demoralisation, politische Aufregung und alle die den besitzenden Engländern so höchst widerwärtige Tatsachen, die wir in den nachfolgenden Bogen zu betrachten haben werden.
  en: The consequences of this were, on the one hand, a rapid fall in price of all manufactured commodities, prosperity of commerce and manufacture, the conquest of nearly all the unprotected foreign markets, the sudden multiplication of capital and national wealth; on the other hand, a still more rapid multiplication of the proletariat, the destruction of all property-holding and of all security of employment for the working-class, demoralisation, political excitement, and all those facts so highly repugnant to Englishmen in comfortable circumstances, which we shall have to consider in the following pages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '242'
- id: E.8.3
  kind: p
  original: Haben wir schon oben gesehen, welche Umwälzung in den gesellschaftlichen Verhältnissen der unteren Klassen eine einzige unbeholfene Maschine wie die Jenny hervorbrachte, so wird man sich nicht mehr über das wundern, was ein vollständig ineinandergreifendes System fein ausgearbeiteter Maschinerie bewirkt, welches das rohe Material von uns empfängt und uns fertiggewebten Stoff zurückgibt.
  en: Having already seen what a transformation in the social condition of the lower classes a single such clumsy machine as the jenny had wrought, there is no cause for surprise as to that which a complete and interdependent system of finely adjusted machinery has brought about, machinery which receives raw material and turns out woven goods.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '242'
- id: E.9.1
  kind: p
  original: Verfolgen wir indes die Entwicklung der englischen Industrie etwas genauer und fangen wir mit ihrem Hauptzweige, der Baumwollenindustrie an.
  en: Meanwhile, let us trace the development of English manufacture somewhat more minutely, beginning with the cotton industry.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - E.N1
  variants:
  - ref: T1
    editions: '1845'
    reading: Im Original (1845) Verwicklung; (1892) Entwicklung
    base_text: … wir indes die Entwicklung ‸ der englischen Industrie etwas …
  mew_page: 242-243
- id: E.9.2
  kind: p
  original: In den Jahren 1771 bis 1775 wurden im Durchschnitt jährlich weniger als fünf Millionen Pfund roher Baumwolle importiert, im Jahre 1841 achtundzwanzig Millionen, und die Einfuhr von 1844 wird mindestens sechshundert Millionen Pfund betragen.
  en: In the years 1771-1775, there were annually imported into England rather less than 5,000,000 pounds of raw cotton; in the year 1841 there were imported 528,000,000 pounds, and the import for 1844 will reach at least 600,000,000 pounds.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '243'
- id: E.9.3
  kind: p
  original: 1834 exportierte England 556 Millionen Yards gewebter Baumwollenstoffe, 76 1/2 Millionen Pfund Baumwollengarns und für 1 200 000 Pfd. St. baumwollene Strumpfwaren.
  en: In 1834 England exported 556,000,000 yards of woven cotton goods, 76,500,000 pounds of cotton yarn, and cotton hosiery of the value of 1,200,000 pounds.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '243'
- id: E.9.4
  kind: p
  original: In demselben Jahre arbeiteten über acht Millionen Mulespindeln, 110 000 mechanische und 250 000 Handwebstühle, ungerechnet die Kettenstuhlspindeln, im Dienst der Baumwollenindustrie, und nach MacCullochs Berechnung lebten damals direkt oder indirekt beinahe anderthalb Millionen Menschen in den drei Reichen von diesem Industriezweige, von denen 220 000 allein in den Fabriken arbeiteten; die Kraft, die von diesen Fabriken gebraucht wurde, war 33 000 Pferde Dampfkraft und 11 000 Pferde Wasserkraft.
  en: In the same year over 8,000,000 mule spindles were at work, 110,000 power and 250,000 hand-looms, throstle spindles not included, in the service of the cotton industry; and, according to MacCulloch's reckoning, nearly a million and a half human beings were supported by this branch, of whom but 220,000 worked in the mills; the power used in these mills was steam, equivalent to 33,000 horse-power, and water, equivalent to 11,000 horse-power.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '243'
- id: E.9.5
  kind: p
  original: Jetzt reichen alle diese Zahlen bei weitem nicht mehr aus, und man wird ruhig annehmen können, daß im Jahre 1845 die Kraft und die Zahl der Maschinen sowie die Zahl der Arbeiter um die Hälfte größer sein wird als 1834.
  en: At present these figures are far from adequate, and it may be safely assumed that, in the year 1845, the power and number of the machines and the number of the workers is greater by one-half than it was in 1834.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '243'
- id: E.9.6
  kind: p
  original: Der Hauptsitz dieser Industrie ist Lancashire, von wo sie auch ausging; sie hat diese Grafschaft durch und durch revolutioniert, aus einem obskuren, schlecht bebauten Sumpf in eine belebte, arbeitsame Gegend umgeschaffen, ihre Bevölkerung in achtzig Jahren verzehnfacht und Riesenstädte wie Liverpool und Manchester mit zusammen 700 000 Einwohnern und ihre Nebenstädte Bolton (60 000 Einw.), Rochdale (75 000 Einw.), Oldham (50 000 Einw.), Preston (60 000 Einw.), Ashton und Stalybridge (40 000 Einw.) und eine ganze Masse andere Fabrikstädte wie mit einem Zauberschlage aus dem Boden wachsen lassen.
  en: The chief centre of this industry is Lancashire, where it originated; it has thoroughly revolutionised this county, converting it from an obscure, ill-cultivated swamp into a busy, lively region, multiplying its population tenfold in eighty years, and causing giant cities such as Liverpool and Manchester, containing together 700,000 inhabitants, and their neighbouring towns, Bolton with 60,000, Rochdale with 75,000, Oldham with 50,000, Preston with 60,000, Ashton and Stalybridge with 40,000, and a whole list of other manufacturing towns to spring up as if by a magic touch.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '243'
- id: E.9.7
  kind: p
  original: Die Geschichte von Süd-Lancashire weiß von den größten Wundern der neueren Zeit, und doch spricht kein Mensch von ihr, und alle diese Wunder hat die Bauenwollenindustrie zuwege gebracht.
  en: The history of South Lancashire contains some of the greatest marvels of modern times, yet no one ever mentions them, and all these miracles are the product of the cotton industry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '243'
- id: E.9.8
  kind: p
  original: Außerdem bildet Glasgow ein zweites Zentrum für den Baumwollendistrikt Schottlands, Lanarkshire und Renfrewshire, und auch hier hat die Bevölkerung der Zentralstadt sich seit der Einführung dieser Industrie von 30 000 auf 300 000 vermehrt.
  en: Glasgow, too, the centre for the cotton district of Scotland, for Lanarkshire and Renfrewshire, has increased in population from 30,000 to 300,000 since the introduction of the industry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '243'
- id: E.9.9
  kind: p
  original: Die Strumpfwirkerei von Nottingham und Derby erhielt durch die erniedrigten Garnpreise ebenfalls einen neuen Anstoß, und einen zweiten durch eine Verbesserung des Strumpfstuhls, wodurch mit einem Stuhl zwei Strümpfe zu gleicher Zeit gewebt werden konnten; die Spitzenfabrikation wurde seit 1777, in welchem Jahre die Lace-Maschine erfunden wurde, ebenfalls ein bedeutender Industriezweig; bald erfand Lindley die Point-net-Maschine und 1809 Heathcote die Bobbinet-Maschine, wodurch die Verfertigung von Spitzen unendlich vereinfacht und der Verbrauch infolge der billigen Preise ebensosehr gesteigert wurde, so daß jetzt mindestens 200 000 Menschen von dieser Fabrikation sich ernähren.
  en: The hosiery manufacture of Nottingham and Derby also received one fresh impulse from the lower price of yarn, and a second one from an improvement of the stocking loom, by means of which two stockings could be woven at once. The manufacture of lace, too, became an important branch of industry after the invention of the lace machine in 1777; soon after that date Lindley invented the point-net machine, and in 1809 Heathcote invented the bobbin-net machine, in consequence of which the production of lace was greatly simplified, and the demand increased proportionately in consequence of the diminished cost, so that now, at least 200,000 persons are supported by this industry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 243-244
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.9.10
  kind: p
  original: Sie hat ihre Hauptsitze in Nottingham, Leicester und dem Westen von England (Wiltshire, Devonshire etc.).
  en: Its chief centres are Nottingham, Leicester, and the West of England, Wiltshire, Devonshire, etc. A corresponding extension has taken place in the branches dependent upon the cotton industry, in dyeing, bleaching, and printing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '244'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: E.9.11
  kind: p
  original: Dieselbe Ausdehnung haben die von der Baumwollenindustrie abhängigen Arbeitszweige, das Bleichen, Färben und Drucken, erfahren.
  en: ''
  joined_to: E.9.10
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '244'
- id: E.9.12
  kind: p
  original: Die Bleicherei erhielt durch die Anwendung von Chlor statt des Sauerstoffs in der Schnellbleiche, die Färberei und Druckerei durch die rasche Entwicklung der Chemie und die Druckerei durch eine Reihe der glänzendsten mechanischen Erfindungen außerdem noch einen Aufschwung, der neben der durch die Zunahme der Baumwollenfabrikation bedingten Ausdehnung dieser Geschäftsbranchen sie zu einer vorher nie gekannten Blüte erhob.
  en: Bleaching by the application of chlorine in place of the oxygen of the atmosphere; dyeing and printing by the rapid development of chemistry, and printing by a series of most brilliant mechanical inventions, a yet greater advance which, with the extension of these branches caused by the growth of the cotton industry, raised them to a previously unknown degree of prosperity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '244'
- id: E.10.1
  kind: p
  original: In der Verarbeitung der Wolle entwickelte sich dieselbe Tätigkeit.
  en: The same activity manifested itself in the manufacture of wool.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '244'
- id: E.10.2
  kind: p
  original: Sie war bisher der Hauptzweig der englischen Industrie gewesen, aber die Masse der Produktion in jenen Jahren ist nichts gegen das, was heute fabriziert wird.
  en: This had hitherto been the leading department of English industry, but the quantities formerly produced are as nothing in comparison with that which is now manufactured.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '244'
- id: E.10.3
  kind: p
  original: 1782 lag die ganze Wollernte der vorhergehenden drei Jahre aus Mangel an Arbeitern noch unverarbeitet da und hätte liegenbleiben müssen, wenn nicht die neuerfundne Maschinerie zu Hülfe gekommen wäre und sie versponnen hätte.
  en: In 1782 the whole wool crop of the preceding three years lay unused for want of workers, and would have continued so to lie if the newly invented machinery had not come to its assistance and spun it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '244'
- id: E.10.4
  kind: p
  original: Die Übertragung dieser Maschinen auf die Wollspinnerei wurde mit dem besten Erfolg durchgeführt.
  en: The adaptation of this machinery to the spinning of wool was most successfully accomplished.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '244'
- id: E.10.5
  kind: p
  original: Jetzt trat in den Wollbezirken dieselbe rasche Entwicklung ein, die wir in den Baumwolldistrikten gesehen haben.
  en: Then began the same sudden development in the wool district, which we have already seen in the cotton districts.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '244'
- id: E.10.6
  kind: p
  original: 1738 waren im West Riding von Yorkshire 75 000 Stück wollne Tuche gemacht worden, 1817 wurden 490 000 gemacht, und so rasch war die Ausdehnung der Wollenindustrie, daß 1834 schon 450 000 Stück Tuche mehr ausgeführt wurden als 1825.
  en: In 1738 there were 75,000 pieces of woollen cloth produced in the West Riding of Yorkshire; in 1817 there were 490,000 pieces, and so rapid was the extension of the industry that in 1834, 450,000 more pieces were produced than in 1825.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '244'
- id: E.10.7
  kind: p
  original: 1801 wurden 101 Millionen Pfund Wolle (wovon 7 Millionen importierte) verarbeitet, 1835 180 Millionen Pfund (wovon 42 Millionen importierte).
  en: In 1801, 101,000,000 pounds of wool (7,000,000 pounds of it imported) were worked up; in 1835, 180,000,000 pounds were worked up; of which 42,000,000 pounds were imported.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '244'
- id: E.10.8
  kind: p
  original: Der Hauptbezirk dieser Industrie ist das West Riding von Yorkshire, wo in Bradford namentlich die lange englische Wolle zu Strickgarnen etc., und in den übrigen Städten, Leeds, Halifax, Huddersfield etc., die kurze Wolle zu festgedrehten Garnen und zur Tuchweberei verarbeitet wird; dann der angrenzende Teil von Lancashire, die Gegend von Rochdale, wo neben der Baumwollverarbeitung viel Flanell gemacht wird, und der Westen von England, der die feinsten Tuche fabriziert.
  en: The principal centre of this industry is the West Riding of Yorkshire, where, especially at Bradford, long English wool is converted into worsted yarns, etc.; while in the other cities, Leeds, Halifax, Huddersfield, etc., short wool is converted into hard-spun yarn and cloth. Then come the adjacent part of Lancashire, the region of Rochdale, where in addition to the cotton industry much flannel is produced, and the West of England which supplies the finest cloths.
  modern: ''
  modern_status: empty
