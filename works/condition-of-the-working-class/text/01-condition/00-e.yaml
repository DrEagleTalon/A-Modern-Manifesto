- id: E.12.1
  kind: p
  original: Der Fortschritt entwickelte sich in der Leinenindustrie später, weil hier die natürliche Beschaffenheit des rohen Materials die Anwendung der Spinnmaschine sehr erschwerte.
  en: Progress in the linen trade developed later, because the nature of the raw material made the application of spinning machinery very difficult.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '245'
- id: E.12.2
  kind: p
  original: Zwar wurden schon in den letzten Jahren des vorigen Jahrhunderts in Schottland derartige Versuche gemacht, indes erst 1810 gelang es dem Franzosen Girard, die Flachsspinnerei auf eine praktische Weise einzurichten, und selbst Girards Maschinen erlangten erst durch die Verbesserungen, die sie in England erfuhren, und ihre allgemeine Anwendung in Leeds, Dundee und Belfast auf britischem Boden die Bedeutung, die ihnen gebührte.
  en: Attempts had been made in the last years of the last century in Scotland, but the Frenchman, Girard, who introduced flax spinning in 1810, was the first who succeeded practically, and even Girard's machines first attained on British soil the importance they deserved by means of improvements which they underwent in England, and of their universal application in Leeds, Dundee, and Belfast.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '245'
- id: E.12.3
  kind: p
  original: Jetzt aber dehnte sich die englische Leinenindustrie rasch aus.
  en: From this time the British linen trade rapidly extended.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '245'
- id: E.12.4
  kind: p
  original: 1814 wurden nach Dundee 3 000 Tons Flachs importiert, 1833 an 19 000 Tons Flachs und 3400 Tons Hanf.
  en: In 1814, 3,000 tons of flax were imported; in 1833, nearly 19,000 tons of flax and 3,400 tons of hemp.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - E.N2
  mew_page: '245'
- id: E.12.5
  kind: p
  original: Die Ausfuhr irischer Leinen nach Großbritannien stieg von 32 Millionen Yards (1800) auf 53 Millionen (1825), von denen ein großer Teil wieder exportiert wurde, die Ausfuhr englischer und schottischer Leinengewebe stieg von 24 Millionen Yards (1820) auf 51 Millionen (1833).
  en: The export of Irish linen to Great Britain rose from 32,000,000 yards in 1800 to 53,000,000 in 1825, of which a large part was re-exported. The export of English and Scotch woven linen goods rose from 24,000,000 yards in 1820 to 51,000,000 yards in 1833.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '245'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.12.6
  kind: p
  original: Die Zahl der Flachsspinnereien belief sich 1835 auf 347 mit 33 000 Arbeitern; davon waren die Hälfte im südlichen Schottland, über 60 im West Riding von Yorkshire (Leeds und Umgegend), 25 in Belfast in Irland und die übrigen in Dorsetshire und Lancashire.
  en: The number of flax spinning establishments in 1835 was 347, employing 33,000 workers, of which one-half were in the South of Scotland, more than 60 in the West Riding of Yorkshire, Leeds, and its environs, 25 in Belfast, Ireland, and the rest in Dorset and Lancashire.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '245'
- id: E.12.7
  kind: p
  original: Die Weberei wird im südlichen Schottland und hier und da in England, besonders aber in Irland betrieben.
  en: Weaving is carried on in the South of Scotland, here and there in England, but principally in Ireland.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '245'
- id: E.13.1
  kind: p
  original: Mit gleichem Erfolge legten sich die Engländer auf die Verarbeitung der Seide.
  en: With like success did the English turn their attention to the manufacture of silk.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '245'
- id: E.13.2
  kind: p
  original: Hier bekamen sie das Material aus Südeuropa und Asien fertig gesponnen, und die Hauptarbeit war das Zusammendrehen der feinen Fäden (Tramieren).
  en: Raw material was imported from Southern Europe and Asia ready spun, and the chief labour lay in the twisting of fine threads.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '245'
- id: E.13.3
  kind: p
  original: Bis 1824 hinderte der schwere Zoll auf Rohseide (4 Shilling per Pfund) die englische Seidenindustrie sehr, und nur der Markt Englands und seiner Kolonien stand ihr durch Schutzzölle zu Gebote.
  en: Until 1824 the heavy import duty, four shillings per pound on raw material, greatly retarded the development of the English silk industry, while only the markets of England and the Colonies were protected for it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '245'
- id: E.13.4
  kind: p
  original: Jetzt wurde der Eingangszoll auf einen Penny herabgesetzt, und sogleich vermehrte sich die Zahl der Fabriken bedeutend; in einem Jahre stieg die Anzahl der Doublierspindeln von 780 000 auf 1 180 000, und wenn auch die Handelskrisis von 1825 diesen Industriezweig für einen Augenblick lähmte, so wurde doch schon 1827 mehr fabriziert als je, da das mechanische Geschick und die Erfahrung der Engländer ihren Tramiermaschinen den Vorrang vor den unbeholfenen Einrichtungen ihrer Konkurrenten sicherte.
  en: In that year the duty was reduced to one penny, and the number of mills at once largely increased. In a single year the number of throwing spindles rose from 780,000 to 1,180,000; and, although the commercial crisis of 1825 crippled this branch of industry for the moment, yet in 1827 more was produced than ever, the mechanical skill and experience of the English having secured their twisting machinery the supremacy over the awkward devices of their competitors.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 245-246
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.13.5
  kind: p
  original: 1835 besaß das britische Reich 263 Tramierfabriken mit 30 000 Arbeitern, die meistens in Cheshire (Macclesfield, Congleton und Umgegend), Manchester und Somersetshire angelegt waren.
  en: In 1835 the British Empire possessed 263 twisting mills, employing 30,000 workers, located chiefly in Cheshire, in Macclesfield, Congleton, and the surrounding districts, and in Manchester and Somersetshire.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '246'
- id: E.13.6
  kind: p
  original: Außerdem gibt es noch viele Fabriken zur Bearbeitung des Seidenabfalls von den Kokons, aus denen ein eigner Artikel (Spunsilk) gemacht wird und mit dem die Engländer selbst die Pariser und Lyoner Webereien versorgen.
  en: Besides these, there are numerous mills for working up waste, from which a peculiar article known as spun silk is manufactured, with which the English supply even the Paris and Lyons weavers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '246'
- id: E.13.7
  kind: p
  original: Das Verweben der so tramierten und gesponnenen Seide geschieht besonders in Schottland (Paisley usw.) und London (Spitalfields), dann aber auch in Manchester und anderswo.
  en: The weaving of the silk so twisted and spun is carried on in Paisley and elsewhere in Scotland, and in Spitalfields, London, but also in Manchester and elsewhere.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '246'
- id: E.14.1
  kind: p
  original: Aber der riesenhafte Aufschwung, den die englische Industrie seit 1760 genommen hat, beschränkt sich nicht auf die Fabrikation der Kleidungsstoffe.
  en: Nor is the gigantic advance achieved in English manufacture since 1760 restricted to the production of clothing materials.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '246'
- id: E.14.2
  kind: p
  original: Der Anstoß, der einmal gegeben war, verbreitete sich über alle Zweige der industriellen Tätigkeit, und eine Menge Erfindungen, die außer allem Zusammenhang mit den bisher erwähnten standen, erhielten durch ihre Gleichzeitigkeit mit der allgemeinen Bewegung doppelte Wichtigkeit.
  en: The impulse, once given, was communicated to all branches of industrial activity, and a multitude of inventions wholly unrelated to those here cited, received double importance from the fact that they were made in the midst of the universal movement.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '246'
- id: E.14.3
  kind: p
  original: Zugleich aber wurde nun, nachdem die unermeßliche Bedeutung der mechanischen Kraft in der Industrie einmal praktisch erwiesen war, auch alles in Bewegung gesetzt, um diese Kraft nach allen Seiten hin auszubeuten und zum Vorteile der einzelnen Erfinder und Fabrikanten auszubeuten; und überdies setzte die Frage nach Maschinerie, Brenn- und Verarbeitungsmaterial schon direkt eine Masse Arbeiter und Gewerbe in verdoppelte Tätigkeit.
  en: But as soon as the immeasurable importance of mechanical power was practically demonstrated, every energy was concentrated in the effort to exploit this power in all directions, and to exploit it in the interest of individual inventors and manufacturers; and the demand for machinery, fuel, and materials called a mass of workers and a number of trades into redoubled activity.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T2
    editions: '1892'
    reading: zu benutzen
    base_text: … allen Seiten hin auszubeuten ‸ und zum Vorteile der …
  mew_page: '246'
- id: E.14.4
  kind: p
  original: Die Dampfmaschine gab den weiten Kohlenlagern Englands erst Bedeutung; die Maschinenfabrikation entstand erst jetzt und mit ihr ein neues Interesse an den Eisenbergwerken, die das rohe Material für die Maschinen lieferten; die vermehrte Konsumtion der Wolle hob die englische Schafzucht, und die zunehmende Einfuhr von Wolle, Flachs und Seide rief eine Vergrößerung der englischen Handelsmarine hervor.
  en: The steam-engine first gave importance to the broad coal-fields of England; the production of machinery began now for the first time, and with it arose a new interest in the iron mines which supplied raw material for it. The increased consumption of wool stimulated English sheep breeding, and the growing importation of wool, flax, and silk called forth an extension of the British ocean carrying trade.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '246'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.14.5
  kind: p
  original: Vor allem hob sich die Eisenproduktion.
  en: Greatest of all was the growth of production of iron.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '246'
- id: E.14.6
  kind: p
  original: Die eisenreichen Berge Englands waren bisher wenig ausgebeutet worden; man hatte das Eisenerz stets mit Holzkohlen geschmolzen, die mit der besseren Bebauung des Bodens und der Ausrottung der Wälder der immer teurer und seltner wurden; im vorigen Jahrhundert erst fing man an, geschwefelte Steinkohlen (coke) hierzu anzuwenden, und seit 1780 entdeckte man eine neue Methode, das mit Koks geschmolzene Eisen, das bisher nur als Gußeisen zu gebrauchen gewesen war, auch in brauchbares Schmiedeeisen zu verwandeln.
  en: The rich iron deposits of the English hills had hitherto been little developed; iron had always been smelted by means of charcoal, which became gradually more expensive as agriculture improved and forests were cut away. The beginning of the use of coke in iron smelting had been made in the last century, and in 1780 a new method was invented of converting into available wrought-iron coke-smelted iron, which up to that time had been convertible into cast-iron only.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '246'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.14.7
  kind: p
  original: Diese Methode, die in der Entziehung des im Schmelzen dem Eisen sich beimischenden Kohlenstoffs besteht, nennen die Engländer puddling, und durch sie wurde der englischen Eisenproduktion ein ganz neues Feld eröffnet.
  en: This process, known as "puddling," consists in withdrawing the carbon which had mixed with the iron during the process of smelting, and opened a wholly new field for the production of English iron.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 246-247
- id: E.14.8
  kind: p
  original: Die Hochöfen wurden fünfzigmal größer gemacht als früher, man vereinfachte das Schmelzen des Eisens durch heiße Gebläse und konnte dadurch das Eisen so wohlfeil produzieren, daß eine Menge Dinge, die früher von Holz oder Stein gemacht worden waren, jetzt von Eisen angefertigt wurden.
  en: Smelting furnaces were built fifty times larger than before, the process of smelting was simplified by the introduction of hot blasts, and iron could thus be produced so cheaply that a multitude of objects which had before been made of stone or wood were now made of iron.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '247'
- id: E.14.9
  kind: p
  original: 1788 errichtete Thomas Paine, der bekannte Demokrat, in Yorkshire die erste eiserne Brücke, der eine Unzahl folgten, so daß jetzt fast alle Brücken, namentlich auf Eisenbahnen, von Gußeisen gemacht werden und in London sogar eine Brücke über die Themse, die Southwark-Brücke, von diesem Material konstruiert worden ist; eiserne Säulen, Gestelle der Maschinen usw. sind allgemein, und seit der Einführung der Gasbeleuchtung und Eisenbahnen sind der englischen Eisengewinnung neue Abzugsquellen eröffnet.
  en: In 1788, Thomas Paine, the famous democrat, built in Yorkshire the first iron bridge, which was followed by a great number of others, so that now nearly all bridges, especially for railroad traffic, are built of cast-iron, while in London itself a bridge across the Thames, the Southwark bridge, has been built of this material. Iron pillars, supports for machinery, etc., are universally used, and since the introduction of gas-lighting and railroads, new outlets for English iron products are opened.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '247'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.14.10
  kind: p
  original: Nägel und Schrauben wurden allmählich auch mit Maschinen gemacht; Huntsman, ein Sheffielder, fand 1760 eine Methode, um Stahl zu gießen, wodurch viele Arbeit überflüssig gemacht und die Anfertigung ganz neuer, wohlfeiler Waren ermöglicht wurde; und durch die größere Reinheit des ihr zu Gebote stehenden Materials sowie durch vollkommnere Instrumente, neue Maschinerie und detailliertere Teilung der Arbeit wurde erst jetzt die Metallwarenproduktion von England bedeutend.
  en: Nails and screws gradually came to be made by machinery. Huntsman, a Sheffielder, discovered in 1790 a method for casting steel, by which much labour was saved, and the production of wholly new cheap goods rendered practicable; and through the greater purity of the material placed at its disposal, and the more perfect tools, new machinery and minute division of labour, the metal trade of England now first attained importance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '247'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.14.11
  kind: p
  original: Die Bevölkerung von Birmingham wuchs von 73 000 (1801) auf 200 000 (1844), die von Sheffield von 46 000 (1801) auf 110 000 (1844), und der Kohlenverbrauch der letzteren Stadt allein belief sich 1836 auf 515 000 Tons.
  en: The population of Birmingham grew from 73,000 in 1801 to 200,000 in 1844; that of Sheffield from 46,000 in 1801 to 110,000 in 1844, and the consumption of coal in the latter city alone reached in 1836, 515,000 tons.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '247'
- id: E.14.12
  kind: p
  original: 1805 wurden 4 300 Tons Eisenwaren und 4 600 Tons Roheisen, 1834 16 200 Tons Eisenwaren und 107 000 Tons Roheisen exportiert, und die ganze Eisengewinnung, 1740 nur noch 17 000 Tons betragend, stieg 1834 auf beinahe 700 000 Tons.
  en: In 1805 there were exported 4,300 tons of iron products and 4,600 tons of pig-iron; in 1834, 16,200 tons of iron products and 107,000 tons of pig-iron, while the whole iron product reaching in 1740 but 17,000 tons, had risen in 1834 to nearly 700,000 tons.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '247'
- id: E.14.13
  kind: p
  original: Die Schmelzung des Roheisens konsumierte allein jährlich über 3 Millionen Tons Kohlen, und welche Wichtigkeit überhaupt die Kohlenbergwerke im Laufe der letzten sechzig Jahre bekommen haben, davon kann man sich keine Vorstellung machen.
  en: The smelting of pig-iron alone consumes yearly more than 3,000,000 tons of coal, and the importance which coal mining has attained in the course of the last 60 years can scarcely be conceived.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '247'
- id: E.14.14
  kind: p
  original: Alle englischen und schottischen Kohlenlager werden jetzt ausgebeutet, und die Gruben Northumberland und Durham allein liefern jährlich über 5 Millionen Tons zur Verschiffung und beschäftigen 40 000 bis 50 000 Arbeiter.
  en: All the English and Scotch deposits are now worked, and the mines of Northumberland and Durham alone yield annually more than 5,000,000 tons for shipping, and employ from 40 to 50,000 men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '247'
- id: E.14.15
  kind: p
  original: Nach dem "Durham Chronicle" waren in den beiden genannten Grafschaften 1753 14 Kohlengruben / 1800 40 Kohlengruben / 1836 76 Kohlengruben / und 1843 130 Kohlengruben im Betrieb.
  en: 'According to the Durham Chronicle, there were worked in these two counties: In 1753, 14 mines; in 1800, 40 mines; in 1836, 76 mines; in 1843, 130 mines.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 247-248
- id: E.14.16
  kind: p
  original: Dabei werden alle Gruben jetzt mit viel mehr Tätigkeit ausgebeutet als früher.
  en: Moreover, all mines are now much more energetically worked than formerly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '248'
- id: E.14.17
  kind: p
  original: Eine ähnliche vermehrte Tätigkeit wurde in den Zinn-, Kupfer - und Bleibergwerken angewendet, und neben der Ausdehnung der Glasfabrikation entstand ein neuer Industriezweig in der Anfertigung der Töpferwaren, die durch Josiah Wedgwood um 1763 Bedeutung erhielt.
  en: A similarly increased activity was applied to the working of tin, copper, and lead, and alongside of the extension of glass manufacture arose a new branch of industry in the production of pottery, rendered important by the efforts of Josiah Wedgewood, about 1763.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '248'
- id: E.14.18
  kind: p
  original: Dieser reduzierte die ganze Fabrikation des Steinguts auf wissenschaftliche Prinzipien, führte einen besseren Geschmack ein und gründete die Töpfereien (potteries) von Nord-Staffordshire, einen Bezirk von acht englischen Meilen im Quadrat, der, früher eine unfruchtbare Wüste, jetzt mit Fabriken und Wohnungen besät ist und über 60000 Menschen ernährt.
  en: This inventor placed the whole manufacture of stoneware on a scientific basis, introduced better taste, and founded the potteries of North Staffordshire, a district of eight English miles square, which, formerly a desert waste, is now sown with works and dwellings, and supports more than 60,000 people.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '248'
- id: E.15.1
  kind: p
  original: In diesen allgemeinen Strudel der Bewegung wurde alles hineingerissen.
  en: Into this universal whirl of activity everything was drawn.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '248'
- id: E.15.2
  kind: p
  original: Der Ackerbau erlitt ebenfalls einen Umschwung.
  en: Agriculture made a corresponding advance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '248'
- id: E.15.3
  kind: p
  original: Und nicht nur, daß, wie wir oben sahen, das Grundeigentum in die Hände anderer Besitzer und Bebauer überging, sondern auch auf andre Weise noch wurde der Ackerbau affiziert.
  en: Not only did landed property pass, as we have already seen, into the hands of new owners and cultivators, agriculture was affected in still another way.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '248'
- id: E.15.4
  kind: p
  original: Die großen Pächter wandten Kapital an die Verbesserung des Bodens, rissen unnötige Scheidewände nieder, legten trocken, düngten, wandten bessere Instrumente an und führten eine systematische Abwechselung der Bebauung (cropping by rotation) ein.
  en: The great holders applied capital to the improvement of the soil, tore down needless fences, drained, manured, employed better tools, and applied a rotation of crops.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '248'
- id: E.15.5
  kind: p
  original: Auch ihnen half der Fortschritt der Wissenschaften; Sir H. Davy wandte die Chemie mit Erfolg auf den Ackerbau an, und die Entwicklung der Mechanik gab ihnen eine Menge Vorteile an die Hand.
  en: The progress of science came to their assistance also; Sir Humphrey Davy applied chemistry to agriculture with success, and the development of mechanical science bestowed a multitude of advantages upon the large farmer.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '248'
- id: E.15.6
  kind: p
  original: Dazu stieg infolge der vermehrten Bevölkerung die Nachfrage nach Ackerbauprodukten so sehr, daß von 1760 bis 1834 6 840 540 englische Morgen wüstes Land urbar gemacht wurden und trotzdem England aus einem kornausführenden Lande ein korneinführendes wurde.
  en: Further, in consequence of the increase of population, the demand for agricultural products increased in such measure that from 1760 to 1834, 6,840,540 acres of waste land were reclaimed; and, in spite of this, England was transformed from a grain exporting to a grain importing country.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '248'
- id: E.16.1
  kind: p
  original: Dieselbe Tätigkeit in der Herstellung der Kommunikation.
  en: The same activity was developed in the establishment of communication.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T3
    editions: '1892'
    reading: Kommunikationen
    base_text: … der Herstellung der Kommunikation ‸ . …
  mew_page: '248'
- id: E.16.2
  kind: p
  original: Von 1818 bis 1829 wurden in England und Wales 1000 englische Meilen Chausseen von der gesetzlichen Breite von 60 Fuß angelegt und fast alle alten nach MacAdams Prinzip erneuert.
  en: From 1818 to 1829, there were built in England and Wales, 1,000 English miles of roadway of the width prescribed by law, 60 feet, and nearly all the old roads were reconstructed on the new system of M'Adam.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '248'
- id: E.16.3
  kind: p
  original: In Schottland legte die Behörde der öffentlichen Arbeiten seit 1803 an neunhundert Meilen Chaussee und über tausend Brücken an, wodurch in den Hochlanden das Volk mit einem Male in die Nähe der Zivilisation gebracht wurde.
  en: In Scotland, the Department of Public Works built since 1803 nearly 900 miles of roadway and more than 1,000 bridges, by which the population of the Highlands was suddenly placed within reach of civilisation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '248'
- id: E.16.4
  kind: p
  original: Die Hochländer waren bisher meist Wilddiebe und Schmuggler gewesen; jetzt wurden sie fleißige Ackerbauer und Handwerker, und obwohl gälische Schulen zur Erhaltung der Sprache errichtet worden sind, verschwindet gälisch-keltische Sitte und Sprache rasch vor dem Anrücken der englischen Zivilisation.
  en: The Highlanders had hitherto been chiefly poachers and smugglers; they now became farmers and hand-workers. And, though Gaelic schools were organised for the purpose of maintaining the Gaelic language, yet Gaelic-Celtic customs and speech are rapidly vanishing before the approach of English civilisation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '248'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.16.5
  kind: p
  original: Ebenso in Irland.
  en: So, too, in Ireland; between the counties of Cork, Limerick, and Kerry, lay hitherto a wilderness wholly without passable roads, and serving, by reason of its inaccessibility, as the refuge of all criminals and the chief protection of the Celtic Irish nationality in the South of Ireland. It has now been cut through by public roads, and civilisation has thus gained admission even to this savage region.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '248'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: E.16.6
  kind: p
  original: Zwischen den Grafschaften Cork, Limerick und Kerry lag bisher ein wüster Landstrich ohne alle fahrbaren Wege, der wegen seiner Unzugänglichkeit der Zufluchtsort aller Vererbrecher und der Hauptschutz der keltisch-irischen Nationalität in Südirland war; man durchschnitt ihn mit Landstraßen und eröffnete dadurch der Zivilisation Zugänge auch in diese wilde Gegend.
  en: ''
  joined_to: E.16.5
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: 248-249
- id: E.16.7
  kind: p
  original: Das ganze britische Reich, namentlich aber England, das vor sechzig Jahren ebenso schlechte Wege besaß wie damals Deutschland und Frankreich, ist jetzt mit einem Netze der schönsten Chausseen überzogen, und auch diese sind, wie fast alles in England, das Werk der Privatindustrie, da der Staat wenig oder gar nichts dazu getan hat.
  en: The whole British Empire, and especially England, which, sixty years ago, had as bad roads as Germany or France then had, is now covered by a network of the finest roadways; and these, too, like almost everything else in England, are the work of private enterprise, the State having done very little in this direction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '249'
- id: E.17.1
  kind: p
  original: 'Vor 1755 hatte England fast gar keine Kanäle, 1755 wurde in Lancashire der Kanal von Sankey Brook nach St. Helens angelegt: und 1759 baute James Brindley den ersten bedeutenden Kanal, den des Herzogs von Bridgewater, der von Manchester und den Kohlenbergwerken der Umgegend nach der Mündung des Mersey geht und bei Barton in einem Aquädukt über den Fluß Irwell geführt wird.'
  en: Before 1755 England possessed almost no canals. In that year a canal was built in Lancashire from Sankey Brook to St Helen's; and in 1759, James Brindley built the first important one, the Duke of Bridgewater's canal from Manchester, and the coal mines of the district to the mouth of the Mersey passing, near Barton, by aqueduct, over the river Irwell.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '249'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.17.2
  kind: p
  original: Von hier an datiert sich das englische Kanalwesen, dem erst Brindley Wichtigkeit gegeben hat.
  en: From this achievement dates the canal building of England, to which Brindley first gave importance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '249'
- id: E.17.3
  kind: p
  original: Jetzt wurden Kanäle nach allen Richtungen hin angelegt und Flüsse schiffbar gemacht.
  en: Canals were now built, and rivers made navigable in all directions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '249'
- id: E.17.4
  kind: p
  original: In England allein sind 2 200 Meilen Kanal und 1 800 Meilen schiffbarer Flüsse; in Schottland wurde der kaledonische Kanal, der das Land quer durchschneidet, und in Irland ebenfalls verschiedene Kanäle angelegt.
  en: In England alone, there are 2,200 miles of canals and 1,800 miles of navigable river. In Scotland, the Caledonian Canal was cut directly across the country, and in Ireland several canals were built.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '249'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.17.5
  kind: p
  original: Auch diese Anlagen sind, wie die Eisenbahnen und Chausseen, fast alle das Werk von Privatleuten und Kompagnien.
  en: These improvements, too, like the railroads and roadways, are nearly all the work of private individuals and companies.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '249'
- id: E.18.1
  kind: p
  original: Die Eisenbahnen sind erst in der neuesten Zeit angelegt.
  en: The railroads have been only recently built.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '249'
- id: E.18.2
  kind: p
  original: Die erste größere war die von Liverpool nach Manchester (1830 eröffnet); seitdem sind alle großen Städte miteinander durch Schienenwege verbunden worden.
  en: The first great one was opened from Liverpool to Manchester in 1830, since which all the great cities have been connected by rail.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '249'
- id: E.18.3
  kind: p
  original: London mit Southampton, Brighton, Dover, Colchester, Cambridge, Exeter (über Bristol) und Birmingham; Birmingham mit Gloucester, Liverpool, Lancaster (über Newton und Wigan und über Manchester und Bolton), ferner mit Leeds (über Manchester und Halifax und über Leicester, Derby und Sheffield); Leeds mit Hull und Newcastle (über York).
  en: London with Southampton, Brighton, Dover, Colchester, Exeter, and Birmingham; Birmingham with Gloucester, Liverpool, Lancaster (via Newton and Wigan, and via Manchester and Bolton); also with Leeds (via Manchester and Halifax, and via Leicester, Derby, and Sheffield); Leeds with Hull and Newcastle (via York).
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '249'
- id: E.18.4
  kind: p
  original: Dazu die vielen kleineren, die im Bau begriffenen und projektierten Linien, die es bald möglich machen werden, von Edinburgh nach London in einem Tage zu reisen.
  en: There are also many minor lines building or projected, which will soon make it possible to travel from Edinburgh to London in one day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '249'
- id: E.19.1
  kind: p
  original: Wie der Dampf die Kommunikation zu Lande revolutioniert hatte, so gab er auch der zu Wasser ein neues Ansehen.
  en: As it had transformed the means of communication by land, so did the introduction of steam revolutionise travel by sea.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '249'
- id: E.19.2
  kind: p
  original: Das erste Dampfschiff fuhr 1807 auf dem Hudson in Nordamerika; das erste im britischen Reich 1811 auf dem Clyde.
  en: The first steamboat was launched in 1807, in the Hudson, in North America; the first in the British empire, in 1811, on the Clyde.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '249'
- id: E.19.3
  kind: p
  original: Seitdem sind über sechshundert in England gebaut worden, und über fünfhundert waren 1836 in britischen Häfen in Tätigkeit.
  en: Since then, more than 600 have been built in England; and in 1836 more than 500 were plying to and from British ports.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '249'
- id: E.20.1
  kind: p
  original: Das ist in kurzem die Geschichte der englischen Industrie in den letzten sechzig Jahren, eine Geschichte, die ihresgleichen nicht hat in den Annalen der Menschheit.
  en: Such, in brief, is the history of English industrial development in the past sixty years, a history which has no counterpart in the annals of humanity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '249'
- id: E.20.2
  kind: p
  original: Vor sechzig, achtzig Jahren ein Land wie alle andern, mit kleinen Städten, wenig und einfacher Industrie und einer dünnen, aber verhältnismäßig großen Ackerbaubevölkerung; und jetzt ein Land wie kein anderes, mit einer Hauptstadt von drittehalb Millionen Einwohnern, mit kolossalen Fabrikstädten, mit einer Industrie, die die ganze Welt versorgt und die fast alles mit den kompliziertesten Maschinen macht, mit einer fleißigen, intelligenten, dichtgesäten Bevölkerung, von der zwei Drittel durch die Industrie in Anspruch genommen werden und die aus ganz andern Klassen besteht, ja, die eine ganz andre Nation mit andern Sitten und andern Bedürfnissen bildet als damals.
  en: Sixty, eighty years ago, England was a country like every other, with small towns, few and simple industries, and a thin but proportionally large agricultural population. To-day it is a country like no other, with a capital of two and a half million inhabitants; with vast manufacturing cities; with an industry that supplies the world, and produces almost everything by means of the most complex machinery; with an industrious, intelligent, dense population, of which two-thirds are employed in trade and commerce, and composed of classes wholly different; forming, in fact, with other customs and other needs, a different nation from the England of those days.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T4
    editions: English 1887 and 1892
    reading: In den englischen Ausgaben von 1887 und 1892 "... trade and commerce [Industrie und Handel]"
    base_text: … Drittel durch die Industrie ‸ in Anspruch genommen werden …
  mew_page: 249-250
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.20.3
  kind: p
  original: Die industrielle Revolution hat für England dieselbe Bedeutung wie die politische Revolution für Frankreich und die philosophische für Deutschland, und der Abstand zwischen dem England von 1760 und dem von 1844 ist mindestens ebenso groß wie der zwischen dem Frankreich des ancien régime und dem der Julirevolution.
  en: The industrial revolution is of the same importance for England as the political revolution for France, and the philosophical revolution for Germany; and the difference between England in 1760 and in 1844 is at least as great as that between France, under the ancien regime and during the revolution of July.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '250'
- id: E.20.4
  kind: p
  original: Die wichtigste Frucht aber dieser industriellen Umwälzung ist das englische Proletariat.
  en: But the mightiest result of this industrial transformation is the English proletariat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '250'
- id: E.21.1
  kind: p
  original: Wir haben oben gesehen, wie das Proletariat durch die Einführung der Maschinen ins Leben gerufen wurde.
  en: We have already seen how the proletariat was called into existence by the introduction of machinery.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '250'
- id: E.21.2
  kind: p
  original: Die rasche Ausdehnung der Industrie erforderte Hände; der Arbeitslohn stieg, und infolgedessen wanderten Scharen von Arbeitern aus den Ackerbaubezirken nach den Städten.
  en: The rapid extension of manufacture demanded hands, wages rose, and troops of workmen migrated from the agricultural districts to the towns.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '250'
- id: E.21.3
  kind: p
  original: Die Bevölkerung vermehrte sich reißend, und fast aller Zuwachs kam auf die Klasse der Proletarier.
  en: Population multiplied enormously, and nearly all the increase took place in the proletariat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '250'
- id: E.21.4
  kind: p
  original: Dazu war in Irland erst seit dem Anfange des achtzehnten Jahrhunderts ein geordneter Zustand eingetreten; auch hier vermehrte sich die in den früheren Unruhen durch englische Barbarei mehr als dezimierte Bevölkerung schnell, besonders seitdem der Aufschwung der Industrie anfing, eine Menge Irländer nach England herüberzuziehen.
  en: Further, Ireland had entered upon an orderly development only since the beginning of the eighteenth century. There, too, the population, more than decimated by English cruelty in earlier disturbances, now rapidly multiplied, especially after the advance in manufacture began to draw masses of Irishmen towards England.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '250'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.21.5
  kind: p
  original: So entstanden die großen Fabrik- und Handelsstädte des britischen Reichs, in denen mindestens drei Viertel der Bevölkerung der Arbeiterklasse angehören und die kleine Bourgeoisie nur aus Krämern und sehr, sehr wenigen Handwerkern besteht.
  en: Thus arose the great manufacturing and commercial cities of the British Empire, in which at least three-fourths of the population belong to the working-class, while the lower middle-class consists only of small shopkeepers, and very very few handicraftsmen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '250'
- id: E.21.6
  kind: p
  original: Denn wie die neue Industrie erst dadurch bedeutend wurde, daß sie die Werkzeuge in Maschinen, die Werkstätten in Fabriken - und dadurch die arbeitende Mittelklasse in arbeitendes Proletariat, die bisherigen Großhändler in Fabrikanten verwandelte; wie also schon hier die kleine Mittelklasse verdrängt und die Bevölkerung auf den Gegensatz von Arbeitern und Kapitalisten reduziert wurde, so geschah dasselbe, außer dem Gebiet der Industrie im engeren Sinne, in den Handwerken und selbst im Handel.
  en: For, though the rising manufacture first attained importance by transforming tools into machines, workrooms into factories, and consequently, the toiling lower middle-class into the toiling proletariat, and the former large merchants into manufacturers, though the lower middle-class was thus early crushed out, and the population reduced to the two opposing elements, workers and capitalists, this happened outside of the domain of manufacture proper, in the province of handicraft and retail trade as well.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '250'
- id: E.21.7
  kind: p
  original: An die Stelle der ehemaligen Meister und Gesellen traten große Kapitalisten und Arbeiter, die nie Aussicht hatten, sich über ihre Klasse zu erheben; die Handwerke wurden fabrikmäßig betrieben, die Teilung der Arbeit streng durchgeführt und die kleinen Meister, die gegen die großen Etablissements nicht konkurrieren konnten, in die Klasse der Proletarier herabgedrängt.
  en: In the place of the former masters and apprentices, came great capitalists and working-men who had no prospect of rising above their class. Hand-work was carried on after the fashion of factory work, the division of labour was strictly applied, and small employers who could not compete with great establishments were forced down into the proletariat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 250-251
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.21.8
  kind: p
  original: Zu gleicher Zeit aber wurde dem Arbeiter durch die Aufhebung des bisherigen Handwerksbetriebs, durch die Vernichtung der kleinen Bourgeoisie alle Möglichkeit genommen, selbst Bourgeois zu werden.
  en: At the same time the destruction of the former organisation of hand-work, and the disappearance of the lower middle-class deprived the working-man of all possibility of rising into the middle-class himself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '251'
- id: E.21.9
  kind: p
  original: Bisher hatte er immer die Aussicht gehabt, sich als ansässiger Meister irgendwo niederlassen, später vielleicht Gesellen annehmen zu können, jetzt aber, wo die Meister selbst durch die Fabrikanten verdrängt, wo zum selbständigen Betrieb einer Arbeit große Kapitalien nötig wurden, wurde das Proletariat erst eine wirkliche, feste Klasse der Bevölkerung, während es früher oft nur ein Durchgang in die Bourgeoisie war.
  en: Hitherto he had always had the prospect of establishing himself somewhere as master artificer, perhaps employing journeymen and apprentices; but now, when master artificers were crowded out by manufacturers, when large capital had become necessary for carrying on work independently, the working-class became, for the first time, an integral, permanent class of the population, whereas it had formerly often been merely a transition leading to the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '251'
- id: E.21.10
  kind: p
  original: Wer jetzt als Arbeiter geboren wurde, hatte keine andere Aussicht, als lebenslang Proletarier zu bleiben.
  en: Now, he who was born to toil had no other prospect than that of remaining a toiler all his life.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '251'
- id: E.21.11
  kind: p
  original: Jetzt also erst war das Proletariat imstande, selbständige Bewegungen vorzunehmen.
  en: Now, for the first time, therefore, the proletariat was in a position to undertake an independent movement.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '251'
- id: E.22.1
  kind: p
  original: Auf diese Weise wurde die ungeheure Masse von Arbeitern zusammengebracht, die jetzt das ganze britische Reich erfüllt und deren soziale Lage sich mit jedem Tage der Aufmerksamkeit der zivilisierten Welt mehr und mehr aufdrängt.
  en: In this way were brought together those vast masses of working-men who now fill the whole British Empire, whose social condition forces itself every day more and more upon the attention of the civilised world.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '251'
- id: E.23.1
  kind: p
  original: 'Die Lage der arbeitenden Klasse, das heißt die Lage der ungeheuren Majorität des englischen Volks, die Frage: Was soll aus diesen besitzlosen Millionen werden, die heute das verzehren, was sie gestern verdient haben, die mit ihren Erfindungen und ihrer Arbeit Englands Größe geschaffen haben, die täglich ihrer Macht sich mehr und mehr bewußt werden und täglich dringender ihren Anteil an den Vorteilen der gesellschaftlichen Einrichtungen verlangen - diese Frage ist seit der Reformbill die nationale Frage geworden.'
  en: 'The condition of the working-class is the condition of the vast majority of the English people. The question: What is to become of those destitute millions, who consume to-day what they earned yesterday; who have created the greatness of England by their inventions and their toil; who become with every passing day more conscious of their might, and demand, with daily increasing urgency, their share of the advantages of society?--This, since the Reform Bill, has become the national question.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '251'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: E.23.2
  kind: p
  original: Alle einigermaßen wichtigen Parlamentsdebatten lassen sich auf sie reduzieren; und wenn auch die englische Mittelklasse es sich bis jetzt nicht gestehen will, wenn sie dieser großen Frage auch auszuweichen und sich ihre besondern Interessen als die wahrhaft nationalen hinzustellen sucht, so hilft ihr das doch gar nichts.
  en: All Parliamentary debates, of any importance, may be reduced to this; and, though the English middle-class will not as yet admit it, though they try to evade this great question, and to represent their own particular interests as the truly national ones, their action is utterly useless.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '251'
- id: E.23.3
  kind: p
  original: Mit jeder Parlamentssession gewinnt die arbeitende Klasse Terrain, verlieren die Interessen der Mittelklassen an Bedeutung, und obwohl die Mittelklasse die Hauptmacht, ja die einzige Macht des Parlaments ist, so war doch die letzte Session 1844 eine fortwährende Debatte über Arbeiterverhältnisse (die Armenbill, die Fabrikenbill, die Bill über das Verhältnis von Herren und Dienern), und Thomas Duncombe, der Vertreter der Arbeiterklasse im Unterhause, war der große Mann der Session, während die liberale Mittelklasse mit ihrer Motion wegen Abschaffung der Korngesetze und die radikale Mittelklasse mit ihrem Antrag auf Steuerverweigerung eine jämmerliche Rolle spielten.
  en: With every session of Parliament the working-class gains ground, the interests of the middle-class diminish in importance; and, in spite of the fact that the middle-class is the chief, in fact, the only power in Parliament, the last session of 1844 was a continuous debate upon subjects affecting the working-class, the Poor Relief Bill, the Factory Act, the Masters' and Servants' Act; and Thomas Duncombe, the representative of the working-men in the House of Commons, was the great man of the session; while the Liberal middle-class with its motion for repealing the Corn Laws, and the Radical middle-class with its resolution for refusing the taxes, played pitiable roles.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '251'
- id: E.23.4
  kind: p
  original: Selbst die Debatten über Irland waren im Grunde nur Debatten über die Lage des irischen Proletariats und die Mittel, ihm aufzuhelfen.
  en: Even the debates about Ireland were at bottom debates about the Irish proletariat, and the means of coming to its assistance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 251-252
- id: E.23.5
  kind: p
  original: Es ist aber auch hohe Zeit, daß die englische Mittelklasse den nicht bittenden, sondern drohenden und fordernden Arbeitern Konzessionen macht, denn in kurzem möchte es zu spät sein.
  en: It is high time, too, for the English middle-class to make some concessions to the working-men who no longer plead but threaten; for in a short time it may be too late.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '252'
- id: E.24.1
  kind: p
  original: Aber bei alledem will die englische Mittelklasse und namentlich die fabrizierende, die aus der Not der Arbeiter sich direkt bereichert, nichts von dieser Not wissen.
  en: In spite of all this, the English middle-class, especially the manufacturing class, which is enriched directly by means of the poverty of the workers, persists in ignoring this poverty.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '252'
- id: E.24.2
  kind: p
  original: Sie, die sich als die mächtige, die Nation repräsentierende Klasse fühlt, schämt sich, den wunden Fleck Englands den Augen der Welt bloßzulegen; sie will es sich nicht gestehen, daß die Arbeiter elend sind, weil sie, die besitzende, industrielle Klasse, die moralische Verantwortlichkeit für dieses Elend tragen müßte.
  en: This class, feeling itself the mighty representative class of the nation, is ashamed to lay the sore spot of England bare before the eyes of the world; will not confess, even to itself, that the workers are in distress, because it, the property-holding, manufacturing class, must bear the moral responsibility for this distress.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '252'
- id: E.24.3
  kind: p
  original: Daher das spöttische Gesicht, was die gebildeten Engländer - und nur diese, das heißt die Mittelklasse, kennt man auf dem Kontinent - was die gebildeten Engländer aufzusetzen pflegen, wenn man von der Lage der Arbeiter zu sprechen anfängt; daher die totale Unwissenheit über alles, was die Arbeiter angeht, bei der ganzen Mittelklasse; daher die lächerlichen Böcke, die diese Klasse in und außer dem Parlament schießt, wenn die Verhältnisse des Proletariats zur Sprache kommen; daher die lächelnde Sorglosigkeit, in der sie auf einem Boden lebt, der unter ihren Füßen ausgehöhlt ist und jeden Tag einstürzen kann, und dessen baldiger Einsturz so sicher ist wie irgendein mathematisches oder mechanisches Gesetz; daher das Wunder, daß die Engländer noch kein einziges vollständiges Buch über die Lage ihrer Arbeiter besitzen, obwohl sie nun schon seit wer weiß wie vielen Jahren daran herumuntersuchen und herumflicken.
  en: Hence the scornful smile which intelligent Englishmen (and they, the middle-class, alone are known on the Continent) assume when any one begins to speak of the condition of the working-class; hence the utter ignorance on the part of the whole middle-class of everything which concerns the workers; hence the ridiculous blunders which men of this class, in and out of Parliament, make when the position of the proletariat comes under discussion; hence the absurd freedom from anxiety, with which the middle-class dwells upon a soil that is honeycombed, and may any day collapse, the speedy collapse of which is as certain as a mathematical or mechanical demonstration; hence the miracle that the English have as yet no single book upon the condition of their workers, although they have been examining and mending the old state of things no one knows how many years.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '252'
- id: E.24.4
  kind: p
  original: Daher aber auch der tiefe Groll der ganzen Arbeiterklasse von Glasgow bis London gegen die Reichen, von denen sie systematisch ausgebeutet und dann gefühllos ihrem Schicksal überlassen wird - ein Groll, der über nicht gar zu lange - man kann sie fast berechnen - in einer Revolution ausbrechen muß, gegen die die erste französische und das Jahr 1794 ein Kinderspiel sein wird.
  en: Hence also the deep wrath of the whole working-class, from Glasgow to London, against the rich, by whom they are systematically plundered and mercilessly left to their fate, a wrath which before too long a time goes by, a time almost within the power of man to predict, must break out into a Revolution in comparison with which the French Revolution, and the year 1794, will prove to have been child's play.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '252'
- id: E.N1.1.1
  kind: note
  original: Nach Porters "[The] Progress of the Nation" [Der Fortschritt der Nation], London, 1836 I vol., 1838 II vol., 1843 III vol. (aus offiziellen Angaben) und anderen meist ebenfalls offiziellen Quellen.
  en: According to Porter's Progress of the Nation, London, 1836, vol. i., 1838, vol. ii., 1843, vol. iii.
  modern: ''
  modern_status: empty
  notes: ''
