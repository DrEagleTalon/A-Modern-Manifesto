  kind: note
  original: '- (1892) Die obige geschichtliche Skizze der industriellen Umwälzung ist in Einzelheiten ungenau, es lag aber 1843/44 kein besseres Quellenmaterial vor.'
  en: (official data), and other sources chiefly official.
  modern: ''
  modern_status: empty
  notes: ''
- id: E.N2.1.1
  kind: note
  original: Das englische Ton ist ein Gewicht von 2 240 Pfund englisch, (1892) fast 1 000 Kilogramm.
  en: ''
  modern: ''
