- id: E.11.2
  kind: p
  original: Die Wollenspinnerei beschäftigte 1835 in den drei Reichen 1 313 Fabriken mit 71 300 Arbeitern - letztere sind übrigens nur ein kleiner Teil der Menge, die direkt und indirekt von der Verarbeitung der Wolle leben, und schließen fast alle Weber aus.
  en: In 1835 the spinning of wool employed in the United Kingdom 1,313 mills, with 71,300 workers, these last being but a small portion of the multitude who are supported directly or indirectly by the manufacture of wool, and excluding nearly all weavers.
