section: II
title_original: Die großen Städte
title_en: The Great Towns
author: Friedrich Engels
date: 1844-11/1845-03
original_language: de
anchor_language: de
source_original: MEW 2, S. 225-506 (Dietz, Berlin 1972) via mlwerke.de; text of the first edition (Leipzig 1845), readings of the second edition (Stuttgart 1892) as variants
source_en: Florence Kelley Wischnewetzky's translation (New York 1887) in the London edition of 1892 (Swan Sonnenschein), Project Gutenberg ebook 17306 (public domain)
verses:
- id: II.0.1
  kind: heading
  original: Die großen Städte
  en: THE GREAT TOWNS.
  modern: ''
  modern_status: empty
  notes: ''
- id: II.1.1
  kind: p
  original: So eine Stadt wie London, wo man stundenlang wandern kann, ohne auch nur an den Anfang des Endes zu kommen, ohne dem geringsten Zeichen zu begegnen, das auf die Nähe des platten Landes schließen ließe, ist doch ein eigen Ding.
  en: A town, such as London, where a man may wander for hours together without reaching the beginning of the end, without meeting the slightest hint which could lead to the inference that there is open country within reach, is a strange thing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '256'
- id: II.1.2
  kind: p
  original: Diese kolossale Zentralisation, diese Anhäufung von dritthalb Millionen Menschen auf einem Punkt hat die Kraft dieser dritthalb Millionen verhundertfacht; sie hat London zur kommerziellen Hauptstadt der Welt erhoben, die riesenhaften Docks geschaffen und die Tausende von Schiffen versammelt, die stets die Themse bedecken.
  en: This colossal centralisation, this heaping together of two and a half millions of human beings at one point, has multiplied the power of this two and a half millions a hundredfold; has raised London to the commercial capital of the world, created the giant docks and assembled the thousand vessels that continually cover the Thames.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '256'
- id: II.1.3
  kind: p
  original: Ich kenne nichts Imposanteres als den Anblick, den die Themse darbietet, wenn man von der See nach London Bridge hinauffährt.
  en: I know nothing more imposing than the view which the Thames offers during the ascent from the sea to London Bridge.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '256'
- id: II.1.4
  kind: p
  original: Die Häusermassen, die Werfte auf beiden Seiten, besonders von Woolwich aufwärts, die zahllosen Schiffe an beiden Ufern entlang, die sich immer dichter und dichter zusammenschließen und zuletzt nur einen schmalen Weg in der Mitte des Flusses frei lassen, einen Weg, auf dem hundert Dampfschiffe aneinander vorüberschießen - das alles ist so großartig, so massenhaft, daß man gar nicht zur Besinnung kommt und daß man vor der Größe Englands staunt, noch ehe man englischen Boden betritt.
  en: The masses of buildings, the wharves on both sides, especially from Woolwich upwards, the countless ships along both shores, crowding ever closer and closer together, until, at last, only a narrow passage remains in the middle of the river, a passage through which hundreds of steamers shoot by one another; all this is so vast, so impressive, that a man cannot collect himself, but is lost in the marvel of England's greatness before he sets foot upon English soil.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N1
  mew_page: '256'
- id: II.2.1
  kind: p
  original: Aber die Opfer, die alles das gekostet hat, entdeckt man erst später.
  en: But the sacrifices which all this has cost become apparent later.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '256'
- id: II.2.2
  kind: p
  original: Wenn man sich ein paar Tage lang auf dem Pflaster der Hauptstraßen herumgetrieben, sich mit Mühe und Not durch das Menschengewühl, die endlosen Reihen von Wagen und Karren durchgeschlagen, wenn man die "schlechten Viertel" der Weltstadt besucht hat, dann merkt man erst, daß diese Londoner das beste Teil ihrer Menschheit aufopfern mußten, um alle die Wunder der Zivilisation zu vollbringen, von denen ihre Stadt wimmelt, daß hundert Kräfte, die in ihnen schlummerten, untätig blieben und unterdrückt wurden, damit einige wenige sich voller entwickeln und durch die Vereinigung mit denen anderer multipliziert werden konnten.
  en: After roaming the streets of the capital a day or two, making headway with difficulty through the human turmoil and the endless lines of vehicles, after visiting the slums of the metropolis, one realises for the first time that these Londoners have been forced to sacrifice the best qualities of their human nature, to bring to pass all the marvels of civilisation which crowd their city; that a hundred powers which slumbered within them have remained inactive, have been suppressed in order that a few might be developed more fully and multiply through union with those of others.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 256-257
- id: II.2.3
  kind: p
  original: Schon das Straßengewühl hat etwas Widerliches, etwas, wogegen sich die menschliche Natur empört.
  en: The very turmoil of the streets has something repulsive, something against which human nature rebels.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: II.2.4
  kind: p
  original: Diese Hunderttausende von allen Klassen und aus allen Ständen, die sich da aneinander vorbeidrängen, sind sie nicht alle Menschen mit denselben Eigenschaften und Fähigkeiten und mit demselben Interesse, glücklich zu werden? und haben sie nicht alle ihr Glück am Ende doch durch ein und dieselben Mittel und Wege zu erstreben?
  en: The hundreds of thousands of all classes and ranks crowding past each other, are they not all human beings with the same qualities and powers, and with the same interest in being happy? And have they not, in the end, to seek happiness in the same way, by the same means?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.2.5
  kind: p
  original: Und doch rennen sie aneinander vorüber, als ob sie gar nichts gemein, gar nichts miteinander zu tun hätten, und doch ist die einzige Übereinkunft zwischen ihnen die stillschweigende, daß jeder sich auf der Seite des Trottoirs hält, die ihm rechts liegt, damit die beiden aneinander vorbeischießenden Strömungen des Gedränges sich nicht gegenseitig aufhalten; und doch fällt es keinem ein, die andern auch nur eines Blickes zu würdigen.
  en: And still they crowd by one another as though they had nothing in common, nothing to do with one another, and their only agreement is the tacit one, that each keep to his own side of the pavement, so as not to delay the opposing streams of the crowd, while it occurs to no man to honour another with so much as a glance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: II.2.6
  kind: p
  original: Die brutale Gleichgültigkeit, die gefühllose Isolierung jedes einzelnen auf seine Privatinteressen tritt um so widerwärtiger und verletzender hervor, je mehr diese einzelnen auf den kleinen Raum zusammengedrängt sind; und wenn wir auch wissen, daß diese Isolierung des einzelnen, diese bornierte Selbstsucht überall das Grundprinzip unserer heutigen Gesellschaft ist, so tritt sie doch nirgends so schamlos unverhüllt, so selbstbewußt auf als gerade hier in dem Gewühl der großen Stadt.
  en: The brutal indifference, the unfeeling isolation of each in his private interest becomes the more repellant and offensive, the more these individuals are crowded together, within a limited space. And, however much one may be aware that this isolation of the individual, this narrow self-seeking is the fundamental principle of our society everywhere, it is nowhere so shamelessly barefaced, so self-conscious as just here in the crowding of the great city.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.2.7
  kind: p
  original: Die Auflösung der Menschheit in Monaden, deren jede ein apartes Lebensprinzip und einen aparten Zweck hat, die Welt der Atome ist hier auf ihre höchste Spitze getrieben.
  en: The dissolution of mankind into monads, of which each one has a separate principle, the world of atoms, is here carried out to its utmost extreme.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: II.3.1
  kind: p
  original: Daher kommt es denn auch, daß der soziale Krieg, der Krieg Aller gegen Alle, hier offen erklärt ist.
  en: Hence it comes, too, that the social war, the war of each against all, is here openly declared.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: II.3.2
  kind: p
  original: Wie Freund Stirner sehen die Leute einander nur für brauchbare Subjekte an; jeder beutet den andern aus, und es kommt dabei heraus, daß der Stärkere den Schwächeren unter die Füße tritt und daß die wenigen Starken, das heißt die Kapitalisten, alles an sich reißen, während den vielen Schwachen, den Armen, kaum das nackte Leben bleibt.
  en: Just as in Stirner's recent book, people regard each other only as useful objects; each exploits the other, and the end of it all is, that the stronger treads the weaker under foot, and that the powerful few, the capitalists, seize everything for themselves, while to the weak many, the poor, scarcely a bare existence remains.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: II.4.1
  kind: p
  original: Und was von London gilt, das gilt auch von Manchester, Birmingham und Leeds, das gilt von allen großen Städten.
  en: What is true of London, is true of Manchester, Birmingham, Leeds, is true of all great towns.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: II.4.2
  kind: p
  original: Überall barbarische Gleichgültigkeit, egoistische Härte auf der einen und namenloses Elend auf der andern Seite, überall sozialer Krieg, das Haus jedes einzelnen im Belagerungszustand, überall gegenseitige Plünderung unter dem Schutz des Gesetzes, und das alles so unverschämt, so offenherzig, daß man vor den Konsequenzen unseres gesellschaftlichen Zustandes, wie sie hier unverhüllt auftreten, erschrickt und sich über nichts wundert als darüber, daß das ganze tolle Treiben überhaupt noch zusammenhält.
  en: Everywhere barbarous indifference, hard egotism on one hand, and nameless misery on the other, everywhere social warfare, every man's house in a state of siege, everywhere reciprocal plundering under the protection of the law, and all so shameless, so openly avowed that one shrinks before the consequences of our social state as they manifest themselves here undisguised, and can only wonder that the whole crazy fabric still hangs together.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '257'
- id: II.5.1
  kind: p
  original: Da in diesem sozialen Kriege das Kapital, der direkte oder indirekte Besitz der Lebensmittel und Produktionsmittel, die Waffe ist, mit der gekämpft wird, so ist es einleuchtend, daß alle Nachteile eines solchen Zustandes auf den Armen fallen.
  en: Since capital, the direct or indirect control of the means of subsistence and production, is the weapon with which this social warfare is carried on, it is clear that all the disadvantages of such a state must fall upon the poor.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: II.5.2
  kind: p
  original: Kein Mensch kümmert sich um ihn; hineingestoßen in den wirren Strudel, muß er sich durchschlagen, so gut er kann.
  en: For him no man has the slightest concern. Cast into the whirlpool, he must struggle through as well as he can.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.5.3
  kind: p
  original: Wenn er so glücklich ist, Arbeit zu bekommen, d.h. wenn die Bourgeoisie ihm die Gnade antut, sich durch ihn zu bereichern, so wartet seiner ein Lohn, der kaum hinreicht, Leib und Seele zusammenzuhalten; bekommt er keine Arbeit, so kann er stehlen, falls er die Polizei nicht fürchtet, oder verhungern, und die Polizei wird auch hierbei Sorge tragen, daß er auf eine stille, die Bourgeoisie nicht verletzende Weise verhungert.
  en: If he is so happy as to find work, i.e., if the bourgeoisie does him the favour to enrich itself by means of him, wages await him which scarcely suffice to keep body and soul together; if he can get no work he may steal, if he is not afraid of the police, or starve, in which case the police will take care that he does so in a quiet and inoffensive manner.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: II.5.4
  kind: p
  original: Während meiner Anwesenheit in England sind wenigstens zwanzig bis dreißig Menschen unter den empörendsten Umständen direkt Hungers gestorben, und bei der Totenschau fand sich selten eine Jury, die den Mut hatte, dies geradezu auszusprechen.
  en: During my residence in England, at least twenty or thirty persons have died of simple starvation under the most revolting circumstances, and a jury has rarely been found possessed of the courage to speak the plain truth in the matter.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: II.5.5
  kind: p
  original: 'Die Zeugenaussagen mochten noch so klar, noch so unzweideutig sein - die Bourgeoisie, aus der die Jury gewählt war, fand immer eine Hintertür, durch die sie dem schrecklichen Verdikt: Hungers gestorben, entgehen konnte.'
  en: Let the testimony of the witnesses be never so clear and unequivocal, the bourgeoisie, from which the jury is selected, always finds some backdoor through which to escape the frightful verdict, death from starvation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: II.5.6
  kind: p
  original: Die Bourgeoisie darf in diesen Fällen die Wahrheit aber nicht sagen, sie spräche ja ihr eigen Urteil aus.
  en: The bourgeoisie dare not speak the truth in these cases, for it would speak its own condemnation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: II.5.7
  kind: p
  original: Aber auch indirekt sind viele - noch viel mehr als direkt - Hungers gestorben, indem der anhaltende Mangel zureichender Lebensmittel tödliche Krankheiten hervorrief und so seine Opfer hinwegraffte; indem er sie so schwächte, daß gewisse Umstände, die sonst ganz glücklich abgelaufen wären, notwendig schwere Krankheiten und den Tod herbeiführten.
  en: But indirectly, far more than directly, many have died of starvation, where long continued want of proper nourishment has called forth fatal illness, when it has produced such debility that causes which might otherwise have remained inoperative, brought on severe illness and death.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: II.5.8
  kind: p
  original: Die englischen Arbeiter nennen das sozialen Mord und klagen die ganze Gesellschaft an, daß sie fortwährend dies Verbrechen begehe.
  en: The English working-men call this "social murder," and accuse our whole society of perpetrating this crime perpetually.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: II.5.9
  kind: p
  original: Haben sie unrecht?
  en: Are they wrong?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: II.6.1
  kind: p
  original: Allerdings verhungern immer nur einzelne - aber welche Garantie hat der Arbeiter, daß er nicht morgen auch an die Reihe kommt?
  en: True, it is only individuals who starve, but what security has the working-man that it may not be his turn to-morrow?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: II.6.2
  kind: p
  original: Wer sichert ihm seine Stellung?
  en: Who assures him employment, who vouches for it that, if for any reason or no reason his lord and master discharges him to-morrow, he can struggle along with those dependent upon him, until he may find some one else "to give him bread?"
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.6.3
  kind: p
  original: Wer leistet ihm Gewähr, daß, wenn er morgen von seinem Brotherrn aus irgendeinem Grund oder Ungrund entlassen wird, er sich mit den Seinigen so lange durchschlägt, bis er einen andern findet, der ihm "Brot gibt"?
  en: ''
  joined_to: II.6.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '258'
- id: II.6.4
  kind: p
  original: Wer verbürgt dem Arbeiter, daß der gute Wille zur Arbeit hinreichend ist, um Arbeit zu bekommen, daß Ehrlichkeit, Fleiß, Sparsamkeit, und wie die vielen von der weisen Bourgeoisie ihm empfohlenen Tugenden alle heißen, für ihn wirklich der Weg zum Glücke sind?
  en: Who guarantees that willingness to work shall suffice to obtain work, that uprightness, industry, thrift, and the rest of the virtues recommended by the bourgeoisie, are really his road to happiness?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: II.6.5
  kind: p
  original: Niemand.
  en: No one.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '258'
- id: II.6.6
  kind: p
  original: Er weiß, daß er heute etwas hat und daß es nicht von ihm selbst abhängt, ob er morgen auch noch etwas hat; er weiß, daß jeder Wind, jede Laune des Arbeitgebers, jede schlechte Handelskonjunktur ihn in den wilden Strudel zurückstoßen kann, aus dem er sich temporär gerettet hat und in dem es schwer, oft unmöglich ist, oben zu bleiben.
  en: He knows that he has something to-day, and that it does not depend upon himself whether he shall have something to-morrow. He knows that every breeze that blows, every whim of his employer, every bad turn of trade may hurl him back into the fierce whirlpool from which he has temporarily saved himself, and in which it is hard and often impossible to keep his head above water.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 258-259
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.6.7
  kind: p
  original: Er weiß, daß, wenn er heute leben kann, es sehr ungewiß ist, ob er dies auch morgen kann.
  en: He knows that, though he may have the means of living to-day, it is very uncertain whether he shall to-morrow.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: II.7.1
  kind: p
  original: Gehen wir indes zu einer detaillierteren Untersuchung des Zustandes über, in den der soziale Krieg die besitzlose Klasse versetzt.
  en: Meanwhile, let us proceed to a more detailed investigation of the position, in which the social war has placed the non-possessing class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: II.7.2
  kind: p
  original: Sehen wir, was für Lohn denn eigentlich die Gesellschaft dem Arbeiter für seine Arbeit in Wohnung, Kleidung und Nahrung erstattet, welch eine Existenz sie denen gewährt, die das meiste zur Existenz der Gesellschaft beitragen; nehmen wir zuerst die Wohnungen vor.
  en: Let us see what pay for his work society does give the working-man in the form of dwelling, clothing, food, what sort of subsistence it grants those who contribute most to the maintenance of society; and, first, let us consider the dwellings.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: II.8.1
  kind: p
  original: Jede große Stadt hat ein oder mehrere "schlechte Viertel", in denen sich die arbeitende Klasse zusammendrängt.
  en: Every great city has one or more slums, where the working-class is crowded together.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: II.8.2
  kind: p
  original: Oft freilich wohnt die Armut in versteckten Gäßchen dicht neben den Palästen der Reichen; aber im allgemeinen hat man ihr ein apartes Gebiet angewiesen, wo sie, aus den Augen der glücklicheren Klassen verbannt, sich mit sich selbst durchschlagen mag, so gut es geht.
  en: True, poverty often dwells in hidden alleys close to the palaces of the rich; but, in general, a separate territory has been assigned to it, where, removed from the sight of the happier classes, it may struggle along as it can.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: II.8.3
  kind: p
  original: Diese schlechten Viertel sind in England in allen Städten ziemlich egal eingerichtet - die schlechtesten Häuser in der schlechtesten Gegend der Stadt; meist zweistöckige oder einstöckige Ziegelgebäude in langen Reihen, möglicherweise mit bewohnten Kellerräumen und fast überall unregelmäßig angelegt.
  en: These slums are pretty equally arranged in all the great towns of England, the worst houses in the worst quarters of the towns; usually one or two-storied cottages in long rows, perhaps with cellars used as dwellings, almost always irregularly built.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: II.8.4
  kind: p
  original: Diese Häuschen von drei bis vier Zimmern und einer Küche werden Cottages genannt und sind in ganz England - einige Teile von London ausgenommen - die allgemeinen Wohnungen der arbeitenden Klasse.
  en: These houses of three or four rooms and a kitchen form, throughout England, some parts of London excepted, the general dwellings of the working-class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: II.8.5
  kind: p
  original: Die Straßen selbst sind gewöhnlich ungepflastert, höckerig, schmutzig, voll vegetabilischen und animalischen Abfalls, ohne Abzugskanäle oder Rinnsteine, dafür aber mit stehenden, stinkenden Pfützen versehen.
  en: The streets are generally unpaved, rough, dirty, filled with vegetable and animal refuse, without sewers or gutters, but supplied with foul, stagnant pools instead.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: II.8.6
  kind: p
  original: Dazu wird die Ventilation durch die schlechte, verworrene Bauart des ganzen Stadtviertels erschwert, und da hier viele Menschen auf einem kleinen Raume leben, so kann man sich leicht vorstellen, welche Luft in diesen Arbeiterbezirken herrscht.
  en: Moreover, ventilation is impeded by the bad, confused method of building of the whole quarter, and since many human beings here live crowded into a small space, the atmosphere that prevails in these working-men's quarters may readily be imagined.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: II.8.7
  kind: p
  original: Die Straßen dienen überdies bei schönem Wetter als Trockenplatz; es werden von Haus zu Haus Leinen quer herüber gespannt und mit nasser Wäsche behangen.
  en: Further, the streets serve as drying grounds in fine weather; lines are stretched across from house to house, and hung with wet clothing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: II.9.1
  kind: p
  original: Nehmen wir einige dieser schlechten Viertel durch.
  en: Let us investigate some of the slums in their order.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '259'
- id: II.9.2
  kind: p
  original: Da ist zuerst London, und in London die berühmte "Rabenheckerei" (rookery), St. Giles, die jetzt endlich durch ein paar breite Straßen durchbrochen und so vernichtet werden soll.
  en: London comes first, and in London the famous rookery of St. Giles which is now, at last, about to be penetrated by a couple of broad streets.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N2
  mew_page: 259-260
- id: II.9.3
  kind: p
  original: Dies St. Giles liegt mitten im bevölkertsten Teile der Stadt, umgeben von glänzenden, breiten Straßen, in denen die schöne Welt Londons sich herumtreibt - ganz in der Nähe von Oxford Street und Regent Street, von Trafalgar Square und dem Strand.
  en: St. Giles is in the midst of the most populous part of the town, surrounded by broad, splendid avenues in which the gay world of London idles about, in the immediate neighbourhood of Oxford Street, Regent Street, of Trafalgar Square and the Strand.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: II.9.4
  kind: p
  original: Es ist eine unordentliche Masse von hohen, drei- bis vierstöckigen Häusern, mit engen, krummen und schmutzigen Straßen, auf denen wenigstens ebensoviel Leben ist wie auf den Hauptrouten durch die Stadt, nur daß man in St. Giles bloß Leute aus der arbeitenden Klasse sieht.
  en: It is a disorderly collection of tall, three or four-storied houses, with narrow, crooked, filthy streets, in which there is quite as much life as in the great thoroughfares of the town, except that, here, people of the working-class only are to be seen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: II.9.5
  kind: p
  original: Auf den Straßen wird Markt gehalten, Körbe mit Gemüse und Obst, natürlich alles schlecht und kaum genießbar, verengen die Passage noch mehr, und von ihnen, wie von den Fleischerläden, geht ein abscheulicher Geruch aus.
  en: A vegetable market is held in the street, baskets with vegetables and fruits, naturally all bad and hardly fit to use, obstruct the sidewalk still further, and from these, as well as from the fish-dealers' stalls, arises a horrible smell.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: II.9.6
  kind: p
  original: Die Häuser sind bewohnt vom Keller bis hart unters Dach, schmutzig von außen und innen, und sehen aus, daß kein Mensch drin wohnen möchte.
  en: The houses are occupied from cellar to garret, filthy within and without, and their appearance is such that no human being could possibly wish to live in them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: II.9.7
  kind: p
  original: Das ist aber noch alles nichts gegen die Wohnungen in den engen Höfen und Gäßchen zwischen den Straßen, in die man durch bedeckte Gänge zwischen den Häusern hineingeht und in denen der Schmutz und die Baufälligkeit alle Vorstellung übertrifft - fast keine ganze Fensterscheibe ist zu sehen, die Mauern bröcklig, die Türpfosten und Fensterrahmen zerbrochen und lose, die Türen von alten Brettern zusammengenagelt oder gar nicht vorhanden - hier in diesem Diebsviertel sogar sind keine Türen nötig, weil nichts zu stehlen ist.
  en: But all this is nothing in comparison with the dwellings in the narrow courts and alleys between the streets, entered by covered passages between the houses, in which the filth and tottering ruin surpass all description. Scarcely a whole window-pane can be found, the walls are crumbling, door-posts and window-frames loose and broken, doors of old boards nailed together, or altogether wanting in this thieves' quarter, where no doors are needed, there being nothing to steal.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.9.8
  kind: p
  original: Haufen von Schmutz und Asche liegen überall umher, und die vor die Tür geschütteten schmutzigen Flüssigkeiten sammeln sich in stinkenden Pfützen.
  en: Heaps of garbage and ashes lie in all directions, and the foul liquids emptied before the doors gather in stinking pools.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: II.9.9
  kind: p
  original: Hier wohnen die Ärmsten der Armen, die am schlechtesten bezahlten Arbeiter mit Dieben, Gaunern und Opfern der Prostitution bunt durcheinander - die meisten sind Irländer oder Abkömmlinge von Irländern, und diejenigen, die selbst noch nicht in dem Strudel moralischer Verkommenheit, der sie umgibt, untergegangen sind, sinken doch täglich tiefer, verlieren täglich mehr und mehr die Kraft, den demoralisierenden Einflüssen der Not, des Schmutzes und der schlechten Umgebung zu widerstehen.
  en: Here live the poorest of the poor, the worst paid workers with thieves and the victims of prostitution indiscriminately huddled together, the majority Irish, or of Irish extraction, and those who have not yet sunk in the whirlpool of moral ruin which surrounds them, sinking daily deeper, losing daily more and more of their power to resist the demoralising influence of want, filth, and evil surroundings.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: II.10.1
  kind: p
  original: Aber St. Giles ist nicht das einzige "schlechte Viertel" Londons.
  en: Nor is St. Giles the only London slum.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: II.10.2
  kind: p
  original: In dem ungeheuren Straßenknäul gibt es Hunderte und Tausende verborgener Gassen und Gäßchen, deren Häuser zu schlecht sind für alle, die noch etwas auf menschliche Wohnung verwenden können - oft dicht neben den glänzenden Häusern der Reichen findet man solche Schlupfwinkel der bittersten Armut.
  en: In the immense tangle of streets, there are hundreds and thousands of alleys and courts lined with houses too bad for anyone to live in, who can still spend anything whatsoever upon a dwelling fit for human beings. Close to the splendid houses of the rich such a lurking-place of the bitterest poverty may often be found.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.10.3
  kind: p
  original: So wurde vor kurzem, bei Gelegenheit einer Totenschau, eine Gegend dicht bei Portman Square, einem sehr anständigen öffentlichen Platze, als der Aufenthalt "einer Menge durch Schmutz und Armut demoralisierter Irländer" bezeichnet.
  en: So, a short time ago, on the occasion of a coroner's inquest, a region close to Portman Square, one of the very respectable squares, was characterised as an abode "of a multitude of Irish demoralised by poverty and filth."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '260'
- id: II.10.4
  kind: p
  original: So findet man in Straßen wie Long Acre usw., die zwar nicht fashionabel, aber doch anständig sind, eine Menge Kellerwohnungen, aus denen kränkliche Kindergestalten und halbverhungerte, zerlumpte Frauen ans Tageslicht steigen.
  en: So, too, may be found in streets, such as Long Acre and others, which, though not fashionable, are yet "respectable," a great number of cellar dwellings out of which puny children and half-starved, ragged women emerge into the light of day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 260-261
- id: II.10.5
  kind: p
  original: In der unmittelbaren Nähe des Drury Lane Theaters - des zweiten von London - sind einige der schlechtesten Straßen der ganzen Stadt - Charles, King und Parker Street, deren Häuser ebenfalls von den Kellern an bis unters Dach von lauter armen Familien bewohnt sind.
  en: In the immediate neighbourhood of Drury Lane Theatre, the second in London, are some of the worst streets of the whole metropolis, Charles, King, and Park Streets, in which the houses are inhabited from cellar to garret exclusively by poor families.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: II.10.6
  kind: p
  original: In den Pfarren St. John und St. Margaret in Westminster wohnten 1840 nach dem Journal der Statistischen Gesellschaft 5 366 Arbeiterfamilien in 5 294 "Wohnungen" - wenn sie diesen Namen verdienen -, Männer, Weiber und Kinder, ohne Rücksicht auf Alter oder Geschlecht zusammengeworfen, zusammen 26 830 Individuen, und von der obigen Familienzahl hatten drei Viertel nur ein einziges Zimmer.
  en: In the parishes of St. John and St. Margaret there lived in 1840, according to the Journal of the Statistical Society, 5,366 working-men's families in 5,294 "dwellings" (if they deserve the name!), men, women, and children thrown together without distinction of age or sex, 26,830 persons all told; and of these families three-fourths possessed but one room.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: II.10.7
  kind: p
  original: In der aristokratischen Pfarre St. Georg, Hanover Square, wohnten nach derselben Autorität 1 465 Arbeiterfamilien, zusammen an 6 000 Personen, in gleichen Verhältnissen - auch hier über zwei Drittel der ganzen Anzahl auf je ein Zimmer für die Familie zusammengedrängt.
  en: In the aristocratic parish of St. George, Hanover Square, there lived, according to the same authority, 1,465 working-men's families, nearly 6,000 persons, under similar conditions, and here, too, more than two-thirds of the whole number crowded together at the rate of one family in one room.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: II.10.8
  kind: p
  original: Und wie wird die Armut dieser Unglücklichen, bei denen selbst Diebe nichts mehr zu finden hoffen, von den besitzenden Klassen auf gesetzlichem Wege ausgebeutet!
  en: And how the poverty of these unfortunates, among whom even thieves find nothing to steal, is exploited by the property-holding class in lawful ways!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: II.10.9
  kind: p
  original: 'Die scheußlichen Wohnungen bei Drury Lane, deren eben erwähnt wurde, bezahlen folgende Mieten: zwei Kellerwohnungen 3 sh. (1 Taler), ein Zimmer parterre 4 sh., eine Treppe hoch 41/2 sh., zwei Treppen hoch 4 sh., Dachstuben 3 sh. wöchentlich - so daß allein die ausgehungerten Bewohner der Charles Street den Häuserbesitzern einen jährlichen Tribut von 2 000 Pfd. St. (14 000 Taler) und die erwähnten 5 366 Familien in Westminster eine jährliche Miete von zusammen 40000 Pfd. St. (270000 Taler) bezahlen.'
  en: 'The abominable dwellings in Drury Lane, just mentioned, bring in the following rents: two cellar dwellings, 3s.; one room, ground-floor, 4s.; second-storey, 4s. 6d.; third-floor, 4s.; garret-room, 3s. weekly, so that the starving occupants of Charles Street alone, pay the house-owners a yearly tribute of 2,000 pounds, and the 5,336 families above mentioned in Westminster, a yearly rent of 40,000 pounds.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: II.11.1
  kind: p
  original: Der größte Arbeiterbezirk liegt indes östlich vom Tower - in Whitechapel und Bethnal Green, wo die Hauptmasse der Arbeiter Londons konzentriert ist.
  en: The most extensive working-people's district lies east of the Tower in Whitechapel and Bethnal Green, where the greatest masses of London working-people live.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: II.11.2
  kind: p
  original: 'Hören wir, was Herr G. Alston, der Prediger von St. Philip''s, Bethnal Green, über den Zustand seiner Pfarre sagt:'
  en: Let us hear Mr. G. Alston, preacher of St. Philip's, Bethnal Green, on the condition of his parish.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: II.12.1
  kind: p
  original: '"Sie enthält 1 400 Häuser, die von 2 795 Familien oder ungefähr 12 000 Personen bewohnt werden.'
  en: 'He says: "It contains 1,400 houses, inhabited by 2,795 families, or about 12,000 persons.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.12.2
  kind: p
  original: Der Raum, auf dem diese große Bevölkerung wohnt, ist weniger als 400 Yards (1 200 Fuß) im Quadrat, und bei solch einer Zusammendrängung ist es nichts Ungewöhnliches, daß ein Mann, seine Frau, vier bis fünf Kinder und zuweilen noch Großvater und Großmutter in einem einzigen Zimmer von zehn bis zwölf Fuß im Quadrat gefunden werden, worin sie arbeiten, essen und schlafen.
  en: The space upon which this large population dwells, is less than 400 yards (1,200 feet) square, and in this overcrowding it is nothing unusual to find a man, his wife, four or five children, and, sometimes, both grandparents, all in one single room, where they eat, sleep, and work.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: II.12.3
  kind: p
  original: Ich glaube, daß, ehe der Bischof von London die öffentliche Aufmerksamkeit auf diese so höchst arme Pfarre hinlenkte, man da am Westende der Stadt ebensowenig von ihr wußte wie von den Wilden Australiens oder der Südsee-Inseln.
  en: I believe that before the Bishop of London called attention to this most poverty-stricken parish, people at the West End knew as little of it as of the savages of Australia or the South Sea Isles.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '261'
- id: II.12.4
  kind: p
  original: Und wenn wir uns einmal mit den Leiden dieser Unglücklichen durch eigne Anschauung bekannt machen, wenn wir sie bei ihrem kargen Mahle belauschen und sie von Krankheit oder Arbeitslosigkeit gebeugt sehen, so werden wir eine solche Masse von Hülflosigkeit und Elend finden, daß eine Nation wie die unsrige über die Möglichkeit derselben sich zu schämen hat.
  en: And if we make ourselves acquainted with these unfortunates, through personal observation, if we watch them at their scanty meal and see them bowed by illness and want of work, we shall find such a mass of helplessness and misery, that a nation like ours must blush that these things can be possible.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 261-262
- id: II.12.5
  kind: p
  original: Ich war Pfarrer bei Huddersfield während der drei Jahre, in denen die Fabriken am schlechtesten gingen; aber ich habe nie eine so gänzliche Hülflosigkeit der Armen gesehen wie seitdem in Bethnal Green.
  en: I was rector near Huddersfield during the three years in which the mills were at their worst, but I have never seen such complete helplessness of the poor as since then in Bethnal Green.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: II.12.6
  kind: p
  original: Nicht ein Familienvater aus zehnen in der ganzen Nachbarschaft hat andere Kleider als sein Arbeitszeug, und das ist noch so schlecht und zerlumpt wie möglich; ja viele haben außer diesen Lampen keine andere Decke während der Nacht und als Bette nichts als einen Sack mit Stroh und Hobelspänen."
  en: Not one father of a family in ten in the whole neighbourhood has other clothing than his working suit, and that is as bad and tattered as possible; many, indeed, have no other covering for the night than these rags, and no bed, save a sack of straw and shavings."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: II.13.1
  kind: p
  original: Wir sehen schon aus der obigen Beschreibung, wie es in diesen Wohnungen selbst auszusehen pflegt.
  en: The foregoing description furnishes an idea of the aspect of the interior of the dwellings.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: II.13.2
  kind: p
  original: Zum Überfluß wollen wir den englischen Behörden, die zuweilen dahin geraten, noch in einige Proletarierwohnungen folgen.
  en: But let us follow the English officials, who occasionally stray thither, into one or two of these working-men's homes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: II.14.1
  kind: p
  original: 'Bei Gelegenheit einer Totenschau, die Herr Carter, Coroner für Surrey, über die Leiche der 45jährigen Ann Galway am 14. November 1843 abhielt, erzählen die Journale folgendes von der Wohnung der Verstorbenen: Sie hatte in Nr. 3, White Lion Court, Bermondsey Street, London, mit ihrem Mann und ihrem 19jährigen Sohne in einem kleinen Zimmer gewohnt, worin sich weder Bettstelle oder Bettzeug noch sonstige Möbel befanden.'
  en: 'On the occasion of an inquest held Nov. 14th, 1843, by Mr. Carter, coroner for Surrey, upon the body of Ann Galway, aged 45 years, the newspapers related the following particulars concerning the deceased: She had lived at No. 3 White Lion Court, Bermondsey Street, London, with her husband and a nineteen-year-old son in a little room, in which neither a bedstead nor any other furniture was to be seen.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.14.2
  kind: p
  original: Sie lag tot neben ihrem Sohn auf einem Haufen Federn, die über ihren fast nackten Körper gestreut waren, denn es war weder Decke noch Bettuch vorhanden.
  en: She lay dead beside her son upon a heap of feathers which were scattered over her almost naked body, there being neither sheet nor coverlet.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: II.14.3
  kind: p
  original: Die Federn klebten so fest an ihr über den ganzen Körper, daß der Arzt die Leiche nicht untersuchen konnte, bevor sie gereinigt war, und dann fand er sie ganz abgemagert und über und über von Ungeziefer zerbissen.
  en: The feathers stuck so fast over the whole body that the physician could not examine the corpse until it was cleansed, and then found it starved and scarred from the bites of vermin.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: II.14.4
  kind: p
  original: Ein Teil des Fußbodens im Zimmer war aufgerissen, und das Loch wurde von der Familie als Abtritt benutzt.
  en: Part of the floor of the room was torn up, and the hole used by the family as a privy. On Monday, Jan.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.15.1
  kind: p
  original: Montag, den 15. Januar 1844 wurden zwei Knaben vor das Polizeigericht von Worship Street, London, gebracht, weil sie aus Hunger einen halbgekochten Kuhfuß von einem Laden gestohlen und sogleich verzehrt hatten.
  en: 15th, 1844, two boys were brought before the police magistrate because, being in a starving condition, they had stolen and immediately devoured a half-cooked calf's foot from a shop.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: II.15.2
  kind: p
  original: 'Der Polizeirichter sah sich veranlaßt, weiter nachzuforschen, und erhielt von den Polizeidienern bald folgende Aufklärung: Die Mutter dieser Knaben war die Witwe eines alten Soldaten und späteren Polizeidieners, der es seit dem Tode ihres Mannes mit ihren neun Kindern sehr schlecht ergangen war, Sie wohnte Nr. 2, Pool''s Place, Quaker Street, Spitalfields, im größten Elende.'
  en: 'The magistrate felt called upon to investigate the case further, and received the following details from the policeman: The mother of the two boys was the widow of an ex-soldier, afterwards policeman, and had had a very hard time since the death of her husband, to provide for her nine children. She lived at No. 2 Pool''s Place, Quaker Court, Spitalfields, in the utmost poverty.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.15.3
  kind: p
  original: Als der Polizeidiener zu ihr kam, fand er sie mit sechs ihrer Kinder in einem kleinen Hinterstübchen buchstäblich zusammengedrängt, ohne Möbel, ausgenommen zwei alte Binsenstühle ohne Boden, einen kleinen Tisch mit zwei zerbrochenen Beinen, eine zerbrochene Tasse und eine kleine Schüssel.
  en: When the policeman came to her, he found her with six of her children literally huddled together in a little back room, with no furniture but two old rush-bottomed chairs with the seats gone, a small table with two legs broken, a broken cup, and a small dish.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '262'
- id: II.15.4
  kind: p
  original: Auf dem Herde kaum ein Funken Feuer, und in der Ecke so viel alte Lumpen, als eine Frau in ihre Schürze nehmen konnte, die aber der ganzen Familie zum Bette dienten.
  en: On the hearth was scarcely a spark of fire, and in one corner lay as many old rags as would fill a woman's apron, which served the whole family as a bed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 262-263
- id: II.15.5
  kind: p
  original: Zur Decke hatten sie nichts als ihre ärmliche Kleidung.
  en: For bed clothing they had only their scanty day clothing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: II.15.6
  kind: p
  original: Die arme Frau erzählte ihm, daß sie voriges Jahr ihr Bett habe verkaufen müssen, um Nahrung zu erhalten; ihre Bettücher habe sie dem Viktualienhändler als Unterpfand für einige Lebensmittel dagelassen, und sie habe überhaupt alles verkaufen müssen, um nur Brot zu bekommen.
  en: The poor woman told him that she had been forced to sell her bedstead the year before to buy food. Her bedding she had pawned with the victualler for food. In short, everything had gone for food.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.15.7
  kind: p
  original: Der Polizeirichter gab der Frau einen beträchtlichen Vorschuß aus der Armenbüchse.
  en: The magistrate ordered the woman a considerable provision from the poor-box.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: II.16.1
  kind: p
  original: Im Februar 1844 wurde eine Witwe von sechzig Jahren, Theresa Bishop, mit ihrer 26jährigen kranken Tochter der Wohltätigkeit des Polizeirichters von Marlborough Street empfohlen.
  en: In February, 1844, Theresa Bishop, a widow 60 years old, was recommended, with her sick daughter, aged 26, to the compassion of the police magistrate in Marlborough Street.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: II.16.2
  kind: p
  original: Sie wohnte in Nr. 5, Brown Street, Grosvenor Square, in einem kleinen Hinterzimmer, nicht größer als ein Schrank, worin nicht ein einziges Stück Möbel war.
  en: She lived at No. 5 Brown Street, Grosvenor Square, in a small back room no larger than a closet, in which there was not one single piece of furniture.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: II.16.3
  kind: p
  original: In einer Ecke lagen einige Lumpen, auf denen die beiden schliefen; eine Kiste diente als Tisch und Stuhl zugleich.
  en: In one corner lay some rags upon which both slept; a chest served as table and chair.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: II.16.4
  kind: p
  original: Die Mutter verdiente etwas durch Stubenreinigen; sie hatten, wie der Wirt sagte, seit Mai 1843 in diesem Zustande gelebt, allmählich alles verkauft oder versetzt, was sie noch hatten, und dennoch nie die Miete bezahlt.
  en: The mother earned a little by charring. The owner of the house said that they had lived in this way since May, 1843, had gradually sold or pawned everything that they had, and had still never paid any rent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.16.5
  kind: p
  original: Der Polizeirichter ließ ihnen ein Pfund aus der Armenbüchse zukommen.
  en: The magistrate assigned them 1 pound from the poor-box.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: II.17.1
  kind: p
  original: Es fällt mir nicht ein, zu behaupten, alle Londoner Arbeiter lebten in einem solchen Elend wie die obigen drei Familien; ich weiß wohl, daß zehn es besser haben, wo einer so ganz und gar von der Gesellschaft mit Füßen getreten wird - aber ich behaupte, daß Tausende von fleißigen und braven Familien, viel braver, viel ehrenwerter als sämtliche Reiche von London, in dieser eines Menschen unwürdigen Lage sich befinden und daß jeder Proletarier, jeder ohne Ausnahme, ohne seine Schuld und trotz allen seinen Anstrengungen, von gleichem Schicksal getroffen werden kann.
  en: I am far from asserting that all London working-people live in such want as the foregoing three families. I know very well that ten are somewhat better off, where one is so totally trodden under foot by society; but I assert that thousands of industrious and worthy people--far worthier and more to be respected than all the rich of London--do find themselves in a condition unworthy of human beings; and that every proletarian, everyone, without exception, is exposed to a similar fate without any fault of his own and in spite of every possible effort.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.18.1
  kind: p
  original: Aber bei alledem sind diejenigen noch glücklich, die nur noch ein Obdach irgendeiner Art haben - glücklich gegen die ganz Obdachlosen.
  en: But in spite of all this, they who have some kind of a shelter are fortunate, fortunate in comparison with the utterly homeless.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: II.18.2
  kind: p
  original: In London stehen jeden Morgen fünfzigtausend Menschen auf, ohne zu wissen, wo sie für die nächste Nacht ihr Haupt hinlegen sollen.
  en: In London fifty thousand human beings get up every morning, not knowing where they are to lay their heads at night.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: II.18.3
  kind: p
  original: Die glücklichsten dieser Zahl, denen es gelingt, am Abend einen oder ein paar Pence zu erübrigen, gehen in ein sogenanntes Logierhaus (lodging-house), deren es in allen großen Städten eine Menge gibt und wo sie für ihr Geld ein Unterkommen finden.
  en: The luckiest of this multitude, those who succeed in keeping a penny or two until evening, enter a lodging-house, such as abound in every great city, where they find a bed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: II.18.4
  kind: p
  original: Aber welch ein Unterkommen!
  en: But what a bed!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: II.18.5
  kind: p
  original: Das Haus ist von oben bis unten mit Betten angefüllt, vier, fünf, sechs Betten in einer Stube, soviel ihrer hineingehen.
  en: These houses are filled with beds from cellar to garret, four, five, six beds in a room; as many as can be crowded in.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: II.18.6
  kind: p
  original: In jedes Bett werden vier, fünf, sechs Menschen gestopft, ebenfalls soviel ihrer hineingehen - Kranke und Gesunde, Alte und Junge, Männer und Weiber, Trunkene und Nüchterne, wie es gerade kommt, alles bunt durcheinander.
  en: Into every bed four, five, or six human beings are piled, as many as can be packed in, sick and well, young and old, drunk and sober, men and women, just as they come, indiscriminately.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '263'
- id: II.18.7
  kind: p
  original: Da gibt es denn Streit, Schlägereien und Verwundungen - und wenn sich die Bettgenossen vertragen, so ist das noch schlimmer, es werden Diebstähle verabredet oder Dinge getrieben, deren Bestialität unsere menschlicher gewordenen Sprachen nicht in Worten wiedergeben wollen.
  en: Then come strife, blows, wounds, or, if these bedfellows agree, so much the worse; thefts are arranged and things done which our language, grown more humane than our deeds, refuses to record.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 263-264
- id: II.18.8
  kind: p
  original: Und diejenigen, die kein solches Nachtlager bezahlen können?
  en: And those who cannot pay for such a refuge?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: II.18.9
  kind: p
  original: 'Nun, die schlafen, wo sie Platz finden, in Passagen, Arkaden, in irgendeinem Winkel, wo die Polizei oder die Eigentümer sie ungestört schlafen lassen; einzelne kommen wohl unter in den Zufluchtshäusern, die hier und dort von der Privatwohltätigkeit errichtet wurden - andere schlafen in den Parks auf den Bänken, dicht unter den Fenstern der Königin Viktoria - hören wir, was die "Times" vom Oktober 1843 sagt:'
  en: 'They sleep where they find a place, in passages, arcades, in corners where the police and the owners leave them undisturbed. A few individuals find their way to the refuges which are managed, here and there, by private charity, others sleep on the benches in the parks close under the windows of Queen Victoria. Let us hear the London Times:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.19.1
  kind: p
  original: '"Aus unserm gestrigen Polizeibericht geht hervor, daß eine Durchschnittsanzahl von fünfzig menschlichen Wesen jede Nacht in den Parks schlafen, ohne anderen Schutz gegen das Wetter als die Bäume und einige Höhlungen in den Dämmen.'
  en: '"It appears from the report of the proceedings at Marlborough Street Police Court in our columns of yesterday, that there is an average number of 50 human beings of all ages, who huddle together in the parks every night, having no other shelter than what is supplied by the trees and a few hollows of the embankment.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: II.19.2
  kind: p
  original: Die meisten derselben sind junge Mädchen, die von Soldaten verführt, in die Hauptstadt gebracht und in die weite Welt hinausgestoßen sind, hinaus in all die Verlassenheit der Not in einer fremden Stadt, in all die wilde Unbekümmertheit frühreifen Lasters.
  en: Of these, the majority are young girls who have been seduced from the country by the soldiers and turned loose on the world in all the destitution of friendless penury, and all the recklessness of early vice.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: II.20.1
  kind: p
  original: Das ist in Wahrheit schrecklich.
  en: '"This is truly horrible!'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: II.20.2
  kind: p
  original: Arme muß es überall geben.
  en: Poor there must be everywhere.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: II.20.3
  kind: p
  original: Der Mangel wird überallhin seinen Weg finden und sich mit seiner ganzen Scheußlichkeit im Herze einer großen und üppigen Stadt niederlassen.
  en: Indigence will find its way and set up its hideous state in the heart of a great and luxurious city.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: II.20.4
  kind: p
  original: In den tausend engen Gassen und Gäßchen einer volkreichen Metropole muß es immer, fürchten wir, viel Leiden geben viel, das das Auge beleidigt - viel, das nie ans Tageslicht kommt.
  en: Amid the thousand narrow lanes and by-streets of a populous metropolis there must always, we fear, be much suffering--much that offends the eye--much that lurks unseen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: II.21.1
  kind: p
  original: Aber daß im Kreise, den sich Reichtum, Fröhlichkeit und Glanz gezogen haben, daß nahe an der königlichen Größe von St. James, hart am strahlenden Palast von Bayswater, wo das alte und das neue aristokratische Viertel sich begegnen, in eine Gegend, wo das vorsichtige Raffinement moderner Städtebaukunst sich gehütet hat, auch nur die kleinste Hütte für die Armut zu errichten, in einer Gegend, die den ausschließlichsten Genüssen des Reichtums geweiht zu sein scheint - daß da Not und Hunger und Krankheit und Laster mit all ihren verwandten Schrecken einherziehen, verzehrend Leib auf Leib, Seele auf Seele!
  en: '"But that within the precincts of wealth, gaiety, and fashion, nigh the regal grandeur of St. James, close on the palatial splendour of Bayswater, on the confines of the old and new aristocratic quarters, in a district where the cautious refinement of modern design has refrained from creating one single tenement for poverty; which seems, as it were, dedicated to the exclusive enjoyment of wealth, that there want, and famine, and disease, and vice should stalk in all their kindred horrors, consuming body by body, soul, by soul!'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: II.22.1
  kind: p
  original: Es ist in der Tat ein monströser Zustand.
  en: '"It is indeed a monstrous state of things!'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: II.22.2
  kind: p
  original: Die höchsten Genüsse, welche körperliche Gesundheit, geistige Anregung, unschuldigere Sinnenfreuden gewähren können, in unmittelbarer Berührung mit dem härtesten Elend!
  en: Enjoyment the most absolute, that bodily ease, intellectual excitement, or the more innocent pleasures of sense can supply to man's craving, brought in close contact with the most unmitigated misery!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: II.22.3
  kind: p
  original: Reichtum, von seinen glänzenden Salons herab lachend, mit brutaler Gedankenlosigkeit lachend bei den ungekannten Wunden des Mangels!
  en: Wealth, from its bright saloons, laughing--an insolently heedless laugh--at the unknown wounds of want!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: II.22.4
  kind: p
  original: Freude, unbewußt aber grausam verhöhnend den Schmerz der dort unten stöhnt!
  en: Pleasure, cruelly but unconsciously mocking the pain that moans below!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: II.22.5
  kind: p
  original: Alle Gegensätze im Kampf, alle im Widerstreit, nur nicht das Laster, das in Versuchung führt, und das Laster, das sich versuchen läßt...
  en: All contrary things mocking one another--all contrary, save the vice which tempts and the vice which is tempted!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: II.22.6
  kind: p
  original: 'Aber all Menschen mögen des gedenken: daß in dem glänzendsten Bezirk der reichsten Stadt auf dieser Erde, Nacht auf Nacht, Winter auf Winter, Weiber zu finden sind, Weiber jung an Jahren, alt an Sünden und Leiden, Ausgestoßene der Gesellschaft, verfaulend in Hunger, Schmutz und Krankheit.'
  en: '"But let all men remember this--that within the most courtly precincts of the richest city of God''s earth, there may be found, night after night, winter after winter, women--young in years--old in sin and suffering--outcasts from society--ROTTING FROM FAMINE, FILTH, AND DISEASE.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '264'
- id: II.22.7
  kind: p
  original: Mögen sie des gedenken und lernen, nicht zu theoretisieren, sondern zu handeln.
  en: Let them remember this, and learn not to theorise but to act.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 264-265
- id: II.22.8
  kind: p
  original: Gott weiß, es ist viel Raum da zum Handeln heutzutage!"
  en: God knows, there is much room for action nowadays."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
  en_note: 'English note {32}: Times, Oct. 12th, 1843.'
- id: II.23.1
  kind: p
  original: Ich sprach oben von Zufluchtshäusern für Obdachlose.
  en: I have referred to the refuges for the homeless.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: II.23.2
  kind: p
  original: Wie sehr diese überlaufen sind, mögen uns zwei Beispiele lehren.
  en: How greatly overcrowded these are, two examples may show.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: II.23.3
  kind: p
  original: Ein neuerrichtetes "Refuge of the Houseless" [Obdachlosenasyl] in Upper Ogle Street, das jede Nacht 300 Personen beherbergen kann, nahm seit seiner Eröffnung am 27. Januar bis zum 17. März 1844 2 740 Personen für eine oder mehrere Nächte auf; und obwohl die Jahreszeit günstiger wurde, war die Zahl der Applikanten sowohl in diesem als in den Asylen von Whitecross Street und Wapping stark im Zunehmen begriffen, und jede Nacht mußten eine Menge Obdachloser aus Mangel an Raum zurückgewiesen werden.
  en: A newly erected Refuge for the Houseless in Upper Ogle Street, that can shelter three hundred persons every night, has received since its opening, January 27th to March 17th, 1844, 2,740 persons for one or more nights; and, although the season was growing more favourable, the number of applicants in this, as well as in the asylums of Whitecross Street and Wapping, was strongly on the increase, and a crowd of the homeless had to be sent away every night for want of room.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: II.23.4
  kind: p
  original: In einem andern, dem Zentral-Asyl von Playhouse Yard, wurden in den ersten drei Monaten des Jahres 1844 durchschnittlich jede Nacht 460 Nachtlager gegeben, im ganzen 6 681 Personen beherbergt und 96 141 Rationen Brot verteilt.
  en: In another refuge, the Central Asylum in Playhouse Yard, there were supplied on an average 460 beds nightly, during the first three months of the year 1844, 6,681 persons being sheltered, and 96,141 portions of bread were distributed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: II.23.5
  kind: p
  original: Dennoch erklärt das leitende Komitee, daß auch diese Anstalt dem Andrange der Benötigten einigermaßen erst dann genügt habe, als auch das östliche Asyl der Aufnahme von Obdachlosen geöffnet worden sei.
  en: Yet the committee of directors declare this institution began to meet the pressure of the needy to a limited extent only when the Eastern Asylum also was opened.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: II.24.1
  kind: p
  original: Verlassen wir London, um die übrigen großen Städte der drei Reiche der Reihe nach durchzugehen.
  en: Let us leave London and examine the other great cities of the three kingdoms in their order.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: II.24.2
  kind: p
  original: Nehmen wir zunächst Dublin, eine Stadt, deren Einfahrt von der See aus ebenso reizend wie die von London imposant ist; die Bai von Dublin ist die schönste des ganzen britischen Inselreichs und pflegt von den Irländern wohl gar mit der von Neapel verglichen zu werden.
  en: Let us take Dublin first, a city the approach to which from the sea is as charming as that of London is imposing. The Bay of Dublin is the most beautiful of the whole British Island Kingdom, and is even compared by the Irish with the Bay of Naples.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.24.3
  kind: p
  original: Die Stadt selbst hat ebenfalls große Schönheiten, und die aristokratischen Teile derselben sind besser und geschmackvoller angelegt als die irgendeiner andern britischen Stadt.
  en: The city, too, possesses great attractions, and its aristocratic districts are better and more tastefully laid out than those of any other British city.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T1
    editions: '1892'
    reading: Schönheit
    base_text: … hat ebenfalls große Schönheiten ‸ , und die aristokratischen …
  mew_page: '265'
- id: II.24.4
  kind: p
  original: Aber dafür gehören auch die ärmeren Bezirke von Dublin zu dem Widerlichsten und Häßlichsten, was man in der Welt sehen kann.
  en: By way of compensation, however, the poorer districts of Dublin are among the most hideous and repulsive to be seen in the world.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: II.24.5
  kind: p
  original: Allerdings hat daran der irische Volkscharakter, der sich unter Umständen erst im Schmutz behaglich fühlt, seinen Anteil; aber da wir in jeder großen Stadt Englands und Schottlands auch Tausende von Irländern finden und jede arme Bevölkerung allmählich in dieselbe Unreinlichkeit versinken muß, so ist das Elend in Dublin nichts Spezifisches, nichts der irischen Stadt allein Angehöriges mehr, sondern etwas, das allen großen Städten der ganzen Welt gemeinsam ist.
  en: True, the Irish character, which, under some circumstances, is comfortable only in the dirt, has some share in this; but as we find thousands of Irish in every great city in England and Scotland, and as every poor population must gradually sink into the same uncleanliness, the wretchedness of Dublin is nothing specific, nothing peculiar to Dublin, but something common to all great towns.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: II.24.6
  kind: p
  original: Die armen Distrikte von Dublin sind überaus ausgedehnt, und der Schmutz, die Unbewohnbarkeit der Häuser, die Vernachlässigung der Straßen übersteigen alle Begriffe.
  en: The poor quarters of Dublin are extremely extensive, and the filth, the uninhabitableness of the houses and the neglect of the streets, surpass all description.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '265'
- id: II.24.7
  kind: p
  original: Von der Art, wie die Armen hier zusammengedrängt sind kann man sich eine Vorstellung machen, wenn man hört, daß 1817 nach dem Bericht der Inspektoren des Arbeitshauses in Barrack Street in 52 Häusern mit 390 Zimmern 1 318 Personen und in Church Street und der Umgegend in 71 Häusern mit 393 Zimmern 1 997 Menschen wohnten; daß "in diesem und dem anstoßenden Distrikt eine Menge stinkender (foul) Gäßchen und Höfe sind, daß manche Keller ihr Licht nur durch die Türe empfangen und in mehreren derselben die Einwohner auf der nackten Erde schlafen, obwohl die Mehrzahl derselben doch wenigstens Bettstellen besitzt - daß aber z.B. Nicholson's Court in 28 kleinen, elenden Stuben 151 Menschen in der größten Not enthält, so daß in dem ganzen Hof nur zwei Bettstellen und zwei Bettdecken zu finden waren".
  en: 'Some idea of the manner in which the poor are here crowded together may be formed from the fact that, in 1817, according to the report of the Inspector of Workhouses, 1,318 persons lived in 52 houses with 390 rooms in Barral Street, and 1,997 persons in 71 houses with 393 rooms in and near Church Street; that: "In this and the adjoining district there exists a multitude of foul courts and alleys; many cellars receive all their light through the door, while in not a few the inhabitants sleep upon the bare floor, though most of them possess bedsteads at least; Nicholson''s Court, for example, contains twenty-eight wretched little rooms with 151 human beings in the greatest want, there being but two bedsteads and two blankets to be found in the whole court."'
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N3
  mew_page: 265-266
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.25.1
  kind: p
  original: Die Armut ist so groß in Dublin, daß eine einzige wohltätige Anstalt, die der "Mendicity Association" ["Bettler(fürsorge)-Vereinigung"], täglich 2 500 Personen, also ein Prozent der ganzen Bevölkerung, aufnimmt, den Tag über ernährt und abends wieder entläßt.
  en: The poverty is so great in Dublin, that a single benevolent institution, the Mendicity Association, gives relief to 2,500 persons or one per cent. of the population daily, receiving and feeding them for the day and dismissing them at night.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '266'
- id: II.26.1
  kind: p
  original: Ein Gleiches erzählt uns Dr. Alison von Edinburgh - wieder einer Stadt, deren prächtige Lage, die ihr den Namen des modernen Athens verschafft hat, und deren glänzendes aristokratisches Viertel in der Neustadt schroff mit dem stinkenden Elend der Armen in der Altstadt kontrastiert.
  en: Dr. Alison describes a similar state of things in Edinburgh, whose superb situation, which has won it the title of the Modern Athens, and whose brilliant aristocratic quarter in the New Town, contrast strongly with the foul wretchedness of the poor in the Old Town.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '266'
- id: II.26.2
  kind: p
  original: Alison behauptet, dieser große Stadtteil sei ebenso unflätig und scheußlich wie die schlechtesten Distrikte von Dublin, und die "Mendicity Association" würde in Edinburgh eine ebenso große Proportion Notleidender zu unterstützen haben wie in der irischen Hauptstadt; ja, er sagt, die Armen in Schottland, namentlich in Edinburgh und Glasgow, seien schlimmer daran als in irgendeiner andern Gegend des britischen Reichs, und die elendesten seien nicht Irländer, sondern Schotten.
  en: Alison asserts that this extensive quarter is as filthy and horrible as the worst district of Dublin, while the Mendicity Association would have as great a proportion of needy persons to assist in Edinburgh as in the Irish capital. He asserts, indeed, that the poor in Scotland, especially in Edinburgh and Glasgow, are worse off than in any other region of the three kingdoms, and that the poorest are not Irish, but Scotch.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '266'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.26.3
  kind: p
  original: 'Der Prediger der alten Kirche in Edinburgh, Dr. Lee, sagte 1836 vor der Commission of Religious Instruction [Kommission für religiöse Unterweisung] aus:'
  en: 'The preacher of the Old Church of Edinburgh, Dr. Lee, testified in 1836, before the Commission of Religious Instruction, that:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '266'
- id: II.27.1
  kind: p
  original: '"Er habe solches Elend wie in seiner Pfarre nirgends zuvor gesehen.'
  en: '"He had never before seen such misery as in his parish, where the people were without furniture, without everything, two married couples often sharing one room.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '266'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.27.2
  kind: p
  original: Die Leute seien ohne Möbel, ohne alles; häufig wohnten zwei Ehepaare in einem Zimmer.
  en: ''
  joined_to: II.27.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '266'
- id: II.27.3
  kind: p
  original: An einem Tage sei er in sieben Häusern gewesen, in denen kein Bett - in einigen sogar kein Stroh gewesen sei; achtzigjährige Leute hätten auf dem bretternen Boden geschlafen, fast alle brächten die Nacht in ihren Kleidern zu.
  en: In a single day he had visited seven houses in which there was not a bed, in some of them not even a heap of straw. Old people of eighty years sleep on the board floor, nearly all slept in their day-clothes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '266'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.27.4
  kind: p
  original: In einem Kellerraum habe er zwei schottische Familien vom Lande gefunden; bald nach ihrer Ankunft in der Stadt seien zwei Kinder gestorben, das dritte sei zur Zeit seines Besuchs im Sterben gewesen - für jede Familie habe ein schmutziger Strohhaufen in einem Winkel gelegen und obendrein habe der Keller, der so dunkel gewesen sei, daß man bei Tage keinen Menschen darin habe erkennen können, noch einen Esel beherbergt.
  en: In one cellar room he found two families from a Scotch country district; soon after their removal to the city two of the children had died, and a third was dying at the time of his visit. Each family had a filthy pile of straw lying in a corner; the cellar sheltered besides the two families a donkey, and was, moreover, so dark that it was impossible to distinguish one person from another by day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 266-267
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.27.5
  kind: p
  original: Es müsse ein Herz von Demant bluten machen, solches Elend in einem Lande wie Schottland zu sehen."
  en: Dr. Lee declared that it was enough to make a heart of adamant bleed to see such misery in a country like Scotland."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: II.28.1
  kind: p
  original: Ähnliches berichtet Dr. Hennen im "Edinburgh Medical and Surgical Journal".
  en: In the Edinburgh Medical and Surgical Journal, Dr. Hennan reports a similar state of things.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: II.28.2
  kind: p
  original: Aus einem Parlamentsberichte geht hervor, welche Unreinlichkeit - wie unter solchen Umständen wohl zu erwarten ist - in den Häusern der Edinburgher Armen herrscht.
  en: From a Parliamentary Report, it is evident that in the dwellings of the poor of Edinburgh a want of cleanliness reigns, such as must be expected under these conditions.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N4
  mew_page: '267'
- id: II.28.3
  kind: p
  original: Auf den Bettpfosten halten Hühner ihr Nachlager, Hunde und sogar Pferde schlafen mit den Menschen in einem Zimmer, und die natürliche Folge davon ist, daß ein entsetzlicher Schmutz und Gestank sowie Heere von Ungeziefer aller Art in diesen Wohnungen existieren.
  en: On the bed-posts chickens roost at night, dogs and horses share the dwellings of human beings, and the natural consequence is a shocking stench, with filth and swarms of vermin.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: II.28.4
  kind: p
  original: Die Bauart Edinburghs begünstigt diesen scheußlichen Zustand soviel wie möglich.
  en: The prevailing construction of Edinburgh favours these atrocious conditions as far as possible.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: II.28.5
  kind: p
  original: Die Altstadt ist an beiden Abhängen eines Hügels gebaut, über dessen Rücken die Hochstraße (high street) läuft.
  en: The Old Town is built upon both slopes of a hill, along the crest of which runs the High Street.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: II.28.6
  kind: p
  original: Von dieser aus laufen nach beiden Seiten eine Menge schmaler, krummer Gäßchen, von ihren vielen Windungen wynds genannt, den Berg hinab, und diese bilden den proletarischen Stadtteil.
  en: Out of the High Street there open downwards multitudes of narrow, crooked alleys, called wynds from their many turnings, and these wynds form the proletarian district of the city.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
- id: II.28.7
  kind: p
  original: Die Häuser der schottischen Städte sind überhaupt hoch, fünf- und sechsstöckig wie in Paris, und im Gegensatz zu England, wo soviel wie möglich jeder sein apartes Haus hat, von einer großen Anzahl verschiedener Familien bewohnt; die Zusammendrängung vieler Menschen auf einer kleinen Fläche wird hierdurch noch vergrößert.
  en: The houses of the Scotch cities, in general, are five or six-storied buildings, like those of Paris, and in contrast with England where, so far as possible, each family has a separate house. The crowding of human beings upon a limited area is thus intensified.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '267'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.29.1
  kind: p
  original: '"Diese Straßen", sagt ein englisches Journal in einem Artikel über die Gesundheitsverhältnisse der Arbeiter in Städten - "diese Straßen sind oft so eng, daß man aus dem Fenster des einen Hauses in das des gegenüberstehenden steigen kann, und dabei sind die Häuser so hoch Stock auf Stock getürmt, daß das Licht kaum in den Hof oder die Gasse, die dazwischenliegt, hineinzudringen vermag.'
  en: '"These streets," says an English journal in an article upon the sanitary condition of the working-people in cities, "are often so narrow that a person can step from the window of one house into that of its opposite neighbour, while the houses are piled so high, storey upon storey, that the light can scarcely penetrate into the court or alley that lies between.'
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N5
  mew_page: '267'
- id: II.29.2
  kind: p
  original: In diesem Teile der Stadt sind weder Kloaken noch sonstige zu den Häusern gehörende Abzüge oder Abtritte; und daher wird aller Unrat, Abfall und Exkremente von wenigstens 50 000 Personen jede Nacht in die Rinnsteine geworfen, so daß trotz alles Straßenkehrens eine Masse aufgetrockneten Kots und ein stinkender Dunst entsteht und dadurch nicht nur Auge und Geruch beleidigt, sondern auch die Gesundheit der Bewohner aufs höchste gefährdet wird.
  en: In this part of the city there are neither sewers nor other drains, nor even privies belonging to the houses. In consequence, all refuse, garbage, and excrements of at least 50,000 persons are thrown into the gutters every night, so that, in spite of all street sweeping, a mass of dried filth and foul vapours are created, which not only offend the sight and smell, but endanger the health of the inhabitants in the highest degree.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 267-268
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.29.3
  kind: p
  original: Ist es zu verwundern, daß in solchen Lokalitäten alle Rücksichten auf Gesundheit, Sitten und selbst den gewöhnlichsten Anstand gänzlich vernachlässigt werden?
  en: Is it to be wondered at, that in such localities all considerations of health, morals, and even the most ordinary decency are utterly neglected?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: II.29.4
  kind: p
  original: Im Gegenteil, alle, die den Zustand der Bewohner näher kennen, werden Zeugnis geben, welchen hohen Grad Krankheit, Elend und Demoralisation hier erreicht haben.
  en: On the contrary, all who are more intimately acquainted with the condition of the inhabitants will testify to the high degree which disease, wretchedness, and demoralisation have here reached.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: II.29.5
  kind: p
  original: Die Gesellschaft ist in diesen Gegenden zu einer unbeschreiblich niedrigen und elenden Stufe herabgesunken.
  en: Society in such districts has sunk to a level indescribably low and hopeless.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: II.29.6
  kind: p
  original: '- Die Wohnungen der ärmeren Klasse sind im allgemeinen sehr schmutzig und augenscheinlich nie auf irgendeine Weise gereinigt; sie bestehen in den meisten Fällen aus einem einzigen Zimmer, das, bei der schlechtesten Ventilation, dennoch wegen zerbrochener, schlecht passender Fenster kalt ist - zuweilen feucht und teilweise unter der Erde, immer schlecht möbliert und durchaus unwohnlich, so daß ein Strohhaufen oft einer ganzen Familie zum Bette dient, auf dem Männer und Weiber, Junge und Alte in empörender Verwirrung durcheinanderliegen.'
  en: The houses of the poor are generally filthy, and are evidently never cleansed. They consist in most cases of a single room which, while subject to the worst ventilation, is yet usually kept cold by the broken and badly fitting windows, and is sometimes damp and partly below ground level, always badly furnished and thoroughly uncomfortable, a straw-heap often serving the whole family for a bed, upon which men and women, young and old, sleep in revolting confusion.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.29.7
  kind: p
  original: Wasser ist nur bei den öffentlichen Pumpen zu haben, und die Mühe, mit der es herbeigeholt werden muß, begünstigt natürlich alle möglichen Unflätereien."
  en: Water can be had only from the public pumps, and the difficulty of obtaining it naturally fosters all possible filth."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: II.30.1
  kind: p
  original: In andern großen Hafenstädten sieht es nicht besser aus.
  en: In the other great seaport towns the prospect is no better.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: II.30.2
  kind: p
  original: Liverpool mit all seinem Handel, Glanz und Reichtum behandelt dennoch seine Arbeiter mit derselben Barbarei.
  en: Liverpool, with all its commerce, wealth, and grandeur yet treats its workers with the same barbarity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: II.30.3
  kind: p
  original: Ein volles Fünftel der Bevölkerung - also über 45 000 Menschen wohnen in engen, dunklen, feuchten und schlecht ventilierten Kellern, deren es 7 862 in der Stadt gibt.
  en: A full fifth of the population, more than 45,000 human beings, live in narrow, dark, damp, badly-ventilated cellar dwellings, of which there are 7,862 in the city.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: II.30.4
  kind: p
  original: Dazu kommen noch 2 270 Höfe (courts), d.h. kleine Plätze, die nach allen vier Seiten zugebaut sind und nur einen schmalen, meist überwölbten Zugang haben, die also gar keine Ventilation zulassen, meist sehr schmutzig und fast ausschließlich von Proletariern bewohnt sind.
  en: Besides these cellar dwellings there are 2,270 courts, small spaces built up on all four sides and having but one entrance, a narrow, covered passage-way, the whole ordinarily very dirty and inhabited exclusively by proletarians.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: II.30.5
  kind: p
  original: Von solchen Höfen werden wir mehr zu sprechen haben, wenn wir zu Manchester kommen.
  en: Of such courts we shall have more to say when we come to Manchester.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: II.30.6
  kind: p
  original: In Bristol wurden bei einer Gelegenheit 2 800 Arbeiterfamilien besucht, und von diesen hatten 46 Prozent nur ein einziges Zimmer.
  en: In Bristol, on one occasion, 2,800 families were visited, of whom 46 per cent. occupied but one room each.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: II.31.1
  kind: p
  original: Ganz dasselbe finden wir in den Fabrikstädten.
  en: Precisely the same state of things prevails in the factory towns.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: II.31.2
  kind: p
  original: In Nottingham sind im ganzen 11 000 Häuser, von denen zwischen 7 000 und 8 000 mit der Rückwand aneinander gebaut sind, so daß keine durchgehende Ventilation möglich ist; dazu ist meistens nur ein gemeinsamer Abtritt für mehrere Häuser vorhanden.
  en: In Nottingham there are in all 11,000 houses, of which between 7,000 and 8,000 are built back to back with a rear parti-wall so that no through ventilation is possible, while a single privy usually serves for several houses.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: II.31.3
  kind: p
  original: Bei einer vor kurzem gehaltenen Inspektion fand man viele Reihen Häuser über seichte Abzugsgräben gebaut, die mit nichts weiter als den Brettern des Fußbodens bedeckt waren.
  en: During an investigation made a short time since, many rows of houses were found to have been built over shallow drains covered only by the boards of the ground floor.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: II.31.4
  kind: p
  original: In Leicester, Derby und Sheffield sieht es nicht anders aus.
  en: In Leicester, Derby, and Sheffield, it is no better.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: II.31.5
  kind: p
  original: 'Von Birmingham berichtet der oben zitierte Artikel des "Artizan":'
  en: 'Of Birmingham, the article above cited from the Artisan states:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: II.32.1
  kind: p
  original: '"In den älteren Teilen der Stadt sind viele schlechte Gegenden, schmutzig und vernachlässigt, voll stehender Pfützen und Haufen Abfalls.'
  en: '"In the older quarters of the city there are many bad districts, filthy and neglected, full of stagnant pools and heaps of refuse.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '268'
- id: II.32.2
  kind: p
  original: Die Höfe sind in Birmingham sehr zahlreich, über zweitausend, und enthalten die größte Zahl der Arbeiterklasse.
  en: Courts are very numerous in Birmingham, reaching two thousand, and containing the greater number of the working-people of the city.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 268-269
- id: II.32.3
  kind: p
  original: Sie sind meist eng, kotig, schlecht ventiliert und mit schlechten Abzügen, enthalten von acht bis zu zwanzig Häusern, die meist nur nach einer Seite hin zu lüften sind, weil sie die Rückwand mit einem andern Gebäude gemein haben, und im Hintergrunde des Hofs liegt ziemlich allgemein ein Aschenloch oder dergleichen, dessen Schmutz sich nicht beschreiben läßt.
  en: These courts are usually narrow, muddy, badly ventilated, ill-drained, and lined with eight to twenty houses, which, by reason of having their rear walls in common, can usually be ventilated from one side only. In the background, within the court, there is usually an ash heap or something of the kind, the filth of which cannot be described.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '269'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.32.4
  kind: p
  original: Es muß indes bemerkt werden, daß die neueren Höfe verständiger angelegt und anständiger gehalten sind; und selbst in den Höfen sind die Cottages viel weniger gedrängt als in Manchester und Liverpool, weshalb denn auch Birmingham während der Herrschaft epidemischer Krankheiten viel weniger Sterbefälle hatte als z.B. Wolverhampton, Dudley und Bilston, die nur einige Meilen davon liegen.
  en: It must, however, be observed that the newer courts are more sensibly built and more decently kept, and that even in the old ones, the cottages are much less crowded than in Manchester and Liverpool, wherefore Birmingham shows even during the reign of an epidemic a far smaller mortality than, for instance, Wolverhampton, Dudley, and Bilston, only a few miles distant.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '269'
- id: II.32.5
  kind: p
  original: Kellerwohnungen sind in Birmingham ebenfalls unbekannt, obwohl einige Kellerlokale ungeeigneterweise zu Werkstätten benutzt werden.
  en: Cellar dwellings are unknown, too, in Birmingham, though a few cellars are misused as workrooms.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '269'
- id: II.32.6
  kind: p
  original: Die Logierhäuser für Proletarier sind etwas zahlreich (über 400), hauptsächlich in Höfen im Mittelpunkte der Stadt; sie sind fast alle ekelhaft schmutzig und dumpfig, die Zufluchtsörter von Bettlern, Landstreichern" (trampers - über die nähere Bedeutung dieses Wortes später), "Dieben und Huren, die hier ohne alle Rücksicht auf Anstand oder Komfort essen, trinken, rauchen und schlafen, in einer nur diesen degradierten Menschen erträglichen Atmosphäre."
  en: The lodging-houses for proletarians are rather numerous (over four hundred), chiefly in courts in the heart of the town. They are nearly all disgustingly filthy and ill-smelling, the refuge of beggars, thieves, tramps, and prostitutes, who eat, drink, smoke, and sleep here without the slightest regard to comfort or decency in an atmosphere endurable to these degraded beings only."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '269'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.33.1
  kind: p
  original: Glasgow hat in vieler Beziehung Ähnlichkeit mit Edinburgh - dieselben Wynds, dieselben hohen Häuser.
  en: Glasgow is in many respects similar to Edinburgh, possessing the same wynds, the same tall houses.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '269'
- id: II.33.2
  kind: p
  original: 'Über diese Stadt bemerkt der "Artizan":'
  en: 'Of this city the Artisan observes:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '269'
- id: II.34.1
  kind: p
  original: '"Die arbeitende Klasse macht hier etwa 78 Prozent der ganzen Bevölkerung (an 300 000) aus und wohnt in Stadtteilen, welche in Elend und Scheußlichkeit die niedrigsten Schlupfwinkel von St. Giles und Whitechapel, die Liberties von Dublin, die Wynds von Edinburgh übertreffen.'
  en: '"The working-class forms here some 78% of the whole population (about 300,000), and lives in parts of the city which exceed in wretchedness and squalor the lowest nooks of St. Giles and Whitechapel, the Liberties of Dublin, the Wynds of Edinburgh.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '269'
- id: II.34.2
  kind: p
  original: Solche Gegenden gibt es in Menge im Herzen der Stadt - südlich vom Trongate, westlich vom Salzmarkt, im Calton, seitwärts von der Hochstraße usw. - endlose Labyrinthe enger Gassen oder Wynds, in welche fast bei jedem Schritt Höfe oder Sackgassen münden, die von alten, schlecht ventilierten, hochgetürmten, wasserlosen und verfallenden Häusern gebildet werden.
  en: There are numbers of such localities in the heart of the city, south of the Trongate, westward from the Saltmarket, in Calton and off the High Street, endless labyrinths of lanes or wynds into which open at almost every step, courts or blind alleys, formed by ill-ventilated, high-piled, waterless, and dilapidated houses.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '269'
- id: II.34.3
  kind: p
  original: Diese Häuser sind förmlich vollgedrängt von Einwohnern; sie enthalten drei oder vier Familien - vielleicht zwanzig Personen - auf jedem Stockwerke, und zuweilen ist jedes Stockwerk in Schlafstellen vermietet, so daß fünfzehn bis zwanzig Personen in einem einzigen Zimmer aufeinandergepackt, wir mögen nicht sagen untergebracht, sind.
  en: These are literally swarming with inhabitants. They contain three or four families upon each floor, perhaps twenty persons. In some cases each storey is let out in sleeping places, so that fifteen to twenty persons are packed, one on top of the other, I cannot say accommodated, in a single room.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '269'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.34.4
  kind: p
  original: Diese Distrikte bergen die ärmsten, depraviertesten und wertlosesten Mitglieder der Bevölkerung und sind als die Quellen jener furchtbaren Fieberepidemien zu betrachten, die von hier aus Verwüstung über ganz Glasgow verbreiten."
  en: These districts shelter the poorest, most depraved, and worthless members of the community, and may be regarded as the sources of those frightful epidemics which, beginning here, spread desolation over Glasgow."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '269'
- id: II.35.1
  kind: p
  original: 'Hören wir, wie J. C. Symons, Regierungskommissär bei der Untersuchung über die Lage der Handweber, diese Stadtteile beschreibt:'
  en: 'Let us hear how J. C. Symonds, Government Commissioner for the investigation of the condition of the hand-weavers, describes these portions of the city:'
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N6
  mew_page: '269'
- id: II.36.1
  kind: p
  original: '"Ich habe das Elend in einigen seiner schlimmsten Phasen, sowohl hier als auf dem Kontinente, gesehen, aber ehe ich die Wynds von Glasgow besuchte, glaubte ich nicht, daß in irgendeinem zivilisierten Lande soviel Verbrechen, Elend und Krankheit existieren könne.'
  en: '"I have seen wretchedness in some of its worse phases both here and upon the Continent, but until I visited the wynds of Glasgow I did not believe that so much crime, misery, and disease could exist in any civilised country.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: II.36.2
  kind: p
  original: In den niedrigeren Logierhäusern schlafen zehn, zwölf, ja zuweilen zwanzig Personen von beiden Geschlechtern und jedem Alter in verschiedenen Abstufungen der Nacktheit auf dem Fußboden durcheinander.
  en: In the lower lodging-houses ten, twelve, sometimes twenty persons of both sexes, all ages and various degrees of nakedness, sleep indiscriminately huddled together upon the floor.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: II.36.3
  kind: p
  original: Diese Wohnstätten sind gewöhnlich (generally) so schmutzig, feucht und verfallen, daß kein Mensch sein Pferd darin unterbringen möchte."
  en: These dwellings are usually so damp, filthy, and ruinous, that no one could wish to keep his horse in one of them."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: II.37.1
  kind: p
  original: 'Und an einer andern Stelle:'
  en: 'And in another place:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: II.38.1
  kind: p
  original: '"Die Wynds von Glasgow enthalten eine fluktuierende Bevölkerung von fünfzehn- bis dreißigtausend Menschen.'
  en: '"The wynds of Glasgow contain a fluctuating population of fifteen to thirty thousand human beings.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: II.38.2
  kind: p
  original: Dies Viertel besteht aus lauter engen Gassen und viereckigen Höfen, in deren Mitte jedesmal ein Misthaufen liegt.
  en: This quarter consists wholly of narrow alleys and square courts, in the middle of every one of which there lies a dung heap.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: II.38.3
  kind: p
  original: So empörend das äußere Ansehen dieser Orte war, so war ich doch noch wenig vorbereitet auf den Schmutz und das Elend drinnen.
  en: Revolting as was the outward appearance of these courts, I was yet not prepared for the filth and wretchedness within.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: II.38.4
  kind: p
  original: In einigen dieser Schlafstuben, die wir" (der Polizeisuperintendent Hauptmann Miller und Symons) "bei Nacht besuchten, fanden wir eine vollständige Schicht menschlicher Wesen auf dem Fußboden ausgestreckt, oft fünfzehn bis zwanzig, einige bekleidet, andre nackt, Männer und Weiber durcheinander.
  en: In some of the sleeping-places which we visited at night (the Superintendent of Police, Captain Miller, and Symonds) we found a complete layer of human beings stretched upon the floor, often fifteen to twenty, some clad, others naked, men and women indiscriminately.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: II.38.5
  kind: p
  original: Ihr Bett war eine Lage modriges Stroh mit einigen Lumpen vermengt.
  en: Their bed was a litter of mouldy straw, mixed with rags.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: II.38.6
  kind: p
  original: Wenig oder keine Möbel waren da, und das einzige, was diesen Löchern etwas wohnlichen Anschein gab, war ein Feuer im Kamin.
  en: There was little or no furniture, and the only thing which gave these dens any shimmer of habitableness was a fire upon the hearth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: II.38.7
  kind: p
  original: Diebstahl und Prostitution machen die Haupterwerbsquellen dieser Bevölkerung aus.
  en: Theft and prostitution form the chief means of subsistence of this population.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: II.38.8
  kind: p
  original: Niemand schien sich die Mühe zu geben, diesen Augiasstall, dies Pandämonium, diesen Knäuel von Verbrechen, Schmutz und Pestilenz im Zentrum der zweiten Stadt des Reichs zu fegen.
  en: No one seemed to take the trouble to cleanse this Augean stable, this Pandemonium, this tangle of crime, filth, and pestilence in the centre of the second city of the kingdom.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: II.38.9
  kind: p
  original: Eine ausgedehnte Besichtigung der niedrigsten Bezirke andrer Städte zeigte mir nie etwas, das halb so schlecht gewesen wäre, weder an Intensität moralischer und physischer Verpestung noch an verhältnismäßiger Dichtigkeit der Bevölkerung.
  en: An extended examination of the lowest districts of other cities never revealed anything half so bad, either in intensity of moral and physical infection, nor in comparative density of population.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: II.38.10
  kind: p
  original: '- In diesem Viertel sind die meisten Häuser durch den Court of Guild als verfallen und unbewohnbar bezeichnet - aber gerade diese sind am meisten bewohnt, weil von ihnen nach dem Gesetz keine Miete gefordert werden kann."'
  en: In this quarter most of the houses have been declared by the Court of Guild ruinous and unfit for habitation, but precisely these are the most densely populated, because, according to the law, no rent can be demanded for them."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: II.39.1
  kind: p
  original: Der große Industriebezirk in der Mitte der britischen Insel, der dichtbevölkerte Strich von West-Yorkshire und Süd-Lancashire gibt mit seinen vielen Fabrikstädten den übrigen großen Städten nichts nach.
  en: The great manufacturing district in the centre of the British Islands, the thickly peopled stretch of West Yorkshire and South Lancashire, with its numerous factory towns, yields nothing to the other great manufacturing centres.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: II.39.2
  kind: p
  original: Der Wollenbezirk des West Riding von Yorkshire ist eine reizende Gegend, ein schönes grünes Hügelland, dessen Erhöhungen nach Westen zu immer steiler werden, bis sie in dem schroffen Kamm von Blackstone Edge - der Wasserscheide zwischen dem irischen und deutschen Meere - ihre höchste Spitze erreichen.
  en: The woollen district of the West Riding of Yorkshire is a charming region, a beautiful green hill country, whose elevations grow more rugged towards the West until they reach their highest point in the bold ridge of Blackstone Edge, the watershed between the Irish Sea and the German Ocean.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
- id: II.39.3
  kind: p
  original: Die Täler des Aire, an dem Leeds liegt, und des Calder, durch welches die Manchester-Leeds-Eisenbahn läuft, gehören zu den anmutigsten Englands und sind überall mit Fabriken, Dörfern und Städten besäet; die bruchsteinernen, grauen Häuser sehen so nett und reinlich aus gegen die geschwärzten Ziegelgebäude von Lancashire, daß es eine Lust ist.
  en: The valleys of the Aire, along which stretches Leeds, and of the Calder, through which the Manchester-Leeds railway runs, are among the most attractive in England, and are strewn in all directions with the factories, villages, and towns. The houses of rough grey stone look so neat and clean in comparison with the blackened brick buildings of Lancashire, that it is a pleasure to look at them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '270'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.39.4
  kind: p
  original: Aber wenn man in die Städte selbst kommt, findet man wenig Erfreuliches.
  en: But on coming into the towns themselves, one finds little to rejoice over.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 270-271
- id: II.39.5
  kind: p
  original: Leeds liegt, wie der "Artizan" (a.a.O.) es schildert und wie ich es bestätigt fand, "an einem sanften Abhange, der in das Tal des Aire hinabläuft.
  en: 'Leeds lies as the Artisan describes it, and as I found confirmed upon examination: "on a gentle slope that descends into the valley of the Aire.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '271'
- id: II.39.6
  kind: p
  original: Dieser Fluß durchschlängelt die Stadt auf einer Länge von ungefähr anderthalb Meilen und ist während des Tauwetters oder heftiger Regengüsse starken Überschwemmungen ausgesetzt.
  en: This stream flows through the city for about a mile-and-a-half and is exposed to violent floods during thaws or heavy rain.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N7
  mew_page: '271'
- id: II.39.7
  kind: p
  original: Die höhergelegenen, westlichen Stadtteile sind für eine so große Stadt reinlich, aber die niedrigeren Gegenden um den Fluß und seine tributären Bäche (becks) sind schmutzig, eng und schon an und für sich hinreichend, um das Leben der Einwohner - besonders kleiner Kinder - zu verkürzen; hierzu noch gerechnet den ekelhaften Zustand der Arbeiterbezirke um Kirkgate, March Lane, Cross Street und Richmond Road, der sich hauptsächlich von ungepflasterten und abflußlosen Straßen, unregelmäßiger Bauart, den vielen Höfen und Sackgassen und der gänzlichen Abwesenheit auch der gewöhnlichsten Reinlichkeitsmittel herschreibt - das alles zusammengenommen und wir haben Ursachen genug, um uns die übergroße Sterblichkeit in diesen unglücklichen Regionen des schmutzigsten Elends zu erklären.
  en: The higher western portions of the city are clean, for such a large town. But the low-lying districts along the river and its tributary becks are narrow, dirty, and enough in themselves to shorten the lives of the inhabitants, especially of little children. Added to this, the disgusting state of the working-men's districts about Kirkgate, Marsh Lane, Cross Street and Richmond Road, which is chiefly attributable to their unpaved, drainless streets, irregular architecture, numerous courts and alleys, and total lack of the most ordinary means of cleanliness, all this taken together is explanation enough of the excessive mortality in these unhappy abodes of filthy misery.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '271'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.39.8
  kind: p
  original: '- Infolge der Überschwemmungen des Aire" (der, wie hinzugefügt werden muß, gleich allen der Industrie dienstbaren Flüssen am einen Ende klar und durchsichtig in die Stadt hinein- und am andern dick, schwarz und stinkend von allem möglichen Unrat wieder herausfließt,) "werden die Wohnhäuser und Keller häufig so voll Wasser, daß dies auf die Straße hinausgepumpt werden muß; und zu solchen Zeiten steigt das Wasser, selbst wo Kloaken sind, aus denselben in die Keller, erzeugt miasmatische, stark mit Schwefelwasserstoffgas vermischte Ausdünstungen und hinterläßt einen ekelhaften, der Gesundheit höchst nachteiligen Rückstand.'
  en: In consequence of the overflows of the Aire" (which, it must be added, like all other rivers in the service of manufacture, flows into the city at one end clear and transparent, and flows out at the other end thick, black, and foul, smelling of all possible refuse), "the houses and cellars are often so full of water that they have to be pumped out. And at such times the water rises, even where there are sewers, out of them into cellars, engenders miasmatic vapours strongly impregnated with sulphuretted hydrogen, and leaves a disgusting residuum highly injurious to health.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N8
  mew_page: '271'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.39.9
  kind: p
  original: Während der Frühjahrsüberschwemmung von 1839 waren die Wirkungen einer solchen Verstopfung der Kloaken so nachteilig, daß nach dem Bericht des Zivilstandsregistrators in diesem Stadtteil während des Quartals auf zwei Geburten drei Todesfälle kamen, wo in demselben Quartal alle andren Stadtteile drei Geburten auf zwei Todesfälle hatten."
  en: During the spring-floods of 1839 the action of such a choking of the sewers was so injurious, that, according to the report of the Registrar of Births and Deaths for this part of the town, there were three deaths to two births, whereas in the same three months, in every other part of the town, there were three births to two deaths.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '271'
- id: II.40.1
  kind: p
  original: Andre dicht bevölkerte Bezirke sind ohne alle Abzüge oder so schlecht damit versehen, daß sie keinen Vorteil davon haben.
  en: Other thickly populated districts are without any sewers whatsoever, or so badly provided as to derive no benefit from them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '271'
- id: II.40.2
  kind: p
  original: In einigen Häuserreihen sind die Keller selten trocken; in andern Bezirken sind mehrere Straßen mit fußtiefem, weichem Kot bedeckt.
  en: In some rows of houses the cellars are seldom dry; in certain districts there are several streets covered with soft mud a foot deep.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '271'
- id: II.40.3
  kind: p
  original: Die Einwohner haben sich vergebens bemüht, diese Straßen von Zeit zu Zeit mit Schaufeln Asche zu reparieren; aber trotzdem stehen Mistjauche und aus den Häusern weggeschüttetes, schmutziges Wasser in allen Löchern, bis Wind und Sonne es vertrocknet haben (vgl. Bericht des Stadtrats im "Statistical Journal" vol. 2, p. 404).
  en: The inhabitants have made vain attempts from time to time to repair these streets with shovelfuls of cinders, but in spite of all such attempts, dung-heaps, and pools of dirty water emptied from the houses, fill all the holes until wind and sun dry them up.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 271-272
  en_note: 'English note {40b}: Compare Report of the Town Council in the Statistical Journal, vol. 2, p. 404.'
- id: II.40.4
  kind: p
  original: Eine gewöhnliche Cottage in Leeds bedeckt nicht mehr Grundfläche als fünf Yards im Quadrat und besteht gewöhnlich aus einem Keller, einem Wohnzimmer und einer Schlafstube.
  en: An ordinary cottage in Leeds occupies not more than five yards square of land, and usually consists of a cellar, a living room, and one sleeping-room.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
- id: II.40.5
  kind: p
  original: Diese engen, Tag und Nacht von Menschen gefüllten Wohnungen sind ein anderer, der Sittlichkeit wie dem Gesundheitszustande der Einwohner gefährlicher Punkt.
  en: These contracted dwellings, filled day and night with human beings, are another point dangerous alike to the morals and the health of the inhabitants."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
- id: II.40.6
  kind: p
  original: 'Und wie sehr diese Wohnungen gedrängt sind, erzählt der oben zitierte Bericht über den Gesundheitszustand der arbeitenden Klasse:'
  en: 'And how greatly these cottages are crowded, the Report on the Health of the Working-Classes, quoted above, bears testimony: "In Leeds we found brothers and sisters, and lodgers of both sexes, sharing the parents'' sleeping-room, whence arise consequences at the contemplation of which human feeling shudders."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.41.1
  kind: p
  original: '"In Leeds fanden wir Brüder und Schwestern und Kostgänger beider Geschlechter, die dasselbe Schlafzimmer mit den Eltern teilten; daraus entstehen denn Folgen, vor deren Betrachtung das menschliche Gefühl zurückschaudert."'
  en: ''
  joined_to: II.40.6
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '272'
- id: II.42.1
  kind: p
  original: Ebenso Bradford, das nur sieben Meilen von Leeds, im Mittelpunkte mehrerer zusammenstoßenden Täler an einem kleinen, pechschwarzen, stinkenden Flusse liegt.
  en: So, too, Bradford, which, but seven miles from Leeds at the junction of several valleys, lies upon the banks of a small, coal-black, foul-smelling stream.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
- id: II.42.2
  kind: p
  original: Die Stadt bietet an einem schönen Sonntage - denn an Werktagen wird sie von einer grauen Wolke Kohlenrauch verhüllt - von den umliegenden Höhen einen prächtigen Anblick dar; aber drinnen herrscht derselbe Schmutz und dieselbe Unwohnlichkeit wie in Leeds.
  en: On week-days the town is enveloped in a grey cloud of coal smoke, but on a fine Sunday it offers a superb picture, when viewed from the surrounding heights. Yet within reigns the same filth and discomfort as in Leeds.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.42.3
  kind: p
  original: Die älteren Stadtteile sind an steilen Abhängen eng und unregelmäßig gebaut; in den Gassen, Sackgassen und Höfen liegt Schmutz und Schutt angehäuft; die Häuser sind verfallen, unsauber und unwohnlich, und in der unmittelbaren Nähe des Flusses und der Talsohle fand ich manche, deren unteres, halb in den Bergabhang hinein vergrabenes Stockwerk ganz unbewohnbar war.
  en: The older portions of the town are built upon steep hillsides, and are narrow and irregular. In the lanes, alleys, and courts lie filth and debris in heaps; the houses are ruinous, dirty, and miserable, and in the immediate vicinity of the river and the valley bottom I found many a one, whose ground-floor, half-buried in the hillside, was totally abandoned.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.42.4
  kind: p
  original: Überhaupt sind die Stellen der Talsohle, an denen sich Arbeiterwohnungen zwischen die hohen Fabriken gedrängt haben, die am schlechtesten gebauten und unreinlichsten der ganzen Stadt.
  en: In general, the portions of the valley bottom in which working-men's cottages have crowded between the tall factories, are among the worst built and dirtiest districts of the whole town.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
- id: II.42.5
  kind: p
  original: In den neueren Gegenden dieser wie jeder andern Fabrikstadt sind die Cottages regelmäßiger, in Reihen angelegt, teilen aber auch hier alle Übelstände, die mit der hergebrachten Art, die Arbeiter unterzubringen, verknüpft sind und von denen wir bei Gelegenheit von Manchester näher sprechen werden.
  en: In the newer portions of this, as of every other factory town, the cottages are more regular, being built in rows, but they share here, too, all the evils incident to the customary method of providing working-men's dwellings, evils of which we shall have occasions to speak more particularly in discussing Manchester.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
- id: II.42.6
  kind: p
  original: Ein Gleiches gilt von den übrigen Städten des West Riding, namentlich Barnsley, Halifax und Huddersfield.
  en: The same is true of the remaining towns of the West Riding, especially of Barnsley, Halifax and Huddersfield.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
- id: II.42.7
  kind: p
  original: 'Letzteres, bei seiner reizenden Lage und modernen Bauart bei weitem die schönste aller Fabrikstädte von Yorkshire und Lancashire, hat dennoch auch seine schlechten Bezirke; denn ein von einer Bürgerversammlung zur Besichtigung der Stadt ernanntes Komitee berichtete am 5. August 1844:'
  en: 'The last named, the handsomest by far of all the factory towns of Yorkshire and Lancashire, by reason of its charming situation and modern architecture, has yet its bad quarter; for a committee appointed by a meeting of citizens to survey the town, reported August 5th, 1844: "It is notorious that in Huddersfield whole streets and many lanes and courts are neither paved nor supplied with sewers nor other drains; that in them refuse, debris, and filth of every sort lies accumulating, festers and rots, and that, nearly everywhere, stagnant water accumulates in pools, in consequence of which the adjoining dwellings must inevitably be bad and filthy, so that in such places diseases arise and threaten the health of the whole town."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '272'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.43.1
  kind: p
  original: '"Es sei notorisch, daß in Huddersfield ganze Straßen und viele Gassen und Höfe weder gepflastert noch mit Kloaken oder sonstigen Abzügen versehen seien; daß hier Abfall, Unrat und Schmutz jeder Art aufgehäuft liege, in Gärung und Fäulnis übergehe, und fast überall stehendes Wasser in Pfützen sich ansammle, daß infolgedessen die anschließenden Wohnungen notwendig schlecht und schmutzig seien, so daß an solchen Orten Krankheiten sich erzeugten und die Gesundheit der ganzen Stadt bedrohten."'
  en: ''
  joined_to: II.42.7
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: 272-273
- id: II.44.1
  kind: p
  original: Gehen wir über, oder mit der Eisenbahn mitten durch Blackstone Edge, so kommen wir auf den klassischen Boden, auf dem die englische Industrie ihr Meisterwerk vollbracht hat und von dem alle Bewegungen der Arbeiter ausgehen, nach Süd-Lancashire mit seiner Zentralstadt Manchester.
  en: If we cross Blackstone Edge or penetrate it with the railroad, we enter upon that classic soil on which English manufacture has achieved its masterwork and from which all labour movements emanate, namely, South Lancashire with its central city Manchester.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '273'
- id: II.44.2
  kind: p
  original: Wieder haben wir ein schönes Hügelland, das sich von der Wasserscheide westwärts nach dem irischen Meere zu sanft abdacht, mit den reizenden grünen Tälern des Ribble, Irwell und Mersey und ihrer Nebenflüsse; ein Land, das vor hundert Jahren noch zum größten Teile bloßer Sumpf und wenig bevölkert, jetzt mit Städten und Dörfern übersäet und der bevölkertste Landstrich von England ist.
  en: Again we have beautiful hill country, sloping gently from the watershed westwards towards the Irish Sea, with the charming green valleys of the Ribble, the Irwell, the Mersey, and their tributaries, a country which, a hundred years ago chiefly swamp land, thinly populated, is now sown with towns and villages, and is the most densely populated strip of country in England.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '273'
- id: II.44.3
  kind: p
  original: In Lancashire, und namentlich in Manchester, findet die Industrie des britischen Reichs, wie ihren Ausgangspunkt, so ihr Zentrum; die Börse von Manchester ist das Thermometer für alle Schwankungen des industrielle Verkehrs, die moderne Kunst der Fabrikation hat in Manchester ihre Vollendung erreicht.
  en: In Lancashire, and especially in Manchester, English manufacture finds at once its starting point and its centre. The Manchester Exchange is the thermometer for all the fluctuations of trade. The modern art of manufacture has reached its perfection in Manchester.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '273'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.44.4
  kind: p
  original: In der Baumwollenindustrie von Süd-Lancashire erscheint die Benutzung der Elementarkräfte, die Verdrängung der Handarbeit durch Maschinerie (besonders im mechanischen Webstuhl und der Selfaktor-Mule) und die Teilung der Arbeit auf ihrer höchsten Spitze, und wenn wir in diesen drei Elementen das Charakteristische der modernen Industrie erkannten, so müssen wir gestehen, daß auch in ihnen die Baumwollenverarbeitung allen übrigen Industriezweige von Anfang an bis jetzt vorausgeblieben ist.
  en: In the cotton industry of South Lancashire, the application of the forces of Nature, the superseding of hand labour by machinery (especially by the power-loom and the self-acting mule), and the division of labour, are seen at the highest point; and, if we recognise in these three elements that which is characteristic of modern manufacture, we must confess that the cotton industry has remained in advance of all other branches of industry from the beginning down to the present day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '273'
- id: II.44.5
  kind: p
  original: Zu gleicher Zeit indes mußten hier auch die Folgen der modernen Industrie für die arbeitende Klasse sich am vollständigsten und reinsten entwickeln und das industrielle Proletariat in seiner vollsten Klassizität zur Erscheinung kommen; die Erniedrigung, in welche der Arbeiter durch die Anwendung von Dampfkraft, Maschinerie und Arbeitsteilung versetzt wird, und die Versuche des Proletariats, sich aus dieser entwürdigenden Lage zu erheben, mußten hier ebenfalls auf die höchste Spitze getrieben werden und am klarsten zum Bewußtsein kommen.
  en: The effects of modern manufacture upon the working-class must necessarily develop here most freely and perfectly, and the manufacturing proletariat present itself in its fullest classic perfection. The degradation to which the application of steam-power, machinery and the division of labour reduce the working-man, and the attempts of the proletariat to rise above this abasement, must likewise be carried to the highest point and with the fullest consciousness.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '273'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.44.6
  kind: p
  original: Deshalb also, weil Manchester der klassische Typus der modernen Industriestadt ist, und dann auch, weil ich es so genau wie meine eigne Vaterstadt - genauer als die meisten Einwohner - kenne, werden wir uns hier etwas länger aufzuhalten haben.
  en: Hence because Manchester is the classic type of a modern manufacturing town, and because I know it as intimately as my own native town, more intimately than most of its residents know it, we shall make a longer stay here.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '273'
- id: II.45.1
  kind: p
  original: Die Städte um Manchester herum weichen in Beziehung auf die Arbeitsbezirke wenig von der Zentralstadt ab - nur daß in ihnen die Arbeiter womöglich einen noch größeren Teil der Bevölkerung bilden als dort.
  en: The towns surrounding Manchester vary little from the central city, so far as the working-people's quarters are concerned, except that the working-class forms, if possible, a larger proportion of their population.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T2
    editions: '1892'
    reading: Arbeiterbezirke
    base_text: … Beziehung auf die Arbeitsbezirke ‸ wenig von der Zentralstadt …
  mew_page: '273'
- id: II.45.2
  kind: p
  original: Diese Orte nämlich sind rein industriell und lassen alle kommerziellen Geschäfte in und durch Manchester besorgen; sie hängen in jeder Beziehung von Manchester ab und sind daher nur von Arbeitern, Fabrikanten und untergeordneten Krämern bewohnt - während Manchester doch noch eine sehr bedeutende kommerzielle Bevölkerung, namentlich Kommissions- und angesehene Detailhäuser besitzt.
  en: These towns are purely industrial and conduct all their business through Manchester upon which they are in every respect dependent, whence they are inhabited only by working-men and petty tradesmen, while Manchester has a very considerable commercial population, especially of commission and "respectable" retail dealers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 273-274
- id: II.45.3
  kind: p
  original: Daher sind Bolton, Preston, Wigan, Bury, Rochdale, Middleton, Heywood, Oldham, Ashton, Stalybridge, Stockport usw., obwohl fast alles Städte von dreißig-, fünfzig-, siebzig- bis neunzigtausend Einwohnern, fast lauter große Arbeiterviertel, nur von Fabriken und einigen Hauptstraßen, deren Fronten von Laden gebildet werden, unterbrochen und mit einigen Chausseezugängen versehen, an denen die Gärten und Häuser der Fabrikanten wie Villen angebaut sind.
  en: Hence Bolton, Preston, Wigan, Bury, Rochdale, Middleton, Heywood, Oldham, Ashton, Stalybridge, Stockport, etc., though nearly all towns of thirty, fifty, seventy to ninety thousand inhabitants, are almost wholly working-people's districts, interspersed only with factories, a few thoroughfares lined with shops, and a few lanes along which the gardens and houses of the manufacturers are scattered like villas.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: II.45.4
  kind: p
  original: Die Städte selbst sind schlecht und unregelmäßig gebaut, mit schmutzigen Höfen, Gassen und Hintergäßchen, voll Kohlenrauch, und haben ein besonders unwohnliches Aussehen von dem ursprünglich hochroten, mit der Zeit aber schwarz gerauchten Ziegel, der hier das allgemeine Baumaterial ist.
  en: The towns themselves are badly and irregularly built with foul courts, lanes, and back alleys, reeking of coal smoke, and especially dingy from the originally bright red brick, turned black with time, which is here the universal building material.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: II.45.5
  kind: p
  original: Kellerwohnungen sind hier allgemein; wo es irgend angeht, werden diese unterirdischen Löcher angelegt, und ein sehr bedeutender Teil der Bevölkerung wohnt in ihnen.
  en: Cellar dwellings are general here; wherever it is in any way possible, these subterranean dens are constructed, and a very considerable portion of the population dwells in them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: II.46.1
  kind: p
  original: Zu den schlechtesten dieser Städte gehört nächst Preston und Oldham Bolton, elf Meilen nordwestlich von Manchester gelegen.
  en: Among the worst of these towns after Preston and Oldham is Bolton, eleven miles north-west of Manchester.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: II.46.2
  kind: p
  original: Es hat, soviel ich bei meiner mehrmaligen Anwesenheit bemerken konnte, nur eine und noch dazu ziemlich schmutzige Hauptstraße, Deansgate, die zugleich als Markt dient, und ist bei dem schönsten Wetter immer noch ein finsteres, unansehnliches Loch, trotzdem daß es außer den Fabriken nur ein- und zweistöckige niedrige Häuser hat.
  en: It has, so far as I have been able to observe in my repeated visits, but one main street, a very dirty one, Deansgate, which serves as a market, and is even in the finest weather a dark, unattractive hole in spite of the fact that, except for the factories, its sides are formed by low one and two-storied houses.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: II.46.3
  kind: p
  original: Wie überall ist der ältere Teil der Stadt besonders verfallen und unwohnlich.
  en: Here, as everywhere, the older part of the town is especially ruinous and miserable.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: II.46.4
  kind: p
  original: Ein schwarzes Wasser, von dem man zweifelt, ob es ein Bach oder eine lange Reihe stinkender Pfützen ist, fließt hindurch und trägt das Seinige dazu bei, die ohnehin nicht reine Luft vollends zu verpesten.
  en: A dark-coloured body of water, which leaves the beholder in doubt whether it is a brook or a long string of stagnant puddles, flows through the town and contributes its share to the total pollution of the air, by no means pure without it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: II.47.1
  kind: p
  original: Da ist ferner Stockport, das zwar auf der Cheshire-Seite des Mersey liegt, aber doch zum industriellen Bezirk von Manchester gehört.
  en: There is Stockport, too, which lies on the Cheshire side of the Mersey, but belongs nevertheless to the manufacturing district of Manchester.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: II.47.2
  kind: p
  original: Es liegt in einem engen Tal den Mersey entlang, so daß auf der einen Seite die Straße steil bergab und auf der andern ebenso steil wieder bergauf führt und die Eisenbahn von Manchester nach Birmingham auf einem hohen Viadukt über die Stadt und das ganze Tal hinweggeht.
  en: It lies in a narrow valley along the Mersey, so that the streets slope down a steep hill on one side and up an equally steep one on the other, while the railway from Manchester to Birmingham passes over a high viaduct above the city and the whole valley.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: II.47.3
  kind: p
  original: Stockport ist im ganzen Bezirk als eins der finstersten und räucherigsten Nester bekannt und sieht in der Tat, besonders vom Viadukt herab, äußerst unfreundlich aus.
  en: Stockport is renowned throughout the entire district as one of the duskiest, smokiest holes, and looks, indeed, especially when viewed from the viaduct, excessively repellent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: II.47.4
  kind: p
  original: Aber noch viel unfreundlicher sehen die Cottages und Kellerwohnungen der Proletarier aus, die in langen Reihen sich durch alle Teile der Stadt von der Talsohle bis auf die Krone der Hügel hinziehen.
  en: But far more repulsive are the cottages and cellar dwellings of the working-class, which stretch in long rows through all parts of the town from the valley bottom to the crest of the hill.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '274'
- id: II.47.5
  kind: p
  original: Ich erinnere mich nicht, in irgendeiner andern Stadt dieses Bezirks verhältnismäßig so viele bewohnte Keller gesehen zu haben.
  en: I do not remember to have seen so many cellars used as dwellings in any other town of this district.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 274-275
- id: II.48.1
  kind: p
  original: Wenige Meilen nordöstlich von Stockport liegt Ashton-under-Lyne, einer der neusten Fabrikorte der Gegend.
  en: A few miles north-east of Stockport is Ashton-under-Lyne, one of the newest factory towns of this region.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: II.48.2
  kind: p
  original: Es liegt am Abhange eines Hügels, an dessen Fuß der Kanal und der Fluß Tame sich hinziehen, und ist im allgemeinen nach dem neueren, regelmäßigeren System gebaut.
  en: It stands on the slope of a hill at the foot of which are the canal and the river Tame, and is, in general, built on the newer, more regular plan.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: II.48.3
  kind: p
  original: Fünf oder sechs lange Parallelstraßen ziehen sich quer den Hügel entlang und werden rechtwinklig von andern, ins Tal hinabführenden Straßen durchschnitten.
  en: Five or six parallel streets stretch along the hill intersected at right angles by others leading down into the valley.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: II.48.4
  kind: p
  original: Die Fabriken werden durch diese Bauart alle aus der eigentlichen Stadt heraus verdrängt, auch wenn nicht die Nähe des Wassers und der Wasserstraße sie sämtlich unten ins Tal hinabgezogen hätte, wo sie dicht zusammengedrängt stehen und aus ihren Schornsteinen dicken Rauch ergießen.
  en: By this method, the factories would be excluded from the town proper, even if the proximity of the river and the canal-way did not draw them all into the valley where they stand thickly crowded, belching forth black smoke from their chimneys.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: II.48.5
  kind: p
  original: Dadurch bekommt Ashton ein viel freundlicheres Aussehen als die meisten andern Fabrikstädte; die Straßen sind breit und reinlicher, die Cottages sehen neu, frischrot und wohnlich aus.
  en: To this arrangement Ashton owes a much more attractive appearance than that of most factory towns; the streets are broad and cleaner, the cottages look new, bright red, and comfortable.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: II.48.6
  kind: p
  original: Aber das neue System, Cottages für die Arbeiter zu bauen, hat auch seine schlechten Seiten; jede Straße hat ihre versteckte Hintergasse, zu der ein enger Seitenweg führt und die dafür desto schmutziger ist.
  en: But the modern system of building cottages for working-men has its own disadvantages; every street has its concealed back lane to which a narrow paved path leads, and which is all the dirtier.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: II.48.7
  kind: p
  original: Und auch in Ashton - obwohl ich kein Gebäude, außer einigen am Eingang, gesehen habe, das mehr als fünfzig Jahre alt sein könnte - auch in Ashton gibt es Straßen, in denen die Cottages schlecht und alt werden, in deren Mauerecken die Ziegel nicht mehr halten wollen und sich verschieben, in denen die Wände rissig werden und den inwendig aufgeweißten Kalk abbröckeln lassen; Straßen, deren unreinliches und schwarzgeräuchertes Aussehen den übrigen Städten des Bezirks nichts nachgibt - nur daß dies in Ashton Ausnahme und nicht Regel ist.
  en: And, although I saw no buildings, except a few on entering, which could have been more than fifty years old, there are even in Ashton streets in which the cottages are getting bad, where the bricks in the house-corners are no longer firm but shift about, in which the walls have cracks and will not hold the chalk whitewash inside; streets, whose dirty, smoke-begrimed aspect is nowise different from that of the other towns of the district, except that in Ashton, this is the exception, not the rule.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: II.49.1
  kind: p
  original: Eine Meile weiter östlich liegt Stalybridge, ebenfalls am Tame.
  en: A mile eastward lies Stalybridge, also on the Tame.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: II.49.2
  kind: p
  original: Wenn man von Ashton über den Berg kommt, hat man oben auf der Spitze rechts und links schöne, große Gärten mit villenartigen, prächtigen Häusern in der Mitte - meist im "elisabetheischen" Stil gebaut, der sich zum gotischen genauso verhält wie die protestantisch-anglikanische Religion zur apostolisch-katholischen.
  en: In coming over the hill from Ashton, the traveller has, at the top, both right and left, fine large gardens with superb villa-like houses in their midst, built usually in the Elizabethan style, which is to the Gothic precisely what the Anglican Church is to the Apostolic Roman Catholic.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: II.49.3
  kind: p
  original: Einhundert Schritte weiter, und Stalybridge zeigt sich im Tal - aber ein schroffer Gegensatz gegen die prächtigen Landsitze, schroff sogar noch gegen die bescheidenen Cottages von Ashton!
  en: A hundred paces farther and Stalybridge shows itself in the valley, in sharp contrast with the beautiful country seats, in sharp contrast even with the modest cottages of Ashton!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: II.49.4
  kind: p
  original: Stalybridge liegt in einer engen, gewundenen Talschlucht, noch viel enger als das Tal bei Stockport, deren beide Abhänge mit einem unordentlichen Gewirre von Cottages, Häusern und Fabriken besetzt sind.
  en: Stalybridge lies in a narrow, crooked ravine, much narrower even than the valley at Stockport, and both sides of this ravine are occupied by an irregular group of cottages, houses, and mills.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: II.49.5
  kind: p
  original: Wenn man hineingeht, so sind gleich die ersten Cottages eng, räucherig, alt und verfallen, und wie die ersten Häuser, so die ganze Stadt.
  en: On entering, the very first cottages are narrow, smoke-begrimed, old and ruinous; and as the first houses, so the whole town.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '275'
- id: II.49.6
  kind: p
  original: Wenige Straßen liegen in der schmalen Talsohle; die meisten laufen kreuz und quer durcheinander, bergauf und bergab, fast in allen Häusern ist wegen dieser abschüssigen Lage das Erdgeschoß halb in die Erde vergraben, und welche Massen von Höfen, Hintergassen und abgelegenen Winkeln aus dieser konfusen Bauart entstehen, kann man von den Bergen sehen, von denen aus man die Stadt hier und da fast in der Vogelperspektive unter sich hat.
  en: A few streets lie in the narrow valley bottom, most of them run criss-cross, pell-mell, up hill and down, and in nearly all the houses, by reason of this sloping situation, the ground floor is half-buried in the earth; and what multitudes of courts, back lanes, and remote nooks arise out of this confused way of building may be seen from the hills, whence one has the town, here and there, in a bird's-eye view almost at one's feet.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 275-276
- id: II.49.7
  kind: p
  original: Dazu den entsetzlichen Schmutz gerechnet - und man begreift den widerlichen Eindruck, den Stalybridge trotz seiner hübschen Umgebung macht.
  en: Add to this the shocking filth, and the repulsive effect of Stalybridge, in spite of its pretty surroundings, may be readily imagined.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: II.50.1
  kind: p
  original: Doch genug über diese kleineren Städte.
  en: But enough of these little towns.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: II.50.2
  kind: p
  original: Sie haben alle ihr Apartes, aber im ganzen leben die Arbeiter in ihnen gerade wie in Manchester; darum habe ich auch nur ihre eigentümliche Bauart besonders geschildert und bemerke nur, daß alle allgemeineren Bemerkungen über den Zustand der Arbeiterwohnungen in Manchester auch auf die umliegenden Städte ihre volle Anwendung finden.
  en: Each has its own peculiarities, but in general, the working-people live in them just as in Manchester. Hence I have especially sketched only their peculiar construction, and would observe, that all more general observations as to the condition of the labouring population in Manchester are fully applicable to these surrounding towns as well.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: II.50.3
  kind: p
  original: Gehen wir nun zur Zentralstadt selbst über.
  en: ''
  joined_to: II.50.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '276'
- id: II.51.1
  kind: p
  original: Manchester liegt am Fuße des südlichen Abhangs einer Hügelkette, die sich von Oldham her zwischen die Täler des Irwell und des Medlock drängt und deren letzte Spitze Kersall-Moor, die Rennbahn und zugleich der Mons sacer [heilige Berg] von Manchester, bildet.
  en: Manchester lies at the foot of the southern slope of a range of hills, which stretch hither from Oldham, their last peak, Kersallmoor, being at once the racecourse and the Mons Sacer of Manchester.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: II.51.2
  kind: p
  original: Das eigentliche Manchester liegt auf dem linken Ufer des Irwell, zwischen diesem Flusse und den beiden kleineren, Irk und Medlock; die sich hier in den Irwell ergießen.
  en: Manchester proper lies on the left bank of the Irwell, between that stream and the two smaller ones, the Irk and the Medlock, which here empty into the Irwell.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: II.51.3
  kind: p
  original: Auf dem rechten Irwellufer und eingefaßt von einer starken Biegung dieses Flusses, liegt Salford, weiter westlich Pendleton; nördlich vom Irwell liegen Higher und Lower Broughton, nördlich vom Irk Cheetham Hill; südlich vom Medlock liegt Hulme, weiter östlich Chorlton-on-Medlock, noch weiter, ziemlich im Osten von Manchester, Ardwick.
  en: On the left bank of the Irwell, bounded by a sharp curve of the river, lies Salford, and farther westward Pendleton; northward from the Irwell lie Upper and Lower Broughton; northward of the Irk, Cheetham Hill; south of the Medlock lies Hulme; farther east Chorlton on Medlock; still farther, pretty well to the east of Manchester, Ardwick.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: II.51.4
  kind: p
  original: Der ganze Häuserkomplex wird im gewöhnlichen Leben Manchester genannt und fast eher über als unter viermalhunderttausend Menschen.
  en: The whole assemblage of buildings is commonly called Manchester, and contains about four hundred thousand inhabitants, rather more than less.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: II.51.5
  kind: p
  original: Die Stadt selbst ist eigentümlich gebaut, so daß man jahrelang in ihr wohnen und täglich hinein- und herausgehen kann, ohne je in ein Arbeiterviertel oder nur mit Arbeitern in Berührung zu kommen - solange man nämlich eben nur seinen Geschäften nach- oder spazierengeht.
  en: The town itself is peculiarly built, so that a person may live in it for years, and go in and out daily without coming into contact with a working-people's quarter or even with workers, that is, so long as he confines himself to his business or to pleasure walks.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: II.51.6
  kind: p
  original: Das kommt aber hauptsächlich daher, daß durch unbewußte, stillschweigende Übereinkunft wie durch bewußte ausgesprochene Absicht die Arbeiterbezirke von den der Mittelklasse überlassenen Stadtteilen aufs schärfste getrennt oder, wo dies nicht geht, mit dem Mantel der Liebe verhüllt werden.
  en: This arises chiefly from the fact, that by unconscious tacit agreement, as well as with outspoken conscious determination, the working-people's quarters are sharply separated from the sections of the city reserved for the middle-class; or, if this does not succeed, they are concealed with the cloak of charity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: II.51.7
  kind: p
  original: Manchester enthält in seinem Zentrum einen ziemlich ausgedehnten kommerziellen Bezirk, etwa eine halbe Meile lang und ebenso breit, der fast nur aus Kontoren und Warenlagern (warehouses) besteht.
  en: Manchester contains, at its heart, a rather extended commercial district, perhaps half a mile long and about as broad, and consisting almost wholly of offices and warehouses.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '276'
- id: II.51.8
  kind: p
  original: Fast der ganze Bezirk ist unbewohnt und während der Nacht einsam und öde - nur wachthabende Polizeidiener streichen mit ihren Blendlaternen durch die engen, dunklen Gassen.
  en: Nearly the whole district is abandoned by dwellers, and is lonely and deserted at night; only watchmen and policemen traverse its narrow lanes with their dark lanterns.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 276-279
- id: II.51.9
  kind: p
  original: Diese Gegend wird von einigen Hauptstraßen durchschnitten, auf denen sich der ungeheure Verkehr drängt und in denen die Erdgeschosse mit brillanten Laden besetzt sind; in diesen Straßen finden sich hier und da bewohnte Oberräume, und hier ist auch bis spät abends ziemlich viel Leben auf der Straße.
  en: This district is cut through by certain main thoroughfares upon which the vast traffic concentrates, and in which the ground level is lined with brilliant shops. In these streets the upper floors are occupied, here and there, and there is a good deal of life upon them until late at night.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.51.10
  kind: p
  original: Mit Ausnahme dieses kommerziellen Distrikts ist das ganze eigentliche Manchester, ganz Salford und Hulme, ein bedeutender Teil von Pendleton und Chorlton, zwei Drittel von Ardwick und einzelne Striche von Cheetham Hill und Broughton - alles lauter Arbeiterbezirk, der sich wie ein durchschnittlich anderthalb Meilen breiter Gürtel um das kommerzielle Viertel zieht.
  en: With the exception of this commercial district, all Manchester proper, all Salford and Hulme, a great part of Pendleton and Chorlton, two-thirds of Ardwick, and single stretches of Cheetham Hill and Broughton are all unmixed working-people's quarters, stretching like a girdle, averaging a mile and a half in breadth, around the commercial district.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: II.51.11
  kind: p
  original: Draußen, jenseits dieses Gürtels, wohnt die höhere und mittlere Bourgeoisie - die mittlere in regelmäßigen Straßen in der Nähe der Arbeiterviertel, namentlich in Chorlton und den tieferliegenden Gegenden von Cheetham Hill, die höhere in den entfernteren villenartigen Gartenhäusern von Chorlton und Ardwick oder auf den luftigen Höhen von Cheetham Hill, Broughton und Pendleton - in einer freien, gesunden Landluft, in prächtigen, bequemen Wohnungen, an denen halbstündlich oder viertelstündlich die nach der Stadt fahrenden Omnibusse vorbeikommen.
  en: Outside, beyond this girdle, lives the upper and middle bourgeoisie, the middle bourgeoisie in regularly laid out streets in the vicinity of the working quarters, especially in Chorlton and the lower lying portions of Cheetham Hill; the upper bourgeoisie in remoter villas with gardens in Chorlton and Ardwick, or on the breezy heights of Cheetham Hill, Broughton, and Pendleton, in free, wholesome country air, in fine, comfortable homes, passed once every half or quarter hour by omnibuses going into the city.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: II.51.12
  kind: p
  original: Und das schönste bei der Sache ist, daß diese reichen Geldaristokraten mitten durch die sämtlichen Arbeiterviertel auf dem nächsten Wege nach ihren Geschäftslokalen in der Mitte der Stadt kommen können, ohne auch nur zu merken, daß sie in die Nähe des schmutzigsten Elends geraten, das rechts und links zu finden ist.
  en: And the finest part of the arrangement is this, that the members of this money aristocracy can take the shortest road through the middle of all the labouring districts to their places of business, without ever seeing that they are in the midst of the grimy misery that lurks to the right and the left.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: II.51.13
  kind: p
  original: Die Hauptstraßen nämlich, die von der Börse nach allen Richtungen aus der Stadt hinausführen, sind in beiden Seiten mit einer fast ununterbrochenen Reihe von Läden besetzt und so in den Händen der mittleren und kleineren Bourgeoisie, die schon um ihres Vorteils willen auf anständigeres und reinliches Aussehen hält und halten kann.
  en: For the thoroughfares leading from the Exchange in all directions out of the city are lined, on both sides, with an almost unbroken series of shops, and are so kept in the hands of the middle and lower bourgeoisie, which, out of self-interest, cares for a decent and cleanly external appearance and can care for it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: II.51.14
  kind: p
  original: Allerdings haben diese Läden immerhin einige Verwandtschaft mit den Distrikten, die hinter ihnen liegen, sind also im kommerziellen Viertel und der Nähe der Bourgeoisiebezirke eleganter als da, wo sie schmutzige Arbeitercottages verdecken; aber sie sind immerhin hinreichend, um vor den Augen der reichen Herren und Damen mit starkem Magen und schwachen Nerven das Elend und den Schmutz zu verbergen, die das ergänzende Moment zu ihrem Reichtum und Luxus bilden.
  en: True, these shops bear some relation to the districts which lie behind them, and are more elegant in the commercial and residential quarters than when they hide grimy working-men's dwellings; but they suffice to conceal from the eyes of the wealthy men and women of strong stomachs and weak nerves the misery and grime which form the complement of their wealth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '279'
- id: II.51.15
  kind: p
  original: So ist z.B. Deansgate, das von der alten Kirche in gerader Richtung nach Süden führt, anfangs mit Warenlagern und Fabriken, dann mit Läden zweiten Ranges und einigen Bierhäusern, weiter südlich, wo es das kommerzielle Viertel verläßt, mit unansehnlicheren Laden, die, je weiter man kommt, desto schmutziger und mehr und mehr von Schenken und Schnapshäusern unterbrochen werden, bebaut, bis am südlichen Ende das Aussehen der Laden keinen Zweifel darüber läßt, daß Arbeiter und nur Arbeiter ihre Kunden sind.
  en: So, for instance, Deansgate, which leads from the Old Church directly southward, is lined first with mills and warehouses, then with second-rate shops and alehouses; farther south, when it leaves the commercial district, with less inviting shops, which grow dirtier and more interrupted by beerhouses and gin palaces the farther one goes, until at the southern end the appearance of the shops leaves no doubt that workers and workers only are their customers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 279-280
- id: II.51.16
  kind: p
  original: So Market Street, von der Börse südöstlich laufend; anfangs brillante Laden ersten Ranges und in den höheren Stockwerken Kontore und Warenlager; weiterhin in der Fortsetzung (Piccadilly) kolossale Hotels und Warenlager; in der weiteren Fortsetzung (London Road) in der Gegend des Medlock Fabriken, Schenken, Läden für niedere Bourgeoisie und Arbeiter, dann an Ardwick Green Wohnungen für höhere und mittlere Bourgeoisie, und von da an große Gärten und Landhäuser für die reicheren Fabrikanten und Kaufleute.
  en: So Market Street running south-east from the Exchange; at first brilliant shops of the best sort, with counting-houses or warehouses above; in the continuation, Piccadilly, immense hotels and warehouses; in the farther continuation, London Road, in the neighbourhood of the Medlock, factories, beerhouses, shops for the humbler bourgeoisie and the working population; and from this point onward, large gardens and villas of the wealthier merchants and manufacturers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: II.51.17
  kind: p
  original: Auf diese Weise kann man wohl, wenn man Manchester kennt, von den Hauptstraßen aus auf die anschließenden Bezirke schließen, aber man ist sehr selten imstande, von ihnen aus die wirklichen Arbeiterbezirke selbst zu Gesicht zu bekommen.
  en: In this way any one who knows Manchester can infer the adjoining districts, from the appearance of the thoroughfare, but one is seldom in a position to catch from the street a glimpse of the real labouring districts.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: II.51.18
  kind: p
  original: Ich weiß sehr wohl, daß diese heuchlerische Bauart mehr oder weniger allen großen Städten gemein ist; ich weiß ebenfalls, daß die Detailhändler schon wegen der Natur ihres Geschäfts die großen durchführenden Straßen für sich in Beschlag nehmen müssen; ich weiß, daß man überall an solchen Straßen mehr gute als schlechte Häuser hat und daß in ihrer Nähe der Grundwert höher ist als in abgelegenen Gegenden; aber ich habe zugleich eine so systematische Absperrung der Arbeiterklasse von den Hauptstraßen, eine so zartfühlende Verhüllung alles dessen, was das Auge und die Nerven der Bourgeoisie beleidigen könnte, nirgends gefunden als in Manchester.
  en: I know very well that this hypocritical plan is more or less common to all great cities; I know, too, that the retail dealers are forced by the nature of their business to take possession of the great highways; I know that there are more good buildings than bad ones upon such streets everywhere, and that the value of land is greater near them than in remoter districts; but at the same time I have never seen so systematic a shutting out of the working-class from the thoroughfares, so tender a concealment of everything which might affront the eye and the nerves of the bourgeoisie, as in Manchester.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: II.51.19
  kind: p
  original: Und doch ist gerade Manchester sonst weniger planmäßig oder nach Polizeivorschriften und dagegen mehr durch den Zufall gebaut als irgendeine andre Stadt; und wenn ich die eifrigen Beteuerungen der Mittelklasse, daß es den Arbeitern ganz vortrefflich gehe, dabei erwäge, so will es mich doch dünken, als seien die liberalen Fabrikanten, die "big whigs" von Manchester, nicht so ganz unschuldig an dieser schamhaften Bauart.
  en: And yet, in other respects, Manchester is less built according to a plan, after official regulations, is more an outgrowth of accident, than any other city; and when I consider in this connection the eager assurances of the middle-class, that the working-class is doing famously, I cannot help feeling that the liberal manufacturers, the "Big Wigs" of Manchester, are not so innocent after all, in the matter of this sensitive method of construction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: II.52.1
  kind: p
  original: Ich erwähne noch eben, daß die Fabrikanlagen sich fast alle dem Lauf der drei Flüsse oder der verschiedenen Kanäle, die sich durch die Stadt verzweigen, anschließen, und gehe dann zur Schilderung der Arbeiterbezirke selbst über.
  en: I may mention just here that the mills almost all adjoin the rivers or the different canals that ramify throughout the city, before I proceed at once to describe the labouring quarters.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: II.52.2
  kind: p
  original: Da ist zuerst die Altstadt von Manchester, die zwischen der Nordgrenze des kommerziellen Viertels und dem Irk liegt.
  en: First of all, there is the old town of Manchester, which lies between the northern boundary of the commercial district and the Irk.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: II.52.3
  kind: p
  original: Hier sind die Straßen, selbst die besseren, eng und krumm - wie Todd Street, Long Millgate, Withy Grove und Shude Hill -, die Häuser schmutzig, alt und baufällig und die Bauart der Nebenstraßen vollends abscheulich.
  en: Here the streets, even the better ones, are narrow and winding, as Todd Street, Long Millgate, Withy Grove, and Shude Hill, the houses dirty, old, and tumble-down, and the construction of the side streets utterly horrible.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '280'
- id: II.52.4
  kind: p
  original: Wenn man von der alten Kirche in Long Millgate hineingeht, so hat man gleich rechts eine Reihe altmodischer Häuser, an denen keine einzige Frontmauer senkrecht geblieben ist; es sind die Reste des alten, vorindustriellen Manchester, deren frühere Einwohner sich mit ihren Nachkommen in besser gebaute Bezirke gezogen und die Häuser, die ihnen zu schlecht waren, einer stark mit irischem Blut vermischten Arbeiterrasse überlassen haben.
  en: Going from the Old Church to Long Millgate, the stroller has at once a row of old-fashioned houses at the right, of which not one has kept its original level; these are remnants of the old pre-manufacturing Manchester, whose former inhabitants have removed with their descendants into better-built districts, and have left the houses, which were not good enough for them, to a population strongly mixed with Irish blood.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 280-281
- id: II.52.5
  kind: p
  original: Man ist hier wirklich in einem fast unverhüllten Arbeiterviertel, denn selbst die Läden und Kneipen der Straße nehmen sich nicht die Mühe, etwas reinlich auszusehen.
  en: Here one is in an almost undisguised working-men's quarter, for even the shops and beerhouses hardly take the trouble to exhibit a trifling degree of cleanliness.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: II.52.6
  kind: p
  original: Aber das ist all noch nichts gegen die Gassen und Höfe, die dahinter liegen und zu denen man nur durch enge, überbaute Zugänge gelangt, in denen keine zwei Menschen aneinander vorbei können.
  en: But all this is nothing in comparison with the courts and lanes which lie behind, to which access can be gained only through covered passages, in which no two human beings can pass at the same time.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: II.52.7
  kind: p
  original: Von der unordentlichen, aller vernünftigen Baukunst hohnsprechenden Zusammenwürfelung der Häuser, von der Gedrängtheit, mit der sie hier förmlich aneinandergepackt sind, kann man sich keine Vorstellung machen.
  en: Of the irregular cramming together of dwellings in ways which defy all rational plan, of the tangle in which they are crowded literally one upon the other, it is impossible to convey an idea.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: II.52.8
  kind: p
  original: Und es sind nicht nur die aus der alten Zeit Manchesters hinterlassenen Gebäude, die die Schuld davon tragen; die Verwirrung ist in neuerer Zeit erst auf die Spitze getrieben worden, indem überall, wo die ganze Bauart der früheren Epoche noch ein Fleckchen Raum ließ, später nachgebaut und angeflickt wurde, bis endlich zwischen den Häusern kein Zoll breit Platz blieb, der sich noch hätte verbauen lassen.
  en: And it is not the buildings surviving from the old times of Manchester which are to blame for this; the confusion has only recently reached its height when every scrap of space left by the old way of building has been filled up and patched over until not a foot of land is left to be further occupied.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.52.9
  kind: p
  original: Zur Bestätigung zeichne ich ein kleines Fleckchen aus dem Plane von Manchester hier ab - es ist nicht das schlimmste Stück und nicht der zehnte Teil der ganzen Altstadt.
  en: ''
  joined_to: II.52.8
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '281'
- id: II.53.1
  kind: p
  original: Diese Zeichnung wird hinreichen, um die wahnsinnige Bauart des ganzen Bezirks, namentlich des in der Nähe des Irk zu charakterisieren.
  en: The south bank of the Irk is here very steep and between fifteen and thirty feet high.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: II.53.2
  kind: p
  original: Das Ufer des Irk ist hier auf der Südseite sehr steil und zwischen fünfzehn und dreißig Fuß hoch; an diese abschüssige Bergwand sind meist noch drei Reihen Häuser hingepflanzt, deren niedrigste sich unmittelbar aus dem Flusse erhebt, während die Vorderwand der höchsten auf dem Niveau der Hügelkrone in Long Millgate steht.
  en: On this declivitous hillside there are planted three rows of houses, of which the lowest rise directly out of the river, while the front walls of the highest stand on the crest of the hill in Long Millgate.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: II.53.3
  kind: p
  original: Dazwischen stehen noch Fabriken am Flusse - kurz die Bauart ist hier ebenso eng und unordentlich wie im unteren Teil von Long Millgate.
  en: Among them are mills on the river, in short, the method of construction is as crowded and disorderly here as in the lower part of Long Millgate.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: II.53.4
  kind: p
  original: Rechts und links führen eine Menge überbauter Zugänge von der Hauptstraße in die vielen Höfe ab, und wenn man hineingeht, so gerät man in einen Schmutz und eine ekelhafte Unsauberkeit, die ihresgleichen nicht hat - namentlich in den Höfen, die nach dem Irk hinabführen und die unbedingt die scheußlichsten Wohnungen enthalten, welche mir bis jetzt vorgekommen sind.
  en: Right and left a multitude of covered passages lead from the main street into numerous courts, and he who turns in thither gets into a filth and disgusting grime, the equal of which is not to be found--especially in the courts which lead down to the Irk, and which contain unqualifiedly the most horrible dwellings which I have yet beheld.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '281'
- id: II.53.5
  kind: p
  original: In einem dieser Höfe steht gleich am Eingange, wo der bedeckte Gang aufhört, ein Abtritt, der keine Tür hat und so schmutzig ist, daß die Einwohner nur durch eine stagnierende Pfütze von faulem Urin und Exkrementen, die ihn umgibt, in den Hof oder heraus können; es ist der erste Hof am Irk oberhalb Ducie Bridge, wenn jemand Lust haben sollte, nachzusehen; unten am Flusse stehen mehrere Gerbereien, die die ganze Umgegend mit animalischem Verwesungsgeruch erfüllen.
  en: In one of these courts there stands directly at the entrance, at the end of the covered passage, a privy without a door, so dirty that the inhabitants can pass into and out of the court only by passing through foul pools of stagnant urine and excrement. This is the first court on the Irk above Ducie Bridge--in case any one should care to look into it. Below it on the river there are several tanneries which fill the whole neighbourhood with the stench of animal putrefaction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 281-282
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.53.6
  kind: p
  original: In die Höfe unterhalb Ducie Bridge steigt man meist auf engen, schmutzigen Treppen hinab und gelangt nur über Haufen von Schutt und Unrat an die Häuser.
  en: Below Ducie Bridge the only entrance to most of the houses is by means of narrow, dirty stairs and over heaps of refuse and filth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: II.53.7
  kind: p
  original: Der erste Hof unterhalb Ducie Bridge heißt Allen's Court und war zur Cholerazeit in einem solchen Zustande, daß die Gesundheitspolizei ihn ausräumen, fegen und mit Chlor ausräuchern ließ; Dr. Kay gibt in einer Broschüre eine schreckenerregende Beschreibung von der damaligen Lage dieses Hofes.
  en: The first court below Ducie Bridge, known as Allen's Court, was in such a state at the time of the cholera that the sanitary police ordered it evacuated, swept, and disinfected with chloride of lime. Dr. Kay gives a terrible description of the state of this court at that time.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N9
  mew_page: '282'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.53.8
  kind: p
  original: Seitdem scheint er teilweise abgebrochen und neu erbaut worden zu sein - von Ducie Bridge herab sieht man wenigstens noch mehrere Mauerruinen und hohe Schutthaufen neben einigen Häusern neueren Baues.
  en: Since then, it seems to have been partially torn away and rebuilt; at least looking down from Ducie Bridge, the passer-by sees several ruined walls and heaps of debris with some newer houses.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: II.53.9
  kind: p
  original: Die Aussicht von dieser Brücke - zartfühlenderweise von einer mannshohen gemauerten Brustwehr den kleineren Sterblichen verhüllt - ist überhaupt charakteristisch für den ganzen Bezirk.
  en: The view from this bridge, mercifully concealed from mortals of small stature by a parapet as high as a man, is characteristic for the whole district.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: II.53.10
  kind: p
  original: In der Tiefe fließt oder vielmehr stagniert der Irk, ein schmaler, pechschwarzer, stinkender Fluß, voll Unrat und Abfall, den er ans rechte, flachere Ufer anspült; bei trocknem Wetter bleibt an diesem Ufer eine lange Reihe der ekelhaftesten schwarzgrünen Schlammpfützen stehen, aus deren Tiefe fortwährend Blasen miasmatischer Gase aufsteigen und einen Geruch entwickeln, der selbst oben auf der Brücke, vierzig oder fünfzig Fuß über dem Wasserspiegel, noch unerträglich ist.
  en: At the bottom flows, or rather stagnates, the Irk, a narrow, coal-black, foul-smelling stream, full of debris and refuse, which it deposits on the shallower right bank. In dry weather, a long string of the most disgusting, blackish-green, slime pools are left standing on this bank, from the depths of which bubbles of miasmatic gas constantly arise and give forth a stench unendurable even on the bridge forty or fifty feet above the surface of the stream.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.53.11
  kind: p
  original: Der Fluß selbst wird dazu noch alle fingerlang durch hohe Wehre aufgehalten, hinter denen sich der Schlamm und Abfall in dicken Massen absetzt und verfault.
  en: But besides this, the stream itself is checked every few paces by high weirs, behind which slime and refuse accumulate and rot in thick masses.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: II.53.12
  kind: p
  original: Oberhalb der Brücke stehen hohe Gerbereien, weiter hinauf Färbereien, Knochenmühlen und Gaswerke, deren Abflüsse und Abfälle samt und sonders in den Irk wandern, der außerdem noch den Inhalt der anschießenden Kloaken und Abtritte aufnimmt.
  en: Above the bridge are tanneries, bonemills, and gasworks, from which all drains and refuse find their way into the Irk, which receives further the contents of all the neighbouring sewers and privies.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: II.53.13
  kind: p
  original: Man kann sich also denken, welcher Beschaffenheit die Residuen sind, die der Fluß hinterläßt.
  en: It may be easily imagined, therefore, what sort of residue the stream deposits.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: II.53.14
  kind: p
  original: Unterhalb der Brücke sieht man in die Schutthaufen, den Unrat, Schmutz und Verfall der Höfe auf dem linken, steilen Ufer; ein Haus steht immer dicht hinter dem andern, und wegen der Steigerung des Ufers sieht man von jedem ein Stück alle schwarzgeraucht, bröckelig, alt, mit zerbrochnen Fensterscheiben und Fensterrahmen.
  en: Below the bridge you look upon the piles of debris, the refuse, filth, and offal from the courts on the steep left bank; here each house is packed close behind its neighbour and a piece of each is visible, all black, smoky, crumbling, ancient, with broken panes and window frames.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '282'
- id: II.53.15
  kind: p
  original: Den Hintergrund bilden kasernenartige, alte Fabrikgebäude, Auf dem rechten, flacheren Ufer steht eine lange Reihe Häuser und Fabriken - gleich das zweite Haus ist eine Ruine ohne Dach, mit Schutt angefüllt, und das dritte steht so niedrig, daß das unterste Stockwerk unbewohnbar und infolgedessen ohne Fenster und Türen ist.
  en: The background is furnished by old barrack-like factory buildings. On the lower right bank stands a long row of houses and mills; the second house being a ruin without a roof, piled with debris; the third stands so low that the lowest floor is uninhabitable, and therefore without windows or doors.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 282-283
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.53.16
  kind: p
  original: Den Hintergrund bildet hier der Arrnenkirchhof, die Bahnhöfe der Liverpooler und Leedser Eisenbahnen und dahinter das Arbeitshaus, die "Armengesetz-Bastille" von Manchester, das wie eine Zitadelle von einem Hügel hinter hohen Mauern und Zinnen drohend auf das gegenüberliegende Arbeiterviertel herabschaut.
  en: Here the background embraces the pauper burial-ground, the station of the Liverpool and Leeds railway, and, in the rear of this, the Workhouse, the "Poor-Law Bastille" of Manchester, which, like a citadel, looks threateningly down from behind its high walls and parapets on the hilltop, upon the working-people's quarter below.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
- id: II.54.1
  kind: p
  original: Oberhalb Ducie Bridge wird das linke Ufer flacher und das rechte dagegen steiler, der Zustand der Wohnungen auf beiden Seiten des Irk indessen eher schlimmer als besser.
  en: Above Ducie Bridge, the left bank grows more flat and the right bank steeper, but the condition of the dwellings on both banks grows worse rather than better.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
- id: II.54.2
  kind: p
  original: Wenn man hier von der Hauptstraße - noch immer Long Millgate - links abgeht, so ist man verloren; man gerät aus einem Hof in den andern, das geht um lauter Ecken, durch lauter enge, schmutzige Winkel und Gänge, bis man nach wenig Minuten alle Richtung verloren hat und gar nicht mehr weiß, wohin man sich wenden soll.
  en: He who turns to the left here from the main street, Long Millgate, is lost; he wanders from one court to another, turns countless corners, passes nothing but narrow, filthy nooks and alleys, until after a few minutes he has lost all clue, and knows not whither to turn.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
- id: II.54.3
  kind: p
  original: Überall halb oder ganz verfallene Gebäude - einzelne sind wirklich unbewohnt, und das will hier viel heißen - in den Häusern Selten ein bretterner oder steinerner Fußboden, dagegen fast immer zerbrochene, schlecht passende Fenster und Türen, und ein Schmutz!
  en: Everywhere half or wholly ruined buildings, some of them actually uninhabited, which means a great deal here; rarely a wooden or stone floor to be seen in the houses, almost uniformly broken, ill-fitting windows and doors, and a state of filth!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
- id: II.54.4
  kind: p
  original: '- Schutthaufen, Abfall und Unflat überall; stehende Pfützen statt der Rinnsteine, und ein Geruch, der es allein jedem einigermaßen zivilisierten Menschen unerträglich machen würde, in einem solchen Distrikt zu wohnen.'
  en: Everywhere heaps of debris, refuse, and offal; standing pools for gutters, and a stench which alone would make it impossible for a human being in any degree civilised to live in such a district.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
- id: II.54.5
  kind: p
  original: Die neuerbaute Verlängerung der Leedser Eisenbahn, welche hier den Irk überschreitet, hat einen Teil dieser Höfe und Gäßchen weggefegt, dagegen andre wieder erst recht dem Blicke offengelegt.
  en: The newly-built extension of the Leeds railway, which crosses the Irk here, has swept away some of these courts and lanes, laying others completely open to view.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
- id: II.54.6
  kind: p
  original: So ist unmittelbar unterhalb der Eisenbahnbrücke ein Hof, der an Schmutz und Scheußlichkeit alle andern weit übertrifft, eben weil er bisher so geschlossen, so zurückgezogen war, daß man nur mit Mühe hineingelangen konnte; ich selbst hätte ihn ohne die durch den Eisenbahnviadukt geschaffene Lücke nie gefunden, obwohl ich diese ganze Gegend genau zu kennen glaubte.
  en: Immediately under the railway bridge there stands a court, the filth and horrors of which surpass all the others by far, just because it was hitherto so shut off, so secluded that the way to it could not be found without a good deal of trouble. I should never have discovered it myself, without the breaks made by the railway, though I thought I knew this whole region thoroughly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.54.7
  kind: p
  original: Man gelangt über ein holpriges Ufer, zwischen Pfählen und Waschleinen hindurch in dies Chaos kleiner, einstöckiger und einstubiger Hütten, von denen die meisten ohne allen künstlichen Fußboden sind - Küche, Wohn- und Schlafzimmer, alles vereinigt.
  en: Passing along a rough bank, among stakes and washing-lines, one penetrates into this chaos of small one-storied, one-roomed huts, in most of which there is no artificial floor; kitchen, living and sleeping-room all in one.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
- id: II.54.8
  kind: p
  original: In einem solchen Loche, das kaum sechs Fuß lang und fünf breit war, sah ich zwei Betten - und was für Bettstellen und Betten - die nebst einer Treppe und einem Herd gerade hinreichten, um das ganze Zimmer zu füllen.
  en: In such a hole, scarcely five feet long by six broad, I found two beds--and such bedsteads and beds!--which, with a staircase and chimney-place, exactly filled the room.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
- id: II.54.9
  kind: p
  original: In mehreren andern sah ich gar nichts, obwohl die Tür weit offenstand und die Einwohner an ihr lehnten.
  en: In several others I found absolutely nothing, while the door stood open, and the inhabitants leaned against it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '283'
- id: II.54.10
  kind: p
  original: Vor den Türen überall Schutt und Unrat; daß eine Art von Pflaster darunter sei, war nicht zu sehen, sondern bloß hie und da mit den Füßen herauszufühlen.
  en: Everywhere before the doors refuse and offal; that any sort of pavement lay underneath could not be seen but only felt, here and there, with the feet.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 283-284
- id: II.54.11
  kind: p
  original: Der ganze Haufen menschenbewohnter Viehställe war auf zwei Seiten von Häusern und einer Fabrik, auf der dritten vom Fluß begrenzt, und außer dem schmalen Ufersteig führte nur noch ein enger Torweg hinaus - in ein andres, fast ebenso schlecht gebautes und gehaltenes Labyrinth von Wohnungen.
  en: This whole collection of cattle-sheds for human beings was surrounded on two sides by houses and a factory, and on the third by the river, and besides the narrow stair up the bank, a narrow doorway alone led out into another almost equally ill-built, ill-kept labyrinth of dwellings.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '284'
- id: II.55.1
  kind: p
  original: Genug davon!
  en: Enough!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '284'
- id: II.55.2
  kind: p
  original: In dieser Weise ist die ganze Irkseite bebaut, ein planlos zusammengewürfeltes Chaos von Häusern, die der Unbewohnbarkeit mehr oder weniger nahestehen und deren unreinliches Innere der unflätigen Umgebung vollkommen entspricht.
  en: The whole side of the Irk is built in this way, a planless, knotted chaos of houses, more or less on the verge of uninhabitableness, whose unclean interiors fully correspond with their filthy external surroundings.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '284'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.55.3
  kind: p
  original: Wie sollen die Leute auch reinlich sein!
  en: ''
  joined_to: II.55.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '284'
- id: II.55.4
  kind: p
  original: Nicht einmal für die Befriedigung der allernatürlichsten und alltäglichsten Bedürfnisse gibt es geeignete Gelegenheit.
  en: And how could the people be clean with no proper opportunity for satisfying the most natural and ordinary wants?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '284'
- id: II.55.5
  kind: p
  original: Die Abtritte sind hier so rar, daß sie entweder alle Tage voll werden oder den meisten zu entlegen sind.
  en: Privies are so rare here that they are either filled up every day, or are too remote for most of the inhabitants to use.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '284'
- id: II.55.6
  kind: p
  original: Wie sollten sich die Leute waschen, wo sie nur das schmutzige Irkwasser nahebei haben und Wasserleitungen und Pumpen erst in honetten Stadtteilen vorkommen!
  en: How can people wash when they have only the dirty Irk water at hand, while pumps and water pipes can be found in decent parts of the city alone?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '284'
- id: II.55.7
  kind: p
  original: Wahrhaftig, man kann es diesen Heloten der modernen Gesellschaft nicht zurechnen, wenn ihre Wohnungen nicht reinlicher sind als die Schweineställe, die hier und da mitten dazwischen stehen!
  en: In truth, it cannot be charged to the account of these helots of modern society if their dwellings are not more cleanly than the pig-sties which are here and there to be seen among them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '284'
- id: II.55.8
  kind: p
  original: Schämen sich doch die Hausbesitzer nicht, Wohnungen zu vermieten wie die sechs oder sieben Keller am Kai, gleich unterhalb Scotland Bridge, deren Fußboden mindestens zwei Fuß unter dem Wasserspiegel - bei niedrigem Wasser - des nicht sechs Fuß davon fließenden Irk liegt, oder wie das obere Stock im Eckhaus auf dem entgegengesetzten Ufer gleich oberhalb der Brücke, dessen Erdgeschoß unbewohnbar, ohne alle Ausfüllung für Tür- und Fensterlöcher - doch das ist ja ein Fall, der in dieser ganzen Gegend nicht selten vorkommt, wobei dann gewöhnlich dies offene untere Stockwerk von der ganzen Nachbarschaft aus Mangel an andern Lokalitäten als Abtritt benutzt wird!
  en: The landlords are not ashamed to let dwellings like the six or seven cellars on the quay directly below Scotland Bridge, the floors of which stand at least two feet below the low-water level of the Irk that flows not six feet away from them; or like the upper floor of the corner-house on the opposite shore directly above the bridge, where the ground floor, utterly uninhabitable, stands deprived of all fittings for doors and windows, a case by no means rare in this region, when this open ground floor is used as a privy by the whole neighbourhood for want of other facilities!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '284'
- id: II.56.1
  kind: p
  original: Verlassen wir den Irk, um auf der entgegengesetzten Seite von Long Millgate wieder in die Mitte der Arbeiterwohnungen zu dringen, so kommen wir in ein etwas neueres Viertel, das sich von der St.-Michaelis-Kirche bis Withy Grove und Shude Hill erstreckt.
  en: If we leave the Irk and penetrate once more on the opposite side from Long Millgate into the midst of the working-men's dwellings, we shall come into a somewhat newer quarter, which stretches from St. Michael's Church to Withy Grove and Shude Hill.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '284'
- id: II.56.2
  kind: p
  original: 'Hier ist wenigstens etwas mehr Ordnung: statt der chaotischen Bauart finden wir hier wenigstens lange, gerade Gassen und Sackgassen oder absichtlich gebaute, meist viereckige Höfe; aber wenn früher jedes einzelne Haus, so ist hier wenigstens jede Gasse und jeder Hof willkürlich und ohne alle Rücksicht auf die Lage der übrigen angebaut.'
  en: Here there is somewhat better order. In place of the chaos of buildings, we find at least long straight lanes and alleys or courts, built according to a plan and usually square. But if, in the former case, every house was built according to caprice, here each lane and court is so built, without reference to the situation of the adjoining ones.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '284'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.56.3
  kind: p
  original: Bald läuft eine Gasse in dieser, bald in jener Richtung, alle fingerlang gerät man in einen Sack oder um eine zugebaute Ecke, die gerade wieder dahin führt, von wo man ausgegangen ist - wer nicht in diesem Labyrinth eine gute Zeit lang gewohnt hat, findet sich gewiß nicht hindurch.
  en: The lanes run now in this direction, now in that, while every two minutes the wanderer gets into a blind alley, or, on turning a corner, finds himself back where he started from; certainly no one who has not lived a considerable time in this labyrinth can find his way through it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '284'
- id: II.56.4
  kind: p
  original: Die Ventilation der Straßen - wenn ich das Wort von diesem Distrikt gebrauchen darf - und Höfe wird dadurch ebenso unvollkommen wie die der Irkgegend; und wenn dennoch dieser Bezirk etwas vor dem Irktale voraus haben sollte - die Häuser sind allerdings neuer, die Straßen haben wenigstens zuweilen Rinnsteine -, so hat er dagegen auch wieder fast unter jedem Hause eine Kellerwohnung, was sich im Irktale eben wegen des größeren Alters und der nachlässigeren Bauart der Häuser selten findet.
  en: If I may use the word at all in speaking of this district, the ventilation of these streets and courts is, in consequence of this confusion, quite as imperfect as in the Irk region; and if this quarter may, nevertheless, be said to have some advantage over that of the Irk, the houses being newer and the streets occasionally having gutters, nearly every house has, on the other hand, a cellar dwelling, which is rarely found in the Irk district, by reason of the greater age and more careless construction of the houses.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 284-285
- id: II.56.5
  kind: p
  original: Im übrigen ist der Schmutz, die Schutt- und Aschenhaufen, die Pfützen auf den Straßen beiden Vierteln gemeinsam, und in dem Distrikt, von dem wir jetzt reden, finden wir außerdem noch einen andern Umstand, der für die Reinlichkeit der Einwohner sehr nachteilig ist, nämlich die Masse Schweine, die hier überall auf den Gassen umherspazieren, den Unrat durchschnüffeln oder in den Höfen in kleinen Ställen eingesperrt sind.
  en: As for the rest, the filth, debris, and offal heaps, and the pools in the streets are common to both quarters, and in the district now under discussion, another feature most injurious to the cleanliness of the inhabitants, is the multitude of pigs walking about in all the alleys, rooting into the offal heaps, or kept imprisoned in small pens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '285'
- id: II.56.6
  kind: p
  original: Die Schweinemäster mieten sich hier, wie in den meisten Arbeiterbezirken von Manchester, die Höfe und setzen Schweineställe hinein; fast in jedem Hofe ist ein solcher abgesperrter Winkel oder gar mehrere, in welche die Bewohner des Hofs allen Abfall und Unrat hineinwerfen - dabei werden die Schweine fett, und die ohnehin in diesen nach allen vier Seiten verbauten Höfen eingesperrte Luft vollends schlecht von den verwesenden vegetabilischen und animalischen Stoffen.
  en: Here, as in most of the working-men's quarters of Manchester, the pork-raisers rent the courts and build pig-pens in them. In almost every court one or even several such pens may be found, into which the inhabitants of the court throw all refuse and offal, whence the swine grow fat; and the atmosphere, confined on all four sides, is utterly corrupted by putrefying animal and vegetable substances.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '285'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.56.7
  kind: p
  original: Man hat durch diesen Bezirk eine breite, ziemlich honette Straße - Millers Street - gebrochen und den Hintergrund mit ziemlichem Erfolge verdeckt; wenn man sich aber von der Neugier in einen der zahlreichen Gange, die in die Höfe führen, verleiten läßt, so kann man diese buchstäbliche Schweinerei alle zwanzig Schritt wiederholt sehen.
  en: Through this quarter, a broad and measurably decent street has been cut, Millers Street, and the background has been pretty successfully concealed. But if any one should be led by curiosity to pass through one of the numerous passages which lead into the courts, he will find this piggery repeated at every twenty paces.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '285'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.57.1
  kind: p
  original: Das ist die Altstadt von Manchester - und wenn ich meine Schilderung noch einmal durchlese, so muß ich bekennen, daß sie, statt übertrieben zu sein, noch lange nicht grell genug ist, um den Schmutz, die Verkommenheit und Unwohnlichkeit, die allen Rücksichten auf Reinlichkeit, Ventilation und Gesundheit hohnsprechende Bauart dieses mindestens zwanzig- bis dreißigtausend Einwohner fassenden Bezirks anschaulich zu machen.
  en: Such is the Old Town of Manchester, and on re-reading my description, I am forced to admit that instead of being exaggerated, it is far from black enough to convey a true impression of the filth, ruin, and uninhabitableness, the defiance of all considerations of cleanliness, ventilation, and health which characterise the construction of this single district, containing at least twenty to thirty thousand inhabitants.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '285'
- id: II.57.2
  kind: p
  original: Und ein solches Viertel existiert im Zentrum der zweiten Stadt Englands, der ersten Fabrikstadt der Welt!
  en: And such a district exists in the heart of the second city of England, the first manufacturing city of the world.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '285'
- id: II.57.3
  kind: p
  original: Wenn man sehen will, wie wenig Raum der Mensch zum Bewegen, wie wenig Luft - und welche Luft! - er zum Atmen im Notfall zu haben braucht, mit wie wenig Zivilisation er existieren kann, dann hat man nur hieher zu kommen.
  en: If any one wishes to see in how little space a human being can move, how little air--and such air!--he can breathe, how little of civilisation he may share and yet live, it is only necessary to travel hither.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '285'
- id: II.57.4
  kind: p
  original: Es ist freilich die Altstadt - und darauf berufen sich die Leute hier, wenn man ihnen von dem scheußlichen Zustande dieser Hölle auf Erden spricht -, aber was will das sagen?
  en: True, this is the Old Town, and the people of Manchester emphasise the fact whenever any one mentions to them the frightful condition of this Hell upon Earth; but what does that prove?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '285'
- id: II.57.5
  kind: p
  original: Alles, was unsren Abscheu und unsre Indignation hier am heftigsten erregt, ist neueren Ursprungs, gehört der industriellen Epoche an.
  en: Everything which here arouses horror and indignation is of recent origin, belongs to the industrial epoch.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '285'
- id: II.57.6
  kind: p
  original: Die paar hundert Häuser, die dem alten Manchester angehören, sind von ihren ursprünglichen Bewohnern längst verlassen; nur die Industrie hat sie mit den Scharen von Arbeitern vollgepfropft, die jetzt in ihnen beherbergt werden; nur die Industrie hat jedes Fleckchen zwischen diesen alten Häusern verbaut, um Obdach zu gewinnen für die Massen, die sie sich aus den Ackerbaugegenden und aus Irland verschrieb; nur die Industrie gestattet es den Besitzern dieser Viehställe, sie an Menschen für hohe Miete zur Wohnung zu überlassen, die Armut der Arbeiter auszubeuten, die Gesundheit von Tausenden zu untergraben, damit nur sie sich bereichern; nur die Industrie hat es möglich gemacht, daß der kaum aus der Leibeigenschaft befreite Arbeiter wieder als ein bloßes Material, als Sache gebraucht werden konnte, daß er sich in eine Wohnung sperren lassen muß, die jedem andern zu schlecht und die er nun für sein teures Geld das Recht hat vollends verfallen zu lassen.
  en: The couple of hundred houses, which belong to old Manchester, have been long since abandoned by their original inhabitants; the industrial epoch alone has crammed into them the swarms of workers whom they now shelter; the industrial epoch alone has built up every spot between these old houses to win a covering for the masses whom it has conjured hither from the agricultural districts and from Ireland; the industrial epoch alone enables the owners of these cattle-sheds to rent them for high prices to human beings, to plunder the poverty of the workers, to undermine the health of thousands, in order that they alone, the owners, may grow rich. In the industrial epoch alone has it become possible that the worker scarcely freed from feudal servitude could be used as mere material, a mere chattel; that he must let himself be crowded into a dwelling too bad for every other, which he for his hard-earned wages buys the right to let go utterly to ruin.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 285-286
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.57.7
  kind: p
  original: Das hat nur die Industrie getan, die ohne diese Arbeiter, ohne die Armut und Knechtschaft dieser Arbeiter nicht hätte leben können.
  en: This manufacture has achieved, which, without these workers, this poverty, this slavery could not have lived.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '286'
- id: II.57.8
  kind: p
  original: Es ist wahr, die ursprüngliche Anlage dieses Viertels war schlecht, man konnte nicht viel Gutes daraus machen - aber haben die Grundbesitzer, hat die Verwaltung etwas getan, um das beim Nachbau zu verbessern?
  en: True, the original construction of this quarter was bad, little good could have been made out of it; but, have the landowners, has the municipality done anything to improve it when rebuilding?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '286'
- id: II.57.9
  kind: p
  original: Im Gegenteil, wo noch ein Winkelchen frei war, ist ein Haus hingesetzt, wo noch ein überflüssiger Ausgang, ist er zugebaut worden; der Grundwert stieg mit dem Aufblühen der Industrie, und je mehr er stieg, desto toller wurde darauf losgebaut, ohne Rücksicht auf die Gesundheit und Bequemlichkeit der Einwohner - es ist keine Baracke so schlecht, es findet sich immer ein Armer, der keine bessere bezahlen kann -, nur mit Rücksicht auf den größtmöglichen Gewinn.
  en: On the contrary, wherever a nook or corner was free, a house has been run up; where a superfluous passage remained, it has been built up; the value of land rose with the blossoming out of manufacture, and the more it rose, the more madly was the work of building up carried on, without reference to the health or comfort of the inhabitants, with sole reference to the highest possible profit on the principle that no hole is so bad but that some poor creature must take it who can pay for nothing better.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '286'
- id: II.57.10
  kind: p
  original: Doch es ist einmal die Altstadt, und damit beruhigt sich die Bourgeoisie; sehen wir denn, wie die Neustadt (the New Town) sich anläßt.
  en: However, it is the Old Town, and with this reflection the bourgeoisie is comforted. Let us see, therefore, how much better it is in the New Town.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '286'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.58.1
  kind: p
  original: Die Neustadt, auch die Irische Stadt (the Irish Town) genannt, zieht sich jenseits der Altstadt einen Lehmhügel zwischen dem Irk und St. George's Road hinauf.
  en: The New Town, known also as Irish Town, stretches up a hill of clay, beyond the Old Town, between the Irk and St. George's Road.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '286'
- id: II.58.2
  kind: p
  original: Hier hört alles städtische Aussehen auf; einzelne Reihen Häuser oder Straßenkomplexe stehen wie kleine Dörfer hier und da auf dem nackten, nicht einmal mit Gras bewachsenen Lehmboden; die Häuser oder vielmehr Cottages sind in schlechtem Zustande, nie repariert, schmutzig, mit feuchten und unreinen Kellerwohnungen versehen; die Gassen sind weder gepflastert noch haben sie Abzüge, dagegen zahlreiche Kolonien von Schweinen, die in kleinen Höfen und Ställen abgesperrt sind oder ungeniert an der Halde spazierengehn.
  en: Here all the features of a city are lost. Single rows of houses or groups of streets stand, here and there, like little villages on the naked, not even grass-grown clay soil; the houses, or rather cottages, are in bad order, never repaired, filthy, with damp, unclean, cellar dwellings; the lanes are neither paved nor supplied with sewers, but harbour numerous colonies of swine penned in small sties or yards, or wandering unrestrained through the neighbourhood.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '286'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.58.3
  kind: p
  original: Der Kot auf den Wegen ist hier so groß, daß man nur bei äußerst trocknem Wetter Aussicht hat durchzukommen, ohne bei jedem Schritt bis über die Knöchel zu versinken.
  en: The mud in the streets is so deep that there is never a chance, except in the dryest weather, of walking without sinking into it ankle deep at every step.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '286'
- id: II.58.4
  kind: p
  original: In der Nähe von St. George's Road schließen sich die einzelnen bebauten Flecken dichter aneinander, man gerät in eine fortlaufende Reihe Gassen, Sackgassen, Hintergassen und Höfe, die je gedrängter und unordentlicher werden, je näher man dem Zentrum der Stadt kommt.
  en: In the vicinity of St. George's Road, the separate groups of buildings approach each other more closely, ending in a continuation of lanes, blind alleys, back lanes and courts, which grow more and more crowded and irregular the nearer they approach the heart of the town.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 286-287
- id: II.58.5
  kind: p
  original: Dafür sind sie freilich auch öfter gepflastert oder wenigstens mit gepflasterten Fußwegen und Rinnsteinen versehen; der Schmutz, die schlechte Beschaffenheit der Häuser und besonders der Keller bleibt aber derselbe.
  en: True, they are here oftener paved or supplied with paved sidewalks and gutters; but the filth, the bad order of the houses, and especially of the cellars, remains the same.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '287'
- id: II.59.1
  kind: p
  original: Es wird am Orte sein, hier einige allgemeine Bemerkungen über die in Manchester übliche Bauart der Arbeiterviertel zu machen.
  en: It may not be out of place to make some general observations just here as to the customary construction of working-men's quarters in Manchester.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '287'
- id: II.59.2
  kind: p
  original: Wir haben gesehen, wie in der Altstadt meist der reine Zufall über die Gruppierung der Häuser verfügte.
  en: We have seen how in the Old Town pure accident determined the grouping of the houses in general.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '287'
- id: II.59.3
  kind: p
  original: Jedes Haus ist ohne Rücksicht auf die übrigen gebaut, und die winkligen Zwischenräume der einzelnen Wohnungen werden in Ermangelung eines andern Namens Höfe (courts) genannt.
  en: Every house is built without reference to any other, and the scraps of space between them are called courts for want of another name.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '287'
- id: II.59.4
  kind: p
  original: In den etwas neueren Teilen desselben Viertels und in andren Arbeitsvierteln, die aus den ersten Zeiten der aufblühenden Industrie herrühren, finden wir ein etwas planmäßigeres Arrangement.
  en: In the somewhat newer portions of the same quarter, and in other working-men's quarters, dating from the early days of industrial activity, a somewhat more orderly arrangement may be found.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T3
    editions: '1892'
    reading: Arbeitervierteln
    base_text: … und in andren Arbeitsvierteln ‸ , die aus den …
  mew_page: '287'
- id: II.59.5
  kind: p
  original: 'Der Zwischenraum zwischen zwei Straßen wird in regelmäßigere, meist viereckige Hofe geteilt, etwa so: die von vornherein so angelegt wurden und zu denen verdeckte Gänge von den Straßen fuhren, Wenn die ganz planlose Bauart der Gesundheit der Bewohner durch Verhinderung der Ventilation schon sehr nachteilig war, so ist es diese Art, die Arbeiter in Höfe einzusperren, die nach allen Seiten von Gebäuden umschlossen sind, noch viel mehr.'
  en: The space between two streets is divided into more regular, usually square courts. These courts were built in this way from the beginning, and communicate with the streets by means of covered passages. If the totally planless construction is injurious to the health of the workers by preventing ventilation, this method of shutting them up in courts surrounded on all sides by buildings is far more so.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '287'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.59.6
  kind: p
  original: 'Die Luft kann hier platterdings nicht heraus: die Schornsteine der Häuser selbst sind, solange Feuer anhalten wird, die einzigen Abzüge für die eingesperrte Luft des Hofes.'
  en: The air simply cannot escape; the chimneys of the houses are the sole drains for the imprisoned atmosphere of the courts, and they serve the purpose only so long as fire is kept burning.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N10
  mew_page: '287'
- id: II.60.1
  kind: p
  original: Dazu kommt noch, daß die Häuser um solche Höfe meist doppelt, je zwei mit der Rückwand zusammengebaut sind, und schon das ist hinreichend, um alle gute, durchgehende Ventilation zu verhindern.
  en: Moreover, the houses surrounding such courts are usually built back to back, having the rear wall in common; and this alone suffices to prevent any sufficient through ventilation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '288'
- id: II.60.2
  kind: p
  original: Und da die Straßenpolizei sich nicht um den Zustand dieser Höfe bekümmert, da alles ruhig liegenbleibt, was hineingeworfen wird, so darf man sich nicht über den Schmutz und die Haufen von Asche und Unrat wundern, die man hier findet.
  en: And, as the police charged with care of the streets, does not trouble itself about the condition of these courts, as everything quietly lies where it is thrown, there is no cause for wonder at the filth and heaps of ashes and offal to be found here.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '288'
- id: II.60.3
  kind: p
  original: Bin ich doch in Höfen gewesen - sie liegen an Millers Street -, die mindestens einen halben Fuß tiefer lagen als die Hauptstraße und die auch nicht den mindesten Abfluß für das bei Regenwetter sich in ihnen ansammelnde Wasser hatten!
  en: I have been in courts, in Millers Street, at least half a foot below the level of the thoroughfares, and without the slightest drainage for the water that accumulates in them in rainy weather!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '288'
- id: II.61.1
  kind: p
  original: In späterer Zeit hat man eine andre Bauart angefangen, die jetzt die allgemeine ist.
  en: More recently another different method of building was adopted, and has now become general.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '288'
- id: II.61.2
  kind: p
  original: Die Arbeitercottages werden jetzt nämlich fast nie einzeln, sondern immer dutzend-, ja schockweise gebaut - ein einziger Unternehmer baut gleich eine oder ein paar Straßen.
  en: Working-men's cottages are almost never built singly, but always by the dozen or score; a single contractor building up one or two streets at a time.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '288'
- id: II.61.3
  kind: p
  original: 'Diese werden dann auf folgende Weise angelegt: Die eine Front - vgl. die Zeichnung unten - bilden Cottages ersten Ranges, die so glücklich sind, eine Hintertür und einen kleinen Hof zu besitzen, und die die höchste Miete bringen.'
  en: 'These are then arranged as follows: One front is formed of cottages of the best class, so fortunate as to possess a back door and small court, and these command the highest rent.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '288'
- id: II.61.4
  kind: p
  original: Hinter den Hofmauern dieser Cottages ist eine schmale Gasse, die Hintergasse (back street), die an beiden Enden zugebaut ist und in die entweder ein schmaler Weg oder ein bedeckter Gang von der Seite her führt.
  en: In the rear of these cottages runs a narrow alley, the back street, built up at both ends, into which either a narrow roadway or a covered passage leads from one side.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '288'
- id: II.61.5
  kind: p
  original: Die Cottages, die auf diese Gasse führen bezahlen am wenigsten Miete und sind überhaupt am meisten vernachlässigt.
  en: The cottages which face this back street command least rent, and are most neglected.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '288'
- id: II.61.6
  kind: p
  original: Sie haben die Rückwand gemeinsam mit der dritten Reihe Cottages die nach der entgegengesetzten Seite hin auf die Straße gehen und weniger Miete als die erste, dagegen mehr als die zweite Reihe tragen.
  en: These have their rear walls in common with the third row of cottages which face a second street, and command less rent than the first row and more than the second.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '288'
- id: II.61.7
  kind: p
  original: 'Die Anlage der Straßen ist also etwa so:'
  en: By this method of construction, comparatively good ventilation can be obtained for the first row of cottages, and the third row is no worse off than in the former method. The middle row, on the other hand, is at least as badly ventilated as the houses in the courts, and the back street is always in the same filthy, disgusting condition as they.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '288'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: II.62.1
  kind: p
  original: Durch diese Bauart wird zwar für die erste Reihe Cottages eine ziemlich gute Ventilation gewonnen und die der dritten Reihe wenigstens nicht gegen die der entsprechenden in der frühern Bauart verschlechtert; dagegen ist die Mittelreihe mindestens ebenso schlecht ventiliert wie die Häuser in den Höfen und die Hintergasse selbst stets in demselben schmutzigen und unansehnlichen Zustande wie jene.
  en: ''
  joined_to: II.61.7
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '288'
- id: II.62.2
  kind: p
  original: Die Unternehmer ziehen diese Bauart vor, weil sie ihnen Raum spart und Gelegenheit gibt, die besser bezahlten Arbeiter durch höhere Miete in den Cottages der ersten und dritten Reihe desto erfolgreicher auszubeuten.
  en: The contractors prefer this method because it saves them space, and furnishes the means of fleecing better paid workers through the higher rents of the cottages in the first and third rows.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 288-289
- id: II.63.1
  kind: p
  original: Diese dreierlei Formen des Cottagebaues findet man in ganz Manchester, ja in ganz Lancashire und Yorkshire wieder, oft vermengt, aber meist hinreichend geschieden, um hieraus schon auf das verhältnismäßige Alter der einzelnen Stadtteile schließen zu können.
  en: These three different forms of cottage building are found all over Manchester and throughout Lancashire and Yorkshire, often mixed up together, but usually separate enough to indicate the relative age of parts of towns.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '289'
- id: II.63.2
  kind: p
  original: Das dritte System, das der Hintergassen, ist das in dem großen Arbeiterbezirk östlich von St. George's Road, zu beiden Seiten von Oldham Road und Great Ancoats Street, entschieden vorherrschende und findet sich auch in den übrigen Arbeiterbezirken von Manchester und seinen Vorstädten am häufigsten.
  en: The third system, that of the back alleys, prevails largely in the great working-men's district east of St. George's Road and Ancoats Street, and is the one most often found in the other working-men's quarters of Manchester and its suburbs.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '289'
- id: II.64.1
  kind: p
  original: In dem erwähnten großen Bezirk, den man unter dem Namen Ancoats begreift, sind die meisten und größten Fabriken von Manchester an den Kanälen angelegt - kolossale sechs- bis siebenstöckige Gebäude, die mit ihren schlanken Rauchfängen hoch über die niedrigen Arbeitercottages emporragen.
  en: In the last-mentioned broad district included under the name Ancoats, stand the largest mills of Manchester lining the canals, colossal six and seven-storied buildings towering with their slender chimneys far above the low cottages of the workers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '289'
- id: II.64.2
  kind: p
  original: Die Bevölkerung des Bezirks sind daher hauptsächlich Fabrikarbeiter und, in den schlechtesten Straßen, Handweber.
  en: The population of the district consists, therefore, chiefly of mill hands, and in the worst streets, of hand-weavers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '289'
- id: II.64.3
  kind: p
  original: Die Straßen, die dem Zentrum der Stadt am nächsten liegen, sind die ältesten und daher die schlechtesten, doch sind sie gepflastert und mit Abzügen versehen; ich rechne hierzu die nächsten Parallelstraßen von Oldham Road und Great Ancoats Street.
  en: The streets nearest the heart of the town are the oldest, and consequently the worst; they are, however, paved, and supplied with drains. Among them I include those nearest to and parallel with Oldham Road and Great Ancoats Street.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '289'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.64.4
  kind: p
  original: Weiterhin nach Nordosten findet man manche neugebaute Straße; hier sehen die Cottages nett und reinlich aus, die Türen und Fenster sind neu und frisch angestrichen, die inneren Räume rein geweißt; die Straßen selbst sind luftiger, die leeren Bauplätze zwischen ihnen größer und häufiger.
  en: Farther to the north-east lie many newly-built-up streets; here the cottages look neat and cleanly, doors and windows are new and freshly painted, the rooms within newly whitewashed; the streets themselves are better aired, the vacant building lots between them larger and more numerous.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '289'
- id: II.64.5
  kind: p
  original: Aber das läßt sich nur von der kleineren Zahl der Wohnungen sagen; dazu kommt dann noch, daß Kellerwohnungen fast unter jeder Cottage eingerichtet, daß viele Straßen ungepflastert und ohne Abzüge sind, und vor allem, daß dieses nette Aussehen doch nur Schein ist, Schein, der nach den ersten zehn Jahren schon verschwunden ist.
  en: But this can be said of a minority of the houses only, while cellar dwellings are to be found under almost every cottage; many streets are unpaved and without sewers; and, worse than all, this neat appearance is all pretence, a pretence which vanishes within the first ten years.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '289'
- id: II.64.6
  kind: p
  original: Die Bauart der einzelnen Cottages selbst ist nämlich nicht weniger verwerflich als die Anlage der Straßen.
  en: For the construction of the cottages individually is no less to be condemned than the plan of the streets.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '289'
- id: II.64.7
  kind: p
  original: Solche Cottages sehen alle anfangs nett und solide aus, die massiven Ziegelmauern bestechen das Auge, und wenn man durch eine neugebaute Arbeiterstraße geht, ohne sich um die Hintergassen oder die Bauart der Häuser selbst näher zu bekümmern, so stimmt man in die Behauptung der liberalen Fabrikanten ein, daß nirgends die Arbeiter so gut wohnen wie in England.
  en: All such cottages look neat and substantial at first; their massive brick walls deceive the eye, and, on passing through a newly-built working-men's street, without remembering the back alleys and the construction of the houses themselves, one is inclined to agree with the assertion of the Liberal manufacturers that the working population is nowhere so well housed as in England.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '289'
- id: II.64.8
  kind: p
  original: Aber wenn man näher zusieht, so findet man, daß die Mauern dieser Cottages so dünn sind, wie es nur möglich ist, sie zu machen.
  en: But on closer examination, it becomes evident that the walls of these cottages are as thin as it is possible to make them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '289'
- id: II.64.9
  kind: p
  original: Die äußeren Mauern, die das Kellerstockwerk, das Erdgeschoß und das Dach tragen, sind höchstens einen ganzen Ziegel dick - so daß in jeder waagerechten Schicht die Ziegel mit der langen Seite aneinandergefugt werden; ich habe aber manche Cottage von derselben Höhe - einige sogar noch im Bau - gesehen, bei denen die äußern Mauern nur einen halben Ziegel dick waren und die Ziegel also nicht der Breite, sondern der Länge nach gelegt waren, so daß sie mit der schmalen Seite aneinanderstießen.
  en: The outer walls, those of the cellar, which bear the weight of the ground floor and roof, are one whole brick thick at most, the bricks lying with their long sides touching; but I have seen many a cottage of the same height, some in process of building, whose outer walls were but one-half brick thick, the bricks lying not sidewise but lengthwise, their narrow ends touching.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 289-290
- id: II.64.10
  kind: p
  original: Dies geschieht teilweise, um Material zu sparen, teilweise aber auch, weil die Bauunternehmer nie die Eigentümer des Bodens sind, sondern ihn nach englischer Sitte nur auf zwanzig, dreißig, vierzig, fünfzig oder neunundneunzig Jahre gemietet haben, nach welcher Zeit er mit allem, was darauf ist, dem ursprünglichen Besitzer wieder zufällt, ohne daß dieser für gemachte Anlagen etwas zu vergüten hätte.
  en: The object of this is to spare material, but there is also another reason for it; namely, the fact that the contractors never own the land but lease it, according to the English custom, for twenty, thirty, forty, fifty, or ninety-nine years, at the expiration of which time it falls, with everything upon it, back into the possession of the original holder, who pays nothing in return for improvements upon it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '290'
- id: II.64.11
  kind: p
  original: Die Anlagen werden also vom Pächter darauf berechnet, daß sie nach Ablauf der kontraktlichen Zeit so wertlos wie möglich sind; und da solche Cottages oft nur zwanzig oder dreißig Jahre vor diesem Zeitpunkte errichtet werden, so ist es leicht zu begreifen, daß die Unternehmer nicht zuviel darauf verwenden werden.
  en: The improvements are therefore so calculated by the lessee as to be worth as little as possible at the expiration of the stipulated term. And as such cottages are often built but twenty or thirty years before the expiration of the term, it may easily be imagined that the contractors make no unnecessary expenditures upon them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '290'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.64.12
  kind: p
  original: Dazu kommt noch, daß diese Unternehmer, meist Maurer und Zimmerleute oder Fabrikanten, teils um den Mietertrag nicht zu verringern, teils wegen herannahenden Rückfalls des Bauplatzes, wenig oder gar nichts auf Reparaturen verwenden, daß wegen Handelskrisen und der darauffolgenden Brotlosigkeit oft ganze Straßen leerstehen und daß infolge hiervon die Cottages sehr rasch verfallen und in unbewohnbaren Zustand geraten.
  en: Moreover, these contractors, usually carpenters and builders, or manufacturers, spend little or nothing in repairs, partly to avoid diminishing their rent receipts, and partly in view of the approaching surrender of the improvement to the landowner; while in consequence of commercial crises and the loss of work that follows them, whole streets often stand empty, the cottages falling rapidly into ruin and uninhabitableness.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '290'
- id: II.64.13
  kind: p
  original: Man rechnet wirklich allgemein, daß Arbeiterwohnungen durchschnittlich nur vierzig Jahre bewohnbar bleiben; das klingt wunderbar genug, wenn man die schönen, massiven Mauern neuerbauter Cottages dabei sieht, die eine Dauer von ein paar Jahrhunderten zu versprechen scheinen - aber es ist dennoch so, die Knickerei der ursprünglichen Anlage, die Vernachlässigung aller Reparaturen, das häufige Leerstehen, der fortwährende schnelle Wechsel der Bewohner und dazu die Verwüstungen, die die Einwohner während der letzten zehn Jahre der Bewohnbarkeit, meist Irländer, anrichten, indem sie das Holzwerk oft genug aufbrechen und zur Heizung gebrauchen - alles das macht diese Cottages nach vierzig Jahren zu Ruinen.
  en: It is calculated in general that working-men's cottages last only forty years on the average. This sounds strangely enough when one sees the beautiful, massive walls of newly-built ones, which seem to give promise of lasting a couple of centuries; but the fact remains that the niggardliness of the original expenditure, the neglect of all repairs, the frequent periods of emptiness, the constant change of inhabitants, and the destruction carried on by the dwellers during the final ten years, usually Irish families, who do not hesitate to use the wooden portions for fire-wood--all this, taken together, accomplishes the complete ruin of the cottages by the end of forty years.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '290'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.64.14
  kind: p
  original: Daher kommt es denn auch, daß der Distrikt von Ancoats, der erst seit dem Aufblühen der Industrie, ja meist erst in diesem Jahrhundert erbaut wurde, dennoch eine Menge alter und verfallender Häuser zählt, ja daß die größere Zahl der Häuser schon jetzt in dem letzten Stadium der Bewohnbarkeit sich befindet.
  en: Hence it comes that Ancoats, built chiefly since the sudden growth of manufacture, chiefly indeed within the present century, contains a vast number of ruinous houses, most of them being, in fact, in the last stages of inhabitableness.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '290'
- id: II.64.15
  kind: p
  original: Ich will nicht davon reden, wieviel Kapital auf diese Weise verschwendet wird, mit wiewenig mehr ursprünglicher Anlage und späterer Reparatur dieser ganze Bezirk lange Jahre hindurch reinlich, anständig und wohnlich gehalten werden könnte - mich geht hier nur die Lage der Häuser und ihrer Bewohner an, und da muß allerdings gesagt werden, daß es kein schädlicheres und demoralisierendes System, die Arbeiter unterzubringen, gibt, als gerade dieses.
  en: I will not dwell upon the amount of capital thus wasted, the small additional expenditure upon the original improvement and upon repairs which would suffice to keep this whole district clean, decent, and inhabitable for years together. I have to deal here with the state of the houses and their inhabitants, and it must be admitted that no more injurious and demoralising method of housing the workers has yet been discovered than precisely this.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 290-291
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.64.16
  kind: p
  original: Der Arbeiter ist gezwungen, solche verkommene Cottages zu bewohnen, weil er keine besseren bezahlen kann oder weil keine besseren in der Nähe seiner Fabrik liegen, vielleicht auch gar, weil sie dem Fabrikanten gehören und dieser ihn nur dann in Arbeit nimmt, wenn er eine solche Wohnung bezieht.
  en: The working-man is constrained to occupy such ruinous dwellings because he cannot pay for others, and because there are no others in the vicinity of his mill; perhaps, too, because they belong to the employer, who engages him only on condition of his taking such a cottage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '291'
- id: II.64.17
  kind: p
  original: Natürlich wird es mit den vierzig Jahren so genau nicht gehalten, denn wenn die Wohnungen in einem stark bebauten Stadtteil liegen und also bei teurer Grundpacht viel Aussicht da ist, stets Mieter für jene zu finden, tun die Unternehmer auch wohl etwas, um sie über vierzig Jahre hinaus einigermaßen in bewohnbarem Zustande zu erhalten; aber auch gewiß nicht mehr als das Allernötigste, und diese reparierten Wohnungen sind dann gerade die allerschlechtesten.
  en: The calculation with reference to the forty years' duration of the cottage is, of course, not always perfectly strict; for, if the dwellings are in a thickly-built-up portion of the town, and there is a good prospect of finding steady occupants for them, while the ground rent is high, the contractors do a little something to keep the cottages inhabitable after the expiration of the forty years.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '291'
- id: II.64.18
  kind: p
  original: Zuweilen, bei drohenden Epidemien, wird das sonst sehr schläfrige Gewissen der Gesundheitspolizei etwas aufgeregt, und dann unternimmt sie Streifzüge in die Arbeiterdistrikte, schließt ganze Reihen von Kellern und Cottages, wie dies z.B. mit mehreren Gassen in der Nähe von Oldham Road geschehen ist; aber das dauert nicht lange, die geächteten Wohnungen finden bald wieder Insassen, und die Eigentümer stehen sich besser dabei, wenn sie sich wieder Mieter suchen - man weiß ja, daß die Gesundheitspolizei so bald nicht wiederkommt!
  en: 'They never do anything more, however, than is absolutely unavoidable, and the dwellings so repaired are the worst of all. Occasionally when an epidemic threatens, the otherwise sleepy conscience of the sanitary police is a little stirred, raids are made into the working-men''s districts, whole rows of cellars and cottages are closed, as happened in the case of several lanes near Oldham Road; but this does not last long: the condemned cottages soon find occupants again, the owners are much better off by letting them, and the sanitary police won''t come again so soon.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '291'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.65.1
  kind: p
  original: Diese östliche und nordöstliche Seite von Manchester ist die einzige, an welcher sich die Bourgeoisie nicht angebaut hat - aus dem Grunde, weil der hier zehn oder elf Monate im Jahr herrschende West- und Südwestwind den Rauch aller Fabriken - und der ist nicht gering - stets nach dieser Seite hinübertreibt.
  en: These east and north-east sides of Manchester are the only ones on which the bourgeoisie has not built, because ten or eleven months of the year the west and south-west wind drives the smoke of all the factories hither, and that the working-people alone may breathe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '291'
- id: II.65.2
  kind: p
  original: Den können die Arbeiter allein einatmen.
  en: Southward from Great Ancoats Street, lies a great, straggling, working-men's quarter, a hilly, barren stretch of land, occupied by detached, irregularly built rows of houses or squares, between these, empty building lots, uneven, clayey, without grass and scarcely passable in wet weather.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '291'
  align: '3:1'
  review: true
  review_reason: 3 de sentence(s) matched to 1 en sentence(s)
- id: II.66.1
  kind: p
  original: Südlich von Great Ancoats Street liegt ein großer halbbebauter Arbeiterbezirk - ein hügeliger, nackter Strich Landes, mit einzelnen unordentlich angelegten Häuserreihen oder Karrees besetzt.
  en: ''
  joined_to: II.65.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '291'
- id: II.66.2
  kind: p
  original: Dazwischen leere Bauplätze, uneben, lehmig, ohne Gras und daher bei feuchtem Wetter kaum zu passieren.
  en: ''
  joined_to: II.65.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '291'
- id: II.66.3
  kind: p
  original: Die Cottages sind alle schmutzig und alt, liegen oft in tiefen Löchern und erinnern überhaupt an die Neustadt.
  en: The cottages are all filthy and old, and recall the New Town to mind.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '291'
- id: II.66.4
  kind: p
  original: Die von der Birminghamer Eisenbahn durchschnittene Strecke ist die am dichtesten bebaute, also auch die schlechteste.
  en: The stretch cut through by the Birmingham railway is the most thickly built-up and the worst.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '291'
- id: II.66.5
  kind: p
  original: Hier fließt in unzähligen Krümmungen der Medlock durch ein Tal, das stellenweise mit dem des Irk auf gleicher Stufe steht.
  en: Here flows the Medlock with countless windings through a valley, which is, in places, on a level with the valley of the Irk.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '291'
- id: II.66.6
  kind: p
  original: Zu beiden Seiten des wieder pechschwarzen, stagnierenden und stinkenden Flusses, von seinem Eintritt in die Stadt bis zu seiner Vereinigung mit dem Irwell, zieht sich ein breiter Gürtel von Fabriken und Arbeiterwohnungen, welche letzteren alle in dem schlechtesten Zustande sind.
  en: Along both sides of the stream, which is coal black, stagnant and foul, stretches a broad belt of factories and working-men's dwellings, the latter all in the worst condition.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '291'
- id: II.66.7
  kind: p
  original: Das Ufer ist meist abschüssig und bis in den Fluß hinein bebaut, gerade wie wir es am Irk gesehen haben, und die Anlage der Häuser und Straßen ist gleich schlecht, ob sie auf der Seite von Manchester oder der von Ardwick, Chorlton oder Hulme angelegt sind.
  en: The bank is chiefly declivitous and is built over to the water's edge, just as we saw along the Irk; while the houses are equally bad, whether built on the Manchester side or in Ardwick, Chorlton, or Hulme.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 291-292
- id: II.66.8
  kind: p
  original: Der abscheulichste Fleck - wenn ich alle die einzelnen Flecke detaillieren wollte, würde ich nicht zu Ende kommen - liegt aber auf der Manchester-Seite, gleich südwestlich von Oxford Road und heißt Klein-Irland (Little Ireland).
  en: But the most horrible spot (if I should describe all the separate spots in detail I should never come to the end) lies on the Manchester side, immediately south-west of Oxford Road, and is known as Little Ireland.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '292'
- id: II.66.9
  kind: p
  original: In einem ziemlich tiefen Loche, das in einem Halbkreis vom Medlock und an allen vier Seiten von hohen Fabriken, hohen bebauten Ufern oder Aufschüttungen umgeben ist, liegen in zwei Gruppen etwa 200 Cottages, meist mit gemeinschaftlichen Rückwänden für je zwei Wohnungen, worin zusammen an 4 000 Menschen, fast lauter Irländer, wohnen.
  en: In a rather deep hole, in a curve of the Medlock and surrounded on all four sides by tall factories and high embankments, covered with buildings, stand two groups of about two hundred cottages, built chiefly back to back, in which live about four thousand human beings, most of them Irish.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '292'
- id: II.66.10
  kind: p
  original: Die Cottages sind alt, schmutzig und von der kleinsten Sorte, die Straßen uneben, holperig und zum Teil ungepflastert und ohne Abflüsse; eine Unmasse Unrat, Abfall und ekelhafter Kot liegt zwischen stehenden Lachen überall herum, die Atmosphäre ist durch die Ausdünstungen derselben verpestet und durch den Rauch von einem Dutzend Fabrikschornsteinen verfinstert und schwer gemacht - eine Menge zerlumpter Kinder und Weiber treibt sich hier umher, ebenso schmutzig wie die Schweine, die sich auf den Aschenhaufen und in den Pfützen wohl sein lassen - kurz, das ganze Nest gewährt einen so unangenehmen, so zurückstoßenden Anblick wie kaum die schlechtesten Höfe am Irk.
  en: The cottages are old, dirty, and of the smallest sort, the streets uneven, fallen into ruts and in part without drains or pavement; masses of refuse, offal and sickening filth lie among standing pools in all directions; the atmosphere is poisoned by the effluvia from these, and laden and darkened by the smoke of a dozen tall factory chimneys. A horde of ragged women and children swarm about here, as filthy as the swine that thrive upon the garbage heaps and in the puddles. In short, the whole rookery furnishes such a hateful and repulsive spectacle as can hardly be equalled in the worst court on the Irk.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '292'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.66.11
  kind: p
  original: Das Geschlecht, das in diesen verfallenden Cottages, hinter den zerbrochenen und mit Ölleinwand verklebten Fenstern, den rissigen Türen und abfaulenden Pfosten oder gar in den finstern nassen Kellern, zwischen diesem grenzenlosen Schmutz und Gestank in dieser wie absichtlich eingesperrten Atmosphäre lebt - das Geschlecht muß wirklich auf der niedrigsten Stufe der Menschheit stehn - das ist der Eindruck und die Schlußfolgerung, die einem bloß die Außenseite dieses Bezirks aufdrängt.
  en: The race that lives in these ruinous cottages, behind broken windows, mended with oilskin, sprung doors, and rotten door-posts, or in dark, wet cellars, in measureless filth and stench, in this atmosphere penned in as if with a purpose, this race must really have reached the lowest stage of humanity. This is the impression and the line of thought which the exterior of this district forces upon the beholder.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '292'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.66.12
  kind: p
  original: Aber was soll man sagen, wenn man hört, daß in jedem dieser Häuschen, das allerhöchstens zwei Zimmer und den Dachraum, vielleicht noch einen Keller hat, durchschnittlich zwanzig Menschen wohnen, daß in dem ganzen Bezirk nur auf etwa 120 Menschen ein - natürlich meist ganz unzugänglicher - Abtritt kommt und daß trotz alles Predigens der Ärzte, trotz der Aufregung, in die zur Cholerazeit die Gesundheitspolizei über den Zustand von Klein-Irland geriet, dennoch alles heute im Jahr der Gnade 1844 fast in demselben Zustande ist wie 1831?
  en: But what must one think when he hears that in each of these pens, containing at most two rooms, a garret and perhaps a cellar, on the average twenty human beings live; that in the whole region, for each one hundred and twenty persons, one usually inaccessible privy is provided; and that in spite of all the preachings of the physicians, in spite of the excitement into which the cholera epidemic plunged the sanitary police by reason of the condition of Little Ireland, in spite of everything, in this year of grace 1844, it is in almost the same state as in 1831!
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N11
  mew_page: '292'
- id: II.66.13
  kind: p
  original: Dr. Kay erzählt, daß nicht nur die Keller, sondern sogar die Erdgeschosse aller Häuser in diesem Bezirk feucht seien; daß früher eine Anzahl Keller mit Erde aufgefüllt worden, allmählich aber wieder ausgeleert und jetzt von Irländern bewohnt würden - daß in einem Keller das Wasser - da der Boden des Kellers tiefer lag als der Fluß - fortwährend aus einem mit Lehm verstopften Versenkloch herausgequollen sei, so daß der Bewohner, ein Handweber, jeden Morgen seinen Keiler habe trocken schöpfen und das Wasser auf die Straße gießen müssen!
  en: Dr. Kay asserts that not only the cellars but the first floors of all the houses in this district are damp; that a number of cellars once filled up with earth have now been emptied and are occupied once more by Irish people; that in one cellar the water constantly wells up through a hole stopped with clay, the cellar lying below the river level, so that its occupant, a hand-loom weaver, had to bale out the water from his dwelling every morning and pour it into the street!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 292-293
- id: II.67.1
  kind: p
  original: Weiter abwärts liegt, auf der linken Seite des Medlock, Hulme, das eigentlich nur ein großes Arbeiterviertel ist und dessen Zustand fast ganz mit dem des Bezirks von Ancoats übereinstimmt.
  en: Farther down, on the left side of the Medlock, lies Hulme, which, properly speaking, is one great working-people's district, the condition of which coincides almost exactly with that of Ancoats; the more thickly built-up regions chiefly bad and approaching ruin, the less populous of more modern structure, but generally sunk in filth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '293'
  align: '3:1'
  review: true
  review_reason: 3 de sentence(s) matched to 1 en sentence(s)
- id: II.67.2
  kind: p
  original: Die dichter bebauten Bezirke meist schlecht und dem Verfall nahend, die weniger bevölkerten von neuerer Bauart, luftiger, aber meist im Kot versunken.
  en: ''
  joined_to: II.67.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '293'
- id: II.67.3
  kind: p
  original: Feuchte Lage der Cottages allgemein, ebenso die Bauart mit Hintergassen und Kellerwohnungen.
  en: ''
  joined_to: II.67.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '293'
- id: II.67.4
  kind: p
  original: Auf der gegenüberliegenden Seite des Medlock, im eigentlichen Manchester, liegt ein zweiter großer Arbeiterdistrikt, der sich zu beiden Seiten von Deansgate bis an das kommerzielle Viertel erstreckt und teilweise der Altstadt nichts nachgibt.
  en: On the other side of the Medlock, in Manchester proper, lies a second great working-men's district which stretches on both sides of Deansgate as far as the business quarter, and in certain parts rivals the Old Town.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '293'
- id: II.67.5
  kind: p
  original: Namentlich in der unmittelbaren Nähe des kommerziellen Viertels, zwischen Bridge Street und Quay Street, Princess Street und Peter Street, übertrifft die Gedrängtheit der Bauart stellenweise die engsten Höfe der Altstadt.
  en: Especially in the immediate vicinity of the business quarter, between Bridge and Quay Streets, Princess and Peter Streets, the crowded construction exceeds in places the narrowest courts of the Old Town.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '293'
- id: II.67.6
  kind: p
  original: Hier findet man lange schmale Gassen, zwischen denen enge, winklige Höfe und Passagen sich befinden, deren Aus- und Eingänge so unordentlich angelegt sind, daß man in diesem Labyrinth alle Augenblicke in einem Sack festrennt oder an der ganz verkehrten Stelle herauskommt, wenn man nicht jede Passage und jeden Hof genau kennt.
  en: Here are long, narrow lanes between which run contracted, crooked courts and passages, the entrances to which are so irregular that the explorer is caught in a blind alley at every few steps, or comes out where he least expects to, unless he knows every court and every alley exactly and separately.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '293'
- id: II.67.7
  kind: p
  original: In diesen engen, verfallenen und schmutzigen Gegenden wohnt nach Dr. Kay die demoralisierteste Klasse von ganz Manchester, deren Handwerk Diebstahl oder Prostitution ist, und dem Anscheine nach hat er, auch jetzt noch, darin recht.
  en: According to Dr. Kay, the most demoralised class of all Manchester lived in these ruinous and filthy districts, people whose occupations are thieving and prostitution; and, to all appearance, his assertion is still true at the present moment.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '293'
- id: II.67.8
  kind: p
  original: Als auch hier die Gesundheitspolizei 1831 ihren Streifzug machte, fand sie in diesem Bezirk die Unreinlichkeit ebenso groß wie am Irk oder in Little Ireland (daß es damit jetzt noch nicht viel besser steht, kann ich bezeugen) und unter anderem in Parliament Street für dreihundertundachtzig Menschen und in Parliament Passage für dreißig starkbevölkerte Häuser nur einen einzigen Abtritt.
  en: When the sanitary police made its expedition hither in 1831, it found the uncleanness as great as in Little Ireland or along the Irk (that it is not much better to-day, I can testify); and among other items, they found in Parliament Street for three hundred and eighty persons, and in Parliament Passage for thirty thickly populated houses, but a single privy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '293'
- id: II.68.1
  kind: p
  original: Gehen wir über den Irwell nach Salford, so finden wir auf einer von diesem Flusse gebildeten Halbinsel eine Stadt, die achtzigtausend Einwohner zählt und eigentlich nur ein großer, von einer einzigen breiten Straße durchschnittener Arbeiterbezirk ist.
  en: If we cross the Irwell to Salford, we find on a peninsula formed by the river, a town of eighty thousand inhabitants, which, properly speaking, is one large working-men's quarter, penetrated by a single wide avenue.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '293'
- id: II.68.2
  kind: p
  original: Salford, früher bedeutender als Manchester, war damals der Hauptort des umliegenden Distrikts und gibt ihm noch den Namen (Salford Hundred).
  en: Salford, once more important than Manchester, was then the leading town of the surrounding district to which it still gives its name, Salford Hundred.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '293'
- id: II.68.3
  kind: p
  original: Daher kommt es, daß sich auch hier ein ziemlich alter und folglich jetzt sehr ungesunder, schmutziger und verfallener Bezirk vorfindet, der der alten Kirche von Manchester gegenüberliegt und in ebenso schlechtem Zustande ist wie die Altstadt auf der andern Seite des Irwell.
  en: Hence it is that an old and therefore very unwholesome, dirty, and ruinous locality is to be found here, lying opposite the Old Church of Manchester, and in as bad a condition as the Old Town on the other side of the Irwell.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '293'
- id: II.68.4
  kind: p
  original: Weiter vom Flusse ab liegt ein neuerer Distrikt, der aber ebenfalls schon über vierzig Jahre und daher baufällig genug ist.
  en: Farther away from the river lies the newer portion, which is, however, already beyond the limit of its forty years of cottage life, and therefore ruinous enough.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 293-294
- id: II.68.5
  kind: p
  original: Ganz Salford ist in Höfen oder schmalen Gassen gebaut, die so eng sind, daß sie mich an die engsten erinnerten, die ich gesehen habe, nämlich an die schmalen Gäßchen von Genua.
  en: All Salford is built in courts or narrow lanes, so narrow, that they remind me of the narrowest I have ever seen, the little lanes of Genoa.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '294'
- id: II.68.6
  kind: p
  original: In dieser Beziehung ist die durchschnittliche Bauart von Salford noch bedeutend schlechter als die von Manchester, und ebenso ist es mit der Reinlichkeit.
  en: The average construction of Salford is in this respect much worse than that of Manchester, and so, too, in respect to cleanliness.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '294'
- id: II.68.7
  kind: p
  original: Wenn in Manchester die Polizei wenigstens von Zeit zu Zeit - alle sechs bis zehn Jahre einmal - sich in die Arbeiterbezirke begab, die schlechtesten Wohnungen schloß, die schmutzigsten Stellen dieses Augiasstalles fegen ließ, so scheint sie in Salford gar nichts getan zu haben.
  en: If, in Manchester, the police, from time to time, every six or ten years, makes a raid upon the working-people's districts, closes the worst dwellings, and causes the filthiest spots in these Augean stables to be cleansed, in Salford it seems to have done absolutely nothing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '294'
- id: II.68.8
  kind: p
  original: Die engen Seitengassen und Höfe von Chapel Street, Greengate und Gravel Lane sind gewiß seit ihrer Erbauung nicht gereinigt worden - jetzt geht die Liverpooler Eisenbahn auf einem hohen Viadukt mitten dadurch und hat manchen der schmutzigsten Winkel weggenommen, aber was hilft das?
  en: The narrow side lanes and courts of Chapel Street, Greengate, and Gravel Lane have certainly never been cleansed since they were built. Of late, the Liverpool railway has been carried through the middle of them, over a high viaduct, and has abolished many of the filthiest nooks; but what does that avail?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '294'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.68.9
  kind: p
  original: Wenn man über diesen Viadukt fährt, so sieht man noch Schmutz und Elend genug von oben herab, und wenn man sich die Mühe nimmt, diese Gäßchen zu durchstreichen, durch die offenen Türen und Fenster in die Keller und Häuser hineinzublicken, so kann man sich jeden Augenblick überzeugen, daß die Arbeiter von Salford in Wohnungen leben, in denen Reinlichkeit und Bequemlichkeit unmöglich sind.
  en: Whoever passes over this viaduct and looks down, sees filth and wretchedness enough; and, if any one takes the trouble to pass through these lanes, and glance through the open doors and windows into the houses and cellars, he can convince himself afresh with every step that the workers of Salford live in dwellings in which cleanliness and comfort are impossible.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '294'
- id: II.68.10
  kind: p
  original: Ganz dasselbe finden wir in den entfernter gelegenen Strichen von Salford, in Islington, an Regent Road und hinter der Boltoner Eisenbahn.
  en: Exactly the same state of affairs is found in the more distant regions of Salford, in Islington, along Regent Road, and back of the Bolton railway.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '294'
- id: II.68.11
  kind: p
  original: Die Arbeiterwohnungen zwischen Oldfield Road und Cross Lane, wo sich zu beiden Seiten von Hope Street eine Menge von Höfen und Gassen im schlechtesten Zustande finden, wetteifern an Schmutz und gedrängter Einwohnerschaft mit der Altstadt von Manchester; in dieser Gegend fand ich einen Mann, der dem Aussehen nach sechzig Jahre alt war, in einem Kuhstall wohnend - er hatte sich den fensterlosen, weder gedielten noch gepflasterten viereckigen Kasten mit einer Art Rauchfang versehen, eine Bettstelle hineingebracht und wohnte darin, obwohl der Regen durch das schlechte, verfallene Dach troff.
  en: The working-men's dwellings between Oldfield Road and Cross Lane, where a mass of courts and alleys are to be found in the worst possible state, vie with the dwellings of the Old Town in filth and overcrowding. In this district I found a man, apparently about sixty years old, living in a cow stable. He had constructed a sort of chimney for his square pen, which had neither windows, floor, nor ceiling, had obtained a bedstead and lived there, though the rain dripped through his rotten roof.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '294'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.68.12
  kind: p
  original: Der Mann war zu alt und zu schwach zur regelmäßigen Arbeit und ernährte sich durch Mistfahren usw. mit seiner Schubkarre; die Mistpfütze stieß dicht an seinen Stall.
  en: This man was too old and weak for regular work, and supported himself by removing manure with a hand-cart; the dung-heaps lay next door to his palace!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '294'
- id: II.69.1
  kind: p
  original: Das sind die verschiedenen Arbeiterbezirke von Manchester, wie ich sie selbst während zwanzig Monaten zu beobachten Gelegenheit hatte.
  en: Such are the various working-people's quarters of Manchester as I had occasion to observe them personally during twenty months.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '294'
- id: II.69.2
  kind: p
  original: Fassen wir das Resultat unsrer Wanderung durch diese Gegenden zusammen, so müssen wir sagen, daß dreihundertfünfzigtausend Arbeiter von Manchester und seinen Vorstädten fast alle in schlechten, feuchten und schmutzigen Cottages wohnen, daß die Straßen, die sie einnehmen, meist in dem schlechtesten und unreinsten Zustande sich befinden und ohne alle Rücksicht auf Ventilation, bloß mit Rücksicht auf den dem Erbauer zufließenden Gewinn angelegt worden sind - mit einem Wort, daß in den Arbeiterwohnungen von Manchester keine Reinlichkeit, keine Bequemlichkeit, also auch keine Häuslichkeit möglich ist; daß in diesen Wohnungen nur eine entmenschte, degradierte, intellektuell und moralisch zur Bestialität herabgewürdigte, körperlich kränkliche Rasse sich behaglich und heimisch fühlen kann.
  en: If we briefly formulate the result of our wanderings, we must admit that 350,000 working-people of Manchester and its environs live, almost all of them, in wretched, damp, filthy cottages, that the streets which surround them are usually in the most miserable and filthy condition, laid out without the slightest reference to ventilation, with reference solely to the profit secured by the contractor. In a word, we must confess that in the working-men's dwellings of Manchester, no cleanliness, no convenience, and consequently no comfortable family life is possible; that in such dwellings only a physically degenerate race, robbed of all humanity, degraded, reduced morally and physically to bestiality, could feel comfortable and at home.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 294-295
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.69.3
  kind: p
  original: 'Und ich bin nicht der einzige, der das behauptet; wir haben gesehen, daß Dr. Kay ganz dieselbe Beschreibung gibt, und zum Überfluß will ich noch die Worte eines Liberalen, einer anerkannten und sehr geschätzten Autorität der Fabrikanten, eines fanatischen Gegners aller selbständigen Arbeiterbewegungen, die Worte des Herrn Senior hersetzen:'
  en: 'And I am not alone in making this assertion. We have seen that Dr. Kay gives precisely the same description; and, though it is superfluous, I quote further the words of a Liberal, recognised and highly valued as an authority by the manufacturers, and a fanatical opponent of all independent movements of the workers:'
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N12
  mew_page: '295'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.70.1
  kind: p
  original: '"Als ich durch die Wohnungen der Fabrikarbeiter in der irischen Stadt, Ancoats und Klein-Irland ging, erstaunte ich nur darüber, daß es möglich sei, in solchen Wohnungen erträgliche Gesundheit zu bewahren.'
  en: '"As I passed through the dwellings of the mill hands in Irish Town, Ancoats, and Little Ireland, I was only amazed that it is possible to maintain a reasonable state of health in such homes.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: II.70.2
  kind: p
  original: Diese Städte - denn das sind sie in Ausdehnung und Einwohnerzahl - sind errichtet worden mit der äußersten Rücksichtslosigkeit gegen alles, ausgenommen unmittelbaren Nutzen für die spekulierenden Erbauer.
  en: These towns, for in extent and number of inhabitants they are towns, have been erected with the utmost disregard of everything except the immediate advantage of the speculating builder.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: II.70.3
  kind: p
  original: Ein Zimmermann und ein Maurer vereinigen sich, eine Reihe Bauplätze zu kaufen" (d.h. auf eine Anzahl Jahre zu mieten) "und diese mit sogenannten Häusern zu bedecken; an einer Stelle fanden wir eine ganze Straße, die dem Laufe eines Grabens folgte, damit man ohne die Kosten der Ausgrabung tiefere Keller bekam - Keller, nicht zu Rumpelkammern und Niederlagen, sondern zu Wohnungen für Menschen.
  en: A carpenter and builder unite to buy a series of building sites (i.e., they lease them for a number of years), and cover them with so-called houses. In one place we found a whole street following the course of a ditch, because in this way deeper cellars could be secured without the cost of digging, cellars not for storing wares or rubbish, but for dwellings for human beings.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.70.4
  kind: p
  original: Kein einziges Haus in dieser Straße entging der Cholera.
  en: Not one house of this street escaped the cholera.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: II.70.5
  kind: p
  original: Und im allgemeinen sind die Straßen in diesen Vorstädten ungepflastert, mit einem Düngerhaufen oder einer Lache in der Mitte, die Häuser mit der Rückwand zusammengebaut und ohne Ventilation oder Trockenlegung, und ganze Familien sind auf den Winkel eines Kellers oder einer Dachstube beschränkt."
  en: In general, the streets of these suburbs are unpaved, with a dung-heap or ditch in the middle; the houses are built back to back, without ventilation or drainage, and whole families are limited to a corner of a cellar or a garret."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: II.71.1
  kind: p
  original: Ich erwähnte schon oben einer ungewöhnlichen Tätigkeit, die die Gesundheitspolizei zur Cholerazeit in Manchester entwickelte.
  en: I have already referred to the unusual activity which the sanitary police manifested during the cholera visitation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: II.71.2
  kind: p
  original: Als nämlich diese Epidemie herannahte, befiel ein allgemeiner Schrecken die Bourgeoisie dieser Stadt; man erinnerte sich auf einmal der ungesunden Wohnungen der Armut und zitterte bei der Gewißheit, daß jedes dieser schlechten Viertel ein Zentrum für die Seuche bilden würde, von wo aus sie ihre Verwüstungen nach allen Richtungen in die Wohnsitze der besitzenden Klasse ausbreite.
  en: When the epidemic was approaching, a universal terror seized the bourgeoisie of the city. People remembered the unwholesome dwellings of the poor, and trembled before the certainty that each of these slums would become a centre for the plague, whence it would spread desolation in all directions through the houses of the propertied class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.71.3
  kind: p
  original: Sogleich wurde eine Gesundheitskommission ernannt, um diese Bezirke zu untersuchen und über ihren Zustand genau an den Stadtrat zu berichten.
  en: A Health Commission was appointed at once to investigate these districts, and report upon their condition to the Town Council.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '295'
- id: II.71.4
  kind: p
  original: Dr. Kay, selbst Mitglied der Kommission, die jeden einzelnen Polizeidistrikt, mit Ausnahme des elften, speziell besichtigte, gibt aus ihrem Bericht einzelne Auszüge.
  en: 'Dr. Kay, himself a member of this Commission, who visited in person every separate police district except one, the eleventh, quotes extracts from their reports: There were inspected, in all, 6,951 houses--naturally in Manchester proper alone, Salford and the other suburbs being excluded. Of these, 6,565 urgently needed whitewashing within; 960 were out of repair; 939 had insufficient drains; 1,435 were damp; 452 were badly ventilated; 2,221 were without privies.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 295-296
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: II.71.5
  kind: p
  original: Es wurden im ganzen 6 951 Häuser - natürlich nur im eigentlichen Manchester, mit Ausschluß von Salford und den übrigen Vorstädten - inspiziert; davon hatten 2 565 dringend einen inneren Kalkanstrich nötig, an 960 waren notwendige Reparaturen vernachlässigt (were out of repair), 939 waren ohne hinreichende Abflüsse, 1 435 waren feucht, 452 schlecht ventiliert, 2 221 ohne Abtritte.
  en: ''
  joined_to: II.71.4
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '296'
- id: II.71.6
  kind: p
  original: Von den inspizierten 687 Straßen waren 248 ungepflastert, 53 nur teilweise gepflastert, 112 schlecht ventiliert, 352 enthielten stehende Pfützen, Haufen von Unrat, Abfall und dergleichen.
  en: Of the 687 streets inspected, 248 were unpaved, 53 but partially paved, 112 ill-ventilated, 352 containing standing pools, heaps of debris, refuse, etc. To cleanse such an Augean stable before the arrival of the cholera was, of course, out of the question.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '296'
- id: II.71.7
  kind: p
  original: Natürlich einen solchen Augiasstall vor der Ankunft der Cholera zu fegen war platterdings unmöglich; daher begnügte man sich mit der Reinigung einiger der schlechtesten Winkel und ließ sonst alles beim alten - es versteht sich, daß an den gereinigten Stellen, wie Klein-Irland beweist, nach ein paar Monaten die alte Unfläterei wiederhergestellt war.
  en: A few of the worst nooks were therefore cleansed, and everything else left as before. In the cleansed spots, as Little Ireland proves, the old filthy condition was naturally restored in a couple of months.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '296'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.71.8
  kind: p
  original: 'Und über den inneren Zustand dieser Wohnungen berichtet dieselbe Kommission Ähnliches, wie wir von London, Edinburgh und anderen Städten hörten:'
  en: As to the internal condition of these houses, the same Commission reports a state of things similar to that which we have already met with in London, Edinburgh, and other cities.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '296'
- id: II.72.1
  kind: p
  original: '"Oft ist eine ganze irische Familie in einem Bett zusammengedrängt; oft verbirgt ein Haufen schmutziges Stroh und Decken von altem Sackleinen alle in einem ununterscheidbaren Haufen, wo jeder durch Mangel, Stumpfsinn und Liederlichkeit gleich erniedrigt ist.'
  en: It often happens that a whole Irish family is crowded into one bed; often a heap of filthy straw or quilts of old sacking cover all in an indiscriminate heap, where all alike are degraded by want, stolidity, and wretchedness.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '296'
- id: II.72.2
  kind: p
  original: Oft fanden die Inspektoren in einem Hause mit zwei Zimmern zwei Familien; in dem einen Zimmer schliefen sie alle, das andre war gemeinsames Eßzimmer und Küche; und oft wohnte mehr als eine Familie in einem einstubigen feuchten Keller, in dessen pestilenzialischer Atmosphäre zwölf bis sechzehn Menschen zusammengedrängt waren; zu diesen und anderen Quellen von Krankheiten kamen noch, daß Schweine darin gehalten wurden und andere Ekelhaftigkeiten der empörendsten Art sich vorfanden."
  en: Often the inspectors found, in a single house, two families in two rooms. All slept in one, and used the other as a kitchen and dining-room in common. Often more than one family lived in a single damp cellar, in whose pestilent atmosphere twelve to sixteen persons were crowded together. To these and other sources of disease must be added that pigs were kept, and other disgusting things of the most revolting kind were found.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N13
  mew_page: '296'
  align: '1:4'
  review: true
  review_reason: 1 de sentence(s) matched to 4 en sentence(s)
- id: II.73.1
  kind: p
  original: Wir müssen hinzufügen, daß viele Familien, die selbst nur ein Zimmer haben, darin Kostgänger und Schlafgenossen für eine Entschädigung aufnehmen, daß solche Kostgänger von beiden Geschlechtern nicht selten sogar mit dem Ehepaar in einem und demselben Bette schlafen und daß z.B. der eine Fall, daß ein Mann, seine Frau und seine erwachsene Schwiegerin in einem Bette schliefen, nach dem "Bericht über den Gesundheitszustand der Arbeiterklasse", in Manchester sechs- oder mehrmal vorgefunden wurde.
  en: We must add that many families, who had but one room for themselves, receive boarders and lodgers in it, that such lodgers of both sexes by no means rarely sleep in the same bed with the married couple; and that the single case of a man and his wife and his adult sister-in-law sleeping in one bed was found, according to the "Report concerning the sanitary condition of the working-class," six times repeated in Manchester.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '296'
- id: II.73.2
  kind: p
  original: Die gemeinen Logierhäuser sind auch hier sehr zahlreich; Dr. Kay gibt ihre Zahl 1831 auf 267 im eigentlichen Manchester an, und seitdem muß sie sich sehr vermehrt haben.
  en: Common lodging-houses, too, are very numerous; Dr. Kay gives their number in 1831 at 267 in Manchester proper, and they must have increased greatly since then.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '296'
- id: II.73.3
  kind: p
  original: Diese nehmen jedes zwischen zwanzig und dreißig Gäste auf und beherbergen also zusammen jede Nacht zwischen fünf- und siebentausend Menschen; der Charakter der Häuser und ihrer Kunden ist derselbe wie in den andern Städten.
  en: Each of these receives from twenty to thirty guests, so that they shelter all told, nightly, from five to seven thousand human beings. The character of the houses and their guests is the same as in other cities.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 296-297
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.73.4
  kind: p
  original: Fünf bis sieben Betten liegen in jedem Zimmer ohne Bettstellen auf der Erde, und darauf werden soviel Menschen gelegt, wie sich finden, und alles durcheinander.
  en: Five to seven beds in each room lie on the floor--without bedsteads, and on these sleep, mixed indiscriminately, as many persons as apply.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '297'
- id: II.73.5
  kind: p
  original: Welche physische und moralische Atmosphäre in diesen Höhlen des Lasters herrscht, brauche ich wohl nicht zu sagen.
  en: What physical and moral atmosphere reigns in these holes I need not state.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '297'
- id: II.73.6
  kind: p
  original: Jedes dieser Häuser ist ein Fokus des Verbrechens und der Schauplatz von Handlungen, die die Menschlichkeit empören und vielleicht ohne diese gewaltsame Zentralisation der Unsittlichkeit nie zur Ausführung gekommen wären.
  en: Each of these houses is a focus of crime, the scene of deeds against which human nature revolts, which would perhaps never have been executed but for this forced centralisation of vice.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '297'
- id: II.73.7
  kind: p
  original: Die Anzahl der in Kellerwohnungen lebenden Individuen gibt Gaskell für das eigentliche Manchester auf 20 000 an.
  en: Gaskell gives the number of persons living in cellars in Manchester proper as 20,000.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N14
  mew_page: '297'
- id: II.73.8
  kind: p
  original: Das "Weekly Dispatch" gibt die Anzahl "nach offiziellen Berichten" auf 12 Prozent der Arbeiterklasse an, was damit stimmen würde - die Anzahl der Arbeiter zu 175 000 angenommen, sind 12 Prozent gleich 21 000.
  en: The Weekly Dispatch gives the number, "according to official reports," as twelve per cent. of the working-class, which agrees with Gaskell's number; the workers being estimated at 175,000, 21,000 would form twelve per cent. of it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '297'
- id: II.73.9
  kind: p
  original: Die Kellerwohnungen in den Vorstädten sind mindestens ebenso zahlreich, und so wird die Zahl der in Manchester im weiteren Sinne in Kellern wohnenden Personen nicht unter 40 000 bis 50 000 betragen.
  en: The cellar dwellings in the suburbs are at least as numerous, so that the number of persons living in cellars in Manchester--using its name in the broader sense--is not less than forty to fifty thousand.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '297'
- id: II.73.10
  kind: p
  original: Soviel über die Wohnungen der Arbeiter in den großen Städten.
  en: So much for the dwellings of the workers in the largest cities and towns.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '297'
- id: II.73.11
  kind: p
  original: Die Befriedigung des Bedürfnisses für Obdach wird einen Maßstab abgeben für die Art, in welcher alle übrigen Bedürfnisse befriedigt werden.
  en: The manner in which the need of a shelter is satisfied furnishes a standard for the manner in which all other necessities are supplied.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '297'
- id: II.73.12
  kind: p
  original: Daß in diesen schmutzigen Löchern nur eine zerlumpte, schlecht genährte Einwohnerschaft sich aufhalten kann, läßt sich schon schließen.
  en: That in these filthy holes a ragged, ill-fed population alone can dwell is a safe conclusion, and such is the fact.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '297'
- id: II.73.13
  kind: p
  original: Und so ist es auch.
  en: The clothing of the working-people, in the majority of cases, is in a very bad condition.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '297'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.73.14
  kind: p
  original: Die Kleidung der Arbeiter ist bei der ungeheuren Majorität in sehr schlechtem Zustande.
  en: ''
  joined_to: II.73.13
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '297'
- id: II.73.15
  kind: p
  original: Schon die Stoffe, die dazu genommen werden, sind nicht die geeignetsten; Leinen und Wolle sind aus der Garderobe beider Geschlechter fast verschwunden, und an ihre Stelle ist Baumwolle getreten.
  en: The material used for it is not of the best adapted. Wool and linen have almost vanished from the wardrobe of both sexes, and cotton has taken their place.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 297-298
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.73.16
  kind: p
  original: Die Hemden sind von gebleichtem oder buntem Kattun, ebenso die Kleider der Frauenzimmer meist gedruckter Kattun, wollene Unterröcke sieht man ebenfalls selten auf den Waschleinen.
  en: Shirts are made of bleached or coloured cotton goods; the dresses of the women are chiefly of cotton print goods, and woollen petticoats are rarely to be seen on the washline.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '298'
- id: II.73.17
  kind: p
  original: Die Männer haben meist Beinkleider von Baumwollensamt oder anderen schweren baumwollenen Stoffen und Röcke oder Jacken von demselben Zeuge.
  en: The men wear chiefly trousers of fustian or other heavy cotton goods, and jackets or coats of the same.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '298'
- id: II.73.18
  kind: p
  original: Der Baumwollensamt (fustian) ist sogar sprichwörtlich die Tracht der Arbeiter geworden - fustian-jackets, so werden die Arbeiter genannt und nennen sich selbst so im Gegensatz zu den Herren in wollenem Tuch (broadcloth), welches letztere ebenfalls als Bezeichnung für die Mittelklasse gebraucht wird.
  en: Fustian has become the proverbial costume of the working-men, who are called "fustian jackets," and call themselves so in contrast to the gentlemen who wear broadcloth, which latter words are used as characteristic for the middle-class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '298'
- id: II.73.19
  kind: p
  original: Als Feargus O'Connor, der Chartistenchef, während der Insurrektion von 1842 nach Manchester kam, erschien er unter dem rasendsten Beifall der Arbeiter in einem baumwollensamtnen Anzuge.
  en: When Feargus O'Connor, the Chartist leader, came to Manchester during the insurrection of 1842, he appeared, amidst the deafening applause of the working-men, in a fustian suit of clothing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '298'
- id: II.73.20
  kind: p
  original: Hüte sind in England die allgemeine Tracht auch der Arbeiter, Hüte der verschiedensten Formen, runde, kegelförmige oder zylindrische, breitrandig, schmalrandig oder randlos - nur jüngere Leute tragen in den Fabrikstädten Mützen.
  en: Hats are the universal head-covering in England, even for working-men, hats of the most diverse forms, round, high, broad-brimmed, narrow-brimmed, or without brims--only the younger men in factory towns wearing caps.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '298'
- id: II.73.21
  kind: p
  original: Wer keinen Hut hat, faltet sich von Papier eine niedrige, viereckige Kappe.
  en: Any one who does not own a hat folds himself a low, square paper cap.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '298'
- id: II.73.22
  kind: p
  original: Die ganze Bekleidung der Arbeiter - auch vorausgesetzt, daß sie in gutem Zustande ist - ist wenig in Einklang mit dem Klima.
  en: The whole clothing of the working-class, even assuming it to be in good condition, is little adapted to the climate.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '298'
- id: II.73.23
  kind: p
  original: Die feuchte Luft Englands, die mit ihren schnellen Witterungswechseln mehr als jede andere Erkältungen hervorruft, nötigt fast die ganze Mittelklasse, Flanell auf der bloßen Haut des Oberkörpers zu tragen; flanellne Halsbinden, Jacken und Leibbinden sind fast allgemein im Gebrauch.
  en: The damp air of England, with its sudden changes of temperature, more calculated than any other to give rise to colds, obliges almost the whole middle-class to wear flannel next the skin, about the body, and flannel scarfs and shirts are in almost universal use.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '298'
- id: II.73.24
  kind: p
  original: Die arbeitende Klasse entbehrt nicht nur dieser Vorsorge, sondern ist auch fast nie imstande, überhaupt einen Faden Wolle zur Kleidung zu verwenden.
  en: Not only is the working-class deprived of this precaution, it is scarcely ever in a position to use a thread of woollen clothing; and the heavy cotton goods, though thicker, stiffer, and heavier than woollen clothes, afford much less protection against cold and wet, remain damp much longer because of their thickness and the nature of the stuff, and have nothing of the compact density of fulled woollen cloths.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '298'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.73.25
  kind: p
  original: Die schweren Baumwollenzeuge aber, obwohl dicker, steifer und schwerer als wollenes Tuch, halten dennoch Kälte und Nässe viel weniger ab als dieses, bleiben wegen ihrer Dicke und wegen der Natur des Materials länger feucht und haben überhaupt nicht die Dichtigkeit des gewalkten Wollentuchs.
  en: ''
  joined_to: II.73.24
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '298'
- id: II.73.26
  kind: p
  original: 'Und wenn der Arbeiter sich einmal einen wollenen Rock für den Sonntag anschaffen kann, so muß er in einen der "billigen Laden" gehen, wo er schlechtes, sogenanntes "devil''s dust"-Tuch [Teufelsdreck (Tuch, hergestellt aus minderwertigen, auf der Reißwolfmaschine - engl. devil: Teufel - verarbeiteten Wollresten)] bekommt, das "nur aufs Verkaufen, nicht aufs Tragen" gemacht ist und nach vierzehn Tagen reißt oder fadenscheinig wird - oder er muß sich beim Trödler einen halbverschlissenen alten Rock kaufen, dessen beste Zeit vorüber ist und der ihm nur für wenige Wochen gute Dienste leistet.'
  en: And, if a working-man once buys himself a woollen coat for Sunday, he must get it from one of the cheap shops where he finds bad, so-called "Devil's-dust" cloth, manufactured for sale and not for use, and liable to tear or grow threadbare in a fortnight, or he must buy of an old clothes'-dealer a half-worn coat which has seen its best days, and lasts but a few weeks. Moreover, the working-man's clothing is, in most cases, in bad condition, and there is the oft-recurring necessity for placing the best pieces in the pawnbroker's shop.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '298'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.73.27
  kind: p
  original: Dazu kommt aber noch bei den meisten der schlechte Zustand ihrer Garderobe und von Zeit zu Zeit die Notwendigkeit, die besseren Kleidungsstücke ins Pfandhaus zu tragen.
  en: But among very large numbers, especially among the Irish, the prevailing clothing consists of perfect rags often beyond all mending, or so patched that the original colour can no longer be detected.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '298'
- id: II.73.28
  kind: p
  original: Bei einer sehr, sehr großen Anzahl aber, besonders denen irischen Bluts, sind die Kleider wahre Lumpen, die oft gar nicht mehr flickfähig sind oder bei denen man vor lauter Flicken die ursprüngliche Farbe gar nicht mehr erkennt.
  en: Yet the English and Anglo-Irish go on patching, and have carried this art to a remarkable pitch, putting wool or bagging on fustian, or the reverse--it's all the same to them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 298-299
- id: II.73.29
  kind: p
  original: Die Engländer oder die Anglo-Iren flicken doch noch und haben es in dieser Kunst merkwürdig weit gebracht - Wolle oder Sackleinen auf Baumwollensamt oder umgekehrt, das macht ihnen gar nichts aus - aber die echten, eingewanderten Irländer flicken fast nie, nur im höchsten Notfalle, wenn das Kleid sonst in zwei Stücke reißt; gewöhnlich hangen die Lumpen des Hemdes durch die Risse des Rocks oder der Hosen heraus; sie tragen, wie Thomas Carlyle sagt, "einen Anzug von Fetzen, die aus- und anzuziehen eine der schwierigsten Operationen ist und nur an Festtagen und zu besonders günstigen Zeiten vorgenommen wird".
  en: But the true, transplanted Irish hardly ever patch except in the extremest necessity, when the garment would otherwise fall apart. Ordinarily the rags of the shirt protrude through the rents in the coat or trousers. They wear, as Thomas Carlyle says,-- "A suit of tatters, the getting on or off which is said to be a difficult operation, transacted only in festivals and the high tides of the calendar."
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N15
  mew_page: '299'
  align: '1:4'
  review: true
  review_reason: 1 de sentence(s) matched to 4 en sentence(s)
- id: II.74.1
  kind: p
  original: Die Irländer haben auch das früher in England unbekannte Barfußgehen mit herübergebracht.
  en: The Irish have introduced, too, the custom previously unknown in England, of going barefoot.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '299'
- id: II.74.2
  kind: p
  original: Jetzt sieht man in allen Fabrikstädten eine Menge Leute, namentlich Kinder und Weiber, barfuß umhergehen, und dies findet allmählich auch bei den ärmeren Engländern Eingang.
  en: In every manufacturing town there is now to be seen a multitude of people, especially women and children, going about barefoot, and their example is gradually being adopted by the poorer English.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '299'
- id: II.75.1
  kind: p
  original: Wie mit der Kleidung, so mit der Nahrung.
  en: As with clothing, so with food.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '299'
- id: II.75.2
  kind: p
  original: Die Arbeiter bekommen das, was der besitzenden Klasse zu schlecht ist.
  en: The workers get what is too bad for the property-holding class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '299'
- id: II.75.3
  kind: p
  original: In den großen Städten Englands kann man alles aufs beste haben, aber es kostet teures Geld, der Arbeiter, der mit seinen paar Groschen haushalten muß, kann so viel nicht anlegen.
  en: In the great towns of England everything may be had of the best, but it costs money; and the workman, who must keep house on a couple of pence, cannot afford much expense.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '299'
- id: II.75.4
  kind: p
  original: Dazu bekommt er seinen Lohn meist erst Samstag abends ausgezahlt - man hat angefangen, schon Freitag zu zahlen, aber diese sehr gute Einrichtung ist noch lange nicht allgemein - und so kommt er Samstag abends um vier, fünf oder sieben Uhr erst auf den Markt, von dem während des Vormittags schon die Mittelklasse sich das Beste ausgesucht hat.
  en: Moreover, he usually receives his wages on Saturday evening, for, although a beginning has been made in the payment of wages on Friday, this excellent arrangement is by no means universal; and so he comes to market at five or even seven o'clock, while the buyers of the middle-class have had the first choice during the morning, when the market teems with the best of everything.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '299'
- id: II.75.5
  kind: p
  original: Des Morgens strotzt der Markt von den besten Sachen, aber wenn die Arbeiter kommen, ist das Beste fort, und wenn es auch noch da wäre, so würden sie es wahrscheinlich nicht kaufen können.
  en: But when the workers reach it, the best has vanished, and, if it was still there, they would probably not be able to buy it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '299'
- id: II.75.6
  kind: p
  original: Die Kartoffeln, die der Arbeiter kauft, sind meist schlecht, die Gemüse verwelkt, der Käse alt und von geringer Qualität, der Speck ranzig, das Fleisch mager, alt, zäh, von alten, oft kranken oder verreckten Tieren - oft schon halb faul.
  en: The potatoes which the workers buy are usually poor, the vegetables wilted, the cheese old and of poor quality, the bacon rancid, the meat lean, tough, taken from old, often diseased, cattle, or such as have died a natural death, and not fresh even then, often half decayed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '299'
- id: II.75.7
  kind: p
  original: Die Verkäufer sind meistens kleine Höker, die schlechtes Zeug zusammenkaufen und es eben wegen seiner Schlechtigkeit so billig wieder er verkaufen können.
  en: The sellers are usually small hucksters who buy up inferior goods, and can sell them cheaply by reason of their badness.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '299'
- id: II.75.8
  kind: p
  original: Die ärmsten Arbeiter müssen noch einen andern Kunstgriff gebrauchen, um mit ihrem wenigen Gelde selbst bei der schlechtesten Qualität der einzukaufenden Artikel auszukommen.
  en: The poorest workers are forced to use still another device to get together the things they need with their few pence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '299'
- id: II.75.9
  kind: p
  original: Da nämlich um zwölf Uhr am Sonnabendabend alle Läden geschlossen werden müssen und am Sonntag nichts verkauft werden darf, so werden zwischen zehn und zwölf Uhr diejenigen Waren, die bis zum Montagmorgen verderben würden, zu Spottpreisen losgeschlagen.
  en: As nothing can be sold on Sunday, and all shops must be closed at twelve o'clock on Saturday night, such things as would not keep until Monday are sold at any price between ten o'clock and midnight.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 299-300
- id: II.75.10
  kind: p
  original: Was aber um zehn Uhr noch liegengeblieben ist, davon sind neun Zehntel am Sonntagmorgen nicht mehr genießbar und gerade diese Waren bilden den Sonntagstisch der ärmsten Klasse.
  en: But nine-tenths of what is sold at ten o'clock is past using by Sunday morning, yet these are precisely the provisions which make up the Sunday dinner of the poorest class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '300'
- id: II.75.11
  kind: p
  original: Das Fleisch, das die Arbeiter bekommen, ist sehr häufig ungenießbar - weil sie's aber einmal gekauft haben, so müssen sie es essen.
  en: The meat which the workers buy is very often past using; but having bought it, they must eat it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '300'
- id: II.75.12
  kind: p
  original: Am 6. Januar (wenn ich nicht sehr irre) 1844 war Marktgericht (court leet) in Manchester, wobei elf Fleischverkäufer gestraft wurden, weil sie ungenießbares Fleisch verkauft hatten.
  en: On the 6th of January, 1844 (if I am not greatly mistaken), a court leet was held in Manchester, when eleven meat-sellers were fined for having sold tainted meat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '300'
- id: II.75.13
  kind: p
  original: Jeder derselben hatte ein ganzes Rind oder Schwein oder mehrere Schafe oder 50 bis 60 Pfund Fleisch, die alle in diesem Zustande konfisziert worden waren.
  en: Each of them had a whole ox or pig, or several sheep, or from fifty to sixty pounds of meat, which were all confiscated in a tainted condition.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '300'
- id: II.75.14
  kind: p
  original: Bei einem derselben wurden 64 gefüllte Weihnachtsgänse mit Beschlag belegt, die zu Liverpool nicht verkauft und infolgedessen nach Manchester transportiert worden waren, wo sie faul und stinkend auf den Markt kamen.
  en: In one case, sixty-four stuffed Christmas geese were seized which had proved unsaleable in Liverpool, and had been forwarded to Manchester, where they were brought to market foul and rotten.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '300'
- id: II.75.15
  kind: p
  original: Die ganze Geschichte mit Namen und Strafbetrag wurde damals im "Manchester Guardian" - erzählt.
  en: All the particulars, with names and fines, were published at the time in the Manchester Guardian.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '300'
- id: II.75.16
  kind: p
  original: In den sechs Wochen vom 1. Juli bis 14. August berichtet dasselbe Blatt drei Fälle derselben Art; nach der Nummer vom 3. Juli wurde zu Heywood ein Schwein von 200 Pfund, das tot und faul gefunden, bei einem Schlächter zerhackt und zum Verkauf ausgestellt war, konfisziert; nach der vom 31. Juli wurden zwei Schlächter zu Wigan, deren einer schon früher sich desselben Vergehens schuldig gemacht hatte, wegen Ausstellung von ungenießbarem Fleisch in 2 Pfd. St. und 4 Pfd. St. Strafe genommen, und laut Nummer vom 10. August bei einem Krämer zu Bolton 26 ungenießbare Schinken mit Beschlag belegt, öffentlich verbrannt und der Krämer im Betrage von 20 sh. gestraft.
  en: In the six weeks, from July 1st to August 14th, the same sheet reported three similar cases. According to the Guardian for August 3rd, a pig, weighing 200 pounds, which had been found dead and decayed, was cut up and exposed for sale by a butcher at Heywood, and was then seized. According to the number for July 31st, two butchers at Wigan, of whom one had previously been convicted of the same offence, were fined 2 and 4 pounds respectively, for exposing tainted meat for sale; and, according to the number for August 10th, twenty-six tainted hams seized at a dealer's in Bolton, were publicly burnt, and the dealer fined twenty shillings.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '300'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.75.17
  kind: p
  original: Das sind aber lange noch nicht alle Fälle, noch nicht einmal ein Durchschnitt für die Zeit von sechs Wochen, wonach der Jahresdurchschnitt zu berechnen wäre - es kommen oft Zeiten, wo jede Nummer des zweimal wöchentlich erscheinenden "Guardian" einen solchen Fall aus Manchester oder dem umliegenden Fabrikdistrikt bringt - und wenn man bedenkt, wie viele Fälle bei den ausgedehnten Märkten, die sich an allen Hauptstraßenfronten entlangziehen, und bei der wenigen Aufsicht den Marktinspektoren entgehen müssen - wie ist sonst auch die Frechheit erklärlich, mit der ganze Stücke Vieh zum Verkauf gebracht werden? - wenn man bedenkt, wie groß die Versuchung bei den oben angegebenen unbegreiflich niedrigen Strafbeträgen sein muß - wenn man bedenkt, in welchem Zustande ein Stück Fleisch schon sein muß, um von den Inspektoren als total ungenießbar konfisziert werden zu können, so kann man unmöglich glauben, daß die Arbeiter im Durchschnitt gutes und nahrhaftes Fleisch bekommen.
  en: But these are by no means all the cases; they do not even form a fair average for a period of six weeks, according to which to form an average for the year. There are often seasons in which every number of the semi-weekly Guardian mentions a similar case found in Manchester or its vicinity. And when one reflects upon the many cases which must escape detection in the extensive markets that stretch along the front of every main street, under the slender supervision of the market inspectors--and how else can one explain the boldness with which whole animals are exposed for sale?--when one considers how great the temptation must be, in view of the incomprehensibly small fines mentioned in the foregoing cases; when one reflects what condition a piece of meat must have reached to be seized by the inspectors, it is impossible to believe that the workers obtain good and nourishing meat as a usual thing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '300'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.75.18
  kind: p
  original: Aber sie werden auch auf noch andere Weise von der Geldgier der Mittelklasse geprellt.
  en: But they are victimised in yet another way by the money-greed of the middle-class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '300'
- id: II.75.19
  kind: p
  original: Die Krämer und Fabrikanten verfälschen alle Nahrungsmittel auf eine unverantwortliche Weise und mit der größten Rücksichtslosigkeit gegen die Gesundheit derer, die sie verzehren sollen.
  en: Dealers and manufacturers adulterate all kinds of provisions in an atrocious manner, and without the slightest regard to the health of the consumers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 300-301
- id: II.75.20
  kind: p
  original: 'Wir ließen oben den "Manchester Guardian" sprechen, hören wir jetzt ein anderes Blatt der Mittelklasse - ich liebe es, meine Gegner zu Zeugen zu nehmen - hören wir den "Liverpool Mercury":'
  en: 'We have heard the Manchester Guardian upon this subject, let us hear another organ of the middle-class--I delight in the testimony of my opponents--let us hear the Liverpool Mercury: "Salted butter is sold for fresh, the lumps being covered with a coating of fresh butter, or a pound of fresh being laid on top to taste, while the salted article is sold after this test, or the whole mass is washed and then sold as fresh.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '301'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.76.1
  kind: p
  original: '"Gesalzene Butter wird für frische verkauft, entweder indem die Klumpen mit einem Überzuge von frischer Butter bedeckt oder indem ein frisches Pfund zum Schmecken oben hingelegt und nach dieser Probe die gesalzenen Pfunde verkauft werden, oder indem das Salz ausgewaschen und die Butter dann für frische verkauft werden.'
  en: ''
  joined_to: II.75.20
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '301'
- id: II.76.2
  kind: p
  original: Unter den Zucker wird gestoßener Reis oder andere wohlfeile Sachen gemischt und zum vollen Preise verkauft.
  en: With sugar, pounded rice and other cheap adulterating materials are mixed, and the whole sold at full price.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '301'
- id: II.76.3
  kind: p
  original: Der Abfall der Seifensiedereien wird ebenfalls mit andern Stoffen vermischt und als Zucker verkauft.
  en: The refuse of soap-boiling establishments also is mixed with other things and sold as sugar.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '301'
- id: II.76.4
  kind: p
  original: Unter gemahlnen Kaffee wird Zichorie oder anderes wohlfeiles Zeug gemischt, ja sogar unter ungemahlnen, wobei die Mischung in die Form von Kaffeebohnen gebracht wird.
  en: Chicory and other cheap stuff is mixed with ground coffee, and artificial coffee beans with the unground article.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '301'
- id: II.76.5
  kind: p
  original: Kakao wird sehr häufig mit feiner brauner Erde versetzt, die mit Hammelfett gerieben ist und sich dann mit dem echten Kakao leichter vermischt.
  en: Cocoa is often adulterated with fine brown earth, treated with fat to render it more easily mistakable for real cocoa.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '301'
- id: II.76.6
  kind: p
  original: Tee wird mit Schlehenblättern und anderem Unrat vermischt, oder ausgebrauchte Teeblätter werden getrocknet, auf kupfernen heißen Platten geröstet, damit sie wieder Farbe bekommen, und so für frisch verkauft.
  en: Tea is mixed with the leaves of the sloe and with other refuse, or dry tea-leaves are roasted on hot copper plates, so returning to the proper colour and being sold as fresh.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '301'
- id: II.76.7
  kind: p
  original: Pfeffer wird mit Staub von Hülsen usw. verfälscht; Portwein wird geradezu fabriziert (aus Farbstoffen, Alkohol usw.), da es notorisch ist, daß in England allein mehr davon getrunken wird, als in ganz Portugal wächst, und Tabak wird mit ekelhaften Stoffen aller Art vermischt in allen möglichen Formen, die diesem Artikel gegeben werden."
  en: Pepper is mixed with pounded nutshells; port wine is manufactured outright (out of alcohol, dye-stuffs, etc.), while it is notorious that more of it is consumed in England alone than is grown in Portugal; and tobacco is mixed with disgusting substances of all sorts and in all possible forms in which the article is produced."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '301'
- id: II.77.1
  kind: p
  original: (Ich kann hinzusetzen, daß wegen der allgemeinen Tabaksverfälschung mehrere der angesehensten Tabakshändler von Manchester im vorigen Sommer öffentlich erklärten, kein derartiges Geschäft könne ohne Verfälschung bestehen, und daß keine einzige Zigarre, die weniger als 3 Pence kostet, ganz aus Tabak besteht.)
  en: I can add that several of the most respected tobacco dealers in Manchester announced publicly last summer, that, by reason of the universal adulteration of tobacco, no firm could carry on business without adulteration, and that no cigar costing less than threepence is made wholly from tobacco.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '301'
- id: II.77.2
  kind: p
  original: Natürlich bleibt es nicht bei den Betrügereien in Nahrungsmitteln, deren ich noch ein Dutzend - unter andern die Niederträchtigkeit, Gips oder Kreide unter das Mehl zu mischen - anführen könnte; in allen Artikeln wird betrogen, Flanell, Strümpfe usw. werden gereckt, um größer zu erscheinen, und laufen nach der ersten Wäsche ein, schmales Tuch wird für anderthalb oder drei Zoll breiteres verkauft, Steingut wird so dünn glasiert, daß die Glasur so gut wie keine ist und gleich springt, und hundert andere Schändlichkeiten.
  en: 'These frauds are naturally not restricted to articles of food, though I could mention a dozen more, the villainy of mixing gypsum or chalk with flour among them. Fraud is practiced in the sale of articles of every sort: flannel, stockings, etc., are stretched, and shrink after the first washing; narrow cloth is sold as being from one and a half to three inches broader than it actually is; stoneware is so thinly glazed that the glazing is good for nothing, and cracks at once, and a hundred other rascalities, tout comme chez nous.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '301'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.77.3
  kind: p
  original: Tout comme chez nous [Ganz wie bei uns] - aber wer die üblen Folgen der Betrügerei am meisten zu tragen hat, das sind die Arbeiter.
  en: But the lion's share of the evil results of these frauds falls to the workers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '301'
- id: II.77.4
  kind: p
  original: Der Reiche wird nicht betrogen, weil er die teuren Preise der großen Laden bezahlen kann, die auf guten Ruf halten müssen und sich selbst am meisten schaden würden, wenn sie schlechte, verfälschte Ware hielten; der Reiche ist verwöhnt durch gute Kost und merkt den Betrug leichter mit seiner feinen Zunge.
  en: The rich are less deceived, because they can pay the high prices of the large shops which have a reputation to lose, and would injure themselves more than their customers if they kept poor or adulterated wares; the rich are spoiled, too, by habitual good eating, and detect adulteration more easily with their sensitive palates.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 301-302
- id: II.77.5
  kind: p
  original: Aber der Arme, der Arbeiter, bei dem ein paar Pfennige viel ausmachen, der für wenig Geld viel Waren haben muß, der auf die Qualität so genau nicht sehen darf und kann, weil er nie Gelegenheit hatte, seinen Geschmackssinn zu verfeinern, der bekommt all die verfälschte, ja oft vergiftete Ware; er muß zu kleinen Krämern gehen, muß vielleicht sogar auf Kredit kaufen, und diese Krämer, die wegen ihres kleinen Kapitals und der größern Geschäftsunkosten bei gleicher Qualität gar nicht einmal so wohlfeil verkaufen können wie die bedeutenden Detaillisten, müssen schon um der von ihnen verlangten niedrigeren Preise und um der Konkurrenz der übrigen willen verfälschte Ware wissentlich oder unwissentlich anschaffen.
  en: But the poor, the working-people, to whom a couple of farthings are important, who must buy many things with little money, who cannot afford to inquire too closely into the quality of their purchases, and cannot do so in any case because they have had no opportunity of cultivating their taste--to their share fall all the adulterated, poisoned provisions. They must deal with the small retailers, must buy perhaps on credit, and these small retail dealers who cannot sell even the same quality of goods so cheaply as the largest retailers, because of their small capital and the large proportional expenses of their business, must knowingly or unknowingly buy adulterated goods in order to sell at the lower prices required, and to meet the competition of the others.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '302'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.77.6
  kind: p
  original: Dazu, wenn ein bedeutender Detaillist, der großes Kapital in seinem Geschäft stecken hat, bei einem entdeckten Betrug durch seinen ruinierten Kredit mit ruiniert ist - was verschlägt es einem Winkelkrämer, der eine einzige Straße mit Waren versorgt, ob man ihm Betrügereien nachweist?
  en: Further, a large retail dealer who has extensive capital invested in his business is ruined with his ruined credit if detected in a fraudulent practice; but what harm does it do a small grocer, who has customers in a single street only, if frauds are proved against him?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '302'
- id: II.77.7
  kind: p
  original: Traut man ihm in Ancoats nicht mehr, so zieht er nach Chorlton oder Hulme, wo ihn niemand kennt und wo er wieder von vorn anfängt zu betrügen; und gesetzliche Strafen stehen auf den wenigsten Verfälschungen, es sei denn, daß sie zugleich einen Akzise-Unterschleif involvieren.
  en: If no one trusts him in Ancoats, he moves to Chorlton or Hulme, where no one knows him, and where he continues to defraud as before; while legal penalties attach to very few adulterations unless they involve revenue frauds.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '302'
- id: II.77.8
  kind: p
  original: Aber nicht nur in der Qualität, sondern auch in der Quantität der Waren wird der englische Arbeiter betrogen; die kleinen Krämer haben großenteils falsche Maße und Gewichte, und eine unglaubliche Menge Straffälle wegen solcher Vergehen sind täglich in den Polizeiberichten zu lesen.
  en: Not in the quality alone, but in the quantity of his goods as well, is the English working-man defrauded. The small dealers usually have false weights and measures, and an incredible number of convictions for such offences may be read in the police reports.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '302'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.77.9
  kind: p
  original: 'Wie allgemein diese Art Betrügerei in den Fabrikdistrikten ist, mögen ein paar Auszüge aus dem "Manchester Guardian" lehren; sie erstrecken sich nur über einen kurzen Zeitraum, und selbst hier liegen mir nicht alle Nummern vor:'
  en: 'How universal this form of fraud is in the manufacturing districts, a couple of extracts from the Manchester Guardian may serve to show. They cover only a short period, and, even here, I have not all the numbers at hand:'
