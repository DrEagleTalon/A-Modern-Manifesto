- id: II.79.1
  kind: p
  original: Und aus denselben Gründen, aus denen der Betrug in der Qualität der Waren hauptsächlich auf die Arbeiter fiel, aus denselben fällt auch der quantitative Betrug auf sie.
  en: And the same causes which make the working-class the chief sufferers from frauds in the quality of goods make them the usual victims of frauds in the question of quantity too.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '303'
- id: II.80.1
  kind: p
  original: Die gewöhnliche Nahrung der einzelnen Arbeiter selbst ist natürlich nach Arbeitslohn verschieden.
  en: The habitual food of the individual working-man naturally varies according to his wages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '303'
- id: II.80.2
  kind: p
  original: Die besserbezahlten Arbeiter, besonders solche Fabrikarbeiter, bei denen jedes Familienglied imstande ist, etwas zu verdienen, haben, solange das dauert, gute Nahrung, täglich Fleisch und abends Speck und Käse.
  en: The better paid workers, especially those in whose families every member is able to earn something, have good food as long as this state of things lasts; meat daily, and bacon and cheese for supper.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '303'
- id: II.80.3
  kind: p
  original: Wo weniger verdient wird, findet man nur sonntags oder zwei- bis dreimal wöchentlich Fleisch, dafür mehr Kartoffeln und Brot; gehen wir allmählich tiefer, so finden wir die animalische Nahrung auf ein wenig unter die Kartoffeln geschnittenen Speck reduziert - noch tiefer verschwindet auch dieses, es bleibt nur Käse, Brot, Hafermehlbrei (porridge) und Kartoffeln, bis auf der tiefsten Stufe, bei den Irländern, nur Kartoffeln die Nahrung bilden.
  en: Where wages are less, meat is used only two or three times a week, and the proportion of bread and potatoes increases. Descending gradually, we find the animal food reduced to a small piece of bacon cut up with the potatoes; lower still, even this disappears, and there remain only bread, cheese, porridge, and potatoes, until on the lowest round of the ladder, among the Irish, potatoes form the sole food.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '303'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.80.4
  kind: p
  original: Dazu wird allgemein ein dünner Tee, vielleicht mit etwas Zucker, Milch oder Branntwein vermischt, getrunken; der Tee gilt in England und selbst in Irland für ein ebenso notwendiges und unerläßliches Getränk wie bei uns der Kaffee, und wo kein Tee mehr getrunken wird, da herrscht immer die bitterste Armut.
  en: As an accompaniment, weak tea, with perhaps a little sugar, milk, or spirits, is universally drunk. Tea is regarded in England, and even in Ireland, as quite as indispensable as coffee in Germany, and where no tea is used, the bitterest poverty reigns.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '303'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.80.5
  kind: p
  original: Alles das aber unter der Voraussetzung, daß der Arbeiter beschäftigt ist; wenn er keine Arbeit hat, so ist er ganz dem Zufall überlassen und ißt, was er geschenkt bekommt, sich zusammenbettelt oder - stiehlt; und wenn er nichts bekommt, so verhungert er eben, wie wir vorhin gesehen haben.
  en: But all this pre-supposes that the workman has work. When he has none, he is wholly at the mercy of accident, and eats what is given him, what he can beg or steal. And, if he gets nothing, he simply starves, as we have seen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '303'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.80.6
  kind: p
  original: Es versteht sich überhaupt, daß die Quantität der Nahrung sich wie die Qualität nach dem Lohne richtet und daß bei den schlechter bezahlten Arbeitern, wenn sie noch gar eine starke Familie haben, auch während voller Beschäftigung Hungersnot herrscht; und die Zahl dieser schlechter bezahlten Arbeiter ist sehr groß.
  en: The quantity of food varies, of course, like its quality, according to the rate of wages, so that among ill-paid workers, even if they have no large families, hunger prevails in spite of full and regular work; and the number of the ill-paid is very large.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '303'
- id: II.80.7
  kind: p
  original: Namentlich in London, wo die Konkurrenz der Arbeiter in demselben Maße steigt wie die Bevölkerung, ist diese Klasse sehr zahlreich, aber auch in allen andern Städten finden wir sie.
  en: Especially in London, where the competition of the workers rises with the increase of population, this class is very numerous, but it is to be found in other towns as well.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '303'
- id: II.80.8
  kind: p
  original: Da werden denn allerlei Auskunftsmittel gesucht, Kartoffelschalen, Gemüseabfall, faulende Vegetabilien aus Mangel an anderer Nahrung gegessen und begierig herbeigeholt, was vielleicht noch ein Atom Nahrungsstoff enthalten könnte.
  en: In these cases all sorts of devices are used; potato parings, vegetable refuse, and rotten vegetables are eaten for want of other food, and everything greedily gathered up which may possibly contain an atom of nourishment.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N16
  mew_page: '303'
- id: II.80.9
  kind: p
  original: Und wenn der Wochenlohn vor dem Ende der Woche verzehrt ist, so kommt es oft genug vor, daß die Familie in den letzten Tagen derselben gar nichts oder nur soviel Nahrung bekommt, als dringend nötig ist, sie vor dem Verhungern zu schützen.
  en: And, if the week's wages are used up before the end of the week, it often enough happens that in the closing days the family gets only as much food, if any, as is barely sufficient to keep off starvation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 303-304
- id: II.80.10
  kind: p
  original: Eine solche Lebensweise kann natürlich nur Krankheiten in Masse erzeugen, und wenn diese eintreten, wenn vollends der Mann, von dessen Arbeit die Familie hauptsächlich lebt und dessen angestrengte Tätigkeit am meisten Nahrung erfordert, der also auch am ersten unterliegt - wenn dieser vollends krank wird, so ist die Not erst groß, so tritt die Brutalität, mit der die Gesellschaft ihre Mitglieder gerade dann verläßt, wenn sie ihrer Unterstützung am meisten bedürfen, erst recht grell hervor.
  en: Of course such a way of living unavoidably engenders a multitude of diseases, and when these appear, when the father from whose work the family is chiefly supported, whose physical exertion most demands nourishment, and who therefore first succumbs--when the father is utterly disabled, then misery reaches its height, and then the brutality with which society abandons its members, just when their need is greatest, comes out fully into the light of day.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T4
    editions: '1892'
    reading: wenn vollends dieser
    base_text: … - wenn dieser vollends ‸ krank wird, so ist …
  mew_page: '304'
- id: II.81.1
  kind: p
  original: 'Fassen wir nun zum Schluß die angeführten Tatsachen nochmals kurz zusammen: Die großen Städte sind hauptsächlich von Arbeitern bewohnt, da im günstigsten Falle ein Bourgeois auf zwei, oft auch drei, hier und da auf vier Arbeiter kommt; diese Arbeiter haben selbst durchaus kein Eigentum und leben von dem Arbeitslohn, der fast immer aus der Hand in den Mund geht; die in lauter Atome aufgelöste Gesellschaft kümmert sich nicht um sie, überläßt es ihnen, für sich und ihre Familien zu sorgen, und gibt ihnen dennoch nicht die Mittel an die Hand, dies auf eine wirksame und dauernde Weise tun zu können; jeder Arbeiter, auch der beste, ist daher stets der Brotlosigkeit, das heißt dem Hungertode ausgesetzt, und viele erliegen ihm; die Wohnungen der Arbeiter sind durchgehends schlecht gruppiert, schlecht gebaut, in schlechtem Zustande gehalten, schlecht ventiliert, feucht und ungesund; die Einwohner sind auf den kleinsten Raum beschränkt, und in den meisten Fällen schläft wenigstens eine Familie in einem Zimmer; die innere Einrichtung der Wohnungen ist ärmlich in verschiedenen Abstufungen bis zum gänzlichen Mangel auch der notwendigsten Möbel; die Kleidung der Arbeiter ist ebenfalls durchschnittlich kärglich und bei einer großen Menge zerlumpt; die Nahrung im allgemeinen schlecht, oft fast ungenießbar und in vielen Fällen wenigstens zeitweise in unzureichender Quantität, so daß im äußersten Falle Hungertod eintritt.'
  en: To sum up briefly the facts thus far cited. The great towns are chiefly inhabited by working-people, since in the best case there is one bourgeois for two workers, often for three, here and there for four; these workers have no property whatsoever of their own, and live wholly upon wages, which usually go from hand to mouth. Society, composed wholly of atoms, does not trouble itself about them; leaves them to care for themselves and their families, yet supplies them no means of doing this in an efficient and permanent manner. Every working-man, even the best, is therefore constantly exposed to loss of work and food, that is to death by starvation, and many perish in this way. The dwellings of the workers are everywhere badly planned, badly built, and kept in the worst condition, badly ventilated, damp, and unwholesome. The inhabitants are confined to the smallest possible space, and at least one family usually sleeps in each room. The interior arrangement of the dwellings is poverty-stricken in various degrees, down to the utter absence of even the most necessary furniture. The clothing of the workers, too, is generally scanty, and that of great multitudes is in rags. The food is, in general, bad; often almost unfit for use, and in many cases, at least at times, insufficient in quantity, so that, in extreme cases, death by starvation results.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '304'
  align: '1:9'
  review: true
  review_reason: 1 de sentence(s) matched to 9 en sentence(s); regrouped by the ingest (see REALIGN)
- id: II.81.2
  kind: p
  original: Die Arbeiterklasse der großen Städte bietet uns so eine Stufenleiter verschiedener Lebenslagen dar - im günstigsten Falle eine temporär erträgliche Existenz, für angestrengte Arbeit guten Lohn, gute Wohnung und gerade keine schlechte Nahrung - alles natürlich vom Arbeiterstandpunkt aus gut und erträglich - im schlimmsten bitteres Elend, das sich bis zur Obdachlosigkeit und dem Hungertode steigern kann; der Durchschnitt liegt aber dem schlimmsten Falle weit näher als dem besten.
  en: Thus the working-class of the great cities offers a graduated scale of conditions in life, in the best cases a temporarily endurable existence for hard work and good wages, good and endurable, that is, from the worker's standpoint; in the worst cases, bitter want, reaching even homelessness and death by starvation. The average is much nearer the worst case than the best.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '304'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s); regrouped by the ingest (see REALIGN)
- id: II.81.3
  kind: p
  original: 'Und diese Stufenleiter teilt sich nicht etwa bloß in fixe Klassen, so daß man sagen könnte: Dieser Fraktion der Arbeiter geht es gut, jener schlecht, und so bleibt es und ist es schon von jeher gewesen; sondern, wenn das auch hier und da der Fall ist, wenn einzelne Arbeitszweige im ganzen einen Vorzug vor andern genießen, so schwankt doch auch die Lege der Arbeiter in jeder Branche so sehr, daß ein jeder einzelne Arbeiter in den Fall kommen kann, die ganze Stufenleiter zwischen verhältnismäßigem Komfort und dem äußersten Mangel, ja dem Hungertode durchzumachen - wie denn auch fast jeder englische Proletarier von bedeutenden Glückswechseln zu erzählen weiß.'
  en: And this series does not fall into fixed classes, so that one can say, this fraction of the working-class is well off, has always been so, and remains so. If that is the case here and there, if single branches of work have in general an advantage over others, yet the condition of the workers in each branch is subject to such great fluctuations that a single working-man may be so placed as to pass through the whole range from comparative comfort to the extremest need, even to death by starvation, while almost every English working-man can tell a tale of marked changes of fortune.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 304-305
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s); regrouped by the ingest (see REALIGN)
