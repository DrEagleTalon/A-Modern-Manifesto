section: P1892
title_original: ''
title_en: Preface [to the English edition of 1892]
author: Friedrich Engels
date: '1892-01-11'
original_language: en
anchor_language: en
source_original: 'None: Engels wrote this preface in English; his German preface of 1892 (MEW 22) is a different text and is not in the sources used yet'
source_en: Engels's own English, in the London edition of 1892 (Swan Sonnenschein), Project Gutenberg ebook 17306
verses:
- id: P1892.0.1
  kind: heading
  original: ''
  en: Preface [to the English edition of 1892]
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.1.1
  kind: p
  original: ''
  en: The book, an English translation of which is here republished, was first issued in Germany in 1845.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.1.2
  kind: p
  original: ''
  en: The author, at that time, was young, twenty-four years of age, and his production bears the stamp of his youth with its good and its faulty features, of neither of which he feels ashamed.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.1.3
  kind: p
  original: ''
  en: It was translated into English, in 1885, by an American lady, Mrs. F. Kelley Wischnewetzky, and published in the following year in New York.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.1.4
  kind: p
  original: ''
  en: The American edition being as good as exhausted, and having never been extensively circulated on this side of the Atlantic, the present English copyright edition is brought out with the full consent of all parties interested.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.2.1
  kind: p
  original: ''
  en: For the American edition, a new Preface and an Appendix were written in English by the author.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.2.2
  kind: p
  original: ''
  en: The first had little to do with the book itself; it discussed the American Working-Class Movement of the day, and is, therefore, here omitted as irrelevant, the second--the original preface--is largely made use of in the present introductory remarks.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.3.1
  kind: p
  original: ''
  en: The state of things described in this book belongs to-day, in many respects, to the past, as far as England is concerned.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.3.2
  kind: p
  original: ''
  en: Though not expressly stated in our recognised treatises, it is still a law of modern Political Economy that the larger the scale on which Capitalistic Production is carried on, the less can it support the petty devices of swindling and pilfering which characterise its early stages.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.3.3
  kind: p
  original: ''
  en: The pettifogging business tricks of the Polish Jew, the representative in Europe of commerce in its lowest stage, those tricks that serve him so well in his own country, and are generally practised there, he finds to be out of date and out of place when he comes to Hamburg or Berlin; and, again, the commission agent, who hails from Berlin or Hamburg, Jew or Christian, after frequenting the Manchester Exchange for a few months, finds out that, in order to buy cotton yarn or cloth cheap, he, too, had better drop those slightly more refined but still miserable wiles and subterfuges which are considered the acme of cleverness in his native country.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.3.4
  kind: p
  original: ''
  en: The fact is, those tricks do not pay any longer in a large market, where time is money, and where a certain standard of commercial morality is unavoidably developed, purely as a means of saving time and trouble.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.3.5
  kind: p
  original: ''
  en: And it is the same with the relation between the manufacturer and his "hands."
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.1
  kind: p
  original: ''
  en: The revival of trade, after the crisis of 1847, was the dawn of a new industrial epoch.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.2
  kind: p
  original: ''
  en: The repeal of the Corn Laws and the financial reforms subsequent thereon gave to English industry and commerce all the elbow-room they had asked for.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.3
  kind: p
  original: ''
  en: The discovery of the Californian and Australian gold-fields followed in rapid succession.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.4
  kind: p
  original: ''
  en: The Colonial markets developed at an increasing rate their capacity for absorbing English manufactured goods.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.5
  kind: p
  original: ''
  en: In India millions of hand-weavers were finally crushed out by the Lancashire power-loom.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.6
  kind: p
  original: ''
  en: China was more and more being opened up.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.7
  kind: p
  original: ''
  en: Above all, the United States--then, commercially speaking, a mere colonial market, but by far the biggest of them all--underwent an economic development astounding even for that rapidly progressive country.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.8
  kind: p
  original: ''
  en: And, finally, the new means of communication introduced at the close of the preceding period--railways and ocean steamers--were now worked out on an international scale; they realised actually, what had hitherto existed only potentially, a world-market.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.9
  kind: p
  original: ''
  en: This world-market, at first, was composed of a number of chiefly or entirely agricultural countries grouped around one manufacturing centre--England--which consumed the greater part of their surplus raw produce, and supplied them in return with the greater part of their requirements in manufactured articles.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.10
  kind: p
  original: ''
  en: No wonder England's industrial progress was colossal and unparalleled, and such that the status of 1844 now appears to us as comparatively primitive and insignificant.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.11
  kind: p
  original: ''
  en: And in proportion as this increase took place, in the same proportion did manufacturing industry become apparently moralised.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.12
  kind: p
  original: ''
  en: The competition of manufacturer against manufacturer by means of petty thefts upon the workpeople did no longer pay.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.13
  kind: p
  original: ''
  en: Trade had outgrown such low means of making money; they were not worth while practising for the manufacturing millionaire, and served merely to keep alive the competition of smaller traders, thankful to pick up a penny wherever they could.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.14
  kind: p
  original: ''
  en: Thus the truck system was suppressed, the Ten Hours' Bill was enacted, and a number of other secondary reforms introduced--much against the spirit of Free Trade and unbridled competition, but quite as much in favour of the giant-capitalist in his competition with his less favoured brother.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.15
  kind: p
  original: ''
  en: Moreover, the larger the concern, and with it the number of hands, the greater the loss and inconvenience caused by every conflict between master and men; and thus a new spirit came over the masters, especially the large ones, which taught them to avoid unnecessary squabbles, to acquiesce in the existence and power of Trades' Unions, and finally even to discover in strikes--at opportune times--a powerful means to serve their own ends.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.16
  kind: p
  original: ''
  en: The largest manufacturers, formerly the leaders of the war against the working-class, were now the foremost to preach peace and harmony.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.17
  kind: p
  original: ''
  en: And for a very good reason.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.18
  kind: p
  original: ''
  en: The fact is, that all these concessions to justice and philanthropy were nothing else but means to accelerate the concentration of capital in the hands of the few, for whom the niggardly extra extortions of former years had lost all importance and had become actual nuisances; and to crush all the quicker and all the safer their smaller competitors, who could not make both ends meet without such perquisites.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.19
  kind: p
  original: ''
  en: Thus the development of production on the basis of the capitalistic system has of itself sufficed--at least in the leading industries, for in the more unimportant branches this is far from being the case--to do away with all those minor grievances which aggravated the workman's fate during its earlier stages.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.20
  kind: p
  original: ''
  en: And thus it renders more and more evident the great central fact, that the cause of the miserable condition of the working-class is to be sought, not in these minor grievances, but in the Capitalistic System itself.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.21
  kind: p
  original: ''
  en: The wage-worker sells to the capitalist his labour-force for a certain daily sum.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.22
  kind: p
  original: ''
  en: After a few hours' work he has reproduced the value of that sum; but the substance of his contract is, that he has to work another series of hours to complete his working-day; and the value he produces during these additional hours of surplus labour is surplus value, which cost the capitalist nothing, but yet goes into his pocket.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.23
  kind: p
  original: ''
  en: That is the basis of the system which tends more and more to split up civilised society into a few Rothschilds and Vanderbilts, the owners of all the means of production and subsistence, on the one hand, and an immense number of wage-workers, the owners of nothing but their labour-force, on the other.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.4.24
  kind: p
  original: ''
  en: And that this result is caused, not by this or that secondary grievance, but by the system itself--this fact has been brought out in bold relief by the development of Capitalism in England since 1847.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.5.1
  kind: p
  original: ''
  en: Again, the repeated visitations of cholera, typhus, smallpox, and other epidemics have shown the British bourgeois the urgent necessity of sanitation in his towns and cities, if he wishes to save himself and family from falling victims to such diseases.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.5.2
  kind: p
  original: ''
  en: Accordingly, the most crying abuses described in this book have either disappeared or have been made less conspicuous.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.5.3
  kind: p
  original: ''
  en: Drainage has been introduced or improved, wide avenues have been opened out athwart many of the worst "slums" I had to describe.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.5.4
  kind: p
  original: ''
  en: '"Little Ireland" has disappeared, and the "Seven Dials" are next on the list for sweeping away.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.5.5
  kind: p
  original: ''
  en: But what of that?
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.5.6
  kind: p
  original: ''
  en: Whole districts which in 1844 I could describe as almost idyllic, have now, with the growth of the towns, fallen into the same state of dilapidation, discomfort, and misery.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.5.7
  kind: p
  original: ''
  en: Only the pigs and the heaps of refuse are no longer tolerated.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.5.8
  kind: p
  original: ''
  en: The bourgeoisie have made further progress in the art of hiding the distress of the working-class.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.5.9
  kind: p
  original: ''
  en: But that, in regard to their dwellings, no substantial improvement has taken place, is amply proved by the Report of the Royal Commission "on the Housing of the Poor," 1885.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.5.10
  kind: p
  original: ''
  en: And this is the case, too, in other respects.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.5.11
  kind: p
  original: ''
  en: Police regulations have been plentiful as blackberries; but they can only hedge in the distress of the workers, they cannot remove it.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.6.1
  kind: p
  original: ''
  en: But while England has thus outgrown the juvenile state of capitalist exploitation described by me, other countries have only just attained it.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.6.2
  kind: p
  original: ''
  en: France, Germany, and especially America, are the formidable competitors who, at this moment--as foreseen by me in 1844--are more and more breaking up England's industrial monopoly.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.6.3
  kind: p
  original: ''
  en: Their manufactures are young as compared with those of England, but increasing at a far more rapid rate than the latter; and, curious enough, they have at this moment arrived at about the same phase of development as English manufacture in 1844.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.6.4
  kind: p
  original: ''
  en: With regard to America, the parallel is indeed most striking.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.6.5
  kind: p
  original: ''
  en: True, the external surroundings in which the working-class is placed in America are very different, but the same economical laws are at work, and the results, if not identical in every respect, must still be of the same order.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.6.6
  kind: p
  original: ''
  en: Hence we find in America the same struggles for a shorter working-day, for a legal limitation of the working-time, especially of women and children in factories; we find the truck-system in full blossom, and the cottage-system, in rural districts, made use of by the "bosses" as a means of domination over the workers.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.6.7
  kind: p
  original: ''
  en: When I received, in 1886, the American papers with accounts of the great strike of 12,000 Pennsylvanian coal-miners in the Connellsville district, I seemed but to read my own description of the North of England colliers' strike of 1844.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.6.8
  kind: p
  original: ''
  en: The same cheating of the workpeople by false measure; the same truck-system; the same attempt to break the miners' resistance by the capitalists' last, but crushing, resource,--the eviction of the men out of their dwellings, the cottages owned by the companies.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.7.1
  kind: p
  original: ''
  en: I have not attempted, in this translation, to bring the book up to date, or to point out in detail all the changes that have taken place since 1844.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.7.2
  kind: p
  original: ''
  en: 'And for two reasons: Firstly, to do this properly, the size of the book must be about doubled; and, secondly, the first volume of "Das Kapital," by Karl Marx, an English translation of which is before the public, contains a very ample description of the state of the British working-class, as it was about 1865, that is to say, at the time when British industrial prosperity reached its culminating point.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.7.3
  kind: p
  original: ''
  en: I should, then, have been obliged again to go over the ground already covered by Marx's celebrated work.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.8.1
  kind: p
  original: ''
  en: It will be hardly necessary to point out that the general theoretical standpoint of this book--philosophical, economical, political--does not exactly coincide with my standpoint of to-day.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.8.2
  kind: p
  original: ''
  en: Modern international Socialism, since fully developed as a science, chiefly and almost exclusively through the efforts of Marx, did not as yet exist in 1844.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.8.3
  kind: p
  original: ''
  en: My book represents one of the phases of its embryonic development; and as the human embryo, in its early stages, still reproduces the gill-arches of our fish-ancestors, so this book exhibits everywhere the traces of the descent of modern Socialism from one of its ancestors,--German philosophy.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.8.4
  kind: p
  original: ''
  en: Thus great stress is laid on the dictum that Communism is not a mere party doctrine of the working-class, but a theory compassing the emancipation of society at large, including the capitalist class, from its present narrow conditions.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.8.5
  kind: p
  original: ''
  en: This is true enough in the abstract, but absolutely useless, and sometimes worse, in practice.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.8.6
  kind: p
  original: ''
  en: So long as the wealthy classes not only do not feel the want of any emancipation, but strenuously oppose the self-emancipation of the working-class, so long the social revolution will have to be prepared and fought out by the working-class alone.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.8.7
  kind: p
  original: ''
  en: The French bourgeois of 1789, too, declared the emancipation of the bourgeoisie to be the emancipation of the whole human race; but the nobility and clergy would not see it; the proposition--though for the time being, with respect to feudalism, an abstract historical truth--soon became a mere sentimentalism, and disappeared from view altogether in the fire of the revolutionary struggle.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.8.8
  kind: p
  original: ''
  en: And to-day, the very people who, from the "impartiality" of their superior standpoint, preach to the workers a Socialism soaring high above their class interests and class struggles, and tending to reconcile in a higher humanity the interests of both the contending classes--these people are either neophytes, who have still to learn a great deal, or they are the worst enemies of the workers,--wolves in sheeps' clothing.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.9.1
  kind: p
  original: ''
  en: The recurring period of the great industrial crisis is stated in the text as five years.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.9.2
  kind: p
  original: ''
  en: This was the period apparently indicated by the course of events from 1825 to 1842.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.9.3
  kind: p
  original: ''
  en: But the industrial history from 1842 to 1868 has shown that the real period is one of ten years; that the intermediate revulsions were secondary, and tended more and more to disappear.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.9.4
  kind: p
  original: ''
  en: Since 1868 the state of things has changed again, of which more anon.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.10.1
  kind: p
  original: ''
  en: I have taken care not to strike out of the text the many prophecies, amongst others that of an imminent social revolution in England, which my youthful ardour induced me to venture upon.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.10.2
  kind: p
  original: ''
  en: The wonder is, not that a good many of them proved wrong, but that so many of them have proved right, and that the critical state of English trade, to be brought on by Continental and especially American competition, which I then foresaw--though in too short a period--has now actually come to pass.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.10.3
  kind: p
  original: ''
  en: 'In this respect I can, and am bound to, bring the book up to date, by placing here an article which I published in the London Commonweal of March 1, 1885, under the heading: "England in 1845 and in 1885."'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.10.4
  kind: p
  original: ''
  en: 'It gives at the same time a short outline of the history of the English working-class during these forty years, and is as follows:'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.11.1
  kind: p
  original: ''
  en: '"Forty years ago England stood face to face with a crisis, solvable to all appearances by force only.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.11.2
  kind: p
  original: ''
  en: The immense and rapid development of manufactures had outstripped the extension of foreign markets and the increase of demand.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.11.3
  kind: p
  original: ''
  en: Every ten years the march of industry was violently interrupted by a general commercial crash, followed, after a long period of chronic depression, by a few short years of prosperity, and always ending in feverish over-production and consequent renewed collapse.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.11.4
  kind: p
  original: ''
  en: The capitalist class clamoured for Free Trade in corn, and threatened to enforce it by sending the starving population of the towns back to the country districts whence they came, to invade them, as John Bright said, not as paupers begging for bread, but as an army quartered upon the enemy.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.11.5
  kind: p
  original: ''
  en: The working masses of the towns demanded their share of political power--the People's Charter; they were supported by the majority of the small trading class, and the only difference between the two was whether the Charter should be carried by physical or by moral force.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.11.6
  kind: p
  original: ''
  en: Then came the commercial crash of 1847 and the Irish famine, and with both the prospect of revolution
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.12.1
  kind: p
  original: ''
  en: '"The French Revolution of 1848 saved the English middle-class.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.12.2
  kind: p
  original: ''
  en: The Socialistic pronunciamentos of the victorious French workmen frightened the small middle-class of England and disorganised the narrower, but more matter-of-fact movement of the English working-class.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.12.3
  kind: p
  original: ''
  en: At the very moment when Chartism was bound to assert itself in its full strength, it collapsed internally, before even it collapsed externally on the 10th of April, 1848.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.12.4
  kind: p
  original: ''
  en: The action of the working-class was thrust into the background.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.12.5
  kind: p
  original: ''
  en: The capitalist class triumphed along the whole line.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.13.1
  kind: p
  original: ''
  en: '"The Reform Bill of 1831 had been the victory of the whole capitalist class over the landed aristocracy.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.13.2
  kind: p
  original: ''
  en: The repeal of the Corn Laws was the victory of the manufacturing capitalist not only over the landed aristocracy, but over those sections of capitalists, too, whose interests were more or less bound up with the landed interest,--bankers, stock-jobbers, fund-holders, etc. Free Trade meant the re-adjustment of the whole home and foreign, commercial and financial policy of England in accordance with the interests of the manufacturing capitalists--the class which now represented the nation.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.13.3
  kind: p
  original: ''
  en: And they set about this task with a will.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.13.4
  kind: p
  original: ''
  en: Every obstacle to industrial production was mercilessly removed.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.13.5
  kind: p
  original: ''
  en: The tariff and the whole system of taxation were revolutionised.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.13.6
  kind: p
  original: ''
  en: 'Everything was made subordinate to one end, but that end of the utmost importance to the manufacturing capitalist: the cheapening of all raw produce, and especially of the means of living of the working-class; the reduction of the cost of raw material, and the keeping down--if not as yet the bringing down--of wages.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.13.7
  kind: p
  original: ''
  en: England was to become the 'workshop of the world;' all other countries were to become for England what Ireland already was,--markets for her manufactured goods, supplying her in return with raw materials and food.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.13.8
  kind: p
  original: ''
  en: England the great manufacturing centre of an agricultural world, with an ever-increasing number of corn and cotton-growing Irelands revolving around her, the industrial sun.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.13.9
  kind: p
  original: ''
  en: What a glorious prospect!
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.14.1
  kind: p
  original: ''
  en: '"The manufacturing capitalists set about the realisation of this their great object with that strong common sense and that contempt for traditional principles which has ever distinguished them from their more narrow-minded compeers on the Continent.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.14.2
  kind: p
  original: ''
  en: Chartism was dying out.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.14.3
  kind: p
  original: ''
  en: The revival of commercial prosperity, natural after the revulsion of 1847 had spent itself, was put down altogether to the credit of Free Trade.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.14.4
  kind: p
  original: ''
  en: Both these circumstances had turned the English working-class, politically, into the tail of the 'great Liberal party,' the party led by the manufacturers.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.14.5
  kind: p
  original: ''
  en: This advantage, once gained, had to be perpetuated.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.14.6
  kind: p
  original: ''
  en: And the manufacturing capitalists, from the Chartist opposition, not to Free Trade, but to the transformation of Free Trade into the one vital national question, had learnt, and were learning more and more, that the middle-class can never obtain full social and political power over the nation except by the help of the working-class.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.14.7
  kind: p
  original: ''
  en: Thus a gradual change came over the relations between both classes.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.14.8
  kind: p
  original: ''
  en: The Factory Acts, once the bugbear of all manufacturers, were not only willingly submitted to, but their expansion into acts regulating almost all trades, was tolerated.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.14.9
  kind: p
  original: ''
  en: Trades' Unions, hitherto considered inventions of the devil himself, were now petted and patronised as perfectly legitimate institutions, and as useful means of spreading sound economical doctrines amongst the workers.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.14.10
  kind: p
  original: ''
  en: Even strikes, than which nothing had been more nefarious up to 1848, were now gradually found out to be occasionally very useful, especially when provoked by the masters themselves, at their own time.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.14.11
  kind: p
  original: ''
  en: Of the legal enactments, placing the workman at a lower level or at a disadvantage with regard to the master, at least the most revolting were repealed.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.14.12
  kind: p
  original: ''
  en: And, practically, that horrid 'People's Charter' actually became the political programme of the very manufacturers who had opposed it to the last.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.14.13
  kind: p
  original: ''
  en: '''The Abolition of the Property Qualification'' and ''Vote by Ballot'' are now the law of the land.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.14.14
  kind: p
  original: ''
  en: The Reform Acts of 1867 and 1884 make a near approach to 'universal suffrage,' at least such as it now exists in Germany; the Redistribution Bill now before Parliament creates 'equal electoral districts'--on the whole not more unequal than those of Germany; 'payment of members,' and shorter, if not actually 'annual Parliaments,' are visibly looming in the distance--and yet there are people who say that Chartism is dead.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.15.1
  kind: p
  original: ''
  en: '"The Revolution of 1848, not less than many of its predecessors, has had strange bedfellows and successors.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.15.2
  kind: p
  original: ''
  en: The very people who put it down have become, as Karl Marx used to say, its testamentary executors.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.15.3
  kind: p
  original: ''
  en: Louis Napoleon had to create an independent and united Italy, Bismarck had to revolutionise Germany and to restore Hungarian independence, and the English manufacturers had to enact the People's Charter.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.16.1
  kind: p
  original: ''
  en: '"For England, the effects of this domination of the manufacturing capitalists were at first startling.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.16.2
  kind: p
  original: ''
  en: Trade revived and extended to a degree unheard of even in this cradle of modern industry; the previous astounding creations of steam and machinery dwindled into nothing compared with the immense mass of productions of the twenty years from 1850 to 1870, with the overwhelming figures of exports and imports, of wealth accumulated in the hands of capitalists and of human working power concentrated in the large towns.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.16.3
  kind: p
  original: ''
  en: The progress was indeed interrupted, as before, by a crisis every ten years, in 1857 as well as in 1866; but these revulsions were now considered as natural, inevitable events, which must be fatalistically submitted to, and which always set themselves right in the end.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.17.1
  kind: p
  original: ''
  en: '"And the condition of the working-class during this period?'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.17.2
  kind: p
  original: ''
  en: There was temporary improvement even for the great mass.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.17.3
  kind: p
  original: ''
  en: But this improvement always was reduced to the old level by the influx of the great body of the unemployed reserve, by the constant superseding of bands by new machinery, by the immigration of the agricultural population, now, too, more and more superseded by machines.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.18.1
  kind: p
  original: ''
  en: '"A permanent improvement can be recognised for two ''protected'' sections only of the working-class.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.18.2
  kind: p
  original: ''
  en: Firstly, the factory hands.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.18.3
  kind: p
  original: ''
  en: The fixing by Act of Parliament of their working-day within relatively rational limits has restored their physical constitution and endowed them with a moral superiority, enhanced by their local concentration.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.18.4
  kind: p
  original: ''
  en: They are undoubtedly better off than before 1848.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.18.5
  kind: p
  original: ''
  en: The best proof is that, out of ten strikes they make, nine are provoked by the manufacturers in their own interests, as the only means of securing a reduced production.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.18.6
  kind: p
  original: ''
  en: You can never get the masters to agree to work 'short time,' let manufactured goods be ever so unsaleable; but get the workpeople to strike, and the masters shut their factories to a man.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.19.1
  kind: p
  original: ''
  en: '"Secondly, the great Trades'' Unions.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.19.2
  kind: p
  original: ''
  en: They are the organisations of those trades in which the labour of grown-up men predominates, or is alone applicable.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.19.3
  kind: p
  original: ''
  en: Here the competition neither of women and children nor of machinery has so far weakened their organised strength.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.19.4
  kind: p
  original: ''
  en: The engineers, the carpenters, and joiners, the bricklayers, are each of them a power, to that extent that, as in the case of the bricklayers and bricklayers' labourers, they can even successfully resist the introduction of machinery.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.19.5
  kind: p
  original: ''
  en: That their condition has remarkably improved since 1848 there can be no doubt, and the best proof of this is in the fact, that for more than fifteen years not only have their employers been with them, but they with their employers, upon exceedingly good terms.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.19.6
  kind: p
  original: ''
  en: They form an aristocracy among the working-class; they have succeeded in enforcing for themselves a relatively comfortable position, and they accept it as final.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.19.7
  kind: p
  original: ''
  en: They are the model working-men of Messrs. Leone Levi & Giffen, and they are very nice people indeed nowadays to deal with, for any sensible capitalist in particular and for the whole capitalist class in general.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.20.1
  kind: p
  original: ''
  en: '"But as to the great mass of working-people, the state of misery and insecurity in which they live now is as low as ever, if not lower.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.20.2
  kind: p
  original: ''
  en: The East End of London is an everspreading pool of stagnant misery and desolation, of starvation when out of work, and degradation, physical and moral, when in work.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.20.3
  kind: p
  original: ''
  en: And so in all other large towns--abstraction made of the privileged minority of the workers; and so in the smaller towns and in the agricultural districts.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.20.4
  kind: p
  original: ''
  en: The law which reduces the value of labour-power to the value of the necessary means of subsistence, and the other law which reduces its average price, as a rule, to the minimum of those means of subsistence, these laws act upon them with the irresistible force of an automatic engine, which crushes them between its wheels.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.21.1
  kind: p
  original: ''
  en: '"This, then, was the position created by the Free Trade policy of 1847, and by twenty years of the rule of the manufacturing capitalists.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.21.2
  kind: p
  original: ''
  en: But, then, a change came.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.21.3
  kind: p
  original: ''
  en: The crash of 1866 was, indeed, followed by a slight and short revival about 1873; but that did not last.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.21.4
  kind: p
  original: ''
  en: We did not, indeed, pass through the full crisis at the time it was due, in 1877 or 1878; but we have had, ever since 1876, a chronic state of stagnation in all dominant branches of industry.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.21.5
  kind: p
  original: ''
  en: Neither will the full crash come; nor will the period of longed-for prosperity to which we used to be entitled before and after it.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.21.6
  kind: p
  original: ''
  en: A dull depression, a chronic glut of all markets for all trades, that is what we have been living in for nearly ten years.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.21.7
  kind: p
  original: ''
  en: How is this?
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.22.1
  kind: p
  original: ''
  en: '"The Free Trade theory was based upon one assumption: that England was to be the one great manufacturing centre of an agricultural world.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.22.2
  kind: p
  original: ''
  en: And the actual fact is that this assumption has turned out to be a pure delusion.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.22.3
  kind: p
  original: ''
  en: The conditions of modern industry, steam-power and machinery, can be established wherever there is fuel, especially coals.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.22.4
  kind: p
  original: ''
  en: And other countries beside England,--France, Belgium, Germany, America, even Russia,--have coals.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.22.5
  kind: p
  original: ''
  en: And the people over there did not see the advantage of being turned into Irish pauper farmers merely for the greater wealth and glory of English capitalists.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.22.6
  kind: p
  original: ''
  en: They set resolutely about manufacturing, not only for themselves, but for the rest of the world; and the consequence is, that the manufacturing monopoly enjoyed by England for nearly a century is irretrievably broken up.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.23.1
  kind: p
  original: ''
  en: '"But the manufacturing monopoly of England is the pivot of the present social system of England.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.23.2
  kind: p
  original: ''
  en: Even while that monopoly lasted, the markets could not keep pace with the increasing productivity of English manufacturers; the decennial crises were the consequence.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.23.3
  kind: p
  original: ''
  en: And new markets are getting scarcer every day, so much so that even the negroes of the Congo are now to be forced into the civilisation attendant upon Manchester calicos, Staffordshire pottery, and Birmingham hardware.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.23.4
  kind: p
  original: ''
  en: How will it be when Continental, and especially American, goods flow in in ever-increasing quantities--when the predominating share, still held by British manufacturers, will become reduced from year to year?
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.23.5
  kind: p
  original: ''
  en: Answer, Free Trade, thou universal panacea.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.24.1
  kind: p
  original: ''
  en: '"I am not the first to point this out.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.24.2
  kind: p
  original: ''
  en: Already, in 1883, at the Southport meeting of the British Association, Mr. Inglis Palgrave, the President of the Economic section, stated plainly that 'the days of great trade profits in England were over, and there was a pause in the progress of several great branches of industrial labour.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.24.3
  kind: p
  original: ''
  en: The country might almost be said to be entering the non-progressive state.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.25.1
  kind: p
  original: ''
  en: '"But what is to be the consequence?'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.25.2
  kind: p
  original: ''
  en: Capitalist production cannot stop.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.25.3
  kind: p
  original: ''
  en: It must go on increasing and expanding, or it must die.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.25.4
  kind: p
  original: ''
  en: Even now, the mere reduction of England's lion's share in the supply of the world's markets means stagnation, distress, excess of capital here, excess of unemployed workpeople there.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.25.5
  kind: p
  original: ''
  en: What will it be when the increase of yearly production is brought to a complete stop?
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.26.1
  kind: p
  original: ''
  en: '"Here is the vulnerable place, the heel of Achilles, for capitalistic production.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.26.2
  kind: p
  original: ''
  en: Its very basis is the necessity of constant expansion, and this constant expansion now becomes impossible.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.26.3
  kind: p
  original: ''
  en: It ends in a deadlock.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.26.4
  kind: p
  original: ''
  en: 'Every year England is brought nearer face to face with the question: either the country must go to pieces, or capitalist production must.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.26.5
  kind: p
  original: ''
  en: Which is it to be?
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.27.1
  kind: p
  original: ''
  en: '"And the working-class?'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.27.2
  kind: p
  original: ''
  en: If even under the unparalleled commercial and industrial expansion, from 1848 to 1866, they have had to undergo such misery; if even then the great bulk of them experienced at best but a temporary improvement of their condition, while only a small, privileged, 'protected' minority was permanently benefited, what will it be when this dazzling period is brought finally to a close; when the present dreary stagnation shall not only become intensified, but this, its intensified condition, shall become the permanent and normal state of English trade?
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.28.1
  kind: p
  original: ''
  en: '"The truth is this: during the period of England''s industrial monopoly the English working-class have, to a certain extent, shared in the benefits of the monopoly.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.28.2
  kind: p
  original: ''
  en: These benefits were very unequally parcelled out amongst them; the privileged minority pocketed most, but even the great mass had, at least, a temporary share now and then.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.28.3
  kind: p
  original: ''
  en: And that is the reason why, since the dying-out of Owenism, there has been no Socialism in England.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.28.4
  kind: p
  original: ''
  en: With the breakdown of that monopoly, the English working-class will lose that privileged position; it will find itself generally--the privileged and leading minority not excepted--on a level with its fellow-workers abroad.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.28.5
  kind: p
  original: ''
  en: And that is the reason why there will be Socialism again in England."
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.29.1
  kind: p
  original: ''
  en: To this statement of the case, as that case appeared to me in 1885, I have but little to add.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.29.2
  kind: p
  original: ''
  en: 'Needless to say that to-day there is indeed "Socialism again in England," and plenty of it--Socialism of all shades: Socialism conscious and unconscious, Socialism prosaic and poetic, Socialism of the working-class and of the middle-class, for, verily, that abomination of abominations, Socialism, has not only become respectable, but has actually donned evening dress and lounges lazily on drawing-room causeuses.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.29.3
  kind: p
  original: ''
  en: That shows the incurable fickleness of that terrible despot of "society," middle-class public opinion, and once more justifies the contempt in which we Socialists of a past generation always held that public opinion.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.29.4
  kind: p
  original: ''
  en: At the same time, we have no reason to grumble at the symptom itself.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.30.1
  kind: p
  original: ''
  en: What I consider far more important than this momentary fashion among bourgeois circles of affecting a mild dilution of Socialism, and even more than the actual progress Socialism has made in England generally, that is the revival of the East End of London.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.30.2
  kind: p
  original: ''
  en: That immense haunt of misery is no longer the stagnant pool it was six years ago.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.30.3
  kind: p
  original: ''
  en: It has shaken off its torpid despair, has returned to life, and has become the home of what is called the "New Unionism;" that is to say, of the organisation of the great mass of "unskilled" workers.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.30.4
  kind: p
  original: ''
  en: This organisation may to a great extent adopt the form of the old Unions of "skilled" workers, but it is essentially different in character.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.30.5
  kind: p
  original: ''
  en: The old Unions preserve the traditions of the time when they were founded, and look upon the wages system as a once for all established, final fact, which they at best can modify in the interest of their members.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.30.6
  kind: p
  original: ''
  en: The new Unions were founded at a time when the faith in the eternity of the wages system was severely shaken; their founders and promoters were Socialists either consciously or by feeling; the masses, whose adhesion gave them strength, were rough, neglected, looked down upon by the working-class aristocracy; but they had this immense advantage, that their minds were virgin soil, entirely free from the inherited "respectable" bourgeois prejudices which hampered the brains of the better situated "old" Unionists.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.30.7
  kind: p
  original: ''
  en: And thus we see now these new Unions taking the lead of the working-class movement generally, and more and more taking in tow the rich and proud "old" Unions.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.31.1
  kind: p
  original: ''
  en: Undoubtedly, the East Enders have committed colossal blunders; so have their predecessors, and so do the doctrinaire Socialists who pooh-pooh them.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.31.2
  kind: p
  original: ''
  en: A large class, like a great nation, never learns better or quicker than by undergoing the consequences of its own mistakes.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.31.3
  kind: p
  original: ''
  en: And for all the faults committed in past, present, and future, the revival of the East End of London remains one of the greatest and most fruitful facts of this fin de siecle, and glad and proud I am to have lived to see it.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1892.32.1
  kind: signature
  original: ''
  en: F. ENGELS. January 11th, 1892.
  modern: ''
  modern_status: empty
  notes: ''
