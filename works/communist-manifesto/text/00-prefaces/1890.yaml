- id: P1890.0.1
  kind: heading
  original: Vorwort [zur vierten deutschen Ausgabe von 1890]
  en: Preface to The 1890 German Edition
  modern: ''
  modern_status: empty
  notes: ''
- id: P1890.1.1
  kind: p
  original: Seit Vorstehendes geschrieben, ist wieder eine neue deutsche Auflage des "Manifestes" nötig geworden, und es hat sich auch allerlei mit dem "Manifest" zugetragen, das hier zu erwähnen ist.
  en: Since [the first German preface of 1883] was written, a new German edition of the Manifesto has again become necessary, and much has also happened to the Manifesto which should be recorded here.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: P1890.2.1
  kind: p
  original: Eine zweite russische Übersetzung - von Vera Sassulitsch - erschien 1882 in Genf; die Vorrede dazu wurde von Marx und mir verfaßt.
  en: A second Russian translation - by Vera Zasulich - appeared in Geneva in 1882; the preface to that edition was written by Marx and myself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: P1890.2.2
  kind: p
  original: Leider ist mir das deutsche Originalmanuskript abhanden gekommen, ich muß also aus dem Russischen zurückübersetzen, wodurch die Arbeit keineswegs gewinnt.
  en: Unfortunately, the original German manuscript has gone astray; I must therefore retranslate from the Russian which will in no way improve the text.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: P1890.2.3
  kind: p
  original: 'Sie lautet:'
  en: 'It reads:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: P1890.3.1
  kind: p
  original: '"Die erste russische Ausgabe des ''Manifests der Kommunistischen Partei'', in Bakunins Übersetzung, erschien anfangs der sechziger Jahre in der Druckerei des ''Kolokol''.'
  en: The first Russian edition of the Manifesto of the Communist Party, translated by Bakunin, was published early in the 'sixties by the printing office of the Kolokol [a reference to the Free Russian Printing House].
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.3.2
  kind: p
  original: Damals hatte eine russische Ausgabe dieser Schrift für den Westen höchstens die Bedeutung eines literarischen Kuriosums.
  en: Then the West could see in it (the Russian edition of the Manifesto) only a literary curiosity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.3.3
  kind: p
  original: Heute ist eine solche Auffassung nicht mehr möglich.
  en: Such a view would be impossible today.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.3.4
  kind: p
  original: 'Einen wie beschränkten Umfang das Verbreitungsgebiet der proletarischen Bewegung hatte zur Zeit der ersten Veröffentlichung des ''Manifests'' (Januar 1848), zeigt am besten das letzte Kapitel: ''Stellung der Kommunisten zu den verschiedenen oppositionellen Parteien''.'
  en: 'What a limited field the proletarian movement occupied at that time (December 1847) is most clearly shown by the last section: the position of the Communists in relation to the various opposition parties in various countries.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.3.5
  kind: p
  original: Hier fehlen vor allen Rußland und die Vereinigten Staaten.
  en: Precisely Russia and the United States are missing here.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.3.6
  kind: p
  original: Es war die Zeit, wo Rußland die letzte große Reserve der europäischen Reaktion bildete und wo die Auswanderung nach den Vereinigten Staaten die überschüssigen Kräfte des europäischen Proletariats absorbierte.
  en: It was the time when Russia constituted the last great reserve of all European reaction, when the United States absorbed the surplus proletarian forces of Europe through immigration.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.3.7
  kind: p
  original: Beide Länder versorgten Europa mit Rohstoff und dienten gleichzeitig als Märkte für den Absatz seiner Industrieprodukte.
  en: Both countries provided Europe with raw materials and were at the same time markets for the sale of its industrial products.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.3.8
  kind: p
  original: Beide erschienen also, in dieser oder jener Weise, als Stützen der europäischen gesellschaftlichen Ordnung.
  en: Both were, therefore, in one way of another, pillars of the existing European system.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.4.1
  kind: p
  original: Wie hat sich das alles heute geändert!
  en: How very different today.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.4.2
  kind: p
  original: Grade die europäische Auswanderung hat die kolossale Entwicklung des nordamerikanischen Ackerbaus ermöglicht, die durch ihre Konkurrenz das große wie das kleine Grundeigentum in Europa in seinen Grundfesten erschüttert.
  en: Precisely European immigration fitted North American for a gigantic agricultural production, whose competition is shaking the very foundations of European landed property - large and small.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 52-55
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.4.3
  kind: p
  original: Sie hat zugleich den Vereinigten Staaten die Möglichkeit gegeben, an die Ausbeutung ihrer reichhaltigen industriellen Hülfsquellen zu gehn, und zwar mit solcher Energie und auf solchem Maßstab, daß dies in kurzer Zeit dem industriellen Monopol des europäischen Westens ein Ende machen muß.
  en: At the same time, it enabled the United States to exploit its tremendous industrial resources with an energy and on a scale that must shortly break the industrial monopoly of Western Europe, and especially of England, existing up to now.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.4.4
  kind: p
  original: Und diese beiden Umstände wirken auch auf Amerika in revolutionärer Richtung zurück.
  en: Both circumstances react in a revolutionary manner upon America itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.4.5
  kind: p
  original: Das kleine und mittlere Grundeigentum der selbstarbeitenden Farmer, die Grundlage der ganzen politischen Ordnung Amerikas, erliegt mehr und mehr der Konkurrenz der Riesenfarmen, während gleichzeitig in den Industriebezirken sich zum erstenmal ein zahlreiches Proletariat bildet neben einer fabelhaften Konzentration der Kapitale.
  en: Step by step, the small and middle land ownership of the farmers, the basis of the whole political constitution, is succumbing to the competition of giant farms; at the same time, a mass industrial proletariat and a fabulous concentration of capital funds are developing for the first time in the industrial regions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.5.1
  kind: p
  original: Gehn wir nach Rußland.
  en: And now Russia!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.5.2
  kind: p
  original: Zur Zeit der Revolution von 1848/49 sahen nicht nur die europäischen Monarchen, sondern auch die europäischen Bourgeois in der russischen Intervention die einzige Rettung vor dem damals eben erst seine Kräfte gewahr werdenden Proletariat.
  en: During the Revolution of 1848-9, not only the European princes, but the European bourgeois as well, found their only salvation from the proletariat just beginning to awaken in Russian intervention.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.5.3
  kind: p
  original: Sie proklamierten den Zaren zum Haupt der europäischen Reaktion.
  en: The Tsar was proclaimed the chief of European reaction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.5.4
  kind: p
  original: Heute sitzt er in Gatschina als Kriegsgefangner der Revolution, und Rußland bildet die Vorhut der revolutionären Bewegung Europas.
  en: Today, he is a prisoner of war of the revolution in Gatchina, and Russia forms the vanguard of revolutionary action in Europe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.6.1
  kind: p
  original: Die Aufgabe des 'Kommunistischen Manifests' war die Proklamation des unvermeidlich bevorstehenden Untergangs des heutigen bürgerlichen Eigentums.
  en: The Communist Manifesto had, as its object, the proclamation of the inevitable impending dissolution of modern bourgeois property.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.6.2
  kind: p
  original: In Rußland aber finden wir, neben der sich mit Fieberhast entwickelnden kapitalistischen Ordnung und dem sich eben erst bildenden bürgerlichen Grundeigentum, die größere Hälfte des Bodens im Gemeineigentum der Bauern.
  en: But in Russia we find, face-to-face with the rapidly flowering capitalist swindle and bourgeois property, just beginning to develop, more than half the land owned in common by the peasants.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.7.1
  kind: p
  original: 'Es fragt sich nun: Kann die russische Bauerngemeinde, diese allerdings schon sehr zersetzte Form des urwüchsigen Gemeineigentums am Boden, unmittelbar übergehn in eine höhere kommunistische Form des Grundeigentums, oder muß sie vorher denselben Auflösungsprozeß durchmachen, der sich in der historischen Entwicklung des Westens darstellt?'
  en: 'Now the question is: can the Russian obshchina, though greatly undermined, yet a form of primeval common ownership of land, pass directly to the higher form of Communist common ownership? Or, on the contrary, must it first pass through the same process of dissolution such as constitutes the historical evolution of the West?'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1890.8.1
  kind: p
  original: Die einzige heute mögliche Antwort auf diese Frage ist die folgende.
  en: 'The only answer to that possible today is this: If the Russian Revolution becomes the signal for a proletarian revolution in the West, so that both complement each other, the present Russian common ownership of land may serve as the starting point for a communist development.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: P1890.8.2
  kind: p
  original: Wenn die russische Revolution das Signal zu einer Arbeiterrevolution im Westen wird, so daß beide einander ergänzen, dann kann das heutige russische Gemeineigentum zum Ausgangspunkt einer kommunistischen Entwicklung dienen.
  en: ''
  joined_to: P1890.8.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '55'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.9.1
  kind: signature
  original: London, 21. Januar 1882."
  en: January 21, 1882, London
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
  en_note: English supplied from P1882 (the MIA text prints only a placeholder here; Engels's 1890 back-translation differs slightly)
- id: P1890.10.1
  kind: p
  original: 'Eine neue polnische Übersetzung erschien um dieselbe Zeit in Genf: "Manifest komunistyczny".'
  en: 'At about the same date, a new Polish version appeared in Geneva: Manifest Kommunistyczny.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
- id: P1890.11.1
  kind: p
  original: Ferner ist eine neue dänische Übersetzung erschienen in "Socialdemokratisk Bibliotek", København 1885.
  en: Furthermore, a new Danish translation has appeared in the Socialdemokratisk Bibliothek, Copenhagen, 1885.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
- id: P1890.11.2
  kind: p
  original: Sie ist leider nicht ganz vollständig; einige wesentliche Stellen, die dem Übersetzer Schwierigkeit gemacht zu haben scheinen, sind ausgelassen und auch sonst hier und da Spuren von Flüchtigkeit zu bemerken, die um so unangenehmer auffallen, als man der Arbeit ansieht, daß der Übersetzer bei etwas mehr Sorgfalt Vorzügliches hätte leisten können.
  en: Unfortunately, it is not quite complete; certain essential passages, which seem to have presented difficulties to the translator, have been omitted, and, in addition, there are signs of carelessness here and there, which are all the more unpleasantly conspicuous since the translation indicates that had the translator taken a little more pains, he would have done an excellent piece of work.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 55-56
- id: P1890.12.1
  kind: p
  original: 1886 erschien eine neue französische Übersetzung in "Le Socialiste", Paris; es ist die beste bisher erschienene.
  en: A new French version appeared in 1886, in Le Socialiste of Paris; it is the best published to date.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: P1890.13.1
  kind: p
  original: 'Nach ihr wurde im selben Jahr eine spanische Übertragung zuerst im Madrider "El Socialista" und dann als Broschüre veröffentlicht: "Manifiesto del Partido Comunista" por Carlos Marx y F. Engels, Madrid, Administración de "El Socialista", Hernán Cortés 8.'
  en: 'From this latter, a Spanish version was published the same year in El Socialista of Madrid, and then reissued in pamphlet form: Manifesto del Partido Communista por Carlos Marx y F. Engels, Madrid, Administracion de El Socialista, Hernan Cortes 8.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: P1890.14.1
  kind: p
  original: Als Kuriosum erwähne ich noch, daß 1887 das Manuskript einer armenischen Übersetzung einem konstantinopolitanischen Verleger angeboten wurde; der gute Mann hatte jedoch nicht den Mut, etwas zu drucken, worauf der Name Marx stand, und meinte, der Übersetzer solle sich lieber selbst als Verfasser nennen, was dieser jedoch ablehnte.
  en: As a matter of curiosity, I may mention that in 1887 the manuscript of an Armenian translation was offered to a publisher in Constantinople. But the good man did not have the courage to publish something bearing the name of Marx and suggested that the translator set down his own name as author, which the latter however declined.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1890.15.1
  kind: p
  original: Nachdem bald die eine, bald die andre der mehr oder minder unrichtigen amerikanischen Übersetzungen mehrfach in England wieder abgedruckt worden, erschien endlich eine authentische Übersetzung im Jahre 1888.
  en: After one, and then another, of the more or less inaccurate American translations had been repeatedly reprinted in England, an authentic version at last appeared in 1888.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: P1890.15.2
  kind: p
  original: Sie ist von meinem Freund Samuel Moore und vor dem Druck von uns beiden nochmals zusammen durchgesehn.
  en: This was my friend Samuel Moore, and we went through it together once more before it went to press.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: P1890.15.3
  kind: p
  original: 'Der Titel ist: "Manifesto of the Communist Party", by Karl Marx and Frederick Engels.'
  en: 'It is entitled: Manifesto of the Communist Party, by Karl Marx and Frederick Engels.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: P1890.15.4
  kind: p
  original: Authorized English Translation, edited and annotated by Frederick Engels, 1888, London, William Reeves, 185 Fleet St. E.C. Einige der Anmerkungen dieser Ausgabe habe ich in die gegenwärtige herübergenommen.
  en: Authorized English translation, edited and annotated by Frederick Engels, 1888, London, William Reeves, 185 Fleet Street, E.C. I have added some of the notes of that edition to the present one.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: P1890.16.1
  kind: p
  original: Das "Manifest" hat einen eignen Lebenslauf gehabt.
  en: The Manifesto has had a history of its own.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: P1890.16.2
  kind: p
  original: Im Augenblick seines Erscheinens von der damals noch wenig zahlreichen Vorhut des wissenschaftlichen Sozialismus enthusiastisch begrüßt (wie die in der ersten Vorrede angeführten Übersetzungen beweisen), wurde es bald in den Hintergrund gedrängt durch die mit der Niederlage der Pariser Arbeiter im Juni 1848 beginnende Reaktion und schließlich "von Rechts wegen" in Acht und Bann erklärt durch die Verurteilung der Kölner Kommunisten, November 1852.
  en: Greeted with enthusiasm, at the time of its appearance, by the not at all numerous vanguard of scientific socialism (as is proved by the translations mentioned in the first place), it was soon forced into the background by the reaction that began with the defeat of the Paris workers in June 1848, and was finally excommunicated "by law" in the conviction of the Cologne Communists in November 1852.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: P1890.16.3
  kind: p
  original: Mit dem Verschwinden der von der Februarrevolution datierenden Arbeiterbewegung von der öffentlichen Bühne trat auch das "Manifest" in den Hintergrund.
  en: With the disappearance from the public scene of the workers' movement that had begun with the February Revolution, the Manifesto too passed into the background.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: P1890.17.1
  kind: p
  original: Als die europäische Arbeiterklasse sich wieder hinreichend gestärkt hatte zu einem neuen Anlauf gegen die Macht der herrschenden Klassen, entstand die Internationale Arbeiter-Assoziation.
  en: When the European workers had again gathered sufficient strength for a new onslaught upon the power of the ruling classes, the International Working Men's Association came into being.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 56-57
- id: P1890.17.2
  kind: p
  original: Sie hatte zum Zweck, die gesamte streitbare Arbeiterschaft Europas und Amerikas zu einem großen Heereskörper zu verschmelzen.
  en: Its aim was to weld together into one huge army the whole militant working class of Europe and America.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: P1890.17.3
  kind: p
  original: Sie konnte daher nicht ausgehn von den im "Manifest" niedergelegten Grundsätzen.
  en: Therefore it could not set out from the principles laid down in the Manifesto.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: P1890.17.4
  kind: p
  original: Sie mußte ein Programm haben, das den englischen Trades Unions, den französischen, belgischen, italienischen und spanischen Proudhonisten und den deutschen Lassalleanern die Tür nicht verschloß.
  en: It was bound to have a programme which would not shut the door on the English trade unions, the French, Belgian, Italian, and Spanish Proudhonists, and the German Lassalleans.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - P1890.N1
  mew_page: '57'
- id: P1890.17.5
  kind: p
  original: Dies Programm - die Erwägungsgründe zu den Statuten der Internationale - wurde von Marx mit einer selbst von Bakunin und den Anarchisten anerkannten Meisterschaft entworfen.
  en: This programme - the considerations underlying the Statutes of the International - was drawn up by Marx with a master hand acknowledged even by the Bakunin and the anarchists.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: P1890.17.6
  kind: p
  original: Für den schließlichen Sieg der im "Manifest" aufgestellten Sätze verließ sich Marx einzig und allein auf die intellektuelle Entwicklung der Arbeiterklasse, wie die aus der vereinigten Aktion und der Diskussion notwendig hervorgehn mußte.
  en: For the ultimate final triumph of the ideas set forth in the Manifesto, Marx relied solely upon the intellectual development of the working class, as it necessarily has to ensue from united action and discussion.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: P1890.17.7
  kind: p
  original: Die Ereignisse und Wechselfälle im Kampf gegen das Kapital, die Niederlagen noch mehr als die Erfolge, konnten nicht umhin, den Kämpfenden die Unzulänglichkeit ihrer bisherigen Allerweltsheilmittel klarzulegen und ihre Köpfe empfänglicher zu machen für eine gründliche Einsicht in die wahren Bedingungen der Arbeiteremanzipation.
  en: The events and vicissitudes in the struggle against capital, the defeats even more than the successes, could not but demonstrate to the fighters the inadequacy of their former universal panaceas, and make their minds more receptive to a thorough understanding of the true conditions for working-class emancipation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: P1890.17.8
  kind: p
  original: Und Marx hatte recht.
  en: And Marx was right.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: P1890.17.9
  kind: p
  original: Die Arbeiterklasse von 1874, bei der Auflösung der Internationale, war eine ganz andre, als die von 1864, bei ihrer Gründung, gewesen war.
  en: The working class of 1874, at the dissolution of the International, was altogether different from that of 1864, at its foundation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: P1890.17.10
  kind: p
  original: 'Der Proudhonismus in den romanischen Ländern, der spezifische Lassalleanismus in Deutschland waren am Aussterben, und selbst die damaligen stockkonservativen englischen Trades Unions gingen allmählich dem Punkt entgegen, wo 1887 der Präsident ihres Kongresses in Swansea in ihrem Namen sagen konnte: "Der kontinentale Sozialismus hat seine Schrecken für uns verloren."'
  en: 'Proudhonism in the Latin countries, and the specific Lassalleanism in Germany, were dying out; and even the ten arch-conservative English trade unions were gradually approaching the point where, in 1887, the chairman of their Swansea Congress could say in their name: "Continental socialism has lost its terror for us."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: P1890.17.11
  kind: p
  original: Der kontinentale Sozialismus, der war aber schon 1887 fast nur noch die Theorie, die im "Manifest" verkündet wird.
  en: Yet by 1887 continental socialism was almost exclusively the theory heralded in the Manifesto.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: P1890.17.12
  kind: p
  original: Und so spiegelt die Geschichte des "Manifests" bis zu einem gewissen Grade die Geschichte der modernen Arbeiterbewegung seit 1848 wider.
  en: Thus, to a certain extent, the history of the Manifesto reflects the history of the modern working-class movement since 1848.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: P1890.17.13
  kind: p
  original: Gegenwärtig ist es unzweifelhaft das weitest verbreitete, das internationalste Produkt der gesamten sozialistischen Literatur, das gemeinsame Programm vieler Millionen von Arbeitern aller Länder von Sibirien bis Kalifornien.
  en: At present, it is doubtless the most widely circulated, the most international product of all socialist literature, the common programme of many millions of workers of all countries from Siberia to California.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: P1890.18.1
  kind: p
  original: Und doch, als es erschien, hätten wir es nicht ein sozialistisches Manifest nennen dürfen.
  en: Nevertheless, when it appeared, we could not have called it a socialist manifesto.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: P1890.18.2
  kind: p
  original: Unter Sozialisten verstand man 1847 zweierlei Art von Leuten.
  en: In 1847, two kinds of people were considered socialists.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: P1890.18.3
  kind: p
  original: Einerseits die Anhänger der verschiedenen utopistischen Systeme, speziell die Owenisten in England und die Fourieristen in Frankreich, die beide schon damals zu bloßen, allmählich aussterbenden Sekten zusammengeschrumpft waren.
  en: On the one hand were the adherents of the various utopian systems, notably the Owenites in England and the Fourierists in France, both of whom, at that date, had already dwindled to mere sects gradually dying out.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: P1890.18.4
  kind: p
  original: Andrerseits die mannigfaltigsten sozialen Quacksalber, die mit ihren verschiedenen Allerweltheilmitteln und mit jeder Art von Flickarbeit die gesellschaftlichen Mißstände beseitigen wollten, ohne dem Kapital und dem Profit im geringsten wehe zu tun.
  en: On the other, the manifold types of social quacks who wanted to eliminate social abuses through their various universal panaceas and all kinds of patch-work, without hurting capital and profit in the least.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: P1890.18.5
  kind: p
  original: 'In beiden Fällen: Leute, die außerhalb der Arbeiterbewegung standen und die vielmehr Unterstützung suchten bei den "gebildeten" Klassen.'
  en: In both cases, people who stood outside the labor movement and who looked for support rather to the "educated" classes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: P1890.18.6
  kind: p
  original: Derjenige Teil der Arbeiter dagegen, der, von der Unzulänglichkeit bloßer politischer Umwälzungen überzeugt, eine gründliche Umgestaltung der Gesellschaft forderte, der Teil nannte sich damals kommunistisch.
  en: The section of the working class, however, which demanded a radical reconstruction of society, convinced that mere political revolutions were not enough, then called itself Communist.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: P1890.18.7
  kind: p
  original: Es war ein nur im Rauhen gearbeiteter, nur instinktiver, manchmal etwas roher Kommunismus; aber er war mächtig genug, um zwei Systeme des utopischen Kommunismus zu erzeugen, in Frankreich den "ikarischen" Cabets, in Deutschland den von Weitling.
  en: It was still a rough-hewn, only instinctive and frequently somewhat crude communism. Yet, it was powerful enough to bring into being two systems of utopian communism - in France, the "Icarian" communists of Cabet, and in Germany that of Weitling.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1890.18.8
  kind: p
  original: Sozialismus bedeutete 1847 eine Bourgeoisbewegung, Kommunismus eine Arbeiterbewegung.
  en: Socialism in 1847 signified a bourgeois movement, communism a working-class movement.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: P1890.18.9
  kind: p
  original: Der Sozialismus war, auf dem Kontinent wenigstens, salonfähig, der Kommunismus war das grade Gegenteil.
  en: Socialism was, on the Continent at least, quite respectable, whereas communism was the very opposite.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: P1890.18.10
  kind: p
  original: Und da wir schon damals sehr entschieden der Ansicht waren, daß "die Emanzipation der Arbeiter das Werk der Arbeiterklasse selbst sein muß", so konnten wir keinen Augenblick im Zweifel sein, welchen der beiden Namen zu wählen.
  en: And since we were very decidedly of the opinion as early as then that "the emancipation of the workers must be the task of the working class itself," [from the General Rules of the International] we could have no hesitation as to which of the two names we should choose.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: P1890.18.11
  kind: p
  original: Auch seitdem ist es uns nie eingefallen, ihn zurückzuweisen.
  en: Nor has it ever occurred to us to repudiate it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: P1890.19.1
  kind: p
  original: '"Proletarier aller Länder, vereinigt euch!"'
  en: '"Working men of all countries, unite!"'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: P1890.19.2
  kind: p
  original: Nur wenige Stimmen antworteten, als wir diese Worte in die Weit hinausriefen, vor nunmehr 42 Jahren, am Vorabend der ersten Pariser Revolution, worin das Proletariat mit eignen Ansprüchen hervortrat.
  en: But few voices responded when we proclaimed these words to the world 42 years ago, on the eve of the first Paris Revolution in which the proletariat came out with the demands of its own.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: P1890.19.3
  kind: p
  original: Aber am 28. September 1864 vereinigten sich Proletarier der meisten westeuropäischen Länder zur Internationalen Arbeiter-Assoziation glorreichen Angedenkens.
  en: On September 28, 1864, however, the proletarians of most of the Western European countries joined hands in the International Working Men's Association of glorious memory.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: P1890.19.4
  kind: p
  original: Die Internationale selbst lebte allerdings nur neun Jahre.
  en: True, the International itself lived only nine years.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: P1890.19.5
  kind: p
  original: Aber daß der von ihr gegründete ewige Bund der Proletarier aller Länder noch lebt, und kräftiger lebt als je. dafür gibt es keinen bessern Zeugen als grade den heutigen Tag.
  en: But that the eternal union of the proletarians of all countries created by it is still alive and lives stronger than ever, there is no better witness than this day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: P1890.19.6
  kind: p
  original: 'Denn heute, wo ich diese Zeilen schreibe, hält das europäische und amerikanische Proletariat Heerschau über seine zum erstenmal mobil gemachten Streitkräfte, mobil gemacht als ein Heer, unter einer Fahne und für ein nächstes Ziel: den schon vom Genfer Kongreß der Internationale 1866 und wiederum vom Pariser Arbeiterkongreß 1889 proklamierten, gesetzlich festzustellenden, achtstündigen Normalarbeitstag.'
  en: 'Because today, as I write these lines, the European and American proletariat is reviewing its fighting forces, mobilized for the first time, mobilized as one army, under one flag, for one immediate aim: the standard eight-hour working day to be established by legal enactment, as proclaimed by the Geneva Congress of the International in 1866, and again by the Paris Workers'' Congress of 1889.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: P1890.19.7
  kind: p
  original: Und das Schauspiel des heutigen Tages wird den Kapitalisten und Grundherren aller Länder die Augen darüber öffnen, daß heute die Proletarier aller Länder in der Tat vereinigt sind.
  en: And today's spectacle will open the eyes of the capitalists and landlords of all countries to the fact that today the proletarians of all countries are united indeed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 58-59
- id: P1890.20.1
  kind: p
  original: Stände nur Marx noch neben mir, dies mit eignen Augen zu sehn!
  en: If only Marx were still by my side to see this with his own eyes!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
