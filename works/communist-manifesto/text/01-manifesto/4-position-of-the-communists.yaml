section: IV
title_original: Stellung der Kommunisten zu den verschiedenen oppositionellen Parteien
title_en: Position of the Communists in Relation to the Various Existing Opposition Parties
author: Karl Marx and Friedrich Engels
date: 1848-02
original_language: de
anchor_language: de
