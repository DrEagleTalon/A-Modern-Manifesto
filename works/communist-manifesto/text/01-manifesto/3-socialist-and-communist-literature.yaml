  mew_page: '490'
- id: III.57.1
  kind: p
  original: Die phantastische Schilderung der zukünftigen Gesellschaft entspringt in einer Zeit, wo das Proletariat noch höchst unentwickelt ist, also selbst noch phantastisch seine eigene Stellung auffaßt, seinem ersten ahnungsvollen Drängen nach einer allgemeinen Umgestaltung der Gesellschaft.
  en: Such fantastic pictures of future society, painted at a time when the proletariat is still in a very undeveloped state and has but a fantastic conception of its own position, correspond with the first instinctive yearnings of that class for a general reconstruction of society.
  modern: These fantastic pictures of future society, painted at a time when the proletariat is still in a very undeveloped state and still has only a fantastic conception of its own position, correspond with the first instinctive yearnings of that class for a general remaking of society.
