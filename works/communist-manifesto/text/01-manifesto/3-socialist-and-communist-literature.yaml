- id: III.43.1
  kind: p
  original: Eine zweite, weniger systematische, nur mehr praktische Form dieses Sozialismus suchte der Arbeiterklasse jede revolutionäre Bewegung zu verleiden, durch den Nachweis, wie nicht diese oder jene politische Veränderung, sondern nur eine Veränderung der materiellen Lebensverhältnisse, der ökonomischen Verhältnisse ihr von Nutzen sein könne.
  en: A second, and more practical, but less systematic, form of this Socialism sought to depreciate every revolutionary movement in the eyes of the working class by showing that no mere political reform, but only a change in the material conditions of existence, in economical relations, could be of any advantage to them.
  modern: A second, more practical but less systematic form of this kind of socialism tried to discredit every revolutionary movement in the eyes of the working class. It argued that no mere political reform, but only a change in the material conditions of existence, in economic relations, could really help them.
  modern_status: seed
  notes: ''
