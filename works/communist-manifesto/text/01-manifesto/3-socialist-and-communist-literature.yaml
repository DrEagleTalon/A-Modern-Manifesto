  mew_page: '489'
- id: III.50.1
  kind: p
  original: Die eigentlich sozialistischen und kommunistischen Systeme, die Systeme St.-Simons, Fouriers, Owens usw., tauchen auf in der ersten, unentwickelten Periode des Kampfes zwischen Proletariat und Bourgeoisie, die wir oben dargestellt haben.
  en: The Socialist and Communist systems, properly so called, those of Saint-Simon, Fourier, Owen, and others, spring into existence in the early undeveloped period, described above, of the struggle between proletariat and bourgeoisie (see Section I. Bourgeois and Proletarians).
  modern: The socialist and communist systems in the real sense - those of Saint-Simon, Fourier, Owen, and others - arise in the early, undeveloped period of the struggle between proletariat and bourgeoisie described above (see Section I, "Bourgeois and Proletarians").
