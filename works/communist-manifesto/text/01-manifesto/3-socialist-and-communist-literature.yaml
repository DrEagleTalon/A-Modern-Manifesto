    reading: und
    base_text: … zweite, weniger systematische, nur ‸ mehr praktische Form dieses …
  mew_page: '489'
- id: III.43.2
  kind: p
  original: Unter Veränderung der materiellen Lebensverhältnisse versteht dieser Sozialismus aber keineswegs Abschaffung der bürgerlichen Produktionsverhältnisse, die nur auf revolutionärem Wege möglich ist, sondern administrative Verbesserungen, die auf dem Boden dieser Produktionsverhältnisse vor sich gehen, also an dem Verhältnis von Kapital und Lohnarbeit nichts ändern, sondern im besten Fall der Bourgeoisie die Kosten ihrer Herrschaft vermindern und ihren Staatshaushalt vereinfachen.
  en: By changes in the material conditions of existence, this form of Socialism, however, by no means understands abolition of the bourgeois relations of production, an abolition that can be affected only by a revolution, but administrative reforms, based on the continued existence of these relations; reforms, therefore, that in no respect affect the relations between capital and labour, but, at the best, lessen the cost, and simplify the administrative work, of bourgeois government.
  modern: By "changes in material conditions," though, this form of socialism does not mean the abolition of bourgeois relations of production - something only a revolution could accomplish. It means administrative reforms based on the continued existence of those relations. Reforms, that is, that do not affect the relations between capital and labor at all, and that at best reduce the cost and simplify the paperwork of bourgeois government.
  modern_status: seed
  notes: ''
