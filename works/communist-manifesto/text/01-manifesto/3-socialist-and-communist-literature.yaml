- id: III.56.1
  kind: p
  original: Sie verwerfen daher alle politische, namentlich alle revolutionäre Aktion, sie wollen ihr Ziel auf friedlichem Wege erreichen und versuchen, durch kleine, natürlich fehlschlagende Experimente, durch die Macht des Beispiels dem neuen gesellschaftlichen Evangelium Bahn zu brechen.
  en: Hence, they reject all political, and especially all revolutionary action; they wish to attain their ends by peaceful means, necessarily doomed to failure, and by the force of example, to pave the way for the new social Gospel.
  modern: So they reject all political action, and especially all revolutionary action. They want to reach their goals by peaceful means. They try, through small experiments that are necessarily doomed to fail, and through the force of example, to pave the way for the new social gospel.
  modern_status: seed
