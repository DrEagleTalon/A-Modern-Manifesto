  en: 'Protective duties: for the benefit of the working class. Prison Reform: for the benefit of the working class. This is the last word and the only seriously meant word of bourgeois socialism.'
  modern: Free trade - for the benefit of the working class. Protective tariffs - for the benefit of the working class. Prison reform - for the benefit of the working class. That is the last word, and the only seriously meant word, of bourgeois socialism.
