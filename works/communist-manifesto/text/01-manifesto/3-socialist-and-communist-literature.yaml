  mew_page: '491'
- id: III.59.7
  kind: p
  original: Allmählich fallen sie in die Kategorie der oben geschilderten reaktionären oder konservativen Sozialisten und unterscheiden sich nur noch von ihnen durch mehr systematische Pedanterie, durch den fanatischen Aberglauben an die Wunderwirkungen ihrer sozialen Wissenschaft.
  en: By degrees, they sink into the category of the reactionary [or] conservative Socialists depicted above, differing from these only by more systematic pedantry, and by their fanatical and superstitious belief in the miraculous effects of their social science.
  modern: Gradually they sink into the category of the reactionary conservative socialists described above, differing from them only by more systematic pedantry, and by their fanatical and superstitious belief in the miraculous effects of their social science.
