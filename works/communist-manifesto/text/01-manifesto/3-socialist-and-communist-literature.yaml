- id: III.27.2
  kind: p
  original: Und da sie in der Hand des Deutschen aufhörte, den Kampf einer Klasse gegen die andre auszudrücken, so war der Deutsche sich bewußt, die "französische Einseitigkeit" überwunden, statt wahrer Bedürfnisse das Bedürfnis der Wahrheit und statt der Interessen des Proletariers die Interessen des menschlichen Wesens, des Menschen überhaupt vertreten zu haben, des Menschen, der keiner Klasse, der überhaupt nicht der Wirklichkeit, der nur dem Dunsthimmel der philosophischen Phantasie angehört.
  en: And, since it ceased in the hands of the German to express the struggle of one class with the other, he felt conscious of having overcome "French one-sidedness" and of representing, not true requirements, but the requirements of Truth; not the interests of the proletariat, but the interests of Human Nature, of Man in general, who belongs to no class, has no reality, who exists only in the misty realm of philosophical fantasy.
  modern: And since it no longer, in the hands of the German, expressed the struggle of one class against another, the German felt proud of having overcome "French one-sidedness" and of representing, not true demands, but the demands of truth - not the interests of the proletariat, but the interests of Human Nature, of Man in general, who belongs to no class, has no reality, and exists only in the foggy world of philosophical fantasy.
  modern_status: seed
  notes: ''
  mew_page: '486'
- id: III.28.1
  kind: p
  original: Dieser deutsche Sozialismus, der seine unbeholfenen Schulübungen so ernst und feierlich nahm und so marktschreierisch ausposaunte, verlor indes nach und nach seine pedantische Unschuld.
  en: This German socialism, which took its schoolboy task so seriously and solemnly, and extolled its poor stock-in-trade in such a mountebank fashion, meanwhile gradually lost its pedantic innocence.
  modern: This German socialism, which took its schoolboy task so seriously and solemnly, and which hawked its poor stock with such showy self-importance, gradually lost its pedantic innocence.
  modern_status: seed
  notes: ''
  mew_page: '486'
- id: III.29.1
  kind: p
  original: Der Kampf der deutschen, namentlich der preußischen Bourgeoisie gegen die Feudalen und das absolute Königtum, mit einem Wort, die liberale Bewegung wurde ernsthafter.
  en: The fight of the Germans, and especially of the Prussian bourgeoisie, against feudal aristocracy and absolute monarchy, in other words, the liberal movement, became more earnest.
  modern: The fight of the German - and especially the Prussian - bourgeoisie against feudal aristocracy and absolute monarchy, in other words the liberal movement, became more serious.
  modern_status: seed
  notes: ''
  mew_page: '486'
- id: III.30.1
  kind: p
  original: Dem "wahren" Sozialismus war so erwünschte Gelegenheit geboten, der politischen Bewegung die sozialistische Forderung gegenüberzustellen, die überlieferten Anatheme gegen den Liberalismus, gegen den Repräsentativstaat, gegen die bürgerliche Konkurrenz, bürgerliche Preßfreiheit, bürgerliches Recht, bürgerliche Freiheit und Gleichheit zu schleudern und der Volksmasse vorzupredigen, wie sie bei dieser bürgerlichen Bewegung nichts zu gewinnen, vielmehr alles zu verlieren habe.
  en: By this, the long-wished for opportunity was offered to "True" Socialism of confronting the political movement with the Socialist demands, of hurling the traditional anathemas against liberalism, against representative government, against bourgeois competition, bourgeois freedom of the press, bourgeois legislation, bourgeois liberty and equality, and of preaching to the masses that they had nothing to gain, and everything to lose, by this bourgeois movement.
  modern: This gave "True" Socialism the long-awaited chance to confront the political movement with its socialist demands, to hurl traditional curses against liberalism, against representative government, against bourgeois competition, bourgeois freedom of the press, bourgeois legislation, bourgeois liberty and equality. It preached to the masses that they had nothing to gain and everything to lose from this bourgeois movement.
  modern_status: seed
  notes: ''
  mew_page: '487'
- id: III.30.2
  kind: p
  original: Der deutsche Sozialismus vergaß rechtzeitig, daß die französische Kritik, deren geistloses Echo er war, die moderne bürgerliche Gesellschaft mit den entsprechenden materiellen Lebensbedingungen und der angemessenen politischen Konstitution vorausgesetzt, lauter Voraussetzungen, um deren Erkämpfung es sich erst in Deutschland handelte.
  en: German Socialism forgot, in the nick of time, that the French criticism, whose silly echo it was, presupposed the existence of modern bourgeois society, with its corresponding economic conditions of existence, and the political constitution adapted thereto, the very things whose attainment was the object of the pending struggle in Germany.
  modern: German socialism conveniently forgot that the French criticism it was a silly echo of assumed the existence of modern bourgeois society - with its matching economic conditions and matching political constitution - the very things the pending fight in Germany was about trying to achieve.
