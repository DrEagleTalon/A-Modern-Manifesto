  modern: For the German philosophers of the eighteenth century, the demands of the first French Revolution meant no more than the demands of "Practical Reason" in general. The voice of the revolutionary French bourgeoisie was, in their eyes, the law of pure Will - of Will as it was supposed to be, of true human Will in general.
