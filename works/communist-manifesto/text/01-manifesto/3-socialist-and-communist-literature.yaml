- id: III.58.4
  kind: p
  original: Ihre positiven Sätze über die zukünftige Gesellschaft, z.B. Aufhebung des Gegensatzes zwischen Stadt und Land, der Familie, des Privaterwerbs, der Lohnarbeit, die Verkündigung der gesellschaftlichen Harmonie, die Verwandlung des Staates in eine bloße Verwaltung der Produktion - alle diese ihre Sätze drücken bloß das Wegfallen des Klassengegensatzes aus, der eben erst sich zu entwickeln beginnt, den sie nur noch in seiner ersten gestaltlosen Unbestimmtheit kennen.
  en: The practical measures proposed in them - such as the abolition of the distinction between town and country, of the family, of the carrying on of industries for the account of private individuals, and of the wage system, the proclamation of social harmony, the conversion of the function of the state into a mere superintendence of production - all these proposals point solely to the disappearance of class antagonisms which were, at that time, only just cropping up, and which, in these publications, are recognised in their earliest indistinct and undefined forms only.
  modern: The practical measures they propose - such as the abolition of the distinction between town and country, the abolition of the family, the abolition of industry being run for the account of private individuals, the abolition of the wage system, the proclamation of social harmony, the conversion of the functions of the state into a mere supervision of production - all these proposals point only to the disappearance of class antagonisms that were, at that time, only just emerging, and that in these writings are recognized only in their earliest, indistinct, and undefined forms.
  modern_status: seed
