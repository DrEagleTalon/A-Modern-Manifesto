  mew_page: '491'
- id: III.59.1
  kind: p
  original: Die Bedeutung des kritisch-utopistischen Sozialismus oder Kommunismus steht im umgekehrten Verhältnis zur geschichtlichen Entwicklung.
  en: The significance of Critical-Utopian Socialism and Communism bears an inverse relation to historical development.
  modern: The significance of Critical-Utopian Socialism and Communism stands in inverse relation to historical development.
  modern_status: seed
  notes: ''
  mew_page: '491'
- id: III.59.2
  kind: p
  original: In demselben Maße, worin der Klassenkampf sich entwickelt und gestaltet, verliert diese phantastische Erhebung über denselben, diese phantastische Bekämpfung desselben allen praktischen Wert, alle theoretische Berechtigung.
  en: In proportion as the modern class struggle develops and takes definite shape, this fantastic standing apart from the contest, these fantastic attacks on it, lose all practical value and all theoretical justification.
  modern: As the modern class struggle develops and takes definite shape, this fantastic standing apart from the fight - these fantastic attacks on the fight - lose all practical value and all theoretical justification.
  modern_status: seed
  notes: ''
  mew_page: '491'
- id: III.59.3
  kind: p
  original: Waren daher die Urheber dieser Systeme auch in vieler Beziehung revolutionär, so bilden ihre Schüler jedesmal reaktionäre Sekten.
  en: Therefore, although the originators of these systems were, in many respects, revolutionary, their disciples have, in every case, formed mere reactionary sects.
  modern: So although the originators of these systems were revolutionary in many respects, their disciples have in every case turned into mere reactionary sects.
  modern_status: seed
  notes: ''
  mew_page: '491'
- id: III.59.4
  kind: p
  original: Sie halten die alten Anschauungen der Meister fest gegenüber der geschichtlichen Fortentwicklung des Proletariats.
  en: They hold fast by the original views of their masters, in opposition to the progressive historical development of the proletariat.
  modern: They hold fast to the original views of their masters in opposition to the progressive historical development of the proletariat.
  modern_status: seed
  notes: ''
  mew_page: '491'
- id: III.59.5
  kind: p
  original: Sie suchen daher konsequent den Klassenkampf wieder abzustumpfen und die Gegensätze zu vermitteln.
  en: They, therefore, endeavour, and that consistently, to deaden the class struggle and to reconcile the class antagonisms.
  modern: So they try, consistently, to dull the class struggle and to reconcile the class antagonisms.
  modern_status: seed
  notes: ''
  mew_page: '491'
- id: III.59.6
  kind: p
  original: Sie träumen noch immer die versuchsweise Verwirklichung ihrer gesellschaftlichen Utopien, Stiftung einzelner Phalanstere, Gründung von Home-Kolonien, Errichtung eines kleinen Ikariens - Duodezausgabe des neuen Jerusalems -, und zum Aufbau aller dieser spanischen Schlösser müssen sie an die Philanthropie der bürgerlichen Herzen und Geldsäcke appellieren.
  en: They still dream of experimental realisation of their social Utopias, of founding isolated "phalansteres", of establishing "Home Colonies", or setting up a "Little Icaria" - duodecimo editions of the New Jerusalem - and to realise all these castles in the air, they are compelled to appeal to the feelings and purses of the bourgeois.
  modern: They still dream of the experimental realization of their social utopias - of founding isolated model communities, of establishing "Home Colonies," of setting up a "Little Icaria" - pocket editions of the New Jerusalem. To make all these castles in the air real, they have to appeal to the feelings and the pocketbooks of the bourgeois.
