- id: III.49.1
  kind: p
  original: Die ersten Versuche des Proletariats, in einer Zeit allgemeiner Aufregung, in der Periode des Umsturzes der feudalen Gesellschaft direkt sein eigenes Klasseninteresse durchzusetzen, scheiterten notwendig an der unentwickelten Gestalt des Proletariats selbst wie an dem Mangel der materiellen Bedingungen seiner Befreiung, die eben erst das Produkt der bürgerliche Epoche sind.
  en: The first direct attempts of the proletariat to attain its own ends, made in times of universal excitement, when feudal society was being overthrown, necessarily failed, owing to the then undeveloped state of the proletariat, as well as to the absence of the economic conditions for its emancipation, conditions that had yet to be produced, and could be produced by the impending bourgeois epoch alone.
  modern: The first direct attempts of the proletariat to achieve its own ends, made in times of mass excitement when feudal society was being overthrown, necessarily failed. They failed because of the then-undeveloped state of the proletariat, and because the economic conditions for its emancipation did not yet exist. Those conditions still had to be produced, and only the coming bourgeois age could produce them.
  modern_status: seed
  notes: ''
  mew_page: '489'
- id: III.49.2
  kind: p
  original: Die revolutionäre Literatur, welche diese ersten Bewegungen des Proletariats begleitete, ist dem Inhalt nach notwendig reaktionär.
  en: The revolutionary literature that accompanied these first movements of the proletariat had necessarily a reactionary character.
  modern: The revolutionary literature that accompanied these first movements of the proletariat necessarily had a reactionary character.
  modern_status: seed
  notes: ''
  mew_page: '489'
- id: III.49.3
  kind: p
  original: Sie lehrt einen allgemeinen Asketismus und eine rohe Gleichmacherei.
  en: It inculcated universal asceticism and social levelling in its crudest form.
  modern: It preached universal self-denial and social leveling in its crudest form.
