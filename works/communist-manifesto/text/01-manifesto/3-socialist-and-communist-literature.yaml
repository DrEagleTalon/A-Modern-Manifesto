- id: III.2.1
  kind: heading
  original: a) Der feudale Sozialismus
  en: A. Feudal Socialism
  modern: A. Feudal Socialism
  modern_status: seed
  notes: ''
  mew_page: '482'
- id: III.3.1
  kind: p
  original: Die französische und englische Aristokratie war ihrer geschichtlichen Stellung nach dazu berufen, Pamphlete gegen die moderne bürgerliche Gesellschaft zu schreiben.
  en: Owing to their historical position, it became the vocation of the aristocracies of France and England to write pamphlets against modern bourgeois society.
  modern: Because of their historical position, the aristocracies of France and England took it on themselves to write pamphlets attacking modern bourgeois society.
  modern_status: seed
  notes: ''
  mew_page: '482'
- id: III.3.2
  kind: p
  original: In der französischen Junirevolution von 1830, in der englischen Reformbewegung war sie noch einmal dem verhaßten Emporkömmling erlegen.
  en: In the French Revolution of July 1830, and in the English reform agitation, these aristocracies again succumbed to the hateful upstart.
  modern: In the French revolution of July 1830, and in the English reform agitation, these aristocracies got beaten again by the upstart bourgeoisie they hated.
  modern_status: seed
  notes: ''
  mew_page: '482'
- id: III.3.3
  kind: p
  original: Von einem ernsten politischen Kampfe konnte nicht mehr die Rede sein.
  en: Thenceforth, a serious political struggle was altogether out of the question.
  modern: A serious political contest was out of the question from then on.
  modern_status: seed
  notes: ''
  mew_page: '482'
- id: III.3.4
  kind: p
  original: Nur der literarische Kampf blieb ihr übrig.
  en: A literary battle alone remained possible.
  modern: All that was left was a literary fight.
  modern_status: seed
  notes: ''
  mew_page: '482'
- id: III.3.5
  kind: p
  original: Aber auch auf dem Gebiete der Literatur waren die alten Redensarten der Restaurationszeit unmöglich geworden.
  en: But even in the domain of literature the old cries of the restoration period had become impossible.
  modern: But even in literature the old slogans of the restoration period had become impossible.
  modern_status: seed
  notes: ''
  footnotes:
  - N4
  mew_page: '482'
- id: III.3.6
  kind: p
  original: Um Sympathie zu erregen, mußte die Aristokratie scheinbar ihre Interessen aus dem Auge verlieren und nur im Interesse der exploitierten Arbeiterklasse ihren Anklageakt gegen die Bourgeoisie formulieren.
  en: In order to arouse sympathy, the aristocracy was obliged to lose sight, apparently, of its own interests, and to formulate their indictment against the bourgeoisie in the interest of the exploited working class alone.
  modern: To win sympathy, the aristocracy had to pretend to lose sight of its own interests and to frame its complaint against the bourgeoisie purely in the interest of the exploited working class.
  modern_status: seed
  notes: ''
  variants:
  - ref: T53
    editions: 1848, 1872, 1883
    reading: den Augen
    base_text: … Interessen aus dem Auge ‸ verlieren und nur im …
  - ref: T54
    editions: '1848'
    reading: 'eingefügt: noch'
    base_text: … Auge verlieren und nur ‸ im Interesse der exploitierten …
  mew_page: 482-483
- id: III.3.7
  kind: p
  original: Sie bereitete so die Genugtuung vor, Schmählieder auf ihren neuen Herrscher zu singen und mehr oder minder unheilschwangere Prophezeiungen ihm ins Ohr raunen zu dürfen.
  en: Thus, the aristocracy took their revenge by singing lampoons on their new masters and whispering in his ears sinister prophesies of coming catastrophe.
  modern: So the aristocracy got its revenge by writing biting satires against its new master, and by whispering dark prophecies of a coming catastrophe in his ear.
  modern_status: seed
  notes: ''
  mew_page: '483'
- id: III.4.1
  kind: p
  original: Auf diese Art entstand der feudalistische Sozialismus, halb Klagelied, halb Pasquill, halb Rückhall der Vergangenheit, halb Dräuen der Zukunft, mitunter die Bourgeoisie ins Herz treffend durch bitteres, geistreich zerreißendes Urteil, stets komisch wirkend durch gänzliche Unfähigkeit, den Gang der modernen Geschichte zu begreifen.
  en: 'In this way arose feudal Socialism: half lamentation, half lampoon; half an echo of the past, half menace of the future; at times, by its bitter, witty and incisive criticism, striking the bourgeoisie to the very heart''s core; but always ludicrous in its effect, through total incapacity to comprehend the march of modern history.'
  modern: 'That is how feudal socialism arose: half lament, half lampoon; half echo of the past, half warning of the future; sometimes striking the bourgeoisie at the heart with sharp, witty criticism, but always ridiculous in its effect, because it was totally incapable of understanding the direction of modern history.'
  modern_status: seed
  notes: ''
  mew_page: '483'
- id: III.5.1
  kind: p
  original: Den proletarischen Bettelsack schwenkten sie als Fahne in der Hand, um das Volk hinter sich her zu versammeln.
  en: The aristocracy, in order to rally the people to them, waved the proletarian alms-bag in front for a banner.
  modern: To rally the people to them, the aristocrats waved the proletarian beggar's bag like a banner.
  modern_status: seed
  notes: ''
  variants:
  - ref: T55
    editions: 1848, 1872
    reading: Bettlersack
    base_text: … Den proletarischen Bettelsack ‸ schwenkten sie als Fahne …
  mew_page: '483'
- id: III.5.2
  kind: p
  original: Sooft es ihnen aber folgte, erblickte es auf ihrem Hintern die alten feudalen Wappen und verlief sich mit lautem und unehrerbietigem Gelächter.
  en: But the people, so often as it joined them, saw on their hindquarters the old feudal coats of arms, and deserted with loud and irreverent laughter.
  modern: But whenever the people went along with them, they saw the old feudal coat of arms on the aristocrats' backs, and deserted with loud, disrespectful laughter.
  modern_status: seed
  notes: ''
  mew_page: '483'
- id: III.6.1
  kind: p
  original: Ein Teil der französischen Legitimisten und das Junge England gaben dies Schauspiel zum besten.
  en: One section of the French Legitimists and "Young England" exhibited this spectacle.
  modern: One section of the French royalist ultras, along with the "Young England" group of conservative reformers, put on this spectacle.
  modern_status: seed
  notes: ''
  mew_page: '483'
- id: III.7.1
  kind: p
  original: Wenn die Feudalen beweisen, daß ihre Weise der Ausbeutung anders gestaltet war als die bürgerliche Ausbeutung, so vergessen sie nur, daß sie unter gänzlich verschiedenen und jetzt überlebten Umständen und Bedingungen ausbeuteten.
  en: In pointing out that their mode of exploitation was different to that of the bourgeoisie, the feudalists forget that they exploited under circumstances and conditions that were quite different and that are now antiquated.
  modern: When they insisted that their way of exploiting was different from the bourgeoisie's, the feudalists conveniently forgot that they had exploited under completely different, now outdated conditions.
  modern_status: seed
  notes: ''
  mew_page: '483'
- id: III.7.2
  kind: p
  original: Wenn sie nachweisen, daß unter ihrer Herrschaft nicht das moderne Proletariat existiert hat, so vergessen sie nur, daß eben die moderne Bourgeoisie ein notwendiger Sprößling ihrer Gesellschaftsordnung war.
  en: In showing that, under their rule, the modern proletariat never existed, they forget that the modern bourgeoisie is the necessary offspring of their own form of society.
  modern: When they said that the modern proletariat never existed under their rule, they forgot that the modern bourgeoisie is the necessary offspring of their own social form.
  modern_status: seed
  notes: ''
  mew_page: '483'
- id: III.8.1
  kind: p
  original: Übrigens verheimlichen sie den reaktionären Charakter ihrer Kritik so wenig, daß ihre Hauptanklage gegen die Bourgeoisie eben darin besteht, unter ihrem Regime entwickle sich eine Klasse, welche die ganze alte Gesellschaftsordnung in die Luft sprengen werde.
  en: For the rest, so little do they conceal the reactionary character of their criticism that their chief accusation against the bourgeois amounts to this, that under the bourgeois régime a class is being developed which is destined to cut up root and branch the old order of society.
  modern: 'For the rest, they barely concealed the reactionary character of their criticism. Their main accusation against the bourgeoisie amounted to this: that under the bourgeois order a class was being created that was destined to tear the old order up root and branch.'
  modern_status: seed
  notes: ''
  mew_page: '483'
- id: III.9.1
  kind: p
  original: Sie werfen der Bourgeoisie mehr noch vor, daß sie ein revolutionäres Proletariat, als daß sie überhaupt ein Proletariat erzeugt.
  en: What they upbraid the bourgeoisie with is not so much that it creates a proletariat as that it creates a revolutionary proletariat.
  modern: What they really accused the bourgeoisie of was not so much that it created a proletariat, but that it created a revolutionary proletariat.
  modern_status: seed
  notes: ''
  mew_page: '483'
- id: III.10.1
  kind: p
  original: In der politischen Praxis nehmen sie daher an allen Gewaltmaßregeln gegen die Arbeiterklasse teil, und im gewöhnlichen Leben bequemen sie sich, allen ihren aufgeblähten Redensarten zum Trotz die goldnen Äpfel aufzulesen und Treue, Liebe, Ehre mit dem Schacher in Schafswolle, Runkelrüben und Schnaps zu vertauschen.
  en: In political practice, therefore, they join in all coercive measures against the working class; and in ordinary life, despite their high-falutin phrases, they stoop to pick up the golden apples dropped from the tree of industry, and to barter truth, love, and honour, for traffic in wool, beetroot-sugar, and potato spirits.
  modern: In practical politics, then, they joined in every attempt to crush the working class. And in ordinary life, despite all their high-flown talk, they stooped to pick up the golden apples dropped from the tree of industry - bartering truth, love, and honor for a trade in wool, beet-sugar, and potato liquor.
  modern_status: seed
  notes: ''
  footnotes:
  - N5
  variants:
  - ref: T56
    editions: '1888'
    reading: 'eingefügt: Äpfel, die vom Baum der Industrie abgefallen sind,'
    base_text: … Trotz die goldnen Äpfel ‸ aufzulesen und Treue, Liebe, …
  mew_page: '483'
- id: III.11.1
  kind: p
  original: Wie der Pfaffe immer Hand in Hand ging mit dem Feudalen, so der pfäffische Sozialismus mit dem feudalistischen.
  en: As the parson has ever gone hand in hand with the landlord, so has Clerical Socialism with Feudal Socialism.
  modern: Just as the parson has always walked hand in hand with the landlord, so clerical socialism has walked hand in hand with feudal socialism.
  modern_status: seed
  notes: ''
  mew_page: '483'
- id: III.12.1
  kind: p
  original: Nichts leichter, als dem christlichen Asketismus einen sozialistischen Anstrich zu geben.
  en: Nothing is easier than to give Christian asceticism a Socialist tinge.
  modern: Nothing is easier than giving Christian self-denial a socialist tinge.
  modern_status: seed
  notes: ''
  mew_page: '484'
- id: III.12.2
  kind: p
  original: Hat das Christentum nicht auch gegen das Privateigentum, gegen die Ehe, gegen die Staat geeifert?
  en: Has not Christianity declaimed against private property, against marriage, against the State?
  modern: Has not Christianity railed against private property, against marriage, against the state?
  modern_status: seed
  notes: ''
  mew_page: '484'
- id: III.12.3
  kind: p
  original: Hat es nicht die Wohltätigkeit und den Bettel, das Zölibat und die Fleischesertötung, das Zellenleben und die Kirche an ihrer Stelle gepredigt?
  en: Has it not preached in the place of these, charity and poverty, celibacy and mortification of the flesh, monastic life and Mother Church?
  modern: Has it not preached, in their place, charity and poverty, celibacy and mortification of the flesh, monastic life and the Mother Church?
  modern_status: seed
  notes: ''
  variants:
  - ref: T57
    editions: '1848'
    reading: ihre
    base_text: … die Kirche an ihrer ‸ Stelle gepredigt? …
  mew_page: '484'
- id: III.12.4
  kind: p
  original: Der christliche Sozialismus ist nur das Weihwasser, womit der Pfaffe den Ärger des Aristokraten einsegnet.
  en: Christian Socialism is but the holy water with which the priest consecrates the heart-burnings of the aristocrat.
  modern: Christian socialism is just the holy water with which the priest blesses the aristocrat's heartburn.
  modern_status: seed
  notes: ''
  variants:
  - ref: T58
    editions: '1848'
    reading: heilige
    base_text: … Der christliche ‸ Sozialismus ist nur das …
  mew_page: '484'
- id: III.13.1
  kind: heading
  original: b) Kleinbürgerlicher Sozialismus
  en: B. Petty-Bourgeois Socialism
  modern: B. Petty-Bourgeois Socialism
  modern_status: seed
  notes: ''
  mew_page: '484'
- id: III.14.1
  kind: p
  original: Die feudale Aristokratie ist nicht die einzige Klasse, welche durch die Bourgeoisie gestürzt wurde, deren Lebensbedingungen in der modernen bürgerlichen Gesellschaft verkümmerten und abstarben.
  en: The feudal aristocracy was not the only class that was ruined by the bourgeoisie, not the only class whose conditions of existence pined and perished in the atmosphere of modern bourgeois society.
  modern: The feudal aristocracy was not the only class the bourgeoisie ruined - not the only class whose conditions of existence shriveled and died in the atmosphere of modern bourgeois society.
  modern_status: seed
  notes: ''
  mew_page: '484'
- id: III.14.2
  kind: p
  original: Das mittelalterliche Pfahlbürgertum und der kleine Bauernstand waren die Vorläufer der modernen Bourgeoisie.
  en: The medieval burgesses and the small peasant proprietors were the precursors of the modern bourgeoisie.
  modern: The medieval townspeople and small peasant owners were the forerunners of the modern bourgeoisie.
  modern_status: seed
  notes: ''
  mew_page: '484'
- id: III.14.3
  kind: p
  original: In den weniger industriell und kommerziell entwickelten Ländern vegetiert diese Klasse noch fort neben der aufkommenden Bourgeoisie.
  en: In those countries which are but little developed, industrially and commercially, these two classes still vegetate side by side with the rising bourgeoisie.
  modern: In countries that are only slightly developed industrially and commercially, these two classes still drag on alongside the rising bourgeoisie.
  modern_status: seed
  notes: ''
  mew_page: '484'
- id: III.15.1
  kind: p
  original: In den Ländern, wo sich die moderne Zivilisation entwickelt hat, hat sich eine neue Kleinbürgerschaft gebildet, die zwischen dem Proletariat und der Bourgeoisie schwebt und als ergänzender Teil der bürgerlichen Gesellschaft stets von neuem sich bildet, deren Mitglieder aber beständig durch die Konkurrenz ins Proletariat hinabgeschleudert werden, ja selbst mit der Entwicklung der großen Industrie einen Zeitpunkt herannahen sehen, wo sie als selbständiger Teil der modernen Gesellschaft gänzlich verschwinden und im Handel, in der Manufaktur, in der Agrikultur durch Arbeitsaufseher und Domestiken ersetzt werden.
  en: In countries where modern civilisation has become fully developed, a new class of petty bourgeois has been formed, fluctuating between proletariat and bourgeoisie, and ever renewing itself as a supplementary part of bourgeois society. The individual members of this class, however, are being constantly hurled down into the proletariat by the action of competition, and, as modern industry develops, they even see the moment approaching when they will completely disappear as an independent section of modern society, to be replaced in manufactures, agriculture and commerce, by overlookers, bailiffs and shopmen.
  modern: In countries where modern civilization is fully developed, a new class of petty bourgeoisie has formed. It floats between the proletariat and the bourgeoisie, constantly renewing itself as a supplement to bourgeois society. But its individual members are constantly being hurled down into the proletariat by competition. As modern industry develops, they see the moment approaching when they will disappear entirely as a distinct section of modern society, to be replaced, in manufacturing, agriculture, and commerce, by supervisors, foremen, and shop clerks.
  modern_status: seed
  notes: ''
  mew_page: '484'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.16.1
  kind: p
  original: In Ländern wie Frankreich, wo die Bauernklasse weit mehr als die Hälfte der Bevölkerung ausmacht, war es natürlich, daß Schriftsteller, die für das Proletariat gegen die Bourgeoisie auftraten, an ihre Kritik des Bourgeoisregimes den kleinbürgerlichen und kleinbäuerlichen Maßstab anlegten und die Partei der Arbeiter vom Standpunkt des Kleinbürgertums ergriffen.
  en: In countries like France, where the peasants constitute far more than half of the population, it was natural that writers who sided with the proletariat against the bourgeoisie should use, in their criticism of the bourgeois régime, the standard of the peasant and petty bourgeois, and from the standpoint of these intermediate classes, should take up the cudgels for the working class.
  modern: In countries like France, where peasants make up far more than half the population, it was natural that writers who sided with the proletariat against the bourgeoisie would use the standpoint of the peasant and the petty bourgeois when criticizing the bourgeois order, and would take up the fight for the working class from that in-between position.
  modern_status: seed
  notes: ''
  mew_page: '484'
- id: III.16.2
  kind: p
  original: Es bildete sich so der kleinbürgerliche Sozialismus.
  en: Thus arose petty-bourgeois Socialism.
  modern: This is how petty-bourgeois socialism arose.
  modern_status: seed
  notes: ''
  mew_page: '484'
- id: III.16.3
  kind: p
  original: Sismondi ist das Haupt dieser Literatur nicht nur für Frankreich, sondern auch für England.
  en: Sismondi was the head of this school, not only in France but also in England.
  modern: Sismondi was the head of this school, both in France and in England.
  modern_status: seed
  notes: ''
  mew_page: '484'
- id: III.17.1
  kind: p
  original: Dieser Sozialismus zergliederte höchst scharfsinnig die Widersprüche in den modernen Produktionsverhältnissen.
  en: This school of Socialism dissected with great acuteness the contradictions in the conditions of modern production.
  modern: This school of socialism dissected the contradictions in modern production with sharp precision.
  modern_status: seed
  notes: ''
  mew_page: '484'
- id: III.17.2
  kind: p
  original: Er enthüllte die gleisnerischen Beschönigungen der Ökonomen.
  en: It laid bare the hypocritical apologies of economists.
  modern: It exposed the hypocritical apologies of the economists.
  modern_status: seed
  notes: ''
  mew_page: 484-485
- id: III.17.3
  kind: p
  original: Er wies unwiderleglich die zerstörenden Wirkungen der Maschinerie und der Teilung der Arbeit nach, die Konzentration der Kapitalien und des Grundbesitzes, die Überproduktion, die Krisen, den notwendigen Untergang der kleinen Bürger und Bauern, das Elend des Proletariats, die Anarchie in der Produktion, die schreienden Mißverhältnisse in der Verteilung des Reichtums, den industriellen Vernichtungskrieg der Nationen untereinander, die Auflösung der alten Sitten, der alten Familienverhältnisse, der alten Nationalitäten.
  en: It proved, incontrovertibly, the disastrous effects of machinery and division of labour; the concentration of capital and land in a few hands; overproduction and crises; it pointed out the inevitable ruin of the petty bourgeois and peasant, the misery of the proletariat, the anarchy in production, the crying inequalities in the distribution of wealth, the industrial war of extermination between nations, the dissolution of old moral bonds, of the old family relations, of the old nationalities.
  modern: It proved beyond doubt the disastrous effects of machinery and division of labor, the concentration of capital and land in a few hands, overproduction and crises. It pointed out the inevitable ruin of the small bourgeois and the peasant, the misery of the proletariat, the anarchy in production, the crying inequalities in how wealth is distributed, the industrial war of extermination between nations, the breakdown of old moral ties, old family relations, old nationalities.
  modern_status: seed
  notes: ''
  mew_page: '485'
- id: III.18.1
  kind: p
  original: Seinem posititiven Gehalte nach will jedoch dieser Sozialismus entweder die alten Produktions- und Verkehrsmittel wiederherstellen und mit ihnen die alten Eigentumsverhältnisse und die alte Gesellschaft, oder er will die modernen Produktions- und Verkehrsmittel in den Rahmen der alten Eigentumsverhältnisse, die von ihnen gesprengt wurden, gesprengt werden mußten, gewaltsam wieder einsperren.
  en: In its positive aims, however, this form of Socialism aspires either to restoring the old means of production and of exchange, and with them the old property relations, and the old society, or to cramping the modern means of production and of exchange within the framework of the old property relations that have been, and were bound to be, exploded by those means.
  modern: But in its positive program, this kind of socialism aims either to restore the old means of production and exchange - along with the old property relations and the old society - or else to cram the modern means of production and exchange back into the framework of the old property relations that they have already blown up.
  modern_status: seed
  notes: ''
  mew_page: '485'
- id: III.18.2
  kind: p
  original: In beiden Fällen ist er reaktionär und utopisch zugleich.
  en: In either case, it is both reactionary and Utopian.
  modern: In either case, it is both reactionary and utopian.
  modern_status: seed
  notes: ''
  mew_page: '485'
- id: III.18.3
  kind: p
  original: Zunftwesen in der Manufaktur und patriarchalische Wirtschaft auf dem Lande, das sind seine letzten Worte.
  en: 'Its last words are: corporate guilds for manufacture; patriarchal relations in agriculture.'
  modern: 'Its final pronouncements are: corporate guilds for manufacturing, patriarchal relations in agriculture.'
  modern_status: seed
  notes: ''
  mew_page: '485'
- id: III.19.1
  kind: p
  original: In ihrer weiteren Entwicklung hat sich diese Richtung in einen feigen Katzenjammer verlaufen.
  en: Ultimately, when stubborn historical facts had dispersed all intoxicating effects of self-deception, this form of Socialism ended in a miserable fit of the blues.
  modern: In the end, when stubborn historical facts had cleared away all the intoxicating self-deception, this form of socialism ended in a miserable fit of the blues.
  modern_status: seed
  notes: ''
  variants:
  - ref: T59
    editions: '1888'
    reading: 'lautet dieser Satz: Schließlich, als die hartnäckigen geschichtlichen Tatsachen jeden Rausch des Selbstbetrugs verscheucht hatten, artete diese Form des Sozialismus in einen erbärmlichen Katzenjammer aus.'
    base_text: … einen feigen Katzenjammer verlaufen ‸ . …
  mew_page: '485'
- id: III.20.1
  kind: heading
  original: c) Der deutsche oder "wahre" Sozialismus
  en: C. German or "True" Socialism
  modern: C. German, or "True," Socialism
  modern_status: seed
  notes: ''
  mew_page: '485'
- id: III.21.1
  kind: p
  original: Die sozialistische und kommunistische Literatur Frankreichs, die unter dem Druck einer herrschenden Bourgeoisie entstand und der literarische Ausdruck des Kampfes gegen diese Herrschaft ist, wurde nach Deutschland eingeführt zu einer Zeit, wo die Bourgeoisie soeben ihren Kampf gegen den feudalen Absolutismus begann.
  en: The Socialist and Communist literature of France, a literature that originated under the pressure of a bourgeoisie in power, and that was the expressions of the struggle against this power, was introduced into Germany at a time when the bourgeoisie, in that country, had just begun its contest with feudal absolutism.
  modern: The socialist and communist literature of France, which arose under the pressure of a ruling bourgeoisie and was the expression of the fight against that power, was imported into Germany at a time when the German bourgeoisie had just begun its own fight against feudal absolutism.
  modern_status: seed
  notes: ''
  mew_page: '485'
- id: III.22.1
  kind: p
  original: Deutsche Philosophen, Halbphilosophen und Schöngeister bemächtigten sich gierig dieser Literatur und vergaßen nur, daß bei der Einwanderung jener Schriften aus Frankreich die französischen Lebensverhältnisse nicht gleichzeitig nach Deutschland eingewandert waren.
  en: German philosophers, would-be philosophers, and beaux esprits (men of letters), eagerly seized on this literature, only forgetting, that when these writings immigrated from France into Germany, French social conditions had not immigrated along with them.
  modern: German philosophers, would-be philosophers, and clever wits eagerly seized on this literature, forgetting that when these writings emigrated from France to Germany, French social conditions did not emigrate along with them.
  modern_status: seed
  notes: ''
  mew_page: '485'
- id: III.22.2
  kind: p
  original: Den deutschen Verhältnissen gegenüber verlor die französische Literatur alle unmittelbar praktische Bedeutung und nahm ein rein literarisches Aussehen an.
  en: In contact with German social conditions, this French literature lost all its immediate practical significance and assumed a purely literary aspect.
  modern: In contact with German social conditions, this French literature lost all its immediate practical meaning and took on a purely literary character.
  modern_status: seed
  notes: ''
  mew_page: '485'
- id: III.22.3
  kind: p
  original: Als müßige Spekulation über die Verwirklichung des menschlichen Wesens mußte sie erscheinen.
