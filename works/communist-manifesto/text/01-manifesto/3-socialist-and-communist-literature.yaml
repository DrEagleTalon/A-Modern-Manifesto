  kind: p
  original: Er diente den deutschen absoluten Regierungen mit ihrem Gefolge von Pfaffen, Schulmeistern, Krautjunkern und Bürokraten als erwünschte Vogelscheuche gegen die drohend aufstrebende Bourgeoisie.
  en: To the absolute governments, with their following of parsons, professors, country squires, and officials, it served as a welcome scarecrow against the threatening bourgeoisie.
