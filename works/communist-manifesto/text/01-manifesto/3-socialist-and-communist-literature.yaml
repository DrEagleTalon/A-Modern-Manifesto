- id: III.42.6
  kind: p
  original: Wenn er das Proletariat auffordert, seine Systeme zu verwirklichen und in das neue Jerusalem einzugehen, so verlangt er im Grunde nur, daß es in der jetzigen Gesellschaft stehenbleibe, aber seine gehässigen Vorstellungen von derselben abstreife.
