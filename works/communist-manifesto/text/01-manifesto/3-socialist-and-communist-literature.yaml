- id: III.51.1
  kind: p
  original: Die Erfinder dieser Systeme sehen zwar den Gegensatz der Klassen wie die Wirksamkeit der auflösenden Elemente in der herrschenden Gesellschaft selbst.
  en: The founders of these systems see, indeed, the class antagonisms, as well as the action of the decomposing elements in the prevailing form of society.
  modern: The founders of these systems do see the class antagonisms, as well as the decomposing elements in the prevailing form of society.
  modern_status: seed
  notes: ''
  mew_page: '490'
- id: III.51.2
  kind: p
  original: Aber sie erblicken auf der Seite des Proletariats keine geschichtliche Selbsttätigkeit, keine ihm eigentümliche politische Bewegung.
  en: But the proletariat, as yet in its infancy, offers to them the spectacle of a class without any historical initiative or any independent political movement.
  modern: But the proletariat, still in its infancy, appears to them as a class without any historical initiative or independent political movement of its own.
  modern_status: seed
  notes: ''
  mew_page: '490'
- id: III.52.1
  kind: p
  original: Da die Entwicklung des Klassengegensatzes gleichen Schritt hält mit der Entwicklung der Industrie, finden sie ebensowenig die materiellen Bedingungen zur Befreiung des Proletariats vor und suchen nach einer sozialen Wissenschaft, nach sozialen Gesetzen, um diese Bedingungen zu schaffen.
  en: Since the development of class antagonism keeps even pace with the development of industry, the economic situation, as they find it, does not as yet offer to them the material conditions for the emancipation of the proletariat. They therefore search after a new social science, after new social laws, that are to create these conditions.
  modern: Since the development of class antagonism keeps pace with the development of industry, the economic situation as they find it does not yet offer the material conditions for the emancipation of the proletariat. So they look for a new social science, new social laws, that are supposed to create those conditions.
  modern_status: seed
  notes: ''
  mew_page: '490'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: III.53.1
  kind: p
  original: An die Stelle der gesellschaftlichen Tätigkeit muß ihre persönlich erfinderische Tätigkeit treten, an die Stelle der geschichtlichen Bedingungen der Befreiung phantastische, an die Stelle der allmählich vor sich gehenden Organisation des Proletariats zur Klasse eine eigens ausgeheckte Organisation der Gesellschaft.
  en: Historical action is to yield to their personal inventive action; historically created conditions of emancipation to fantastic ones; and the gradual, spontaneous class organisation of the proletariat to an organisation of society especially contrived by these inventors.
  modern: Historical action is to give way to their personal inventive action. Historically created conditions of emancipation are to be replaced by imaginary ones. The gradual, spontaneous self-organization of the proletariat is to be replaced by an organization of society specially designed by these inventors.
  modern_status: seed
  notes: ''
  mew_page: '490'
- id: III.53.2
  kind: p
  original: Die kommende Weltgeschichte löst sich für sie auf in die Propaganda und die praktische Ausführung ihrer Gesellschaftspläne.
  en: Future history resolves itself, in their eyes, into the propaganda and the practical carrying out of their social plans.
  modern: Future history, in their eyes, resolves itself into the propaganda and the practical carrying-out of their social plans.
  modern_status: seed
  notes: ''
  mew_page: '490'
- id: III.54.1
  kind: p
  original: Sie sind sich zwar bewußt, in ihren Plänen hauptsächlich das Interesse der arbeitenden Klasse als der leidendsten Klasse zu vertreten.
  en: In the formation of their plans, they are conscious of caring chiefly for the interests of the working class, as being the most suffering class.
  modern: In designing their plans, they are conscious of caring chiefly for the interests of the working class, as the most suffering class.
  modern_status: seed
  notes: ''
  mew_page: '490'
- id: III.54.2
  kind: p
  original: Nur unter diesem Gesichtspunkt der leidendsten Klasse existiert das Proletariat für sie.
  en: Only from the point of view of being the most suffering class does the proletariat exist for them.
  modern: For them, the proletariat only exists as the most suffering class.
  modern_status: seed
  notes: ''
  mew_page: '490'
- id: III.55.1
  kind: p
  original: Die unentwickelte Form des Klassenkampfes wie ihre eigene Lebenslage bringen es aber mit sich, daß sie weit über jenen Klassengegensatz erhaben zu sein glauben.
  en: The undeveloped state of the class struggle, as well as their own surroundings, causes Socialists of this kind to consider themselves far superior to all class antagonisms.
  modern: The undeveloped state of the class struggle, and their own social surroundings, cause socialists of this kind to consider themselves far above all class antagonisms.
  modern_status: seed
  notes: ''
  mew_page: '490'
- id: III.55.2
  kind: p
  original: Sie wollen die Lebenslage aller Gesellschaftsglieder, auch der bestgestellten, verbessern.
  en: They want to improve the condition of every member of society, even that of the most favoured.
  modern: They want to improve the condition of every member of society, even the most privileged.
  modern_status: seed
  notes: ''
  mew_page: '490'
- id: III.55.3
  kind: p
  original: Sie appellieren daher fortwährend an die ganze Gesellschaft ohne Unterschied, ja vorzugsweise an die herrschende Klasse.
  en: Hence, they habitually appeal to society at large, without the distinction of class; nay, by preference, to the ruling class.
  modern: So they habitually appeal to society at large, without regard to class - in fact, preferably to the ruling class.
  modern_status: seed
  notes: ''
  mew_page: '490'
- id: III.55.4
  kind: p
  original: Man braucht ihr System ja nur zu verstehen, um es als den bestmöglichen Plan der bestmöglichen Gesellschaft anzuerkennen.
  en: For how can people, when once they understand their system, fail to see in it the best possible plan of the best possible state of society?
