- id: 0.1.1
  kind: p
  original: Ein Gespenst geht um in Europa - das Gespenst des Kommunismus.
  en: A spectre is haunting Europe - the spectre of communism.
  modern: A ghost is haunting Europe - the ghost of communism.
  modern_status: seed
  notes: ''
  mew_page: '461'
- id: 0.1.2
  kind: p
  original: Alle Mächte des alten Europa haben sich zu einer heiligen Hetzjagd gegen dies Gespenst verbündet, der Papst und der Zar, Metternich und Guizot, französische Radikale und deutsche Polizisten.
  en: 'All the powers of old Europe have entered into a holy alliance to exorcise this spectre: Pope and Tsar, Metternich and Guizot, French Radicals and German police-spies.'
  modern: 'Every major power in old Europe has joined forces to try to crush it: pope and tsar, kings and ministers, reformers and police alike.'
  modern_status: seed
  notes: 'German Hetzjagd is a hunt (a chase with hounds). Moore''s ''holy alliance'' alludes to the Holy Alliance of 1815 and is not in the German. See glossary: heilige Hetzjagd.'
  mew_page: '461'
- id: 0.2.1
  kind: p
  original: Wo ist die Oppositionspartei, die nicht von ihren regierenden Gegnern als kommunistisch verschrien worden wäre, wo die Oppositionspartei, die den fortgeschritteneren Oppositionsleuten sowohl wie ihren reaktionären Gegnern den brandmarkenden Vorwurf des Kommunismus nicht zurückgeschleudert hätte?
  en: Where is the party in opposition that has not been decried as communistic by its opponents in power? Where is the opposition that has not hurled back the branding reproach of communism, against the more advanced opposition parties, as well as against its reactionary adversaries?
  modern: Where is the opposition that hasn't been labeled "communist" by those in power? And where is the opposition that hasn't thrown that same accusation at others more radical than itself?
  modern_status: seed
  notes: ''
  mew_page: '461'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: 0.3.1
  kind: p
  original: Zweierlei geht aus dieser Tatsache hervor.
  en: 'Two things result from this fact:'
  modern: 'Two things are clear from this:'
  modern_status: seed
  notes: ''
  mew_page: '461'
- id: 0.4.1
  kind: p
  original: Der Kommunismus wird bereits von allen europäischen Mächten als eine Macht anerkannt.
  en: I. Communism is already acknowledged by all European powers to be itself a power.
  modern: First, communism is already recognized by all major powers as a real force.
  modern_status: seed
  notes: ''
  mew_page: '461'
- id: 0.5.1
  kind: p
  original: Es ist hohe Zeit, daß die Kommunisten ihre Anschauungsweise, ihre Zwecke, ihre Tendenzen vor der ganzen Welt offen darlegen und dem Märchen vom Gespenst des Kommunismus ein Manifest der Partei selbst entgegenstellen.
  en: II. It is high time that Communists should openly, in the face of the whole world, publish their views, their aims, their tendencies, and meet this nursery tale of the Spectre of Communism with a manifesto of the party itself.
  modern: Second, it is time for communists to stop hiding. They must openly state what they believe, what they want, and what direction they are moving in - and answer the myths and fears about communism with a clear declaration of their own.
  modern_status: seed
  notes: ''
  variants:
  - ref: T1
    editions: '1848'
    reading: den
    base_text: … offen darlegen und dem ‸ Märchen vom Gespenst des …
  mew_page: '461'
- id: 0.6.1
  kind: p
  original: Zu diesem Zweck haben sich Kommunisten der verschiedensten Nationalität in London versammelt und das folgende Manifest entworfen, das in englischer, französischer, deutscher, italienischer, flämischer und dänischer Sprache veröffentlicht wird.
  en: To this end, Communists of various nationalities have assembled in London and sketched the following manifesto, to be published in the English, French, German, Italian, Flemish and Danish languages.
  modern: With that purpose, communists from different countries have come together and written this manifesto, to be shared across languages and nations.
  modern_status: seed
  notes: ''
  mew_page: '461'
