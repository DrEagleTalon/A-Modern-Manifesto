section: I
title_original: Bourgeois und Proletarier
title_en: Bourgeois and Proletarians
author: Karl Marx and Friedrich Engels
date: 1848-02
original_language: de
anchor_language: de
source_original: MEW 4, S. 459-493 (Dietz, Berlin), text of the 1890 German edition, the last edited by Engels, via mlwerke.de; 1848/1872/1883/1888 variants from MEW's apparatus
source_en: Samuel Moore and Friedrich Engels, English edition of 1888; Marxists Internet Archive transcription proofed against the 1888 edition by Andy Blunden (2004), CC BY-SA
