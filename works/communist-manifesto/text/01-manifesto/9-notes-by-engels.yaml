- id: E1.1.1
  kind: note
  original: ''
  en: Guild-master, that is, a full member of a guild, a master within, not a head of a guild.
  modern: ''
  modern_status: empty
  notes: ''
  note_edition: Engels, 1888 English Edition
  en_note: 'English-only note: Engels explains the English word ''guild-master''; the German text needs no note (Zunftbürger)'
