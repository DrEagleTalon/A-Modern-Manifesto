section: II
title_original: Randglossen zum Programm der deutschen Arbeiterpartei, II
title_en: Marginal notes, II
author: Karl Marx
date: 1875-04/05
original_language: de
anchor_language: de
source_original: MEW 19, S. 15-32 (Dietz, Berlin 1962), zeno.org transcription via the MARX-EBOOKS mirror; from Marx's manuscript, 1891 readings as variants, passages left out in 1891 in < >
