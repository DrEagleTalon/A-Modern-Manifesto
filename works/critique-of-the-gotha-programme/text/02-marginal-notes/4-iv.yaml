section: IV
title_original: Randglossen zum Programm der deutschen Arbeiterpartei, [IV]
title_en: Marginal notes, IV
author: Karl Marx
date: 1875-04/05
original_language: de
anchor_language: de
source_original: MEW 19, S. 15-32 (Dietz, Berlin 1962), zeno.org transcription via the MARX-EBOOKS mirror; from Marx's manuscript, 1891 readings as variants, passages left out in 1891 in < >
source_en: 'None: no public-domain English translation on a reachable mirror yet'
verses:
- id: IV.0.1
  kind: heading
  original: '[IV]'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.1.1
  kind: p
  original: Ich komme jetzt zum demokratischen Abschnitt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.2.1
  kind: p
  original: A. "Freiheitliche Grundlage des Staats"
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.3.1
  kind: p
  original: Zunächst nach II erstrebt die deutsche Arbeiterpartei "den freien Staat".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.4.1
  kind: p
  original: Freier Staat - was ist das?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.5.1
  kind: p
  original: Es ist keineswegs Zweck der Arbeiter, die den beschränkten Untertanenverstand losgeworden, den Staat "frei" zu machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.5.2
  kind: p
  original: Im Deutschen Reich ist der "Staat" fast so "frei" als in Rußland.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.5.3
  kind: p
  original: Die Freiheit besteht darin, den Staat aus einem der Gesellschaft übergeordneten in ein ihr durchaus untergeordnetes Organ zu verwandeln, und auch heutig sind die Staatsformen freier oder unfreier im Maß, worin sie die "Freiheit des Staats" beschränken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.6.1
  kind: p
  original: Die deutsche Arbeiterpartei - wenigstens, wenn sie das Programm zu dem ihrigen macht - zeigt, wie ihr die sozialistischen Ideen nicht einmal hauttief sitzen, indem sie, statt die bestehende Gesellschaft (und das gilt von jeder künftigen) als Grundlage des bestehenden Staats (oder künftigen, für künftige Gesellschaft) zu behandeln, den Staat vielmehr als ein selbständiges Wesen behandelt, das seine eignen "geistigen, sittlichen, freiheitlichen Grundlagen" besitzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.7.1
  kind: p
  original: Und nun gar der wüste Mißbrauch, den das Programm mit den Worten "heutiger Staat", "heutige Gesellschaft" treibt, und den noch wüsteren Mißverstand, den es über den Staat anrichtet, an den es seine Forderungen richtet!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.8.1
  kind: p
  original: Die "heutige Gesellschaft" ist die kapitalistische Gesellschaft, die in allen Kulturländern existiert, mehr oder weniger frei von mittelaltrigem Beisatz, mehr oder weniger durch die besondre geschichtliche Entwicklung jedes Landes modifiziert, mehr oder weniger entwickelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.8.2
  kind: p
  original: Dagegen der "heutige Staat" wechselt mit der Landesgrenze.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.8.3
  kind: p
  original: Er ist ein andrer im preußisch-deutschen Reich als in der Schweiz, ein andrer in England als in den Vereinigten Staaten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.8.4
  kind: p
  original: '"Der heutige Staat" ist also eine Fiktion.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.9.1
  kind: p
  original: Jedoch haben die verschiednen Staaten der verschiednen Kulturländer, trotz ihrer bunten Formverschiedenheit, alle das gemein, daß sie auf dem Boden der modernen bürgerlichen Gesellschaft stehn, nur einer mehr oder minder kapitalistisch entwickelten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.9.2
  kind: p
  original: Sie haben daher auch gewisse wesentliche Charaktere gemein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.9.3
  kind: p
  original: In diesem Sinn kann man von "heutigem Staatswesen" sprechen, im Gegensatz zur Zukunft, worin seine jetzige Wurzel, die bürgerliche Gesellschaft, abgestorben ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.10.1
  kind: p
  original: 'Es fragt sich dann: Welche Umwandlung wird das Staatswesen in einer kommunistischen Gesellschaft untergehn?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T13
    editions: '1891'
    reading: erleiden
    base_text: … einer kommunistischen Gesellschaft untergehn ‸ ? …
  mew_page: '27'
- id: IV.10.2
  kind: p
  original: In andern Worten, welche gesellschaftliche Funktionen bleiben dort übrig, die jetzigen Staatsfunktionen analog sind?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.10.3
  kind: p
  original: Diese Frage ist nur wissenschaftlich zu beantworten, und man kommt dem Problem durch tausendfache Zusammensetzung des Worts Volk mit dem Wort Staat auch nicht um einen Flohsprung näher.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.11.1
  kind: p
  original: Zwischen der kapitalistischen und der kommunistischen Gesellschaft liegt die Periode der revolutionären Umwandlung der einen in die andre.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.11.2
  kind: p
  original: Der entspricht auch eine politische Übergangsperiode, deren Staat nichts andres sein kann als die revolutionäre Diktatur des Proletariats.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.12.1
  kind: p
  original: Das Programm nun hat es weder mit letzterer zu tun, noch mit dem zukünftigen Staatswesen der kommunistischen Gesellschaft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '27'
- id: IV.13.1
  kind: p
  original: 'Seine politischen Forderungen enthalten nichts, außer der aller Welt bekannten demokratischen Litanei: allgemeines Wahlrecht, direkte Gesetzgebung, Volksrecht, Volkswehr etc.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '29'
- id: IV.13.2
  kind: p
  original: Sie sind bloßes Echo der bürgerlichen Volkspartei, des Friedens- und Freiheitsbundes.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '29'
- id: IV.13.3
  kind: p
  original: Es sind lauter Forderungen, die, soweit nicht in phantastischer Vorstellung übertrieben, bereits realisiert sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '29'
- id: IV.13.4
  kind: p
  original: Nur liegt der Staat, dem sie angehören, nicht innerhalb der deutschen Reichsgrenze, sondern in der Schweiz, den Vereinigten Staaten etc.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '29'
- id: IV.13.5
  kind: p
  original: Diese Sorte "Zukunftsstaat" ist heutiger Staat, obgleich außerhalb "des Rahmens" des Deutschen Reichs existierend.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '29'
- id: IV.14.1
  kind: p
  original: Aber man hat eins vergessen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '29'
- id: IV.14.2
  kind: p
  original: Da die deutsche Arbeiterpartei ausdrücklich erklärt, sich innerhalb "des heutigen nationalen Staats", also ihres Staats, des preußisch-deutschen Reichs, zu bewegen - ihre Forderungen wären ja sonst auch großenteils sinnlos, da man nur fordert, was man noch nicht hat -, so durfte sie die Hauptsache nicht vergessen, nämlich daß alle jene schönen Sächelchen auf der Anerkennung der sog. Volkssouveränität beruhn, daß sie daher nur in einer demokratischen Republik am Platze sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T14
    editions: '1891'
    reading: 'fehlt: noch'
    base_text: … fordert, was man noch ‸ nicht hat -, so …
  mew_page: '29'
- id: IV.15.1
  kind: p
  original: Da man nicht den Mut hat - und weislich, denn die Verhältnisse gebieten Vorsicht -, die demokratische Republik zu verlangen, wie es die französischen Arbeiterprogramme unter Louis-Philippe und unter Louis-Napoleon taten - so hätte man auch nicht zu der <weder "ehrlichen" noch würdigen> Finte flüchten sollen, Dinge, die nur in einer demokratischen Republik Sinn haben, von einem Staat zu verlangen, der nichts andres als ein mit parlamentarischen Formen verbrämter, mit feudalem Beisatz vermischter und zugleich schon von der Bourgeoisie beeinflußter, bürokratisch gezimmerter, polizeilich gehüteter Militärdespotismus ist, <und diesem Staat obendrein noch zu beteuern, daß man ihm dergleichen "mit gesetzlichen Mitteln" aufdringen zu können wähnt!>
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T15
    editions: '1891'
    reading: Da man nicht in der Lage ist
    base_text: … nicht den Mut hat ‸ - und weislich, denn …
  - ref: T16
    editions: '1891'
    reading: 'fehlt: und zugleich'
    base_text: … Beisatz vermischter und zugleich ‸ schon von der Bourgeoisie …
  mew_page: '29'
- id: IV.16.1
  kind: p
  original: Selbst die vulgäre Demokratie, die in der demokratischen Republik das Tausendjährige Reich sieht und keine Ahnung davon hat, daß grade in dieser letzten Staatsform der bürgerlichen Gesellschaft der Klassenkampf definitiv auszufechten ist - selbst sie steht noch berghoch über solcherart Demokratentum innerhalb der Grenzen des polizeilich Erlaubten und logisch Unerlaubten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '29'
- id: IV.17.1
  kind: p
  original: 'Daß man in der Tat unter "Staat" die Regierungsmaschine versteht oder den Staat, soweit er einen durch Teilung der Arbeit von der Gesellschaft besonderten, eignen Organismus bildet, zeigen schon die Worte: "Die deutsche Arbeiterpartei verlangt als wirtschaftliche Grundlage des Staats: eine einzige progressive Einkommensteuer etc."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 29-30
- id: IV.17.2
  kind: p
  original: Die Steuern sind die wirtschaftliche Grundlage der Regierungsmaschinerie und von sonst nichts.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.17.3
  kind: p
  original: In dem in der Schweiz existierenden Zukunftsstaat ist diese Forderung ziemlich erfüllt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.17.4
  kind: p
  original: Einkommensteuer setzt die verschiednen Einkommenquellen der verschiednen gesellschaftlichen Klassen voraus, also die kapitalistische Gesellschaft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.17.5
  kind: p
  original: Es ist also nichts Auffälliges, daß die Financial Reformers von Liverpool - Bourgeois mit Gladstones Bruder an der Spitze - dieselbe Forderung stellen wie das Programm.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.18.1
  kind: p
  original: 'B. "Die deutsche Arbeiterpartei verlangt als geistige und sittliche Grundlage des Staats:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.19.1
  kind: p
  original: 1. Allgemeine und gleiche Volkserziehung durch den Staat.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.19.2
  kind: p
  original: Allgemeine Schulpflicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.19.3
  kind: p
  original: Unentgeltlichen Unterricht."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.20.1
  kind: p
  original: Gleiche Volkserziehung?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.20.2
  kind: p
  original: Was bildet man sich unter diesen Worten ein?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.20.3
  kind: p
  original: Glaubt man, daß in der heutigen Gesellschaft (und man hat nur mit der zu tun) die Erziehung für alle Klassen gleich sein kann?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.20.4
  kind: p
  original: Oder verlangt man, daß auch die höheren Klassen zwangsweise auf das Modikum Erziehung - der Volksschule - reduziert werden sollen, das allein mit den ökonomischen Verhältnissen nicht nur der Lohnarbeiter, sondern auch der Bauern verträglich ist?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.21.1
  kind: p
  original: '"Allgemeine Schulpflicht.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.21.2
  kind: p
  original: Unentgeltlicher Unterricht."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.21.3
  kind: p
  original: Die erste existiert selbst in Deutschland, das zweite in der Schweiz [und] den Vereinigten Staaten für Volksschulen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.21.4
  kind: p
  original: Wenn in einigen Staaten der letzteren auch "höhere" Unterrichtsanstalten "unentgeltlich" sind, so heißt das faktisch nur, den höheren Klassen ihre Erziehungskosten aus dem allgemeinen Steuersäckel bestreiten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.21.5
  kind: p
  original: Nebenbei gilt dasselbe von der unter A. 5 verlangten "unentgeltlichen Rechtspflege".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.21.6
  kind: p
  original: Die Kriminaljustiz ist überall unentgeltlich zu haben; die Ziviljustiz dreht sich fast nur um Eigentumskonflikte, berührt also fast nur die besitzenden Klassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.21.7
  kind: p
  original: Sollen sie auf Kosten des Volkssäckels ihre Prozesse führen?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.22.1
  kind: p
  original: Der Paragraph über die Schulen hätte wenigstens technische Schulen (theoretische und praktische) in Verbindung mit der Volksschule verlangen sollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.23.1
  kind: p
  original: Ganz verwerflich ist eine "Volkserziehung durch den Staat".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.23.2
  kind: p
  original: Durch ein allgemeines Gesetz die Mittel der Volksschulen bestimmen, die Qualifizierung des Lehrerpersonals, die Unterrichtszweige etc., und, wie es in den Vereinigten Staaten geschieht, durch Staatsinspektoren die Erfüllung dieser gesetzlichen Vorschriften überwachen, ist etwas ganz andres, als den Staat zum Volkserzieher zu ernennen!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.23.3
  kind: p
  original: Vielmehr sind Regierung und Kirche gleichmäßig von jedem Einfluß auf die Schule auszuschließen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '30'
- id: IV.23.4
  kind: p
  original: Im preußisch-deutschen Reich nun gar (und man helfe sich nicht mit der faulen Ausflucht, daß man von einem "Zukunftsstaat" spricht; wir haben gesehn, welche Bewandtnis es damit hat) bedarf umgekehrt der Staat einer sehr rauhen Erziehung durch das Volk.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 30-31
- id: IV.24.1
  kind: p
  original: Doch das ganze Programm, trotz alles demokratischen Geklingels, ist durch und durch vom Untertanenglauben der Lassalleschen Sekte an den Staat verpestet oder, was nicht besser, vom demokratischen Wunderglauben, oder vielmehr ist es ein Kompromiß zwischen diesen zwei Sorten, dem Sozialismus gleich fernen, Wunderglauben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: IV.25.1
  kind: p
  original: '"Freiheit der Wissenschaft" lautet ein Paragraph der preußischen Verfassung.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: IV.25.2
  kind: p
  original: Warum also hier?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: IV.26.1
  kind: p
  original: '"Gewissensfreiheit"!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: IV.26.2
  kind: p
  original: 'Wollte man zu dieser Zeit des Kulturkampfes dem Liberalismus seine alten Stichworte zu Gemüt führen, so konnte es doch nur in dieser Form geschehen: Jeder muß seine religiöse wie seine leibliche Notdurft verrichten können, ohne daß die Polizei ihre Nase hineinsteckt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T17
    editions: '1891'
    reading: seine religiösen... Bedürfnisse
    base_text: … wie seine leibliche Notdurft ‸ verrichten können, ohne daß …
  mew_page: '31'
- id: IV.26.3
  kind: p
  original: Aber die Arbeiterpartei mußte doch bei dieser Gelegenheit ihr Bewußtsein darüber aussprechen, daß die bürgerliche "Gewissensfreiheit" nichts ist außer der Duldung aller möglichen Sorten religiöser Gewissensfreiheit, und daß sie vielmehr die Gewissen vom religiösen Spuk zu befreien strebt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: IV.26.4
  kind: p
  original: Man beliebt aber das "bürgerliche" Niveau nicht zu überschreiten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: IV.27.1
  kind: p
  original: Ich bin jetzt zu Ende gelangt, denn der nun im Programm folgende Anhang bildet keinen charakteristischen Bestandteil desselben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: IV.27.2
  kind: p
  original: Ich habe mich daher hier ganz kurz zu fassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: IV.28.1
  kind: p
  original: '"2. Normalarbeitstag."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: IV.29.1
  kind: p
  original: Die Arbeiterpartei keines andern Landes hat sich auf solch unbestimmte Forderung beschränkt, sondern stets die Länge des Arbeitstags fixiert, die sie unter den gegebnen Umständen für normal hält.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: IV.30.1
  kind: p
  original: '"3. Beschränkung der Frauen- und Verbot der Kinderarbeit."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: IV.31.1
  kind: p
  original: Die Normierung des Arbeitstags muß die Beschränkung der Frauenarbeit schon einschließen, soweit sie sich auf Dauer, Pausen etc. des Arbeitstags bezieht; sonst kann sie nur Ausschluß der Frauenarbeit aus Arbeitszweigen bedeuten, die speziell gesundheitswidrig für den weiblichen Körper oder die für das weibliche Geschlecht sittenwidrig sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: IV.31.2
  kind: p
  original: Meinte man das, so mußte es gesagt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: IV.32.1
  kind: p
  original: '"Verbot der Kinderarbeit"!'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: IV.32.2
  kind: p
  original: Hier war absolut nötig, die Altersgrenze anzugeben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '31'
- id: IV.33.1
  kind: p
  original: Allgemeines Verbot der Kinderarbeit ist unverträglich mit der Existenz der großen Industrie und daher leerer frommer Wunsch.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '32'
- id: IV.34.1
  kind: p
  original: Durchführung desselben - wenn möglich - wäre reaktionär, da, bei strenger Reglung der Arbeitszeit nach den verschiednen Altersstufen und sonstigen Vorsichtsmaßregeln zum Schutz der Kinder, frühzeitige Verbindung produktiver Arbeit mit Unterricht eines der mächtigsten Umwandlungsmittel der heutigen Gesellschaft ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '32'
- id: IV.35.1
  kind: p
  original: '"4. Staatliche Überwachung der Fabrik-, Werkstatt- und Hausindustrie."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '32'
- id: IV.36.1
  kind: p
  original: Gegenüber dem preußisch-deutschen Staat war bestimmt zu verlangen, daß die Inspektoren nur gerichtlich absetzbar sind; daß jeder Arbeiter sie wegen Pflichtverletzung den Gerichten denunzieren kann; daß sie dem ärztlichen Stand angehören müssen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '32'
- id: IV.37.1
  kind: p
  original: '"5. Regelung der Gefängnisarbeit."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '32'
- id: IV.38.1
  kind: p
  original: Kleinliche Forderung in einem allgemeinen Arbeiterprogramm.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '32'
- id: IV.38.2
  kind: p
  original: Jedenfalls mußte man klar aussprechen, daß man aus Konkurrenzneid die gemeinen Verbrecher nicht wie Vieh behandelt wissen und ihnen namentlich ihr einziges Besserungsmittel, produktive Arbeit, nicht abschneiden will.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '32'
- id: IV.38.3
  kind: p
  original: Das war doch das Geringste, was man von Sozialisten erwarten durfte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '32'
- id: IV.39.1
  kind: p
  original: '"6. Ein wirksames Haftgesetz."'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '32'
- id: IV.40.1
  kind: p
  original: Es war zu sagen, was man unter "wirksamem" Haftgesetz versteht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '32'
- id: IV.41.1
  kind: p
  original: Nebenbei bemerkt, hat man beim Normalarbeitstag den Teil der Fabrikgesetzgebung übersehn, der Gesundheitsmaßregeln und Schutzmittel gegen Gefahr etc. betrifft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '32'
- id: IV.41.2
  kind: p
  original: Das Haftgesetz tritt erst in Wirkung, sobald diese Vorschriften verletzt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '32'
- id: IV.42.1
  kind: p
  original: <Kurz, auch dieser Anhang zeichnet sich durch schlottrige Redaktion aus.>
  en: ''
