- id: III.1.1
  kind: p
  original: '"Die deutsche Arbeiterpartei verlangt, um die Lösung der sozialen Frage anzubahnen, die Errichtung von Produktivgenossenschaften mit Staatshilfe unter der demokratischen Kontrolle des arbeitenden Volks.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: III.1.2
  kind: p
  original: Die Produktivgenossenschaften sind für Industrie und Ackerbau in solchem Umfang ins Leben zu rufen, daß aus ihnen die sozialistische Organisation der Gesamtarbeit entsteht."
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: III.2.1
  kind: p
  original: Nach dem Lassalleschen "ehernen Lohngesetz" das Heilmittel des Propheten!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: III.2.2
  kind: p
  original: Es wird in würdiger Weise "angebahnt"!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: III.2.3
  kind: p
  original: An die Stelle des existierenden Klassenkampfs tritt eine Zeitungsschreiberphrase - "die soziale Frage", deren "Lösung" man "anbahnt".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: III.2.4
  kind: p
  original: Statt aus dem revolutionären Umwandlungsprozesse der Gesellschaft "entsteht" die "sozialistische Organisation der Gesamtarbeit" aus der "Staatshilfe", die der Staat Produktivgenossenschaften gibt, die er, nicht der Arbeiter, "ins Leben ruft".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: III.2.5
  kind: p
  original: Es ist dies würdig der Einbildung Lassalles, daß man mit Staatsanlehn ebensogut eine neue Gesellschaft bauen kann wie eine neue Eisenbahn!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: III.3.1
  kind: p
  original: Aus <einem Rest von> Scham stellt man "die Staatshilfe" - "unter die demokratische Kontrolle des arbeitenden Volks".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: III.4.1
  kind: p
  original: Erstens besteht "das arbeitende Volk" in Deutschland zur Majorität aus Bauern und nicht aus Proletariern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: III.5.1
  kind: p
  original: Zweitens heißt "demokratisch" zu deutsch "volksherrschaftlich".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: III.5.2
  kind: p
  original: Was heißt aber "die volksherrschaftliche Kontrolle des arbeitenden Volkes"?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: III.5.3
  kind: p
  original: Und nun gar bei einem Arbeitervolk, das durch diese Forderungen, die es an den Staat stellt, sein volles Bewußtsein ausspricht, daß es weder an der Herrschaft ist, noch zur Herrschaft reif ist!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: III.6.1
  kind: p
  original: Auf die Kritik des von Buchez unter Louis-Philippe im Gegensatz gegen die französischen Sozialisten verschriebnen und von den reaktionären Arbeitern des "Atelier" angenommenen Rezepts ist es überflüssig, hier einzugehn.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: III.6.2
  kind: p
  original: Es liegt auch der Hauptanstoß nicht darin, daß man diese spezifische Wunderkur ins Programm geschrieben, sondern daß man überhaupt vom Standpunkt der Klassenbewegung zu dem der Sektenbewegung zurückgeht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: III.7.1
  kind: p
  original: Daß die Arbeiter die Bedingungen der genossenschaftlichen Produktion auf sozialem und zunächst bei sich, also [auf] nationalem Maßstab herstellen wollen, heißt nur, daß sie an der Umwälzung der jetzigen Produktionsbedingungen arbeiten, und hat nichts gemein mit der Stiftung von Kooperativgesellschaften mit Staatshilfe!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
- id: III.7.2
  kind: p
  original: Was aber die jetzigen Kooperativgesellschaften betrifft, so haben sie nur Wert, soweit sie unabhängige, weder von den Regierungen noch von den Bourgeois protegierte Arbeiterschöpfungen sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '26'
