- id: B.1.1
  kind: signature
  original: London, 5. Mai 1875
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: B.2.1
  kind: p
  original: Lieber Bracke!
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: B.3.1
  kind: p
  original: Nachstehende kritische Randglossen zu dem Koalitionsprogramm sind Sie wohl so gut, nach Durchlesung, zur Einsicht an Geib und Auer, Bebel und Liebknecht mitzuteilen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: B.3.2
  kind: p
  original: Ich bin überbeschäftigt und muß schon weit über das Arbeitsmaß hinausschießen, das mir ärztlich vorgeschrieben ist.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: B.3.3
  kind: p
  original: Es war mir daher keineswegs ein "Genuß", solch langen Wisch zu schreiben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: B.3.4
  kind: p
  original: Doch war es notwendig, damit später meinerseits zu tuende Schritte von den Parteifreunden, für welche diese Mitteilung bestimmt ist, nicht mißdeutet werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: B.4.1
  kind: p
  original: <Nach abgehaltnem Koalitionskongreß werden Engels und ich nämlich eine kurze Erklärung veröffentlichen, des Inhalts, daß wir besagtem Prinzipienprogramm durchaus fernstehn und nichts damit zu tun haben.>
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: B.5.1
  kind: p
  original: Es ist dies unerläßlich, da man im Ausland die von Parteifeinden sorgsamst genährte Ansicht - die durchaus irrige Ansicht - hegt, daß wir die Bewegung der sog. Eisenacher Partei insgeheim von hier aus lenken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: B.5.2
  kind: p
  original: Noch in einer jüngst erschienenen russischen Schrift macht Bakunin mich z.B. <nicht nur> für alle Programme etc. jener Partei verantwortlich <,sondern sogar für jeden Schritt, den Liebknecht, vom Tag seiner Kooperation mit der Volkspartei an, getan hat>.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: B.6.1
  kind: p
  original: Abgesehn davon ist es meine Pflicht, ein nach meiner Überzeugung durchaus verwerfliches und die Partei demoralisierendes Programm auch nicht durch diplomatisches Stillschweigen anzuerkennen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: B.7.1
  kind: p
  original: Jeder Schritt wirklicher Bewegung ist wichtiger als ein Dutzend Programme.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '13'
- id: B.7.2
  kind: p
  original: Konnte man also nicht - und die Zeitumstände ließen das nicht zu - über das Eisenacher Programm hinausgehn, so hätte man einfach eine Übereinkunft für Aktion gegen den gemeinsamen Feind abschließen sollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 13-14
- id: B.7.3
  kind: p
  original: Macht man aber Prinzipienprogramme (statt diese bis zur Zeit aufzuschieben, wo dergleichen durch längere gemeinsame Tätigkeit vorbereitet war), so errichtet man vor aller Welt Marksteine, an denen sie die Höhe der Parteibewegung mißt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '14'
- id: B.8.1
  kind: p
  original: Die Chefs der Lassalleaner kamen, weil die Verhältnisse sie dazu zwangen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '14'
- id: B.8.2
  kind: p
  original: Hätte man ihnen von vornherein erklärt, man lasse sich auf keinen Prinzipienschacher ein, so hätten sie sich mit einem Aktionsprogramm oder Organisationsplan zu gemeinschaftlicher Aktion begnügen müssen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '14'
- id: B.8.3
  kind: p
  original: Statt dessen erlaubt man ihnen, sich mit Mandaten bewaffnet einzustellen, und erkennt diese Mandate seinerseits als bindend an, ergibt sich also den Hülfsbedürftigen auf Gnade und Ungnade.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '14'
- id: B.8.4
  kind: p
  original: Um der Sache die Krone aufzusetzen, halten sie wieder einen Kongreß vor dem Kompromißkongreß, während die eigne Partei ihren Kongreß post festum hält.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '14'
- id: B.8.5
  kind: p
  original: <Man wollte offenbar alle Kritik eskamotieren und die eigne Partei nicht zum Nachdenken kommen lassen.>
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '14'
- id: B.8.6
  kind: p
  original: Man weiß, wie die bloße Tatsache der Vereinigung die Arbeiter befriedigt, aber man irrt sich, wenn man glaubt, dieser augenblickliche Erfolg sei nicht zu teuer erkauft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '14'
- id: B.9.1
  kind: p
  original: Übrigens taugt das Programm nichts, auch abgesehn von der Heiligsprechung der Lassalleschen Glaubensartikel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '14'
- id: B.10.1
  kind: p
  original: <Ich werde Ihnen in der nächsten Zeit die Schlußlieferungen der französischen Ausgabe des "Kapital" schicken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '14'
- id: B.10.2
  kind: p
  original: Der Fortgang des Drucks war auf längere Zeit durch Verbot der französischen Regierung gehemmt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '14'
- id: B.10.3
  kind: p
  original: Diese Woche oder Anfang der nächsten wird die Sache fertig.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '14'
- id: B.10.4
  kind: p
  original: Haben Sie die früheren 6 Lieferungen erhalten?
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '14'
- id: B.10.5
  kind: p
  original: Schreiben Sie mir gefälligst auch die Adresse von Bernhard Becker, dem ich ebenfalls die Schlußlieferungen schicken muß.>
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '14'
- id: B.11.1
  kind: p
  original: Die "Volksstaats"-Buchhandlung hat eigne Manieren.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '14'
- id: B.11.2
  kind: p
  original: So hat man mir bis zu diesem Augenblick z.B. auch nicht ein einziges Exemplar des Abdrucks des "Kölner Kommunistenprozesses" zukommen lassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '14'
- id: B.12.1
  kind: signature
  original: Mit bestem Gruß
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '14'
- id: B.13.1
