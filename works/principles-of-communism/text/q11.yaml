section: Q11
title_original: '11. Frage: Was waren die nächsten Folgen der industriellen Revolution und der Scheidung der Gesellschaft in Bourgeois und Proletarier?'
title_en: Question 11
author: Friedrich Engels
date: 1847-10/11
original_language: de
anchor_language: de
source_original: MEW 4, S. 361-380 (Dietz, Berlin) via mlwerke.de; printed from Engels's manuscript. MEW editorial notes removed
source_en: 'None: no public-domain English translation'
verses:
- id: Q11.0.1
  kind: heading
  original: '11. Frage: Was waren die nächsten Folgen der industriellen Revolution und der Scheidung der Gesellschaft in Bourgeois und Proletarier?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.1.1
  kind: p
  original: 'Antwort: Erstens wurde durch die infolge der Maschinenarbeit immer wohlfeiler werdenden Preise der Industrieerzeugnisse in allen Ländern der Welt das alte System der Manufaktur oder auf Handarbeit beruhenden Industrie gänzlich zerstört.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.1.2
  kind: p
  original: Alle halbbarbarischen Länder, welche bisher mehr oder weniger der geschichtlichen Entwicklung fremd geblieben waren und deren Industrie bisher auf der Manufaktur beruht hatte, wurden hierdurch mit Gewalt aus ihrer Abschließung herausgerissen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.1.3
  kind: p
  original: Sie kauften die wohlfeileren Waren der Engländer und ließen ihre eigenen Manufakturarbeiter zugrunde gehen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.1.4
  kind: p
  original: So sind Länder, welche seit Jahrtausenden keinen Fortschritt gemacht haben, z.B. Indien, durch und durch revolutioniert worden, und selbst China geht jetzt einer Revolution entgegen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.1.5
  kind: p
  original: Es ist dahin gekommen, daß eine neue Maschine, die heute in England erfunden wird, binnen einem Jahre Millionen von Arbeitern in China außer Brot setzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.1.6
  kind: p
  original: Auf diese Weise hat die große Industrie alle Völker der Erde miteinander in Verbindung gesetzt, alle kleinen Lokalmärkte zum Weltmarkt zusammengeworfen, überall die Zivilisation und den Fortschritt vorbereitet und es dahin gebracht, daß alles, was in den zivilisierten Ländern geschieht, auf alle anderen Länder zurückwirken muß.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.1.7
  kind: p
  original: So daß, wenn jetzt in England oder Frankreich die Arbeiter sich befreien, dies in allen anderen Ländern Revolutionen nach sich ziehen muß, welche früher oder später ebenfalls die Befreiung der dortigen Arbeiter herbeiführen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.2.1
  kind: p
  original: Zweitens hat sie überall, wo die große Industrie an die Stelle der Manufaktur trat, die Bourgeoisie, ihren Reichtum und ihre Macht im höchsten Grade entwickelt und sie zur ersten Klasse im Lande gemacht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.2.2
  kind: p
  original: Die Folge davon war, daß überall, wo dies geschah, die Bourgeoisie die politische Macht in ihre Hände bekam und die bisher herrschenden Klassen, die Aristokratie, die Zunftbürger und das beide vertretende absolute Königtum, verdrängte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.3.1
  kind: p
  original: Die Bourgeoisie vernichtete die Macht der Aristokratie, des Adels, indem sie die Majorate oder die Unverkäuflichkeit des Grundbesitzes und alle Adelsvorrechte aufhob.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.3.2
  kind: p
  original: Sie zerstörte die Macht der Zunftbürger, indem sie alle Zünfte und Handwerksprivilegien aufhob.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.3.3
  kind: p
  original: An die Stelle beider setzte sie die freie Konkurrenz, d.h. den Zustand der Gesellschaft, worin jeder das Recht hat, jeden beliebigen Industriezweig zu betreiben, und worin ihn nichts an dem Betriebe eines solchen verhindern kann als der Mangel des dazu nötigen Kapitals.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.4.1
  kind: p
  original: Die Einführung der freien Konkurrenz ist also die öffentliche Erklärung, daß von nun an die Mitglieder der Gesellschaft nur noch insoweit ungleich sind, als ihre Kapitalien ungleich sind, daß das Kapital die entscheidende Macht und damit die Kapitalisten, die Bourgeois, die erste Klasse in der Gesellschaft geworden sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.4.2
  kind: p
  original: Die freie Konkurrenz ist aber für den Anfang der großen Industrie notwendig, weil sie der einzige Gesellschaftszustand ist, in dem die große Industrie aufkommen kann.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.4.3
  kind: p
  original: Die Bourgeoisie, nachdem sie so die gesellschaftliche Macht des Adels und der Zunftbürger vernichtet hatte, vernichtete auch ihre politische Macht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.4.4
  kind: p
  original: Wie sie sich in der Gesellschaft zur ersten Klasse erhoben hatte, proklamierte sie sich auch in politischer Form als erste Klasse.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.4.5
  kind: p
  original: Sie tat dies durch die Einführung des Repräsentativsystems, welches auf der bürgerlichen Gleichheit vor dem Gesetz, der gesetzlichen Anerkennung der freien Konkurrenz beruht und in den europäischen Ländern unter der Form der konstitutionellen Monarchie eingeführt wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.4.6
  kind: p
  original: In diesen konstitutionellen Monarchien sind nur diejenigen Wähler, welche ein gewisses Kapital besitzen, also nur die Bourgeois; diese Bourgeoiswähler wählen die Deputierten, und diese Bourgeoisdeputierten wählen, vermittels des Rechts der Steuerverweigerung, eine Bourgeoisregierung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.5.1
  kind: p
  original: Drittens entwickelte sie überall das Proletariat in demselben Maße, wie sie die Bourgeoisie entwickelt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.5.2
  kind: p
  original: In demselben Verhältnis, wie die Bourgeois reicher wurden, in demselben Verhältnis wurden die Proletarier zahlreicher.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.5.3
  kind: p
  original: Denn da die Proletarier nur durch das Kapital beschäftigt werden können und das Kapital sich nur dann vermehrt, wenn es Arbeit beschäftigt, so hält die Vermehrung des Proletariats genau Schritt mit der Vermehrung des Kapitals.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.5.4
  kind: p
  original: Zu gleicher Zeit zieht sie die Bourgeois so wie die Proletarier in großen Städten zusammen, in denen die Industrie sich am vorteilhaftesten betreiben läßt, und gibt durch diese Zusammenwerfung großer Massen auf einen Fleck den Proletariern das Bewußtsein ihrer Stärke.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.5.5
  kind: p
  original: Ferner, je mehr sie sich entwickelt, je mehr neue Maschinen erfunden werden, welche die Handarbeit verdrängen, desto mehr drückt die große Industrie den Lohn, wie schon gesagt, auf sein Minimum herab und macht dadurch die Lage des Proletariats mehr und mehr unerträglich.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q11.5.6
  kind: p
  original: So bereitet sie einerseits durch die wachsende Unzufriedenheit, andererseits durch die wachsende Macht des Proletariats eine Revolution der Gesellschaft durch das Proletariat vor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
