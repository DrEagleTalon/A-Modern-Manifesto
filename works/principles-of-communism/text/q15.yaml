section: Q15
title_original: '15. Frage: Die Abschaffung des Privateigentums war also früher nicht möglich?'
title_en: Question 15
author: Friedrich Engels
date: 1847-10/11
original_language: de
anchor_language: de
source_original: MEW 4, S. 361-380 (Dietz, Berlin) via mlwerke.de; printed from Engels's manuscript. MEW editorial notes removed
source_en: 'None: no public-domain English translation'
verses:
- id: Q15.0.1
  kind: heading
  original: '15. Frage: Die Abschaffung des Privateigentums war also früher nicht möglich?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q15.1.1
  kind: p
  original: 'Antwort: Nein.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q15.1.2
  kind: p
  original: Jede Veränderung in der gesellschaftlichen Ordnung, jede Umwälzung der Eigentumsverhältnisse ist die notwendige Folge der Erzeugung neuer Produktivkräfte gewesen, welche den alten Eigentumsverhältnissen sich nicht mehr fügen wollten.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q15.1.3
  kind: p
  original: Das Privateigentum selbst ist so entstanden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q15.1.4
  kind: p
  original: Denn das Privateigentum hat nicht immer existiert, sondern, als gegen das Ende des Mittelalters in der Manufaktur eine neue Art der Produktion erschaffen wurde, welche sich dem damaligen feudalen und Zunfteigentum nicht unterordnen ließ, da erzeugte diese, den alten Eigentumsverhältnissen entwachsene Manufaktur eine neue Eigentumsform, das Privateigentum.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q15.1.5
  kind: p
  original: Für die Manufaktur und für die erste Entwicklungsstufe der großen Industrie war aber keine andere Eigentumsform möglich als das Privateigentum, keine andre Gesellschaftsordnung als die auf dem Privateigentum beruhende.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q15.1.6
  kind: p
  original: Solange nicht so viel produziert werden kann, daß nicht nur für alle genug vorhanden ist, sondern auch noch ein Überschuß von Produkten zur Vermehrung des gesellschaftlichen Kapitals und zur weiteren Ausbildung der Produktivkräfte bleibt, solange muß es immer eine herrschende, über die Produktivkräfte der Gesellschaft verfügende und eine arme, unterdrückte Klasse geben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q15.1.7
  kind: p
  original: Wie diese Klassen beschaffen sein werden, wird von der Entwicklungsstufe der Produktion abhängen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q15.1.8
  kind: p
  original: Das vom Landbau abhängige Mittelalter gibt uns den Baron und den Leibeigenen, die Städte des späteren Mittelalters zeigen uns den Zunftmeister und den Gesellen und Tagelöhner, das siebzehnte Jahrhundert hat den Manufakturisten und den Manufakturarbeiter, das neunzehnte den großen Fabrikanten und den Proletarier.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q15.2.1
  kind: p
  original: Es ist klar, das bisher die Produktivkräfte noch nicht so weit entwickelt waren, daß für alle genug produziert werden konnte, und daß das Privateigentum für diese Produktivkräfte eine Fessel, eine Schranke geworden war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q15.2.2
  kind: p
  original: Jetzt aber, wo durch die Entwicklung der großen Industrie erstens Kapitalien und Produktivkräfte in einem nie vorher gekannten Maße erzeugt und die Mittel vorhanden sind, diese Produktivkräfte in kurzer Zeit ins unendliche zu vermehren; wo zweitens diese Produktivkräfte in den Händen weniger Bourgeois zusammengedrängt sind, während die große Masse des Volks immer mehr zu Proletariern wird, während ihre Lage in demselben Maße elender und unerträglicher wird, in welchem die Reichtümer der Bourgeois sich vermehren; wo drittens diese gewaltigen und leicht zu vermehrenden Produktivkräfte so sehr dem Privateigentum und den Bourgeois über den Kopf gewachsen sind, daß sie jeden Augenblick die gewaltsamsten Störungen in der gesellschaftlichen Ordnung hervorrufen, jetzt erst ist die Aufhebung des Privateigentums nicht nur möglich, sondern sogar durchaus notwendig geworden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
