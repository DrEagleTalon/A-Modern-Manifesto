section: Q7
title_original: '7. Frage: Wodurch unterscheidet sich der Proletarier vom Sklaven?'
title_en: Question 7
author: Friedrich Engels
date: 1847-10/11
original_language: de
anchor_language: de
source_original: MEW 4, S. 361-380 (Dietz, Berlin) via mlwerke.de; printed from Engels's manuscript. MEW editorial notes removed
source_en: 'None: no public-domain English translation'
verses:
- id: Q7.0.1
  kind: heading
  original: '7. Frage: Wodurch unterscheidet sich der Proletarier vom Sklaven?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q7.1.1
  kind: p
  original: 'Antwort: Der Sklave ist ein für allemal verkauft; der Proletarier muß sich täglich und stündlich selbst verkaufen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q7.1.2
  kind: p
  original: Der einzelne Sklave, Eigentum eines Herrn, hat schon durch das Interesse dieses Herrn eine gesicherte Existenz, so elend sie sein mag; der einzelne Proletarier, Eigentum sozusagen der ganzen Bourgeoisklasse, dem seine Arbeit nur dann abgekauft wird, wenn jemand ihrer bedarf, hat keine gesicherte Existenz.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q7.1.3
  kind: p
  original: Diese Existenz ist nur der ganzen Proletarierklasse gesichert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q7.1.4
  kind: p
  original: Der Sklave steht außerhalb der Konkurrenz, der Proletarier steht in ihr und fühlt alle ihre Schwankungen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q7.1.5
  kind: p
  original: Der Sklave gilt für eine Sache, nicht für ein Mitglied der bürgerlichen Gesellschaft; der Proletarier ist als Person, als Mitglied der bürgerlichen Gesellschaft anerkannt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q7.2.1
  kind: p
  original: Der Sklave kann also eine bessere Existenz haben als der Proletarier, aber der Proletarier gehört einer höheren Entwicklungsstufe der Gesellschaft an und steht selbst auf einer höheren Stufe als der Sklave.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q7.2.2
  kind: p
  original: Der Sklave befreit sich, indem er von allen Privateigentumsverhältnissen nur das Verhältnis der Sklaverei aufhebt und dadurch erst selbst Proletarier wird; der Proletarier kann sich nur dadurch befreien, daß er das Privateigentum überhaupt aufhebt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
