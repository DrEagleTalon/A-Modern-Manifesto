section: Q24
title_original: '24. Frage: Wie unterscheiden sich die Kommunisten von den Sozialisten?'
title_en: Question 24
author: Friedrich Engels
date: 1847-10/11
original_language: de
anchor_language: de
source_original: MEW 4, S. 361-380 (Dietz, Berlin) via mlwerke.de; printed from Engels's manuscript. MEW editorial notes removed
source_en: 'None: no public-domain English translation'
verses:
- id: Q24.0.1
  kind: heading
  original: '24. Frage: Wie unterscheiden sich die Kommunisten von den Sozialisten?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q24.1.1
  kind: p
  original: 'Antwort: Die sogenannten Sozialisten teilen sich in drei Klassen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q24.1.2
  kind: p
  original: Die erste Klasse besteht aus Anhängern der feudalen und patriarchalischen Gesellschaft, welche durch die große Industrie, den Welthandel und die durch beide geschaffene Bourgeoisgesellschaft vernichtet worden ist und noch täglich vernichtet wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q24.1.3
  kind: p
  original: Diese Klasse zieht aus den Übeln der jetzigen Gesellschaft den Schluß, daß die feudale und patriarchalische Gesellschaft wiederhergestellt werden müsse, weil sie von diesen Übeln frei war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q24.1.4
  kind: p
  original: Alle ihre Vorschläge gehen auf graden oder krummen Wegen diesem Ziele zu.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q24.1.5
  kind: p
  original: Diese Klasse reaktionärer Sozialisten wird trotz ihrer angeblichen Teilnahme und heißen Tränen für das Elend des Proletariats dennoch stets von den Kommunisten energisch angegriffen werden, denn
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q24.2.1
  kind: p
  original: 1. erstrebt sie etwas rein unmögliches;
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q24.3.1
  kind: p
  original: 2. sucht sie die Herrschaft der Aristokratie, der Zunftmeister und Manufakturisten mit ihrem Gefolge von absoluten oder feudalen Königen, Beamten, Soldaten und Pfaffen herzustellen, eine Gesellschaft, die zwar von den Übelständen der jetzigen Gesellschaft frei war, dafür aber wenigstens ebensoviel andere Übel mit sich führte und nicht einmal die Aussicht auf die Befreiung der unterdrückten Arbeiter durch eine kommunistische Organisation darbot;
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q24.4.1
  kind: p
  original: 3. kehrt sie ihre wirklichen Absichten jedesmal heraus, wenn das Proletariat revolutionär und kommunistisch wird, wo sie sich dann sogleich mit der Bourgeoisie gegen die Proletarier verbündet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q24.5.1
  kind: p
  original: Die zweite Klasse besteht aus Anhängern der jetzigen Gesellschaft, welchen die aus dieser notwendig hervorgehenden Übel Befürchtungen für den Bestand dieser Gesellschaft erweckt haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q24.5.2
  kind: p
  original: Sie streben also danach, die jetzige Gesellschaft beizubehalten, aber die mit ihr verbundenen Übel zu beseitigen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q24.5.3
  kind: p
  original: Zu diesem Zweck schlagen die einen bloße Wohltätigkeitsmaßregeln vor, die anderen großartige Reformsysteme, welche unter dem Vorwand, die Gesellschaft zu reorganisieren, die Grundlagen der jetzigen Gesellschaft und damit die jetzige Gesellschaft beibehalten wollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q24.5.4
  kind: p
  original: Diese Bourgeoissozialisten werden ebenfalls von den Kommunisten fortwährend bekämpft werden müssen, denn sie arbeiten für die Feinde der Kommunisten und verteidigen die Gesellschaft, welche die Kommunisten gerade stürzen wollen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q24.6.1
  kind: p
  original: Die dritte Klasse endlich besteht aus demokratischen Sozialisten, welche auf demselben Wege wie die Kommunisten einen Teil der in Frage [18] angegebenen Maßregeln wollen, aber nicht als Übergangsmittel zum Kommunismus, sondern als Maßregeln, welche hinreichend sind, um das Elend aufzuheben und die Übel der jetzigen Gesellschaft verschwinden zu machen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q24.6.2
  kind: p
  original: Diese demokratischen Sozialisten sind entweder Proletarier, die über die Bedingungen der Befreiung ihrer Klasse noch nicht hinreichend aufgeklärt sind, oder sie sind Repräsentanten der Kleinbürger, einer Klasse, welche bis zur Erringung der Demokratie und der aus ihr hervorgehenden sozialistischen Maßregeln in vieler Beziehung dasselbe Interesse haben wie die Proletarier.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q24.6.3
  kind: p
  original: Die Kommunisten werden deshalb in den Momenten der Handlung sich mit diesen demokratischen Sozialisten zu verständigen und überhaupt mit ihnen für den Augenblick möglichst gemeinsame Politik zu befolgen haben, sofern diese Sozialisten nicht in den Dienst der herrschenden Bourgeoisie treten und die Kommunisten angreifen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q24.6.4
  kind: p
  original: Daß diese gemeinsame Handlungsweise die Diskussion der Differenzen mit ihnen nicht ausschließt, ist klar.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
