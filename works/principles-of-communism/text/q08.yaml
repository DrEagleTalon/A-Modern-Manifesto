section: Q8
title_original: '8. Frage: Wodurch unterscheidet sich der Proletarier vom Leibeigenen?'
title_en: Question 8
author: Friedrich Engels
date: 1847-10/11
original_language: de
anchor_language: de
source_original: MEW 4, S. 361-380 (Dietz, Berlin) via mlwerke.de; printed from Engels's manuscript. MEW editorial notes removed
source_en: 'None: no public-domain English translation'
verses:
- id: Q8.0.1
  kind: heading
  original: '8. Frage: Wodurch unterscheidet sich der Proletarier vom Leibeigenen?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q8.1.1
  kind: p
  original: 'Antwort: Der Leibeigene hat den Besitz und die Benutzung eines Produktionsinstrumentes, eines Stückes Boden, gegen Abgabe eines Teils des Ertrages oder gegen Leistung von Arbeit.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q8.1.2
  kind: p
  original: Der Proletarier arbeitet mit Produktionsinstrumenten eines anderen für Rechnung dieses anderen, gegen Empfang eines Teils des Ertrages.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q8.1.3
  kind: p
  original: Der Leibeigene gibt ab, dem Proletarier wird abgegeben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q8.1.4
  kind: p
  original: Der Leibeigene hat eine gesicherte Existenz, der Proletarier hat sie nicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q8.1.5
  kind: p
  original: Der Leibeigene steht außerhalb der Konkurrenz, der Proletarier steht in ihr.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q8.1.6
  kind: p
  original: Der Leibeigene befreit sich, entweder indem er in die Städte entläuft und dort Handwerker wird, oder indem er statt Arbeit und Produkten Geld an seinen Gutsherrn gibt und freier Pächter wird, oder indem er seinen Feudalherrn verjagt und selbst Eigentümer wird, kurz, indem er auf die eine oder die andere Weise in die besitzende Klasse und in die Konkurrenz eintritt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q8.1.7
  kind: p
  original: Der Proletarier befreit sich, indem er die Konkurrenz, das Privateigentum und alle Klassenunterschiede aufhebt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
