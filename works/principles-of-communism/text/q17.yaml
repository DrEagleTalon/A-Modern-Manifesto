  original: 'Antwort: Nein, ebensowenig wie sich mit einem Schlage die schon bestehenden Produktivkräfte so weit werden vervielfältigen lassen, als zur Herstellung der Gemeinschaft nötig ist.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q17.1.2
  kind: p
  original: Die aller Wahrscheinlichkeit nach eintretende Revolution des Proletariats wird also nur allmählich die jetzige Gesellschaft umgestalten und erst dann das Privateigentum abschaffen können, wenn die dazu nötige Masse von Produktionsmitteln geschaffen ist.
