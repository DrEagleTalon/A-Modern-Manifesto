section: Q19
title_original: '19. Frage: Wird diese Revolution in einem einzigen Lande allein vor sich gehen können?'
title_en: Question 19
author: Friedrich Engels
date: 1847-10/11
original_language: de
anchor_language: de
source_original: MEW 4, S. 361-380 (Dietz, Berlin) via mlwerke.de; printed from Engels's manuscript. MEW editorial notes removed
source_en: 'None: no public-domain English translation'
verses:
- id: Q19.0.1
  kind: heading
  original: '19. Frage: Wird diese Revolution in einem einzigen Lande allein vor sich gehen können?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q19.1.1
  kind: p
  original: 'Antwort: Nein.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q19.1.2
  kind: p
  original: Die große Industrie hat schon dadurch, daß sie den Weltmarkt geschaffen hat, alle Völker der Erde, und namentlich die zivilisierten, in eine solche Verbindung miteinander gebracht, daß jedes einzelne Volk davon abhängig ist, was bei einem andern geschieht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q19.1.3
  kind: p
  original: Sie hat ferner in allen zivilisierten Ländern die gesellschaftliche Entwicklung so weit gleichgemacht, daß in allen diesen Ländern Bourgeoisie und Proletariat die beiden entscheidenden Klassen der Gesellschaft, der Kampf zwischen beiden der Hauptkampf des Tages geworden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q19.1.4
  kind: p
  original: Die kommunistische Revolution wird daher keine bloß nationale, sie wird eine in allen zivilisierten Ländern, d.h. wenigstens in England, Amerika, Frankreich und Deutschland gleichzeitig vor sich gehende Revolution sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q19.1.5
  kind: p
  original: Sie wird sich in jedem dieser Länder rascher oder langsamer entwickeln, je nachdem das eine oder das andre Land eine ausgebildetere Industrie, einen größeren Reichtum, eine bedeutendere Masse von Produktivkräften besitzt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q19.1.6
  kind: p
  original: Sie wird daher in Deutschland am langsamsten und schwierigsten, in England am raschesten und leichtesten durchzuführen sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q19.1.7
  kind: p
  original: Sie wird auf die übrigen Länder der Welt ebenfalls eine bedeutende Rückwirkung ausüben und ihre bisherige Entwicklungsweise gänzlich verändern und sehr beschleunigen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q19.1.8
  kind: p
  original: Sie ist eine universelle Revolution und wird daher auch ein universelles Terrain haben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
