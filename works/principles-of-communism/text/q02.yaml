- id: Q2.1.1
  kind: p
  original: 'Antwort: Das Proletariat ist diejenige Klasse der Gesellschaft, welche ihren Lebensunterhalt einzig und allein aus dem Verkauf ihrer Arbeit und nicht aus dem Profit irgendeines Kapitals zieht; deren Wohl und Wehe, deren Leben und Tod, deren ganze Existenz von der Nachfrage nach Arbeit, also von dem Wechsel der guten und schlechten Geschäftszeiten, von den Schwankungen einer zügellosen Konkurrenz abhängt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q2.1.2
  kind: p
  original: Das Proletariat oder die Klasse der Proletarier ist, mit einem Worte, die arbeitende Klasse des neunzehnten Jahrhunderts.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
