section: Q25
title_original: '25. Frage: Wie verhalten sich die Kommunisten zu den übrigen politischen Parteien unsrer Zeit?'
title_en: Question 25
author: Friedrich Engels
date: 1847-10/11
original_language: de
anchor_language: de
source_original: MEW 4, S. 361-380 (Dietz, Berlin) via mlwerke.de; printed from Engels's manuscript. MEW editorial notes removed
source_en: 'None: no public-domain English translation'
verses:
- id: Q25.0.1
  kind: heading
  original: '25. Frage: Wie verhalten sich die Kommunisten zu den übrigen politischen Parteien unsrer Zeit?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q25.1.1
  kind: p
  original: 'Antwort: Dies Verhältnis ist verschieden in den verschiedenen Ländern.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q25.1.2
  kind: p
  original: '- In England, Frankreich und Belgien, wo die Bourgeoisie herrscht, haben die Kommunisten vorderhand noch ein gemeinsames Interesse mit den verschiedenen demokratischen Parteien, und zwar ein um so größeres, je mehr die Demokraten sich in den jetzt überall von ihnen vertretenen sozialistischen Maßregeln dem Ziele der Kommunisten nähern, d.h., je deutlicher und bestimmter sie die Interessen des Proletariats vertreten und je mehr sie sich auf das Proletariat stützen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q25.1.3
  kind: p
  original: In England z.B. stehen die aus Arbeitern bestehenden Chartisten den Kommunisten unendlich näher als die demokratischen Kleinbürger oder sogenannten Radikalen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q25.2.1
  kind: p
  original: In Amerika, wo die demokratische Verfassung eingeführt ist, werden die Kommunisten sich mit der Partei halten müssen, welche diese Verfassung gegen die Bourgeoisie wenden und im Interesse des Proletariats benutzen will, d.h. mit den agrarischen Nationalreformers.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q25.3.1
  kind: p
  original: In der Schweiz sind die Radikalen, obwohl selbst eine noch sehr gemischte Partei, dennoch die einzigen, mit welchen die Kommunisten sich einlassen können, und unter diesen Radikalen sind wieder die waadtländischen und Genfer die am weitesten fortgeschrittenen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q25.4.1
  kind: p
  original: In Deutschland endlich steht der entscheidende Kampf zwischen der Bourgeoisie und der absoluten Monarchie erst bevor.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q25.4.2
  kind: p
  original: Da aber die Kommunisten nicht eher auf den entscheidenden Kampf zwischen ihnen selbst und der Bourgeoisie rechnen können, als bis die Bourgeoisie herrscht, so ist es das Interesse der Kommunisten, die Bourgeois sobald als möglich an die Herrschaft bringen zu helfen, um sie sobald wie möglich wieder zu stürzen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q25.4.3
  kind: p
  original: Die Kommunisten müssen also, gegenüber den Regierungen, stets für die liberalen Bourgeois Partei ergreifen und sich nur davor hüten, die Selbsttäuschungen der Bourgeois zu teilen oder ihren verführerischen Versicherungen von den heilsamen Folgen des Siegs der Bourgeoisie für das Proletariat Glauben zu schenken.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q25.4.4
  kind: p
  original: 'Die einzigen Vorteile, welche der Sieg der Bourgeoisie den Kommunisten bringen wird, werden bestehen: 1. in verschiedenen Konzessionen, welche den Kommunisten die Verteidigung, Diskussion und Verbreitung ihrer Grundsätze und damit die Vereinigung des Proletariats zu einer eng verbündeten, kampfbereiten und organisierten Klasse erleichtern; und 2. in der Gewißheit, daß von dem Tage, wo die absoluten Regierungen fallen, der Kampf zwischen Bourgeois und Proletariern an die Reihe kommt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q25.4.5
  kind: p
  original: Von diesem Tage an wird die Parteipolitik der Kommunisten dieselbe sein wie in den Ländern, wo die Bourgeoisie jetzt schon herrscht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
