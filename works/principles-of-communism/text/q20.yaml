section: Q20
title_original: '20. Frage: Was werden die Folgen der schließlichen Beseitigung des Privateigentums sein?'
title_en: Question 20
author: Friedrich Engels
date: 1847-10/11
original_language: de
anchor_language: de
source_original: MEW 4, S. 361-380 (Dietz, Berlin) via mlwerke.de; printed from Engels's manuscript. MEW editorial notes removed
source_en: 'None: no public-domain English translation'
verses:
- id: Q20.0.1
  kind: heading
  original: '20. Frage: Was werden die Folgen der schließlichen Beseitigung des Privateigentums sein?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.1.1
  kind: p
  original: 'Antwort: Dadurch, daß die Gesellschaft die Benutzung sämtlicher Produktivkräfte und Verkehrsmittel sowie den Austausch und die Verteilung der Produkte den Händen der Privatkapitalisten entnimmt und nach einem aus den vorhandenen Mitteln und den Bedürfnissen der ganzen Gesellschaft sich ergebenden Plan verwaltet, werden vor allen Dingen alle die schlimmen Folgen beseitigt, welche jetzt noch mit dem Betrieb der großen Industrie verknüpft sind.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.1.2
  kind: p
  original: Die Krisen fallen weg; die ausgedehnte Produktion, welche für die jetzige Ordnung der Gesellschaft eine Überproduktion und eine so mächtige Ursache des Elends ist, wird dann nicht einmal hinreichen und noch viel weiter ausgedehnt werden müssen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.1.3
  kind: p
  original: Statt Elend herbeizuführen, wird die Überproduktion über die nächsten Bedürfnisse der Gesellschaft hinaus die Befriedigung der Bedürfnisse aller sicherstellen, neue Bedürfnisse und zugleich die Mittel, sie zu befriedigen, erzeugen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.2.1
  kind: p
  original: Sie wird die Bedingung und Veranlassung neuer Fortschritte sein, sie wird diese Fortschritte zustande bringen, ohne daß dadurch, wie bisher jedesmal, die Gesellschaftsordnung in Verwirrung gebracht werde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.2.2
  kind: p
  original: Die große Industrie, befreit von dem Druck des Privateigentums, wird sich in einer Ausdehnung entwickeln, gegen die ihre jetzige Ausbildung ebenso kleinlich erscheint wie die Manufaktur gegen die große Industrie unserer Tage.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.2.3
  kind: p
  original: Diese Entwicklung der Industrie wird der Gesellschaft eine hinreichende Masse von Produkten zur Verfügung stellen, um damit die Bedürfnisse aller zu befriedigen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.2.4
  kind: p
  original: Ebenso wird der Ackerbau, der auch durch den Druck des Privateigentums und der Parzellierung daran verhindert wird, sich die schon gemachten Verbesserungen und wissenschaftlichen Entwicklungen anzueignen, einen ganz neuen Aufschwung nehmen und der Gesellschaft eine vollständig hinreichende Menge von Produkten zur Verfügung stellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.3.1
  kind: p
  original: Auf diese Weise wird die Gesellschaft Produkte genug hervorbringen, um die Verteilung so einrichten zu können, daß die Bedürfnisse aller Mitglieder befriedigt werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.3.2
  kind: p
  original: Die Trennung der Gesellschaft in verschiedene, einander entgegengesetzte Klassen wird hiermit überflüssig.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.3.3
  kind: p
  original: Sie wird aber nicht nur überflüssig, sie ist sogar unverträglich mit der neuen Gesellschaftsordnung.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.3.4
  kind: p
  original: Die Existenz der Klassen ist hervorgegangen aus der Teilung der Arbeit, und die Teilung der Arbeit in ihrer bisherigen Weise fällt gänzlich weg.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.3.5
  kind: p
  original: Denn um die industrielle und Ackerbauproduktion auf die geschilderte Höhe zu bringen, genügen die mechanischen und chemischen Hilfsmittel nicht allein; die Fähigkeiten der diese Hilfsmittel in Bewegung setzenden Menschen müssen ebenfalls in entsprechendem Maße entwickelt sein.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.3.6
  kind: p
  original: Ebenso wie die Bauern und Manufakturarbeiter des vorigen Jahrhunderts ihre ganze Lebensweise veränderten und selbst ganz andere Menschen wurden, als sie in die große Industrie hineingerissen wurden, ebenso wird der gemeinsame Betrieb der Produktion durch die ganze Gesellschaft und die daraus folgende neue Entwicklung der Produktion ganz andere Menschen bedürfen und auch erzeugen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.3.7
  kind: p
  original: Der gemeinsame Betrieb der Produktion kann nicht durch Menschen geschehen wie die heutigen, deren jeder einem einzigen Produktionszweig untergeordnet, an ihn gekettet, von ihm ausgebeutet ist, deren jeder nur eine seiner Anlagen auf Kosten aller anderen entwickelt hat, nur einen Zweig oder nur den Zweig eines Zweiges der Gesamtproduktion kennt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.4.1
  kind: p
  original: Schon die jetzige Industrie kann solche Menschen immer weniger gebrauchen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.4.2
  kind: p
  original: Die gemeinsam und planmäßig von der ganzen Gesellschaft betriebene Industrie setzt vollends Menschen voraus, deren Anlagen nach allen Seiten hin entwickelt sind, die imstande sind, das gesamte System der Produktion zu überschauen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.4.3
  kind: p
  original: Die durch die Maschinen schon jetzt untergrabene Teilung der Arbeit, die den einen zum Bauern, den anderen zum Schuster, den dritten zum Fabrikarbeiter, den vierten zum Börsenspekulanten macht, wird also gänzlich verschwinden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.4.4
  kind: p
  original: Die Erziehung wird die jungen Leute das ganze System der Produktion rasch durchmachen lassen können, sie wird sie in Stand setzen, der Reihe nach von einem zum andern Produktionszweig überzugehen, je nachdem die Bedürfnisse der Gesellschaft oder ihre eigenen Neigungen sie dazu veranlassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.4.5
  kind: p
  original: Sie wird ihnen also den einseitigen Charakter nehmen, den die jetzige Teilung der Arbeit jedem einzelnen aufdrückt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.4.6
  kind: p
  original: Auf diese Weise wird die kommunistisch organisierte Gesellschaft ihren Mitgliedern Gelegenheit geben, ihre allseitig entwickelten Anlagen allseitig zu betätigen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.4.7
  kind: p
  original: Damit aber verschwinden notwendig auch die verschiedenen Klassen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.4.8
  kind: p
  original: So daß die kommunistisch organisierte Gesellschaft einerseits mit dem Bestand der Klassen unverträglich ist und andrerseits die Herstellung dieser Gesellschaft selbst die Mittel bietet, diese Klassenunterschiede aufzuheben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.5.1
  kind: p
  original: Es geht hieraus hervor, daß der Gegensatz zwischen Stadt und Land ebenfalls verschwinden wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.5.2
  kind: p
  original: Der Betrieb des Ackerbaues und der Industrie durch dieselben Menschen, statt durch zwei verschiedene Klassen, ist schon aus ganz materiellen Ursachen eine notwendige Bedingung der kommunistischen Assoziation.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.5.3
  kind: p
  original: Die Zersplitterung der ackerbauenden Bevölkerung auf dem Lande, neben der Zusammendrängung der industriellen in den großen Städten, ist ein Zustand, der nur einer noch unentwickelten Stufe des Ackerbaues und der Industrie entspricht, ein Hindernis aller weiteren Entwicklung, das schon jetzt sehr fühlbar wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q20.6.1
  kind: p
  original: Die allgemeine Assoziation aller Gesellschaftsmitglieder zur gemeinsamen und planmäßigen Ausbeutung der Produktionskräfte, die Ausdehnung der Produktion in einem Grade, daß sie die Bedürfnisse aller befriedigen wird, das Aufhören des Zustandes, in dem die Bedürfnisse der einen auf Kosten der andern befriedigt werden, die gänzliche Vernichtung der Klassen und ihrer Gegensätze, die allseitige Entwickelung der Fähigkeiten aller Gesellschaftsmitglieder durch die Beseitigung der bisherigen Teilung der Arbeit, durch die industrielle Erziehung, durch den Wechsel der Tätigkeit, durch die Teilnahme aller an den durch alle erzeugten Genüssen, durch die Verschmelzung von Stadt und Land - das sind die Hauptresultate der Abschaffung des Privateigentums.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
