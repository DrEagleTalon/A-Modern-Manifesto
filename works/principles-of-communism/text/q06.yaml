- id: Q6.1.1
  kind: p
  original: 'Antwort: Die arbeitenden Klassen haben je nach den verschiedenen Entwickelungsstufen der Gesellschaft in verschiedenen Verhältnissen gelebt und verschiedene Stellungen zu den besitzenden und herrschenden Klassen gehabt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q6.1.2
  kind: p
  original: Im Altertum waren die Arbeitenden die Sklaven der Besitzer, wie sie es in vielen zurückgebliebenen Ländern und selbst in dem südlichen Teil der Vereinigten Staaten noch sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q6.1.3
  kind: p
  original: Im Mittelalter waren sie die Leibeigenen des grundbesitzenden Adels, wie sie es noch jetzt in Ungarn, Polen und Rußland sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q6.1.4
  kind: p
  original: Im Mittelalter und bis zur industriellen Revolution gab es außerdem in den Städten Handwerksgesellen, die im Dienst kleinbürgerlicher Meister arbeiteten, und allmählich kamen auch mit der Entwicklung der Manufaktur Manufakturarbeiter auf, welche schon von größeren Kapitalisten beschäftigt wurden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
