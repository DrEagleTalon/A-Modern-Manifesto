verses:
- id: Q16.0.1
  kind: heading
  original: '16. Frage: Wird die Aufhebung des Privateigentums auf friedlichem Wege möglich sein?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q16.1.1
  kind: p
  original: 'Antwort: Es wäre zu wünschen, daß dies geschehen könnte, und die Kommunisten wären gewiß die letzten, die sich dagegen auflehnen würden.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q16.1.2
  kind: p
  original: Die Kommunisten wissen zu gut, daß alle Verschwörungen nicht nur nutzlos, sondern sogar schädlich sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q16.1.3
  kind: p
  original: Sie wissen zu gut, daß Revolutionen nicht absichtlich und willkürlich gemacht werden, sondern daß sie überall und zu jeder Zeit die notwendige Folge von Umständen waren, welche von dem Willen und der Leitung einzelner Parteien und ganzer Klassen durchaus unabhängig sind.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q16.2.1
  kind: p
  original: Sie sehen aber auch, daß die Entwicklung des Proletariats in fast allen zivilisierten Ländern gewaltsam unterdrückt und daß hierdurch von den Gegnern der Kommunisten auf eine Revolution mit aller Macht hingearbeitet wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q16.2.2
  kind: p
  original: Wird hierdurch das unterdrückte Proletariat zuletzt in eine Revolution hineingejagt, so werden wir Kommunisten dann ebensogut mit der Tat wie jetzt mit dem Wort die Sache der Proletarier verteidigen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
