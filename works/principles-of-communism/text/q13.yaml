verses:
- id: Q13.0.1
  kind: heading
  original: '13. Frage: Was folgt aus diesen sich regelmäßig wiederholenden Handelskrisen?'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q13.1.1
  kind: p
  original: 'Antwort: Erstens: Daß die große Industrie, obwohl sie selbst in ihrer ersten Entwicklungsepoche die freie Konkurrenz erzeugt hat, jetzt dennoch der freien Konkurrenz entwachsen ist; daß die Konkurrenz und überhaupt der Betrieb der industriellen Produktion durch einzelne für sie eine Fessel geworden ist, welche sie sprengen muß und wird; daß die große Industrie, solange sie auf dem jetzigen Fuße betrieben wird, sich nur durch eine von sieben zu sieben Jahren sich wiederholende allgemeine Verwirrung erhalten kann, welche jedesmal die ganze Zivilisation bedroht und nicht nur die Proletarier ins Elend stürzt, sondern auch eine große Anzahl von Bourgeois ruiniert; daß also die große Industrie selbst entweder ganz aufgegeben werden muß, was eine absolute Unmöglichkeit ist; oder daß sie eine ganz neue Organisation der Gesellschaft durchaus notwendig macht, in welcher nicht mehr einzelne, einander Konkurrenz machende Fabrikanten, sondern die ganze Gesellschaft nach einem festen Plan und nach den Bedürfnissen aller die industrielle Produktion leitet.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q13.2.1
  kind: p
  original: 'Zweitens: Daß die große Industrie und die durch sie möglich gemachte Ausdehnung der Produktion ins unendliche einen Zustand der Gesellschaft möglich machen, in welchem so viel von allen Lebensbedürfnissen produziert wird, daß jedes Mitglied der Gesellschaft dadurch in den Stand gesetzt wird, alle seine Kräfte und Anlagen in vollständiger Freiheit zu entwickeln und zu betätigen.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q13.2.2
  kind: p
  original: So daß also gerade diejenige Eigenschaft der großen Industrie, welche in der heutigen Gesellschaft alles Elend und alle Handelskrisen erzeugt, gerade dieselbe ist, welche unter einer anderen gesellschaftlichen Organisation eben dieses Elend und diese unglückbereitenden Schwankungen vernichten wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q13.2.3
  kind: p
  original: 'So daß also aufs klarste bewiesen ist:'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q13.3.1
  kind: p
  original: 1. daß von jetzt an alle diese Übel nur der für die Verhältnisse nicht mehr passenden Gesellschaftsordnung zuzuschreiben sind und
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
- id: Q13.4.1
  kind: p
  original: 2. daß die Mittel vorhanden sind, um durch eine neue Gesellschaftsordnung diese Übel gänzlich zu beseitigen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
