section: P1882
title_original: Preface to the First French Edition
title_en: Preface to the First French Edition
author: Carlo Cafiero and Elisée Reclus
date: 1882 (French); English 1883
original_language: fr
anchor_language: en
source_original: Not yet in this repository. Bakunin's French, Dieu et l'Etat (Geneva 1882, ed. Carlo Cafiero and Elisée Reclus), is still to be located on a reachable mirror.
source_en: Benjamin Tucker's English translation (Boston 1883), Mother Earth Publishing Association printing (New York, about 1916), Project Gutenberg ebook 36568 (public domain)
verses:
- id: P1882.0.1
  kind: heading
  original: ''
  en: Preface to the First French Edition
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.1.1
  kind: p
  original: ''
  en: One of us is soon to tell in all its details the story of the life of Michael Bakunin, but its general features are already sufficiently familiar.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.1.2
  kind: p
  original: ''
  en: Friends and enemies know that this man was great in thought, will, persistent energy; they know also with what lofty contempt he looked down upon wealth, rank, glory, all the wretched ambitions which most human beings are base enough to entertain.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.1.3
  kind: p
  original: ''
  en: A Russian gentleman related by marriage to the highest nobility of the empire, he was one of the first to enter that intrepid society of rebels who were able to release themselves from traditions, prejudices, race and class interests, and set their own comfort at naught.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.1.4
  kind: p
  original: ''
  en: With them he fought the stern battle of life, aggravated by imprisonment, exile, all the dangers and all the sorrows that men of self-sacrifice have to undergo during their tormented existence.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.2.1
  kind: p
  original: ''
  en: A simple stone and a name mark the spot in the cemetery of Berne where was laid the body of Bakunin.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.2.2
  kind: p
  original: ''
  en: Even that is perhaps too much to honor the memory of a worker who held vanities of that sort in such slight esteem.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.2.3
  kind: p
  original: ''
  en: His friends surely will raise to him no ostentatious tombstone or statue.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.2.4
  kind: p
  original: ''
  en: They know with what a huge laugh he would have received them, had they spoken to him of a commemorative structure erected to his glory; they knew, too, that the true way to honor their dead is to continue their work--with the same ardor and perseverance that they themselves brought to it.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.2.5
  kind: p
  original: ''
  en: In this case, indeed, a difficult task demanding all our efforts, for among the revolutionists of the present generation not one has labored more fervently in the common cause of the Revolution.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.3.1
  kind: p
  original: ''
  en: In Russia among the students, in Germany among the insurgents of Dresden, in Siberia among his brothers in exile, in America, in England, in France, in Switzerland, in Italy, among all earnest men, his direct influence has been considerable.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.3.2
  kind: p
  original: ''
  en: The originality of his ideas, the imagery and vehemence of his eloquence, his untiring zeal in propagandism, helped too by the natural majesty of his person and by a powerful vitality, gave Bakunin access to all the revolutionary groups, and his efforts left deep traces everywhere, even upon those who, after having welcomed him, thrust him out because of a difference of object or method.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.3.3
  kind: p
  original: ''
  en: His correspondence was most extensive; he passed entire nights in preparing long letters to his friends in the revolutionary world, and some of these letters, written to strengthen the timid, arouse the sluggish, and outline plans of propagandism or revolt, took on the proportions of veritable volumes.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.3.4
  kind: p
  original: ''
  en: These letters more than anything else explain the prodigious work of Bakunin in the revolutionary movement of the century.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.3.5
  kind: p
  original: ''
  en: The pamphlets published by him, in Russian, French, and Italian, however important they may be, and however useful they may have been in spreading the new ideas, are the smallest part of Bakunin's work.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.4.1
  kind: p
  original: ''
  en: The present memoir, "God and the State," is really a fragment of a letter or report.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.4.2
  kind: p
  original: ''
  en: 'Composed in the same manner as most of Bakunin''s other writings, it has the same literary fault, lack of proportion; moreover it breaks off abruptly: we have searched in vain to discover the end of the manuscript.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.4.3
  kind: p
  original: ''
  en: Bakunin never had the time necessary to finish all the tasks he undertook.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.4.4
  kind: p
  original: ''
  en: One work was not completed when others were already under way.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.4.5
  kind: p
  original: ''
  en: '"My life itself is a fragment," he said to those who criticised his writings.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.4.6
  kind: p
  original: ''
  en: Nevertheless, the readers of "God and the State" certainly will not regret that Bakunin's memoir, incomplete though it be, has been published.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.4.7
  kind: p
  original: ''
  en: The questions discussed in it are treated decisively and with a singular vigor of logic.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.4.8
  kind: p
  original: ''
  en: Rightly addressing himself only to his honest opponents, Bakunin demonstrates to them the emptiness of their belief in that divine authority on which all temporal authorities are founded; he proves to them the purely human genesis of all governments; finally, without stopping to discuss those bases of the State already condemned by public morality, such as physical superiority, violence, nobility, wealth, he does justice to the theory which would entrust science with the government of societies.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.4.9
  kind: p
  original: ''
  en: Supposing even that it were possible to recognize, amid the conflict of rival ambitions and intrigues, who are the pretenders and who are the real savants, and that a method of election could be found which would not fail to lodge the power in the hands of those whose knowledge is authentic, what guarantee could they offer us of the wisdom and honesty of their government?
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.4.10
  kind: p
  original: ''
  en: On the contrary, can we not foresee in these new masters the same follies and the same crimes found in those of former days and of the present time?
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.4.11
  kind: p
  original: ''
  en: 'In the first place, science is not: it is becoming.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.4.12
  kind: p
  original: ''
  en: The learned man of to-day is but the know-nothing of to-morrow.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.4.13
  kind: p
  original: ''
  en: Let him once imagine that he has reached the end, and for that very reason he sinks beneath even the babe just born.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.4.14
  kind: p
  original: ''
  en: But, could he recognize truth in its essence, he can only corrupt himself by privilege and corrupt others by power.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.4.15
  kind: p
  original: ''
  en: To establish his government, he must try, like all chiefs of State, to arrest the life of the masses moving below him, keep them in ignorance in order to preserve quiet, and gradually debase them that he may rule them from a loftier throne.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.5.1
  kind: p
  original: ''
  en: For the rest, since the doctrinaires made their appearance, the true or pretended "genius" has been trying his hand at wielding the sceptre of the world, and we know what it has cost us.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.5.2
  kind: p
  original: ''
  en: 'We have seen them at work, all these savants: the more hardened the more they have studied; the narrower in their views the more time they have spent in examining some isolated fact in all its aspects; without any experience of life, because they have long known no other horizon than the walls of their cheese; childish in their passions and vanities, because they have been unable to participate in serious struggles and have never learned the true proportion of things.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.5.3
  kind: p
  original: ''
  en: Have we not recently witnessed the foundation of a whole school of "thinkers"--wretched courtiers, too, and people of unclean lives--who have constructed a whole cosmogony for their sole use?
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.5.4
  kind: p
  original: ''
  en: According to them, worlds have been created, societies have developed, revolutions have overturned nations, empires have gone down in blood, poverty, disease, and death have been the queens of humanity, only to raise up an élite of academicians, the full-blown flower, of which all other men are but the manure.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.5.5
  kind: p
  original: ''
  en: That these editors of the Temps and the Debats may have leisure to "think," nations live and die in ignorance; all other human beings are destined for death in order that these gentlemen may become immortal!
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.6.1
  kind: p
  original: ''
  en: 'But we may reassure ourselves: all these academicians will not have the audacity of Alexander in cutting with his sword the Gordian knot; they will not lift the blade of Charlemagne.'
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.6.2
  kind: p
  original: ''
  en: Government by science is becoming as impossible as that of divine right, wealth, or brute force.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.6.3
  kind: p
  original: ''
  en: All powers are henceforth to be submitted to pitiless criticism.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.6.4
  kind: p
  original: ''
  en: Men in whom the sentiment of equality is born suffer themselves no longer to be governed; they learn to govern themselves.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.6.5
  kind: p
  original: ''
  en: In precipitating from the heights of the heavens him from whom all power is reputed to descend, societies unseat also all those who reigned in his name.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.6.6
  kind: p
  original: ''
  en: Such is the revolution now in progress.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.6.7
  kind: p
  original: ''
  en: States are breaking up to give place to a new order, in which, as Bakunin was fond of saying, "human justice will be substituted for divine justice."
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.6.8
  kind: p
  original: ''
  en: If it is allowable to cite any one name from those of the revolutionists who have taken part in this immense work of renovation, there is not one that may be singled out with more justice than that of Michael Bakunin.
  modern: ''
  modern_status: empty
  notes: ''
- id: P1882.7.1
  kind: signature
  original: ''
  en: Carlo Cafiero. Elisée Reclus.
  modern: ''
  modern_status: empty
  notes: ''
