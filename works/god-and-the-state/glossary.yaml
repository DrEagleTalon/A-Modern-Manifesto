# Glossary of recurring and contested terms in God and the State (GAS).
# The French original is not in the repository yet. The `french` field gives the word Bakunin is
# usually taken to use; check it against the 1882 French text when that column is added.
# english_1883 is Benjamin Tucker's choice, the historical column here.
# status: open (being discussed) | interim (use `interim` until decided) | decided

- term: idealists and materialists
  french: les idéalistes, les matérialistes
  english_1883: idealists, materialists, idealism, materialism
  literal: those who put ideas first; those who put matter first
  options: [idealists and materialists, those who start from ideas and those who start from material life]
  interim: idealists, materialists
  status: open
  verses: [0.1.1, 0.1.3, 0.88.1, 0.98.1, 0.N9.1.11]
  note: The philosophical sense, not the everyday one (someone with high hopes, someone who wants things). Bakunin opens with the question and closes the argument by turning it round (0.88.1, 0.98.1). The draft must keep the philosophical sense, with a first-use gloss if needed.

- term: authority
  french: autorité
  english_1883: authority, the principle of authority
  literal: the right to command; also the standing of an expert
  options: [authority, expertise, command, the right to rule]
  interim: authority
  status: open
  verses: [0.57.1, 0.70.1, 0.70.3, 0.70.5, 0.73.1, 0.74.3]
  note: Bakunin uses the one word for two things and the whole of 0.57 to 0.74 turns on telling them apart. The bootmaker is an authority he consults; nobody may impose authority on him. Keep the one word in the draft so the argument still works, and let the sentence show which sense is meant.

- term: savant
  french: savant
  english_1883: savant, savants, men of science, the learned
  literal: a learned man, a scientist
  options: [scientist, expert, scholar, academic]
  interim: scientist, or expert where the point is specialist knowledge
  status: open
  verses: [P1882.4.9, P1882.5.2, 0.65.3, 0.70.4, 0.122.2, 0.137.1]
  note: Tucker leaves the French word in English. Bakunin means the professional learned class, especially those with official posts (the "officially licensed savant", 0.65.3). "Scientist" is too narrow where he means scholars of every kind; "expert" fits the bootmaker passage (0.70.4).

- term: science
  french: la science
  english_1883: science, men of science
  literal: organised knowledge
  options: [science, knowledge, scholarship]
  interim: science
  status: open
  verses: [0.2.1, 0.74.2, 0.120.7, 0.121.4, 0.137.1]
  note: In French of the time "la science" covers all systematic knowledge, the study of society included. Bakunin both trusts it (0.74.2) and refuses it the right to govern (0.120.7 onward). The draft should not narrow it to laboratory science.

- term: animality
  french: animalité
  english_1883: animality, human animality, the animal element in man
  literal: being an animal
  options: [animality, our animal nature, the animal in us]
  interim: our animal nature
  status: open
  verses: [0.2.1, 0.4.1, 0.11.1, 0.34.6, 0.103.2]
  note: Not an insult. It is the first of the elements of human development in 0.11.1, matched to economic life, and humanity is its gradual negation (0.2.1). Keep the neutral sense.

- term: rebellion
  french: révolte
  english_1883: rebellion, revolt, the desire to rebel
  literal: revolt
  options: [rebellion, revolt, refusal to obey]
  interim: rebellion
  status: open
  verses: [0.3.1, 0.5.6, 0.10.2, 0.11.1, 0.165.9]
  note: Paired with thought from 0.3.1 on, and matched to liberty in 0.11.1. In Bakunin it is a faculty, not only an event. Keep "rebellion" where it names the faculty.

- term: liberty
  french: liberté
  english_1883: liberty, freedom (rarely)
  literal: freedom
  options: [freedom, liberty]
  interim: freedom
  status: open
  verses: [0.5.7, 0.53.7, 0.54.1, 0.74.3, 0.125.7]
  note: Tucker uses "liberty" almost throughout. Today "freedom" is the plain word, and "liberty" now carries a party flavour in the United States. The famous sentence (0.54.1) should be drafted with care either way.

- term: the State
  french: l'État
  english_1883: the State, State
  literal: the state
  options: [the State, the state, government]
  interim: the State, capitalised, as in AN
  status: open
  verses: [0.31.5, 0.86.5, 0.86.6, 0.125.7, 0.188.5]
  note: In Bakunin the State and the Church are the twin institutions of the title. Do not swap in "government" where he says the State; in 0.86.5 he says a republic is still the State.

- term: doctrinaire
  french: doctrinaire, doctrinairisme
  english_1883: doctrinaire, doctrinaires, doctrinairisme
  literal: one who rules by doctrine; also the French political school of that name
  options: [doctrinaire, dogmatist, theorist who rules by doctrine]
  interim: doctrinaire, with a note at P1882.5.1
  status: open
  verses: [P1882.5.1, 0.97.4, 0.125.6, 0.133.7, 0.N7.1.2]
  note: In P1882.5.1 "the doctrinaires" are probably the French school of Royer-Collard and Guizot, the same school Bakunin attacks at the end (0.196.1 onward). Elsewhere it means anyone who would govern life by a fixed doctrine. The draft needs to tell the two apart.

- term: propagandism
  french: propagande
  english_1883: propagandism, propaganda
  literal: spreading ideas
  options: [propaganda, spreading the word, campaigning]
  interim: propaganda
  status: open
  verses: [P1882.3.2, 0.20.4, 0.95.6, 0.164.4, 0.173.2]
  note: Neutral in Bakunin's use and in his editors'. It means the work of spreading ideas, not lying to the public. If the draft uses "propaganda", a first-use note should say so.

- term: spiritualism
  french: spiritualisme
  english_1883: spiritualism, spiritualistic, spiritualization
  literal: the doctrine that spirit is prior to matter
  options: [spiritualism, idealist philosophy, belief in pure spirit]
  interim: the philosophy of pure spirit, except at 0.172.2
  status: open
  verses: [0.150.1, 0.155.7, 0.155.8, 0.163.3, 0.172.2]
  note: In French philosophy of the time "spiritualisme" is the school that puts spirit before matter (Cousin's school). That is the sense at 0.150.1 to 0.163.3. Only at 0.172.2, beside "animal magnetism" and "tipping tables", does it mean seances. An English reader will hear seances everywhere unless the draft says otherwise.

- term: the good God
  french: le bon Dieu
  english_1883: the good God
  literal: the good Lord (an everyday French phrase)
  options: [the good Lord, God, the good God]
  interim: the good Lord, where the irony is meant
  status: open
  verses: [0.6.2, 0.96.1, 0.137.4, 0.156.3]
  note: The phrase "le bon Dieu" is ordinary French for God, and Bakunin uses it with irony. "The good God" sounds stiff in English and loses the tone. The draft has to keep the irony without adding mockery Bakunin did not write.
