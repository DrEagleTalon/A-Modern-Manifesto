verses:
- id: VI.0.1
  kind: heading
  original: VI. Gens und Staat in Rom
  en: CHAPTER VI. GENS AND STATE IN ROME.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.1.1
  kind: p
  original: Aus der Sage von der Gründung Roms geht hervor, daß die erste Ansiedlung durch eine Anzahl zu einem Stamm vereinigter latinischer Gentes (der Sage nach hundert) erfolgte, denen sich bald ein sabellischer Stamm, der ebenfalls hundert Gentes gezählt haben soll, und endlich ein dritter, aus verschiedenen Elementen bestehender Stamm, wieder von angeblich hundert Gentes, anschloß.
  en: The legend of the foundation of Rome sets forth that the first colonization was undertaken by a number of Latin gentes (one hundred, so the legend says) united into one tribe. A Sabellian tribe (also said to consist of one hundred gentes) soon followed, and finally a third tribe of various elements, but again numbering one hundred gentes, joined them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.1.2
  kind: p
  original: Die ganze Erzählung zeigt auf den ersten Blick, daß hier wenig mehr naturwüchsig war außer der Gens und diese selbst in manchen Fällen nur ein Ableger einer in der alten Heimat fortbestehenden Muttergens.
  en: The whole tale reveals at the first glance that little more than the gens was borrowed from reality, and that the gens itself was in certain cases only an offshoot of an old mother gens still existing at home.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
- id: VI.1.3
  kind: p
  original: Die Stämme tragen an der Stirn den Stempel künstlicher Zusammensetzung, jedoch meist aus verwandten Elementen und nach dem Vorbild des alten gewachsenen, nicht gemachten Stamms; wobei nicht ausgeschlossen bleibt, daß der Kern jedes der drei Stämme ein wirklicher, alter Stamm gewesen sein kann.
  en: The tribes bear the mark of artificial composition on their foreheads; still they were made up of kindred elements and after the model of the old spontaneous, not artificial tribe. At the same time it is not impossible that a genuine old tribe formed the nucleus of every one of these three tribes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.1.4
  kind: p
  original: Das Mittelglied, die Phratrie, bestand aus zehn Gentes und hieß Curie; ihrer waren also dreißig.
  en: The connecting link, the phratry, contained ten gentes and was called curia. Hence there were thirty curiae.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.2.1
  kind: p
  original: Daß die römische Gens dieselbe Institution war wie die griechische, ist anerkannt; ist die griechische eine Fortbildung derjenigen gesellschaftlichen Einheit, deren Urform uns die amerikanischen Rothäute vorführen, so gilt dasselbe ohne weiteres auch für die römische.
  en: The Roman gens is recognized as an institution identical with the Grecian gens. The Grecian gens being a continuation of the same social unit, the primordial form of which we found among the American Indians, the same holds naturally good of the Roman gens, and we can be more concise in its treatment.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: VI.2.2
  kind: p
  original: Wir können uns hier also kürzer fassen.
  en: ''
  joined_to: VI.2.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '117'
- id: VI.3.1
  kind: p
  original: 'Die römische Gens hatte wenigstens in der ältesten Zeit der Stadt folgende Verfassung:'
  en: 'At least during the most ancient times of the city, the Roman gens had the following constitution:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
- id: VI.4.1
  kind: p
  original: 1. Gegenseitiges Erbrecht der Gentilgenossen; das Vermögen blieb in der Gens.
  en: 1. Mutual right of inheritance for gentiles; the wealth remained in the gens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
- id: VI.4.2
  kind: p
  original: Da in der römischen Gens wie in der griechischen schon Vaterrecht herrschte, waren die Nachkommen der weiblichen Linie ausgeschlossen.
  en: Paternal law being already in force in the Roman the same as in the Grecian gens, the offspring of female lineage were excluded.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
- id: VI.4.3
  kind: p
  original: Nach dem Gesetz der zwölf Tafeln, dem ältesten uns bekannten geschriebnen römischen Recht, erbten zunächst die Kinder als Leibeserben; in deren Ermanglung die Agnaten (Verwandte in männlicher Linie); und in deren Abwesenheit die Gentilgenossen.
  en: According to the law of the twelve tablets, the oldest written law of Rome known to us, the natural children had the first title to the estate; in case no natural children existed, the agnati (kin of male lineage) took their place; and last in line came the gentiles.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '117'
- id: VI.4.4
  kind: p
  original: In allen Fällen blieb das Vermögen in der Gens.
  en: In all cases the property remained in the gens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 117-118
- id: VI.4.5
  kind: p
  original: 'Wir sehn hier das allmähliche Eindringen neuer, durch vermehrten Reichtum und Monogamie verursachter Rechtsbestimmungen in den Gentilbrauch: Das ursprüngliche gleiche Erbrecht der Gentilgenossen wird zuerst - wohl schon früh, wie oben erwähnt - durch Praxis auf die Agnaten beschränkt, endlich auf die Kinder und deren Nachkommen im Mannsstamm; in den zwölf Tafeln erscheint dies selbstverständlich in umgekehrter Ordnung.'
  en: Here we observe the gradual introduction of new legal provisions, caused by increased wealth and monogamy, into the gentile practice. The originally equal right of inheritance of the gentiles was first limited in practice to the agnati, no doubt at a very remote date, and afterwards to the natural children and their offspring of male lineage. Of course this appears in the reverse order on the twelve tablets.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VI.5.1
  kind: p
  original: 2. Besitz eines gemeinsamen Begräbnisplatzes.
  en: 2. Possession of a common burial ground.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: VI.5.2
  kind: p
  original: Die patrizische Gens Claudia erhielt bei ihrer Einwanderung aus Regili nach Rom ein Stück Land für sich angewiesen, dazu in der Stadt einen gemeinsamen Begräbnisplatz.
  en: The patrician gens Claudia, on immigrating into Rome from Regilli, was assigned to a separate lot of land and received its own burial ground in the city.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: VI.5.3
  kind: p
  original: Noch unter Augustus wurde der nach Rom gekommene Kopf des im Teutoburger Wald gefallenen Varus im gentilitius tumulus beigesetzt; die Gens (Quinctilia) hatte also noch einen besondern Grabhügel.
  en: As late as the time of Augustus, the head of Varus, who had been killed in the Teutoburger Wald, was brought to Rome and interred in the gentilitius tumulus; hence his gens (Quinctilia) still had its own tomb.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T1
    editions: '1884'
    reading: 'lautet der letzte Satz: Noch unter Augustus wurde der nach Rom gekommene Kopf des im Teutoburger Wald gefallenen Varus in der Grabstätte der Gens Quinctilia (gentilitius tumulus) beigesetzt'
    base_text: … noch einen besondern Grabhügel. ‸  …
  mew_page: '118'
- id: VI.6.1
  kind: p
  original: 3. Gemeinsame religiöse Feiern.
  en: 3. Common religious rites.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: VI.6.2
  kind: p
  original: Diese, die sacra gentilitia, sind bekannt.
  en: These are well-known under the name of sacra gentilitia.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: VI.7.1
  kind: p
  original: 4. Verpflichtung, nicht in der Gens zu heiraten.
  en: 4. Obligation not to intermarry in the gens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: VI.7.2
  kind: p
  original: Dies scheint in Rom nie in ein geschriebnes Gesetz verwandelt worden zu sein, aber die Sitte blieb.
  en: It seems that this was never a written law in Rome, but the custom remained.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: VI.7.3
  kind: p
  original: Von der Unmasse römischer Ehepaare, deren Namen uns aufbewahrt, hat kein einziges gleichen Gentilnamen für Mann und Frau.
  en: Among the innumerable names of Roman couples preserved for us there is not a single case, where husband and wife had the same gentile name.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: VI.7.4
  kind: p
  original: Das Erbrecht beweist diese Regel ebenfalls.
  en: The law of inheritance proves the same rule.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: VI.7.5
  kind: p
  original: Die Frau verliert durch die Heirat ihre agnatischen Rechte, tritt aus ihrer Gens, weder sie noch ihre Kinder können von ihrem Vater oder dessen Brüdern erben, weil sonst das Erbteil der väterlichen Gens verlorenginge.
  en: By marrying, a woman loses her agnatic privileges, discards her gens, and neither she nor her children have any title to her father's estate nor to that of his brothers, because otherwise the gens of her father would lose his property.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: VI.7.6
  kind: p
  original: Dies hat Sinn nur unter der Voraussetzung, daß die Frau keinen Gentilgenossen heiraten kann.
  en: This rule has a meaning only then when the woman is not permitted to marry a gentile.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: VI.8.1
  kind: p
  original: 5. Ein gemeinsamer Grundbesitz.
  en: 5. A common piece of land.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: VI.8.2
  kind: p
  original: Dieser war in der Urzeit stets vorhanden, sobald das Stammland anfing geteilt zu werden.
  en: In primeval days this was always obtained when the tribal territory was first divided.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: VI.8.3
  kind: p
  original: Unter den latinischen Stämmen finden wir den Boden teils im Besitz des Stammes, teils der Gens, teils der Haushaltungen, welche damals schwerlich Einzelfamilien waren.
  en: Among the Latin tribes we find the land partly in the possession of the tribe, partly of the gens, and partly of the households that could hardly represent single families at such an early date.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T2
    editions: '1884'
    reading: 'nicht notwendig (statt: damals schwerlich)'
    base_text: … Haushaltungen, welche damals schwerlich ‸ Einzelfamilien waren. …
  mew_page: '118'
- id: VI.8.4
  kind: p
  original: Romulus soll die ersten Landteilungen an einzelne gemacht haben, ungefähr eine Hektare (zwei Jugera) auf jeden.
  en: Romulus is credited with being the first to assign land to single individuals, about 2.47 acres (two jugera) per head.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: VI.8.5
  kind: p
  original: Doch finden wir noch später Grundbesitz in den Händen der Gentes, vom Staatsland gar nicht zu sprechen, um das sich die ganze innere Geschichte der Republik dreht.
  en: But later on we still find some land in the hands of the gentes, not to mention the state land, around which turns the whole internal history of the republic.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: VI.9.1
  kind: p
  original: 6. Pflicht der Gentilgenossen zu gegenseitigem Schutz und Beistand.
  en: 6. Duty of the gentiles to mutually protect and assist one another.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '118'
- id: VI.9.2
  kind: p
  original: Davon zeigt uns die geschriebne Geschichte nur noch Trümmer; der römische Staat trat gleich von vornherein mit solcher Übermacht auf, daß das Recht des Schutzes gegen Unbill auf ihn überging.
  en: Written history records only remnants of this law. The Roman state from the outset manifested such superior power, that the duty of protection against injury devolved upon it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 118-119
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.9.3
  kind: p
  original: Als Appius Claudius verhaftet wurde, legte seine ganze Gens Trauer an, selbst die seine persönlichen Feinde waren.
  en: When Appius Claudius was arrested, his whole gens, including his personal enemies, dressed in mourning.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '119'
- id: VI.9.4
  kind: p
  original: Zur Zeit des zweiten Punischen Kriegs verbanden sich die Gentes zur Auslösung ihrer kriegsgefangnen Gentilgenossen; der Senat verbot es ihnen.
  en: At the time of the second Punic war the gentes united for the purpose of ransoming their captured gentiles. The senate vetoed this.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '119'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.10.1
  kind: p
  original: 7. Recht, den Gentilnamen zu tragen.
  en: 7. Right to bear the gentile name.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '119'
- id: VI.10.2
  kind: p
  original: Blieb bis in die Kaiserzeit; den Freigelaßnen erlaubte man, den Gentilnamen ihrer ehemaligen Herren anzunehmen, doch ohne Gentilrechte.
  en: This was in force until the time of the emperors. Freed slaves were permitted to assume the gentile name of their former master, but this did not bestow any gentile rights on them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '119'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.11.1
  kind: p
  original: 8. Recht der Adoption Fremder in die Gens.
  en: 8. Right of adopting strangers into the gens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '119'
- id: VI.11.2
  kind: p
  original: Dies geschah durch Adoption in eine Familie (wie bei den Indianern), die die Aufnahme in die Gens mit sich führte.
  en: This was done by adoption into the family (the same as among the Indians) which brought with it the adoption into the gens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '119'
- id: VI.12.1
  kind: p
  original: 9. Das Recht, den Vorsteher zu wählen und abzusetzen, wird nirgends erwähnt.
  en: 9. The right to elect and depose chiefs is not mentioned anywhere.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '119'
- id: VI.12.2
  kind: p
  original: Da aber in der ersten Zeit Roms alle Ämter durch Wahl oder Ernennung besetzt wurden, vom Wahlkönig abwärts, und auch die Priester der Curien von diesen gewählt, so dürfen wir für die Vorsteher (principes) der Gentes dasselbe annehmen - so sehr auch die Wahl aus einer und derselben Familie in der Gens schon Regel geworden sein mochte.
  en: But inasmuch as during the first years of Rome's existence all offices were filled by election or nomination, from the king downward, and as the curiae elected also their own priests, we are justified in assuming the same in regard to gentile chiefs (principes)--no matter how well established the rule of choosing the candidates from the same family have been.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '119'
- id: VI.13.1
  kind: p
  original: Das waren die Befugnisse einer römischen Gens.
  en: Such were the constitutional rights of a Roman gens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '119'
- id: VI.13.2
  kind: p
  original: Mit Ausnahme des bereits vollendeten Übergangs zum Vaterrecht sind sie das treue Spiegelbild der Rechte und Pflichten einer irokesischen Gens; auch hier "guckt der Irokese unverkennbar durch".
  en: With the exception of the completed transition to paternal law, they are the true image of the rights and duties of an Iroquois gens. Here, also, "the Iroquois is still plainly visible."
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T3
    editions: '1884'
    reading: 'fehlt der folgende Text bis zum Absatz: Noch fast dreihundert Jahre... (S. 122)'
    base_text: … der Irokese unverkennbar durch". ‸  …
  mew_page: '119'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.14.1
  kind: p
  original: Welche Verwirrung, auch bei unsern anerkanntesten Geschichtsschreibern, heute noch über die römische Gentilordnung herrscht, dafür nur ein Beispiel.
  en: 'How confused the ideas of our historians, even the most prominent of them, are when it comes to a discussion of the Roman gens, is shown by the following example: In Mommsen''s treatise on the Roman family names of the Republican and Augustinian era (Roemische Forschungen, Berlin, 1864, Vol. I.) he writes: "The gentile name was not only borne by all male gentiles including all adopted and wards, except, of course, the slaves, but also by the women....'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '119'
  align: '3:1'
  review: true
  review_reason: 3 de sentence(s) matched to 1 en sentence(s)
- id: VI.14.2
  kind: p
  original: 'In Mommsens Abhandlung über die römischen Eigennamen der republikanischen und augustinischen Zeit ("Römische Forschungen", Berlin 1864, I. Band) heißt es:'
  en: ''
  joined_to: VI.14.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '119'
- id: VI.15.1
  kind: p
  original: '"Außer den sämtlichen männlichen Geschlechtsgenossen, mit Ausschluß natürlich der Sklaven, aber mit Einschluß der Zugewandten und Schutzbefohlnen, kommt der Geschlechtsname auch den Frauen zu...'
  en: ''
  joined_to: VI.14.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '119'
- id: VI.15.2
  kind: p
  original: Der Stamm" (wie Mommsen hier gens übersetzt) "ist... ein aus gemeinschaftlicher - wirklicher oder vermuteter oder auch fingierter - Abstammung hervorgegangenes, durch Fest-, Grab- und Erbgenossenschaft vereinigtes Gemeinwesen, dem alle persönlich freien Individuen, also auch die Frauen, sich zuzählen dürfen und müssen.
  en: The tribe (so Mommsen translates gens) is a common organization resulting from a common--actual, assumed or even invented--ancestor and united by common rites, burial grounds and customs of inheritance. All free individuals, hence women also, may and must claim membership in them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '119'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.15.3
  kind: p
  original: Schwierigkeit aber macht die Bestimmung des Geschlechtsnamens der verheirateten Frauen.
  en: But the definition of the gentile name of the married women offers some difficulty.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '119'
- id: VI.15.4
  kind: p
  original: Dieselbe fällt freilich weg, solange die Frau sich nicht anders als mit einem Geschlechtsgenossen vermählen durfte; und nachweislich hat es für die Frauen lange Zeit größere Schwierigkeit gehabt, außerhalb als innerhalb des Geschlechts sich zu verheiraten, wie denn jenes Recht, die gentis enuptio, noch im 6. Jahrhundert als persönliches Vorrecht zur Belohnung vergeben worden ist... wo nun aber dergleichen Ausheiratungen vorkamen, muß die Frau in ältester Zeit damit in den Stamm des Mannes übergegangen sein.
  en: This is indeed obviated, as long as women were not permitted to marry any one but their gentiles. And we have proofs that for a long time the women found it much more difficult to marry outside than inside of the gens. This right of marrying outside, the gentis enuptio, was still bestowed as a personal privilege and reward during the sixth century.... But wherever such outside marriages occurred in primeval times, the woman must have been transferred to the tribe of her husband.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 119-120
  align: '1:4'
  review: true
  review_reason: 1 de sentence(s) matched to 4 en sentence(s)
- id: VI.15.5
  kind: p
  original: Nichts ist sicherer, als daß die Frau in der alten religiösen Ehe völlig in die rechtliche und sakrale Gemeinschaft des Mannes ein- und aus der ihrigen austritt.
  en: Nothing is more certain than that by the old religious marriage woman was completely adopted into the legal and sacramental group of her husband and divorced from her own.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: VI.15.6
  kind: p
  original: Wer weiß es nicht, daß die verheiratete Frau das Erbrecht gegen ihre Gentilen aktiv und passiv einbüßt, dagegen mit ihrem Mann, ihren Kindern und dessen Gentilen überhaupt in Erbverband tritt?
  en: Who does not know that the married woman releases her active and passive right of inheritance in favor of her gentiles, but enters the legal group of her husband, her children and his gentiles?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: VI.15.7
  kind: p
  original: Und wenn sie ihrem Mann an Kindes Statt wird und in seine Familie gelangt, wie kann sie seinem Geschlecht fernbleiben?" (S. 8-11.)
  en: And if her husband adopts her as his child into his family, how can she remain separated from his gens?" (Pages 9-11.)
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: VI.16.1
  kind: p
  original: Mommsen behauptet also, die römischen Frauen, die einer Gens angehörten, hätten ursprünglich nur innerhalb ihrer Gens heiraten dürfen, die römische Gens sei also endogam gewesen, nicht exogam.
  en: Here Mommsen asserts that the Roman women belonging to a certain gens were originally free to marry only within their gens; the Roman gens, according to him, was therefore endogamous, not exogamous.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: VI.16.2
  kind: p
  original: Diese Ansicht, die aller Erfahrung bei andern Völkern widerspricht, gründet sich hauptsächlich, wenn nicht ausschließlich, auf eine einzige vielumstrittene Stelle des Livius (Buch XXXIX, c. 19), wonach der Senat im Jahr der Stadt 568, vor unsrer Zeitrechnung 186, beschloß, uti Feceniae Hispalae datio, deminutio, gentis enuptio, tutoris optio item esset quasi ei vir testamento dedisset; utique ei ingenuo nubere liceret, neu quid ei qui eam duxisset, ob id fraudi ignominiaeve esset - daß die Fecenia Hispala das Recht haben soll, über ihr Vermögen zu verfügen, es zu vermindern, außer der Gens zu heiraten und sich einen Vormund zu wählen, ganz als ob ihr (verstorbner) Mann ihr dies Recht durch Testament übertragen hätte; daß sie einen Vollfreien heiraten dürfe, und daß dem, der sie zur Frau nehme, dies nicht als schlechte Handlung oder Schande angerechnet werden soll.
  en: This opinion which contradicts the evidence of all other nations, is principally, if not exclusively, founded on a single much disputed passage of Livy (Book xxxix, c. 19). According to this passage, the senate decreed in the year 568 of the city, i. e., 186 B. C., (uti Feceniae Hispallae datio, deminutio, gentis enuptio, tutoris optio idem esset quasi ei vir testamento dedisset; utique ei ingenuo nubere liceret, neu quid ei qui eam duxisset, ob id fraudi ignominiaeve esset)--that Fecenia Hispalla shall have the right to dispose of her property, to diminish it, to marry outside of the gens, to choose a guardian, just as if her (late) husband had conferred this right on her by testament; that she shall be permitted to marry a freeman and that for the man who marries her this shall not constitute a misdemeanor or a shame.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.17.1
  kind: p
  original: Unzweifelhaft wird hier also der Fecenia, einer Freigelaßnen, das Recht erteilt, außerhalb der Gens zu heiraten.
  en: Without a doubt Fecenia, a freed slave, here obtains permission to marry outside of the gens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: VI.17.2
  kind: p
  original: Und ebenso unzweifelhaft hatte hiernach der Ehemann des Recht, testamentarisch seiner Frau das Recht zu übertragen, nach seinem Tode außerhalb der Gens zu heiraten.
  en: And equally doubtless the husband here has the right to confer on his wife by testament the right to marry outside of the gens after his death.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: VI.17.3
  kind: p
  original: Aber außerhalb welcher Gens?
  en: But outside of which gens?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: VI.18.1
  kind: p
  original: Mußte die Frau innerhalb ihrer Gens heiraten, wie Mommsen annimmt, so blieb sie auch nach der Heirat in dieser Gens.
  en: If a woman had to intermarry in the gens, as Mommsen assumes, then she remained in this gens after her marriage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: VI.18.2
  kind: p
  original: Erstens aber ist diese behauptete Endogamie der Gens grade das, was zu beweisen ist.
  en: But in the first place, this assertion of an endogamous gens must be proven.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: VI.18.3
  kind: p
  original: Und zweitens, wenn die Frau in der Gens heiraten mußte, dann natürlich auch der Mann, der ja sonst keine Frau bekam.
  en: And in the second place, if the women had to intermarry in the gens, then the men had to do the same, otherwise there could be no marriage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
- id: VI.18.4
  kind: p
  original: Dann kommen wir dahin, daß der Mann seiner Frau testamentarisch ein Recht vermachen konnte, das er selbst, und für sich selbst, nicht besaß; wir kommen auf einen rechtlichen Widersinn.
  en: Then we arrive at the conclusion that the man could bequeath a right to his wife, which he did not have for himself. This is a legal impossibility.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s); regrouped by the ingest (see REALIGN)
- id: VI.18.5
  kind: p
  original: 'Mommsen fühlt dies auch und vermutet daher:'
  en: 'Mommsen feels this very well, and hence he supposes: "The marriage outside of the gens most probably required not only the consent of the testator, but of all gentiles." (Page 10, footnote.)'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '120'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s); regrouped by the ingest (see REALIGN)
- id: VI.19.1
  kind: p
  original: '"Es bedurfte für die Ausheiratung aus dem Geschlecht rechtlich wohl nicht bloß der Einwilligung des Gewalthabenden, sondern der sämtlichen Gentilgenossen." (S. 10, Note.)'
  en: ''
  joined_to: VI.18.5
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '120'
- id: VI.20.1
  kind: p
  original: Das ist erstens eine sehr kühne Vermutung, und zweitens widerspricht es dem klaren Wortlaut der Stelle; der Senat gibt ihr dies Recht an Stelle des Mannes, er gibt ihr ausdrücklich nicht mehr und nicht minder, als ihr Mann ihr hätte geben können, aber was er ihr gibt, ist ein absolutes, von keiner andern Beschränkung abhängiges Recht; so daß, wenn sie davon Gebrauch macht, auch ihr neuer Mann darunter nicht leiden soll; er beauftragt sogar die gegenwärtigen und künftigen Konsuln und Prätoren, dafür zu sorgen, daß ihr keinerlei Unbill daraus erwachse.
  en: This is not only a very daring assertion, but contradicts also the clear wording of the passage. The senate gives her this right as a proxy of her husband; they expressly give her no more and no less than her husband could have given her, but what they do give is an absolute right, independent of all limitations, so that, if she should make use of it, her new husband shall not suffer in consequence. The senate even instructs the present and future consuls and praetors to see that no inconvenience arise to her from the use of this right.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VI.20.2
  kind: p
  original: Mommsens Annahme scheint also durchaus unzulässig.
  en: Mommsen's supposition is therefore absolutely inadmissible.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: VI.21.1
  kind: p
  original: 'Oder aber: Die Frau heiratete einen Mann aus einer andern Gens, blieb aber selbst in ihrer angebornen Gens.'
  en: 'Then again: suppose a woman married a man from another gens, but remained in her own gens.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: VI.21.2
  kind: p
  original: Dann hätte nach der obigen Stelle ihr Mann das Recht gehabt, der Frau zu erlauben, aus ihrer eignen Gens hinauszuheiraten.
  en: According to the passage quoted above, her husband would then have had the right to permit his wife to marry outside of her own gens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: VI.21.3
  kind: p
  original: Das heißt, er hätte das Recht gehabt, Verfügungen zu treffen in Angelegenheiten einer Gens, zu der er gar nicht gehörte.
  en: That is, he would have had the right to make provisions in regard to the affairs of a gens to which he did not belong at all.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: VI.21.4
  kind: p
  original: Die Sache ist so widersinnig, daß darüber kein Wort weiter zu verlieren ist.
  en: The thing is so utterly unreasonable that we need not lose any words about it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: VI.22.1
  kind: p
  original: Bleibt also nur die Annahme, die Frau habe in erster Ehe einen Mann aus einer andern Gens geheiratet und sei durch die Heirat ohne weiteres in die Gens des Mannes übergetreten, wie dies Mommsen auch für solche Fälle tatsächlich zugibt.
  en: Nothing remains but to assume that the woman in her first marriage wedded a man from another gens and thereby became a member of her husband's gens. Mommsen admits this for such cases.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.22.2
  kind: p
  original: Dann erklärt sich der ganze Zusammenhang sofort.
  en: Then the whole matter at once explains itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: VI.22.3
  kind: p
  original: Die Frau, durch die Heirat losgerissen von ihrer alten Gens und aufgenommen in den neuen Gentilverband des Mannes, hat in diesem eine ganz besondre Stellung.
  en: The woman, torn away from her old gens by her marriage and adopted into the gentile group of her husband, occupies a peculiar position in the new gens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: VI.22.4
  kind: p
  original: Sie ist zwar Gentilgenossin, aber nicht blutsverwandt; die Art ihrer Aufnahme schließt sie von vornherein aus von jedem Eheverbot innerhalb der Gens, in die sie ja gerade hineingeheiratet hat; sie ist ferner in den Eheverband der Gens aufgenommen, erbt beim Tode ihres Mannes von seinem Vermögen, also Vermögen eines Gentilgenossen.
  en: She is now a gentile, but not a kin by blood. The manner of her entrance from the outset excludes all prohibition of intermarrying in the gens, into which she has come by marriage. She is adopted into the family relations of the gens and inherits some of the property of her husband when he dies, the property of a gentile.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VI.22.5
  kind: p
  original: Was ist natürlicher, als daß dies Vermögen in der Gens bleiben, sie also verpflichtet sein soll, einen Gentilgenossen ihres ersten Mannes zu heiraten und keinen andern?
  en: What is more natural than that this property should remain in the gens and that she should be obliged to marry a gentile of her husband and no other?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: VI.22.6
  kind: p
  original: Und wenn eine Ausnahme gemacht werden soll, wer ist so kompetent, sie dazu zu bevollmächtigen wie derjenige, der ihr dies Vermögen vermacht hat, ihr erster Mann?
  en: If, however, an exception is to be made, who is so well entitled to authorize her as her first husband who bequeathed his property to her?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: VI.22.7
  kind: p
  original: Im Augenblick, wo er ihr einen Vermögensteil vermacht und ihr gleichzeitig erlaubt, diesen Vermögensteil durch Heirat oder infolge von Heirat in eine fremde Gens zu übertragen, gehört ihm dies Vermögen noch, er verfügt also buchstäblich nur über sein Eigentum.
  en: At the moment when he bequeathes on her a part of his property and simultaneously gives her permission to transfer this property by marriage or as a result of marriage to a strange gens, he still is the owner of this property, hence he literally disposes of his personal property.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
- id: VI.22.8
  kind: p
  original: Was die Frau selbst angeht und ihr Verhältnis zur Gens ihres Mannes, so ist er es, der sie in diese Gens durch einen freien Willensakt - die Heirat - eingeführt hat; es scheint also ebenfalls natürlich, daß er die geeignete Person ist, sie zum Austritt aus dieser Gens durch zweite Heirat zu bevollmächtigen.
  en: As for the woman and her relation to the gens of her husband, it is he who by an act of his own free will--the marriage--introduced her into his gens. Therefore it seems quite natural that he should be the proper person to authorize her to leave this gens by another marriage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '121'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.22.9
  kind: p
  original: Kurzum, die Sache scheint einfach und selbstverständlich, sobald wir die wunderbare Vorstellung von der endogamen römischen Gens fallenlassen und sie mit Morgan als ursprünglich exogam fassen.
  en: In short, the matter appears simple and obvious, as soon as we discard the absurd conception of an endogamous Roman gens and accept Morgan's originally exogamous gens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 121-122
- id: VI.23.1
  kind: p
  original: 'Es bleibt noch eine letzte Annahme, die auch ihre Vertreter gefunden hat, und wohl die zahlreichsten: Die Stelle besage nur, "daß freigelaßne Mägde (libertae) nicht ohne besondre Bewilligung e gente enubere" (aus der Gens ausheiraten) "oder sonst einen der Akte vornehmen durften, der, mit capitis deminutio minima [Verlust der Familienrechte] verbunden, den Austritt der liberta aus dem Gentilverbande bewirkt hätte".'
  en: There is still another view which has probably found the greatest number of advocates. According to them the passage in Livy only means "that freed slave girls (libertae) cannot without special permission, e gente enubere (marry outside of the gens) or undertake any of the steps which, together with capitis deminutio minima (the loss of family rights) would lead to a transfer of the liberta to another gens."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
  en_note: 'Untermann''s note [25]: The term caput received the meaning of legal right of a person from the legal status of the head of a family.... Legal science extended the meaning of the term so that it related not alone to slaves, but also to minors and women. This legal right, so conceived, could be curtailed in three ways: Capitis deminutio maxima was the loss of the status libertatis (personal liberty), which included the loss of the status civitatis and familiae (civil and family rights); the capitis deminutio minor or media was the loss of the status civitatis (civil rights), including the loss of the status familiae (family rights); the capitis deminutio minima was the loss of the status familiae (family rights). Lange, Roemische Alterthuemer, Berlin, 1876, Vol. I., p. 204.'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.23.2
  kind: p
  original: (Lange, "Römische Alterthümer", Berlin 1856, l, S.195, wo sich auf Huschke zu unsrer livianischen Stelle bezogen wird.)
  en: (Lange, Roemische Alterthuemer, Berlin, 1856, I, p. 185, where our passage from Livy is explained by a reference to Huschke.)
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
- id: VI.24.1
  kind: p
  original: Ist diese Annahme richtig, so beweist die Stelle für die Verhältnisse vollfreier Römerinnen erst recht nichts und kann von einer Verpflichtung derselben, innerhalb der Gens zu heiraten, erst recht nicht die Rede sein.
  en: If this view is correct, then the passage proves still less for the relations of free Roman women, and there is so much less ground for speaking of their obligation to intermarry in the gens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
- id: VI.25.1
  kind: p
  original: Der Ausdruck enuptio gentis kommt nur in dieser einen Stelle und sonst in der ganzen römischen Literatur nicht mehr vor; das Wort enubere, ausheiraten, nur dreimal, ebenfalls bei Livius, und dann nicht in Beziehung auf die Gens.
  en: The expression enuptio gentis (marriage outside of the gens) occurs only in this single passage and is not found anywhere else in the entire Roman literature. The word enubere (to marry outside) is found only three times likewise in Livy, and not in reference to the gens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.25.2
  kind: p
  original: Die Phantasie, daß Römerinnen nur innerhalb der Gens heiraten durften, verdankt nur dieser einen Stelle ihre Existenz.
  en: The phantastic idea that Roman women had to intermarry in the gens owes its existence only to this single passage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
- id: VI.25.3
  kind: p
  original: Sie kann aber absolut nicht aufrechterhalten werden.
  en: But it cannot be maintained.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
- id: VI.25.4
  kind: p
  original: Denn entweder bezieht sich die Stelle auf besondre Beschränkungen für Freigelaßne, und dann beweist sie nichts für Vollfreie (ingenuae); oder aber sie gilt auch für Vollfreie, und dann beweist sie vielmehr, daß die Frau in der Regel außer ihrer Gens heiratete, aber mit der Heirat in die Gens des Mannes übertrat; also gegen Mommsen und für Morgan. -
  en: For either the passage refers to special restrictions for freed slave women, in which case it proves nothing for free women (ingenuae). Or it applies also to free women, in which case it rather proves that the women as a rule married outside of the gens and were transferred by their marriage to their husbands' gens. This would be a point for Morgan against Mommsen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VI.26.1
  kind: p
  original: Noch fast dreihundert Jahre nach Gründung Roms waren die Gentilbande so stark, daß eine patrizische Gens, die der Fabier, mit Einwilligung des Senats einen Kriegszug gegen die Nachbarstadt Veji auf eigne Faust unternehmen konnte.
  en: Almost three hundred years after the foundation of Rome the gentile bonds were still so strong that a patrician gens, the Fabians, could obtain permission from the senate to undertake all by itself a war expedition against the neighboring town of Veii.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
- id: VI.26.2
  kind: p
  original: 306 Fabier sollen ausgezogen und in einem Hinterhalt sämtlich erschlagen worden sein; ein einziger zurückgebliebener Knabe habe die Gens fortgepflanzt.
  en: Three hundred and six Fabians are said to have marched and to have been killed from ambush. Only one boy was left behind to propagate the gens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.27.1
  kind: p
  original: Zehn Gentes bildeten, wie gesagt, eine Phratrie, die hier Curie hieß und wichtigere öffentliche Befugnisse erhielt als die griechische Phratrie.
  en: Ten gentes, we said, formed a phratry, named curia. It was endowed with more important functions than the Grecian phratry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.27.2
  kind: p
  original: Jede Curie hatte ihre eignen Religionsübungen, Heiligtümer und Priester; diese letzteren, in ihrer Gesamtheit, bildeten eins der römischen Priesterkollegien.
  en: Every curia had its own religious rites, sacred possessions and priests. The priests of one curia in a body formed one of the Roman clerical collegiums.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.27.3
  kind: p
  original: Zehn Curien bildeten einen Stamm, der wahrscheinlich, wie die übrigen latinischen Stämme, ursprünglich einen gewählten Vorsteher - Heerführer und Oberpriester - hatte.
  en: Ten curiae formed a tribe which probably had originally its own elected chief--leader in war and high priest--like the rest of the Latin tribes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
- id: VI.27.4
  kind: p
  original: Die Gesamtheit der drei Stämme bildete das römische Volk, den Populus Romanus.
  en: The three tribes together formed the populus Romanus, the Roman people.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '122'
- id: VI.28.1
  kind: p
  original: Dem römischen Volk konnte also nur angehören, wer Mitglied einer Gens und durch sie einer Curie und eines Stammes war.
  en: Hence nobody could belong to the Roman people, unless he was a member of a Roman gens, and thus a member of a curia and tribe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: VI.28.2
  kind: p
  original: Die erste Verfassung dieses Volkes war folgende.
  en: The first constitution of the Roman people was as follows.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: VI.28.3
  kind: p
  original: Die öffentlichen Angelegenheiten wurden besorgt zunächst durch den Senat, der, wie Niebuhr zuerst richtig gesehn, aus den Vorstehern der dreihundert Gentes zusammengesetzt war; eben deswegen, als Gentilälteste, hießen sie Väter, patres, und ihre Gesamtheit Senat (Rat der Ältesten, von senex, alt).
  en: Public affairs were conducted by the Senate composed, as Niebuhr was the first to state correctly, of the chiefs of the three hundred gentes. Because they were the elders of the gentes they were called patres, fathers, and as a body senatus, council of elders, from senex, old.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.28.4
  kind: p
  original: Die gewohnheitsmäßige Wahl aus immer derselben Familie jeder Gens rief auch hier den ersten Stammesadel ins Leben; diese Familien nannten sich Patrizier und nahmen ausschließliches Recht des Eintritts in den Senat und alle andern Ämter in Anspruch.
  en: Here also the customary choice of men from the same family of the gens brought to life the first hereditary nobility. These families were called patricians and claimed the exclusive right to the seats in the senate and to all other offices.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.28.5
  kind: p
  original: Daß das Volk sich diesen Anspruch mit der Zeit gefallen ließ und er sich in ein wirkliches Recht verwandelte, drückt die Sage dahin aus, daß Romulus den ersten Senatoren und ihren Nachkommen das Patriziat mit dessen Vorrechten erteilt habe.
  en: The fact that in the course of time the people admitted this claim so that it became an actual privilege is confirmed by the legendary report that Romulus bestowed the rank of patrician and its privileges on the first senators.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: VI.28.6
  kind: p
  original: Der Senat, wie die athenische Bulê, hatte die Entscheidung in vielen Angelegenheiten, die Vorberatung in wichtigeren und namentlich bei neuen Gesetzen.
  en: The senate, like the Athenian boule, had to make the final decision in many affairs and to undertake the preliminary discussion of more important matters, especially of new laws.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: VI.28.7
  kind: p
  original: Diese wurden entschieden durch die Volksversammlung, genannt comitia curiata (Versammlung der Curien).
  en: These were settled by the public meeting, the so-called comitia curiata (assembly of curiae.)
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: VI.28.8
  kind: p
  original: Das Volk kam zusammen, in Curien gruppiert, in jeder Curie wahrscheinlich nach Gentes, bei der Entscheidung hatte jede der dreißig Curien eine Stimme.
  en: The people met in curiae, probably grouped by gentes, and every one of the thirty curiae had one vote.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: VI.28.9
  kind: p
  original: Die Versammlung der Curien nahm an oder verwarf alle Gesetze, wählte alle höhern Beamten mit Einschluß des rex (sogenannten Königs), erklärte Krieg (aber der Senat schloß Frieden) und entschied als höchstes Gericht, auf Berufung der Beteiligten, in allen Fällen, wo es sich um Todesstrafe gegen einen römischen Bürger handelte.
  en: The assembly of curiae adopted or rejected all laws, elected all higher officials including the rex (so-called king), declared war (but the senate concluded peace), and decided as a supreme court, on appeal, all cases involving capital punishment of Roman citizens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: VI.28.10
  kind: p
  original: '- Endlich stand neben Senat und Volksversammlung der rex, der genau dem griechischen Basileus entsprach und keineswegs der fast absolute König war, als den Mommsen ihn darstellt.'
  en: By the side of the senate and the public meeting stood the rex, corresponding to the Grecian basileus, and by no means, such an almost absolute king as Mommsen would have it.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VI.N1
  mew_page: '123'
- id: VI.28.11
  kind: p
  original: Auch er war Heerführer, Oberpriester und Vorsitzer in gewissen Gerichten.
  en: The rex was also a military leader, a high priest and a chairman of certain courts.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '123'
- id: VI.28.12
  kind: p
  original: Zivilbefugnisse oder Macht über Leben, Freiheit und Eigentum der Bürger hatte er durchaus nicht, soweit sie nicht aus der Disziplinargewalt des Heerführers oder der urteilsvollstreckenden Gewalt des Gerichtsvorsitzers entsprangen.
  en: He had no other functions, nor any power over life, liberty and property of the citizens, except such as resulted from his disciplinary power as military leader or from his executive power as president of a court.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 123-124
- id: VI.28.13
  kind: p
  original: Das Amt des rex war nicht erblich; er wurde im Gegenteil, wahrscheinlich auf Vorschlag des Amtsvorgängers, von der Versammlung der Curien zuerst gewählt und dann in einer zweiten Versammlung feierlich eingesetzt.
  en: The office of rex was not hereditary. On the contrary, he was elected, probably on the suggestion of his predecessor, by the assembly of curiae and then solemnly invested by a second assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.28.14
  kind: p
  original: Daß er auch absetzbar war, beweist das Schicksal des Tarquinius Superbus.
  en: That he could also be deposed is proved by the fate of Tarquinius Superbus.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: VI.29.1
  kind: p
  original: Wie die Griechen zur Heroenzeit, lebten also die Römer zur Zeit der sogenannten Könige in einer auf Gentes, Phratrien und Stämmen begründeten und aus ihnen entwickelten militärischen Demokratie.
  en: As the Greeks at the time of the heroes, so the Romans at the time of the so-called kings lived in a military democracy based on and developed from a constitution of gentes, phratries and tribes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: VI.29.2
  kind: p
  original: Mochten auch die Curien und Stämme zum Teil künstliche Bildungen sein, sie waren geformt nach den echten, naturwüchsigen Vorbildern der Gesellschaft, aus der sie hervorgegangen und die sie noch auf allen Seiten umgab.
  en: What though the curiae and tribes were partly artificial formations, they were moulded after the genuine and spontaneous models of a society from which they originated and that still surrounded them on all sides.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: VI.29.3
  kind: p
  original: Mochte auch der naturwüchsige patrizische Adel bereits Boden gewonnen haben, mochte die Reges ihre Befugnisse allmählich zu erweitern suchen - das ändert den ursprünglichen Grundcharakter der Verfassung nicht, und auf diesen allein kommt es an.
  en: And though the sturdy patrician nobility had already gained ground, though the reges attempted gradually to enlarge the scope of their functions--all this does not change the elementary and fundamental character of the constitution, and this alone is essential.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: VI.30.1
  kind: p
  original: Inzwischen vermehrte sich die Bevölkerung der Stadt Rom und des römischen, durch Eroberung erweiterten Gebiets teils durch Einwanderung, teils durch die Bewohner der unterworfnen, meist latinischen Bezirke.
  en: Meantime the population of the city of Rome and of the Roman territory, enlarged by conquest, increased partly by immigration, partly through the inhabitants of the annexed districts, Latins most of them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: VI.30.2
  kind: p
  original: Alle diese neuen Staatsangehörigen (die Frage wegen der Klienten lassen wir hier beiseite) standen außerhalb der alten Gentes, Curien und Stämme, bildeten also keinen Teil des populus romanus, des eigentlichen römischen Volks.
  en: All these new members of the state (we disregard here the clients) stood outside of the old gentes, curiae and tribes and so did not form a part of the populus Romanus, the Roman people proper.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: VI.30.3
  kind: p
  original: Sie waren persönlich freie Leute, konnten Grundeigentum besitzen, mußten Steuern und Kriegsdienste leisten.
  en: They were personally free, could own land, had to pay taxes and were subject to military service.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: VI.30.4
  kind: p
  original: Aber sie konnten keine Ämter bekleiden und weder an der Versammlung der Curien teilnehmen noch an der Verteilung der eroberten Staatsländereien.
  en: But they were not eligible to office and could neither take part in the assembly of curiae nor in the distribution of conquered state lands.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: VI.30.5
  kind: p
  original: Sie bildeten die von allen öffentlichen Rechten ausgeschlossene Plebs.
  en: They made up the mass of people excluded from all public rights, the plebs.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: VI.30.6
  kind: p
  original: Durch ihre stets wachsende Zahl, ihre militärische Ausbildung und Bewaffnung wurden sie eine drohende Macht gegenüber dem alten, gegen allen Zuwachs von außen jetzt fest abgeschlossenen Populus.
  en: By their continually growing numbers, their military training and armament they became a threat for the old populus who now closed their ranks hermetically against all new elements.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: VI.30.7
  kind: p
  original: Dazu kam, daß der Grundbesitz zwischen Populus und Plebs ziemlich gleichmäßig verteilt gewesen zu sein scheint, während der allerdings noch nicht sehr entwickelte kaufmännische und industrielle Reichtum wohl vorwiegend bei der Plebs war.
  en: The land seems to have been about evenly divided between populus and plebs, while the mercantile and industrial wealth, though as yet not very considerable, may have been mainly in the hands of the plebs.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: VI.31.1
  kind: p
  original: Bei der großen Dunkelheit, worin die ganz sagenhafte Urgeschichte Roms gehüllt ist - eine Dunkelheit, noch bedeutend verstärkt durch die rationalistisch-pragmatischen Deutungsversuche und Berichte der späteren juristisch gebildeten Quellenschriftsteller -, ist es unmöglich, weder über Zeit noch Verlauf, noch Anlaß der Revolution etwas Bestimmtes zu sagen, die der alten Gentilverfassung ein Ende machte.
  en: In view of the utter darkness that enwraps the whole legendary origin of Rome's historical beginning--a darkness that was rendered still more intense by the rationalistic and overofficious interpretations and reports of the juristically trained authors that wrote on the subject--it is impossible to make any definite statements about the time, the course and the motive of the revolution that put an end to the old gentile constitution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: VI.31.2
  kind: p
  original: Gewiß ist nur, daß ihre Ursache in den Kämpfen zwischen Plebs und Populus lag.
  en: We are certain only that the causes arose out of the fights between the plebs and the populus.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: VI.32.1
  kind: p
  original: Die neue, dem Rex Servius Tullius zugeschriebne, sich an griechische Muster, namentlich Solon, anlehnende Verfassung schuf eine neue Volksversammlung, die ohne Unterschied Populus und Plebejer ein- oder ausschloß, je nachdem sie Kriegsdienste leisteten oder nicht.
  en: The new constitution, attributed to rex Servius Tullius and following the Grecian model, more especially that of Solon, created a new public assembly including or excluding all the members of populus and plebs according to whether they rendered military service or not.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: VI.32.2
  kind: p
  original: Die ganze waffenpflichtige Mannschaft wurde nach dem Vermögen in sechs Klassen eingeteilt.
  en: The whole population, subject to enlistment, was divided into six classes according to wealth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: VI.32.3
  kind: p
  original: 'Der geringste Besitz in jeder der fünf Klassen war: I. 100.000 Aß; II. 75.000; III. 50.000; IV. 25.000; V. 11.000 Aß; nach Dureau de la Malle gleich ungefähr 14.000, 10.500, 7.000, 3.600 und 1.570 Mark.'
  en: 'The lowest limitis in the five highest classes were: I., 100,000 ass; II., 75,000; III., 50,000; IV., 25,000; V., 11,000; which according to Dureau de la Malle is equal to about $3,155, $2,333, $1,555, $800, and $388.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: VI.32.4
  kind: p
  original: Die sechste Klasse, die Proletarier, bestand aus den weniger Begüterten, Dienst- und Steuerfreien.
  en: The sixth class, the proletarians, consisted of those who possessed less and were exempt from military service and taxes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: VI.32.5
  kind: p
  original: In der neuen Volksversammlung der Centurien (comitia centuriata) traten die Bürger militärisch an, kompanieweise in ihren Centurien zu hundert Mann, und jede Centurie hatte eine Stimme.
  en: In this new assembly of centuriae (comitia centuriata) the citizens formed ranks after the manner of soldiers, in companies of one hundred (centuria), and every centuria had one vote.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: VI.32.6
  kind: p
  original: Nun aber stellte die erste Klasse 80 Centurien; die zweite 22, die dritte 20, die vierte 22, die fünfte 30, die sechste des Anstands halber auch eine.
  en: Now the first class placed 80 centuriae in the field; the second 22, the third 20, the fourth 22, the fifth 30 and the sixth, for propriety's sake, one.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: VI.32.7
  kind: p
  original: 'Dazu kamen die aus den Reichsten gebildeten Reiter mit 18 Centurien; zusammen 193; Majorität der Stimmen: 97. Nun hatten die Reiter und die erste Klasse zusammen allein 98 Stimmen, also die Majorität; waren sie einig, wurden die übrigen gar nicht gefragt; der gültige Beschluß war gefaßt.'
  en: To this were added 18 centuriae of horsemen composed of the most wealthy. Hence, there were 193 centuriae, giving a lowest majority vote of 97. Now the horsemen and the first class alone had together 98 votes. Being in the majority, they had only to agree, and they could pass any resolution without asking the consent of the other classes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VI.33.1
  kind: p
  original: Auf diese neue Versammlung der Centurien gingen nun alle politischen Rechte der früheren Versammlung der Curien (bis auf einige nominelle) über; die Curien und die sie zusammensetzenden Gentes wurden dadurch, wie in Athen, zu bloßen Privat- und religiösen Genossenschaften degradiert und vegetierten als solche noch lange fort, während die Versammlung der Curien bald ganz einschlief.
  en: This new assembly of centuriae assumed all the political rights of the former assembly of curiae, a few nominal privileges excepted. The curiae and the gentes composing them now were degraded to mere private and religious congregations, analogous to their Attic prototypes, and as such they vegetated on for a long time. But the assembly of curiae soon became obsolete.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VI.33.2
  kind: p
  original: Um auch die alten drei Geschlechterstämme aus dem Staat zu verdrängen, wurden vier Ortsstämme, deren jeder ein Viertel der Stadt bewohnte, mit einer Reihe von politischen Rechten eingeführt.
  en: In order to drive also the three old tribes out of existence, a system of four local tribes was introduced. Every tribe was assigned to one quarter of the city and received certain political rights.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.34.1
  kind: p
  original: Somit war auch in Rom, schon vor der Abschaffung des sogenannten Königtums, die alte auf persönlichen Blutbanden beruhende Gesellschaftsordnung gesprengt und eine neue, auf Gebietseinteilung und Vermögensunterschied begründete, wirkliche Staatsverfassung an ihre Stelle gesetzt.
  en: Thus the old social order of blood kinship was destroyed also in Rome even before the abolition of the so-called royalty. A new constitution, founded on territorial division and difference of wealth took its place and virtually created the state.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.34.2
  kind: p
  original: Die öffentliche Gewalt bestand hier in der kriegsdienstpflichtigen Bürgerschaft gegenüber nicht nur den Sklaven, sondern auch den vom Heeresdienst und der Bewaffnung ausgeschlossenen sogenannten Proletariern.
  en: The public power of coercion consisted here of citizens liable to military duty, to be used against the slaves and the so-called proletarians who were excluded from military service and general armament.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: VI.35.1
  kind: p
  original: Innerhalb dieser neuen Verfassung, die bei der Vertreibung des letzten, wirkliche Königsgewalt usurpierenden Rex Tarquinius Superbus und Ersetzung des rex durch zwei Heerführer (Konsuln) mit gleicher Amtsgewalt (wie bei den Irokesen) nur weiter ausgebildet wurde - innerhalb dieser Verfassung bewegt sich die ganze Geschichte der römischen Republik mit allen ihren Kämpfen der Patrizier und Plebejer um den Zugang zu den Ämtern und die Beteiligung an den Staatsländereien, mit dem endlichen Aufgehn des Patrizieradels in der neuen Klasse der großen Grund- und Geldbesitzer, die allmählich allen Grundbesitz der durch den Kriegsdienst ruinierten Bauern aufsogen, die so entstandnen enormen Landgüter mit Sklaven bebauten, Italien entvölkerten und damit nicht nur dem Kaisertum die Tür öffneten, sondern auch seinen Nachfolgern, den deutschen Barbaren.
  en: 'After the expulsion of the last rex, Tarquinius Superbus, who had really usurped royal power, the new constitution was further improved by the institution of two military leaders (consuls) with equal powers, analogous to the custom of the Iroquois. The whole history of the Roman republic moves inside of this constitution: the struggles between patricians and plebs for admission to office and participation in the allotment of state lands, the merging of the patrician nobility in the new class of large property and money owners; the gradual absorption by the latter of all the land of the small holders who had been ruined by military service; the cultivation of these enormous new tracts by slaves; the resulting depopulation of Italy which not only opened the doors to the imperial tyrants, but also to their successors, the German barbarians.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 125-126
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.N1.1.1
  kind: note
  original: 'Das lateinische rex ist das keltisch-irische righ (Stammesvorsteher) und das gotische reiks; daß dies ebenfalls, wie ursprünglich auch unser Fürst (d.h. wie englisch first, dänisch forste, der erste) Gentil- oder Stammesvorsteher bedeutete, geht hervor daraus, daß die Goten schon im 4. Jahrhundert ein besonderes Wort für den späteren König, den Heerführer eines gesamten Volkes, besaßen: thiudans.'
  en: The Latin rex is equivalent to the Celtic-Irish righ (tribal chief) and the Gothic reiks. That this, like the German Fuerst, English first and Danish forste, originally signified gentile or tribal chief is evident from the fact that the Goths in the fourth century already had a special term for the king of later times, the military chief of a whole nation, viz., thiudans.
  modern: ''
  modern_status: empty
  notes: ''
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.N1.1.2
  kind: note
  original: Artaxerxes und Herodes heißen in Ulfilas' Bibelübersetzung nie reiks, sondern thiudans und das Reich des Kaisers Tiberius nicht reiki, sondern thiudinassus.
  en: In Ulfila's translation of the Bible Artaxerxes and Herod are never called reiks, but thiudans, and the empire of the emperor Tiberius not reiki, but thiudinassus.
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.N1.1.3
  kind: note
  original: Im Namen des gotischen Thiudans, oder wie wir ungenau übersetzen, Königs Thiudareiks, Theodorich, d.h. Dietrich, fließen beide Benennungen zusammen.
  en: In the name of the Gothic thiudans, or king as we inaccurately translate, Thiudareiks (Theodoric, German Dietrich), both names flow together.
  modern: ''
  modern_status: empty
  notes: ''
