  kind: p
  original: '"Übrigens besteht bei den Säugetieren durchaus kein strenges Verhältnis zwischen dem Grad der intellektuellen Entwicklung und der Form des Geschlechtsverkehrs."'
  en: ''
  joined_to: II.7.10
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '40'
- id: II.9.1
  kind: p
  original: 'Und Espinas ("Des sociétés animales", 1877) sagt geradezu:'
  en: 'And Espinas says frankly: "The herd is the highest social group found among animals.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '40'
  en_note: 'Untermann''s footnote [10]: Espinas, Des Societes Animales, 1877.'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.10.1
  kind: p
  original: '"Die Horde ist die höchste soziale Gruppe, die wir bei den Tieren beobachten können.'
  en: ''
  joined_to: II.9.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '40'
- id: II.10.2
  kind: p
  original: Sie ist, so scheint es, aus Familien zusammengesetzt, aber schon von Anfang an stehn die Familie und die Horde im Widerstreit, sie entwickeln sich in umgekehrtem Verhältnis."
  en: It seems to be composed of families, but from the outset the family and the herd are antagonistic; they develop in directly opposite ratio."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '40'
- id: II.11.1
  kind: p
  original: Wie schon obiges zeigt, wissen wir über die Familien- und sonstigen geselligen Gruppen der menschenähnlichen Affen so gut wie nichts Bestimmtes; die Nachrichten widersprechen einander direkt.
  en: It is evident from the above that we know next to nothing of the family and other social groups of anthropoid apes; the reports are directly contradictory.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '40'
- id: II.11.2
  kind: p
  original: Das ist auch nicht zu verwundern.
  en: How full of contradiction, how much in need of critical scrutiny and research are the reports even on savage human tribes! But monkey tribes are far more difficult to observe than human tribes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '40'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: II.11.3
  kind: p
  original: Wie widerspruchsvoll, wie sehr der kritischen Prüfung und Sichtung bedürftig sind schon die Nachrichten, die wir über wilde Menschenstämme besitzen; Affengesellschaften aber sind noch weit schwerer zu beobachten als menschliche.
  en: ''
  joined_to: II.11.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '40'
- id: II.11.4
  kind: p
  original: Bis auf weiteres also müssen wir jede Schlußfolgerung aus solchen absolut unzuverlässigen Berichten zurückweisen.
  en: For the present, therefore, we must decline all final conclusions from such absolutely unreliable reports.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '40'
- id: II.12.1
  kind: p
  original: Dagegen bietet uns der angeführte Satz von Espinas einen besseren Anhaltspunkt.
  en: The quotation from Espinas, however, offers a better clue.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '40'
- id: II.12.2
  kind: p
  original: Horde und Familie sind bei den höheren Tieren nicht gegenseitige Ergänzungen, sondern Gegensätze.
  en: Among higher animals, the herd and family are not supplements of one another, but antitheses.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '40'
- id: II.12.3
  kind: p
  original: Espinas führt sehr hübsch aus, wie die Eifersucht der Männchen zur Brunstzeit jede gesellige Horde lockert oder zeitweilig auflöst.
  en: Espinas demonstrates very nicely, how the jealousy of the males loosens or temporarily dissolves every herd during mating time.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 40-41
- id: II.13.1
  kind: p
  original: '"Wo die Familie eng geschlossen ist, bilden sich Horden nur in seltnen Ausnahmen.'
  en: '"Where the family is closely organized, herds are formed only in exceptional cases.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
- id: II.13.2
  kind: p
  original: Dagegen da, wo freier Geschlechtsverkehr oder Polygamie herrscht, entsteht die Horde fast von selbst...
  en: But wherever free sexual intercourse or polygamy are existing, the herd appears almost spontaneously....
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
- id: II.13.3
  kind: p
  original: Damit eine Horde entstehn kann, müssen die Familienbande gelockert und das Individuum wieder frei geworden sein.
  en: In order that a herd may form, family ties must be loosened and the individual be free.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
- id: II.13.4
  kind: p
  original: Daher finden wir bei den Vögeln so selten organisierte Horden...
  en: For this reason we so rarely find organized herds among birds....
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
- id: II.13.5
  kind: p
  original: Bei den Säugetieren dagegen finden wir einigermaßen organisierte Gesellschaften, grade weil hier das Individuum nicht in der Familie aufgeht...
  en: Among mammals, however, we find groups organized after a fashion, just because here the individual is not merged in the family....
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
- id: II.13.6
  kind: p
  original: Das Gemeingefühl der Horde kann also bei seinem Entstehn keinen größeren Feind haben als das Gemeingefühl der Familie.
  en: The rising sense of cohesion in a herd cannot, therefore, have a greater enemy than the consciousness of family ties.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
- id: II.13.7
  kind: p
  original: 'Stehen wir nicht an, es auszusprechen: Wenn sich eine höhere Gesellschaftsform als die Familie entwickelt hat, so kann es nur dadurch geschehn sein, daß sie Familien in sich aufnahm, die eine gründliche Veränderung erlitten hatten; was nicht ausschließt, daß diese Familien grade dadurch später die Möglichkeit fanden, sich unter unendlich günstigeren Umständen neu zu konstituieren."'
  en: 'Let us not shrink from pronouncing it: the development of a higher form of society than the family can be due only to the fact that it admitted families which had undergone a thorough change. This does not exclude the possibility that these same families were thus enabled to reorganize later on under infinitely more favorable circumstances."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
  en_note: 'Untermann''s footnote [11]: Espinas, l. c., quoted by Giraud-Teulon, Origines du mariage et de la famille, 1884, p. 518-20.'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: II.13.8
  kind: p
  original: (Espinas, l.c., zitiert bei Giraud-Teulon, "Origines du mariage et de la famille", 1884, p. 518-520.)
  en: ''
  joined_to: II.13.7
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '41'
- id: II.14.1
  kind: p
  original: Hier zeigt sich, daß die Tiergesellschaften allerdings einen gewissen Wert haben für den Rückschluß auf die menschlichen - aber nur einen negativen.
  en: It becomes apparent from this, that animal societies may indeed have a certain value in drawing conclusions in regard to human life--but only negatively.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
- id: II.14.2
  kind: p
  original: 'Das höhere Wirbeltier kennt, soviel wir wissen, nur zwei Familienformen: Vielweiberei oder Einzelpaarung; in beiden ist nur ein erwachsenes Männchen, nur ein Gatte zulässig.'
  en: 'The higher vertebrate knows, so far as we may ascertain, only two forms of the family: polygamy or pairs. In both of them there is only one grown male, only one husband.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.14.3
  kind: p
  original: Die Eifersucht des Männchens, zugleich Band und Schranke der Familie, bringt die Tierfamilie in Gegensatz zur Horde; die Horde, die höhere Geselligkeitsform, wird hier unmöglich gemacht, dort gelockert oder während der Brunstzeit aufgelöst, im besten Fall in ihrer Fortentwicklung gehemmt durch die Eifersucht der Männchen.
  en: The jealousy of the male, at the same time tie and limit of the family, creates an opposition between the animal family and the herd. The latter, a higher social form, is here rendered impossible, there loosened or dissolved during mating time, and at best hindered in its development by the jealousy of the male.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.14.4
  kind: p
  original: Dies allein genügt zum Beweis, daß Tierfamilie und menschliche Urgesellschaft unverträgliche Dinge sind; daß die sich aus der Tierheit emporarbeitenden Urmenschen entweder gar keine Familie kannten oder höchstens eine, die bei den Tieren nicht vorkommt.
  en: This in itself is sufficient proof that the animal family and primeval human society are irreconcilable; that ancient man, struggling upward from the animal stage, either had no family at all or at the most one that does not exist among animals.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
- id: II.14.5
  kind: p
  original: Ein so waffenloses Tier wie der werdende Mensch mochte sich in geringer Zahl auch in der Isolierung durchschlagen, deren höchste Geselligkeitsform die Einzelpaarung ist, wie Westermarck sie nach Jägerberichten dem Gorilla und Schimpansen zuschreibt.
  en: A being so defenceless as evolving man might well survive in small numbers though living in an isolated state, the highest social form of which is that of pairs such as Westermarck, relying on hunter's reports, attributes to the gorilla and the chimpanzee.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
- id: II.14.6
  kind: p
  original: 'Zur Entwicklung aus der Tierheit hinaus, zur Vollziehung des größten Fortschritts, den die Natur aufweist, gehörte ein weiteres Element: die Ersetzung der dem einzelnen mangelnden Verteidigungsfähigkeit durch die vereinte Kraft und Zusammenwirkung der Horde.'
  en: 'Another element is necessary for the elevation out of the animal stage, for the realization of the highest progress found in nature: the replacing of the defencelessness of the single individual by the united strength and co-operation of the whole herd.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
- id: II.14.7
  kind: p
  original: Aus Verhältnissen wie denen, worin die menschenähnlichen Affen heute leben, wäre der Übergang zur Menschheit rein unerklärlich; diese Affen machen vielmehr den Eindruck abgeirrter Seitenlinien, die dem allmählichen Aussterben entgegengehn und jedenfalls im Niedergang begriffen sind.
  en: The transition from beast to man out of conditions of the sort under which the anthropoid apes are living to-day would be absolutely unexplainable. These apes rather give the impression of stray sidelines gradually approaching extinction, and at all events in process of decline.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '41'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.14.8
  kind: p
  original: Das allein genügt, um jeden Parallelschluß von ihren Familienformen auf die des Urmenschen abzuweisen.
  en: This alone is sufficient to reject all parallels between their family forms and those of primeval man.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 41-42
- id: II.14.9
  kind: p
  original: Gegenseitige Duldung der erwachsenen Männchen, Freiheit von Eifersucht, war aber die erste Bedingung für die Bildung solcher größeren und dauernden Gruppen, in deren Mitte die Menschwerdung des Tiers allein sich vollziehen konnte.
  en: But mutual tolerance of the grown males, freedom from jealousy, was the first condition for the formation of such large and permanent groups, within which alone the transformation from beast to man could be accomplished.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: II.14.10
  kind: p
  original: Und in der Tat, was finden wir als die älteste, ursprünglichste Form der Familie, die wir in der Geschichte unleugbar nachweisen und noch heute hier und da studieren können?
  en: And indeed, what do we find to be the most ancient and original form of the family, undeniably traceable by history and even found to-day here and there?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: II.14.11
  kind: p
  original: Die Gruppenehe, die Form, worin ganze Gruppen von Männern und ganze Gruppen von Frauen einander gegenseitig besitzen und die nur wenig Raum läßt für Eifersucht.
  en: The group marriage, that form in which whole groups of men and whole groups of women mutually belong to one another, leaving only small scope for jealousy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: II.14.12
  kind: p
  original: Und ferner finden wir auf späterer Entwicklungsstufe die Ausnahmsform der Vielmännerei, die erst recht allen Gefühlen der Eifersucht ins Gesicht schlägt und daher den Tieren unbekannt ist.
  en: And furthermore we find at a later stage the exceptional form of polyandry which still more supersedes all sentiments of jealousy and hence is unknown to animals.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: II.14.13
  kind: p
  original: Da aber die uns bekannten Formen der Gruppenehe von so eigentümlich verwickelten Bedingungen begleitet sind, daß sie mit Notwendigkeit auf frühere, einfachere Formen des geschlechtlichen Umgangs zurückweisen und damit in letzter Instanz auf eine dem Übergang aus der Tierheit in die Menschheit entsprechende Periode des regellosen Verkehrs, so führen uns die Hinweise auf die Tierehen grade wieder auf den Punkt, von dem sie uns ein für allemal hinwegführen sollten.
  en: But all the forms of the group marriage known to us are accompanied by such peculiarly complicated circumstances that they of necessity point to a preceding simpler form of sexual intercourse and, hence, in the last instance to a period of unrestricted sexual intercourse corresponding to a transition from the animal to man. Therefore the references to animal marriages lead us back to precisely that point, from which they were intended to remove us forever.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.15.1
  kind: p
  original: 'Was heißt denn das: regelloser Geschlechtsverkehr?'
  en: What does the term "unrestricted sexual intercourse" mean?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: II.15.2
  kind: p
  original: Daß die jetzt oder zu einer früheren Zeit geltenden Verbotsschranken nicht gegolten haben.
  en: Simply, that the restrictions in force now were not observed formerly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: II.15.3
  kind: p
  original: Die Schranke der Eifersucht haben wir bereits fallen sehn.
  en: We have already seen the barrier of jealousy falling.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: II.15.4
  kind: p
  original: Wenn etwas, so steht dies fest, daß die Eifersucht eine relativ spät entwickelte Empfindung ist.
  en: If anything is certain, it is that jealousy is developed at a comparatively late stage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: II.15.5
  kind: p
  original: Dasselbe gilt von der Vorstellung der Blutschande.
  en: The same is true of incest.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: II.15.6
  kind: p
  original: Nicht nur waren Bruder und Schwester ursprünglich Mann und Frau, auch der Geschlechtsverkehr zwischen Eltern und Kindern ist noch heute bei vielen Völkern gestattet.
  en: Not only brother and sister were originally man and wife, but also the sexual intercourse between parents and children is permitted to this day among many nations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: II.15.7
  kind: p
  original: Bancroft ("The Native Races of the Pacific States of North America",1875, vol. I) bezeugt dies von den Kaviats an der Behringstraße, von den Kadiaks bei Alaska, von den Tinnehs im Innern des britischen Nordamerika; Letourneau stellt Berichte derselben Tatsache zusammen von den Chippeway-Indianern, den Cucus in Chile, den Karaiben, den Karens in Hinterindien; von Erzählungen der alten Griechen und Römer über Parther, Perser, Scythen, Hunnen etc. zu schweigen.
  en: Bancroft testifies to the truth of this among the Kaviats of the Behring Strait, the Kadiaks of Alaska, the Tinnehs in the interior of British North America; Letourneau compiled reports of the same fact in regard to the Chippeway Indians, the Coocoos in Chile, the Caribeans, the Carens in Indo-China, not to mention the tales of ancient Greeks and Romans about the Parthians, Persians, Scythians, Huns and so forth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '42'
- id: II.15.8
  kind: p
  original: Ehe die Blutschande erfunden war (und sie ist eine Erfindung, und zwar eine höchst wertvolle), konnte der Geschlechtsverkehr zwischen Eltern und Kindern nicht abschreckender sein als zwischen andern Personen, die verschiednen Generationen angehören, und das kommt doch heute selbst in den philiströsesten Ländern vor, ohne großes Entsetzen zu erregen; sogar alte "Jungfern" von über sechzig heiraten zuweilen, wenn sie reich genug sind, junge Männer von ungefähr dreißig.
  en: Before incest was invented (and it is an invention, a really valuable one indeed), sexual intercourse between parents and children could not be any more repulsive than between other persons belonging to different generations, which takes place even in our day among the most narrow-minded nations without causing any horror. Even old "maids" of more than sixty years sometimes, if they are rich enough, marry young men of about thirty.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 42-43
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.15.9
  kind: p
  original: Nehmen wir aber von den ursprünglichsten Familienformen, die wir kennen, die damit verknüpften Vorstellungen von Blutschande hinweg - Vorstellungen, die von den unsrigen total verschieden sind und ihnen häufig direkt widersprechen -, so kommen wir auf eine Form des Geschlechtsverkehrs, die sich nur als regellos bezeichnen läßt.
  en: Eliminating from the primeval forms of the family known to us those conceptions of incest--conceptions totally different from ours and often enough in direct contradiction with them--we arrive at a form of sexual intercourse that can only be designated as unrestricted.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
- id: II.15.10
  kind: p
  original: Regellos insofern, als die später durch die Sitte gezogenen Einschränkungen noch nicht bestanden.
  en: Unrestricted in the sense that the barriers drawn later on by custom did not yet exist.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
- id: II.15.11
  kind: p
  original: Daraus folgt aber keineswegs notwendig für die alltägliche Praxis ein kunterbuntes Durcheinander.
  en: This in no way necessarily implies for practical purposes an injudicious pell-mell intercourse.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
- id: II.15.12
  kind: p
  original: Einzelpaarungen auf Zeit sind keineswegs ausgeschlossen, wie sie denn selbst in der Gruppenehe jetzt die Mehrzahl der Fälle bilden.
  en: The separate existence of pairs for a limited time is not out of the question, and even comprises the majority of cases in the group marriage of our days.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
- id: II.15.13
  kind: p
  original: Und wenn der neueste Ableugner eines solchen Urzustandes, Westermarck, jeden Zustand als Ehe bezeichnet, worin beide Geschlechter bis zur Geburt des Sprößlings gepaart bleiben, so ist zu sagen, daß diese Art Ehe im Zustand des regellosen Verkehrs sehr gut vorkommen konnte, ohne der Regellosigkeit, d.h. der Abwesenheit von durch die Sitte gezogenen Schranken des Geschlechtsverkehrs zu widersprechen.
  en: And if the latest repudiator of such a primeval state, Westermarck, designates as marriage every case, where both sexes remain mated until the birth of the offspring, then this is equivalent to saying that this kind of marriage may well exist during a stage of unrestricted intercourse without contradicting license, i. e., absence of barriers drawn by custom for sexual intercourse.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
- id: II.15.14
  kind: p
  original: Westermarck geht freilich von der Ansicht aus, daß "Regellosigkeit die Unterdrückung der individuellen Neigungen einschließt", so daß "die Prostitution ihre echteste Form ist".
  en: Westermarck bases himself on the opinion that "license includes the suppression of individual affections" so that "prostitution is its most genuine form."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
- id: II.16.1
  kind: p
  original: Mir scheint vielmehr, daß alles Verständnis der Urzustände unmöglich bleibt, solange man sie durch die Bordellbrille anschaut.
  en: To me it rather seems that any understanding of primeval conditions is impossible as long as we look at them through brothel spectacles.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
- id: II.16.2
  kind: p
  original: Wir kommen bei der Gruppenehe auf diesen Punkt zurück.
  en: We shall return to this point in the group marriage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
- id: II.17.1
  kind: p
  original: 'Nach Morgan entwickelte sich aus diesem Urzustand des regellosen Verkehrs, wahrscheinlich sehr frühzeitig:'
  en: 'According to Morgan, the following forms developed from this primeval state at an apparently early stage: 1. THE CONSANGUINE FAMILY.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.18.1
  kind: p
  original: 1. Die Blutsverwandtschaftsfamilie, die erste Stufe der Familie.
  en: The Consanguine Family is the first step toward the family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
- id: II.18.2
  kind: p
  original: 'Hier sind die Ehegruppen nach Generationen gesondert: Alle Großväter und Großmütter innerhalb der Grenzen der Familie sind sämtlich untereinander Mann und Frau, ebenso deren Kinder, also die Väter und Mütter, wie deren Kinder wieder einen dritten Kreis gemeinsamer Ehegatten bilden werden, und deren Kinder, die Urenkel der ersten, einen vierten.'
  en: 'Here the marriage groups are arranged by generations: all the grand-fathers and grand-mothers within a certain family are mutually husbands and wives; and equally their children, the fathers and mothers, whose children form a third cycle of mutual mates. The children of these again, the great-grandchildren of the first cycle, will form a fourth.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.18.3
  kind: p
  original: In dieser Familienform sind also nur Vorfahren und Nachkommen, Eltern und Kinder von den Rechten wie Pflichten (wie wir sagen würden) der Ehe untereinander ausgeschlossen.
  en: In this form of the family, then, only ancestors and descendants are excluded from what we would call the rights and duties of marriage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
- id: II.18.4
  kind: p
  original: Brüder und Schwestern, Vettern und Kusinen ersten, zweiten und entfernteren Grades sind alle Brüder und Schwestern untereinander und eben deswegen alle Mann und Frau eins des andern.
  en: Brothers and sisters, male and female cousins of the first, second and more remote grades, are all mutually brothers and sisters and for this reason mutual husbands and wives.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '43'
- id: II.18.5
  kind: p
  original: Das Verhältnis von Bruder und Schwester schließt auf dieser Stufe die Ausübung des gegenseitigen Geschlechtsverkehrs von selbst in sich ein.
  en: The relation of brother and sister quite naturally includes at this stage the practice of sexual intercourse.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N2
  mew_page: '43'
- id: II.18.6
  kind: p
  original: Die typische Gestalt einer solchen Familie würde bestehn aus der Nachkommenschaft eines Paars, in welcher wieder die Nachkommen jedes einzelnen Grades unter sich Brüder und Schwestern und eben deshalb Männer und Frauen untereinander sind.
  en: The typical form of such a family would consist of the offspring of one pair, representing again the descendants of each grade as mutual brothers and sisters and, therefore, mutual husbands and wives.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 43-44
- id: II.19.1
  kind: p
  original: Die Blutsverwandtschaftsfamilie ist ausgestorben.
  en: The consanguine family is extinct.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '44'
- id: II.19.2
  kind: p
  original: Selbst die rohsten Völker, von denen die Geschichte erzählt, liefern kein nachweisbares Beispiel davon.
  en: Even the crudest nations of history do not furnish any proofs of it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '44'
- id: II.19.3
  kind: p
  original: Daß sie aber bestanden haben muß, dazu zwingt uns das hawaiische, in ganz Polynesien noch jetzt gültige Verwandtschaftssystem, das Grade der Blutsverwandtschaft ausdrückt, wie sie nur unter dieser Familienform entstehn können, dazu zwingt uns die ganze weitere Entwicklung der Familie, die jene Form als notwendige Vorstufe bedingt.
  en: But the Hawaiian system of kinship, in force to this day in all Polynesia, compels us to acknowledge its former existence, for it exhibits grades of kinship that could only originate in this form of the family. And the whole subsequent development of the family compels us to admit this form as a necessary step.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '44'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.20.1
  kind: p
  original: 2. Die Punaluafamilie.
  en: 2. THE PUNALUAN FAMILY.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '44'
- id: II.20.2
  kind: p
  original: Wenn der erste Fortschritt der Organisation darin bestand, Eltern und Kinder vom gegenseitigen Geschlechtsverkehr auszuschließen, so der zweite in der Ausschließung von Schwester und Bruder.
  en: While the first step of organization consisted in excluding parents and children from mutual sexual intercourse, the second was the erection of a barrier between brother and sister.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '44'
- id: II.20.3
  kind: p
  original: Dieser Fortschritt war, wegen der größern Altersgleichheit der Beteiligten, unendlich viel wichtiger, aber auch schwieriger als der erste.
  en: This progress was much more important on account of the greater equality in the ages of the parties concerned, but also far more difficult.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '44'
- id: II.20.4
  kind: p
  original: Er vollzog sich allmählich, anfangend wahrscheinlich mit der Ausschließung der leiblichen Geschwister (d.h. von mütterlicher Seite) aus dem Geschlechtsverkehr, erst in einzelnen Fällen, nach und nach Regel werdend (in Hawaii kamen noch in diesem Jahrhundert Ausnahmen vor) und endend mit dem Verbot der Ehe sogar zwischen Kollateralgeschwistern, d.h. nach unsrer Bezeichnung Geschwisterkindern, -enkeln und -urenkeln; er bildet, nach Morgan, "eine vortreffliche Illustration davon, wie das Prinzip der natürlichen Zuchtwahl wirkt".
  en: It was accomplished gradually, probably beginning with the exclusion of the natural sister (i. e., on the mother's side) from sexual intercourse, first in single cases, then becoming more and more the rule (in Hawaii exceptions were still noted during the nineteenth century), and finally ending with the prohibition of marriage even among collateral brothers and sisters, i. e., what we now term brother's and sister's children, grandchildren, and great-grandchildren. This progress offers, according to Morgan, an excellent illustration how the principle of natural selection works.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T2
    editions: '1884'
    reading: 'fehlt: wahrscheinlich'
    base_text: … sich allmählich, anfangend wahrscheinlich ‸ mit der Ausschließung der …
  mew_page: 44-45
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.21.1
  kind: p
  original: Keine Frage, daß Stämme, bei denen die Inzucht durch diesen Fortschritt beschränkt wurde, sich rascher und voller entwickeln mußten als die, bei denen die Geschwisterehe Regel und Gebot blieb.
  en: Without question, the tribes limiting inbreeding by this progress developed faster and more completely than those retaining the marriage between brothers and sisters as a rule and law.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '45'
- id: II.21.2
  kind: p
  original: Und wie gewaltig die Wirkung dieses Fortschritts empfunden wurde, beweist die aus ihm unmittelbar entsprungne, weit über das Ziel hinausschießende Einrichtung der Gens, die die Grundlage der gesellschaftlichen Ordnung der meisten, wo nicht aller Barbarenvölker der Erde bildet und aus der wir in Griechenland und Rom unmittelbar in die Zivilisation hinübertreten.
  en: And how powerfully the influence of this progress was felt, is shown by the institution of the gens, directly attributable to it and passing far beyond the goal. The gens is the foundation of the social order of most, if not all, barbarian nations, and in Greece and Rome we step immediately from it to civilization.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '45'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.22.1
  kind: p
  original: Jede Urfamilie mußte spätestens nach ein paar Generationen sich spalten.
  en: Every primeval family necessarily had to divide after a few generations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '45'
- id: II.22.2
  kind: p
  original: Die ursprüngliche kommunistische Gesamthaushaltung, die bis tief in die mittlere Barbarei hinein ausnahmslos herrscht, bedingte eine, je nach den Verhältnissen wechselnde, aber an jedem Ort ziemlich bestimmte Maximalgröße der Familiengemeinschaft.
  en: The originally communistic and collective household existing far into the middle stage of barbarism, involved a certain maximum size of the family, variable according to conditions, but still limited in a degree.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '45'
- id: II.22.3
  kind: p
  original: Sobald die Vorstellung von der Ungebühr des Geschlechtsverkehrs zwischen Kindern einer Mutter aufkam, mußte sie sich bei solchen Spaltungen alter und Gründung neuer Hausgemeinden (die indes nicht notwendig mit der Familiengruppe zusammenfielen) wirksam zeigen.
  en: As soon as the conception of the impropriety of sexual intercourse between children of the same mother arose, it naturally became effective on such occasions as the division of old and the foundation of new household communities (which, however, did not necessarily coincide with the family group).
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '45'
- id: II.22.4
  kind: p
  original: Eine oder mehrere Reihen von Schwestern wurden der Kern der einen, ihre leiblichen Brüder der Kern der andern.
  en: One or more series of sisters became the center of one group, their natural brothers that of another.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '45'
- id: II.22.5
  kind: p
  original: So oder ähnlich ging aus der Blutsverwandtschaftsfamilie die von Morgan Punaluafamilie genannte Form hervor.
  en: In this or a similar manner that form which Morgan styles the Punaluan family developed from the consanguine family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '45'
- id: II.22.6
  kind: p
  original: Nach der hawaiischen Sitte waren eine Anzahl Schwestern, leibliche oder entferntere (d.h. Kusinen ersten, zweiten oder entfernteren Grades), die gemeinsamen Frauen ihrer gemeinsamen Männer, wovon aber ihre Brüder ausgeschlossen; diese Männer nannten sich untereinander nun nicht mehr Brüder, was sie auch nicht mehr zu sein brauchten, sondern Punalua, d.h. intimer Genosse, gleichsam Associé.
  en: According to Hawaiian custom, a number of sisters, natural or more remote (i. e., cousins of the first, second and more remote degrees) were the mutual wives of their mutual husbands, their natural brothers excepted. These men now no longer addressed one another as "brother"--which they no longer had to be--but as "Punalua," i. e., intimate companion, associate as it were.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '45'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.22.7
  kind: p
  original: Ebenso hatte eine Reihe von leiblichen oder entfernteren Brüdern eine Anzahl Frauen, nicht ihre Schwestern, in gemeinsamer Ehe, und diese Frauen nannten sich untereinander Punalua.
  en: Likewise a series of natural or more remote brothers lived in mutual marriage with a number of women, not their natural sisters, and these women referred to each other as "Punalua."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '45'
- id: II.22.8
  kind: p
  original: 'Dies die klassische Gestalt einer Familienformation, die später eine Reihe von Variationen zuließ und deren wesentlicher Charakterzug war: gegenseitige Gemeinschaft der Männer und Weiber innerhalb eines bestimmten Familienkreises, von dem aber die Brüder der Frauen, zuerst die leiblichen, später auch die entfernteren, und umgekehrt also auch die Schwestern der Männer ausgeschlossen waren.'
  en: This is the classical form of a family, which later admitted of certain variations. Its fundamental characteristic was mutual community of husbands and wives within a given family with the exclusion of the natural brothers (or sisters) first, and of the more remote grades later.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 45-46
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.23.1
  kind: p
  original: Diese Familienform liefert uns nun mit der vollständigsten Genauigkeit die Verwandtschaftsgrade, wie sie das amerikanische System ausdrückt.
  en: This form of the family, now, furnishes with complete accuracy the degrees of kinship expressed by the American system.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '46'
- id: II.23.2
  kind: p
  original: Die Kinder der Schwestern meiner Mutter sind noch immer ihre Kinder, ebenso die Kinder der Brüder meines Vaters auch seine Kinder, und sie alle sind meine Geschwister; aber die Kinder der Brüder meiner Mutter sind jetzt ihre Neffen und Nichten, die Kinder der Schwestern meines Vaters seine Neffen und Nichten, und sie alle meine Vettern und Kusinen.
  en: The children of the sisters of my mother still are her children; likewise the children of the brothers of my father still his children; and all of them are my brothers and sisters. But the children of the brothers of my mother are now her nephews and nieces, the children of the sisters of my father his nephew and nieces, and they are all my cousins.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '46'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.23.3
  kind: p
  original: 'Denn während die Männer der Schwestern meiner Mutter noch immer ihre Männer sind, und ebenso die Frauen der Brüder meines Vaters auch noch seine Frauen - rechtlich, wo nicht immer tatsächlich -, so hat die gesellschaftliche Ächtung des Geschlechtsverkehrs zwischen Geschwistern die bisher unterschiedslos als Geschwister behandelten Geschwisterkinder in zwei Klassen geteilt: Die einen bleiben nach wie vor (entferntere) Brüder und Schwestern untereinander, die andern, die Kinder hier des Bruders, dort der Schwester, können nicht länger Geschwister sein, sie können keine gemeinschaftlichen Eltern mehr haben, weder Vater noch Mutter noch beide, und deshalb wird hier zum erstenmal die Klasse der Neffen und Nichten, Vettern und Kusinen notwendig, die unter der frühern Familienordnung unsinnig gewesen wäre.'
  en: For while the husbands of the sisters of my mother are still her husbands, and likewise the wives of the brothers of my father still his wives--legally, if not always in fact--the social proscription of sexual intercourse between brothers and sisters has now divided those relatives who were formerly regarded without distinction as brothers and sisters, into two classes. In one category are those who remain (more remote) brothers and sisters as before; in the other the children of the brother on one hand or the sister on the opposite, who can be brothers and sisters no longer. The latter have mutual parents no more, neither father nor mother nor both together. And for this reason the class of nephews and nieces, male and female cousins, here becomes necessary for the first time.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '46'
  align: '1:4'
  review: true
  review_reason: 1 de sentence(s) matched to 4 en sentence(s)
- id: II.23.4
  kind: p
  original: Das amerikanische Verwandtschaftssystem, das bei jeder auf irgendeiner Art Einzelehe beruhenden Familienform rein widersinnig erscheint, wird durch die Punaluafamilie bis in seine kleinsten Einzelnheiten rationell erklärt und natürlich begründet.
  en: Under the former family order this would have been absurd. The American system of kinship, which appears absolutely paradoxical in any family form founded on monogamy, is rationally explained and naturally confirmed in its most minute details by the Punaluan family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '46'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.23.5
  kind: p
  original: Soweit dies Verwandtschaftssystem verbreitet gewesen, genau soweit, mindestens, muß auch die Punaluafamilie oder eine ihr ähnliche Form bestanden haben.
  en: Wherever this system of kinship was in force, there the Punaluan family or at least a form akin to it must also have existed.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T3
    editions: '1884'
    reading: 'fehlt: oder eine ihr ähnliche Form'
    base_text: … eine ihr ähnliche Form ‸ bestanden haben. …
  mew_page: '46'
- id: II.24.1
  kind: p
  original: Diese in Hawaii wirklich als bestehend nachgewiesene Familienform würde uns wahrscheinlich aus ganz Polynesien überliefert sein, hätten die frommen Missionare, wie weiland die spanischen Mönche in Amerika, in solchen widerchristlichen Verhältnissen etwas mehr zu sehen vermocht als den simplen "Greuel".
  en: This family form, the existence of which in Hawaii was actually demonstrated, would have been transmitted probably by all Polynesia, if the pious missionaries, similar to the Spanish monks in America, could have looked upon such anti-Christian relations as being something more than simply a "horror."
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N3
  mew_page: '46'
- id: II.24.2
  kind: p
  original: Wenn uns Cäsar von den Briten, die sich damals auf der Mittelstufe der Barbarei befanden, erzählt, "sie haben ihre Frauen je zehn oder zwölf gemeinsam unter sich, und zwar meist Brüder mit Brüdern und Eltern mit Kindern" - so erklärt sich dies am besten als Gruppenehe.
  en: Cesar's report to the effect that the Britons, who then were in the middle stage of barbarism, "have ten or twelve women in common, mostly brothers with brothers and parents with children," is best explained by group marriage.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T4
    editions: '1884'
    reading: Punaluafamilie
    base_text: … am besten als Gruppenehe ‸ . …
  mew_page: 46-47
- id: II.24.3
  kind: p
  original: Barbarische Mütter haben nicht zehn bis zwölf Söhne, alt genug, um sich gemeinschaftliche Frauen halten zu können, aber das amerikanische Verwandtschaftssystem, das der Punaluafamilie entspricht, liefert viele Brüder, weil alle nahen und entfernten Vettern eines Mannes seine Brüder sind.
  en: Barbarian mothers have not ten or twelve sons old enough to keep women in common, but the American system of kinship corresponding to the Punaluan family furnishes many brothers, because all near and remote cousins of a certain man are his brothers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '47'
- id: II.24.4
  kind: p
  original: Das "Eltern mit Kindern" mag falsche Auffassung des Cäsar sein; daß Vater und Sohn, oder Mutter und Tochter sich in derselben Ehegruppe befinden sollten, ist indes bei diesem System nicht absolut ausgeschlossen, wohl aber Vater und Tochter, oder Mutter und Sohn.
  en: The term "parents with children" may arise from a wrong conception of Cesar, but this system does not absolutely exclude the existence of father and son, mother or daughter in the same group. It does exclude, however, father and daughter or mother and son.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '47'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.24.5
  kind: p
  original: Ebenso liefert diese oder eine ähnliche Form der Gruppenehe die leichteste Erklärung der Berichte Herodots und andrer alter Schriftsteller über Weibergemeinschaft bei wilden und barbarischen Völkern.
  en: This or a similar form of group marriage also furnishes the easiest explanation of the reports of Herodotus and other ancient writers concerning community of women among savage and barbarian nations.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T5
    editions: '1884'
    reading: 'Familienform (statt: oder eine ähnliche Form der Gruppenehe)'
    base_text: … ähnliche Form der Gruppenehe ‸ die leichteste Erklärung der …
  mew_page: '47'
- id: II.24.6
  kind: p
  original: 'Dies gilt auch von dem, was Watson und Kaye ("The People of India") von den Tikurs in Audh (nördlich vom Ganges) erzählen:'
  en: 'This is true, furthermore, of Watson''s and Kaye''s tale about the Tikurs of Audh (north of the Ganges): "They live together (i. e., sexually) almost indiscriminately in large communities, and though two persons may be considered as being married, still the tie is only nominal."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '47'
  en_note: 'Untermann''s footnote [14]: The People of India.'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.25.1
  kind: p
  original: '"Sie leben zusammen" (d.h. geschlechtlich) "fast unterschiedslos in großen Gemeinschaften, und wenn zwei Leute als miteinander verheiratet gelten, so ist das Band doch nur nominell."'
  en: ''
  joined_to: II.24.6
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '47'
- id: II.26.1
  kind: p
  original: Direkt aus der Punaluafamilie hervorgegangen scheint in weitaus den meisten Fällen die Institution der Gens.
  en: The institution of the gens seems to have its origin in the majority of cases in the Punaluan family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '47'
- id: II.26.2
  kind: p
  original: Zwar bietet auch das australische Klassensystem einen Ausgangspunkt dafür; die Australier haben Gentes, aber noch keine Punaluafamilie, sondern eine rohere Form der Gruppenehe.
  en: True, the Australian class system also offers a starting point for it; the Australians have gentes, but not yet a Punaluan family, only a cruder form of group marriage.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T6
    editions: '1884'
    reading: 'Ihre Organisation steht jedoch zu vereinzelt, als daß wir darauf Rücksicht zu nehmen hätten (statt: sondern eine rohere Form der Gruppenehe)'
    base_text: … rohere Form der Gruppenehe ‸ . …
  mew_page: '47'
  en_note: 'Untermann''s footnote [15]: See translator''s note, p. 55.'
- id: II.27.1
  kind: p
  original: Bei allen Formen der Gruppenfamilie ist es ungewiß, wer der Vater eines Kindes ist, gewiß aber ist, wer seine Mutter.
  en: In all forms of the group family it is uncertain who is the father of a child, but certain, who is its mother.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '47'
- id: II.27.2
  kind: p
  original: Wenn sie auch alle Kinder der Gesamtfamilie ihre Kinder nennt und Mutterpflichten gegen sie hat, so kennt sie doch ihre leiblichen Kinder unter den andern.
  en: Although she calls all the children of the aggregate family her children and has the duties of a mother toward them, still she knows her natural children from others.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '47'
- id: II.27.3
  kind: p
  original: Es ist also klar, daß, soweit Gruppenehe besteht, die Abstammung nur von mütterlicher Seite nachweisbar ist, also nur die weibliche Linie anerkannt wird.
  en: It is also obvious that, as far as group marriage exists, descent can only be traced on the mother's side and, hence, only female lineage be acknowledged.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '47'
- id: II.27.4
  kind: p
  original: Dies ist in der Tat bei allen wilden und der niederen Barbarenstufe angehörigen Völkern der Fall; und dies zuerst entdeckt zu haben, ist das zweite große Verdienst Bachofens.
  en: This is actually the case among all savage tribes and those in the lower stage of barbarism. To have discovered this first is the second great merit of Bachofen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 47-48
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.27.5
  kind: p
  original: Er bezeichnet diese ausschließliche Anerkennung der Abstammungsfolge nach der Mutter und die daraus sich mit der Zeit ergebenden Erbschaftsbeziehungen mit dem Namen Mutterrecht; ich behalte diesen Namen, der Kürze wegen, bei.
  en: He designates this exclusive recognition of descent from the female line and the hereditary relations resulting therefrom in course of time as "maternal law."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '48'
- id: II.27.6
  kind: p
  original: Er ist aber schief, denn auf dieser Gesellschaftsstufe ist von Recht im juristischen Sinne noch nicht die Rede.
  en: I retain this term for the sake of brevity, although it is distorted; for at this social stage there is no sign yet of any law in the juridic sense.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '48'
- id: II.28.1
  kind: p
  original: Nehmen wir nun aus der Punaluafamilie die eine der beiden Mustergruppen, nämlich die einer Reihe von leiblichen und entfernteren (d.h. im ersten, zweiten oder entfernteren Grad von leiblichen Schwestern abstammenden) Schwestern, zusamt ihren Kindern und ihren leiblichen oder entfernteren Brüdern von mütterlicher Seite (die nach unsrer Voraussetzung nicht ihre Männer sind), so haben wir genau den Umkreis der Personen, die später als Mitglieder einer Gens in der Urform dieser Institution erscheinen.
  en: If we now take one of the two standard groups of a Punaluan family, namely that of a series of natural and remote sisters (i. e., first, second and more remote descendants of natural sisters), their children and their natural or remote brothers on the mother's side (who according to our supposition are not their husbands), we have exactly that circle of persons who later appear as members of a gens, in the original form of this institution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '48'
- id: II.28.2
  kind: p
  original: Sie haben alle eine gemeinsame Stammutter, kraft der Abstammung, von welcher die weiblichen Nachkommen generationsweise Schwestern sind.
  en: They all have a common ancestress, by virtue of the descent that makes the different female generations sisters.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '48'
- id: II.28.3
  kind: p
  original: Die Männer dieser Schwestern können aber nicht mehr ihre Brüder sein, also nicht von dieser Stammutter abstammen, gehören also nicht in die Blutsverwandtschaftsgruppe, die spätere Gens; ihre Kinder aber gehören in diese Gruppe, da Abstammung von mütterlicher Seite allein entscheidend, weil allein gewiß ist.
  en: But the husbands of these sisters cannot be chosen among their brothers any more, can no longer come from the same ancestress, and do not, therefore, belong to the consanguineous group of relatives, the gens of a later time. The children of these same sisters, however, do belong to this group, because descent from the female line alone is conclusive, alone is positive.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '48'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.28.4
  kind: p
  original: Sobald die Ächtung des Geschlechtsverkehrs zwischen allen Geschwistern, auch den entferntesten Kollateralverwandten mütterlicher Seite, einmal feststeht, hat sich auch obige Gruppe in eine Gens verwandelt, d.h. sich konstituiert als ein fester Kreis von Blutsverwandten weiblicher Linie, die untereinander nicht heiraten dürfen, und der von nun an sich mehr und mehr durch andre gemeinsame Einrichtungen gesellschaftlicher und religiöser Art befestigt und von den andern Gentes desselben Stammes unterscheidet.
  en: As soon as the proscription of sexual intercourse between all relatives on the mother's side, even the most remote of them, is an accomplished fact, the above named group has become a gens, i. e., constitutes a definite circle of consanguineous relatives of female lineage who are not permitted to marry one another. Henceforth this circle is more and more fortified by other mutual institutions of a social or religious character and thus distinguished from other gentes of the same tribe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '48'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.28.5
  kind: p
  original: Darüber ausführlich später.
  en: Of this more anon.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '48'
- id: II.28.6
  kind: p
  original: Wenn wir aber finden, wie nicht nur notwendig, sondern sogar selbstverständlich die Gens aus der Punaluafamilie sich entwickelt, so liegt es nahe, das ehemalige Bestehn dieser Familienform als fast sicher anzunehmen für alle Völker, bei denen Gentilinstitutionen nachweisbar sind, d.h. so ziemlich für alle Barbaren und Kulturvölker.
  en: Finding, as we do, that the gens not only necessarily, but also as a matter of course, develops from the Punaluan family, it becomes obvious to us to assume as almost practically demonstrated the prior existence of this family form among all those nations where such gentes are traceable, i. e., nearly all barbarian and civilized nations.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T7
    editions: '1884'
    reading: 'fehlt der folgende Text bis zum Abschnitt: 3. Die Paarungsfamilie... (S. 51)'
    base_text: … alle Barbaren und Kulturvölker. ‸  …
  mew_page: '48'
- id: II.29.1
  kind: p
  original: Als Morgan sein Buch schrieb, war unsre Kenntnis von der Gruppenehe noch sehr beschränkt.
  en: When Morgan wrote his book, our knowledge of group marriage was very limited.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '48'
- id: II.29.2
  kind: p
  original: Man wußte einiges wenige über die Gruppenehen der in Klassen organisierten Australier, und daneben hatte Morgan schon 1871 die ihm zugekommenen Nachrichten über die hawaiische Punaluafamilie veröffentlicht.
  en: We knew very little about the group marriages of the Australians organized in classes, and furthermore Morgan had published as early as 1871 the information he had received about the Punaluan family of Hawaii.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 48-49
- id: II.29.3
  kind: p
  original: Die Punaluafamilie lieferte einerseits die vollständige Erklärung für das unter den amerikanischen Indianern herrschende Verwandtschaftssystem, das für Morgan der Ausgangspunkt aller seiner Untersuchungen gewesen war; sie bildete andrerseits den fertigen Ausgangspunkt zur Ableitung der mutterrechtlichen Gens; sie stellte endlich eine weit höhere Entwicklungsstufe dar als die australischen Klassen.
  en: This family on one hand furnished a complete explanation of the system of kinship in force among the American Indians, which had been the point of departure for all the studies of Morgan. On the other hand it formed a ready means for the deduction of the maternal law gens. And finally it represented a far higher stage of development than the Australian classes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.29.4
  kind: p
  original: Es war also begreiflich, daß Morgan sie als die der Paarungsehe notwendig vorhergehende Entwicklungsstufe faßte und ihr allgemeine Verbreitung in früherer Zeit zuschrieb.
  en: It is, therefore, easy to understand how Morgan could regard this form as the stage necessarily preceding the pairing family and attribute general extension in former times to it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: II.29.5
  kind: p
  original: Wir haben seitdem eine Reihe andrer Formen der Gruppenehe kennengelernt und wissen jetzt, daß Morgan hier zu weit ging.
  en: Since then we have learned of several other forms of the group marriage, and we know that Morgan went too far in this respect.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: II.29.6
  kind: p
  original: Aber er hatte immerhin das Glück, in seiner Punaluafamilie auf die höchste, die klassische Form der Gruppenehe zu stoßen, auf diejenige Form, aus der der Übergang zu einer höheren Form sich am einfachsten erklärt.
  en: But it was nevertheless his good fortune to encounter in his Punaluan family the highest, the classical, form of group marriage, that form which gave the simplest clue for the transition to a higher stage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: II.30.1
  kind: p
  original: Die wesentlichste Bereicherung unsrer Kenntnisse von der Gruppenehe verdanken wir dem englischen Missionar Lorimer Fison, der diese Familienform auf ihrem klassischen Boden, Australien, jahrelang studierte.
  en: The most essential contribution to our knowledge of the group marriage we owe to the English missionary, Lorimer Fison, who studied this form of the family for years on its classical ground, Australia.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: II.30.2
  kind: p
  original: Die niedrigste Entwicklungsstufe fand er bei den Australnegern am Mount Gambier in Südaustralien.
  en: He found the lowest stage of development among the Papuans near Mount Gambier in South Australia.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: II.30.3
  kind: p
  original: Hier ist der ganze Stamm in zwei große Klassen geteilt, Kroki und Kumite.
  en: Here the whole tribe is divided into two great classes, Kroki and Kumite.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
  en_note: 'Untermann''s note [16]: According to Cunow, Kroki and Kumite are phratries. See "Die Verwandschaftsorganizationen der Australneger," by Heinrich Cunow. Stuttgart, Dietz Verlag, 1894.'
- id: II.30.4
  kind: p
  original: Der Geschlechtsverkehr innerhalb jeder dieser Klassen ist streng verpönt; dagegen ist jeder Mann der einen Klasse der angeborne Gatte jeder Frau der andern Klasse, und diese ist seine angeborne Gattin.
  en: Sexual intercourse within each of these classes is strictly prohibited. But every man of one class is by birth the husband of every woman of the other class, and vice versa.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.30.5
  kind: p
  original: Nicht die Individuen, die ganzen Gruppen sind aneinander verheiratet, Klasse mit Klasse.
  en: Not the individuals are married to one another, but the whole groups, class to class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: II.30.6
  kind: p
  original: Und wohlgemerkt, hier ist nirgends ein Vorbehalt gemacht wegen Altersunterschied oder spezieller Blutsverwandtschaft, außer soweit dies durch die Spaltung in zwei exogame Klassen bedingt ist.
  en: And mark well, no caution is made anywhere on account of difference of age or special consanguinity, unless it is resulting from the division into two exogamous classes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: II.30.7
  kind: p
  original: Ein Kroki hat zur rechtmäßigen Gattin jede Kumitefrau; da aber seine eigne Tochter, als Tochter einer Kumitefrau, nach Mutterrecht ebenfalls Kumite ist, so ist sie damit die geborne Gattin jedes Kroki, also auch ihres Vaters.
  en: A Kroki has for his wife every Kumite woman. And as his own daughter, being the daughter of a Kumite woman, is also Kumite according to maternal law, she is therefore the born wife of every Kroki, including her father.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.30.8
  kind: p
  original: Wenigstens schiebt dem die Klassenorganisation, wie sie uns vorliegt, keinen Riegel vor.
  en: At least, the class organization, as we know it, does not exclude this possibility.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: II.30.9
  kind: p
  original: Entweder also ist diese Organisation entstanden zu einer Zeit, wo man, bei allem dunkeln Drang, die Inzucht zu beschränken, im Geschlechtsverkehr zwischen Eltern und Kindern noch nichts besonders Grauenhaftes fand - und dann würde das Klassensystem direkt entstanden sein aus einem Zustand des regellosen geschlechtlichen Umgangs.
  en: Hence this organization either arose at a time when, in spite of all dim endeavor to limit inbreeding, sexual intercourse between parents and children was not yet regarded with any particular horror; in this case the class system would be directly evolved from a condition of unrestricted sexual relations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: II.30.10
  kind: p
  original: Oder aber, der Verkehr zwischen Eltern und Kindern war schon durch die Sitte verpönt, als die Klassen entstanden, und dann weist der jetzige Zustand zurück auf die Blutsverwandtschaftsfamilie und ist der erste Schritt aus dieser hinaus.
  en: Or the intercourse between parents and children was already proscribed by custom, when the classes were formed; and in this case the present condition points back to the consanguine family and is the first step out of it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: II.30.11
  kind: p
  original: Dies letztere ist das wahrscheinlichere.
  en: The latter case is the more probable.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '49'
- id: II.30.12
  kind: p
  original: Beispiele von ehelichem Umgang zwischen Eltern und Kindern werden meines Wissens aus Australien nicht erwähnt, und auch die spätere Form der Exogamie, die mutterrechtliche Gens, setzt in der Regel das Verbot dieses Umgangs stillschweigend, als etwas bei ihrer Stiftung schon Vorgefundnes voraus.
  en: So far as I know, no mention is made of any sexual intercourse between parents and children in Australia. Even the later form of exogamy, the maternal law gens, as a rule silently presupposes that the prohibition of this intercourse was an accomplished fact at the time of its institution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 49-50
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.31.1
  kind: p
  original: Das System der zwei Klassen findet sich, außer am Mount Gambier in Südaustralien, ebenfalls am Darlingfluß weiter östlich und in Queensland im Nordosten, ist also weit verbreitet.
  en: The system of two classes is not only found near Mount Gambier in South Australia, but also farther east along Darling River, and in the northeast of Queensland. It is, consequently, widespread.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.31.2
  kind: p
  original: Es schließt nur die Ehen zwischen Geschwistern, zwischen Bruderskindern und zwischen Schwesterkindern auf Mutterseite aus, weil diese derselben Klasse angehören; die Kinder von Schwester und Bruder können dagegen heiraten.
  en: It excludes only marriage between brothers and sisters, between brothers' children and between sisters' children of the mother's side, because these belong to the same class; but the children of a sister can marry those of a brother and vice versa.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: II.31.3
  kind: p
  original: Einen weiteren Schritt zur Verhinderung der Inzucht finden wir bei den Kamilaroi am Darlingfluß in Neusüdwales, wo die beiden ursprünglichen Klassen in vier gespalten sind und jede dieser vier Klassen ebenfalls an eine bestimmte andre in Bausch und Bogen verheiratet ist.
  en: A further step for preventing inbreeding is found among the Kamilaroi on the Darling River in New South Wales, where the two original classes are split into four, and every one of these is married as a whole to a certain other class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: II.31.4
  kind: p
  original: Die ersten zwei Klassen sind geborne Gatten voneinander; je nachdem die Mutter der ersten oder zweiten angehörte, fallen die Kinder in die dritte oder vierte; die Kinder dieser beiden, ebenfalls aneinander verheirateten Klassen, gehörten wieder in die erste und zweite.
  en: The first two classes are husbands and wives by birth. According to the place of the mother in the first or second class, the children belong to the third and fourth. The children of these two classes, who are also married to one another, again belong to the first and second class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.31.5
  kind: p
  original: So daß immer eine Generation der ersten und zweiten, die folgende der dritten und vierten, die nächstfolgende wieder der ersten und zweiten Klasse angehört.
  en: So that a certain generation belongs to the first and second class, the next to the third and fourth and the following again to the first and second.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: II.31.6
  kind: p
  original: Hiernach können Geschwisterkinder (auf Mutterseite) nicht Mann und Frau sein, wohl aber Geschwisterenkel.
  en: Hence the children of natural brothers and sisters (on the mother's side) cannot marry one another, but their grandchildren can do so.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: II.31.7
  kind: p
  original: Diese eigentümlich komplizierte Ordnung wird noch verwickelter gemacht durch die - jedenfalls spätere - Daraufpfropfung von mutterrechtlichen Gentes, doch können wir hierauf nicht eingehn.
  en: This peculiarly complicated order of things is still more entangled by the inoculation--evidently at a later stage--with maternal law gentes. But we cannot discuss this further.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.31.8
  kind: p
  original: Man sieht eben, der Drang nach Verhinderung der Inzucht macht sich aber und abermals geltend, aber ganz naturwüchsig-tastend, ohne klares Bewußtsein des Ziels.
  en: Enough, the desire to prevent inbreeding again and again demands recognition, but feeling its way quite spontaneously, without a clear conception of the goal.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: II.32.1
  kind: p
  original: Die Gruppenehe, die hier in Australien noch Klassenehe, Massenehestand einer ganzen, oft über die ganze Breite des Kontinents zerstreuten Klasse Männer mit einer ebenso weitverbreiteten Klasse Frauen ist - diese Gruppenehe sieht in der Nähe nicht ganz so grauenvoll aus, wie die an Bordellwirtschaft gewohnte Philisterphantasie sich das vorstellt.
  en: The group marriage is represented in Australia by class marriage, i. e., mass marriage of a whole class of men frequently scattered over the whole breadth of the continent to an equally widespread class of women. A close view of this group marriage does not offer quite such a horrible spectacle as the philistine imagination accustomed to brothel conditions generally pictures to itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.32.2
  kind: p
  original: Im Gegenteil, es hat lange Jahre gedauert, bis man ihre Existenz nur geahnt hat, und auch ganz neuerdings wird diese wieder bestritten.
  en: On the contrary, long years passed, before its existence was even suspected, and quite recently it is once more denied.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: II.32.3
  kind: p
  original: Dem oberflächlichen Beobachter stellt sie sich dar als lockre Einzelehe und stellenweise Vielweiberei neben gelegentlicher Untreue.
  en: To the casual observer it makes the impression of a loose monogamy and in certain places of polygamy, with occasional breach of faith.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '50'
- id: II.32.4
  kind: p
  original: Man muß schon Jahre daranwenden, wie Fison und Howitt, um in diesen, in ihrer Praxis den gewöhnlichen Europäer eher anheimelnden Ehezuständen das regelnde Gesetz zu entdecken, das Gesetz, wonach der fremde Australneger, Tausende von Kilometern von seiner Heimatgegend, unter Leuten, deren Sprache ihm unverständlich, dennoch nicht selten von Lager zu Lager, von Stamm zu Stamm Frauen findet, die ihm ohne Sträuben und ohne Arg zu Willen sind, und wonach derjenige, der mehrere Frauen hat, dem Gast eine derselben für die Nacht abtritt.
  en: Years are required before one can discover, like Fison and Howitt, the law regulating these marital conditions that rather appeal in their practicability to the average European; the law enabling the strange Papuan, thousands of miles from his home and among people whose language he does not understand, to find frequently, from camp to camp and from tribe to tribe, women who will without resistance and guilelessly surrender to him; the law according to which a man with several women offers one to his guest for the night.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 50-51
- id: II.32.5
  kind: p
  original: Wo der Europäer Sittenlosigkeit und Gesetzlosigkeit sieht, herrscht in der Tat strenges Gesetz.
  en: Where the European sees immorality and lawlessness, there in reality a strict law is observed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
- id: II.32.6
  kind: p
  original: Die Frauen gehören zur Eheklasse des Fremden und sind daher seine gebornen Gattinnen; dasselbe Sittengesetz, das beide aufeinander anweist, verbietet bei Strafe der Ächtung jeden Verkehr außerhalb der zueinander gehörigen Eheklassen.
  en: The women belong to the marriage class of the stranger and, therefore, they are his wives by birth. The same moral law assigning both to one another forbids under penalty of proscription all sexual intercourse outside of the two marriage classes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.32.7
  kind: p
  original: Selbst wo Frauen geraubt werden, wie das häufig und in manchen Gegenden die Regel ist, wird das Klassengesetz sorgfältig eingehalten.
  en: Even when women are abducted, as is frequently the case in certain regions, the class law is carefully respected.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
- id: II.33.1
  kind: p
  original: 'Beim Frauenraub zeigt sich übrigens hier schon eine Spur des Übergangs zur Einzelehe, wenigstens in der Form der Paarungsehe: Wenn der junge Mann mit Hülfe seiner Freunde das Mädchen geraubt oder entführt hat, so wird sie von ihnen allen der Reihe nach geschlechtlich gebraucht, gilt danach aber auch für die Frau des jungen Mannes, der den Raub angestiftet hat.'
  en: In the abduction of women, by the way, a trace of transition to monogamy is found even here, at least in the form of the pairing family. If a young man has abducted a girl with the help of his friends, they hold sexual intercourse with her one after another. But after that the girl is regarded as the wife of the young man who planned the abduction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.33.2
  kind: p
  original: Und umgekehrt, läuft die geraubte Frau dem Manne weg und wird von einem andern abgefaßt, so wird sie dessen Frau, und der erste hat sein Vorrecht verloren.
  en: And again, if an abducted woman deserts her husband and is caught by another man, she becomes the wife of the latter and the first has lost his privilege.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
- id: II.33.3
  kind: p
  original: 'Neben und innerhalb der im allgemeinen fortbestehenden Gruppenehe bilden sich also Ausschließlichkeitsverhältnisse, Paarungen auf längere oder kürzere Zeit, daneben Vielweiberei, so daß die Gruppenehe auch hier im Absterben begriffen ist und es sich nur fragt, wer unter dem europäischen Einfluß zuerst vom Schauplatz verschwinden wird: die Gruppenehe oder die ihr frönenden Australneger.'
  en: 'Alongside of and within the generally existing group marriage such exclusive relations are formed, pairing for a shorter or longer term by the side of polygamy, so that here also group marriage is declining. The question is only which will first disappear under the pressure of European influence: group marriage or the Papuans addicted to it.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.34.1
  kind: p
  original: Die Ehe nach ganzen Klassen, wie sie in Australien herrscht, ist jedenfalls eine sehr niedrige und ursprüngliche Form der Gruppenehe, während die Punaluafamilie, soviel wir wissen, ihre höchste Entwicklungsstufe ist.
  en: The marriage in whole classes, such as is in force in Australia, is no doubt a very low and primitive form of group marriage, while the Punaluan family, so far as we know, is its highest stage of development.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
- id: II.34.2
  kind: p
  original: Die erstere scheint die dem Gesellschaftsstand herumstreichender Wilden entsprechende Form, die zweite setzt schon relativ feste Ansiedlungen kommunistischer Gemeinschaften voraus und führt unmittelbar in die nächsthöhere Entwicklungsstufe.
  en: The former seems to be corresponding to the social stage of roving savages, the latter requires relatively settled communistic bodies and leads directly to the next higher stage of development.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
- id: II.34.3
  kind: p
  original: Zwischen beiden werden wir sicher noch manche Mittelstufen finden; hier liegt ein bis jetzt nur eröffnetes, kaum schon betretenes Untersuchungsgebiet vor.
  en: Between these two, we shall no doubt find many an intermediate stage. Here lies a barely opened, hardly entered field of investigation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
  en_note: 'Untermann''s note [17]: Heinrich Cunow has given us the results of his most recent investigations in his "Verwandschaftsorganisationen der Australneger." He sums up his studies in these words: "While Morgan and Fison regard the system of marriage classes as an original organization preceding the so-called Punaluan family, I have found that the class is indeed older than the gens, having its origin in the different strata of generations characteristic of the "consanguine family" of Morgan; but the present mode of classification in force among Kamilaroi, Kabi, Yuipera, etc., cannot have arisen until a much later time, when the gentile institution had already grown out of the horde. This system of classification does not represent the first timid steps of evolution; it is not the most primitive of any known forms of social organization, but an intermediate form that takes shape together with the gentile society, a stage of transition to a pure gentile organization. In this stage, the generic classification in strata of different ages belonging to the so-called consanguine family runs parallel for a while with the gentile order.... It would have been easy for me to quote the testimony of travelers and ethnologists in support of the conclusions drawn by me from the forms of relationship among Australian negroes. But I purposely refrain from doing this, with a few exceptions, first because I do not wish to write a general history of the primitive family, and, secondly, because I consider all references of this kind as very doubtful testimony, unless they are accompanied by an analysis of the entire organization. We frequently find analogies to the institutions of a lower stage in a high stage, and yet they are founded on radically different premises and causes. The evolution of the Australian aborigines shows that. Among the Australians of the lower stage, e. g., the hordes are endogamous, among those of the middle stage they are exogamous, and in the higher stage they are again endogamous. But while in the one instance the marriage in the horde is conditioned on the fact that the more remote relatives are not yet excluded from sexual intercourse, it is founded in the other case on the difference between local and sexual organization. Furthermore, the marriage between daughter and father is permitted in the lower stage, and again in that higher stage, where the class organization of the Kamilaroi is on the verge of dissolution. But in both cases the circle of those who are regarded as fathers is entirely different. The character of an institution can only be perfectly understood, if we examine its connection with the entire organization, and, if possible, trace its metamorphoses in the preceding stages.... The characteristic feature of the class system is that by the side of the gentile order, such as is found among the North American Indians, there is always another system of four marriage classes for the purpose of limiting sexual intercourse between certain groups of relatives. Neither the phratry nor the gens of the Kamilaroi forms a distinct territorial community. Their members are scattered among different roving hordes, and they only meet occasionally, e. g., to celebrate a feast or dance.... The origin of gentile systems out of Punaluan groups has never been proven, while we see among the Australian negroes that the classes are clearly and irrefutably in existence among the first traces of gentilism.... The class system in its original form is a conclusive proof of Morgan''s theory, that the first step in the formation of systems of relationship consisted in prohibiting sexual intercourse between parents and children (in a wider sense).... It has been often disputed that the Punaluan family ever existed outside of the Sandwich Islands. But the marriage institutions of certain Australian tribes named by me prove the contrary. The Pirrauru of the Dieyerie is absolutely identical with the Punalua of the Hawaiians; and these institutions were not described by travelers who rushed through the territories of those tribes without knowing their language, but by men who lived among them for decades and fully mastered their dialects.... I have shown how far the class system corresponds to the Hawaiian system. It is and remains a fact, that it contains a long series of terms that cannot be explained by the relations in the so-called consanguine family, and the use of which creates confusion, if applied to this family. But that simply shows that Morgan was mistaken about the age and present structure of the Hawaiian system. It does not prove that it could not have grown on the basis assumed by him.... If the opponents of Morgan dispute that the so-called consanguine family is based on blood kinship, they are right, unless we wish to assign an exceptional position to the Australian strata of generations. But if they go further and declare that the subsequent restrictions of inbreeding and the gentile order have arisen independently of relationships, they commit a far greater mistake than Morgan. They block their way to an understanding of subsequent organizations and force themselves to all sorts of queer assumptions that at once appear as the fruits of imagination, when compared with the actual institutions of primitive peoples. This explanation of the phases of development of family institutions contradicts present day views on the matter. Since the scientific investigations of the last decade have demonstrated beyond doubt that the so-called patriarchal family was preceded by the matriarchal family, it has become the custom to regard descent by females as a natural institution belonging to the very first stages of development which is explained by the modes of existence and thought among savages. Paternity being a matter of speculation, maternity of actual observation, it is supposed to follow that descent by females was always recognized. But the development of the Australian systems of relationship shows that this is not true, at least not in regard to Australians. The fact cannot be disputed away, that we find female lineage among all those higher developed tribes that have progressed to the formation of gentile organizations, but male lineage among all those that have no gentile organizations or where these are only in process of formation. Not a single tribe has been discovered so far, where female lineage was not combined with gentile organization, and I doubt that any will ever be found."'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.35.1
  kind: p
  original: 3. Die Paarungsfamilie.
  en: 3. THE PAIRING FAMILY.
  modern: ''
