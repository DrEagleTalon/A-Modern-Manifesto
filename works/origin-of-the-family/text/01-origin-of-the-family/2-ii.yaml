- id: II.35.2
  kind: p
  original: Eine gewisse Paarung, für kürzere oder längere Zeit, fand bereits unter der Gruppenehe oder noch früher statt; der Mann hatte eine Hauptfrau (man kann noch kaum sagen Lieblingsfrau) unter den vielen Frauen, und er war für sie der hauptsächlichste Ehemann unter den andern.
  en: A certain pairing for a longer or shorter term took place even during the group marriage or still earlier. A man had his principal wife (one can hardly call it favorite wife as yet) among many women, and he was to her the principal husband among others.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '51'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.35.3
  kind: p
  original: Dieser Umstand hat nicht wenig beigetragen zu der Konfusion bei den Missionaren, die in der Gruppenehe bald regellose Weibergemeinschaft, bald willkürlichen Ehebruch sehn.
  en: This fact in no small degree contributed to the confusion among missionaries, who regarded group marriage now as a disorderly community of women, now as an arbitrary adultery.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T8
    editions: '1884'
    reading: Punaluafamilie
    base_text: … die in der Gruppenehe ‸ bald regellose Weibergemeinschaft, bald …
  mew_page: 51-52
- id: II.35.4
  kind: p
  original: Eine solche gewohnheitsmäßige Paarung mußte aber mehr und mehr sich befestigen, je mehr die Gens sich ausbildete und je zahlreicher die Klassen von "Brüdern" und "Schwestern" wurden, zwischen denen Heirat nun unmöglich war.
  en: Such a habitual pairing would gain ground the more the gens developed and the more numerous the classes of "brothers" and "sisters" became who were not permitted to marry one another.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: II.35.5
  kind: p
  original: Der durch die Gens gegebne Anstoß der Verhinderung der Heirat zwischen Blutsverwandten trieb noch weiter.
  en: The impulse to prevent marriage of consanguineous relatives started by the gens went still further.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: II.35.6
  kind: p
  original: So finden wir, daß bei den Irokesen und den meisten andern auf der Unterstufe der Barbarei stehenden Indianern die Ehe verboten ist zwischen allen Verwandten, die ihr System aufzählt, und das sind mehrere hundert Arten.
  en: Thus we find that among the Iroquois and most of the Indians in the lower stage of barbarism marriage is prohibited between all the relatives of their system of kinship, and this comprises several hundred kinds.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: II.35.7
  kind: p
  original: Bei dieser wachsenden Verwicklung der Eheverbote wurden Gruppenehen mehr und mehr unmöglich; sie wurden verdrängt durch die Paarungsfamilie.
  en: By this increasing complication of marriage restrictions, group marriage became more and more impossible; it was displaced by the pairing family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: II.35.8
  kind: p
  original: Auf dieser Stufe lebt ein Mann mit einer Frau zusammen, jedoch so, daß Vielweiberei und gelegentliche Untreue Recht der Männer bleibt, wenn erstere auch aus ökonomischen Gründen selten vorkommt; während von den Weibern für die Dauer des Zusammenlebens meist strengste Treue verlangt und ihr Ehebruch grausam bestraft wird.
  en: At this stage one man lives with one woman, but in such a manner that polygamy, and occasional adultery, remain privileges of men, although the former occurs rarely for economic reasons. Women, however, are generally expected to be strictly faithful during the time of living together, and adultery on their part is cruelly punished.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.35.9
  kind: p
  original: Das Eheband ist aber von jedem Teil leicht löslich, und die Kinder gehören nach wie vor der Mutter allein.
  en: But the marriage-tie may be easily broken by either party, and the children belong to the mother alone, as formerly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: II.36.1
  kind: p
  original: Auch in dieser immer weiter getriebnen Ausschließung der Blutsverwandten vom Eheband wirkt die natürliche Zuchtwahl fort.
  en: In this ever more extending restriction of marriage between consanguineous relations, natural selection also remains effective.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: II.36.2
  kind: p
  original: 'In Morgans Worten:'
  en: 'As Morgan expresses it: "Marriages between gentes that were not consanguineous produced a more vigorous race, physically and mentally; two progressive tribes intermarried, and the new skulls and brains naturally expanded until they comprised the faculties of both."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.37.1
  kind: p
  original: '"Die Ehen zwischen nicht-blutsverwandten Gentes erzeugten eine kräftigere Race, physisch wie geistig; zwei fortschreitende Stämme vermischten sich, und die neuen Schädel und Hirne erweiterten sich naturgemäß, bis sie die Fähigkeiten beider umfaßten."'
  en: ''
  joined_to: II.36.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '52'
- id: II.38.1
  kind: p
  original: Stämme mit Gentilverfassung mußten so über die Zurückgebliebenen die Oberhand gewinnen oder sie durch ihr Beispiel mit sich ziehn.
  en: Thus tribes composed of gentes necessarily either gained the supremacy over the backward ones or, by their example, carried them along in their wake.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: II.39.1
  kind: p
  original: Die Entwicklung der Familie in der Urgeschichte besteht somit in der fortwährenden Verengerung des ursprünglich den ganzen Stamm umfassenden Kreises, innerhalb dessen eheliche Gemeinschaft zwischen den beiden Geschlechtern herrscht.
  en: The development of the family, then, is founded on the continual contraction of the circle, originally comprising the whole tribe, within which marital intercourse between both sexes was general.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: II.39.2
  kind: p
  original: Durch fortgesetzte Ausschließung erst näherer, dann immer entfernterer Verwandten, zuletzt selbst bloß angeheirateter, wird endlich jede Art von Gruppenehe praktisch unmöglich, und es bleibt schließlich das eine, einstweilen noch lose verbundne Paar übrig, das Molekül, mit dessen Auflösung die Ehe überhaupt aufhört.
  en: By the continual, exclusion, first of near, then of ever remoter relatives, including finally even those who were simply related legally, all group marriage becomes practically impossible. At last only one couple, temporarily and loosely united, remains; that molecule, the dissolution of which absolutely puts an end to marriage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.39.3
  kind: p
  original: Schon hieraus zeigt sich, wie wenig die individuelle Geschlechtsliebe im heutigen Sinne des Worts mit der Entstehung der Einzelehe zu tun hatte.
  en: Even from this we may infer how little the sexual love of the individual in the modern sense of the word had to do with the origin of monogamy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: II.39.4
  kind: p
  original: Noch mehr beweist dies die Praxis aller Völker, die auf dieser Stufe stehn.
  en: The practice of all nations of that stage still more proves this.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '52'
- id: II.39.5
  kind: p
  original: Während in früheren Familienformen die Männer nie um Frauen verlegen zu sein brauchten, im Gegenteil ihrer eher mehr als genug hatten, wurden Frauen jetzt selten und gesucht.
  en: While in the previous form of the family the men were never embarrassed for women, but rather had more than enough of them, women now became scarce and were sought after.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 52-53
- id: II.39.6
  kind: p
  original: Daher beginnt seit der Paarungsehe der Raub und der Kauf von Frauen - weitverbreitete Symptome, aber weiter auch nichts, einer eingetretnen, viel tiefer liegenden Veränderung, welche Symptome, bloße Methoden, sich Frauen zu verschaffen, der pedantische Schotte McLennan indes als "Raubehe" und "Kaufehe" in besondre Familienklassen umgedichtet hat.
  en: With the pairing family, therefore, the abduction and barter of women began--widespread symptoms, and nothing but that, of a new and much more profound change. The pedantic Scot, McLennan, however, transmuted these symptoms, mere methods of obtaining women, into separate classes of the family under the head of "marriage by capture" and "marriage by barter."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.39.7
  kind: p
  original: Auch sonst, bei den amerikanischen Indianern und anderswo (auf gleicher Stufe) ist die Eheschließung Sache nicht der Beteiligten, die oft gar nicht befragt werden, sondern ihrer Mütter.
  en: Moreover among American Indians and other nations in the same stage, the marriage agreement is not the business of the parties most concerned, who often are not even asked, but of their mothers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
- id: II.39.8
  kind: p
  original: Oft werden so zwei einander ganz Unbekannte verlobt und erst von dem abgeschlossenen Handel in Kenntnis gesetzt, wenn die Zeit zum Heiraten heranrückt.
  en: Frequently two persons entirely unknown to one another are thus engaged to be married and receive no information of the closing of the bargain, until the time for the marriage ceremony approaches.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
- id: II.39.9
  kind: p
  original: Vor der Hochzeit macht der Bräutigam den Gentilverwandten der Braut (also ihren mütterlichen, nicht dem Vater und seiner Verwandtschaft) Geschenke, die als Kaufgaben für das abgetretene Mädchen gelten.
  en: Before the wedding, the bridegroom brings gifts to the maternal relatives of the bride (not to her father or his relatives) as an equivalent for ceding the girl to him.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
- id: II.39.10
  kind: p
  original: 'Die Ehe bleibt löslich nach dem Belieben eines jeden der beiden Verheirateten: Doch hat sich nach und nach bei vielen Stämmen, z.B. den Irokesen, eine solchen Trennungen abgeneigte öffentliche Meinung gebildet; bei Streitigkeiten treten die Gentilverwandten beider Teile vermittelnd ein, und erst wenn dies nicht fruchtet, findet Trennung statt, wobei die Kinder der Frau verbleiben und wonach es jedem Teil freisteht, sich neu zu verheiraten.'
  en: Either of the married parties may dissolve the marriage at will. But among many tribes, as, e. g., the Iroquois, public opinion has gradually become averse to such separations. In case of domestic differences the gentile relatives of both parties endeavor to bring about a reconciliation, and not until they are unsuccessful a separation takes place. In this case the woman keeps the children, and both parties are free to marry again.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
  align: '1:4'
  review: true
  review_reason: 1 de sentence(s) matched to 4 en sentence(s)
- id: II.40.1
  kind: p
  original: Die Paarungsfamilie, selbst zu schwach und zu unbeständig, um einen eignen Haushalt zum Bedürfnis oder nur wünschenswert zu machen, löst die aus früherer Zeit überlieferte kommunistische Haushaltung keineswegs auf.
  en: The pairing family, being too weak and too unstable to make an independent household necessary or even desirable, in no way dissolves the traditional communistic way of housekeeping.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
- id: II.40.2
  kind: p
  original: Kommunistischer Haushalt bedeutet aber Herrschaft der Weiber im Hause, wie ausschließliche Anerkennung einer leiblichen Mutter bei Unmöglichkeit, einen leiblichen Vater mit Gewißheit zu kennen, hohe Achtung der Weiber, d.h. der Mütter, bedeutet.
  en: But household communism implies supremacy of women in the house as surely as exclusive recognition of a natural mother and the consequent impossibility of identifying the natural father signify high esteem for women, i. e., mothers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
- id: II.40.3
  kind: p
  original: Es ist eine der absurdesten, aus der Aufklärung des 18. Jahrhunderts überkommenen Vorstellungen, das Weib sei im Anfang der Gesellschaft Sklavin des Mannes gewesen.
  en: It is one of the most absurd notions derived from eighteenth century enlightenment, that in the beginning of society woman was the slave of man.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
- id: II.40.4
  kind: p
  original: Das Weib hat bei allen Wilden und allen Barbaren der Unter- und Mittelstufe, teilweise noch der Oberstufe, eine nicht nur freie, sondern hochgeachtete Stellung.
  en: Among all savages and barbarians of the lower and middle stages, sometimes even of the higher stage, women not only have freedom, but are held in high esteem.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
- id: II.40.5
  kind: p
  original: 'Was es noch in der Paarungsehe ist, möge Arthur Wright, langjähriger Missionar unter den Seneka-Irokesen, bezeugen:'
  en: 'What they were even in the pairing family, let Arthur Wright, for many years a missionary among the Seneca Iroquois, testify: "As to their families, at a time when they still lived in their old long houses (communistic households of several families)... a certain clan (gens) always reigned, so that the women choose their husbands from other clans (gentes)....'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '53'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.41.1
  kind: p
  original: '"Was ihre Familien betrifft, zur Zeit, wo sie noch die alten langen Häuser" (kommunistische Haushaltungen mehrerer Familien) "bewohnten,... so herrschte dort immer ein Clan" (eine Gens) "vor, so daß die Weiber ihre Männer aus den andern Clans" (Gentes) "nahmen...'
  en: ''
  joined_to: II.40.5
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '53'
- id: II.41.2
  kind: p
  original: Gewöhnlich beherrschte der weibliche Teil das Haus; die Vorräte waren gemeinsam; wehe aber dem unglücklichen Ehemann oder Liebhaber, der zu träge oder zu ungeschickt war, seinen Teil zum gemeinsamen Vorrat beizutragen.
  en: The female part generally ruled the house; the provisions were held in common; but woe to the luckless husband or lover who was too indolent or too clumsy to contribute his share to the common stock.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 53-54
- id: II.41.3
  kind: p
  original: Einerlei wieviel Kinder oder wieviel Eigenbesitz er im Hause hatte, jeden Augenblick konnte er des Befehls gewärtig sein, sein Bündel zu schnüren und sich zu trollen.
  en: No matter how many children or how much private property he had in the house, he was liable at any moment to receive a hint to gather up his belongings and get out.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: II.41.4
  kind: p
  original: Und er durfte nicht versuchen, dem zu widerstehn; das Haus wurde ihm zu heiß gemacht, es blieb ihm nichts, als zu seinem eignen Clan" (Gens) "zurückzukehren oder aber, was meist der Fall, eine neue Ehe in einem andern Clan aufzusuchen.
  en: And he could not dare to venture any resistance; the house was made too hot for him and he had no other choice, but to return to his own clan (gens) or, as was mostly the case, to look for another wife in some other clan.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: II.41.5
  kind: p
  original: Die Weiber waren die große Macht in den Clans" (Gentes) "und auch sonst überall.
  en: The women were the dominating power in the clans (gentes) and everywhere else.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: II.41.6
  kind: p
  original: Gelegentlich kam es ihnen nicht darauf an, einen Häuptling abzusetzen und zum gemeinen Krieger zu degradieren."
  en: Occasionally they did not hesitate to dethrone a chief and degrade him to a common warrior."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: II.42.1
  kind: p
  original: Die kommunistische Haushaltung, in der die Weiber meist oder alle einer und derselben Gens angehören, die Männer aber auf verschiedene Gentes sich verteilen, ist die sachliche Grundlage jener in der Urzeit allgemein verbreiteten Vorherrschaft der Weiber, die ebenfalls entdeckt zu haben ein drittes Verdienst Bachofens ist.
  en: The communistic household, in which most or all the women belong to one and the same gens, while the husbands come from different gentes, is the cause and foundation of the general and widespread supremacy of women in primeval times. The discovery of this fact is the third merit of Bachofen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.42.2
  kind: p
  original: '- Nachträglich bemerke ich noch, daß die Berichte der Reisenden und Missionare über Belastung der Weiber mit übermäßiger Arbeit bei Wilden und Barbaren dem Gesagten keineswegs widersprechen.'
  en: By way of supplement I wish to state that the reports of travelers and missionaries concerning the overburdening of women among savages and barbarians do not in the least contradict the above statements.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: II.42.3
  kind: p
  original: Die Teilung der Arbeit zwischen beiden Geschlechtern wird bedingt durch ganz andre Ursachen als die Stellung der Frau in der Gesellschaft.
  en: The division of labor between both sexes is caused by other reasons than the social condition of women.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: II.42.4
  kind: p
  original: Völker, bei denen die Weiber weit mehr arbeiten müssen, als ihnen nach unsrer Vorstellung gebührt, haben vor den Weibern oft weit mehr wirkliche Achtung als unsre Europäer.
  en: Nations, where women have to work much harder than is proper for them in our opinion, often respect women more highly than Europeans do.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: II.42.5
  kind: p
  original: Die Dame der Zivilisation, von Scheinhuldigungen umgeben und aller wirklichen Arbeit entfremdet, hat eine unendlich niedrigere gesellschaftliche Stellung als das hartarbeitende Weib der Barbarei, das in seinem Volk für eine wirkliche Dame (lady, frowa, Frau = Herrin) galt und auch eine solche ihrem Charakter nach war.
  en: The lady of civilized countries, surrounded with sham homage and a stranger to all real work stands on a far lower social level than a hard-working barbarian woman, regarded as a real lady (frowa-lady-mistress) and having the character of such.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: II.43.1
  kind: p
  original: Ob die Paarungsehe in Amerika heute die Gruppenehe gänzlich verdrängt hat, müssen nähere Untersuchungen über die noch auf der Oberstufe der Wildheit stehenden nordwestlichen und namentlich über die südamerikanischen Völker entscheiden.
  en: Whether or not the pairing family has in our time entirely supplanted group marriage in America, can be decided only by closer investigations among those nations of northwestern and especially of southern America that are still in the higher stage of savagery.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T9
    editions: '1884'
    reading: Punaluafamilie
    base_text: … Amerika heute die Gruppenehe ‸ gänzlich verdrängt hat, müssen …
  mew_page: '54'
- id: II.43.2
  kind: p
  original: Von diesen letzteren werden so mannigfache Beispiele geschlechtlicher Ungebundenheit erzählt, daß eine vollständige Überwindung der alten Gruppenehe hier kaum anzunehmen ist.
  en: About the latter so many reports of sexual license are current that the assumption of a complete cessation of the ancient group marriage is hardly warranted.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T10
    editions: '1884'
    reading: fehlt der letzte Satz
    base_text: … hier kaum anzunehmen ist. ‸  …
  mew_page: '54'
- id: II.43.3
  kind: p
  original: Jedenfalls sind noch nicht alle Spuren davon verschwunden.
  en: Evidently all traces of it have not yet disappeared.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: II.43.4
  kind: p
  original: 'Bei wenigstens vierzig nordamerikanischen Stämmen hat der Mann, der eine älteste Schwester heiratet, das Recht, alle ihre Schwestern ebenfalls zu Frauen zu nehmen, sobald sie das erforderliche Alter erreichen: Rest der Gemeinsamkeit der Männer für die ganze Reihe von Schwestern.'
  en: In at least forty North American tribes the man marrying an elder sister has the right to make all her sisters his wives as soon as they are of age, a survival of the community of men for the whole series of sisters.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '54'
- id: II.43.5
  kind: p
  original: Und von den Halbinsel-Kaliforniern (Oberstufe der Wildheit) erzählt Bancroft, daß sie gewisse Festlichkeiten haben, wo mehrere "Stämme" zusammenkommen zum Zweck des unterschiedslosen geschlechtlichen Verkehrs.
  en: And Bancroft relates that the Indians of the Californian peninsula celebrate certain festivities uniting several "tribes" for the purpose of unrestricted sexual intercourse.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 54-55
- id: II.43.6
  kind: p
  original: Es sind offenbar Gentes, die in diesen Festen die dunkle Erinnerung bewahren an die Zeit, wo die Frauen einer Gens alle Männer der andern zu ihren gemeinsamen Ehemännern hatten und umgekehrt.
  en: These are evidently gentes that have preserved in these festivities a vague recollection of the time when the women of one gens had for their common husbands all the men of another gens, and vice versa.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T11
    editions: '1884'
    reading: 'Der folgende Text bis zum Absatz: Die Paarungsfamilie... (S. 57) ist die von Engels 1892 erweiterte Fassung. Er lautete 1884: Ähnliche Reste aus der alten Welt sind bekannt genug, so die Preisgebung der phönizischen Mädchen im Tempel an den Festen der Astaroth; selbst das mittelalterliche Recht der ersten Nacht, das trotz neuromantischer deutscher Weißwaschungen eine sehr handfeste Existenz gehabt hat, ist ein vermutlich durch die keltische Gens (den Clan) überliefertes Stück Punaluafamilie.'
    base_text: … Ehemännern hatten und umgekehrt. ‸  …
  mew_page: '55'
- id: II.43.7
  kind: p
  original: Dieselbe Sitte herrscht noch in Australien.
  en: The same custom is still observed in Australia.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
- id: II.43.8
  kind: p
  original: Bei einigen Völkern kommt es vor, daß die älteren Männer, die Häuptlinge und Zauberer-Priester die Weibergemeinschaft für sich ausbeuten und die meisten Frauen für sich monopolisieren; aber dafür müssen sie bei gewissen Festen und großen Volksversammlungen die alte Gemeinschaft wieder in Wirklichkeit treten und ihre Frauen sich mit den jungen Männern ergötzen lassen.
  en: Among certain nations it sometimes happens that the older men, the chief and sorcerer-priests, exploit the community of women for their own benefits and monopolize all the women. But in their turn they must restore the old community during certain festivities and great assemblies, permitting their wives to enjoy themselves with the young men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.43.9
  kind: p
  original: 'Eine ganze Reihe von Beispielen solcher periodischen Saturnalienfeste, wo der alte freie Geschlechtsverkehr wieder auf kurze Zeit in Kraft tritt, bringt Westermarck p. 28/29: bei den Hos, den Santals, den Pandschas und Kotars in Indien, bei einigen afrikanischen Völkern usw. Merkwürdigerweise zieht Westermarck hieraus den Schluß, dies sei Überbleibsel nicht der von ihm geleugneten Gruppenehe, sondern - der dem Urmenschen mit den andern Tieren gemeinsamen Brunstzeit.'
  en: 'A whole series of examples of such periodical saturnalia restoring for a short time the ancient sexual freedom is quoted by Westermarck: among the Hos, the Santals, the Punjas and Kotars in India, among some African nations, etc. Curiously enough Westermarck concludes that this is a survival, not of group marriage, the existence of which he denies, but--of a rutting season which primitive man had in common with other animals.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
  en_note: 'Untermann''s footnote [18]: The History of Human Marriage, p. 28-29.'
- id: II.44.1
  kind: p
  original: Wir kommen hier auf die vierte große Entdeckung Bachofens, die Entdeckung der weitverbreiteten Übergangsform von der Gruppenehe zur Paarung.
  en: 'Here we touch Bachofen''s fourth great discovery: the widespread form of transition from group marriage to pairing family.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
- id: II.44.2
  kind: p
  original: 'Was Bachofen als eine Buße für Verletzung der alten Göttergebote darstellt: Die Buße, womit die Frau das Recht auf Keuschheit erkauft, ist in der Tat nur mystischer Ausdruck für die Buße, womit die Frau sich aus der alten Männergemeinschaft loskauft und das Recht erwirbt, sich nur einem Mann hinzugeben.'
  en: What Bachofen represents as a penance for violating the old divine laws--the penalty with which a woman redeems her right to chastity, is in fact only a mystical expression for the penalty paid by a woman for becoming exempt from the ancient community of men and acquiring the right of surrendering to one man only.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
- id: II.44.3
  kind: p
  original: 'Diese Buße besteht in einer beschränkten Preisgebung: Die babylonischen Frauen mußten einmal im Jahr sich im Tempel der Mylitta preisgeben; andere vorderasiatische Völker schickten ihre Mädchen jahrelang in den Tempel der Anaitis, wo sie mit selbstgewählten Günstlingen der freien Liebe zu pflegen hatten, ehe sie heiraten durften; ähnliche religiös verkleidete Gebräuche sind fast allen asiatischen Völkern zwischen Mittelmeer und Ganges gemein.'
  en: 'This penalty consists in a limited surrender: Babylonian women had to surrender once a year in the temple of Mylitta; other nations of Western Asia sent their young women for years to the temple of Anaitis, where they had to practice free love with favorites of their own choice before they were allowed to marry. Similar customs in a religious disguise are common to nearly all Asiatic nations between the Mediterranean and the Ganges.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.44.4
  kind: p
  original: 'Das Sühnopfer für den Loskauf wird im Verlauf der Zeit immer leichter, wie schon Bachofen bemerkt:'
  en: 'The penalty for exemption becomes gradually lighter in course of time, as Bachofen remarks: "The annually repeated surrender gives place to a single sacrifice; the hetaerism of the matrons is followed by that of the maidens, the promiscuous intercourse during marriage to that before wedding, the indiscriminate intercourse with all to that with certain individuals." Among some nations the religious disguise is missing.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '55'
  en_note: 'Untermann''s footnote [19]: Mutterrecht, p. xix.'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: II.45.1
  kind: p
  original: '"Die jährlich wiederholte Darbringung weicht der einmaligen Leistung, auf den Hetärismus der Matronen folgt jener der Mädchen, auf die Ausübung während der Ehe die vor derselben, auf die wahllose Überlassung an alle die an gewisse Personen." ("Mutterrecht", p. XIX.)'
  en: ''
  joined_to: II.44.4
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: 55-56
- id: II.46.1
  kind: p
  original: Bei andern Völkern fehlt die religiöse Verkleidung; bei einigen - Thrakern, Kelten etc. im Altertum, bei vielen Ureinwohnern Indiens, bei malaiischen Völkern, bei Südsee-Insulanern und vielen amerikanischen Indianern noch heute - genießen die Mädchen bis zu ihrer Verheiratung der größten geschlechtlichen Freiheit.
  en: Among others--Thracians, Celts, etc., in classic times, many primitive inhabitants of India, Malay nations, South Sea Islanders and many American Indians to this day--the girls enjoy absolute sexual freedom before marriage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: II.46.2
  kind: p
  original: Namentlich fast überall in Südamerika, wovon jeder, der dort etwas ins Innere gekommen, Zeugnis ablegen kann.
  en: This is especially true almost everywhere in South America, as everybody can confirm who penetrates a little into the interior.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: II.46.3
  kind: p
  original: 'So erzählt Agassiz ("A Journey in Brazil", Boston and New York 1868, p. 266) von einer reichen Familie von indianischer Abstammung; als er mit der Tochter bekannt gemacht wurde, frug er nach ihrem Vater, in der Meinung, dies sei der Mann der Mutter, der als Offizier im Krieg gegen Paraguay stand; aber die Mutter antwortete lächelnd: Naõ tem pai, é filha da fortuna, sie hat keinen Vater, sie ist ein Zufallskind.'
  en: 'Agassiz, e. g., relates an anecdote of a wealthy family of Indian descent. On being introduced to the daughter he asked something about her father, presuming him to be her mother''s husband, who was in the war against Paraguay. But the mother replied, smiling: "Nao tem pai, he filha da fortuna"--she hasn''t any father; she is the daughter of chance.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
  en_note: 'Untermann''s footnote [20]: A Journey in Brazil. Boston and New York, 1886. Page 266.'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s); regrouped by the ingest (see REALIGN)
- id: II.47.1
  kind: p
  original: '"In dieser Art sprechen indianische oder halbblütige Frauen jederzeit ohne Scham oder Tadel von ihren unehelichen Kindern; und dies ist weit entfernt davon, ungewöhnlich zu sein, eher scheint das Gegenteil Ausnahme.'
  en: '"It is the way the Indian or half-breed women here always speak of their illegitimate children; and though they say it without an intonation of sadness or of blame, apparently as unconscious of any wrong or shame as if they said the father was absent or dead, it has the most melancholy significance; it seems to speak of such absolute desertion. So far is this from being an unusual case, that among the common people the opposite seems the exception.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s); regrouped by the ingest (see REALIGN)
- id: II.47.2
  kind: p
  original: Die Kinder... kennen oft nur ihre Mutter, denn alle Sorge und Verantwortlichkeit fällt auf sie; von ihrem Vater wissen sie nichts; auch scheint es der Frau nie einzufallen, daß sie oder ihre Kinder irgendwelchen Anspruch an ihn haben."
  en: Children are frequently quite ignorant of their parentage. They know about their mother, for all the care and responsibility falls upon her, but they have no knowledge of their father; nor does it seem to occur to the woman that she or her children have any claim upon him."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s); regrouped by the ingest (see REALIGN)
- id: II.48.1
  kind: p
  original: Was dem Zivilisierten hier befremdlich vorkommt, ist einfach die Regel nach Mutterrecht und in der Gruppenehe.
  en: What seems so strange to the civilized man, is simply the rule of maternal law and group marriage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: II.49.1
  kind: p
  original: Bei wieder andern Völkern nehmen die Freunde und Verwandten des Bräutigams oder die Hochzeitsgäste bei der Hochzeit selbst das altüberkommene Recht auf die Braut in Anspruch, und der Bräutigam kommt erst zuletzt an die Reihe; so auf den Balearen und bei den afrikanischen Augilern im Altertum, bei den Bareas in Abessinien noch jetzt.
  en: Again, among other nations the friends and relatives of the bridegroom or the wedding guests claim their traditional right to the bride, and the bridegroom comes last. This custom prevailed in ancient times on the Baleares and among the African Augilers; it is observed to this day by the Bareas in Abyssinia.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.49.2
  kind: p
  original: Bei wieder andern vertritt eine Amtsperson, der Stammes- oder Gentilvorstand, Kazike, Schamane, Priester, Fürst oder wie er heißen mag, die Gemeinschaft, und übt bei der Braut das Recht der ersten Nacht aus.
  en: In still other cases, an official person--the chief of a tribe or a gens, the cazique, shamane, priest, prince or whatever may be his title--represents the community and exercises the right of the first night.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
- id: II.49.3
  kind: p
  original: Trotz aller neuromantischen Weißwaschungen besteht dies jus primae noctis als Rest der Gruppenehe noch heutzutage bei den meisten Einwohnern des Alaskagebiets (Bancroft, "Native Races", I, 81), bei den Tahus in Nordmexiko (ib. p. 584) und andern Völkern; und hat es wenigstens in ursprünglich keltischen Ländern, wo es direkt aus der Gruppenehe überliefert worden, im ganzen Mittelalter bestanden, z.B. in Aragonien.
  en: All modern romantic whitewashing notwithstanding, this jus primae noctis, is still in force among most of the natives of Alaska, among the Tahus of northern Mexico and some other nations. And during the whole of the middle ages it was practiced at least in originally Celtic countries, where it was directly transmitted by group marriage, e. g. in Aragonia.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '56'
  en_note: 'Untermann''s footnote [21]: Bancroft, Native Races, I., 81. Untermann''s footnote [22]: Ibidem, p. 584.'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.49.4
  kind: p
  original: Während in Kastilien der Bauer nie leibeigen war, herrschte in Aragonien die schmählichste Leibeigenschaft bis zum Schiedsspruch Ferdinands des Katholischen von 1486.
  en: While in Castilia the peasant was never a serf, the most disgraceful serfdom existed in Aragonia, until abolished by the decision of Ferdinand the Catholic in 1486.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 56-57
- id: II.49.5
  kind: p
  original: 'In diesem Aktenstück heißt es:'
  en: 'In this document we read: "We decide and declare that the aforesaid ''senyors'' (barons)... shall neither sleep the first night with the wife of a peasant, nor shall they in the first night after the wedding, when the woman has gone to bed, step over said woman or bed as a sign of their authority. Neither shall the aforesaid senyors use the daughter or the son of any peasant, with or without pay, against their will."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: II.50.1
  kind: p
  original: '"Wir urteilen und erklären, daß die vorerwähnten Herren" (senyors, Barone) "... auch nicht können die erste Nacht, wo der Bauer eine Frau nimmt, bei ihr schlafen, oder zum Zeichen der Herrschaft, in der Hochzeitsnacht, nachdem die Frau sich zu Bette gelegt, über es und über die erwähnte Frau hinwegschreiten; noch können die vorerwähnten Herren sich der Tochter oder des Sohnes des Bauern bedienen, mit Bezahlung oder ohne Bezahlung, gegen deren Willen."'
  en: ''
  joined_to: II.49.5
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '57'
- id: II.50.2
  kind: p
  original: (Zitiert im katalanischen Original bei Sugenheim, "Leibeigenschaft", Petersburg 1861, p. 35.)
  en: (Quoted in the Catalonian original by Sugenheim, "Serfdom," Petersburg, 1861, page 35.)
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: II.51.1
  kind: p
  original: Bachofen hat ferner unbedingt recht, wenn er durchweg behauptet, der Übergang von dem, was er "Hetärismus" oder "Sumpfzeugung" nennt, zur Einzelehe sei zustande gekommen wesentlich durch die Frauen.
  en: Bachofen, furthermore, is perfectly right in contending that the transition from what he calls "hetaerism" or "incestuous generation" to monogamy was brought about mainly by women.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: II.51.2
  kind: p
  original: Je mehr mit der Entwicklung der ökonomischen Lebensbedingungen, also mit der Untergrabung des alten Kommunismus und mit der wachsenden Dichtigkeit der Bevölkerung, die altherkömmlichen Geschlechtsverhältnisse ihren waldursprünglich-naiven Charakter einbüßten, um so mehr mußten sie den Frauen erniedrigend und drückend erscheinen; um so dringender mußten sie das Recht auf Keuschheit, auf zeitweilige oder dauernde Ehe mit nur einem Mann, als eine Erlösung herbeiwünschen.
  en: The more in the course of economic development, undermining the old communism and increasing the density of population, the traditional sexual relations lost their innocent character suited to the primitive forest, the more debasing and oppressive they naturally appeared to women; and the more they consequently longed for relief by the right of chastity, of temporary or permanent marriage with one man.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: II.51.3
  kind: p
  original: Von den Männern konnte dieser Fortschritt ohnehin schon deshalb nicht ausgehn, weil es ihnen überhaupt nie, auch bis heute nicht, eingefallen ist, auf die Annehmlichkeiten der tatsächlichen Gruppenehe zu verzichten.
  en: This progress could not be due to men for the simple reason that they never, even to this day, had the least intention of renouncing the pleasures of actual group marriage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: II.51.4
  kind: p
  original: Erst nachdem durch die Frauen der Übergang zur Paarungsehe gemacht, konnten die Männer die strikte Monogamie einführen - freilich nur für die Frauen.
  en: Not until the women had accomplished the transition to the pairing family could the men introduce strict monogamy--true, only for women.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: II.52.1
  kind: p
  original: Die Paarungsfamilie entsprang an der Grenze zwischen Wildheit und Barbarei, meist schon auf der Oberstufe der Wildheit, hier und da erst auf der Unterstufe der Barbarei.
  en: The pairing family arose on the boundary line between savagery and barbarism, generally in the higher stage of savagery, here and there in the lower stage of barbarism.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: II.52.2
  kind: p
  original: Sie ist die charakteristische Familienform für die Barbarei, wie die Gruppenehe für die Wildheit und die Monogamie für die Zivilisation.
  en: It is the form of the family characteristic for barbarism, as group marriage is for savagery and monogamy for civilization.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: II.52.3
  kind: p
  original: Um sie zur festen Monogamie weiterzuentwickeln, bedurfte es andrer Ursachen als derjenigen, die wir bisher wirkend fanden.
  en: In order to develop it into established monogamy, other causes than those active hitherto were required.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: II.52.4
  kind: p
  original: 'Die Gruppe war in der Paarung bereits auf ihre letzte Einheit, ihr zweiatomiges Molekül, herabgebracht: auf einen Mann und eine Frau.'
  en: 'In the pairing family the group was already reduced to its last unit, its biatomic molecule: one man and one woman.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: II.52.5
  kind: p
  original: Die Naturzüchtung hatte in der immer weiter geführten Ausschließung von der Ehegemeinschaft ihr Werk vollbracht; in dieser Richtung blieb nichts mehr für sie zu tun.
  en: Natural selection, had accomplished its purpose by a continually increasing restriction of sexual intercourse. Nothing remained to be done in this direction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.52.6
  kind: p
  original: Kamen also nicht neue, gesellschaftliche Triebkräfte in Wirksamkeit, so war kein Grund vorhanden, warum aus der Paarung eine neue Familienform hervorgehn sollte.
  en: Unless new social forces became active, there was no reason why a new form of the family should develop out of the pairing family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: II.52.7
  kind: p
  original: Aber diese Triebkräfte traten in Wirksamkeit.
  en: But these forces did become active.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '57'
- id: II.53.1
  kind: p
  original: Wir verlassen jetzt Amerika, den klassischen Boden der Paarungsfamilie.
  en: We now leave America, the classic soil of the pairing family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: II.53.2
  kind: p
  original: Kein Anzeichen läßt schließen, daß dort eine höhere Familienform sich entwickelt, daß dort vor der Entdeckung und Eroberung jemals irgendwo feste Monogamie bestanden habe.
  en: No sign permits the conclusion that a higher form of the family was developed here, that any established form of monogamy ever existed anywhere in the New World before the discovery and conquest.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: II.53.3
  kind: p
  original: Anders in der alten Welt.
  en: Not so in the Old World.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: II.54.1
  kind: p
  original: Hier hatte die Zähmung der Haustiere und die Züchtung von Herden eine bisher ungeahnte Quelle des Reichtums entwickelt und ganz neue gesellschaftliche Verhältnisse geschaffen.
  en: In the latter, the domestication of animals and the breeding of flocks had developed a hitherto unknown source of wealth and created entirely new social conditions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: II.54.2
  kind: p
  original: 'Bis auf die Unterstufe der Barbarei hatte der ständige Reichtum bestanden fast nur in dem Haus, der Kleidung, rohem Schmuck und den Werkzeugen zur Erringung und Bereitung der Nahrung: Boot, Waffen, Hausrat einfachster Art.'
  en: 'Up to the lower stage of barbarism, fixed wealth was almost exclusively represented by houses, clothing, rough ornaments and the tools for obtaining and preparing food: boats, weapons and household articles of the simplest kind.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: II.54.3
  kind: p
  original: Die Nahrung mußte Tag um Tag neu errungen werden.
  en: Nourishment had to be secured afresh day by day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: II.54.4
  kind: p
  original: Jetzt, mit den Herden der Pferde, Kamele, Esel, Rinder, Schafe, Ziegen und Schweine hatten die vordringenden Hirtenvölker - die Arier im indischen Fünfstromland und Gangesgebiet wie in den damals noch weit wasserreicheren Steppen am Oxus und Jaxartes, die Semiten am Euphrat und Tigris - einen Besitz erworben, der nur der Aufsicht und rohesten Pflege bedurfte, um sich in stets vermehrter Zahl fortzupflanzen und die reichlichste Nahrung an Milch und Fleisch zu liefern.
  en: But now, with their herds of horses, camels, donkeys, cattle, sheep, goats and hogs, the advancing nomadic nations--the Aryans in the Indian Punjab, in the region of the Ganges and the steppes of the Oxus and Jaxartes, then still more rich in water-veins than now; the Semites on the Euphrates and Tigris--had acquired possessions demanding only the most crude attention and care in order to propagate themselves in ever increasing numbers and yield the most abundant store of milk and meat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: II.54.5
  kind: p
  original: Alle früheren Mittel der Nahrungsbeschaffung traten nun in den Hintergrund; die Jagd, früher eine Notwendigkeit, wurde nun ein Luxus.
  en: All former means of obtaining food were now forced to the background. Hunting, once a necessity, now became a sport.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.55.1
  kind: p
  original: Wem gehörte aber dieser neue Reichtum?
  en: But who was the owner of this new wealth?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: II.55.2
  kind: p
  original: Unzweifelhaft ursprünglich der Gens.
  en: Doubtless it was originally the gens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: II.55.3
  kind: p
  original: Aber schon früh muß sich Privateigentum an den Herden entwickelt haben.
  en: However, private ownership of flocks must have had an early beginning.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: II.55.4
  kind: p
  original: Es ist schwer zu sagen, ob dem Verfasser des sog. ersten Buchs Mosis der Vater Abraham erschien als Besitzer seiner Herden kraft eignen Rechts als Vorstand einer Familiengemeinschaft oder kraft seiner Eigenschaft als tatsächlich erblicher Vorsteher einer Gens.
  en: It is difficult to say whether to the author of the so-called first book of Moses Father Abraham appeared as the owner of his flocks by virtue of his privilege as head of a communistic family or of his capacity as gentile chief by actual descent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: II.55.5
  kind: p
  original: Sicher ist nur, daß wir ihn uns nicht als Eigentümer im modernen Sinn vorstellen dürfen.
  en: 'So much is certain: we must not regard him as a proprietor in the modern sense of the word.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: II.55.6
  kind: p
  original: Und sicher ist ferner, daß wir an der Schwelle der beglaubigten Geschichte die Herden schon überall in Sondereigentum von Familienvorständen finden, ganz wie die Kunsterzeugnisse der Barbarei, Metallgerät, Luxusartikel und endlich das Menschenvieh - die Sklaven.
  en: It is furthermore certain that everywhere on the threshold of documentary history we find the flocks in the separate possession of chiefs of families, exactly like the productions of barbarian art, such as metal ware, articles of luxury and, finally, the human cattle--the slaves.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T12
    editions: '1884'
    reading: Privateigentum
    base_text: … schon überall in Sondereigentum ‸ von Familienvorständen finden, ganz …
  mew_page: '58'
- id: II.56.1
  kind: p
  original: Denn jetzt war auch die Sklaverei erfunden.
  en: For now slavery was also invented.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: II.56.2
  kind: p
  original: Dem Barbaren der Unterstufe war der Sklave wertlos.
  en: To the barbarian of the lower stage a slave was of no use.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: II.56.3
  kind: p
  original: Daher auch die amerikanischen Indianer mit den besiegten Feinden ganz anders verfuhren, als auf höherer Stufe geschah.
  en: The American Indians, therefore, treated their vanquished enemies in quite a different way from nations of a higher stage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
- id: II.56.4
  kind: p
  original: Die Männer wurden getötet oder aber in den Stamm der Sieger als Brüder aufgenommen; die Weiber wurden geheiratet oder sonst mit ihren überlebenden Kindern ebenfalls adoptiert.
  en: The men were tortured or adopted as brothers into the tribe of the victors. The women were married or likewise adopted with their surviving children.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '58'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.56.5
  kind: p
  original: Die menschliche Arbeitskraft liefert auf dieser Stufe noch keinen beachtenswerten Überschuß über ihre Unterhaltskosten.
  en: The human labor power at this stage does not yet produce a considerable amount over and above its cost of subsistence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 58-59
- id: II.56.6
  kind: p
  original: Mit der Einführung der Viehzucht, der Metallbearbeitung, der Weberei und endlich des Feldbaus wurde das anders.
  en: But the introduction of cattle raising, metal industry, weaving and finally agriculture wrought a change.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: II.56.7
  kind: p
  original: Wie die früher so leicht zu erlangenden Gattinnen jetzt einen Tauschwert bekommen hatten und gekauft wurden, so geschah es mit den Arbeitskräften, besonders seitdem die Herden endgültig in Familienbesitz übergegangen waren.
  en: Just as the once easily obtainable wives now had an exchange value and were bought, so labor power was now procured, especially since the flocks had definitely become private property.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T13
    editions: '1884'
    reading: 'zahlreichen Gattinnen jetzt einen Wert (statt: leicht zu erlangenden Gattinnen jetzt einen Tauschwert)'
    base_text: … Gattinnen jetzt einen Tauschwert ‸ bekommen hatten und gekauft …
  - ref: T14
    editions: '1884'
    reading: Privatbesitz
    base_text: … Herden endgültig in Familienbesitz ‸ übergegangen waren. …
  mew_page: '59'
- id: II.56.8
  kind: p
  original: Die Familie vermehrte sich nicht ebenso rasch wie das Vieh.
  en: The family did not increase as rapidly as the cattle.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: II.56.9
  kind: p
  original: Mehr Leute wurden erfordert, es zu beaufsichtigen; dazu ließ sich der kriegsgefangne Feind benutzen, der sich außerdem ebensogut fortzüchten ließ wie das Vieh selbst.
  en: More people were needed for superintending; for this purpose the captured enemy was available and, besides, he could be increased by breeding like the cattle.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: II.57.1
  kind: p
  original: Solche Reichtümer, sobald sie einmal in den Privatbesitz von Familien übergegangen und dort rasch vermehrt, gaben der auf Paarungsehe und mutterrechtliche Gens gegründeten Gesellschaft einen mächtigen Stoß.
  en: Such riches, once they had become the private property of certain families and augmented rapidly, gave a powerful impulse to society founded on the pairing family and the maternal gens.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T15
    editions: '1884'
    reading: 'fehlt: von Familien'
    base_text: … den Privatbesitz von Familien ‸ übergegangen und dort rasch …
  mew_page: '59'
- id: II.57.2
  kind: p
  original: Die Paarungsehe hatte ein neues Element in die Familie eingeführt.
  en: The pairing family had introduced a new element.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: II.57.3
  kind: p
  original: Neben die leibliche Mutter hatte sie den beglaubigten leiblichen Vater gestellt, der noch dazu wahrscheinlich besser beglaubigt war als gar manche "Väter" heutzutage.
  en: By the side of the natural mother it had placed the authentic natural father who probably was better authenticated than many a "father" of our day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: II.57.4
  kind: p
  original: Nach der damaligen Arbeitsteilung in der Familie fiel dem Mann die Beschaffung der Nahrung und der hiezu nötigen Arbeitsmittel, also auch das Eigentum an diesen letzteren zu; er nahm sie mit, im Fall der Scheidung, wie die Frau ihren Hausrat behielt.
  en: According to the division of labor in those times, the task of obtaining food and the tools necessary for this purpose fell to the share of the man; hence he owned the latter and kept them in case of a separation, as the women did the household goods.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: II.57.5
  kind: p
  original: Nach dem Brauch der damaligen Gesellschaft also war der Mann auch Eigentümer der neuen Nahrungsquelle, des Viehs, und später des neuen Arbeitsmittels, der Sklaven.
  en: According to the social custom of that time, the man was also the owner of the new source of existence, the cattle, and later on of the new labor power, the slaves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: II.57.6
  kind: p
  original: Nach dem Brauch derselben Gesellschaft aber konnten seine Kinder nicht von ihm erben, denn damit stand es folgendermaßen.
  en: 'But according to the same custom, his children could not inherit his property, for the following reasons: By maternal law, i. e., while descent was traced only along the female line, and by the original custom of inheriting in the gens, the gentile relatives inherited the property of their deceased gentile relative.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.58.1
  kind: p
  original: Nach Mutterrecht, also solange Abstammung nur in weiblicher Linie gerechnet wurde, und nach dem ursprünglichen Erbgebrauch in der Gens erbten anfänglich die Gentilverwandten von ihrem verstorbnen Gentilgenossen.
  en: ''
  joined_to: II.57.6
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '59'
- id: II.58.2
  kind: p
  original: Das Vermögen mußte in der Gens bleiben.
  en: The wealth had to remain in the gens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: II.58.3
  kind: p
  original: Bei der Unbedeutendheit der Gegenstände mag es von jeher in der Praxis an die nächsten Gentilverwandten, also an die Blutsverwandten mütterlicher Seite, übergegangen sein.
  en: In view of the insignificance of the objects, the property may have gone in practice to the closest gentile relatives, i. e., the consanguine relatives on the mother's side.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: II.58.4
  kind: p
  original: Die Kinder des verstorbnen Mannes aber gehörten nicht seiner Gens an, sondern der ihrer Mutter; sie erbten, anfangs mit den übrigen Blutsverwandten der Mutter, später vielleicht in erster Linie, von dieser; aber von ihrem Vater konnten sie nicht erben, weil sie nicht zu seiner Gens gehörten, sein Vermögen aber in dieser bleiben mußte.
  en: The children of the dead man, however, did not belong to his gens, but to that of their mother. They inherited first together with the other consanguine relatives of the mother, later on perhaps in preference to the others. But they could not inherit from their father, because they did not belong to his gens, where his property had to remain.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.58.5
  kind: p
  original: Bei dem Tode des Herdenbesitzers wären also seine Herden übergegangen zunächst an seine Brüder und Schwestern und an die Kinder seiner Schwestern oder an die Nachkommen der Schwestern seiner Mutter.
  en: Hence, after the death of a cattle owner, the cattle would fall to his brothers, sisters and the children of his sisters, or to the offspring of the sisters of his mother.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: II.58.6
  kind: p
  original: Seine eignen Kinder aber waren enterbt.
  en: His own children were disinherited.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '59'
- id: II.59.1
  kind: p
  original: In dem Verhältnis also, wie die Reichtümer sich mehrten, gaben sie einerseits dem Mann eine wichtigere Stellung in der Familie als der Frau und erzeugten andrerseits den Antrieb, diese verstärkte Stellung zu benutzen, um die hergebrachte Erbfolge zugunsten der Kinder umzustoßen.
  en: In the measure of the increasing wealth man's position in the family became superior to that of woman, and the desire arose to use this fortified position for the purpose of overthrowing the traditional law of inheritance in favor of his children.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: II.59.2
  kind: p
  original: Dies ging aber nicht, solange die Abstammung nach Mutterrecht galt.
  en: But this was not feasible as long as maternal law was valid.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: II.59.3
  kind: p
  original: Diese also mußte umgestoßen werden, und sie wurde umgestoßen.
  en: This law had to be abolished, and it was.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: II.59.4
  kind: p
  original: Es war dies gar nicht so schwer, wie es uns heute erscheint.
  en: This was by no means as difficult as it appears to us to-day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: II.59.5
  kind: p
  original: Denn diese Revolution - eine der einschneidendsten, die die Menschen erlebt haben - brauchte nicht ein einziges der lebenden Mitglieder einer Gens zu berühren.
  en: For this revolution--one of the most radical ever experienced by humanity--did not have to touch a single living member of the gens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: II.59.6
  kind: p
  original: Alle ihre Angehörigen konnten nach wie vor bleiben, was sie gewesen.
  en: All its members could remain what they had always been.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: II.59.7
  kind: p
  original: Der einfache Beschluß genügte, daß in Zukunft die Nachkommen der männlichen Genossen in der Gens bleiben, die der weiblichen aber ausgeschlossen sein sollten, indem sie in die Gens ihres Vaters übergingen.
  en: The simple resolution was sufficient, that henceforth the offspring of the male members should belong to the gens, while the children of the female members should be excluded by transferring them to the gens of their father.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: II.59.8
  kind: p
  original: Damit war die Abstammungsrechnung in weiblicher Linie und das mütterliche Erbrecht umgestoßen, männliche Abstammungslinie und väterliches Erbrecht eingesetzt.
  en: This abolished the tracing of descent by female lineage and the maternal right of inheritance, and instituted descent by male lineage and the paternal right of inheritance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: II.59.9
  kind: p
  original: Wie sich diese Revolution bei den Kulturvölkern gemacht hat, und wann, darüber wissen wir nichts.
  en: How and when this revolution was accomplished by the nations of the earth, we do not know.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: II.59.10
  kind: p
  original: Sie fällt ganz in die vorgeschichtliche Zeit.
  en: It belongs entirely to prehistoric times.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: II.59.11
  kind: p
  original: Daß sie sich aber gemacht, ist mehr als nötig erwiesen durch die namentlich von Bachofen gesammelten reichlichen Spuren von Mutterrecht; wie leicht sie sich vollzieht, sehn wir an einer ganzen Reihe von Indianerstämmen, wo sie erst neuerdings gemacht worden ist und noch gemacht wird unter dem Einfluß teils wachsenden Reichtums und veränderter Lebensweise (Versetzung aus den Wäldern in die Prärie), teils moralischer Einwirkungen der Zivilisation und der Missionare.
  en: That it was accomplished is proven more than satisfactorily by the copious traces of maternal law collected especially by Bachofen. How easily it is accomplished we may observe in a whole series of Indian tribes, that recently passed through or are still engaged in it, partly under the influence of increasing wealth and changed modes of living (transfer from forests to the prairie), partly through the moral pressure of civilization and missionaries.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.59.12
  kind: p
  original: Von acht Missouristämmen haben sechs männliche, aber zwei noch weibliche Abstammungslinie und Erbfolge.
  en: Six out of eight Missouri tribes have male descent and inheritance, while only two retain female descent and inheritance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: II.59.13
  kind: p
  original: Bei den Shawnees, Miamies und Delawares ist die Sitte eingerissen, die Kinder durch einen der Gens des Vaters gehörigen Gentilnamen in diese zu versetzen, damit sie vom Vater erben können.
  en: The Shawnees, Miamis and Delawares follow the custom of placing their children into the male gens by giving them a gentile name belonging to the father's gens, so that they may be entitled to inherit.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: II.59.14
  kind: p
  original: '"Eingeborene Kasuisterei des Menschen, die Dinge zu ändern, indem man ihre Namen ändert!'
  en: '"Innate casuistry of man, to change the objects by changing their names, and to find loopholes for breaking tradition inside of tradition where a direct interest was a sufficient motive." (Marx.)'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.59.15
  kind: p
  original: Und Schlupfwinkel zu finden, um innerhalb der Tradition die Tradition zu durchbrechen, wo ein direktes Interesse den hinreichenden Antrieb gab!" (Marx.)
  en: ''
  joined_to: II.59.14
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '60'
- id: II.59.16
  kind: p
  original: Dadurch entstand heillose Verwirrung, der nur abzuhelfen war, und teilweise auch abgeholfen wurde, durch Übergang zum Vaterrecht.
  en: This made confusion worse confounded, which could be and partially was remedied alone by paternal law.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: II.59.17
  kind: p
  original: '"Dies scheint überhaupt der natürlichste Übergang." (Marx.)'
  en: '"This seems to be the most natural transition." (Marx.)'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '60'
- id: II.59.18
  kind: p
  original: '- Was die vergleichenden Juristen uns zu sagen wissen über die Art und Weise, wie dieser Übergang sich bei den Kulturvölkern der alten Welt vollzog - freilich fast nur Hypothesen -, darüber vgl. M. Kowalewski, "Tableau des origines et de l''evolution de la famille et de la propriété", Stockholm 1890.'
  en: As to the opinion of the comparative jurists, how this transition took place among the civilized nations of the old world--although only in hypotheses--compare M. Kovalevsky, Tableau des origines et de l'evolution de la famille et de la propriete, Stockholm, 1890.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T16
    editions: '1884'
    reading: fehlt der letzte Satz
    base_text: … la propriété", Stockholm 1890 ‸ . …
  mew_page: '60'
- id: II.60.1
  kind: p
  original: Der Umsturz des Mutterrechts war die weltgeschichtliche Niederlage des weiblichen Geschlechts.
  en: The downfall of maternal law was the historic defeat of the female sex.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: II.60.2
  kind: p
  original: Der Mann ergriff das Steuer auch im Hause, die Frau wurde entwürdigt, geknechtet, Sklavin seiner Lust und bloßes Werkzeug der Kinderzeugung.
  en: The men seized the reins also in the house, the women were stripped of their dignity, enslaved, tools of men's lust and mere machines for the generation of children.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: II.60.3
  kind: p
  original: Diese erniedrigte Stellung der Frau, wie sie namentlich bei den Griechen der heroischen und noch mehr der klassischen Zeit offen hervortritt, ist allmählich beschönigt und verheuchelt, auch stellenweise in mildere Form gekleidet worden; beseitigt ist sie keineswegs.
  en: This degrading position of women, especially conspicuous among the Greeks of heroic and still more of classic times, was gradually glossed over and disguised or even clad in a milder form. But it is by no means obliterated.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.61.1
  kind: p
  original: Die erste Wirkung der nun begründeten Alleinherrschaft der Männer zeigt sich in der jetzt auftauchenden Zwischenform der patriarchalischen Familie.
  en: The first effect of the established supremacy of men became now visible in the reappearance of the intermediate form of the patriarchal family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: II.61.2
  kind: p
  original: Was sie hauptsächlich bezeichnet, ist nicht die Vielweiberei, wovon später, sondern "die Organisation einer Anzahl freier und unfreier Personen zu einer Familie unter der väterlichen Gewalt des Familienhaupts.
  en: Its most significant feature is not polygamy, of which more anon, but "the organization of a certain number of free and unfree persons into one family under the paternal authority of the head of the family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: II.61.3
  kind: p
  original: In der semitischen Form lebt dies Familienhaupt in Vielweiberei, die Unfreien haben Weib und Kinder, und der Zweck der ganzen Organisation ist die Wartung von Herden auf einem abgegrenzten Gebiet."
  en: In the Semitic form this head of the family lives in polygamy, the unfree members have wife and children, and the purpose of the whole organization is the tending of herds in a limited territory."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: II.62.1
  kind: p
  original: Das Wesentliche ist die Einverleibung von Unfreien und die väterliche Gewalt; daher ist der vollendete Typus dieser Familienform die römische Familie.
  en: The essential points are the assimilation of the unfree element and the paternal authority. Hence the ideal type of this form of the family is the Roman family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.62.2
  kind: p
  original: Das Wort familia bedeutet ursprünglich nicht das aus Sentimentalität und häuslichem Zwist zusammengesetzte Ideal des heutigen Philisters; es bezieht sich bei den Römern anfänglich gar nicht einmal auf das Ehepaar und dessen Kinder, sondern auf die Sklaven allein.
  en: The word familia did not originally signify the composite ideal of sentimentality and domestic strife in the present day philistine mind. Among the Romans it did not even apply in the beginning to the leading couple and its children, but to the slaves alone.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.62.3
  kind: p
  original: Famulus heißt ein Haussklave, und familia ist die Gesamtheit der einem Mann gehörenden Sklaven.
  en: Famulus means domestic slave, and familia is the aggregate number of slaves belonging to one man.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: II.62.4
  kind: p
  original: Noch zu Gajus Zeit wurde die familia, id est patrimonium (d.h. das Erbteil) testamentarisch vermacht.
  en: At the time of Gajus, the familia, id est patrimonium (i. e., paternal legacy), was still bequeathed by testament.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: II.62.5
  kind: p
  original: Der Ausdruck wurde von den Römern erfunden, um einen neuen gesellschaftlichen Organismus zu bezeichnen, dessen Haupt Weib und Kinder und eine Anzahl Sklaven unter römischer väterlicher Gewalt, mit dem Recht über Tod und Leben aller, unter sich hatte.
  en: The expression was invented by the Romans in order to designate a new social organism, the head of which had a wife, children and a number of slaves under his paternal authority and according to Roman law the right of life and death over all of them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: II.63.1
  kind: p
  original: '"Das Wort ist also nicht älter als das eisengepanzerte Familiensystem der latinischen Stämme, welches aufkam nach Einführung des Feldbaus und der gesetzlichen Sklaverei und nach der Trennung der arischen Italer von den Griechen."'
  en: '"The word is, therefore, not older than the ironclad family system of the Latin tribes, which arose after the introduction of agriculture and of lawful slavery, and after the separation of the Aryan Itali from the Greeks."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: II.64.1
  kind: p
  original: 'Marx setzt hinzu: "Die moderne Familie enthält im Keim nicht nur Sklaverei (servitus), sondern auch Leibeigenschaft, da sie von vornherein Beziehung hat auf Dienste für Ackerbau.'
  en: 'Marx adds: "The modern family contains the germ not only of slavery (servitus), but also of serfdom, because it has from the start a relation to agricultural service.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: II.64.2
  kind: p
  original: Sie enthält in Miniatur alle die Gegensätze in sich, die sich später breit entwickeln in der Gesellschaft und in ihrem Staat."
  en: It comprises in miniature all those contrasts that later on develop more broadly in society and the state."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: II.65.1
  kind: p
  original: Eine solche Familienform zeigt den Übergang der Paarungsehe in die Monogamie.
  en: Such a form of the family shows the transition from the pairing family to monogamy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '61'
- id: II.65.2
  kind: p
  original: 'Um die Treue der Frau, also die Vaterschaft der Kinder, sicherzustellen, wird die Frau der Gewalt des Mannes unbedingt überliefert: Wenn er sie tötet, so übt er nur sein Recht aus.'
  en: In order to secure the faithfulness of the wife, and hence the reliability of paternal lineage, the women are delivered absolutely into the power of the men; in killing his wife, the husband simply exercises his right.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T17
    editions: '1884'
    reading: 'fehlt der folgende Text bis zum Absatz: Ehe wir zu der mit dem Sturz... (S. 64)'
    base_text: … nur sein Recht aus. ‸  …
  mew_page: 61-62
- id: II.66.1
  kind: p
  original: Mit der patriarchalischen Familie betreten wir das Gebiet der geschriebnen Geschichte, und damit ein Gebiet, wo die vergleichende Rechtswissenschaft uns bedeutende Hülfe leisten kann.
  en: With the patriarchal family we enter the domain of written history, a field in which comparative law can render considerable assistance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: II.66.2
  kind: p
  original: Und in der Tat hat sie uns hier einen wesentlichen Fortschritt gebracht.
  en: And here it has brought about considerable progress indeed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: II.66.3
  kind: p
  original: Wir verdanken Maxim Kowalewski ("Tableau etc. de la famille et de la propriété", Stockholm 1890, p. 60-100) den Nachweis, daß die patriarchalische Hausgenossenschaft, wie wir sie heute noch bei Serben und Bulgaren unter dem Namen Zádruga (etwa Verfreundung zu übersetzen) oder Bratstvo (Brüderschaft), und in modifizierter Form bei orientalischen Völkern vorfinden, die Übergangsstufe gebildet hat zwischen der, aus der Gruppenehe entspringenden, mutterrechtlichen Familie und der Einzelfamilie der modernen Welt.
  en: We owe to Maxim Kovalevsky (Tableau etc. de la famille et de la propriete, Stockholm, 1890, p. 60-100) the proof, that the patriarchal household community, found to this day among Serbians and Bulgarians under the names of Zadruga (friendly bond) and Bratstvo (fraternity), and in a modified form among oriental nations, formed the stage of transition between the maternal family derived from group marriage and the monogamous family of the modern world.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: II.66.4
  kind: p
  original: Wenigstens für die Kulturvölker der alten Welt, für Arier und Semiten scheint dies erwiesen.
  en: This seems at least established for the historic nations of the old world, for Aryans and Semites.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: II.67.1
  kind: p
  original: Die südslawische Zádruga bietet das beste noch lebende Beispiel einer solchen Familiengememschaft.
  en: The Zadruga of southern Slavonia offers the best still existing illustration of such a family communism.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: II.67.2
  kind: p
  original: Sie umfaßt mehrere Generationen der Nachkommen eines Vaters nebst deren Frauen, die alle auf einem Hof zusammen wohnen, ihre Felder gemeinsam bebauen, aus gemeinsamem Vorrat sich nähren und kleiden und de n Überschuß des Ertrags gemeinsam besitzen.
  en: It comprises several generations of the father's descendants, together with their wives, all living together on the same farm, tilling their fields in common, living and clothing themselves from the same stock, and possessing collectively the surplus of their earnings.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: II.67.3
  kind: p
  original: Die Gemeinschaft steht unter oberster Verwaltung des Hausherrn (domaćin), der sie nach außen vertritt, kleinere Gegenstände veräußern darf, die Kasse führt und für dieselbe sowie für den regelmäßigen Geschäftsga n g verantwortlich ist.
  en: The community is managed by the master of the house (domacin), who acts as its representative, may sell inferior objects, has charge of the treasury and is responsible for it as well as for a proper business administration.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: II.67.4
  kind: p
  original: Er wird gewählt und braucht keineswegs der Älteste zu sein.
  en: He is chosen by vote and is not necessarily the oldest man.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: II.67.5
  kind: p
  original: Die Frauen und ihre Arbeiten stehn unter Leitung der Hausfrau (domaćica), die gewöhnlich die Frau des Domaćin ist.
  en: The women and their work are directed by the mistress of the house (domacica), who is generally the wife of the domacin.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: II.67.6
  kind: p
  original: Sie hat auch bei der Gattenwahl für die Mädchen eine wicht ige, oft die entscheidende Stimme.
  en: She also has an important, and often final, voice in choosing a husband for the girls.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: II.67.7
  kind: p
  original: Die oberste Macht aber ruht im Familienrat, der Versammlung aller erwachsenen Genossen, Frauen wie Männer.
  en: But the highest authority is vested in the family council, the assembly of all grown companions, male and female.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
- id: II.67.8
  kind: p
  original: Dieser Versammlung legt der Hausherr Rechenschaft ab; sie faßt die entscheidenden Beschlüsse, übt Gerichtsbarkeit über die Mitglieder, beschließt über Käufe und Verkäufe von einiger Bedeutung, namentlich von Grundbesitz usw.
  en: The domacin is responsible to this council. It takes all important resolutions, sits in judgment on the members of the household, decides the question of important purchases and sales, especially of land, etc.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.68.1
  kind: p
  original: Erst seit ungefähr zehn Jahren ist das Fortbestehn solcher großen Familiengenossenschaften auch in Rußland nachgewiesen; sie sind jetzt allgemein als ebensosehr in der russischen Volkssitte wurzelnd anerkannt wie die Obschtschina oder Dorfgemeinschaft.
  en: It is only about ten years since the existence of such family communism in the Russia of to-day was proven. At present it is generally acknowledged to be rooted in popular Russian custom quite as much as the obscina or village community.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '62'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.68.2
  kind: p
  original: Sie figurieren im ältesten russischen Gesetzbuch, der Prawda des Jaroslaw, unter demselben Namen (werwj) wie in den dalmatinischen Gesetzen, und lassen sich auch in polnischen und tschechischen Geschichtsquellen nachweisen.
  en: It is found in the oldest Russian code, the Pravda of Jaroslav, under the same name (vervj) as in the Dalmatian code, and may also be traced in Polish and Czech historical records.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 62-63
- id: II.69.1
  kind: p
  original: Auch bei den Deutschen ist nach Heusler ("Institutionen des deutschen Rechts") die wirtschaftliche Einheit ursprünglich nicht die Einzelfamilie im modernen Sinn, sondern die "Hausgenossenschaft", die aus mehreren Generationen beziehungsweise Einzelfamilien besteht und daneben oft genug Unfreie in sich begreift.
  en: Likewise among Germans, the economic unit according to Heussler (Institutions of German law) is not originally the single family, but the "collective household," comprising several generations or single families and, besides, often enough unfree individuals.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
- id: II.69.2
  kind: p
  original: Auch die römische Familie wird auf diesen Typus zurückgeführt, und die absolute Gewalt des Hausvaters, wie die Rechtlosigkeit der übrigen Familienglieder ihm gegenüber, wird demzufolge neuerdings stark bestritten.
  en: The Roman family is also traced to this type, and hence the absolute authority of the master of the house and the defenselessness of the other members in regard to him is strongly questioned of late.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
- id: II.69.3
  kind: p
  original: Bei den Kelten sollen ebenfalls in Irland ähnliche Familiengenossenschaften bestanden haben; in Frankreich erhielten sie sich im Nivernais unter dem Namen parçonneries bis auf die französische Revolution, und in der Franche Comté sind sie noch heute nicht ganz ausgestorben.
  en: Similar communities are furthermore said to have existed among the Celts of Ireland. In France they were preserved up to the time of the Revolution in Nivernais under the name of "parconneries," and in the Franche Comte they are not quite extinct yet.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.69.4
  kind: p
  original: In der Gegend von Louhans (Saône et Loire) sieht man große Bauernhäuser mit gemeinsamem, hohem, bis ans Dach reichendem Zentralsaal und ringsherum die Schlafkammern, zu denen man auf Treppen von sechs bis acht Stufen gelangt und worin mehrere Generationen derselben Familie wohnen.
  en: In the region of Louhans (Saone et Loire) we find large farmhouses with a high central hall for common use reaching up to the roof and surrounded by sleeping rooms accessible by the help of stairs with six to eight steps. Several generations of the same family live together in such a house.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.70.1
  kind: p
  original: In Indien ist die Hausgenossenschaft mit gemeinsamer Bodenbebauung bereits von Nearchos, zur Zeit Alexander des Großen, erwähnt und besteht in derselben Gegend, im Pandschab und ganzen Nordwesten des Landes noch heute.
  en: In India, the household community with collective agriculture is already mentioned by Nearchus at the time of Alexander the Great, and it exists to this day in the same region, in the Punjab and the whole Northwest of the country.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
- id: II.70.2
  kind: p
  original: Im Kaukasus hat Kowalewski selbst sie nachweisen können.
  en: In the Caucasus it was located by Kovalevski himself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
- id: II.70.3
  kind: p
  original: In Algerien besteht sie noch bei den Kabylen.
  en: In Algeria it is still found among the Kabyles.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
- id: II.70.4
  kind: p
  original: Selbst in Amerika soll sie vorgekommen sein, man will sie entdecken in den "Calpullis", die Zurita im alten Mexiko beschreibt; dagegen hat Cunow ("Ausland", 1890, Nr. 42-44) ziemlich klar nachgewiesen, daß in Peru zur Zeit der Eroberung eine Art Markverfassung (wobei die Mark sonderbarerweise Marca hieß) mit periodischer Aufteilung des bebauten Landes, also Einzelbebauung, bestand.
  en: Even in America it is said to have existed. It is supposed to be identical with the "Calpullis" described by Zurita in ancient Mexico. In Peru, however, Cunow (Ausland, 1890, No. 42-44) has demonstrated rather clearly that at the time of the conquest a sort of a constitution in marks (called curiously enough marca), with a periodical allotment of arable soil, and consequently individual tillage, was in existence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.71.1
  kind: p
  original: Jedenfalls erhält jetzt die patriarchalische Hausgenossenschaft mit gemeinsamem Grundbesitz und gemeinsamer Bebauung eine ganz andre Bedeutung als bisher.
  en: At any rate, the patriarchal household community with collective tillage and ownership of land now assumes an entirely different meaning than heretofore.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
- id: II.71.2
  kind: p
  original: Wir können nicht länger zweifeln an der wichtigen Übergangsrolle, die sie bei den Kulturvölkern und manchen andern Völkern der alten Welt zwischen der mutterrechtlichen und der Einzelfamilie gespielt hat.
  en: We can no longer doubt that it played an important role among the civilized and some other nations of the old world in the transition from the maternal to the single family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
- id: II.71.3
  kind: p
  original: Weiter unten kommen wir zurück auf die von Kowalewski ferner gezogne Schlußfolge, daß sie ebenfalls die Übergangsstufe war, aus der sich die Dorf- oder Markgemeinde mit Einzelbebauung und erst periodischer, dann endgültiger Aufteilung von Acker- und Wiesenland entwickelt hat.
  en: Later on we shall return to Kovaleski's further conclusion that it was also the stage of transition from which developed the village or mark community with individual tillage and first periodical, then permanent allotment of arable and pasture lands.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '63'
- id: II.72.1
  kind: p
  original: In Beziehung auf das Familienleben innerhalb dieser Hausgenossenschaften ist zu bemerken, daß wenigstens in Rußland der Hausvater im Rufe steht, seine Stellung gegenüber den jüngeren Frauen der Genossenschaft, speziell den Schwiegertöchtern, stark zu mißbrauchen und sich oft aus ihnen einen Harem zu bilden; worüber die russischen Volkslieder ziemlich beredt sind.
  en: In regard to the family life within these household communities it must be remarked that at least in Russia the master of the house has the reputation of strongly abusing his position against the younger women of the community, especially his daughters-in-law, and of transforming them into a harem for himself. Russian popular songs are very eloquent on this point.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.73.1
  kind: p
  original: Ehe wir zu der mit dem Sturz des Mutterrechtes sich rasch entwickelnden Monogamie übergehn, noch ein paar Worte über Vielweiberei und Vielmännerei.
  en: Before taking up monogamy, which rapidly developed after the downfall of maternal law, let me say a few words about polygamy and polyandry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: II.73.2
  kind: p
  original: Beide Eheformen können nur Ausnahmen sein, sozusagen geschichtliche Luxusprodukte, es sei denn, sie kämen in einem Lande nebeneinander vor, was bekanntlich nicht der Fall ist.
  en: Both forms of the family can only be exceptions, historical products of luxury so to speak, unless they could be found side by side in the same country, which is apparently not the case.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: II.73.3
  kind: p
  original: Da also die von der Vielweiberei ausgeschlossenen Männer sich nicht bei den von der Vielmännerei übriggebliebnen Weibern trösten können, die Anzahl von Männern und Weibern aber ohne Rücksicht auf soziale Institutionen bisher ziemlich gleich war, ist die Erhebung der einen wie der andern dieser Eheformen zur allgemein geltenden von selbst ausgeschlossen.
  en: As the men excluded from polygamy cannot find consolation in the women left over by polyandry, the number of men and women being hitherto approximately equal without regard to social institutions, it becomes of itself impossible to confer on any one of these two forms the distinction of general preference.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: II.73.4
  kind: p
  original: In der Tat war die Vielweiberei eines Mannes offenbar Produkt der Sklaverei und beschränkt auf einzelne Ausnahmestellungen.
  en: Indeed, the polygamy of one man was evidently the product of slavery, confined to certain exceptional positions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: II.73.5
  kind: p
  original: In der semitisch-patriarchalischen Familie lebt nur der Patriarch selbst, und höchstens noch ein paar seiner Söhne, in Vielweiberei, die übrigen müssen sich mit einer Frau begnügen.
  en: In the Semitic patriarchal family, only the patriarch himself, or at best a few of his sons, practice polygamy, the others must be satisfied with one wife.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: II.73.6
  kind: p
  original: So ist es noch heute im ganzen Orient; die Vielweiberei ist ein Privilegium der Reichen und Vornehmen und rekrutiert sich hauptsächlich durch Kauf von Sklavinnen; die Masse des Volks lebt in Monogamie.
  en: This is the case to-day in the whole Orient. Polygamy is a privilege of the wealthy and distinguished, and is mainly realized by purchase of female slaves. The mass of the people live in monogamy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.73.7
  kind: p
  original: Eine ebensolche Ausnahme ist die Vielmännerei in Indien und Tibet, deren sicher nicht uninteressanter Ursprung aus der Gruppenehe noch näher zu untersuchen ist.
  en: Polyandry in India and Thibet is likewise an exception. Its surely not uninteresting origin from group marriage requires still closer investigation.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T18
    editions: '1884'
    reading: Punaluafamilie
    base_text: … Ursprung aus der Gruppenehe ‸ noch näher zu untersuchen …
  mew_page: '64'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.73.8
  kind: p
  original: In ihrer Praxis scheint sie übrigens viel kulanter als die eifersüchtige Haremswirtschaft der Muhamedaner.
  en: In its practice it seems, by the way, much more tolerant than the jealous Harem establishment of the Mohammedans.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: II.73.9
  kind: p
  original: Wenigstens haben bei den Nairs in Indien je drei, vier oder mehr Männer zwar eine gemeinsame Frau; aber jeder von ihnen kann daneben mit drei oder mehr andern Männern eine zweite Frau in Gemeinschaft haben, und so eine dritte, vierte usw. Es ist ein Wunder, daß MacLennan in diesen Eheklubs, in deren mehreren man Mitglied sein kann und die er selbst beschreibt, nicht die neue Klasse der Klubehe entdeckt hat.
  en: At least among the Nairs of India, three, four or more men have indeed one woman in common; but every one of them may have a second woman in common with three or more other men; and in the same way a third, fourth, etc. It is strange that McLennan did not discover the new class of "club marriage" in these marital clubs, in several of which one may be a member and which he himself describes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: II.73.10
  kind: p
  original: Diese Eheklub-Wirtschaft ist übrigens keineswegs wirkliche Vielmännerei; sie ist im Gegenteil, wie schon Giraud-Teulon bemerkt, eine spezialisierte Form der Gruppenehe; die Männer leben in Vielweiberei, die Weiber in Vielmännerei.
  en: This marriage club business is, however, by no means actual polyandry. It is on the contrary, as Giraud-Teulon already remarks, a specialized form of group marriage. The men live in polygamy, the women in polyandry.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T19
    editions: '1884'
    reading: fehlt der letzte Satz
    base_text: … die Weiber in Vielmännerei. ‸  …
  mew_page: '64'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.74.1
  kind: p
  original: 4. Die monogame Familie.
  en: 4. THE MONOGAMOUS FAMILY.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '64'
- id: II.74.2
  kind: p
  original: Sie entsteht aus der Paarungsfamilie, wie gezeigt, im Grenzzeitalter zwischen der mittleren und oberen Stufe der Barbarei; ihr endgültiger Sieg ist eins der Kennzeichen der beginnenden Zivilisation.
  en: It develops from the pairing family, as we have already shown, during the time of transition from the middle to the higher stage of barbarism. Its final victory is one of the signs of beginning civilization.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 64-65
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.74.3
  kind: p
  original: Sie ist gegründet auf die Herrschaft des Mannes, mit dem ausdrücklichen Zweck der Erzeugung von Kindern mit unbestrittener Vaterschaft, und diese Vaterschaft wird erfordert, weil diese Kinder dereinst als Leibeserben in das väterliche Vermögen eintreten sollen.
  en: It is founded on male supremacy for the pronounced purpose of breeding children of indisputable paternal lineage. The latter is required, because these children shall later on inherit the fortune of their father.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.74.4
  kind: p
  original: Sie unterscheidet sich von der Paarungsehe durch weit größere Festigkeit des Ehebandes, das nun nicht mehr nach beiderseitigem Gefallen lösbar ist.
  en: The monogamous family is distinguished from the pairing family by the far greater durability of wedlock, which can no longer be dissolved at the pleasure of either party.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: II.74.5
  kind: p
  original: Es ist jetzt in der Regel nur noch der Mann, der es lösen und seine Frau verstoßen kann.
  en: As a rule, it is only the man who can still dissolve it and cast off his wife.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: II.74.6
  kind: p
  original: Das Recht der ehelichen Untreue bleibt ihm auch jetzt wenigstens noch durch die Sitte gewährleistet (der Code Napoleon schreibt es dem Mann ausdrücklich zu, solange er nicht die Beischläferin ins eheliche Haus bringt) und wird mit steigender gesellschaftlicher Entwicklung immer mehr ausgeübt; erinnert sich die Frau der alten geschlechtlichen Praxis und will sie erneuern, so wird sie strenger bestraft als je vorher.
  en: The privilege of conjugal faithlessness remains sanctioned for men at least by custom (the Code Napoleon concedes it directly to them, as long as they do not bring their concubines into the houses of their wives). This privilege is more and more enjoyed with the increasing development of society. If the woman remembers the ancient sexual practices and attempts to revive them, she is punished more severely than ever.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.75.1
  kind: p
  original: In ihrer ganzen Härte tritt uns die neue Familienform entgegen bei den Griechen.
  en: The whole severity of this new form of the family confronts us among the Greeks.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: II.75.2
  kind: p
  original: Während, wie Marx bemerkt, die Stellung der Göttinnen in der Mythologie uns eine frühere Periode vorführt, wo die Frauen noch eine freiere, geachtetere Stellung hatten, finden wir zur Heroenzeit die Frau bereits erniedrigt durch die Vorherrschaft des Mannes und die Konkurrenz von Sklavinnen.
  en: While, as Marx observes, the position of the female gods in mythology shows an earlier period, when women still occupied a freer and more respected plane, we find woman already degraded by the supremacy of man and the competition of slaves during the time of the heroes.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T20
    editions: '1884'
    reading: 'Der folgende Text bis zu den Worten: Aber trotz aller Abschließung und Bewachung... (S. 67) ist die von Engels 1892 erweiterte Fassung. Er lautete 1884: in einer halbgefänglichen Abgeschlossenheit, um die richtige Vaterschaft der Kinder sicherzustellen. Der Mann dagegen vergnügt sich mit kriegsgefangnen Sklavinnen, seinen Zeltgenossinnen im Kriege. Kaum besser in der klassischen Periode. Man kann in Beckers "Charikles" des breiteren nachlesen, wie die Griechen ihre Frauen behandelten. Wenn nicht gerade eingeschlossen, so doch abgeschlossen von der Welt, waren sie die obersten Hausmägde ihrer Männer geworden, beschränkt auf den Verkehr vornehmlich der übrigen Hausmägde. Die Mädchen wurden direkt eingeschlossen, die Frauen gingen nur aus in Begleitung der Sklavinnen. Kam Männerbesuch, so zog sich die Frau in ihr Gemach zurück.'
    base_text: … zur Heroenzeit die Frau ‸ bereits erniedrigt durch die …
  mew_page: '65'
- id: II.75.3
  kind: p
  original: Man lese in der "Odyssee", wie Telemachos seine Mutter ab- und zur Ruhe verweist.
  en: Read in the Odysseia how Telemachos reproves and silences his mother.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: II.75.4
  kind: p
  original: Die erbeuteten jungen Weiber verfallen bei Homer der Sinnenlust der Sieger; die Befehlshaber wählen sich der Reihe und Rangordnung nach die schönsten aus; die ganze "Ilias" dreht sich bekanntlich um den Streit zwischen Achilleus und Agamemnon wegen einer solchen Sklavin.
  en: The captured young women, according to Homer, are delivered to the sensual lust of the victors. The leaders in the order of their rank select the most beautiful captives. The whole Iliad notoriously revolves around the quarrel between Achilles and Agamemnon about such a captured woman.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.75.5
  kind: p
  original: Bei jedem homerischen Helden von Bedeutung wird das kriegsgefangene Mädchen erwähnt, womit er Zelt und Bett teilt.
  en: In mentioning any hero of importance, the captured girl sharing his tent and bed is never omitted.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '65'
- id: II.75.6
  kind: p
  original: Diese Mädchen werden auch mit in die Heimat und ins eheliche Haus genommen, wie Kassandra von Agamemnon bei Äschylos; die mit solchen Sklavinnen erzeugten Söhne bekommen einen kleinen Anteil am väterlichen Erbe und gelten als Vollfreie; Teukros ist ein solcher unehelicher Sohn des Telamon und darf sich nach seinem Vater nennen.
  en: These girls are also taken into the hero's home country and his house, as Kassandra by Agamemnon in Aeschylos. Boys born by these female slaves receive a small share of the paternal heirloom and are regarded as free men. Teukros is such an illegitimate son and may use his father's name.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 65-66
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.75.7
  kind: p
  original: Von der Ehefrau wird erwartet, daß sie sich das alles gefallen läßt, selbst aber strenge Keuschheit und Gattentreue bewahrt.
  en: The wife is expected to put up with everything, while herself remaining chaste and faithful.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: II.75.8
  kind: p
  original: Die griechische Frau der Heroenzeit ist zwar geachteter als die der zivilisierten Periode, aber sie ist doch schließlich für den Mann nur die Mutter seiner ehelichen Erbkinder, seine oberste Hausverwalterin und die Vorsteherin der Sklavinnen, die er sich nach Belieben zu Konkubinen machen kann und auch macht.
  en: Although the Greek woman of heroic times is more highly respected than she of the civilized period, still she is for her husband only the mother of his legal heirs, his first housekeeper and the superintendent of the female slaves, whom he can and does make his concubines at will.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: II.75.9
  kind: p
  original: Es ist der Bestand der Sklaverei neben der Monogamie, das Dasein junger schöner Sklavinnen, die dem Mann gehören mit allem, was sie an sich haben, das der Monogamie von Anfang an ihren spezifischen Charakter aufdrückt, Monogamie zu sein nur für die Frau, nicht aber für den Mann.
  en: It is this practice of slavery by the side of monogamy, the existence of young and beautiful female slaves belonging without any restriction to their master, which from the very beginning gives to monogamy the specific character of being monogamy for women only, but not for men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: II.75.10
  kind: p
  original: Und diesen Charakter hat sie noch heute.
  en: And this character remains to this day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: II.76.1
  kind: p
  original: Für die späteren Griechen müssen wir unterscheiden zwischen Dorern und Ioniern.
  en: For the Greeks of later times we must make a distinction between Dorians and Ionians.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: II.76.2
  kind: p
  original: Die ersteren, deren klassisches Beispiel Sparta, haben in mancher Beziehung noch altertümlichere Eheverhältnisse, als selbst Homer sie aufzeigt.
  en: The former, with Sparta as their classic example, have in many respects still more antiquated marriage customs than even Homer illustrates.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: II.76.3
  kind: p
  original: In Sparta gilt eine nach den dortigen Anschauungen vom Staat modifizierte Paarungsehe, die noch manche Erinnerungen an die Gruppenehe aufweist.
  en: In Sparta existed a form of the pairing family modified by the contemporaneous ideas of the state and still recalling group marriage in many ways.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: II.76.4
  kind: p
  original: Kinderlose Ehen werden getrennt; der König Anaxandridas (um 560 vor unsrer Zeitrechnung) nahm zu seiner kinderlosen Frau eine zweite und führte zwei Haushaltungen; um dieselbe Zeit nahm der König Ariston zu zwei unfruchtbaren Frauen eine dritte, entließ aber dafür eine der ersteren.
  en: Sterile marriages were dissolved. King Anaxandridas (about 650 before Christ) took another wife besides his childless one and kept two households. About the same time King Ariston added another wife to two childless ones, one of which he dismissed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.76.5
  kind: p
  original: Andrerseits durften mehrere Brüder eine gemeinsame Frau haben, durfte der Freund, dem des Freundes Frau besser gefiel, sich mit diesem in sie teilen, und galt es für anständig, die Frau einem strammen "Hengst", wie Bismarck sagen würde, zur Verfügung zu stellen, selbst wenn dieser ein Nichtbürger war.
  en: Furthermore, several brothers could have one wife in common; a friend who liked his friend's wife better than his own could share her with him, and it was not considered indecent to place a wife at the disposal of a sturdy "stallion," as Bismarck would have said, even though he might not be a citizen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: II.76.6
  kind: p
  original: Aus einer Stelle bei Plutarch, wo eine Spartanerin den Liebhaber, der sie mit Anträgen verfolgte, an ihren Ehemann verwies, scheint - nach Schoemann - sogar eine noch größere Freiheit der Sitte hervorzugehn.
  en: A certain passage in Plutarch, where a Spartan matron refers a lover, who persists in making offers to her, to her husband, seems to indicate--according to Schoemann--even a still greater sexual freedom.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: II.76.7
  kind: p
  original: Wirklicher Ehebruch, Untreue der Frau hinter dem Rücken des Mannes, war daher auch unerhört.
  en: Also adultery, faithlessness of a wife behind her husband's back, was unheard of.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: II.76.8
  kind: p
  original: Andrerseits war die Haussklaverei in Sparta wenigstens in der besten Zeit unbekannt, die leibeignen Heloten wohnten gesondert auf den Gütern; die Versuchung für die Spartiaten, sich an deren Weiber zu halten, war daher geringer.
  en: On the other hand, domestic slavery in Sparta, at least during the best time, was unknown, and the serf Helots lived on separate country seats. Hence there was less temptation for a Spartan to hold intercourse with other women.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.76.9
  kind: p
  original: Daß unter allen diesen Umständen die Frauen in Sparta eine ganz anders geachtete Stellung einnahmen als bei den übrigen Griechen, konnte gar nicht anders sein.
  en: As was to be expected under such circumstances, the women of Sparta occupied a more highly respected place than those of other Greeks.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: II.76.10
  kind: p
  original: Die spartanischen Frauen und die Elite der athenischen Hetären sind die einzigen griechischen Frauen, von denen die Alten mit Respekt sprechen, deren Äußerungen aufzuzeichnen sie der Mühe wert halten.
  en: Spartan women and the Athenian hetaerae were the only Greek women of whom the ancients speak respectfully and whose remarks they considered worthy of notice.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '66'
- id: II.77.1
  kind: p
  original: Ganz anders bei den Ioniern, für die Athen kennzeichnend ist.
  en: Quite a different condition among Ionians, whose representative is Athens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: II.77.2
  kind: p
  original: Die Mädchen lernten nur Spinnen, Weben und Nähen, höchstens etwas Lesen und Schreiben.
  en: The girls learned only to spin, weave and sew, at the most a little reading and writing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: II.77.3
  kind: p
  original: Sie waren so gut wie eingeschlossen, gingen nur mit andern Weibern um.
  en: They were practically shut in and had only the company of other women.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: II.77.4
  kind: p
  original: Das Frauengemach war ein abgesondertes Stück des Hauses, im obern Stock oder im Hinterhaus, wohin Männer, namentlich Fremde, nicht leicht kamen und wohin sie sich bei Männerbesuch zurückzogen.
  en: The women's room formed a separate part of the house, on the upper floor or in a rear building, where men, especially strangers, did not easily enter and whither the women retreated when male visitors came.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: II.77.5
  kind: p
  original: Die Frauen gingen nicht aus ohne Begleitung einer Sklavin; zu Hause wurden sie förmlich bewacht; Aristophanes spricht von molossischen Hunden, die zur Abschreckung der Ehebrecher gehalten wurden, und in den asiatischen Städten wenigstens hielt man zur Frauenbewachung Eunuchen, die in Chios schon zu Herodots Zeit für den Handel fabriziert wurden, und nach Wachsmuth nicht allein für die Barbaren.
  en: The women did not leave the house without being accompanied by a female slave. At home they were strictly guarded. Aristophanes speaks of Molossian dogs that were kept to frighten off adulterers. And at least in the Asiatic towns, eunuchs were kept for guarding women. Even at Herodotus' time these eunuchs were manufactured for the trade, and according to Wachsmuth not for barbarians alone.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
  align: '1:5'
  review: true
  review_reason: 1 de sentence(s) matched to 5 en sentence(s); regrouped by the ingest (see REALIGN)
- id: II.77.6
  kind: p
  original: 'Bei Euripides wird die Frau als oikurema, als ein Ding zur Hausbesorgung (das Wort ist Neutrum) bezeichnet, und außer dem Geschäft der Kinderzeugung war sie dem Athener nichts andres: die oberste Hausmagd.'
  en: By Euripides woman is designated as "oikurema," a neuter signifying an object for housekeeping, and beside the business of breeding children she served to the Athenian for nothing but his chief house maid.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: II.77.7
  kind: p
  original: Der Mann hatte seine gymnastischen Übungen, seine öffentlichen Verhandlungen, wovon die Frau ausgeschlossen; er hatte außerdem oft noch Sklavinnen zu seiner Verfügung und zur Blütezeit Athens eine ausgedehnte und vom Staat wenigstens begünstigte Prostitution.
  en: The man had his gymnastic exercises, his public meetings, from which the women were excluded. Besides, the man very often had female slaves at his disposal, and during the most flourishing time of Athens an extensive prostitution which was at least patronized by the state.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.77.8
  kind: p
  original: Es war grade auf Grundlage dieser Prostitution, daß sich die einzigen griechischen Frauencharaktere entwickelten, die durch Geist und künstlerische Geschmacksbildung ebensosehr über das allgemeine Niveau der antiken Weiblichkeit hervorragen wie die Spartiatinnen durch den Charakter.
  en: It was precisely on the basis of this prostitution that the unique type of Ionic women developed; the hetaerae. They rose by esprit and artistic taste as far above the general level of antique womanhood as the Spartan women by their character.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.77.9
  kind: p
  original: Daß man aber erst Hetäre werden mußte, um Weib zu werden, das ist die strengste Verurteilung der athenischen Familie.
  en: But that it was necessary to become a hetaera before one could be a woman, constitutes the severest denunciation of the Athenian family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: II.78.1
  kind: p
  original: Diese athenische Familie wurde im Lauf der Zeit das Vorbild, wonach nicht nur die übrigen Ionier, sondern auch mehr und mehr die sämtlichen Griechen des Inlands und der Kolonien ihre häuslichen Verhältnisse modelten.
  en: The Athenian family became in the course of time the model after which not only the rest of the Ionians, but gradually all the Greeks at home and abroad molded their domestic relations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: II.78.2
  kind: p
  original: Aber trotz aller Abschließung und Bewachung fanden die Griechinnen oft genug Gelegenheit, ihre Männer zu täuschen.
  en: Nevertheless, in spite of all seclusion and watching, the Grecian ladies found sufficient opportunity for deceiving their husbands.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: II.78.3
  kind: p
  original: Diese, die sich geschämt hätten, irgendwelche Liebe für ihre Frauen zu verraten, amüsierten sich in allerlei Liebeshändeln mit Hetären; aber die Entwürdigung der Frauen rächte sich an den Männern und entwürdigte auch sie, bis sie versanken in die Widerwärtigkeit der Knabenliebe und ihre Götter entwürdigten wie sich selbst durch den Mythus von Ganymed.
  en: The latter who would have been ashamed of betraying any love for their wives, found recreation in all kinds of love affairs with hetaerae. But the degradation of the women was avenged in the men and degraded them also, until they sank into the abomination of boy-love. They degraded their gods and themselves by the myth of Ganymedes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.79.1
  kind: p
  original: Das war der Ursprung der Monogamie, soweit wir ihn beim zivilisiertesten und am höchsten entwickelten Volk des Altertums verfolgen können.
  en: Such was the origin of monogamy, as far as we may trace it in the most civilized and most highly developed nation of antiquity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: II.79.2
  kind: p
  original: Sie war keineswegs eine Frucht der individuellen Geschlechtsliebe, mit der sie absolut nichts zu schaffen hatte, da die Ehen nach wie vor Konvenienzehen blieben.
  en: It was by no means a fruit of individual sex-love and had nothing to do with the latter, for the marriages remained as conventional as ever.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '67'
- id: II.79.3
  kind: p
  original: Sie war die erste Familienform, die nicht auf natürliche, sondern auf ökonomische Bedingungen gegründet war, nämlich auf den Sieg des Privateigentums über das ursprüngliche naturwüchsige Gemeineigentum.
  en: 'Monogamy was the first form of the family not founded on natural, but on economic conditions, viz.: the victory of private property over primitive and natural collectivism.'
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T21
    editions: '1884'
    reading: gesellschaftliche
    base_text: … natürliche, sondern auf ökonomische ‸ Bedingungen gegründet war, nämlich …
  - ref: T22
    editions: '1884'
    reading: endet hier der Satz
    base_text: … ökonomische Bedingungen gegründet war ‸ , nämlich auf den …
  mew_page: 67-68
- id: II.79.4
  kind: p
  original: Herrschaft des Mannes in der Familie und Erzeugung von Kindern, die nur die seinigen sein konnten und die zu Erben seines Reichtums bestimmt waren - das allein waren die von den Griechen unumwunden ausgesprochenen ausschließlichen Zwecke der Einzelehe.
  en: Supremacy of the man in the family and generation of children that could be his offspring alone and were destined to be the heirs of his wealth--these were openly avowed by the Greeks to be the sole objects of monogamy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: II.79.5
  kind: p
  original: Im übrigen war sie ihnen eine Last, eine Pflicht gegen die Götter, den Staat und die eignen Vorfahren, die eben erfüllt werden mußte.
  en: For the rest it was a burden to them, a duty to the gods, the state and their own ancestors, a duty to be fulfilled and no more.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: II.79.6
  kind: p
  original: In Athen erzwang das Gesetz nicht nur die Verheiratung, sondern auch die Erfüllung eines Minimums der sogenannten ehelichen Pflichten von seiten des Mannes.
  en: In Athens the law enforced not only the marriage, but also the fulfillment of a minimum of the so-called matrimonial duties on the man's part.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T23
    editions: '1884'
    reading: fehlt der letzte Satz
    base_text: … von seiten des Mannes. ‸  …
  mew_page: '68'
- id: II.80.1
  kind: p
  original: So tritt die Einzelehe keineswegs ein in die Geschichte als die Versöhnung von Mann und Weib, noch viel weniger als ihre höchste Form.
  en: Monogamy, then, does by no means enter history as a reconciliation of man and wife and still less as the highest form of marriage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
