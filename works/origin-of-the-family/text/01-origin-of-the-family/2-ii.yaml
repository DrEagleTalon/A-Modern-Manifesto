  en: CHAPTER II. THE FAMILY.
  modern: ''
  modern_status: empty
  notes: ''
- id: II.1.1
  kind: p
  original: Morgan, der sein Leben großenteils unter den noch jetzt im Staat New York ansässigen Irokesen zugebracht und in einen ihrer Stamme (den der Senekas) adoptiert worden, fand unter ihnen ein Verwandtschaftssystem in Geltung, das mit ihren wirklichen Familienbeziehungen im Widerspruch stand.
  en: Morgan, who spent the greater part of his life among the Iroquois in the State of New York and who had been adopted into one of their tribes, the Senecas, found among them a system of relationship that was in contradiction with their actual family relations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
- id: II.1.2
  kind: p
  original: Bei ihnen herrschte jene, beiderseits leicht lösliche Einzelehe, die Morgan als "Paarungsfamilie" bezeichnet.
  en: Among them existed what Morgan terms the syndyasmian or pairing family, a monogamous state easily dissolved by either side.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
- id: II.1.3
  kind: p
  original: Die Nachkommenschaft eines solchen Ehepaars war also vor aller Welt offenkundig und anerkannt; es konnte kein Zweifel sein, auf wen die Bezeichnungen Vater, Mutter, Sohn, Tochter, Bruder, Schwester anzuwenden seien.
  en: The offspring of such a couple was identified and acknowledged by all the world. There could be no doubt to whom to apply the terms father, mother, son, daughter, brother, sister.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.1.4
  kind: p
  original: Aber der tatsächliche Gebrauch dieser Ausdrücke widerspricht dem.
  en: But the actual use of these words was not in keeping with their fundamental meaning.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
- id: II.1.5
  kind: p
  original: Der Irokese nennt nicht nur seine eignen Kinder, sondern auch die seiner Brüder seine Söhne und Töchter; und sie nennen ihn Vater.
  en: For the Iroquois addresses as sons and daughters not only his own children, but also those of his brothers; and he is called father by all of them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
- id: II.1.6
  kind: p
  original: Die Kinder seiner Schwestern dagegen nennt er seine Neffen und Nichten, und sie ihn Onkel.
  en: But the children of his sisters he calls nephews and nieces, and they call him uncle.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
- id: II.1.7
  kind: p
  original: Umgekehrt nennt die Irokesin, neben ihren eignen Kindern, diejenigen ihrer Schwestern ihre Söhne und Töchter, und diese nennen sie Mutter.
  en: Vice versa, an Iroquois woman calls her own children as well as those of her sisters sons and daughters and is addressed as mother by them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
- id: II.1.8
  kind: p
  original: Die Kinder ihrer Brüder dagegen nennt sie ihre Neffen und Nichten, und sie heißt ihre Tante.
  en: But the children of her brothers are called nephews and nieces, and they call her aunt.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
- id: II.1.9
  kind: p
  original: Ebenso nennen die Kinder von Brüdern sich untereinander Brüder und Schwestern, desgleichen die Kinder von Schwestern.
  en: In the same way, the children of brothers call one another brothers and sisters, and so do the children of sisters.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
- id: II.1.10
  kind: p
  original: Die Kinder einer Frau und die ihres Bruders dagegen nennen sich gegenseitig Vettern und Kusinen.
  en: But the children of a sister call those of her brother cousins, and vice versa.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
- id: II.1.11
  kind: p
  original: Und dies sind nicht bloß leere Namen, sondern Ausdrücke tatsächlich geltender Anschauungen von Nähe und Entferntheit, Gleichheit und Ungleichheit der Blutsverwandtschaft; und diese Anschauungen dienen zur Grundlage eines vollständig ausgearbeiteten Verwandschaftssystems, das mehrere hundert verschiedne Verwandtschaftsbeziehungen eines einzelnen Individuums auszudrücken imstande ist.
  en: And these are not simply meaningless terms, but expressions of actually existing conceptions of proximity and remoteness, equality or inequality of consanguinity. These conceptions serve as the fundament of a perfectly elaborated system of relationship, capable of expressing several hundred different relations of a single individual.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '36'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: II.1.12
  kind: p
  original: Noch mehr.
  en: ''
  joined_to: II.1.11
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '36'
- id: II.1.13
  kind: p
  original: Dies System ist nicht nur in voller Geltung bei allen amerikanischen Indianern (bis jetzt ist keine Ausnahme gefunden), sondern es gilt auch fast unverändert bei den Ureinwohnern Indiens, bei den drawidischen Stämmen in Dekan und den Gaurastämmen in Hindustan.
  en: More still, this system is not only fully accepted by all American Indians--no exception has been found so far--but it is also in use with hardly any modifications among the original inhabitants of India, among the Dravidian tribes of the Dekan and the Gaura tribes of Hindostan.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 36-37
- id: II.1.14
  kind: p
  original: Die Verwandtschaftsausdrücke der südindischen Tamiler und der Seneka-Irokesen im Staate New York stimmen noch heute überein für mehr als zweihundert verschiedne Verwandtschaftsbeziehungen.
  en: The terms of relationship used by the Tamils of Southern India and by the Seneca-Iroquois of New York State are to this day identical for more than two hundred different family relations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: II.1.15
  kind: p
  original: Und auch bei diesen indischen Stämmen, wie bei allen amerikanischen Indianern, stehn die aus der geltenden Familienform entspringenden Verwandtschaftsbeziehungen im Widerspruch mit dem Verwandtschaftssystem.
  en: And among these East Indian tribes also, as among all American Indians, the relations arising out of the prevailing form of the family are not in keeping with the system of kinship.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: II.2.1
  kind: p
  original: Wie nun dies erklären?
  en: How can this be explained?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: II.2.2
  kind: p
  original: Bei der entscheidenden Rolle, die die Verwandtschaft bei allen wilden und barbarischen Völkern in der Gesellschaftsordnung spielt, kann man die Bedeutung dieses so weitverbreiteten Systems nicht mit Redensarten beseitigen.
  en: In view of the important role played by kinship in the social order of all the savage and barbarian races, the significance of such a widespread system cannot be obliterated by phrases.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: II.2.3
  kind: p
  original: Ein System, das in Amerika allgemein gilt, in Asien bei Völkern einer ganz verschiednen Race ebenfalls besteht, von dem mehr oder weniger abgeänderte Formen überall in Afrika und Australien sich in Menge vorfinden, ein solches System will geschichtlich erklärt sein, nicht weggeredet, wie dies z.B. McLennan versuchte.
  en: A system that is generally accepted in America, that also exists in Asia among people of entirely different races, that is frequently found in a more or less modified form all over Africa and Australia, such a system requires a historical explanation and cannot be talked down, as was attempted, e. g., by McLennan.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: II.2.4
  kind: p
  original: Die Bezeichnungen Vater, Kind, Bruder, Schwester sind keine bloßen Ehrentitel, sondern führen ganz bestimmte, sehr ernstliche gegenseitige Verpflichtungen mit sich, deren Gesamtheit einen wesentlichen Teil der Gesellschaftsverfassung jener Völker ausmacht.
  en: The terms father, child, brother, sister are more than mere honorary titles; they carry in their wake certain well-defined and very serious obligations, the aggregate of which comprises a very essential part of the social constitution of those nations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: II.2.5
  kind: p
  original: Und die Erklärung fand sich.
  en: And the explanation was found.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: II.2.6
  kind: p
  original: Auf den Sandwichinseln (Hawaii) bestand noch in der ersten Hälfte dieses Jahrhunderts eine Form der Familie, die genau solche Väter und Mütter, Brüder und Schwestern, Söhne und Töchter, Onkel und Tanten, Neffen und Nichten lieferte, wie das amerikanisch-altindische Verwandtschaftssystem sie fordert.
  en: In the Sandwich Islands (Hawaii) there existed up to the first half of the nineteenth century a family form producing just such fathers and mothers, brothers and sisters, uncles and aunts, nephews and nieces, as the old Indo-American system of kinship.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: II.2.7
  kind: p
  original: Aber merkwürdig!
  en: But how remarkable!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: II.2.8
  kind: p
  original: Das Verwandtschaftssystem, das in Hawaii in Geltung war, stimmte wieder nicht mit der dort tatsächlich bestehenden Familienform.
  en: The Hawaiian system of kinship again did not agree with the family form actually prevailing there.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: II.2.9
  kind: p
  original: Dort nämlich sind alle Geschwisterkinder, ohne Ausnahme, Brüder und Schwestern, und gelten für die gemeinsamen Kinder, nicht nur ihrer Mutter und deren Schwestern, oder ihres Vaters und dessen Brüder, sondern aller Geschwister ihrer Eltern ohne Unterschied.
  en: For there all the children of brothers and sisters, without any exception, are considered brothers and sisters, and regarded as the common children not only of their mother or her sisters, or their father and his brothers, but of all the brothers and sisters of their parents without distinction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: II.2.10
  kind: p
  original: Wenn also das amerikanische Verwandtschaftssystem eine in Amerika nicht mehr bestehende, primitivere Form der Familie voraussetzt, die wir in Hawaii wirklich noch vorfinden, so verweist uns anderseits das hawaiische Verwandtschaftssystem auf eine noch ursprünglichere Familienform, die wir zwar nirgends mehr als bestehend nachweisen können, die aber bestanden haben muß, weil sonst das entsprechende Verwandtschaftssystem nicht hätte entstehn können.
  en: While thus the American system of kinship presupposes an obsolete primitive form of the family, which is still actually existing in Hawaii, the Hawaiian system on the other hand points to a still more primitive form of the family, the actual existence of which cannot be proved any more, but which must have existed, because otherwise such a system of kinship could not have arisen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '37'
- id: II.3.1
  kind: p
  original: '"Die Familie", sagt Morgan, "ist das aktive Element; sie ist nie stationär, sondern schreitet vor von einer niedrigeren zu einer höheren Form, im Maß wie die Gesellschaft von niederer zu höherer Stufe sich entwickelt.'
  en: According to Morgan, the family is the active element; it is never stationary, but in progression from a lower to a higher form in the same measure in which society develops from a lower to a higher stage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 37-38
- id: II.3.2
  kind: p
  original: Die Verwandtschaftssysteme dagegen sind passiv; nur in langen Zwischenräumen registrieren sie die Fortschritte, die die Familie im Lauf der Zeit gemacht hat, und erfahren nur dann radikale Änderung, wenn die Familie sich radikal verändert hat."
  en: But the systems of kinship are passive. Only in long intervals they register the progress made by the family in course of time, and only then are they radically changed, when the family has done so.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '38'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.4.1
  kind: p
  original: '"Und", setzt Marx hinzu, "ebenso verhält es sich mit politischen, juristischen, religiösen, philosophischen Systemen überhaupt."'
  en: '"And," adds Marx, "it is the same with political, juridical, religious and philosophical systems in general."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '38'
- id: II.4.2
  kind: p
  original: Während die Familie fortlebt, verknöchert das Verwandtschaftssystem, und während dies gewohnheitsmäßig fortbesteht, entwächst ihm die Familie.
  en: While the family keeps on growing, the system of kinship becomes ossified. The latter continues in this state and the family grows beyond it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '38'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.4.3
  kind: p
  original: Mit derselben Sicherheit aber, mit der Cuvier aus den bei Paris gefundnen Marsupialknochen eines Tierskeletts schließen konnte, daß dies einem Beuteltier gehörte und daß dort einst ausgestorbne Beuteltiere gelebt, mit derselben Sicherheit können wir aus einem historisch überkommenen Verwandtschaftssystem schließen, daß die ihm entsprechende, ausgestorbne Familienform bestanden hat.
  en: With the same certainty which enabled Cuvier to conclude from some bones of Marsupialia found near Paris that extinct marsupialia had lived there, with this same certainty may we conclude from a system of kinship transmitted by history that the extinct form of the family corresponding to this system was once in existence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '38'
- id: II.5.1
  kind: p
  original: Die eben erwähnten Verwandtschaftssysteme und Familienformen unterscheiden sich von den jetzt herrschenden dadurch, daß jedes Kind mehrere Väter und Mütter hat.
  en: The systems of kinship and forms of the family just mentioned differ from the present systems in that every child has several fathers and mothers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '38'
- id: II.5.2
  kind: p
  original: Bei dem amerikanischen Verwandtschaftssystem, dem die hawaiische Familie entspricht, können Bruder und Schwester nicht Vater und Mutter desselben Kindes sein; das hawaiische Verwandtschaftssystem aber setzt eine Familie voraus, in der dies im Gegenteil die Regel war.
  en: Under the American system to which the Hawaiian system corresponds, brother and sister cannot be father and mother of the same child; but the Hawaiian system presupposes a family, in which, on the contrary, this was the rule.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '38'
- id: II.5.3
  kind: p
  original: Wir werden hier in eine Reihe von Familienformen versetzt, die den bisher gewöhnlich als allein geltend angenommenen direkt widersprechen.
  en: We are here confronted by a series of family forms that are in direct contradiction with those that were currently regarded as alone prevailing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '38'
- id: II.5.4
  kind: p
  original: Die hergebrachte Vorstellung kennt nur die Einzelehe, daneben Vielweiberei eines Mannes, allenfalls noch Vielmännerei einer Frau, und verschweigt dabei, wie es dem moralisierenden Philister ziemt, daß die Praxis sich über diese von der offiziellen Gesellschaft gebotenen Schranken stillschweigend aber ungeniert hinwegsetzt.
  en: The conventional conception knows only monogamy, furthermore polygamy of one man, eventually also polyandry of one woman. But it passes in silence, as is meet for a moralizing philistine, that the practice silently but without compunction supersedes these barriers sanctioned officially by society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '38'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.5.5
  kind: p
  original: Das Studium der Urgeschichte dagegen führt uns Zustande vor, wo Männer in Vielweiberei und ihre Weiber gleichzeitig in Vielmännerei leben und die gemeinsamen Kinder daher auch als ihnen allen gemeinsam gelten; Zustände, die selbst wieder bis zu ihrer schließlichen Auflösung in die Einzelehe eine ganze Reihe von Veränderungen durchmachen.
  en: The study of primeval history, however, shows us conditions, where men practiced polygamy and women at the same time polyandry, so that their children were considered common to all; conditions that up to their final transition into monogamy underwent a whole series of modifications.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '38'
- id: II.5.6
  kind: p
  original: Diese Veränderungen sind der Art, daß der Kreis, den das gemeinsame Eheband umfaßt und der ursprünglich sehr weit war, sich mehr und mehr verengert, bis er schließlich nur das Einzelpaar übrigläßt, das heute vorherrscht.
  en: These modifications slowly and gradually contract the circle comprised by the common tie of marriage until only the single couple remains which prevails to-day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '38'
- id: II.6.1
  kind: p
  original: Indem Morgan auf diese Weise die Geschichte der Familie rückwärts konstruiert, kommt er in Übereinstimmung mit der Mehrzahl seiner Kollegen auf einen Urzustand, wo unbeschränkter Geschlechtsverkehr innerhalb eines Stammes herrschte, so daß jede Frau jedem Mann und jeder Mann jeder Frau gleichmäßig gehörte.
  en: In thus constructing backward the history of the family, Morgan, in harmony with the majority of his colleagues, arrives at a primeval condition, where unrestricted sexual intercourse existed within a tribe, so that every woman belonged to every man, and vice versa.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T1
    editions: '1884'
    reading: 'Der folgende Text bis zum Absatz: 1. Die Blutsverwandtschaftsfamilie... (S. 43) ist die von Engels 1892 erweiterte Fassung. Er lautete 1884: Die Entdeckung dieses Urzustandes ist das erste große Verdienst Bachofens. (1) Aus diesem Urzustand entwickelte sich wahrscheinlich sehr frühzeitig:'
    base_text: … jeder Frau gleichmäßig gehörte. ‸  …
  mew_page: 38-39
- id: II.6.2
  kind: p
  original: Von einem solchen Urzustand ist schon seit dem vorigen Jahrhundert gesprochen worden, aber nur in allgemeinen Redensarten; erst Bachofen, und es ist dies eines seiner großen Verdienste, nahm ihn ernst und suchte nach Spuren dieses Zustandes in den geschichtlichen und religiösen Überlieferungen.
  en: Much has been said about this primeval state of affairs since the eighteenth century, but only in general commonplaces. It is one of Bachofen's great merits to have taken the subject seriously and to have searched for traces of this state in historical and religious traditions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '39'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.6.3
  kind: p
  original: Wir wissen heute, daß diese von ihm aufgefundnen Spuren keineswegs auf eine Gesellschaftsstufe des regellosen Geschlechtsverkehrs zurückführen, sondern auf eine weit spätere Form, die Gruppenehe.
  en: To-day we know that these traces, found by him, do not lead back to a stage of unlimited sexual intercourse, but to a much later form, the group marriage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '39'
- id: II.6.4
  kind: p
  original: Jene primitive Gesellschaftsstufe, falls sie wirklich bestanden hat, gehört einer so weit zurückliegenden Epoche an, daß wir schwerlich erwarten dürfen, in sozialen Fossilien, bei zurückgebliebenen Wilden, direkte Beweise für ihre einstige Existenz zu finden.
  en: The primeval stage, if it really ever existed, belongs to so remote a period, that we can hardly expect to find direct proofs of its former existence among these social fossils, backward savages.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '39'
- id: II.6.5
  kind: p
  original: Bachofens Verdienst besteht eben darin, diese Frage in den Vordergrund der Untersuchung gestellt zu haben.
  en: Bachofen's merit consists in having brought this question to the fore.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - II.N1
  mew_page: '39'
- id: II.7.1
  kind: p
  original: Es ist neuerdings Mode geworden, diese Anfangsstufe des menschlichen Geschlechtslebens wegzuleugnen.
  en: It has lately become a fashion to deny the existence of this early stage of human sex life, in order to spare us this "shame."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '39'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.7.2
  kind: p
  original: Man will der Menschheit diese "Schande" ersparen.
  en: ''
  joined_to: II.7.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '39'
- id: II.7.3
  kind: p
  original: Und zwar beruft man sich, außer auf den Mangel jedes direkten Beweises, besonders auf das Beispiel der übrigen Tierwelt; aus dieser hat Letourneau ("L'evolution du mariage et de la famille", 1888) zahlreiche Tatsachen zusammengestellt, wonach auch hier ein durchaus ungeregelter Geschlechtsverkehr einer niedrigen Stufe angehören soll.
  en: Apart from the absence of all direct proof, the example of the rest of animal life is invoked. From the latter, Letourneau (Evolution du mariage et de la famille, 1888) quoted numerous facts, alleged to prove that among animals also an absolutely unlimited sexual intercourse belongs to a lower stage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '39'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.7.4
  kind: p
  original: Aus allen diesen Tatsachen kann ich aber nur den Schluß ziehn, daß sie, für den Menschen und seine urzeitlichen Lebensverhältnisse, absolut nichts beweisen.
  en: But I can only conclude from all these facts that they prove absolutely nothing for man and the primeval conditions of his life.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '39'
- id: II.7.5
  kind: p
  original: Die Paarungen für längere Zeit bei Wirbeltieren erklären sich hinreichend aus physiologischen Ursachen, z.B. bei Vögeln durch die Hülfsbedürftigkeit des Weibchens während der Brütezeit; die bei Vögeln vorkommenden Beispiele treuer Monogamie beweisen nichts für die Menschen, da diese eben nicht von Vögeln abstammen.
  en: The mating of vertebrates for a lengthy term is sufficiently explained by physiological causes, e. g., among birds by the helplessness of the female during brooding time. Examples of faithful monogamy among birds do not furnish any proofs for men, for we are not descended from birds.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 39-40
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.7.6
  kind: p
  original: Und wenn strenge Monogamie der Gipfel aller Tugend ist, so gebührt die Palme dem Bandwurm, der in jedem seiner 50-200 Proglottiden oder Leibesabschnitte einen vollständigen weiblichen und männlichen Geschlechtsapparat besitzt und seine ganze Lebenszeit damit zubringt, in jedem dieser Abschnitte sich mit sich selbst zu begatten.
  en: And if strict monogamy is the height of virtue, then the palm belongs to the tapeworm that carries a complete male and female sexual apparatus in each of its 50 to 200 sections and passes its whole lifetime in fertilizing itself in every one of its sections.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '40'
- id: II.7.7
  kind: p
  original: Beschränken wir uns aber auf die Säugetiere, so finden wir da alle Formen des Geschlechtslebens, Regellosigkeit, Anklänge der Gruppenehe, Vielweiberei, Einzelehe; nur die Vielmännerei fehlt, die konnten nur Menschen fertigbringen.
  en: But if we confine ourselves to mammals, we find all forms of sexual intercourse, license, suggestions of group marriage, polygamy and monogamy. Only polyandry is missing; that could be accomplished by men only.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '40'
  en_note: 'Untermann''s note [8]: The female of the European cuckoo (cuculus canorus) keeps intercourse with several males in different districts during the same season. Still, this is far from the human polyandry, in which the men and one women all live together in the same place, the men mutually tolerating one another, which male cuckoos do not.'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.7.8
  kind: p
  original: Selbst unsre nächsten Verwandten, die Vierhänder, bieten uns alle möglichen Verschiedenheiten in der Gruppierung von Männchen und Weibchen; und wenn wir noch engere Grenzen ziehn und nur die vier menschenähnlichen Affen betrachten, so weiß Letourneau uns nur zu sagen, daß sie bald monogam, bald polygam sind, während Saussure bei Giraud-Teulon behauptet, sie seien monogam.
  en: Even our next relations, the quadrumana, exhibit all possible differences in the grouping of males and females. And if we draw the line still closer and consider only the four anthropoid apes, Letourneau can only tell us, that they are now monogamous, now polygamous; while Saussure contends according to Giraud-Teulon that they are monogamous.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '40'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.7.9
  kind: p
  original: Auch die von Westermarck ("The History of Human Marriage", London 1891) beigebrachten neueren Behauptungen von Monogamie der menschenähnlichen Affen sind noch lange keine Beweise.
  en: The recent contentions of Westermarck in regard to monogamy among anthropoid apes are far from proving anything.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '40'
  en_note: 'Untermann''s footnote [9]: Westermarck, The History of Human Marriage, London, 1891.'
- id: II.7.10
  kind: p
  original: 'Kurzum, die Nachrichten sind der Art, daß der ehrliche Letourneau zugibt:'
  en: 'In short, the information is such that honest Letourneau admits: "There exists no strict relation at all between the degree of intellectual development and the form of sexual intercourse among mammals."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '40'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
