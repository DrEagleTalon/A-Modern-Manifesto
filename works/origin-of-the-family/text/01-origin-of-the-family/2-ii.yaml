  en: ''
  joined_to: II.80.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '68'
- id: II.80.3
  kind: p
  original: Sie tritt auf als Unterjochung des einen Geschlechts durch das andre, als Proklamation eines bisher in der ganzen Vorgeschichte unbekannten Widerstreits der Geschlechter.
  en: On the contrary, it enters as the subjugation of one sex by the other, as the proclamation of an antagonism between the sexes unknown in all preceding history.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: II.80.4
  kind: p
  original: 'In einem alten, 1846 von Marx und mir ausgearbeiteten, ungedruckten Manuskript finde ich: "Die erste Teilung der Arbeit ist die von Mann und Weib zur Kinderzeugung."'
  en: 'In an old unpublished manuscript written by Marx and myself in 1846, I find the following passage: "The first division of labor is that of man and wife in breeding children."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: II.80.5
  kind: p
  original: 'Und heute kann ich hinzusetzen: Der erste Klassengegensatz, der in der Geschichte auftritt, fällt zusammen mit der Entwicklung des Antagonismus von Mann und Weib in der Einzelehe, und die erste Klassenunterdrückung mit der des weiblichen Geschlechts durch das männliche.'
  en: 'And to-day I may add: The first class antagonism appearing in history coincides with the development of the antagonism of man and wife in monogamy, and the first class oppression with that of the female by the male sex.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: II.80.6
  kind: p
  original: Die Einzelehe war ein großer geschichtlicher Fortschritt, aber zugleich eröffnet sie neben der Sklaverei und dem Privatreichtum jene bis heute dauernde Epoche, in der jeder Fortschritt zugleich ein relativer Rückschritt, in dem das Wohl und die Entwicklung der einen sich durchsetzt durch das Wehe und die Zurückdrängung der andern.
  en: Monogamy was a great historical progress. But by the side of slavery and private property it marks at the same time that epoch which, reaching down to our days, takes with all progress also a step backwards, relatively speaking, and develops the welfare and advancement of one by the woe and submission of the other.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.80.7
  kind: p
  original: Sie ist die Zellenform der zivilisierten Gesellschaft, an der wir schon die Natur der in dieser sich voll entfaltenden Gegensätze und Widersprüche studieren können.
  en: It is the cellular form of civilized society which enables us to study the nature of its now fully developed contrasts and contradictions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: II.81.1
  kind: p
  original: Die alte verhältnismäßige Freiheit des Geschlechtsverkehrs verschwand keineswegs mit dem Sieg der Paarungs- oder selbst der Einzelehe.
  en: The old relative freedom of sexual intercourse by no means disappeared with the victory of the pairing or even of the monogamous family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
- id: II.82.1
  kind: p
  original: '"Das alte Ehesystem, auf engere Grenzen zurückgeführt durch das allmähliche Aussterben der Punaluagruppen, umgab immer noch die sich fortentwickelnde Familie und hing an ihren Schößen bis an die aufdämmernde Zivilisation hinan... es verschwand schließlich in der neuen Form des Hetärismus, die die Menschen bis in die Zivilisation hinein verfolgt, wie ein dunkler Schlagschatten, der auf der Familie ruht."'
  en: '"The old conjugal system, now reduced to narrower limits by the gradual disappearance of the punaluan groups, still environed the advancing family, which it was to follow to the verge of civilization.... It finally disappeared in the new form of hetaerism, which still follows mankind in civilization as a dark shadow upon the family."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '68'
  en_note: 'Untermann''s footnote [23]: Morgan, Ancient Society, p. 504.'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.83.1
  kind: p
  original: Unter Hetärismus versteht Morgan den neben der Einzelehe bestehenden außerehelichen geschlechtlichen Verkehr der Männer mit unverheirateten Weibern, der bekanntlich während der ganzen Periode der Zivilisation in den verschiedensten Formen blüht und mehr und mehr zur offenen Prostitution wird.
  en: By hetaerism Morgan designates sexual intercourse of men with unmarried women outside of the monogamous family, flourishing, as is well known, during the whole period of civilization in many different forms and tending more and more to open prostitution.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T24
    editions: '1884'
    reading: 'fehlt in diesem Absatz der folgende Text bis zu den Worten: Der Hetärismus ist eben eine gesellschaftliche Einrichtung...'
    base_text: … zur offenen Prostitution wird. ‸  …
  mew_page: 68-69
- id: II.83.2
  kind: p
  original: Dieser Hetärismus leitet sich ganz direkt ab aus der Gruppenehe, aus dem Preisgebungsopfer der Frauen, wodurch sie sich das Recht der Keuschheit erkauften.
  en: This hetaerism is directly derived from group marriage, from the sacrificial surrender of women for the purpose of obtaining the right to chastity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '69'
- id: II.83.3
  kind: p
  original: Die Hingebung für Geld war zuerst ein religiöser Akt, sie fand statt im Tempel der Liebesgöttin, und das Geld floß ursprünglich in den Tempelschatz.
  en: The surrender for money was at first a religious act; it took place in the temple of the goddess of love and the money flowed originally into the treasury of the temple.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '69'
- id: II.83.4
  kind: p
  original: Die Hierodulen der Anaitis in Armenien, der Aphrodite in Korinth, wie die den Tempeln attachierten religiösen Tanzmädchen Indiens, die sog. Bajaderen (das Wort ist verstümmelt aus dem portugiesischen bailadeira, Tänzerin), waren die ersten Prostituierten.
  en: The hierodulae of Anaitis in Armenia, of Aphrodite in Corinth and the religious dancing girls of India attached to the temples, the so-called bajaderes (derived from the Portuguese "bailadera," dancing girl), were the first prostitutes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '69'
- id: II.83.5
  kind: p
  original: Die Preisgebung, ursprünglich Pflicht jeder Frau, wurde später durch diese Priesterinnen, in Stellvertretung für alle andern, allein ausgeübt.
  en: The surrender, originally the duty of every woman, was later on practiced by these priestesses alone in representation of all others.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '69'
- id: II.83.6
  kind: p
  original: Bei andern Völkern leitet sich der Hetärismus her aus der den Mädchen vor der Ehe gestatteten Geschlechtsfreiheit - also ebenfalls Rest der Gruppenehe, nur auf anderm Weg uns überkommen.
  en: Among other nations, hetaerism is derived from the sexual freedom permitted to girls before marriage--also a survival of the group marriage, only transmitted by another route.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '69'
- id: II.83.7
  kind: p
  original: Mit dem Aufkommen der Eigentumsverschiedenheit, also schon auf der Oberstufe der Barbarei, tritt die Lohnarbeit sporadisch auf neben Sklavenarbeit und gleichzeitig, als ihr notwendiges Korrelat, die gewerbsmäßige Prostitution freier Frauen neben der erzwungnen Preisgebung der Sklavin.
  en: With the rise of different property relations, in the higher stage of barbarism, wage labor appears sporadically by the side of slavery, and at the same time its unavoidable companion, professional prostitution of free women by the side of the forced surrender of female slaves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '69'
- id: II.83.8
  kind: p
  original: 'So ist die Erbschaft, die die Gruppenehe der Zivilisation vermacht hat, eine doppelseitige, wie alles, was die Zivilisation hervorbringt, doppelseitig, doppelzüngig, in sich gespalten, gegensätzlich ist: hier die Monogamie, dort der Hetärismus mitsamt seiner extremsten Form, der Prostitution.'
  en: It is the heirloom bequeathed by group marriage to civilization, a gift as ambiguous as everything else produced by ambiguous, double-faced, schismatic and contradictory civilization. Here monogamy, there hetaerism and its most extreme form, prostitution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '69'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.83.9
  kind: p
  original: Der Hetärismus ist eben eine gesellschaftliche Einrichtung wie jede andere; er setzt die alte Geschlechtsfreiheit fort - zugunsten der Männer.
  en: Hetaerism is as much a social institution as all others. It continues the old sexual freedom--for the benefit of the men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '69'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.83.10
  kind: p
  original: In der Wirklichkeit nicht nur geduldet, sondern namentlich von den herrschenden Klassen flott mitgemacht, wird er in der Phrase verdammt.
  en: In reality not only permitted, but also assiduously practised by the ruling class, it is denounced only nominally.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '69'
- id: II.83.11
  kind: p
  original: 'Aber in der Wirklichkeit trifft diese Verdammung keineswegs die dabei beteiligten Männer, sondern nur die Weiber: Sie werden geächtet und ausgestoßen, um so nochmals die unbedingte Herrschaft der Männer über das weibliche Geschlecht als gesellschaftliches Grundgesetz zu proklamieren.'
  en: Still in practice this denunciation strikes by no means the men who indulge in it, but only the women. These are ostracised and cast out by society, in order to proclaim once more the fundamental law of unconditional male supremacy over the female sex.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '69'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.84.1
  kind: p
  original: Hiermit entwickelt sich aber ein zweiter Gegensatz innerhalb der Monogamie selbst.
  en: However, a second contradiction is thereby developed within monogamy itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '69'
- id: II.84.2
  kind: p
  original: Neben dem, sein Dasein durch den Hetärismus verschönernden Ehemann steht die vernachlässigte Gattin.
  en: By the side of the husband, who is making his life pleasant by hetaerism, stands the neglected wife.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T25
    editions: '1884'
    reading: fehlen die letzten beiden Sätze
    base_text: … steht die vernachlässigte Gattin. ‸  …
  mew_page: '69'
- id: II.84.3
  kind: p
  original: Und man kann nicht die eine Seite des Gegensatzes haben ohne die andre, ebensowenig wie man noch einen ganzen Apfel in der Hand hat, nachdem man die eine Hälfte gegessen.
  en: And you cannot have one side of the contradiction without the other, just as you cannot have the whole apple after eating half of it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 69-70
- id: II.84.4
  kind: p
  original: Trotzdem scheint dies die Meinung der Männer gewesen zu sein, bis ihre Frauen sie eines Bessern belehrten.
  en: Nevertheless this seems to have been the idea of the men, until their wives taught them a lesson.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '70'
- id: II.84.5
  kind: p
  original: 'Mit der Einzelehe treten zwei ständige gesellschaftliche Charakterfiguren auf, die früher unbekannt waren: der ständige Liebhaber der Frau und der Hahnrei.'
  en: 'Monogamy introduces two permanent social characters that were formerly unknown: the standing lover of the wife and the cuckold.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '70'
- id: II.84.6
  kind: p
  original: Die Männer hatten den Sieg über die Weiber errungen, aber die Krönung übernahmen großmütig die Besiegten.
  en: The men had gained the victory over the women, but the vanquished magnanimously provided the coronation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '70'
- id: II.84.7
  kind: p
  original: Neben der Einzelehe und dem Hetärismus wurde der Ehebruch eine unvermeidliche gesellschaftliche Einrichtung - verpönt, hart bestraft, aber ununterdrückbar.
  en: In addition to monogamy and hetaerism, adultery became an unavoidable social institution--denounced, severely punished, but irrepressible.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '70'
- id: II.84.8
  kind: p
  original: 'Die sichre Vaterschaft der Kinder beruhte nach wie vor höchstens auf moralischer Überzeugung, und um den unlöslichen Widerspruch zu lösen, dekretierte der Code Napoleon Art. 312:'
  en: 'The certainty of paternal parentage rested as of old on moral conviction at best, and in order to solve the unreconcilable contradiction, the code Napoleon decreed in its article 312: "L''enfant concu pendant le mariage a pour pere le mari;" the child conceived during marriage has for its father--the husband.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '70'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.85.1
  kind: p
  original: '"L''enfant conçu pendant le mariage a pour père le mari; das während der Ehe empfangne Kind hat zum Vater - den Ehemann."'
  en: ''
  joined_to: II.84.8
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '70'
- id: II.86.1
  kind: p
  original: Das ist das letzte Resultat von dreitausend Jahren Einzelehe.
  en: This is the last result of three thousand years of monogamy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '70'
- id: II.86.2
  kind: p
  original: So haben wir in der Einzelfamilie, in den Fällen, die ihrer geschichtlichen Entstehung treu bleiben und den durch die ausschließliche Herrschaft des Mannes ausgesprochnen Widerstreit von Mann und Weib klar zur Erscheinung bringen, ein Bild im kleinen derselben Gegensätze und Widersprüche, in denen sich die seit Eintritt der Zivilisation in Klassen gespaltne Gesellschaft bewegt, ohne sie auflösen und überwinden zu können.
  en: Thus we have in the monogamous family, at least in those cases that remain true to historical development and clearly express the conflict between man and wife created by the exclusive supremacy of men, a miniature picture of the contrasts and contradictions of society at large. Split by class-differences since the beginning of civilization, society has been unable to reconcile and overcome these antitheses.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '70'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.86.3
  kind: p
  original: Ich spreche hier natürlich nur von jenen Fällen der Einzelehe, wo das eheliche Leben in Wirklichkeit nach Vorschrift des ursprünglichen Charakters der ganzen Einrichtung verläuft, wo die Frau aber gegen die Herrschaft des Mannes rebelliert.
  en: Of course, I am referring here only to those cases of monogamy, where matrimonial life actually remains in accord with the original character of the whole institution, but where the wife revolts against the rule of the man.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '70'
- id: II.86.4
  kind: p
  original: Daß nicht alle Ehen so verlaufen, weiß niemand besser als der deutsche Philister, der seine Herrschaft im Hause nicht besser zu wahren weiß als im Staat und dessen Frau daher mit vollem Recht die Hosen trägt, deren er nicht wert ist.
  en: Nobody knows better than your German philistine that not all marriages follow such a course. He does not understand how to maintain the control of his own home any better than that of the State, and his wife is, therefore, fully entitled to wearing the trousers, which he does not deserve.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '70'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.86.5
  kind: p
  original: Dafür dünkt er sich aber auch weit erhaben über seinen französischen Leidensgenossen, dem, öfter als ihm selbst, weit Schlimmeres passiert.
  en: But he thinks himself far superior to his French companion in misery, who more frequently fares far worse.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '70'
- id: II.87.1
  kind: p
  original: Die Einzelfamilie trat übrigens keineswegs überall und jederzeit in der klassisch-schroffen Form auf, die sie bei den Griechen hatte.
  en: The monogamous family, by the way, did not everywhere and always appear in the classic severe form it had among the Greeks.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '70'
- id: II.87.2
  kind: p
  original: Bei den Römern, die als künftige Welteroberer einen weiteren, wenn auch weniger feinen Blick hatten als die Griechen, war die Frau freier und geachteter.
  en: Among the Romans, who as future conquerors of the world had a sharper although less refined eye than the Greeks, the women were freer and more respected.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '70'
- id: II.87.3
  kind: p
  original: Der Römer glaubte die eheliche Treue durch die Gewalt über Leben und Tod seiner Frau hinlänglich verbürgt.
  en: A Roman believed that the conjugal faith of his wife was sufficiently safeguarded by his power over her life and death.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '70'
- id: II.87.4
  kind: p
  original: Auch konnte die Frau hier ebensogut wie der Mann die Ehe freiwillig lösen.
  en: Moreover, the women could voluntarily dissolve the marriage as well as the men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '70'
- id: II.87.5
  kind: p
  original: Aber der größte Fortschritt in der Entwicklung der Einzelehe geschah entschieden mit dem Eintritt der Deutschen in die Geschichte, und zwar weil bei ihnen, wohl infolge ihrer Armut, damals die Monogamie sich noch nicht vollständig aus der Paarungsehe entwickelt zu haben scheint.
  en: But the highest progress in the development of monogamy was doubtless due to the entrance of the Germans into history, probably because on account of their poverty their monogamy had not yet fully outgrown the pairing family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 70-71
- id: II.87.6
  kind: p
  original: 'Wir schließen dies aus drei Umständen, die Tacitus erwähnt: Erstens galt bei großer Heilighaltung der Ehe - "sie begnügen sich mit einer Frau, die Weiber leben eingehegt durch Keuschheit" - dennoch Vielweiberei für die Vornehmen und Stammesführer, also ein Zustand, ähnlich dem der Amerikaner, bei denen Paarungsehe galt.'
  en: 'Three facts mentioned by Tacitus favor this conclusion: In the first place, although marriage was held very sacred--"they are satisfied with one wife, the women are protected by chastity"--still polygamy was in use among the distinguished and the leaders of the tribes, as was the case in the pairing families of the American Indians.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '71'
- id: II.87.7
  kind: p
  original: Und zweitens konnte der Übergang vom Mutterrecht zum Vaterrecht erst kurz vorher gemacht worden sein, denn noch galt der Mutterbruder - der nächste männliche Gentilverwandte nach Mutterrecht - als fast ein näherer Verwandter denn der eigne Vater, ebenfalls entsprechend dem Standpunkt der amerikanischen Indianer, bei denen Marx, wie er oft sagte, den Schlüssel zum Verständnis unsrer eignen Urzeit gefunden.
  en: Secondly, the transition from maternal to paternal law could have taken place only a short while before, because the mother's brother--the next male relative in the gens by maternal law--was still considered almost a closer relative than the natural father, also in accordance with the standpoint of the American Indians. The latter furnished to Marx, according to his own testimony, the key to the comprehension of German primeval history.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '71'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.87.8
  kind: p
  original: Und drittens waren die Frauen bei den Deutschen hochgeachtet und einflußreich auch auf öffentliche Geschäfte, was im direkten Gegensatz zur monogamischen Männerherrschaft steht.
  en: And thirdly, the German women were highly respected and also influenced public affairs, a fact directly opposed to monogamic male supremacy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '71'
- id: II.87.9
  kind: p
  original: Fast alles Dinge, worin die Deutschen mit den Spartanern stimmen, bei denen, wie wir sahen, die Paarungsehe ebenfalls noch nicht vollständig überwunden war.
  en: In all these things the Germans almost harmonize with the Spartans, who, as we saw, also had not fully overcome the pairing family.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T26
    editions: '1884'
    reading: fehlt der letzte Satz
    base_text: … nicht vollständig überwunden war. ‸  …
  mew_page: '71'
- id: II.87.10
  kind: p
  original: Mit den Deutschen kam also auch in dieser Beziehung ein ganz neues Element zur Weltherrschaft.
  en: Hence in this respect an entirely new element succeeded to the world's supremacy with the Germans.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '71'
- id: II.87.11
  kind: p
  original: Die neue Monogamie, die sich nun auf den Trümmern der Römerwelt aus der Völkermischung entwickelte, kleidete die Männerherrschaft in mildere Formen und ließ den Frauen eine wenigstens äußerlich weit geachtetere und freiere Stellung, als das klassische Altertum sie je gekannt.
  en: The new monogamy now developing the ruins of the Roman world from the mixture of nations endowed male rule with a milder form and accorded to women a position that was at least outwardly far more respected and free than classical antiquity ever knew.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '71'
- id: II.87.12
  kind: p
  original: 'Damit erst war die Möglichkeit gegeben, auf der sich aus der Monogamie - in ihr, neben ihr und gegen sie, je nachdem - der größte sittliche Fortschritt entwickeln konnte, den wir ihr verdanken: die moderne individuelle Geschlechtsliebe, die der ganzen früheren Welt unbekannt war.'
  en: 'Not until now was there a possibility of developing from monogamy--in it, by the side of it or against it, as the case might be--the highest ethical progress we owe to it: the modern individual sexlove, unknown to all previous ages.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '71'
- id: II.88.1
  kind: p
  original: Dieser Fortschritt entsprang aber entschieden aus dem Umstand, daß die Deutschen noch in der Paarungsfamilie lebten, und die ihr entsprechende Stellung der Frau, soweit es anging, der Monogamie aufpfropften, keineswegs aber aus der sagenhaften, wunderbar sittenreinen Naturanlage der Deutschen, die sich darauf beschränkt, daß die Paarungsehe sich in der Tat nicht in den grellen sittlichen Gegensätzen bewegt wie die Monogamie.
  en: This progress doubtless arose from the fact that the Germans still lived in the pairing family and inoculated monogamy as far as possible with the position of women corresponding to the former. It was in no way due to the legendary and wonderfully pure natural qualities of the Germans. These qualities were limited to the simple fact that the pairing family indeed does not create the marked moral contrasts of monogamy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '71'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.88.2
  kind: p
  original: Im Gegenteil waren die Deutschen auf ihren Wanderzügen, besonders nach Südost zu den Steppennomaden am Schwarzen Meer, sittlich stark verkommen und hatten bei diesen außer ihren Reiterkünsten auch arge widernatürliche Laster angenommen, was Ammianus von den Taifalern und Prokop von den Herulern ausdrücklich bezeugt.
  en: On the contrary, the Germans, especially those who wandered southeast among the nomadic nations of the Black Sea, had greatly degenerated morally. Beside the equestrian tricks of the inhabitants of the steppe they had also acquired some very unnatural vices. This is expressly confirmed of the Thaifali by Ammianus and of the Heruli by Prokop.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '71'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.89.1
  kind: p
  original: Wenn aber die Monogamie von allen bekannten Familienformen diejenige war, unter der allein sich die moderne Geschlechtsliebe entwickeln konnte, so heißt das nicht, daß sie sich ausschließlich oder nur vorwiegend in ihr, als Liebe der Ehegatten zueinander, entwickelte.
  en: Although monogamy was the only one of all known forms of the family in which modern sexlove could develop, this does not imply that it developed exclusively or even principally as mutual love of man and wife.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 71-72
- id: II.89.2
  kind: p
  original: Die ganze Natur der festen Einzelehe unter Mannesherrschaft schloß das aus.
  en: The very nature of strict monogamy under man's rule excluded this.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '72'
- id: II.89.3
  kind: p
  original: Bei allen geschichtlich aktiven, d.h. bei allen herrschenden Klassen blieb die Eheschließung, was sie seit der Paarungsehe gewesen, Sache der Konvenienz, die von den Eltern arrangiert wurde.
  en: Among all historically active, i. e., ruling, classes matrimony remained what it had been since the days of the pairing family--a conventional matter arranged by the parents.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '72'
- id: II.89.4
  kind: p
  original: Und die erste geschichtlich auftretende Form der Geschlechtsliebe als Leidenschaft, und als jedem Menschen (wenigstens der herrschenden Klassen) zukommende Leidenschaft, als höchste Form des Geschlechtstriebs - was gerade ihren spezifischen Charakter ausmacht -, diese ihre erste Form, die ritterliche Liebe des Mittelalters, war keineswegs eine eheliche Liebe, im Gegenteil.
  en: And the first historical form of sexlove as a passion, as an attribute of every human being (at least of the ruling classes), the specific character of the highest form of the sexual impulse, this first form, the love of the knights in the middle ages, was by no means matrimonial love, but quite the contrary.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '72'
- id: II.89.5
  kind: p
  original: In ihrer klassischen Gestalt, bei den Provenzalen, steuert sie mit vollen Segeln auf den Ehebruch los, und ihre Dichter feiern ihn.
  en: In its classic form, among the Provencals, it heads with full sails for adultery and their poets extol the latter.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '72'
- id: II.89.6
  kind: p
  original: Die Blüte der provenzalischen Liebespoesie sind die Albas, deutsch Tagelieder.
  en: The flower of Provencal love poetry, the Albas, describe in glowing colors how the knight sleeps with his adored--the wife of another--while the watchman outside calls him at the first faint glow of the morning (alba) and enables him to escape unnoticed. The poems culminate in the parting scene.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '72'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: II.89.7
  kind: p
  original: Sie schildern in glühenden Farben, wie der Ritter bei seiner Schönen - der Frau eines andern - im Bett liegt, während draußen der Wächter steht, der ihm zuruft, sobald das erste Morgengrauen (alba) aufsteigt, damit er noch unbemerkt entweichen kann; die Trennungsszene bildet dann den Gipfelpunkt.
  en: ''
  joined_to: II.89.6
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '72'
- id: II.89.8
  kind: p
  original: Die Nordfranzosen und auch die braven Deutschen nahmen diese Dichtungsart mit der ihr entsprechenden Manier der Ritterliebe ebenfalls an, und unser alter Wolfram von Eschenbach hat über denselben anzüglichen Stoff drei wunderschöne Tagelieder hinterlassen, die mir lieber sind als seine drei langen Heldengedichte.
  en: Likewise the Frenchmen of the north and also the honest Germans adopted this style of poetry and the manner of knightly love corresponding to it. Old Wolfram von Eschenbach has left us three wonderful "day songs" treating this same questionable subject, and I like them better than his three heroic epics.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '72'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.90.1
  kind: p
  original: Die bürgerliche Eheschließung unserer Tage ist doppelter Art.
  en: Civil matrimony in our day is of two kinds.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '72'
- id: II.90.2
  kind: p
  original: 'In katholischen Ländern besorgen nach wie vor die Eltern dem jungen Bürgerssohn eine angemessene Frau, und die Folge davon ist natürlich die vollste Entfaltung des in der Monogamie enthaltnen Widerspruchs: üppiger Hetärismus auf selten des Mannes, üppiger Ehebruch auf selten der Frau.'
  en: 'In Catholic countries, the parents provide a fitting spouse for their son as of old, and the natural consequence is the full development of the contradictions inherent to monogamy: voluptuous hetaerism on the man''s part, voluptuous adultery of the woman.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '72'
- id: II.90.3
  kind: p
  original: Die katholische Kirche hat wohl auch nur deswegen die Ehescheidung abgeschafft, weil sie sich überzeugt hatte, daß gegen den Ehebruch wie gegen den Tod kein Kräutlein gewachsen ist.
  en: Probably the Catholic church has abolished divorce for the simple reason that it had come to the conclusion, there was as little help for adultery as for death.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '72'
- id: II.90.4
  kind: p
  original: In protestantischen Ländern dagegen ist es Regel, daß dem Bürgerssohn erlaubt wird, sich aus seiner Klasse eine Frau mit größerer oder geringerer Freiheit auszusuchen, wonach ein gewisser Grad von Liebe der Eheschließung zugrunde liegen kann und auch anstandshalber stets vorausgesetzt wird, was der protestantischen Heuchelei entspricht.
  en: In Protestant countries, again, it is the custom to give the bourgeois son more or less liberty in choosing his mate. Hence a certain degree of love may be at the bottom of such a marriage and for the sake of propriety this is always assumed, quite in keeping with Protestant hypocrisy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '72'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.90.5
  kind: p
  original: Hier wird der Hetärismus des Mannes schläfriger betrieben, und der Ehebruch der Frau ist weniger Regel.
  en: In this case hetaerism is carried on less strenuously and adultery on the part of the woman is not so frequent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '72'
- id: II.90.6
  kind: p
  original: Da aber in jeder Art Ehe die Menschen bleiben, was sie vor der Ehe waren, und die Bürger protestantischer Länder meist Philister sind, so bringt es diese protestantische Monogamie im Durchschnitt der besten Fälle nur zur ehelichen Gemeinschaft einer bleiernen Langeweile, die man mit dem Namen Familienglück bezeichnet.
  en: But as human beings remain under any form of marriage what they were before marrying, and as the citizens of Protestant countries are mostly philistines, this Protestant monogamy on the average of the best cases confines itself to the community of a leaden ennui, labeled wedded bliss.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 72-73
- id: II.90.7
  kind: p
  original: Der beste Spiegel dieser beiden Heiratsmethoden ist der Roman, für die katholische Manier der französische, für die protestantische der deutsche.
  en: The best mirror of these two species of marriage is the novel, the French novel for the Catholic, the German novel for the Protestant brand.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T27
    editions: '1884'
    reading: 'folgt: und schwedische'
    base_text: … die protestantische der deutsche ‸ . …
  mew_page: '73'
- id: II.90.8
  kind: p
  original: 'In jedem von beiden "kriegt er sie": im deutschen der junge Mann das Mädchen, im französischen der Ehemann die Hörner.'
  en: In both of these novels they "get one another:" in the German novel the man gets the girl, in the French novel the husband gets the horns.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
- id: II.90.9
  kind: p
  original: Welcher von beiden sich dabei schlechter steht, ist nicht immer ausgemacht.
  en: It does not always go without saying which of the two deserves the most pity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
- id: II.90.10
  kind: p
  original: Weshalb auch dem französischen Bourgeois die Langeweile des deutschen Romans ebendenselben Schauder erregt wie die "Unsittlichkeit" des französischen Romans dem deutschen Philister.
  en: For this reason the tediousness of the German novels is abhorred as much by the French bourgeois as the "immorality" of the French novels by the German philistine.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
- id: II.90.11
  kind: p
  original: Obwohl neuerdings, seit "Berlin Weltstadt wird", der deutsche Roman anfängt, etwas weniger schüchtern in dem dort seit lange wohlbekannten Hetärismus und Ehebruch zu machen.
  en: Of late, since Berlin became cosmopolitan, the German novel begins to treat somewhat timidly of the hetaerism and adultery that a long time ago became familiar features of that city.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
- id: II.91.1
  kind: p
  original: In beiden Fällen aber wird die Heirat bedingt durch die Klassenlage der Beteiligten und ist insofern stets Konvenienzehe.
  en: In both cases the marriage is influenced by the class environment of the participants, and in this respect it always remains conventional.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T28
    editions: '1884'
    reading: 'fehlt der folgende Text bis zu dem Absatz: Wirkliche Regel im Verhältnis zur Frau...'
    base_text: … ist insofern stets Konvenienzehe. ‸  …
  mew_page: '73'
- id: II.91.2
  kind: p
  original: Diese Konvenienzehe schlägt in beiden Fällen oft genug um in krasseste Prostitution - manchmal beider Teile, weit gewöhnlicher der Frau, die sich von der gewöhnlichen Kurtisane nur dadurch unterscheidet, daß sie ihren Leib nicht als Lohnarbeiterin zur Stückarbeit vermietet, sondern ihn ein für allemal in die Sklaverei verkauft.
  en: This conventionalism often enough results in the most pronounced prostitution--sometimes of both parties, more commonly of the woman. She is distinguished from a courtisane only in that she does not offer her body for money by the hour like a commodity, but sells it into slavery for once and all.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.91.3
  kind: p
  original: 'Und von allen Konvenienzehen gilt Fouriers Wort:'
  en: 'Fourier''s words hold good with respect to all conventional marriages: "As in grammar two negatives make one affirmative, so in matrimonial ethics, two prostitutions are considered as one virtue."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.92.1
  kind: p
  original: '"Wie in der Grammatik zwei Verneinungen eine Bejahung ausmachen, so gelten in der Heiratsmoral zwei Prostitutionen für eine Tugend."'
  en: ''
  joined_to: II.91.3
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '73'
- id: II.93.1
  kind: p
  original: Wirkliche Regel im Verhältnis zur Frau wird die Geschlechtsliebe und kann es nur werden unter den unterdrückten Klassen, also heutzutage im Proletariat - ob dies Verhältnis nun ein offiziell konzessioniertes oder nicht.
  en: Sexual love in man's relation to woman becomes and can become the rule among the oppressed classes alone, among the proletarians of our day--no matter whether this relation is officially sanctioned or not.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
- id: II.93.2
  kind: p
  original: Hier sind aber auch alle Grundlagen der klassischen Monogamie beseitigt.
  en: Here all the fundamental conditions of classic monogamy have been abolished.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
- id: II.93.3
  kind: p
  original: Hier fehlt alles Eigentum, zu dessen Bewahrung und Vererbung ja gerade die Monogamie und die Männerherrschaft geschaffen wurden, und hier fehlt damit auch jeder Antrieb, die Männerherrschaft geltend zu machen.
  en: Here all property is missing and it was precisely for the protection and inheritance of this that monogamy and man rule were established. Hence all incentive to make this rule felt is wanting here.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.93.4
  kind: p
  original: Noch mehr, auch die Mittel fehlen; das bürgerliche Recht, das diese Herrschaft schützt, besteht nur für die Besitzenden und deren Verkehr mit den Proletariern; es kostet Geld und hat deshalb armutshalber keine Geltung für die Stellung des Arbeiters zu seiner Frau.
  en: More still, the funds are missing. Civil law protecting male rule applies only to the possessing classes and their intercourse with proletarians. Law is expensive and therefore the poverty of the laborer makes it meaningless for his relation to his wife.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.93.5
  kind: p
  original: Da entscheiden ganz andere persönliche und gesellschaftliche Verhältnisse.
  en: Entirely different personal and social conditions decide in this case.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '73'
- id: II.93.6
  kind: p
  original: Und vollends seitdem die große Industrie die Frau aus dem Hause auf den Arbeitsmarkt und in die Fabrik versetzt hat und sie oft genug zur Ernährerin der Familie macht, ist dem letzten Rest der Männerherrschaft in der Proletarierwohnung aller Boden entzogen - es sei denn etwa noch ein Stück der seit Einführung der Monogamie eingerissenen Brutalität gegen Frauen.
  en: And finally, since the great industries have removed women from the home to the labor market and to the factory, the last remnant of man rule in the proletarian home has lost its ground--except, perhaps, a part of the brutality against women that has become general since the advent of monogamy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 73-74
- id: II.93.7
  kind: p
  original: So ist die Familie des Proletariers keine monogamische im strengen Sinn mehr, selbst bei der leidenschaftlichsten Liebe und festesten Treue beider und trotz aller etwaigen geistlichen und weltlichen Einsegnung.
  en: Thus the family of the proletarian is no longer strictly monogamous, even with all the most passionate love and the most unalterable loyalty of both parties, and in spite of any possible clerical or secular sanction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: II.93.8
  kind: p
  original: Daher spielen auch die ewigen Begleiter der Monogamie, Hetärismus und Ehebruch, hier nur eine fast verschwindende Rolle; die Frau hat das Recht der Ehetrennung tatsächlich wieder erhalten, und wenn man sich nicht vertragen kann, geht man lieber auseinander.
  en: Consequently the eternal companions of monogamy, hetaerism and adultery, play an almost insignificant role here. The woman has practically regained the right of separation, and if a couple cannot agree, they rather separate.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.93.9
  kind: p
  original: Kurz, die Proletarierehe ist monogam im etymologischen Sinn des Worts, aber durchaus nicht in seinem historischen Sinn.
  en: In short, the proletarian marriage is monogamous in the etymological sense of the word, but by no means in a historical sense.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T29
    editions: '1884'
    reading: 'fehlt der folgende Text bis zum Absatz: Kehren wir indes zurück zu Morgan...'
    base_text: … in seinem historischen Sinn. ‸  …
  mew_page: '74'
- id: II.94.1
  kind: p
  original: Unsre Juristen finden allerdings, daß der Fortschritt der Gesetzgebung den Frauen in steigendem Maß jeden Grund zur Klage entzieht.
  en: True, our jurists hold that the progress of legislation continually lessens all cause of complaint for women.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: II.94.2
  kind: p
  original: Die modernen zivilisierten Gesetzsysteme erkennen mehr und mehr an, erstens, daß die Ehe, um gültig zu sein, ein von beiden Teilen freiwillig eingegangner Vertrag sein muß, und zweitens, daß auch während der Ehe beide Teile einander mit gleichen Rechten und Pflichten gegenüberstehn sollen.
  en: The modern systems of civil law recognize, first that marriage, in order to be legal, must be a contract based on voluntary consent of both parties, and secondly that during marriage the relations of both parties shall be founded on equal rights and duties.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: II.94.3
  kind: p
  original: Seien diese beiden Forderungen aber konsequent durchgeführt, so hätten die Frauen alles, was sie verlangen können.
  en: These two demands logically enforced will, so they claim, give to women everything they could possibly ask.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: II.95.1
  kind: p
  original: Diese echt juristische Argumentation ist genau dieselbe, womit der radikale republikanische Bourgeois den Proletarier ab- und zur Ruhe verweist.
  en: This genuinely juridical argumentation is exactly the same as that used by the radical republican bourgeois to cut short and dismiss the proletarian.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: II.95.2
  kind: p
  original: Der Arbeitsvertrag soll ein von beiden Teilen freiwillig eingegangner sein.
  en: The labor contract is said to be voluntarily made by both parties.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: II.95.3
  kind: p
  original: Aber er gilt als für freiwillig eingegangen, sobald das Gesetz beide Teile auf dem Papier gleichstellt.
  en: But it is considered as voluntary when the law places both parties on equal terms on paper.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: II.95.4
  kind: p
  original: Die Macht, die die verschiedne Klassenstellung dem einen Teil gibt, der Druck, den sie auf den andern Teil ausübt - die wirkliche ökonomische Stellung beider -, das geht das Gesetz nichts an.
  en: The power conferred on one party by the division of classes, the pressure thereby exerted on the other party, the actual economic relation of the two--all this does not concern the law.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: II.95.5
  kind: p
  original: Und während der Dauer des Arbeitsvertrags sollen beide Teile wiederum gleichberechtigt sein, sofern nicht einer oder der andre ausdrücklich verzichtet hat.
  en: Again, during the term of the contract both parties are held to have equal rights, unless one has expressly renounced his right.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: II.95.6
  kind: p
  original: Daß die ökonomische Sachlage den Arbeiter zwingt, sogar auf den letzten Schein von Gleichberechtigung zu verzichten, dafür kann das Gesetz wiederum nichts.
  en: That the economic situation forces the laborer to give up even the last semblance of equality, that is not the fault of the law.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: II.96.1
  kind: p
  original: Mit Bezug auf die Ehe ist das Gesetz, selbst das fortgeschrittenste, vollauf befriedigt, sobald die Beteiligten ihre Freiwilligkeit formell zu Protokoll gegeben haben.
  en: In regard to marriage, even the most advanced law is completely satisfied after both parties have formally declared their willingness.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: II.96.2
  kind: p
  original: Was hinter den juristischen Kulissen vorgeht, wo sich das wirkliche Leben abspielt, wie diese Freiwilligkeit zustande kommt, darum kann sich das Gesetz und der Jurist nicht kümmern.
  en: What passes behind the juridical scenes where the actual process of living is going on, and how this willingness is brought about, that cannot be the business of the law and the jurist.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '74'
- id: II.96.3
  kind: p
  original: Und doch sollte hier die einfachste Rechtsvergleichung dem Juristen zeigen, was es mit dieser Freiwilligkeit auf sich hat.
  en: Yet the simplest legal comparison should show to the jurist what this willingness really means.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 74-75
- id: II.96.4
  kind: p
  original: In den Ländern, wo den Kindern ein Pflichtteil am elterlichen Vermögen gesetzlich gesichert ist, wo sie also nicht enterbt werden können - in Deutschland, in den Ländern französischen Rechts etc., sind die Kinder beim Eheschluß an die Einwilligung der Eltern gebunden.
  en: In those countries where a legitimate portion of the parental wealth is assured to children and where these cannot be disinherited--in Germany, in countries with French law, etc.--the children are bound to secure the consent of their parents for marrying.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: II.96.5
  kind: p
  original: In den Ländern englischen Rechts, wo die elterliche Einwilligung kein gesetzliches Erfordernis des Eheschlusses, haben die Eltern auch volle Testierfreiheit über ihr Vermögen, können sie ihre Kinder nach Belieben enterben.
  en: In countries with English law, where the consent of the parents is by no means a legal qualification of marriage, the parents have full liberty to bequeath their wealth to anyone and may disinherit their children at will.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: II.96.6
  kind: p
  original: Daß trotzdem und eben deshalb die Freiheit der Eheschließung in den Klassen, wo es was zu erben gibt, in England und Amerika, tatsächlich um kein Haar größer ist als in Frankreich und Deutschland, das ist doch klar.
  en: Hence it is clear that among classes having any property to bequeath the freedom to marry is not a particle greater in England and America than in France and Germany.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: II.97.1
  kind: p
  original: Nicht besser steht es mit der juristischen Gleichberechtigung von Mann und Frau in der Ehe.
  en: The legal equality of man and woman in marriage is by no means better founded.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: II.97.2
  kind: p
  original: Die rechtliche Ungleichheit beider, die uns aus früheren Gesellschaftszuständen vererbt, ist nicht die Ursache, sondern die Wirkung der ökonomischen Unterdrückung der Frau.
  en: Their legal inequality inherited from earlier stages of society is not the cause, but the effect of the economic oppression of women.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: II.97.3
  kind: p
  original: In der alten kommunistischen Haushaltung, die viele Ehepaare und ihre Kinder umfaßte, war die den Frauen übergebne Führung des Haushalts ebensogut eine öffentliche, eine gesellschaftlich notwendige Industrie wie die Beschaffung der Nahrungsmittel durch die Männer.
  en: In the ancient communistic household comprising many married couples and their children, the administration of the household entrusted to women was just as much a public function, a socially necessary industry, as the procuring of food by men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: II.97.4
  kind: p
  original: Mit der patriarchalischen Familie und noch mehr mit der monogamen Einzelfamilie wurde dies anders.
  en: In the patriarchal and still more in the monogamous family this was changed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: II.97.5
  kind: p
  original: Die Führung des Haushalts verlor ihren öffentlichen Charakter.
  en: The administration of the household lost its public character.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: II.97.6
  kind: p
  original: Sie ging die Gesellschaft nichts mehr an.
  en: It was no longer a concern of society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: II.97.7
  kind: p
  original: Sie wurde ein Privatdienst; die Frau wurde erste Dienstbotin, aus der Teilnahme an der gesellschaftlichen Produktion verdrängt.
  en: It became a private service. The woman became the first servant of the house, excluded from participation in social production.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.97.8
  kind: p
  original: Erst die große Industrie unsrer Zeit hat ihr - und auch nur der Proletarierin - den Weg zur gesellschaftlichen Produktion wieder eröffnet.
  en: Only by the great industries of our time the access to social production was again opened for women--for proletarian women alone, however.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: II.97.9
  kind: p
  original: Aber so, daß, wenn sie ihre Pflichten im Privatdienst der Familie erfüllt, sie von der öffentlichen Produktion ausgeschlossen bleibt und nichts erwerben kann; und daß, wenn sie sich an der öffentlichen Industrie beteiligen und selbständig erwerben will, sie außerstand ist, Familienpflichten zu erfüllen.
  en: This is done in such a manner that they remain excluded from public production and cannot earn anything, if they fulfill their duties in the private service of the family; or that they are unable to attend to their family duties, if they wish to participate in public industries and earn a living independently.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: II.97.10
  kind: p
  original: Und wie in der Fabrik, so geht es der Frau in allen Geschäftszweigen, bis in die Medizin und Advokatur hinein.
  en: As in the factory, so women are situated in all business departments up to the medical and legal professions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: II.97.11
  kind: p
  original: Die moderne Einzelfamilie ist gegründet auf die offne oder verhüllte Haussklaverei der Frau, und die moderne Gesellschaft ist eine Masse, die aus lauter Einzelfamilien als ihren Molekülen sich zusammensetzt.
  en: The modern monogamous family is founded on the open or disguised domestic slavery of women, and modern society is a mass composed of molecules in the form of monogamous families.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: II.97.12
  kind: p
  original: Der Mann muß heutzutage in der großen Mehrzahl der Fälle der Erwerber, der Ernährer der Familie sein, wenigstens in den besitzenden Klassen, und das gibt ihm eine Herrscherstellung, die keiner juristischen Extrabevorrechtung bedarf.
  en: In the great majority of cases the man has to earn a living and to support his family, at least among the possessing classes. He thereby obtains a superior position that has no need of any legal special privilege.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.97.13
  kind: p
  original: Er ist in der Familie der Bourgeois, die Frau repräsentiert das Proletariat.
  en: In the family, he is the bourgeois, the woman represents the proletariat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '75'
- id: II.97.14
  kind: p
  original: In der industriellen Welt tritt aber der spezifische Charakter der auf dem Proletariat lastenden ökonomischen Unterdrückung erst dann in seiner vollen Schärfe hervor, nachdem alle gesetzlichen Sondervorrechte der Kapitalistenklasse beseitigt und die volle juristische Gleichberechtigung beider Klassen hergestellt worden; die demokratische Republik hebt den Gegensatz beider Klassen nicht auf, sie bietet im Gegenteil erst den Boden, worauf er ausgefochten wird.
  en: In the industrial world, however, the specific character of the economic oppression weighing on the proletariat appears in its sharpest outlines only after all special privileges of the capitalist class are abolished and the full legal equality of both classes is established. A democratic republic does not abolish the distinction between the two classes. On the contrary, it offers the battleground on which this distinction can be fought out.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 75-76
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.97.15
  kind: p
  original: Und ebenso wird auch der eigentümliche Charakter der Herrschaft des Mannes über die Frau in der modernen Familie und die Notwendigkeit wie die Art der Herstellung einer wirklichen gesellschaftlichen Gleichstellung beider erst dann in grelles Tageslicht treten, sobald beide juristisch vollkommen gleichberechtigt sind.
  en: Likewise the peculiar character of man's rule over woman in the modern family, the necessity and the manner of accomplishing the real social equality of the two, will appear in broad daylight only then, when both of them will enjoy complete legal equality.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: II.97.16
  kind: p
  original: Es wird sich dann zeigen, daß die Befreiung der Frau zur ersten Vorbedingung hat die Wiedereinführung des ganzen weiblichen Geschlechts in die öffentliche Industrie, und daß dies wieder erfordert die Beseitigung der Eigenschaft der Einzelfamilie als wirtschaftlicher Einheit der Gesellschaft.
  en: It will then be seen that the emancipation of women is primarily dependent on the re-introduction of the whole female sex into the public industries. To accomplish this, the monogamous family must cease to be the industrial unit of society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.98.1
  kind: p
  original: Wir haben demnach drei Hauptformen der Ehe, die im ganzen und großen den drei Hauptstadien der menschlichen Entwicklung entsprechen.
  en: We have, then, three main forms of the family, corresponding in general to the three main stages of human development.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: II.98.2
  kind: p
  original: Für die Wildheit die Gruppenehe, für die Barbarei die Paarungsehe, für die Zivilisation die Monogamie, ergänzt durch Ehebruch und Prostitution.
  en: For savagery group marriage, for barbarism the pairing family, for civilization monogamy supplemented by adultery and prostitution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: II.98.3
  kind: p
  original: Zwischen Paarungsehe und Monogamie schiebt sich ein, auf der Oberstufe der Barbarei, das Kommando der Männer über Sklavinnen und die Vielweiberei.
  en: Between the pairing family and monogamy, in the higher stage of barbarism, the rule of men over female slaves and polygamy is inserted.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: II.99.1
  kind: p
  original: Wie unsre ganze Darstellung bewiesen, ist der Fortschritt, der sich in dieser Reihenfolge aufzeigt, an die Eigentümlichkeit geknüpft, daß den Frauen die geschlechtliche Freiheit der Gruppenehe mehr und mehr entzogen wird, den Männern aber nicht.
  en: As we proved by our whole argument, the progress visible in this chain of phenomena is connected with the peculiarity of more and more curtailing the sexual freedom of the group marriage for women, but not for men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: II.99.2
  kind: p
  original: Und wirklich besteht die Gruppenehe für die Männer tatsächlich bis heute fort.
  en: And group marriage is actually practised by men to this day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: II.99.3
  kind: p
  original: Was bei der Frau ein Verbrechen ist und schwere gesetzliche und gesellschaftliche Folgen nach sich zieht, das gilt beim Mann für ehrenvoll oder doch schlimmstenfalls als ein leichter moralischer Makel, den man mit Vergnügen trägt.
  en: What is considered a crime for women and entails grave legal and social consequences for them, is considered honorable for men or in the worst case a slight moral blemish born with pleasure.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: II.99.4
  kind: p
  original: Je mehr aber der altherkömmliche Hetärismus in unsrer Zeit durch die kapitalistische Warenproduktion verändert und ihr angepaßt wird, je mehr er sich in unverhüllte Prostitution verwandelt, desto demoralisierender wirkt er.
  en: But the more traditional hetaerism is changed in our day by capitalistic production and conforms to it, the more hetaerism is transformed into undisguised prostitution, the more demoralizing are its effects.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: II.99.5
  kind: p
  original: Und zwar demoralisiert er die Männer noch weit mehr als die Frauen.
  en: And it demoralizes men far more than women.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: II.99.6
  kind: p
  original: Die Prostitution degradiert unter den Frauen nur die Unglücklichen, die ihr verfallen, und auch diese bei weitem nicht in dem Grad, wie gewöhnlich geglaubt wird.
  en: Prostitution does not degrade the whole female sex, but only the luckless women that become its victims, and even those not to the extent generally assumed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: II.99.7
  kind: p
  original: Dagegen erniedrigt sie den Charakter der gesamten Männerwelt.
  en: But it degrades the character of the entire male world.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: II.99.8
  kind: p
  original: So ist namentlich ein langer Bräutigamsstand in neun Fällen aus zehn eine förmliche Vorschule der ehelichen Untreue.
  en: Especially a long engagement is in nine cases out of ten a perfect training school of adultery.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '76'
- id: II.100.1
  kind: p
  original: Nun gehn wir einer gesellschaftlichen Umwälzung entgegen, wo die bisherigen ökonomischen Grundlagen der Monogamie ebenso sicher verschwinden werden wie die ihrer Ergänzung, der Prostitution.
  en: We are now approaching a social revolution, in which the old economic foundations of monogamy will disappear just as surely as those of its complement, prostitution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: II.100.2
  kind: p
  original: Die Monogamie entstand aus der Konzentrierung größerer Reichtümer in einer Hand- und zwar der eines Mannes - und aus dem Bedürfnis, diese Reichtümer den Kindern dieses Mannes und keines andern zu vererben.
  en: Monogamy arose through the concentration of considerable wealth in one hand--a man's hand--and from the endeavor to bequeath this wealth to the children of this man to the exclusion of all others.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: II.100.3
  kind: p
  original: Dazu war Monogamie der Frau erforderlich, nicht des Mannes, so daß diese Monogamie der Frau der offnen oder verdeckten Polygamie des Mannes durchaus nicht im Wege stand.
  en: This necessitated monogamy on the woman's, but not on the man's part. Hence this monogamy of women in no way hindered open or secret polygamy of men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.100.4
  kind: p
  original: Die bevorstehende gesellschaftliche Umwälzung wird aber durch Verwandlung wenigstens des unendlich größten Teils der dauernden, vererbbaren Reichtümer - der Produktionsmittel - in gesellschaftliches Eigentum diese ganze Vererbungssorge auf ein Minimum reduzieren.
  en: Now, the impending social revolution will reduce this whole care of inheritance to a minimum by changing at least the overwhelming part of permanent and inheritable wealth--the means of production--into social property.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: II.100.5
  kind: p
  original: Da nun die Monogamie aus ökonomischen Ursachen entstanden, wird sie verschwinden, wenn diese Ursachen verschwinden?
  en: Since monogamy was caused by economic conditions, will it disappear when these causes are abolished?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: II.101.1
  kind: p
  original: 'Man könnte nicht mit Unrecht antworten: Sie wird so wenig verschwinden, daß sie vielmehr erst vollauf verwirklicht werden wird.'
  en: 'One might reply, not without reason: not only will it not disappear, but it will rather be perfectly realized.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: II.101.2
  kind: p
  original: Denn mit der Verwandlung der Produktionsmittel in gesellschaftliches Eigentum verschwindet auch die Lohnarbeit, das Proletariat, also auch die Notwendigkeit für eine gewisse - statistisch berechenbare - Zahl von Frauen, sich für Geld preiszugeben.
  en: For with the transformation of the means of production into collective property, wage labor will also disappear, and with it the proletariat and the necessity for a certain, statistically ascertainable number of women to surrender for money.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: II.101.3
  kind: p
  original: Die Prostitution verschwindet, die Monogamie, statt unterzugehn, wird endlich eine Wirklichkeit - auch für die Männer.
  en: Prostitution disappears and monogamy, instead of going out of existence, at last becomes a reality--for men also.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: II.102.1
  kind: p
  original: Die Lage der Männer wird also jedenfalls sehr verändert.
  en: At all events, the situation will be very much changed for men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: II.102.2
  kind: p
  original: Aber auch die der Frauen, aller Frauen, erfährt bedeutenden Wechsel.
  en: But also that of women, and of all women, will be considerably altered.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: II.102.3
  kind: p
  original: Mit dem Übergang der Produktionsmittel in Gemeineigentum hört die Einzelfamilie auf, wirtschaftliche Einheit der Gesellschaft zu sein.
  en: With the transformation of the means of production into collective property the monogamous family ceases to be the economic unit of society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: II.102.4
  kind: p
  original: Die Privathaushaltung verwandelt sich in eine gesellschaftliche Industrie.
  en: The private household changes to a social industry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: II.102.5
  kind: p
  original: Die Pflege und Erziehung der Kinder wird öffentliche Angelegenheit; die Gesellschaft sorgt für alle Kinder gleichmäßig, seien sie eheliche oder uneheliche.
  en: The care and education of children becomes a public matter. Society cares equally well for all children, legal or illegal.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.102.6
  kind: p
  original: Damit fällt die Sorge weg wegen der "Folgen", die heute das wesentlichste gesellschaftliche - moralische wie ökonomische - Moment bildet, das die rücksichtslose Hingabe eines Mädchens an den geliebten Mann verhindert.
  en: This removes the care about the "consequences" which now forms the essential social factor--moral and economic--hindering a girl to surrender unconditionally to the beloved man.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: II.102.7
  kind: p
  original: Wird das nicht Ursache genug sein zum allmählichen Aufkommen eines ungenierteren Geschlechtsverkehrs und damit auch einer laxeren öffentlichen Meinung von wegen jungfräulicher Ehre und weiblicher Schande?
  en: Will not this be sufficient cause for a gradual rise of a more unconventional intercourse of the sexes and a more lenient public opinion regarding virgin honor and female shame?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: II.102.8
  kind: p
  original: Und endlich, haben wir nicht gesehn, daß in der modernen Welt Monogamie und Prostitution zwar Gegensätze, aber untrennbare Gegensätze, Pole desselben Gesellschaftszustandes sind?
  en: And finally, did we not see that in the modern world monogamy and prostitution, though antitheses, are inseparable and poles of the same social condition?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: II.102.9
  kind: p
  original: Kann die Prostitution verschwinden, ohne die Monogamie mit sich in den Abgrund zu ziehn?
  en: Can prostitution disappear without engulfing at the same time monogamy?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '77'
- id: II.103.1
  kind: p
  original: 'Hier tritt ein neues Moment in Wirksamkeit, ein Moment, das zur Zeit, als die Monogamie sich ausbildete, höchstens im Keim bestand: die individuelle Geschlechtsliebe.'
  en: 'Here a new element becomes active, an element which at best existed only in the germ at the time when monogamy developed: individual sexlove.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '78'
- id: II.104.1
  kind: p
  original: Vor dem Mittelalter kann von individueller Geschlechtsliebe nicht die Rede sein.
  en: Before the middle ages we cannot speak of individual sexlove.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '78'
- id: II.104.2
  kind: p
  original: Daß persönliche Schönheit, vertrauter Umgang, gleichgestimmte Neigungen etc. bei Leuten verschiednen Geschlechts das Verlangen zu geschlechtlichem Verkehr erweckt haben, daß es den Männern wie den Frauen nicht total gleichgültig war, mit wem sie in dies intimste Verhältnis traten, das ist selbstredend.
  en: It goes without saying that personal beauty, intimate intercourse, harmony of inclinations, etc., awakened a longing for sexual intercourse in persons of different sex, and that it was not absolutely immaterial to men and women, with whom they entered into such most intimate intercourse.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '78'
- id: II.104.3
  kind: p
  original: Aber von da bis zu unsrer Geschlechtsliebe ist noch unendlich weit.
  en: But from such a relation to our sexlove there is a long way yet.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '78'
- id: II.104.4
  kind: p
  original: Im ganzen Altertum werden die Ehen von den Eltern für die Beteiligten geschlossen, und diese finden sich ruhig hinein.
  en: All through antiquity marriages were arranged for the participants by the parents, and the former quietly submitted.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '78'
- id: II.104.5
  kind: p
  original: Das bißchen eheliche Liebe, das das Altertum kennt, ist nicht etwa subjektive Neigung, sondern objektive Pflicht, nicht Grund, sondern Korrelat der Ehe.
  en: What little matrimonial love was known to antiquity was not subjective inclination, but objective duty; not cause, but corollary of marriage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '78'
- id: II.104.6
  kind: p
  original: Liebesverhältnisse im modernen Sinne kommen im Altertum nur vor außerhalb der offiziellen Gesellschaft.
  en: Love affairs in a modern sense occurred in classical times only outside of official society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '78'
- id: II.104.7
  kind: p
  original: Die Hirten, deren Liebesfreuden und Leiden Theokrit und Moschos uns besingen, der Daphnis und die Chloë des Longos, sind lauter Sklaven, die keinen Teil haben am Staat, der Lebenssphäre des freien Bürgers.
  en: The shepherds whose happiness and woe in love is sung by Theocritos and Moschus, such as Daphnis and Chloe of Longos, all these were slaves who had no share in the state and in the daily sphere of the free citizen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '78'
- id: II.104.8
  kind: p
  original: 'Außer bei Sklaven aber finden wir Liebeshändel nur als Zersetzungsprodukte der untergehenden Alten Welt und mit Frauen, die ebenfalls außerhalb der offiziellen Gesellschaft stehn, mit Hetären, also mit Fremden oder Freigelassenen: in Athen vom Vorabend seines Untergangs an, in Rom zur Kaiserzeit.'
  en: 'Outside of slave circles we find love affairs only as products of disintegration of the sinking old world. Their objects are women who also are standing outside of official society, hetaerae that are either foreigners or liberated slaves: in Athens since the beginning of its decline, in Rome at the time of the emperors.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '78'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.104.9
  kind: p
  original: Kamen Liebeshändel wirklich vor zwischen freien Bürgern und Bürgerinnen, so nur von wegen des Ehebruchs.
  en: If love affairs really occurred between free male and female citizens, it was only in the form of adultery.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '78'
- id: II.104.10
  kind: p
  original: Und dem klassischen Liebesdichter des Altertums, dem alten Anakreon, war die Geschlechtsliebe, in unserm Sinne, so sehr Wurst, daß ihm sogar das Geschlecht des geliebten Wesens Wurst war.
  en: And to the classical love poet of antiquity, the old Anakreon, sexlove in our sense was so immaterial, that he did not even care a fig for the sex of the beloved being.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '78'
- id: II.105.1
  kind: p
  original: Unsre Geschlechtsliebe unterscheidet sich wesentlich vom einfachen geschlechtlichen Verlangen, dem Eros, der Alten.
  en: Our sexlove is essentially different from the simple sexual craving, the Eros, of the ancients.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '78'
- id: II.105.2
  kind: p
  original: Erstens setzt sie beim geliebten Wesen Gegenliebe voraus; die Frau steht insoweit dem Manne gleich, während sie beim antiken Eros keineswegs immer gefragt wird.
  en: In the first place it presupposes mutual love. In this respect woman is the equal of man, while in the antique Eros her permission is by no means always asked.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '78'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.105.3
  kind: p
  original: Zweitens hat die Geschlechtsliebe einen Grad von Intensität und Dauer, der beiden Teilen Nichtbesitz und Trennung als ein hohes, wo nicht das höchste, Unglück erscheinen läßt; um sich gegenseitig besitzen zu können, spielen sie hohes Spiel, bis zum Einsatz des Lebens, was im Altertum höchstens beim Ehebruch vorkam.
  en: In the second place our sexlove has such a degree of intensity and duration that in the eyes of both parties lack of possession and separation appear as a great, if not the greatest, calamity. In order to possess one another they play for high stakes, even to the point of risking their lives, a thing heard of only in adultery during the classical age.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '78'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.105.4
  kind: p
  original: 'Und endlich entsteht ein neuer sittlicher Maßstab für die Beurteilung des geschlechtlichen Umgangs; man fragt nicht nur: war er ehelich oder außerehelich, sondern auch: entsprang er der Liebe und Gegenliebe oder nicht?'
  en: 'And finally a new moral standard is introduced for judging sexual intercourse. We not only ask: "Was it legal or illegal?" but also: "Was it caused by mutual love or not?"'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '78'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.105.5
  kind: p
  original: Es versteht sich, daß es diesem neuen Maßstab in der feudalen oder bürgerlichen Praxis nicht besser ergeht als allen andern Maßstäben der Moral - man setzt sich über ihn hinweg.
  en: Of course, this new standard meets with no better fate in feudal or bourgeois practice than all other moral standards--it is simply ignored.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 78-79
- id: II.105.6
  kind: p
  original: Aber es ergeht ihm auch nicht schlechter.
  en: But neither does it fare worse.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '79'
- id: II.105.7
  kind: p
  original: Er wird ebensogut wie sie anerkannt - in der Theorie, auf dem Papier.
  en: It is recognized just as much as the others--in theory, on paper.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '79'
- id: II.105.8
  kind: p
  original: Und mehr kann er vorderhand nicht verlangen.
  en: And that is all we can expect at present.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '79'
- id: II.106.1
  kind: p
  original: 'Wo das Altertum abgebrochen mit seinen Anläufen zur Geschlechtsliebe, da setzt das Mittelalter wieder an: beim Ehebruch.'
  en: 'Where antiquity left off with its attempts at sexual love, there the middle ages resumed the thread: with adultery.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '79'
- id: II.106.2
  kind: p
  original: Wir haben die ritterliche Liebe bereits geschildert, die die Tagelieder erfand.
  en: We have already described the love of the knights that invented the day songs.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '79'
- id: II.106.3
  kind: p
  original: Von dieser Liebe, die die Ehe brechen will, bis zu der, die sie gründen soll, ist noch ein weiter Weg, den das Rittertum nie vollauf zurücklegt.
  en: From this love endeavoring to break through the bonds of marriage to the love destined to found marriage, there is a long distance which was never fully traversed by the knights.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '79'
- id: II.106.4
  kind: p
  original: 'Selbst wenn wir von den frivolen Romanen zu den tugendsamen Deutschen übergehn, finden wir im "Nibelungenlied", daß Kriemhild zwar im stillen nicht minder in Siegfried verliebt ist als er in sie, daß sie aber dennoch auf Günthers Anzeige, er habe sie einem Ritter zugeschworen, den er nicht nennt, einfach antwortet:'
  en: 'Even in passing on from the frivolous Romanic race to the virtuous Germans, we find in the Nibelungen song Kriemhild, who secretly is no less in love with Siegfried than he with her, meekly replying to Gunther''s announcement that he has pledged her in troth to a certain knight whom he does not name: "You need not beg for my consent; as you will demand, so I shall ever be; whomever you, sir, will select for my husband, I shall willingly take in troth."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '79'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.107.1
  kind: p
  original: '"Ihr braucht mich nicht zu bitten; wie Ihr mir gebietet, so will ich immer sein; den Ihr, Herr, mir gebt zum Mann, dem will ich mich gern verloben."'
  en: ''
  joined_to: II.106.4
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '79'
- id: II.108.1
  kind: p
  original: Es fällt ihr gar nicht in den Sinn, daß ihre Liebe hier überhaupt in Betracht kommen kann.
  en: It does not enter her head at all that her love could find any consideration.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '79'
- id: II.108.2
  kind: p
  original: Günther wirbt um Brünhild, Etzel um Kriemhild, ohne sie je gesehn zu haben; ebenso in der "Gutrun" Siegebant von Irland um die norwegische Ute, Hetel von Hegelingen um Hilde von Irland, endlich Siegfried von Morland, Hartmut von Ormanien und Herwig von Seeland um Gutrun; und hier erst kommt es vor, daß diese sich freiwillig für letzteren entscheidet.
  en: Gunther asks for Brunhild, Etzel for Kriemhild without ever having seen one another. The same is true of the suit of Gutrun Sigebant of Ireland for the Norwegian Ute and of Hetel of Hegelingen for Hilda of Ireland. When Siegfried of Morland, Hartmut of Oranien and Herwig of Sealand court Gutrun, then it happens for the first time that the lady voluntarily decides, favoring the last named knight.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '79'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.108.3
  kind: p
  original: In der Regel wird die Braut des jungen Fürsten ausgesucht von dessen Eltern, wenn sie noch leben, sonst von ihm selbst unter Beirat der großen Lehenträger, die in allen Fällen ein gewichtiges Wort dabei mitsprechen.
  en: As a rule the bride of the young prince is selected by his parents. Only when the latter are no longer alive, he chooses his own bride with the advice of the great feudal lords who in all cases of this kind have a decisive voice.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '79'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.108.4
  kind: p
  original: Es kann auch gar nicht anders sein.
  en: Nor could it be otherwise.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '79'
- id: II.108.5
  kind: p
  original: Für den Ritter oder Baron wie für den Landesfürsten selbst ist die Verheiratung ein politischer Akt, eine Gelegenheit der Machtvergrößerung durch neue Bündnisse; das Interesse des Hauses hat zu entscheiden, nicht das Belieben des einzelnen.
  en: For the knight and the baron as well as for the ruler of the realm himself, marriage is a political act, an opportunity for increasing their power by new federations. The interest of the house must decide, not the arbitrary inclination of the individual.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '79'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.108.6
  kind: p
  original: Wie soll da die Liebe in die Lage kommen, das letzte Wort zu sprechen über den Eheschluß?
  en: How could love have a chance to decide the question of marriage in the last instance under such conditions?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '79'
- id: II.109.1
  kind: p
  original: Nicht anders mit dem Zunftbürger der mittelalterlichen Städte.
  en: The same held good for the bourgeois of the medieval towns, the members of the guilds.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '79'
- id: II.109.2
  kind: p
  original: Gerade die ihn schützenden Privilegien, die verklausulierten Zunftordnungen, die verkünstelten Grenzlinien, die ihn gesetzlich schieden, hier von den andern Zünften, dort von seinen eignen Zunftgenossen, da von seinen Gesellen und Lehrlingen, zogen den Kreis schon eng genug, aus dem er sich eine passende Gattin suchen konnte.
  en: Precisely the privileges protecting them, the clauses and restrictions of the guild charters, the artificial lines of division separating them legally, here from the other guilds, there from their journeymen and apprentices, drew a sufficiently narrow circle for the selection of a fitting bourgeois spouse.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '79'
- id: II.109.3
  kind: p
  original: Und welche unter ihnen die passendste war, das entschied unter diesem verwickelten System unbedingt nicht sein individuelles Belieben, sondern das Familieninteresse.
  en: Under such a complicated system, the question of fitness was unconditionally decided, not by individual inclination, but by family interests.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '79'
- id: II.110.1
  kind: p
  original: So blieb also in der unendlichen Mehrzahl der Fälle der Eheschluß bis zum Ende des Mittelalters, was er von Anfang an gewesen, eine Sache, die nicht von den Beteiligten entschieden wurde.
  en: 'In the overwhelming majority of cases the marriage contract thus remained to the end of the middle ages what it had been from the outset: a matter that was not decided by the parties most interested.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '80'
- id: II.110.2
  kind: p
  original: Im Anfang kam man bereits verheiratet auf die Welt - verheiratet mit einer ganzen Gruppe des andern Geschlechts.
  en: In the beginning one was already married from his birth--married to a whole group of the other sex.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '80'
- id: II.110.3
  kind: p
  original: In den späteren Formen der Gruppenehe fand wahrscheinlich ein ähnliches Verhältnis statt, nur unter stets wachsender Verengerung der Gruppe.
  en: In the later forms of group marriage, a similar relation was probably maintained, only under a continual narrowing of the group.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '80'
- id: II.110.4
  kind: p
  original: In der Paarungsehe ist es Regel, daß die Mütter die Ehen ihrer Kinder verabreden; auch hier entscheiden Rücksichten auf neue Verwandtschaftsbande, die dem jungen Paar eine stärkere Stellung in Gens und Stamm verschaffen sollen.
  en: In the pairing family it is the rule for mothers to exchange mutual pledges for the marriage of their children. Here also the main consideration is given to new ties of relationship that will strengthen the position of the young couple in the gens and the tribe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '80'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.110.5
  kind: p
  original: Und als mit dem Überwiegen des Privateigentums über das Gemeineigentum und mit dem Interesse an der Vererbung das Vaterrecht und die Monogamie zur Herrschaft kamen, da wurde der Eheschluß erst recht abhängig von ökonomischen Rücksichten.
  en: And when with the preponderance of private property over collective property and with the interest for inheritance paternal law and monogamy assumed the supremacy, then marriage became still more dependent on economic considerations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '80'
- id: II.110.6
  kind: p
  original: Die Form der Kaufehe verschwindet, die Sache wird in stets steigendem Maß durchgeführt, so daß nicht nur die Frau, sondern auch der Mann einen Preis erhält - nicht nach seinen persönlichen Eigenschaften, sondern nach seinem Besitz.
  en: The form of purchase marriage disappears, but the essence of the transaction is more and more intensified, so that not only the woman, but also the man have a fixed price--not according to his qualities, but to his wealth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '80'
- id: II.110.7
  kind: p
  original: Daß die gegenseitige Neigung der Beteiligten der alles andre überwiegende Grund des Eheschlusses sein sollte, das war in der Praxis der herrschenden Klassen unerhört geblieben von Anfang an; so etwas kam vor höchstens in der Romantik oder - bei den unterdrückten Klassen, die nicht zählten.
  en: That mutual fondness of the marrying parties should be the one factor dominating all others had always been unheard of in the practice of the ruling classes. Such a thing occurred at best in romances or--among the oppressed classes that were not counted.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '80'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.111.1
  kind: p
  original: Das war der Zustand, den die kapitalistische Produktion vorfand, als sie, seit dem Zeitalter der geographischen Entdeckungen, durch den Welthandel und die Manufaktur sich anschickte zur Weltherrschaft.
  en: This was the situation encountered by capitalist production when it began to prepare, since the epoch of geographical discoveries, for the conquest of the world by international trade and manufacture.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '80'
- id: II.111.2
  kind: p
  original: Man sollte meinen, dieser Modus der Eheschließung habe ihr ausnehmend gepaßt, und so war es auch.
  en: One would think that this mode of making the marriage contract would have been extremely acceptable to capitalism, and it was.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '80'
- id: II.111.3
  kind: p
  original: Und dennoch - die Ironie der Weltgeschichte ist unergründlich - war sie es, die die entscheidende Bresche in ihn legen mußte.
  en: And yet--the irony of fate is inexplicable--capitalist production had to make the decisive breach through this mode.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '80'
- id: II.111.4
  kind: p
  original: Indem sie alle Dinge in Waren verwandelte, löste sie alle überkommenen, altherkömmlichen Verhältnisse auf, setzte an die Stelle der ererbten Sitte, des historischen Rechts, den Kauf und Verkauf, den "freien" Vertrag; wie denn der englische Jurist H. S. Maine glaubte eine ungeheure Entdeckung gemacht zu haben, als er sagte, unser ganzer Fortschritt gegen frühere Epochen bestehe darin, daß wir gekommen seien from Status to contract, von erblich überkommenen zu freiwillig kontrahierten Zuständen, was freilich schon im "Kommunistischen Manifest" stand, soweit es richtig ist.
  en: By changing all things into commodities, it dissolved all inherited and traditional relations and replaced time hallowed custom and historical right by purchase and sale, by the "free contract." And the English jurist, H. S. Maine, thought he had made a stupendous discovery by saying that our whole progress over former epochs consisted in arriving from status to contract, from inherited to voluntarily contracted conditions. So far as this is correct, it had already been mentioned in the Communist Manifesto.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '80'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.112.1
  kind: p
  original: Zum Vertragschließen gehören aber Leute, die frei über ihre Personen, Handlungen und Besitztümer verfügen können und die einander gleichberechtigt gegenüberstehn.
  en: But in order to make contracts, people must have full freedom over their persons, actions and possessions. They must furthermore be on terms of mutual equality.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '80'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.112.2
  kind: p
  original: Diese "freien" und "gleichen" Leute zu schaffen, war grade eine der Hauptarbeiten der kapitalistischen Produktion.
  en: The creation of these "free" and "equal" people was precisely one of the main functions of capitalistic production.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 80-81
- id: II.112.3
  kind: p
  original: Geschah dies auch im Anfang noch in nur halbbewußter, obendrein religiös verkleideter Weise, so stand doch von der lutherischen und calvinischen Reformation an der Satz fest, daß der Mensch nur dann für seine Handlungen vollauf verantwortlich sei, wenn er sie in voller Freiheit des Willens begangen, und daß es sittliche Pflicht sei, Widerstand zu leisten gegen jeden Zwang zu unsittlicher Tat.
  en: What though this was done at first in a half-conscious way and, moreover, in a religious disguise? Since the Lutheran and Calvinist reformation the thesis was accepted that a human being is fully responsible for his actions only then, when these actions were due to full freedom of will. And it was held to be a moral duty to resist any compulsion for an immoral action.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '81'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.112.4
  kind: p
  original: Wie reimte sich dies aber mit der bisherigen Praxis der Eheschließung?
  en: How did this agree with the prevailing practice of match-making?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '81'
- id: II.112.5
  kind: p
  original: Die Ehe war nach bürgerlicher Auffassung ein Vertrag, ein Rechtsgeschäft, und zwar das wichtigste von allen, weil es über Körper und Geist von zwei Menschen auf Lebenszeit Verfügung traf.
  en: Marriage according to bourgeois conception was a contract, a legal business affair, and the most important one at that, because it decided the weal and woe of body and spirit of two beings for life.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '81'
- id: II.112.6
  kind: p
  original: Es wurde damals zwar formell freiwillig geschlossen; ohne das Jawort der Beteiligten ging es nicht.
  en: At that time the agreement was formally voluntary; without the consent of the contracting parties nothing could be done.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '81'
- id: II.112.7
  kind: p
  original: Aber man wußte nur zu gut, wie das Jawort zustande kam und wer die eigentlichen Eheschließer waren.
  en: But it was only too well known how this consent was obtained and who were really the contracting parties.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '81'
- id: II.112.8
  kind: p
  original: Wenn aber zu allen andern Verträgen wirkliche Freiheit der Entschließung gefordert wurde, warum nicht zu diesem?
  en: If, however, perfect freedom of decision is demanded for all other contracts, why not for this one?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '81'
- id: II.112.9
  kind: p
  original: Hatten die zwei jungen Leute, die verkuppelt werden sollten, nicht auch das Recht, über sich selbst, über ihren Leib und dessen Organe frei zu verfügen?
  en: Did not the two young people who were to be coupled together have the right freely to dispose of themselves, of their bodies and the organs of these?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '81'
- id: II.112.10
  kind: p
  original: War nicht die Geschlechtsliebe durch das Rittertum in die Mode gekommen und war, gegenüber der ritterlichen Ehebruchsliebe, nicht die Liebe der Ehegatten ihre richtige bürgerliche Form?
  en: Had not sexual love become the custom through the knights and was not, in opposition to knightly adultery, the love of married couples its proper bourgeois form?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '81'
- id: II.112.11
  kind: p
  original: Wenn es aber Pflicht der Eheleute, einander zu lieben, war es nicht ebensosehr Pflicht der Liebenden, einander zu heiraten und niemand anders?
  en: And if it was the duty of married couples to love one another, was it not just as much the duty of lovers to marry each other and nobody else?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '81'
- id: II.112.12
  kind: p
  original: Stand dies Recht der Liebenden nicht höher als das Recht der Eltern, Verwandten und sonstigen hergebrachten Heiratsmakler und Ehekuppler?
  en: Stood not the right of lovers higher than the right of parents, relatives and other customary marriage brokers and matrimonial agents?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '81'
- id: II.112.13
  kind: p
  original: Brach das Recht der freien persönlichen Prüfung ungeniert in Kirche und Religion ein, wie sollte es stehenbleiben vor dem unerträglichen Anspruch der älteren Generation, über Leib, Seele, Vermögen, Glück und Unglück der jüngeren zu verfügen?
  en: If the right of free personal investigation made its way unchecked into the church and religion, how could it bear with the insupportable claims of the older generation on the body, soul, property, happiness and misfortune of the younger generation?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '81'
- id: II.113.1
  kind: p
  original: Diese Fragen mußten aufgeworfen werden zu einer Zeit, die alle alten Bande der Gesellschaft auflockerte und alle ererbten Vorstellungen ins Wanken brachte.
  en: These questions had to be raised at a time when all the old ties of society were loosened and all traditional conceptions tottering.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '81'
- id: II.113.2
  kind: p
  original: Die Welt war mit einem Schlage fast zehnmal größer geworden; statt eines Quadranten einer Halbkugel lag jetzt die ganze Erdkugel vor dem Blick der Westeuropäer, die sich beeilten, die andern sieben Quadranten in Besitz zu nehmen.
  en: The size of the world had increased tenfold at a bound. Instead of one quadrant of one hemisphere, the whole globe now spread before the eyes of West Europeans who hastened to take possession of the other seven quadrants.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '81'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.113.3
  kind: p
  original: Und wie die alten engen Heimatsschranken, so fielen auch die tausendjährigen Schranken der mittelalterlichen vorgeschriebnen Denkweise.
  en: And the thousand-year-old barriers of conventional medieval thought fell like the old narrow obstacles to marriage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '81'
- id: II.113.4
  kind: p
  original: Dem äußern wie dem innern Auge des Menschen öffnete sich ein unendlich weiterer Horizont.
  en: An infinitely wider horizon opened out before the outer and inner eyes of humanity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '81'
- id: II.113.5
  kind: p
  original: Was galt die Wohlmeinung der Ehrbarkeit, was das durch Geschlechter vererbte ehrsame Zunftprivilegium dem jungen Mann, den die Reichtümer Indiens, die Gold- und Silberminen Mexikos und Potosis anlockten.
  en: What mattered the well-meaning propriety, what the honorable privilege of the guild overcome through generations to the young man tempted by the gold and silver mines of Mexico and Potosi?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '81'
- id: II.113.6
  kind: p
  original: Es war die fahrende Ritterzeit des Bürgertums; sie hatte auch ihre Romantik und ihre Liebesschwärmerei, aber auf bürgerlichem Fuß und mit in letzter Instanz bürgerlichen Zielen.
  en: It was the knight errant time of the bourgeoisie. It had its own romances and love dreams, but on a bourgeois footing and, in the last instance, with bourgeois aims.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 81-82
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.114.1
  kind: p
  original: So geschah es, daß das aufkommende Bürgertum, namentlich der protestantischen Länder, wo am meisten am Bestehenden gerüttelt wurde, auch für die Ehe die Freiheit der Vertragschließung mehr und mehr anerkannte und in der oben geschilderten Weise durchführte.
  en: Thus it came about that the rising bourgeoisie more and more recognized the freedom of contracting in marriage and carried it through in the manner described above, especially in Protestant countries, where existing institutions were most strongly shaken.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '82'
- id: II.114.2
  kind: p
  original: Die Ehe blieb Klassenehe, aber innerhalb der Klasse wurde den Beteiligten ein gewisser Grad von Freiheit der Wahl zugestanden.
  en: Marriage remained class marriage, but within the class a certain freedom of choice was accorded to the contracting parties.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '82'
- id: II.114.3
  kind: p
  original: Und auf dem Papier, in der moralischen Theorie wie in der poetischen Schilderung, stand nichts unerschütterlicher fest, als daß jede Ehe unsittlich, die nicht auf gegenseitiger Geschlechtsliebe und wirklich freier Übereinkunft der Gatten beruht.
  en: And on paper, in moral theory as in poetical description, nothing was more unalterably established than the idea that every marriage was immoral unless founded on mutual sex-love and perfectly free agreement of husband and wife.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '82'
- id: II.114.4
  kind: p
  original: Kurzum, die Liebesehe war proklamiert als Menschenrecht, und zwar nicht nur als droit de l'homme, sondern auch ausnahmsweise als droit de la femme.
  en: In short, the love match was proclaimed as a human right, not only as droit de l'homme--man's right--but also for once as droit de femme--woman's right.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '82'
- id: II.115.1
  kind: p
  original: Dies Menschenrecht unterschied sich aber in einem Punkt von allen übrigen sogenannten Menschenrechten.
  en: However, this human right differed from all other so-called human rights in one respect.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '82'
- id: II.115.2
  kind: p
  original: Während diese in der Praxis auf die herrschende Klasse, die Bourgeoisie, beschränkt blieben und der unterdrückten Klasse, dem Proletariat, direkt oder indirekt verkümmert wurden, bewährt sich hier wieder die Ironie der Geschichte.
  en: While in practice other rights remained the privileges of the ruling class, the bourgeoisie, and were directly or indirectly curtailed for proletarians, the irony of history once more asserted itself in this case.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '82'
- id: II.115.3
  kind: p
  original: Die herrschende Klasse bleibt beherrscht von den bekannten ökonomischen Einflüssen und weist daher nur in Ausnahmefällen wirklich frei geschlossene Ehen auf, während diese bei der beherrschten Klasse, wie wir sahen, die Regel sind.
  en: The ruling class remains subject to well-known economic influences and, therefore, shows marriage by free selection only in exceptional cases. But among the oppressed class, love matches are the rule, as we have seen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '82'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.116.1
  kind: p
  original: Die volle Freiheit der Eheschließung kann also erst dann allgemein durchgeführt werden, wenn die Beseitigung der kapitalistischen Produktion und der durch sie geschaffnen Eigentumsverhältnisse alle die ökonomischen Nebenrücksichten entfernt hat, die jetzt noch einen so mächtigen Einfluß auf die Gattenwahl ausüben.
  en: Hence the full freedom of marriage can become general only after all minor economic considerations, that still exert such a powerful influence on the choice of a mate for life, have been removed by the abolition of capitalistic production and of the property relations created by it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '82'
- id: II.116.2
  kind: p
  original: Dann bleibt eben kein andres Motiv mehr als die gegenseitige Zuneigung.
  en: Then no other motive will remain but mutual fondness.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '82'
- id: II.117.1
  kind: p
  original: Da nun die Geschlechtsliebe ihrer Natur nach ausschließlich ist - obwohl sich diese Ausschließlichkeit heutzutage nur in der Frau durchweg verwirklicht -, so ist die auf Geschlechtsliebe begründete Ehe ihrer Natur nach Einzelehe.
  en: Since sexlove is exclusive by its very nature--although this exclusiveness is at present realized for women alone--marriage founded on sexlove must be monogamous.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '82'
- id: II.117.2
  kind: p
  original: Wir haben gesehn, wie recht Bachofen hatte, wenn er den Fortschritt von der Gruppenehe zur Einzelehe vorwiegend als das Werk der Frauen ansah; nur der Fortgang von der Paarungsehe zur Monogamie kommt auf Rechnung der Männer; und er bestand, historisch, wesentlich in einer Verschlechterung der Stellung der Frauen und einer Erleichterung der Untreue der Männer.
  en: We have seen that Bachofen was perfectly right in regarding the progress from group marriage to monogamy mainly as the work of women. Only the advance from the pairing family to monogamy must be charged to the account of men. This advance implied, historically, a deterioration in the position of women and a greater opportunity for men to be faithless.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '82'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: II.117.3
  kind: p
  original: Fallen nun noch die ökonomischen Rücksichten weg, infolge deren die Frauen sich diese gewohnheitsmäßige Untreue der Männer gefallen ließen - die Sorge um ihre eigne Existenz und noch mehr die um die Zukunft der Kinder -, so wird die damit erreichte Gleichstellung der Frau aller bisherigen Erfahrung nach in unendlich stärkerem Maß dahin wirken, daß die Männer wirklich monogam werden, als dahin, daß die Frauen polyandrisch.
  en: Remove the economic considerations that now force women to submit to the customary disloyalty of men, and you will place women on a equal footing with men. All present experiences prove that this will tend much more strongly to make men truly monogamous, than to make women polyandrous.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 82-83
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.118.1
  kind: p
  original: Was aber von der Monogamie ganz entschieden wegfallen wird, das sind alle die Charaktere, die ihr durch ihr Entstehn aus den Eigentumsverhältnissen aufgedrückt wurden, und diese sind erstens die Vorherrschaft des Mannes und zweitens die Unlösbarkeit.
  en: However, those peculiarities that were stamped upon the face of monogamy by its rise through property relations, will decidedly vanish, namely the supremacy of men and the indissolubility of marriage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '83'
- id: II.118.2
  kind: p
  original: Die Vorherrschaft des Mannes in der Ehe ist einfache Folge seiner ökonomischen Vorherrschaft und fällt mit dieser von selbst.
  en: The supremacy of man in marriage is simply the consequence of his economic superiority and will fall with the abolition of the latter.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '83'
- id: II.118.3
  kind: p
  original: Die Unlösbarkeit der Ehe ist teils Folge der ökonomischen Lage, unter der die Monogamie entstand, teils Tradition aus der Zeit, wo der Zusammenhang dieser ökonomischen Lage mit der Monogamie noch nicht recht verstanden und religiös outriert wurde.
  en: The indissolubility of marriage is partly the consequence of economic conditions, under which monogamy arose, partly tradition from the time where the connection between this economic situation and monogamy, not yet clearly understood, was carried to extremes by religion.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '83'
- id: II.118.4
  kind: p
  original: Sie ist schon heute tausendfach durchbrochen.
  en: To-day, it has been perforated a thousand times.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '83'
- id: II.118.5
  kind: p
  original: Ist nur die auf Liebe gegründete Ehe sittlich, so auch nur die, worin die Liebe fortbesteht.
  en: If marriage founded on love is alone moral, then it follows that marriage is moral only as long as love lasts.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '83'
- id: II.118.6
  kind: p
  original: Die Dauer des Anfalls der individuellen Geschlechtsliebe ist aber nach den Individuen sehr verschieden, namentlich bei den Männern, und ein positives Aufhören der Zuneigung oder ihre Verdrängung durch eine neue leidenschaftliche Liebe macht die Scheidung für beide Teile wie für die Gesellschaft zur Wohltat.
  en: The duration of an attack of individual sexlove varies considerably according to individual disposition, especially in men. A positive cessation of fondness or its replacement by a new passionate love makes a separation a blessing for both parties and for society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '83'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.118.7
  kind: p
  original: Nur wird man den Leuten ersparen, durch den nutzlosen Schmutz eines Scheidungsprozesses zu waten.
  en: But humanity will be spared the useless wading through the mire of a divorce case.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '83'
- id: II.119.1
  kind: p
  original: Was wir also heutzutage vermuten können über die Ordnung der Geschlechtsverhältnisse nach der bevorstehenden Wegfegung der kapitalistischen Produktion ist vorwiegend negativer Art, beschränkt sich meist auf das, was wegfällt.
  en: What we may anticipate about the adjustment of sexual relations after the impending downfall of capitalist production is mainly of a negative nature and mostly confined to elements that will disappear.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '83'
- id: II.119.2
  kind: p
  original: Was aber wird hinzukommen?
  en: But what will be added?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '83'
- id: II.119.3
  kind: p
  original: 'Das wird sich entscheiden, wenn ein neues Geschlecht herangewachsen sein wird: ein Geschlecht von Männern, die nie in ihrem Leben in den Fall gekommen sind, für Geld oder andre soziale Machtmittel die Preisgebung einer Frau zu erkaufen, und von Frauen, die nie in den Fall gekommen sind, weder aus irgendwelchen andern Rücksichten als wirklicher Liebe sich einem Mann hinzugeben, noch dem Geliebten die Hingabe zu verweigern aus Furcht vor den ökonomischen Folgen.'
  en: 'That will be decided after a new generation has come to maturity: a race of men who never in their lives have had any occasion for buying with money or other economic means of power the surrender of a woman; a race of women who have never had any occasion for surrendering to any man for any other reason but love, or for refusing to surrender to their lover from fear of economic consequences.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '83'
- id: II.119.4
  kind: p
  original: Wenn diese Leute da sind, werden sie sich den Teufel darum scheren, was man heute glaubt, daß sie tun sollen; sie werden sich ihre eigne Praxis und ihre danach abgemeßne öffentliche Meinung über die Praxis jedes einzelnen selbst machen - Punktum.
  en: Once such people are in the world, they will not give a moment's thought to what we to-day believe should be their course. They will follow their own practice and fashion their own public opinion about the individual practice of every person--only this and nothing more.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '83'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.120.1
  kind: p
  original: Kehren wir indes zurück zu Morgan, von dem wir uns ein beträchtliches entfernt haben.
  en: But let us return to Morgan from whom we moved away a considerable distance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '83'
- id: II.120.2
  kind: p
  original: Die geschichtliche Untersuchung der während der Zivilisationsperiode entwickelten gesellschaftlichen Institutionen geht über den Rahmen seines Buchs hinaus.
  en: The historical investigation of social institutions developed during the period of civilization exceeds the limits of his book.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 83-84
- id: II.120.3
  kind: p
  original: Die Schicksale der Monogamie während dieses Zeitraums beschäftigen ihn daher nur ganz kurz.
  en: Hence the vicissitudes of monogamy during this epoch occupy him very briefly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '84'
- id: II.120.4
  kind: p
  original: Auch er sieht in der Weiterbildung der monogamen Familie einen Fortschritt, eine Annäherung an die volle Gleichberechtigung der Geschlechter, ohne daß er dies Ziel jedoch für erreicht hält.
  en: He also sees in the further development of the monogamous family a progress, an approach to perfect equality of the sexes, without considering this aim fully realized.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '84'
- id: II.120.5
  kind: p
  original: Aber, sagt er, "wenn die Tatsache anerkannt wird, daß die Familie vier Formen nacheinander durchgemacht hat und sich jetzt in einer fünften befindet, so entsteht die Frage, ob diese Form für die Zukunft von Dauer sein kann.
  en: 'But he says: "When the fact is accepted that the family has passed through four successive forms, and is now in a fifth, the question at once arises whether this form can be permanent in the future.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '84'
- id: II.120.6
  kind: p
  original: Die einzig mögliche Antwort ist die, daß sie fortschreiten muß, wie die Gesellschaft fortschreitet, sich verändern im Maß, wie die Gesellschaft sich verändert, ganz wie bisher.
  en: The only answer that can be given is that it must advance as society advances, and change as society changes, even as it has done in the past.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '84'
- id: II.120.7
  kind: p
  original: Sie ist das Geschöpf des Gesellschaftssystems und wird seinen Bildungsstand widerspiegeln.
  en: It is the creature of the social system, and will reflect its culture.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '84'
- id: II.120.8
  kind: p
  original: Da die monogame Familie sich verbessert hat seitdem Beginn der Zivilisation, und sehr merklich in der modernen Zeit, so kann man mindestens vermuten, daß sie weiterer Vervollkommnung fähig, bis die Gleichheit beider Geschlechter erreicht ist.
  en: As the monogamian family has improved greatly since the commencement of civilization, and very sensibly in modern times, it is at least supposable that it is capable of still farther improvement until the equality of the sexes is attained.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '84'
- id: II.120.9
  kind: p
  original: Sollte in entfernter Zukunft die monogame Familie nicht imstande sein, die Ansprüche der Gesellschaft zu erfüllen, so ist unmöglich vorherzusagen, von welcher Beschaffenheit ihre Nachfolgerin sein wird."
  en: Should the monogamian family in the distant future fail to answer the requirements of society, assuming the continuous progress of civilization, it is impossible to predict the nature of its successor."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '84'
- id: II.N1.1.1
  kind: note
  original: Wie wenig Bachofen verstand, was er entdeckt oder vielmehr erraten hatte, beweist er durch die Bezeichnung dieses Urzustandes als Hetärismus.
  en: How little Bachofen understood what he had discovered, or rather guessed, is proved by the term "hetaerism," which he applies to this primeval stage.
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N1.1.2
  kind: note
  original: Hetärismus bezeichnete den Griechen, als sie das Wort einführten, Verkehr von Männern, unverheirateten oder in Einzelehe lebenden, mit unverheirateten Weibern, setzt stets eine bestimmte Form der Ehe voraus, außerhalb der dieser Verkehr stattfindet, und schließt die Prostitution wenigstens schon als Möglichkeit ein.
  en: Hetaerism designated among the Greeks an intercourse of men, single or living in monogamy, with unmarried women. It always presupposes the existence of a well defined form of marriage, outside of which this intercourse takes place, and includes the possibility of prostitution.
  modern: ''
  modern_status: empty
  notes: ''
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.N1.1.3
  kind: note
  original: In einem andern Sinn ist das Wort auch nie gebraucht worden, und in diesem Sinn gebrauche ich es mit Morgan.
  en: In another sense this word was never used, and I use it in this sense with Morgan.
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N1.1.4
  kind: note
  original: Bachofens höchst bedeutende Entdeckungen werden überall bis ins Unglaubliche vermystifiziert durch seine Einbildung, die geschichtlich entstandnen Beziehungen von Mann und Weib hätten ihre Quelle in den jedesmaligen religiösen Vorstellungen der Menschen, nicht in ihren wirklichen Lebensverhältnissen.
  en: Bachofen's very important discoveries are everywhere mystified in the extreme by his idea that the historical relations of man and wife have their source in the religious conceptions of a certain period, not in the economic conditions of life.
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N2.1.1
  kind: note
  original: in einem Brief vom Frühjahr 1882 spricht Marx sich in den stärksten Ausdrücken aus über die im Wagnerschen Nibelungentext herrschende totale Verfälschung der Urzeit.
  en: 'In the spring of 1882, Marx expressed himself in the strongest terms on the total misrepresentation of primeval times by Wagner''s Nibelungen text: "Who ever heard of a brother embracing his sister as a bride?"'
  modern: ''
  modern_status: empty
  notes: ''
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.N2.1.2
  kind: note
  original: '"War es je erhört, daß der Bruder die Schwester bräutlich umfing?"'
  en: ''
  joined_to: II.N2.1.1
  modern: ''
  modern_status: joined
  notes: ''
- id: II.N2.1.3
  kind: note
  original: 'Diesen ihre Liebeshändel ganz in moderner Weise durch ein bißchen Blutschande pikanter machenden "Geilheitsgöttern" Wagners antwortet Marx: "In der Urzeit war die Schwester die Frau, und das war sittlich."'
  en: 'To these lascivious Wagnerian gods who in truly modern style are rendering their love quarrels more spicy by a little incest, Marx replies: "In primeval times the sister was the wife and that was moral." (To the fourth edition.)'
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T30
    editions: '1884'
    reading: endet hier die Fußnote
    base_text: … und das war sittlich." ‸  …
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.N2.1.4
  kind: note
  original: '- (Zur vierten Auflage.)'
  en: ''
  joined_to: II.N2.1.3
  modern: ''
  modern_status: joined
  notes: ''
- id: II.N2.1.5
  kind: note
  original: 'Ein französischer Freund und Wagnerverehrer ist mit dieser Note nicht einverstanden und bemerkt, daß schon in der "älteren Edda", worauf Wagner gebaut, in der "Ögisdrecka", Loki der Freyja vorwirft: "Vor den Göttern umarmtest du den eignen Bruder."'
  en: 'A French friend and admirer of Wagner does not consent to this foot note, and remarks that even in the Oegisdrecka, the more ancient Edda on which Wagner built, Loki denounces Freya: "Before the gods you embraced your own brother."'
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N2.1.6
  kind: note
  original: Die Geschwisterehe sei also schon damals verpönt gewesen.
  en: This, he says, proves that marriage between brother and sister was interdicted even then.
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N2.1.7
  kind: note
  original: Die "Ögisdrecka" ist Ausdruck einer Zeit, wo der Glaube an die alten Mythen vollständig gebrochen war; sie ist ein reines Lucianisches Spottlied auf die Götter.
  en: But the Oegisdrecka is the expression of a time when the belief in the old myths was totally shaken; it is a truly Lucian satire on the gods.
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N2.1.8
  kind: note
  original: Wenn Loki als Mephisto darin der Freyja solchen Vorwurf macht, so spricht das eher gegen Wagner.
  en: If Loki as Mephisto denounces Freya in this manner, then it is rather a point against Wagner.
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N2.1.9
  kind: note
  original: 'Auch sagt Loki, einige Verse weiter, zu Niördhr: "Mit deiner Schwester zeugtest du einen (solchen) Sohn" (vidh systur thinni gaztu slikan mög).'
  en: 'Loki also says, a few verses further on, to Niordhr: "With your sister you generated (such) a son" ("vidh systur thinni gatzu slikan mog").'
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N2.1.10
  kind: note
  original: Niördhr ist zwar kein Ase, sondern Vane, und sagt in der "Ynglinga Saga", daß Geschwisterehen in Vanaland üblich seien, was bei den Asen nicht der Fall.
  en: Niordhr is not an Asa, but a Vana, and says in the Ynglinga Saga that marriages between brothers and sisters are sanctioned in Vanaland, which is not the case among the Asas.
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N2.1.11
  kind: note
  original: Dies wäre ein Anzeichen, daß die Vanen ältre Götter als die Asen.
  en: This would indicate that the Vanas are older gods than the Asas.
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N2.1.12
  kind: note
  original: Jedenfalls lebt Niördhr unter den Asen als ihresgleichen, und so ist die "Ögisdrecka" eher ein Beweis, daß zur Zeit der Entstehung der norwegischen Göttersagen die Geschwisterehe, wenigstens unter Göttern, noch keinen Abscheu erregte.
  en: At any rate Niordhr lived on equal terms with the Asas, and the Oegisdrecka is thus rather a proof that at the time of the origin of the Norwegian mythology the marriage of brother and sister was not yet repulsive, at least not to the gods.
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N2.1.13
  kind: note
  original: Will man Wagner entschuldigen, so täte man vielleicht besser, statt der "Edda" Goethe heranzuziehn, der in der Ballade vom Gott und der Bajadere einen ähnlichen Fehler in Beziehung auf die religiöse Frauenpreisgebung macht und sie viel zu sehr der modernen Prostitution annähert.
  en: In trying to excuse Wagner it might be better to quote Goethe instead of the Edda. This poet commits a similar error in his ballad of the god and the bajadere in regard to the religious surrender of women and approaches modern prostitution far too closely.
  modern: ''
  modern_status: empty
  notes: ''
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.N3.1.1
  kind: note
  original: Die Spuren unterschiedslosen Geschlechtsverkehrs, seiner sog. "Sumpfzeugung", die Bachofen gefunden zu haben meint, führen sich, wie jetzt nicht mehr bezweifelt werden kann, auf die Gruppenehe zurück.
  en: There is no longer any doubt that the traces of unrestricted sexual intercourse, which Bachofen alleges to have found--called "incestuous generation" by him--are traceable to group marriage.
  modern: ''
  modern_status: empty
  notes: ''
- id: II.N3.1.2
  kind: note
  original: '"Wenn Bachofen diese Punalua-Ehen ''gesetzlos'' findet, so fände ein Mann aus jener Periode die meisten jetzigen Ehen zwischen nahen und entfernten Vettern väterlicher oder mütterlicher Seite blutschänderisch, nämlich als Ehen zwischen blutsverwandten Geschwistern." (Marx.)'
  en: If Bachofen considers those Punaluan marriages "lawless," a man of that period would look upon most of our present marriages between near and remote cousins on the father's or mother's side as incestuous, being marriages between consanguineous relatives.--Marx.
  modern: ''
  modern_status: empty
  notes: ''
