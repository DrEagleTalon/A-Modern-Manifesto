- id: IV.37.1
  kind: p
  original: 'Wir sehn also in der griechischen Verfassung der Heldenzeit die alte Gentilorganisation noch in lebendiger Kraft, aber auch schon den Anfang ihrer Untergrabung: Vaterrecht mit Vererbung des Vermögens an die Kinder, wodurch die Reichtumsanhäufung in der Familie begünstigt und die Familie eine Macht wurde gegenüber der Gens; Rückwirkung der Reichtumsverschiedenheit auf die Verfassung vermittelst Bildung der ersten Ansätze zu einem erblichen Adel und Königtum; Sklaverei, zunächst noch bloß von Kriegsgefangnen, aber schon die Aussicht eröffnend auf Versklavung der eignen Stammes- und selbst Gentilgenossen; der alte Krieg von Stamm gegen Stamm bereits ausartend in systematische Räuberei zu Land und zur See, um Vieh, Sklaven, Schätze zu erobern, in regelrechte Erwerbsquelle; kurz, Reichtum gepriesen und geachtet als höchstes Gut und die alten Gentilordnungen gemißbraucht, um den gewaltsamen Raub von Reichtümern zu rechtfertigen.'
  en: In the Grecian constitution of heroic times, then, we still find the old gentilism fully alive, but we also perceive the beginnings of the elements that undermine it; paternal law and inheritance of property by the father's children, favoring accumulation of wealth in the family and giving to the latter a power apart from the gens; influence of the difference of wealth on the constitution by the formation of the first rudiments of hereditary nobility and monarchy; slavery, first limited to prisoners of war, but already paving the way to the enslavement of tribal and gentile associates; degeneration of the old feuds between tribes a regular mode of existing by systematic plundering on land and sea for the purpose of acquiring cattle, slaves, and treasures. In short, wealth is praised and respected as the highest treasure, and the old gentile institutions are abused in order to justify the forcible robbery of wealth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '105'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IV.37.2
  kind: p
  original: 'Es fehlte nur noch eins: eine Einrichtung, die die neuerworbnen Reichtümer der einzelnen nicht nur gegen die kommunistischen Traditionen der Gentilordnung sicherstellte, die nicht nur das früher so geringgeschätzte Privateigentum heiligte und diese Heiligung für den höchsten Zweck aller menschlichen Gemeinschaft erklärte, sondern die auch die nacheinander sich entwickelnden neuen Formen der Eigentumserwerbung, also der stets beschleunigten Vermehrung des Reichtums mit dem Stempel allgemein gesellschaftlicher Anerkennung versah; eine Einrichtung, die nicht nur die aufkommende Spaltung der Gesellschaft in Klassen verewigte, sondern auch das Recht der besitzenden Klasse auf Ausbeutung der nichtbesitzenden und die Herrschaft jener über diese.'
  en: 'Only one thing was missing: an institution that not only secured the newly acquired property of private individuals against the communistic traditions of the gens, that not only declared as sacred the formerly so despised private property and represented the protection of this sacred property as the highest purpose of human society, but that also stamped the gradually developing new forms of acquiring property, of constantly increasing wealth, with the universal sanction of society. An institution that lent the character of perpetuity not only to the newly rising division into classes, but also to the right of the possessing classes to exploit and rule the non-possessing classes.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 105-106
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
