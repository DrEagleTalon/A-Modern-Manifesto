  notes: ''
- id: IV.N1.1.2
  kind: note
  original: 'Morgan unterwirft die erst mißverständlichen und übertriebnen, später direkt lügenhaften Berichte der Spanier zum erstenmal der historischen Kritik und weist nach, daß die Mexikaner auf der Mittelstufe der Barbarei, höher jedoch als die neumexikanischen Pueblos-Indianer, standen und daß ihre Verfassung, soweit die entstellten Berichte sie erkennen lassen, dem entsprach: ein Bund dreier Stämme, der eine Anzahl andrer zur Tributpflichtigkeit unterworfen hatte und der regiert wurde von einem Bundesrat und Bundesfeldherrn, aus welchem letzteren die Spanier einen "Kaiser" machten.'
  en: 'Morgan was the first to submit to historical criticism the reports of the Spaniards who first misapprehended and exaggerated, and later on consciously misrepresented the functions of this office. He showed that the Mexicans were in the middle stage of barbarism, but on a higher plane than the New Mexican Pueblo Indians, and that their constitution, so far as the garbled accounts show, corresponded to this stage: a league of three tribes which had made a number of others tributary and was administered by a federal council and a federal chief of war, whom the Spaniards construed into an "emperor."'
  modern: ''
  modern_status: empty
  notes: ''
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
