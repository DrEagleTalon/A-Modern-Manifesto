- id: IV.N1.1.1
  kind: note
  original: Wie dem griechischen Basileus, so ist auch dem aztekischen Heerführer ein moderner Fürst untergeschoben worden.
  en: Just as the Grecian basileus, so the Aztec military chief was misrepresented as a modern prince.
  modern: ''
