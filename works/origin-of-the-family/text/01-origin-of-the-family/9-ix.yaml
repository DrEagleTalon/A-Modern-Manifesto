verses:
- id: IX.0.1
  kind: heading
  original: IX. Barbarei und Zivilisation
  en: CHAPTER IX. BARBARISM AND CIVILIZATION.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.1.1
  kind: p
  original: Wir haben jetzt die Auflösung der Gentilverfassung an den drei großen Einzelbeispielen der Griechen, Römer und Deutschen verfolgt.
  en: Having observed the dissolution of the gentile order in the three concrete cases of the Greek, Roman, and German nations, we may now investigate in conclusion the general economic conditions that began by undermining the gentile organization of society during the upper stage of barbarism and ended by doing away with it entirely at the advent of civilization.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: IX.1.2
  kind: p
  original: Untersuchen wir zum Schluß die allgemeinen ökonomischen Bedingungen, die die gentile Organisation der Gesellschaft auf der Oberstufe der Barbarei bereits untergruben und mit dem Eintritt der Zivilisation vollständig beseitigten.
  en: ''
  joined_to: IX.1.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '152'
- id: IX.1.3
  kind: p
  original: Hier wird uns Marx' "Kapital" ebenso notwendig sein wie Morgans Buch.
  en: Marx's "Capital" will be as necessary for the successful completion of this task as Morgan's "Ancient Society."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IX.2.1
  kind: p
  original: Hervorgewachsen auf der Mittelstufe, weitergebildet auf der Oberstufe der Wildheit, erreicht die Gens, soweit unsre Quellen dies beurteilen lassen, ihre Blütezeit auf der Unterstufe der Barbarei.
  en: A growth of the middle stage and a product of further development during the upper stage of savagery, the gens reached its prime, as near as we can judge from our sources of information, in the lower stage of barbarism.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IX.2.2
  kind: p
  original: Mit dieser Entwicklungsstufe also beginnen wir.
  en: With this stage, then, we begin our investigation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IX.3.1
  kind: p
  original: Wir finden hier, wo uns die amerikanischen Rothäute als Beispiel dienen müssen, die Gentilverfassung vollkommen ausgebildet.
  en: In our standard example, the American redskins of that time, we find the gentile constitution fully developed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IX.3.2
  kind: p
  original: Ein Stamm hat sich in mehrere, meistens zwei Gentes gegliedert; diese ursprünglichen Gentes zerfallen mit steigender Volkszahl jede in mehrere Tochtergentes, gegenüber denen die Muttergens als Phratrie erscheint; der Stamm selbst spaltet sich in mehrere Stämme, in deren jedem wir die alten Gentes großenteils wiederfinden; ein Bund umschließt wenigstens in einzelnen Fällen die verwandten Stämme.
  en: A tribe had differentiated into several gentes, generally two. Through the increase of the population, these original gentes again divided into several daughter gentes, making the mother gens a phratry. The tribe itself split up into several tribes, in each of which we again meet a large number of representatives of the old gentes. In certain cases a federation united the related tribes.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T1
    editions: '1884'
    reading: 'fehlt: meistens zwei'
    base_text: … in mehrere, meistens zwei ‸ Gentes gegliedert; diese ursprünglichen …
  mew_page: '152'
  align: '1:4'
  review: true
  review_reason: 1 de sentence(s) matched to 4 en sentence(s)
- id: IX.3.3
  kind: p
  original: Diese einfache Organisation genügt vollkommen den gesellschaftlichen Zuständen, denen sie entsprungen ist.
  en: This simple organization fully sufficed for the social conditions out of which it had grown.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IX.3.4
  kind: p
  original: Sie ist weiter nichts als deren eigne, naturwüchsige Gruppierung, sie ist imstande, alle Konflikte auszugleichen, die innerhalb der so organisierten Gesellschaft entspringen können.
  en: It was nothing else than the innate, spontaneous expression of those conditions, and it was well calculated to smooth over all internal difficulties that could arise in this social organization.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IX.3.5
  kind: p
  original: Nach außen gleicht der Krieg aus; er kann mit Vernichtung des Stamms endigen, nie aber mit seiner Unterjochung.
  en: External difficulties were settled by war. Such a war could end in the annihilation of a tribe, but never in its subjugation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.3.6
  kind: p
  original: Es ist das Großartige, aber auch das Beschränkte der Gentilverfassung, daß sie für Herrschaft und Knechtung keinen Raum hat.
  en: It is the grandeur and at the same time the limitation of the gentile order that it has no room either for masters or servants.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IX.3.7
  kind: p
  original: 'Nach innen gibt es noch keinen Unterschied zwischen Rechten und Pflichten; die Frage, ob Teilnahme an den öffentlichen Angelegenheiten, Blutrache oder deren Sühnung, ein Recht oder eine Pflicht sei, besteht für den Indianer nicht; sie würde ihm ebenso absurd vorkommen wie die: ob Essen, Schlafen, Jagen ein Recht oder eine Pflicht sei.'
  en: There were as yet no distinctions between rights and duties. The question whether he had a right to take part in public affairs, to practice blood revenge or to demand atonement for injuries would have appeared as absurd to an Indian, as the question whether it was his duty to eat, sleep, and hunt.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 152-155
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.3.8
  kind: p
  original: Ebensowenig kann eine Spaltung des Stammes und der Gens in verschiedne Klassen stattfinden.
  en: Nor could any division of a tribe or gens into different classes take place.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IX.3.9
  kind: p
  original: Und dies führt uns auf Untersuchung der ökonomischen Basis des Zustandes.
  en: This leads us to the investigation of the economic basis of those conditions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IX.4.1
  kind: p
  original: 'Die Bevölkerung ist äußerst dünn: verdichtet nur am Wohnort des Stamms, um den in weitem Kreise zunächst das Jagdgebiet liegt, dann der neutrale Schutzwald, der ihn von andern Stämmen trennt.'
  en: The population was very small in numbers. It was collected only on the territory of the tribe. Next to this territory was the hunting ground surrounding it in a wide circle. A neutral forest formed the line of demarcation from other tribes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
  align: '1:4'
  review: true
  review_reason: 1 de sentence(s) matched to 4 en sentence(s)
- id: IX.4.2
  kind: p
  original: Die Teilung der Arbeit ist rein naturwüchsig; sie besteht nur zwischen den beiden Geschlechtern.
  en: The division of labor was quite primitive. The work was simply divided between the two sexes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.4.3
  kind: p
  original: Der Mann führt den Krieg, geht jagen und fischen, beschafft den Rohstoff der Nahrung und die dazu nötigen Werkzeuge.
  en: The men went to war, hunted, fished, provided the raw material for food and the tools necessary for these pursuits.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IX.4.4
  kind: p
  original: Die Frau besorgt das Haus und die Zubereitung der Nahrung und Kleidung, kocht, webt, näht.
  en: The women cared for the house, and prepared food and clothing; they cooked, weaved and sewed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IX.4.5
  kind: p
  original: 'Jedes von beiden ist Herr auf seinem Gebiet: der Mann im Walde, die Frau im Hause.'
  en: Each sex was master of its own field of activity; the men in the forest, the women in the house.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IX.4.6
  kind: p
  original: 'Jedes ist Eigentümer der von ihm verfertigten und gebrauchten Werkzeuge: der Mann der Waffen, des Jagd- und Fischzeugs, die Frau des Hausrats.'
  en: Each sex also owned the tools made and used by it; the men were the owners of the weapons, of the hunting and fishing tackle, the women of the household goods and utensils.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IX.4.7
  kind: p
  original: Die Haushaltung ist kommunistisch für mehrere, oft viele Familien.
  en: The household was communistic, comprising several, and often many, families.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IX.N1
  mew_page: '155'
- id: IX.4.8
  kind: p
  original: 'Was gemeinsam gemacht und genutzt wird, ist gemeinsames Eigentum: das Haus, der Garten, das Langboot.'
  en: 'Whatever was produced and used collectively, was regarded as common property: the house, the garden, the long boat.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IX.4.9
  kind: p
  original: Hier also, und nur hier noch, gilt das von Juristen und Ökonomen der zivilisierten Gesellschaft angedichtete "selbstbearbeitete Eigentum", der letzte verlogne Rechtsvorwand, auf den das heutige kapitalistische Eigentum sich noch stützt.
  en: Here, and only here, then, do we find the "self-earned property" which jurists and economists have falsely attributed to civilized society, the last deceptive pretext of legality on which modern capitalist property is leaning.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IX.5.1
  kind: p
  original: Aber die Menschen blieben nicht überall auf dieser Stufe stehn.
  en: But humanity did not everywhere remain in this stage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IX.5.2
  kind: p
  original: In Asien fanden sie Tiere vor, die sich zähmen und gezähmt weiterzüchten ließen.
  en: In Asia they found animals that could be tamed and propagated in captivity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IX.5.3
  kind: p
  original: Die wilde Büffelkuh mußte erjagt werden, die zahme lieferte jährlich ein Kalb und Milch obendrein.
  en: The wild buffalo cow had to be hunted down; the tame cow gave birth to a calf once a year, and also furnished milk.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IX.5.4
  kind: p
  original: Eine Anzahl der vorgeschrittensten Stämme - Arier, Semiten, vielleicht auch schon Turanier - machten erst die Zähmung, später nur noch die Züchtung und Wartung von Vieh zu ihrem Hauptarbeitszweig.
  en: Some of the most advanced tribes--Aryans, Semites, perhaps also Turanians--devoted themselves mainly to taming, and later to raising and tending, domestic animals.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IX.5.5
  kind: p
  original: 'Hirtenstämme sonderten sich aus von der übrigen Masse der Barbaren: erste große gesellschaftliche Teilung der Arbeit.'
  en: The segregation of cattle raising tribes from the rest of the barbarians constitutes the first great division of social labor.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IX.5.6
  kind: p
  original: Die Hirtenstämme produzierten nicht nur mehr, sondern auch andre Lebensmittel als die übrigen Barbaren.
  en: These stock raising tribes did not only produce more articles of food than the rest of the barbarians, but also different kinds of products.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IX.5.7
  kind: p
  original: Sie hatten nicht nur Milch, Milchprodukte und Fleisch in größeren Massen vor diesen voraus, sondern auch Häute, Wolle, Ziegenhaare und die mit der Masse des Rohstoffs sich vermehrenden Gespinste und Gewebe.
  en: They were ahead of the others by having at their disposal not alone milk, milk products, and a greater abundance of meat, but also skins, wool, goat's hair, and the spun and woven goods which the growing abundance of the raw material brought into common use.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 155-156
- id: IX.5.8
  kind: p
  original: Damit wurde ein regelmäßiger Austausch zum erstenmal möglich.
  en: This for the first time made a regular exchange of products possible.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IX.5.9
  kind: p
  original: Auf früheren Stufen können nur gelegentliche Austäusche stattfinden; besondre Geschicklichkeit in der Verfertigung von Waffen und Werkzeugen kann zu vorübergehender Arbeitsteilung führen.
  en: In former stages, exchange could only take place occasionally, and an exceptional ability in manufacturing weapons and tools may have led to a transient division of labor.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IX.5.10
  kind: p
  original: So sind unzweifelhafte Reste von Werkstätten für Steinwerkzeuge aus dem späteren Steinzeitalter an vielen Orten gefunden worden; die Künstler, die hier ihre Geschicklichkeit ausbildeten, arbeiteten wahrscheinlich, wie noch die ständigen Handwerker indischer Gentilgemeinwesen, für Rechnung der Gesamtheit.
  en: For example, unquestionable remains of workshops for stone implements of the neolithic period have been found in many places. The artists who developed their ability in those shops, most probably worked for the collectivity, as did the artisans of the Indian gentile order.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.5.11
  kind: p
  original: Keinenfalls konnte auf dieser Stufe ein andrer Austausch als der innerhalb des Stammes entstehn, und dieser blieb ausnahmsweises Ereignis.
  en: At any rate, no other exchange than that within the tribe could exist in that stage, and even that was an exception.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IX.5.12
  kind: p
  original: Hier dagegen, nach der Ausscheidung der Hirtenstämme, finden wir alle Bedingungen fertig zum Austausch zwischen den Gliedern verschiedner Stämme, zu seiner Ausbildung und Befestigung als regelmäßige Institution.
  en: But after the segregation of the stock raising tribes we find all the conditions favorable to an exchange between groups of different tribes, and to a further development of this mode of trading into a fixed institution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IX.5.13
  kind: p
  original: Ursprünglich tauschte Stamm mit Stamm, durch die gegenseitigen Gentilvorsteher; als aber die Herden anfingen in Sondereigentum überzugehn, überwog der Einzelaustausch mehr und mehr und wurde endlich einzige Form.
  en: Originally, tribe exchanged with tribe through the agency of their tribal heads. But when the herds drifted into the hands of private individuals, then the exchange between individuals prevailed more and more, until it became the established form.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T2
    editions: '1884'
    reading: Privateigentum
    base_text: … Herden anfingen in Sondereigentum ‸ überzugehn, überwog der Einzelaustausch …
  mew_page: '156'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.5.14
  kind: p
  original: Der Hauptartikel aber, den die Hirtenstämme an ihre Nachbarn im Tausch abgaben, war Vieh; Vieh wurde die Ware, in der alle andren Waren geschätzt und die überall gern im Austausch gegen jene genommen wurde - kurz, Vieh erhielt Geldfunktion und tat Gelddienste schon auf dieser Stufe.
  en: The principal article of exchange which the stock raising tribes offered to their neighbors was in the form of domestic animals. Cattle became the favorite commodity by which all other commodities were measured in exchange. In short, cattle assumed the functions of money and served in this capacity as early as that stage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: IX.5.15
  kind: p
  original: Mit solcher Notwendigkeit und Raschheit entwickelte sich schon im Anbeginn des Warenaustausches das Bedürfnis einer Geldware.
  en: With such necessity and rapidity was the demand for a money commodity developed at the very beginning of the exchange of commodities.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IX.6.1
  kind: p
  original: Der Gartenbau, den asiatischen Barbaren der Unterstufe wahrscheinlich fremd, kam spätestens in der Mittelstufe bei ihnen auf, als Vorläufer des Feldbaus.
  en: Horticulture, probably unknown to the Asiatic barbarians of the lower stage, arose not later than the middle stage of barbarism, as the forerunner of agriculture.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IX.6.2
  kind: p
  original: Das Klima der turanischen Hochebene läßt kein Hirtenleben zu ohne Futtervorräte für den langen und strengen Winter; Wiesenbau und Kultur von Kornfrucht war also hier Bedingung.
  en: The climate of the Turanian Highland does not admit of a nomadic life without a supply of stock feed for the long and hard winter. Hence the cultivation of meadows and grain was indispensable.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.6.3
  kind: p
  original: Dasselbe gilt für die Steppen nördlich vom Schwarzen Meer.
  en: The same is true of the steppes north of the Black Sea.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IX.6.4
  kind: p
  original: Wurde aber erst die Kornfrucht für das Vieh gewonnen, so wurde sie bald auch menschliche Nahrung.
  en: Once grain had been grown for cattle, it soon became human food.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IX.6.5
  kind: p
  original: Das bebaute Land blieb noch Stammeseigentum, anfänglich der Gens, später von dieser den Hausgenossenschaften, endlich den einzelnen zur Benutzung überwiesen; sie mochten gewisse Besitzrechte daran haben, mehr aber auch nicht.
  en: The cultivated land belonged as yet to the tribe and was assigned first to the gens, which in its turn distributed it to the households, and finally to individuals; always for use only, not for possession. The users may have had certain claims to the land, but that was all.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T3
    editions: '1884'
    reading: 'fehlt: den Hausgenossenschaften, endlich'
    base_text: … dieser den Hausgenossenschaften, endlich ‸ den einzelnen zur Benutzung …
  mew_page: '156'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.7.1
  kind: p
  original: Von den industriellen Errungenschaften dieser Stufe sind zwei besonders wichtig.
  en: Two of the industrial acquisitions of this stage are especially important.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IX.7.2
  kind: p
  original: Die erste ist der Webstuhl, die zweite die Schmelzung von Metallerzen und die Verarbeitung der Metalle.
  en: The first is the weaving loom, the second the melting of metal ore and the use of metals in manufacture.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IX.7.3
  kind: p
  original: Kupfer und Zinn und die aus beiden zusammengesetzte Bronze waren weitaus die wichtigsten; die Bronze lieferte brauchbare Werkzeuge und Waffen, konnte aber die Steinwerkzeuge nicht verdrängen; dies war nur dem Eisen möglich, und Eisen zu gewinnen verstand man noch nicht.
  en: Copper, tin, and their alloy, bronze, were the most essential of them. Bronze furnished tools and weapons, but could not displace stone implements. Only iron could have done that, but the production of iron was as yet unknown.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 156-157
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: IX.7.4
  kind: p
  original: Gold und Silber fingen an, zu Schmuck und Zierat verwandt zu werden, und müssen schon hoch im Wert gestanden haben gegenüber Kupfer und Bronze.
  en: Gold and silver were already used for ornament and decoration, and must have been far more precious than copper and bronze.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IX.8.1
  kind: p
  original: Die Steigerung der Produktion in allen Zweigen - Viehzucht, Ackerbau, häusliches Handwerk - gab der menschlichen Arbeitskraft die Fähigkeit, ein größeres Produkt zu erzeugen, als zu ihrem Unterhalt erforderlich war.
  en: The increase of production in all branches--stock raising, agriculture, domestic handicrafts--enabled human labor power to produce more than was necessary for its maintenance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IX.8.2
  kind: p
  original: Sie steigerte gleichzeitig die tägliche Arbeitsmenge, die jedem Mitglied der Gens, der Hausgemeinde oder der Einzelfamilie zufiel.
  en: It increased at the same time the amount of daily work that fell to the lot of every member of a gens, a household, or a single family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IX.8.3
  kind: p
  original: Die Einschaltung neuer Arbeitskräfte wurde wünschenswert.
  en: The addition of more labor power became desirable.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IX.8.4
  kind: p
  original: 'Der Krieg lieferte sie: Die Kriegsgefangnen wurden in Sklaven verwandelt.'
  en: It was furnished by war; the captured enemies were transformed into slaves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IX.8.5
  kind: p
  original: Die erste große gesellschaftliche Teilung der Arbeit zog mit ihrer Steigerung der Produktivität der Arbeit, also des Reichtums, und mit ihrer Erweiterung des Produktionsfeldes, unter den gegebnen geschichtlichen Gesamtbedingungen, die Sklaverei mit Notwendigkeit nach sich.
  en: Under the given historical conditions, the first great division of social labor, by increasing the productivity of labor, adding to the wealth, and enlarging the field of productive activity, necessarily carried slavery in its wake.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IX.8.6
  kind: p
  original: 'Aus der ersten großen gesellschaftlichen Arbeitsteilung entsprang die erste große Spaltung der Gesellschaft in zwei Klassen: Herren und Sklaven, Ausbeuter und Ausgebeutete.'
  en: 'Out of the first great division of social labor arose the first great division of society into two classes: masters and servants, exploiters and exploited.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IX.9.1
  kind: p
  original: Wie und wann die Herden aus dem Gemeinbesitz des Stammes oder der Gens in das Eigentum der einzelnen Familienhäupter übergegangen, darüber wissen wir bis jetzt nichts.
  en: How and when the herds were transferred from the collective ownership of the tribe or gens to the proprietorship of the heads of the families, is not known to us.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IX.9.2
  kind: p
  original: Es muß aber im wesentlichen auf dieser Stufe geschehn sein.
  en: But it must have been practically accomplished in this stage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IX.9.3
  kind: p
  original: Mit den Herden nun und den übrigen neuen Reichtümern kam eine Revolution über die Familie.
  en: The herds and the other new objects of wealth brought about a revolution in the family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IX.9.4
  kind: p
  original: Der Erwerb war immer Sache des Mannes gewesen, die Mittel zum Erwerb von ihm produziert und sein Eigentum.
  en: Procuring the means of existence had always been the man's business. The tools of production were manufactured and owned by him.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.9.5
  kind: p
  original: Die Herden waren die neuen Erwerbsmittel, ihre anfängliche Zähmung und spätere Wartung sein Werk.
  en: The herds were the new tools of production, and their taming and tending was his work.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IX.9.6
  kind: p
  original: Ihm gehörte daher das Vieh, ihm die gegen Vieh eingetauschten Waren und Sklaven.
  en: Hence he owned the cattle and the commodities and slaves obtained in exchange for them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IX.9.7
  kind: p
  original: All der Überschuß, den der Erwerb jetzt lieferte, fiel dem Manne zu; die Frau genoß mit davon, aber sie hatte kein Teil am Eigentum.
  en: All the surplus now resulting from production fell to the share of the man. The woman shared in its fruition, but she could not claim its ownership.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.9.8
  kind: p
  original: Der "wilde" Krieger und Jäger war im Hause zufrieden gewesen mit der zweiten Stelle, nach der Frau; der "sanftere" Hirt, auf seinen Reichtum pochend, drängte sich vor an die erste Stelle und die Frau zurück an die zweite.
  en: The "savage" warrior and hunter had been content to occupy the second place in the house, to give precedence to the woman. The "gentler" shepherd, standing on his wealth, assumed the first place and forced the woman back into the second place.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.9.9
  kind: p
  original: Und sie konnte sich nicht beklagen.
  en: And she had no occasion to complain.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IX.9.10
  kind: p
  original: Die Arbeitsteilung in der Familie hatte die Eigentumsverteilung zwischen Mann und Frau geregelt; sie war dieselbe geblieben; und doch stellte sie jetzt das bisherige häusliche Verhältnis auf den Kopf, lediglich weil die Arbeitsteilung außerhalb der Familie eine andre geworden war.
  en: The division of labor in the family had regulated the distribution of property between man and wife. This division of labor remained unchanged. Yet the former domestic relation was now reversed, simply because the division of labor outside of the family had been altered.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s); regrouped by the ingest (see REALIGN)
- id: IX.9.11
  kind: p
  original: 'Dieselbe Ursache, die der Frau ihre frühere Herrschaft im Hause gesichert: ihre Beschränkung auf die Hausarbeit, dieselbe Ursache sicherte jetzt die Herrschaft des Mannes im Hause: die Hausarbeit der Frau verschwand jetzt neben der Erwerbsarbeit des Mannes; diese war alles, jene eine unbedeutende Beigabe.'
  en: The same cause that once had secured the supremacy in the house for women, viz., the confining of women's activity to domestic labor, now assured the supremacy of the men in the households. The domestic labor of women was considered insignificant in comparison to men's work for a living. The latter was everything, the former a negligible quantity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 157-158
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s); regrouped by the ingest (see REALIGN)
- id: IX.9.12
  kind: p
  original: Hier zeigt sich schon, daß die Befreiung der Frau, ihre Gleichstellung mit dem Manne, eine Unmöglichkeit ist und bleibt, solange die Frau von der gesellschaftlichen produktiven Arbeit ausgeschlossen und auf die häusliche Privatarbeit beschränkt bleibt.
  en: At this early stage we can already see that the emancipation of women and their equality with men are impossible and remain so, as long as women are excluded from social production and restricted to domestic labor.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: IX.9.13
  kind: p
  original: Die Befreiung der Frau wird erst möglich, sobald diese auf großem, gesellschaftlichem Maßstab an der Produktion sich beteiligen kann und die häusliche Arbeit sie nur noch in unbedeutendem Maß in Anspruch nimmt.
  en: The emancipation of women becomes feasible only then when women are enabled to take part extensively in social production, and when domestic duties require their attention in a minor degree.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: IX.9.14
  kind: p
  original: Und dies ist erst möglich geworden durch die moderne große Industrie, die nicht nur Frauenarbeit auf großer Stufenleiter zuläßt, sondern förmlich nach ihr verlangt, und die auch die private Hausarbeit mehr und mehr in eine öffentliche Industrie aufzulösen strebt.
  en: This state of things was brought about by the modern great industries, which not only admit of women's liberal participation in production, but actually call for it and, besides, endeavor to transform domestic work also into a public industry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: IX.10.1
  kind: p
  original: Mit der faktischen Herrschaft des Mannes im Hause war die letzte Schranke seiner Alleinherrschaft gefallen.
  en: Man's advent to practical supremacy in the household marked the removal of the last barrier to his universal supremacy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: IX.10.2
  kind: p
  original: Diese Alleinherrschaft wurde bestätigt und verewigt durch Sturz des Mutterrechts, Einführung des Vaterrechts, allmählichen Übergang der Paarungsehe in die Monogamie.
  en: His unlimited rule was emphasized and endowed with continuity by the downfall of matriarchy, the introduction of patriarchy, and the gradual transition from the pairing family to the monogamic family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: IX.10.3
  kind: p
  original: Damit aber kam ein Riß in die alte Gentilordnung; Die Einzelfamilie wurde eine Macht und erhob sich drohend gegenüber der Gens.
  en: This made a breach in the old gentile order. The monogamic family became a power and lifted a threatening hand against the gens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.11.1
  kind: p
  original: 'Der nächste Schritt führt uns auf die Oberstufe der Barbarei, die Periode, in der alle Kulturvölker ihre Heroenzeit durchmachen: die Zeit des eisernen Schwerts, aber auch der eisernen Pflugschar und Axt.'
  en: The next step brings us to the upper stage of barbarism, that period in which all nations of civilization go through their heroic era. It is the time of the iron sword, but also of the iron plow share and axe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.11.2
  kind: p
  original: Das Eisen war dem Menschen dienstbar geworden, der letzte und wichtigste aller Rohstoffe, die eine geschichtlich umwälzende Rolle spielten, der letzte - bis auf die Kartoffel.
  en: The iron had become the servant of man. It is the last and most important of all raw products that play a revolutionary role in history; the last--if we except the potato.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.11.3
  kind: p
  original: Das Eisen schuf den Feldbau auf größeren Flächen, die Urbarmachung ausgedehnterer Waldstrecken; es gab dem Handwerker Werkzeug von einer Härte und Schneide, der kein Stein, kein andres bekanntes Metall widerstand.
  en: Iron brought about agriculture on a larger scale and the clearing of extensive forest tracts for cultivation. It gave to the craftsman a tool of such hardness and sharpness that no stone, no other known metal, could withstand it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.11.4
  kind: p
  original: Alles das allmählich; das erste Eisen war oft noch weicher als Bronze.
  en: All this came about gradually. The first iron was often softer than bronze.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.11.5
  kind: p
  original: So verschwand die Steinwaffe nur langsam; nicht nur im "Hildebrandslied", auch noch bei Hastings im Jahre 1066 kamen noch Steinäxte ins Gefecht.
  en: Therefore stone implements disappeared very slowly. Not only in the Hildebrand Song, but also at Hastings in 1066, stone axes were still used in fighting.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.11.6
  kind: p
  original: Aber der Fortschritt ging nun unaufhaltsam, weniger unterbrochen und rascher vor sich.
  en: But progress was now irresistible, less interrupted and more rapid.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: IX.11.7
  kind: p
  original: Die mit steinernen Mauern, Türmen und Zinnen steinerne oder Ziegelhäuser umschließende Stadt wurde Zentralsitz des Stamms oder Stämmebundes; ein gewaltiger Fortschritt in der Baukunst, aber auch ein Zeichen vermehrter Gefahr und Schutzbedürftigkeit.
  en: The town, inclosing houses of stone or tiles within its turreted and crested stone walls, became the central seat of the tribe or federation of tribes. It showed an astounding progress of architecture, but also an increase of danger and of the demand for protection.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.11.8
  kind: p
  original: Der Reichtum wuchs rasch, aber als Reichtum einzelner; die Weberei, die Metallbearbeitung und die andern, mehr und mehr sich sondernden Handwerke entfalteten steigende Mannigfaltigkeit und Kunstfertigkeit der Produktion; der Landbau lieferte neben Korn, Hülsenfrüchten und Obst jetzt auch Öl und Wein, deren Bereitung man gelernt hatte.
  en: Wealth increased rapidly, but it was the wealth of private individuals. Weaving, metal work and other more and more differentiating industries developed an increasing variety and display of art in production. Agriculture furnished not alone grain, peas, beans and fruit, but also oil and wine, the preparation of which had now been learned.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 158-159
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: IX.11.9
  kind: p
  original: 'So mannigfache Tätigkeit konnte nicht mehr von demselben einzelnen ausgeübt werden; die zweite große Teilung der Arbeit trat ein: Das Handwerk sonderte sich vom Ackerbau.'
  en: 'Such a diversity of action could not be displayed by any single individual. The second great division of labor took place: handicrafts separated from agriculture.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.11.10
  kind: p
  original: Die fortwährende Steigerung der Produktion und mit ihr der Produktivität der Arbeit erhöhte den Wert der menschlichen Arbeitskraft; die Sklaverei, auf der vorigen Stufe noch entstehend und sporadisch, wird jetzt wesentlicher Bestandteil des Gesellschaftssystems; die Sklaven hören auf, einfache Gehülfen zu sein, sie werden dutzendweise zur Arbeit getrieben auf dem Feld und in der Werkstatt.
  en: The growing intensity of production and the increased productivity enhanced the value of human labor power. Slavery, which had been a rising and sporadic factor in the preceding stage, now became an essential part of the social system. The slaves ceased to be simple assistants. They were now driven in scores to the work in the fields and shops.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
  align: '1:4'
  review: true
  review_reason: 1 de sentence(s) matched to 4 en sentence(s)
- id: IX.11.11
  kind: p
  original: Mit der Spaltung der Produktion in die zwei großen Hauptzweige, Ackerbau und Handwerk, entsteht die Produktion direkt für den Austausch, die Warenproduktion; mit ihr der Handel, nicht nur im Innern und an den Stammesgrenzen, sondern auch schon über See.
  en: The division of production into two great branches, agriculture and handicrafts, gave rise to production for exchange, the production of commodities. Trade arose at the same time, not only in the interior and on the tribal boundaries, but also in the form of maritime exchange.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.11.12
  kind: p
  original: Alles dies aber noch sehr unentwickelt; die edlen Metalle fangen an, vorwiegende und allgemeine Geldware zu werden, aber noch ungeprägt, nur nach dem noch unverkleideten Gewicht sich austauschend.
  en: All this was as yet in a very undeveloped state. The precious metals gained preference as a universal money commodity, but still uncoined and exchanged merely by dead weight.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.12.1
  kind: p
  original: Der Unterschied von Reichen und Ärmeren tritt neben den von Freien und Sklaven - mit der neuen Arbeitsteilung eine neue Spaltung der Gesellschaft in Klassen.
  en: The distinction between rich and poor was added to that between free men and slaves. This and the new division of labor constitute a new division of society into classes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.12.2
  kind: p
  original: Die Besitzunterschiede der einzelnen Familienhäupter sprengen die alte kommunistische Hausgemeinde überall, wo sie sich bis dahin erhalten; mit ihr die gemeinsame Bebauung des Bodens für Rechnung dieser Gemeinde.
  en: The differences in the amount of property belonging to the several family heads broke up the old communistic households one by one, wherever they might have been preserved thus far. This made an end to the collective cultivation of the soil for the account of the community.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.12.3
  kind: p
  original: Das Ackerland wird den einzelnen Familien zunächst auf Zeit, später ein für allemal zur Nutzung überwiesen, der Übergang in volles Privateigentum vollzieht sich allmählich und parallel mit dem Übergang der Paarungsehe in Monogamie.
  en: The cultivated land was assigned for use to the several families, first for a limited time, later for once and all. The transition to full private property was accomplished gradually and simultaneously with the transition from the pairing family to monogamy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.12.4
  kind: p
  original: Die Einzelfamilie fängt an, die wirtschaftliche Einheit in der Gesellschaft zu werden.
  en: The monogamous family began to be the economic unit of society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: IX.13.1
  kind: p
  original: Die dichtere Bevölkerung nötigt zu engerem Zusammenschließen nach innen wie nach außen.
  en: The increase of population necessitated a closer consolidation against internal and external foes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: IX.13.2
  kind: p
  original: Der Bund verwandter Stämme wird überall eine Notwendigkeit; bald auch schon ihre Verschmelzung, damit die Verschmelzung der getrennten Stammesgebiete zu einem Gesamtgebiet des Volks.
  en: The federation of related tribes became unavoidable. Their amalgamation, and thence the amalgamation of the separate tribal territories to one national territory, was the following step.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.13.3
  kind: p
  original: Der Heerführer des Volks - rex, basileus, thiudans - wird unentbehrlicher, ständiger Beamter.
  en: The military leader--rex, basileus, thiudans--became an indispensable and standing official.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: IX.13.4
  kind: p
  original: Die Volksversammlung kommt auf, wo sie nicht schon bestand.
  en: The public meeting was introduced wherever it did not yet exist.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: IX.13.5
  kind: p
  original: Heerführer, Rat, Volksversammlung bilden die Organe der zu einer militärischen Demokratie fortentwickelten Gentilgesellschaft.
  en: The military leader, the council of chiefs, and the public meeting formed the organs of the military democracy that had grown out of the gentile constitution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: IX.13.6
  kind: p
  original: Militärisch - denn der Krieg und die Organisation zum Krieg sind jetzt regelmäßige Funktionen des Volkslebens geworden.
  en: Military democracy--for now war and organization for war were regular functions of social life.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: IX.13.7
  kind: p
  original: Die Reichtümer der Nachbarn reizen die Habgier von Völkern, bei denen Reichtumserwerb schon als einer der ersten Lebenszwecke erscheint.
  en: The wealth of the neighbors excited the greed of nations that began to regard the acquisition of wealth as one of the main purposes of their life.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: IX.13.8
  kind: p
  original: 'Sie sind Barbaren: Rauben gilt ihnen für leichter und selbst für ehrenvoller als Erarbeiten.'
  en: 'They were barbarians: robbing appeared to them easier and more honorable than producing.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: IX.13.9
  kind: p
  original: Der Krieg, früher nur geführt zur Rache für Übergriffe oder zur Ausdehnung des unzureichend gewordnen Gebiets, wird jetzt des bloßen Raubs wegen geführt, wird stehender Erwerbszweig.
  en: War, once simply a revenge for transgressions or a means for enlarging a territory that had become too narrow, was now waged for the sake of plunder alone and became a regular profession.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 159-160
- id: IX.13.10
  kind: p
  original: 'Nicht umsonst starren die dräuenden Mauern um die neuen befestigten Städte: In ihren Gräben gähnt das Grab der Gentilverfassung, und ihre Türme ragen bereits hinein in die Zivilisation.'
  en: 'Not in vain did threatening walls cast a rigid stare all around the new fortified towns: their yawning ditches were the tomb of the gentile constitution, and their turrets already reached up into civilization.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: IX.13.11
  kind: p
  original: Und ebenso geht es im Innern.
  en: The internal affairs underwent a similar change.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: IX.13.12
  kind: p
  original: Die Raubkriege erhöhen die Macht des obersten Heerführers wie die der Unterführer; die gewohnheitsmäßige Wahl der Nachfolger in denselben Familien geht, namentlich seit Einführung des Vaterrechts, allmählich über in erst geduldete, dann beanspruchte, endlich usurpierte Erblichkeit; die Grundlage des Erbkönigtums und des Erbadels ist gelegt.
  en: The plundering wars increased the power of the military leader and of the subcommanders. The habitual election of the successors from the same family was gradually transformed into hereditary succession, first by sufferance, then by claim, and finally by usurpation. Thus the foundation of hereditary royalty and nobility was laid.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: IX.13.13
  kind: p
  original: 'So reißen sich die Organe der Gentilverfassung allmählich los von ihrer Wurzel im Volk, in Gens, Phratrie, Stamm, und die ganze Gentilverfassung verkehrt sich in ihr Gegenteil: Aus einer Organisation von Stämmen zur freien Ordnung ihrer eignen Angelegenheiten wird sie eine Organisation zur Plünderung und Bedrückung der Nachbarn, und dementsprechend werden ihre Organe aus Werkzeugen des Volkswillens zu selbständigen Organen der Herrschaft und Bedrückung gegenüber dem eignen Volk.'
  en: In this manner the organs of the gentile constitution were gradually torn away from their roots in the nation, tribe, phratry and gens, and the whole gentile order reversed into its antithesis. The organization of tribes for the purpose of the free administration of affairs was turned into an organization for plundering and oppressing their neighbors. The organs of gentilism changed from servants of the public will to independent organs of rule oppressing their own people.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: IX.13.14
  kind: p
  original: Das aber wäre nie möglich gewesen, hätte nicht die Gier nach Reichtum die Gentilgenossen gespalten in Reiche und Arme, hätte nicht "die Eigentumsdifferenz innerhalb derselben Gens die Einheit der Interessen verwandelt in Antagonismus der Gentilgenossen" (Marx) und hätte nicht die Ausdehnung der Sklaverei bereits angefangen, die Erarbeitung des Lebensunterhalts für nur sklavenwürdige Tätigkeit, für schimpflicher gelten zu lassen als den Raub.
  en: This could not have happened, if the greed for wealth had not divided the gentiles into rich and poor; if the "difference of property in a gens had not changed the community of interest into antagonism of the gentiles" (Karl Marx); and if the extension of slavery had not begun by branding work for a living as slavish and more ignominious than plundering.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: IX.14.1
  kind: p
  original: Damit sind wir angekommen an der Schwelle der Zivilisation.
  en: We have now reached the threshold of civilization.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: IX.14.2
  kind: p
  original: Sie wird eröffnet durch einen neuen Fortschritt der Teilung der Arbeit.
  en: This stage is inaugurated by a new progress in the division of labor.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: IX.14.3
  kind: p
  original: Auf der untersten Stufe produzierten die Menschen nur direkt für eignen Bedarf; die etwa vorkommenden Austauschakte waren vereinzelt, betrafen nur den zufällig sich einstellenden Überfluß.
  en: In the lower stage of barbarism production was carried on for use only; any acts of exchange were confined to single cases when a surplus was accidentally realized.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: IX.14.4
  kind: p
  original: Auf der Mittelstufe der Barbarei finden wir bei Hirtenvölkern in dem Vieh schon einen Besitz, der bei einer gewissen Größe der Herde regelmäßig einen Überschuß über den eignen Bedarf liefert, zugleich eine Teilung der Arbeit zwischen Hirtenvölkern und zurückgebliebnen Stämmen ohne Herden, damit zwei nebeneinander bestehende verschiedne Produktionsstufen und damit die Bedingungen eines regelmäßigen Austausches.
  en: In the middle stage of barbarism we find that the possession of cattle gave a regular surplus to the nomadic nations with sufficiently large herds. At the same time there was a division of labor between nomadic nations and backward nations without herds. The existence of two different stages of production side by side furnished the conditions necessary for a regular exchange.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: IX.14.5
  kind: p
  original: Die Oberstufe der Barbarei liefert uns die weitere Arbeitsteilung zwischen Ackerbau und Handwerk, damit Produktion eines stets wachsenden Teils der Arbeitserzeugnisse direkt für den Austausch, damit Erhebung des Austausches zwischen Einzelproduzenten zu einer Lebensnotwendigkeit der Gesellschaft.
  en: The upper stage of barbarism introduced a new division of labor between agriculture and handicrafts, resulting in the production of a continually increasing amount of commodities for the special purpose of exchange, so that exchange between individuals became a vital function of society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 160-161
- id: IX.14.6
  kind: p
  original: 'Die Zivilisation befestigt und steigert alle diese vorgefundnen Arbeitsteilungen, namentlich durch Schärfung des Gegensatzes von Stadt und Land (wobei die Stadt das Land ökonomisch beherrschen kann, wie im Altertum, oder auch das Land die Stadt, wie im Mittelalter), und fügt dazu eine dritte, ihr eigentümliche, entscheidend wichtige Arbeitsteilung: Sie erzeugt eine Klasse, die sich nicht mehr mit der Produktion beschäftigt, sondern nur mit dem Austausch der Produkte - die Kaufleute.'
  en: 'Civilization strengthened and intensified all the established divisions of labor, especially by rendering the contrast between city and country more pronounced. Either the town may have the economic control over the country, as during antiquity, or vice versa, as in the middle ages. A third division of labor was added by civilization: it created a class that did not take part in production, but occupied itself merely with the exchange of products--the merchants.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: IX.14.7
  kind: p
  original: Alle bisherigen Ansätze zur Klassenbildung hatten es noch ausschließlich mit der Produktion zu tun; sie schieden die bei der Produktion beteiligten Leute in Leitende und Ausführende oder aber in Produzenten auf größerer und auf kleinerer Stufenleiter.
  en: All former attempts at class formation were exclusively concerned with production. They divided the producers into directors and directed, or into producers on a more or less extensive scale.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.14.8
  kind: p
  original: Hier tritt zum erstenmal eine Klasse auf, die, ohne an der Produktion irgendwie Anteil zu nehmen, die Leitung der Produktion im ganzen und großen sich erobert und die Produzenten sich ökonomisch unterwirft; die sich zum unumgänglichen Vermittler zwischen je zwei Produzenten macht und sie beide ausbeutet.
  en: But here a class appears for the first time that captures the control of production in general and subjugates the producers to its rule, without taking the least part in production.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: IX.14.9
  kind: p
  original: Unter dem Vorwand, den Produzenten die Mühe und das Risiko des Austausches abzunehmen, den Absatz ihrer Produkte nach entfernten Märkten auszudehnen, damit die nützlichste Klasse der Bevölkerung zu werden, bildet sich eine Klasse von Parasiten aus, echten gesellschaftlichen Schmarotzertieren, die als Lohn für sehr geringe wirkliche Leistungen sowohl von der heimischen wie von der fremden Produktion den Rahm abschöpft, rasch enorme Reichtümer und entsprechenden gesellschaftlichen Einfluß erwirbt und eben deshalb während der Periode der Zivilisation zu immer neuen Ehren und immer größerer Beherrschung der Produktion berufen ist, bis sie endlich auch selbst ein eignes Produkt zutage fördert - die periodischen Handelskrisen.
  en: A class that makes itself the indispensable mediator between two producers and exploits them both under the pretext of saving them the trouble and risk of exchange, of extending the markets for their products to distant regions, and of thus becoming the most useful class in society; a class of parasites, genuine social ichneumons, that skim the cream off production at home and abroad as a reward for very insignificant services; that rapidly amass enormous wealth and gain social influence accordingly; that for this reason reap ever new honors and ever greater control of production during the period of civilization, until they at last bring to light a product of their own--periodical crises in industry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: IX.15.1
  kind: p
  original: Auf unsrer vorliegenden Entwicklungsstufe hat die junge Kaufmannschaft allerdings noch keine Ahnung von den großen Dingen, die ihr bevorstehn.
  en: At the stage of production under discussion, our young merchant class had no inkling as yet of the great future that was in store for them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: IX.15.2
  kind: p
  original: Aber sie bildet sich und macht sich unentbehrlich, und das genügt.
  en: But they continued to organize, to make themselves invaluable, and that was sufficient for the moment. At the same time metal coins came into use, and through them a new device for controlling the producers and their products.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: IX.15.3
  kind: p
  original: Mit ihr aber bildet sich aus das Metallgeld, die geprägte Münze, und mit dem Metallgeld ein neues Mittel zur Herrschaft des Nichtproduzenten über den Produzenten und seine Produktion.
  en: ''
  joined_to: IX.15.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '161'
- id: IX.15.4
  kind: p
  original: Die Ware der Waren, die alle andern Waren im Verborgnen in sich enthält, war entdeckt, das Zaubermittel, das sich nach Belieben in jedes wünschenswerte und gewünschte Ding verwandeln kann.
  en: The commodity of commodities that was hiding all other commodities in its mysterious bosom had been discovered, a charm that could be transformed at will into any desirable or coveted thing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: IX.15.5
  kind: p
  original: Wer es hatte, beherrschte die Welt der Produktion, und wer hatte es vor allen?
  en: Whoever held it in his possession had the world of production at his command. And who had it above all others?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.15.6
  kind: p
  original: Der Kaufmann.
  en: The merchant.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: IX.15.7
  kind: p
  original: In seiner Hand war der Kultus des Geldes sicher.
  en: In his hands the cult of money was safe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: IX.15.8
  kind: p
  original: Er sorgte dafür, daß es offenbar wurde, wie sehr alle Waren, damit alle Warenproduzenten, sich anbetend in den Staub werfen mußten vor dem Geld.
  en: He took care to make it plain that all commodities, and hence all producers, must prostrate themselves in adoration before money.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: IX.15.9
  kind: p
  original: Er bewies es praktisch, wie sehr alle andern Formen des Reichtums nur selber bloßer Schein werden gegenüber dieser Verkörperung des Reichtums als solchem.
  en: He proved by practice that all other forms of wealth are reduced to thin wraiths before this personification of riches.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 161-162
- id: IX.15.10
  kind: p
  original: Nie wieder ist die Macht des Geldes aufgetreten in solch ursprünglicher Roheit und Gewaltsamkeit wie in dieser ihrer Jugendperiode.
  en: Never again did the power of money show itself in such primordial brutality and violence as in its youthful days.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: IX.15.11
  kind: p
  original: Nach dem Warenkauf für Geld kam der Geldvorschuß, mit diesem der Zins und der Wucher.
  en: After the sale of commodities for money came the borrowing of money, resulting in interest and usury.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: IX.15.12
  kind: p
  original: Und keine Gesetzgebung späterer Zeit wirft den Schuldner so schonungs- und rettungslos zu den Füßen des wucherischen Gläubigers wie die altathenische und altrömische - und beide entstanden spontan, als Gewohnheitsrechte, ohne andern als den ökonomischen Zwang.
  en: And no legislation of any later period stretches the debtor so mercilessly at the feet of the speculating creditor as the antique Grecian and Roman codes--both of them spontaneous products of habit, without any other than economic pressure.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: IX.16.1
  kind: p
  original: Neben den Reichtum an Waren und Sklaven, neben den Geldreichtum trat nun auch der Reichtum an Grundbesitz.
  en: The wealth in commodities and slaves was now further increased by large holdings in land.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: IX.16.2
  kind: p
  original: Das Besitzrecht der einzelnen an den ihnen ursprünglich von Gens oder Stamm überlassenen Bodenparzellen hatte sich jetzt soweit befestigt, daß diese Parzellen ihnen erbeigentümlich gehörten.
  en: The titles of the individuals to the lots of land formerly assigned to them by the gens or tribe had become so well established, that these lots were now owned and inherited.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: IX.16.3
  kind: p
  original: Wonach sie in der letzten Zeit vor allem gestrebt, das war die Befreiung von dem Anrecht der Gentilgenossenschaft an die Parzelle, das ihnen eine Fessel wurde.
  en: What the individuals had most desired of late was the liberation from the claim of the gentiles to their lots, a claim which had become a veritable fetter for them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: IX.16.4
  kind: p
  original: Die Fessel wurde sie los - aber bald nachher auch das neue Grundeigentum.
  en: They were rid of this fetter--but soon after they were also rid of their lots.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: IX.16.5
  kind: p
  original: Volles, freies Eigentum am Boden, das hieß nicht nur Möglichkeit, den Boden unverkürzt und unbeschränkt zu besitzen, das hieß auch Möglichkeit, ihn zu veräußern.
  en: The full, free ownership of the soil implied not only the possibility of uncurtailed possession, but also of selling the soil.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: IX.16.6
  kind: p
  original: Solange der Boden Gentileigentum, existierte diese Möglichkeit nicht.
  en: As long as the soil belonged to the gens, this was impossible.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: IX.16.7
  kind: p
  original: Als aber der neue Grundbesitzer die Fessel des Obereigentums der Gens und des Stamms endgültig abstreifte, zerriß er auch das Band, das ihn bisher unlöslich mit dem Boden verknüpft hatte.
  en: But when the new land owner shook off the chains of the priority claim of the gens and tribe, he also tore the bond that had so long tied him indissolubly to the soil.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: IX.16.8
  kind: p
  original: Was das hieß, wurde ihm klargemacht durch das mit dem Privatgrundeigentum gleichzeitig erfundne Geld.
  en: What that meant was impressed on him by the money invented simultaneously with the advent of private property in land.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: IX.16.9
  kind: p
  original: Der Boden konnte nun Ware werden, die man verkauft und verpfändet.
  en: The soil could now become a commodity to be bought and sold.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: IX.16.10
  kind: p
  original: Kaum war das Grundeigentum eingeführt, so war auch die Hypothek schon erfunden (sieh Athen).
  en: Hardly had private ownership of land been introduced, when the mortgage put in its appearance (see Athens).
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: IX.16.11
  kind: p
  original: Wie der Hetärismus und die Prostitution an die Fersen der Monogamie, so klammert sich von nun an die Hypothek an die Fersen des Grundeigentums.
  en: As hetaerism and prostitution clung to the heels of monogamy, so does from now on the mortgage to private ownership in land.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: IX.16.12
  kind: p
  original: Ihr habt das volle, freie, veräußerliche Grundeigentum haben wollen, nun wohl, ihr habt's - tu l'as voulu, George Dandin!
  en: You have clamored for free, full, saleable land. Well, then, there you have it--tu l'as voulu, Georges Dandin; it was your own wish, George Dandin.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: IX.16.13
  kind: p
  original: '[Du hast es nicht besser gewollt, George Dandin!]'
  en: ''
  joined_to: IX.16.12
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '162'
- id: IX.17.1
  kind: p
  original: So ging mit Handelsausdehnung, Geld und Geldwucher, Grundeigentum und Hypothek die Konzentration und Zentralisation des Reichtums in den Händen einer wenig zahlreichen Klasse rasch voran, daneben die steigende Verarmung der Massen und die steigende Masse der Armen.
  en: Industrial expansion, money, usury, private land, and mortgage thus progressed with the concentration and centralization of wealth in the hands of a small class, accompanied by the increasing impoverishment of the masses and the increasing mass of paupers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: IX.17.2
  kind: p
  original: Die neue Reichtumsaristokratie, soweit sie nicht schon von vornherein mit dem alten Stammesadel zusammengefallen war, drängte ihn endgültig in den Hintergrund (in Athen, in Rom, bei den Deutschen).
  en: The new aristocracy of wealth, so far as it did not coincide with the old tribal nobility, forced the latter permanently into the background (in Athens, in Rome, among the Germans).
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: IX.17.3
  kind: p
  original: Und neben dieser Scheidung der Freien in Klassen nach dem Reichtum ging besonders in Griechenland eine ungeheure Vermehrung der Zahl der Sklaven, deren erzwungne Arbeit die Grundlage bildete, auf der sich der Überbau der ganzen Gesellschaft erhob.
  en: And this division of free men into classes according to their wealth was accompanied, especially in Greece, by an enormous increase in the number of slaves whose forced labor formed the basis on which the whole superstructure of society was reared.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IX.N2
  mew_page: 162-163
- id: IX.18.1
  kind: p
  original: Sehen wir uns nun danach um, was unter dieser gesellschaftlichen Umwälzung aus der Gentilverfassung geworden war.
  en: Let us now see what became of the gentile constitution through this revolution of society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: IX.18.2
  kind: p
  original: Gegenüber den neuen Elementen, die ohne ihr Zutun emporgewachsen, stand sie ohnmächtig da.
  en: Gentilism stood powerless in the face of the new elements that had grown without its assistance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: IX.18.3
  kind: p
  original: Ihre Voraussetzung war, daß die Glieder einer Gens, oder doch eines Stammes, auf demselben Gebiet vereinigt saßen, es ausschließlich bewohnten.
  en: It was dependent on the condition that the members of a gens, or of a tribe, should live together in the same territory and be its exclusive inhabitants.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: IX.18.4
  kind: p
  original: Das hatte längst aufgehört.
  en: That had long ceased to be the case.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: IX.18.5
  kind: p
  original: Überall waren Gentes und Stämme durcheinandergeworfen, überall wohnten Sklaven, Schutzverwandte, Fremde mitten unter den Bürgern.
  en: Gentes and tribes were everywhere hopelessly intermingled, slaves, clients, and foreigners lived among citizens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: IX.18.6
  kind: p
  original: Die erst gegen Ende der Mittelstufe der Barbarei erworbene Seßhaftigkeit wurde immer wieder durchbrochen durch die von Handel, Erwerbsveränderung, Grundbesitzwechsel bedingte Beweglichkeit und Veränderlichkeit des Wohnsitzes.
  en: The capacity for settling down permanently which had only been acquired near the end of the middle stage of barbarism, was time and again sidetracked by the necessity of changing the abode according to the dictates of commerce, different occupations and the transfer of land.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: IX.18.7
  kind: p
  original: Die Genossen der Gentilkörper konnten nicht mehr zusammentreten zur Wahrnehmung ihrer eignen gemeinsamen Angelegenheiten; nur unwichtige Dinge, wie die religiösen Feiern, wurden noch notdürftig besorgt.
  en: The members of the gentile organizations could no longer meet for the purpose of taking care of their common interests. Only matters of little importance, such as religious festivals, were still observed in an indifferent way.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.18.8
  kind: p
  original: Neben den Bedürfnissen und Interessen, zu deren Wahrung die Gentilkörper berufen und befähigt, waren aus der Umwälzung der Erwerbsverhältnisse und der daraus folgenden Änderung der gesellschaftlichen Gliederung neue Bedürfnisse und Interessen entstanden, die der alten Gentilordnung nicht nur fremd waren, sondern sie in jeder Weise durchkreuzten.
  en: Beside the wants and interests for the care of which the gentile organs were appointed and fitted, new wants and interests had arisen from the revolution of the conditions of existence and the resulting change in social classification. These new wants and interests were not only alien to the old gentile order, but thwarted it in every way.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.18.9
  kind: p
  original: Die Interessen der durch Teilung der Arbeit entstandnen Handwerkergruppen, die besondern Bedürfnisse der Stadt im Gegensatz zum Land, erforderten neue Organe; jede dieser Gruppen aber war aus Leuten der verschiedensten Gentes, Phratrien und Stämme zusammengesetzt, sie schloß sogar Fremde ein; diese Organe mußten sich also bilden außerhalb der Gentilverfassung, neben ihr, und damit gegen sie.
  en: The interests of the craftsmen created by division of labor, and the special necessities of a town differing from those of the country, required new organs. But every one of these groups was composed of people from different gentes, phratries, and tribes; they included even strangers. Hence the new organs necessarily had to form outside of the gentile constitution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: IX.18.10
  kind: p
  original: '- Und wiederum in jeder Gentilkörperschaft machte sich dieser Konflikt der Interessen geltend, der seine Spitze erreichte in der Vereinigung von Reichen und Armen, Wucherern und Schuldnern in derselben Gens und demselben Stamm.'
  en: But by the side of it meant against it. And again, in every gentile organization the conflict of interests made itself felt and reached its climax by combining rich and poor, usurers and debtors, in the same gens and tribe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.18.11
  kind: p
  original: '- Dazu kam die Masse der neuen, den Gentilgenossenschaften fremden Bevölkerung, die wie in Rom eine Macht im Lande werden konnte und dabei zu zahlreich war, um allmählich in die blutsverwandten Geschlechter und Stämme aufgenommen zu werden.'
  en: There was furthermore the mass of inhabitants who were strangers to the gentiles. These strangers could become very powerful, as in Rome, and they were too numerous to be gradually absorbed by the gentes and tribes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 163-164
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.18.12
  kind: p
  original: Dieser Masse gegenüber standen die Gentilgenossenschaften da als geschlossene, bevorrechtete Körperschaften; die ursprüngliche naturwüchsige Demokratie war umgeschlagen in eine gehässige Aristokratie.
  en: The gentiles confronted these masses as a compact body of privileged individuals. What had once been a natural democracy, had been transformed into an odious aristocracy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.18.13
  kind: p
  original: '- Schließlich war die Gentilverfassung herausgewachsen aus einer Gesellschaft, die keine inneren Gegensätze kannte, und war auch nur einer solchen angepaßt.'
  en: The gentile constitution had grown out of a society that did not know any internal contradictions, and it was only adapted to such a society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: IX.18.14
  kind: p
  original: Sie hatte kein Zwangsmittel außer der öffentlichen Meinung.
  en: It had no coercive power except public opinion.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: IX.18.15
  kind: p
  original: Hier aber war eine Gesellschaft entstanden, die kraft ihrer sämtlicher ökonomischer Lebensbedingungen sich in Freie und Sklaven, in ausbeutende Reiche und ausgebeutete Arme hatte spalten müssen, eine Gesellschaft, die diese Gegensätze nicht nur nicht wieder versöhnen konnte, sondern sie immer mehr auf die Spitze treiben mußte.
  en: But now a society had developed that by force of all its economic conditions of existence divided humanity into freemen and slaves, and exploiting rich and exploited poor. A society that not only could never reconcile these contradictions, but drove them ever more to a climax.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.18.16
  kind: p
  original: Eine solche Gesellschaft konnte nur bestehn entweder im fortwährenden offnen Kampf dieser Klassen gegeneinander oder aber unter der Herrschaft einer dritten Macht, die, scheinbar über den widerstreitenden Klassen stehend, ihren offnen Konflikt niederdrückte und den Klassenkampf höchstens auf ökonomischem Gebiet, in sogenannter gesetzlicher Form, sich ausfechten ließ.
  en: Such a society could only exist by a continual open struggle of all classes against one another, or under the supremacy of a third power that under a pretense of standing above the struggling classes stifled their open conflict and permitted a class struggle only on the economic field, in a so-called "legal" form.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: IX.18.17
  kind: p
  original: Die Gentilverfassung hatte ausgelebt.
  en: Gentilism had ceased to live.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: IX.18.18
  kind: p
  original: Sie war gesprengt durch die Teilung der Arbeit, und ihr Ergebnis, die Spaltung der Gesellschaft in Klassen.
  en: It was crushed by the division of labor and by its result, the division of society into classes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: IX.18.19
  kind: p
  original: Sie wurde ersetzt durch den Staat.
  en: It was replaced by the State.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: IX.19.1
  kind: p
  original: Die drei Hauptformen, in denen der Staat sich auf den Ruinen der Gentilverfassung erhebt, haben wir oben im einzelnen betrachtet.
  en: In preceding chapters we have shown by three concrete examples the three main forms in which the state was built up on the ruins of gentilism.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: IX.19.2
  kind: p
  original: 'Athen bietet die reinste, klassischste Form: Hier entspringt der Staat direkt und vorherrschend aus den Klassengegensätzen, die sich innerhalb der Gentilgesellschaft selbst entwickeln.'
  en: 'Athens represented the simplest, the classic type: the state grew directly and mainly out of class divisions that developed within gentile society.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: IX.19.3
  kind: p
  original: In Rom wird die Gentilgesellschaft eine geschlossene Aristokratie inmitten einer zahlreichen, außer ihr stehenden, rechtlosen aber pflichtenschuldigen Plebs; der Sieg der Plebs sprengt die alte Geschlechtsverfassung und errichtet auf ihren Trümmern den Staat, worin Gentilaristokratie und Plebs bald beide gänzlich aufgehn.
  en: In Rome the gentile organization became an exclusive aristocracy amid a numerous plebs of outsiders who had only duties, but no rights. The victory of the plebs burst the old gentile order asunder and erected on its remains the state which soon engulfed both gentile aristocracy and plebs.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.19.4
  kind: p
  original: Bei den deutschen Überwindern des Römerreichs endlich entspringt der Staat direkt aus der Eroberung großer fremder Gebiete, die zu beherrschen die Gentilverfassung keine Mittel bietet.
  en: Finally, among the German conquerors of the Roman empire, the state grew as a direct result of the conquest of large foreign territories which the gentile constitution was powerless to control.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: IX.19.5
  kind: p
  original: Weil aber mit dieser Eroberung weder ernstlicher Kampf mit der alten Bevölkerung verbunden ist noch eine fortgeschrittnere Arbeitsteilung; weil die ökonomische Entwicklungsstufe der Eroberten und die der Eroberer fast dieselbe ist, die ökonomische Basis der Gesellschaft also die alte bleibt, deshalb kann sich die Gentilverfassung lange Jahrhunderte hindurch in veränderter, territorialer Gestalt als Markverfassung forterhalten und selbst in den späteren Adels- und Patriziergeschlechtern, ja selbst in Bauerngeschlechtern wie in Dithmarschen, eine Zeitlang in abgeschwächter Form verjüngen.
  en: But this conquest did not necessitate either a serious fight with the former population or a more advanced division of labor. Conquerors and conquered were almost in the same stage of economic development, so that the economic basis of society remained undisturbed. Hence gentilism could preserve for many centuries an unchanged territorial character in the form of mark communes, and even rejuvenate itself in the nobility and patrician families of later years, or in the peasantry, as e. g. in Dithmarsia.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IX.N3
  mew_page: 164-165
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: IX.20.1
  kind: p
  original: Der Staat ist also keineswegs eine der Gesellschaft von außen aufgezwungne Macht; ebensowenig ist er "die Wirklichkeit der sittlichen Idee", "das Bild und die Wirklichkeit der Vernunft", wie Hegel behauptet.
  en: The state, then, is by no means a power forced on society from outside; neither is it the "realization of the ethical idea," "the image and the realization of reason," as Hegel maintains.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: IX.20.2
  kind: p
  original: Er ist vielmehr ein Produkt der Gesellschaft auf bestimmter Entwicklungsstufe; er ist das Eingeständnis, daß diese Gesellschaft sich in einen unlösbaren Widerspruch mit sich selbst verwickelt, sich in unversöhnliche Gegensätze gespalten hat, die zu bannen sie ohnmächtig ist.
  en: It is simply a product of society at a certain stage of evolution. It is the confession that this society has become hopelessly divided against itself, has entangled itself in irreconcilable contradictions which it is powerless to banish.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.20.3
  kind: p
  original: Damit aber diese Gegensätze, Klassen mit widerstreitenden ökonomischen Interessen nicht sich und die Gesellschaft in fruchtlosem Kampf verzehren, ist eine scheinbar über der Gesellschaft stehende Macht nötig geworden, die den Konflikt dämpfen, innerhalb der Schranken der "Ordnung" halten soll; und diese, aus der Gesellschaft hervorgegangne, aber sich über sie stellende, sich ihr mehr und mehr entfremdende Macht ist der Staat.
  en: In order that these contradictions, these classes with conflicting economic interests, may not annihilate themselves and society in a useless struggle, a power becomes necessary that stands apparently above society and has the function of keeping down the conflicts and maintaining "order." And this power, the outgrowth of society, but assuming supremacy over it and becoming more and more divorced from it, is the state.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.21.1
  kind: p
  original: Gegenüber der alten Gentilorganisation kennzeichnet sich der Staat erstens durch die Einteilung der Staatsangehörigen nach dem Gebiet.
  en: The state differs from gentilism in that it first divides its members by territories.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: IX.21.2
  kind: p
  original: Die alten, durch Blutbande gebildeten und zusammengehaltnen Gentilgenossenschaften, wie wir gesehn, waren unzureichend geworden, großenteils weil sie eine Bindung der Genossen an ein bestimmtes Gebiet voraussetzten und diese längst aufgehört hatte.
  en: As we have seen, the old bonds of blood kinship uniting the gentile bodies had become inefficient, because they were dependent on the condition, now no longer a fact, that all gentiles should live on a certain territory.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: IX.21.3
  kind: p
  original: Das Gebiet war geblieben, aber die Menschen waren mobil geworden.
  en: The territory was the same; but the human beings had changed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: IX.21.4
  kind: p
  original: Man nahm also die Gebietseinteilung als Ausgangspunkt und ließ die Bürger ihre öffentlichen Rechte und Pflichten da erfüllen, wo sie sich niederließen, ohne Rücksicht auf Gens und Stamm.
  en: Hence the division by territories was chosen as the point of departure, and citizens had to exercise their rights and duties wherever they chose their abode without regard to gens and tribe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: IX.21.5
  kind: p
  original: Diese Organisation der Staatsangehörigen nach der Ortsangehörigkeit ist allen Staaten gemeinsam.
  en: This organization of inhabitants by localities is a common feature of all states.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: IX.21.6
  kind: p
  original: Uns kommt sie daher natürlich vor; wir haben aber gesehn, wie harte und langwierige Kämpfe erfordert waren, bis sie in Athen und Rom sich an die Stelle der alten Organisation nach Geschlechtern setzen konnte.
  en: It seems natural to us now. But we have seen what long and hard fighting was required before it could take, in Athens and Rome, the place of the old organization by blood kinship.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.22.1
  kind: p
  original: Das zweite ist die Einrichtung einer öffentlichen Gewalt, welche nicht mehr unmittelbar zusammenfällt mit der sich selbst als bewaffnete Macht organisierenden Bevölkerung.
  en: In the second place, the state created a public power of coercion that did no longer coincide with the old self-organized and armed population.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: IX.22.2
  kind: p
  original: Diese besondre, öffentliche Gewalt ist nötig, weil eine selbsttätige bewaffnete Organisation der Bevölkerung unmöglich geworden seit der Spaltung in Klassen.
  en: This special power of coercion is necessary, because a self-organized army of the people has become impossible since the division of society into classes took place.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: IX.22.3
  kind: p
  original: Die Sklaven gehören auch zur Bevölkerung; die 90.000 athenischen Bürger bilden gegenüber den 365.000 Sklaven nur eine bevorrechtete Klasse.
  en: For the slaves belonged also to society. The 90,000 citizens of Athens formed only a privileged class compared to the 365,000 slaves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 165-166
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.22.4
  kind: p
  original: Das Volksheer der athenischen Demokratie war eine aristokratische öffentliche Gewalt gegenüber den Sklaven und hielt sie im Zaum; aber auch um die Bürger im Zaum zu halten, wurde eine Gendarmerie nötig, wie oben erzählt.
  en: The popular army of the Athenian democracy was an aristocratic public power designed to keep the slaves down. But we have seen that a police force became also necessary to maintain order among the citizens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.22.5
  kind: p
  original: Diese öffentliche Gewalt existiert in jedem Staat; sie besteht nicht bloß aus bewaffneten Menschen, sondern auch aus sachlichen Anhängseln, Gefängnissen und Zwangsanstalten aller Art, von denen die Gentilgesellschaft nichts wußte.
  en: This public power of coercion exists in every state. It is not composed of armed men alone, but has also such objects as prisons and correction houses attached to it, that were unknown to gentilism.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.22.6
  kind: p
  original: Sie kann sehr unbedeutend, fast verschwindend sein in Gesellschaften mit noch unentwickelten Klassengegensätzen und auf abgelegnen Gebieten, wie zeit- und ortsweise in den Vereinigten Staaten Amerikas.
  en: It may be very small, almost infinitesimal, in societies with feebly developed class antagonisms and in out of the way places, as was once the case in certain regions of the United States.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: IX.22.7
  kind: p
  original: Sie verstärkt sich aber in dem Maß, wie die Klassengegensätze innerhalb des Staats sich verschärfen und wie die einander begrenzenden Staaten größer und volkreicher werden - man sehe nur unser heutiges Europa an, wo Klassenkampf und Eroberungskonkurrenz die öffentliche Macht auf eine Höhe emporgeschraubt haben, auf der sie die ganze Gesellschaft und selbst den Staat zu verschlingen droht.
  en: But it increases in the same ratio in which the class antagonisms become more pronounced, and in which neighboring states become larger and more populous. A conspicuous example is modern Europe, where the class struggles and wars of conquest have nursed the public power to such a size that it threatens to swallow the whole society and the state itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.23.1
  kind: p
  original: Um diese öffentliche Macht aufrechtzuerhalten, sind Beiträge der Staatsbürger nötig - die Steuern.
  en: In order to maintain this public power, contributions of the citizens become necessary--the taxes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: IX.23.2
  kind: p
  original: Diese waren der Gentilgesellschaft vollständig unbekannt.
  en: These were absolutely unknown in gentile society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: IX.23.3
  kind: p
  original: Wir aber wissen heute genug davon zu erzählen.
  en: But to-day we get our full measure of them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: IX.23.4
  kind: p
  original: Mit der fortschreitenden Zivilisation reichen auch sie nicht mehr; der Staat zieht Wechsel auf die Zukunft, macht Anleihen, Staatsschulden.
  en: As civilization makes further progress, these taxes are no longer sufficient to cover public expenses. The state makes drafts on the future, contracts loans, public debts.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.23.5
  kind: p
  original: Auch davon weiß das alte Europa ein Liedchen zu singen.
  en: Old Europe can tell a story of them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: IX.24.1
  kind: p
  original: Im Besitz der öffentlichen Gewalt und des Rechts der Steuereintreibung, stehn die Beamten nun da als Organe der Gesellschaft über der Gesellschaft.
  en: In possession of the public power and of the right of taxation, the officials in their capacity as state organs are now exalted above society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: IX.24.2
  kind: p
  original: Die freie, willige Achtung, die den Organen der Gentilverfassung gezollt wurde, genügt ihnen nicht, selbst wenn sie sie haben könnten; Träger einer der Gesellschaft entfremdenden Macht, müssen sie in Respekt gesetzt werden durch Ausnahmsgesetzs, kraft deren sie einer besondren Heiligkeit und Unverletzlichkeit genießen.
  en: The free and voluntary respect that was accorded to the organs of gentilism does not satisfy them any more, even if they might have it. Representatives of a power that is divorced from society, they must enforce respect by exceptional laws that render them specially sacred and inviolable.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
  en_note: 'Untermann''s note [40]: The recent demand for a law declaring the person of the U. S. President sacred above all other representatives of the public power and making an assault on him an exceptional crime is a very good case in point.'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.24.3
  kind: p
  original: Der lumpigste Polizeidiener des zivilisierten Staats hat mehr "Autorität" als alle Organe der Gentilgesellschaft zusammengenommen; aber der mächtigste Fürst und der größte Staatsmann oder Feldherr der Zivilisation kann den geringsten Gentilvorsteher beneiden um die unerzwungne und unbestrittene Achtung, die ihm gezollt wird.
  en: The lowest police employee of the civilized state has more "authority" than all the organs of gentilism combined. But the mightiest prince and the greatest statesman or general of civilization may look with envy on the spontaneous and undisputed esteem that was the privilege of the least gentile sachem.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.24.4
  kind: p
  original: Der eine steht eben mitten in der Gesellschaft; der andre ist genötigt, etwas vorstellen zu wollen außer und über ihr.
  en: The one stands in the middle of society, the other is forced to assume a position outside and above it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: IX.25.1
  kind: p
  original: Da der Staat entstanden ist aus dem Bedürfnis, Klassengegensätze im Zaum zu halten, da er aber gleichzeitig mitten im Konflikt dieser Klassen entstanden ist, so ist er in der Regel Staat der mächtigsten, ökonomisch herrschenden Klasse, die vermittelst seiner auch politisch herrschende Klasse wird und so neue Mittel erwirbt zur Niederhaltung und Ausbeutung der unterdrückten Klasse.
  en: The state is the result of the desire to keep down class conflicts. But having arisen amid these conflicts, it is as a rule the state of the most powerful economic class that by force of its economic supremacy becomes also the ruling political class and thus acquires new means of subduing and exploiting the oppressed masses.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 166-167
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.25.2
  kind: p
  original: So war der antike Staat vor allem Staat der Sklavenbesitzer zur Niederhaltung der Sklaven, wie der Feudalstaat Organ des Adels zur Niederhaltung der leibeignen und hörigen Bauern und der moderne Repräsentativstaat Werkzeug der Ausbeutung der Lohnarbeit durch das Kapital.
  en: The antique state was, therefore, the state of the slave owners for the purpose of holding the slaves in check. The feudal state was the organ of the nobility for the oppression of the serfs and dependent farmers. The modern representative state is the tool of the capitalist exploiters of wage labor.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: IX.25.3
  kind: p
  original: Ausnahmsweise indes kommen Perioden vor, wo die kämpfenden Klassen einander so nahe das Gleichgewicht halten, daß die Staatsgewalt als scheinbare Vermittlerin momentan eine gewisse Selbständigkeit gegenüber beiden erhält.
  en: At certain periods it occurs exceptionally that the struggling classes balance each other so nearly that the public power gains a certain degree of independence by posing as the mediator between them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: IX.25.4
  kind: p
  original: So die absolute Monarchie des 17. und 18. Jahrhunderts, die Adel und Bürgertum gegeneinander balanciert; so der Bonapartismus des ersten und namentlich des zweiten französischen Kaiserreichs, der das Proletariat gegen die Bourgeoisie und die Bourgeoisie gegen das Proletariat ausspielte.
  en: The absolute monarchy of the seventeenth and eighteenth century was in such a position, balancing the nobles and the burghers against one another. So was the Bonapartism of the first, and still more of the second, empire, playing the proletariat against the bourgeoisie and vice versa.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.25.5
  kind: p
  original: 'Die neueste Leistung in dieser Art, bei der Herrscher und Beherrschte gleich komisch erscheinen, ist das neue deutsche Reich Bismarckscher Nation: Hier werden Kapitalisten und Arbeiter gegeneinander balanciert und gleichmäßig geprellt zum Besten der verkommnen preußischen Krautjunker.'
  en: The latest performance of this kind, in which ruler and ruled appear equally ridiculous, is the new German empire of Bismarckian make, in which capitalists and laborers are balanced against one another and equally cheated for the benefit of the degenerate Prussian cabbage junkers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
  en_note: 'Untermann''s note [41]: "Junker" is a contemptuous term for the land-owning nobility.'
- id: IX.26.1
  kind: p
  original: In den meisten geschichtlichen Staaten werden außerdem die den Staatsbürgern zugestandnen Rechte nach dem Vermögen abgestuft und damit direkt ausgesprochen, daß der Staat eine Organisation der besitzenden Klasse zum Schutz gegen die nichtbesitzende ist.
  en: In most of the historical states, the rights of the citizens are differentiated according to their wealth. This is a direct confirmation of the fact that the state is organized for the protection of the possessing against the non-possessing classes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.26.2
  kind: p
  original: So schon in den athenischen und römischen Vermögensklassen.
  en: The Athenian and Roman classification by incomes shows this.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: IX.26.3
  kind: p
  original: So im mittelalterlichen Feudalstaat, wo die politische Machtstellung sich nach dem Grundbesitz gliederte.
  en: It is also seen in the medieval state of feudalism in which the political power depended on the quantity of real estate.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: IX.26.4
  kind: p
  original: So im Wahlzensus der modernen Repräsentativstaaten.
  en: It is again seen in the electoral qualifications of the modern representative state.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: IX.26.5
  kind: p
  original: Diese politische Anerkennung des Besitzunterschieds ist indes keineswegs wesentlich.
  en: The political recognition of the differences in wealth is by no means essential.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: IX.26.6
  kind: p
  original: Im Gegenteil, sie bezeichnet eine niedrige Stufe der staatlichen Entwicklung.
  en: On the contrary, it marks a low stage of state development.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: IX.26.7
  kind: p
  original: Die höchste Staatsform, die demokratische Republik, die in unsern modernen Gesellschaftsverhältnissen mehr und mehr unvermeidliche Notwendigkeit wird und die Staatsform ist, in der der letzte Entscheidungskampf zwischen Proletariat und Bourgeoisie allein ausgekämpft werden kann - die demokratische Republik weiß offiziell nichts mehr von Besitzunterschieden.
  en: The highest form of the state, the democratic republic, knows officially nothing of property distinctions. It is that form of the state which under modern conditions of society becomes more and more an unavoidable necessity. The last decisive struggle between proletariat and bourgeoisie can only be fought out under this state form.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
  en_note: 'Untermann''s note [42]: In the United States, the poll tax is an indirect property qualification, as it strikes those who, through lack of employment, sickness or invalidity, are unable to spare the amount, however small, of this tax. Furthermore, the laws requiring a continuous residence in the precinct, the town, the county, and the State as a qualification for voters have the effect of disqualifying a great number of workingmen who are forced to change their abode according to their opportunities for employment. And the educational qualifications which especially the Southern States are rigidly enforcing tend to disfranchise the great mass of the negroes, who form the main body of the working class in those States. Untermann''s note [43]: In Belgium, where the proletariat is now on the verge of gaining political supremacy, the battle cry is: "S. U. et R. P." (Suffrage Universelle et Representation Proportionelle).'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: IX.26.8
  kind: p
  original: In ihr übt der Reichtum seine Macht indirekt, aber um so sichrer aus.
  en: In such a state, wealth exerts its power indirectly, but all the more safely.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: IX.26.9
  kind: p
  original: Einerseits in der Form der direkten Beamtenkorruption, wofür Amerika klassisches Muster, andrerseits in der Form der Allianz von Regierung und Börse, die sich um so leichter vollzieht, je mehr die Staatsschulden steigen und je mehr Aktiengesellschaften nicht nur den Transport, sondern auch die Produktion selbst in ihren Händen konzentrieren und wiederum in der Börse ihren Mittelpunkt finden.
  en: This is done partly in the form of direct corruption of officials, after the classical type of the United States, or in the form of an alliance between government and bankers which is established all the more easily when the public debt increases and when corporations concentrate in their hands not only the means of transportation, but also production itself, using the stock exchange as a center.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: IX.26.10
  kind: p
  original: Dafür ist außer Amerika die neueste französische Republik ein schlagendes Beispiel, und auch die biedre Schweiz hat auf diesem Felde das ihrige geleistet.
  en: The United States and the latest French republic are striking examples, and good old Switzerland has contributed its share to illustrate this point.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 167-168
- id: IX.26.11
  kind: p
  original: Daß aber zu diesem Bruderbund von Regierung und Börse keine demokratische Republik erforderlich, beweist außer England das neue deutsche Reich, wo man nicht sagen kann, wen das allgemeine Stimmrecht höher gehoben hat, Bismarck oder Bleichröder.
  en: That a democratic republic is not necessary for this fraternal bond between stock exchange and government is proved by England and last, not least, Germany, where it is doubtful whether Bismarck or Bleichroeder was more favored by the introduction of universal suffrage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
  en_note: 'Untermann''s note [44]: Suffrage in Germany, though universal for men is by no means equal, but founded on property qualifications. In Prussia, e. g., a three class system of voting is in force which is best illustrated by the following figures: In 1898 there were 6,447,253 voters; 3.26 per cent belonged to the first class, 11.51 per cent to the second class, and 85.35 per cent to the third class. But the 947,218 voters of the first and second classes had twice as many votes as the five and a half millions of the third class.'
- id: IX.26.12
  kind: p
  original: Und endlich herrscht die besitzende Klasse direkt mittelst des allgemeinen Stimmrechts.
  en: The possessing class rules directly through universal suffrage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: IX.26.13
  kind: p
  original: Solange die unterdrückte Klasse, also in unserm Fall das Proletariat, noch nicht reif ist zu seiner Selbstbefreiung, solange wird sie, der Mehrzahl nach, die bestehende Gesellschaftsordnung als die einzig mögliche erkennen und politisch der Schwanz der Kapitalistenklasse, ihr äußerster linker Flügel sein.
  en: For as long as the oppressed class, in this case the proletariat, is not ripe for its economic emancipation, just so long will its majority regard the existing order of society as the only one possible, and form the tail, the extreme left wing, of the capitalist class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: IX.26.14
  kind: p
  original: In dem Maß aber, worin sie ihrer Selbstemanzipation entgegenreift, in dem Maß konstituiert sie sich als eigne Partei, wählt ihre eignen Vertreter, nicht die der Kapitalisten.
  en: But the more the proletariat matures toward its self-emancipation, the more does it constitute itself as a separate class and elect its own representatives in place of the capitalists.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: IX.26.15
  kind: p
  original: Das allgemeine Stimmrecht ist so der Gradmesser der Reife der Arbeiterklasse.
  en: Universal suffrage is the gauge of the maturity of the working class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: IX.26.16
  kind: p
  original: Mehr kann und wird es nie sein im heutigen Staat; aber das genügt auch.
  en: It can and will never be anything else but that in the modern state.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: IX.26.17
  kind: p
  original: An dem Tage, wo das Thermometer des allgemeinen Stimmrechts den Siedepunkt bei den Arbeitern anzeigt, wissen sie sowohl wie die Kapitalisten, woran sie sind.
  en: But that is sufficient. On the day when the thermometer of universal suffrage reaches its boiling point among the laborers, they as well as the capitalists will know what to do.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.27.1
  kind: p
  original: Der Staat ist also nicht von Ewigkeit her.
  en: The state, then, did not exist from all eternity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: IX.27.2
  kind: p
  original: Es hat Gesellschaften gegeben, die ohne ihn fertig wurden, die von Staat und Staatsgewalt keine Ahnung hatten.
  en: There have been societies without it, that had no idea of any state or public power.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: IX.27.3
  kind: p
  original: Auf einer bestimmten Stufe der ökonomischen Entwicklung, die mit Spaltung der Gesellschaft in Klassen notwendig verbunden war, wurde durch diese Spaltung der Staat eine Notwendigkeit.
  en: At a certain stage of economic development, which was of necessity accompanied by a division of society into classes, the state became the inevitable result of this division.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: IX.27.4
  kind: p
  original: Wir nähern uns jetzt mit raschen Schritten einer Entwicklungsstufe der Produktion, auf der das Dasein dieser Klassen nicht nur aufgehört hat, eine Notwendigkeit zu sein, sondern ein positives Hindernis der Produktion wird.
  en: We are now rapidly approaching a stage of evolution in production, in which the existence of classes has not only ceased to be a necessity, but becomes a positive fetter on production.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: IX.27.5
  kind: p
  original: Sie werden fallen, ebenso unvermeidlich, wie sie früher entstanden sind.
  en: Hence these classes must fall as inevitably as they once arose.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: IX.27.6
  kind: p
  original: Mit ihnen fällt unvermeidlich der Staat.
  en: The state must irrevocably fall with them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: IX.27.7
  kind: p
  original: 'Die Gesellschaft, die die Produktion auf Grundlage freier und gleicher Assoziation der Produzenten neu organisiert, versetzt die ganze Staatsmaschine dahin, wohin sie dann gehören wird: ins Museum der Altertümer, neben das Spinnrad und die bronzene Axt.'
  en: 'The society that is to reorganize production on the basis of a free and equal association of the producers, will transfer the machinery of state where it will then belong: into the Museum of Antiquities by the side of the spinning wheel and the bronze ax.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: IX.28.1
  kind: p
  original: Die Zivilisation ist also nach dem Vorausgeschickten die Entwicklungsstufe der Gesellschaft, auf der die Teilung der Arbeit, der aus ihr entspringende Austausch zwischen einzelnen und die beides zusammenfassende Warenproduktion zur vollen Entfaltung kommen und die ganze frühere Gesellschaft umwälzen.
  en: Civilization is, as we have seen, that stage of society, in which the division of labor, the resulting exchange between individuals, and the production of commodities combining them, reach their highest development and revolutionize the whole society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: IX.29.1
  kind: p
  original: Die Produktion aller früheren Gesellschaftsstufen war wesentlich eine gemeinsame, wie auch die Konsumtion unter direkter Verteilung der Produkte innerhalb größerer oder kleinerer kommunistischer Gemeinwesen vor sich ging.
  en: The production of all former stages of society was mainly collective, and consumption was carried on by direct division of products within more or less small communes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 168-169
- id: IX.29.2
  kind: p
  original: Diese Gemeinsamkeit der Produktion fand statt innerhalb der engsten Schranken; aber sie führte mit sich die Herrschaft der Produzenten über ihren Produktionsprozeß und ihr Produkt.
  en: This collective production was confined within the narrowest limits. But it implied the control of production and of the products by the producers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.29.3
  kind: p
  original: 'Sie wissen, was aus dem Produkt wird: Sie verzehren es, es verläßt ihre Hände nicht; und solange die Produktion auf dieser Grundlage betrieben wird, kann sie den Produzenten nicht über den Kopf wachsen, keine gespenstischen fremden Mächte ihnen gegenüber erzeugen, wie dies in der Zivilisation regelmäßig und unvermeidlich der Fall ist.'
  en: 'They knew what became of their product: it did not leave their hands until it was consumed by them. As long as production moved on this basis, it could not grow beyond the control of the producers, and it could not create any strange ghostly forces against them. Under civilization, however, this is the inevitable rule.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: IX.30.1
  kind: p
  original: Aber in diesen Produktionsprozeß schiebt sich die Teilung der Arbeit langsam ein.
  en: Into the simple process of production, the division of labor was gradually interpolated.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: IX.30.2
  kind: p
  original: Sie untergräbt die Gemeinsamkeit der Produktion und Aneignung, sie erhebt die Aneignung durch einzelne zur überwiegenden Regel und erzeugt damit den Austausch zwischen einzelnen - wie, das haben wir oben untersucht.
  en: It undermined the communism of production and consumption, it made the appropriation of products by single individuals the prevailing rule, and thus introduced the exchange between individuals, in the manner mentioned above.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: IX.30.3
  kind: p
  original: Allmählich wird die Warenproduktion herrschende Form.
  en: Gradually, the production of commodities became the rule.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: IX.31.1
  kind: p
  original: Mit der Warenproduktion, der Produktion nicht mehr für eignen Verbrauch, sondern für den Austausch, wechseln die Produkte notwendig die Hände.
  en: This mode of production for exchange, not for home consumption, necessarily passes the products on from hand to hand.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: IX.31.2
  kind: p
  original: Der Produzent gibt sein Produkt im Tausch weg, er weiß nicht mehr, was daraus wird.
  en: The producer gives his product away in exchange. He does no longer know what becomes of it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.31.3
  kind: p
  original: Sowie das Geld, und mit dem Geld der Kaufmann, als Vermittler zwischen die Produzenten tritt, wird der Austauschprozeß noch verwickelter, das schließliche Schicksal der Produkte noch Ungewisser.
  en: With the advent of money and of the trader who steps in as a middleman between the producers, the process of exchange becomes still more complicated. The fate of the products becomes still more uncertain.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.31.4
  kind: p
  original: Der Kaufleute sind viele, und keiner von ihnen weiß, was der andre tut.
  en: The number of merchants is great and one does not know what the other is doing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: IX.31.5
  kind: p
  original: Die Waren gehn nun schon nicht bloß von Hand zu Hand, sie gehn auch von Markt zu Markt; die Produzenten haben die Herrschaft über die Gesamtproduktion ihres Lebenskreises verloren, und die Kaufleute haben sie nicht überkommen.
  en: The products now pass not only from hand to hand, but also from market to market. The producers have lost the control of the aggregate production in their sphere of life, and the merchants have not yet acquired this control.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.31.6
  kind: p
  original: Produkte und Produktion verfallen dem Zufall.
  en: Products and production become the victims of chance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: IX.32.1
  kind: p
  original: Aber Zufall, das ist nur der eine Pol eines Zusammenhangs, dessen andrer Pol Notwendigkeit heißt.
  en: But chance is only one pole of an interrelation, the other pole of which is called necessity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: IX.32.2
  kind: p
  original: In der Natur, wo auch der Zufall zu herrschen scheint, haben wir längst auf jedem einzelnen Gebiet die innere Notwendigkeit und Gesetzmäßigkeit nachgewiesen, die in diesem Zufall sich durchsetzt.
  en: In nature, where chance seems to reign also, we have long ago demonstrated the innate necessity and law that determines the course of chance on every line.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: IX.32.3
  kind: p
  original: Was aber von der Natur, das gilt auch von der Gesellschaft.
  en: But what is true of nature, holds also good of society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: IX.32.4
  kind: p
  original: Je mehr eine gesellschaftliche Tätigkeit, eine Reihe gesellschaftlicher Vorgänge der bewußten Kontrolle der Menschen zu mächtig wird, ihnen über den Kopf wächst, je mehr sie dem puren Zufall überlassen scheint, desto mehr setzen sich in diesem Zufall die ihr eigentümlichen, innewohnenden Gesetze wie mit Naturnotwendigkeit durch.
  en: Whenever a social function or a series of social processes become too powerful for the control of man, whenever they grow beyond the grasp of man and seem to be left to mere chance, then the peculiar and innate laws of such processes shape the course of chance with increased elementary necessity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: IX.32.5
  kind: p
  original: Solche Gesetze beherrschen auch die Zufälligkeiten der Warenproduktion und des Warenaustausches; dem einzelnen Produzenten und Austauschenden stehn sie gegenüber als fremde, anfangs sogar unerkannte Mächte, deren Natur erst mühsam erforscht und ergründet werden muß.
  en: Such laws also control the vicissitudes of the production and exchange of commodities. For the individual producer and exchanger, these laws are strange, and often unknown, forces, the nature of which must be laboriously investigated and ascertained.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.32.6
  kind: p
  original: Diese ökonomischen Gesetze der Warenproduktion modifizieren sich mit den verschiednen Entwicklungsstufen dieser Produktionsform; im ganzen und großen aber steht die gesamte Periode der Zivilisation unter ihrer Herrschaft.
  en: These economic laws of production are modified by the different stages of this form of production. But generally speaking, the entire period of civilization is dominated by these laws.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 169-170
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.32.7
  kind: p
  original: Und noch heute beherrscht das Produkt die Produzenten; noch heute wird die Gesamtproduktion der Gesellschaft geregelt, nicht durch gemeinsam überlegten Plan, sondern durch blinde Gesetze, die sich geltend machen mit elementarer Gewalt, in letzter Instanz in den Gewittern der periodischen Handelskrisen.
  en: To this day, the product controls the producer. To this day, the aggregate production of society is managed, not on a uniform plan, but by blind laws, that rule with elementary force and find their final expression in the storms of periodical commercial crises.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.33.1
  kind: p
  original: Wir sahen oben, wie auf einer ziemlich frühen Entwicklungsstufe der Produktion die menschliche Arbeitskraft befähigt wird, ein beträchtlich größeres Produkt zu liefern, als zum Unterhalt der Produzenten erforderlich ist, und wie diese Entwicklungsstufe in der Hauptsache dieselbe ist, auf der Teilung der Arbeit und Austausch zwischen einzelnen aufkommen.
  en: We have seen that human labor power is enabled at a very early stage of production to produce considerably more than is needed to maintain the producer. We have found that this stage coincided in general with the first appearance of the division of labor and of exchange between individuals.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.33.2
  kind: p
  original: Es dauerte nun nicht lange mehr, bis die große "Wahrheit" entdeckt wurde, daß auch der Mensch eine Ware sein kann; daß die menschliche Kraft austauschbar und vernutzbar ist, indem man den Menschen in einen Sklaven verwandelt.
  en: Now, it was not long before the great truth was discovered that man may himself be a commodity, and that human labor power may be exchanged and exploited by transforming a man into a slave.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T4
    editions: '1884'
    reading: Arbeitskraft
    base_text: … daß die menschliche Kraft ‸ austauschbar und vernutzbar ist, …
  mew_page: '170'
- id: IX.33.3
  kind: p
  original: Kaum hatten die Menschen angefangen auszutauschen, so wurden sie auch schon selbst ausgetauscht.
  en: Hardly had exchange between men been established, when men themselves were also exchanged.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: IX.33.4
  kind: p
  original: Das Aktivum wurde zum Passivum, die Menschen mochten wollen oder nicht.
  en: The active asset became a passive liability, whether man wanted it or not.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: IX.34.1
  kind: p
  original: Mit der Sklaverei, die unter der Zivilisation ihre vollste Entfaltung erhielt, trat die erste große Spaltung der Gesellschaft ein in eine ausbeutende und eine ausgebeutete Klasse.
  en: Slavery, which reaches its highest development in civilization, introduced the first great division of an exploited and an exploiting class into society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: IX.34.2
  kind: p
  original: Diese Spaltung dauerte fort während der ganzen zivilisierten Periode.
  en: This division continued during the whole period of civilization.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: IX.34.3
  kind: p
  original: 'Die Sklaverei ist die erste, der antiken Welt eigentümliche Form der Ausbeutung: ihr folgt die Leibeigenschaft im Mittelalter, die Lohnarbeit in der neueren Zeit.'
  en: Slavery is the first form of exploitation, characteristic of the antique world. Then followed feudalism in the middle ages, and wage labor in recent times.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.34.4
  kind: p
  original: Es sind dies die drei großen Formen der Knechtschaft, wie sie für die drei großen Epochen der Zivilisation charakteristisch sind; offne, und neuerdings verkleidete, Sklaverei geht stets danebenher.
  en: These are the three great forms of servitude, characteristic of the three great epochs of civilization. Their invariable mark is either open or, in modern times, disguised slavery.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.35.1
  kind: p
  original: Die Stufe der Warenproduktion, womit die Zivilisation beginnt, wird ökonomisch bezeichnet durch die Einführung 1. des Metallgeldes, damit des Geldkapitals, des Zinses und Wuchers; 2. der Kaufleute als vermittelnder Klasse zwischen den Produzenten; 3. des Privatgrundeigentums und der Hypothek und 4. der Sklavenarbeit als herrschender Produktionsform.
  en: The stage of commodity production introducing civilization is marked economically by the introduction of (1) metal coins and, thus, of money as capital, of interest, and of usury; (2) merchants as middlemen between producers; (3) private property and mortgage; (4) slave labor as the prevailing form of production.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: IX.35.2
  kind: p
  original: Die der Zivilisation entsprechende und mit ihr definitiv zur Herrschaft kommende Familienform ist die Monogamie, die Herrschaft des Mannes über die Frau, und die Einzelfamilie als wirtschaftliche Einheit der Gesellschaft.
  en: The form of the family corresponding to civilization and becoming its pronounced custom is monogamy, the supremacy of man over woman, and the monogamous family as the economic unit of society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: IX.35.3
  kind: p
  original: Die Zusammenfassung der zivilisierten Gesellschaft ist der Staat, der in allen mustergültigen Perioden ausnahmslos der Staat der herrschenden Klasse ist und in allen Fällen wesentlich Maschine zur Niederhaltung der unterdrückten, ausgebeuteten Klasse bleibt.
  en: The aggregation of civilized society is the state, which throughout all typical periods is the state of the ruling class, and in all cases mainly a machine for controlling the oppressed and exploited class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 170-171
- id: IX.35.4
  kind: p
  original: 'Bezeichnend für die Zivilisation ist noch: einerseits die Fixierung des Gegensatzes von Stadt und Land als der Grundlage der gesamten gesellschaftlichen Arbeitsteilung; andrerseits die Einführung der Testamente, wodurch der Eigentümer auch noch über seinen Tod hinaus über sein Eigentum verfügen kann.'
  en: Civilization is furthermore characterized on one side by the permanent introduction of the contrast between city and country as the basis of the entire division of social labor; on the other side by the introduction of the testament by which the property holder is enabled to dispose of his property beyond the hour of his death.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: IX.35.5
  kind: p
  original: Diese der alten Gentilverfassung direkt ins Gesicht schlagende Einrichtung war in Athen bis auf Solon unbekannt; in Rom ist sie schon früh eingeführt, wann, wissen wir nicht; bei den Deutschen führten die Pfaffen sie ein, damit der biedre Deutsche sein Erbteil der Kirche ungehindert vermachen könne.
  en: This institution is a direct blow at the gentile constitution, and was unknown in Athens until the time of Solon. In Rome it was introduced very early, but we do not know when. In Germany it was originated by the priests in order that the honest German might bequeath his property to the church without any interference.
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IX.N4
  mew_page: '171'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: IX.36.1
  kind: p
  original: Mit dieser Grundverfassung hat die Zivilisation Dinge vollbracht, denen die alte Gentilgesellschaft nicht im entferntesten gewachsen war.
  en: With this fundamental constitution, civilization had accomplished things for which the old gentile society was no match whatever.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: IX.36.2
  kind: p
  original: Aber sie hat sie vollbracht, indem sie die schmutzigsten Triebe und Leidenschaften der Menschen in Bewegung setzte und auf Kosten seiner ganzen übrigen Anlagen entwickelte.
  en: But these exploits were accomplished by playing on the most sordid passions and instincts of man, and by developing them at the expense of all his other gifts.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: IX.36.3
  kind: p
  original: Die platte Habgier war die treibende Seele der Zivilisation von ihrem ersten Tag bis heute, Reichtum und abermals Reichtum und zum drittenmal Reichtum, Reichtum nicht der Gesellschaft, sondern dieses einzelnen lumpigen Individuums, ihr einzig entscheidendes Ziel.
  en: Barefaced covetousness was the moving spirit of civilization from its first dawn to the present day; wealth, and again wealth, and for the third time wealth; wealth, not of society, but of the puny individual, was its only and final aim.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: IX.36.4
  kind: p
  original: Wenn ihr dabei die steigende Entwicklung der Wissenschaft und zu wiederholten Perioden die höchste Blüte der Kunst in den Schoß gefallen ist, so doch nur, weil ohne diese die volle Reichtumserrungenschaft unsrer Zeit nicht möglich gewesen wäre.
  en: If nevertheless the advanced development of science, and at repeated times the highest flower of art, fell into its lap, this was only due to the fact that without them the highest emoluments of modern wealth would have been missing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: IX.37.1
  kind: p
  original: Da die Grundlage der Zivilisation die Ausbeutung einer Klasse durch eine andre Klasse ist, so bewegt sich ihre ganze Entwicklung in einem fortdauernden Widerspruch.
  en: Exploitation of one class by another being the basis of civilization, its whole development involves a continual contradiction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: IX.37.2
  kind: p
  original: Jeder Fortschritt der Produktion ist gleichzeitig ein Rückschritt in der Lage der unterdrückten Klasse, d.h. der großen Mehrzahl.
  en: Every progress of production is at the same time a retrogression in the condition of the oppressed class, that is of the great majority.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: IX.37.3
  kind: p
  original: Jede Wohltat für die einen ist notwendig ein Übel für die andern, jede neue Befreiung der einen Klasse eine neue Unterdrückung für eine andre Klasse.
  en: Every benefit for one class is necessarily an evil for the other, every new emancipation of one class a new oppression for the other.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: IX.37.4
  kind: p
  original: Den schlagendsten Beweis dafür liefert die Einführung der Maschinerie, deren Wirkungen heute weltbekannt sind.
  en: The most drastic proof of this is furnished by the introduction of machinery, the effects of which are well known to-day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 171-172
- id: IX.37.5
  kind: p
  original: Und wenn bei den Barbaren der Unterschied von Rechten und Pflichten, wie wir sahen, noch kaum gemacht werden konnte, so macht die Zivilisation den Unterschied und Gegensatz beider auch dem Blödsinnigsten klar, indem sie einer Klasse so ziemlich alle Rechte zuweist, der andern dagegen so ziemlich alle Pflichten.
  en: And while there is hardly any distinction between rights and duties among barbarians, as we have seen, civilization makes the difference between these two plain even to the dullest mind. For now one class has nearly all the rights, the other class nearly all the duties.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.38.1
  kind: p
  original: Das soll aber nicht sein.
  en: But this is not admitted.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: IX.38.2
  kind: p
  original: Was für die herrschende Klasse gut ist, soll gut sein für die ganze Gesellschaft, mit der die herrschende Klasse sich identifiziert.
  en: What is good for the ruling class, is alleged to be good for the whole of society with which the ruling class identifies itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: IX.38.3
  kind: p
  original: 'Je weiter also die Zivilisation fortschreitet, je mehr ist sie genötigt, die von ihr mit Notwendigkeit geschaffnen Übelstände mit dem Mantel der Liebe zu bedecken, sie zu beschönigen oder wegzuleugnen, kurz eine konventionelle Heuchelei einzuführen, die weder früheren Gesellschaftsformen noch selbst den ersten Stufen der Zivilisation bekannt war und die zuletzt in der Behauptung gipfelt: Die Ausbeutung der unterdrückten Klasse werde betrieben von der ausbeutenden Klasse einzig und allein im Interesse der ausgebeuteten Klasse selbst; und wenn diese das nicht einsehe, sondern sogar rebellisch werde, so sei das der schnödeste Undank gegen die Wohltäter, die Ausbeuter.'
  en: 'The more civilization advances, the more it is found to cover with the cloak of charity the evils necessarily created by it, to excuse them or to deny their existence, in short to introduce a conventional hypocrisy that culminates in the declaration: The exploitation of the oppressed class is carried on by the exploiting class solely in the interest of the exploited class itself. And if the latter does not recognize this, but even becomes rebellious, it is simply the worst ingratitude to its benefactors, the exploiters.'
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - IX.N5
  mew_page: '172'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.39.1
  kind: p
  original: 'Und nun zum Schluß Morgans Urteil über die Zivilisation:'
  en: 'And now, in conclusion, let me add Morgan''s judgment of civilization (Ancient Society, page 552):'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: IX.40.1
  kind: p
  original: '"Seit dem Eintritt der Zivilisation ist das Wachstum des Reichtums so ungeheuer geworden, seine Formen so verschiedenartig, seine Anwendung so umfassend und seine Verwaltung so geschickt im Interesse der Eigentümer, daß dieser Reichtum, dem Volk gegenüber, eine nicht zu bewältigende Macht geworden ist.'
  en: '"Since the advent of civilization, the outgrowth of property has been so immense, its forms so diversified, its uses so expanding and its management so intelligent in the interest of its owners that it has become, on the part of the people, an unmanageable power.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: IX.40.2
  kind: p
  original: Der Menschengeist steht ratlos und gebannt da vor seiner eignen Schöpfung.
  en: The human mind stands bewildered in the presence of its own creation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: IX.40.3
  kind: p
  original: Aber dennoch wird die Zeit kommen, wo die menschliche Vernunft erstarken wird zur Herrschaft über den Reichtum, wo sie feststellen wird sowohl das Verhältnis des Staats zu dem Eigentum, das er schützt, wie die Grenzen der Rechte der Eigentümer.
  en: The time will come, nevertheless, when human intelligence will rise to the mastery over property, and define the relations of the state to the property it protects, as well as the obligations and the limits of the rights of its owners.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: IX.40.4
  kind: p
  original: Die Interessen der Gesellschaft gehn den Einzelinteressen absolut vor, und beide müssen in ein gerechtes und harmonisches Verhältnis gebracht werden.
  en: The interests of society are paramount to individual interests, and the two must be brought into just and harmonious relations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: IX.40.5
  kind: p
  original: Die bloße Jagd nach Reichtum ist nicht die Endbestimmung der Menschheit, wenn anders der Fortschritt das Gesetz der Zukunft bleibt, wie er es war für die Vergangenheit.
  en: A mere property career is not the final destiny of mankind, if progress is to be the law of the future as it has been of the past.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: IX.40.6
  kind: p
  original: Die seit Anbruch der Zivilisation verflossene Zeit ist nur ein kleiner Bruchteil der verflossenen Lebenszeit der Menschheit; nur ein kleiner Bruchteil der ihr noch bevorstehenden.
  en: The time which has passed away since civilization began is but a fragment of the past duration of man's existence; and but a fragment of the ages yet to come.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 172-173
- id: IX.40.7
  kind: p
  original: Die Auflösung der Gesellschaft steht drohend vor uns als Abschluß einer geschichtlichen Laufbahn, deren einziges Endziel der Reichtum ist; denn eine solche Laufbahn enthält die Elemente ihrer eignen Vernichtung.
  en: The dissolution of society bids fair to become the termination of a career of which property is the end and aim, because such a career contains the elements of self-destruction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '173'
- id: IX.40.8
  kind: p
  original: Demokratie in der Verwaltung, Brüderlichkeit in der Gesellschaft, Gleichheit der Rechte, allgemeine Erziehung werden die nächste höhere Stufe der Gesellschaft einweihen, zu der Erfahrung, Vernunft und Wissenschaft stetig hinarbeiten.
  en: Democracy in government, brotherhood in society, equality in rights and privileges, and universal education, foreshadow the next higher plane of society to which experience, intelligence and knowledge are steadily tending.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '173'
- id: IX.40.9
  kind: p
  original: Sie wird eine Wiederbelebung sein - aber in höherer Form - der Freiheit, Gleichheit und Brüderlichkeit der alten Gentes." (Morgan, "Ancient Society", p. 552.)
  en: It will be a revival, in a higher form, of the liberty, equality and fraternity of the ancient gentes."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '173'
- id: IX.N1.1.1
  kind: note
  original: Besonders an der Nordwestküste Amerikas, siehe Bancroft.
  en: Especially on the northwest coast of America; see Bancroft.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N1.1.2
  kind: note
  original: Bei den Haidahs auf Königin Charlottes Insel kommen Haushaltungen bis zu 700 Personen unter einem Dache vor.
  en: Among the Haidahs of the Queen Charlotte Islands some households gather as many as 700 members under one roof.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N1.1.3
  kind: note
  original: Bei den Nootkas lebten ganze Stämme unter einem Dache.
  en: Among the Nootkas whole tribes lived under one roof.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N2.1.1
  kind: note
  original: Die Anzahl für Athen siehe oben S. 117.
  en: The number of slaves in Athens was 365,000.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N2.1.2
  kind: note
  original: In Korinth betrug sie zur Blütezeit der Stadt 460.000, in Ägina 470.000, in beiden Fällen die zehnfache Anzahl der freien Bürgerbevölkerung.
  en: In Corinth it was 460,000 at the most flourishing time, and 470,000 in Aegina; in both cases ten times the number of free citizens.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N3.1.1
  kind: note
  original: Der erste Geschichtsschreiber, der wenigstens eine annähernde Vorstellung vom Wesen der Gens hatte, war Niebuhr, und das - aber auch seine ohne weiteres mit übertragnen Irrtümer - verdankt er seiner Bekanntschaft mit den dithmarsischen Geschlechtern.
  en: The first historian who had at least a vague conception of the nature of the gens was Niebuhr, thanks to his familiarity with the Dithmarsian families. The same source, however, is also responsible for his errors.
  modern: ''
  modern_status: empty
  notes: ''
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.N4.1.1
  kind: note
  original: Lassalles "System der erworbenen Rechte" dreht sich im zweiten Teil hauptsächlich um den Satz, das römische Testament sei so alt wie Rom selbst, es habe für die römische Geschichte nie "eine Zeit ohne Testament gegeben"; das Testament sei vielmehr in vorrömischer Zeit aus dem Kultus der Verstorbenen entstanden.
  en: Lassalle's "System of Acquired Rights" argues in its second part mainly the proposition that the Roman testament is as old as Rome itself, and that there has never been in Roman history "a time without a testament." According to him, the testament had its origin in pre-Roman times in the cult of the departed.
  modern: ''
  modern_status: empty
  notes: ''
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: IX.N4.1.2
  kind: note
  original: Lassalle, als gläubiger Althegelianer, leitet die römischen Rechtsbestimmungen ab nicht aus den gesellschaftlichen Verhältnissen der Römer, sondern aus dem "spekulativen Begriff" des Willens, und kommt dabei zu jener total ungeschichtlichen Behauptung.
  en: Lassalle, as a convinced Hegelian of the old school, derives the provisions of the Roman law, not from the social condition of the Romans, but from the "speculative conception" of will, and thus arrives at this totally anti-historic conclusion.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N4.1.3
  kind: note
  original: Man kann sich darüber nicht wundern in einem Buch, das auf Grund desselben spekulativen Begriffs zu dem Ergebnis kommt, bei der römischen Erbschaft sei die Übertragung des Vermögens reine Nebensache gewesen.
  en: This is not to be wondered at in a book that draws from the same speculative conception the conclusion that the transfer of property was purely a side issue in Roman inheritance.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N4.1.4
  kind: note
  original: Lassalle glaubt nicht nur an die Illusionen der römischen Juristen, besonders der früheren Zeit; er übergipfelt sie noch.
  en: Lassalle not only believed in the illusions of Roman jurists, especially of the earlier ones, but he outstripped their fancy.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N5.1.1
  kind: note
  original: Ich beabsichtigte anfangs, die brillante Kritik der Zivilisation, die sich in den Werken Charles Fouriers zerstreut vorfindet, neben diejenige Morgans und meine eigne zu stellen.
  en: I first intended to place the brilliant critique of civilization, scattered through the works of Fourier, by the side of Morgan's and of my own.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N5.1.2
  kind: note
  original: Leider fehlt mir die Zeit dazu.
  en: Unluckily I cannot spare the time.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N5.1.3
  kind: note
  original: Ich bemerke nur, daß schon bei Fourier Monogamie und Grundeigentum als Hauptkennzeichen der Zivilisation gelten und daß er sie einen Krieg des Reichen gegen den Armen nennt.
  en: I only wish to remark that Fourier already considers monogamy and private property in land the main characteristics of civilization, and that he calls them a war of the rich against the poor.
  modern: ''
  modern_status: empty
  notes: ''
- id: IX.N5.1.4
  kind: note
  original: Ebenfalls findet sich bei ihm schon die tiefe Einsicht, daß in allen mangelhaften, in Gegensätze gespaltenen Gesellschaften Einzelfamilien (les familles incohérentes) die wirtschaftlichen Einheiten sind.
  en: We also find with him the deep perception that the individual families (les families incoherentes) are the economic units of all faulty societies divided by opposing interests.
  modern: ''
  modern_status: empty
  notes: ''
