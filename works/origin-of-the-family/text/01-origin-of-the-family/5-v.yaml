verses:
- id: V.0.1
  kind: heading
  original: V. Entstehung des athenischen Staats
  en: CHAPTER V. ORIGIN OF THE ATTIC STATE.
  modern: ''
  modern_status: empty
  notes: ''
- id: V.1.1
  kind: p
  original: Wie der Staat sich entwickelt hat, indem die Organe der Gentilverfassung teils umgestaltet, teils durch Einschiebung neuer Organe verdrängt und endlich vollständig durch wirkliche Staatsbehörden ersetzt wurden, während an die Stelle des in seinen Gentes, Phratrien und Stämmen sich selbst schützenden wirklichen "Volks in Waffen" eine diesen Staatsbehörden dienstbare, also auch gegen das Volk verwendbare, bewaffnete "öffentliche Gewalt" trat - davon können wir wenigstens das erste Stück nirgends besser verfolgen als im alten Athen.
  en: How the state gradually developed by partly transforming the organs of the gentile constitution, partly replacing them by new organs and finally installing real state authorities; how the place of the nation in arms defending itself through its gentes, phratries and tribes, was taken by an armed public power of coercion in the hands of these authorities and available against the mass of the people; nowhere can we observe the first act of this drama so well as in ancient Athens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: V.1.2
  kind: p
  original: Die Formverwandlungen sind im wesentlichen von Morgan dargestellt, den sie erzeugenden ökonomischen Inhalt muß ich großenteils hinzufügen.
  en: The essential stages of the various transformations are outlined by Morgan, but the analysis of the economic causes producing them is largely added by myself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: V.2.1
  kind: p
  original: Zur Heroenzeit saßen die vier Stämme der Athener in Attika noch auf getrennten Gebieten; selbst die sie zusammensetzenden zwölf Phratrien scheinen in den zwölf Städten des Kekrops noch gesonderte Sitze gehabt zu haben.
  en: In the heroic period, the four tribes of the Athenians were still installed in separate parts of Attica. Even the twelve phratries composing them seem to have had separate seats in the twelve different towns of Cecrops.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.2.2
  kind: p
  original: 'Die Verfassung war die der Heroenzeit: Volksversammlung, Volksrat, Basileus.'
  en: 'The constitution was in harmony with the period: a public meeting (agora), a council (bule) and a basileus.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: V.2.3
  kind: p
  original: Soweit die geschriebne Geschichte zurückreicht, war der Grund und Boden schon verteilt und in Privateigentum übergegangen, wie dies der gegen Ende der Oberstufe der Barbarei bereits verhältnismäßig entwickelten Warenproduktion und dem ihr entsprechenden Warenhandel gemäß ist.
  en: As far back as we can trace written history we find the land divided up and in the possession of private individuals. For during the last period of the higher stage of barbarism the production of commodities and the resulting trade had well advanced.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.2.4
  kind: p
  original: Neben Korn wurde Wein und Öl gewonnen; der Seehandel auf dem Ägäischen Meer wurde mehr und mehr den Phöniziern entzogen und fiel großenteils in attische Hände.
  en: Grain, wine and oil were staple articles. The sea trade on the Aegean Sea drifted more and more out of the hands of the Phoenicians into those of the Athenians.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.2.5
  kind: p
  original: Durch den Kauf und Verkauf von Grundbesitz, durch die fortschreitende Teilung der Arbeit zwischen Ackerbau und Handwerk, Handel und Schiffahrt, mußten die Angehörigen der Gentes, Phratrien und Stämme sehr bald durcheinanderkommen, der Distrikt der Phratrie und des Stammes Bewohner erhalten, die, obwohl Volksgenossen, doch diesen Körperschaften nicht angehörten, also in ihrem eignen Wohnort fremd waren.
  en: By the purchase and sale of land, by continued division of labor between agriculture and industry, trade and navigation, the members of gentes, phratries and tribes very soon intermingled. The districts of the phratry and the tribe received inhabitants who did not belong to these bodies and, therefore, were strangers in their own homes, although they were countrymen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.2.6
  kind: p
  original: Denn jede Phratrie und jeder Stamm verwalteten in ruhigen Zeiten ihre Angelegenheiten selbst, ohne nach Athen zum Volksrat oder Basileus zu schicken.
  en: For during times of peace, every phratry and every tribe administered its own affairs without consulting the council of Athens or the basileus.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '107'
- id: V.2.7
  kind: p
  original: Wer aber im Gebiet der Phratrie oder des Stamms wohnte, ohne ihm anzugehören, konnte an dieser Verwaltung natürlich keinen Anteil nehmen.
  en: But inhabitants not belonging to the phratry or the tribe could not take part in the administration of these bodies.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 107-108
- id: V.3.1
  kind: p
  original: Das geregelte Spiel der Organe der Gentilverfassung kam damit so in Unordnung, daß schon zur Heroenzeit Abhülfe nötig wurde.
  en: Thus the well-regulated functions of the gentile organs became so disarranged that relief was already needed during the heroic period.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: V.3.2
  kind: p
  original: Die dem Theseus zugeschriebne Verfassung wurde eingeführt.
  en: A constitution attributed to Theseus was introduced.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: V.3.3
  kind: p
  original: Die Änderung bestand vor allem darin, daß eine Zentralverwaltung in Athen eingerichtet, d.h. ein Teil der bisher von den Stämmen selbständig verwalteten Angelegenheiten für gemeinsame erklärt und dem in Athen sitzenden gemeinsamen Rat übertragen wurden.
  en: The main feature of this change was the institution of central administration in Athens. A part of the affairs that had so long been conducted autonomously by the tribes was declared collective business and transferred to a general council in Athens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.3.4
  kind: p
  original: 'Hiermit gingen die Athener einen Schritt weiter als irgendein eingebornes Volk in Amerika je gegangen: An die Stelle des bloßen Bundes nebeneinander wohnender Stämme trat ihre Verschmelzung zu einem einzigen Volk.'
  en: This step of the Athenians went farther than any ever taken by the nations of America. For the simple federation of autonomous tribes was now replaced by the conglomeration of all tribes into one single body.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.3.5
  kind: p
  original: Damit entsprang ein athenisches allgemeines Volksrecht, das über den Rechtsbräuchen der Stämme und Gentes stand; der athenische Bürger erhielt als solcher bestimmte Rechte und neuen Rechtsschutz auch auf Gebiet, wo er stammesfremd war.
  en: The next result was a common Athenian law, standing above the legal traditions of the tribes and gentes. It bestowed on the citizens of Athens certain privileges and legal protection, even in a territory that did not belong to their tribe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.3.6
  kind: p
  original: Damit war aber der erste Schritt geschehn zur Untergrabung der Gentilverfassung; denn es war der erste Schritt zur späteren Zulassung von Bürgern, die in ganz Attika stammesfremd waren, die ganz außerhalb der athenischen Gentilverfassung standen und blieben.
  en: This meant another blow to the gentile constitution; for it opened the way to the admission of citizens who were not members of any Attic tribe and stood entirely outside of the Athenian gentile constitution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: V.3.7
  kind: p
  original: 'Eine zweite dem Theseus zugeschriebne Einrichtung war die Einteilung des ganzen Volks, ohne Rücksicht auf Gens, Phratrie oder Stamm, in drei Klassen: Eupatriden oder Adlige, Geomoren oder Ackerbauer und Demiurgen oder Handwerker, und die Überweisung des ausschließlichen Rechts der Ämterbesetzung an die Adligen.'
  en: 'A second institution attributed to Theseus was the division of the entire nation into three classes regardless of the gentes, phratries and tribes: eupatrides or nobles, geomoroi or farmers, and demiurgoi or tradesmen. The exclusive privilege of the nobles to fill the offices was included in this innovation.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.3.8
  kind: p
  original: Diese Einteilung blieb zwar, mit Ausnahme der Ämterbesetzung durch den Adel, wirkungslos, da sie sonst keine Rechtsunterschiede zwischen den Klassen begründete.
  en: Apart from this privilege the new division remained ineffective, as it did not create any legal distinctions between the classes.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T1
    editions: '1884'
    reading: 'da die beiden andern Klassen keine besondern Rechte erhielten (statt: da sie sonst keine Rechtsunterschiede zwischen den Klassen begründete)'
    base_text: … zwischen den Klassen begründete ‸ . …
  mew_page: '108'
- id: V.3.9
  kind: p
  original: Aber sie ist wichtig, weil sie uns die neuen gesellschaftlichen Elemente vorführt, die sich im stillen entwickelt hatten.
  en: But it is important, because it shows us the new social elements that had developed in secret.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: V.3.10
  kind: p
  original: Sie zeigt, daß die gewohnheitsmäßige Besetzung der Gentilämter aus gewissen Familien sich bereits zu einem wenig bestrittenen Anrecht dieser Familien auf die Ämter ausgebildet hatte, daß diese Familien, ohnehin mächtig durch Reichtum, anfingen, außerhalb ihrer Gentes sich zu einer eignen bevorrechteten Klasse zusammenzutun, und daß der eben erst aufkeimende Staat diese Anmaßung heiligte.
  en: It shows that the habitual holding of gentile offices by certain families had already developed into a practically uncontested privilege; that these families, already powerful through their wealth, began to combine outside of their gentes into a privileged class; and that the just arising state sanctioned this assumption.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: V.3.11
  kind: p
  original: Sie zeigt ferner, daß die Teilung der Arbeit zwischen Landbauern und Handwerkern bereits genug erstarkt war, um der alten Gliederung nach Gentes und Stämmen den Vorrang in gesellschaftlicher Bedeutung streitig zu machen.
  en: It shows furthermore that the division of labor between farmers and tradesmen had grown strong enough to contest the supremacy of the old gentile and tribal division of society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '108'
- id: V.3.12
  kind: p
  original: Sie proklamiert endlich den unverträglichen Gegensatz zwischen Gentilgesellschaft und Staat; der erste Versuch der Staatsbildung besteht darin, die Gentes zu zerreißen, indem er die Mitglieder einer jeden in Bevorrechtete und Zurückgesetzte und diese wieder in zwei Gewerbsklassen scheidet und so einander entgegensetzt.
  en: And finally it proclaims the irreconcilable opposition of gentile society to the state. The first attempt to form a state broke up the gentes by dividing their members against one another and opposing a privileged class to a class of disowned belonging to two different branches of production.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 108-109
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.4.1
  kind: p
  original: Die weitere politische Geschichte Athens bis auf Solon ist nur unvollkommen bekannt.
  en: The ensuing political history of Athens up to the time of Solon is only incompletely known.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: V.4.2
  kind: p
  original: Das Amt des Basileus kam in Abgang; an die Spitze des Staats traten aus dem Adel gewählte Archonten.
  en: The office of basileus became obsolete. Archons elected from the ranks of the nobility occupied the leading position in the state.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.4.3
  kind: p
  original: Die Herrschaft des Adels stieg mehr und mehr, bis sie gegen das Jahr 600 vor unsrer Zeitrechnung unerträglich wurde.
  en: The power of the nobility increased continually, until it became unbearable about the year 600 before Christ.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: V.4.4
  kind: p
  original: Und zwar war das Hauptmittel zur Unterdrückung der gemeinen Freiheit - das Geld und der Wucher.
  en: The principal means for stifling the liberty of the people were--money and usury.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: V.4.5
  kind: p
  original: Der Hauptsitz des Adels war in und um Athen, wo der Seehandel, benebst noch immer gelegentlich mit in den Kauf genommenem Seeraub, ihn bereicherte und den Geldreichtum in seinen Händen konzentrierte.
  en: The main seat of the nobility was in and around Athens. There the sea trade and now and then a little convenient piracy enriched them and concentrated the money into their hands.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.4.6
  kind: p
  original: Von hier aus drang die sich entwickelnde Geldwirtschaft wie zersetzendes Scheidewasser in die auf Naturalwirtschaft gegründete, althergebrachte Daseinsweise der Landgemeinden.
  en: From this point the gradually arising money power penetrated like corrugating acid into the traditional modes of rural existence founded on natural economy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: V.4.7
  kind: p
  original: Die Gentilverfassung ist mit Geldwirtschaft absolut unverträglich; der Ruin der attischen Parzellenbauern fiel zusammen mit der Lockerung der sie schützend umschlingenden alten Gentilbande.
  en: The gentile constitution is absolutely irreconcilable with money rule. The ruin of the Attic farmers coincided with the loosening of the old gentile bonds that protected them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.4.8
  kind: p
  original: Der Schuldschein und die Gutsverpfändung (denn auch die Hypothek hatten die Athener schon erfunden) achteten weder Gens noch Phratrie.
  en: The debtor's receipt and the pawning of the property--for the mortgage was also invented by the Athenians--cared neither for the gens nor for the phratry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: V.4.9
  kind: p
  original: Und die alte Gentilverfassung kannte kein Geld, keinen Vorschuß, keine Geldschuld.
  en: But the old gentile constitution knew nothing of money, advance and debt.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: V.4.10
  kind: p
  original: Daher bildete die sich immer üppiger ausbreitende Geldherrschaft des Adels auch ein neues Gewohnheitsrecht aus zur Sicherung des Gläubigers gegen den Schuldner, zur Weihe der Ausbeutung des Kleinbauern durch den Geldbesitzer.
  en: Hence the ever more virulently spreading money rule of the nobility developed a new legal custom, securing the creditor against the debtor and sanctioning the exploitation of the small farmer by the wealthy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: V.4.11
  kind: p
  original: Sämtliche Feldfluren Attikas starrten von Pfandsäulen, an denen verzeichnet stand, das sie tragende Grundstück sei dem und dem verpfändet um soundso viel Geld.
  en: All the rural districts of Attica were crowded with mortgage columns bearing the legend that the lot on which they stood was mortgaged to such and such for so much.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: V.4.12
  kind: p
  original: Die Äcker, die nicht so bezeichnet, waren großenteils bereits wegen verfallner Hypotheken oder Zinsen verkauft, in das Eigentum des adligen Wucherers übergegangen; der Bauer konnte froh sein, wenn ihm erlaubt wurde, als Pächter darauf sitzenzubleiben und von einem Sechstel des Ertrags seiner Arbeit zu leben, während er fünf Sechstel dem neuen Herrn als Pacht zahlen mußte.
  en: The fields that were not so designated had for the most part been sold on account of overdue mortgages or interest and transferred to the aristocratic usurers. The farmer could thank his stars, if he was granted permission to live as a tenant on one-sixth of the product of his labor and to pay five-sixths to his new master in the form of rent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: V.4.13
  kind: p
  original: Noch mehr.
  en: ''
  joined_to: V.4.12
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '109'
- id: V.4.14
  kind: p
  original: Reichte der Erlös des verkauften Grundstücks nicht hin zur Deckung der Schuld, oder war diese Schuld ohne Sicherung durch Pfand aufgenommen, so mußte der Schuldner seine Kinder ins Ausland in die Sklaverei verkaufen, um den Gläubiger zu decken.
  en: Worse still, if the sale of the lot did not bring sufficient returns to cover the debt, or if such a debt had been contracted without a lien, then the debtor had to sell his children into slavery abroad in order to satisfy the claim of the creditor.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: V.4.15
  kind: p
  original: Verkauf der Kinder durch den Vater - das war die erste Frucht des Vaterrechts und der Monogamie!
  en: The sale of the children by the father--that was the first fruit of paternal law and monogamy!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: V.4.16
  kind: p
  original: Und war der Blutsauger dann noch nicht befriedigt, so konnte er den Schuldner selbst als Sklaven verkaufen.
  en: And if that did not satisfy the bloodsuckers, they could sell the debtor himself into slavery.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: V.4.17
  kind: p
  original: Das war die angenehme Morgenröte der Zivilisation beim athenischen Volk.
  en: Such was the pleasant dawn of civilization among the people of Attica.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '109'
- id: V.5.1
  kind: p
  original: Früher, als die Lebenslage des Volks noch der Gentilverfassung entsprach, war eine solche Umwälzung unmöglich; und hier war sie gekommen, man wußte nicht wie.
  en: Formerly, while the condition of the people was in keeping with gentile traditions, a similar downfall would have been impossible. But here it had come about, nobody knew how.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.5.2
  kind: p
  original: Gehn wir einen Augenblick zurück zu unsern Irokesen.
  en: Let us return for a moment to the Iroquois.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: V.5.3
  kind: p
  original: Dort war ein Zustand undenkbar, wie er sich jetzt den Athenern sozusagen ohne ihr Zutun und sicher gegen ihren Willen aufgedrängt hatte.
  en: The state of things that had imposed itself on the Athenians almost without their doing, so to say, and assuredly against their will, was inconceivable among the Indians.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: V.5.4
  kind: p
  original: Dort konnte die sich jahraus, jahrein gleichbleibende Weise, den Lebensunterhalt zu produzieren, nie solche, wie von außen aufgezwungene Konflikte erzeugen, keinen Gegensatz von Reich und Arm, von Ausbeutern und Ausgebeuteten.
  en: There the ever unchanging mode of production could at no time generate such conflicts as a distinction between rich and poor, exploiters and exploited, caused by external conditions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: V.5.5
  kind: p
  original: Die Irokesen waren noch weit entfernt davon, die Natur zu beherrschen, aber innerhalb der für sie geltenden Naturgrenzen beherrschten sie ihre eigne Produktion.
  en: The Iroquois were far from controlling the forces of nature, but within the limits drawn for them by nature they dominated their own production.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: V.5.6
  kind: p
  original: Abgesehn von schlechten Ernten in ihren Gärtchen, von Erschöpfung des Fischvorrats ihrer Seen und Flüsse, des Wildstandes ihrer Wälder, wußten sie, was bei ihrer Art, sich ihren Unterhalt zu erarbeiten, herauskam.
  en: Apart from a failure of the crops in their little gardens, the exhaustion of the fish supply in their lakes and rivers or of the game stock in their forests, they always knew what would be the outcome of their mode of gaining a living.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: V.5.7
  kind: p
  original: Was herauskommen mußte, war der Lebensunterhalt, ob er kärglicher oder reichlicher ausfiel; was aber nie herauskommen konnte, das waren unbeabsichtigte gesellschaftliche Umwälzungen, Zerreißung der Gentilbande, Spaltung der Gentil- und Stammgenossen in entgegengesetzte, einander bekämpfende Klassen.
  en: A more or less abundant supply of food, that would come of it. But the outcome could never be any unpremeditated social upheavals, breaking of gentile bonds or division of the gentiles against one another by conflicting class interests.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.5.8
  kind: p
  original: Die Produktion bewegte sich in den engsten Schranken; aber - die Produzenten beherrschten ihr eignes Produkt.
  en: Production was carried on in the most limited manner; but--the producers controlled their own product.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: V.5.9
  kind: p
  original: Das war der ungeheure Vorzug der barbarischen Produktion, der mit dem Eintritt der Zivilisation verlorenging und den wiederzuerobern, aber auf Grundlage der jetzt errungenen gewaltigen Naturbeherrschung durch den Menschen und der jetzt möglichen freien Assoziation, die Aufgabe der nächsten Generationen sein wird.
  en: This immense advantage of barbarian production was lost in the transition to civilization. To win it back on the basis of man's present gigantic control of nature and of the free association rendered possible by it, that will be the task of the next generations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.6.1
  kind: p
  original: Anders bei den Griechen.
  en: Not so among the Greeks.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: V.6.2
  kind: p
  original: Der aufgekommene Privatbesitz an Herden und Luxusgerät führte zum Austausch zwischen einzelnen, zur Verwandlung der Produkte in Waren.
  en: The advent of private property in herds of cattle and articles of luxury led to an exchange between individuals, to a transformation of products into commodities.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: V.6.3
  kind: p
  original: Und hier liegt der Keim der ganzen folgenden Umwälzung.
  en: Here is the root of the entire revolution that followed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: V.6.4
  kind: p
  original: Sobald die Produzenten ihr Produkt nicht mehr direkt selbst verzehrten, sondern es im Austausch aus der Hand gaben, verloren sie die Herrschaft darüber.
  en: When the producers did no longer consume their own product, but released their hold of it in exchange for another's product, then they lost the control of it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: V.6.5
  kind: p
  original: Sie wußten nicht mehr, was aus ihm wurde, und die Möglichkeit war gegeben, daß das Produkt dereinst verwandt werde gegen den Produzenten, zu seiner Ausbeutung und Unterdrückung.
  en: They did not know any more what became of it. There was a possibility that the product might be turned against the producers for the purpose of exploiting and oppressing them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.6.6
  kind: p
  original: Darum kann keine Gesellschaft auf die Dauer die Herrschaft über ihre eigne Produktion und die Kontrolle über die gesellschaftlichen Wirkungen ihres Produktionsprozesses behalten, die nicht den Austausch zwischen einzelnen abschafft.
  en: No society can, therefore, retain for any length of time the control of its own production and of the social effects of the mode of production, unless it abolishes exchange between individuals.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '110'
- id: V.7.1
  kind: p
  original: Wie rasch aber, nach dem Entstehn des Austausches zwischen einzelnen und mit der Verwandlung der Produkte in Waren, das Produkt seine Herrschaft über den Produzenten geltend macht, das sollten die Athener erfahren.
  en: How rapidly after the establishment of individual exchange and after the transformation of products into commodities the product manifests its rule over the producer, the Athenians were soon to learn.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 110-111
- id: V.7.2
  kind: p
  original: Mit der Warenproduktion kam die Bebauung des Bodens durch einzelne für eigne Rechnung, damit bald das Grundeigentum einzelner.
  en: Along with the production of marketable commodities came the tilling of the soil by individual cultivators for their own account, soon followed by individual ownership of the land.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
- id: V.7.3
  kind: p
  original: Es kam ferner das Geld, die allgemeine Ware, gegen die alle andern austauschbar waren; aber indem die Menschen das Geld erfanden, dachten sie nicht daran, daß sie damit wieder eine neue gesellschaftliche Macht schufen, die Eine allgemeine Macht, vor der die ganze Gesellschaft sich beugen mußte.
  en: Along came also the money, that general commodity for which all others could be exchanged. But when men invented money they little suspected that they were creating a new social power, that one universal power before which the whole of society must bow down.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.7.4
  kind: p
  original: Und diese neue, ohne Wissen und Willen ihrer eignen Erzeuger plötzlich emporgesprungne Macht war es, die, in der ganzen Brutalität ihrer Jugendlichkeit, ihre Herrschaft den Athenern zu fühlen gab.
  en: It was this new power, suddenly sprung into existence without the forethought and intention of its own creators, that vented its rule on the Athenians with the full brutality of youth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
- id: V.8.1
  kind: p
  original: Was war zu machen?
  en: What was to be done?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
- id: V.8.2
  kind: p
  original: Die alte Gentilverfassung hatte sich nicht nur ohnmächtig erwiesen gegen den Siegeszug des Geldes; sie war auch absolut unfähig, innerhalb ihres Rahmens selbst nur Raum zu finden für so etwas wie Geld, Gläubiger und Schuldner, Zwangseintreibung von Schulden.
  en: 'The old gentile organization had not only proved impotent against the triumphant march of money: it was also absolutely incapable of containing within its confines any such thing as money, creditors, debtors and forcible collection of debts.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
- id: V.8.3
  kind: p
  original: Aber die neue gesellschaftliche Macht war einmal da, und fromme Wünsche, Sehnsucht nach Rückkehr der guten alten Zeit trieben Geld und Zinswucher nicht wieder aus der Welt.
  en: But the new social power was upon them and neither pious wishes nor a longing for the return of the good old times could drive money and usury from the face of the earth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
- id: V.8.4
  kind: p
  original: Und obendrein waren eine Reihe andrer, untergeordneter Breschen in die Gentilverfassung gelegt.
  en: Moreover, gentile constitution had suffered a number of minor defeats.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
- id: V.8.5
  kind: p
  original: Die Durcheinanderwürfelung der Gentilgenossen und Phratoren auf dem ganzen attischen Gebiet, namentlich in der Stadt Athen selbst, war von Geschlecht zu Geschlecht größer geworden, trotzdem daß auch jetzt noch ein Athener zwar Grundstücke außerhalb seiner Gens verkaufen durfte, nicht aber sein Wohnhaus.
  en: The indiscriminate mingling of the gentiles and phrators in the whole of Attica, and especially in Athens, had assumed larger proportions from generation to generation. Still even now a citizen of Athens was not allowed to sell his residence outside of his gens, although he could do so with plots of land.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.8.6
  kind: p
  original: 'Die Teilung der Arbeit zwischen den verschiednen Produktionszweigen: Ackerbau, Handwerk, im Handwerk wieder zahllose Unterarten, Handel, Schiffahrt usw., hatte sich mit den Fortschritten der Industrie und des Verkehrs immer vollständiger entwickelt; die Bevölkerung teilte sich nun nach ihrer Beschäftigung in ziemlich feste Gruppen, deren jede eine Reihe neuer, gemeinsamer Interessen hatte, für die in der Gens oder Phratrie kein Platz war, die also zu ihrer Besorgung neue Ämter nötig machten.'
  en: The division of labor between the different branches of production--agriculture, trades, numberless specialties within the trades, commerce, navigation, etc.--had developed more fully with the progress of industry and traffic. The population was now divided according to occupations into rather well defined groups, everyone of which had separate interests not guarded by the gens or phratry and therefore necessitating the creation of new offices.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.8.7
  kind: p
  original: Die Zahl der Sklaven hatte sich bedeutend vermehrt und muß schon damals die der freien Athener weit überstiegen haben; die Gentilverfassung kannte ursprünglich keine Sklaverei, also auch kein Mittel, diese Masse Unfreier im Zaum zu halten.
  en: The number of slaves had increased considerably and must have surpassed by far that of the free Athenians even at this early stage. Gentile society originally knew no slavery and was, therefore, ignorant of any means to hold this mass of bondsmen in check.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.8.8
  kind: p
  original: Und endlich hatte der Handel eine Menge Fremder nach Athen gebracht, die dort des leichtern Gelderwerbs wegen sich niederließen und ebenfalls nach der alten Verfassung recht- und schutzlos und trotz herkömmlicher Duldung ein störend fremdes Element im Volk blieben.
  en: And finally, commerce had attracted a great many strangers who settled in Athens for the sake of the easier living it afforded. According to the old constitution, the strangers had neither civil rights nor the protection of the law. Though tacitly admitted by tradition, they remained a disturbing and foreign element.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: V.9.1
  kind: p
  original: Kurz, mit der Gentilverfassung ging es zu Ende.
  en: In short, gentile constitution approached its doom.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
- id: V.9.2
  kind: p
  original: Die Gesellschaft wuchs täglich mehr aus ihr heraus; selbst die schlimmsten Übel, die unter ihren Augen entstanden waren, konnte sie nicht hemmen noch heben.
  en: Society was daily growing more and more beyond it. It was powerless to stop or allay even the most distressing evils that had grown under its very eyes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '111'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.9.3
  kind: p
  original: Aber der Staat hatte sich inzwischen im stillen entwickelt.
  en: But in the meantime the state had secretly developed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 111-112
- id: V.9.4
  kind: p
  original: Die neuen, durch die Teilung der Arbeit zuerst zwischen Stadt und Land, dann zwischen den verschiednen städtischen Arbeitszweigen geschaffnen Gruppen hatten neue Organe geschaffen zur Wahrnehmung ihrer Interessen; Ämter aller Art waren eingerichtet worden.
  en: The new groups formed by division of labor, first between city and country, then between the various branches of city industry, had created new organs for the care of their interests. Public offices of every description had been instituted.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.9.5
  kind: p
  original: Und dann brauchte der junge Staat vor allem eine eigne Macht, die bei den seefahrenden Athenern zunächst nur eine Seemacht sein konnte, zu einzelnen kleinen Kriegen und zum Schutz der Handelsschiffe.
  en: And above all the young state needed its own fighting forces. Among the seafaring Athenians this had to be at first only a navy, for occasional short expeditions and the protection of the merchant vessels.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.9.6
  kind: p
  original: Es wurden, zu unbekannter Zeit vor Solon, die Naukrarien errichtet, kleine Gebietsbezirke, zwölf in jedem Stamm; jede Naukrarie mußte ein Kriegsschiff stellen, ausrüsten und bemannen und stellte außerdem noch zwei Reiter.
  en: At some uncertain time before Solon, the naukrariai were instituted, little territorial districts, twelve in each tribe. Every naukraria had to furnish, equip and man a war vessel and to detail two horsemen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.9.7
  kind: p
  original: Diese Einrichtung griff die Gentilverfassung zwiefach an.
  en: This arrangement was a twofold attack on the gentile constitution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: V.9.8
  kind: p
  original: Erstens, indem sie eine öffentliche Gewalt schuf, die schon nicht mehr ohne weiteres mit der Gesamtheit des bewaffneten Volks zusammenfiel; und zweitens, indem sie zum erstenmal das Volk zu öffentlichen Zwecken einteilte, nicht nach Verwandtschaftsgruppen, sondern nach örtlichem Zusammenwohnen.
  en: In the first place it created a public power of coercion that did no longer absolutely coincide with the entirety of the armed nation. In the second place it was the first division of the people for public purposes, not by groups of kinship, but by local residence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.9.9
  kind: p
  original: Was das zu bedeuten hatte, wird sich zeigen.
  en: We shall soon see what that signified.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: V.10.1
  kind: p
  original: Konnte die Gentilverfassung dem ausgebeuteten Volk keine Hülfe bringen, so blieb nur der entstehende Staat.
  en: As the gentile constitution could not come to the assistance of the exploited people, they could look only to the rising state.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: V.10.2
  kind: p
  original: Und dieser brachte sie in der solonischen Verfassung, indem er sich zugleich neuerdings auf Kosten der alten Verfassung stärkte.
  en: And the state brought help in the form of the constitution of Solon. At the same time it added to its own strength at the expense of the old constitution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.10.3
  kind: p
  original: Solon - die Art, wie seine in das Jahr 594 vor unsrer Zeitrechnung fallende Reform durchgesetzt wurde, geht uns hier nichts an - Solon eröffnete die Reihe der sogenannten politischen Revolutionen, und zwar mit einem Eingriff in das Eigentum.
  en: Solon opened the series of so-called political revolutions by an infringement on private property. We pass over the means by which this reform was accomplished in the year 594 B. C. or thereabout.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.10.4
  kind: p
  original: Alle bisherigen Revolutionen sind Revolutionen gewesen zum Schutz einer Art des Eigentums gegen eine andere Art des Eigentums.
  en: Ever since, all revolutions have been revolutions for the protection of one kind of property against another kind of property.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: V.10.5
  kind: p
  original: Sie können das eine nicht schützen, ohne das andre zu verletzen.
  en: They cannot protect one kind without violating another.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: V.10.6
  kind: p
  original: In der großen französischen Revolution wurde das feudale Eigentum geopfert, um das bürgerliche zu retten; in der solonischen mußte das Eigentum der Gläubiger herhalten zum Besten des Eigentums der Schuldner.
  en: In the great French revolution the feudal property was sacrificed for the sake of saving bourgeois property. In Solon's revolution, the property of the creditors had to make concessions to the property of the debtors.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.10.7
  kind: p
  original: Die Schulden wurden einfach für ungültig erklärt.
  en: The debts were simply declared illegal.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: V.10.8
  kind: p
  original: Die Einzelheiten sind uns nicht genau bekannt, aber Solon rühmt sich in seinen Gedichten, die Pfandsäulen von den verschuldeten Grundstücken entfernt und die wegen Schulden ins Ausland Verkauften und Geflüchteten zurückgeführt zu haben.
  en: We are not acquainted with the accurate details, but Solon boasts in his poems that he removed the mortgage columns from the indented lots and enabled all who had fled or been sold abroad for debts to return home.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: V.10.9
  kind: p
  original: Dies war nur möglich durch offne Eigentumsverletzung.
  en: This was only feasible by an open violation of private property.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: V.10.10
  kind: p
  original: Und in der Tat, von der ersten bis zur letzten sogenannten politischen Revolution sind sie alle gemacht worden zum Schutz des Eigentums - einer Art und durchgeführt durch Konfiskation, auch genannt Diebstahl des Eigentums - einer andern Art.
  en: And indeed, all so-called political revolutions were started for the protection of one kind of property by the confiscation, also called theft, of another kind of property.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: V.10.11
  kind: p
  original: So wahr ist es, daß seit drittehalbtausend Jahren des Privateigentum hat erhalten werden können nur durch Eigentumsverletzung.
  en: It is absolutely true that for more than 2,500 years private property could only be protected by the violation of private property.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '112'
- id: V.11.1
  kind: p
  original: Nun aber kam es darauf an, die Wiederkehr solcher Versklavung der freien Athener zu verhindern.
  en: But now a way had to be found to avoid the return of such an enslavement of the free Athenians.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: V.11.2
  kind: p
  original: Dies geschah zunächst durch allgemeine Maßregeln, z.B. durch das Verbot von Schuldverträgen, worin die Person des Schuldners verpfändet wurde.
  en: This was first attempted by general measures, e. g., the prohibition of contracts giving the person of the debtor in lien.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: V.11.3
  kind: p
  original: Ferner wurde ein größtes Maß des von einem einzelnen zu besitzenden Grundeigentums festgesetzt, um dem Heißhunger des Adels nach dem Bauernland wenigstens einige Schranken zu ziehn.
  en: Furthermore a maximum limit was fixed for the amount of land any one individual could own, in order to keep the craving of the nobility for the land of the farmers within reasonable bounds.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: V.11.4
  kind: p
  original: 'Dann aber kamen Verfassungsänderungen; für uns sind die wichtigsten diese:'
  en: 'Constitutional amendments were next in order. The following deserve special consideration:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.12.1
  kind: p
  original: Der Rat wurde auf vierhundert Mitglieder gebracht, hundert aus jedem Stamm; hier blieb also noch der Stamm die Grundlage.
  en: The council was increased to four hundred members, one hundred from each tribe. Here, then, the tribe still served as a basis.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.12.2
  kind: p
  original: Das war aber auch die einzige Seite, nach welcher hin die alte Verfassung in den neuen Staatskörper hineingezogen wurde.
  en: But this was the only remnant of the old constitution that was transferred to the new body politic.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: V.12.3
  kind: p
  original: Denn im übrigen teilte Solon die Bürger in vier Klassen je nach ihrem Grundbesitz und seinem Ertrag; 500, 300 und 150 Medimnen Korn (1 Medimnus - ca. 41 Liter) waren die Minimalerträge für die ersten drei Klassen; wer weniger oder keinen Grundbesitz halte, fiel in die vierte Klasse.
  en: For otherwise Solon divided the citizens into four classes according to their property in land and its yield. Five hundred, three hundred and one hundred and fifty medimnoi of grain (1 medimnos equals 1.16 bushels) were the minimum yields of the first three classes. Whoever had less land or none at all belonged to the fourth class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: V.12.4
  kind: p
  original: Alle Ämter konnten nur aus den obersten drei, die höchsten nur aus der ersten Klasse besetzt werden; die vierte Klasse hatte nur das Recht, in der Volksversammlung zu reden und zu stimmen, aber hier wurden alle Beamten gewählt, hier hatten sie Rechenschaft abzulegen, hier wurden alle Gesetze gemacht, und hier bildete die vierte Klasse die Majorität.
  en: Only members of the first three classes could hold office; the highest offices were filled by the first class. The fourth class had only the right to speak and vote in the public council. But here all officials were elected, here they had to give account, here all the laws were made, and here the fourth class was in the majority.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: V.12.5
  kind: p
  original: Die aristokratischen Vorrechte wurden in der Form von Vorrechten des Reichtums teilweise erneuert, aber das Volk behielt die entscheidende Macht.
  en: The aristocratic privileges were partly renewed in the form of privileges of wealth, but the people retained the decisive power.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: V.12.6
  kind: p
  original: Ferner bildeten die vier Klassen die Grundlage einer neuen Heeresorganisation.
  en: The four classes also formed the basis for the reorganization of the fighting forces.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: V.12.7
  kind: p
  original: Die beiden ersten Klassen stellten die Reiterei; die dritte hatte als schwere Infanterie zu dienen; die vierte als leichtes, ungepanzertes Fußvolk oder auf der Flotte und wurde dann wahrscheinlich auch besoldet.
  en: The first two classes furnished the horsemen; the third had to serve as heavy infantry; the fourth was employed as light unarmored infantry and had to man the navy. Probably the last class also received wages in this case.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.13.1
  kind: p
  original: 'Hier wird also ein ganz neues Element in die Verfassung eingeführt: der Privatbesitz.'
  en: 'An entirely new element is thus introduced into the constitution: private property.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: V.13.2
  kind: p
  original: Je nach der Größe ihres Grundeigentums werden die Rechte und Pflichten der Staatsbürger abgemessen, und soweit die Vermögensklassen Einfluß gewinnen, soweit werden die alten Blutsverwandtschaftskörper verdrängt; die Gentilverfassung hatte eine neue Niederlage erlitten.
  en: The rights and duties of the citizens are graduated according to their property in land. Wherever the classification by property gains ground, there the old groups of blood relationship give way. Gentile constitution has suffered another defeat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: V.14.1
  kind: p
  original: Die Abmessung der politischen Rechte nach dem Vermögen war indes keine der Einrichtungen, ohne die der Staat nicht bestehn kann.
  en: However, the gradation of political rights according to private property was not one of those institutions without which a state cannot exist.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
- id: V.14.2
  kind: p
  original: Eine so große Rolle sie auch in der Verfassungsgeschichte der Staaten gespielt hat, so haben doch sehr viele Staaten, und grade die am vollständigsten entwickelten, ihrer nicht bedurft.
  en: It may have been ever so important in the constitutional development of some states. Still a good many others, and the most completely developed at that, had no need of it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.14.3
  kind: p
  original: Auch in Athen spielte sie nur eine vorübergehende Rolle; seit Aristides standen alle Ämter jedem Bürger offen.
  en: Even in Athens it played only a passing role. Since the time of Aristides, all offices were open to all the citizens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '113'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.15.1
  kind: p
  original: Während der nächstfolgenden achtzig Jahre kam die athenische Gesellschaft allmählich in die Richtung, in der sie sich in den folgenden Jahrhunderten weiterentwickelt hat.
  en: During the next eighty years the Athenian society gradually drifted into the course on which it further developed in the following centuries.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
- id: V.15.2
  kind: p
  original: Dem üppigen Landwucher der vorsolonischen Zeit war ein Riegel vorgeschoben, ebenso der maßlosen Konzentration des Grundbesitzes.
  en: The outrageous land speculation of the time before Solon had been fettered, likewise the excessive concentration of property in land.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
- id: V.15.3
  kind: p
  original: Der Handel und das mit Sklavenarbeit immer mehr im großen betriebne Handwerk und Kunsthandwerk wurden herrschende Erwerbszweige.
  en: Commerce, trades and artisan handicrafts, which were carried on in an ever larger scale as slave labor increased, became the ruling factors in gaining a living.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
- id: V.15.4
  kind: p
  original: Man wurde aufgeklärter.
  en: Public enlightenment advanced.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
- id: V.15.5
  kind: p
  original: Statt in der anfänglichen brutalen Weise die eignen Mitbürger auszubeuten, beutete man vorwiegend die Sklaven und die außerathenische Kundschaft aus.
  en: Instead of exploiting their own fellow citizens in the old brutal style, the Athenians now exploited mainly the slaves and the customers outside.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
- id: V.15.6
  kind: p
  original: Der bewegliche Besitz, der Geldreichtum und der Reichtum an Sklaven und Schiffen wuchs immer mehr, aber er war jetzt nicht mehr bloßes Mittel zum Erwerb von Grundbesitz wie in der ersten, bornierten Zeit, er war Selbstzweck geworden.
  en: Movable property, wealth in money, slaves and ships, increased more and more. But instead of being a simple means for the purchase of land, as in the old stupid times, it had now become an end in itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.15.7
  kind: p
  original: Damit war einerseits der alten Adelsmacht eine siegreiche Konkurrenz erwachsen in der neuen Klasse von industriellen und kaufmännischen Reichen, andrerseits aber auch den Resten der alten Gentilverfassung der letzte Boden entzogen.
  en: The new class of industrial and commercial owners of wealth now waged a victorious competition against the old nobility. The remnants of the old gentile constitution lost their last hold.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.15.8
  kind: p
  original: Die Gentes, Phratrien und Stämme, deren Mitglieder jetzt über ganz Attika zerstreut und vollständig durcheinandergeworfen wohnten, waren damit zu politischen Körperschaften ganz untauglich geworden; eine Menge athenischer Bürger gehörten gar keiner Gens an, sie waren Eingewanderte, die zwar ins Bürgerrecht, aber nicht in einen der alten Geschlechtsverbände aufgenommen worden; daneben stand noch die stets wachsende Zahl der bloß schutzverwandten fremden Einwandrer.
  en: The gentes, phratries and tribes, the members of which now were dispersed all over Attica and completely intermixed, had thus become unavailable as political groups. A great many citizens of Athens did not belong to any gens. They were immigrants who had been adopted into citizenship, but not into any of the old groups of kinship. Besides, there was a steadily increasing number of foreign immigrants who were only protected by traditional sufferance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
  align: '1:4'
  review: true
  review_reason: 1 de sentence(s) matched to 4 en sentence(s)
- id: V.16.1
  kind: p
  original: Währenddessen gingen die Parteikämpfe voran; der Adel suchte seine früheren Vorrechte wiederzuerobern und erlangte wieder für einen Augenblick die Oberhand, bis die Revolution des Kleisthenes (509 vor unsrer Zeitrechnung) ihn endgültig stürzte; mit ihm aber auch den letzten Rest der Gentilverfassung.
  en: Meanwhile the struggles of the parties proceeded. The nobility tried to regain their former privileges and for a short time recovered their supremacy, until the revolution of Kleisthenes (509 B. C.) brought their final downfall and completed the ruin of gentile law.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.17.1
  kind: p
  original: Kleisthenes, in seiner neuen Verfassung, ignorierte die vier alten auf Gentes und Phratrien begründeten Stämme.
  en: In his new constitution, Kleisthenes ignored the four old tribes founded on the gentes and phratries.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
- id: V.17.2
  kind: p
  original: An ihre Stelle trat eine ganz neue Organisation auf Grund der schon in den Naukrarien versuchten Einteilung der Bürger nach dem bloßen Ort der Ansässigkeit.
  en: Their place was taken by an entirely new organization based on the recently attempted division of the citizens into naukrariai according to residence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
- id: V.17.3
  kind: p
  original: Nicht mehr die Zugehörigkeit zu den Geschlechtsverbänden, sondern nur der Wohnsitz entschied; nicht das Volk, sondern das Gebiet wurde eingeteilt, die Bewohner wurden politisch bloßes Zubehör des Gebiets.
  en: No longer was membership in a group of kindred the dominant fact, but simply local residence. Not the nation, but the territory was now divided; the inhabitants became mere political fixtures of the territory.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.18.1
  kind: p
  original: Ganz Attika wurde in hundert Gemeindebezirke, Demen, geteilt, deren jeder sich selbst verwaltete.
  en: The whole of Attica was divided into one hundred communal districts, so-called demoi, every one of which was autonomous.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
- id: V.18.2
  kind: p
  original: Die in jedem Demos ansässigen Bürger (Demoten) erwählten ihren Vorsteher (Demarch) und Schatzmeister sowie dreißig Richter mit Gerichtsbarkeit über kleinere Streitsachen.
  en: The citizens living in a demos (demotoi) elected their official head (demarchos), treasurer and thirty judges with jurisdiction in minor cases.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '114'
- id: V.18.3
  kind: p
  original: Sie erhielten ebenfalls einen eignen Tempel und Schutzgott oder Heroen, dessen Priester sie wählten.
  en: They also received their own temple and divine guardian or heros, whose priest they elected.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 114-115
- id: V.18.4
  kind: p
  original: Die höchste Macht im Demos war bei der Versammlung der Demoten.
  en: The control of the demos was in the hands of the council of demotoi.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '115'
- id: V.18.5
  kind: p
  original: Es ist, wie Morgan richtig bemerkt, das Urbild der selbstregierenden amerikanischen Stadtgemeinde.
  en: This is, as Morgan correctly remarks, the prototype of the autonomous American township.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '115'
- id: V.18.6
  kind: p
  original: Mit derselben Einheit, mit der der moderne Staat in seiner höchsten Ausbildung endigt, mit derselben fing der entstehende Staat in Athen an.
  en: The modern state in its highest development ended in the same unit with which the rising state began its career in Athens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '115'
- id: V.19.1
  kind: p
  original: Zehn dieser Einheiten, Demen, bildeten einen Stamm, der aber zum Unterschied vom alten Geschlechtsstamm jetzt Ortsstamm genannt wird.
  en: Ten of these units (demoi) formed a tribe, which, however, was now designated as local tribe in order to distinguish it from the old sex tribe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '115'
- id: V.19.2
  kind: p
  original: Der Ortsstamm war nicht allein eine selbstverwaltende politische, er war auch eine militärische Körperschaft; er erwählte den Phylarchen oder Stammvorsteher, der die Reiterei, den Taxiarchen, der das Fußvolk, und den Strategen, der die gesamte im Stammesgebiet ausgehobene Mannschaft befehligte.
  en: The local tribe was not only an autonomous political, but also a military group. It elected the phylarchos or tribal head who commanded the horsemen, the taxiarchos commanding the infantry and the strategic leader, who was in command of the entire contingent raised in the tribal territory by conscription.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '115'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.19.3
  kind: p
  original: Er stellte ferner fünf Kriegsschiffe nebst Mannschaft und Befehlshaber und erhielt einen attischen Heros, nach welchem er sich benannte, zum Schutzheiligen.
  en: The local tribe furthermore furnished, equipped and fully manned five war vessels. It was designated by the name of the Attic hero who was its guardian deity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '115'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.19.4
  kind: p
  original: Endlich wählte er fünfzig Ratsmänner in der athenischen Rat.
  en: It elected fifty councilmen into the council of Athens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '115'
- id: V.20.1
  kind: p
  original: Den Abschluß bildete der athenische Staat, regiert von dem aus den fünfhundert Erwählten der zehn Stämme zusammengesetzten Rat und in letzter Instanz von der Volksversammlung, wo jeder athenische Bürger Zutritt und Stimmrecht hatte; daneben besorgten Archonten und andre Beamte die verschiednen Verwaltungszweige und Gerichtsbarkeiten.
  en: Thus we arrive at the Athenian state, governed by a council of five hundred elected by and representing the ten tribes and subject to the vote of the public meeting, where every citizen could enter and vote. Archons and other officials attended to the different departments of administration and justice.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '115'
  align: '2:2'
  review: true
  review_reason: 2 de sentence(s) matched to 2 en sentence(s)
- id: V.20.2
  kind: p
  original: Ein oberster Beamter der vollziehenden Gewalt bestand in Athen nicht.
  en: ''
  joined_to: V.20.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '115'
- id: V.21.1
  kind: p
  original: Mit dieser neuen Verfassung und mit der Zulassung einer sehr großen Zahl Schutzverwandter, teils Eingewanderter, teils freigelaßner Sklaven, waren die Organe der Geschlechterverfassung aus den öffentlichen Angelegenheiten hinausgedrängt; sie sanken herab zu Privatvereinen und religiösen Genossenschaften.
  en: By this new constitution and by the admission of a large number of aliens, partly freed slaves, partly immigrants, the organs of gentile constitution were displaced in public affairs. They became mere private and religious clubs.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '115'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.21.2
  kind: p
  original: Aber der moralische Einfluß, die überkommene Anschauungs- und Denkweise der alten Gentilzeit erbten sich noch lange fort und starben erst allmählich aus.
  en: But their moral influence, the traditional conceptions and views of the old gentile period, survived for a long time and expired only gradually.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '115'
- id: V.21.3
  kind: p
  original: Das zeigte sich bei einer ferneren staatlichen Einrichtung.
  en: This was evident in another state institution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '115'
- id: V.22.1
  kind: p
  original: Wir sahn, daß ein wesentliches Kennzeichen des Staats in einer von der Masse des Volks unterschiednen öffentlichen Gewalt besteht.
  en: We have seen that an essential mark of the state consists in a public power of coercion divorced from the mass of the people.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '115'
- id: V.22.2
  kind: p
  original: Athen hatte damals nur erst ein Volksheer und eine unmittelbar vom Volk gestellte Flotte; diese schützten nach außen und hielten die Sklaven im Zaum, die schon damals die große Mehrzahl der Bevölkerung bildeten.
  en: Athens possessed at that time only a militia and a navy equipped and manned directly by the people. These afforded protection against external enemies and held the slaves in check, who at that time already made up the large majority of the population.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '115'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.22.3
  kind: p
  original: Gegenüber den Bürgern bestand die öffentliche Gewalt zunächst nur als die Polizei, die so alt ist wie der Staat, weshalb die naiven Franzosen des 18. Jahrhunderts auch nicht von zivilisierten Völkern sprachen, sondern von polizierten (nations policées).
  en: For the citizens, this coercive power at first only existed in the shape of the police, which is as old as the state. The innocent Frenchmen of the 18th century, therefore, had the habit of speaking not of civilized, but of policed nations (nations policees).
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '115'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.22.4
  kind: p
  original: Die Athener richteten also gleichzeitig mit ihrem Staat auch eine Polizei ein, eine wahre Gendarmerie von Bogenschützen zu Fuß und zu Pferd - Landjäger, wie man in Süddeutschland und der Schweiz sagt.
  en: The Athenians, then, provided for a police in their new state, a veritable "force" of bowmen on foot and horseback.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 115-116
- id: V.22.5
  kind: p
  original: Diese Gendarmerie aber wurde gebildet - aus Sklaven.
  en: This police force consisted--of slaves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
- id: V.22.6
  kind: p
  original: So entwürdigend kam dieser Schergendienst dem freien Athener vor, daß er sich lieber vom bewaffneten Sklaven verhaften ließ, als daß er selbst sich zu solcher Schmachtat hergab.
  en: The free Athenian regarded this police duty as so degrading that he preferred being arrested by an armed slave rather than lending himself to such an ignominious service.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
- id: V.22.7
  kind: p
  original: Das war noch die alte Gentilgesinnung.
  en: That was still a sign of the old gentile spirit.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
- id: V.22.8
  kind: p
  original: Der Staat konnte ohne die Polizei nicht bestehn, aber er war noch jung und hatte noch nicht moralischen Respekt genug, um ein Handwerk achtungswert zu machen, das den alten Gentilgenossen notwendig infam erschien.
  en: The state could not exist without a police, but as yet it was too young and did not command sufficient moral respect to give prestige to an occupation that necessarily appeared ignominious to the old gentiles.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
- id: V.23.1
  kind: p
  original: Wie sehr der jetzt in seinen Hauptzügen fertige Staat der neuen gesellschaftlichen Lage der Athener angemessen war, zeigt sich in dem raschen Aufblühn des Reichtums, des Handels und der Industrie.
  en: How well this state, now completed in its main outlines, suited the social condition of the Athenians was apparent by the rapid growth of wealth, commerce and industry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
- id: V.23.2
  kind: p
  original: Der Klassengegensatz, auf dem die gesellschaftlichen und politischen Einrichtungen beruhten, war nicht mehr der von Adel und gemeinem Volk, sondern der von Sklaven und Freien, Schutzverwandten und Bürgern.
  en: The distinction of classes on which the social and political institutions are resting was no longer between nobility and common people, but between slaves and freemen, aliens and citizens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
- id: V.23.3
  kind: p
  original: Zur Zeit der höchsten Blüte bestand die ganze athenische freie Bürgerschaft, Weiber und Kinder eingeschlossen, aus etwa 90.000 Köpfen, daneben 365.000 Sklaven beiderlei Geschlechts und 45.000 Schutzverwandte - Fremde und Freigelaßne.
  en: At the time of the greatest prosperity the whole number of free Athenian citizens, women and children included, amounted to about 90,000; the slaves of both sexes numbered 365,000 and the aliens--foreigners and freed slaves--45,000.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
- id: V.23.4
  kind: p
  original: Auf jeden erwachsenen männlichen Bürger kamen also mindestens 18 Sklaven und über zwei Schutzverwandte.
  en: Per capita of each adult citizen there were, therefore, at least eighteen slaves and more than two aliens.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
- id: V.23.5
  kind: p
  original: Die große Sklavenzahl kam daher, daß viele von ihnen in Manufakturen, großen Räumen, unter Aufsehern zusammen arbeiteten.
  en: The great number of slaves is explained by the fact that many of them worked together in large factories under supervision.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
- id: V.23.6
  kind: p
  original: Mit der Entwicklung des Handels und der Industrie aber kam Akkumulation und Konzentration der Reichtümer in wenigen Händen, Verarmung der Masse der freien Bürger, denen nur die Wahl blieb, entweder der Sklavenarbeit durch eigne Handwerksarbeit Konkurrenz zu machen, was für schimpflich, banausisch galt und auch wenig Erfolg versprach - oder aber zu verlumpen.
  en: The development of commerce and industry brought about an accumulation and concentration of wealth in a few hands. The mass of the free citizens were impoverished and had to face the choice of either competing with their own labor against slave labor, which was considered ignoble and vile, besides promising little success, or to be ruined.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.23.7
  kind: p
  original: Sie taten, unter den Umständen mit Notwendigkeit, das letztere, und da sie die Masse bildeten, richteten sie damit den ganzen athenischen Staat zugrunde.
  en: Under the prevailing circumstances they necessarily chose the latter course and being in the majority they ruined the whole Attic state.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
- id: V.23.8
  kind: p
  original: Nicht die Demokratie hat Athen zugrundegerichtet, wie die europäischen, fürstenschweifwedelnden Schulmeister behaupten, sondern die Sklaverei, die die Arbeit des freien Bürgers ächtete.
  en: Not democracy caused the downfall of Athens, as the European glorifiers of princes and lickspittle schoolmasters would have us believe, but slavery ostracizing the labor of the free citizen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
- id: V.24.1
  kind: p
  original: Die Entstehung des Staats bei den Athenern ist ein besonders typisches Muster der Staatsbildung überhaupt, weil sie einerseits ganz rein, ohne Einmischung äußerer oder innerer Vergewaltigung vor sich geht - die Usurpation des Pisistratos hinterließ keine Spur ihrer kurzen Dauer -, weil sie andrerseits einen Staat von sehr hoher Formentwicklung, die demokratische Republik, unmittelbar aus der Gentilgesellschaft hervorgehen läßt, und endlich weil wir mit allen wesentlichen Einzelheiten hinreichend bekannt sind.
  en: The origin of the state among the Athenians presents a very typical form of state organization. For it took place without any marring external interference or internal obstruction--the usurpation of Pisistratos left no trace of its short duration. It shows the direct rise of a highly developed form of a state, the democratic republic, out of gentile society. And finally, we are sufficiently acquainted with all the essential details of the process.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '116'
  align: '1:4'
  review: true
  review_reason: 1 de sentence(s) matched to 4 en sentence(s)
