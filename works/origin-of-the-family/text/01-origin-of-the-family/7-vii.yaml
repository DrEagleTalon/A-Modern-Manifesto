- id: VII.1.1
  kind: p
  original: Der Raum verbietet uns, auf die noch jetzt bei den verschiedensten wilden und barbarischen Völkern in reinerer oder getrübterer Form bestehenden Gentilinstitutionen einzugehn oder auf die Spuren davon in der älteren Geschichte asiatischer Kulturvölker.
  en: Space forbids a consideration of the gentile institutions found in a more or less pure form among the savage and barbarian races of the present day; or of the traces of such institutions, discovered in the ancient history of civilized nations in Asia.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T1
    editions: '1884'
    reading: 'fehlt der folgende Text bis zu den Worten: Hier nur einige kurze Notizen...'
    base_text: ‸ Der Raum verbietet uns, …
  mew_page: '127'
- id: VII.1.2
  kind: p
  original: Die einen oder die andern finden sich überall.
  en: One or the other are met everywhere.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: VII.1.3
  kind: p
  original: 'Nur ein paar Beispiele: Ehe noch die Gens erkannt war, hat der Mann, der sich die meiste Mühe gab sie mißzuverstehen, hat McLennan sie nachgewiesen und im ganzen richtig beschrieben bei Kalmüken, Tscherkessen, Samojeden und bei drei indischen Völkern: den Waralls, den Magars und den Munnipuris.'
  en: 'A few illustrations may suffice: Even before the gens had been recognized, it was pointed out and accurately described in its main outlines by the man who took the greatest pains to misunderstand it, McLennan, who wrote of this institution among the Kalmucks, the Circassians, the Samoyeds and three Indian nations: the Warals, the Magars and the Munnipurs.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: VII.1.4
  kind: p
  original: Neuerdings hat M. Kowalewski sie entdeckt und beschrieben bei den Pschaven, Schevsuren, Svaneten und andern kaukasischen Stämmen.
  en: Recently it was described by M. Kovalevsky, who discovered it among the Pshavs, Shevsurs, Svanets and other Caucasian tribes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: VII.1.5
  kind: p
  original: Hier nur einige kurze Notizen über das Vorkommen der Gens bei Kelten und Germanen.
  en: A few short notes about the existence of the gens among Celts and Germans may find a place here.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: VII.2.1
  kind: p
  original: Die ältesten erhaltenen keltischen Gesetze zeigen uns die Gens noch in vollem Leben; in Irland lebt sie wenigstens instinktiv im Volksbewußtsein noch heute, nachdem die Engländer sie gewaltsam gesprengt; in Schottland stand sie noch Mitte des vorigen Jahrhunderts in voller Blüte und erlag auch hier nur den Waffen, der Gesetzgebung und den Gerichtshöfen der Engländer.
  en: The oldest Celtic laws preserved for us still show the gens in full bloom. In Ireland, it is alive in the popular instinct to this day, after it has been forced out of actual existence by the English. It was in full force in Scotland until the middle of the eighteenth century, and here it also succumbed only to the weapons, laws and courts of the English.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: VII.3.1
  kind: p
  original: Die altwalisischen Gesetze, die mehrere Jahrhunderte vor der englischen Eroberung, spätestens im 11. Jahrhundert, niedergeschrieben wurden, zeigen noch gemeinschaftlichen Ackerbau ganzer Dörfer, wenn auch nur als ausnahmsweisen Rest früherer allgemeiner Sitte; jede Familie hatte fünf Acker zur eignen Bebauung; ein Stück wurde daneben gemeinsam bebaut und der Ertrag verteilt.
  en: The old Welsh laws, written several centuries before the English invasion, not later than the 11th century, still show collective agriculture of whole villages, although only exceptionally and as the survival of a former universal custom. Every family had five acres for its special use; another lot was at the same time cultivated collectively and its yield divided among the different families.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VII.3.2
  kind: p
  original: Daß diese Dorfgemeinden Gentes repräsentieren oder Unterabteilungen von Gentes, ist bei der Analogie von Irland und Schottland nicht zu bezweifeln, selbst wenn eine erneuerte Prüfung der walisischen Gesetze, zu der mir die Zeit fehlt (meine Auszüge sind vom Jahr 1869), dies nicht direkt beweisen sollte.
  en: In view of Irish and Scotch analogies it cannot be doubted that these village communities represent gentes or subdivisions of gentes, even though a repeated investigation of the Welsh laws, which I cannot undertake from lack of time (my notes are from 1869), should not directly corroborate this.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 127-128
- id: VII.3.3
  kind: p
  original: Was aber die walisischen Quellen, und mit ihnen die irischen, direkt beweisen, ist, daß bei den Kelten die Paarungsehe im 11. Jahrhundert noch keineswegs durch die Monogamie verdrängt war.
  en: One thing, however, is plainly proven by the Welsh and Irish laws, namely that the pairing family had not yet given way to monogamy among the Celts of the 11th century.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: VII.3.4
  kind: p
  original: In Wales wurde eine Ehe erst unlöslich, oder besser unkündbar, nach sieben Jahren.
  en: In Wales, marriage did not become indissoluble by divorce, or rather by notification, until after seven years.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: VII.3.5
  kind: p
  original: Fehlten nur drei Nächte an den sieben Jahren, so konnten die Gatten sich trennen.
  en: Even if no more than three nights were lacking to make up the seven years, a married couple could still separate.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: VII.3.6
  kind: p
  original: 'Dann wurde geteilt: Die Frau teilte, der Mann wählte sein Teil.'
  en: 'Their property was divided among them: the woman made the division, the man selected his share.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: VII.3.7
  kind: p
  original: Die Möbel wurden nach gewissen, sehr humoristischen Regeln geteilt.
  en: The furniture was divided according to certain very funny rules.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: VII.3.8
  kind: p
  original: Löste der Mann die Ehe, so mußte er der Frau ihre Mitgift und einiges andre zurückgeben; war es die Frau, so erhielt sie weniger.
  en: If the marriage was dissolved by the man, he had to return the woman's dowry and a few other articles; if the woman wished a separation, then she received less.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: VII.3.9
  kind: p
  original: Von den Kindern bekam der Mann zwei, die Frau eines, und zwar das mittelste.
  en: Of three children the man took two, the woman one, viz., the second child.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: VII.3.10
  kind: p
  original: Wenn die Frau nach der Scheidung einen andern Mann nahm und der erste Mann holte sie sich wieder, so mußte sie ihm folgen, auch wenn sie schon einen Fuß im neuen Ehebett hatte.
  en: If the woman married again after her divorce, and her first husband claimed her back, she was obliged to follow him, even if she had one foot in her new husband's bed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: VII.3.11
  kind: p
  original: Waren die beiden aber sieben Jahre zusammengewesen, so waren sie Mann und Frau, auch ohne vorherige förmliche Heirat.
  en: But if two had lived together for seven years, they were considered man and wife, even without the preliminaries of a formal marriage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: VII.3.12
  kind: p
  original: Keuschheit der Mädchen vor der Heirat wurde durchaus nicht streng eingehalten oder gefordert; die hierauf bezüglichen Bestimmungen sind äußerst frivoler Natur und keineswegs der bürgerlichen Moral gemäß.
  en: Chasteness of the girls before marriage was by no means strictly observed, nor was it required. The regulations regarding this subject are of an extremely frivolous nature and in contradiction with civilized morals.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VII.3.13
  kind: p
  original: Beging eine Frau einen Ehebruch, so durfte der Mann sie prügeln (einer der drei Fälle, wo ihm dies erlaubt, sonst verfiel er in Strafe), dann aber weiter keine Genugtuung fordern, denn "für dasselbe Vergehen soll entweder Sühnung sein oder Rache, aber nicht beides zugleich".
  en: When a woman committed adultery, her husband had a right to beat her--this was one of three cases when he could do so without incurring a penalty--but after that he could not demand any other satisfaction, for "the same crime shall either be atoned for or avenged, but not both."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: VII.4.1
  kind: p
  original: 'Die Gründe, auf die hin die Frau die Scheidung verlangen durfte, ohne in ihren Ansprüchen bei der Auseinandersetzung zu verlieren, waren sehr umfassender Art: Übler Atem des Mannes genügte.'
  en: 'The reasons that entitled a woman to a divorce without curtailing her claims to a fair settlement were of a very diverse nature: bad breath of the man was sufficient.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: VII.4.2
  kind: p
  original: Das an den Stammeshäuptling oder König zu zahlende Loskaufgeld für das Recht der ersten Nacht (gobr merch, daher der mittelalterliche Name marcheta, französisch marquette) spielt eine große Rolle im Gesetzbuch.
  en: The ransom to be paid to the chief or king for the right of the first night (gobr merch, hence the medieval name marcheta, French marquette) plays a conspicuous part in the code of laws.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: VII.4.3
  kind: p
  original: Die Weiber hatten Stimmrecht in den Volksversammlungen.
  en: The women had the right to vote in the public meetings.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: VII.4.4
  kind: p
  original: Fügen wir hinzu, daß in Irland ähnliche Verhältnisse bezeugt sind; daß dort ebenfalls Ehen auf Zeit ganz gebräuchlich und der Frau bei der Trennung genau geregelte, große Begünstigungen, sogar Entschädigung für ihre häuslichen Dienste zugesichert waren; daß dort eine "erste Frau" neben andern Frauen vorkommt und bei Erbteilungen zwischen ehelichen und unehelichen Kindern kein Unterschied gemacht wird - so haben wir ein Bild der Paarungsehe, wogegen die in Nordamerika gültige Eheform streng erscheint, wie es aber im 11. Jahrhundert bei einem Volk nicht verwundern kann, das noch zu Cäsars Zeit in der Gruppenehe lebte.
  en: Add to this that similar conditions are vouched for in Ireland; that marriage on time was also quite the custom there, and that the women were assured of liberal and well defined privileges in case of divorce, even to the point of remuneration for domestic services; that a "first wife" existed by the side of others, and that legal and illegal children without distinction received a share of their deceased parent's property--and we have a picture of the pairing family among the Celts. The marriage laws of the American Indians seem strict in comparison to the Celtic, but this is not surprising when we remember that the Celts were still living in group marriage at Cesar's time.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VII.5.1
  kind: p
  original: Die irische Gens (Sept, der Stamm heißt Clainne, Clan) wird nicht nur durch die alten Rechtsbücher, sondern auch durch die zur Verwandlung des Clanlandes in Domäne des englischen Königs hinübergesandten englischen Juristen des 17. Jahrhunderts bestätigt und beschrieben.
  en: The Irish gens (Sept; the tribe was called clainne, clan) is confirmed and described not alone by the ancient law codes, but also by the English jurists of the 17th century who were sent across for the purpose of transforming the clan lands into royal dominions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: VII.5.2
  kind: p
  original: Der Boden war bis zu dieser letzteren Zeit Gemeineigentum des Clans oder der Gens, soweit er nicht bereits von den Häuptlingen in ihre Privatdomäne verwandelt worden war.
  en: Up to this time, the soil had been the collective property of the gens or the clan, except where the chiefs had already claimed it as their private dominion.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: VII.5.3
  kind: p
  original: Wenn ein Gentilgenosse starb, also eine Haushaltung einging, so nahm der Vorsteher (caput cognationis nannten ihn die englischen Juristen) eine neue Landteilung des ganzen Gebiets unter den übrigen Haushaltungen vor.
  en: When a gentile died, and a household was thus dissolved, the gentile chief (called caput cognationis by the English jurists) made a new assignment of the whole gentile territory to the rest of the household.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: VII.5.4
  kind: p
  original: Diese muß im ganzen nach den in Deutschland gültigen Regeln erfolgt sein.
  en: This division of land probably took place according to such rules as were observed in Germany.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: VII.5.5
  kind: p
  original: Noch jetzt finden sich einige - vor vierzig oder fünfzig Jahren sehr zahlreiche - Dorffluren in sog. Rundale.
  en: Until about fifty years ago, village marks were quite frequent, and some of these so-called rundales may be found to this day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: VII.5.6
  kind: p
  original: Die Bauern, Einzelpächter des früher der Gens gemeinsam gehörigen, vom englischen Eroberer geraubten Bodens, zahlen jeder die Pacht für sein Stück, werfen aber das Acker- und Wiesenland aller Stücke zusammen, teilen es nach Lage und Qualität in "Gewanne", wie es an der Mosel heißt, und geben jedem seinen Anteil in jedem Gewann; Moor- und Weideland wird gemeinsam genutzt.
  en: The farmers of a rundale, individual tenants on the soil that once was the collective property of the gens, but had been confiscated by the English conquerors, each pay the rent for his respective parcel. But they all combine their lands and parcel it off according to situation and quality. These parcels, called "Gewanne" on the German river Mosel, are cultivated collectively and their yield is divided into shares. Marshland and pastures are used in common.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
  align: '1:4'
  review: true
  review_reason: 1 de sentence(s) matched to 4 en sentence(s)
- id: VII.5.7
  kind: p
  original: Noch vor fünfzig Jahren wurde von Zeit zu Zeit, manchmal jährlich, neu umgeteilt.
  en: Fifty years ago, new divisions were still made occasionally, sometimes annually.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: VII.5.8
  kind: p
  original: Die Flurkarte eines solchen Rundale-Dorfes sieht ganz genauso aus wie die einer deutschen Gehöferschaft an der Mosel oder im Hochwald.
  en: The field map of such a rundale village looks exactly like that of a German "Gehoeferschaft" (farming commune) on the Mosel or in the Hochwald.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: VII.5.9
  kind: p
  original: Auch in den "factions" ["Parteien"] lebt die Gens fort.
  en: The gens also survives in the "factions."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: VII.5.10
  kind: p
  original: Die irischen Bauern teilen sich oft in Parteien, die auf scheinbar ganz widersinnigen oder sinnlosen Unterschieden beruhen, den Engländern ganz unverständlich sind und keinen andern Zweck zu haben scheinen als die beliebten solennen Prügeleien der einen Faktion gegen die andre.
  en: The Irish farmers often form parties that seem to be founded on absolutely contradictory or senseless distinctions, quite incomprehensible to Englishmen. The only purpose of these factions is apparently to rally for the popular sport of hammering the life out of one another.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VII.5.11
  kind: p
  original: Es sind künstliche Wiederbelebungen, nachgeborner Ersatz für die zersprengten Gentes, die die Fortdauer des ererbten Gentilinstinkts in ihrer Weise dartun.
  en: They are artificial reincarnations, modern substitutes for the dispersed gentes that demonstrate the continuation of the old gentile instinct in their own peculiar manner.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: VII.5.12
  kind: p
  original: In manchen Gegenden sind übrigens die Gentilgenossen noch ziemlich auf dem alten Gebiet zusammen; so hatte noch in den dreißiger Jahren die große Mehrzahl der Bewohner der Grafschaft Monaghan nur vier Familiennamen, d.h. stammte aus vier Gentes oder Clans.
  en: By the way, in some localities the gentiles are still living together on what is practically their old territory. During the thirties, for instance, the great majority of the inhabitants of the old county of Monaghan had only four family names, i. e., they were descended from four gentes or tribes (clans).
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - VII.N1
  mew_page: '129'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VII.6.1
  kind: p
  original: In Schottland datiert der Untergang der Gentilordnung von der Niederwerfung des Aufstandes von 1745.
  en: The downfall of the gentile order in Scotland dates from the suppression of the revolt in 1745.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: VII.6.2
  kind: p
  original: Welches Glied dieser Ordnung der schottische Clan speziell darstellt, bleibt noch zu untersuchen; daß er aber ein solches, ist unzweifelhaft.
  en: What link of this order the Scotch clan represented remains to be investigated; that it is a link, is beyond doubt.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: VII.6.3
  kind: p
  original: In Walter Scotts Romanen sehn wir diesen hochschottischen Clan lebendig vor uns.
  en: Walter Scott's novels bring this Scotch highland clan vividly before our eyes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: VII.6.4
  kind: p
  original: Er ist, sagt Morgan, "ein vortreffliches Musterbild der Gens in seiner Organisation und in seinem Geist, ein schlagendes Beispiel der Herrschaft des Gentillebens über die Gentilen...
  en: It is, as Morgan says, "an excellent type of the gens in organization and in spirit, and an extraordinary illustration of the power of the gentile life over its members....
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: VII.6.5
  kind: p
  original: In ihren Fehden und in ihrer Blutrache, in der Gebietsverteilung nach Clans, in ihrer gemeinsamen Bodennutzung, in der Treue der Clanglieder gegen den Häuptling und gegeneinander finden wir die überall wiederkehrenden Züge der Gentilgesellschaft...
  en: We find in their feuds and blood revenge, in their localization by gentes, in their use of lands in common, in the fidelity of the clansman to his chief and of the members of the clan to each other, the usual and persistent features of gentile society....
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: VII.6.6
  kind: p
  original: Die Abstammung zählte nach Vaterrecht, so daß die Kinder der Männer in den Clans blieben, während die der Weiber in die Clans ihrer Vater übertraten."
  en: Descent was in the male line, the children of the males remaining members of the clan, while the children of its female members belonged to the clans of their respective fathers."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: VII.7.1
  kind: p
  original: Daß aber in Schottland früher Mutterrecht herrschte, beweist die Tatsache, daß in der königlichen Familie der Pikten, nach Beda, weibliche Erbfolge galt.
  en: The fact that matriarchal law was formerly in force in Scotland is proved by the royal family of the Picts, who according to Beda observed female lineage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: VII.7.2
  kind: p
  original: Ja selbst ein Stück Punaluafamilie hatte sich, wie bei den Walisern, so bei den Skoten, bis ins Mittelalter bewahrt in dem Recht der ersten Nacht, das der Clanhäuptling oder der König als letzter Vertreter der früheren gemeinsamen Ehemänner bei jeder Braut auszuüben berechtigt war, sofern es nicht abgekauft wurde.
  en: Even a survival of the Punaluan family had been preserved among the Scots, as among the Welsh. For until the middle ages, the chief of the clan or king, the last representatives of the former common husbands, had the right to claim the first night with every bride, unless a ransom was given.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
