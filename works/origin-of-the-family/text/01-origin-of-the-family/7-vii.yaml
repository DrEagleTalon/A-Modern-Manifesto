    editions: '1884'
    reading: 'folgt: Dasselbe Recht - in Nordamerika kommt es im äußersten Nordwesten vielfach vor - galt auch bei den Russen, wo die Großfürstin Olga es im zehnten Jahrhundert abschaffte.'
    base_text: … es nicht abgekauft wurde. ‸  …
