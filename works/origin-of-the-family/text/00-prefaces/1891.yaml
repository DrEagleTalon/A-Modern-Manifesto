- id: P1891.1.1
  kind: p
  original: Die früheren starken Auflagen dieser Schrift sind seit fast einem halben Jahr vergriffen, und der Verleger [J. H. W. Dietz] hat schon seit längerer Zeit die Besorgung einer neuen Auflage von mir gewünscht.
  en: The first large editions of this work have been out of print for nearly six months, and the publisher has for some time requested of me the arrangement of a new edition.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '211'
- id: P1891.1.2
  kind: p
  original: Dringendere Arbeiten hielten mich bis jetzt davon ab.
  en: Urgent duties have hitherto prevented me.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '211'
- id: P1891.1.3
  kind: p
  original: Seit dem Erscheinen der ersten Auflage sind sieben Jahre verflossen, in denen die Kenntnis der ursprünglichen Familienformen bedeutende Fortschritte gemacht hat.
  en: Seven years have passed, since the first edition made its appearance; during this time, the study of primeval forms of the family has made considerable progress.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '211'
- id: P1891.1.4
  kind: p
  original: Es war hier also die nachbessernde und ergänzende Hand fleißig anzuwenden; und zwar um so mehr, als die beabsichtigte Stereotypierung des gegenwärtigen Textes mir fernere Änderungen für einige Zeit unmöglich machen wird.
  en: Hence it became necessary to apply diligently the improving and supplementing hand, more especially, as the proposed stereotyping of the present text will make further changes impossible for some time.
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T1
    editions: 1891 (Die Neue Zeit)
    reading: 'In der "Neuen Zeit" lautet der letzte Teil des Satzes: als die neue Auflage die heute in der deutschen sozialistischen Literatur übliche, in andren deutschen Büchergebieten noch immer sehr seltne Stärke erhalten soll'
    base_text: … Zeit unmöglich machen wird ‸ . …
  mew_page: '211'
- id: P1891.2.1
  kind: p
  original: Ich habe also den ganzen Text einer sorgfältigen Durchsicht unterworfen und eine Reihe von Zusätzen gemacht, wodurch, wie ich hoffe, der heutige Stand der Wissenschaft gebührende Berücksichtigung gefunden hat.
  en: Consequently, I have subjected the whole text to a thorough revision and made a number of additions which, I hope, will give due recognition to the present stage of scientific progress.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '211'
- id: P1891.2.2
  kind: p
  original: Ferner gebe ich im weitern Verlauf dieses Vorworts eine kurze Übersicht über die Entwicklung der Geschichte der Familie von Bachofen bis Morgan; und zwar hauptsächlich deswegen, weil die englische chauvinistisch angehauchte prähistorische Schule noch fortwährend ihr möglichstes tut, die durch Morgans Entdeckungen vollzogne Umwälzung der urgeschichtlichen Anschauungen totzuschweigen, wobei sie jedoch in der Aneignung von Morgans Resultaten sich keineswegs geniert.
  en: Furthermore, I give in the course of this preface a short synopsis of the history of the family as treated by various writers from Bachofen to Morgan. I am doing this mainly because the English prehistoric school, tinged with chauvinism, is continually doing its utmost to kill by its silence the revolution in primeval conceptions effected by Morgan's discoveries. At the same time this school is not at all backward in appropriating to its own use the results of Morgan's study.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '211'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
