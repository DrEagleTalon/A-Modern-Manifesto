- id: P1891.31.1
  kind: p
  original: Auf die übrigen Fortschritte, die die Urgeschichte Morgan verdankt, brauche ich hier nicht einzugehn; im Verlauf meiner Arbeit findet sich das Nötige darüber.
  en: It is not necessary to dwell in this preface on the other forms of progress which primeval history owes to Morgan. Reference to them will be found in the course of my work.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '221'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.31.2
  kind: p
  original: Die vierzehn Jahre, die seit dem Erscheinen seines Hauptwerkes verflossen, haben unser Material für die Geschichte der menschlichen Urgesellschaften sehr bereichert; zu den Anthropologen, Reisenden und Prähistorikern von Profession sind die vergleichenden Juristen getreten und haben teils neuen Stoff, teils neue Gesichtspunkte gebracht.
  en: During the fourteen years that have elapsed since the publication of his main work, the material contributing to the history of primeval society has been considerably enriched. Anthropologists, travelers and professional historians were joined by comparative jurists who added new matter and opened up new points of view.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '221'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.31.3
  kind: p
  original: Manche Einzelhypothese Morgans ist dadurch schwankend oder selbst hinfällig geworden.
  en: Here and there, some special hypothesis of Morgan has been shaken or even become obsolete.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '221'
- id: P1891.31.4
  kind: p
  original: Aber nirgendwo hat das neugesammelte Material dazu geführt, seine großen Hauptgesichtspunkte durch andere zu verdrängen.
  en: But in no instance has the new material led to a weakening of his leading propositions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '221'
- id: P1891.31.5
  kind: p
  original: Die von ihm in die Urgeschichte gebrachte Ordnung gilt in ihren Hauptzügen noch heute.
  en: The order he established in primeval history still holds good in its main outlines to this day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '221'
- id: P1891.31.6
  kind: p
  original: Ja, man kann sagen, sie findet mehr und mehr allgemeine Anerkennung in demselben Maß, worin seine Urheberschaft dieses großen Fortschritts verheimlicht wird.
  en: We may even say that this order receives recognition in the exact degree, in which the authorship of this great progress is concealed.
  modern: ''
  modern_status: empty
  notes: ''
