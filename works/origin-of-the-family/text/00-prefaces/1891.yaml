- id: P1891.10.3
  kind: p
  original: Sein nächster Nachfolger auf demselben Gebiet trat 1865 auf, ohne von Bachofen je gehört zu haben.
  en: The man next succeeding him in the same field made his appearance in 1865 without having ever heard of Bachofen.
