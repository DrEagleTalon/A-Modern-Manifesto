  kind: p
  original: '"Es ist eine sonderbare Tatsache, daß, soviel wir wissen, der Kindermord nirgendswo systematisch betrieben wird, wo die Exogamie und die älteste Verwandtschaftsform nebeneinander bestehn" (S. 146).'
