- id: P1891.11.1
  kind: p
  original: Dieser Nachfolger war J. F. McLennan, das grade Gegenteil seines Vorgängers.
  en: This successor was J. F. McLennan, the direct opposite of his predecessor.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: P1891.11.2
  kind: p
  original: Statt des genialen Mystikers haben wir hier den ausgetrockneten Juristen; statt der überwuchernden dichterischen Phantasie die plausiblen Kombinationen des plädierenden Advokaten.
  en: Instead of the talented mystic, we have here the dry jurist; in place of the rank growth of poetical imagination, we find the plausible combinations of the pleading lawyer.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: P1891.11.3
  kind: p
  original: McLennan findet bei vielen wilden, barbarischen und selbst zivilisierten Völkern alter und neuer Zeit eine Form der Eheschließung, bei der der Bräutigam, allein oder mit seinen Freunden, die Braut ihren Verwandten scheinbar gewaltsam rauben muß.
  en: McLennan finds among many savage, barbarian and even civilized people of ancient and modern times a type of marriage forcing the bride-groom, alone or in co-operation with his friends, to go through the form of a mock forcible abduction of the bride.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: P1891.11.4
  kind: p
  original: Diese Sitte muß das Überbleibsel sein einer früheren Sitte, worin die Männer eines Stammes sich ihre Frauen auswärts, von anderen Stämmen, wirklich mit Gewalt raubten.
  en: This must needs be a survival of an earlier custom when men of one tribe actually secured their wives by forcible abduction from another tribe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: P1891.11.5
  kind: p
  original: Wie entstand nun diese "Raubehe"?
  en: How did this "robber marriage" originate?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: P1891.11.6
  kind: p
  original: Solange die Männer hinreichend Frauen im eignen Stamm finden konnten, war durchaus kein Anlaß dazu vorhanden.
  en: As long as the men could find women enough in their own tribe, there was no occasion for robbing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: P1891.11.7
  kind: p
  original: Nun finden wir aber ebenso häufig, daß bei unentwickelten Völkern gewisse Gruppen existieren (die um 1865 noch häufig mit den Stämmen selbst identifiziert wurden), innerhalb deren die Heirat verboten war, so daß die Männer ihre Frauen und die Frauen ihre Männer außerhalb der Gruppe zu nehmen genötigt sind, während bei andern die Sitte besteht, daß die Männer einer gewissen Gruppe genötigt sind, ihre Frauen nur innerhalb ihrer eignen Gruppe zu nehmen.
  en: It so happens that we frequently find certain groups among undeveloped nations (which in 1865 were often considered identical with the tribes themselves), inside of which intermarrying was prohibited. In consequence the men (or women) of a certain group were forced to choose their wives (or husbands) outside of their group. Other tribes again observe the custom of forcing their men to choose their women inside of their own group only.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: P1891.11.8
  kind: p
  original: McLennan nennt die ersteren exogam, die zweiten endogam, und konstruiert nun ohne weiteres einen starren Gegensatz zwischen exogamen und endogamen "Stämmen".
  en: McLennan calls the first exogamous, the second endogamous, and construes forthwith a rigid contrast between exogamous and endogamous "tribes."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: P1891.11.9
  kind: p
  original: Und obwohl seine eigne Untersuchung der Exogamie ihn mit der Nase darauf stößt, daß dieser Gegensatz in vielen, wo nicht den meisten oder gar allen Fällen nur in seiner Vorstellung besteht, so macht er ihn doch zur Grundlage seiner gesamten Theorie.
  en: And though his own investigation of exogamy makes it painfully obvious that this contrast in many, if not in most or even in all cases, exists in his own imagination only, he nevertheless makes it the basis of his entire theory.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: P1891.11.10
  kind: p
  original: Exogame Stämme können hiernach ihre Frauen nur von andern Stämmen beziehn; und bei dem der Wildheit entsprechenden permanenten Kriegszustand zwischen Stamm und Stamm habe dies nur geschehn können durch Raub.
  en: According to the latter, exogamous tribes can choose their women only from other tribes. And as in conformity with their savage state a condition of continual warfare existed among such tribes, women could only be secured by abduction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.12.1
  kind: p
  original: 'McLennan fragt nun weiter: Woher diese Sitte der Exogamie?'
  en: 'McLennan further asks: Whence this custom of exogamy?'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: P1891.12.2
  kind: p
  original: Die Vorstellung der Blutsverwandtschaft und Blutschande könne nichts damit zu tun haben, das seien Dinge, die sich erst viel später entwickelt.
  en: The idea of consanguinity and rape could not have anything to do with it, since these conceptions were developed much later.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: P1891.12.3
  kind: p
  original: Wohl aber die unter Wilden vielverbreitete Sitte, weibliche Kinder gleich nach der Geburt zu töten.
  en: But it was a widely spread custom among savages to kill female children immediately after their birth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '215'
- id: P1891.12.4
  kind: p
  original: 'Dadurch entstehe ein Überschuß von Männern in jedem einzelnen Stamm, dessen notwendige nächste Folge sei, daß mehrere Männer eine Frau in Gemeinschaft besäßen: Vielmännerei.'
  en: This produced a surplus of males in such a tribe which naturally resulted in the condition where several men had one woman--polyandry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 215-216
- id: P1891.12.5
  kind: p
  original: 'Die Folge hiervon sei wieder, daß man wußte, wer die Mutter eines Kindes war, nicht aber, wer der Vater, daher: Verwandtschaft gerechnet nur in der weiblichen Linie mit Ausschluß der männlichen - Mutterrecht.'
  en: 'The next consequence was that the mother of a child could be ascertained, but not its father; hence: descent only traced by the female line and exclusion of male lineage--maternal law.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: P1891.12.6
  kind: p
  original: Und eine zweite Folge des Mangels an Frauen innerhalb des Stammes - ein Mangel, gemildert, aber nicht beseitigt durch die Vielmännerei - war eben die systematische, gewaltsame Entführung von Frauen fremder Stämme.
  en: And a second consequence of the scarcity of women in a certain tribe--a scarcity that was somewhat mitigated, but not relieved by polyandry--was precisely the forcible abduction of women from other tribes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: P1891.13.1
  kind: p
  original: '"Da Exogamie und Vielmännerei aus einer und derselben Ursache entspringen - dem Mangel der Gleichzahl zwischen beiden Geschlechtern -, müssen wir alle exogamen Racen als ursprünglich der Vielmännerei ergeben ansehn...'
  en: '"As exogamy and polyandry are referable to one and the same cause--a want of balance between the sexes--we are forced to regard all the exogamous races as having originally been polyandrous....'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: P1891.13.2
  kind: p
  original: Und deshalb müssen wir es für unbestreitbar ansehn, daß unter exogamen Racen das erste Verwandtschaftssystem dasjenige war, welches Blutbande nur auf der Mutterseite kennt."
  en: Therefore we must hold it to be beyond dispute that among exogamous races the first system of kinship was that which recognized blood-ties through mothers only."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
  en_note: 'Untermann''s footnote [2]: McLennan, Studies in Ancient History, 1886. Primitive Marriage, p. 124.'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
