- id: P1891.4.1
  kind: p
  original: Bis zum Anfang der sechziger Jahre kann von einer Geschichte der Familie nicht die Rede sein.
  en: Up to the beginning of the sixties, a history of the family cannot be spoken of.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '212'
- id: P1891.4.2
  kind: p
  original: Die historische Wissenschaft stand auf diesem Gebiet noch ganz unter dem Einflusse der fünf Bücher Mosis.
  en: This branch of historical science was then entirely under the influence of the decalogue.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '212'
- id: P1891.4.3
  kind: p
  original: Die darin ausführlicher als anderswo geschilderte patriarchalische Familienform wurde nicht nur ohne weiteres als die älteste angenommen, sondern auch - nach Abzug der Vielweiberei - mit der heutigen bürgerlichen Familie identifiziert, so daß eigentlich die Familie überhaupt keine geschichtliche Entwicklung durchgemacht hatte; höchstens gab man zu, daß in der Urzeit eine Periode geschlechtlicher Regellosigkeit bestanden haben könne.
  en: The patriarchal form of the family, described more exhaustively by Moses than by anybody else, was not only, without further comment, considered as the most ancient, but also as identical with the family of our times. No historical development of the family was even recognized. At best it was admitted that a period of sexual license might have existed in primeval times.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '212'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: P1891.4.4
  kind: p
  original: '- Allerdings kannte man außer der Einzelehe auch die orientalische Vielweiberei und die indisch-tibetanische Vielmännerei; aber diese drei Formen ließen sich nicht in eine historische Reihenfolge ordnen und figurierten zusammenhangslos nebeneinander.'
  en: To be sure, aside from monogamy, oriental polygamy and Indo-Tibethan polyandry were known; but these three forms could not be arranged in any historical order and stood side by side without any connection.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '212'
- id: P1891.4.5
  kind: p
  original: Daß bei einzelnen Völkern der alten Geschichte sowie bei einigen noch existierenden Wilden die Abstammung nicht vom Vater, sondern von der Mutter gerechnet, also die weibliche Linie als die allein gültige angesehn wurde; daß bei vielen heutigen Völkern die Ehe innerhalb bestimmter größerer, damals nicht näher untersuchter Gruppen verboten ist, und daß diese Sitte sich in allen Weltteilen findet - diese Tatsachen waren zwar bekannt, und es wurden immer mehr Beispiele davon gesammelt.
  en: That some nations of ancient history and some savage tribes of the present day did not trace their descent to the father, but to the mother, hence considered the female lineage as alone valid; that many nations of our time prohibit intermarrying inside of certain large groups, the extent of which was not yet ascertained and that this custom is found in all parts of the globe--these facts were known, indeed, and more examples were continually collected.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '212'
- id: P1891.4.6
  kind: p
  original: Aber man wußte nichts damit anzufangen, und selbst noch in E. B. Tylors "Researches into the Early History of Mankind etc. etc." (1865) figurieren sie als bloße "sonderbare Gebräuche" neben dem bei einigen Wilden geltenden Verbot, brennendes Holz mit einem Eisenwerkzeug zu berühren, und ähnlichen religiösen Schnurrpfeifereien.
  en: But nobody knew how to make use of them. Even in E. B. Taylor's "Researches into the Early History of Mankind," etc. (1865), they are only mentioned as "queer customs" together with the usage of some savage tribes to prohibit the touching of burning wood with iron, tools, and similar religious absurdities.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '212'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.5.1
  kind: p
  original: Die Geschichte der Familie datiert von 1861, vom Erscheinen von Bachofens "Mutterrecht".
  en: 'This history of the family dates from 1861, the year of the publication of Bachofen''s "Mutterrecht" (maternal law). Here the author makes the following propositions:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '212'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.5.2
  kind: p
  original: 'Hier stellt der Verfasser die folgenden Behauptungen auf: 1. daß die Menschen im Anfang in schrankenlosem Geschlechtsverkehr gelebt, den er, mit einem schiefen Ausdruck, als Hetärismus bezeichnet; 2. daß ein solcher Verkehr jede sichere Vaterschaft ausschließt, daß daher die Abstammung nur in der weiblichen Linie - nach Mutterrecht - gerechnet werden konnte, und daß dies ursprünglich bei allen Völkern des Altertums der Fall war; 3. daß in Folge hiervon den Frauen, als den Müttern, den einzigen sicher bekannten Eltern der jüngern Generation, ein hoher Grad von Achtung und Ansehn gezollt wurde, der sich nach Bachofens Vorstellung zu einer vollständigen Weiberherrschaft (Gynaikokratie) steigerte; 4. daß der Übergang zur Einzelehe, wo die Frau einem Mann ausschließlich gehörte, eine Verletzung eines uralten Religionsgebots in sich schloß (d.h. tatsächlich eine Verletzung des altherkömmlichen Anrechts der übrigen Männer auf dieselbe Frau), eine Verletzung, die gebüßt oder deren Duldung erkauft werden mußte durch eine zeitlich beschränkte Preisgebung der Frau.'
  en: 1. That in the beginning people lived in unrestricted sexual intercourse, which he dubs, not very felicitously, hetaerism. 2. That such an intercourse excludes any absolutely certain means of determining parentage; that consequently descent could only be traced by the female line in compliance with maternal law--and that this was universally practiced by all the nations of antiquity. 3. That consequently women as mothers, being the only well known parents of younger generations, received a high tribute of respect and deference, amounting to a complete women's rule (gynaicocracy), according to Bachofen's idea. 4. That the transition to monogamy, reserving a certain woman exclusively to one man, implied the violation of a primeval religious law (i. e., practically a violation of the customary right of all other men to the same woman), which violation had to be atoned for or its permission purchased by the surrender of the women to the public for a limited time.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 212-213
  align: '1:4'
  review: true
  review_reason: 1 de sentence(s) matched to 4 en sentence(s)
- id: P1891.6.1
  kind: p
  original: Die Beweise für diese Sätze findet Bachofen in zahllosen, mit äußerstem Fleiß zusammengesuchten Stellen der altklassischen Literatur.
  en: Bachofen finds the proofs of these propositions in numerous quotations from ancient classics, collected with unusual diligence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: P1891.6.2
  kind: p
  original: Die Entwicklung vom "Hetärismus" zur Monogamie und vom Mutterrecht zum Vaterrecht vollzieht sich nach ihm, namentlich bei den Griechen, in Folge einer Fortentwicklung der religiösen Vorstellungen, einer Einschiebung neuer Gottheiten, Repräsentanten der neuen Anschauungsweise, in die altüberlieferte Göttergruppe, die Vertreterin der alten Anschauung, so daß die letztere mehr und mehr von der ersteren in den Hintergrund gedrängt wird.
  en: The transition from "hetaerism" to monogamy and from maternal to paternal law is accomplished according to him--especially by the Greeks--through the evolution of religious ideas. New gods, the representatives of the new ideas, are added to the traditional group of gods, the representatives of old ideas; the latter are forced to the background more and more by the former.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.6.3
  kind: p
  original: Es ist also nicht die Entwicklung der tatsächlichen Lebensbedingungen der Menschen, sondern der religiöse Widerschein dieser Lebensbedingungen in den Köpfen derselben Menschen, der nach Bachofen die geschichtlichen Veränderungen in der gegenseitigen gesellschaftlichen Stellung von Mann und Weib bewirkt hat.
  en: According to Bachofen, therefore, it is not the development of the actual conditions of life that has effected the historical changes in the relative social positions of man and wife, but the religious reflection of these conditions in the minds of men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: P1891.6.4
  kind: p
  original: Hiernach stellt Bachofen die "Oresteia" des Äschylos dar als die dramatische Schilderung des Kampfes zwischen dem untergehenden Mutterrecht und dem in der Heroenzeit aufkommenden und siegenden Vaterrecht.
  en: Hence Bachofen represents the Oresteia of Aeschylos as the dramatic description of the fight between the vanishing maternal and the paternal law, rising and victorious during the time of the heroes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: P1891.6.5
  kind: p
  original: Klytämnestra hat, um ihres Buhlen Ägisthos willen, ihren vom Trojanerkrieg heimkehrenden Gatten Agamemnon erschlagen; aber ihr und Agamemnons Sohn Orestes rächt den Mord des Vaters, indem er seine Mutter erschlägt.
  en: Klytaemnestra has killed her husband Agamemnon on his return from the Trojan war for the sake of her lover Aegisthos; but Orestes, her son by Agamemnon, avenges the death of his father by killing his mother.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: P1891.6.6
  kind: p
  original: Dafür verfolgen ihn die Erinnyen, die dämonischen Schützerinnen des Mutterrechts, wonach der Muttermord das schwerste, unsühnbarste Verbrechen.
  en: Therefore he is persecuted by the Erinyes, the demonic protectors of maternal law, according to which the murder of a mother is the most horrible, inexpiable crime.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: P1891.6.7
  kind: p
  original: Aber Apollo, der den Orestes durch sein Orakel zu dieser Tat aufgefordert, und Athene, die als Richterin aufgerufen wird - die beiden Götter, die hier die neue, vaterrechtliche Ordnung vertreten -, schützen ihn; Athene hört beide Parteien an.
  en: But Apollo, who has instigated Orestes to this act by his oracle, and Athene, who is invoked as arbitrator--the two deities representing the new paternal order of things--protect him. Athene gives a hearing to both parties.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.6.8
  kind: p
  original: Die ganze Streitfrage faßt sich kurz zusammen in der nun stattfindenden Debatte zwischen Orestes und den Erinnyen.
  en: The whole question is summarized in the ensuing debate between Orestes and the Erinyes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: P1891.6.9
  kind: p
  original: 'Orest beruft sich darauf, daß Klytämnestra einen doppelten Frevel begangen: indem sie ihren Gatten, und damit auch seinen Vater getötet.'
  en: 'Orestes claims that Klytemnaestra has committed a twofold crime: by killing her husband she has killed his father.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: P1891.6.10
  kind: p
  original: Warum denn verfolgten die Erinnyen ihn, und nicht sie, die weit Schuldigere?
  en: Why do the Erinyes persecute him and not her who is far more guilty?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: P1891.6.11
  kind: p
  original: 'Die Antwort ist schlagend:'
  en: 'The reply is striking:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '213'
- id: P1891.7.1
  kind: p
  original: '"Sie war dem Mann, den sie erschlug, nicht blutsverwandt."'
  en: '"She was not related by blood to the man whom she slew."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
- id: P1891.8.1
  kind: p
  original: Der Mord eines nicht blutsverwandten Mannes, selbst wenn er der Gatte der Mörderin, ist sühnbar, geht die Erinnyen nichts an; ihres Amtes ist nur die Verfolgung des Mords unter Blutsverwandten, und da ist, nach Mutterrecht, der schwerste und unsühnbarste der Muttermord.
  en: The murder of a man not consanguineous, even though he be the husband of the murderess, is expiable, does not concern the Erinyes; it is only their duty to prosecute the murder of consanguineous relatives. According to maternal law, therefore, the murder of a mother is the most heinous and inexpiable crime.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.8.2
  kind: p
  original: Nun tritt Apollo für Orestes als Verteidiger auf; Athene läßt die Areopagiten - die athenischen Gerichtsschöffen - abstimmen; die Stimmen sind gleich für Freisprechung und Verurteilung; da gibt Athene als Vorsitzerin ihre Stimme für Orestes ab und spricht ihn frei.
  en: Now Apollo speaks in defense of Orestes. Athene then calls on the areopagites--the jurors of Athens--to vote; the votes are even for acquittal and for condemnation. Thereupon Athene as president of the jury casts her vote in favor of Orestes and acquits him.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: P1891.8.3
  kind: p
  original: Das Vaterrecht hat den Sieg errungen über das Mutterrecht, die "Götter jungen Stamms", wie sie von den Erinnyen selbst bezeichnet werden, siegen über die Erinnyen, und diese lassen sich schließlich auch bereden, im Dienst der neuen Ordnung ein neues Amt zu übernehmen.
  en: Paternal law has gained a victory over maternal law, the deities of the "younger generation," as the Erinyes call them, vanquish the latter. These are finally persuaded to accept a new office under the new order of things.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.9.1
  kind: p
  original: Diese neue, aber entschieden richtige Deutung der "Oresteia" ist eine der schönsten und besten Stellen im ganzen Buch, aber sie beweist gleichzeitig, daß Bachofen mindestens ebensosehr an die Erinnyen, Apollo und Athene glaubt, wie seiner Zeit Äschylos; er glaubt eben, daß sie in der griechischen Heroenzeit das Wunder vollbrachten, das Mutterrecht zu stürzen durch das Vaterrecht.
  en: This new, but decidedly accurate interpretation of the Oresteia is one of the most beautiful and best passages in the whole book, but it proves at the same time that Bachofen himself believes as much in the Erinyes, in Apollo and in Athene, as Aeschylos did in his day. He really believes, that they performed the miracle of securing the downfall of maternal law through paternal law during the time of the Greek heroes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.9.2
  kind: p
  original: Daß eine solche Auffassung, wo die Religion als der entscheidende Hebel der Weltgeschichte gilt, schließlich auf reinen Mystizismus hinauslaufen muß, ist klar.
  en: That a similar conception, representing religion as the main lever of the world's history, must finally lead to sheer mysticism, is evident.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
- id: P1891.9.3
  kind: p
  original: Es ist daher eine saure und keineswegs immer lohnende Arbeit, sich durch den dicken Quartanten Bachofens durchzuarbeiten.
  en: Therefore it is a troublesome and not always profitable task to work your way through the big volume of Bachofen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
- id: P1891.9.4
  kind: p
  original: Aber alles das schmälert nicht sein bahnbrechendes Verdienst; er, zuerst, hat die Phrase von einem unbekannten Urzustand mit regellosem Geschlechtsverkehr ersetzt durch den Nachweis, daß die altklassische Literatur uns Spuren in Menge aufzeigt, wonach vor der Einzelehe in der Tat bei Griechen und Asiaten ein Zustand existiert hat, worin nicht nur ein Mann mit mehreren Frauen, sondern eine Frau mit mehreren Männern geschlechtlich verkehrte, ohne gegen die Sitte zu verstoßen; daß diese Sitte nicht verschwand, ohne Spuren zu hinterlassen in einer beschränkten Preisgebung, wodurch die Frauen das Recht auf Einzelehe erkaufen mußten; daß daher die Abstammung ursprünglich nur in weiblicher Linie, von Mutter zu Mutter gerechnet werden konnte; daß diese Alleingültigkeit der weiblichen Linie sich noch lange in die Zeit der Einzelehe mit gesicherter oder doch anerkannter Vaterschaft hinein erhalten hat; und daß diese ursprüngliche Stellung der Mütter, als der einzigen sichern Eltern ihrer Kinder, ihnen und damit den Frauen überhaupt, eine höhere gesellschaftliche Stellung sicherte, als sie seitdem je wieder besessen haben.
  en: Still, all this does not curtail the value of his fundamental work. He was the first to replace the assumption of an unknown primeval condition of licentious sexual intercourse by the demonstration that ancient classical literature points out a multitude of traces proving the actual existence among Greeks and Asiatics of other sexual relations before monogamy. These relations not only permitted a man to have intercourse with several women, but also left a woman free to have sexual intercourse with several men without violating good morals. This custom did not disappear without leaving as a survival the form of a general surrender for a limited time by which women had to purchase the right of monogamy. Hence descent could originally only be traced by the female line, from mother to mother. The sole legality of the female line was preserved far into the time of monogamy with assured, or at least acknowledged, paternity. Consequently, the original position of the mothers as the sole absolutely certain parents of their children secured for them and for all other women a higher social level than they have ever enjoyed since.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '214'
  align: '1:7'
