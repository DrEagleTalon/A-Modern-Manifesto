- id: P1891.18.1
  kind: p
  original: Beides Tatsachen, die seiner Erklärungsweise direkt ins Gesicht schlagen, und denen er nur neue, noch verwickeltere Hypothesen entgegenhalten kann.
  en: Both these facts directly disprove his method of explanation, and he can only meet them with new and still more complicated hypotheses.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
- id: P1891.19.1
  kind: p
  original: 'Trotzdem fand seine Theorie in England großen Beifall und Anklang: McLennan galt hier allgemein als Begründer der Geschichte der Familie und als erste Autorität auf diesem Gebiet.'
  en: In spite of this, his theory found great approval and favor in England. Here McLennan was generally considered as the founder of the history of the family and as the first authority on this subject.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.19.2
  kind: p
  original: Sein Gegensatz von exogamen und endogamen "Stämmen", so sehr man auch einzelne Ausnahmen und Modifikationen konstatierte, blieb doch die anerkannte Grundlage der herrschenden Anschauungsweise und wurde die Scheuklappe, die jeden freien Überblick über das untersuchte Gebiet und damit jeden entscheidenden Fortschritt unmöglich machte.
  en: His contrast of exogamous and endogamous "tribes" remained the recognized foundation of the customary views, however much single exceptions and modifications were admitted. This antithesis became the eye-flap that rendered impossible any free view of the field under investigation and, therefore, any decided progress.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.19.3
  kind: p
  original: Der in England und nach englischem Vorbild auch anderswo üblich gewordenen Überschätzung McLennans ist es Pflicht, die Tatsache entgegenzuhalten, daß er mit seinem rein mißverständlichen Gegensatz von exogamen und endogamen "Stämmen" mehr Schaden angerichtet, als er durch seine Forschungen genützt hat.
  en: It is our duty to confront this overrating of McLennan, practised in England and copied elsewhere, with the fact that he has done more harm with his ill-conceived contrast of exogamous and endogamous tribes than he has done good by his investigations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
- id: P1891.20.1
  kind: p
  original: Indes kamen schon bald mehr und mehr Tatsachen ans Licht, die in seinen zierlichen Rahmen nicht paßten.
  en: Moreover, in the course of time more and more facts became known that did not fit into his neat frame.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
- id: P1891.20.2
  kind: p
  original: 'McLennan kannte nur drei Formen der Ehe: Vielweiberei, Vielmännerei und Einzelehe.'
  en: 'McLennan knew only three forms of marriage: polygamy, polyandry and monogamy.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
- id: P1891.20.3
  kind: p
  original: Als aber einmal die Aufmerksamkeit auf diesen Punkt gelenkt, fanden sich mehr und mehr Beweise, daß bei unentwickelten Völkern Eheformen bestanden, worin eine Reihe von Männern eine Reihe von Frauen gemeinsam besaßen; und Lubbock ("The origin of Civilisation", 1870) erkannte diese Gruppenehe (Communal marriage) als geschichtliche Tatsache an.
  en: But once attention had been directed to this point, then more and more proofs were found that among undeveloped nations there were connubial forms in which a group of men possessed a group of women. Lubbock in his "Origin of Civilization" (1870) recognized this "communal marriage" as a historical fact.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.21.1
  kind: p
  original: Gleich darauf, 1871, trat Morgan mit neuem und in vieler Beziehung entscheidendem Material auf.
  en: Immediately after him, in 1871, Morgan appeared with fresh and, in many respects, conclusive material.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
- id: P1891.21.2
  kind: p
  original: Er hatte sich überzeugt, daß das bei den Irokesen geltende, eigentümliche Verwandtschaftssystem allen Ureinwohnern der Vereinigten Staaten gemeinsam, also über einen ganzen Kontinent verbreitet sei, obwohl es den Verwandtschaftsgraden, wie sie sich aus dem dort geltenden Ehesystem tatsächlich ergeben, direkt widerspricht.
  en: He had convinced himself that the peculiar system of kinship in vogue among the Iroquois was common to all the aborigines of the United States, and practised all over the continent, although it was in direct contradiction with all the degrees of relation arising from the connubial system in practice there.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 217-218
- id: P1891.21.3
  kind: p
  original: Er bewog nun die amerikanische Bundesregierung, auf Grund von ihm selbst aufgesetzter Fragebogen und Tabellen Auskunft über die Verwandtschaftssysteme der übrigen Völker einzuziehn, und fand aus den Antworten, 1. daß das amerikanisch-indianische Verwandtschaftssystem auch in Asien, und in etwas modifizierter Form in Afrika und Australien bei zahlreichen Volksstämmen in Geltung sei.
  en: 'He prevailed on the federal government to collect information on the systems of kinship of other nations by the help of question blanks and tables drawn up by himself. The answers brought the following results: 1. The kinship system of the American Indians is also in vogue in Asia, and in a somewhat modified form among numerous tribes of Africa and Australia.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: P1891.21.4
  kind: p
  original: 2. daß es sich vollständig erkläre aus einer in Hawaii und andern australischen Inseln eben im Absterben begriffenen Form der Gruppenehe, und 3. daß aber neben dieser Eheform auf denselben Inseln ein Verwandtschaftssystem in Geltung sei, das sich nur durch eine noch urwüchsigere, jetzt ausgestorbne Form der Gruppenehe erklären lasse.
  en: 2. This system finds a complete explanation in a certain form of communal marriage now in process of decline in Hawaii and some Australian islands. 3. By the side of this marital form, there is in practice on the same islands a system of kinship only explicable by a still more primeval and now extinct form of communal marriage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.21.5
  kind: p
  original: Die gesammelten Nachrichten nebst seinen Schlußfolgerungen daraus veröffentlichte er in seinen "Systems of Consanguinity and Affinity", 1871, und führte damit die Debatte auf ein unendlich umfassenderes Gebiet.
  en: The collected data and the conclusions of Morgan were published in his "Systems of Consanguinity and Affinity," 1871, and discussion transferred to a far more extensive field.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
- id: P1891.21.6
  kind: p
  original: Indem er, von den Verwandtschaftssystemen ausgehend, die ihnen entsprechenden Familienformen wiederkonstruierte, eröffnete er einen neuen Forschungsweg und einen weiterreichenden Rückblick in die Vorgeschichte der Menschheit.
  en: Taking his departure from the system of affinity he reconstructed the corresponding forms of the family, thereby opening a new road to scientific investigation and extending the retrospective view into prehistoric periods of human life.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
- id: P1891.21.7
  kind: p
  original: Erhielt diese Methode Geltung, so war die niedliche Konstruktion McLennans in Dunst aufgelöst.
  en: Once this view gained recognition, then the frail structure of McLennan, would vanish into thin air.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
- id: P1891.22.1
  kind: p
  original: McLennan verteidigte seine Theorie in der Neuauflage von "Primitive Marriage" ("Studies in Ancient History", 1875).
  en: McLennan defended his theory in the new edition of "Primitive Marriage" (Studies in Ancient History, 1875).
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
- id: P1891.22.2
  kind: p
  original: Während er selbst eine Geschichte der Familie aus lauter Hypothesen äußerst künstlich kombiniert, verlangt er von Lubbock und Morgan nicht nur Beweise für jede ihrer Behauptungen, sondern Beweise von der unanfechtbaren Bündigkeit, wie allein sie in einem schottischen Gerichtshof zugelassen werden.
  en: While he himself most artificially combines into a history of the family a number of hypotheses, he not only demands proofs from Lubbock and Morgan for every one of their propositions, but insists on proofs of such indisputable validity as is solely recognized in a Scotch court.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
- id: P1891.22.3
  kind: p
  original: Und das tut derselbe Mann, der aus dem engen Verhältnis zwischen Mutterbruder und Schwestersohn bei den Deutschen (Tacitus, "Germania", c. 20), aus Cäsars Bericht, daß die Briten je zehn oder zwölf ihre Frauen gemeinsam haben, und aus allen anderen Berichten der alten Schriftsteller über Weibergemeinschaft bei Barbaren ohne Zaudern den Schluß zieht, bei allen diesen Völkern habe Vielmännerei geherrscht!
  en: 'And this is done by the same man who unhesitatingly concludes that the following people practiced polyandry: The Germans, on account of the intimate relation between uncle and nephew (mother''s brother and sister''s son); the Britons, because Cesar reports that the Britons have ten to twelve women in common; barbarians, because all other reports of the old writers on community of women are misinterpreted by him!'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
- id: P1891.22.4
  kind: p
  original: Man meint einen Staatsanwalt zu hören, der sich bei Zurechtmachung seines Falls jede Freiheit erlauben kann, der aber vom Verteidiger für jedes Wort den formellsten juristisch gültigen Beweis beansprucht.
  en: One is reminded of a prosecuting attorney who takes all possible liberty in making up his case, but who demands the most formal and legally valid proof for every word of the lawyer for the defense.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
- id: P1891.23.1
  kind: p
  original: Die Gruppenehe sei eine pure Einbildung, behauptet er und fällt damit weit hinter Bachofen zurück.
  en: He asserts that communal marriage is purely the outgrowth of imagination, and in so doing falls far behind Bachofen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '218'
- id: P1891.23.2
  kind: p
  original: Die Verwandtschaftssysteme bei Morgan seien bloße Vorschriften gesellschaftlicher Höflichkeit, bewiesen durch die Tatsache, daß die Indianer auch einen Fremden, Weißen, als Bruder oder Vater anreden.
  en: He represents Morgan's systems of affinity as mere codes of conventional politeness, proven by the fact that Indians address also strangers, white people, as brother or father.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 218-219
- id: P1891.23.3
  kind: p
  original: Es ist, als wollte man behaupten, die Bezeichnungen Vater, Mutter, Bruder, Schwester seien bloße sinnlose Anredeformen, weil katholische Geistliche und Äbtissinnen ebenfalls mit Vater und Mutter, Mönche und Nonnen, ja selbst Freimaurer und englische Fachvereinsgenossen in solenner Sitzung als Bruder und Schwester angeredet werden.
  en: This is like asserting that the terms father, mother, brother, sister are simply meaningless forms of address, because Catholic priests and abbesses are also addressed as father and mother, and monks and nuns, or even free-masons and members of English professional clubs in solemn session, as brother and sister.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: P1891.23.4
  kind: p
  original: Kurz, McLennans Verteidigung war elend schwach.
  en: In short, McLennan's defense was extremely weak.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: P1891.24.1
  kind: p
  original: Noch aber blieb ein Punkt, wo er nicht gefaßt worden war.
  en: One point still remained that had not been attacked.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: P1891.24.2
  kind: p
  original: Der Gegensatz von exogamen und endogamen "Stämmen", auf dem sein ganzes System beruhte, war nicht nur unerschüttert, er wurde sogar allgemein als Angelpunkt der gesamten Geschichte der Familie anerkannt.
  en: The contrast of exogamous and endogamous tribes, on which his whole system was founded, was not only left unchallenged, but was even generally regarded as the pivotal point of the entire history of the family.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: P1891.24.3
  kind: p
  original: Man gab zu, McLennans Versuch, diesen Gegensatz zu erklären, sei ungenügend und widerspreche den von ihm selbst aufgezählten Tatsachen.
  en: It was admitted that McLennan's attempt to explain this contrast was insufficient and in contradiction with the facts enumerated by himself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: P1891.24.4
  kind: p
  original: Aber der Gegensatz selbst, die Existenz zweier einander ausschließender Arten von selbständigen und unabhängigen Stämmen, wovon die eine Art ihre Weiber innerhalb des Stamms nahm, während dies der andern Art absolut verboten war - dies galt als unbestreitbares Evangelium.
  en: But the contrast itself, the existence of two diametrically opposed forms of independent and absolute groups, one of them marrying the women of its own group, the other strictly forbidding this habit, was considered irrefutable gospel.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: P1891.24.5
  kind: p
  original: Man vergleiche z.B. Giraud-Teulons "Origines de la famille" (1874) und selbst noch Lubbocks "Origin of Civilisation" (4. Auflage, 1882).
  en: Compare e. g. Giraud-Teulon's "Origines de la famille" (1874) and even Lubbock's "Origin of Civilization" (4th edition, 1882).
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: P1891.25.1
  kind: p
  original: 'An diesem Punkt setzt Morgans Hauptwerk an: "Ancient Society" (1877), das Werk, das der gegenwärtigen Arbeit zugrunde liegt.'
  en: At this point Morgan's main work, "Ancient Society" (1877), inserts its lever. It is this work on which the present volume is based.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.25.2
  kind: p
  original: Was Morgan 1871 nur noch dunkel ahnte, das ist hier mit vollem Bewußtsein entwickelt.
  en: Here we find clearly demonstrated what was only dimly perceived by Morgan in 1871.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: P1891.25.3
  kind: p
  original: Endogamie und Exogamie bilden keinen Gegensatz; exogame "Stämme" sind bis jetzt nirgends nachgewiesen.
  en: There is no antithesis between endogamy and exogamy; no exogamous "tribes" have been found up to the present time.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: P1891.25.4
  kind: p
  original: Aber zur Zeit, wo die Gruppenehe noch herrschte - und sie hat aller Wahrscheinlichkeit nach überall einmal geherrscht -, gliederte sich der Stamm in eine Anzahl von auf Mutterseite blutsverwandten Gruppen, Gentes, innerhalb deren strenges Eheverbot herrschte, so daß die Männer einer Gens ihre Frauen zwar innerhalb des Stammes nehmen konnten und in der Regel nahmen, aber sie außerhalb ihrer Gens nehmen mußten.
  en: But at the time when communal marriage still existed--and in all probability it once existed everywhere--a tribe was subdivided into a number of groups--"gentes"--consanguineous on the mother's side, within which intermarrying was strictly forbidden. The men of a certain "gens," therefore, could choose their wives within the tribe, and did so as a rule, but had to choose them outside of the "gens."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.25.5
  kind: p
  original: So daß, wenn die Gens streng exogam,. der die Gesamtheit der Gentes umfassende Stamm ebensosehr endogam war.
  en: And while thus the "gens" was strictly exogamous, the tribe comprising an aggregate of "gentes" was equally endogamous.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: P1891.25.6
  kind: p
  original: Damit war der letzte Rest der McLennanschen Künstelei endgültig abgetan.
  en: This fact gave the final blow to McLennan's artificial structure.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: P1891.26.1
  kind: p
  original: Hiermit aber begnügte sich Morgan nicht.
  en: But Morgan did not rest here.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: P1891.26.2
  kind: p
  original: Die Gens der amerikanischen Indianer diente ihm ferner dazu, den zweiten entscheidenden Fortschritt auf dem von ihm untersuchten Gebiet zu machen.
  en: The "gens" of the American Indians furthermore assisted him in gaining another important step in the field under investigation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: P1891.26.3
  kind: p
  original: In dieser nach Mutterrecht organisierten Gens entdeckte er die Urform, woraus sich die spätere, vaterrechtlich organisierte Gens entwickelt hatte, die Gens, wie wir sie bei den antiken Kulturvölkern finden.
  en: He found that this "gens," organized in conformity with maternal law, was the original form out of which later on the "gens" by paternal law developed, such as we find it among the civilized nations of antiquity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '219'
- id: P1891.26.4
  kind: p
  original: Die griechische und römische Gens, allen bisherigen Geschichtsschreibern ein Rätsel, war erklärt aus der indianischen und damit eine neue Grundlage gefunden für die ganze Urgeschichte.
  en: The Greek and Roman "gens," an unsolved riddle to all historians up to our time, found its explanation in the Indian "gens." A new foundation was discovered for the entire primeval history.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 219-220
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.27.1
  kind: p
  original: Diese Wiederentdeckung der ursprünglichen mutterrechtlichen Gens als der Vorstufe der vaterrechtlichen Gens der Kulturvölker hat für die Urgeschichte dieselbe Bedeutung wie Darwins Entwicklungstheorie für die Biologie und Marx' Mehrwertstheorie für die politische Ökonomie.
  en: The repeated discovery that the original maternal "gens" was a preliminary stage of the paternal "gens" of civilized nations has the same signification for primeval history that Darwin's theory of evolution had for biology and Marx's theory of surplus value for political economy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: P1891.27.2
  kind: p
  original: Sie befähigte Morgan, zum erstenmal eine Geschichte der Familie zu entwerfen, worin wenigstens die klassischen Entwicklungsstufen im ganzen und großen, soweit das heute bekannte Material erlaubt, vorläufig festgestellt sind.
  en: Morgan was thereby enabled to sketch the outline of a history of the family, showing in bold strokes at least the classic stages of development, so far as the available material will at present permit such a thing.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: P1891.27.3
  kind: p
  original: Daß hiermit eine neue Epoche der Behandlung der Urgeschichte beginnt, ist vor aller Augen klar.
  en: It is clearly obvious that this marks a new epoch in the treatment of primeval history.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: P1891.27.4
  kind: p
  original: Die mutterrechtliche Gens ist der Angelpunkt geworden, um den sich diese ganze Wissenschaft dreht; seit ihrer Entdeckung weiß man, in welcher Richtung und wonach man zu forschen und wie man das Erforschte zu gruppieren hat.
  en: The maternal "gens" has become the pivot on which this whole science revolves. Since its discovery we know in what direction to continue our researches, what to investigate and how to arrange the results of our studies.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.27.5
  kind: p
  original: Und dementsprechend werden jetzt auf diesem Gebiet ganz anders rasche Fortschritte gemacht als vor Morgans Buch.
  en: In consequence, progress in this field is now much more rapid than before the publication of Morgan's book.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: P1891.28.1
  kind: p
  original: Die Entdeckungen Morgans sind jetzt allgemein anerkannt, oder vielmehr angeeignet von den Prähistorikern auch in England.
  en: The discoveries of Morgan are now universally recognized, or rather appropriated, even by the archaeologists of England.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: P1891.28.2
  kind: p
  original: Aber fast bei keinem findet sich das offene Zugeständnis, daß es Morgan ist, dem wir diese Revolution der Anschauungen verdanken.
  en: But hardly one of them openly admits that we owe this revolution of thought to Morgan.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: P1891.28.3
  kind: p
  original: In England ist sein Buch soweit wie möglich totgeschwiegen, er selbst mit herablassendem Lob wegen seiner früheren Leistungen abgefertigt worden; an den Einzelheiten seiner Darstellung klaubt man eifrig herum, von seinen wirklich großen Entdeckungen schweigt man hartnäckig.
  en: His book is ignored in England as much as possible, and he himself is dismissed with condescending praise for the excellence of his former works. The details of his discussion are diligently criticised, but his really great discoveries are covered up obstinately.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.28.4
  kind: p
  original: '"Ancient Society" ist in der Originalausgabe vergriffen; in Amerika ist für so etwas kein lohnender Absatz; in England wurde das Buch, scheint es, systematisch unterdrückt, und die einzige Ausgabe dieses epochemachenden Werks, die noch im Buchhandel zirkuliert, ist - die deutsche Übersetzung.'
  en: The original edition of "Ancient Society" is out of print; there is no paying market for a work of this kind in America; in England, it appears, the book was systematically suppressed, and the only edition of this epochal work still circulating in the market is--the German translation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: P1891.29.1
  kind: p
  original: Woher diese Zurückhaltung, in der es schwer ist, nicht eine Totschweigungs-Verschwörung zu sehen, besonders gegenüber den zahlreichen bloßen Höflichkeitszitaten und andern Beweisen von Kameraderie, wovon die Schriften unsrer anerkannten Prähistoriker wimmeln?
  en: Whence this reserve? We can hardly refrain from calling it a conspiracy to kill by silence, especially in view of the numerous meaningless and polite quotations and of other manifestations of fellowship in which the writings of our recognized archaeologists abound.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.29.2
  kind: p
  original: Etwa weil Morgan ein Amerikaner ist und es sehr hart ist für die englischen Prähistoriker, daß sie, trotz alles höchst anerkennenswerten Fleißes im Zusammentragen von Material, für die bei der Ordnung und Gruppierung dieses Materials geltenden allgemeinen Gesichtspunkte, kurz für ihre Ideen, angewiesen sind auf zwei geniale Ausländer, auf Bachofen und Morgan?
  en: Is it because Morgan is an American, and because it is rather hard on the English archaeologists to be dependent on two talented foreigners like Bachofen and Morgan for the outlines determining the arrangement and grouping of their material, in spite of all praiseworthy diligence in accumulating material.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: P1891.29.3
  kind: p
  original: Den Deutschen konnte man sich noch gefallen lassen, aber den Amerikaner?
  en: They could have borne with the German, but an American?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '220'
- id: P1891.29.4
  kind: p
  original: Gegenüber dem Amerikaner wird jeder Engländer patriotisch, wovon ich in den Vereinigten Staaten ergötzliche Beispiele gesehn.
  en: In face of an American, every Englishman becomes patriotic. I have seen amusing illustrations of this fact in the United States.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 220-221
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.29.5
  kind: p
  original: Nun kommt aber noch dazu, daß McLennan der sozusagen amtlich ernannte Stifter und Führer der englischen prähistorischen Schule war; daß es gewissermaßen zum prähistorischen guten Ton gehörte, nur mit der höchsten Ehrfurcht von seiner verkünstelten, vom Kindermord durch Vielmännerei und Raubehe zur mutterrechtlichen Familie führenden Geschichtskonstruktion zu reden; daß der geringste Zweifel an der Existenz von einander absolut ausschließenden exogamen und endogamen "Stämmen" für frevelhafte Ketzerei galt; daß also Morgan, indem er alle diese geheiligten Dogmen in Dunst auflöste, eine Art von Sakrileg beging.
  en: Moreover, it must be remembered that McLennan was, so to say, the official founder and leader of the English prehistoric school. It was almost a requirement of good prehistoric manners to refer in terms of highest admiration to his artificial construction of history leading from infanticide through polyandry and abduction to maternal law. The least doubt in the strictly independent existence of exogamous and endogamous tribes was considered a frivolous sacrilege. According to this view, Morgan, in reducing all these sacred dogmas to thin air, committed an act of wanton destruction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '221'
  align: '1:4'
  review: true
  review_reason: 1 de sentence(s) matched to 4 en sentence(s)
- id: P1891.29.6
  kind: p
  original: 'Und obendrein löste er sie auf in einer Weise, die nur ausgesprochen zu werden brauchte, um sofort einzuleuchten, so daß die bisher zwischen Exogamie und Endogamie ratlos umhertaumelnden " McLennan-Verehrer sich fast mit der Faust vor den Kopf schlagen und ausrufen mußten: Wie konnten wir so dumm sein und das nicht schon lange selbst finden!'
  en: 'And worse still, his mere manner of reducing them sufficed to show their instability, so that the admirers of McLennan, who hitherto had been stumbling about helplessly between exogamy and endogamy, were almost forced to slap their foreheads and exclaim: "How silly of us, not to have found that out long ago!"'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '221'
- id: P1891.30.1
  kind: p
  original: Und wenn das noch nicht der Verbrechen genug waren, um der offiziellen Schule jede andere Behandlung außer kühler Beiseiteschiebung zu verbieten, so machte Morgan das Maß übervoll, indem er nicht nur die Zivilisation, die Gesellschaft der Warenproduktion, die Grundform unserer heutigen Gesellschaft, in einer Weise kritisierte, die an Fourier erinnert, sondern von einer künftigen Umgestaltung dieser Gesellschaft in Worten spricht, die Karl Marx gesagt haben könnte.
  en: Just as if Morgan had not committed crimes enough against the official archaeologists to justify them in discarding all fair methods and assuming an attitude of cool neglect, he persisted in filling their cup to overflowing. Not only does he criticise civilization, the society of production for profit, the fundamental form of human society, in a manner savoring of Fourier, but he also speaks of a future reorganization of society in language that Karl Marx might have used.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '221'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.30.2
  kind: p
  original: Es war also wohlverdient, wenn McLennan ihm entrüstet vorwirft, "die historische Methode sei ihm durchaus antipathisch", und wenn Herr Professor Giraud-Teulon in Genf ihm dies noch 1884 bestätigt.
  en: Consequently, he receives his just deserts, when McLennan indignantly charges him with a profound antipathy against historical methods, and when Professor Giraud-Teulon of Geneva endorses the same view in 1884.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '221'
- id: P1891.30.3
  kind: p
  original: Wankte doch derselbe Herr Giraud-Teulon noch 1874 ("Origines de la famille") hülflos im Irrgarten der McLennanschen Exogamie herum, aus dem ihn Morgan erst befreien mußte!
  en: For was not the same Professor Giraud-Teulon still wandering about aimlessly in the maze of McLennan's exogamy in 1874 (Origines de la famille)? And was it not Morgan who finally had to set him free?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '221'
  align: '1:2'
  review: true
