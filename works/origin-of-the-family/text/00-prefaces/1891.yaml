  original: Sein Bruder sei Oberst und in Washington im Kriegsministerium angestellt gewesen; durch Vermittlung dieses Bruders habe er es fertiggebracht, die Regierung für seine Forschungen zu interessieren und mehrere seiner Werke auf öffentliche Kosten herauszugeben; er, der Erzähler, habe sich auch während seiner Kongreßzeit mehrfach dafür verwandt.
