- id: P1891.14.1
  kind: p
  original: Es ist das Verdienst McLennans, auf die allgemeine Verbreitung und große Bedeutung dessen, was er Exogamie nennt, hingewiesen zu haben.
  en: It is the merit of McLennan to have pointed out the general extent and the great importance of what he calls exogamy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: P1891.14.2
  kind: p
  original: Entdeckt hat er die Tatsache der exogamen Gruppen keineswegs, und verstanden hat er sie erst recht nicht.
  en: However, he has by no means discovered the fact of exogamous groups; neither did he understand their presence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: P1891.14.3
  kind: p
  original: Von früheren, vereinzelten Notizen bei vielen Beobachtern - eben den Quellen McLennans - abgesehn, hatte Latham ("Descriptive Ethnology", 1859) diese Institution bei den indischen Magars genau und richtig beschrieben und gesagt, daß sie allgemein verbreitet sei und in allen Weltteilen vorkomme - eine Stelle, die McLennan selbst anführt.
  en: Aside from earlier scattered notes of many observers--from which McLennan quoted--Latham had accurately and correctly described this institution among the Indian Magars and stated that it was widespread and practiced in all parts of the globe. McLennan himself quotes this passage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
  en_note: 'Untermann''s footnote [3]: Latham, Descriptive Ethnology, 1859.'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.14.4
  kind: p
  original: Und unser Morgan hatte sie ebenfalls bereits 1847 in seinen Briefen über die Irokesen (im "American Review") und 1851 in "The League of the Iroquois" bei diesem Volksstamm nachgewiesen und richtig beschrieben, während, wie wir sehn werden, der Advokatenverstand McLennans hier eine weit größere Verwirrung angerichtet hat, als Bachofens mystische Phantasie auf dem Gebiet des Mutterrechts.
  en: As early as 1847, our friend Morgan had also pointed out and correctly described the same custom in his letters on the Iroquois (in the American Review) and in 1851 in "The League of the Iroquois." We shall see, how the lawyer's instinct of McLennan has introduced more disorder into this subject than the mystic imagination of Bachofen did into the field of maternal law.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: P1891.14.5
  kind: p
  original: Es ist McLennans ferneres Verdienst, die mutterrechtliche Abstammungsordnung als die ursprüngliche erkannt zu haben, obwohl ihm, wie er später auch anerkennt, Bachofen hier zuvorgekommen war.
  en: It must be said to McLennan's credit that he recognized the custom of tracing decent by maternal law as primeval, although Bachofen has anticipated him in this respect.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: P1891.14.6
  kind: p
  original: Aber auch hier ist er nicht im klaren; er spricht stets von "Verwandtschaft nur in weiblicher Linie" (kinship through females only) und wendet diesen für eine frühere Stufe richtigen Ausdruck fortwährend auch auf spätere Entwicklungsstufen an, wo Abstammung und Vererbung zwar noch ausschließlich nach weiblicher Linie gerechnet, aber Verwandtschaft auch nach männlicher Seite anerkannt und ausgedrückt wird.
  en: McLennan has admitted this later on. But here again he is not clear on the subject. He always speaks of "kinship through females only" and uses this expression, correctly applicable to former stages, in connection with later stages of development, when descent and heredity were still exclusively traced along female lines, but at the same time kinship on the male side began to be recognized and expressed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
  align: '1:3'
  review: true
  review_reason: 1 de sentence(s) matched to 3 en sentence(s)
- id: P1891.14.7
  kind: p
  original: Es ist die Beschränktheit des Juristen, der sich einen festen Rechtsausdruck schafft und diesen unverändert fort anwendet auf Zustände, die ihn inzwischen unanwendbar gemacht.
  en: It is the narrow-mindedness of the jurist, establishing a fixed legal expression and employing it incessantly to denote conditions to which it should no longer be applied.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '216'
- id: P1891.15.1
  kind: p
  original: Bei all ihrer Plausibilität, scheint es, kam die Theorie McLennans doch ihrem eignen Verfasser nicht zu fest gegründet vor.
  en: In spite of its plausibility, McLennan's theory did not seem too well founded even in the eyes of its author.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
- id: P1891.15.2
  kind: p
  original: Wenigstens fällt ihm selbst auf, es sei "bemerkenswert, daß die Form des" (scheinbaren) "Frauenraubs am ausgeprägtesten und ausdruckvollsten ist grade bei den Völkern, wo männliche Verwandtschaft" (soll heißen Abstammung in männlicher Linie) "herrscht" (S. 140).
  en: At least he finds it remarkable himself "that the form of capture is now most distinctly marked and impressive just among those races which have male kinship."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '217'
  en_note: 'Untermann''s footnote [4]: McLennan, Studies In Ancient History, 1886. Primitive Marriage, p. 140.'
- id: P1891.16.1
  kind: p
  original: 'Und ebenso:'
  en: 'And again: "It is a curious fact that nowhere now, that we are aware of, is infanticide a system where exogamy and the earliest form of kinship co-exists."'
  modern: ''
