verses:
- id: VI.0.1
  kind: heading
  original: VI
  en: VI
  modern: ''
  modern_status: empty
  notes: ''
- id: VI.1.1
  kind: p
  original: Die Koalition mit der Montagne und den reinen Republikanern, wozu die Ordnungspartei in ihren vergeblichen Anstrengungen, den Besitz der Militärgewalt zu behaupten und die oberste Leitung der Exekutivgewalt wieder zu erobern, sich verurteilt sah, bewies unwidersprechlich, daß sie die selbständige parlamentarische Majorität eingebüßt hatte.
  en: The coalition with the Mountain and the pure republicans, to which the party of Order found itself condemned in its fruitless efforts to keep possession of the military and to reconquer supreme control over the Executive power, proved conclusively that it had forfeited its independent parliamentary majority.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
- id: VI.1.2
  kind: p
  original: Die bloße Macht des Kalenders, der Stundenzeiger gab am 28. Mai das Signal ihrer völligen Auflösung.
  en: The calendar and clock merely gave, on May 29, the signal for its complete dissolution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
- id: VI.1.3
  kind: p
  original: Mit dem 28. Mai begann das letzte Lebensjahr der Nationalversammlung.
  en: With May 29 commenced the last year of the life of the National Assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
- id: VI.1.4
  kind: p
  original: Sie mußte sich nun entscheiden für die unveränderte Fortdauer oder für die Revision der Verfassung.
  en: It now had to decide for the unchanged continuance or the revision of the Constitution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
- id: VI.1.5
  kind: p
  original: Aber Revision der Verfassung, daß hieß nicht nur Herrschaft der Bourgeoisie oder der kleinbürgerlichen Demokratie, Demokratie oder proletarische Anarchie, parlamentarische Republik oder Bonaparte, das hieß zugleich Orléans oder Bourbon!
  en: But a revision of the Constitution meant not only the definitive supremacy of either the bourgeoisie of the small traders' democracy, of either democracy or proletarian anarchy, of either a parliamentary republic or Bonaparte, it meant also either Orleans or Bourbon!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
- id: VI.1.6
  kind: p
  original: So fiel mitten in das Parlament der Erisapfel, an dem sich der Widerstand der Interessen, welche die Ordnungspartei in feindliche Fraktionen sonderten, offen entzünden mußte.
  en: Thus fell into the very midst of the parliament the apple of discord, around which the conflict of interests, that cut up the party of Order into hostile factions, was to kindle into an open conflagration.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
- id: VI.1.7
  kind: p
  original: Die Ordnungspartei war eine Verbindung von heterogenen gesellschaftlichen Substanzen.
  en: The party of Order was a combination of heterogeneous social substances.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
- id: VI.1.8
  kind: p
  original: Die Revisionsfrage erzeugte eine politische Temperatur, worin das Produkt wieder in seine ursprünglichen Bestandteile zerfiel.
  en: The question of revision raised a political temperature, in which the product was reduced to its original components.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
- id: VI.2.1
  kind: p
  original: Das Interesse der Bonapartisten an der Revision war einfach.
  en: 'The interest of the Bonapartists in the revision was simple: they were above all concerned in the abolition of Article 45, which forbade Bonaparte''s reelection and the prolongation of his term.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.2.2
  kind: p
  original: Für sie handelte es sich vor allem um Abschaffung des Artikels 45, der Bonapartes Wiederwahl untersagte, und die Prorogation seiner Gewalt.
  en: ''
  joined_to: VI.2.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '176'
- id: VI.2.3
  kind: p
  original: Nicht minder einfach schien die Stellung der Republikaner.
  en: Not less simple seemed to be the position of the republicans; they rejected all revision, seeing in that only a general conspiracy against the republic; as they disposed over more than one-fourth of the votes in the National Assembly, and, according to the Constitution, a three-fourths majority was requisite to revise and to call a revisory convention, they needed only to count their own votes to be certain of victory.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
  align: '3:1'
  review: true
  review_reason: 3 de sentence(s) matched to 1 en sentence(s)
- id: VI.2.4
  kind: p
  original: Sie verwarfen unbedingt jede Revision, sie sahen in ihr eine allseitige Verschwörung gegen die Republik.
  en: ''
  joined_to: VI.2.3
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '176'
- id: VI.2.5
  kind: p
  original: Da sie über mehr als ein Viertel der Stimmen in der Nationalversammlung verfügten und verfassungsmäßig drei Viertel der Stimmen zum rechtsgültigen Beschlusse der Revision und zur Einberufung einer revidierenden Versammlung erfordert waren, brauchten sie nur ihre Stimmen zu zählen, um des Sieges sicher zu sein.
  en: ''
  joined_to: VI.2.3
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '176'
- id: VI.2.6
  kind: p
  original: Und sie waren des Sieges sicher.
  en: Indeed, they were certain of it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '176'
- id: VI.3.1
  kind: p
  original: Diesen klaren Stellungen gegenüber befand sich die Partei der Ordnung in unentwirrbaren Widersprüchen.
  en: Over and against these clear-cut positions, the party of Order found itself tangled in inextricable contradictions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 176-177
- id: VI.3.2
  kind: p
  original: Verwarf sie die Revision, so gefährdete sie den Status quo, indem sie Bonaparte nur noch einen Ausweg übrigließ, den der Gewalt, indem sie Frankreich am zweiten [Sonntag des Monats] Mai 1852, im Augenblicke der Entscheidung, der revolutionären Anarchie preisgab, mit einem Präsidenten, der seine Autorität verlor, mit einem Parlamente, das sie längst nicht mehr besaß, und mit einem Volke, das sie wieder zu erobern dachte.
  en: If it voted against the revision, it endangered the "status quo," by leaving to Bonaparte only one expedient--that of violence and handing France over, on May 2, 1852, at the very time of election, a prey to revolutionary anarchy, with a President whose authority was at an end; with a parliament that the party had long ceased to own, and with a people that it meant to re-conquer.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: VI.3.3
  kind: p
  original: Stimmte sie für die verfassungsmäßige Revision, so wußte sie, daß sie umsonst stimmte und am Veto der Republikaner verfassungsmäßig scheitern müsse.
  en: If it voted constitutionally for a revision, it knew that it voted in vain and would constitutionally have to go under before the veto of the republicans.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: VI.3.4
  kind: p
  original: Erklärte sie verfassungswidrig die einfache Stimmenmajorität für bindend, so konnte sie die Revolution nur zu beherrschen hoffen, wenn sie sich unbedingt der Botmäßigkeit der Exekutivgewalt unterwarf, so machte sie Bonaparte zum Meister über die Verfassung, über die Revision und über sich selbst.
  en: 'If, unconstitutionally, it pronounced a simple majority binding, it could hope to control the revolution only in case it surrendered unconditionally to the domination of the Executive power: it then made Bonaparte master of the Constitution, of the revision and of itself.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: VI.3.5
  kind: p
  original: Eine nur teilweise Revision, welche die Gewalt des Präsidenten verlängerte, bahnte der imperialistischen Usurpation den Weg.
  en: 'A merely partial revision, prolonging the term of the President, opened the way to imperial usurpation; a general revision, shortening the existence of the republic, threw the dynastic claims into an inevitable conflict: the conditions for a Bourbon and those for an Orleanist restoration were not only different, they mutually excluded each other.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.3.6
  kind: p
  original: Eine allgemeine Revision, welche die Existenz der Republik abkürzte, brachte die dynastischen Ansprüche in unvermeidlichen Konflikt, denn die Bedingungen für eine bourbonische und die Bedingungen für eine orleanistische Restauration waren nicht nur verschieden, sie schlossen sich wechselseitig aus.
  en: ''
  joined_to: VI.3.5
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '177'
- id: VI.4.1
  kind: p
  original: Die parlamentarische Republik war mehr als das neutrale Gebiet, worin die zwei Fraktionen der französischen Bourgeoisie, Legitimisten und Orleanisten, großes Grundeigentum und Industrie, gleichberechtigt nebeneinander hausen konnten.
  en: The parliamentary republic was more than a neutral ground on which the two factions of the French bourgeoisie--Legitimists and Orleanists, large landed property and manufacture--could lodge together with equal rights.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: VI.4.2
  kind: p
  original: Sie war die unumgängliche Bedingung ihrer gemeinsamen Herrschaft, die einzige Staatsform, worin ihr allgemeines Klasseninteresse sich zugleich die Ansprüche ihrer besonderen Fraktionen wie alle übrigen Klassen der Gesellschaft unterwarf.
  en: It was the indispensable condition for their common reign, the only form of government in which their common class interest could dominate both the claims of their separate factions and all the other classes of society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: VI.4.3
  kind: p
  original: Als Royalisten fielen sie in ihren alten Gegensatz zurück, in den Kampf um die Suprematie des Grundeigentums oder des Geldes, und der höchste Ausdruck dieses Gegensatzes, die Personifikation desselben, waren die Könige selbst, ihre Dynastien.
  en: As royalists, they relapsed into their old antagonism into the struggle for the overlordship of either landed property or of money; and the highest expression of this antagonism, its personification, were the two kings themselves, their dynasties.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: VI.4.4
  kind: p
  original: Daher das Sträuben der Ordnungspartei gegen die Rückberufung der Bourbonen.
  en: Hence the resistance of the party of Order to the recall of the Bourbons.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: VI.5.1
  kind: p
  original: Der Orleanist und Volksrepräsentant Creton hatte 1849, 1850 und 1851 periodisch den Antrag gestellt, das Verbannungsdekret gegen die königlichen Familien aufzuheben.
  en: The Orleanist Representative Creton moved periodically in 1849, 1850 and 1851 the repeal of the decree of banishment against the royal families; as periodically did the parliament present the spectacle of an Assembly of royalists who stubbornly shut to their banished kings the door through which they could return home.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.5.2
  kind: p
  original: Das Parlament bot ebenso periodisch das Schauspiel einer Versammlung von Royalisten, welche ihren verbannten Königen hartnäckig die Tore verschließt, durch die sie heimkehren könnten.
  en: ''
  joined_to: VI.5.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '177'
- id: VI.5.3
  kind: p
  original: Richard III. hatte Heinrich VI. ermordet mit dem Bemerken, daß er zu gut für diese Welt sei und in den Himmel gehöre.
  en: Richard III murdered Henry VI, with the remark that he was too good for this world, and belonged in heaven.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: VI.5.4
  kind: p
  original: Sie erklärten Frankreich für zu schlecht, seine Könige wieder zu besitzen.
  en: They declared France too bad to have her kings back again.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: VI.5.5
  kind: p
  original: Durch die Macht der Verhältnisse gezwungen, waren sie Republikaner geworden und sanktionierten wiederholt den Volksbeschluß, der ihre Könige aus Frankreich verwies.
  en: Forced by the power of circumstances, they had become republicans, and repeatedly sanctioned the popular mandate that exiled their kings from France.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '177'
- id: VI.6.1
  kind: p
  original: Die Revision der Verfassung - und sie in Betracht zu ziehen, zwangen die Umstände - stellte mit der Republik zugleich die gemeinsame Herrschaft der beiden Bourgeoisfraktionen in Frage und rief, mit der Möglichkeit der Monarchie, die Rivalität der Interessen, die sie abwechselnd vorzugsweise vertreten hatte, ins Leben zurück, den Kampf um die Suprematie der einen Fraktion über die andre.
  en: The revision of the Constitution, and circumstances compelled its consideration, at once made uncertain not only the republic itself, but also the joint reign of the two bourgeois factions; and it revived, with the possibility of the monarchy, both the rivalry of interests which these two factions had alternately allowed to preponderate, and the struggle for the supremacy of the one over the other.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: VI.6.2
  kind: p
  original: Die Diplomaten der Ordnungspartei glaubten den Kampf schlichten zu können durch eine Verschmelzung beider Dynastien, durch eine sogenannte Fusion der royalistischen Parteien und ihrer Königshäuser.
  en: The diplomats of the party of Order believed they could allay the struggle by a combination of the two dynasties through a so-called fusion of the royalist parties and their respective royal houses.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: VI.6.3
  kind: p
  original: Die wirkliche Fusion der Restauration und der Julimonarchie war die parlamentarische Republik, worin orleanistische und legitimistische Farben ausgelöscht wurden und die Bourgeois-Arten in dem Bourgeois schlechtweg, in der Bourgeois-Gattung verschwanden.
  en: The true fusion of the restoration and the July monarchy was, however, the parliamentary republic, in which the Orleanist and Legitimist colors were dissolved, and the bourgeois species vanished in the plain bourgeois, in the bourgeois genus.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: VI.6.4
  kind: p
  original: Jetzt aber sollte der Orleanist Legitimist, der Legitimist Orleanist werden.
  en: Now however, the plan was to turn the Orleanist Legitimist and the Legitimist Orleanist.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: VI.6.5
  kind: p
  original: Das Königtum, worin sich ihr Gegensatz personifizierte, sollte ihre Einheit verkörpern, der Ausdruck ihrer ausschließlichen Fraktionsinteressen zum Ausdruck ihres gemeinsamen Klasseninteresses werden, die Monarchie das leisten, was nur die Aufhebung zweier Monarchien, die Republik, leisten konnte und geleistet hatte.
  en: The kingship, in which their antagonism was personified, was to incarnate their unity, the expression of their exclusive faction interests was to become the expression of their common class interest; the monarchy was to accomplish what only the abolition of two monarchies--the republic could and did accomplish.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: VI.6.6
  kind: p
  original: Es war dies der Stein der Weisen, an dessen Herstellung sich die Doktoren der Ordnungspartei die Köpfe zerbrachen.
  en: This was the philosopher's stone, for the finding of which the doctors of the party of Order were breaking their heads.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: VI.6.7
  kind: p
  original: Als könnte die legitime Monarchie jemals die Monarchie der industriellen Bourgeois oder das Bürgerkönigtum jemals das Königtum der angestammten Grundaristokratie werden.
  en: As though the Legitimate monarchy ever could be the monarchy of the industrial bourgeoisie, or the bourgeois monarchy the monarchy of the hereditary landed aristocracy!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: VI.6.8
  kind: p
  original: Als könnten Grundeigentum und Industrie sich unter einer Krone verbrüdern, wo die Krone nur auf ein Haupt fallen konnte, auf das Haupt des älteren Bruders oder des jüngeren.
  en: As though landed property and industry could fraternize under one crown, where the crown could fall only upon one head, the head of the older or the younger brother!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: VI.6.9
  kind: p
  original: Als könnte die Industrie sich überhaupt mit dem Grundeigentum ausgleichen, solange das Grundeigentum sich nicht entschließt, selbst industriell zu werden.
  en: As though industry could at all deal upon a footing of equality with landed property, so long as landed property did not decide itself to become industrial.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: VI.6.10
  kind: p
  original: Wenn Henri V morgen stürbe, der Graf von Paris würde darum nicht der König der Legitimisten, es sei denn, daß er aufhörte, der König der Orleanisten zu sein.
  en: If Henry V were to die tomorrow, the Count of Paris would not, therefore, become the king of the Legitimists, unless he ceased to be the King of the Orleanists.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: VI.6.11
  kind: p
  original: Die Philosophen der Fusion jedoch, die sich in dem Maße breitmachten, als die Revisionsfrage in den Vordergrund trat, die sich in der "Assemblée nationale" ein offizielles Tagesorgan geschaffen hatten, die sogar in diesem Augenblicke (Februar 1852) wieder am Werke sind, erklärten sich die ganze Schwierigkeit aus dem Widerstreben und der Rivalität der beiden Dynastien.
  en: Nevertheless, the fusion philosophers, who became louder in the measure that the question of revision stepped to the fore, who had provided themselves with a daily organ in the "Assemblee Nationale," who, even at this very moment (February, 1852) are again at work, explained the whole difficulty by the opposition and rivalries of the two dynasties.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '178'
- id: VI.6.12
  kind: p
  original: Die Versuche, die Familie Orléans mit Heinrich V. zu versöhnen, die seit dem Tode Louis-Philippes begonnen, aber wie die dynastischen Intrigen überhaupt nur während der Ferien der Nationalversammlung, in den Zwischenakten, hinter den Kulissen gespielt, mehr sentimentale Koketterie mit dem alten Aberglauben als ernstgemeintes Geschäft, wurden nun zu Haupt- und Staatsaktionen und von der Ordnungspartei auf der öffentlichen Bühne aufgeführt, statt wie bisher auf dem Liebhabertheater.
  en: The attempts to reconcile the family of Orleans with Henry V., begun since the death of Louis Philippe, but, as all these dynastic intrigues carried on only during the vacation of the National Assembly, between acts, behind the scenes, more as a sentimental coquetry with the old superstition than as a serious affair, were now raised by the party of Order to the dignity of a great State question, and were conducted upon the public stage, instead of, as heretofore in the amateurs' theater.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 178-179
- id: VI.6.13
  kind: p
  original: Die Kuriere flogen von Paris nach Venedig, von Venedig nach Claremont, von Claremont nach Paris.
  en: Couriers flew from Paris to Venice, from Venice to Claremont, from Claremont to Paris.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: VI.6.14
  kind: p
  original: Der Graf von Chambord erläßt ein Manifest, worin er "mit Hülfe aller Glieder seiner Familie" nicht seine, sondern die "nationale" Restauration anzeigt.
  en: The Duke of Chambord issues a manifesto in which he announces not his own, but the "national" restoration, "with the aid of all the members of his family."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: VI.6.15
  kind: p
  original: Der Orleanist Salvandy wirft sich Heinrich V. zu Füßen.
  en: The Oleanist Salvandy throws himself at the feet of Henry V. The Legitimist leaders Berryer, Benoit d'Azy, St. Priest travel to Claremont, to persuade the Orleans; but in vain.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.6.16
  kind: p
  original: Die Legitimistenchefs Berryer, Benoist d'Azy, St-Priest wandern nach Claremont, um die Orléans zu überreden, aber vergeblich.
  en: ''
  joined_to: VI.6.15
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '179'
- id: VI.6.17
  kind: p
  original: Die Fusionisten gewahren zu spät, daß die Interessen der beiden Bourgeoisfraktionen weder an Ausschließlichkeit verlieren noch an Nachgiebigkeit gewinnen, wo sie in der Form von Familieninteressen, von Interessen zweier Königshäuser sich zuspitzen.
  en: The fusionists learn too late that the interests of the two bourgeois factions neither lose in exclusiveness nor gain in pliancy where they sharpen to a point in the form of family interests, of the interests of the two royal houses.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: VI.6.18
  kind: p
  original: Wenn Heinrich V. den Grafen von Paris als Nachfolger anerkannte - der einzige Erfolg, den die Fusion im besten Fall erzielen konnte -, so gewann das Haus Orléans keinen Anspruch, den ihm die Kinderlosigkeit Heinrichs V. nicht schon gesichert hätte, aber es verlor alle Ansprüche, die es durch die Julirevolution erobert hatte.
  en: When Henry V. recognized the Count of Paris as his successor--the only success that the fusion could at best score--the house of Orleans acquired no claim that the childlessness of Henry V. had not already secured to it; but, on the other hand, it lost all the claims that it had conquered by the July revolution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: VI.6.19
  kind: p
  original: Es verzichtete auf seine Originalansprüche, auf alle Titel, die es in einem beinah hundertjährigen Kampfe dem älteren Zweige der Bourbonen abgerungen, es tauschte seine historische Prärogative, die Prärogative des modernen Königtums, gegen die Prärogative seines Stammbaums aus.
  en: It renounced its original claims, all the title, that, during a struggle nearly one hundred years long, it had wrested from the older branch of the Bourbons; it bartered away its historic prerogative, the prerogative of its family-tree.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: VI.6.20
  kind: p
  original: Die Fusion war also nichts als eine freiwillige Abdankung des Hauses Orléans, die legitimistische Resignation desselben, der reuige Rücktritt aus der protestantischen Staatskirche in die katholische.
  en: Fusion, accordingly, amounted to nothing else than the resignation of the house of Orleans, its Legitimist resignation, a repentful return from the Protestant State Church into the Catholic;--a return, at that, that did not even place it on the throne that it had lost, but on the steps of the throne on which it was born.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.6.21
  kind: p
  original: Ein Rücktritt, der es dazu nicht einmal auf den Thron, den es verloren hatte, sondern auf die Stufe des Throns brachte, auf der es geboren war.
  en: ''
  joined_to: VI.6.20
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '179'
- id: VI.6.22
  kind: p
  original: Die alten orleanistischen Minister Guizot, Duchâtel etc., die ebenfalls nach Claremont eilten, um die Fusion zu bevorworten, vertraten in der Tat nur den Katzenjammer über die Julirevolution, die Verzweiflung am Bürgerkönigtum und am Königtum der Bürger, den Aberglauben an die Legitimität als das letzte Amulett gegen die Anarchie.
  en: The old Orleanist Ministers Guizot, Duchatel, etc., who likewise hastened to Claremont, to advocate the fusion, represented in fact only the nervous reaction of the July monarchy; despair, both in the citizen kingdom and the kingdom of citizens; the superstitious belief in legitimacy as the last amulet against anarchy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: VI.6.23
  kind: p
  original: In ihrer Einbildung Vermittler zwischen Orléans und Bourbon, waren sie in der Wirklichkeit nur noch abgefallene Orleanisten, und als solche empfing sie der Prinz von Joinville.
  en: Mediators, in their imagination, between Orleans and Bourbon, they were in reality but apostate Orleanists, and as such were they received by the Prince of Joinville.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: VI.6.24
  kind: p
  original: Der lebensfähige, kriegerische Teil der Orleanisten dagegen, Thiers, Baze usw., überzeugten die Familie Louis-Philippes um so leichter, daß, wenn jede unmittelbar monarchistische Restauration die Fusion der beiden Dynastien, jede solche Fusion aber die Abdankung des Hauses Orléans voraussetzte, es dagegen ganz der Tradition ihrer Vorfahren entspreche, vorläufig die Republik anzuerkennen und abzuwarten, bis die Ereignisse erlaubten, den Präsidentenstuhl in einen Thron zu verwandeln.
  en: The virile, bellicose part of the Orleanists, on the contrary--Thiers, Baze, etc.--, persuaded the family of Louis Philippe all the easier that, seeing every plan for the immediate restoration of the monarchy presupposed the fusion of the two dynasties, and every plan for fusion the resignation of the house of Orleans, it corresponded, on the contrary, wholly with the tradition of its ancestors to recognize the republic for the time being, and to wait until circumstances permitted I the conversion of the Presidential chair into a throne.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: VI.6.25
  kind: p
  original: Joinvilles Kandidatur wurde gerüchtsweise ausgesprengt, die öffentliche Neugier in der Schwebe erhalten, und einige Monate später, nach Verwerfung der Revision, im September öffentlich proklamiert.
  en: Joinville's candidacy was set afloat as a rumor, public curiosity was held in suspense, and a few months later, after the revision was rejected, openly proclaimed in September.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '179'
- id: VI.7.1
  kind: p
  original: Der Versuch einer royalistischen Fusion zwischen Orleanisten und Legitimisten war so nicht nur gescheitert, er hatte ihre parlamentarische Fusion, ihre republikanische Gemeinform gebrochen und die Ordnungspartei wieder in ihre ursprünglichen Bestandteile zersetzt; aber je mehr die Entfremdung zwischen Claremont und Venedig wuchs, ihre Ausgleichung sich zerschlug, die Joinville-Agitation um sich griff, desto eifriger, ernster wurden die Verhandlungen zwischen Faucher, dem Minister Bonapartes, und den Legitimisten.
  en: Accordingly, the essay of a royalist fusion between Orleanists and Legitimists did not miscarry only, it broke up their parliamentary fusion, the republican form that they had adopted in common, and it decomposed the party of Order into its original components. But the wider the breach became between Venice and Claremont, the further they drifted away from each I other, and the greater the progress made by the Joinville agitation, all the more active and earnest became the negotiations between Faucher, the Minister of Bonaparte, and the Legitimists.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.8.1
  kind: p
  original: Die Auflösung der Ordnungspartei blieb nicht bei ihren ursprünglichen Elementen stehen.
  en: The dissolution of the party of Order went beyond its original elements.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: VI.8.2
  kind: p
  original: Jede der beiden großen Fraktionen zersetzte sich ihrerseits von neuem.
  en: Each of the two large factions fell in turn into new fragments.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: VI.8.3
  kind: p
  original: Es war, als wenn alle die alten Nuancen, die sich früher innerhalb jedes der beiden Kreise, sei es des legitimen, sei es des orleanistischen, bekämpft und gedrängt hatten, wieder aufgetaut wären, wie vertrocknete Infusorien bei Berührung mit Wasser, als wenn sie von neuem Lebenskraft genug gewonnen hätten, um eigne Gruppen und selbständige Gegensätze zu bilden.
  en: It was as if all the old political shades, that formerly fought and crowded one another within each of the two circles--be it that of the Legitimists or that of the Orleanists--, had been thawed out like dried infusoria by contact with water; as if they had recovered enough vitality to build their own groups and assert their own antagonisms.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: VI.8.4
  kind: p
  original: Die Legitimisten träumten sich zurück in die Streitfragen zwischen den Tuilerien und dem Pavillion Marsan, zwischen Villèle und Poligniac.
  en: The Legitimists dreamed they were back amidst the quarrels between the Tuileries and the pavilion Marsan, between Villele and Polignac; the Orleanists lived anew through the golden period of the tourneys between Guizot, Mole, Broglie, Thiers, and Odillon Barrot.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.8.5
  kind: p
  original: Die Orleanisten durchlebten von neuem die goldene Zeit der Turniere zwischen Guizot, Molé, Broglie, Thiers und Odilon Barrot.
  en: ''
  joined_to: VI.8.4
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '180'
- id: VI.9.1
  kind: p
  original: 'Der revisionslustige, aber über die Grenzen der Revision wieder uneinige Teil der Ordnungspartei, zusammengesetzt aus den Legitimisten unter Berryer und Falloux einerseits, unter La Rochejaquelein andererseits, und den kampfmüden Orleanisten unter Molé, Broglie, Montalambert und Odilon Barrot, vereinbarte sich mit den bonapartistischen Repräsentanten zu folgendem unbestimmten und weitgefaßten Antrage:'
  en: 'That portion of the party of Order--eager for a revision of the Constitution but disagreed upon the extent of revision--made up of the Legitimists under Berryer and Falloux and of those under Laroche Jacquelein, together with the tired-out Orleanists under Mole, Broglie, Montalembert and Odillon Barrot, united with the Bonapartist Representatives in the following indefinite and loosely drawn motion:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: VI.10.1
  kind: p
  original: '"Die unterzeichneten Repräsentanten, mit dem Zwecke, der Nation die volle Ausübung ihrer Souveränität wiederzugeben, stellen die Motion, daß die Verfassung revidiert werde."'
  en: '"The undersigned Representatives, with the end in view of restoring to the nation the full exercise of her sovereignty, move that the Constitution be revised."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: VI.11.1
  kind: p
  original: Gleichzeitig aber erklärten sie einstimmig durch ihren Berichterstatter Toqueville, die Nationalversammlung habe nicht das Recht, die Abschaffung der Republik zu beantragen, dies Recht stehe nur der Revisionskammer zu.
  en: At the same time, however, they unanimously declared through their spokesman, Tocqueville, that the National Assembly had not the right to move the abolition of the republic, that right being vested only in a Constitutional Convention.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: VI.11.2
  kind: p
  original: Übrigens könne die Verfassung nur auf "legale" Weise revidiert werden, also nur, wenn das verfassungsmäßig vorgeschriebene Dreiviertel der Stimmenzahl für Revision entscheide.
  en: For the rest, the Constitution could be revised only in a "legal" way, that is to say, only in case a three-fourths majority decided in favor of revision, as prescribed by the Constitution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: VI.11.3
  kind: p
  original: Nach sechtägigen stürmischen Debatten, am 19. Juli, wurde die Revision, wie vorherzusehen, verworfen.
  en: After a six days' stormy debate, the revision was rejected on July 19, as was to be foreseen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: VI.11.4
  kind: p
  original: Es stimmten 446 dafür, aber 278 dagegen.
  en: In its favor 446 votes were cast, against it 278.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: VI.11.5
  kind: p
  original: Die entschiedenen Orleanisten Thiers, Changarnier etc. stimmten mit den Republikanern und der Montagne.
  en: The resolute Oleanists, Thiers, Changarnier, etc., voted with the republicans and the Mountain.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '180'
- id: VI.12.1
  kind: p
  original: Die Majorität des Parlaments erklärte sich so gegen die Verfassung, aber diese Verfassung selbst erklärte sich für die Minorität und ihren Beschluß für bindend.
  en: Thus the majority of the parliament pronounced itself against the Constitution, while the Constitution itself pronounced itself for the minority, and its decision binding.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 180-181
- id: VI.12.2
  kind: p
  original: Hatte aber die Ordnungspartei nicht am 31. Mai 1850, nicht am 13. Juni 1849 die Verfassung der parlamentarischen Majorität untergeordnet?
  en: But had not the party of Order on May 31, 1850, had it not on June 13, 1849, subordinated the Constitution to the parliamentary majority?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: VI.12.3
  kind: p
  original: Beruhte ihre ganze bisherige Politik nicht auf der Unterordnung der Verfassungsparagraphen unter die parlamentarischen Majoritätsbeschlüsse?
  en: Did not the whole republic they had been hitherto having rest upon the subordination of the Constitutional clauses to the majority decisions of the parliament?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: VI.12.4
  kind: p
  original: Hatte sie den alttestamentarischen Aberglauben an den Buchstaben des Gesetzes nicht den Demokraten überlassen und an den Demokraten gezüchtigt?
  en: Had they not left to the democrats the Old Testament superstitious belief in the letter of the law, and had they not chastised the democrats therefor?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: VI.12.5
  kind: p
  original: In diesem Augenblicke aber hieß Revision der Verfassung nichts andres als Fortdauer der präsidentiellen Gewalt, wie Fortdauer der Verfassung nicht andres hieß als Absetzung Bonapartes.
  en: At this moment, however, revision meant nothing else than the continuance of the Presidential power, as the continuance of the Constitution meant nothing else than the deposition of Bonaparte.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: VI.12.6
  kind: p
  original: Das Parlament hatte sich für ihn erklärt, aber die Verfassung erklärte sich gegen das Parlament.
  en: The parliament had pronounced itself for him, but the Constitution pronounced itself against the parliament.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: VI.12.7
  kind: p
  original: Er handelte also im Sinne des Parlaments, wenn er die Verfassung zerriß, und er handelte im Sinne der Verfassung, wenn er das Parlament auseinanderjagte.
  en: Accordingly, he acted both in the sense of the parliament when he tore up the Constitution, and in the sense of the Constitution when he chased away the parliament.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: VI.13.1
  kind: p
  original: Das Parlament hatte die Verfassung und mit ihr seine eigene Herrschaft "außerhalb der Majorität" erklärt, es hatte durch seinen Beschluß die Verfassung aufgehoben und die präsidentielle Gewalt verlängert und zugleich erklärt, daß weder die eine sterben, noch die andre leben könne, solange es selbst fortbestehe.
  en: The parliament pronounced the Constitution, and, thereby, also, its own reign, "outside of the pale of the majority"; by its decision, it repealed the Constitution, and continued the Presidential power, and it at once declared that neither could the one live nor the other die so long as itself existed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: VI.13.2
  kind: p
  original: Die Füße derer, die es begraben sollten, standen vor der Türe.
  en: The feet of those who were to bury it stood at the door.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: VI.13.3
  kind: p
  original: Während es die Revision debattierte, entfernte Bonaparte den General Baraguay d'Hilliers, der sich unschlüssig zeigte, von dem Kommando der ersten Militärdivison und ernannte an seiner Stelle den General Magnan, den Sieger von Lyon, den Helden der Dezembertage, eine seiner Kreaturen, die sich schon unter Louis-Philippe bei Gelegenheit der Expedition von Boulogne mehr oder minder für ihn kompromittiert hatte.
  en: While it was debating the subject of revision, Bonaparte removed General Baraguay d'Hilliers, who showed himself irresolute, from the command of the First Military Division, and appointed in his place General Magnan, the conqueror of Lyon; the hero of the December days, one of his own creatures, who already under Louis Philippe, on the occasion of the Boulogne expedition, had somewhat compromised himself in his favor.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: VI.14.1
  kind: p
  original: Die Ordnungspartei bewies durch ihren Beschluß über die Revision, daß sie weder zu herrschen noch zu dienen, weder zu leben noch zu sterben, weder die Republik zu ertragen noch sie umzustürzen, weder die Verfassung aufrechtzuerhalten noch sie über den Haufen zu werfen, weder mit dem Präsidenten zusammenzuwirken noch mit ihm zu brechen verstand.
  en: By its decision on the revision, the party of Order proved that it knew neither how to rule nor how to obey; neither how to live nor how to die; neither how to bear with the republic nor how to overthrow it; neither how to maintain the Constitution nor how to throw it overboard; neither how to co-operate with the President nor how to break with him.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: VI.14.2
  kind: p
  original: Von wem erwartete sie denn die Lösung aller Widersprüche?
  en: From what quarter did it then, look to for the solution of all the existing perplexities?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: VI.14.3
  kind: p
  original: Von dem Kalender, von dem Gang der Ereignisse.
  en: From the calendar, from the course of events.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: VI.14.4
  kind: p
  original: Sie hörte auf, sich die Gewalt über die Ereignisse anzumaßen.
  en: It ceased to assume the control of events.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: VI.14.5
  kind: p
  original: Sie forderte also die Ereignisse heraus, ihr Gewalt anzutun, und damit die Macht, woran sie im Kampfe mit dem Volke ein Attribut nach dem andern abgetreten hatte, bis sie selbst ihr gewaltlos gegenüberstand.
  en: It, accordingly, invited events to don its authority and also the power to which in its struggle with the people, it had yielded one attribute after another until it finally stood powerless before the same.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: VI.14.6
  kind: p
  original: Damit der Chef der Exekutivgewalt desto ungestörter den Kampfplan gegen sie entwerfen, seine Arbeitsmittel verstärken, seine Werkzeuge auswählen, seine Positionen befestigen könne, beschloß sie mitten in diesem kritischen Augenblicke von der Bühne abzutreten und sich auf drei Monate zu vertagen, vom 10. August bis 4. November.
  en: To the end that the Executive be able all the more freely to formulate his plan of campaign against it, strengthen his means of attack, choose his tools, fortify his positions, the party of Order decided, in the very midst of this critical moment, to step off the stage, and adjourn for three months, from August 10 to November 4.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: VI.15.1
  kind: p
  original: Die parlamentarische Partei war nicht nur in ihre zwei großen Fraktionen, jede dieser Fraktionen war nicht nur innerhalb ihrer selbst aufgelöst, sondern die Ordnungspartei im Parlamente war mit der Ordnungspartei außerhalb des Parlaments zerfallen.
  en: Not only was the parliamentary party dissolved into its two great factions, not only was each of these dissolved within itself, but the party of Order, inside of the parliament, was at odds with the party of Order, outside of the parliament.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: VI.15.2
  kind: p
  original: Die Wortführer und die Schriftgelehrten der Bourgeoisie, ihre Tribüne und ihre Presse, kurz die Ideologen der Bourgeoisie und die Bourgeoisie selbst, die Repräsentanten und die Repräsentierten, standen sich entfremdet gegenüber und verstanden sich nicht mehr.
  en: The learned speakers and writers of the bourgeoisie, their tribunes and their press, in short, the ideologists of the bourgeoisie and the bourgeoisie itself, the representatives and the represented, stood estranged from, and no longer understood one another.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: VI.16.1
  kind: p
  original: Die Legitimisten in den Provinzen, mit ihrem beschränkten Horizont und ihrem unbeschränkten Enthusiasmus, bezüchtigten ihre parlamentarischen Führer, Berryer und Falloux, der Desertion ins bonapartistische Lager und des Abfalls von Heinrich V. Ihr Lilienverstand glaubte an den Sündenfall, aber nicht an die Diplomatie.
  en: The Legitimists in the provinces, with their cramped horizon and their boundless enthusiasm, charged their parliamentary leaders Berryer and Falloux with desertion to the Bonapartist camp, and with apostacy from Henry V. Their lilymind believed in the fall of man, but not in diplomacy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
  en_note: 'De Leon''s note [1]: An allusion to the lilies of the Bourbon coat-of-arms'
- id: VI.17.1
  kind: p
  original: Ungleich verhängnisvoller und entscheidender war der Bruch der kommerziellen Bourgeoisie mit ihren Politikern.
  en: More fatal and completer, though different, was the breach between the commercial bourgeoisie and its politicians.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: VI.17.2
  kind: p
  original: Sie warf ihnen vor, nicht wie die Legitimisten den ihren, von dem Prinzip abgefallen zu sein, sondern umgekehrt, an unnütz gewordenen Prinzipien festzuhalten.
  en: It twitted them, not as the Legitimists did theirs, with having apostatized from their principle, but, on the contrary, with adhering to principles that had become useless.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: VI.18.1
  kind: p
  original: Ich habe schon früher angedeutet, daß seit dem Eintritt Foulds ins Ministerium der Teil der kommerziellen Bourgeoisie, der den Löwenanteil an Louis-Philippes Herrschaft besessen hatte, daß die Finanzaristokratie bonapartistisch geworden war.
  en: I have already indicated that, since the entry of Fould in the Ministry, that portion of the commercial bourgeoisie that had enjoyed the lion's share in Louis Philippe's reign, to-wit, the aristocracy of finance, had become Bonapartist.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: VI.18.2
  kind: p
  original: Fould vertrat nicht nur Bonapartes Interesse an der Börse, er vertrat zugleich das Interesse der Börse bei Bonaparte.
  en: Fould not only represented Bonaparte's interests at the Bourse, he represented also the interests of the Bourse with Bonaparte.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: VI.18.3
  kind: p
  original: Die Stellung der Finanzaristokratie schildert am schlagendsten ein Zitat aus ihrem europäischen Organ, dem Londoner "Economist".
  en: A passage from the London "Economist," the European organ of the aristocracy of finance, described most strikingly the attitude of this class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: VI.18.4
  kind: p
  original: 'In seiner Nummer vom 1. Februar 1851 läßt er aus Paris schreiben:'
  en: 'In its issue of February 1, 1851, its Paris correspondent writes: "Now we have it stated from numerous quarters that France wishes above all things for repose.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.19.1
  kind: p
  original: '"Nun haben wir es konstatiert von allen Seiten her, daß Frankreich vor allem nach Ruhe verlangt.'
  en: ''
  joined_to: VI.18.4
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '182'
- id: VI.19.2
  kind: p
  original: Der Präsident erklärt es in seiner Botschaft an die legislative Versammlung, es tönt als Echo zurück von der nationalen Rednertribüne, es wird beteuert von den Zeitungen, es wird verkündet von der Kanzel, es wird bewiesen durch die Empfindlichkeit der Staatspapiere bei der geringsten Aussicht auf Störung, durch ihre Festigkeit, sooft die Exekutivgewalt siegt".
  en: The President declares it in his message to the Legislative Assembly; it is echoed from the tribune; it is asserted in the journals; it is announced from the pulpit; it is demonstrated by the sensitiveness of the public funds at the least prospect of disturbance, and their firmness the instant it is made manifest that the Executive is far superior in wisdom and power to the factious ex-officials of all former governments."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: VI.20.1
  kind: p
  original: 'In seiner Nummer vom 29. November erklärt der "Economist" in seinem eignen Namen:'
  en: 'In its issue of November 29, 1851, the "Economist" declares editorially: "The President is now recognized as the guardian of order on every Stock Exchange of Europe."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.21.1
  kind: p
  original: '"Auf allen Börsen Europas ist der Präsident nun als die Schildwache der Ordnung anerkannt."'
  en: ''
  joined_to: VI.20.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '182'
- id: VI.22.1
  kind: p
  original: Die Finanzaristokratie verdammte also den parlamentarischen Kampf der Ordnungspartei mit der Exekutivgewalt als eine Störung der Ordnung und feierte jeden Sieg des Präsidenten über ihre angeblichen Repräsentanten als einen Sieg der Ordnung.
  en: Accordingly, the Aristocracy of Finance condemned the parliamentary strife of the party of Order with the Executive as a "disturbance of order," and hailed every victory of the President over its reputed representatives as a "victory of order."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: VI.22.2
  kind: p
  original: Man muß hier unter der Finanzaristokratie nicht nur die großen Anleihunternehmer und Spekulanten in Staatspapieren verstehn, von denen es sich sofort begreift, daß ihr Interesse mit dem Interesse der Staatsgewalt zusammenfällt.
  en: Under "aristocracy of finance" must not, however, be understood merely the large bond negotiators and speculators in government securities, of whom it may be readily understood that their interests and the interests of the Government coincide.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 182-183
- id: VI.22.3
  kind: p
  original: Das ganze moderne Geldgeschäft, die ganze Bankwirtschaft ist auf das innigste mit dem öffentlichen Kredit verwebt.
  en: The whole modern money trade, the whole banking industry, is most intimately interwoven with the public credit.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: VI.22.4
  kind: p
  original: Ein Teil ihres Geschäftskapitals wird notwendig in schnell konvertiblen Staatspapieren angelegt und verzinst.
  en: Part of their business capital requires to be invested in interest-bearing government securities that are promptly convertible into money; their deposits, i. e., the capital placed at their disposal and by them distributed among merchants and industrial establishments, flow partly out of the dividends on government securities.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.22.5
  kind: p
  original: Ihre Depositen, das unter ihnen zur Verfügung gestellte und von ihnen unter Kaufleute und Industrielle verteilte Kapital strömt teilweis aus den Dividenden der Staatsrentner her.
  en: ''
  joined_to: VI.22.4
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '183'
- id: VI.22.6
  kind: p
  original: Der ganze Geldmarkt und die Priester dieses Geldmarkts, wenn zu jeder Epoche die Stabilität der Staatsgewalt Moses und die Propheten für sie bedeutet hat, wie nicht erst heute, wo jede Sündflut mit den alten Staaten die alten Staatsschulden wegzuschwemmen droht?
  en: The whole money market, together with the priests of this market, is part and parcel of this "aristocracy of finance" at every epoch when the stability of the government is to them synonymous with "Moses and his prophets." This is so even before things have reached the present stage when every deluge threatens to carry away the old governments themselves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.23.1
  kind: p
  original: Auch die industrielle Bourgeoisie ärgerte sich in ihrem Ordnungsfanatismus über die Zänkereien der parlamentarischen Ordnungspartei mit der Exekutivgewalt.
  en: But the industrial Bourgeoisie also, in its fanaticism for order, was annoyed at the quarrels of the Parliamentary party of Order with the Executive.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: VI.23.2
  kind: p
  original: Thiers, Anglès, Sainte-Beuve usw. erhielten nach ihrem Votum vom 18. Januar, bei Gelegenheit der Absetzung Changarniers, von ihren Mandatgebern gerade aus den industriellen Bezirken öffentliche Zurechtweisungen, worin namentlich ihre Koalition mit der Montagne als Hochverrat an der Ordnung gegeißelt wurde.
  en: Thiers, Anglas, Sainte Beuve, etc., received, after their vote of January 18, on the occasion of the discharge of Changarnier, public reprimands from their constituencies, located in the industrial districts, branding their coalition with the Mountain as an act of high treason to the cause of order.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: VI.23.3
  kind: p
  original: Wenn wir gesehen haben, daß die prahlerischen Neckereien, die kleinlichen Intrigen, worin sich der Kampf der Ordnungspartei mit dem Präsidenten kundgab, keine bessere Aufnahme verdienten, so war andererseits diese Bourgoeispartei, die von ihren Vertretern verlangt, die Militärgewalt aus den Händen ihres eignen Parlaments widerstandslos in die eines abenteuernden Prätendenten übergehn zu lassen, nicht einmal der Intrigen wert, die in ihrem Interesse verschwendet wurden.
  en: Although, true enough, the boastful, vexatious and petty intrigues, through which the struggle of the party of Order with the President manifested itself, deserved no better reception, yet notwithstanding, this bourgeois party, that expects of its representatives to allow the military power to pass without resistance out of the hands of their own Parliament into those of an adventurous Pretender, is not worth even the intrigues that were wasted in its behalf.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: VI.23.4
  kind: p
  original: Sie bewies, daß der Kampf um die Behauptung ihres öffentlichen Interesses, ihres eignen Klasseninteresses, ihrer politischen Macht, sie als Störung des Privatgeschäfts nur belästige und verstimme.
  en: It showed that the struggle for the maintenance of their public interests, of their class interests, of their political power only incommoded and displeased them, as a disturbance of their private business.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: VI.24.1
  kind: p
  original: Die bürgerlichen Honoratioren der Departemantalstädte, die Magistrate, Handelsrichter usw. empfingen mit kaum einer Ausnahme Bonaparte überall auf seinen Rundreisen in der servilsten Weise, selbst wenn er wie in Dijon die Nationalversammlung und speziell die Ordnungspartei rückhaltlos angriff.
  en: The bourgeois dignitaries of the provincial towns, the magistrates, commercial judges, etc., with hardly any exception, received Bonaparte everywhere on his excursions in the most servile manner, even when, as in Dijon, he attacked the National Assembly and especially the party of Order without reserve.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: VI.25.1
  kind: p
  original: Wenn der Handel gut ging, wie noch Anfang 1851, tobte die kommerzielle Bourgeoisie gegen jeden parlamentarischen Kampf, damit dem Handel ja nicht der Humor ausgehe.
  en: Business being brisk, as still at the beginning of 1851, the commercial bourgeoisie stormed against every Parliamentary strife, lest business be put out of temper.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: VI.25.2
  kind: p
  original: Wenn der Handel schlecht ging, wie fortdauernd seit Ende Februar 1851, klagte sie die parlamentarischen Kämpfe als Ursache der Stockung an und schrie nach ihrem Verstummen, damit der Handel wieder laut werde.
  en: Business being dull, as from the end of February, 1851, on, the bourgeoisie accused the Parliamentary strifes as the cause of the stand-still, and clamored for quiet in order that business may revive.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '183'
- id: VI.25.3
  kind: p
  original: Die Revisionsdebatten fielen gerade in diese schlechte Zeit.
  en: The debates on revision fell just in the bad times.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 183-184
- id: VI.25.4
  kind: p
  original: Da es sich hier um Sein oder Nichtsein der bestehenden Staatsform handelte, fühlte sich die Bourgeoisie um so berechtigter, von ihren Repräsentanten das Ende dieses folternden Provisoriums und zugleich die Erhaltung des Status quo zu verlangen.
  en: Seeing the question now was the to be or not to be of the existing form of government, the bourgeoisie felt itself all the more justified in demanding of its Representatives that they put an end to this tormenting provisional status, and preserve the "status quo."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: VI.25.5
  kind: p
  original: Es war dies kein Widerspruch.
  en: This was no contradiction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: VI.25.6
  kind: p
  original: Unter dem Ende des Provisoriums verstand sie gerade seine Fortdauer, das Hinausschieben des Augenblicks, wo es zu einer Entscheidung kommen mußte, in eine blaue Ferne.
  en: By putting an end to the provisional status, it understood its continuance, the indefinite putting off of the moment when a final decision had to be arrived at.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: VI.25.7
  kind: p
  original: Der Status quo konnte nur auf zwei Wegen erhalten werden.
  en: 'The "status quo" could be preserved in only one of two ways: either by the prolongation of Bonaparte''s term of office or by his constitutional withdrawal and the election of Cavaignac.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.25.8
  kind: p
  original: Verlängerung der Gewalt Bonapartes oder verfassungsmäßiger Abtritt desselben und Wahl Cavaignacs.
  en: ''
  joined_to: VI.25.7
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '184'
- id: VI.25.9
  kind: p
  original: Ein Teil der Bourgeoisie wünschte die letztere Lösung und wußte seinen Repräsentanten keinen bessern Rat zu geben, als zu schweigen, den brennenden Punkt unberührt zu lassen.
  en: A part of the bourgeoisie preferred the latter solution, and knew no better advice to give their Representatives than to be silent, to avoid the burning point.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: VI.25.10
  kind: p
  original: Wenn ihre Repräsentanten nicht sprächen, meinten sie, werde Bonaparte nicht handeln.
  en: If their Representatives did not speak, so argued they, Bonaparte would not act.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: VI.25.11
  kind: p
  original: Sie wünschten sich ein Straußenparlament, da seinen Kopf verstecke, um ungesehn zu bleiben.
  en: They desired an ostrich Parliament that would hide its head, in order not to be seen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: VI.25.12
  kind: p
  original: Ein andrer Teil der Bourgeoisie wünschte Bonaparte, weil er einmal auf dem Präsidentenstuhl saß, auf dem Präsidentenstuhl sitzenzulassen, damit alles im alten Gleise bleibe.
  en: Another part of the bourgeoisie preferred that Bonaparte, being once in the Presidential chair, be left in the Presidential chair, in order that everything might continue to run in the old ruts.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: VI.25.13
  kind: p
  original: Es empörte sie, daß ihr Parlament nicht offen die Konstitution brach und ohne Umstände abdankte.
  en: They felt indignant that their Parliament did not openly break the Constitution and resign without further ado.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: VI.26.1
  kind: p
  original: Die Generalräte der Departements, diese Provinzialvertretungen der großen Bourgeoisie, die während der Ferien der Nationalversammlung vom 25. August an tagten, erklärten sich fast einstimmig für die Revision, also gegen das Parlament und für Bonaparte.
  en: The General Councils of the Departments, these provisional representative bodies of the large bourgeoisie, who had adjourned during the vacation of the National Assembly since August 25, pronounced almost unanimously for revision, that is to say, against the Parliament and for Bonaparte.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: VI.27.1
  kind: p
  original: Noch unzweideutiger als den Zerfall mit ihren parlamentarischen Repräsentanten legte die Bourgeoisie ihre Wut über ihre literarischen Vertreter, über ihre eigne Presse an den Tag.
  en: Still more unequivocally than in its falling out with its Parliamentary Representatives, did the bourgeoisie exhibit its wrath at its literary Representatives, its own press.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: VI.27.2
  kind: p
  original: Die Verurteilungen zu unerschwinglichen Geldsummen und zu schamlosen Gefängnisstrafen durch die Bourgeois-Jurys für jeden Angriff der Bourgeois-Journalisten auf die Usurpationsgelüste Bonapartes, für jeden Versuch der Presse, die politischen Rechte der Bourgeoisie gegen die Exekutivgewalt zu verteidigen, setzten nicht nur Frankreich, sondern ganz Europa in Erstaunen.
  en: The verdicts of the bourgeois juries, inflicting excessive fines and shameless sentences of imprisonment for every attack of the bourgeois press upon the usurping aspirations of Bonaparte, for every attempt of the press to defend the political rights of the bourgeoisie against the Executive power, threw, not France alone, but all Europe into amazement.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '184'
- id: VI.28.1
  kind: p
  original: Wenn die parlamentarische Ordnungspartei, wie ich gezeigt habe, durch ihr Schreien nach Ruhe sich selbst zur Ruhe verwies, wenn sie die politische Herrschaft der Bourgeoisie für unverträglich mit der Sicherheit und dem Bestand der Bourgeoisie erklärte, indem sie im Kampfe gegen die andern Klassen der Gesellschaft alle Bedingungen ihres eignen Regimes, des parlamentarischen Regimes, mit eigner Hand vernichtete, so forderte dagegen die außerparlamentarischen Masse der Bourgeoisie durch ihre Servilität gegen den Präsidenten, durch ihre Schmähungen gegen das Parlament, durch die brutale Mißhandlung der eignen Presse Bonaparte auf, ihren sprechenden und schreibenden Teil, ihre Politiker und ihre Literaten, ihre Rednertribüne und ihre Presse zu unterdrücken, zu vernichten, damit sie nun vertrauensvoll unter dem Schutze einer starken und uneingeschränkten Regierung ihren Privatgeschäften nachgehen könne.
  en: While on the one hand, as I have indicated, the Parliamentary party of Order ordered itself to keep the peace by screaming for peace; and while it pronounced the political rule of the bourgeoisie irreconcilable with the safety and the existence of the bourgeoisie, by destroying with its own hands in its struggle with the other classes of society all the conditions for its own, the Parliamentary regime; on the other hand, the mass of the bourgeoisie, outside of the Parliament, urged Bonaparte--by its servility towards the President, by its insults to the Parliament, by the brutal treatment of its own press--to suppress and annihilate its speaking and writing organs, its politicians and its literati, its orators' tribune and its press, to the end that, under the protection of a strong and unhampered Government, it might ply its own private pursuits in safety.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 184-185
- id: VI.28.2
  kind: p
  original: Sie erklärte unzweideutig, daß sie ihre eigne politische Herrschaft loszuwerden schmachte, um die Mühen und Gefahren der Herrschaft loszuwerden.
  en: It declared unmistakably that it longed to be rid of its own political rule, in order to escape the troubles and dangers of ruling.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: VI.29.1
  kind: p
  original: Und sie, die sich schon gegen den bloß parlamentarischen und literarischen Kampf für die Herrschaft der eignen Klasse empört und die Führer dieses Kampfes verraten hatte, sie wagt jetzt nachträglich das Proletariat anzuklagen, daß es nicht zum blutigen Kampfe, zum Kampfe auf Leben und Tod für sie aufgestanden sei!
  en: And this bourgeoisie, that had rebelled against even the Parliamentary and literary contest for the supremacy of its own class, that had betrayed its leaders in this contest, it now has the effrontery to blame the proletariat for not having risen in its defence in a bloody struggle, in a struggle for life!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: VI.29.2
  kind: p
  original: Sie, die jeden Augenblick ihr allgemeines Klasseninteresse, d.h. ihr politisches Interesse dem borniertesten, schmutzigsten Privatinteresse aufopferte und an ihre Vertreter die Zumutung eines ähnlichen Opfers stellte, sie jammert jetzt, das Proletariat habe seine materiellen Interessen ihre idealen politischen Interessen geopfert.
  en: Those bourgeois, who at every turn sacrificed their common class interests to narrow and dirty private interests, and who demanded a similar sacrifice from their own Representatives, now whine that the proletariat has sacrificed their idea-political to its own material interests!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: VI.29.3
  kind: p
  original: Sie gebart sich als schöne Seele, die von dem durch Sozialisten irregeleiteten Proletariat verkannt und im entscheidenden Augenblicke verlassen worden sei.
  en: This bourgeois class now strikes the attitude of a pure soul, misunderstood and abandoned, at a critical moment, by the proletariat, that has been misled by the Socialists.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: VI.29.4
  kind: p
  original: Und sie findet ein allgemeines Echo in der bürgerlichen Welt.
  en: And its cry finds a general echo in the bourgeois world.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: VI.29.5
  kind: p
  original: Ich spreche natürlich hier nicht von deutschen Winkelpolitikern und Gesinnungslümmeln.
  en: Of course, I do not refer to German crossroad politicians and kindred blockheads.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: VI.29.6
  kind: p
  original: Ich verweise z.B. auf denselben "Economist", der noch am 29. November 1851, also vier Tage vor dem Staatsstreich, Bonaparte für die "Schildwache der Ordnung", die Thiers und Berryer aber für "Anarchisten" erklärt hatte und schon am 27. Dezember 1851, nachdem Bonaparte jene Anarchisten zur Ruhe gebracht hat, über den Verrat schreit, den "ignorante, unerzogne, stupide Proletariermassen an dem Geschick, der Kenntnis, der Disziplin, dem geistigen Einfluß, den intellektuellen Hülfsquellen und dem moralischen Gewicht der mittleren und höheren Gesellschaftsränge" verübt hätten.
  en: I refer, for instance, to the "Economist," which, as late as November 29, 1851, that is to say, four days before the "coup d'etat" pronounced Bonaparte the "Guardian of Order" and Thiers and Berryer "Anarchists," and as early as December 27, 1851, after Bonaparte had silenced those very Anarchists, cries out about the treason committed by "the ignorant, untrained and stupid proletaires against the skill, knowledge, discipline, mental influence, intellectual resources an moral weight of the middle and upper ranks."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: VI.29.7
  kind: p
  original: Die stupide, ignorante und gemeine Masse war niemand anders als die Bourgeoisie selbst.
  en: The stupid, ignorant and contemptible mass was none other than the bourgeoisie itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: VI.30.1
  kind: p
  original: Frankreich hatte allerdings im Jahre 1851 eine Art von kleiner Handelskrisis erlebt.
  en: France had, indeed; experienced a sort of commercial crisis in 1851.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: VI.30.2
  kind: p
  original: Ende Februar zeigte sich Verminderung des Exports gegen 1850, im März litt der Handel und schlossen sich die Fabriken, im April schien der Stand der industriellen Departements so verzweifelt wie nach den Februartagen, im Mai war das Geschäft noch nicht wieder aufgelebt, noch am 28. Juni zeigte das Portefeuille der Bank von Frankreich durch ein ungeheures Wachsen der Depositen und eine ebenso große Abnahme der Vorschüsse auf Wechsel den Stillstand der Produktion, und erst Mitte Oktober trat wieder eine progressive Besserung des Geschäfts ein.
  en: At the end of February, there was a falling off of exports as compared with 1850; in March, business languished and factories shut down; in April, the condition of the industrial departments seemed as desperate as after the February days; in May, business did not yet pick up; as late as June 28, the reports of the Bank of France revealed through a tremendous increase of deposits and an equal decrease of loans on exchange notes, the standstill of production; not until the middle of October did a steady improvement of business set in.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: VI.30.3
  kind: p
  original: Die französische Bourgeoisie erklärte sich diese Handelsstockung aus rein politischen Gründen, aus dem Kampfe zwischen dem Parlamente und der Exekutivgewalt, aus der Unsicherheit einer nur provisorischen Staatsform, aus der Schreckensaussicht auf den zweiten [Sonntag des Monats] Mai 1852.
  en: The French bourgeoisie accounted for this stagnation of business with purely political reasons; it imputed the dull times to the strife between the Parliament and the Executive power, to the uncertainty of a provisional form of government, to the alarming prospects of May 2, 1852.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 185-186
- id: VI.30.4
  kind: p
  original: Ich will nicht leugnen, daß alle diese Umstände einige Industriezweige in Paris und in den Departements herabdrückten.
  en: I shall not deny that all these causes did depress some branches of industry in Paris and in the Departments.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: VI.30.5
  kind: p
  original: Jedenfalls war aber diese Einwirkung der politischen Verhältnisse nur lokal und unerheblich.
  en: At any rate, this effect of political circumstances was only local and trifling.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: VI.30.6
  kind: p
  original: Bedarf es eines andern Beweises, als daß die Besserung des Handels gerade in dem Augenblicke eintrat, wo sich der politische Zustand verschlechterte, der politische Horizont verdunkelte und jeden Augenblick ein Blitzstrahl aus dem Elysium erwartet wurde, gegen Mitte Oktober?
  en: Is there any other proof needed than that the improvement in business set in at the very time when the political situation was growing worse, when the political horizon was growing darker, and when at every moment a stroke of lightning was expected out of the Elysee--in the middle of October?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: VI.30.7
  kind: p
  original: Der französische Bourgeois, dessen "Geschick, Kenntnis, geistige Einsicht und intellektuelle Hülfsquellen" nicht weiter reichen als seine Nase, konnte übrigens während der ganzen Dauer der Industrieausstellung in London mit der Nase auf die Ursache seiner Handelsmisere stoßen.
  en: The French bourgeois, whose "skill, knowledge, mental influence and intellectual resources," reach no further than his nose, could, moreover, during the whole period of the Industrial Exposition in London, have struck with his nose the cause of his own business misery.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: VI.30.8
  kind: p
  original: Während in Frankreich die Fabriken geschlossen wurden, brachen in England kommerzielle Bankerutte aus.
  en: At the same time that, in France, the factories were being closed, commercial failures broke out in England.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: VI.30.9
  kind: p
  original: Während der industrielle Panik im April und Mai einen Höhepunkt in Frankreich erreichte, erreichte der kommerzielle Panik April und Mai einen Höhepunkt in England.
  en: While the industrial panic reached its height during April and May in France, in England the commercial panic reached its height in April and May.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: VI.30.10
  kind: p
  original: Wie die französische litt die englische Wollindustrie, wie die französische die englische Seidenmanufaktur.
  en: The same as the French, the English woolen industries suffered, and, as the French, so did the English silk manufacture.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: VI.30.11
  kind: p
  original: Wenn die englischen Baumwollfabriken weiterarbeiteten, geschah es nicht mehr mit demselben Profit wie 1849 und 1850.
  en: Though the English cotton factories went on working, it, nevertheless, was not with the same old profit of 1849 and 1850.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: VI.30.12
  kind: p
  original: Der Unterschied war nur der, daß die Krise in Frankreich industriell, in England kommerziell, daß während in Frankreich die Fabriken stillsetzten, sie sich in England ausdehnten, aber unter ungünstigeren Bedingungen als in den vorhergehenden Jahren, daß in Frankreich der Export, in England der Import die Hauptschläge erhielt.
  en: 'The only difference was this: that in France, the crisis was an industrial, in England it was a commercial one; that while in France the factories stood still, they spread themselves in England, but under less favorable circumstances than they had done the years just previous; that, in France, the export, in England, the import trade suffered the heaviest blows.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: VI.30.13
  kind: p
  original: Die gemeinsame Ursache, die natürlich nicht innerhalb der Grenzen des französisch-politischen Horizonts zu suchen ist, war augenscheinlich.
  en: The common cause, which, as a matter of fact, is not to be looked for with-in the bounds of the French political horizon, was obvious.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: VI.30.14
  kind: p
  original: 1849 und 1850 waren Jahre der größten materiellen Prosperität und einer Überproduktion, die erst 1851 als solche hervortrat.
  en: The years 1849 and 1850 were years of the greatest material prosperity, and of an overproduction that did not manifest itself until 1851.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: VI.30.15
  kind: p
  original: Sie wurde im Anfang dieses Jahres durch die Aussicht auf die Industrieausstellung noch besonders befördert.
  en: 'This was especially promoted at the beginning of 1851 by the prospect of the Industrial Exposition; and, as special causes, there were added, first, the failure of the cotton crop of 1850 and 1851; second, the certainty of a larger cotton crop than was expected: first, the rise, then the sudden drop; in short, the oscillations of the cotton market.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.30.16
  kind: p
  original: 'Als eigentümliche Umstände kamen hinzu: erst der Mißwachs der Baumwollernte von 1850 und 1851, dann die Sicherheit einer größern Baumwollernte als erwartet war, erst das Steigen, dann das plötzliche Fallen, kurz die Schwankungen der Baumwollpreise.'
  en: ''
  joined_to: VI.30.15
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '186'
- id: VI.30.17
  kind: p
  original: Die Rohseidenernte war wenigstens in Frankreich noch unter dem Durchschnittsertrag ausgefallen.
  en: The crop of raw silk in France had been below the average.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: VI.30.18
  kind: p
  original: Die Wollenmanufaktur endlich hatte sich seit 1848 so sehr ausgedehnt, daß die Wollproduktion ihr nicht nachfolgen konnte und der Preis der Rohwolle in einem großen Mißverhältnisse zu dem Preise der Wollfabrikate stieg.
  en: Finally, the manufacture of woolen goods had received such an increment since 1849, that the production of wool could not keep step with it, and the price of the raw material rose greatly out of proportion to the price of the manufactured goods.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: VI.30.19
  kind: p
  original: Hier haben wir also in dem Rohmaterial von drei Weltmarktsindustrien schon dreifaches Material zu einer Handelsstockung.
  en: Accordingly, we have here in the raw material of three staple articles a threefold material for a commercial crisis.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '186'
- id: VI.30.20
  kind: p
  original: Von diesen besondern Umständen abgesehn, war die scheinbare Krise des Jahres 1851 nichts anders als ein Halt, den Überproduktion und Überspekulation jedesmal in der Beschreibung des industriellen Kreislaufes macht, bevor sie alle ihre Kraftmittel zusammenrafft, um fieberhaft den letzten Kreisabschnitt zu durchjagen und bei ihrem Ausgangspunkt, der allgemeinen Handelskrise, wieder anzulangen.
  en: Apart from these special circumstances, the seeming crisis of the year 1851 was, after all, nothing but the halt that overproduction and overspeculation make regularly in the course of the industrial cycle, before pulling all their forces together in order to rush feverishly over the last stretch, and arrive again at their point of departure--the General Commercial Crisis.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 186-187
- id: VI.30.21
  kind: p
  original: In solchen Intervallen der Handelsgeschichte brechen in England kommerzielle Bankerutte aus, während in Frankreich die Industrie selbst stillgesetzt wird, teils durch die gerade dann unerträglich werdende Konkurrenz der Engländer auf allen Märkten zum Rückzug gezwungen, teils als Luxusindustrie vorzugsweise von jeder Geschäftsstockung angegriffen.
  en: At such intervals in the history of trade, commercial failures break out in England, while, in France, industry itself is stopped, partly because it is compelled to retreat through the competition of the English, that, at such times becomes resistless in all markets, and partly because, as an industry of luxuries, it is affected with preference by every stoppage of trade.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: VI.30.22
  kind: p
  original: So macht Frankreich außer den allgemeinen Krisen seine eignen nationalen Handelskrisen durch, die jedoch weit mehr durch den allgemeinen Stand des Weltmarktes als durch französische Lokaleinflüsse bestimmt und bedingt werden.
  en: Thus, besides the general crisis, France experiences her own national crises, which, how-ever, are determined by and conditioned upon the general state of the world's market much more than by local French influences.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: VI.30.23
  kind: p
  original: Es wird nicht ohne Interesse sein, dem Vorurteil des französischen Bourgeois das Urteil des englischen Bourgeois gegenüberzustellen.
  en: It will not be devoid of interest to contrast the prejudgment of the French bourgeois with the judgment of the English bourgeois.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: VI.30.24
  kind: p
  original: 'Eins der größten Liverpooler Häuser schreibt in seinem Jahreshandelsbericht für 1851:'
  en: 'One of the largest Liverpool firms writes in its yearly report of trade for 1851: "Few years have more completely disappointed the expectations entertained at their beginning than the year that has just passed; instead of the great prosperity, that was unanimously looked forward to, it proved itself one of the most discouraging years during the last quarter of a century.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.31.1
  kind: p
  original: '"Wenige Jahre haben die bei ihrem Beginn gehegten Antizipationen mehr getäuscht als das eben abgelaufene; statt der großen Prosperität, der man einstimmig entgegensah, bewies es sich als eins der entmutigendsten Jahre seit einem Vierteljahrhundert.'
  en: ''
  joined_to: VI.30.24
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '187'
- id: VI.31.2
  kind: p
  original: Es gilt dies natürlich nur von den merkantilen, nicht von den industriellen Klassen.
  en: This applies, of course, only to the mercantile, not to the industrial classes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: VI.31.3
  kind: p
  original: 'Und doch waren sicherlich Gründe vorhanden, beim Beginne des Jahres auf das Gegenteil zu schließen; die Produktenvorräte waren spärlich, Kapital überflüssig, Nahrungsmittel wohlfeil, ein reicher Herbst war gesichert; ungebrochner Friede auf dem Kontinent und keine politischen oder finanziellen Störungen zu Hause: in der Tat, die Flügel des Handels waren nie fesselloser...'
  en: And yet, surely there were grounds at the beginning of the year from which to draw a contrary conclusion; the stock of products was scanty, capital was abundant, provisions cheap, a rich autumn was assured, there was uninterrupted peace on the continent and no political and financial disturbances at home; indeed, never were the wings of trade more unshackled....
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: VI.31.4
  kind: p
  original: Wem dies ungünstige Resultat zuschreiben?
  en: What is this unfavorable result to be ascribed to?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: VI.31.5
  kind: p
  original: Wir glauben dem Überhandel sowohl in Importen als Exporten.
  en: We believe to excessive trade in imports as well as exports.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: VI.31.6
  kind: p
  original: Wenn unsere Kaufleute nicht selbst ihre Tätigkeit engere Grenzen ziehen, kann uns nichts im Gleise halten als alle drei Jahr ein Panic."
  en: If our merchants do not themselves rein in their activity, nothing can keep us going, except a panic every three years."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '187'
- id: VI.32.1
  kind: p
  original: 'Man stelle sich nun den französischen Bourgeois vor, wie mitten in diesem Geschäftspanik sein handelskrankes Gehirn gefoltert, umschwirrt, betäubt wird von Gerüchten über Staatsstreiche und Herstellung des allgemeinen Wahlrechts, von dem Kampfe zwischen Parlament und Exekutivgewalt, von dem Frondekrieg der Orleanisten und Legitimisten, von kommunistischen Konspirationen in Südfrankreich, von angeblichen Jacquerien <Bauernaufständen> in den Nièvre- und Cher-Departements, von den Reklamen der verschiedenen Präsidentschaftskandidaten, von den marktschreierischen Losungen der Journale, von den Drohungen der Republikaner, mit den Waffen in der Hand die Konstitution und das allgemeine Stimmrecht behaupten zu wollen, von den Evangelien der emigrierten Helden in partibus, die den Weltuntergang für den zweiten [Sonntag des Monats] Mai 1852 anzeigten, und man begreift, daß der Bourgeois in dieser unsäglichen, geräuschvollen Konfusion von Fusion, Revision, Prorogation, Konstitution, Konspiration, Koalition, Emigration, Usurpation und Revolution seiner parlamentarischen Republik toll zuschnaubt: "Lieber ein Ende mit Schrecken als ein Schrecken ohn'' Ende!"'
  en: 'Imagine now the French bourgeois, in the midst of this business panic, having his trade-sick brain tortured, buzzed at and deafened with rumors of a "coup d''etat" and the restoration of universal suffrage; with the struggle between the Legislature and the Executive; with the Fronde warfare between Orleanists and Legitimists; with communistic conspiracies in southern France; with alleged Jacqueries in the Departments of Nievre and Cher; with the advertisements of the several candidates for President; with "social solutions" huckstered about by the journals; with the threats of the republicans to uphold, arms in hand, the Constitution and universal suffrage; with the gospels, according to the emigrant heroes "in partibus," who announced the destruction of the world for May 2,--imagine that, and one can understand how the bourgeois, in this unspeakable and noisy confusion of fusion, revision, prorogation, constitution, conspiracy, coalition, emigration, usurpation and revolution, blurts out at his parliamentary republic: "Rather an End With Fright, Than a Fright Without End."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 187-188
  en_note: 'De Leon''s note [2]: Peasant revolts'
- id: VI.33.1
  kind: p
  original: Bonaparte verstand diesen Schrei.
  en: Bonaparte understood this cry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: VI.33.2
  kind: p
  original: Sein Begriffsvermögen wurde geschärft durch den wachsenden Ungestüm von Gläubigern, die mit jedem Sonnenuntergang, der den Verfallstag, den zweiten [Sonntag des Monats] Mai 1852 näherrückte, einen Protest der Gestirnbewegungen gegen ihre irdischen Wechsel erblickten.
  en: His perspicacity was sharpened by the growing anxiety of the creditors' class, who, with every sunset, that brought nearer the day of payment, the 2d of May, 1852, saw in the motion of the stars a protest against their earthly drafts.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: VI.33.3
  kind: p
  original: Sie waren zu wahren Astrologen geworden.
  en: They had become regular astrologers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: VI.33.4
  kind: p
  original: Die Nationalversammlung hatte Bonaparte die Hoffnung auf konstitutionelle Prorogation seiner Gewalt abgeschnitten, die Kandidatur des Prinzen von Joinville gestattete kein längeres Schweigen.
  en: The National Assembly had cut off Bonaparte's hope of a constitutional prolongation of his term; the candidature of the Prince of Joinville tolerated no further vacillation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: VI.34.1
  kind: p
  original: Wenn je ein Ereignis lange vor seinem Eintritt seinen Schatten vor sich hergeworfen hat, so war es Bonapartes Staatsstreich.
  en: If ever an event cast its shadow before it long before its occurrence, it was Bonaparte's "coup d'etat."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: VI.34.2
  kind: p
  original: Schon am 29. Januar 1849, kaum einen Monat nach seiner Wahl, hatte er den Vorschlag dazu dem Changarnier gemacht.
  en: Already on January 29, 1849, barely a month after his election, he had made to Changarnier a proposition to that effect.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: VI.34.3
  kind: p
  original: Sein eigner Premierminister Odilon Barrot hatte im Sommer 1849 verhüllt, Thiers im Winter 1850 offen die Politik der Staatsstreiche denunziert.
  en: His own Prime Minister, Odillon Barrot, had covertly, in 1849, and Thiers openly in the winter of 1850, revealed the scheme of the "coup d'etat."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: VI.34.4
  kind: p
  original: Persigny hatte im Mai 1851 Changarnier noch einmal für den Coup zu gewinnen gesucht, der "Messager de l'Assemblée" hatte diese Unterhandlung veröffentlicht.
  en: In May, 1851, Persigny had again sought to win Changarnier over to the "coup," and the "Miessager de l'Assemblee" newspaper had published this conversation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: VI.34.5
  kind: p
  original: Die bonapartistischen Journale drohten bei jedem parlamentarischen Sturme mit einem Staatsstreich, und je näher die Krise rückte, desto lauter wurde ihr Ton.
  en: At every parliamentary storm, the Bonapartist papers threatened a "coup," and the nearer the crisis approached, all the louder grew their tone.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: VI.34.6
  kind: p
  original: In den Orgien, die Bonaparte jede Nacht mit männlichem und weiblichem swell mob <Hochstaplergesindel> feierte, sooft die Mitternachtsstunde heranrückte und reichliche Libationen die Zunge gelöst und die Phantasie erhitzt hatten, wurde der Staatsstreich für den folgenden Morgen beschlossen.
  en: At the orgies, that Bonaparte celebrated every night with a swell mob of males and females, every time the hour of midnight drew nigh and plenteous libations had loosened the tongues and heated the minds of the revelers, the "coup" was resolved upon for the next morning.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: VI.34.7
  kind: p
  original: Die Schwerter wurden gezogen, die Gläser klirrten, die Repräsentanten flogen zum Fenster hinaus, der Kaisermantel fiel auf die Schultern Bonapartes, bis der nächste Morgen wieder den Spuk vertrieb und das erstaunte Paris von wenig verschlossenen Vestalinnen und indiskreten Paladinen die Gefahr erfuhr, der es noch einmal entwischt war.
  en: Swords were then drawn, glasses clinked, the Representatives were thrown out at the windows, the imperial mantle fell upon the shoulders of Bonaparte, until the next morning again drove away the spook, and astonished Paris learned, from not very reserved Vestals and indiscreet Paladins, the danger it had once more escaped.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: VI.34.8
  kind: p
  original: In den Monaten September und Oktober überstürzten sich die Gerüchte von einem coup d'état.
  en: During the months of September and October, the rumors of a "coup d'etat" tumbled close upon one another's heels.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: VI.34.9
  kind: p
  original: Der Schatten nahm zugleich Farbe an, wie ein buntes Daguerreotyp.
  en: At the same time the shadow gathered color, like a confused daguerreotype.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '188'
- id: VI.34.10
  kind: p
  original: 'Man schlage die Monatsgänge für September und Oktober in den Organen der europäischen Tagespresse nach, und man wird wörtlich Andeutungen wie folgende finden: "Staatsstreichgerüchte erfüllen Paris.'
  en: 'Follow the issues of the European daily press for the months of September and October, and items like this will be found literally: "Rumors of a ''coup'' fill Paris.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 188-189
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.34.11
  kind: p
  original: Die Hauptstadt soll während der Nacht mit Truppen gefüllt werden und der andre Morgen Dekrete bringen, die die Nationalversammlung auflösen, das Departement der Seine in Belagerungszustand versetzen, das allgemeine Wahlrecht wiederherstellen, ans Volk appellieren.
  en: The capital, it is said, is to be filled with troops by night and the next morning decrees are to be issued dissolving the National Assembly, placing the Department of the Seine in state of siege restoring universal suffrage, and appealing to the people.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.34.12
  kind: p
  original: Bonaparte soll Minister für die Ausführung dieser illegalen Dekrete suchen."
  en: Bonaparte is rumored to be looking for Ministers to execute these illegal decrees."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.34.13
  kind: p
  original: Die Korrespondenzen, die diese Nachrichten bringen, enden stets verhängnisvoll mit "aufgeschoben".
  en: The newspaper correspondence that brought this news always close ominously with "postponed."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.34.14
  kind: p
  original: Der Staatsstreich war stets die fixe Idee Bonapartes.
  en: The "coup" was ever the fixed idea of Bonaparte.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.34.15
  kind: p
  original: Mit dieser Idee hatte er den französischen Boden wieder betreten.
  en: With this idea he had stepped again upon French soil.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.34.16
  kind: p
  original: Sie besaß ihn so sehr, daß er sie fortwährend verriet und ausplauderte.
  en: It had such full possession of him that he was constantly betraying and blabbing it out.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.34.17
  kind: p
  original: Er war so schwach, saß er sie ebenso fortwährend wieder aufgab.
  en: He was so weak that he was as constantly giving it up again.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.34.18
  kind: p
  original: Der Schatten des Staatsstreiches war den Parisern als Gespenst so familiär geworden, daß sie nicht an ihn glauben wollten, als er endlich in Fleisch und Blut erschien.
  en: The shadow of the "coup" had become so familiar a spectre to the Parisians, that they refused to believe it when it finally did appear in flesh and blood.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.34.19
  kind: p
  original: Es war also weder die verschlossene Zurückhaltung des Chefs der Gesellschaft vom 10. Dezember, noch eine ungeahnte Überrumpelung von seiten der Nationalversammlung, was den Staatsstreich gelingen ließ.
  en: Consequently, it was neither the reticent backwardness of the chief of the "Society of December 10," nor an unthought of surprise of the National Assembly that caused the success of the "coup."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.34.20
  kind: p
  original: Wenn er gelang, gelang er trotz seiner Indiskretion und mit ihrem Vorwissen, ein notwendiges, unvermeidliches Resultat der vorhergegangenen Entwicklung.
  en: When it succeeded, it did so despite his indiscretion and with its anticipation--a necessary, unavoidable result of the development that had preceded.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.35.1
  kind: p
  original: Am 10. Oktober kündete Bonaparte seinen Ministern den Entschluß an, das allgemeine Wahlrecht wiederherstellen zu wollen, am 16. gaben sie ihre Entlassung, am 26. erfuhr Paris die Bildung des Ministeriums Thorigny.
  en: On October 10, Bonaparte announced to his Ministers his decision to restore universal suffrage; on the 16th day they handed in their resignations; on the 26th Paris learned of the formation of the Thorigny Ministry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.35.2
  kind: p
  original: Der Polizeipräfekt Carlier wurde gleichzeitig durch Maupas ersetzt, der Chef der ersten Militärdivision, Magnan, zog die zuverlässigsten Regimenter in der Hauptstadt zusammen.
  en: The Prefect of Police, Carlier, was simultaneously replaced by Maupas; and the chief of the First Military Division Magnan, concentrated the most reliable regiments in the capital.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.35.3
  kind: p
  original: Am 4. November eröffnete die Nationalversammlung wieder ihre Sitzungen.
  en: On November 4, the National Assembly re-opened its sessions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.35.4
  kind: p
  original: Sie hatte nichts mehr zu tun, als in einem kurzen bündigen Repetitorium des Kursus, den sie durchgemacht hatte, zu wiederholen und zu beweisen, das sie erst begraben wurde, nachdem sie gestorben war.
  en: There was nothing left for it to do but to repeat, in short recapitulation, the course it had traversed, and to prove that it had been buried only after it had expired.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.36.1
  kind: p
  original: Der erste Posten, des sie im Kampf mit der Exekutivgewalt eingebüßt hatte, war das Ministerium.
  en: The first post that it had forfeited in the struggle with the Executive was the Ministry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.36.2
  kind: p
  original: Sie mußte diesen Verlust feierlich eingestehn, indem sie das Ministerium Thorigny, ein bloßes Scheinministerium, als voll hinnahm.
  en: It had solemnly to admit this loss by accepting as genuine the Thorigny Ministry, which was but a pretence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.36.3
  kind: p
  original: Die Permanenzkommission hatte Herrn Giraud mit Lachen empfangen, als er sich im Namen der neuen Minister vorstellte.
  en: The permanent Committee had received Mr. Giraud with laughter when he introduced himself in the name of the new Ministers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.36.4
  kind: p
  original: Ein so schwaches Ministerium für so starke Maßregeln wie die Wiederherstellung des allgemeinen Wahlrechts!
  en: So weak a Ministry for so strong a measure as the restoration of universal suffrage!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.36.5
  kind: p
  original: Aber es handelte sich eben darum, nichts im Parlament, alles gegen das Parlament durchzusetzen.
  en: The question, however, then was to do nothing in, everything against the parliament.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '189'
- id: VI.37.1
  kind: p
  original: Gleich am ersten Tag ihrer Wiedereröffnung erhielt die Nationalversammlung die Botschaft Bonapartes, worin er Wiederherstellung des allgemeinen Wahlrechts und Abschaffung des Gesetzes vom 31. Mai 1850 verlangte.
  en: On the very day of its re-opening, the National Assembly received the message from Bonaparte demanding the restoration of universal suffrage and the repeal of the law of May 31, 1850.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 189-190
- id: VI.37.2
  kind: p
  original: Seine Minister brachten an demselben Tage ein Dekret in diesem Sinne ein.
  en: On the same day, his Ministers introduced a decree to that effect.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: VI.37.3
  kind: p
  original: Die Versammlung verwarf den Dringlichkeitsantrag der Minister sofort und das Gesetz selbst am 13. November, mit 355 gegen 348 Stimmen.
  en: The Assembly promptly rejected the motion of urgency made by the Ministers, but repealed the law itself, on November 13, by a vote of 355 against 348.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: VI.37.4
  kind: p
  original: Sie zerriß so noch einmal ihr Mandat, sie bestätigte noch einmal, daß sie sich aus der freigewählten Repräsentation des Volkes in das usurpatorische Parlament einer Klasse verwandelt, sie bekannte noch einmal, daß sie selbst die Muskeln entzweigeschnitten hatte, die den parlamentarischen Kopf mit dem Körper der Nation verbanden.
  en: Thus it once more tore to pieces its own mandate, once more certified to the fact that it had transformed itself from a freely chosen representative body of the nation into the usurpatory parliament of a class; it once more admitted that it had itself severed the muscles that connected the parliamentary head with the body of the nation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: VI.38.1
  kind: p
  original: Wenn die Exekutivgewalt durch ihren Antrag auf Wiederherstellung des allgemeinen Wahlrechts von der Nationalversammlung an das Volk, appellierte die gesetzgebende Gewalt durch ihre Quästorenbill von dem Volke an die Armee.
  en: While the Executive power appealed from the National Assembly to the people by its motion for the restoration of universal suffrage, the Legislative power appealed from the people to the Army by its "Questors' Bill."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: VI.38.2
  kind: p
  original: Diese Quästorenbill sollte ihr Recht auf unmittelbare Requisition der Truppen, auf Bildung einer parlamentarischen Armee festsetzen.
  en: This bill was to establish its right to immediate requisitions for troops, to build up a parliamentary army.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: VI.38.3
  kind: p
  original: Wenn sie so die Armee zum Schiedsrichter zwischen sich und dem Volke, zwischen sich und Bonaparte ernannte, wenn sie die Armee als entscheidende Staatsgewalt anerkannte, mußte sie andererseits bestätigen, daß sie längst den Anspruch auf Herrschaft über dieselbe aufgegeben habe.
  en: By thus appointing the Army umpire between itself and the people, between itself and Bonaparte; by thus recognizing the Army as the decisive power in the State, the National Assembly was constrained to admit that it had long given up all claim to supremacy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: VI.38.4
  kind: p
  original: Indem sie, statt sofort Truppen zu requirieren, das Recht der Requisition debattierte, verriet sie den Zweifel an ihrer eignen Macht.
  en: By debating the right to make requisitions for troops, instead of forthwith collecting them, it betrayed its own doubts touching its own power.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: VI.38.5
  kind: p
  original: Indem sie die Quästorenbill verwarf, gestand sie offen ihre Ohnmacht.
  en: By thus subsequently rejecting the "Questors' Bill," it publicly confessed it impotence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: VI.38.6
  kind: p
  original: Diese Bill fiel durch mit einer Minorität von 108 Stimmen, die Montagne hatte so den Ausschlag gegeben.
  en: The bill fell through with a minority of 108 votes; the Mountain had, accordingly, thrown the casting vote.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: VI.38.7
  kind: p
  original: Sie befand sich in der Lage von Buridans Esel, zwar nicht zwischen zwei Säcken Heu, um zu entscheiden welcher der anziehendere, wohl aber zwischen zwei Trachten Prügel, um zu entscheiden, welche die härtere sei.
  en: It now found itself in the predicament of Buridan's donkey, not, indeed, between two sacks of hay, forced to decide which of the two was the more attractive, but between two showers of blows, forced to decide which of the two was the harder; fear of Changarnier, on one side, fear of Bonaparte, on the other.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: VI.38.8
  kind: p
  original: Auf der einen Seite die Furcht vor Changarnier, auf der andern die Furcht vor Bonaparte.
  en: ''
  joined_to: VI.38.7
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '190'
- id: VI.38.9
  kind: p
  original: Man muß gestehn, daß die Lage keine heroische war.
  en: It must be admitted the position was not a heroic one.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: VI.39.1
  kind: p
  original: Am 18. November wurde zu dem von der Ordnungspartei eingebrachten Gesetz über die Kommunalwahl das Amendement gestellt, daß statt drei Jahre ein Jahr Domizil für die Kommunalwähler genügen solle.
  en: On November 18, an amendment was moved to the Act, passed by the party of Order, on municipal elections to the effect that, instead of three years, a domicile of one year should suffice.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: VI.39.2
  kind: p
  original: Das Amendement fiel mit einer einzigen Stimme durch, aber diese eine Stimme stellte sich sofort als ein Irrtum heraus.
  en: The amendment was lost by a single vote--but this vote, it soon transpired, was a mistake.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: VI.39.3
  kind: p
  original: Die Ordnungspartei hatte durch Zersplitterung in ihre feindlichen Fraktionen längst ihre selbständig-parlamentarische Majorität eingebüßt.
  en: Owing to the divisions within its own hostile factions, the party of Order had long since forfeited its independent parliamentary majority.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: VI.39.4
  kind: p
  original: Sie zeigte jetzt, daß überhaupt keine Majorität im Parlament mehr vorhanden war.
  en: It was now plain that there was no longer any majority in the parliament.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: VI.39.5
  kind: p
  original: Die Nationalversammlung war beschlußunfähig geworden.
  en: The National Assembly had become impotent even to decide.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: VI.39.6
  kind: p
  original: Ihre atomistischen Bestandteile hingen durch keine Kohäsionskraft mehr zusammen, sie hatte ihren letzten Lebensatem verbraucht, sie war tot.
  en: Its atomic parts were no longer held together by any cohesive power; it had expended its last breath, it was dead.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '190'
- id: VI.40.1
  kind: p
  original: Die außerparlamentarische Masse der Bourgeoisie endlich sollte ihren Bruch mit der Bourgeoisie im Parlamente noch einmal einige Tage vor der Katastrophe feierlich bestätigen.
  en: Finally, the mass of the bourgeoisie outside of the parliament was once more solemnly to confirm its rupture with the bourgeoisie inside of the parliament a few days before the catastrophe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 190-191
- id: VI.40.2
  kind: p
  original: Thiers, als parlamentarischer Held vorzugsweise von der unheilbaren Krankheit des parlamentarischen Kretinismus angesteckt, hatte nach dem Tode des Parlaments eine neue parlamentarische Intrige mit dem Staatsrate ausgeheckt, ein Verantwortlichkeitsgesetz, das den Präsidenten in die Schranken der Verfassung festbannen sollte.
  en: Thiers, as a parliamentary hero conspicuously smitten by that incurable disease--Parliamentary Idiocy--, had hatched out jointly with the Council of State, after the death of the parliament, a new parliamentary intrigue in the shape of a "Responsibility Law," that was intended to lock up the President within the walls of the Constitution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: VI.40.3
  kind: p
  original: Wie Bonaparte am 15. September bei Grundlegung zu den neuen Markthallen von Paris die dames des halles, die Fischweiber, als zweiter Masinielllo bezaubert hatte - allerdings wog ein Fischweib an realer Gewalt 17 Burggrafen auf -, wie er nach Vorlegung der Quästorenbill die in dem Elysée traktierten Leutnants begeisterte, so riß er jetzt am 25. November die industrielle Bourgeoisie mit sich fort, die im Zirkus versammelt war, um aus seiner Hand Preismedaillen für die Londoner Industrieausstellung entgegenzunehmen.
  en: The same as, on September 15, Bonaparte bewitched the fishwives, like a second Massaniello, on the occasion of laying the corner-stone for the Market of Paris,--though, it must be admitted, one fishwife was equal to seventeen Burgraves in real power--; the same as, after the introduction of the "Questors' Bill," he enthused the lieutenants, who were being treated at the Elysee;--so, likewise, did he now, on November 25, carry away with him the industrial bourgeoisie, assembled at the Circus, to receive from his hands the prize-medals that had been awarded at the London Industrial Exposition.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: VI.40.4
  kind: p
  original: 'Ich gebe den bezeichnenden Teil seiner Rede nach dem "Journal des Débats":'
  en: 'I here reproduce the typical part of his speech, from the "Journal des Debats":'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: VI.41.1
  kind: p
  original: '"Mit solch unverhofften Erfolgen bin ich berechtigt zu wiederholen, wie groß die französische Republik sein würde, wenn es ihr gestattet wäre, ihre realen Interessen zu verfolgen und ihre Institutionen zu reformieren, statt beständig gestört zu werden einerseits durch die Demagogen, andererseits durch die monarchischen Halluzinationen.'
  en: '"With such unhoped for successes, I am justified to repeat how great the French republic would be if she were only allowed to pursue her real interests, and reform her institutions, instead of being constantly disturbed in this by demagogues, on one side, and, on the other, by monarchic hallucinations.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: VI.41.2
  kind: p
  original: (Lauter, stürmischer und wiederholter Applaus von jedem Teil des Amphitheaters.)
  en: (Loud, stormy and continued applause from all parts of the amphitheater).
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: VI.41.3
  kind: p
  original: Die monarchischen Halluzinationen verhindern allen Fortschritt und alle ernsten Industriezweige.
  en: The monarchic hallucinations hamper all progress and all serious departments of industry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: VI.41.4
  kind: p
  original: Statt des Fortschritts nur Kampf.
  en: Instead of progress, we have struggle only.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: VI.41.5
  kind: p
  original: Man sieht Männer, die früher die eifrigsten Stützen der königlichen Autorität und Prärogative waren, Parteigänger eines Konvents werden, bloß um die Autorität zu schwächen, die aus dem allgemeinen Stimmrecht entsprungen ist. (Lauter und wiederholter Applaus.)
  en: Men, formerly the most zealous supporters of royal authority and prerogative, become the partisans of a convention that has no purpose other than to weaken an authority that is born of universal suffrage. (Loud and prolonged applause).
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: VI.41.6
  kind: p
  original: Wir sehen Männer, die am meisten von der Revolution gelitten und sie am meisten bejammert haben, eine neue provozieren, und nur um den Willen der Nation zu fesseln...
  en: We see men, who have suffered most from the revolution and complained bitterest of it, provoking a new one for the sole purpose of putting fetters on the will of the nation....
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: VI.41.7
  kind: p
  original: Ich verspreche Euch Ruhe für die Zukunft etc. etc. (Bravo, Bravo, stürmisches Bravo)"
  en: I promise you peace for the future." (Bravo! Bravo! Stormy bravos.)
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: VI.42.1
  kind: p
  original: So klatscht die industrielle Bourgeoisie dem Staatsstreich vom 2. Dezember, der Vernichtung des Parlaments, dem Untergang ihrer eignen Herrschaft, der Diktatur Bonapartes ihr serviles Bravo zu.
  en: Thus the industrial bourgeoisie shouts its servile "Bravo!" to the "coup d'etat" of December 2, to the destruction of the parliament, to the downfall of their own reign, to the dictatorship of Bonaparte.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: VI.42.2
  kind: p
  original: Der Beifallsdonner vom 25. November erhielt seine Antwort in dem Kanonendonner vom 4. Dezember, und das Haus des Herrn Sallandrouze, der die meisten Bravos geklatscht hatte, wurde von den meisten Bomben zerklatscht.
  en: The rear of the applause of November 25 was responded to by the roar of cannon on December 4, and the house of Mr. Sallandrouze, who had been loudest in applauding, was the one demolished by most of the bombs.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: VI.43.1
  kind: p
  original: Cromwell, als er das Lange Parlament auflöste, begab sich allein in die Mitte desselben, zog seine Uhr heraus, damit es keine Minute über die von ihm festgesetzte Frist fortexistiere, und verjagte jedes einzelne Parlamentsmitglied mit heiter humoristischen Schmähungen.
  en: Cromwell, when he dissolved the Long Parliament, walked alone into its midst, pulled out his watch in order that the body should not continue to exist one minute beyond the term fixed for it by him, and drove out each individual member with gay and humorous invectives.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: VI.43.2
  kind: p
  original: Napoleon, kleiner als sein Vorbild, begab sich am 18. Brumaire wenigstens in den gesetzgebenden Körper und verlaß ihm, wenn auch mit beklommener Stimme, sein Todesurteil.
  en: Napoleon, smaller than his prototype, at least went on the 18th Brumaire into the legislative body, and, though in a tremulous voice, read to it its sentence of death.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '191'
- id: VI.43.3
  kind: p
  original: Der zweite Bonaparte, der sich übrigens im Besitz einer ganz andern Exekutivgewalt befand als Cromwell oder Napoleon, suchte sein Vorbild nicht in den Annalen der Weltgeschichte, sondern in den Annalen der Gesellschaft vom 10. Dezember, in den Annalen der Kriminalgeschichte.
  en: The second Bonaparte, who, moreover, found himself in possession of an executive power very different from that of either Cromwell or Napoleon, did not look for his model in the annals of universal history, but in the annals of the "Society of December 10," in the annals of criminal jurisprudence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 191-192
- id: VI.43.4
  kind: p
  original: Er bestiehlt die Bank von Frankreich um 25 Millionen Francs, kauft den General Magnan mit einer Million, die Soldaten Stück für Stück mit 15 Francs und mit Schnaps, findet sich wie ein Dieb in der Nacht mit seinen Spießgesellen heimlich zusammen, läßt in die Häuser der gefährlichsten Parlamentsführer einbrechen und Cavaignac, Lamoricière, Le Flô, Changarnier, Charras, Thiers, Baze etc. aus ihren Betten entführen, die Hauptplätze von Paris sowie das Parlamentsgebäude mit Truppen besetzen und früh am Morgen marktschreierische Plakate an allen Mauern anschlagen, worin die Auflösung der Nationalversammlung und des Staatsrats, die Wiederherstellung des allgemeinen Wahlrechts und die Versetzung des Seine-Departements in Belagerungszustand verkündet werden.
  en: He robs the Bank of France of twenty-five million francs; buys General Magnan with one million and the soldiers with fifteen francs and a drink to each; comes secretly together with his accomplices like a thief by night; has the houses of the most dangerous leaders in the parliament broken into; Cavalignac, Lamorciere, Leflo, Changarnier, Charras, Thiers, Baze, etc., taken out of their beds; the principal places of Paris, the building of the parliament included, occupied with troops; and, early the next morning, loud-sounding placards posted on all the walls proclaiming the dissolution of the National Assembly and of the Council of State, the restoration of universal suffrage, and the placing of the Department of the Seine under the state of siege.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: VI.43.5
  kind: p
  original: So rückt er kurz nachher ein falsche Dokument in den "Moniteur" ein, wonach einflußreiche parlamentarische Namen sich in einer Staatskonsulta um ihn gruppiert hätten.
  en: In the same way he shortly after sneaked into the "Moniateur" a false document, according to which influential parliamentary names had grouped themselves round him in a Committee of the Nation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: VI.44.1
  kind: p
  original: 'Das im Mairiegebäude des 10. Arrondissements versammelte Rumpfparlament, hauptsächlich aus Legitimisten und Orleanisten bestehend, beschließt unter dem wiederholten Rufe: "Es lebe die Republik", die Absetzung Bonapartes, harangiert umsonst die vor dem Gebäude gaffende Masse und wird endlich unter dem Geleite afrikanischer Scharfschützen erst in die Kaserne d''Orsay geschleppt, später in Zellenwagen verpackt und nach den Gefängnissen von Mazas, Ham und Vincennes transportiert.'
  en: Amidst cries of "Long live the Republic!", the rump-parliament, assembled at the Mayor's building of the Tenth Arrondissement, and composed mainly of Legitimists and Orleanists, resolves to depose Bonaparte; it harangues in vain the gaping mass gathered before the building, and is finally dragged first, under the escort of African sharpshooters, to the barracks of Orsay, and then bundled into convicts' wagons and transported to the prisons of Mazas, Ham and Vincennes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: VI.44.2
  kind: p
  original: So endet die Ordnungspartei, die legislative Versammlung und die Februarrevolution.
  en: Thus ended the party of Order, the Legislative Assembly and the February revolution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '192'
- id: VI.44.3
  kind: p
  original: 'Ehe wir zum Schluß eilen, kurz das Schema ihrer Geschichte:'
  en: 'Before hastening to the end, let us sum up shortly the plan of its history:'
  modern: ''
  modern_status: empty
  notes: ''
