- id: VII.34.1
  kind: p
  original: Von den widersprechenden Forderungen dieser Situation gejagt, zugleich wie ein Taschenspieler in der Notwendigkeit, durch beständige Überraschung die Augen des Publikums auf sich als den Ersatzmann Napoleons gerichtet zu halten, also jeden Tag einen Staatsstreich en miniature zu verrichten, bringt Bonaparte die ganze bürgerliche Wirtschaft in Wirrwarr, tastet alles an, was der Revolution von 1848 unantastbar schien, macht die einen revolutionsgeduldig, die andern revolutionslustig und erzeugt die Anarchie selbst im Namen der Ordnung, während er zugleich der ganzen Staatsmaschine den Heiligenschein abstreift, sie profaniert, sie zugleich ekelhaft und lächerlich macht.
  en: Harassed by the contradictory demands of his situation, and compelled, like a sleight-of-hands performer, to keep, by means of constant surprises, the eyes of the public riveted upon himself as the substitute of Napoleon, compelled, consequently, everyday to accomplish a sort of "coup" on a small scale, Bonaparte throws the whole bourgeois social system into disorder; he broaches everything that seemed unbroachable by the revolution of 1848; he makes one set people patient under the revolution and another anxious for it; he produces anarchy itself in the name of order by rubbing off from the whole machinery of Government the veneer of sanctity, by profaning it, by rendering it at once nauseating and laughable.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '207'
- id: VII.34.2
  kind: p
  original: Den Kultus des heiligen Rocks zu Trier wiederholt er zu Paris im Kultus des napoleonischen Kaisermantels.
  en: He rehearses in Paris the cult of the sacred coat of Trier with the cult of the Napoleonic Imperial mantle.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '207'
- id: VII.34.3
  kind: p
  original: Aber wenn der Kaisermantel endlich auf die Schultern des Louis Bonaparte fällt, wird das eherne Standbild Napoleons von der Höhe der Vendôme-Säule herabstürzen.
  en: But when the Imperial Mantle shall have finally fallen upon the shoulders of Louis Bonaparte, then will also the iron statue of Napoleon drop down from the top of the Vendome column.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '207'
  en_note: 'De Leon''s note [16]: A prophecy that a few years later, after Bonaparte''s coronation as Emperor, was literally fulfilled. By order of Emperor Louis Napoleon, the military statue of the Napoleon that originally surmounted the Vendome was taken down and replaced by one of first Napoleon in imperial robes.'
