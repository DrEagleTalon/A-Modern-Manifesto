  mew_page: 206-207
- id: VII.33.13
  kind: p
  original: 'Als Guizot zur Zeit seines Ministeriums diesen Granier in einem Winkelblatte gegen die dynastische Opposition verwandte, pflegte er ihn mit der Wendung zu rühmen: "C''est le roi des drôles", "das ist der Narrenkönig".'
  en: 'When Guizot, at the time he was Minister, employed this Granier on an obscure sheet against the dynastic opposition, he used to praise him with the term: "C''est le roi des droles."'
  modern: ''
  modern_status: empty
  notes: ''
