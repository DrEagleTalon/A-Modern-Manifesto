- id: III.1.1
  kind: p
  original: Am 28. Mai 1849 trat die gesetzgebende Nationalversammlung zusammen.
  en: On May 29, 1849, the legislative National Assembly convened.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: III.1.2
  kind: p
  original: Am 2. Dezember 1851 ward sie gesprengt.
  en: On December 2, 1851, it was broken up.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: III.1.3
  kind: p
  original: Diese Periode umfaßt die Lebensdauer der konstitutionellen oder parlamentarischen Republik.
  en: This period embraces the term of the Constitutional or Parliamentary public.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: III.2.1
  kind: p
  original: In der ersten französischen Revolution folgt auf die Herrschaft der Konstitutionellen die Herrschaft der Girondins und auf die Herrschaft der Girondins die Herrschaft der Jakobiner.
  en: In the first French revolution, upon the reign of the Constitutionalists succeeds that of the Girondins; and upon the reign of the Girondins follows that of the Jacobins.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: III.2.2
  kind: p
  original: Jede dieser Parteien stützt sich auf die fortgeschrittenere.
  en: Each of these parties in succession rests upon its more advanced element.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: III.2.3
  kind: p
  original: Sobald sie die Revolution weit genug geführt hat, um ihr nicht mehr zu folgen, noch weniger ihr vorangehen zu können, wird sie von dem kühneren Verbündeten, der hinter ihr steht, beiseite geschoben und auf die Guillotine geschickt.
  en: So soon as it has carried the revolution far enough not to be able to keep pace with, much less march ahead of it, it is shoved aside by its more daring allies, who stand behind it, and it is sent to the guillotine.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: III.2.4
  kind: p
  original: Die Revolution bewegt sich so in aufsteigender Linie.
  en: Thus the revolution moves along an upward line.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: III.3.1
  kind: p
  original: Umgekehrt die Revolution von 1848.
  en: Just the reverse in 1848.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: III.3.2
  kind: p
  original: Die proletarische Partei erscheint als Anhang der kleinbürgerlich-demokratischen.
  en: The proletarian party appears as an appendage to the small traders' or democratic party; it is betrayed by the latter and allowed to fall on April 16, May 15, and in the June days.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: III.3.3
  kind: p
  original: Sie wird von ihr verraten und fallengelassen am 16. April, am 15. Mai und in den Junitagen.
  en: ''
  joined_to: III.3.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '135'
- id: III.3.4
  kind: p
  original: Die demokratische Partei ihrerseits lehnt sich auf die Schultern der bourgeois-republikanischen.
  en: In its turn, the democratic party leans upon the shoulders of the bourgeois republicans; barely do the bourgeois republicans believe themselves firmly in power, than they shake off these troublesome associates for the purpose of themselves leaning upon the shoulders of the party of Order.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: III.3.5
  kind: p
  original: Die Bourgeois-Republikaner glauben kaum fest zu stehen, als sie den lästigen Kameraden abschütteln und sich selbst auf die Schultern der Ordnungspartei stützen.
  en: ''
  joined_to: III.3.4
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '135'
- id: III.3.6
  kind: p
  original: Die Ordnungspartei zieht ihre Schultern ein, läßt die Bourgeois-Republikaner purzeln und wirft sich auf die Schultern der bewaffneten Gewalt.
  en: The party of Order draws in its shoulders, lets the bourgeois republicans tumble down heels over head, and throws itself upon the shoulders of the armed power.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: III.3.7
  kind: p
  original: Sie glaubt noch auf ihren Schultern zu sitzen, als sie an einem schönen Morgen bemerkt, daß sich die Schultern in Bajonette verwandelt haben.
  en: Finally, still of the mind that it is sustained by the shoulders of the armed power, the party of Order notices one fine morning that these shoulders have turned into bayonets.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: III.3.8
  kind: p
  original: Jede Partei schlägt von hinten aus nach der weiterdrängenden und lehnt sich von vorn über auf die zurückdrängende.
  en: Each party kicks backward at those that are pushing forward, and leans forward upon those that are crowding backward; no wonder that, in this ludicrous posture, each loses its balance, and, after having cut the unavoidable grimaces, breaks down amid singular somersaults.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: III.3.9
  kind: p
  original: Kein Wunder, daß sie in dieser lächerlichen Positur das Gleichgewicht verliert und, nachdem sie die unvermeidlichen Grimassen geschnitten, unter seltsamen Kapriolen zusammenstürzt.
  en: ''
  joined_to: III.3.8
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '135'
- id: III.3.10
  kind: p
  original: Die Revolution bewegt sich so in absteigender Linie.
  en: Accordingly, the revolution moves along a downward line.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: III.3.11
  kind: p
  original: Sie befindet sich in dieser rückgängigen Bewegung, ehe die letzte Februarbarrikade weggeräumt und die erste Revolutionsbehörde konstituiert ist.
  en: It finds itself in this retreating motion before the last February-barricade is cleared away, and the first governmental authority of the revolution has been constituted.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '135'
- id: III.4.1
  kind: p
  original: 'Die Periode, die wir vor uns haben, umfaßt das bunteste Gemisch schreiender Widersprüche: Konstitutionelle, die offen gegen die Konstitution konspirieren, Revolutionäre, die eingestandenermaßen konstitutionell sind, eine Nationalversammlung, die allmächtig sein will und stets parlamentarisch bleibt; eine Montagne, die im Dulden ihren Beruf findet und durch die Prophezeiung künftiger Siege ihre gegenwärtige Niederlagen pariert; Royalisten, die die patres conscripti <erwählten Väter (Ehrenname der altrömischen Senatoren)> der Republik bilden und durch die Situation gezwungen werden, die feindlichen Königshäuser, denen sie anhängen, im Auslande, und die Republik, die sie hassen, in Frankreich zu halten; eine Exekutivgewalt, die in ihrer Schwäche selbst ihre Kraft und in der Verachtung, die sie einflößt, ihre Respektabilität findet, eine Republik; die nichts anderes ist als die zusammengesetzte Infamie zweier Monarchien, der Restauration und der Julimonarchie, mit einer imperialistischen Etikette - Verbindungen, deren erste Klausel die Trennung, Kämpfe, deren erstes Gesetz die Entscheidungslosigkeit ist, im Namen der Ruhe wüste, inhaltslose Agitation, im Namen der Revolution feierlichstes Predigen der Ruhe, Leidenschaften ohne Wahrheit, Wahrheiten ohne Leidenschaft, Helden ohne Heldentaten, Geschichte ohne Ereignisse; Entwickelung, deren einzige Triebkraft der Kalender scheint, durch beständige Wiederholung derselben Spannungen und Abspannung ermüdend; Gegensätze, die sich selbst periodisch nur auf die Höhe zu treiben scheinen, um sich abzustumpfen und zusammenzufallen, ohne sich auflösen zu können; prätentiös zur Schau getragene Anstrengungen und bürgerliche Schrecken vor der Gefahr des Weltunterganges, und von den Weltrettern gleichzeitig die kleinlichsten Intrigen und Hofkomödien gespielt, die in ihrem laisser-aller <ihrer Unbekümmertheit> weniger an den Jüngsten Tag als an die Zeiten der Fronde erinnern - das offizielle Gesamtgenie Frankreichs von der pfiffigen Dummheit eines einzelnen Individuums zuschanden gemacht; der Gesamtwille der Nation, sooft er im allgemeinen Wahlrecht spricht, in den verjährten Feinden der Masseninteressen seinen entsprechenden Ausdruck suchend, bis er ihn endlich in dem Eigenwillen eines Flibustiers findet.'
  en: 'The period we now have before us embraces the motliest jumble of crying contradictions: constitutionalists, who openly conspire against the Constitution; revolutionists, who admittedly are constitutional; a National Assembly that wishes to be omnipotent yet remains parliamentary; a Mountain, that finds its occupation in submission, that parries its present defeats with prophecies of future victories; royalists, who constitute the "patres conscripti" of the republic, and are compelled by the situation to uphold abroad the hostile monarchic houses, whose adherents they are, while in France they support the republic that they hate; an Executive power that finds its strength in its very weakness, and its dignity in the contempt that it inspires; a republic, that is nothing else than the combined infamy of two monarchies--the Restoration and the July Monarchy--with an imperial label; unions, whose first clause is disunion; struggles, whose first law is in-decision; in the name of peace, barren and hollow agitation; in the name of the revolution, solemn sermonizings on peace; passions without truth; truths without passion; heroes without heroism; history without events; development, whose only moving force seems to be the calendar, and tiresome by the constant reiteration of the same tensions and relaxes; contrasts, that seem to intensify themselves periodically, only in order to wear themselves off and collapse without a solution; pretentious efforts made for show, and bourgeois frights at the danger of the destruction of the world, simultaneous with the carrying on of the pettiest intrigues and the performance of court comedies by the world''s saviours, who, in their "laisser aller," recall the Day of Judgment not so much as the days of the Fronde; the official collective genius of France brought to shame by the artful stupidity of a single individual; the collective will of the nation, as often as it speaks through the general suffrage, seeking its true expression in the prescriptive enemies of the public interests until it finally finds it in the arbitrary will of a filibuster.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 135-136
- id: III.4.2
  kind: p
  original: Wenn irgendein Geschichtsausschnitt grau in grau gemalt ist, so ist es dieser.
  en: If ever a slice from history is drawn black upon black, it is this.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
- id: III.4.3
  kind: p
  original: Menschen und Ereignisse erscheinen als umgekehrte Schlemihle, als Schatten, denen die Körper abhanden gekommen ist.
  en: Men and events appear as reversed "Schlemihls," as shadows, the bodies of which have been lost.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
  en_note: 'De Leon''s note [1]: The hero In Chamisso''s "Peter Schiemihi," who loses his own shadow.'
- id: III.4.4
  kind: p
  original: Die Revolution selbst paralysiert ihre eigenen Träger und stattet nur ihre Gegner mit leidenschaftlicher Gewaltsamkeit aus.
  en: The revolution itself paralyzes its own apostles, and equips only its adversaries with passionate violence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
- id: III.4.5
  kind: p
  original: Wenn das "rote Gespenst", von den Kontrerevolutionären beständig heraufbeschworen und gebannt, endlich erscheint, so erscheint es nicht mit anarchischer Phrygiermütze auf dem Kopfe, sondern in der Uniform der Ordnung, in roten Plumphosen.
  en: When the "Red Spectre," constantly conjured up and exorcised by the counter-revolutionists finally does appear, it does not appear with the Anarchist Phrygian cap on its head, but in the uniform of Order, in the Red Breeches of the French Soldier.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '136'
- id: III.5.1
  kind: p
  original: 'Wir haben gesehen: Das Ministerium, das Bonaparte am 20. Dezember 1848, am Tage seiner Himmelfahrt <Einzug in das Elysée, den Wohnsitz des Präsidenten> installierte, war ein Ministerium der Ordnungspartei, der legitimistischen und orleanistischen Koalition.'
  en: We saw that the Ministry, which Bonaparte installed on December 20, 1849, the day of his "Ascension," was a ministry of the party of Order, of the Legitimist and Orleanist coalition.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: III.5.2
  kind: p
  original: Dies Ministerium Barrot-Falloux hatte die republikanische Konstituante, deren Lebensdauer es mehr oder minder gewaltsam abkürzte, überwintert und befand sich noch am Ruder.
  en: The Barrot-Falloux ministry had weathered the republican constitutive convention, whose term of life it had shortened with more or less violence, and found itself still at the helm.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: III.5.3
  kind: p
  original: Changarnier, der General der verbündeten Royalisten, vereinigte fortwährend in seiner Person das Generalkommando der ersten Militärdivison und der Pariser Nationalgarde.
  en: Changamier, the General of the allied royalists continued to unite in his person the command-in-chief of the First Military Division and of the Parisian National Guard.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: III.5.4
  kind: p
  original: Die allgemeinen Wahlen endlich hatten der Ordnungspartei die große Majorität in der Nationalversammlung gesichert.
  en: Finally, the general elections had secured the large majority in the National Assembly to the party of Order.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: III.5.5
  kind: p
  original: Hier begegneten die Deputierten und Pairs Louis-Philippes einer heiligen Schar von Legitimisten, für welche zahlreiche Wahlzettel der Nation sich in Eintrittskarten auf die politische Bühne verwandelt hatten.
  en: Here the Deputies and Peers of Louis Phillipe met a saintly crowd of Legitimists, for whose benefit numerous ballots of the nation had been converted into admission tickets to the political stage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: III.5.6
  kind: p
  original: Die bonapartistischen Volksrepräsentanten waren zu dünn gesät, um eine selbständige parlamentarische Partei bilden zu können.
  en: The Bonapartist representatives were too thinly sowed to be able to build an independent parliamentary party.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: III.5.7
  kind: p
  original: Sie erschienen nur als mauvaise queue <übles Anhängsel> der Ordnungspartei.
  en: They appeared only as "mauvaise queue" played upon the party of Order.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
  en_note: 'De Leon''s note [2]: Practical joke'
- id: III.5.8
  kind: p
  original: So war die Ordnungspartei im Besitz der Regierungsgewalt, der Armee und des gesetzgebenden Körpers, kurz der Gesamtmacht des Staats, moralisch gekräftigt durch die allgemeinen Wahlen, die ihre Herrschaft als den Willen des Volkes erscheinen ließen, und durch den gleichzeitigen Sieg der Kontrerevolution auf dem gesamten Kontinent.
  en: Thus the party of Order was in possession of the Government, of the Army, and of the legislative body, in short, of the total power of the State, morally strengthened by the general elections, that caused their sovereignty to appear as the will of the people, and by the simultaneous victory of the counter-revolution on the whole continent of Europe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: III.6.1
  kind: p
  original: Nie eröffnete eine Partei mit größern Mittel und unter günstigern Auspizien ihren Feldzug.
  en: Never did party open its campaign with larger means at its disposal and under more favorable auspices.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: III.7.1
  kind: p
  original: Die schiffbrüchigen reinen Republikaner fanden sich in der gesetzgebenden Nationalversammlung auf eine Clique von ungefähr 50 Mann zusammengeschmolzen, an ihrer Spitze die afrikanischen Generale Cavaignac, Lamoricière, Bedeau.
  en: The shipwrecked pure republicans found themselves in the legislative National Assembly melted down to a clique of fifty men, with the African Generals Cavaignac, Lamorciere and Bedeau at its head.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: III.7.2
  kind: p
  original: Die große Oppositionspartei aber wurde gebildet durch die Montagne.
  en: The great Opposition party was, however, formed by the Mountain.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: III.7.3
  kind: p
  original: Diesen parlamentarischen Taufnamen hatte sich die sozial-demokratische Partei gegeben.
  en: This parliamentary baptismal name was given to itself by the Social Democratic party.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: III.7.4
  kind: p
  original: Sie verfügte über mehr als 200 von 750 Stimmen der Nationalversammlung und war daher wenigstens ebenso mächtig als irgendeine der drei Fraktionen der Ordnungspartei für sich genommen.
  en: It disposed of more than two hundred votes out of the seven hundred and fifty in the National Assembly, and, hence, was at least just as powerful as any one of the three factions of the party of Order.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: III.7.5
  kind: p
  original: Ihre relative Minorität gegen die gesamte royalistische Koalition schien durch besondere Umstände aufgewogen.
  en: Its relative minority to the total royalist coalition seemed counterbalanced by special circumstances.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
- id: III.7.6
  kind: p
  original: Nicht nur zeigten die Departementswahlen, daß sie einen bedeutenden Anhang unter der Landbevölkerung gewonnen hatte.
  en: Not only did the Departmental election returns show that it had gained a considerable following among the rural population, but, furthermore, it numbered almost all the Paris Deputies in its camp; the Army had, by the election of three under-officers, made a confession of democratic faith; and the leader of the Mountain, Ledru-Rollin had in contrast to all the representatives of the party of Order, been raised to the rank of the "parliamentary nobility" by five Departments, who combined their suffrages upon him.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '137'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: III.7.7
  kind: p
  original: Sie zählte beinah alle Deputierten von Paris unter sich, die Armee hatte durch die Wahl von drei Unteroffizieren ein demokratisches Glaubensbekenntnis abgelegt, und der Chef der Montagne, Ledru-Rollin, war im Unterschied von allen Repräsentanten der Ordnungspartei in den parlamentarischen Adelstand erhoben worden durch fünft Departements, die ihre Stimmen auf ihn vereinigt.
  en: ''
  joined_to: III.7.6
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: 137-138
- id: III.7.8
  kind: p
  original: Die Montagne schien also am 28. Mai 1849, bei den unvermeidlichen Kollisionen der Royalisten unter sich und der gesamten Ordnungspartei mit Bonaparte, alle Elemente des Erfolgs vor sich zu haben.
  en: Accordingly, in view of the inevitable collisions of the royalists among themselves, on the one hand, and of the whole party of Order with Bonaparte, on the other, the Mountain seemed on May 29,1849, to have before it all the elements of success.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: III.7.9
  kind: p
  original: Vierzehn Tage später hatte sie alles verloren, die Ehre eingerechnet.
  en: A fortnight later, it had lost everything, its honor included.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: III.8.1
  kind: p
  original: Ehe wir der parlamentarischen Geschichte weiter folgen, sind einige Bemerkungen nötig, um die gewöhnliche Täuschungen über den ganzen Charakter der Epoche, die uns vorliegt, zu vermeiden.
  en: Before we follow this parliamentary history any further, a few observations are necessary, in order to avoid certain common deceptions concerning the whole character of the epoch that lies before us.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: III.8.2
  kind: p
  original: In der demokratischen Manier zu sehn, handelt es sich während der Periode der gesetzgebenden Nationalversammlung, um was es sich in der Periode der konstituierenden handelte, um den einfachen Kampf zwischen Republikanern und Royalisten.
  en: According to the view of the democrats, the issue, during the period of the legislative National Assembly, was, the same as during the period of the constitutive assembly, simply the struggle between republicans and royalists; the movement itself was summed up by them in the catch-word Reaction--night, in which all cats are grey, and allows them to drawl out their drowsy commonplaces.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: III.8.3
  kind: p
  original: 'Die Bewegung selbst aber fassen sie in ein Stichwort zusammen: "Reaktion", Nacht, worin alle Katzen grau sind, und die ihnen erlaubt, ihre nachtwächterlichen Gemeinplätze abzuleiern.'
  en: ''
  joined_to: III.8.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '138'
- id: III.8.4
  kind: p
  original: Und allerdings, auf den ersten Blick zeigt die Ordnungspartei einen Knäuel von verschiedenen royalistischen Fraktionen, die nicht nur gegeneinander intrigieren, um jede ihren eigenen Prätendenten auf den Thron zu erheben und den Prätendenten der Gegenpartei auszuschließen, sondern auch sich alle vereinigen in gemeinschaftlichem Haß und gemeinschaftlichen Angriffen gegen die "Republik".
  en: Indeed, at first sight, the party of Order presents the appearance of a tangle of royalist factions, that, not only intrigue against each other, each aiming to raise its own Pretender to the throne, and exclude the Pretender of the Opposite party, but also are all united in a common hatred for and common attacks against the "Republic."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: III.8.5
  kind: p
  original: Die Montagne ihrerseits erscheint im Gegensatze zu dieser royalistischen Konspiration als Vertreterin der "Republik".
  en: On its side, the Mountain appears, in counter-distinction to the royalist conspiracy, as the representative of the "Republic."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: III.8.6
  kind: p
  original: Die Ordnungspartei erscheint beständig beschäftigt mit einer "Reaktion", die sich nicht mehr nicht minder als in Preußen gegen Presse, Assoziation u. dgl. richtet und in brutalen Polizeieinmischungen der Bürokratie, der Gendarmerie und der Parkette <Gerichtshöfe> sich vollstreckt wie in Preußen.
  en: The party of Order seems constantly engaged in a "Reaction," which, neither more nor less than in Prussia, is directed against the press, the right of association and the like, and is enforced by brutal police interventions on the part of the bureaucracy, the police and the public prosecutor--just as in Prussia; the Mountain on the contrary, is engaged with equal assiduity in parrying these attacks, and thus in defending the "eternal rights of man"--as every so-called people's party has more or less done for the last hundred and fifty years.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: III.8.7
  kind: p
  original: Die "Montagne" ihrerseits wieder ist ebenso fortwährend beschäftigt, diese Angriffe abzuwehren und so die "ewigen Menschenrechte" zu verteidigen, wie jede sogenannte Volkspartei mehr oder minder seit anderthalb Jahrhunderten getan hat.
  en: ''
  joined_to: III.8.6
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '138'
- id: III.8.8
  kind: p
  original: Vor einer nähern Betrachtung der Situation und der Parteien verschwindet indes dieser oberflächliche Schein, der den Klassenkampf und die eigentümliche Physiognomie dieser Periode verschleiert.
  en: At a closer inspection, however, of the situation and of the parties, this superficial appearance, which veils the Class Struggle, together with the peculiar physiognomy of this period, vanishes wholly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: III.9.1
  kind: p
  original: Legitimisten und Orleanisten bildeten, wie gesagt, die zwei großen Fraktionen der Ordnungspartei.
  en: Legitimists and Orleanists constituted, as said before, the two large factions of the party of Order.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: III.9.2
  kind: p
  original: Was diese Fraktionen an ihren Prätendenten festhielt und sie wechselseitig auseinanderhielt, war es nichts andres als Lilie und Trikolore, Haus Bourbon und Haus Orléans, verschiedene Schattierungen des Royalismus, war es überhaupt das Glaubensbekenntnis des Royalismus?
  en: What held these two factions to their respective Pretenders, and inversely kept them apart from each other, what else was it but the lily and the tricolor, the House of Bourbon and the house of Orleans, different shades of royalty?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '138'
- id: III.9.3
  kind: p
  original: Unter den Bourbonen hatte das große Grundeigentum regiert mit seinen Pfaffen und Lakaien, unter den Orléans die hohe Finanz, die große Industrie, der große Handel, d.h. das Kapital mit seinem Gefolge von Advokaten, Professoren und Schönrednern.
  en: Under the Bourbons, Large Landed Property ruled together with its parsons and lackeys; under the Orleanist, it was the high finance, large industry, large commerce, i.e., Capital, with its retinue of lawyers, professors and orators.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 138-139
- id: III.9.4
  kind: p
  original: Das legitime Königtum war bloß der politische Ausdruck für die angestammte Herrschaft der Herren von Grund und Boden, wie die Julimonarchie nur der politische Ausdruck für die usurpierte Herrschaft des bürgerlichen Parvenüs.
  en: The Legitimate kingdom was but the political expression for the hereditary rule of the landlords, as the July monarchy was bur the political expression for the usurped rule of the bourgeois upstarts.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: III.9.5
  kind: p
  original: Was also diese Fraktionen auseinanderhielt, es waren keine sogenannten Prinzipien, es waren ihre materiellen Existenzbedingungen, zwei verschiedene Arten des Eigentums, es war der alte Gegensatz von Stadt und Land, die Rivalität zwischen Kapital und Grundeigentum.
  en: What, accordingly, kept these two factions apart was no so-called set of principles, it was their material conditions for life--two different sorts of property--; it was the old antagonism of the City and the Country, the rivalry between Capital and Landed property.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: III.9.6
  kind: p
  original: Daß gleichzeitig alte Erinnerungen, persönliche Feindschaften, Befürchtungen und Hoffnungen, Vorurteile und Illusionen, Sympathien und Antipathien, Überzeugungen, Glaubensartikel und Prinzipien sie an das eine oder das andere Königshaus banden, wer leugnet es?
  en: That simultaneously old recollections; personal animosities, fears and hopes; prejudices and illusions; sympathies and antipathies; convictions, faith and principles bound these factions to one House or the other, who denies it?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: III.9.7
  kind: p
  original: Auf den verschiedenen Formen des Eigentums, auf den sozialen Existenzbedingungen erhebt sich ein ganzer Überbau verschiedener und eigentümlich gestalteter Empfindungen, Illusionen, Denkweisen und Lebensanschauungen.
  en: Upon the several forms of property, upon the social conditions of existence, a whole superstructure is reared of various and peculiarly shaped feelings, illusions, habits of thought and conceptions of life.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: III.9.8
  kind: p
  original: Die ganze Klasse schafft und gestaltet sie aus ihren materiellen Grundlagen heraus und aus den entsprechenden gesellschaftlichen Verhältnissen.
  en: The whole class produces and shapes these out of its material foundation and out of the corresponding social conditions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: III.9.9
  kind: p
  original: Das einzelne Individuum, dem sie durch Tradition und Erziehung zufließen, kann sich einbilden, daß sie die eigentlichen Bestimmungsgründe und den Ausgangspunkt seines Handelns bilden.
  en: The individual unit to whom they flow through tradition and education, may fancy that they constitute the true reasons for and premises of his conduct.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: III.9.10
  kind: p
  original: Wenn Orleanisten, Legitimisten, jede Fraktion sich selbst und der anderen vorzureden suchte, daß die Anhänglichkeit an ihre zwei Königshäuser sie trenne, bewies später die Tatsache, daß vielmehr ihr gespaltenes Interesse die Vereinigung der zwei Königshäuser verbot.
  en: Although Orleanists and Legitimists, each of these factions, sought to make itself and the other believe that what kept the two apart was the attachment of each to its respective royal House; nevertheless, facts proved later that it rather was their divided interest that forbade the union of the two royal Houses.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: III.9.11
  kind: p
  original: Und wie man im Privatleben unterscheidet zwischen dem, was ein Mensch von sich meint und sagt, und dem was er wirklich ist und tut, so muß man noch mehr in geschichtlichen Kämpfen die Phrasen und Einbildungen der Parteien von ihrem wirklichen Organismus und ihren wirklichen Interessen, ihre Vorstellungen von ihrer Realität unterscheiden.
  en: As, in private life, the distinction is made between what a man thinks of himself and says, and that which he really is and does, so, all the more, must the phrases and notions of parties in historic struggles be distinguished from the real organism, and their real interests, their notions and their reality.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: III.9.12
  kind: p
  original: Orleanisten und Legitimisten fanden sich in der Republik nebeneinander mit gleichen Ansprüchen.
  en: Orleanists and Legitimists found themselves in the republic beside each other with equal claims.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: III.9.13
  kind: p
  original: Wenn jede Seite gegen die andre die Restauration ihres eignen Königshauses durchsetzen wollte, so hieß das nichts andres, als daß die zwei großen Interessen, worin die Bourgeoisie sich spaltete - Grundeigentum und Kapital -, jedes seine eigene Suprematie und die Unterordnung des andern zu restaurieren suchte.
  en: Each side wishing, in opposition to the other, to carry out the restoration of its own royal House, meant nothing else than that each of the two great Interests into which the bourgeoisie is divided--Land and Capital--sought to restore its own supremacy and the subordinacy of the other.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: III.9.14
  kind: p
  original: Wir sprechen von zwei Interessen der Bourgeoisie, denn das große Grundeigentum, trotz seiner feudalen Koketterie und seines Racenstolzes, war durch die Entwicklung der modernen Gesellschaft vollständig verbürgerlicht.
  en: We speak of two bourgeois interests because large landed property, despite its feudal coquetry and pride of race, has become completely bourgeois through the development of modern society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '139'
- id: III.9.15
  kind: p
  original: So haben die Tories in England sich lange eingebildet, daß sie für das Königtum, die Kirche und die Schönheiten der altenglischen Verfassung schwärmten, bis der Tag der Gefahr ihnen das Geständnis entriß, daß sie nur für die Grundrente schwärmen. <Siehe MEW, Bd. 8, S. 336-341>
  en: Thus did the Tories of England long fancy that they were enthusiastic for the Kingdom, the Church and the beauties of the old English Constitution, until the day of danger wrung from them the admission that their enthusiasm was only for Ground Rent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 139-140
- id: III.10.1
  kind: p
  original: Die koalisierten Royalisten spielten ihre Intrige gegeneinander in der Presse, in Ems, in Claremont, außerhalb des Parlaments.
  en: The coalized royalists carried on their intrigues against each other in the press, in Ems, in Clarmont--outside of the parliament.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
- id: III.10.2
  kind: p
  original: Hinter den Kulissen zogen sie ihre alten orleanistischen und legitimistischen Livreen wieder an und führten ihre alten Turniere wieder auf.
  en: Behind the scenes, they don again their old Orleanist and Legitimist liveries, and conduct their old tourneys; on the public stage, however, in their public acts, as a great parliamentary party, they dispose of their respective royal houses with mere courtesies, adjourn "in infinitum" the restoration of the monarchy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: III.10.3
  kind: p
  original: Aber auf der öffentlichen Bühne, in ihren Haupt- und Staatsaktionen, als große parlamentarische Partei, fertigten sie ihre respektiven Königshäuser mit bloßen Reverenzen ab und vertagten die Restauration der Monarchie ad infinitum <ins Unendliche>.
  en: ''
  joined_to: III.10.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '140'
- id: III.10.4
  kind: p
  original: Sie verrichteten ihr wirkliches Geschäft als Partei der Ordnung, d.h. unter einem gesellschaftlichen, nicht unter einem politischen Titel, als Vertreter der bürgerlichen Weltordnung, nicht als Ritter fahrender Prinzessinnen, als Bourgeoisklasse gegen alle andern Klassen, nicht als Royalisten gegenüber den Republikanern.
  en: Their real business is transacted as Party of Order, i. e., under a Social, not a Political title; as representatives of the bourgeois social system; not as knights of traveling princesses, but as the bourgeois class against the other classes; not as royalists against republicans.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
- id: III.10.5
  kind: p
  original: Und als Partei der Ordnung haben sie eine unumschränktere und härtere Herrschaft über die andern Klassen der Gesellschaft ausgeübt als je zuvor unter der Restauration oder unter der Julimonarchie, wie sie überhaupt nur unter der Form der parlamentarischen Republik möglich war, denn nur unter dieser Form konnten die zwei großen Abteilungen der französischen Bourgeoisie sich vereinigen, also die Herrschaft ihrer Klasse statt des Regimes einer privilegierten Fraktion derselben auf die Tagesordnung setzen.
  en: Indeed, as party of Order they exercised a more unlimited and harder dominion over the other classes of society than ever before either under the restoration or the July monarchy-a thing possible only under the form of a parliamentary republic, because under this form alone could the two large divisions of the French bourgeoisie be united; in other words, only under this form could they place on the order of business the sovereignty of their class, in lieu of the regime of a privileged faction of the same.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
- id: III.10.6
  kind: p
  original: Wenn sie trotzdem auch als Partei der Ordnung die Republik insultieren und ihren Widerwillen gegen sie aussprechen, so geschah das nicht nur aus royalistischer Erinnerung.
  en: 'If, this notwithstanding, they are seen as the party of Order to insult the republic and express their antipathy for it, it happened not out of royalist traditions only: Instinct taught them that while, indeed, the republic completes their authority, it at the same time undermined their social foundation, in that, without intermediary, without the mask of the crown, without being able to turn aside the national interest by means of its subordinate struggles among its own conflicting elements and with the crown, the republic is compelled to stand up sharp against the subjugated classes, and wrestle with them.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: III.10.7
  kind: p
  original: Es lehrte sie der Instinkt, daß die Republik zwar ihre politische Herrschaft vollendet, aber zugleich deren gesellschaftliche Grundlage unterwühlt, indem sie nun ohne Vermittlung, ohne den Versteck der Krone, ohne das nationale Interesse durch ihre untergeordneten Kämpfe untereinander und mit dem Königtum ableiten zu können, den unterjochten Klassen gegenüberstehn und mit ihnen ringen zu müssen.
  en: ''
  joined_to: III.10.6
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '140'
- id: III.10.8
  kind: p
  original: Es war Gefühl der Schwäche, das sie vor den reinen Bedingungen ihrer eignen Klassenherrschaft zurückbeben und sich nach den unvollständigern, unterentwickelteren und eben darum gefahrloseren Formen derselben zurücksehnen ließ.
  en: It was a sense of weakness that caused them to recoil before the unqualified demands of their own class rule, and to retreat to the less complete, less developed, and, for that very reason, less dangerous forms of the same.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '140'
- id: III.10.9
  kind: p
  original: Sooft die koalisierten Royalisten dagegen in Konflikt mit dem Prätendenten geraten, der ihnen gegenübersteht, mit Bonaparte, sooft sie ihre parlamentarische Allmacht von der Exekutivgewalt gefährdet glauben, sooft sie also den politischen Titel ihrer Herrschaft herauskehren müssen, treten sie als Republikaner auf und nicht als Royalisten, von dem Orleanisten Thiers, der die Nationalversammlung warnt, daß die Republik sie am wenigsten trenne, bis auf den Legitimisten Berryer, der am 2. Dezember 1851, die dreifarbige Schärpe umgewunden, das vor dem Mairiegebäude des zehnten Arrondissements versammelte Volk als Tribun im Namen der Republik harrangiert.
  en: 'As often, on the contrary, as the allied royalists come into conflict with the Pretender who stands before them--with Bonaparte--, as often as they believe their parliamentary omnipotence to be endangered by the Executive, in other words, as often as they must trot out the political title of their authority, they step up as Republicans, not as Royalists--and this is done from the Orleanist Thiers, who warns the National Assembly that the republic divides them least, down to Legitimist Berryer, who, on December 2, 1851, the scarf of the tricolor around him, harangues the people assembled before the Mayor''s building of the Tenth Arrondissement, as a tribune in the name of the Republic; the echo, however, derisively answering back to him: "Henry V.! Henry V!"'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 140-141
  en_note: 'De Leon''s note [3]: The candidate of the Bourbons, or Legitimists, for the throne.'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: III.10.10
  kind: p
  original: 'Allerdings ruft ihm das Echo spottend zurück: Henri V! Henri V!'
  en: ''
  joined_to: III.10.9
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '141'
- id: III.11.1
  kind: p
  original: Der koalisierten Bourgeoisie gegenüber hatte sich eine Koalition zwischen Kleinbürgern und Arbeitern gebildet, die sogenannte sozial-demokratische Partei.
  en: However, against the allied bourgeois, a coalition was made between the small traders and the workingmen--the so-called Social Democratic party.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: III.11.2
  kind: p
  original: Die Kleinbürger sahen sich nach den Junitagen 1848 schlecht belohnt, ihre materiellen Interessen gefährdet und die demokratischen Garantien, die ihnen die Geltendmachung dieser Interessen sichern sollten, von der Kontrerevolution in Frage gestellt.
  en: The small traders found themselves ill rewarded after the June days of 1848; they saw their material interests endangered, and the democratic guarantees, that were to uphold their interests, made doubtful.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: III.11.3
  kind: p
  original: Sie näherten sich daher den Arbeitern.
  en: Hence, they drew closer to the workingmen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: III.11.4
  kind: p
  original: Ihre parlamentarische Repräsentation andererseits, die Montagne, während der Diktatur der Bourgeois-Republikaner beiseite geschoben, hatte in der letzten Lebenshälfte der Konstituante durch den Kampf mit Bonaparte und den royalistischen Ministern ihre verlorene Popularität wieder erobert.
  en: On the other hand, their parliamentary representatives--the Mountain--, after being shoved aside during the dictatorship of the bourgeois republicans, had, during the last half of the term of the constitutive convention, regained their lost popularity through the struggle with Bonaparte and the royalist ministers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: III.11.5
  kind: p
  original: Sie hatte mit den sozialistischen Führern eine Allianz geschlossen.
  en: They had made an alliance with the Socialist leaders.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: III.11.6
  kind: p
  original: Februar 1849 wurden Versöhnungsbankette gefeiert.
  en: During February, 1849, reconciliation banquets were held.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: III.11.7
  kind: p
  original: Ein gemeinschaftliches Programm wurde entworfen, gemeinschaftliche Wahlkomitees wurden gestiftet und gemeinschaftliche Kandidaten aufgestellt.
  en: A common program was drafted, joint election committees were empanelled, and fusion candidates were set up.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: III.11.8
  kind: p
  original: Den sozialen Forderungen des Proletariats ward die revolutionäre Pointe abgebrochen und eine demokratische Wendung gegeben, den demokratischen Ansprüchen des Kleinbürgertums die bloß politische Form abgestreift und ihre sozialistische Pointe herausgekehrt.
  en: The revolutionary point was thereby broken off from the social demands of the proletariat and a democratic turn given to them; while, from the democratic claims of the small traders' class, the mere political form was rubbed off and the Socialist point was pushed forward.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: III.11.9
  kind: p
  original: So entstand die Sozial-Demokratie.
  en: Thus came the Social Democracy about.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: III.11.10
  kind: p
  original: Die neue Montagne, das Ergebnis dieser Kombination, enthielt, einige Figuranten aus der Arbeiterklasse und einige sozialistische Sektierer abgerechnet, dieselben Elemente wie die alte Montagne, nur numerisch stärker.
  en: The new Mountain, the result of this combination, contained, with the exception of some figures from the working class and some Socialist sectarians, the identical elements of the old Mountain, only numerically stronger.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: III.11.11
  kind: p
  original: Aber im Laufe der Entwicklung hatte sie sich verändert mit der Klasse, die sie vertrat.
  en: In the course of events it had, however, changed, together with the class that it represented.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: III.11.12
  kind: p
  original: Der eigentümliche Charakter der Sozial-Demokratie faßte sich dahin zusammen, daß demokratisch-republikanische Institutionen als Mittel verlangt werden, nicht um zwei Extreme, Kapital und Lohnarbeit, beide aufzuheben, sondern um ihren Gegensatz abzuschwächen und in Harmonie zu verwandeln.
  en: The peculiar character of the Social Democracy is summed up in this that democratic-republican institutions are demanded as the means, not to remove the two extremes--Capital and Wage-slavery--, but in order to weaken their antagonism and transform them into a harmonious whole.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: III.11.13
  kind: p
  original: Wie verschiedene Maßregeln zur Erreichung dieses Zweckes vorgeschlagen werden mögen, wie sehr er mit mehr oder minder revolutionären Vorstellungen sich verbrämen mag, der Inhalt bleibt derselbe.
  en: However different the methods may be that are proposed for the accomplishment of this object, however much the object itself may be festooned with more or less revolutionary fancies, the substance remains the same.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: III.11.14
  kind: p
  original: Dieser Inhalt ist die Umänderung der Gesellschaft auf demokratischem Wege, aber eine Umänderung innerhalb der Grenzen des Kleinbürgertums.
  en: This substance is the transformation of society upon democratic lines, but a transformation within the boundaries of the small traders' class.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: III.11.15
  kind: p
  original: Man muß sich nur nicht die bornierte Vorstellung machen, als wenn das Kleinbürgertum prinzipiell ein egoistisches Klasseninteresse durchsetzen wolle.
  en: No one must run away with the narrow notion that the small traders' class means on principle to enforce a selfish class interest.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '141'
- id: III.11.16
  kind: p
  original: Es glaubt vielmehr, daß die besondern Bedingungen seiner Befreiung die allgemeinen Bedingungen sind, innerhalb deren allein die moderne Gesellschaft gerettet und der Klassenkampf vermieden werden kann.
  en: It believes rather that the special conditions for its own emancipation are the general conditions under which alone modern society can be saved and the class struggle avoided.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 141-142
- id: III.11.17
  kind: p
  original: Man muß sich ebensowenig vorstellen, daß die demokratischen Repräsentanten nun alle shopkeepers <Krämer> sind oder für dieselben schwärmen.
  en: Likewise must we avoid running away with the notion that the Democratic Representatives are all "shopkeepers," or enthuse for these.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: III.11.18
  kind: p
  original: Sie können ihre Bildung und ihrer individuellen Lage nach himmelweit von ihnen getrennt sein.
  en: They may--by education and individual standing--be as distant from them as heaven is from earth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: III.11.19
  kind: p
  original: Was sie zu Vertretern des Kleinbürgers macht, ist, daß sie im Kopfe nicht über die Schranken hinauskommen, worüber jener nicht im Leben hinauskommt, daß sie daher zu denselben Aufgaben und Lösungen theoretisch getrieben werden, wohin jenen das materielle Interesse und die gesellschaftliche Lage praktisch treiben.
  en: That which makes them representatives of the small traders' class is that they do not intellectually leap the bounds which that class itself does not leap in practical life; that, consequently, they are theoretically driven to the same problems and solutions, to which material interests and social standing practically drive the latter.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: III.11.20
  kind: p
  original: Dies ist überhaupt das Verhältnis der politischen und literarischen Vertreter einer Klasse zu der Klasse, die sie vertreten.
  en: Such, in fact, is at all times the relation of the "political" and the "literary" representatives of a class to the class they represent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: III.12.1
  kind: p
  original: Nach der gegebenen Auseinandersetzung versteht sich von selbst, daß, wenn die Montagne mit der Ordnungspartei fortwährend um die Republik und die sogenannten Menschenrechte ringt, weder die Republik noch die Menschenrechte ihr letzter Zweck sind, sowenig eine Armee, die man der Waffen berauben will und die sich zur Wehr setzt, auf den Kampfplatz getreten ist, um im Besitz ihrer eigenen Waffen zu bleiben.
  en: After the foregoing explanations, it goes with-out saying that, while the Mountain is constantly wrestling for the republic and the so-called "rights of man," neither the republic nor the "rights of man" is its real goal, as little as an army, whose weapons it is sought to deprive it of and that defends itself, steps on the field of battle simply in order to remain in possession of implements of warfare.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: III.13.1
  kind: p
  original: Die Partei der Ordnung provozierte gleich beim Zusammentritt der Nationalversammlung die Montagne.
  en: The party of Order provoked the Mountain immediately upon the convening of the assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: III.13.2
  kind: p
  original: Die Bourgeoisie fühlte jetzt die Notwendigkeit, mit den demokratischen Kleinbürgern fertig zu werden, wie sie ein Jahr vorher die Notwendigkeit begriffen hatten, mit dem revolutionären Proletariat zu enden.
  en: The bourgeoisie now felt the necessity of disposing of the democratic small traders' class, just as a year before it had understood the necessity of putting an end to the revolutionary proletariat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: III.13.3
  kind: p
  original: Nur war die Situation des Gegners eine verschiedene.
  en: But the position of the foe had changed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: III.13.4
  kind: p
  original: Die Stärke der proletarischen Partei war auf der Straße, die der Kleinbürger in der Nationalversammlung selbst.
  en: The strength of the proletarian party was on the streets; that of the small traders' class was in the National Assembly itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: III.13.5
  kind: p
  original: Es galt also, sie aus der Nationalversammlung auf die Straße zu locken und sie selbst ihre parlamentarische Macht zerbrechen zu lassen, ehe Zeit und Gelegenheit sie konsolidieren konnten.
  en: The point was, accordingly, to wheedle them out of the National Assembly into the street, and to have them break their parliamentary power themselves, before time and opportunity could consolidate them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: III.13.6
  kind: p
  original: Die Montagne sprengte mit verhängtem Zügel in die Falle.
  en: The Mountain jumped with loose reins into the trap.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: III.14.1
  kind: p
  original: Das Bombardement Roms durch die französischen Truppen war der Köder, der ihr hingeworfen wurde.
  en: The bombardment of Rome by the French troops was the bait thrown at the Mountain.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: III.14.2
  kind: p
  original: Es verletzte Artikel V der Konstitution, der der Französischen Republik untersagt, ihre Streitkräfte gegen die Freiheiten eines anderen Volks zu verwenden.
  en: It violated Article V. of the Constitution, which forbade the French republic to use its forces against the liberties of other nations; besides, Article IV. forbade all declaration of war by the Executive without the consent of the National Assembly; furthermore, the constitutive assembly had censured the Roman expedition by its resolution of May 8. Upon these grounds, Ledru-Rollin submitted on June 11, 1849, a motion impeaching Bonaparte and his Ministers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
  align: '3:1'
  review: true
  review_reason: 3 de sentence(s) matched to 1 en sentence(s)
- id: III.14.3
  kind: p
  original: Zudem verbot auch Artikel 54 jede Kriegserklärung von seiten der Exekutivgewalt ohne Zustimmung der Nationalversammlung, und die Konstituante hatte durch ihren Beschluß vom 8. Mai die römische Expedition mißbilligt.
  en: ''
  joined_to: III.14.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '142'
- id: III.14.4
  kind: p
  original: Auf diese Gründe hin deponierte Ledru-Rollin am 11. Juni 1849 einen Anklageakt gegen Bonaparte und seine Minister.
  en: ''
  joined_to: III.14.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '142'
- id: III.14.5
  kind: p
  original: Durch die Wespenstiche von Thiers aufgereizt, ließ er sich sogar zu der Drohung fortreißen, die Konstitution mit allen Mitteln verteidigen zu wollen, selbst mit den Waffen in der Hand.
  en: Instigated by the wasp-stings of Thiers, he even allowed himself to be carried away to the point of threatening to defend the Constitution by all means, even arms in hand.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '142'
- id: III.14.6
  kind: p
  original: Die Montagne erhob sich wie ein Mann und wiederholte diesen Waffenruf.
  en: The Mountain rose as one man, and repeated the challenge.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 142-143
- id: III.14.7
  kind: p
  original: Am 12. Juni verwarf die Nationalversammlung den Anklageakt, und die Montagne verließ das Parlament.
  en: On June 12, the National Assembly rejected the notion to impeach, and the Mountain left the parliament.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
- id: III.14.8
  kind: p
  original: 'Die Ereignisse des 13. Juni sind bekannt: die Proklamation eines Teils der Montagne, wodurch Bonaparte und seine Minister "außerhalb der Konstitution" erklärt wurden; die Straßenprozession der demokratischen Nationalgarden, die waffenlos, wie sie waren, bei dem Zusammentreffen mit den Truppen Changarniers auseinanderstoben usw. usw. Ein Teil der Montagne flüchtete ins Ausland, ein anderer wurde dem Hochgericht in Bourges überwiesen, und ein parlamentarisches Reglement unterwarf den Rest der schulmeisterlichen Aufsicht des Präsidenten der Nationalversammlung.'
  en: 'The events of June 13 are known: the proclamation by a part of the Mountain pronouncing Napoleon and his Ministers "outside the pale of the Constitution"; the street parades of the democratic National Guards, who, unarmed as they were, flew apart at contact with the troops of Changarnier; etc., etc. Part of the Mountain fled abroad, another part was assigned to the High Court of Bourges, and a parliamentary regulation placed the rest under the school-master supervision of the President of the National Assembly.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
- id: III.14.9
  kind: p
  original: Paris wurde wieder in Belagerungszustand versetzt und der demokratische Teil seiner Nationalgarde aufgelöst.
  en: Paris was again put under a state of siege; and the democratic portion of the National Guards was disbanded.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
- id: III.14.10
  kind: p
  original: So war der Einfluß der Montagne im Parlament und die Macht der Kleinbürger in Paris gebrochen.
  en: Thus the influence of the Mountain in parliament was broken, together with the power; of the small traders' class in Paris.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
- id: III.15.1
  kind: p
  original: Lyon, wo der 13. Juni das Signal zu einem blutigen Arbeiteraufstand gegeben hatte, wurde mit den fünf umliegenden Departements ebenfalls in Belagerungszustand erklärt, ein Zustand, der bis auf diesen Augenblick fortdauert.
  en: Lyons, where the 13th of June had given the signal to a bloody labor uprising, was, together with the five surrounding Departments, likewise pronounced in state of siege, a condition that continues down to this moment.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
  en_note: 'De Leon''s note [4]: January, 1852'
- id: III.16.1
  kind: p
  original: Das Gros der Montagne hatte seine Avantgarde im Stiche gelassen, indem es ihrer Proklamation die Unterschriften verweigerte.
  en: 'The bulk of the Mountain had left its vanguard in the lurch by refusing their signatures to the proclamation; the press had deserted: only two papers dared to publish the pronunciamento; the small traders had betrayed their Representatives: the National Guards stayed away, or, where they did turn up, hindered the raising of barricades; the Representatives had duped the small traders: nowhere were the alleged affiliated members from the Army to be seen; finally, instead of gathering strength from them, the democratic party had infected the proletariat with its own weakness, and, as usual with democratic feats, the leaders had the satisfaction of charging "their people" with desertion, and the people had the satisfaction of charging their leaders with fraud.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
  align: '5:1'
  review: true
  review_reason: 5 de sentence(s) matched to 1 en sentence(s); regrouped by the ingest (see REALIGN)
- id: III.16.2
  kind: p
  original: Die Presse war desertiert, indem nur zwei Journale das Pronunziamento zu veröffentlichen wagten.
  en: ''
  joined_to: III.16.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '143'
- id: III.16.3
  kind: p
  original: Die Kleinbürger verrieten ihre Repräsentanten, indem die Nationalgarden ausblieben oder, wo sie erschienen, den Barrikadenbau verhinderten.
  en: ''
  joined_to: III.16.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '143'
- id: III.16.4
  kind: p
  original: Die Repräsentanten hatten die Kleinbürger düpiert, indem die angeblichen Affiliierten von der Armee nirgends zu erblicken waren.
  en: ''
  joined_to: III.16.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '143'
- id: III.16.5
  kind: p
  original: Endlich, statt von ihm Kraftzuschuß zu gewinnen, hatte die demokratische Partei das Proletariat mit ihrer eignen Schwäche angesteckt, und, wie gewöhnlich bei demokratischen Hochtaten, hatten die Führer die Genugtuung, ihr "Volk" der Desertion, und das Volk die Genugtuung, seine Führer der Prellerei beschuldigen zu können.
  en: ''
  joined_to: III.16.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '143'
- id: III.17.1
  kind: p
  original: Selten war eine Aktion mit größerem Geräusch verkündet worden als der bevorstehende Feldzug der Montagne, selten ein Ereignis mit mehr Sicherheit und länger vorher austrompetet als der unvermeidliche Sieg der Demokratie.
  en: Seldom was an act announced with greater noise than the campaign contemplated by the Mountain; seldom was an event trumpeted ahead with more certainty and longer beforehand than the "inevitable victory of the democracy."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
- id: III.17.2
  kind: p
  original: 'Ganz gewiß: Die Demokraten glauben an die Posaunen, vor deren Stößen die Mauern Jerichos einstürzten.'
  en: 'This is evident: the democrats believe in the trombones before whose blasts the walls of Jericho fall together; as often as they stand before the walls of despotism, they seek to imitate the miracle.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
  align: '3:1'
  review: true
  review_reason: 3 de sentence(s) matched to 1 en sentence(s)
- id: III.17.3
  kind: p
  original: Und sooft sie den Wällen des Despotismus gegenüberstehen, suchen sie das Wunder nachzumachen.
  en: ''
  joined_to: III.17.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '143'
- id: III.17.4
  kind: p
  original: Wenn die Montagne im Parlamente siegen wollte, durfte sie nicht zu den Waffen rufen.
  en: ''
  joined_to: III.17.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '143'
- id: III.17.5
  kind: p
  original: Wenn sie im Parlamente zu den Waffen rief, durfte sie sich auf der Straße nicht parlamentarisch verhalten.
  en: If the Mountain wished to win in parliament, it should not appeal to arms; if it called to arms in parliament, it should not conduct itself parliamentarily on the street; if the friendly demonstration was meant seriously, it was silly not to foresee that it would meet with a warlike reception; if it was intended for actual war, it was rather original to lay aside the weapons with which war had to be conducted.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '143'
  align: '3:1'
  review: true
  review_reason: 3 de sentence(s) matched to 1 en sentence(s)
- id: III.17.6
  kind: p
  original: Wenn die friedliche Demonstration ernst gemeint war, so war es albern, nicht vorherzusehen, daß sie kriegerisch empfangen werden würde.
  en: ''
  joined_to: III.17.5
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: 143-144
- id: III.17.7
  kind: p
  original: Wenn es auf den wirklichen Kampf abgesehn war, so war es originell, die Waffen abzulegen, mit denen er geführt werden mußte.
  en: ''
  joined_to: III.17.5
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '144'
- id: III.17.8
  kind: p
  original: Aber die revolutionären Drohungen der Kleinbürger und ihrer demokratischen Vertreter sind bloße Einschüchterungsversuche des Gegners.
  en: But the revolutionary threats of the middle class and of their democratic representatives are mere attempts to frighten an adversary; when they have run themselves into a blind alley, when they have sufficiently compromised themselves and are compelled to execute their threats, the thing is done in a hesitating manner that avoids nothing so much as the means to the end, and catches at pretexts to succumb.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: III.17.9
  kind: p
  original: Und wenn sie sich in eine Sackgasse verrannt, wenn sie sich hinlänglich kompromittiert haben, um zur Ausführung ihrer Drohungen gezwungen zu sein, so geschieht es in einer zweideutigen Weise, die nichts mehr vermeidet als die Mittel zum Zwecke und nach Vorwänden zum Unterliegen hascht.
  en: ''
  joined_to: III.17.8
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '144'
- id: III.17.10
  kind: p
  original: Die schmetternde Ouvertüre, die den Kampf verkündete, verliert sich in ein kleinlautes Knurren, sobald er beginnen soll, die Schauspieler hören auf, sich au sérieux <ernst> zu nehmen, und die Handlung fällt platt zusammen wie ein luftgefüllter Ballon, den man mit der Nadel pickt.
  en: The bray of the overture, that announces the fray, is lost in a timid growl so soon as this is to start; the actors cease to take themselves seriously, and the performance falls flat like an inflated balloon that is pricked with a needle.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: III.18.1
  kind: p
  original: Keine Partei übertreibt sich mehr ihre Mittel als die demokratische, keine täuscht sich leichtsinniger über die Situation.
  en: No party exaggerates to itself the means at its disposal more than the democratic, none deceives itself with greater heedlessness on the situation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: III.18.2
  kind: p
  original: Wenn ein Teil der Armee für sie gestimmt hatte, war die Montagne nun auch überzeugt, daß die Armee für sie revoltieren werde.
  en: A part of the Army voted for it, thereupon the Mountain is of the opinion that the Army would revolt in its favor.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: III.18.3
  kind: p
  original: Und bei welchem Anlasse?
  en: And by what occasion?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: III.18.4
  kind: p
  original: Bei einem Anlasse, der vom Standpunkt der Truppen keinen anderen Sinn hatte, als daß die Revolutionäre für die römischen gegen die französischen Soldaten Partei ergriffen.
  en: By an occasion, that, from the standpoint of the troops, meant nothing else than that the revolutionary soldiers should take the part of the soldiers of Rome against French soldiers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: III.18.5
  kind: p
  original: Andererseits waren die Erinnerungen an den Juni 1848 noch zu frisch, als daß nicht eine tiefe Abneigung des Proletariats gegen die Nationalgarde und ein durchgreifendes Mißtrauen der Chefs der geheimen Gesellschaften gegen die demokratischen Chefs existieren mußten.
  en: On the other hand, the memory of June, 1848, was still too fresh not to keep alive a deep aversion on the part of the proletariat towards the National Guard, and a strong feeling of mistrust on the part of the leaders of the secret societies for the democratic leaders.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: III.18.6
  kind: p
  original: Um diese Differenzen auszugleichen, dazu bedurfte es großer gemeinschaftlicher Interessen, die auf dem Spiele standen.
  en: In order to balance these differences, great common interests at stake were needed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: III.18.7
  kind: p
  original: Die Verletzung eines abstrakten Verfassungsparagraphen konnte das Interesse nicht bieten.
  en: The violation of an abstract constitutional paragraph could not supply such interests.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: III.18.8
  kind: p
  original: War die Verfassung nicht schon wiederholt verletzt worden nach der Versicherung der Demokraten selbst?
  en: Had not the constitution been repeatedly violated, according to the assurances of the democrats themselves?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: III.18.9
  kind: p
  original: Hatten die populärsten Journale sie nicht als ein kontrerevolutionäres Machwerk gebrandmarkt?
  en: Had not the most popular papers branded them as a counter-revolutionary artifice?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: III.18.10
  kind: p
  original: Aber der Demokrat, weil er das Kleinbürgertum vertritt, also eine Übergangsklasse, worin die Interessen zweier Klassen sich zugleich abstumpfen, dünkt sich über den Klassengegensatz überhaupt erhaben.
  en: But the democrat--by reason of his representing the middle class, that is to say, a Transition Class, in which the interests of two other classes are mutually dulled--, imagines himself above all class contrast.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: III.18.11
  kind: p
  original: Die Demokraten geben zu, daß eine privilegierte Klasse ihnen gegenübersteht, aber sie mit der ganzen übrigen Umgebung der Nation bilden das Volk.
  en: The democrats grant that opposed to them stands a privileged class, but they, together with the whole remaining mass of the nation, constitute the "PEOPLE."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: III.18.12
  kind: p
  original: Was sie vertreten ist das Volksrecht; was sie interessiert ist das Volksinteresse.
  en: What they represent is the "people's rights"; their interests are the "people's interests."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: III.18.13
  kind: p
  original: Sie brauchen daher bei einem bevorstehenden Kampfe die Interessen und Stellungen der verschiedenen Klassen nicht zu prüfen.
  en: Hence, they do not consider that, at an impending struggle, they need to examine the interests and attitude of the different classes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: III.18.14
  kind: p
  original: Sie brauchen ihre eigenen Mittel nicht allzu bedenklich abzuwägen.
  en: They need not too seriously weigh their own means.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '144'
- id: III.18.15
  kind: p
  original: Sie haben eben nur das Signal zu geben, damit das Volk mit allen seinen unerschöpflichen Ressourcen über die Dränger herfalle.
  en: All they have to do is to give the signal in order to have the "people" fall upon the "oppressors" with all its inexhaustible resources.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 144-145
- id: III.18.16
  kind: p
  original: Stellen sich nun in der Ausführung ihre Interessen als uninteressant und ihre Macht als Ohnmacht heraus, so liegt das entweder an verderblichen Sophisten, die das unteilbare Volk in verschiedene feindliche Lager spalten, oder die Armee war zu vertiert und zu verblendet, um die reinen Zwecke der Demokratie als ihr eignes Beste zu begreifen, oder an einem Detail der Ausführung ist das Ganze gescheitert, oder aber ein unvorhergesehener Zufall hat für diesmal die Partie vereitelt.
  en: If, thereupon, in the execution, their interests turn out to be uninteresting, and their power to be impotence, it is ascribed either to depraved sophists, who split up the "undivisible people" into several hostile camps; or to the army being too far brutalized and blinded to appreciate the pure aims of the democracy as its own best; or to some detail in the execution that wrecks the whole plan; or, finally, to an unforeseen accident that spoiled the game this time.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: III.18.17
  kind: p
  original: Jedenfalls geht der Demokrat ebenso makellos aus der schmählichsten Niederlage heraus, wie er unschuldig in sie hineingegangen ist, mit der neugewonnenen Überzeugung, daß er siegen muß, nicht daß er selbst und seine Partei den alten Standpunkt aufzugeben, sondern umgekehrt, daß die Verhältnisse ihm entgegenzureifen haben.
  en: At all events, the democrat comes out of the disgraceful defeat as immaculate as he went innocently into it, and with the refreshed conviction that he must win; not that he himself and his party must give up their old standpoint, but that, on the contrary, conditions must come to his aid.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: III.19.1
  kind: p
  original: Man muß sich daher die dezimierte, gebrochene und durch das neue parlamentarische Reglement gedemütigte Montagne nicht gar zu unglücklich vorstellen.
  en: For all this, one must not picture to himself the decimated, broken, and, by the new parliamentary regulation, humbled Mountain altogether too unhappy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: III.19.2
  kind: p
  original: Wenn der 13. Juni ihre Chefs beseitigt hatte, so macht er andererseits untergeordneteren Kapazitäten Platz, denen diese neue Stellung schmeichelt.
  en: If June 13 removed its leaders, it, on the other hand, made room for new ones of inferior capacity, who are flattered by their new position.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: III.19.3
  kind: p
  original: Wenn ihre Machtlosigkeit im Parlamente nicht mehr bezweifelt werden konnte, so waren sie nun auch berechtigt, ihre Tat auf Ausbrüche sittlicher Entrüstung und polternde Deklamationen zu beschränken.
  en: If their impotence in parliament could no longer be doubted, they were now justified to limit their activity to outbursts of moral indignation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: III.19.4
  kind: p
  original: Wenn die Ordnungspartei in ihnen als den letzten offiziellen Repräsentanten der Revolution alle Schrecken der Anarchie verkörpert zu sehen vorgab, so konnten sie in der Wirklichkeit desto platter und bescheidener sein.
  en: If the party of Order pretended to see in them, as the last official representatives of the revolution, all the horrors of anarchy incarnated, they were free to appear all the more flat and modest in reality.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: III.19.5
  kind: p
  original: 'Über den 13. Juni aber vertrösteten sie sich mit der tiefen Wendung: Aber wenn man das allgemeine Wahlrecht anzugreifen wagt, aber dann!'
  en: 'Over June 13 they consoled themselves with the profound expression: "If they but dare to assail universal suffrage... then... then we will show who we are!"'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: III.19.6
  kind: p
  original: Dann werden wir zeigen, wer wir sind.
  en: ''
  joined_to: III.19.5
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '145'
- id: III.19.7
  kind: p
  original: Nous verrons <Wir werden sehen>.
  en: Nous verrons.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
  en_note: 'De Leon''s note [5]: We shall see.'
- id: III.20.1
  kind: p
  original: Was die ins Ausland geflüchteten Montagnards betrifft, so genügt es hier zu bemerken, daß Ledru-Rollin, weil es ihm gelungen war, in kaum zwei Wochen die mächtige Partei, an deren Spitze er stand, rettungslos zu ruinieren, sich nun berufen fand, eine französische Regierung in partibus zu bilden; daß seine Figur, in der Ferne, vom Boden der Aktion weggehoben, im Maßstab als das Niveau der Revolution sank und die offiziellen Größen des offiziellen Frankreich zwerghafter wurden, an Größe zu wachsen schien; daß er als republikanischer Prätendent für 1852 fungieren konnte, daß er periodische Rundschreiben an die Walachen und andere Völker erließ, worin den Despoten des Kontinents mit seinen und seiner Verbündeten Taten gedroht wird.
  en: As to the "Mountaineers," who had fled abroad, it suffices here to say that Ledru-Rollin--he having accomplished the feat of hopelessly ruining, in barely a fortnight, the powerful party at whose head he stood--, found himself called upon to build up a French government "in partibus;" that his figure, at a distance, removed from the field of action, seemed to gain in size in the measure that the level of the revolution sank and the official prominences of official France became more and more dwarfish; that he could figure as republican Pretender for 1852, and periodically issued to the Wallachians and other peoples circulars in which "despot of the continent" is threatened with the feats that he and his allies had in contemplation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
- id: III.20.2
  kind: p
  original: 'Hatte Proudhon ganz unrecht, wenn er diesen Herren zurief: "Vous n''êtes que des blagueurs" <"Ihr seid nichts als Aufschneider">?'
  en: 'Was Proudhon wholly wrong when he cried out to these gentlemen: "Vous n''etes que des blaqueurs"?'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '145'
  en_note: 'De Leon''s note [6]: You are nothing but fakirs.'
- id: III.21.1
  kind: p
  original: Die Ordnungspartei hatte am 13. Juni nicht nur die Montagne gebrochen, sie hatte die Unterordnung der Konstitution unter die Majoritätsbeschlüsse der Nationalversammlung durchgesetzt.
  en: The party of Order had, on June 13, not only broken up the Mountain, it had also established the Subordination of the Constitution to the Majority Decisions of the National Assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: III.21.2
  kind: p
  original: 'Und so verstand sie die Republik: daß die Bourgeoisie hier in parlamentarischen Formen herrsche, ohne wie in der Monarchie an dem Veto der Exekutivgewalt oder an der Auflösbarkeit des Parlaments eine Schranke zu finden.'
  en: So, indeed, did the republic understand it, to--wit, that the bourgeois ruled here in parliamentary form, without, as in the monarchy, finding a check in the veto of the Executive power, or the liability of parliament to dissolution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: III.21.3
  kind: p
  original: Das war die parlamentarische Republik, wie Thiers sie nannte.
  en: It was a "parliamentary republic," as Thiers styled it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: III.21.4
  kind: p
  original: Aber wenn die Bourgeoisie am 13. Juni ihre Allmacht innerhalb des Parlamentsgebäudes sicherte, schlug sie nicht das Parlament selbst, der Exekutivgewalt und dem Volke gegenüber, mit unheilbarer Schwäche, indem sie den populärsten Teil desselben ausstieß?
  en: But if, on June 13, the bourgeoisie secured its omnipotence within the parliament building, did it not also strike the parliament itself, as against the Executive and the people, with incurable weakness by excluding its most popular part?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: III.21.5
  kind: p
  original: Indem sie zahlreiche Deputierte ohne weitere Zeremonien der Requisition der Parkette preisgab, hob sie ihre eigne parlamentarische Unverletzlichkeit auf.
  en: By giving up numerous Deputies, without further ceremony to the mercies of the public prosecutor, it abolished its own parliamentary inviolability.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: III.21.6
  kind: p
  original: Das demütigende Reglement, dem sie die Montagne unterwarf, erhöht in demselben Maße den Präsidenten der Republik, als es den einzelnen Repräsentanten des Volks herabdrückt.
  en: The humiliating regulation, that it subjected the Mountain to, raised the President of the republic in the same measure that it lowered the individual Representatives of the people.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: III.21.7
  kind: p
  original: Indem sie die Insurrektion zum Schutz der konstitutionellen Verfassung als anarchische, auf den Umsturz der Gesellschaft abzweckende Tat brandmarkt, verbot sie sich selbst den Appell an die Insurrektion, sobald die Exekutivgewalt ihr gegenüber die Verfassung verletzen würde.
  en: By branding an insurrection in defense of the Constitution as anarchy, and as a deed looking to the overthrow of society, it interdicted to itself all appeal to insurrection whenever the Executive should violate the Constitution against it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: III.21.8
  kind: p
  original: Und die Ironie der Geschichte will, daß der General, der im Auftrage Bonapartes Rom bombardiert und so den unmittelbaren Anlaß zu der konstitutionellen Emeute vom 13. Juni gegeben hat, daß Oudinot am 2. Dezember 1851 dem Volke von der Ordnungspartei flehentlich und vergeblich als der General der Konstitution gegen Bonaparte angeboten werden muß.
  en: And, indeed, the irony of history wills it that the very General, who by order of Bonaparte bombarded Rome, and thus gave the immediate occasion to the constitutional riot of June 13, that Oudinot, on December 22, 1851, is the one imploringly and vainly to be offered to the people by the party of Order as the General of the Constitution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: III.21.9
  kind: p
  original: Ein andrer Held des 13. Juni, Vieyra, der von der Tribüne der Nationalversammlung Lob einerntet für die Brutalitäten, die er in demokratischen Zeitungslokalen an der Spitze einer der hohen Finanz angehörigen Rotte von Nationalgarden verübt hatte, dieser selbe Vieyra war in die Verschwörung Bonapartes eingeweiht und trug wesentlich dazu bei, in ihrer Todesstunde der Nationalversammlung jeden Schutz von seiten der Nationalgarde abzuschneiden.
  en: Another hero of June 13, Vieyra, who earned praise from the tribune of the National Assembly for the brutalities that he had committed in the democratic newspaper offices at the head of a gang of National Guards in the hire of the high finance--this identical Vieyra was initiated in the conspiracy of Bonaparte, and contributed materially in cutting off all protection that could come to the National Assembly, in the hour of its agony, from the side of the National Guard.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: III.22.1
  kind: p
  original: Der 13. Juni hatte noch einen anderen Sinn.
  en: June 13 had still another meaning.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: III.22.2
  kind: p
  original: Die Montagne hatte Bonapartes Versetzung in Anklagezustand ertrotzen wollen.
  en: The Mountain had wanted to place Bonaparte under charges.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: III.22.3
  kind: p
  original: Ihre Niederlage war also ein direkter Sieg Bonapartes, sein persönlicher Triumph über seine demokratischen Feinde.
  en: Their defeat was, accordingly, a direct victory of Bonaparte; it was his personal triumph over his democratic enemies.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: III.22.4
  kind: p
  original: Die Partei der Ordnung erfocht den Sieg, Bonaparte hatte ihn nur einzukassieren.
  en: The party of Order fought for the victory, Bonaparte needed only to pocket it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: III.22.5
  kind: p
  original: Er tat es.
  en: He did so.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '146'
- id: III.22.6
  kind: p
  original: Am 14. Juni war eine Proklamation an den Mauern von Paris zu lesen, worin der Präsident, gleichsam ohne sein Zutun, widerstrebend, durch die bloße Macht der Ereignisse gezwungen, aus seiner klösterlichen Abgeschiedenheit hervortritt, als verkannte Tugend über die Verleumdungen seiner Widersacher klagt, und während er seine Person mit der Sache der Ordnung zu identifizieren scheint, vielmehr die Sache der Ordnung mit seiner Person identifiziert.
  en: On June 14, a proclamation was to be read on the walls of Paris wherein the President, as it were, without his connivance, against his will, driven by the mere force of circumstances, steps forward from his cloisterly seclusion like misjudged virtue, complains of the calumnies of his antagonists, and, while seeming to identify his own person with the cause of order, rather identifies the cause of order with his own person.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 146-147
- id: III.22.7
  kind: p
  original: Zudem hatte die Nationalversammlung die Expedition gegen Rom zwar nachträglich gebilligt, aber Bonaparte hatte die Initiative dazu ergriffen.
  en: Besides this, the National Assembly had subsequently approved the expedition against Rome; Bonaparte, however, had taken the initiative in the affair.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.22.8
  kind: p
  original: Nachdem er den Hohepriester Samuel in den Vatikan wieder eingeführt, konnte er hoffen, als König David die Tuilerien zu beziehen.
  en: After he had led the High Priest Samuel back into the Vatican, he could hope as King David to occupy the Tuileries.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.22.9
  kind: p
  original: Er hatte die Pfaffen gewonnen.
  en: He had won the parson-interests over to himself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.23.1
  kind: p
  original: Die Emeute vom 13. Juni beschränkte sich, wie wir gesehn, auf eine friedliche Straßenprozession.
  en: The riot of June 13 limited itself, as we have seen, to a peaceful street procession.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.23.2
  kind: p
  original: Es waren also keine kriegerischen Lorbeeren gegen sie zu gewinnen.
  en: There were, consequently, no laurels to be won from it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.23.3
  kind: p
  original: Nichtsdestoweniger, in dieser helden- und ereignisarmen Zeit verwandelte die Ordnungspartei diese Schlacht ohne Blutvergießen in ein zweites Austerlitz.
  en: Nevertheless, in these days, poor in heroes and events, the party of Order converted this bloodless battle into a second Austerlitz.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.23.4
  kind: p
  original: Tribüne und Presse priesen die Armee als die Macht der Ordnung gegenüber den Volksmassen als der Ohnmacht der Anarchie und den Changarnier als das "Bollwerk der Gesellschaft".
  en: Tribune and press lauded the army as the power of order against the popular multitude, and the impotence of anarchy; and Changarnier as the "bulwark of society"--a mystification that he finally believed in himself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: III.23.5
  kind: p
  original: Mystifikation, an die er schließlich selbst glaubte.
  en: ''
  joined_to: III.23.4
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '147'
- id: III.23.6
  kind: p
  original: Unterderhand aber wurden die Korps, die zweideutig schienen, aus Paris verlegt, aus Frankreich nach Algier verbannt, die unruhigen Köpfe unter den Truppen in Strafabteilungen verwiesen, endlich die Absperrung der Presse von der Kaserne und der Kaserne von der bürgerlichen Gesellschaft systematisch durchgeführt.
  en: Underhand, however, the corps that seemed doubtful were removed from Paris; the regiments whose suffrage had turned out most democratic were banished from France to Algiers the restless heads among the troops were consigned to penal quarters; finally, the shutting out of the press from the barracks, and of the barracks from contact with the citizens was systematically carried out.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.24.1
  kind: p
  original: Wir sind hier bei dem entscheidenden Wendepunkt in der Geschichte der französischen Nationalgarde angelangt.
  en: We stand here at the critical turning point in the history of the French National Guard.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.24.2
  kind: p
  original: 1830 hatte sie den Sturz der Restauration entschieden.
  en: In 1830, it had decided the downfall of the restoration.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.24.3
  kind: p
  original: Unter Louis-Philippe mißglückte jede Emeute, worin die Nationalgarde auf Seiten der Truppen stand.
  en: Under Louis Philippe, every riot failed, at which the National Guard stood on the side of the troops.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.24.4
  kind: p
  original: Als sie in den Februartagen 1848 sich passiv gegen den Aufstand und zweideutig gegen Louis-Philippe zeigte, gab er sich verloren und war er verloren.
  en: When, in the February days of 1848, it showed itself passive against the uprising and doubtful toward Louis Philippe himself, he gave himself up for lost.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.24.5
  kind: p
  original: So schlug die Überzeugung Wurzel, daß die Revolution nicht ohne und die Armee nicht gegen die Nationalgarde siegen könne.
  en: Thus the conviction cast root that a revolution could not win without, nor the Army against the National Guard.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.24.6
  kind: p
  original: Es war dies der Aberglaube der Armee an die bürgerliche Allmacht.
  en: This was the superstitious faith of the Army in bourgeois omnipotence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.24.7
  kind: p
  original: Die Junitage 1848, wo die gesamte Nationalgarde mit den Linientruppen die Insurrektion niederwarf, hatten den Aberglauben befestigt.
  en: The June days of 1548, when the whole National Guard, jointly with the regular troops, threw down the insurrection, had confirmed the superstition.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.24.8
  kind: p
  original: Nach Bonapartes Regierungsantritt sank die Stellung der Nationalgarde einigermaßen durch die konstitutionswidrige Vereinigung ihres Kommandos mit dem Kommando der ersten Militärdivison in der Person Changarniers.
  en: After the inauguration of Bonaparte's administration, the position of the National Guard sank somewhat through the unconstitutional joining of their command with the command of the First Military Division in the person of Changarnier.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.25.1
  kind: p
  original: Wie das Kommando über die Nationalgarde hier als ein Attribut des militärischen Oberbefehlshabers erschien, so sie selbst nur nach als Anhang der Linientruppen.
  en: As the command of the National Guard appeared here merely an attribute of the military commander-in-chief, so did the Guard itself appear only as an appendage of the regular troops.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.25.2
  kind: p
  original: 'Am 13. Juni endlich wurde sie gebrochen: nicht nur durch ihre teilweise Auflösung, die sich seit dieser Zeit periodisch an allen Punkten Frankreichs wiederholte und nur Trümmer von ihr zurückließ.'
  en: Finally, on June 13, the National Guard was broken up, not through its partial dissolution only, that from that date forward was periodically repeated at all points of France, leaving only wrecks of its former self behind.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.25.3
  kind: p
  original: Die Demonstration des 13. Juni war vor allem eine Demonstration der demokratischen Nationalgarden.
  en: The demonstration of June 13 was, above all, a demonstration of the National Guards.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '147'
- id: III.25.4
  kind: p
  original: Sie hatten zwar nicht ihre Waffen, wohl aber ihre Uniformen der Armee gegenübergeführt, aber gerade in dieser Uniform saß der Talisman.
  en: True, they had not carried their arms, but they had carried their uniforms against the Army--and the talisman lay just in these uniforms.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 147-148
- id: III.25.5
  kind: p
  original: Die Armee überzeugte sich, daß diese Uniform ein wollener Lappen wie ein andrer war.
  en: The Army then learned that this uniform was but a woolen rag, like any other.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: III.25.6
  kind: p
  original: Der Zauber ging verloren.
  en: The spell was broken.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: III.25.7
  kind: p
  original: In den Junitagen 1848 waren Bourgeoisie und Kleinbürgertum als Nationalgarde mit der Armee gegen das Proletariat vereinigt, am 13. Juni 1849 ließ die Bourgeoisie die kleinbürgerliche Nationalgarde durch die Armee auseinandersprengen, am 2. Dezember 1851 war die Nationalgarde der Bourgeoisie selbst verschwunden, und Bonaparte konstatierte nur dies Faktum, als er nachträglich ihr Auflösungsdekret unterschrieb.
  en: In the June days of 1848, bourgeoisie and small traders were united as National Guard with the Army against the proletariat; on June 13, 1849, the bourgeoisie had the small traders' National Guard broken up; on December 2, 1851, the National Guard of the bourgeoisie itself vanished, and Bonaparte attested the fact when he subsequently signed the decree for its disbandment.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: III.25.8
  kind: p
  original: So hatte die Bourgeoisie selbst ihre letzte Waffe gegen die Armee zerbrochen, aber sie mußte sie zerbrechen von dem Augenblicke, wo das Kleinbürgertum nicht mehr als Vasall hinter, sondern als Rebell vor ihr stand, wie sie überhaupt alle ihre Verteidigungsmittel gegen den Absolutismus mit eigner Hand zerstören mußte, sobald sie selbst absolut geworden war.
  en: Thus the bourgeoisie had itself broken its last weapon against the army, from the moment when the small traders' class no longer stood as a vassal behind, but as a rebel before it; indeed, it was bound to do so, as it was bound to destroy with its own hand all its means of defence against absolutism, so soon as itself was absolute.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: III.26.1
  kind: p
  original: Die Ordnungspartei feierte unterdes die Wiedereroberung einer Macht, die 1848 nur verloren schien, um 1849 von ihren Schranken befreit wiedergefunden zu werden, durch Invektiven gegen die Republik und die Konstitution, durch die Verfluchung aller zukünftigen, gegenwärtigen und vergangenen Revolutionen, die eingerechnet, welche ihre eigenen Führer gemacht hatten, und in Gesetzen, wodurch die Presse geknebelt, die Assoziation vernichtet und der Belagerungszustand als organisches Institut reguliert wurde.
  en: In the meantime, the party of Order celebrated the recovery of a power that seemed lost in 1848 only in order that, freed from its trammels in 1849, it be found again through invectives against the republic and the Constitution; through the malediction of all future, present and past revolutions, that one included which its own leaders had made; and, finally, in laws by which the press was gagged, the right of association destroyed, and the stage of siege regulated as an organic institution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: III.26.2
  kind: p
  original: Die Nationalversammlung vertagte sich dann von Mitte August bis Mitte Oktober, nachdem sie eine Permanenzkommission für die Zeit ihrer Abwesenheit ernannt hatte.
  en: The National Assembly then adjourned from the middle of August to the middle of October, after it had appointed a Permanent Committee for the period of its absence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: III.26.3
  kind: p
  original: Während dieser Ferien intrigierten die Legitimisten mit Ems, die Orleanisten mit Claremont, Bonaparte durch prinzliche Rundreisen und die Departementalräte in Beratungen über die Revision der Verfassung - Vorfälle, die in den periodischen Ferien der Nationalversammlung regelmäßig wiederkehren und auf die ich erst eingehen will, sobald sie zu Ereignissen werden.
  en: During these vacations, the Legitimists intrigued with Ems; the Orleanists with Claremont; Bonaparte through princely excursions; the Departmental Councilmen in conferences over the revision of the Constitution;--occurrences, all of which recurred regularly at the periodical vacations of the National Assembly, and upon which I shall not enter until they have matured into events.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: III.26.4
  kind: p
  original: Hier sei nur noch bemerkt, daß die Nationalversammlung unpolitisch handelte, als sie für längere Intervalle von der Bühne verschwand und auf der Spitze der Republik nur noch eine, wenn auch klägliche Gestalt erblicken ließ, die Louis Bonapartes, während die Partei der Ordnung zum Skandale des Publikums in ihre royalistischen Bestandteile auseinander- und ihren sich widerstreitenden Restaurationsgelüsten nachging.
  en: Be it here only observed that the National Assembly was impolitic in vanishing from the stage for long intervals, and leaving in view, at the head of the republic, only one, however sorry, figure--Louis Bonaparte's--, while, to the public scandal, the party of Order broke up into its own royalist component parts, that pursued their conflicting aspirations after the restoration.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
- id: III.26.5
  kind: p
  original: 'Sooft während dieser Ferien der verwirrende Lärm des Parlaments verstummte und sein Körper sich in die Nation auflöste, zeigte sich unverkennbar, daß nur noch eins fehle, um die wahre Gestalt dieser Republik zu vollenden: seine Ferien permanent machen und ihre Aufschrift: liberté, égalité, fraternité, ersetzen durch die unzweideutigen Worte: Infanterie, Kavallerie, Artillerie!'
  en: 'As often as, during these vacations the confusing noise of the parliament was hushed, and its body was dissolved in the nation, it was unmistakably shown that only one thing was still wanting to complete the true figure of the republic: to make the vacation of the National Assembly permanent, and substitute its inscription--"Liberty, Equality, Fraternity"--by the unequivocal words, "Infantry, Cavalry, Artillery".'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '148'
