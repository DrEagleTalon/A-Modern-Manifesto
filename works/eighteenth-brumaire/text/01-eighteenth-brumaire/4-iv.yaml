- id: IV.1.1
  kind: p
  original: Mitte Oktober 1849 trat die Nationalversammlung wieder zusammen.
  en: The National Assembly reconvened in the middle of October.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '149'
- id: IV.1.2
  kind: p
  original: Am 1. November überraschte Bonaparte sie mit einer Botschaft, worin er die Entlassung des Ministeriums Barrot-Falloux und die Bildung eines neuen Ministeriums anzeigte.
  en: On November 1, Bonaparte surprised it with a message, in which he announced the dismissal of the Barrot-Falloux Ministry, and the framing of a new.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '149'
- id: IV.1.3
  kind: p
  original: Man hat Lakaien nie mit weniger Zeremonien aus dem Dienste gejagt als Bonaparte seine Minister.
  en: Never have lackeys been chased from service with less ceremony than Bonaparte did his ministers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '149'
- id: IV.1.4
  kind: p
  original: Die Fußtritte, die der Nationalversammlung bestimmt waren, erhielt vorläufig Barrot u. Komp.
  en: The kicks, that were eventually destined for the National Assembly, Barrot & Company received in the meantime.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '149'
- id: IV.2.1
  kind: p
  original: Das Ministerium Barrot war, wie wir gesehen haben, aus Legitimisten und Orleanisten zusammengesetzt, ein Ministerium der Ordnungspartei.
  en: The Barrot Ministry was, as we have seen, composed of Legitimists and Orleanists; it was a Ministry of the party of Order.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '149'
- id: IV.2.2
  kind: p
  original: Bonaparte hatte desselben bedurft, um die republikanische Konstituante aufzulösen, die Expedition gegen Rom zu bewerkstelligen und die demokratische Partei zu brechen.
  en: Bonaparte needed that Ministry in order to dissolve the republican constituent assembly, to effect the expedition against Rome, and to break up the democratic party.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '149'
- id: IV.2.3
  kind: p
  original: Hinter diesem Ministerium hatte er sich scheinbar eklipsiert, die Regierungsgewalt in die Hände der Ordnungspartei abgetreten und die bescheidene Charaktermaske angelegt, die unter Louis-Philippe der verantwortliche Gerant der Zeitungspresse trug, die Maske des homme de paille <Strohmannes>.
  en: He had seemingly eclipsed himself behind this Ministry, yielded the reins to the hands of the party of Order, and assumed the modest mask, which, under Louis Philippe, had been worn by the responsible overseer of the newspapers--the mask of "homme de paille."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '149'
  en_note: 'De Leon''s note [1]: Man of straw'
- id: IV.2.4
  kind: p
  original: Jetzt warf er eine Larve weg, die nicht mehr der leichte Vorhang war, worunter er seine Physiognomie verstecken konnte, sondern die eiserne Maske, die ihn verhinderte, eine eigne Physiognomie zu zeigen.
  en: Now he threw off the mask, it being no longer the light curtain behind which he could conceal, but the Iron Mask, which prevented him from revealing his own physiognomy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '149'
- id: IV.2.5
  kind: p
  original: Er hatte das Ministerium Barrot eingesetzt, um im Namen der Ordnungspartei die republikanische Nationalversammlung zu sprengen; er entließ es, um seinen eignen Namen von der Nationalversammlung der Ordnungspartei unabhängig zu erklären.
  en: He had instituted the Barrot Ministry in order to break up the republican National Assembly in the name of the party of Order; he now dismissed it in order to declare his own name independent of the parliament of the party of Order.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '149'
- id: IV.3.1
  kind: p
  original: An plausiblen Vorwänden zu dieser Entlassung fehlte es nicht.
  en: There was no want of plausible pretexts for this dismissal.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '149'
- id: IV.3.2
  kind: p
  original: Das Ministerium Barrot vernachlässigte selbst die Anstandsformen, die den Präsidenten der Republik als eine Macht neben der Nationalversammlung hätten erscheinen lassen.
  en: The Barrot Ministry had neglected even the forms of decency that would have allowed the president of the republic to appear as a power along with the National Assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '149'
- id: IV.3.3
  kind: p
  original: Während der Ferien der Nationalversammlung veröffentlichte Napoleon einen Brief an Edgar Ney, worin er das illiberale Auftreten des Papstes zu mißbilligen schien, wie er im Gegensatz zur Konstituante einen Brief veröffentlicht hatte, worin er Oudinot für den Angriff auf die römische Republik belobte.
  en: For instance, during the vacation of the National Assembly, Bonaparte published a letter to Edgar Ney, in which he seemed to disapprove the liberal attitude of the Pope, just as, in opposition to the constitutive assembly, he had published a letter, in which he praised Oudinot for his attack upon the Roman republic; when the National Assembly came to vote on the budget for the Roman expedition, Victor Hugo, out of pretended liberalism, brought up that letter for discussion; the party of Order drowned this notion of Bonaparte's under exclamations of contempt and incredulity as though notions of Bonaparte could not possibly have any political weight;--and none of the Ministers took up the gauntlet for him.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 149-150
  align: '3:1'
  review: true
  review_reason: 3 de sentence(s) matched to 1 en sentence(s)
- id: IV.3.4
  kind: p
  original: Als nun die Nationalversammlung das Budget für die römische Expedition votierte, brachte Victor Hugo aus angeblichem Liberalismus jenen Brief zur Sprache.
  en: ''
  joined_to: IV.3.3
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '150'
- id: IV.3.5
  kind: p
  original: Die Ordnungspartei erstickte den Einfall, als ob Bonapartes Einfälle irgendein Gewicht haben könnten, unter verächtlich ungläubigen Ausrufungen.
  en: ''
  joined_to: IV.3.3
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '150'
- id: IV.3.6
  kind: p
  original: Keiner der Minister nahm den Handschuh für ihn auf.
  en: On another occasion, Barrot, with his well-known hollow pathos, dropped, from the speakers' tribune in the Assembly, words of indignation upon the "abominable machinations," which, according to him, went on in the immediate vicinity of the President.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '150'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: IV.3.7
  kind: p
  original: Bei einer andern Gelegenheit ließ Barrot mit seinem bekannten hohlen Pathos Worte der Entrüstung von der Rednertribüne auf die "abominablen Umtriebe" fallen, die nach seiner Aussage in der nächsten Umgebung des Präsidenten vorgingen.
  en: ''
  joined_to: IV.3.6
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '150'
- id: IV.3.8
  kind: p
  original: Endlich verweigerte das Ministerium, während es der Herzogin von Orléans einen Witwengehalt von der Nationalversammlung erwirkte, jeden Antrag auf Erhöhung der präsidentiellen Zivilliste.
  en: Finally, while the Ministry obtained from the National Assembly a widow's pension for the Duchess of Orleans, it denied every motion to raise the Presidential civil list;--and, in Bonaparte, be it always remembered, the Imperial Pretender was so closely blended with the impecunious adventurer, that the great idea of his being destined to restore the Empire was ever supplemented by that other, to-wit, that the French people was destined to pay his debts.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '150'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: IV.3.9
  kind: p
  original: Und in Bonaparte verschmolz der kaiserliche Prätendent so innig mit dem heruntergekommenen Glücksritter, daß die eine große Idee, er sei berufen, das Kaisertum zu restaurieren, stets von der anderen ergänzt ward, das französische Volk sei berufen, seine Schulden zu zahlen.
  en: ''
  joined_to: IV.3.8
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '150'
- id: IV.4.1
  kind: p
  original: Das Ministerium Barrot-Falloux war des erste und letzte parlamentarische Ministerium, das Bonaparte ins Leben rief.
  en: The Barrot-Falloux Ministry was the first and last parliamentary Ministry that Bonaparte called into life.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '150'
- id: IV.4.2
  kind: p
  original: Die Entlassung desselben bildete daher einen entscheidenden Wendepunkt.
  en: Its dismissal marks, accordingly, a decisive period.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '150'
- id: IV.4.3
  kind: p
  original: Mit ihm verlor die Ordnungspartei, um ihn nie wieder zu erobern, einen unentbehrlichen Posten für die Behauptung des parlamentarischen Regimes, die Handhabe der Exekutivgewalt.
  en: With the Ministry, the party of Order lost, never to regain, an indispensable post to the maintenance of the parliamentary regime,--the handle to the Executive power.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '150'
- id: IV.4.4
  kind: p
  original: Man begreift sogleich, daß in einem Lande wie Frankreich, wo die Exekutivgewalt über ein Beamtenheer von mehr als einer halben Million von Individuen verfügt, also eine ungeheure Masse von Interessen und Existenzen beständig in der unbedingtesten Abhängigkeit erhält, wo der Staat die bürgerliche Gesellschaft von ihren umfassendsten Lebensäußerungen bis zu ihren unbedeutendsten Regungen hinab, von ihren allgemeinsten Daseinsweisen bis zur Privatexistenz der Individuen umstrickt, kontrolliert, maßregelt, überwacht und bevormundet, wo dieser Parasitenkörper durch die außerordentlichste Zentralisation eine Allgegenwart, Allwissenheit, eine beschleunigte Bewegungsfähigkeit und Schnellkraft gewinnt, die nur in der hülflosen Unselbständigkeit, in der zerfahrenen Unförmlichkeit des wirklichen Gesellschaftskörpers ein Analogen finden, daß in einem solchen Lande die Nationalversammlung mit der Verfügung über die Ministerstellen jeden wirklichen Einfluß verloren gab, wenn sie nicht gleichzeitig die Staatsverwaltung vereinfachte, das Beamtenheer möglichst verringerte, endlich die bürgerliche Gesellschaft und die öffentliche Meinung ihre eignen von der Regierungsgewalt unabhängigen Organe erschaffen ließ.
  en: It is readily understood that, in a country like France, where the Executive disposes over an army of more than half a million office-holders, and, consequently, keeps permanently a large mass of interests and existences in the completest dependence upon itself; where the Government surrounds, controls, regulates, supervises and guards society, from its mightiest acts of national life, down to its most insignificant motions; from its common life, down to the private life of each individual; where, due to such extraordinary centralization, this body of parasites acquires a ubiquity and omniscience, a quickened capacity for motion and rapidity that finds an analogue only in the helpless lack of self-reliance, in the unstrung weakness of the body social itself;--that in such a country the National Assembly lost, with the control of the ministerial posts, all real influence; unless it simultaneously simplified the administration; if possible, reduced the army of office-holders; and, finally, allowed society and public opinion to establish its own organs, independent of government censorship.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '150'
- id: IV.4.5
  kind: p
  original: Aber das materielle Interesse der französischen Bourgeoisie ist gerade auf das innigste mit der Erhaltung jener breiten und vielverzweigten Staatsmaschine verwebt.
  en: But the Material Interest of the French bourgeoisie is most intimately bound up in maintenance of just such a large and extensively ramified governmental machine.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 150-151
- id: IV.4.6
  kind: p
  original: Hier bringt sie ihre überschüssige Bevölkerung unter und ergänzt in der Form von Staatsgehalten, was sie nicht in der Form von Profiten, Zinsen, Renten und Honoraren einstecken kann.
  en: There the bourgeoisie provides for its own superfluous membership; and supplies, in the shape of government salaries, what it can not pocket in the form of profit, interest, rent and fees.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: IV.4.7
  kind: p
  original: Andererseits zwang ihr politisches Interesse sie, die Repression, also die Mittel und das Personal der Staatsgewalt, täglich zu vermehren, während sie gleichzeitig einen ununterbrochenen Krieg gegen die öffentliche Meinung führen und die selbständigen Bewegungsorgane der Gesellschaft mißtrauisch verstümmeln, lähmen mußte, wo es ihr nicht gelang, sie gänzlich zu amputieren.
  en: On the other hand, its Political Interests daily compel it to increase the power of repression, i.e., the means and the personnel of the government; it is at the same time forced to conduct an uninterrupted warfare against public opinion, and, full of suspicion, to hamstring and lame the independent organs of society--whenever it does not succeed in amputating them wholly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: IV.4.8
  kind: p
  original: So war die französische Bourgeoisie durch ihre Klassenstellung gezwungen, einerseits die Lebensbedingungen einer jeden, also auch ihrer eigenen parlamentarischen Gewalt zu vernichten, andererseits die ihr feindliche Exekutivgewalt unwiderstehlich zu machen.
  en: Thus the bourgeoisie of France was forced by its own class attitude, on the one hand, to destroy the conditions for all parliamentary power, its own included, and, on the other, to render irresistible the Executive power that stood hostile to it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: IV.5.1
  kind: p
  original: Das neue Ministerium hieß das Ministerium d'Hautpoul.
  en: The new Ministry was called the d'Hautpoul Ministry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: IV.5.2
  kind: p
  original: Nicht als hätte General d'Hautpoul den Rang eines Ministerpräsidenten erhalten.
  en: Not that General d'Hautpoul had gained the rank of Ministerial President.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: IV.5.3
  kind: p
  original: Mit Barrot schaffte Bonaparte vielmehr zugleich diese Würde ab, die den Präsidenten der Republik allerdings zur legalen Nichtigkeit eines konstitutionellen Königs verdammte, aber eines konstitutionellen Königs ohne Thron und ohne Krone, ohne Zepter und ohne Schwert, ohne Unverantwortlichkeit, ohne den unverjährbaren Besitz der höchsten Staatswürde und, was das fatalste war, ohne Zivilliste.
  en: Along with Barrot, Bonaparte abolished this dignity, which, it must be granted, condemned the President of the republic to the legal nothingness of a constitutional kind, of a constitutional king at that, without throne and crown, without sceptre and without sword, without irresponsibility, without the imperishable possession of the highest dignity in the State, and, what was most untoward of all--without a civil list.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: IV.5.4
  kind: p
  original: Das Ministerium d'Hautpoul besaß nur einen Mann von parlamentarischem Rufe, den Juden Fould, eines der berüchtigsten Glieder der hohen Finanz.
  en: The d'Hautpoul Ministry numbered only one man of parliamentary reputation, the Jew Fould, one of the most notorious members of the high finance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: IV.5.5
  kind: p
  original: Ihm fiel das Finanzministerium anheim.
  en: To him fell the portfolio of finance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: IV.5.6
  kind: p
  original: Man schlage die Pariser Börsennotationen nach, und man wird finden, daß vom 1. November 1849 an die französischen Fonds steigen und fallen mit dem Steigen und Fallen der bonapartistischen Aktien.
  en: Turn to the Paris stock quotations, and it will be found that from November 1, 1849, French stocks fall and rise with the falling and rising of the Bonapartist shares.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: IV.5.7
  kind: p
  original: Während Bonaparte so seinen Affiliierten in der Börse gefunden hatte, bemächtigte er sich zugleich der Polizei durch Carliers Ernennung zum Polizeipräfekten von Paris.
  en: While Bonaparte had thus found his ally in the Bourse, he at the same time took possession of the Police through the appointment of Carlier as Prefect of Police.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: IV.6.1
  kind: p
  original: Indes konnten sich die Folgen des Ministerwechsels erst im Laufe der Entwicklung herausstellen.
  en: But the consequences of the change of Ministry could reveal themselves only in the course of events.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: IV.6.2
  kind: p
  original: Zunächst hatte Bonaparte nur einen Schritt vorwärts getan, um desto augenfälliger rückwärts getrieben zu werden.
  en: So far, Bonaparte had taken only one step forward, to be all the more glaringly driven back.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: IV.6.3
  kind: p
  original: Seiner barschen Botschaft folgte die servilste Untertänigkeitserklärung an die Nationalversammlung.
  en: Upon his harsh message, followed the most servile declarations of submissiveness to the National Assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: IV.6.4
  kind: p
  original: Sooft die Minister den schüchternen Versuch wagten, seine persönlichen Marotten als Gesetzesvorschläge einzubringen, schienen sie selbst nur widerwillig und durch ihre Stellung gezwungen, die komischen Aufträge zu erfüllen, von deren Erfolglosigkeit sie im voraus überzeugt waren.
  en: As often as the Ministers made timid attempts to introduce his own personal hobbies as bills, they themselves seemed unwilling and compelled only by their position to run the comic errands, of whose futility they were convinced in advance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
- id: IV.6.5
  kind: p
  original: Sooft Bonaparte im Rücken der Minister seine Absichten ausplauderte und mit seinen "idées napoléoniennes " spielte, desavouierten ihn die eignen Minister von der Tribüne der Nationalversammlung herab.
  en: As often as Bonaparte blabbed out his plans behind the backs of his Ministers, and sported his "idees napoleoniennes," his own Ministers disavowed him from the speakers' tribune in the National Assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '151'
  en_note: 'De Leon''s note [2]: Napoleonic ideas.'
- id: IV.6.6
  kind: p
  original: Seine Usurpationsgelüste schienen nur laut zu werden, damit das schadenfrohe Gelächter seiner Gegner nicht verstumme.
  en: His aspirations after usurpation seemed to become audible only to the end that the ironical laughter of his adversaries should not die out.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 151-152
- id: IV.6.7
  kind: p
  original: Er gebärdete sich als ein verkanntes Genie, das alle Welt für einen Simpel ausgibt.
  en: He deported himself like an unappreciated genius, whom the world takes for a simpleton.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IV.6.8
  kind: p
  original: Nie genoß er in vollerem Maße die Verachtung aller Klassen als während dieser Periode.
  en: Never did lie enjoy in fuller measure the contempt of all classes than at this period.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IV.6.9
  kind: p
  original: Nie herrschte die Bourgeoisie unbedingter, nie trug sie prahlerischer die Insignien der Herrschaft zu Schau.
  en: Never did the bourgeoisie rule more absolutely; never did it more boastfully display the insignia of sovereignty.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IV.7.1
  kind: p
  original: 'Ich habe hier nicht die Geschichte ihrer gesetzgeberischen Tätigkeit zu schreiben, die sich wahrend dieser Periode in zwei Gesetzen resümiert: in dem Gesetze, das die Weinsteuer wiederherstellte, in dem Unterrichtsgesetze, das den Unglauben abschafft.'
  en: 'It is not here my purpose to write the history of its legislative activity, which is summed up in two laws passed during this period: the law reestablishing the duty on wine, and the laws on education, to suppress infidelity.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IV.7.2
  kind: p
  original: Wenn den Franzosen das Weintrinken erschwert, ward ihnen desto reichlicher vom Wasser des wahren Lebens geschenkt.
  en: While the drinking of wine was made difficult to the Frenchmen, all the more bounteously was the water of pure life poured out to them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IV.7.3
  kind: p
  original: Wenn die Bourgeoisie in dem Gesetze über die Weinsteuer das alte gehässige französische Steuersystem für unantastbar erklärt, suchte sie durch das Unterrichtsgesetz den alten Gemütszustand der Massen zu sichern, der es ertragen ließ.
  en: Although in the law on the duty on wine the bourgeoisie declares the old hated French tariff system to be inviolable, it sought, by means of the laws on education, to secure the old good will of the masses that made the former bearable.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IV.7.4
  kind: p
  original: Man ist erstaunte, die Orleanisten, die liberalen Bourgeoisie, diese alten Apostel des Voltairianismus und der eklektischen Philosophie, ihren Stammfeinden, den Jesuiten, die Verwaltung des französischen Geistes anvertrauen zu sehen.
  en: One wonders to see the Orleanists, the liberal bourgeois, these old apostles of Voltarianism and of eclectic philosophy, entrusting the supervision of the French intellect to their hereditary enemies, the Jesuits.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IV.7.5
  kind: p
  original: Aber Orleanisten und Legitimisten konnten in Beziehung auf den Kronprätendenten auseinandergehen, sie begriffen, daß ihre vereinte Herrschaft die Unterdrückungsmittel zweier Epochen zu vereinigen gebot, daß die Unterjochungsmittel der Julimonarchie durch die Unterjochungsmittel der Restauration ergänzt und verstärkt werden mußten.
  en: But, while Orleanists and Legitimists could part company on the question of the Pretender to the crown, they understood full well that their joint reign dictated the joining of the means of oppression of two distinct epochs; that the means of subjugation of the July monarchy had to be supplemented with and strengthened by the means of subjugation of the restoration.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IV.8.1
  kind: p
  original: Die Bauern, in allen ihren Hoffnungen getäuscht, durch den niedrigen Stand der Getreidepreise einerseits, durch die wachsende Steuerlast und Hypothekenschuld andererseits mehr als je erdrückt, begannen sich in den Departements zu regen.
  en: The farmers, deceived in all their expectations, more than ever ground down by the law scale of the price of corn, on the one hand, and, on the other, by the growing load of taxation and mortgages, began to stir in the Departments.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IV.8.2
  kind: p
  original: Man antwortete ihnen durch eine Hetzjagd auf die Schulmeister, die den Geistlichen, durch eine Hetzjagd auf die Maires, die den Präfekten, und durch ein System der Spionage, dem alle unterworfen wurden.
  en: They were answered by the systematic baiting of the school masters, whom the Government subjected to the clergy; by the systematic baiting of the Mayors, whom it subjected to the Prefects; and by a system of espionage to which all were subjected.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IV.8.3
  kind: p
  original: In Paris und den großen Städten trägt die Reaktion selbst die Physiognomie ihrer Epoche und fordert mehr heraus, als sie niederschlägt.
  en: In Paris and the large towns, the reaction itself carries the physiognomy of its own epoch; it irritates more than it cows; in the country, it becomes low, moan, petty, tiresome, vexatious,--in a word, it becomes "gensdarme."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: IV.8.4
  kind: p
  original: Auf dem Lande wird sie platt, gemein, kleinlich, ermüdend, plackend, mit einem Worte Gendarm.
  en: ''
  joined_to: IV.8.3
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '152'
- id: IV.8.5
  kind: p
  original: Man begreift, wie drei Jahre vom Regime des Gendarmen, eingesegnet durch das Regime des Pfaffen, unreife Massen demoralisieren mußten.
  en: It is easily understood how three years of the gensdarme regime, sanctified by the regime of the clergyman, was bound to demoralize unripe masses.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IV.9.1
  kind: p
  original: 'Welche Summe von Leidenschaft und Deklamation die Ordnungspartei von der Tribüne der Nationalversammlung herab gegen die Minorität aufwenden mochte, ihre Rede blieb einsilbig wie die des Christen, dessen Worte sein sollen: Ja, ja, nein, nein!'
  en: Whatever the mass of passion and declamation, that the party of Order expended from the speakers' tribune in the National Assembly against the minority, its speech remained monosyllabic, like that of the Christian, whose speech was to be "Aye, aye; nay, nay."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
- id: IV.9.2
  kind: p
  original: Einsilbig von der Tribüne herab wie in der Presse.
  en: It was monosyllabic, whether from the tribune or the press; dull as a conundrum, whose solution is known beforehand.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '152'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: IV.9.3
  kind: p
  original: Fast wie ein Rätsel, dessen Lösung im voraus bekannt ist.
  en: ''
  joined_to: IV.9.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '152'
- id: IV.9.4
  kind: p
  original: 'Handelte es sich um Petitionsrecht oder um Weinsteuer, um Preßfreiheit oder um Freihandel, um Klubs oder um Munizipalverfassung, um Schutz der persönlichen Freiheit oder um Regelung des Staatshaushaltes, das Losungswort kehrt immer wieder, das Thema bleibt immer dasselbe, der Urteilsspruch ist immer fertig und lautet unveränderlich: "Sozialismus!"'
  en: 'Whether the question was the right of petition or the duty on wine, the liberty of the press or free trade, clubs or municipal laws, protection of individual freedom or the regulation of national economy, the slogan returns ever again, the theme is monotonously the same, the verdict is ever ready and unchanged: Socialism!'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 152-153
- id: IV.9.5
  kind: p
  original: Für sozialistisch wird selbst der bürgerliche Liberalismus erklärt, für sozialistisch die bürgerliche Aufklärung, für sozialistisch die bürgerliche Finanzreform.
  en: Even bourgeois liberalism is pronounced socialistic; socialistic, alike, is pronounced popular education; and, likewise, socialistic national financial reform.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: IV.9.6
  kind: p
  original: Es war sozialistisch, eine Eisenbahn zu bauen, wo schon ein Kanal vorhanden war, und es war sozialistisch, sich mit dem Stocke zu verteidigen, wenn man mit dem Degen angegriffen wurde.
  en: It was socialistic to build a railroad where already a canal was; and it was socialistic to defend oneself with a stick when attacked with a sword.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: IV.10.1
  kind: p
  original: Es war dies nicht bloße Redeform, Mode, Parteitaktik.
  en: This was not a mere form of speech, a fashion, nor yet party tactics.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: IV.10.2
  kind: p
  original: Die Bourgeoisie hatte die richtige Einsicht, daß alle Waffen, die sie gegen den Feudalismus geschmiedet, ihre Spitzen gegen sie selbst kehrten, daß alle Bildungsmittel, die sie erzeugt, gegen ihre eigne Zivilisation rebellierten, daß alle Götter, die sie geschaffen, von ihr abgefallen waren.
  en: The bourgeoisie perceives correctly that all the weapons, which it forged against feudalism, turn their edges against itself; that all the means of education, which it brought forth, rebel against its own civilization; that all the gods, which it made, have fallen away from it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: IV.10.3
  kind: p
  original: Sie begriff, daß alle sogenannten bürgerlichen Freiheiten und Fortschrittsorgane ihre Klassenherrschaft zugleich an der gesellschaftlichen Grundlage und an der politischen Spitze angriffen und bedrohten, also "sozialistisch" geworden waren.
  en: It understands that all its so-called citizens' rights and progressive organs assail and menace its class rule, both in its social foundation and its political superstructure--consequently, have become "socialistic."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: IV.10.4
  kind: p
  original: In dieser Drohung und in diesem Angriffe fand sie mit Recht das Geheimnis des Sozialismus, dessen Sinn und Tendenz sie richtiger beurteilt, als der sogenannte Sozialismus sich selbst zu beurteilen weiß, der daher nicht begreifen kann, wie die Bourgeoisie sich verstockt gegen ihn verschließt, mag er nun sentimental über die Leiden der Menschheit winseln oder christlich das Tausendjährige Reich und die allgemeine Bruderliebe verkünden oder humanistisch von Geist, Bildung, Freiheit faseln oder doktrinär ein System der Vermittlung und der Wohlfahrt aller Klassen aushecken.
  en: It justly scents in this menace and assault the secret of Socialism, whose meaning and tendency it estimates more correctly than the spurious, so-called Socialism, is capable of estimating itself, and which, consequently, is unable to understand how it is that the bourgeoisie obdurately shuts up its ears to it, alike whether it sentimentally whines about the sufferings of humanity; or announces in Christian style the millennium and universal brotherhood; or twaddles humanistically about the soul, culture and freedom; or doctrinally matches out a system of harmony and wellbeing for all classes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: IV.10.5
  kind: p
  original: Was sie aber nicht begriff, war die Konsequenz, daß ihr eignes parlamentarisches Regime, daß ihre politische Herrschaft überhaupt nun auch als sozialistisch dem allgemeinen Verdammungsurteil verfallen mußte.
  en: What, however, the bourgeoisie does not understand is the consequence that its own parliamentary regime, its own political reign, is also of necessity bound to fall under the general ban of "socialistic."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: IV.10.6
  kind: p
  original: Solange die Herrschaft der Bourgeoisklasse sich nicht vollständig organisiert, nicht ihren reinen politischen Ausdruck gewonnen hatte, konnte auch der Gegensatz der andern Klassen nicht rein hervortreten, und wo er hervortrat, nicht die gefährlicher Wendung nehmen, die jeden Kampf gegen die Staatsgewalt in einen Kampf gegen das Kapital verwandelt.
  en: So long as the rule of the bourgeoisie is not fully organized, has not acquired its purely political character, the contrast with the other classes cannot come into view in all its sharpness; and, where it does come into view, it cannot take that dangerous turn that converts every conflict with the Government into a conflict with Capital.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: IV.10.7
  kind: p
  original: Wenn sie in jeder Lebensregung der Gesellschaft die "Ruhe" gefährdet sah, wie konnte sie an der Spitze der Gesellschaft das Regime der Unruhe, ihr eignes Regime, das parlamentarische Regime behaupten wollen, dieses Regime, das nach dem Ausdrucke eines ihrer Redner im Kampfe und durch den Kampf lebt?
  en: When, however, the French bourgeoisie began to realize in every pulsation of society a menace to "peace," how could it, at the head of society, pretend to uphold the regime of unrest, its own regime, the parliamentary regime, which, according to the expression of one of its own orators, lives in struggle, and through struggle?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: IV.10.8
  kind: p
  original: Das parlamentarische Regime lebt von der Diskussion, wie soll es die Diskussion verbieten?
  en: The parliamentary regime lives on discussion,--how can it forbid discussion?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '153'
- id: IV.10.9
  kind: p
  original: Jedes Interesse, jede gesellschaftliche Einrichtung wird hier in allgemeine Gedanken verwandelt, als Gedanken verhandelt, wie soll irgendein Interesse, eine Einrichtung sich über dem Denken behaupten und als Glaubensartikel imponieren?
  en: Every single interest, every single social institution is there converted into general thoughts, is treated as a thought,--how could any interest or institution claim to be above thought, and impose itself as an article of faith?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 153-154
- id: IV.10.10
  kind: p
  original: Der Rednerkampf auf der Tribüne ruft den Kampf der Preßbengel hervor, der debattierende Klub im Parlament ergänzt sich notwendig durch debattierende Klubs in den Salons und in den Kneipen, die Repräsentanten, die beständig an die Volksmeinung appellieren, berechtigen die Volksmeinung, in Petitionen ihre wirkliche Meinung zu sagen.
  en: The orators' conflict in the tribune calls forth the conflict of the rowdies in the press the debating club in parliament is necessarily supplemented by debating clubs in the salons and the barrooms; the representatives, who are constantly appealing to popular opinion, justify popular opinion in expressing its real opinion in petitions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: IV.10.11
  kind: p
  original: Das parlamentarische Regime überläßt alles der Entscheidung der Majoritäten, wie sollen die großen Majoritäten jenseits des Parlaments nicht entscheiden wollen?
  en: The parliamentary regime leaves everything to the decision of majorities,--how can the large majorities beyond parliament be expected not to wish to decide?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: IV.10.12
  kind: p
  original: Wenn ihr auf dem Gipfel des Staates die Geige streicht, was andres erwartet ihr, als daß die drunten tanzen?
  en: If, from above, they hear the fiddle screeching, what else is to be expected than that those below should dance?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: IV.11.1
  kind: p
  original: Indem also die Bourgeoisie, was sie früher als "liberal" gefeiert, jetzt als "sozialistisch" verketzert, gesteht sie ein, daß ihr eignes Interesse gebietet, sie der Gefahr des Selbstregierens zu überheben, daß, um die Ruhe im Lande herzustellen, vor allem ihr Bourgeoisparlament zur Ruhe gebracht, um ihre gesellschaftliche Macht unversehrt zu erhalten, ihre politische Macht gebrochen werden müsse; daß die Privatbourgeois nur fortfahren können, die andern Klassen zu exploitieren und sich ungetrübt des Eigentums, der Familie, der Religion und der Ordnung zu erfreuen, unter der Bedingung, daß ihre Klasse neben den andern Klassen zu gleicher politischer Nichtigkeit verdammt werde; daß, um ihren Beutel zu retten, die Krone ihr abgeschlagen und das Schwert, das sie beschützen solle, zugleich als Damoklesschwert über ihr eignes Haupt gehängt werden müsse.
  en: Accordingly, by now persecuting as Socialist what formerly it had celebrated as Liberal, the bourgeoisie admits that its own interest orders it to raise itself above the danger of self government; that, in order to restore rest to the land, its own bourgeois parliament must, before all, be brought to rest; that, in order to preserve its social power unhurt, its political power must be broken; that the private bourgeois can continue to exploit the other classes and rejoice in "property," "family," "religion" and "order" only under the condition that his own class be condemned to the same political nullity of the other classes, that, in order to save their purse, the crown must be knocked off their heads, and the sword that was to shield them, must at the same time be hung over their heads as a sword of Damocles.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: IV.12.1
  kind: p
  original: In dem Bereiche der allgemeinen bürgerlichen Interessen zeigte sich die Nationalversammlung so unproduktiv, daß z.B. die Verhandlungen über die Paris-Avignoner Eisenbahn, die im Winter 1850 begannen, am 2. Dezember 1851 noch nicht zum Schluß reif waren.
  en: In the domain of general bourgeois interests, the National Assembly proved itself so barren, that, for instance, the discussion over the Paris-Avignon railroad, opened in the winter of 1850, was not yet ripe for a vote on December 2, 1851.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: IV.12.2
  kind: p
  original: Wo sie nicht unterdrückte, reagierte, war sie mit unheilbarer Unfruchtbarkeit geschlagen.
  en: Wherever it did not oppress or was reactionary, the bourgeoisie was smitten with incurable barrenness.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: IV.13.1
  kind: p
  original: Während Bonapartes Ministerium teils die Initiative zu Gesetzen im Geiste der Ordnungspartei ergriff, teils ihre Härte in der Ausführung und Handhabung noch übertrieb, suchte er andererseits durch kindisch alberne Vorschläge Popularität zu erobern, seinen Gegensatz zur Nationalversammlung zu konstatieren und auf einen geheimen Hinterhalt hinzudeuten, der nur durch die Verhältnisse einstweilen verhindert werde, dem französischen Volke seine verborgenen Schätze zu erschließen.
  en: While Bonaparte's Ministry either sought to take the initiative of laws in the spirit of the party of Order, or even exaggerated their severity in their enforcement and administration, he, on his part, sought to win popularity by means of childishly silly propositions, to exhibit the contrast between himself and the National Assembly, and to hint at a secret plan, held in reserve and only through circumstances temporarily prevented from disclosing its hidden treasures to the French people.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: IV.13.2
  kind: p
  original: So der Vorschlag, den Unteroffizieren eine tägliche Zulage von vier Sous zu dekretieren.
  en: Of this nature was the proposition to decree a daily extra pay of four sous to the under-officers; so, likewise, the proposition for a "word of honor" loan bank for working-men.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: IV.13.3
  kind: p
  original: So der Vorschlag einer Ehrenleihbank für die Arbeiter.
  en: ''
  joined_to: IV.13.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '154'
- id: IV.13.4
  kind: p
  original: Geld geschenkt und Geld gepumpt zu erhalten, das war die Perspektive, womit er die Massen zu ködern hoffte.
  en: To have money given and money borrowed--that was the perspective that he hoped to cajole the masses with.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '154'
- id: IV.13.5
  kind: p
  original: Schenken und Pumpen, darauf beschränkt sich die Finanzwissenschaft des Lumpenproletariats, des vornehmen und des gemeinen.
  en: Presents and loans--to that was limited the financial wisdom of the slums, the high as well as the low; to that were limited the springs which Bonaparte knew how to set in motion.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 154-155
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: IV.13.6
  kind: p
  original: Darauf beschränkten sich die Springfedern, die Bonaparte in Bewegung zu setzen wußte.
  en: ''
  joined_to: IV.13.5
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '155'
- id: IV.13.7
  kind: p
  original: Nie hat ein Prätendent platter auf die Plattheit der Massen spekuliert.
  en: Never did Pretender speculate more dully upon the dullness of the masses.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IV.14.1
  kind: p
  original: Die Nationalversammlung brauste wiederholt auf bei diesen unverkennbaren Versuchen, auf ihre Kosten Popularität zu erwerben, bei der wachsenden Gefahr, daß dieser Abenteurer, den die Schulden voranpeitschten und kein erworbener Ruf zurückhielt, einen verzweifelten Streich wagen werde.
  en: Again and again did the National Assembly fly into a passion at these unmistakable attempts to win popularity at its expense, and at the growing danger that this adventurer, lashed on by debts and unrestrained by reputation, might venture upon some desperate act.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IV.14.2
  kind: p
  original: Die Verstimmung zwischen der Ordnungspartei und dem Präsidenten hatte einen drohenden Charakter angenommen, als ein unerwartetes Ereignis ihn reuig in ihre Arme zurückwarf.
  en: The strained relations between the party of Order and the President had taken on a threatening aspect, when an unforeseen event threw him back, rueful into its arms.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IV.14.3
  kind: p
  original: Wir meinen die Nachwahlen vom 10. März 1850.
  en: We mean the supplementary elections of March, 1850.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IV.14.4
  kind: p
  original: Diese Wahlen fanden statt, um die Repräsentantenstellen, die nach dem 13. Juni durch das Gefängnis oder das Exil erledigt waren, wieder zu besetzen.
  en: These elections took place to fill the vacancies created in the National Assembly, after June 13, by imprisonment and exile.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IV.14.5
  kind: p
  original: Paris wählte nur sozial-demokratische Kandidaten.
  en: Paris elected only Social-Democratic candidates; it even united the largest vote upon one of the insurgents of June, 1848,--Deflotte.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: IV.14.6
  kind: p
  original: Es vereinte sogar die meisten Stimmen auf einen Insurgenten des Juni 1848, auf de Flotte.
  en: ''
  joined_to: IV.14.5
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '155'
- id: IV.14.7
  kind: p
  original: So rächte sich das mit dem Proletariat alliierte Pariser Kleinbürgertum für seine Niederlage vom 13. Juni 1849.
  en: In this way the small traders' world of Paris, now allied with the proletariat, revenged itself for the defeat of June 13, 1849.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IV.14.8
  kind: p
  original: Es schien im Augenblick der Gefahr nur vom Kampfplatz verschwunden zu sein, um ihn bei günstiger Gelegenheit mit massenhafteren Streitkräften und mit einer kühneren Kampfparole wieder zu betreten.
  en: It seemed to have disappeared from the field of battle at the hour of danger only to step on it again at a more favorable opportunity, with increased forces for the fray, and with a bolder war cry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IV.14.9
  kind: p
  original: Ein Umstand schien die Gefahr dieses Wahlsieges zu erhöhen.
  en: A circumstance seemed to heighten the danger of this electoral victory.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IV.14.10
  kind: p
  original: Die Armee stimmte in Paris für den Juni-Insurgenten gegen La Hitte, einen Minister Bonapartes, und in den Departements zum großen Teil für die Montagnards, die auch hier, zwar nicht so entschieden wie in Paris, das Übergewicht über ihre Gegner behaupteten.
  en: The Army voted in Paris for a June insurgent against Lahitte, a Minister of Bonaparte's, and, in the Departments, mostly for the candidates of the Mountain, who, there also, although not as decisively as in Paris, maintained the upper hand over their adversaries.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IV.15.1
  kind: p
  original: Bonaparte sah sich plötzlich wieder die Revolution gegenüberstehen.
  en: Bonaparte suddenly saw himself again face to face with the revolution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IV.15.2
  kind: p
  original: Wie am 29. Januar 1849, wie am 13. Juni 1849 verschwand er am 10. März 1850 hinter der Partei der Ordnung.
  en: As on January 29, 1849, as on June 13, 1849, on May 10, 1850, he vanished again behind the party of Order.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IV.15.3
  kind: p
  original: Er beugte sich, er tat kleinmütig Abbitte, er erbot sich, auf Befehl der parlamentarischen Majorität jedes beliebige Ministerium zu ernennen, er flehte sogar die orleanistischen und legitimistischen Parteiführer, die Thiers, die Berryer, die Broglie, die Molé, kurz die sogenannten Burggrafen, das Staatsruder in eigner Person zu ergreifen.
  en: He bent low; he timidly apologized; he offered to appoint any Ministry whatever at the behest of the parliamentary majority; he even implored the Orleanist and Legitimist party leaders--the Thiers, Berryers, Broglies, Moles, in short, the so-called burgraves--to take hold of the helm of State in person.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IV.15.4
  kind: p
  original: Die Partei der Ordnung wußte diesen unwiederbringlichen Augenblick nicht zu benutzen.
  en: The party of Order did not know how to utilize this opportunity, that was never to return.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IV.15.5
  kind: p
  original: Statt sich kühn der angebotenen Gewalt zu bemächtigen, zwang sie Bonaparte nicht einmal, das am 1. November entlassene Ministerium wieder einzusetzen; sie begnügte sich, ihn durch die Verzeihung zu demütigen und dem Ministerium d'Hautpoul Herrn Baroche beizugesellen.
  en: Instead of boldly taking possession of the proffered power, it did not even force Bonaparte to restore the Ministry dismissed on November 1; it contented itself with humiliating him with its pardon, and with affiliating Mr. Baroche to the d'Hautpoul Ministry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IV.15.6
  kind: p
  original: Dieser Baroche hatte als öffentlicher Ankläger, das eine Mal gegen die Revolutionäre vom 15. Mai, das andre Mal gegen die Demokraten des 13. Juni, vor dem Hochgerichte zu Bourges gewütet, beide Male wegen Attentat auf die Nationalversammlung.
  en: This Baroche had, as Public Prosecutor, stormed before the High Court at Bourges, once against the revolutionists of May 15, another time against the Democrats of June 13, both times on the charge of "attentats" against the National Assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '155'
- id: IV.15.7
  kind: p
  original: Keiner der Minister Bonapartes trug später mehr dazu bei, die Nationalversammlung herabzuwürdigen, und nach dem 2. Dezember 1851 finden wir ihn wieder als wohlbestallten und teuer bezahlten Vizepräsidenten des Senats.
  en: None of Bonaparte's Ministers contributed later more towards the degradation of the National Assembly; and, after December 2, 1851, we meet him again as the comfortably stalled and dearly paid Vice-President of the Senate.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 155-156
- id: IV.15.8
  kind: p
  original: Er hatte den Revolutionären in die Suppe gespuckt, damit Bonaparte sie aufesse.
  en: He had spat into the soup of the revolutionists for Bonaparte to eat it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IV.16.1
  kind: p
  original: Die sozial-demokratische Partei ihrerseits schien nur nach Vorwänden zu haschen, um ihren eignen Sieg wieder in Frage zu stellen und ihm die Pointe abzubrechen.
  en: On its part, the Social Democratic party seemed only to look for pretexts in order to make its own victory doubtful, and to dull its edge.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IV.16.2
  kind: p
  original: Vidal, einer der neugewählten Pariser Repräsentanten, war gleichzeitig in Straßburg gewählt worden.
  en: Vidal, one of the newly elected Paris representatives, was returned for Strassburg also.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IV.16.3
  kind: p
  original: Man bewog ihn, die Wahl für Paris abzulehnen und die für Straßburg anzunehmen.
  en: He was induced to decline the seat for Paris and accept the one for Strassburg.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IV.16.4
  kind: p
  original: Statt also ihrem Siege auf dem Wahlplatz einen definitiven Charakter zu geben und dadurch die Ordnungspartei zu zwingen, ihn sofort im Parlamente streitig zu machen, statt so den Gegner im Augenblick des Volksenthusiasmus und der günstigen Stimmung der Armee zum Kampfe zu treiben, ermüdete die demokratische Partei Paris während der Monate März und April mit einer neuen Wahlagitation, ließ die aufgeregten Volksleidenschaften in diesem abermaligen provisorischen Stimmenspiel sich aufreiben, die revolutionäre Tatkraft in konstitutionellen Erfolgen sich sättigen, in kleinen Intrigen, hohlen Deklamationen und Scheinbewegungen verpuffen, die Bourgeoisie sich sammeln und ihre Vorkehrungen treffen, endlich die Bedeutung der Märzwahlen in der nachträglichen Aprilwahl, mit der Wahl Eugène Sues, einen sentimental abschwächenden Kommentar finden.
  en: Thus, instead of giving a definite character to their victory at the hustings, and thereby compelling the party of Order forthwith to contest it in parliament; instead of thus driving the foe to battle at the season of popular enthusiasm and of a favorable temper in the Army, the democratic party tired out Paris with a new campaign during the months of March and April; it allowed the excited popular passions to wear themselves out in this second provisional electoral play it allowed the revolutionary vigor to satiate itself with constitutional successes, and lose its breath in petty intrigues, hollow declamation and sham moves; it gave the bourgeoisie time to collect itself and make its preparations finally, it allowed the significance of the March elections to find a sentimentally weakening commentary at the subsequent April election in the victory of Eugene Sue.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IV.16.5
  kind: p
  original: Mit einem Worte, sie schickte den 10. März in den April.
  en: In one word, it turned the 10th of March into an April Fool.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IV.17.1
  kind: p
  original: Die parlamentarische Majorität begriff die Schwäche ihres Gegners.
  en: The parliamentary majority perceived the weakness of its adversary.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IV.17.2
  kind: p
  original: Ihre siebzehn Burggrafen, denn Bonaparte hatte ihr die Leitung und die Verantwortlichkeit des Angriffs überlassen, arbeiteten ein neues Wahlgesetz aus, dessen Vorlage dem Herrn Faucher, der sich diese Ehre ausbat, anvertraut wurde.
  en: Its seventeen burgraves--Bonaparte had left to it the direction of and responsibility for the attack--, framed a new election law, the moving of which was entrusted to Mr. Faucher, who had applied for the honor.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IV.17.3
  kind: p
  original: Am 8. Mai brachte er das Gesetz ein, wodurch das allgemeine Wahlrecht abgeschafft, ein dreijähriges Domizil an dem Orte der Wahl den Wählern als Bedingung auferlegt, endlich der Nachweis dieses Domizils für die Arbeiter von dem Zeugnisse ihrer Arbeitgeber abhängig gemacht wurde.
  en: On May 8, he introduced the new law whereby universal suffrage was abolished; a three years residence in the election district imposed as a condition for voting; and, finally, the proof of this residence made dependent, for the working-man, upon the testimony of his employer.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IV.18.1
  kind: p
  original: Wie revolutionär die Demokraten während des konstitutionellen Wahlkampfes aufgeregt und getobt hatten, so konstitutionell predigten sie jetzt, wo es galt, mit den Waffen in der Hand den Ernst jener Wahlsiege zu beweisen, Ordnung, majestätische Ruhe (calme majestueux), gesetzliche Haltung, d.h. blinde Unterwerfung unter den Willen der Konterrevolution, der sich als Gesetz breitmachte.
  en: As revolutionarily as the democrats had agitated and stormed during the constitutional struggles, so constitutionally did they, now, when it was imperative to attest, arms in hand, the earnestness of their late electoral victories, preach order, "majestic calmness," lawful conduct, i. e., blind submission to the will of the counter-revolution, which revealed itself as law.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '156'
- id: IV.18.2
  kind: p
  original: Während der Debatte beschämte der Berg die Partei der Ordnung, indem er gegen ihre revolutionäre Leidenschaftlichkeit die leidenschaftslose Haltung des Biedermanns geltend machte, der den Rechtsboden behauptet, und indem er sie mit dem furchtbaren Vorwurfe zu Boden schlug, daß sie revolutionär verfahre.
  en: During the debate, the Mountain put the party of Order to shame by maintaining the passionless attitude of the law-abiding burger, who upholds the principle of law against revolutionary passions; and by twitting the party of Order with the fearful reproach of proceeding in a revolutionary manner.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 156-157
- id: IV.18.3
  kind: p
  original: Selbst die neugewählten Deputierten bemühten sich durch anständiges und besonnenes Auftreten zu beweisen, welche Verkennung es war, sie als Anarchisten zu verschreien und ihre Wahl als einen Sieg der Revolution auszulegen.
  en: Even the newly elected deputies took pains to prove by their decent and thoughtful deportment what an act of misjudgment it was to decry them as anarchists, or explain their election as a victory of the revolution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IV.18.4
  kind: p
  original: Am 31. Mai ging das neue Wahlgesetz durch.
  en: The new election law was passed on May 31. The Mountain contented itself with smuggling a protest into the pockets of the President of the Assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: IV.18.5
  kind: p
  original: Die Montagne begnügte sich damit, dem Präsidenten einen Protest in die Tasche zu schmuggeln.
  en: ''
  joined_to: IV.18.4
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '157'
- id: IV.18.6
  kind: p
  original: Dem Wahlgesetz folgte ein neues Preßgesetz, wodurch die revolutionäre Zeitungspresse vollständig beseitigt wurde.
  en: To the election law followed a new press law, whereby the revolutionary press was completely done away with.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IV.18.7
  kind: p
  original: Sie hatte ihr Schicksal verdient.
  en: It had deserved its fate.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IV.18.8
  kind: p
  original: '"National" und "La Presse", zwei bürgerliche Organe, blieben nach dieser Sündflut als äußerste Vorposten der Revolution zurück.'
  en: The "National" and the "Presse," two bourgeois organs, remained after this deluge the extreme outposts of the revolution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IV.19.1
  kind: p
  original: Wir haben gesehen, wie die demokratischen Führer während März und April alles getan hatten, um das Volk von Paris in einen Scheinkampf zu verwickeln, wie sie nach dem 8. Mai alles taten, um es vom wirklichen Kampf abzuhalten.
  en: We have seen how, during March and April, the democratic leaders did everything to involve the people of Paris in a sham battle, and how, after May 8, they did everything to keep it away from a real battle.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IV.19.2
  kind: p
  original: Wir dürfen zudem nicht vergessen, daß das Jahr 1850 eines der glänzendsten Jahre industrieller und kommerzieller Prosperität, also das Pariser Proletariat vollständig beschäftigt war.
  en: We may not here forget that the year 1850 was one of the most brilliant years of industrial and commercial prosperity; consequently, that the Parisian proletariat was completely employed.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IV.19.3
  kind: p
  original: Allein das Wahlgesetz vom 31. Mai 1850 schloß es von aller Teilnahme an der politischen Gewalt aus.
  en: But the election law of May 31, 1850 excluded them from all participation in political power; it cut the field of battle itself from under them; it threw the workingmen back into the state of pariahs, which they had occupied before the February revolution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
  align: '3:1'
  review: true
  review_reason: 3 de sentence(s) matched to 1 en sentence(s)
- id: IV.19.4
  kind: p
  original: Es schnitt ihm das Kampfterrain selbst ab.
  en: ''
  joined_to: IV.19.3
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '157'
- id: IV.19.5
  kind: p
  original: Es warf die Arbeiter in die Pariastellung zurück, die sie vor der Februarrevolution eingenommen hatten.
  en: ''
  joined_to: IV.19.3
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '157'
- id: IV.19.6
  kind: p
  original: Indem sie einem solchen Ereignis gegenüber sich von den Demokraten lenken lassen und das revolutionäre Interesse ihrer Klasse über einem augenblicklichen Wohlbehagen vergessen konnten, verzichteten sie auf die Ehre, eine erobernde Macht zu sein, unterwarfen sich ihrem Schicksale, bewiesen, daß die Niederlage vom Juni 1848 sie für Jahre kampfunfähig gemacht und daß der geschichtliche Prozeß zunächst wieder über ihren Köpfen vor sich gehen müsse.
  en: In allowing themselves, in sight of such an occurrence, to be led by the democrats, and in forgetting the revolutionary interests of their class through temporary comfort, the workingmen abdicated the honor of being a conquering power; they submitted to their fate; they proved that the defeat of June, 1848, had incapacitated them from resistance for many a year to come finally, that the historic process must again, for the time being, proceed over their heads.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IV.19.7
  kind: p
  original: 'Was die kleinbürgerlichen Demokratie betrifft, die am 13. Juni geschrien hatte: "aber wenn erst das allgemeine Wahlrecht angetastet wird, aber dann!" - so tröstete sie sich jetzt damit, daß der konterrevolutionäre Schlag, der sie getroffen, kein Schlag und das Gesetz vom 31. Mai kein Gesetz sei.'
  en: 'As to the small traders'' democracy, which, on June 13, had cried out: "If they but dare to assail universal suffrage... then... then we will show who we are!"--they now consoled themselves with the thought that the counter-revolutionary blow, which had struck them, was no blow at all, and that the law of May 31 was no law.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IV.19.8
  kind: p
  original: Am zweiten [Sonntag des Monats] Mai 1852 erscheint jeder Franzose auf dem Wahlplatze, in der einen Hand den Stimmzettel, in der anderen das Schwert.
  en: On May 2, 1852, according to them, every Frenchman would appear at the hustings, in one hand the ballot, in the other the sword.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IV.19.9
  kind: p
  original: Mit dieser Prophezeiung tat sie sich selbst Genüge.
  en: With this prophecy they set their hearts at ease.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IV.19.10
  kind: p
  original: Die Armee endlich wurde wie für die Wahlen vom 29. Mai 1849, so für die vom März und April 1850 von ihren Vorgesetzten gezüchtigt.
  en: Finally, the Army was punished by its superiors for the elections of May and April, 1850, as it was punished for the election of May 29, 1849.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IV.19.11
  kind: p
  original: 'Diesmal sagte sie sich aber entschieden: "Die Revolution prellt uns nicht zum dritten Mal."'
  en: 'This time, however, it said to itself determinately: "The revolution shall not cheat us a third time."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IV.20.1
  kind: p
  original: Das Gesetz vom 31. Mai 1850 war der coup d'état der Bourgeoisie.
  en: The law of May 31, 1850, was the "coup d'etat" of the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
- id: IV.20.2
  kind: p
  original: Alle ihre bisherigen Eroberungen über die Revolution hatten nur einen provisorischen Charakter.
  en: 'All its previous conquests over the revolution had only a temporary character: they became uncertain the moment the National Assembly stepped off the stage; they depended upon the accident of general elections, and the history of the elections since 1848 proved irrefutably that, in the same measure as the actual reign of the bourgeoisie gathered strength, its moral reign over the masses wore off.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '157'
  align: '3:1'
  review: true
  review_reason: 3 de sentence(s) matched to 1 en sentence(s)
- id: IV.20.3
  kind: p
  original: Sie waren in Frage gestellt, sobald die jetzige Nationalversammlung von der Bühne abtrat.
  en: ''
  joined_to: IV.20.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '157'
- id: IV.20.4
  kind: p
  original: Sie hingen von dem Zufall einer neuen allgemeinen Wahl ab, und die Geschichte der Wahlen seit 1848 bewies unwiderleglich, daß in demselben Maße, wie die faktische Herrschaft der Bourgeoisie sich entwickelte, ihre moralische Herrschaft über die Volksmassen verlorenging.
  en: ''
  joined_to: IV.20.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: 157-158
- id: IV.20.5
  kind: p
  original: Das allgemeine Wahlrecht erklärte sich am 10. März direkt gegen die Herrschaft der Bourgeoisie, die Bourgeoisie antwortete mit der Ächtung des allgemeinen Wahlrechts.
  en: Universal suffrage pronounced itself on May 10 pointedly against the reign of the bourgeoisie; the bourgeoisie answered with the banishment of universal suffrage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: IV.20.6
  kind: p
  original: Das Gesetz vom 31. Mai war also eine der Notwendigkeiten des Klassenkampfes.
  en: The law of May 31 was, accordingly, one of the necessities of the class struggle.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: IV.20.7
  kind: p
  original: Andererseits erheischte die Konstitution, damit die Wahl des Präsidenten der Republik gültig sei, ein Minimum von zwei Millionen Stimmen.
  en: On the other hand, the constitution required a minimum of two million votes for the valid ejection of the President of the republic.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: IV.20.8
  kind: p
  original: Erhielt keiner der Präsidentschaftskandidaten dies Minimum, so sollte die Nationalversammlung unter den drei Kandidaten, denen die meisten Stimmen zufallen würden, den Präsidenten wählen.
  en: If none of the Presidential candidates polled this minimum, then the National Assembly was to elect the President out of the three candidates polling the highest votes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: IV.20.9
  kind: p
  original: Zur Zeit, wo die Konstituante dies Gesetz machte, waren zehn Millionen Wähler auf den Stimmlisten eingeschrieben.
  en: At the time that the constitutive body made this law, ten million voters were registered on the election rolls.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: IV.20.10
  kind: p
  original: In ihrem Sinne reichte also ein Fünftel der Wahlberechtigten hin, um die Präsidentschaftswahl gültig zu machen.
  en: In its opinion, accordingly, one-fifth of the qualified voters sufficed to make a choice for President valid.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: IV.20.11
  kind: p
  original: Das Gesetz vom 31. Mai strich wenigstens drei Millionen Stimmen von den Wahllisten, reduzierte so die Zahl der Wahlberechtigten auf sieben Millionen und behielt nichtsdestoweniger das gesetzliche Minimum von zwei Millionen für die Präsidentschaftswahl bei.
  en: The law of May 31 struck at least three million voters off the rolls, reduced the number of qualified voters to seven millions, and yet, not withstanding, it kept the lawful minimum at two millions for the election of a President.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: IV.20.12
  kind: p
  original: Es erhöhte also das gesetzliche Minimum von einem Fünftel auf beinah ein Drittel der wahlfähigen Stimmen, d.h., es tat alles, um die Präsidentenwahl aus den Händen des Volkes in die Hände der Nationalversammlung hinüberzuschmuggeln.
  en: Accordingly, it raised the lawful minimum from a fifth to almost a third of the qualified voters, i.e., it did all it could to smuggle the Presidential election out of the hands of the people into those of the National Assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
- id: IV.20.13
  kind: p
  original: So schien die Partei der Ordnung durch das Wahlgesetz vom 31. Mai ihre Herrschaft doppelt befestigt zu haben, indem sie die Wahl der Nationalversammlung und die des Präsidenten der Republik dem stationären Teil der Gesellschaft anheimgab.
  en: Thus, by the election law of May 31, the party of Order seemed to have doubly secured its empire, in that it placed the election of both the National Assembly and the President of the republic in the keeping of the stable portion of society.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '158'
