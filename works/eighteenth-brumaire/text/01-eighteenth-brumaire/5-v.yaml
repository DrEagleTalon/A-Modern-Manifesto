- id: V.1.1
  kind: p
  original: Der Kampf brach sofort wieder aus zwischen der Nationalversammlung und Bonaparte, sobald die revolutionäre Krise überdauert und das allgemeine Wahlrecht abgeschafft war.
  en: The strife immediately broke out again between the National Assembly and Bonaparte, so soon as the revolutionary crisis was weathered, and universal suffrage was abolished.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: V.2.1
  kind: p
  original: Die Konstitution hatte das Gehalt Bonapartes auf 600.000 Francs festgesetzt.
  en: The Constitution had fixed the salary of Bonaparte at 600,000 francs.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: V.2.2
  kind: p
  original: Kaum ein halbes Jahr nach seiner Installierung gelang es ihm, diese Summe auf das Doppelte zu erhöhn.
  en: 'Barely half a year after his installation, he succeeded in raising this sum to its double: Odillon Barrot had wrung from the constitutive assembly a yearly allowance of 600,000 francs for so-called representation expenses.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.2.3
  kind: p
  original: Odilon Barrot ertrotzte nämlich von der konstituierenden Nationalversammlung einen jährlichen Zuschuß von 600.000 Francs für sogenannte Repräsentationsgelder.
  en: ''
  joined_to: V.2.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '159'
- id: V.2.4
  kind: p
  original: Nach dem 13. Juni hatte Bonaparte ähnliche Anliegen verlauten lassen, ohne diesmal bei Barrot Gehör zu finden.
  en: After June 13, Bonaparte hinted at similar solicitations, to which, however, Barrot then turned a deaf ear.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: V.2.5
  kind: p
  original: Jetzt nach dem 31. Mai benutzte er sofort den günstigen Augenblick und ließ seine Minister eine Zivilliste von drei Millionen in der Nationalversammlung beantragen.
  en: Now, after May 31, he forthwith utilized the favorable moment, and caused his ministers to move a civil list of three millions in the National Assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: V.2.6
  kind: p
  original: Ein langes abenteuerndes Vagabundenleben hatte ihn mit den entwickelsten Fühlhörnern begabt, um die schwachen Momente herauszutasten, wo er seinen Bourgeois Geld abpressen durfte.
  en: A long adventurous, vagabond career had gifted him with the best developed antennae for feeling out the weak moments when he could venture upon squeezing money from his bourgeois.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: V.2.7
  kind: p
  original: Er trieb förmliche chantage <Erpressung>.
  en: He carried on regular blackmail.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: V.2.8
  kind: p
  original: Die Nationalversammlung hatte die Volkssouveränität mit seiner Mithülfe und seinem Mitwissen geschändet.
  en: 'The National Assembly had maimed the sovereignty of the people with his aid and his knowledge: he now threatened to denounce its crime to the tribunal of the people, if it did not pull out its purse and buy his silence with three millions annually.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.2.9
  kind: p
  original: Er drohte ihr Verbrechen dem Volksgericht zu denunzieren, falls sie nicht den Beutel ziehe und sein Stillschweigen mit drei Millionen jährlich erkaufe.
  en: ''
  joined_to: V.2.8
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '159'
- id: V.2.10
  kind: p
  original: Sie hatte drei Millionen Franzosen ihres Stimmrechts beraubt.
  en: 'It had robbed three million Frenchmen of the suffrage: for every Frenchman thrown "out of circulation," he demanded a franc "in circulation."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.2.11
  kind: p
  original: Er verlangte für jeden außer Kurs gesetzten Franzosen einen Kurs habenden Franken, genau drei Millionen Francs.
  en: ''
  joined_to: V.2.10
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '159'
- id: V.2.12
  kind: p
  original: Er, der Erwählte von sechs Millionen, forderte Schadenersatz für die Stimmen, um die man ihn nachträglich geprellt habe.
  en: He, the elect of six million, demanded indemnity for the votes he had been subsequently cheated of.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: V.2.13
  kind: p
  original: Die Kommission der Nationalversammlung wies den Zudringlichen ab.
  en: The Committee of the National Assembly turned the importunate fellow away.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
- id: V.2.14
  kind: p
  original: Die bonapartistische Presse drohte.
  en: 'The Bonapartist press threatened: Could the National Assembly break with the President of the republic at a time when it had broken definitely and on principle with the mass of the nation?'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '159'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.2.15
  kind: p
  original: Konnte die Nationalversammlung mit dem Präsidenten der Republik brechen in dem Augenblicke, wo sie prinzipiell und definitiv mit der Masse der Nation gebrochen hatte?
  en: ''
  joined_to: V.2.14
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '159'
- id: V.2.16
  kind: p
  original: Sie verwarf zwar die jährliche Zivilliste, aber sie bewilligte einen einmaligen Zuschuß von 2.160.000 Franc.
  en: It rejected the annual civil list, but granted, for this once, an allowance of 2,160,000 francs.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 159-160
- id: V.2.17
  kind: p
  original: Sie machte sich so der doppelten Schwäche schuldig, daß Geld zu bewilligen und zugleich durch ihren Ärger zu zeigen, daß sie es nur widerwillig bewillige.
  en: Thus it made itself guilty of the double weakness of granting the money, and, at the same time, showing by its anger that it did so only unwillingly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: V.2.18
  kind: p
  original: Wir werden später sehen, wozu Bonaparte das Geld brauchte.
  en: We shall presently see to what use Bonaparte put the money.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: V.2.19
  kind: p
  original: Nach diesem ärgerlichen Nachspiel, das der Abschaffung des allgemeinen Stimmrechts auf dem Fuße folgte und worin Bonaparte seine demütige Haltung während der Krise des März und April mit herausfordernder Unverschämtheit gegen das usurpatorische Parlament vertauschte, vertagte sich die Nationalversammlung für drei Monate vom 11. August bis 11. November.
  en: After this aggravating after-play, that followed upon the heels of the abolition of universal suffrage, and in which Bonaparte exchanged his humble attitude of the days of the crisis of March and April for one of defiant impudence towards the usurping parliament, the National Assembly adjourned for three months, from August 11, to November 11. It left behind in its place a Permanent Committee of 18 members that contained no Bonapartist, but did contain a few moderate republicans.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.2.20
  kind: p
  original: Sie ließ an ihrer Stelle eine Permanenzkommission von 28 Mitgliedern zurück, die keinen Bonapartisten enthielt, wohl aber einige gemäßigte Republikaner.
  en: ''
  joined_to: V.2.19
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '160'
- id: V.2.21
  kind: p
  original: Die Permanenzkommission vom Jahre 1849 hatte nur Männer der Ordnung und Bonapartisten gezählt.
  en: The Permanent Committee of the year 1849 had numbered only men of order and Bonapartists.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: V.2.22
  kind: p
  original: Aber damals erklärte sich die Partei der Ordnung in Permanenz gegen die Revolution.
  en: At that time, however, the party of Order declared itself in permanence against the revolution; now the parliamentary republic declared itself in permanence against the President.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.2.23
  kind: p
  original: Diesmal erklärte sich die parlamentarische Republik in Permanenz gegen den Präsidenten.
  en: ''
  joined_to: V.2.22
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '160'
- id: V.2.24
  kind: p
  original: Nach dem Gesetze vom 31. Mai stand der Partei der Ordnung nur noch dieser Rival gegenüber.
  en: After the law of May 31, only this rival still confronted the party of Order.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: V.3.1
  kind: p
  original: Als die Nationalversammlung im November 1850 wieder zusammentrat, schien statt ihrer bisherigen kleinlichen Plänkeleien mit dem Präsidenten ein großer rücksichtsloser Kampf, ein Kampf der beiden Gewalten auf Leben und Tod unvermeidlich geworden zu sein.
  en: When the National Assembly reconvened in November, 1850, instead of its former petty skirmishes with the President, a great headlong struggle, a struggle for life between the two powers, seemed to have become inevitable.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: V.4.1
  kind: p
  original: Wie im Jahre 1849 war die Partei der Ordnung während der diesjährigen Parlamentsferien in ihre einzelnen Fraktionen auseinandergegangen, jede beschäftigt mit ihren eignen Restaurationsintrigen, die durch den Tod Louis-Philippes neue Nahrung erhalten hatten.
  en: As in the year 1849, the party of Order had during this year's vacation, dissolved into its two separate factions, each occupied with its own restoration intrigues, which had received new impetus from the death of Louis Philippe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: V.4.2
  kind: p
  original: Der Legitimistenkönig Heinrich V. hatte sogar ein förmliches Ministerium ernannt, das zu Paris residierte und worin Mitglieder der Permanenzkommission saßen.
  en: The Legitimist King, Henry V, had even appointed a regular Ministry, that resided in Paris, and in which sat members of the Permanent Committee.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: V.4.3
  kind: p
  original: Bonaparte war also berechtigt, seinerseits Rundreisen durch die französischen Departements zu machen und je nach der Stimmung der Stadt, die er mit seiner Gegenwart beglückte, bald versteckter, bald offener seine eignen Restaurationspläne auszuplaudern und Stimmen für sich zu werben.
  en: Hence, Bonaparte was, on his part, justified in making tours through the French Departments, and--according to the disposition of the towns that he happened to be gladdening with his presence--some times covertly, other times more openly blabbing out his own restoration plans, and gaining votes for himself On these excursions, which the large official "Moniteur" and the small private "Moniteurs" of Bonaparte were, of course, bound to celebrate as triumphal marches, he was constantly accompanied by affiliated members of the "Society of December 10."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.4.4
  kind: p
  original: Auf diesen Zügen, die der große offizielle "Moniteur" und die kleinen Privatmoniteure Bonapartes natürlich als Triumphzüge feiern mußten, war er fortwährend begleitet von Affiliierten der Gesellschaft des 10. Dezember.
  en: ''
  joined_to: V.4.3
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '160'
- id: V.4.5
  kind: p
  original: Diese Gesellschaft datiert vom Jahre 1849.
  en: This society dated from the year 1849.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: V.4.6
  kind: p
  original: Unter dem Vorwande, eine Wohltätigkeitsgesellschaft zu stiften, war das Pariser Lumpenproletariat in geheime Sektionen organisiert worden, jede Sektion von einem bonapartistischen Agenten geleitet, an der Spitze ein bonapartistischer General.
  en: Under the pretext of founding a benevolent association, the slum-proletariat of Paris was organized into secret sections, each section led by Bonapartist agents, with a Bonapartist General at the head of all.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '160'
- id: V.4.7
  kind: p
  original: Neben zerrütteten Roués <Wüstlingen> mit zweideutigen Subsistenzmitteln und von zweideutiger Herkunft, neben verkommenen und abenteuernden Ablegern der Bourgeoisie Vagabunden, entlassene Soldaten, entlassene Zuchthaussträflinge, entlaufene Galeerensklaven, Gauner, Gaukler, Lazzaroni, Taschendiebe, Taschenspieler, Spieler, Maquereaus <Zuhälter>, Bordellhalter, Lastträger, Literaten, Orgeldreher, Lumpensammler, Scherenschleifer, Kesselflicker, Bettler, kurz, die ganze unbestimmte, aufgelöste, hin- und hergeworfene Masse, die die Franzosen la bohème nennen; mit diesem ihm verwandten Elemente bildete Bonaparte den Stock der Gesellschaft vom 10. Dezember.
  en: Along with ruined roues of questionable means of support and questionable antecedents, along with the foul and adventures-seeking dregs of the bourgeoisie, there were vagabonds, dismissed soldiers, discharged convicts, runaway galley slaves, sharpers, jugglers, lazzaroni, pickpockets, sleight-of-hand performers, gamblers, procurers, keepers of disorderly houses, porters, literati, organ grinders, rag pickers, scissors grinders, tinkers, beggars--in short, that whole undefined, dissolute, kicked-about mass that the Frenchmen style "la Boheme" With this kindred element, Bonaparte formed the stock of the "Society of December 10," a "benevolent association" in so far as, like Bonaparte himself, all its members felt the need of being benevolent to themselves at the expense of the toiling nation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 160-161
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.4.8
  kind: p
  original: '"Wohltätigkeitsgesellschaft" - insofern alle Mitglieder gleich Bonaparte das Bedürfnis fühlten, sich auf Kosten der arbeitenden Nation wohlzutun.'
  en: ''
  joined_to: V.4.7
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '161'
- id: V.4.9
  kind: p
  original: Dieser Bonaparte, der sich als Chef des Lumpenproletariats konstituiert, der hier allein in massenhafter Form die Interessen wiederfindet, die er persönlich verfolgt, der in diesem Auswurf, Abfall, Abhub aller Klassen die einzige Klasse erkennt, auf die er sich unbedingt stützen kann, er ist der wirkliche Bonaparte, der Bonaparte sans phrase <ohne Beschönigung>.
  en: The Bonaparte, who here constitutes himself Chief of the Slum-Proletariat; who only here finds again in plenteous form the interests which he personally pursues; who, in this refuse, offal and wreck of all classes, recognizes the only class upon which he can depend unconditionally;--this is the real Bonaparte, the Bonaparte without qualification.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: V.4.10
  kind: p
  original: Alter durchtriebener Roué, faßt er das geschichtliche Leben der Völker und die Haupt- und Staatsaktionen derselben als Komödie im ordinärsten Sinne auf, als eine Maskerade, wo die großen Kostüme, Worte und Posituren nur der kleinlichsten Lumperei zur Maske dienen.
  en: An old and crafty roue, he looks upon the historic life of nations, upon their great and public acts, as comedies in the ordinary sense, as a carnival, where the great costumes, words and postures serve only as masks for the pettiest chicaneries.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: V.4.11
  kind: p
  original: So bei seinem Zug nach Straßburg, wo ein geschulter Schweizer Geier den napoleonischen Adler vorstellt.
  en: 'So, on the occasion of his expedition against Strassburg when a trained Swiss vulture impersonated the Napoleonic eagle; so, again, on the occasion of his raid upon Boulogne, when he struck a few London lackeys into French uniform: they impersonated the army; and so now, in his "Society of December 10," he collects 10,000 loafers who are to impersonate the people as Snug the Joiner does the lion.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
  en_note: 'De Leon''s note [1]: Under the reign of Louis Philippe, Bonaparte made two attempts to restore the throne of Napoleon: one in October, 1836, in an expedition from Switzerland upon Strassburg and one in August, 1840, in an expedition from England upon Boulogne.'
  align: '4:1'
  review: true
  review_reason: 4 de sentence(s) matched to 1 en sentence(s); regrouped by the ingest (see REALIGN)
- id: V.4.12
  kind: p
  original: Für seinen Einfall in Boulogne steckte er einige Londoner Lakaien in französische Uniform.
  en: ''
  joined_to: V.4.11
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '161'
- id: V.4.13
  kind: p
  original: Sie stellen die Armee vor.
  en: ''
  joined_to: V.4.11
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '161'
- id: V.4.14
  kind: p
  original: In seiner Gesellschaft vom 10. Dezember sammelte er 10.000 Lumpenkerls, die das Volk vorstellen müssen, wie Klaus Zettel den Löwen.
  en: ''
  joined_to: V.4.11
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '161'
- id: V.4.15
  kind: p
  original: In einem Augenblick, wo die Bourgeoisie selbst die vollständigste Komödie spielte, aber in der ernsthaftesten Weise von der Welt, ohne irgendeine der pedantischen Bedingungen der französischen dramatischen Etikette zu verletzen, und selbst halb geprellt, halb überzeugt von der Feierlichkeit ihrer eignen Haupt- und Staatsaktion, mußte der Abenteurer siegen, der die Komödie platt als Komödie nahm.
  en: At a period when the bourgeoisie itself is playing the sheerest comedy, but in the most solemn manner in the world, without doing violence to any of the pedantic requirements of French dramatic etiquette, and is itself partly deceived by, partly convinced of, the solemnity of its own public acts, the adventurer, who took the comedy for simple comedy, was bound to win.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: V.4.16
  kind: p
  original: Erst wenn er seinen feierlichen Gegner beseitigt hat, wenn er nun selbst seine kaiserliche Rolle im Ernste nimmt und mit der napoleonischen Maske den wirklichen Napoleon vorzustellen meint, wird er das Opfer seiner eignen Weltanschauung, der ernsthafte Hanswurst, der nicht mehr die Weltgeschichte als eine Komödie, sondern seine Komödie als Weltgeschichte nimmt.
  en: Only after he has removed his solemn opponent, when he himself takes seriously his own role of emperor, and, with the Napoleonic mask on, imagines he impersonates the real Napoleon, only then does he become the victim of his own peculiar conception of history--the serious clown, who no longer takes history for a comedy, but a comedy for history.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: V.4.17
  kind: p
  original: Was für die sozialistischen Arbeiter die Nationalateliers, was für die Bourgeois-Republikaner die Gardes mobiles, das war für Bonaparte die Gesellschaft vom 10. Dezember, die ihm eigentümliche Parteistreitmacht.
  en: What the national work-shops were to the socialist workingmen, what the "Gardes mobiles" were to the bourgeois republicans, that was to Bonaparte the "Society of December 10,"--a force for partisan warfare peculiar to himself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '161'
- id: V.4.18
  kind: p
  original: Auf seinen Reisen mußten die auf der Eisenbahn verpackten Abteilungen derselben ihm ein Publikum improvisieren, den öffentlichen Enthusiasmus aufführen, vive l'Empereur <es lebe der Kaiser> heulen, die Republikaner insultieren und durchprügeln, natürlich unter dem Schutze der Polizei.
  en: On his journeys, the divisions of the Society, packed away on the railroads, improvised an audience for him, performed public enthusiasm, shouted "vive l'Empereur," insulted and clubbed the republicans,--all, of course, under the protection of the police.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 161-162
- id: V.4.19
  kind: p
  original: Auf seinen Rückfahrten nach Paris mußten sie die Avantgarde bilden, Gegendemonstrationen zuvorkommen oder sie auseinanderjagen.
  en: On his return stages to Paris, this rabble constituted his vanguard, it forestalled or dispersed counter-demonstrations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: V.4.20
  kind: p
  original: Die Gesellschaft vom 10. Dezember gehörte ihm, sie war sein Werk, sein eigenster Gedanke.
  en: The "Society of December 10" belonged to him, it was his own handiwork, his own thought.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: V.4.21
  kind: p
  original: Was er sich sonst aneignet, gibt ihm die Macht der Verhältnisse anheim, was er sonst tut, tun die Verhältnisse für ihn oder begnügt er sich, von den Taten andrer zu kopieren; aber er, mit den offiziellen Redensarten der Ordnung, der Religion, der Familie, des Eigentums öffentlich vor den Bürgern, hinter ihm die geheime Gesellschaft der Schufterles und der Spiegelbergs, die Gesellschaft der Unordnung, der Prostitution und des Diebstahls, das ist Bonaparte selbst als Originalautor, und die Geschichte der Gesellschaft des 10. Dezember ist seine eigne Geschichte.
  en: Whatever else he appropriates, the power of circumstances places in his hands; whatever else he does, either circumstances do for him, or he is content to copy from the deeds of others, but he posing before the citizens with the official phrases about "Order," "Religion," "Family," "Property," and, behind him, the secret society of skipjacks and picaroons, the society of disorder, of prostitution, and of theft,--that is Bonaparte himself as the original author; and the history of the "Society of December 10" is his own history.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: V.4.22
  kind: p
  original: Es hatte sich nun ausnahmsweise ereignet, daß der Ordnungspartei angehörige Volksrepräsentanten unter die Stöcke der Dezembristen gerieten.
  en: Now, then, it happened that Representatives belonging to the party of order occasionally got under the clubs of the Decembrists.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: V.4.23
  kind: p
  original: Noch mehr.
  en: Nay, more.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: V.4.24
  kind: p
  original: Der der Nationalversammlung zugewiesene, mit der Bewachung der Sicherheit beauftragte Polizeikommissär Yon zeigte auf die Aussage eines gewissen Allais hin der Permanenzkommission an, eine Sektion der Dezembristen habe die Ermordung des Generals Changarnier und Dupins, des Präsidenten der Nationalversammlung, beschlossen und zu deren Vollstreckung schon die Individuen bestimmt.
  en: Police Commissioner Yon, who had been assigned to the National Assembly, and was charged with the guardianship of its safety, reported to the Permanent Committee upon the testimony of one Alais, that a Section of the Decembrists had decided on the murder of General Changarnier and of Dupin, the President of the National Assembly, and had already settled upon the men to execute the decree.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: V.4.25
  kind: p
  original: Man begreift den Schreck des Herrn Dupin.
  en: One can imagine the fright of Mr. Dupin.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: V.4.26
  kind: p
  original: Eine parlamentarische Enquête über die Gesellschaft vom 10. Dezember, d.h. die Profanierung der Bonaparteschen Geheimwelt, schien unvermeidlich.
  en: A parliamentary inquest over the "Society of December 10," i. e., the profanation of the Bonapartist secret world now seemed inevitable.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: V.4.27
  kind: p
  original: Gerade vor dem Zusammentritt der Nationalversammlung löste Bonaparte vorsorglich seine Gesellschaft auf, natürlich nur auf dem Papiere, denn noch Ende 1851 suchte der Polizeipräfekt Carlier in einem ausführlichen Memoire ihn vergeblich zur wirklichen Auseinanderjagung der Dezembristen zu bewegen.
  en: Just before the reconvening of the National Assembly, Bonaparte circumspectly dissolved his Society, of course, on paper only. As late as the end of 1851, Police Prefect Carlier vainly sought, in an exhaustive memorial, to move him to the real dissolution of the Decembrists.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.5.1
  kind: p
  original: Die Gesellschaft vom 10. Dezember sollte so lange die Privatarmee Bonapartes bleiben, bis es ihm gelang, die öffentliche Armee in eine Gesellschaft vom 10. Dezember zu verwandeln.
  en: The "Society of December 10" was to remain the private army of Bonaparte until he should have succeeded in converting the public Army into a "Society of December 10."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: V.5.2
  kind: p
  original: Bonaparte machte hierzu den ersten Versuch kurz nach der Vertagung der Nationalversammlung, und zwar mit dem eben ihr abgetrotzten Gelde.
  en: Bonaparte made the first attempt in this direction shortly after the adjournment of the National Assembly, and he did so with the money which he had just wrung from it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: V.5.3
  kind: p
  original: Als Fatalist lebte er der Überzeugung, daß es gewisse höhere Mächte gibt, denen der Mensch und insbesondere der Soldat nicht widerstehen kann.
  en: As a fatalist, he lives devoted to the conviction that there are certain Higher Powers, whom man, particularly the soldier, cannot resist.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: V.5.4
  kind: p
  original: Unter diese Mächte zählt er in erster Linie Zigarre und Champagner, kaltes Geflügel und Knoblauchswurst.
  en: First among these Powers he numbers cigars and champagne, cold poultry and garlic-sausage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '162'
- id: V.5.5
  kind: p
  original: Er traktierte daher in den Gemächern des Elysée zunächst Offiziere und Unteroffiziere mit Zigarre und Champagner, mit kaltem Geflügel und Knoblauchswurst.
  en: Accordingly, in the apartments of the Elysee, he treated first the officers and under-officers to cigars and champagne, to cold poultry and garlic-sausage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 162-163
- id: V.5.6
  kind: p
  original: Am 3. Oktober wiederholt er dies Manöver mit den Truppenmassen bei der Revue von St. Maur und am 10. Oktober dasselbe Manöver auf noch größerer Stufenleiter bei der Armeeschau von Satory.
  en: On October 3, he repeats this manoeuvre with the rank and file of the troops by the review of St. Maur; and, on October 10, the same manoeuvre again, upon a larger scale, at the army parade of Satory.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: V.5.7
  kind: p
  original: Der Onkel erinnerte sich der Feldzüge Alexanders in Asien, der Neffe der Eroberungszüge Bacchus in demselben Lande.
  en: 'The Uncle bore in remembrance the campaigns of Alexander in Asia: the Nephew bore in remembrance the triumphal marches of Bacchus in the same country.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: V.5.8
  kind: p
  original: Alexander war allerdings ein Halbgott, aber Bacchus war ein Gott, und dazu der Schutzgott der Gesellschaft vom 10. Dezember.
  en: Alexander was, indeed, a demigod; but Bacchus was a full-fledged god, and the patron deity, at that, of the "Society of December 10."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: V.6.1
  kind: p
  original: Nach der Revue vom 3. Oktober lud die Permanenzkommission den Kriegsminister d'Hautpoul vor sich.
  en: After the review of October 3, the Permanent Committee summoned the Minister of War, d'Hautpoul, before it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: V.6.2
  kind: p
  original: Er versprach, jene Disziplinarwidrigkeiten sollten sich nicht wiederholen.
  en: He promised that such breaches of discipline should not recur.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: V.6.3
  kind: p
  original: Man weiß, wie Bonaparte am 10. Oktober d'Hautpouls Wort hielt.
  en: We have seen how, on October 10th, Bonaparte kept d'Hautpoul's word.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: V.6.4
  kind: p
  original: In beiden Revuen hatte Changarnier kommandiert als Oberbefehlshaber der Armee von Paris.
  en: At both reviews Changarnier had commanded as Commander-in-chief of the Army of Paris.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: V.6.5
  kind: p
  original: Er, zugleich Mitglied der Permanenzkommission, Chef der Nationalgarde, "Retter" vom 19. Januar und 13. Juni, "Bollwerk der Gesellschaft", Kandidat der Ordnungspartei für die Präsidentenwürde, der geahnte Monk zweier Monarchien, hatte bisher nie seine Unterordnung unter den Kriegsminister anerkannt, die republikanischen Institution stets offen verhöhnt, Bonaparte mit einer zweideutig vornehmen Protektion verfolgt.
  en: He, at once member of the Permanent Committee, Chief of the National Guard, the "Savior" of January 29, and June 13, the "Bulwark of Society," candidate of the Party of Order for the office of President, the suspected Monk of two monarchies,--he had never acknowledged his subordination to the Minister of War, had ever openly scoffed at the republican Constitution, and had pursued Bonaparte with a protection that was ambiguously distinguished.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: V.6.6
  kind: p
  original: Jetzt eiferte er für die Disziplin gegen den Kriegsminister und für die Konstitution gegen Bonaparte.
  en: Now he became zealous for the discipline in opposition to Bonaparte.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: V.6.7
  kind: p
  original: 'Während am 10. Oktober ein Teil der Kavallerie den Ruf: "Vive Napoléon! Vivent les saucissons!" <"Es lebe Napoleon! Es leben die Würste!"> ertönen ließ, veranstaltete Changarnier, daß wenigstens die unter dem Kommando seines Freundes Neumayer vorbeidefilierende Infanterie ein eisiges Stillschweigen beobachtete.'
  en: 'While, on October 10, a part of the cavalry cried: "Vive Napoleon! Vivent les saucissons;" Changarnier saw to it that at least the infantry, which filed by under the command of his friend Neumeyer, should observe an icy silence.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
  en_note: 'De Leon''s note [2]: Long live Napoleon! Long live the sausages!'
- id: V.6.8
  kind: p
  original: Zur Strafe entsetzte der Kriegsminister auf Bonapartes Antrieb den General Neumayer seines Postens in Paris, unter dem Vorwand, ihn als Obergeneral der 14. und 15. Militärdivision zu bestallen.
  en: In punishment, the Minister of War, at the instigation of Bonaparte, deposed General Neumeyer from his post in Paris, under the pretext of providing for him as Commander-in-chief of the Fourteenth and Fifteenth Military Divisions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: V.6.9
  kind: p
  original: Neumayer schlug diesen Stellenwechsel aus und mußte so seine Entlassung nehmen.
  en: Neumeyer declined the exchange, and had, in consequence, to give his resignation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: V.6.10
  kind: p
  original: Changarnier seinerseits veröffentlichte am 2. November einen Tagesbefehl, worin er den Truppen verbot, politische Ausrufungen und Demonstrationen irgendeiner Art sich unter den Waffen zu erlauben.
  en: On his part, Changarnier published on November 2, an order, wherein he forbade the troops to indulge, while under arms, in any sort of political cries or demonstrations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: V.6.11
  kind: p
  original: Die elyseeischen Blätter griffen Changarnier an, die Blätter der Ordnungspartei Bonaparte, die Permanenzkommission wiederholte geheime Sitzungen, worin wiederholt beantragt wurde, das Vaterland in Gefahr zu erklären, die Armee schien in zwei feindliche Lager geteilt mit zwei feindlichen Generalstäben, der eine im Elysée, wo Bonaparte, der andere in den Tuilerien, wo Changarnier hauste.
  en: The papers devoted to the Elysee interests attacked Changarnier; the papers of the party of Order attacked Bonaparte; the Permanent Committee held frequent secret sessions, at which it was repeatedly proposed to declare the fatherland in danger; the Army seemed divided into two hostile camps, with two hostile staffs; one at the Elysee, where Bonaparte, the other at the Tuileries, where Changarnier resided.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: V.6.12
  kind: p
  original: Es schien nur des Zusammentritts der Nationalversammlung zu bedürfen, damit das Signal zum Kampfe erschalle.
  en: All that seemed wanting for the signal of battle to sound was the convening of the National Assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
- id: V.6.13
  kind: p
  original: 'Das französische Publikum beurteilte diese Reibungen zwischen Bonaparte und Changarnier wie jener englische Journalist, der sie mit folgenden Worten charakterisiert hat:'
  en: 'The French public looked upon the friction between Bonaparte and Changarnier in the light of the English journalist, who characterized it in these words: "The political servant girls of France are mopping away the glowing lava of the revolution with old mops, and they scold each other while doing their work."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '163'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.7.1
  kind: p
  original: '"Die politischen Hausmägde Frankreichs kehren die glühende Lava der Revolution mit alten Besen weg und keifen sich aus, während sie ihre Arbeit verrichten."'
  en: ''
  joined_to: V.6.13
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '164'
- id: V.8.1
  kind: p
  original: Unterdes beeilte sich Bonaparte, den Kriegsminister d'Hautpoul zu entsetzen, ihn Hals über Kopf nach Algier zu spedieren und an seine Stelle General Schramm zum Kriegsminister zu ernennen.
  en: Meanwhile, Bonaparte hastened to depose the Minister of War, d'Hautpoul; to expedite him heels over head to Algiers; and to appoint in his place General Schramm as Minister of War.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: V.8.2
  kind: p
  original: Am 12. November sandte er der Nationalversammlung eine Botschaft von amerikanischer Weitläufigkeit, überladen mit Details, ordungsduftend, versöhnungslüstern, konstitutionell-resigniert, von allem und jedem handelnd, nur nicht von den questions brûlantes <brennenden Fragen> des Augenblicks.
  en: On November 12, he sent to the National Assembly a message of American excursiveness, overloaded with details, redolent of order, athirst for conciliation, resignful to the Constitution, dealing with all and everything, only not with the burning questions of the moment.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: V.8.3
  kind: p
  original: Wie im Vorbeigehen ließ er die Worte fallen, daß den ausdrücklichen Bestimmungen der Konstitution gemäß der Präsident allein über die Armee verfüge.
  en: As if in passing he dropped the words that according to the express provisions of the Constitution, the President alone disposes over the Army.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: V.8.4
  kind: p
  original: 'Die Botschaft schloß mit folgenden hochtbeteuernden Worten:'
  en: 'The message closed with the following high-sounding protestations:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: V.9.1
  kind: p
  original: '"Frankreich verlangt jetzt vor allem anderen Ruhe...'
  en: '"France demands, above all things, peace...'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: V.9.2
  kind: p
  original: Allein durch einen Eid gebunden, werde ich mich innerhalb der engen Grenzen halten, die er mir gezogen hat...
  en: Alone bound by an oath, I shall keep myself within the narrow bounds marked out by it to me...
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: V.9.3
  kind: p
  original: Was mich betrifft, vom Volke erwählt und ihm allein meine Macht schuldend, ich werde mich stets seinem gesetzlich ausgedrückten Willen fügen.
  en: As to me, elected by the people, and owing my power to it alone, I shall always submit to its lawfully expressed will.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: V.9.4
  kind: p
  original: Beschließt Ihr in dieser Sitzung die Revision der Konstitution, so wird eine konstituierende Versammlung die Stellung der Exekutivgewalt regeln.
  en: Should you at this session decide upon the revision of the Constitution, a Constitutional Convention will regulate the position of the Executive power.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: V.9.5
  kind: p
  original: Wo nicht, so wird das Volk 1852 feierlich seinen Entschluß verkünden.
  en: If you do not, then, the people will, in 1852, solemnly announce its decision.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: V.9.6
  kind: p
  original: Was aber immer die Lösungen der Zukunft sein mögen, laßt uns zu einem Verständnis kommen, damit niemals Leidenschaft, Überraschung oder Gewalt über das Schicksal einer großen Nation entscheiden...
  en: But, whatever the solution may be that the future has in store, let us arrive at an understanding to the end that never may passion, surprise or violence decide over the fate of a great nation....
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: V.9.7
  kind: p
  original: Was vor allem meine Aufmerksamkeit in Anspruch nimmt, ist nicht, zu wissen, wer 1852 über Frankreich regieren wird, sondern die Zeit, die zu meiner Verfügung steht, so zu verwenden, daß die Zwischenperiode ohne Agitation und Störung vorübergehe.
  en: That which, above all, bespeaks my attention is, not who will, in 1852, rule over France, but to so devote the time at my disposal that the interval may pass by with-out agitation and disturbance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: V.9.8
  kind: p
  original: Ich habe mit Aufrichtigkeit mein Herz vor Euch geöffnet, Ihr werdet meiner Offenheit mit Eurem Vertrauen antworten, meinem guten Streben durch Eure Mitwirkung, und Gott wird das übrige tun."
  en: I have straightforwardly opened my heart to you, you will answer my frankness with your confidence, my good efforts with your co-operation. God will do the rest."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.10.1
  kind: p
  original: Diese honette, heuchlerisch gemäßigte, tugendhaft gemeinplätzliche Sprache der Bourgeoisie offenbart ihren tiefsten Sinn im Munde des Selbstherrschers der Gesellschaft vom 10. Dezember und des Picknickhelden von St. Maur und Satory
  en: The honnete, hypocritically temperate, commonplace-virtuous language of the bourgeoisie reveals its deep meaning in the mouth of the self-appointed ruler of the "Society of December 10," and of the picnic-hero of St. Maur and Satory.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: V.11.1
  kind: p
  original: Die Burggrafen der Ordnungspartei täuschten sich keinen Augenblick über das Vertrauen, das diese Herzenseröffnung verdiene.
  en: The burgraves of the party of Order did not for a moment deceive themselves on the confidence that this unbosoming deserved.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
- id: V.11.2
  kind: p
  original: Über Eide waren sie längst blasiert, sie zählten Veteranen, Virtuosen des politischen Meineids in ihrer Mitte, sie hatten die Stelle über die Armee nicht überhört.
  en: They were long blase on oaths; they numbered among themselves veterans and virtuosi of perjury. The passage about the army did not, however, escape them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '164'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.11.3
  kind: p
  original: Sie bemerkten mit Unwillen, daß die Botschaft in der weitschweifigen Aufzählung der jüngst erlassenen Gesetze das wichtigste Gesetz, das Wahlgesetz, mit affektiertem Stilschweigen überging und vielmehr im Falle der Nichtrevision der Verfassung die Wahl des Präsidenten für 1852 dem Volk anheimstellte.
  en: They observed with annoyance that the message, despite its prolix enumeration of the lately enacted laws, passed, with affected silence, over the most important of all, the election law, and, moreover, in case no revision of the Constitution was held, left the choice of the President, in 1852, with the people.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 164-165
- id: V.11.4
  kind: p
  original: Das Wahlgesetz war die Bleikugel an den Füßen der Ordnungspartei, die sie am Gehen behinderte und nun gar am Stürmen!
  en: The election law was the ball-and-chain to the feet of the party of Order, that hindered them from walking, and now assuredly from storming.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: V.11.5
  kind: p
  original: Zudem hatte Bonaparte durch die amtliche Auflösung der Gesellschaft vom 10. Dezember und die Entlassung des Kriegsministers d'Hautpoul die Sündenböcke mit eigener Hand auf dem Altar des Vaterlandes geopfert.
  en: Furthermore, by the official disbandment of the "Society of December 10," and the dismissal of the Minister of War, d'Hautpoul, Bonaparte had, with his own hands, sacrificed the scapegoats on the altar of the fatherland.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: V.11.6
  kind: p
  original: Er hatte der erwarteten Kollision die Spitze abgebrochen.
  en: He had turned off the expected collision.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: V.11.7
  kind: p
  original: Endlich suchte die Ordnungspartei selbst ängstlich jeden entscheidenden Konflikt mit der Exekutivgewalt zu umgehen, abzuschwächen, zu vertuschen.
  en: Finally, the party of Order itself anxiously sought to avoid every decisive conflict with the Executive, to weaken and to blur it over.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: V.11.8
  kind: p
  original: Aus Furcht, die Eroberungen über die Revolution zu verlieren, ließ sie ihren Rivalen die Früchte derselben gewinnen.
  en: Fearing to lose its conquests over the revolution, it let its rival gather the fruits thereof.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: V.11.9
  kind: p
  original: '"Frankreich verlangt vor allem andern Ruhe."'
  en: '"France demands, above all things, peace," with this language had the party of Order been apostrophizing the revolution, since February; with this language did Bonaparte''s message now apostrophize the party of Order: "France demands, above all things, peace."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
  align: '3:1'
  review: true
  review_reason: 3 de sentence(s) matched to 1 en sentence(s)
- id: V.11.10
  kind: p
  original: So rief die Ordnungspartei der Revolution seit Februar zu, so rief Bonapartes Botschaft der Ordnungspartei zu.
  en: ''
  joined_to: V.11.9
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '165'
- id: V.11.11
  kind: p
  original: '"Frankreich verlangt vor allem Ruhe."'
  en: ''
  joined_to: V.11.9
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '165'
- id: V.11.12
  kind: p
  original: Bonaparte beging Handlungen, die auf Usurpation hinzielten, aber die Ordnungspartei beging die "Unruhe", wenn sie Lärm über diese Handlungen schlug und sie hypochondrisch auslegte.
  en: Bonaparte committed acts that aimed at usurpation, but the party of Order committed a "disturbance of the peace," if it raised the hue and cry, and explained them hypochrondriacally.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: V.11.13
  kind: p
  original: Die Würste von Satory waren mausestill, wenn niemand von ihnen sprach.
  en: The sausages of Satory were mouse-still when nobody talked about them;--France demands, above all things, "peace."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.11.14
  kind: p
  original: '"Frankreich verlangt vor allem Ruhe."'
  en: ''
  joined_to: V.11.13
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '165'
- id: V.11.15
  kind: p
  original: Also verlangte Bonaparte, daß man ihn ruhig gewähren lasse, und die parlamentarische Partei war von doppelter Furcht gelähmt, von der Furcht, die revolutionäre Unruhe wieder heraufzubeschwören, von der Furcht, selbst als der Unruhestifter in den Augen ihrer eigenen Klasse, in den Augen der Bourgeoisie zu erscheinen.
  en: 'Accordingly, Bonaparte demanded that he be let alone; and the parliamentary party was lamed with a double fear: the fear of re-conjuring up the revolutionary disturbance of the peace, and the fear of itself appearing as the disturber of the peace in the eyes of its own class, of the bourgeosie.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: V.11.16
  kind: p
  original: Da Frankreich also vor allem andern Ruhe verlangte, wagte die Ordnungspartei nicht, nachdem Bonaparte in seiner Botschaft "Frieden" gesprochen hatte, "Krieg" zu antworten.
  en: Seeing that, above all things, France demanded peace, the party of Order did not dare, after Bonaparte had said "peace" in his message, to answer "war."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: V.11.17
  kind: p
  original: Das Publikum, das sich mit großen Skandalszenen bei Eröffnung der Nationalversammlung geschmeichelt hatte, wurde in seinen Erwartungen geprellt.
  en: The public, who had promised to itself the pleasure of seeing great scenes of scandal at the opening of the National Assembly, was cheated out of its expectations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: V.11.18
  kind: p
  original: Die Oppositionsdeputierten, welche Vorlage der Protokolle der Permanenzkommission über die Oktoberereignisse verlangten, wurden von der Majorität überstimmt.
  en: The opposition deputies, who demanded the submission of the minutes of the Permanent Committee over the October occurrences, were outvoted.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: V.11.19
  kind: p
  original: Man floh prinzipiell alle Debatte, die aufregen konnte.
  en: All debate that might excite was fled from on principle.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: V.11.20
  kind: p
  original: Die Arbeiten der Nationalversammlung während November und Oktober 1850 waren ohne Interesse.
  en: The labors of the National Assembly during November and December, 1850, were without interest.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: V.12.1
  kind: p
  original: Endlich gegen Ende Dezember begann der Guerillakrieg um einzelne Prärogativen des Parlaments.
  en: Finally, toward the end of December, began a guerilla warfare about certain prerogatives of the parliament.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: V.12.2
  kind: p
  original: In kleinlichen Schikanen um die Prärogative der beiden Gewalten versumpfte die Bewegung, seitdem die Bourgeoisie mit der Abschaffung des allgemeinen Wahlrechts den Klassenkampf zunächst abgemacht hatte.
  en: The movement sank into the mire of petty chicaneries on the prerogative of the two powers, since, with the abolition of universal suffrage, the bourgeoisie had done away with the class struggle.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: V.13.1
  kind: p
  original: Gegen Mauguin, einen der Volksrepräsentanten, war schuldenhalber ein gerichtliches Urteil erwirkt worden.
  en: A judgment for debt had been secured against Mauguin, one of the Representatives.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '165'
- id: V.13.2
  kind: p
  original: Auf Anfrage des Gerichtspräsidenten erklärte der Justizminister Rouher, es sei ohne weitere Umstände ein Verhafts- befehl gegen den Schuldner auszufertigen.
  en: Upon inquiry by the President of the Court, the Minister of Justice, Rouher, declared that an order of arrest should be made out without delay.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 165-166
- id: V.13.3
  kind: p
  original: Mauguin wurde also in den Schuldturm geworfen.
  en: Manguin was, accordingly, cast into the debtors' prison.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: V.13.4
  kind: p
  original: Die Nationalversammlung brauste auf, als sie das Attentat erfuhr.
  en: The National Assembly bristled up when it heard of the "attentat."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: V.13.5
  kind: p
  original: Sie verordnete nicht nur seine sofortige Freilassung, sondern ließ ihn auch noch denselben Abend von ihrem greffier <vom Generalsekretär des Staatsrats> gewaltsam aus Clichy herausholen.
  en: It not only ordered his immediate release, but had him forcibly taken out of Clichy the same evening by its own greffier.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: V.13.6
  kind: p
  original: Um jedoch ihren Glauben an die Heiligkeit des Privateigentums zu bewahren, und mit dem Hintergedanken, im Notfall ein Asyl für lästig gewordene Montagnards zu eröffnen, erklärte sie die Schuldhaft von Volksrepräsentanten nach vorheriger Einholung ihrer Erlaubnis für zulässig.
  en: In order, nevertheless, to shield its belief in the "sacredness of private property," and also with the ulterior thought of opening, in case of need, an asylum for troublesome Mountainers, it declared the imprisonment of a Representative for debt to be permissible upon its previous consent.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: V.13.7
  kind: p
  original: Sie vergaß zu dekretieren, daß auch der Präsident schuldenhalber eingesperrt werden könne.
  en: It forgot to decree that the President also could be locked up for debt.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: V.13.8
  kind: p
  original: Sie vernichtete den letzten Schein der Unverletzlichkeit, der die Glieder ihres eigenen Körpers umgab.
  en: By its act, it wiped out the last semblance of inviolability that surrounded the members of its own body.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: V.14.1
  kind: p
  original: Man erinnert sich, daß der Polizeikommissionärs Yon eine Sektion der Dezembristen auf Aussage eines gewissen Allais hin wegen Mordplans auf Dupin und Changarnier denunziert hatte.
  en: It will be remembered that, upon the testimony of one Allais, Police Commissioner Yon had charged a Section of Decembrists with a plan to murder Dupin and Changarnier.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: V.14.2
  kind: p
  original: Gleich in der ersten Sitzung machten die Quästoren mit Bezug hierauf den Vorschlag, eine eigne parlamentarische Polizei zu bilden, besoldet aus dem Privatbudget der Nationalversammlung und durchaus unabhängig von dem Polizeipräfekten.
  en: With an eye upon that, the questors proposed at the very first session, that the parliament organize a police force of its own, paid for out of the private budget of the National Assembly itself, and wholly independent of the Police Prefects.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: V.14.3
  kind: p
  original: Der Minister des Innern, Baroche, hatte gegen diesen Eingriff in sein Ressort protestiert.
  en: The Minister of the Interior, Baroche, protested against this trespass on his preserves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: V.14.4
  kind: p
  original: Man schloß darauf einen elenden Kompromiß, wonach der Polizeikommissionär der Versammlung zwar aus ihrem Privatbudget besoldet und von ihren Quästoren ein- und abgesetzt werden solle, aber nach vorheriger Verständigung mit dem Minister des Innern.
  en: A miserable compromise followed, according to which the Police Commissioner of the Assembly was to be paid out of its own private budget and was to be subject to the appointment and dismissal of its own questors, but only upon previous agreement with the Minister of the Interior.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: V.14.5
  kind: p
  original: Unterdessen war Allais gerichtlich von der Regierung verfolgt worden, und hier war es leicht, seine Aussage als eine Mystifikation darzustellen und durch den Mund des öffentlichen Anklägers einen lächerlichen Schein auf Dupin, Changarnier, Yon und die ganze Nationalversammlung zu werfen.
  en: In the meantime Allais had been prosecuted by the Government. It was an easy thing in Court, to present his testimony in the light of a mystification, and, through the mouth of the Public Prosecutor, to throw Dupin, Changarnier, Yon, together with the whole National Assembly, into a ridiculous light.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.14.6
  kind: p
  original: Jetzt, am 29. Dezember, schreibt der Minister Baroche einen Brief an Dupin, worin er die Entlassung Yons verlangt.
  en: Thereupon, on December 29, Minister Baroche writes a letter to Dupin, in which he demands the dismissal of Yon.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: V.14.7
  kind: p
  original: Das Büro der Nationalversammlung beschließt, Yon in seiner Stelle zu erhalten, aber die Nationalversammlung, über ihre Gewaltsamkeit in Mauguins Angelegenheit erschreckt und gewohnt, wenn sie einen Schlag gegen die Exekutivgewalt gewagt hat, zwei Schläge von ihr im Austausch zurückzuerhalten, sanktioniert diesen Beschluß nicht.
  en: The Committee of the National Assembly decides to keep Yon in office; nevertheless, the National Assembly, frightened by its own violence in the affair of Mauguin, and accustomed, every time it has shied a blow at the Executive, to receive back from it two in exchange, does not sanction this decision.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: V.14.8
  kind: p
  original: Sie entläßt Yon zur Belohnung seines Diensteifers und beraubt sich einer parlamentarischen Prärogative, unerläßlich gegen einen Menschen, der nicht in der Nacht beschließt, um bei Tage auszuführen, sondern bei Tage beschließt und in der Nacht ausführt.
  en: It dismisses Yon in reward for his zeal in office, and robs itself of a parliamentary prerogative, indispensable against a person who does not decide by night to execute by day, but decides by day and executes by night.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '166'
- id: V.15.1
  kind: p
  original: Wir haben gesehn, wie die Nationalversammlung während der Monate November und Dezember bei großen schlagenden Veranlassungen den Kampf mit der Exekutivgewalt umging, niederschlug.
  en: We have seen how, during the months of November and December, under great and severe provocations, the National Assembly evaded and refused the combat with the Executive power.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 166-167
- id: V.15.2
  kind: p
  original: Jetzt sehen wir sie gezwungen, ihn bei den kleinlichsten Anlässen aufzunehmen.
  en: Now we see it compelled to accept it on the smallest occasions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: V.15.3
  kind: p
  original: In der Angelegenheit Mauguins bestätigte sie dem Prinzip nach die Schuldhaft der Volksrepräsentanten, behält sich aber vor, es nur auf ihr mißliebige Repräsentanten anwenden zu lassen, und um dieses infame Privilegium hadert sie mit dem Justizminister.
  en: In the affair of Mauguin, it confirms in principle the liability of a Representative to imprisonment for debt, but to itself reserves the power of allowing the principle to be applied only to the Representatives whom it dislikes,-and for this infamous privilege we see it wrangling with the Minister of Justice.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: V.15.4
  kind: p
  original: Statt den angeblichen Mordplan zu benutzen, um eine Enquête über die Gesellschaft vom 10. Dezember zu verhängen und Bonaparte in seiner wahren Gestalt als das Haupt des Pariser Lumpenproletariats vor Frankreich und Europa rettungslos bloßzustellen, läßt sie die Kollision auf einen Punkt herabsinken, wo es sich zwischen ihr und dem Minister des Innern nur noch darum handelt, zu wessen Kompetenz die Ein- und Absetzung eines Polizeikommissionärs gehört.
  en: Instead of utilizing the alleged murder plan to the end of fastening an inquest upon the "Society of December 10," and of exposing Bonaparte beyond redemption before France and his true figure, as the head of the slum-proletariat of Paris, it allows the collision to sink to a point where the only issue between itself and the Minister of the Interior is. Who has jurisdiction over the appointment and dismissal of a Police Commissioner?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.15.5
  kind: p
  original: So sehn wir die Partei der Ordnung während dieser ganzen Periode durch ihre zweideutige Stellung gezwungen, ihren Kampf mit der Exekutivgewalt in kleinliche Kompetenzzwiste, Schikanen, Rabulistereien, Grenzstreitigkeiten zu verpuffen, zu verbröckeln und die abgeschmacktesten Formfragen zum Inhalt ihrer Tätigkeit zu machen.
  en: Thus we see the party of Order, during this whole period, compelled by its ambiguous position to wear out and fritter away its conflict with the Executive power in small quarrels about jurisdiction, in chicaneries, in pettifogging, in boundary disputes, and to turn the stalest questions of form into the very substance of its activity.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: V.15.6
  kind: p
  original: Sie wagt die Kollision nicht aufzunehmen in dem Augenblicke, wo sie eine prinzipielle Bedeutung hat, wo die Exekutivgewalt sich wirklich bloßgestellt hat und die Sache der Nationalversammlung die nationale Sache wäre.
  en: It dares not accept the collision at the moment when it involves a principle, when the Executive power has really given itself a blank, and when the cause of the National Assembly would be the cause of the nation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: V.15.7
  kind: p
  original: Sie würde dadurch der Nation eine Marsch-Ordre ausstellen, und sie fürchtete nichts mehr, als daß sich die Nation bewege.
  en: It would thereby have issued to the nation an order of march; and it feared nothing so much as that the nation should move.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: V.15.8
  kind: p
  original: Bei solchen Gelegenheiten weist sie daher die Anträge der Montagne zurück und geht zur Tagesordnung über.
  en: Hence, on these occasions, it rejects the motions of the Mountain, and proceeds to the order of the day.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: V.15.9
  kind: p
  original: Nachdem die Streitfrage so in ihren großen Dimensionen aufgegeben ist, wartet die Exekutivgewalt ruhig den Zeitpunkt ab, wo sie dieselbe bei kleinlich unbedeutenden Anlässen wiederaufnehmen kann, wo sie sozusagen nur noch ein parlamentarisches Lokalinteresse bietet.
  en: After the issue has in this way lost all magnitude, the Executive power quietly awaits the moment when it can take it up again upon small and insignificant occasions; when, so to say, the issue offers only a parliamentary local interest.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: V.15.10
  kind: p
  original: Dann bricht die verhaltne Wut der Ordnungspartei aus, dann reißt sie den Vorhang von den Kulissen, dann denunziert sie den Präsidenten, dann erklärt sie die Republik in Gefahr, aber dann erscheint auch ihr Pathos abgeschmackt und der Anlaß des Kampfes als heuchlerischer Vorwand oder überhaupt des Kampfes nicht wert.
  en: Then does the repressed valor of the party of Order break forth, then it tears away the curtain from the scene, then it denounces the President, then it declares the republic to be in danger,--but then all its pathos appears stale, and the occasion for the quarrel a hypocritical pretext, or not at all worth the effort.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: V.15.11
  kind: p
  original: Der parlamentarische Sturm wird zu einem Sturme in einem Glase Wasser, der Kampf zur Intrige, die Kollision zum Skandal.
  en: The parliamentary tempest becomes a tempest in a tea-pot, the struggle an intrigue, the collision a scandal.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: V.15.12
  kind: p
  original: Während die Schadenfreude der revolutionären Klassen sich an der Demütigung der Nationalversammlung weidet, denn sie schwärmen ebensosehr für die parlamentarischen Prärogativen derselben wie jene Versammlung für die öffentliche Freiheiten, begreift die Bourgeoisie außerhalb des Parlaments nicht, wie die Bourgeoisie innerhalb des Parlaments ihre Zeit mit so kleinlichen Zänkereien vergeuden und die Ruhe durch so elende Rivalitäten mit dem Präsidenten bloßstellen kann.
  en: While the revolutionary classes gloat with sardonic laughter over the humiliation of the National Assembly--they, of course, being as enthusiastic for the prerogatives of the parliament as that body is for public freedom--the bourgeoisie, outside of the parliament, does not understand how the bourgeoisie, inside of the parliament, can squander its time with such petty bickerings, and can endanger peace by such wretched rivalries with the President.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '167'
- id: V.15.13
  kind: p
  original: Sie ist verwirrt über eine Strategie, die in dem Augenblicke Frieden schließt, wo alle Welt Schlachten erwartet, und in dem Augenblicke angreift, wo alle Welt den Frieden geschlossen glaubt.
  en: It is puzzled at a strategy that makes peace the very moment when everybody expects battles, and that attacks the very moment everybody believes peace has been concluded.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 167-168
- id: V.16.1
  kind: p
  original: Am 20. Dezember interpellierte Pascal Duprat den Minister des Innern über die Goldbarrenlotterie.
  en: On December 20, Pascal Duprat interpellated the Minister of the Interior on the "Goldbar Lottery."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: V.16.2
  kind: p
  original: Diese Lotterie war eine "Tochter aus Elysium", Bonaparte hatte sie mit seinen Getreuen auf die Welt gesetzt und der Polizeipräfekt Carlier hatte sie unter seine offizielle Protektion gestellt, obgleich das französische Gesetz alle Lotterien mit Ausnahme der Verlosung zu wohltätigen Zwecken untersagt.
  en: This lottery was a "Daughter from Elysium"; Bonaparte, together with his faithful, had given her birth; and Police Prefect Carlier had placed her under his official protection, although the French law forbade all lotteries, with the exception of games for benevolent purposes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: V.16.3
  kind: p
  original: Sieben Millionen Lose, Stück für Stück ein Frank, der Gewinn angeblich bestimmt zur Verschiffung von Pariser Vagabunden nach Kalifornien.
  en: Seven million tickets, a franc a piece, and the profit ostensibly destined to the shipping of Parisian vagabonds to California.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: V.16.4
  kind: p
  original: Einerseits sollten goldene Träume die sozialistischen Träume des Pariser Proletariats verdrängen, die verführerische Aussicht auf das große Los das doktrinäre Recht auf Arbeit.
  en: Golden dreams were to displace the Socialist dreams of the Parisian proletariat; the tempting prospect of a prize was to displace the doctrinal right to labor.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: V.16.5
  kind: p
  original: Die Pariser Arbeiter erkannten natürlich in dem Glanze der kalifornischen Goldbarren die unscheinbaren Franken nicht wieder, die man ihnen aus der Tasche lockte.
  en: Of course, the workingmen of Paris did not recognize in the lustre of the California gold bars the lack-lustre francs that had been wheedled out of their pockets.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: V.16.6
  kind: p
  original: In der Hauptsache aber handelte es sich um eine direkte Prellerei.
  en: In the main, however, the scheme was an unmitigated swindle.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: V.16.7
  kind: p
  original: Die Vagabunden, die kalifornische Goldminen eröffnen wollten, ohne sich aus Paris wegzubemühn, waren Bonaparte selbst und seine schuldenzerrüttete Tafelrunde.
  en: The vagabonds, who meant to open California gold mines without taking the pains to leave Paris, were Bonaparte himself and his Round Table of desperate insolvents.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: V.16.8
  kind: p
  original: Die von der Nationalversammlung bewilligten drei Millionen waren verjubelt, die Kasse mußte auf die eine oder die andere Weise wieder gefüllt werden.
  en: The three millions granted by the National Assembly were rioted away; the Treasury had to be refilled somehow or another.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: V.16.9
  kind: p
  original: Vergebens hatte Bonaparte zur Errichtung von sogenannten cités ouvrièrs <Arbeitersiedlungen> eine Nationalsubskription eröffnet, an deren Spitze er selbst mit einer bedeutenden Summe figurierte.
  en: In vain did Bonaparte open a national subscription, at the head of which he himself figured with a large sum, for the establishment of so-called "cites ouvrieres."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
  en_note: 'De Leon''s note [3]: Work cities.'
- id: V.16.10
  kind: p
  original: Die hartherzige Bourgeois warteten mißtrauisch die Einzahlung seiner Aktie ab, und da diese natürlich nicht erfolgte, fiel die Spekulation auf die sozialistischen Luftschlösser platt zu Boden.
  en: The hard-hearted bourgeois waited, distrustful, for the payment of his own shares; and, as this, of course, never took place, the speculation in Socialist castles in the air fell flat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: V.16.11
  kind: p
  original: Die Goldbarren zogen besser.
  en: The gold bars drew better.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: V.16.12
  kind: p
  original: Bonaparte und Genossen begnügten sich nicht damit, den Überschuß der sieben Millionen Lose über die auszuspielenden Barren teilweise in die Tasche zu stecken, sie fabrizierten falsche Lose, sie gaben auf dieselbe Nummer zehn, fünfzehn bis zwanzig Lose aus, Finanzoperationen im Geiste der Gesellschaft vom 10. Dezember!
  en: Bonaparte and his associates did not content themselves with putting into their own pockets part of the surplus of the seven millions over and above the bars that were to be drawn; they manufactured false tickets; they sold, of Number 10 alone, fifteen to twenty lots--a financial operation fully in the spirit of the "Society of December 10"!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: V.16.13
  kind: p
  original: Hier hatte die Nationalversammlung nicht den fiktiven Präsidenten der Republik sich gegenüber, sondern den Bonaparte in Fleisch und Blut.
  en: The National Assembly did not here have before it the fictitious President of the Republic, but Bonaparte himself in flesh and blood.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: V.16.14
  kind: p
  original: Hier konnte sie ihn auf der Tat ertappen im Konflikte nicht mit der Konstitution, sondern mit dem Code pénal.
  en: Here it could catch him in the act, not in conflict with the Constitution, but with the penal code.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
- id: V.16.15
  kind: p
  original: Wenn sie auf Duprats Interpellation zur Tagesordnung überging, geschah es nicht nur, weil Girardins Antrag, sich für "satisfait" <"befriedigt"> zu erklären, der Ordnungspartei ihre systematische Korruption ins Gedächtnis rief.
  en: 'When, upon Duprat''s interpellation, the National Assembly went over to the order of the day, this did not happen simply because Girardin''s motion to declare itself "satisfied" reminded the party of Order of its own systematic corruption: the bourgeois, above all the bourgeois who has been inflated into a statesman, supplements his practical meanness with theoretical pompousness.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '168'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.16.16
  kind: p
  original: Der Bourgeois, und vor allem der zum Staatsmann aufgeblähte Bourgeois, ergänzt seine praktische Gemeinheit durch eine theoretische Überschwenglichkeit.
  en: ''
  joined_to: V.16.15
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '168'
- id: V.16.17
  kind: p
  original: Als Staatsmann wird er wie die Staatsgewalt, die ihm gegenübersteht, ein höheres Wesen, das nur in höherer, geweihter Weise bekämpft werden kann.
  en: As statesman, he becomes, like the Government facing him, a superior being, who can be fought only in a higher, more exalted manner.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 168-169
- id: V.17.1
  kind: p
  original: Bonaparte, der eben als Bohemien, als prinzlicher Lumpenproletarier den Vorzug vor dem schuftigen Bourgeois hatte, daß er den Kampf gemein führen konnte, sah nun, nachdem die Versammlung selbst ihn über den schlüpfrigen Boden der Militärbanketts, der Revuen, der Gesellschaft vom 10. Dezember und endlich des Code pénal mit eigner Hand hinübergeleitet hatte, den Augenblick gekommen, wo er aus der scheinbaren Defensive in die Offensive übergehn konnte.
  en: Bonaparte-who, for the very reason of his being a "bohemian," a princely slum-proletarian, had over the scampish bourgeois the advantage that he could carry on the fight after the Assembly itself had carried him with its own hands over the slippery ground of the military banquets, of the reviews, of the "Society of December 10," and, finally, of the penal code-now saw that the moment had arrived when he could move from the seemingly defensive to the offensive.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: V.17.2
  kind: p
  original: Wenig genierten ihn die mittendurch spielenden kleinen Niederlagen des Justizministers, des Kriegsministers, des Marineministers, des Finanzministers, wodurch die Nationalversammlung ihr knurriges Mißvergnügen kundgab.
  en: He was but little troubled by the intermediate and trifling defeats of the Minister of Justice, of the Minister of War, of the Minister of the Navy, of the Minister of Finance, whereby the National Assembly indicated its growling displeasure.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: V.17.3
  kind: p
  original: Er verhinderte nicht nur die Minister abzutreten und so die Unterwerfung der Exekutivgewalt unter das Parlament anzuerkennen.
  en: Not only did he prevent the Ministers from resigning, and thus recognizing the subordination of the executive power to the Parliament; he could now accomplish what during the vacation of the National Assembly he had commenced, the separation of the military power from the Assembly--the deposition of Changarnier.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.17.4
  kind: p
  original: Er konnte nun vollbringen, womit er während der Ferien der Nationalversammlung begonnen hatte, die Losreißung der Militärgewalt vom Parlamente, die Absetzung Changarniers.
  en: ''
  joined_to: V.17.3
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '169'
- id: V.18.1
  kind: p
  original: Ein elyseeisches Blatt veröffentlichte einen Tagesbefehl, während des Monats Mai angeblich an die erste Militärdivision gerichtet, also von Changarnier ausgehend, worin den Offizieren empfohlen wurde, im Falle einer Empörung den Verrätern in den eignen Reihen kein Quartier <kein Pardon> zu geben, sie sofort zu erschießen und der Nationalversammlung die Truppen zu verweigern, wenn sie dieselben requirieren sollte.
  en: An Elysee paper published an order, issued during the month of May, ostensibly to the First Military Division, and, hence, proceeding from Changarnier, wherein the officers were recommended, in case of an uprising, to give no quarter to the traitors in their own ranks, to shoot them down on the spot, and to refuse troops to the National Assembly, should it make a requisition for such.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: V.18.2
  kind: p
  original: Am 3. Januar 1851 wurde das Kabinett über diesen Tagesbefehl interpelliert.
  en: On January 3, 1851, the Cabinet was interpellated on this order.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: V.18.3
  kind: p
  original: Es verlangte zur Prüfung dieser Angelegenheit erst drei Monate, dann eine Woche, endlich nur vierundzwanzig Stunden Bedenkzeit.
  en: The Cabinet demands for the examination of the affair at first three months, then one week, finally only twenty-four hours' time.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: V.18.4
  kind: p
  original: Die Versammlung besteht auf sofortigem Aufschlusse.
  en: The Assembly orders an immediate explanation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: V.18.5
  kind: p
  original: Changarnier erhebt sich und erklärt, daß dieser Tagesbefehl nie existiert habe.
  en: Changarnier rises and declares that this order never existed; he adds that he would ever hasten to respond to the calls of the National Assembly, and that, in case of a collision, they could count upon him.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.18.6
  kind: p
  original: Er fügt hinzu, daß er sich stets beeilen werde, den Aufforderungen der Nationalversammlung nachzukommen, und daß sie in einem Kollisionsfalle auf ihn rechnen könne.
  en: ''
  joined_to: V.18.5
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '169'
- id: V.18.7
  kind: p
  original: Sie empfängt seine Erklärung mit unaussprechlichem Applaus und dekretiert ihm ein Vertrauensvotum.
  en: The Assembly receives his utterances with inexpressible applause, and decrees a vote of confidence to him.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: V.18.8
  kind: p
  original: Sie dankt ab, sie dekretiert ihre eigne Machtlosigkeit und die Allmacht der Armee, indem sie sich unter die Privatprotektion eines Generals begibt, aber der General täuscht sich, wenn er ihr gegen Bonaparte eine Macht zu Gebote stellt, die er nur als Lehen von demselben Bonaparte hält, wenn er seinerseits Schutz von diesem Parlamente, von seinem schutzbedürftigen Schützling erwartet.
  en: It thereby resign its own powers; it decrees its own impotence and the omnipotence of the Army by committing itself to the private protection of a general. But the general, in turn, deceives himself when he places at the Assembly's disposal and against Bonaparte a power that he holds only as a fief from that same Bonaparte, and when, on his part, he expects protection from this Parliament, from his protege', itself needful of protection.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: V.18.9
  kind: p
  original: Aber Changarnier glaubt an die mysteriöse Macht, womit ihn die Bourgeoisie seit dem 29. Januar 1849 ausgestattet.
  en: But Changarnier has faith in the mysterious power with which since January, 1849, he had been clad by the bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '169'
- id: V.18.10
  kind: p
  original: Er hält sich für die dritte Gewalt neben den beiden übrigen Staatsgewalten.
  en: He takes himself for the Third Power, standing beside the other Powers of Government.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 169-170
- id: V.18.11
  kind: p
  original: Er teilt das Schicksal der übrigen Helden oder vielmehr Heiligen dieser Epoche, deren Größe eben in der interessierten großen Meinung besteht, die ihre Partei von ihnen aufbringt, und die in Alltagsfiguren zusammenfallen, sobald die Verhältnisse sie einladen, Wunder zu verrichten.
  en: He shares the faith of all the other heroes, or rather saints, of this epoch, whose greatness consists but in the interested good opinion that their own party holds of them, and who shrink into every-day figures so soon as circumstances invite them to perform miracles.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: V.18.12
  kind: p
  original: Der Unglaube ist überhaupt der tödliche Feind dieser vermeinten Helden und wirklichen Heiligen.
  en: Infidelity is, indeed, the deadly enemy of these supposed heroes and real saints.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: V.18.13
  kind: p
  original: Daher ihre würdevoll-sittliche Entrüstung über die enthusiasmusarmen Witzlinge und Spötter.
  en: Hence their virtuously proud indignation at the unenthusiastic wits and scoffers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: V.19.1
  kind: p
  original: An demselben Abende wurden die Minister nach dem Elysée beschieden, Bonaparte dringt auf die Absetzung Changarniers, fünf Minister weigern sich, sie zu zeichnen, der "Moniteur" kündigt eine Ministerkrise an, und die Ordnungspresse droht mit der Bildung einer parlamentarischen Armee unter dem Kommando Changarniers.
  en: That same evening the Ministers were summoned to the Elysee; Bonaparte presses the removal of Changarnier; five Ministers refuse to sign the order; the "Moniteur" announces a Ministerial crisis; and the party of Order threatens the formation of a Parliamentary army under the command of Changarnier.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: V.19.2
  kind: p
  original: Die Partei der Ordnung hatte die konstitutionelle Befugnis zu diesem Schritte.
  en: The party of Order had the constitutional power hereto.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: V.19.3
  kind: p
  original: Sie brauchte bloß Changarnier zum Präsidenten der Nationalversammlung zu ernennen und eine beliebige Truppenmasse zu ihrer Sicherheit zu requirieren.
  en: It needed only to elect Changarnier President of the National Assembly in order to make a requisition for whatever military forces it needed for its own safety.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: V.19.4
  kind: p
  original: Sie konnte es um so sicherer, als Changarnier noch wirklich an der Spitze der Armee und der Pariser Nationalgarde stand und nur darauf lauerte, mitsamt der Armee requiriert zu werden.
  en: It could do this all the more safely, seeing that Changarnier still stood at the head of the Army and of the Parisian National Guard, and only lay in wait to be summoned, together with the Army.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: V.19.5
  kind: p
  original: Die bonapartistische Presse wagte noch nicht einmal, das Recht der Nationalversammlung zu direkter Requisition der Truppen in Frage zu stellen, ein juristischer Skrupel, der unter den gegebenen Verhältnissen keinen Erfolg versprach.
  en: The Bonapartist press did not even dare to question the right of the National Assembly to issue a direct requisition for troops;--a legal scruple, that, under the given circumstances, did not promise success.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: V.19.6
  kind: p
  original: Daß die Armee dem Befehle der Nationalversammlung gehorcht hätte, ist wahrscheinlich, wenn man erwäge, daß Bonaparte acht Tage in ganz Paris suchen mußte, um endlich zwei Generäle zu finden - Baraguay d'Hilliers und St-Jean-d'Angley -, die sich bereit erklärten, die Absetzung Changarniers zu kontrasignieren.
  en: That the Army would have obeyed the orders of the National Assembly is probable, when it is considered that Bonaparte had to look eight days all over Paris to find two generals--Baraguay d'Hilliers and St. Jean d'Angley--who declared themselves ready to countersign the order cashiering Changamier.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: V.19.7
  kind: p
  original: Daß die Ordnungspartei aber in ihren eignen Reihen und im Parlamente die zu einem solchen Beschluß nötige Stimmenzahl gefunden hätte, ist mehr als zweifelhaft, wenn man bedenkt, daß acht Tage später 286 Stimmen sich von ihr trennten und daß die Montagne einen ähnlichen Vorschlag noch im Dezember 1851, in der letzten Stunde der Entscheidung, verwarf.
  en: That, however, the party of Order would have found in its own ranks and in the parliament the requisite vote for such a decision is more than doubtful, when it is considered that, eight days later, 286 votes pulled away from it, and that, as late as December, 1851, at the last decisive hour, the Mountain rejected a similar proposition.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: V.19.8
  kind: p
  original: Indessen wäre es vielleicht den Burggrafen jetzt noch gelungen, die Masse ihrer Partei zu einem Heroismus hinzureißen, der darin bestand, sich hinter einem Wald von Bajonetten sicher zu fühlen und den Dienst einer Armee anzunehmen, die in ihr Lager desertiert war.
  en: Nevertheless, the burgraves might still have succeeded in driving the mass of their party to an act of heroism, consisting in feeling safe behind a forest of bayonets, and in accepting the services of the Army, which found itself deserted in its camp.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: V.19.9
  kind: p
  original: Statt dessen begaben sich die Herren Burggrafen am Abende des 6. Januar ins Elysée, um durch staatskluge Wendungen und Bedenken Bonaparte von der Absetzung Changarniers abstehn zu machen.
  en: Instead of this, the Messieurs Burgraves betook themselves to the Elysee on the evening of January 6, with the view of inducing Bonaparte, by means of politic words and considerations, to drop the removal of Changarnier.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: V.19.10
  kind: p
  original: Wen man zu überreden versucht, den erkennt man als den Meister der Situation an.
  en: Him whom we must convince we recognize as the master of the situation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: V.19.11
  kind: p
  original: Bonaparte, durch diesen Schritt sicher gemacht, ernennt am 12. Januar ein neues Ministerium, worin die Führer des alten, Fould und Baroche, verbleiben.
  en: Bonaparte, made to feel secure by this step, appoints on January 12 a new Ministry, in which the leaders of the old, Fould and Baroche, are retained.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '170'
- id: V.19.12
  kind: p
  original: St- Jean-d'Angely wird Kriegsminister, der "Moniteur" bringt das Absetzungsdekret Changarniers, sein Kommando wird geteilt unter Baraguay d'Hilliers, der die erste Militärdivision, und Perrot, der die Nationalgarde erhält.
  en: St Jean d'Angley becomes Minister of War; the "Moniteur" announces the decree cashiering Changarnier; his command is divided up between Baraguay d'Hilliers, who receives the First Division, and Perrot, who is placed over the National Guard.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 170-171
- id: V.19.13
  kind: p
  original: Das Bollwerk der Gesellschaft ist abgedankt, und wenn kein Stein darüber vom Dache fällt, steigen dagegen die Börsenkurse.
  en: The "Bulwark of Society" is turned down; and, although no dog barks over the event, in the Bourses the stock quotations rise.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: V.20.1
  kind: p
  original: Indem sie die Armee, die sich ihr in Changarniers Person zur Verfügung stellt, zurückstößt und so unwiderruflich dem Präsidenten überantwortet, erklärt die Ordnungspartei, daß die Bourgeoisie den Beruf zum Herrschen verloren hat.
  en: By repelling the Army, that, in Changarnier's person, put itself at its disposal, and thus irrevocably stood up against the President, the party of Order declares that the bourgeoisie has lost its vocation to reign.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: V.20.2
  kind: p
  original: Es existiert bereits kein parlamentarisches Ministerium mehr.
  en: Already there was no parliamentary Ministry.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: V.20.3
  kind: p
  original: Indem sie nun noch die Handhabe der Armee und Nationalgarde verlor, welches Gewaltmittel blieb ihr, um gleichzeitig die usurpierte Gewalt des Parlaments über das Volk und seine konstitutionelle Gewalt gegen den Präsidenten zu behaupten?
  en: By losing, furthermore, the handle to the Army and to the National Guard, what instrument of force was there left to the National Assembly in order to maintain both the usurped power of the parliament over the people, and its constitutional power over the President?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: V.20.4
  kind: p
  original: Keins.
  en: None.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: V.20.5
  kind: p
  original: Es blieb ihr nur noch der Appell an gewaltlose Prinzipien, die sie selbst stets nur als allgemeine Regeln ausgelegt hatte, die man dritten vorschreibt, um sich selbst desto freier bewegen zu können.
  en: All that was left to it was the appeal to peaceful principles, that itself had always explained as "general rules" merely, to be prescribed to third parties, and only in order to enable itself to move all the more freely.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: V.20.6
  kind: p
  original: Mit der Absetzung Changarniers, mit dem Anheimfall der Militärgewalt an Bonaparte, schließt er erste Abschnitt der Periode, die wir betrachten, der Periode des Kampfes zwischen der Ordnungspartei und der Exekutivgewalt.
  en: With the removal of Changarnier, with the transfer of the military power to Bonaparte, closes the first part of the period that we are considering, the period of the struggle between the party of Order and the Executive power.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: V.20.7
  kind: p
  original: Der Krieg zwischen den beiden Gewalten ist jetzt offen erklärt, wird offen geführt, aber erst nachdem die Ordnungspartei Waffen und Soldaten verloren hat.
  en: The war between the two powers is now openly declared; it is conducted openly; but only after the party of Order has lost both arms and soldier.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: V.20.8
  kind: p
  original: Ohne Ministerium, ohne Armee, ohne Volk, ohne öffentliche Meinung, seit ihrem Wahlgesetz vom 31. Mai nicht mehr die Repräsentantin der souveränen Nation, ohn' Aug', ohn' Ohr, ohn' Zahn, ohn' alles, hatte sich die Nationalversammlung allgemach in ein altfranzösisches Parlament verwandelt, das die Aktion der Regierung überlassen und sich selbst mit knurrenden Remonstrationen post festum begnügen muß.
  en: With-out a Ministry, without any army, without a people, without the support of public opinion; since its election law of May 31, no longer the representative of the sovereign nation sans eyes, sans ears, sans teeth, sans everything, the National Assembly had gradually converted itself into a French Parliament of olden days, that must leave all action to the Government, and content itself with growling remonstrances "post festum."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
  en_note: 'De Leon''s note [4]: After the act is done; after the fact.'
- id: V.21.1
  kind: p
  original: Die Ordnungspartei empfängt das neue Ministerium mit einem Sturme der Entrüstung.
  en: The party of Order receives the new Ministry with a storm of indignation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: V.21.2
  kind: p
  original: General Badeau ruft die Milde der Permanenzkommission während der Ferien ins Gedächtnis zurück und die übergroße Rücksicht, womit sie auf die Veröffentlichung ihrer Protokolle verzichtet habe.
  en: General Bedeau calls to mind the mildness of the Permanent Committee during the vacation, and the excessive prudence with which it had renounced the privilege of disclosing its minutes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: V.21.3
  kind: p
  original: Der Minister des Innern besteht nun selbst auf Veröffentlichung dieser Protokolle, die jetzt natürlich schal wie abgestandenes Wasser geworden sind, keine neue Tatsache enthüllen und ohne die geringste Wirkung in das blasierte Publikum fallen.
  en: Now, the Minister of the Interior himself insists upon the disclosure of these minutes, that have now, of course, become dull as stagnant waters, reveal no new facts, and fall without making the slightest effect upon the blase public.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: V.21.4
  kind: p
  original: Auf Rémusats Vorschlag zieht sich die Nationalversammlung in ihre Büros zurück und ernennt ein "Komitee außerordentlicher Maßregeln".
  en: Upon Remusat's proposition, the National Assembly retreats into its Committees, and appoints a "Committee on Extraordinary Measures."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: V.21.5
  kind: p
  original: Paris tritt um so weniger aus dem Gleise seiner alltäglichen Ordnung, als der Handel in diesem Augenblicke prosperiert, die Manufakturen beschäftigt sind, die Getreidepreise niedrig stehn, die Lebensmittel überfließen, die Sparkassen täglich neue Depositen erhalten.
  en: Paris steps all the less out of the ruts of its daily routine, seeing that business is prosperous at the time, the manufactories busy, the prices of cereals low, provisions abundant, the savings banks receiving daily new deposits.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '171'
- id: V.21.6
  kind: p
  original: Die "außerordentlichen Maßregeln", die das Parlament so geräuschvoll angekündigt hat, verpuffen am 18. Januar in ein Mißtrauensvotum gegen die Minister, ohne daß General Changarnier auch nur erwähnt wurde.
  en: The "extraordinary measures," that the parliament so noisily announced fizzle out on January 18 in a vote of lack of confidence against the Ministry, without General Changarnier's name being even mentioned.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 171-172
- id: V.21.7
  kind: p
  original: Die Ordnungspartei war zu dieser Fassung ihres Votums gezwungen, um sich die Stimmen der Republikaner zu sichern, da diese von allen Maßregeln des Ministeriums gerade nur die Absetzung Changarniers billigen, während die Ordnungspartei in der Tat die übrigen ministeriellen Akte nicht tadeln kann, die sie selbst diktiert hatte.
  en: The party of Order was forced to frame its motion in that way so as to secure the votes of the republicans, because, of all the acts of the Ministry, Changarnier's dismissal only was the very one they approved, while the party of Order cannot in fact, condemn the other Ministerial acts which it had itself dictated.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: V.22.1
  kind: p
  original: Für das Mißtrauensvotum vom 18. Januar entschieden 415 gegen 286 Stimmen.
  en: The January 18 vote of lack of confidence was decided by 415 ayes against 286 nays.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: V.22.2
  kind: p
  original: Es wurde also nur durchgesetzt durch eine Koalition der entschiedenen Legitimisten und Orleanisten mit den reinen Republikanern und der Montagne.
  en: It was, accordingly put through by a coalition of the uncompromising Legitimists and Orleanists with the pure republicans and the Mountain.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: V.22.3
  kind: p
  original: Es bewies also, daß die Partei der Ordnung nicht nur das Ministerium, nicht nur die Armee, sondern in Konflikten mit Bonaparte auch ihre selbständige parlamentarische Majorität verloren hatte, daß ein Trupp von Repräsentanten aus ihrem Lager desertiert war, aus Vermittlungsfanatismus, aus Furcht vor dem Kampfe, aus Abspannung, aus Familienrücksicht für blutsverwandte Staatsgehalte, aus Spekulation, auf frei werdende Ministerposten (Odilon Barrot), aus dem platten Egoismus, womit der gewöhnliche Bourgeois stets geneigt ist, das Gesamtinteresse seiner Klasse diesem oder jenem Privatmotive zu opfern.
  en: Thus it revealed the fact that, in its conflicts with Bonaparte, not only the Ministry, not only the Army, but also its independent parliamentary majority; that a troop of Representatives had deserted its camp out of a fanatic zeal for harmony, out of fear of fight, out of lassitude, out of family considerations for the salaries of relatives in office, out of speculations on vacancies in the Ministry (Odillon Barrot), or out of that unmitigated selfishness that causes the average bourgeois to be ever inclined to sacrifice the interests of his class to this or that private motive.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: V.22.4
  kind: p
  original: Die bonapartistischen Repräsentanten gehörten von vorn herein der Ordnungspartei nur im Kampfe gegen die Revolution.
  en: The Bonapartist Representatives belonged from the start to the party of Order only in the struggle against the revolution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: V.22.5
  kind: p
  original: Der Chef der katholischen Partei, Montalembert, warf seinen Einfluß schon damals in die Waagschale Bonapartes, da er an der Lebensfähigkeit der parlamentarischen Partei verzweifelte.
  en: The leader of the Catholic party, Montalembert, already then threw his influence in the scale of Bonaparte, since he despaired of the vitality of the parliamentary party.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: V.22.6
  kind: p
  original: Die Führer dieser Partei endlich, Thiers und Berryer, der Orleanist und der Legitimist, waren gezwungen, sich offen als Republikaner zu proklamieren, zu bekennen, daß ihr Herz königlich, aber ihr Kopf republikanisch gesinnt, daß die parlamentarische Republik die einzig mögliche Form für die Herrschaft der Gesamtbourgeoisie sei.
  en: Finally, the leaders of this party itself, Thiers and Berryer--the Orleanist and the Legitimist--were compelled to proclaim themselves openly as republicans; to admit that their heart favored royalty, but their head the republic; that their parliamentary republic was the only possible form for the rule of the bourgeoisie Thus were they compelled to brand, before the eyes of the bourgeois class itself, as an intrigue--as dangerous as it was senseless--the restoration plans, which they continued to pursue indefatigably behind the back of the parliament.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.22.7
  kind: p
  original: Sie waren so gezwungen, die Restaurationspläne, die sie unverdrossen hinter dem Rücken des Parlaments weiter verfolgten, vor den Augen der Bourgeoisklasse selbst als eine ebenso gefahrvolle wie kopflose Intrige zu brandmarken.
  en: ''
  joined_to: V.22.6
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '172'
- id: V.23.1
  kind: p
  original: Das Mißtrauensvotum vom 18. Januar traf die Minister und nicht den Präsidenten.
  en: The January 18 vote of lack of confidence struck the Ministers, not the President.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: V.23.2
  kind: p
  original: Aber nicht das Ministerium, der Präsident hatte Changarnier abgesetzt.
  en: But it was not the Ministry, it was the President who had deposed Changarnier.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: V.23.3
  kind: p
  original: Sollte die Ordnungspartei Bonaparte selbst in Anklagezustand versetzen?
  en: Should the party of Order place Bonaparte himself under charges?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: V.23.4
  kind: p
  original: Wegen seiner Restaurationsgelüste?
  en: On account of his restoration hankerings?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: V.23.5
  kind: p
  original: Sie ergänzten nur ihre eignen.
  en: These only supplemented their own.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: V.23.6
  kind: p
  original: Wegen seiner Konspiration in den Militärrevuen und der Gesellschaft vom 10. Dezember?
  en: On account of his conspiracy at the military reviews and of the "Society of December 10"?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: V.23.7
  kind: p
  original: Sie hatten diese Themata längst unter einfachen Tagesordnungen begraben.
  en: They had long since buried these subjects under simple orders of business.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: V.23.8
  kind: p
  original: Wegen der Absetzung des Helden vom 29. Januar und vom 13. Juni, des Mannes, der Mai 1850 im Falle einer Emeute Paris an allen vier Ecken in Brand zu stecken drohte?
  en: On account of the discharge of the hero of January 29 and June 13, of the man who, in May, 1850, threatened, in case of riot, to set Paris on fire at all its four corners?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '172'
- id: V.23.9
  kind: p
  original: Ihre Alliierten von der Montagne und Cavaignac erlaubten ihnen nicht einmal, das gefallene Bollwerk der Gesellschaft durch eine offizielle Beileidsbezeugung aufzurichten.
  en: Their allies of the Mountain and Cavaignac did not even allow them to console the fallen "Bulwark of Society" with an official testimony of their sympathy.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 172-173
- id: V.23.10
  kind: p
  original: Sie selbst konnten dem Präsidenten die konstitutionelle Befugnis, einen General abzusetzen, nicht bestreiten.
  en: They themselves could not deny the constitutional right of the President to remove a General.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '173'
- id: V.23.11
  kind: p
  original: Sie tobten nur, weil er von seinem konstitutionellen Rechte einen unparlamentarischen Gebrauch machte.
  en: They stormed only because he made an unparliamentary use of his constitutional right.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '173'
- id: V.23.12
  kind: p
  original: Hatten sie von ihrer parlamentarischen Prärogative nicht fortwährend einen unkonstitutionellen Gebrauch gemacht und namentlich bei der Abschaffung des allgemeinen Wahlrechts?
  en: Had they not themselves constantly made an unconstitutional use of their parliamentary prerogative, notably by the abolition of universal suffrage?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '173'
- id: V.23.13
  kind: p
  original: Sie waren also darauf angewiesen, sich genau innerhalb der parlamentarischen Schranken zu bewegen.
  en: Consequently they were reminded to move exclusively within parliamentary bounds.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '173'
- id: V.23.14
  kind: p
  original: Und es gehörte jene eigentümliche Krankheit dazu, die seit 1848 auf dem Kontinent grassiert hat, der parlamentarische Kretinismus, der die Angesteckten in eine eingebildete Welt festbannt und ihnen allen Sinn, alle Erinnerung, alles Verständnis für die rauhe Außenwelt raubt, dieser parlamentarische Kretinismus gehört dazu, wenn sie, die alle Bedingungen der parlamentarischen Macht mit eignen Händen zerstört hatten und in ihrem Kampfe mit den andern Klassen zerstören mußten, ihre parlamentarischen Siege noch für Siege hielten und den Präsidenten zu treffen glaubten, indem sie auf seine Minister schlugen.
  en: Indeed, it required that peculiar disease, a disease that, since 1848, has raged over the whole continent, "Parliamentary Idiocy,"--that fetters those whom it infects to an imaginary world, and robs them of all sense, all remembrance, all understanding of the rude outside world;--it required this "Parliamentary Idiocy" in order that the party of Order, which had, with its own hands, destroyed all the conditions for parliamentary power, and, in its struggle with the other classes, was obliged to destroy them, still should consider its parliamentary victories as victories, and imagine it hit the President by striking his Ministers.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '173'
- id: V.23.15
  kind: p
  original: Sie gaben ihm nur Gelegenheit, die Nationalversammlung von neuem in den Augen der Nation zu demütigen.
  en: They only afforded him an opportunity to humble the National Assembly anew in the eyes of the nation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '173'
- id: V.23.16
  kind: p
  original: Am 20. Januar meldete der "Moniteur", daß die Entlassung des Gesamtministeriums angenommen sei.
  en: On January 20, the "Moniteur" announced that the whole the dismissal of the whole Ministry was accepted.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '173'
- id: V.23.17
  kind: p
  original: Unter dem Vorwande, daß keine parlamentarische Partei mehr die Majorität besitze, wie das Votum vom 18. Januar, diese Frucht der Koalition zwischen Montagne und Royalisten, beweise, und um die Neubildung einer Majorität abzuwarten, ernannte Bonaparte ein sogenanntes Übergangsministerium, wovon kein Mitglied dem Parlamente angehörte, lauter durchaus unbekannte und bedeutungslose Individuen, ein Ministerium von bloßen Kommis und Schreibern.
  en: Under the pretext that none of the parliamentary parties had any longer the majority--as proved by the January 18 vote, that fruit of the coalition between mountain and royalists--, and, in order to await the re-formation of a majority, Bonaparte appointed a so-called transition Ministry, of whom no member belonged to the parliament-altogether wholly unknown and insignificant individuals; a Ministry of mere clerks and secretaries.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '173'
- id: V.23.18
  kind: p
  original: Die Ordnungspartei konnte sich jetzt im Spiele mit diesen Marionetten abarbeiten, die Exekutivgewalt hielt es nicht mehr der Mühe wert, ernsthaft in der Nationalversammlung vertreten zu sein.
  en: The party of Order could now wear itself out in the game with these puppets; the Executive power no longer considered it worth the while to be seriously represented in the National Assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '173'
- id: V.23.19
  kind: p
  original: Bonaparte konzentrierte um so sichtbarer die ganze Exekutivgewalt in seiner Person, er hatte um so freiern Spielraum, sie zu seinen Zwecken auszubeuten, je mehr seine Minister reine Statisten waren.
  en: By this act Bonaparte concentrated the whole executive power all the more securely in his own person; he had all the freer elbow-room to exploit the same to his own ends, the more his Ministers became mere supernumeraries.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '173'
- id: V.24.1
  kind: p
  original: Die mit der Montagne koalisierte Ordnungspartei rächte sich, indem sie die präsidentielle Dotation von 1.800.000 frs. verwarf, zu deren Vorlage das Haupt der Gesellschaft vom 10. Dezember seine ministeriellen Kommis gezwungen hatte.
  en: The party of Order, now allied with the Mountain, revenged itself by rejecting the Presidential endowment project of 1,800.000 francs, which the chief of the "Society of December 10" had compelled his Ministerial clerks to present to the Assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '173'
- id: V.24.2
  kind: p
  original: Diesmal entschied eine Majorität von nur 102 Stimmen, es waren also seit dem 18. Januar neuerdings 27 Stimmen abgefallen, die Auflösung der Ordnungspartei ging voran.
  en: 'This time a majority of only 102 votes carried the day accordingly since January 18, 27 more votes had fallen off: the dissolution of the party of Order was making progress.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '173'
- id: V.24.3
  kind: p
  original: Damit man sich keinen Augenblick über den Sinn ihrer Koalition mit der Montagne täusche, verschmähte sie gleichzeitig, einen von 189 Mitgliedern der Montagne unterzeichneten Antrag auf allgemeine Amnestie der politischen Verbrecher auch nur in Betracht zu ziehen.
  en: Lest any one might for a moment be deceived touching the meaning of its coalition with the Mountain, the party of Order simultaneously scorned even to consider a motion, signed by 189 members of the Mountain, for a general amnesty to political criminals.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 173-174
- id: V.24.4
  kind: p
  original: Es genügte, daß der Minister des Innern, ein gewisser Vaïsse, erklärte, die Ruhe sei nur scheinbar, im geheimen herrsche große Agitation, im geheimen organisierten sich allgegenwärtigen Gesellschaften, die demokratischen Blätter machten Anstalten, um wieder zu erscheinen, die Berichte aus den Departements lauteten ungünstig, die Flüchtlinge von Genf leiteten eine Verschwörung über Lyon durch ganz Südfrankreich, Frankreich stehe am Rande einer industriellen und kommerziellen Krise, die Fabrikanten von Roubaix hätten die Arbeitszeit vermindert, die Gefangenen von Belle-Île sich empört -, es genügte, daß selbst nur ein Vaïsse das rote Gespenst heraufbeschwor, damit die Partei der Ordnung ohne Diskussion einen Antrag verwarf, der der Nationalversammlung eine ungeheure Popularität erobern und Bonaparte in ihre Arme zurückwerfen mußte.
  en: It was enough that the Minister of the Interior, one Baisse, declared that the national tranquility was only in appearance, in secret there reigned deep agitation, in secret, ubiquitous societies were organized, the democratic papers were preparing to reappear, the reports from the Departments were unfavorable, the fugitives of Geneva conducted a conspiracy via Lyons through the whole of southern France, France stood on the verge of an industrial and commercial crisis, the manufacturers of Roubaix were working shorter hours, the prisoners of Belle Isle had mutinied;--it was enough that even a mere Baisse should conjure up the "Red Spectre" for the party of Order to reject without discussion a motion that would have gained for the National Assembly a tremendous popularity, and thrown Bonaparte back into its arms.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '174'
- id: V.24.5
  kind: p
  original: Statt sich von der Exekutivgewalt durch die Perspektive neuer Unruhen einschüchtern zu lassen, hätte sie vielmehr dem Klassenkampf einen kleinen Spielraum gewähren müssen, um die Exekutive von sich abhängig zu machen.
  en: Instead of allowing itself to be intimidated by the Executive power with the perspective of fresh disturbances, the party of Order should rather have allowed a little elbow-room to the class struggle, in order to secure the dependence of the Executive upon itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '174'
- id: V.24.6
  kind: p
  original: Aber sie fühlte sich nicht der Aufgabe gewachsen, mit dem Feuer zu spielen.
  en: But it did not feel itself equal to the task of playing with fire.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '174'
- id: V.25.1
  kind: p
  original: Unterdessen vegetierte das sogenannte Übergangsministerium bis Mitte April fort.
  en: Meanwhile, the so-called transition Ministry vegetated along until the middle of April.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '174'
- id: V.25.2
  kind: p
  original: Bonaparte ermüdete, foppte die Nationalversammlung mit beständig neuen Ministerkombinationen.
  en: Bonaparte tired out and fooled the National Assembly with constantly new Ministerial combinations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '174'
- id: V.25.3
  kind: p
  original: Bald schien er ein republikanisches Ministerium bilden zu wollen mit Lamartine und Billault, bald ein parlamentarisches mit dem unvermeidlichen Odilon Barrot, dessen Name nie fehlen darf, wenn ein dupe notwendig ist, bald ein legitimistisches mit Vatimesnil und Benoist d'Azy, bald ein orleanistisches mit Maleville.
  en: Now he seemed to intend constructing a republican Ministry with Lamartine and Billault; then, a parliamentary one with the inevitable Odillon Barrot, whose name must never be absent when a dupe is needed; then again, a Legitimist, with Batismenil and Lenoist d'Azy; and yet again, an Orleansist, with Malleville.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '174'
- id: V.25.4
  kind: p
  original: Während er so die verschiedenen Fraktionen der Ordnungspartei in Spannung gegeneinander erhält und sie insgesamt mit der Aussicht auf ein republikanisches Ministerium und die dann unvermeidlich gewordene Herstellung des allgemeinen Wahlrechts ängstigtet, bringt er gleichzeitig bei der Bourgeoisie die Überzeugung hervor, daß seine aufrichtigen Bemühungen um ein parlamentarisches Ministerium an der Unversöhnlichkeit der royalistischen Fraktionen scheitern.
  en: While thus throwing the several factions of the party of Order into strained relations with one another, and alarming them all with the prospect of a republican Ministry, together with the there-upon inevitable restoration of universal suffrage, Bonaparte simultaneously raises in the bourgeoisie the conviction that his sincere efforts for a parliamentary Ministry are wrecked upon the irreconcilable antagonism of the royalist factions.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '174'
- id: V.25.5
  kind: p
  original: Die Bourgeoisie schrie aber um so lauter nach einer "starken Regierung", sie fand es um so unverzeihlicher, Frankreich "ohne Administration" zu lassen, je mehr eine allgemeine Handelskrise nun im Anmarsche schien und in den Städten für den Sozialismus warb, wie der ruinierend niedrige Preis des Getreides auf dem Lande.
  en: All the while the bourgeoisie was clamoring louder and louder for a "strong Government," and was finding it less and less pardonable to leave France "without an administration," in proportion as a general commercial crisis seemed to be under way and making recruits for Socialism in the cities, as did the ruinously low price of grain in the rural districts.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '174'
- id: V.25.6
  kind: p
  original: Der Handel wurde täglich flauer, die unbeschäftigten Hände vermehrten sich zusehends, in Paris waren wenigstens 10.000 Arbeiter brotlos, in Rouen, Mühlhausen, Lyon, Roubaix, Tourcoing, St-Etienne, Elbeuf usw. standen zahllose Fabriken still.
  en: Trade became daily duller; the unemployed hands increased perceptibly; in Paris, at least 10,000 workingmen were without bread; in Rouen, Muehlhausen, Lyons, Roubaix, Tourcoign, St. Etienue, Elbeuf, etc., numerous factories stood idle.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '174'
- id: V.25.7
  kind: p
  original: Unter diesen Umständen konnte Bonaparte es wagen, am 11. April das Ministerium vom 18. Januar zu restaurieren.
  en: Under these circumstances Bonaparte could venture to restore, on April 11, the Ministry of January 18; Messieurs Rouher, Fould, Baroche, etc., reinforced by Mr. Leon Faucher, whom the constitutive assembly had, during its last days, unanimously, with the exception of five Ministerial votes, branded with a vote of censure for circulating false telegraphic dispatches.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 174-175
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: V.25.8
  kind: p
  original: Die Herren Rouher, Fould, Baroche etc. verstärkt durch Herrn Léon Faucher, den die konstituierende Versammlung während ihrer letzten Tage einstimmig mit Ausnahme von fünf Ministerstimmen wegen Verbreitung falscher telegraphischer Depeschen mit einem Mißtrauensvotum gebrandmarkt hatte.
  en: ''
  joined_to: V.25.7
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '175'
- id: V.25.9
  kind: p
  original: Die Nationalversammlung hatte also am 18. Januar einen Sieg über das Ministerium davongetragen, sie hatte während drei Monaten mit Bonaparte gekämpft, damit am 11. April Fould und Baroche den Puritaner Faucher als dritten in ihren ministeriellen Bunde aufnehmen konnten.
  en: Accordingly, the National Assembly had won a victory on January 18 over the Ministry, it had, for the period of three months, been battling with Bonaparte, and all this merely to the end that, on April 11, Fould and Baroche should be able to take up the Puritan Faucher as third in their ministerial league.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '175'
- id: V.26.1
  kind: p
  original: November 1849 hatte sich Bonaparte mit einem unparlamentarischen Ministerium begnügt, Januar 1851 mit einem außerparlamentarischen, am 11. April fühlte er sich stark genug ein antiparlamentarisches Ministerium zu bilden, das die Mißtrauensvota beider Versammlungen, der Konstituante und der Legislative, der republikanischen und der royalistischen, harmonisch in sich vereinigte.
  en: In November, 1849, Bonaparte had satisfied himself with an Unparliamentary, in January, 1851, with an Extra-Parliamentary, on April 11, he felt strong enough to form an Anti-Parliamentary Ministry, that harmoniously combined within itself the votes of lack of confidence of both assemblies-the constitutive and the legislative, the republican and the royalist.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '175'
- id: V.26.2
  kind: p
  original: Diese Stufenleiter von Ministerien war der Thermometer, woran das Parlament die Abnahme der eignen Lebenswärme messen konnte.
  en: This ministerial progression was a thermometer by which the parliament could measure the ebbing temperature of its own life.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '175'
- id: V.26.3
  kind: p
  original: Diese war Ende April so tief gesunken, daß Persigny den Changarnier in einer persönlichen Zusammenkunft auffordern konnte, in das Lager des Präsidenten überzugehn.
  en: This had sunk so low by the end of April that, at a personal interview, Persigny could invite Changarnier to go over to the camp of the President.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '175'
- id: V.26.4
  kind: p
  original: Bonaparte, versicherte er ihm, betrachte den Einfluß der Nationalversammlung als vollständig vernichtet, und schon liege die Proklamation bereit, die nach dem beständig beabsichtigten, aber zufällig wieder aufgeschobenen coup d'état veröffentlicht werden solle.
  en: Bonaparte, he assured Changarnier, considered the influence of the National Assembly to be wholly annihilated, and already the proclamation was ready, that was to be published after the steadily contemplated, but again accidentally postponed "coup d'etat."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '175'
- id: V.26.5
  kind: p
  original: Changarnier teilte den Führern der Ordnungspartei die Todesanzeige mit, aber wer glaubt, daß der Biß von Wanzen tötet?
  en: Changarnier communicated this announcement of its death to the leaders of the party of Order; but who was there to believe a bed-bug bite could kill?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '175'
- id: V.26.6
  kind: p
  original: Und das Parlament, so geschlagen, so aufgelöst, so sterbefaul es war, konnte sich nicht überwinden, in dem Duelle mit dem grotesken Chef der Gesellschaft vom 10. Dezember etwas andres zu sehen als das Duell mit einer Wanze.
  en: The parliament, however beaten, however dissolved, however death-tainted it was, could not persuade itself to see, in the duel with the grotesque chief of the "Society of December 10," anything but a duel with a bed-bug.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '175'
- id: V.26.7
  kind: p
  original: 'Aber Bonaparte antwortete der Partei der Ordnung wie Agesilaos dem Könige Agis: "Ich scheine dir Ameise, aber ich werde einmal Löwe sein."'
  en: 'But Bonaparte answered the party of Order as Agesilaus did King Agis: "I seem to you an ant; but shall one day be a lion."'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '175'
