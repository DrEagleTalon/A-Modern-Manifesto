- id: II.1.1
  kind: p
  original: Nehmen wir den Faden der Entwicklung wieder auf.
  en: Let us resume the thread of events.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: II.2.1
  kind: p
  original: Die Geschichte der konstituierenden Nationalversammlung seit den Junitagen ist die Geschichte der Herrschaft und Auflösung der republikanischen Bourgeoisfraktion, jener Fraktion, die man unter dem Namen trikolore Republikaner, reine Republikaner, politische Republikaner, formalistische Republikaner usw. kennt.
  en: The history of the Constitutional National Assembly from the June days on, is the history of the supremacy and dissolution of the republican bourgeois party, the party which is known under several names of "Tricolor Republican," "True Republican," "Political Republican," "Formal Republican," etc., etc. Under the bourgeois monarchy of Louis Philippe, this party had constituted the Official Republican Opposition, and consequently had been a recognized element in the then political world.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.3.1
  kind: p
  original: Sie hatte unter der bürgerlichen Monarchie Louis-Philippes die offizielle republikanische Opposition und daher einen anerkannten Bestandteil der damaligen politischen Welt gebildet.
  en: ''
  joined_to: II.2.1
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '124'
- id: II.3.2
  kind: p
  original: Sie besaß ihre Vertreter in den Kammern, und in der Presse einen bedeutenden Wirkungskreis.
  en: It had its representatives in the Chambers, and commanded considerable influence in the press.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: II.3.3
  kind: p
  original: Ihr Pariser Organ, der "National", galt in seiner Weise für ebenso respektabel als das "Journal des Débats".
  en: Its Parisian organ, the "National," passed, in its way, for as respectable a paper as the "Journal des Debats."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: II.3.4
  kind: p
  original: Dieser Stellung unter der konstitutionellen Monarchie entsprach ihr Charakter.
  en: This position in the constitutional monarchy corresponded to its character.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: II.3.5
  kind: p
  original: Es war dies keine durch große gemeinsame Interessen zusammengehaltene und durch eigentümliche Produktionsbedingungen abgegrenzte Fraktion der Bourgeoisie.
  en: The party was not a fraction of the bourgeoisie, held together by great and common interests, and marked by special business requirements.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: II.3.6
  kind: p
  original: Es war eine Koterie von republikanisch gesinnten Bourgeois, Schriftstellern, Advokaten, Offizieren und Beamten, deren Einfluß auf den persönlichen Antipathien des Landes gegen Louis-Philippe, auf Erinnerungen an die alte Republik, auf dem republikanischen Glauben einer Anzahl von Schwärmern, vor allem aber auf dem französischen Nationalismus beruhte, dessen Haß gegen die Wiener Verträge und gegen die Allianz mit England sie fortwährend wachhielt.
  en: It was a coterie of bourgeois with republican ideas-writers, lawyers, officers and civil employees, whose influence rested upon the personal antipathies of the country for Louis Philippe, upon reminiscences of the old Republic, upon the republican faith of a number of enthusiasts, and, above all, upon the spirit of French patriotism, whose hatred of the treaties of Vienna and of the alliance with England kept them perpetually on the alert.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: II.3.7
  kind: p
  original: Einen großen Teil des Anhangs, den der "National" unter Louis-Philippe besaß, schuldete er diesem versteckten Imperialismus, der ihm daher später unter der Republik als ein vernichtender Konkurrent in der Person Louis Bonaparte gegenübertreten konnte.
  en: The "National" owed a large portion of its following under Louis Philippe to this covert imperialism, that, later under the republic, could stand up against it as a deadly competitor in the person of Louis Bonaparte.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: II.3.8
  kind: p
  original: Die Finanzaristokratie bekämpfte er, wie die ganze übrige bürgerliche Opposition es tat.
  en: The fought the aristocracy of finance just the same as did the rest of the bourgeois opposition.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '124'
- id: II.3.9
  kind: p
  original: Die Polemik gegen das Budget, die in Frankreich genau mit der Bekämpfung der Finanzaristokratie zusammenhing, verschaffte eine zu wohlfeile Popularität und zu reichhaltigen Stoff zu puritanischen leading articles <Leitartikeln>, um nicht ausgebeutet zu werden.
  en: The polemic against the budget, which in France, was closely connected with the opposition to the aristocracy of finance, furnished too cheap a popularity and too rich a material for Puritanical leading articles, not to be exploited.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 124-125
- id: II.3.10
  kind: p
  original: Die industrielle Bourgeoisie war ihm dankbar für seine sklavische Verteidigung des französischen Schutzzollsystems, das er indes auf mehr nationale als nationalökonomischen Gründe hin aufnahm, die Gesamtbourgeoisie für seine gehässigen Denunziationen des Kommunismus und Sozialismus.
  en: The industrial bourgeoisie was thankful to it for its servile defense of the French tariff system, which, however, the paper had taken up, more out of patriotic than economic reasons the whole bourgeois class was thankful to it for its vicious denunciations of Communism and Socialism For the rest, the party of the "National" was purely republican, i.e. it demanded a republican instead of a monarchic form of bourgeois government; above all, it demanded for the bourgeoisie the lion's share of the government.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.3.11
  kind: p
  original: Im übrigen war die Partei des "National" rein republikanisch, d.h. sie verlangte eine republikanische statt einer monarchischen Form der Bourgeoisherrschaft und vor allem ihren Löwenanteil an dieser Herrschaft.
  en: ''
  joined_to: II.3.10
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '125'
- id: II.3.12
  kind: p
  original: Über die Bedingungen dieser Umwandlung war sie sich durchaus nicht klar.
  en: As to how this transformation was to be accomplished, the party was far from being clear.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: II.3.13
  kind: p
  original: Was ihr dagegen sonnenklar war und auf den Reformbanketten in der letzten Zeit Louis-Philippes öffentlich erklärt wurde, war ihre Unpopularität bei den demokratischen Kleinbürgern und insbesondere bei dem revolutionären Proletariat.
  en: What, however, was clear as day to it and was openly declared at the reform banquets during the last days of Louis Philippe's reign, was its unpopularity with the democratic middle class, especially with the revolutionary proletariat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: II.3.14
  kind: p
  original: Diese reinen Republikaner, wie reine Republikaner denn sind, standen auch schon auf dem Sprunge, sich zunächst mit einer Regentschaft der Herzogin von Orléans zu begnügen, als die Februarrevolution ausbrach und ihren bekanntesten Vertretern einen Platz in der provisorischen Regierung anwies.
  en: These pure republicans, as pure republicans go, were at first on the very point of contenting themselves with the regency of the Duchess of Orleans, when the February revolution broke out, and when it gave their best known representatives a place in the provisional government.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: II.3.15
  kind: p
  original: Sie besaßen natürlich von vorn herein das Vertrauen der Bourgeoisie und die Majorität der konstituierenden Versammlung.
  en: Of course, they enjoyed from the start the confidence of the bourgeoisie and of the majority of the Constitutional National Assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: II.3.16
  kind: p
  original: Aus der Exekutivkommision, welche die Nationalversammlung bei ihrem Zusammentritt bildete, wurde sofort die sozialistischen Elemente der provisorischen Regierung ausgeschlossen, und die Partei des "National" benutzte den Ausbruch der Juni-Insurrektion, um auch die Exekutivkommission abzudanken und damit ihre nächsten Rivalen, die kleinbürgerlichen oder demokratischen Republikaner (Ledru-Rollin usw.) loszuwerden.
  en: The Socialist elements of the Provisional Government were promptly excluded from the Executive Committee which the Assembly had elected upon its convening, and the party of the "National" subsequently utilized the outbreak of the June insurrection to dismiss this Executive Committee also, and thus rid itself of its nearest rivals--the small traders' class or democratic republicans (Ledru-Rollin, etc.).
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: II.3.17
  kind: p
  original: Cavaignac, der General der bourgeois-republikanischen Partei, der die Junischlacht kommandierte, trat an die Stelle der Exekutivkommission mit einer Art diktatorischer Gewalt.
  en: Cavaignac, the General of the bourgeois republican party, who command at the battle of June, stepped into the place of the Executive Committee with a sort of dictatorial power.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: II.3.18
  kind: p
  original: Marrast, ehemaliger Redakteur en chef des "National", wurde der perpetuierliche Präsident der konstituierenden Nationalversammlung, und die Ministerien, wie sämtliche übrigen bedeutenden Posten, fielen den reinen Republikanern anheim.
  en: Marrast, former editor-in-chief of the "National", became permanent President of the Constitutional National Assembly, and the Secretaryship of State, together with all the other important posts, devolved upon the pure republicans.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: II.4.1
  kind: p
  original: Die republikanische Bourgeoisfraktion, die sich seit lange als legitime Erbin der Julimonarchie betrachtet hatte, fand sich so in ihrem Ideal übertroffen, aber sie gelangte zur Herrschaft, nicht, wie sie unter Louis-Philippe geträumt hatte, durch eine liberale Revolte der Bourgeoisie gegen den Thron, sondern durch eine niederkartätschte Emeute des Proletariats gegen das Kapital.
  en: The republican bourgeois party, which since long had looked upon itself as the legitimate heir of the July monarchy, thus found itself surpassed in its own ideal; but it cam to power, not as it had dreamed under Louis Philippe, through a liberal revolt of the bourgeoisie against the throne, but through a grape-shot-and-canistered mutiny of the proletariat against Capital.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: II.4.2
  kind: p
  original: Was sie als das revolutionärste Ereignis sich vorgestellt hatte, trug sich in Wirklichkeit zu als das kontrerevolutionärste.
  en: That which it imagined to be the most revolutionary, came about as the most counter-revolutionary event.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: II.4.3
  kind: p
  original: Die Frucht fiel ihr in den Schoß, aber sie fiel vom Baum der Erkenntnis, nicht vom Baum des Lebens.
  en: The fruit fell into its lap, but it fell from the Tree of Knowledge, not from the Tree of life.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '125'
- id: II.5.1
  kind: p
  original: Die ausschließliche Herrschaft der Bourgeois-Republikaner währte nur vom 24. Juni bis zum 10. Dezember 1848.
  en: The exclusive power of the bourgeois republic lasted only from June 24 to the 10th of December, 1848.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: II.5.2
  kind: p
  original: Sie resümiert sich in der Abfassung einer republikanischen Konstitution und im Belagerungszustand von Paris.
  en: It is summed up in the framing of a republican constitution and in the state of siege of Paris.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: II.6.1
  kind: p
  original: Die neue Konstitution war im Grunde nur die republikanisierte Ausgabe der konstitutionellen Charte von 1830.
  en: The new Constitution was in substance only a republicanized edition of the constitutional charter of 1830.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: II.6.2
  kind: p
  original: Der enge Wahlzensus der Julimonarchie, der selbst einen großen Teil der Bourgeoisie von der politischen Herrschaft ausschloß, war unvereinbar mit der Existenz der bürgerlichen Republik.
  en: The limited suffrage of the July monarchy, which excluded even a large portion of the bourgeoisie from political power, was irreconcilable with the existence of the bourgeois republic.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: II.6.3
  kind: p
  original: Die Februarrevolution hatte sofort an der Stelle dieses Zensus das direkte allgemeine Wahlrecht proklamiert.
  en: The February revolution had forthwith proclaimed direct and universal suffrage in place of the old law.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: II.6.4
  kind: p
  original: Die Bourgeois-Republikaner konnten dieses Ereignis nicht ungeschehen machen.
  en: The bourgeois republic could not annul this act.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: II.6.5
  kind: p
  original: Sie mußten sich damit begnügen, die beschränkende Bestimmung eines sechsmonatlichen Domizils am Wahlorte hinzuzufügen.
  en: They had to content themselves with tacking to it the limitation a six months' residence.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: II.6.6
  kind: p
  original: Die alte Organisation der Verwaltung, des Gemeindewesens, der Rechtspflege, der Armee usw. blieb unversehrt bestehen, oder wo die Konstitution sie änderte, betraf die Änderung das Inhaltsregister, nicht den Inhalt, den Namen, nicht die Sache.
  en: The old organization of the administrative law, of municipal government, of court procedures of the army, etc., remained untouched, or, where the constitution did change them, the change affected their index, not their subject; their name, not their substance.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: II.7.1
  kind: p
  original: Der unvermeidliche Generalstab der Freiheiten von 1848, persönliche Freiheit, Preß-, Rede-, Assoziations-, Versammlungs-, Lehr- und Religionsfreiheit usw. erhielt eine konstitutionelle Uniform, die sie unverwundbar machte.
  en: The inevitable "General Staff" of the "freedoms" of 1848--personal freedom, freedom of the press, of speech, of association and of assemblage, freedom of instruction, of religion, etc.--received a constitutional uniform that rendered them invulnerable.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: II.7.2
  kind: p
  original: Jede dieser Freiheiten wird nämlich als das unbedingte Recht des französischen Citoyen proklamiert, aber mit der beständigen Randglosse, daß sie schrankenlos sei, soweit sie nicht durch die "gleichen Rechte anderer und die öffentliche Sicherheit" beschränkt werde, oder durch "Gesetze", die eben diese Harmonie der individuellen Freiheiten untereinander und mit der öffentlichen Sicherheit vermitteln sollen.
  en: 'Each of these freedoms is proclaimed the absolute right of the French citizen, but always with the gloss that it is unlimited in so far only as it be not curtailed by the "equal rights of others," and by the "public safety," or by the "laws," which are intended to effect this harmony. For instance:'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.7.3
  kind: p
  original: 'Z.B.: "Die Bürger haben das Recht, sich zu assoziieren, sich friedlich und unbewaffnet zu versammeln, zu petitionieren und ihre Meinungen durch die Presse oder wie sonst immer auszudrücken.'
  en: '"Citizens have the right of association, of peaceful and unarmed assemblage, of petitioning, and of expressing their opinions through the press or otherwise.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: II.7.4
  kind: p
  original: Der Genuß dieser Rechte hat keine andre Schranke als die gleichen Rechte andrer und die öffentliche Sicherheit."(Kap. II der französischen Konstitution, § 8.)
  en: The enjoyment of these rights has no limitation other than the equal rights of others and the public safety." (Chap. II. of the French Constitution, Section 8.)
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: II.7.5
  kind: p
  original: '- "Der Unterricht ist frei.'
  en: '"Education is free.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: II.7.6
  kind: p
  original: Die Freiheit des Unterrichts soll genossen werden unter den vom Gesetze fixierten Bedingungen und unter der Oberaufsicht des Staats." (A.a.O., § 9.)
  en: The freedom of education shall be enjoyed under the conditions provided by law, and under the supervision of the State." (Section 9.)
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: II.7.7
  kind: p
  original: '- "Die Wohnung jedes Bürgers ist unverletzlich außer in den vom Gesetz vorgeschriebenen Formen." (Kap. II, § 3.)'
  en: '"The domicile of the citizen is inviolable, except under the forms prescribed by law." (Chap. I., Section 3), etc., etc.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.7.8
  kind: p
  original: Usw. usw. - Die Konstitution weist daher beständig auf zukünftige organische Gesetze hin, die jene Randglossen ausführen und den Genuß dieser unbeschränkten Freiheiten so regulieren sollen, daß sie werde untereinander noch mit der öffentlichen Sicherheit anstoßen.
  en: The Constitution, it will be noticed, constantly alludes to future organic laws, that are to carry out the glosses, and are intended to regulate the enjoyment of these unabridged freedoms, to the end that they collide neither with one another nor with the public safety.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: II.7.9
  kind: p
  original: Und später sind diese organischen Gesetze von den Ordnungsfreunden ins Lebens gerufen und alle jene Freiheiten so reguliert worden, daß die Bourgeoisie in deren Genuß an den gleichen Rechten der andern Klassen keinen Anstoß findet.
  en: Later on, the organic laws are called into existence by the "Friends of Order," and all the above named freedoms are so regulated that, in their enjoyment, the bourgeoisie encounter no opposition from the like rights of the other classes.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '126'
- id: II.7.10
  kind: p
  original: Wo sie "den andern" diese Freiheiten ganz untersagt oder ihren Genuß unter Bedingungen erlaubt, die ebenso viele Polizeifallstricke sind, geschah dies immer nur im Interesse der "öffentlichen Sicherheit", d.h. der Sicherheit der Bourgeoisie, wie die Konstitution vorschreibt.
  en: Wherever the bourgeoisie wholly interdicted these rights to "others," or allowed them their enjoyment under conditions that were but so many police snares, it was always done only in the interest of the "public safety," i. e., of the bourgeoisie, as required by the Constitution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 126-127
- id: II.7.11
  kind: p
  original: Beide Seiten berufen sich daher in der Folge mit vollem Recht auf die Konstitution, sowohl die Ordnungsfreunde, die alle jene Freiheiten aufhoben, wie die Demokraten, die sie alle herausverlangten.
  en: 'Hence it comes that both sides-the "Friends of Order," who abolished all those freedoms, as, well as the democrats, who had demanded them all--appeal with full right to the Constitution: Each paragraph of the Constitution contains its own antithesis, its own Upper and Lower House-freedom as a generalization, the abolition of freedom as a specification.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.7.12
  kind: p
  original: Jeder Paragraph der Konstitution enthält nämlich seine eigene Antithese, sein eignes Über- und Unterhaus in sich, nämlich in der allgemeinen Phrase die Freiheit, in der Randglosse die Aufhebung der Freiheit.
  en: ''
  joined_to: II.7.11
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '127'
- id: II.7.13
  kind: p
  original: Solange also der Name der Freiheit respektiert und nur die wirkliche Ausführung derselben verhindert wurde, auf gesetzlichem Wege versteht sich, blieb das konstitutionelle Dasein der Freiheit unversehrt, unangetastet, mochte ihr gemeines Dasein noch so sehr totgeschlagen sein.
  en: Accordingly, so long as the name of freedom was respected, and only its real enforcement was prevented in a legal way, of course the constitutional existence of freedom remained uninjured, untouched, however completely its common existence might be extinguished.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: II.8.1
  kind: p
  original: Diese auf so sinnige Weise unverletzlich gemachte Konstitution war indes wie Achilles an einem Punkte verwundbar, nicht an der Ferse, aber am Kopfe oder vielmehr an den zwei Köpfen, worin sie sich verlief - gesetzgebende Versammlung einerseits, Präsident andererseits.
  en: 'This Constitution, so ingeniously made invulnerable, was, however, like Achilles, vulnerable at one point: not in its heel, but in its head, or rather, in the two heads into which it ran out-the Legislative Assembly, on the one hand, and the President on the other.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: II.8.2
  kind: p
  original: Man durchfliege die Konstitution, und man wird finden, daß nur die Paragraphen, worin das Verhältnis des Präsidenten zur gesetzgebenden Versammlung bestimmt wird, absolut, positiv, widerspruchslos, unverdrehbar sind.
  en: Run through the Constitution and it will be found that only those paragraphs wherein the relation of the President to the Legislative Assembly is defined, are absolute, positive, uncontradictory, undistortable.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: II.8.3
  kind: p
  original: Hier galt es nämlich für die Bourgeois-Republikaner, sich selbst sicherzustellen. §§ 45 - 70 der Konstitution sind so abgefaßt, daß die Nationalversammlung den Präsidenten konstitutionell, der Präsident die Nationalversammlung nur inkonstitutionell beseitigen kann, nur indem er die Konstitution selbst beseitigt.
  en: Here the bourgeois republicans were concerned in securing their own position. Articles 45-70 of the Constitution are so framed that the National Assembly can constitutionally remove the President, but the President can set aside the National Assembly only unconstitutionally, he can set it aside only by setting aside the Constitution itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.8.4
  kind: p
  original: Hier fordert sie also ihre gewaltsame Vernichtung heraus.
  en: Accordingly, by these provisions, the National Assembly challenges its own violent destruction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: II.8.5
  kind: p
  original: Sie heiligte nicht nur wie die Charte von 1830 die Teilung der Gewalten, sie erweiterte sie bis zum unerträglichen Widerspruch.
  en: It not only consecrates, like the character of 1830, the division of powers, but it extends this feature to an unbearably contradictory extreme.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: II.8.6
  kind: p
  original: Das Spiel der konstitutionellen Gewalten, wie Guizot den parlamentarischen Krakeel zwischen gesetzgebender und vollziehender Gewalt nannte, spielt in der Konstitution von 1848 beständig va banque.
  en: The "play of constitutional powers," as Guizot styled the clapper-clawings between the legislative and the executive powers, plays permanent "vabanque" in the Constitution of 1848.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
- id: II.8.7
  kind: p
  original: Auf der einen Seite 750 durch allgemeines Stimmrecht gewählte und wieder wählbare Volksrepräsentanten, die eine unkontrollierbare, unauflösbare, unteilbare Nationalversammlung bilden, eine Nationalversammlung, welche gesetzgeberische Allmacht genießt, über Krieg, Frieden und Handelsverträge in letzter Instanz entscheidet, allein das Recht der Amnestie besitzt und durch ihre Permanenz unaufhörlich den Vordergrund der Bühne behauptet.
  en: On the one side, 750 representatives of the people, elected and qualified for re-election by universal suffrage, who constitute an uncontrollable, indissoluble, indivisible National Assembly, a National Assembly that enjoys legislative omnipotence, that decides in the last instance over war, peace and commercial treaties, that alone has the power to grant amnesties, and that, through its perpetuity, continually maintains the foreground on the stage; on the other, a President, clad with all the attributes of royalty, with the right to appoint and remove his ministers independently from the national assembly, holding in his hands all the means of executive power, the dispenser of all posts, and thereby the arbiter of at least one and a half million existences in France, so many being dependent upon the 500,000 civil employees and upon the officers of all grades.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '127'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.8.8
  kind: p
  original: Andrerseits der Präsident, mit allen Attributen der königlichen Macht, mit der Befugnis, seine Minister unabhängig von der Nationalversammlung ein- und abzusetzen, mit allen Mitteln der exekutiven Gewalt in seinen Händen, alle Stellen vergebend und d.h. in Frankreich wenigsten 1 ½ Millionen Existenzen entscheidend, denn so viel hängen an den 500.000 Beamten und an den Offizieren aller Grade.
  en: ''
  joined_to: II.8.7
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: 127-128
- id: II.8.9
  kind: p
  original: Er hat die ganze bewaffnete Macht hinter sich.
  en: He has the whole armed power behind him.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: II.8.10
  kind: p
  original: Er genießt das Privilegium, einzelne Verbrecher zu begnadigen, Nationalgarden zu suspendieren, die von den Bürgern selbst erwählten General-, Kantonal- und Gemeinderäte im Einverständnis mit dem Staatsrat abzusetzen.
  en: He enjoys the privilege of granting pardons to individual criminals; suspending the National Guards; of removing with the consent of the Council of State the general, cantonal and municipal Councilmen, elected by the citizens themselves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: II.8.11
  kind: p
  original: Initiative und Leitung aller Verträge mit dem Ausland sind ihm vorbehalten.
  en: The initiative and direction of all negotiations with foreign countries are reserved to him.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: II.8.12
  kind: p
  original: 'Während die Versammlung beständig auf den Brettern spielt und dem kritisch gemeinen Tageslicht ausgesetzt ist, führt er ein verborgenes Leben in den elyseeischen Gefilden, und zwar mit dem Artikel 45 der Konstitution vor Augen und im Herzen, der ihm täglich zuruft: "Frère, il faut mourir!" <"Bruder, es heißt sterben!"> Deine Macht hört auf am zweiten Sonntag des schönen Monats Mai im vierten Jahr deiner Wahl!'
  en: While the Assembly itself is constantly acting upon the stage, and is exposed to the critically vulgar light of day, he leads a hidden life in the Elysian fields, only with Article 45 of the Constitution before his eyes and in his heart daily calling out to him, "Frere, il faut mourir!" Your power expires on the second Sunday of the beautiful month of May, in the fourth year after your election!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
  en_note: 'De Leon''s note [1]: Brother, you must die!'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.8.13
  kind: p
  original: Dann ist die Herrlichkeit am Ende, das Stück spielt nicht zweimal, und wenn du Schulden hast, siehe beizeiten zu, daß du sie mit den dir von der Konstitution ausgeworfenen 600.000 Franken abzahlst, ziehst du nicht etwa vor, am zweiten Montag des schönen Monats Mai nach Clichy zu wandern!
  en: The glory is then at an end; the play is not performed twice; and, if you have any debts, see to it betimes that you pay them off with the 600,000 francs that the Constitution has set aside for you, unless, perchance, you should prefer traveling to Clichy on the second Monday of the beautiful month of May.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
  en_note: 'De Leon''s note [2]: The debtors'' prison.'
- id: II.8.14
  kind: p
  original: '- Wenn die Konstitution so dem Präsidenten die faktische Macht beilegt, sucht sie der Nationalversammlung die moralische Macht zu sichern.'
  en: While the Constitution thus clothes the President with actual power, it seeks to secure the moral power to the National Assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: II.8.15
  kind: p
  original: Abgesehen davon, daß es unmöglich ist, durch Gesetzesparagraphen eine moralische Macht zu schaffen, hebt die Konstitution sich hierin wieder selbst auf, indem sie den Präsidenten von allen Franzosen durch direktes Stimmrecht wählen läßt.
  en: Apart from the circumstance that it is impossible to create a moral power through legislative paragraphs, the Constitution again neutralizes itself in that it causes the President to be chosen by all the Frenchmen through direct suffrage.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: II.8.16
  kind: p
  original: Während die Stimmen Frankreichs sich auf die 750 Mitglieder der Nationalversammlung zersplittern, konzentrieren sie sich dagegen hier auf ein Individuum.
  en: While the votes of France are splintered to pieces upon the 750 members of the National Assembly they are here, on the contrary, concentrated upon one individual.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: II.8.17
  kind: p
  original: Während jeder einzelne Volksrepräsentant nur diese oder jene Partei, diese oder jene Stadt, diesen oder jenen Brückenkopf oder auch nur die Notwendigkeit vertritt, einen beliebigen Siebenhundertfünfzigsten zu wählen, bei dem man sich weder die Sache noch den Mann so genau ansieht, ist er der Erwählte der Nation, und der Akt seiner Wahl ist der große Trumpf, den das souveräne Volk alle vier Jahre einmal ausspielt.
  en: While each separate Representative represents only this or that party, this or that city, this or that dunghill, or possibly only the necessity of electing some one Seven-hundred-and-fiftieth or other, with whom neither the issue nor the man is closely considered, that one, the President, on the contrary, is the elect of the nation, and the act of his election is the trump card, that, the sovereign people plays out once every four years.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: II.8.18
  kind: p
  original: Die erwählte Nationalversammlung steht in einem metaphysischen, aber der erwählte Präsident in einem persönlichen Verhältnis zur Nation.
  en: The elected National Assembly stands in a metaphysical, but the elected President in a personal, relation to the nation.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: II.8.19
  kind: p
  original: Die Nationalversammlung stellt wohl in ihren einzelnen Repräsentanten die mannigfaltigen Seiten des Nationalgeistes dar, aber in dem Präsidenten inkarniert er sich.
  en: True enough, the National Assembly presents in its several Representatives the various sides of the national spirit, but, in the President, this spirit is incarnated.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: II.8.20
  kind: p
  original: Er besitzt ihr gegenüber eine Art von göttlichem Recht, er ist von Volkes Gnaden.
  en: As against the National Assembly, the President possesses a sort of divine right, he is by the grace of the people.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: II.9.1
  kind: p
  original: Thetis, die Meergöttin, hatte dem Achilles prophezeit, daß er in der Blüte der Jugend sterben werde.
  en: Thetis, the sea-goddess, had prophesied to Achilles that he would die in the bloom of youth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '128'
- id: II.9.2
  kind: p
  original: Der Konstitution, die ihren faulen Fleck hat, wie Achilles, hatte auch ihre Ahnung, wie Achilles, daß sie frühen Todes abgehen müsse.
  en: The Constitution, which had its weak spot, like Achilles, had also, like Achilles, the presentiment that it would depart by premature death.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 128-129
- id: II.9.3
  kind: p
  original: Es genügte den konstituierenden reinen Republikanern, einen Blick aus dem Wolkenhimmel ihrer idealen Republik auf die profane Welt zu werfen, um zu erkennen, wie der Übermut der Royalisten, der Bonapartisten, der Demokraten, der Kommunisten und ihr eigner Mißkredit täglich stiegen, in demselben Maße, als sie sich der Vollendung ihres großen gesetzgeberischen Kunstwerks näherten, ohne daß Thetis deshalb das Meer zu verlassen und ihnen das Geheimnis mitzuteilen brauchte.
  en: It was enough for the pure republicans, engaged at the work of framing a constitution, to cast a glance from the misty heights of their ideal republic down upon the profane world in order to realize how the arrogance of the royalists, of the Bonapartists, of the democrats, of the Communists, rose daily, together with their own discredit, and in the same measure as they approached the completion of their legislative work of art, without Thetis having for this purpose to leave the sea and impart the secret to them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: II.9.4
  kind: p
  original: Sie suchten das Verhängnis konstitutionell-pfiffig zu überlisten durch § 111 der Konstitution, wonach jeder Vorschlag zur Revision der Verfassung in drei sukzessiven Debatten, zwischen denen immer ein ganzer Monat zu liegen hat, von wenigsten ¾ der Stimmen votiert werden muß, vorausgesetzt noch, daß nicht weniger als 500 Mitglieder der Versammlung stimmen.
  en: They ought to outwit fate by means of constitutional artifice, through Section 111 of the Constitution, according to which every motion to revise the Constitution had to be discussed three successive times between each of which a full month was to elapse and required at least a three-fourths majority, with the additional proviso that not less than 500 members of the National Assembly voted.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: II.9.5
  kind: p
  original: Sie machten damit nur den ohnmächtigen Versuch, noch als parlamentarische Minorität, als welche sie sich schon prophetisch im Geiste erblickten, eine Macht auszuüben, die in diesem Augenblicke, wo sie über die parlamentarische Majorität verfügten und über alle Mittel der Regierungsgewalt, täglich mehr ihren schwachen Händen entschlüpfte.
  en: They thereby only made the impotent attempt, still to exercise as a parliamentary minority, to which in their mind's eye they prophetically saw themselves reduced, a power, that, at this very time, when they still disposed over the parliamentary majority and over all the machinery of government, was daily slipping from their weak hands.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: II.10.1
  kind: p
  original: Endlich vertraute die Konstitution, in einem melodramatischen Paragraphen, sich selbst "der Wachsamkeit und dem Patriotismus des ganzen französischen Volkes wie jedes einzelnen Franzosen" an, nachdem sie vorher schon in einem andern Paragraphen die "Wachsamen" und "Patriotischen" der zarten, hochnotpeinlichen Aufmerksamkeit des eigens von ihr erfundenen Hochgerichts, "haute cour" anvertraut hatte.
  en: Finally, the Constitution entrusts itself for safe keeping, in a melodramatic paragraph, "to the watchfulness and patriotism of the whole French people, and of each individual Frenchman," after having just before, in another paragraph entrusted the "watchful" and the "patriotic" themselves to the tender, inquisitorial attention of the High Court, instituted by itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: II.11.1
  kind: p
  original: Das war die Konstitution von 1848, die am 2. Dezember 1851 nicht von einem Kopfe umgeworfen wurde, sondern vor der Berührung mit einem bloßen Hute umfiel; allerdings war dieser Hut ein dreieckiger Napoleonshut.
  en: That was the Constitution of 1848, which on, the 2d of December, 1851, was not overthrown by one head, but tumbled down at the touch of a mere hat; though, true enough, that hat was a three-cornered Napoleon hat.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: II.12.1
  kind: p
  original: Während die Bourgeois-Republikaner in der Versammlung damit beschäftigt waren, diese Konstitution auszuspintisieren, zu diskutieren und zu votieren, hielt Cavaignac außerhalb der Versammlung den Belagerungszustand von Paris aufrecht.
  en: While the bourgeois' republicans were engaged in the Assembly with the work of splicing this Constitution, of discussing and voting, Cavaignac, on the outside, maintained the state of siege of Paris.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: II.12.2
  kind: p
  original: Der Belagerungszustand von Paris war der Geburtshelfer der Konstituante bei ihren republikanischen Schöpfungswehen.
  en: The state of siege of Paris was the midwife of the constitutional assembly, during its republican pains of travail.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: II.12.3
  kind: p
  original: Wenn die Konstitution später durch Bajonette aus der Welt geschafft wird, so darf man nicht vergessen, daß sie ebenfalls durch Bajonette, und zwar gegen das Volk gekehrte, schon im Mutterleib beschützt und durch Bajonette auf die Welt gesetzt werden mußte.
  en: When the Constitution is later on swept off the earth by the bayonet, it should not be forgotten that it was by the bayonet, likewise--and the bayonet turned against the people, at that--that it had to be protected in its mother's womb, and that by the bayonet it had to be planted on earth.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: II.12.4
  kind: p
  original: Die Vorfahren der "honetten Republikaner" hatten ihr Symbol, die Trikolore, die Tour durch Europa machen lassen.
  en: The ancestors of these "honest republicans" had caused their symbol, the tricolor, to make the tour of Europe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '129'
- id: II.12.5
  kind: p
  original: Sie ihrerseits machten auch eine Erfindung, die von selbst den Weg über den ganzen Kontinent fand, aber mit immer erneuter Liebe nach Frankreich zurückkehrte, bis sie jetzt in der Hälfte seiner Departements Bürgerrecht erworben hat - den Belagerungszustand.
  en: These, in their turn also made a discovery, which all of itself, found its way over the whole continent, but, with ever renewed love, came back to France, until, by this time, if had acquired the right of citizenship in one-half of her Departments--the state of siege.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 129-130
- id: II.12.6
  kind: p
  original: Treffliche Erfindung, periodisch angewandt in jeder nachfolgenden Krise im Laufe der französischen Revolution.
  en: A wondrous discovery this was, periodically applied at each succeeding crisis in the course of the French revolution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: II.12.7
  kind: p
  original: Aber Kaserne und Biwak, die man so der französischen Gesellschaft periodisch auf den Kopf legte, um ihr das Gehirn zusammenzupressen und sie zu stillen Manne zu machen; Säbel und Muskete, die man periodisch richten und verwalten, bevormunden und zensieren, Polizei üben und Nachtwächterdienst verrichten ließ; Schnurrbart und Kommißrock, die man periodisch als höchste Weisheit der Gesellschaft und als Rektor der Gesellschaft ausposaunte - mußten Kaserne und Biwak, Säbel und Muskete, Schnurrbart und Kommißrock nicht schließlich auf den Einfall kommen, lieber ein für allemal die Gesellschaft zu retten, indem sie ihr eigenes Regime als das oberste ausriefen und die bürgerliche Gesellschaft ganz von der Sorge befreiten, sich selbst zu regieren?
  en: But the barrack and the bivouac, thus periodically laid on the head of French society, to compress her brain and reduce her to quiet; the sabre and the musket, periodically made to perform the functions of judges and of administrators, of guardians and of censors, of police officers and of watchmen; the military moustache and the soldier's jacket, periodically heralded as the highest wisdom and guiding stars of society;--were not all of these, the barrack and the bivouac, the sabre and the musket, the moustache and the soldier's jacket bound, in the end, to hit upon the idea that they might as well save, society once for all, by proclaiming their own regime as supreme, and relieve bourgeois society wholly of the care of ruling itself?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: II.12.8
  kind: p
  original: Kaserne und Biwak, Säbel und Muskete, Schnurrbart und Kommißrock mußten um so mehr auf diesen Einfall kommen, als sie dann auch bessere bare Zahlung für ihr erhöhtes Verdienst erwarten konnten, während bei dem bloß periodischen Belagerungszustand und den vorübergehenden Gesellschaftsrettungen im Geheiß dieser oder jener Bourgeoisiefraktion wenig Solides abfiel außer einigen Toten und Verwundeten und einigen freundlichen Bürgergrimassen.
  en: The barrack and the bivouac, the sabre and the musket, the moustache and the soldier's jacket were all the more bound to hit upon this idea, seeing that they could then also expect better cash payment for their increased deserts, while at the merely periodic states of siege and the transitory savings of society at the behest of this or that bourgeois faction, very little solid matter fell to them except some dead and wounded, besides some friendly bourgeois grimaces.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: II.12.9
  kind: p
  original: Sollte das Militär nicht endlich auch einmal in seinem eigenen Interesse und für sein eignes Interesse Belagerungszustand spielen und zugleich die bürgerlichen Börsen belagern?
  en: Should not the military, finally, in and for its own interest, play the game of "state of siege," and simultaneously besiege the bourgeois exchanges?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: II.12.10
  kind: p
  original: Man vergesse übrigens nicht, im Vorbeigehn sei es bemerkt, daß Oberst Bernhard, derselbe Militärkommisions-Präsident, der unter Cavaignac 15.000 Insurgenten zur Deportation ohne Urteil verhalf, sich in diesem Augenblick wieder an der Spitze der in Paris tätigen Militärkommissionen bewegt.
  en: Moreover, it must not be forgotten, and be it observed in passing, that Col. Bernard, the same President of the Military Committee, who, under Cavaignac, helped to deport 15,000 insurgents without trial, moves at this period again at the head of the Military Committees now active in Paris.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: II.13.1
  kind: p
  original: Wenn die honetten, die reinen Republikaner, mit dem Belagerungszustand in Paris die Pflanzschule anlegte, worin die Prätorianer des 2. Dezember 1851 großwachsen sollten, verdienen sie dagegen das Lob, daß sie, statt wie unter Louis-Philippe das Nationalgefühl zu übertreiben, jetzt, wo sie über die nationale Macht geboten, vor dem Auslande kriechen und, statt Italien frei zu machen, es von Österreichern und Neapolitanern wiedererobern lassen.
  en: Although the honest, the pure republicans built with the state of siege the nursery in which the Praetorian guards of December 2, 1851, were to be reared, they, on the other hand, deserve praise in that, instead of exaggerating the feeling of patriotism, as under Louis Philippe, now; they themselves are in command of the national power, they crawl before foreign powers; instead of making Italy free, they allow her to be reconquered by Austrians and Neapolitans.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: II.13.2
  kind: p
  original: Louis Bonapartes Wahl zum Präsidenten am 10. Dezember 1848 machte der Diktatur Cavaignacs und der Konstituante ein Ende.
  en: The election of Louis Bonaparte for President on December 10, 1848, put an end to the dictatorship of Cavaignac and to the constitutional assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: II.14.1
  kind: p
  original: 'In § 44 der Konstitution heißt es: "Der Präsident der Französischen Republik darf nie seine Eigenschaft als französischer Bürger verloren haben."'
  en: In Article 44 of the Constitution it is said "The President of the French Republic must never have lost his status as a French citizen."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: II.14.2
  kind: p
  original: Der erste Präsident der Französischen Republik, L.-N. Bonaparte, hatte nicht allein seine Eigenschaft als französischer Bürger verloren, war nicht nur englischer Spezial-Konstabler gewesen, er war sogar ein naturalisierter Schweizer.
  en: The first President of the French Republic, L. N. Bonaparte, had not only lost his status as a French citizen, had not only been an English special constable, but was even a naturalized Swiss citizen.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '130'
- id: II.15.1
  kind: p
  original: Ich habe an einem andern Orte die Bedeutung der Wahl vom 10. Dezember entwickelt. (MEW Bd. 7, S. 44/45)
  en: In the previous chapter I have explained the meaning of the election of December 10. I shall not here return to it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: II.15.2
  kind: p
  original: Ich komme hier nicht darauf zurück.
  en: 'Suffice it here to say that it was a reaction of the farmers'' class, who had been expected to pay the costs of the February revolution, against the other classes of the nation: it was a reaction of the country against the city.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.15.3
  kind: p
  original: Es genügt hier zu bemerken, daß sie eine Reaktion der Bauern, die die Kosten der Februarrevolution hatten zahlen müssen, gegen die übrigen Klassen der Nation, eine Reaktion des Landes gegen die Stadt war.
  en: ''
  joined_to: II.15.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '131'
- id: II.15.4
  kind: p
  original: Sie fand großen Anklang in der Armee, der die Republikaner des "National" keinen Ruhm verschafft hatten, noch Zulage, unter der großen Bourgeoisie, die den Bonaparte als Brücke zur Monarchie, unter den Proletariern und Kleinbürgern, die ihn als Geißel für Cavaignac begrüßten.
  en: It met with great favor among the soldiers, to whom the republicans of the "National" had brought neither fame nor funds; among the great bourgeoisie, who hailed Bonaparte as a bridge to the monarchy; and among the proletarians and small traders, who hailed him as a scourge to Cavaignac.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: II.15.5
  kind: p
  original: Ich werde später Gelegenheit finden, auf das Verhältnis der Bauern zur französischen Revolution näher einzugehn.
  en: I shall later have occasion to enter closer into the relation of the farmers to the French revolution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: II.16.1
  kind: p
  original: Die Epoche vom 20. Dezember 1848 bis zur Auflösung der Konstituante im Mai 1849 umfaßt die Geschichte des Untergangs der Bourgeois-Republikaner.
  en: The epoch between December 20, 1848, and the dissolution of the constitutional assembly in May, 1849, embraces the history of the downfall of the bourgeois republicans.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: II.16.2
  kind: p
  original: Nachdem sie eine Republik für die Bourgeoisie gegründet, das revolutionäre Proletariat von dem Terrain vertrieben und das demokratische Kleinbürgertum einstweilen zum Schweigen gebracht haben, werden sie selbst von der Masse der Bourgeoisie beiseite geschoben, die diese Republik mit Recht als ihr Eigentum mit Beschlag belegt.
  en: After they had founded a republic for the bourgeoisie, had driven the revolutionary proletariat from the field and had meanwhile silenced the democratic middle class, they are themselves shoved aside by the mass of the bourgeoisie who justly appropriate this republic as their property.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: II.16.3
  kind: p
  original: Diese Bourgeoisiemasse war aber royalistisch.
  en: This bourgeois mass was Royalist, however.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: II.16.4
  kind: p
  original: Ein Teil derselben, die großen Grundeigentümer, hatte unter der Restauration geherrscht und war daher legitimistisch.
  en: A part thereof, the large landed proprietors, had ruled under the restoration, hence, was Legitimist; the other part, the aristocrats of finance and the large industrial capitalists, had ruled under the July monarchy, hence, was Orleanist.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.16.5
  kind: p
  original: Der andre, die Finanzaristokraten und großen Industriellen, hatte unter der Julimonarchie geherrscht und war daher orleanistisch.
  en: ''
  joined_to: II.16.4
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '131'
- id: II.16.6
  kind: p
  original: Die Großwürdenträger der Armee, der Universität, der Kirche, des Barreaus <Advokatenstandes>, der Akademie und der Presse verteilten sich auf beide Seiten, wenn auch in verschiedener Proportion.
  en: The high functionaries of the Army, of the University, of the Church, in the civil service, of the Academy and of the press, divided themselves on both sides, although in unequal parts.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: II.16.7
  kind: p
  original: Hier in der bürgerlichen Republik, die weder den Namen Bourbon noch den Namen Orléans trug, sondern den Namen Kapital, hatten sie die Staatsform gefunden, worin sie gemeinsam herrschen konnten.
  en: Here, in the bourgeois republic, that bore neither the name of Bourbon, nor of Orleans, but the name of Capital, they had found the form of government under which they could all rule in common.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: II.16.8
  kind: p
  original: Schon die Juni-Insurrektion hatte sie zur "Partei der Ordnung" vereinigt.
  en: Already the June insurrection had united them all into a "Party of Order."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: II.16.9
  kind: p
  original: Jetzt galt es zunächst, die Koterie der Bourgeois-Republikaner zu beseitigen, die noch die Sitze der Nationalversammlung innehielt.
  en: The next thing to do was to remove the bourgeois republicans who still held the seats in the National Assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: II.16.10
  kind: p
  original: Ebenso brutal, wie diese reinen Republikaner dem Volke gegenüber die physische Gewalt mißbraucht hatten, ebenso feig, kleinlaut, mutlos, gebrochen, kampfunfähig wichen sie jetzt zurück, wo es galt, der exekutiven Gewalt und den Royalisten gegenüber ihr Republikanertum und ihr gesetzgeberisches Recht zu behaupten.
  en: As brutally as these pure republicans had abused their own physical power against the people, so cowardly, low-spirited, disheartened, broken, powerless did they yield, now when the issue was the maintenance of their own republicanism and their own legislative rights against the Executive power and the royalists.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: II.16.11
  kind: p
  original: Ich habe hier nicht die schmähliche Geschichte ihrer Auflösung zu erzählen.
  en: I need not here narrate the shameful history of their dissolution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: II.16.12
  kind: p
  original: Es war ein Vergehen, kein Untergehen.
  en: It was not a downfall, it was extinction.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '131'
- id: II.16.13
  kind: p
  original: Ihre Geschichte hat für immer ausgespielt, und in der folgenden Periode figurieren sie, sei es innerhalb, sei es außerhalb der Versammlung, nur noch als Erinnerungen, Erinnerungen, die wieder lebendig zu werden scheinen, sobald es sich wieder um den bloßen Namen Republik handelt und sooft der revolutionäre Konflikt auf das niedrigste Niveau herabzusinken droht.
  en: Their history is at an end for all time. In the period that follows, they figure, whether within or without the Assembly, only as memories--memories that seem again to come to life so soon as the question is again only the word "Republic," and as often as the revolutionary conflict threatens to sink down to the lowest level.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 131-132
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: II.16.14
  kind: p
  original: Ich bemerke im Vorbeigehn, daß das Journal, welches der Partei ihren Namen gab, der "National", sich in der folgenden Periode zum Sozialismus bekehrte.
  en: In passing, I might observe that the journal which gave to this party its name, the "National," goes over to Socialism during the following period.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: II.17.1
  kind: p
  original: Ehe wir mit dieser Periode abschließen, müssen wir noch einen Rückblick auf die beiden Mächte werfen, von denen die eine die andere am 2. Dezember 1851 vernichtet, während sie vom 20. Dezember 1848 bis zum Abtritt der Konstituante in ehelichem Verhältnisse lebten.
  en: Before we close this period, we must look back upon the two powers, one of destroys the other on December 2, 1851, while, from December 20, 1848, down to the departure of the constitutional assembly, they live marital relations.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: II.17.2
  kind: p
  original: Wir meinen Louis Bonaparte einerseits und die Partei der koalisierten Royalisten, der Ordnung, der großen Bourgeoisie anderseits.
  en: We mean Louis Bonaparte, on the-one hand, on the other, the party of the allied royalists; of Order, and of the large bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: II.17.3
  kind: p
  original: Beim Antritt seiner Präsidentschaft bildete Bonaparte sofort ein Ministerium der Partei der Ordnung, an dessen Spitze er Odilon Barrot stellte, notabene den alten Führer der liberalsten Fraktion der parlamentarischen Bourgeoisie.
  en: At the inauguration of his presidency, Bonaparte forthwith framed a ministry out of the party of Order, at whose head he placed Odillon Barrot, be it noted, the old leader of the liberal wing of the parliamentary bourgeoisie.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: II.17.4
  kind: p
  original: Herr Barrot hatte endlich das Ministerium erjagt, dessen Gespenst ihn seit 1830 verfolgte, und noch mehr, die Präsidentschaft in diesem Ministerium; aber nicht, wie er sich unter Louis-Philippe eingebildet, als der avancierteste Chef der parlamentarischen Opposition, sondern mit der Aufgabe, ein Parlament totzumachen, und als Verbündeter mit allen seinen Erzfeinden, Jesuiten und Legitimisten.
  en: Mr. Barrot had finally hunted down a seat in the ministry, the spook of which had been pursuing him since 1830; and what is more, he had the chairmanship in this ministry, although not, as he had imagined under Louis Philippe, the promoted leader of the parliamentary opposition, but with the commission to kill a parliament, and, moreover, as an ally of all his arch enemies, the Jesuits and the Legitimists.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: II.17.5
  kind: p
  original: Er führte endlich die Braut heim, aber erst nachdem sie prostituiert war.
  en: Finally he leads the bride home, but only after she has been prostituted.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: II.17.6
  kind: p
  original: Bonaparte selbst eklipsierte sich scheinbar vollständig.
  en: As to Bonaparte, he seemed to eclipse himself completely.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: II.17.7
  kind: p
  original: Jene Partei handelte für ihn.
  en: The party of Order acted for him.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: II.18.1
  kind: p
  original: Gleich im ersten Ministerkonseil wurde die Expedition nach Rom beschlossen, die man hinter dem Rücken der Nationalversammlung auszuführen und wofür man ihr die Mittel unter falschem Vorwande zu entreißen übereinkam.
  en: Immediately at the first session of the ministry the expedition to Rome was decided upon, which it was there agreed, was to be carried out behind I the back of the National Assembly, and the funds for which, it was equally agreed, were to be wrung from the Assembly under false pretences.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: II.18.2
  kind: p
  original: So wurde begonnen mit einer Prellerei der Nationalversammlung und einer heimlichen Konspiration mit den absoluten Mächten des Auslandes gegen die revolutionäre Römische Republik.
  en: Thus the start was made with a swindle on the National Assembly, together with a secret conspiracy with the absolute foreign powers against the revolutionary Roman republic.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: II.18.3
  kind: p
  original: Bonaparte bereitete auf dieselbe Weise und durch dieselben Manöver seinen Coup vom 2. Dezember gegen die royalistische Legislative und ihre konstitutionelle Republik vor.
  en: In the same way, and with a similar maneuver, did Bonaparte prepare his stroke of December 2 against the royalist legislature and its constitutional republic.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: II.18.4
  kind: p
  original: Vergessen wir nicht, daß dieselbe Partei, die am 20. Dezember 1848 Bonapartes Ministerium, am 2. Dezember 1851 die Majorität der legislativen Nationalversammlung bildete.
  en: Let it not be forgotten that the same party, which, on December 20, 1848, constituted Bonaparte's ministry, constituted also, on December 2, 1851, the majority of the legislative National Assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: II.19.1
  kind: p
  original: Die Konstituante hatte im August beschlossen, sich erst aufzulösen, nachdem sie eine ganze Reihe organischer Gesetze, die die Konstituante ergänzen sollten, ausgearbeitet und promulgiert habe.
  en: In August the constitutive assembly decided not to dissolve until it had prepared and promulgated a whole series of organic laws, intended to supplement the Constitution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: II.19.2
  kind: p
  original: Die Ordnungspartei ließ ihr durch den Repräsentanten Rateau am 6. Januar 1849 vorschlagen, die organischen Gesetze laufen zu lassen und vielmehr ihre eigene Auflösung zu beschließen.
  en: The party of Order proposed to the assembly, through Representative Rateau, on January 6, 1849, to let the Organic laws go, and rather to order its own dissolution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '132'
- id: II.19.3
  kind: p
  original: Nicht nur das Ministerium, Herr Odilon Barrot an der Spitze, sämtliche royalistischen Mitglieder der Nationalversammlung herrschten ihr in diesem Augenblicke zu, ihre Auflösung sei notwendig zur Herstellung des Kredits, zur Konsolidierung der Ordnung, um dem unbestimmten Provisorium ein Ende zu machen und einen definitiven Zustand zu gründen, sie hindre die Produktivität der neuen Regierung und suche ihr Dasein bloß aus Ranküne zu fristen, das Land sei ihrer müde.
  en: Not the ministry alone, with Mr. Odillon Barrot at its head, but all the royalist members of the National Assembly were also at this time hectoring to it that its dissolution was necessary for the restoration of the public credit, for the consolidation of order, to put an end to the existing uncertain and provisional, and establish a definite state of things; they claimed that its continued existence hindered the effectiveness of the new Government, that it sought to prolong its life out of pure malice, and that the country was tired of it.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 132-133
- id: II.19.4
  kind: p
  original: Bonaparte merkte sich alle diese Invektiven gegen die gesetzgebende Gewalt, lernte sie auswendig und bewies den parlamentarischen Royalisten am 2. Dezember 1851, daß er von ihnen gelernt habe.
  en: Bonaparte took notice of all these invectives hurled at the legislative power, he learned them by heart, and, on December 21, 1851, he showed the parliamentary royalists that he had learned from them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: II.19.5
  kind: p
  original: Er wiederholte ihre eignen Stichworte gegen sie.
  en: He repeated their own slogans against themselves.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: II.20.1
  kind: p
  original: Das Ministerium Barrot und die Ordnungspartei gingen weiter.
  en: The Barrot ministry and the party of Order went further.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: II.20.2
  kind: p
  original: Sie riefen Petitionen an die Nationalversammlung in ganz Frankreich hervor, worin diese freundlichst gebeten wurde zu verschwinden.
  en: They called all over France for petitions to the National Assembly in which that body was politely requested to disappear.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: II.20.3
  kind: p
  original: So führten sie gegen die Nationalversammlung, den konstitutionell organisierten Ausdruck des Volkes, seine unorganischen Massen ins Feuer.
  en: Thus they led the people's unorganic masses to the fray against the National Assembly, i.e., the constitutionally organized expression of people itself.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: II.20.4
  kind: p
  original: Sie lehrten Bonaparte von den parlamentarischen Versammlungen an des Volk zu appellieren.
  en: They taught Bonaparte, to appeal from the parliamentary body to the people.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: II.20.5
  kind: p
  original: Endlich am 29. Januar 1849 war der Tag gekommen, an dem die Konstituante über ihre eigene Auflösung beschließen sollte.
  en: Finally, on January 29, 1849, the day arrived when the constitutional assembly was to decide about its own dissolution.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: II.20.6
  kind: p
  original: Die Nationalversammlung fand ihren Sitzungsgebäude militärisch besetzt; Changarnier, der General der Ordnungspartei, in dessen Händen der Oberbefehl über Nationalgarde und Linientruppen vereinigt war, hielt große Truppenschau in Paris, als wenn eine Schlacht bevorstehe, und die koalisierten Royalisten erklärten der Konstituante drohend, daß man Gewalt anwenden werde, wenn sie nicht willig sei.
  en: On that day the body found its building occupied by the military; Changarnier, the General of the party of Order, in whose hands was joined the supreme command of both the National Guards and the regulars, held that day a great military review, as though a battle were imminent; and the coalized royalists declared threateningly to the constitutional assembly that force would be applied if it did not act willingly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: II.20.7
  kind: p
  original: Sie war willig und marktete sich nur noch eine ganz kurze Lebensfrist aus.
  en: It was willing, and chaffered only for a very short respite.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: II.20.8
  kind: p
  original: Was war der 29. Januar anders als der coup d'état <Staatsstreich> vom 2. Dezember 1851, nur mit Bonaparte von den Royalisten gegen die republikanische Nationalversammlung ausgeführt?
  en: What else was the 29th of January, 1849, than the "coup d'etat" of December 2, 1851, only executed by the royalists with Napoleon's aid against the republican National Assembly?
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: II.20.9
  kind: p
  original: Die Herren bemerkten nicht oder wollten nicht merken, daß Bonaparte den 29. Januar 1849 benutzte, um einen Teil der Truppen vor den Tuilerien an sich vorbeidefilieren zu lassen und gerade dies erste öffentliche Aufgebot der Militärmacht gegen die parlamentarische Macht begierig aufgriff, um den Caligula anzudeuten.
  en: These gentlemen did not notice, or did not want to notice, that Napoleon utilized the 29th of January, 1849, to cause a part of the troops to file before him in front of the Tuileries, and that he seized with avidity this very first open exercise of the military against the parliamentary power in order to hint at Caligula.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: II.20.10
  kind: p
  original: Sie sahen allerdings nur ihren Changarnier.
  en: The allied royalists saw only their own Changarnier.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: II.21.1
  kind: p
  original: Ein Motiv, das die Partei der Ordnung noch insbesondere bewog, die Lebensdauer die Konstituante gewaltsam abzukürzen, waren die organischen, die Konstitution ergänzenden Gesetze, wie das Unterrichtsgesetz, Kultusgesetz usw. Den koalisierten Royalisten lag alles daran, diese Gesetze selbst zu machen und nicht von den mißtrauisch gewordenen Republikanern machen zu lassen.
  en: Another reason that particularly moved the party of Order forcibly to shorten the term of the constitutional assembly were the organic laws, the laws that were to supplement the Constitution, as, for instance, the laws on education, on religion, etc. The allied royalists had every interest in framing these laws themselves, and not allowing them to be framed by the already suspicious republicans.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: II.21.2
  kind: p
  original: Unter diesen organischen Gesetzen befand sich indes auch ein Gesetz über die Verantwortlichkeit des Präsidenten der Republik.
  en: Among these organic laws, there was, however, one on the responsibility of the President of the republic.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '133'
- id: II.21.3
  kind: p
  original: 1851 war die legislative Versammlung eben mit der Abfassung eines solchen Gesetzes beschäftigt, als Bonaparte diesem Coup durch den Coup vom 2. Dezember zuvorkam.
  en: In 1851 the Legislature was just engaged in framing such a law when Bonaparte forestalled that political stroke by his own of December 2. What all would not the coalized royalists have given in their winter parliamentary campaign of 1851, had they but found this "Responsibility law" ready made, and framed at that, by the suspicious, the vicious republican Assembly!
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 133-134
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.21.4
  kind: p
  original: Was hätten die koalisierten Royalisten in ihrem parlamentarischen Winterfeldzug von 1851 darum gegeben, wenn sie das Verantwortlichkeitsgesetz fertig vorgefunden, und zwar verfaßt von einer mißtrauischen, gehässigen, republikanischen Versammlung!
  en: ''
  joined_to: II.21.3
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '134'
- id: II.22.1
  kind: p
  original: Nachdem am 29. Januar 1849 die Konstituante ihre letzte Waffe selbst zerbrochen hatte, hetzten das Ministerium Barrot und die Ordnungsfreunde sie zu Tode, ließen nichts ungeschehn, was sie demütigen konnte, und trotzten ihrer an sich selbst verzweifelnden Schwäche Gesetze ab, die sie den letzten Rest von Achtung bei dem Publikum kosteten.
  en: After, on January 29, 1849, the constitutive assembly had itself broken its last weapon, the Barrot ministry and the "Friends of Order" harassed it to death, left nothing undone to humiliate it, and wrung from its weakness, despairing of itself, laws that cost it the last vestige of respect with the public.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: II.22.2
  kind: p
  original: Bonaparte, mit seiner fixen napoleonischen Idee beschäftigt, war keck genug, diese Herabwürdigung der parlamentarischen Macht öffentlich zu exploitieren.
  en: 'Bonaparte, occupied with his own fixed Napoleonic idea, was audacious enough openly to exploit this degradation of the parliamentary power: When the National Assembly, on May 8, 1849, passed a vote of censure upon the Ministry on account of the occupation of Civita-Vecchia by Oudinot, and ordered that the Roman expedition be brought back to its alleged purpose, Bonaparte published that same evening in the "Moniteur" a letter to Oudinot, in which he congratulated him on his heroic feats, and already, in contrast with the quill-pushing parliamentarians, posed as the generous protector of the Army.'
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
  align: '2:1'
  review: true
  review_reason: 2 de sentence(s) matched to 1 en sentence(s)
- id: II.22.3
  kind: p
  original: Als nämlich die Nationalversammlung am 8. Mai 1849 dem Ministerium ein Tadelsvotum wegen der Besetzung Civitaveccias durch Oudinot erteilte und die römische Expedition zu ihrem angeblichen Zweck zurückzuführen befahl, publizierte Bonaparte denselben Abend im "Moniteur" einen Brief an Oudinot, worin er ihm zu seinen Heldentaten Glück wünscht und sich schon im Gegensatz zu den federfuchsenden Parlamentären als den großmütigen Protekteur der Armee gebärdet.
  en: ''
  joined_to: II.22.2
  modern: ''
  modern_status: joined
  notes: ''
  mew_page: '134'
- id: II.22.4
  kind: p
  original: Die Royalisten lächelten dazu.
  en: The royalists smiled at this.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: II.22.5
  kind: p
  original: Sie hielten ihn einfach für ihren dupe <Gimpel>.
  en: They took him simply for their dupe.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: II.22.6
  kind: p
  original: Endlich als Marrast, der Präsident der Konstituante, einen Augenblick die Sicherheit der Nationalversammlung gefährdet glaubte und auf die Konstitution gestützt einen Oberst mit seinem Regimente requirierte, weigerte sich der Oberst, bezog sich auf die Disziplin und verwies Marrast an Changarnier, der ihn höhnisch abwies mit der Bemerkung, er liebe nicht die bayonettes intelligentes <denkenden Bajonette>.
  en: Finally, as Marrast, the President of the constitutional assembly, believed on a certain occasion the safety of the body to be in danger, and, resting on the Constitution, made a requisition upon a Colonel, together with his regiment, the Colonel refused obedience, took refuge behind the "discipline," and referred Marrast to Changarnier, who scornfully sent him off with the remark that he did not like "bayonettes intelligentes."
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
  en_note: 'De Leon''s note [1]: Intelligent bayonets'
- id: II.22.7
  kind: p
  original: November 1851, als die koalisierten Royalisten den entscheidenden Kampf mit Napoleon beginnen wollten, suchten sie in ihrer berüchtigten Quästorenbill das Prinzip der direkten Requisition der Truppen durch den Präsidenten der Nationalversammlung durchzusetzen.
  en: In November, 1851, as the coalized royalists wanted to begin the decisive struggle with Bonaparte, they sought, by means of their notorious "Questors Bill," to enforce the principle of the right of the President of the National Assembly to issue direct requisitions for troops.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: II.22.8
  kind: p
  original: Einer ihrer Generale, Le Flô, hatte den Gesetzesvorschlag unterzeichnet.
  en: One of their Generals, Leflo, supported the motion.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: II.22.9
  kind: p
  original: Vergebens stimmte Changarnier für den Vorschlag und huldigte Thiers der umsichtigen Weisheit der ehemaligen Konstituante.
  en: In vain did Changarnier vote for it, or did Thiers render homage to the cautious wisdom of the late constitutional assembly.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: II.22.10
  kind: p
  original: Der Kriegsminister St-Arnaud antwortete ihm, wie dem Marrast Changarnier geantwortet hatte, und - unter dem Beifall der Montagne!
  en: The Minister of War, St. Arnaud, answered him as Changarnier had answered Marrast--and he did so amidst the plaudits of the Mountain.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: II.23.1
  kind: p
  original: So hatte die Partei der Ordnung selbst, als sie noch nicht Nationalversammlung, als sie nur noch Ministerium war, das parlamentarische Regime gebrandmarkt.
  en: Thus did the party of Order itself, when as yet it was not the National Assembly, when as yet it was only a Ministry, brand the parliamentary regime.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '134'
- id: II.23.2
  kind: p
