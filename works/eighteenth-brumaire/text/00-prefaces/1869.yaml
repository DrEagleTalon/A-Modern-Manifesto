  notes: ''
  en_note: No public-domain English of this preface is used; De Leon's 1898 translation leaves it out.
- id: P1869.1.1
  kind: p
  original: Mein zu früh verstorbener Freund Joseph Weydemeyer beabsichtigte vom 1. Januar 1852 an eine politische Wochenschrift in New York herauszugeben.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  footnotes:
  - P1869.N1
  mew_page: '358'
- id: P1869.1.2
  kind: p
  original: Er forderte mich auf, für dieselbe die Geschichte des coup d'état <Staatsstreichs> zu liefern.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: P1869.1.3
  kind: p
  original: 'Ich schrieb ihm daher wöchentlich bis Mitte Februar Artikel unter dem Titel: "Der achtzehnte Brumaire des Louis Bonaparte".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: P1869.1.4
  kind: p
  original: Unterdes war Weydemeyers ursprünglicher Plan gescheitert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: P1869.1.5
  kind: p
  original: 'Dagegen veröffentlichte er im Frühling 1852 eine Monatsschrift: "Die Revolution", deren erstes Heft aus meinem "Achtzehnten Brumaire" besteht.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: P1869.1.6
  kind: p
  original: Einige hundert Exemplare davon fanden damals den Weg nach Deutschland, ohne jedoch in den eigentlichen Buchhandel zu kommen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: P1869.1.7
  kind: p
  original: Ein äußerst radikal tuender deutscher Buchhändler, dem ich den Vertrieb anbot, antwortete mit wahrhaft sittlichem Entsetzen über solch "zeitwidrige Zumutung".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: P1869.2.1
  kind: p
  original: Man ersieht aus diesen Angaben, daß die vorliegende Schrift unter dem unmittelbaren Druck der Ereignisse entstand und ihr historisches Material nicht über den Monat Februar (1852) hinausreicht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: P1869.2.2
  kind: p
  original: Ihre jetzige Wiederveröffentlichung ist teils buchhändlerischer Nachfrage, teils dem Andringen meiner Freunde in Deutschland geschuldet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: P1869.3.1
  kind: p
  original: 'Von den Schriften, welche ungefähr gleichzeitig mit der meinigen denselben Gegenstand behandelten, sind nur zwei bemerkenswert: Victor Hugos "Napoléon le petit" und Proudhons "Coup d''état".'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: P1869.4.1
  kind: p
  original: Victor Hugo beschränkt sich auf bittere und geistreiche Invektive gegen den verantwortlichen Herausgeber des Staatsstreichs.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: P1869.4.2
  kind: p
  original: Das Ereignis selbst erscheint bei ihm wie ein Blitz aus heitrer Luft.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '358'
- id: P1869.4.3
  kind: p
  original: Er sieht darin nur die Gewalttat eines einzelnen Individuums.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 358-359
- id: P1869.4.4
  kind: p
  original: Er merkt nicht, daß er dies Individuum groß statt klein macht, indem er ihm eine persönliche Gewalt der Initiative zuschreibt, wie sie beispiellos in der Weltgeschichte dastehen würde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: P1869.4.5
  kind: p
  original: Proudhon seinerseits sucht den Staatsstreich als Resultat einer vorhergegangenen geschichtlichen Entwicklung darzustellen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: P1869.4.6
  kind: p
  original: Unter der Hand verwandelt sich ihm jedoch die geschichtliche Konstruktion des Staatsstreichs in eine geschichtliche Apologie des Staatsstreichshelden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: P1869.4.7
  kind: p
  original: Er verfällt so in den Fehler unserer sogenannten objektiven Geschichtsschreiber.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: P1869.4.8
  kind: p
  original: Ich weise dagegen nach, wie der Klassenkampf in Frankreich Umstände und Verhältnisse schuf, welche einer mittelmäßigen und grotesken Personage das Spiel der Heldenrolle ermöglichen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: P1869.5.1
  kind: p
  original: Eine Umarbeitung der vorliegenden Schrift hätte sie ihrer eigentümlichen Färbung beraubt.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: P1869.5.2
  kind: p
  original: Ich habe mich daher auf bloße Korrektur von Druckfehlern beschränkt und auf Wegstreichung jetzt nicht mehr verständlicher Anspielungen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: P1869.6.1
  kind: p
  original: 'Der Schlußsatz meiner Schrift: "Aber wenn der Kaisermantel endlich auf die Schultern Louis Bonapartes fällt, wird das eherne Standbild Napoleons von der Höhe der Vendôme-Säule herabstürzen", hat sich bereits erfüllt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: P1869.7.1
  kind: p
  original: Oberst Charras eröffnete den Angriff auf den Napoleon-Kultus in seinem Werke über den Feldzug von 1815.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: P1869.7.2
  kind: p
  original: Seitdem, und namentlich in den letzten Jahren, hat die französische Literatur mit den Waffen der Geschichtsforschung, der Kritik, der Satire und des Witzes der Napoleon-Legende den Garaus gemacht.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: P1869.7.3
  kind: p
  original: Außerhalb Frankreichs ward dieser gewaltsame Bruch mit dem traditionellen Volksglauben, diese ungeheure geistige Revolution, wenig beachtet und noch weniger begriffen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: P1869.8.1
  kind: p
  original: Schließlich hoffe ich, daß meine Schrift zur Beseitigung der jetzt namentlich in Deutschland landläufigen Schulphrase vom sogenannten Cäsarismus beitragen wird.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: P1869.8.2
  kind: p
  original: Bei dieser oberflächlichen geschichtlichen Analogie vergißt man die Hauptsache, daß nämlich im alten Rom der Klassenkampf nur innerhalb einer privilegierten Minorität spielte, zwischen den freien Reichen und den freien Armen, während die große produktive Masse der Bevölkerung, die Sklaven, das bloß passive Piedestal für jene Kämpfer bildete.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: P1869.8.3
  kind: p
  original: 'Man vergißt Sismondis bedeutenden Ausspruch: Das römische Proletariat lebte auf Kosten der Gesellschaft, während die moderne Gesellschaft auf Kosten des Proletariats lebt.'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '359'
- id: P1869.8.4
  kind: p
  original: Bei so gänzlicher Verschiedenheit zwischen den materiellen, ökonomischen Bedingungen des antiken und des modernen Klassenkampfs können auch seine politischen Ausgeburten nicht mehr miteinander gemein haben als der Erzbischof von Canterbury mit dem Hohenpriester Samuel.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 359-360
- id: P1869.9.1
  kind: signature
  original: London, 23. Juni 1869
  en: ''
  modern: ''
