verses:
- id: P1880.0.1
  kind: heading
  original: '[Vorbemerkung zur französischen Ausgabe (1880)]'
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  en_note: Title as given in MEW. No public-domain English of this preface is used.
- id: P1880.1.1
  kind: p
  original: Die Seiten, die den Inhalt der vorliegenden Broschüre umfassen, wurden zuerst in drei Artikeln in der "Revue socialiste" veröffentlicht als Übersetzung aus Friedrich Engels' neuester Arbeit "Die Umwälzung der Wissenschaft".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T1
    editions: 1880 (Revue socialiste, signed by Lafargue)
    reading: 'In der von Lafargue unterzeichneten Veröffentlichung folgt, der Zusatz: "Sie sind vom Verfasser durchgesehen, der im dritten Teil verschiedene Zusätze gemacht hat, um dem französischen Leser die dialektische Entwicklung der ökonomischen Kräfte der kapitalistischen Produktion verständlich zu machen."'
    base_text: … "Die Umwälzung der Wissenschaft". ‸  …
  mew_page: '181'
- id: P1880.2.1
  kind: p
  original: Friedrich Engels, einer der hervorragendsten Vertreter des modernen Sozialismus, wurde 1844 durch seine "Umrisse zu einer Kritik der Nationalökonomie" bekannt, die zuerst in den von Marx und Rüge in Paris herausgegebenen "Deutsch-Französischen Jahrbüchern" erschienen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: P1880.2.2
  kind: p
  original: In den "Umrissen" sind bereits einige allgemeine Prinzipien des wissenschaftlichen Sozialismus formuliert.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: P1880.2.3
  kind: p
  original: In Manchester, wo Engels dann lebte, schrieb er (in deutscher Sprache) "Die Lage der arbeitenden Klasse in England" (1845), ein bedeutendes Werk, das Marx im "Kapital" gebührend würdigte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: P1880.2.4
  kind: p
  original: Während seines ersten Aufenthalts in England - wie auch später in Brüssel - war er Mitarbeiter an dem "Northern Star", dem offiziellen Organ der sozialistischen Bewegung, und an der "New Moral World" von Robert Owen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: P1880.3.1
  kind: p
  original: Während seines Aufenthalts in Brüssel gründeten er und Marx den kommunistischen Deutschen Arbeiterverein, der mit den flämischen und wallonischen Arbeiterklubs in Verbindung stand; und beide gaben gemeinsam mit Bornstedt die "Deutsche-Brüsseler-Zeitung" heraus.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '181'
- id: P1880.3.2
  kind: p
  original: Auf Einladung des deutschen Komitees des Bundes der Gerechten (in London) wurden sie Mitglieder dieses Bundes, den Karl Schapper gegründet hatte, nachdem er als Teilnehmer an der Verschwörung Blanquis 1839 aus Frankreich geflohen war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 181-182
- id: P1880.3.3
  kind: p
  original: Nachdem die in Geheimbünden üblichen Formen beseitigt worden waren, wurde der Bund in den internationalen Bund der Kommunisten umgebildet.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: P1880.3.4
  kind: p
  original: Nichtsdestoweniger mußte der Bund unter den gegebenen Umständen vor den Regierungen geheimgehalten werden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: P1880.3.5
  kind: p
  original: 1847 wurden Marx und Engels auf dem internationalen Kongreß des Bundes in London beauftragt, das "Manifest der Kommunistischen Partei" abzufassen, das unmittelbar vor der Februarrevolution veröffentlicht und in fast alle europäischen Sprachen übersetzt wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  variants:
  - ref: T2
    editions: 1880 (Revue socialiste, signed by Lafargue)
    reading: 'In der von Lafargue unterzeichneten Veröffentlichung folgt der Zusatz: "''Das Kommunistische Manifest'' ist eines der wertvollsten Dokumente des modernen Sozialismus. Es bleibt auch heute noch eine der stärksten und klarsten Darlegungen von der Entwicklung der bürgerlichen Gesellschaft und der Herausbildung des Proletariats, das der kapitalistischen Gesellschaft ein Ende machen muß; hier, wie auch in ''Misère de la philosophie'' von Marx, ein Jahr zuvor veröffentlicht, findet man zum erstenmal die Theorie des Klassenkampfs klar formuliert."'
    base_text: … europäischen Sprachen übersetzt wurde. ‸  …
  mew_page: '182'
- id: P1880.3.6
  kind: p
  original: Im gleichen Jahr wirkten sie mit an der Gründung der Brüsseler Demokratischen Gesellschaft, einer öffentlichen und internationalen Vereinigung, in der Vertreter der bürgerlichen Radikalen und der sozialistischen Arbeiter zusammentrafen.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: P1880.4.1
  kind: p
  original: Nach der Februarrevolution wurde Engels einer der Redakteure der "Neuen Rheinischen Zeitung", die 1848 von Marx in Köln gegründet und im Mai 1849 durch einen preußischen coup d'état unterdrückt wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: P1880.4.2
  kind: p
  original: Nachdem Engels an dem Elberfelder Aufstand teilgenommen hatte, machte er die Badener Kampagne gegen die Preußen (Juni und Juli 1849) als Adjutant Willichs mit, der damals Oberst eines Bataillons Freischärler war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: P1880.5.1
  kind: p
  original: In London war er 1850 Mitarbeiter der "Neuen Rheinischen Zeitung. Politisch-ökonomische Revue", die von Marx herausgegeben und in Hamburg gedruckt wurde.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: P1880.5.2
  kind: p
  original: In ihr veröffentlichte Engels zum erstenmal die Arbeit "Der deutsche Bauernkrieg", die 19 Jahre später in Leipzig als Broschüre erschien und drei Ausgaben erlebte.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: P1880.6.1
  kind: p
  original: Nach dem Wiederaufkommen der sozialistischen Bewegung in Deutschland schrieb Engels die bedeutendsten der im "Volksstaat" und im "Vorwärts" veröffentlichten Artikel, von denen die meisten als Flugschriften nachgedruckt worden sind, wie "Soziales aus Rußland", "Preußischer Schnaps im deutschen Reichstag", "Zur Wohnungsfrage", "Die Bakunisten an der Arbeit" etc.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: P1880.7.1
  kind: p
  original: Nachdem Engels 1870 von Manchester nach London gezogen war, wurde er Mitglied des Generalrats der Internationale, von dem er mit der Korrespondenz für Spanien, Portugal und Italien beauftragt war.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '182'
- id: P1880.8.1
  kind: p
  original: Die jüngste Artikelreihe, die er ironisch "Herrn Eugen Dührings Umwälzung der Wissenschaft" betitelte (in Erwiderung auf die angeblich neuen Theorien von Herrn Eugen Dühring über die Wissenschaft im allgemeinen und den Sozialismus im besonderen), sandte er an den "Vorwärts".
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: P1880.8.2
  kind: p
  original: Diese Reihe wurde zu einem Band vereinigt und hatte bei den deutschen Sozialisten großen Erfolg.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
- id: P1880.8.3
  kind: p
  original: Wir bringen in der vorliegenden Broschüre die treffendsten Auszüge aus dem theoretischen Teil dieses Buchs, die gewissermaßen eine Einführung in den wissenschaftlichen Sozialismus bilden.
  en: ''
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '185'
