- id: III.N5.2.1
  kind: note
  original: Was die Verheerung von Produktionsmitteln und Produkten in den Krisen betrifft, so wurde auf dem 2. Kongreß deutscher Industrieller, Berlin, 21. Februar 1878, der Gesamtverlust allein der deutschen Eisenindustrie im letzten Krach auf 455 Millionen Mark berechnet.
  en: As an instance of the squandering of means of production and of products during a crisis, the total loss in the German iron industry alone, in the crisis of 1873-78, was given at the second German Industrial Congress (Berlin, February 21, 1878) as £22,750,000.
  modern: ''
  modern_status: empty
  notes: ''
