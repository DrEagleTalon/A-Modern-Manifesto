- id: III.N3.1.1
  kind: note
  original: '"Lage der arbeitenden Klasse in England", S. 109'
  en: '"The Condition of the Working-Class in England" (Sonnenschein & Co.), p. 84.'
  modern: ''
  modern_status: empty
  notes: ''
- id: III.N4.1.1
  kind: note
  original: Ich sage, muß.
  en: I say "have to."
  modern: ''
  modern_status: empty
  notes: ''
- id: III.N4.1.2
  kind: note
  original: Denn nur in dem Falle, daß die Produktions- oder Verkehrsmittel der Leitung durch Aktiengesellschaften wirklich entwachsen sind, daß also die Verstaatlichung ökonomisch unabweisbar geworden, nur in diesem Falle bedeutet sie, auch wenn der heutige Staat sie vollzieht, einen ökonomischen Fortschritt, die Erreichung einer neuen Vorstufe zur Besitzergreifung aller Produktivkräfte durch die Gesellschaft selbst.
  en: For only when the means of production and distribution have actually outgrown the form of management by joint-stock companies, and when, therefore, the taking them over by the State has become economically inevitable, only then--even if it is the State of to-day that effects this--is there an economic advance, the attainment of another step preliminary to the taking over of all productive forces by society itself.
  modern: ''
  modern_status: empty
  notes: ''
- id: III.N4.1.3
  kind: note
  original: Es ist aber neuerdings, seit Bismarck sich aufs Verstaatlichen geworfen, ein gewisser falscher Sozialismus aufgetreten und hie und da sogar in einige Wohldienerei ausgeartet, der jede Verstaatlichung, selbst die Bismarcksche, ohne weiteres für sozialistisch erklärt.
  en: But of late, since Bismarck went in for State-ownership of industrial establishments, a kind of spurious Socialism has arisen, degenerating, now and again, into something of flunkeyism, that without more ado declares all State-ownership, even of the Bismarckian sort, to be socialistic.
  modern: ''
  modern_status: empty
  notes: ''
- id: III.N4.1.4
  kind: note
  original: Allerdings, wäre die Verstaatlichung des Tabaks sozialistisch, so zählten Napoleon und Metternich mit unter den Gründern des Sozialismus.
  en: Certainly, if the taking over by the State of the tobacco industry is socialistic, then Napoleon and Metternich must be numbered among the founders of Socialism.
  modern: ''
  modern_status: empty
  notes: ''
- id: III.N4.1.5
  kind: note
  original: Wenn der belgische Staat aus ganz alltäglichen politischen und finanziellen Gründen seine Haupteisenbahnen selbst baute, wenn Bismarck ohne jede ökonomische Notwendigkeit die Hauptbahnlinien Preußens verstaatlichte, einfach, um sie für den Kriegsfall besser einrichten und ausnützen zu können, um die Eisenbahnbeamten zu Regierungsstimmvieh zu erziehn und hauptsächlich, um sich eine neue, von Parlamentsbeschlüssen unabhängige Einkommensquelle zu verschaffen - so waren das keineswegs sozialistische Schritte, direkt oder indirekt, bewußt oder unbewußt.
  en: If the Belgian State, for quite ordinary political and financial reasons, itself constructed its chief railway lines; if Bismarck, not under any economic compulsion, took over for the State the chief Prussian lines, simply to be the better able to have them in hand in case of war, to bring up the railway employees as voting cattle for the Government, and especially to create for himself a new source of income independent of parliamentary votes--this was, in no sense, a socialistic measure, directly or indirectly, consciously or unconsciously.
  modern: ''
  modern_status: empty
  notes: ''
- id: III.N4.1.6
  kind: note
  original: Sonst wären auch die königliche Seehandlung, die königliche Porzellanmanufaktur und sogar der Kompanieschneider beim Militär sozialistische Einrichtungen oder gar die unter Friedrich Wilhelm III. in den dreißiger Jahren alles Ernstes von einem Schlaumeier vorgeschlagene Verstaatlichung der - Bordelle.
  en: Otherwise, the Royal Maritime Company, the Royal porcelain manufacture, and even the regimental tailor of the army would also be socialistic institutions, or even, as was seriously proposed by a sly dog in Frederick William III.'s reign, the taking over by the State of the brothels.
  modern: ''
  modern_status: empty
  notes: ''
- id: III.N5.1.1
  kind: note
  original: Ein paar Zahlen mögen eine annähernde Vorstellung geben von der enormen Expansionskraft der modernen Produktionsmittel, selbst unter dem kapitalistischen Druck.
  en: A few figures may serve to give an approximate idea of the enormous expansive force of the modern means of production, even under capitalist pressure.
  modern: ''
  modern_status: empty
  notes: ''
- id: III.N5.1.2
  kind: note
  original: 'Nach der Berechnung von Giffen betrug der Gesamtreichtum von Großbritannien und Irland in runder Zahl: 1814 2200 Millionen Pfd. St. = 44 Milliarden Mark.'
  en: According to Mr. Giffen, the total wealth of Great Britain and Ireland amounted, in round numbers, in 1814 to £2,200,000,000.
  modern: ''
  modern_status: empty
  notes: ''
