- id: I.26.1
  kind: p
  original: Die Anschauungsweise der Utopisten hat die sozialistischen Vorstellungen des 19. Jahrhunderts lange beherrscht und beherrscht sie zum Teil noch.
  en: The Utopians' mode of thought has for a long time governed the socialist ideas of the nineteenth century, and still governs some of them.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '200'
- id: I.26.2
  kind: p
  original: Ihr huldigten noch bis vor ganz kurzer Zeit alle französischen und englischen Sozialisten, ihr gehört auch der frühere deutsche Kommunismus mit Einschluß Weitlings an.
  en: Until very recently all French and English Socialists did homage to it. The earlier German Communism, including that of Weitling, was of the same school.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '200'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: I.26.3
  kind: p
  original: Der Sozialismus ist ihnen allen der Ausdruck der absoluten Wahrheit, Vernunft und Gerechtigkeit und braucht nur entdeckt zu werden, um durch eigne Kraft die Welt zu erobern; da die absolute Wahrheit unabhängig ist von Zeit, Raum und menschlicher geschichtlicher Entwicklung, so ist es bloßer Zufall, wann und wo sie entdeckt wird.
  en: To all these Socialism is the expression of absolute truth, reason, and justice, and has only to be discovered to conquer all the world by virtue of its own power. And as absolute truth is independent of time, space, and of the historical development of man, it is a mere accident when and where it is discovered.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '200'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: I.26.4
  kind: p
  original: Dabei ist dann die absolute Wahrheit, Vernunft und Gerechtigkeit wieder bei jedem Schulstifter verschieden; und da bei jedem die besondre Art der absoluten Wahrheit, Vernunft und Gerechtigkeit wieder bedingt ist durch seinen subjektiven Verstand, seine Lebensbedingungen, sein Maß von Kenntnissen und Denkschulung, so ist in diesem Konflikt absoluter Wahrheiten keine andre Lösung möglich, als daß sie sich aneinander abschleißen.
  en: With all this, absolute truth, reason, and justice are different with the founder of each different school. And as each one's special kind of absolute truth, reason, and justice is again conditioned by his subjective understanding, his conditions of existence, the measure of his knowledge and his intellectual training, there is no other ending possible in this conflict of absolute truths than that they shall be mutually exclusive one of the other.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '200'
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: I.26.5
  kind: p
  original: Dabei konnte dann nichts andres herauskommen als eine Art von eklektischem Durchschnitts-Sozialismus, wie er in der Tat bis heute in den Köpfen der meisten sozialistischen Arbeiter in Frankreich und England herrscht, eine äußerst mannigfaltige Schattierungen zulassende Mischung aus den weniger Anstoß erregenden kritischen Auslassungen, ökonomischen Lehrsätzen und gesellschaftlichen Zukunftsvorstellungen der verschiednen Sektenstifter, eine Mischung, die sich um so leichter bewerkstelligt, je mehr den einzelnen Bestandteilen im Strom der Debatte die scharfen Ecken der Bestimmtheit abgeschliffen sind wie runden Kieseln im Bach.
  en: Hence, from this nothing could come but a kind of eclectic, average Socialism, which, as a matter of fact, has up to the present time dominated the minds of most of the socialist workers in France and England. Hence, a mish-mash allowing of the most manifold shades of opinion; a mish-mash of such critical statements, economic theories, pictures of future society by the founders of different sects, as excite a minimum of opposition; a mish-mash which is the more easily brewed the more the definite sharp edges of the individual constituents are rubbed down in the stream of debate, like rounded pebbles in a brook.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: 200-201
  align: '1:2'
  review: true
  review_reason: 1 de sentence(s) matched to 2 en sentence(s)
- id: I.26.6
  kind: p
  original: Um aus dem Sozialismus eine Wissenschaft zu machen, mußte er erst auf einen realen Boden gestellt werden.
  en: To make a science of Socialism, it had first to be placed upon a real basis.
  modern: ''
  modern_status: empty
  notes: ''
  mew_page: '201'
- id: I.N1.1.1
  kind: note
  original: 'Folgendes ist die Stelle über die Französische Revolution: "Der Gedanke, der Begriff des Rechts machte sich mit einem Male geltend, und dagegen konnte das alte Gerüst des Unrechts keinen Widerstand leisten.'
  en: 'This is the passage on the French Revolution: "Thought, the concept of law, all at once made itself felt, and against this the old scaffolding of wrong could make no stand.'
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N1.1.2
  kind: note
  original: Im Gedanken des Rechts ist also jetzt eine Verfassung errichtet worden, und auf diesem Grunde sollte nunmehr alles basiert sein.
  en: In this conception of law, therefore, a constitution has now been established, and henceforth everything must be based upon this.
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N1.1.3
  kind: note
  original: Solange die Sonne am Firmament steht und die Planeten um sie kreisen, war das noch nicht gesehen worden, daß der Mensch sich auf den Kopf, das ist auf den Gedanken stellt und die Wirklichkeit nach diesem erbaut.
  en: Since the sun had been in the firmament, and the planets circled round him, the sight had never been seen of man standing upon his head--i.e., on the Idea--and building reality after this image.
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N1.1.4
  kind: note
  original: Anaxagoras hatte zuerst gesagt, daß der Nûs, die Vernunft, die Welt regiert; nun aber erst ist der Mensch dazugekommen, zu erkennen, daß der Gedanke die geistige Wirklichkeit regieren solle.
  en: Anaxagoras first said that the Nous, reason, rules the world; but now, for the first time, had man come to recognize that the Idea must rule the mental reality.
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N1.1.5
  kind: note
  original: Es war dieses somit ein herrlicher Sonnenaufgang.
  en: And this was a magnificent sunrise.
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N1.1.6
  kind: note
  original: Alle denkenden Wesen haben diese Epoche mitgefeiert.
  en: All thinking Beings have participated in celebrating this holy day.
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N1.1.7
  kind: note
  original: Eine erhabene Rührung hat in jener Zeit geherrscht, ein Enthusiasmus des Geistes hat die Welt durchschauert, als sei es zur Versöhnung des Göttlichen mit der Welt nun erst gekommen."
  en: A sublime emotion swayed men at that time, an enthusiasm of reason pervaded the world, as if now had come the reconciliation of the Divine Principle with the world."
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N1.1.8
  kind: note
  original: (Hegel, "Philosophie der Geschichte", 1840, S. 535.)
  en: '[Hegel: "Philosophy of History," 1840, p. 535.]'
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N1.1.9
  kind: note
  original: '- Sollte es nicht hohe Zeit sein, gegen solche gemeingefährliche Umsturzlehren des weiland Professor Hegel das Sozialistengesetz in Bewegung zu setzen?'
  en: Is it not high time to set the anti-Socialist law in action against such teachings, subversive and to the common danger, by the late Professor Hegel?
  modern: ''
  modern_status: empty
  notes: ''
- id: I.N2.1.1
  kind: note
  original: 'Aus: "The Revolution in Mind and Practice", einer an alle "roten Republikaner, Kommunisten und Sozialisten Europas" gerichteten und der französischen provisorischen Regierung 1848, aber auch "der Königin Viktoria und ihren verantwortlichen Ratgebern" zugesandten Denkschrift.'
  en: From "The Revolution in Mind and Practice," p. 21, a memorial addressed to all the "red Republicans, Communists and Socialists of Europe," and sent to the provisional government of France, 1848, and also "to Queen Victoria and her responsible advisers."
  modern: ''
